track: E
title: Machine learning engineering
clusters:
  - id: E0
    title: First steps in programming
    # Programming starts once arithmetic is in place, so its examples can lean on it.
    requires: [M0]
    nodes:
      - What a program is
      - Values, types and variables
      - Expressions
      - Strings
      - Booleans and conditionals
      - Loops
      - Functions
      - Lists and tuples
      - Dictionaries and sets
      - Reading errors and debugging
  - id: E1
    title: Python proper
    # Follows functions and notation, so that comprehensions can be taught as set-builder notation.
    requires: [E0, M2]
    nodes:
      - Comprehensions and iterators
      - Modules and imports
      - Classes and objects
      - Special methods and operator overloading
      - Exceptions
      - Files and data formats
      - Recursion
      - Complexity and big-O
      - Testing with pytest
      - Type hints
      - Generators and context managers
  - id: E2
    title: Tools of the trade
    requires: [E1]
    nodes:
      - Command line
      - Linux processes, files and permissions
      - Git and GitHub
      - Environments and packages
      - Reading documentation and source
      - Reproducibility and seeds
      - Debuggers
  - id: E3
    title: Data structures and algorithms
    # Follows vectors, so that its examples can store, search and sort the lists of numbers met there.
    requires: [E1, M4]
    nodes:
      - Arrays and linked lists
      - Stacks and queues
      - Hash tables
      - Trees and heaps
      - Graphs and traversal
      - Sorting
      - Binary search
      - Divide and conquer
      - Dynamic programming
      - Amortised analysis
      - Topological sort
      - Shortest paths and beam search
  - id: E4
    title: Computer systems
    requires: [E3, E2]
    nodes:
      - Bits, integers and IEEE 754 floating point
      - Stack, heap and pointers
      - C for Python programmers
      - CPU pipelines and caches
      - Locality and cache-aware code
      - SIMD and vectorisation
      - Processes, threads and scheduling
      - Locks, races and the GIL
      - Asynchronous I/O
      - Virtual memory
      - Networking with TCP, HTTP and RPC
  - id: E5
    title: NumPy and numerical computing
    requires: [E1, M4]
    nodes:
      - Arrays, dtype and shape
      - Indexing and slicing
      - Broadcasting
      - Vectorisation
      - Axis operations and reductions
      - Reshaping, views and copies
      - Strides and memory layout
      - Linear algebra routines
      - einsum
      - Random number generation
      - Log-sum-exp and stable formulations
      - Numerical error analysis in practice
  - id: E6
    title: Autograd from scratch
    requires: [E5, M12, E3]
    nodes:
      - Scalar computational graph
      - Reverse mode on scalars
      - Topological ordering of the graph
      - Tensor-valued autograd
      - Broadcasting in the backward pass
      - Gradient checking
      - Modules, parameters and optimisers
      - Higher-order gradients
      - Memory planning and in-place operations
      - Training an MLP on your own engine
  - id: E7
    title: PyTorch
    requires: [E6, M13]
    nodes:
      - Tensors and devices
      - Autograd in PyTorch
      - nn.Module
      - Optimisers and schedulers
      - Dataset and DataLoader
      - Anatomy of a training loop
      - Checkpointing
      - Hooks
      - Debugging shapes and NaNs
      - Experiment tracking
      - Configuration management
      - Custom autograd functions and extensions
      - PyTorch internals
  - id: E8
    title: Models from scratch
    requires: [E7, L7]
    nodes:
      - MLP from scratch
      - CNN from scratch
      - BPE tokeniser from scratch
      - Attention from scratch
      - GPT from scratch
      - Training GPT on a small corpus
      - Sampling from your GPT
      - A PPO agent from scratch
      - A diffusion model from scratch
  - id: E9
    title: GPU architecture and kernels
    requires: [E4, E7]
    nodes:
      - CPU versus GPU and the memory hierarchy
      - The CUDA execution model
      - Kernels, threads, blocks and warps
      - Global, shared and register memory
      - Memory coalescing
      - Writing kernels
      - Reductions and parallel patterns
      - A tiled matmul kernel
      - Convolution and attention kernels
      - Occupancy and kernel profiling
      - Vendor libraries and when to hand-write
      - Kernel languages
  - id: E10
    title: Compilers and runtimes for ML
    requires: [E9]
    nodes:
      - Graph capture and intermediate representations
      - Operator fusion
      - torch.compile, tracing and scripting
      - Just-in-time versus ahead-of-time compilation
      - Memory planning in runtimes
      - Autotuning and scheduling
      - ONNX and inference runtimes
      - Writing custom operators
  - id: E11
    title: Performance engineering
    requires: [E9, L7]
    nodes:
      - Profiling CPU and GPU
      - Floating-point formats fp16 and bf16
      - Mixed precision and loss scaling
      - Gradient accumulation and clipping
      - Activation checkpointing and memory
      - Efficient attention implementations
      - Data-loading bottlenecks
      - Benchmarking methodology
      - Roofline analysis and estimating throughput
      - Performance regression testing
  - id: E12
    title: Distributed systems fundamentals
    requires: [E4]
    nodes:
      - Failure models
      - Consistency and consensus
      - RPC and serialisation
      - Queues and backpressure
      - Object stores and file systems
      - Containers and orchestration
      - Cluster schedulers
      - Logs, metrics and traces
  - id: E13
    title: Distributed training
    requires: [E11, E12]
    nodes:
      - Data parallelism
      - DistributedDataParallel
      - Collective communication and its cost model
      - Parameter sharding
      - Tensor and pipeline parallelism
      - Large-batch training and learning-rate scaling
      - Distributed checkpointing
      - Fault tolerance and elasticity
      - Interconnects and topology
      - Scaling-efficiency analysis
      - Determinism and debugging at scale
  - id: E14
    title: Data pipelines
    requires: [E7, E12]
    nodes:
      - Dataset formats and streaming
      - Random-access formats and memory mapping
      - Tokenisation at scale
      - Shuffling and sharding
      - Data quality and deduplication
      - Large-scale processing frameworks
      - Synthetic data pipelines
      - Dataset versioning
      - Licensing and privacy
  - id: E15
    title: Inference and serving
    requires: [E11, L7]
    nodes:
      - Static and dynamic batching
      - KV cache in practice
      - Quantisation
      - Pruning and sparsity
      - Distillation in practice
      - Speculative decoding
      - Continuous batching and paged attention
      - Serving architectures
      - Streaming responses
      - Latency budgets and tail latency
      - Load testing
      - Cost modelling and capacity planning
  - id: E16
    title: Research engineering practice
    requires: [E7, E2]
    nodes:
      - Experiment design and management
      - Navigating large codebases
      - Code review
      - Testing ML code
      - Debugging training at scale
      - Infrastructure for evaluations
      - Reliability and incident habits
      - Writing design documents
