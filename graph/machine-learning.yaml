track: L
title: Machine learning
clusters:
  - id: L1
    title: Foundations of learning
    requires: [M14, M4, E1]
    nodes:
      - Learning from data
      - Features and labels
      - Loss functions
      - Decision theory and Bayes-optimal predictors
      - Train, validation and test splits
      - Overfitting and underfitting
      - Bias-variance decomposition
      - Regularisation
      - Cross-validation
      - Metrics for classification and regression
  - id: L2
    title: Linear models
    requires: [L1, M7, M12, M18, E5]
    nodes:
      - Linear regression in closed form and as geometry
      - Probabilistic linear regression
      - Basis and polynomial features
      - Ridge and lasso
      - Logistic regression and its convexity
      - Softmax regression
      - Generalised linear models in practice
      - The perceptron and its convergence theorem
      - Linear discriminant analysis
      - Calibration
  - id: L3
    title: Classical nonlinear methods
    requires: [L2, M19]
    nodes:
      - k-nearest neighbours and the curse of dimensionality
      - Naive Bayes
      - Decision trees
      - Bagging and random forests
      - AdaBoost
      - Gradient boosting
      - Support vector machines and their dual
      - The kernel trick and kernel methods
      - Gaussian processes
      - k-means
      - Hierarchical and spectral clustering
  - id: L4
    title: Probabilistic models and inference
    requires: [L3, M15, M20]
    nodes:
      - Latent variable models
      - Gaussian mixtures and EM
      - Probabilistic PCA and factor analysis
      - Hidden Markov models
      - Directed and undirected graphical models
