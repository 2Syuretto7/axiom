    title: Neural network foundations
    requires: [L2, M13, E6]
    nodes:
      - The neuron
      - Multilayer perceptrons
      - Activation functions
      - Universal approximation
      - Backpropagation on an arbitrary graph
      - Initialisation from variance propagation
      - Minibatch SGD in practice
      - Normalisation layers
      - Dropout
      - Weight decay versus L2 regularisation
      - Residual connections and signal propagation
      - Loss landscapes and sharpness
      - Reading and debugging training curves
      - Hyperparameter search methodology
  - id: L6
    title: Architectures before transformers
    requires: [L5, E7]
    nodes:
      - Convolution and CNNs
      - Pooling and receptive fields
      - Recurrent networks
      - Vanishing gradients, LSTM and GRU
      - Embeddings
      - Sequence-to-sequence models
      - Attention as soft lookup
      - Graph neural networks
