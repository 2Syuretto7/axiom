# Track M: mathematics. Each cluster lists the clusters it requires and its
# concepts in teaching order. Unless a concept says otherwise, it requires the
# concept before it and the final concepts of the required clusters.
track: M
title: Mathematics
clusters:
  - id: M0
    title: Arithmetic and number sense
    requires: []
    nodes:
      - Whole numbers and place value
      - The four operations and order of operations
      - Fractions
      - Decimals and percentages
      - Negative numbers
      - Powers and roots
      - Ratio and proportion
      - Estimation and orders of magnitude
  - id: M1
    title: Algebra
    # Algebra follows first programs, so every algebra lesson can be practised in code.
    requires: [M0, E0]
    nodes:
      - Variables and expressions
      - Linear equations
      - Inequalities and absolute value
      - Coordinates and the plane
      - Straight lines and slope
      - Simultaneous equations
      - Quadratics
      - Polynomials
      - Exponent laws
      - Logarithms
      - Complex numbers
  - id: M2
    title: Functions and notation
    requires: [M1]
    nodes:
      - Sets
      - Functions as machines
      - Composition and inverses
      - Injective, surjective and bijective maps
      - The exponential and e
      - Trigonometric functions on the unit circle
      - Summation and product notation
      - Sequences and series
  - id: M3
    title: Logic and proof
    # Follows Python proper as well, so that proof can start from what code could only test.
    requires: [M2, E1]
    nodes:
      - Propositions and connectives
      - Quantifiers and their negation
      - Direct proof
      - Contrapositive and contradiction
      - Induction and strong induction
      - Cases and counterexamples
      - Equivalence relations and partitions
      - Countable and uncountable sets
      - Reading and writing epsilon-style arguments
  - id: M4
    title: Vectors and geometry
    # Follows single-variable calculus, so that gradients and least squares have their geometry ready.
    requires: [M10]
    nodes:
      - Vectors as arrows and as lists
      - Vector addition and scaling
      - Linear combinations and span
      - Dot product
      - Norms and distance
      - Angle and cosine similarity
      - Projection onto a vector
      - Lines, planes and hyperplanes
      - Linear independence
  - id: M5
    title: Matrices and linear maps
    # Follows data structures, so that a matrix can be met both as a map of vectors and as a table that code stores and loops over.
    requires: [M4, E3]
    nodes:
      - Matrices as linear maps
      - Matrix-vector product
      - Matrix multiplication as composition
      - Transpose
      - Identity and inverse
      - Elimination and linear systems
      - Rank
      - Column space and null space
      - Basis and dimension
      - Change of basis
      - Determinant
  - id: M6
    title: Abstract vector spaces
    requires: [M5, M3]
    nodes:
      - Fields and the vector space axioms
      - Subspaces, sums and direct sums
      - Linear maps, kernel and image
      - Rank-nullity theorem
      - Matrix of a linear map and similarity
      - Dual spaces and the transpose
      - Inner product spaces
      - Cauchy-Schwarz and the triangle inequality
      - Adjoints, orthogonal and unitary maps
  - id: M7
    title: Orthogonality and least squares
    requires: [M5]
    nodes:
      - Orthogonal subspaces
      - Orthonormal bases
      - Gram-Schmidt and QR
      - Projection onto a subspace
      - Least squares and the normal equations
      - Pseudo-inverse
      - Conditioning
  - id: M8
    title: Spectral theory
    requires: [M7, M6]
    nodes:
      - Eigenvalues and eigenvectors
      - Characteristic polynomial
      - Diagonalisation
      - Spectral theorem
      - Positive definite matrices and Cholesky
      - Quadratic forms and the Rayleigh quotient
      - Courant-Fischer min-max theorem
      - Singular value decomposition
      - Eckart-Young theorem
      - PCA as SVD
      - Operator and Frobenius norms
      - Jordan form and the matrix exponential
      - Perron-Frobenius and power iteration
  - id: M9
    title: Numerical linear algebra
    requires: [M8, E5]
    nodes:
      - Floating-point error and backward stability
      - LU with pivoting
      - Householder QR
      - Conditioning and perturbation bounds
      - Jacobi and Gauss-Seidel iteration
      - Conjugate gradient
      - Krylov subspaces and Lanczos
      - Randomised SVD and sketching
      - Sparse matrices and structure
  - id: M10
    title: Single-variable calculus
    # Follows logic and proof, so that limits start from the epsilon arguments just learned.
    requires: [M2, M3]
    nodes:
      - Limits and continuity
      - Derivative as slope and rate
      - Differentiation rules
      - Chain rule
      - Derivatives of exp, log and trig
      - Second derivative and curvature
      - Taylor approximation
      - Maxima and minima
      - Integral as accumulation
      - Fundamental theorem of calculus
      - Integration techniques
  - id: M11
    title: Real analysis
    requires: [M10, M3]
    nodes:
      - The real numbers and completeness
      - Sequences and epsilon-N limits
      - Cauchy sequences and Bolzano-Weierstrass
      - Series and convergence tests
      - Epsilon-delta continuity and uniform continuity
      - Intermediate and extreme value theorems
      - Differentiability and the mean value theorem
      - Taylor's theorem with remainder
      - The Riemann integral
      - Uniform convergence of functions
      - Metric spaces and compactness
      - Contraction mapping theorem
  - id: M12
    title: Multivariable calculus
    # Follows NumPy, so that every partial derivative can be checked numerically and every surface computed.
    requires: [M10, M5, E5]
    nodes:
      - Functions of several variables
      - Partial derivatives
      - Total derivative as best linear approximation
      - Gradient
      - Directional derivative
      - Multivariable chain rule
      - Jacobian
      - Hessian and symmetry of mixed partials
      - Multivariable Taylor expansion
      - Inverse and implicit function theorems
      - Multiple integrals and change of variables
  - id: M13
    title: Matrix calculus and automatic differentiation
    requires: [M12, M8]
    nodes:
      - Derivatives with respect to vectors
      - Derivatives with respect to matrices
      - The method of differentials
      - Trace identities, determinant and inverse derivatives
      - Jacobian-vector and vector-Jacobian products
      - Computational graphs
      - Reverse-mode differentiation and its cost
      - Forward mode and dual numbers
      - Hessian-vector products
      - Implicit differentiation through solvers
      - Gradients of common neural network layers
  - id: M14
    title: Probability
    requires: [M2]
    nodes:
      - Counting
      - Sample spaces and events
      - Axioms of probability
      - Conditional probability
      - Bayes' rule
      - Independence
      - Discrete random variables
      - Expectation
      - Variance and covariance
      - Common discrete distributions
      - Continuous random variables and densities
      - The Gaussian
      - Joint, marginal and conditional distributions
  - id: M15
    title: Rigorous probability
    requires: [M14, M11, M12]
    nodes:
      - Sigma-algebras and probability measures
      - Random variables as measurable functions
      - Lebesgue integration and expectation
      - Monotone and dominated convergence
      - Modes of convergence
      - Laws of large numbers
      - Moment generating and characteristic functions
      - Central limit theorem
      - Conditional expectation as projection
      - Multivariate Gaussian
      - Change of variables for densities
      - Markov, Chebyshev, Jensen and Cauchy-Schwarz inequalities
  - id: M16
    title: Concentration and high dimensions
    requires: [M15]
    nodes:
      - The Chernoff method
      - Sub-Gaussian and sub-exponential variables
      - Hoeffding and Bernstein inequalities
      - McDiarmid's inequality
      - Union bounds and covering numbers
      - Geometry of high-dimensional space
      - Johnson-Lindenstrauss lemma
      - Singular values of random matrices
  - id: M17
    title: Stochastic processes and sampling
    requires: [M15, M8]
    nodes:
      - Markov chains and stationary distributions
      - Mixing and detailed balance
      - Monte Carlo estimation and variance reduction
      - Importance sampling
      - Metropolis-Hastings and Gibbs sampling
      - Langevin dynamics
      - Martingales and optional stopping
      - Random walks and Poisson processes
      - Brownian motion and stochastic differential equations
  - id: M18
    title: Statistics
    requires: [M14, M12]
    nodes:
      - Samples and estimators
      - Bias, variance and consistency
      - Sufficient statistics
      - Maximum likelihood
      - Fisher information and the Cramer-Rao bound
      - Asymptotic normality of the MLE
      - MAP estimation and priors
      - Bayesian inference and conjugacy
      - Confidence intervals
      - Hypothesis testing and power
      - Multiple comparisons
      - Bootstrap and permutation tests
      - Linear regression as MLE and Gauss-Markov
      - Generalised linear models
      - Experimental design and causal inference basics
  - id: M19
    title: Optimisation
    requires: [M12, M8, M11]
    nodes:
      - Convex sets
      - Convex functions and their conditions
      - Subgradients
      - Gradient descent
      - Convergence rates for smooth and strongly convex functions
      - Condition number
      - Momentum and Nesterov acceleration
      - Lower bounds for first-order methods
      - Newton and quasi-Newton methods
      - Stochastic gradient descent and its convergence
      - Variance reduction
      - Adaptive methods
      - Proximal and projected gradient methods
      - Lagrange multipliers
      - KKT conditions and duality
      - Saddle points and the Polyak-Lojasiewicz condition
      - Learning-rate schedules and warm-up
      - Natural gradient and second-order approximations
  - id: M20
    title: Information theory
    requires: [M14, M10]
    nodes:
      - Surprise and entropy
      - Joint and conditional entropy
      - Cross-entropy
      - KL divergence and Gibbs' inequality
      - Mutual information and data processing
      - Source coding theorem
      - Huffman and arithmetic coding
      - Channel capacity
      - Maximum entropy and the exponential family
      - Cross-entropy loss as maximum likelihood
      - Perplexity and bits per token
      - Rate-distortion and the ELBO
  - id: M21
    title: Statistical learning theory
    requires: [M16, M18, M19]
    nodes:
      - PAC learning
      - Empirical risk minimisation and uniform convergence
      - VC dimension
      - Rademacher complexity
      - Generalisation bounds
      - No free lunch and the bias-complexity trade-off
      - Algorithmic stability
      - PAC-Bayes bounds
      - Kernels, RKHS and the representer theorem
      - Double descent and benign overfitting
      - Implicit regularisation of gradient descent
      - Neural tangent kernel and infinite-width limits
