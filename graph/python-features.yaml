# Which concept first teaches which Python feature. A lesson's code, whether
# shown, started from or asked for, may only use features granted by its own
# concept and its prerequisites. The names are produced by featureProgram in
# src/lib/lessons/harness.ts:
#   node:<syntax>   call:<built-in function>   op:<operator>
#   attr:<method>   import:<module>            const:<type of literal>
