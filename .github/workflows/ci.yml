name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiom -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lessons
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://axiom:axiom@localhost:5432/axiom_test

  e2e:
    name: Browser tests (laptop, tablet, phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiom -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_DATABASE_URL: postgres://axiom:axiom@localhost:5432/axiom_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens
          if-no-files-found: ignore

  preview:
    name: Vercel preview responds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Vercel marks its check on the commit once the preview is deployed, and names the address in its comment.
      - name: Wait for the preview of this commit
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref, per_page: 100 });
              const vercel = data.check_runs.find((run) => run.app?.slug === "vercel");
              if (vercel?.status === "completed") {
                if (vercel.conclusion !== "success") return core.setFailed(`Vercel reported ${vercel.conclusion} for this commit.`);
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: context.issue.number });
                const body = comments.findLast((comment) => comment.user?.login === "vercel[bot]")?.body ?? "";
                const url = body.match(/\[Preview\]\((https:\/\/[a-z0-9.-]+\.vercel\.app)\)/)?.[1];
                if (url) return core.setOutput("url", url);
              }
              await new Promise((done) => setTimeout(done, 15000));
            }
            core.setFailed("No Vercel preview appeared for this commit.");
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          LIVE_URL: ${{ steps.preview.outputs.url }}
