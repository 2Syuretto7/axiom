name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiom -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run lessons
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://axiom:axiom@localhost:5432/axiom_test

  e2e:
    name: Browser tests (laptop, tablet, phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiom -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_DATABASE_URL: postgres://axiom:axiom@localhost:5432/axiom_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: test-results/screens
          if-no-files-found: ignore
