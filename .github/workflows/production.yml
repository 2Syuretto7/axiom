name: Production check

# After Vercel finishes a production deployment, confirm the live site is up
# and connected to its database. Needs no secrets: it only reads public pages.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify production
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          LIVE_URL: ${{ github.event.deployment_status.environment_url }}
