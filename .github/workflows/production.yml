name: Production check

# After Vercel finishes deploying main, confirm the live site is up, connected to its
# database and has the tutor's key. Needs no secrets: it only reads public pages.
#
# Vercel reports each deployment as a commit status named "Vercel", so that is what
# starts this. (It does not send GitHub's deployment events for this project, which is
# why an earlier version of this workflow, waiting for those, never ran.)
#
# PRODUCTION_URL is a repository variable, not a secret: the public address of the live
# site, for example https://axiom.example.com. The address cannot be worked out from
# here, because Vercel's own <project>-<account>.vercel.app address sits behind a Vercel
# login. Until the variable is set this check is skipped rather than failing.
on:
  status:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify production
    # Skipped until the site's public address is known; see PRODUCTION_URL above.
    if: >-
      github.event.context == 'Vercel' && github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main') && vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          LIVE_URL: ${{ vars.PRODUCTION_URL }}
