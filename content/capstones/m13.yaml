            This agrees with the backward pass. There, $\bar{\mathbf{x}} = (-0.0848, 0.4713)$ was the gradient of the loss, so along $(1, 1)$ the loss changes at rate $0.3865$. The loss is $\tfrac12(f - t)^2$, so that should be $r$ times the rate of $f$: $-0.1694 \times -2.2809 = 0.3865$. Three methods, one answer.
  - title: Curvature without a Hessian
    blocks:
      - text: |
          How large a step can training take? Hold $W_1$ fixed and look at the loss as a function of the output weights alone: $L(\mathbf{w}_2) = \tfrac12(\mathbf{w}_2 \cdot \mathbf{h} - t)^2$. Its gradient is $(\mathbf{w}_2 \cdot \mathbf{h} - t)\,\mathbf{h}$.
      - question:
          id: hvp
          type: choice
          system: s2
          concepts: [m13.hessian-vector-products, m13.derivatives-with-respect-to-vectors]
          prompt: |
            What is the Hessian-vector product $H\mathbf{v}$ of this loss, and what does it reveal about $H$?
          options:
            - '$H\mathbf{v} = \mathbf{v}$: the Hessian is the identity.'
            - 'Moving $\mathbf{w}_2$ along $\mathbf{v}$ changes the gradient at the rate $(\mathbf{h} \cdot \mathbf{v})\,\mathbf{h}$. So $H\mathbf{v} = (\mathbf{h} \cdot \mathbf{v})\mathbf{h}$, computed with one dot product, and $H = \mathbf{h}\mathbf{h}^\top$ has the single nonzero eigenvalue $\|\mathbf{h}\|^2$, with eigenvector $\mathbf{h}$.'
            - '$H\mathbf{v} = (\mathbf{w}_2 \cdot \mathbf{h} - t)\,\mathbf{v}$.'
            - '$H\mathbf{v}$ cannot be found without first writing out the $3 \times 3$ Hessian.'
          answer: 1
          explanation: |
            $H\mathbf{v}$ is the derivative of the gradient along $\mathbf{v}$. In the gradient $(\mathbf{w}_2 \cdot \mathbf{h} - t)\,\mathbf{h}$ only the scalar factor depends on $\mathbf{w}_2$, and along $\mathbf{v}$ it changes at rate $\mathbf{h} \cdot \mathbf{v}$. The product $(\mathbf{h} \cdot \mathbf{v})\mathbf{h}$ always points along $\mathbf{h}$, so $H$ has rank 1. For $\mathbf{v} = \mathbf{h}$ it gives $\|\mathbf{h}\|^2\mathbf{h}$, and for any $\mathbf{v}$ perpendicular to $\mathbf{h}$ it gives zero. Power iteration with this product would converge in a single step. With one training example the loss curves in one direction only, and is flat in the other two.
      - question:
          id: step-limit
          type: numeric
          system: s2
          concepts: [m13.hessian-vector-products]
          prompt: |
            With $\mathbf{h} = (0.4621, -0.0500, 0.5370)$, the largest eigenvalue of that Hessian is $\|\mathbf{h}\|^2 = 0.5045$. Below what step size is gradient descent on $\mathbf{w}_2$ stable? Answer to 2 decimal places.
          answer: "3.96"
          explanation: |
            The limit is $2/\lambda_{\max} = 2/0.5045 = 3.96$. Along $\mathbf{h}$ each step multiplies the error by $1 - \eta\|\mathbf{h}\|^2$, which has size below 1 exactly when $\eta < 2/\|\mathbf{h}\|^2$. With $\eta = 1/\|\mathbf{h}\|^2 = 1.98$ the factor is 0 and one step fits the example exactly. The limit depends on the size of the hidden activations: scale $\mathbf{h}$ by 10 and the safe step shrinks by 100. That is one reason the scale of activations is controlled so carefully in deep networks.
  - title: A layer chosen by a solver
    blocks:
      - text: |
          Suppose the output weights are not trained by gradient steps at all. With $W_1$ fixed and a batch of examples whose hidden outputs are the rows of a matrix $H$, the best $\mathbf{w}_2$ under a penalty $\tfrac12\lambda\|\mathbf{w}_2\|^2$ solves

          $$(H^\top H + \lambda I)\,\mathbf{w}_2 = H^\top\mathbf{t}.$$

          Now $\mathbf{w}_2$ is the output of a solver, and it depends on $\lambda$.
      - question:
          id: implicit-scalar
          type: numeric
          system: s2
          concepts: [m13.implicit-differentiation-through-solvers]
          prompt: |
            Take the smallest case: one hidden unit and one example, with $h = 1$ and $t = 3$, so the equation is $(1 + \lambda)w = 3$. At $\lambda = 2$ the solution is $w = 1$. What is $dw/d\lambda$ there? Answer to 4 decimal places.
          answer: "-0.3333"
          explanation: |
            Differentiate the equation: $w + (1 + \lambda)\,w' = 0$, so $w' = -w/(1 + \lambda) = -1/3$. In general $d\mathbf{w}_2/d\lambda = -(H^\top H + \lambda I)^{-1}\mathbf{w}_2$: one more solve with the matrix that was already used to find $\mathbf{w}_2$. Here the formula $w = 3/(1 + \lambda)$ could have been differentiated directly, giving $-3/(1 + \lambda)^2 = -1/3$. The point of differentiating the equation is that it works equally when there is no formula.
      - question:
          id: logdet
          type: numeric
          system: s2
          concepts: [m13.trace-identities-determinant-and-inverse-derivatives]
          prompt: |
            Criteria for choosing $\lambda$ often contain the term $\log\det(H^\top H + \lambda I)$. Suppose $H^\top H$ has the eigenvalues 1 and 3. What is the derivative of that term with respect to $\lambda$ at $\lambda = 1$?
          answer: "0.75"
          explanation: |
            $d\log\det M = \operatorname{tr}(M^{-1}dM)$, and here $dM = I\,d\lambda$, so the derivative is $\operatorname{tr}\big((H^\top H + \lambda I)^{-1}\big)$. The eigenvalues of $H^\top H + \lambda I$ are $1 + 1 = 2$ and $3 + 1 = 4$, those of its inverse are $\tfrac12$ and $\tfrac14$, and the trace is their sum, $0.75$. As a check, $\log\det M = \log(1 + \lambda) + \log(3 + \lambda)$, with derivative $\tfrac12 + \tfrac14$.
      - question:
          id: at-scale
          type: choice
          system: s2
          concepts: [m13.implicit-differentiation-through-solvers, m13.hessian-vector-products, m13.reverse-mode-differentiation-and-its-cost]
          prompt: |
            For a large model the weights come from a long training run, not a linear solve, and the gradient of a validation loss with respect to a hyperparameter is wanted. Which plan follows the cluster?
          options:
            - 'Nudge the hyperparameter and retrain, once per hyperparameter.'
            - 'Record every step of training and sweep back through all of them.'
            - 'Treat the trained weights as the solution of "training gradient = 0". The adjoint equation then has the Hessian of the training loss as its matrix. Solve it approximately by an iterative method that uses only Hessian-vector products, each costing a few gradients, and store nothing of the training run.'
            - 'It cannot be done, because the Hessian is too large to form.'
          answer: 2
          explanation: |
            This is the scalar calculation above with every piece scaled up. The equation $(H^\top H + \lambda I)\mathbf{w} = H^\top\mathbf{t}$ becomes "the gradient of the training loss is zero". The matrix of the adjoint solve becomes the Hessian of the training loss. The solve becomes conjugate gradients on Hessian-vector products. The second option is possible in principle, and its memory grows with the length of training. The first is what a grid search does. Nothing in the third plan needs the Hessian, the training history, or more than a few vectors the size of the model.
review: |
  One small network, and the whole cluster:

  - The gradient $r\mathbf{h}$ with respect to the output weights was [[m13.derivatives-with-respect-to-vectors]].
  - The gradient $\boldsymbol\delta\mathbf{x}^\top$, with the shape of $W_1$, was [[m13.derivatives-with-respect-to-matrices]].
  - Getting it from $dL = r\,\mathbf{w}_2^\top D\,dW_1\,\mathbf{x}$ and a trace was [[m13.the-method-of-differentials]].
  - The derivative of the log-determinant as a trace of an inverse was [[m13.trace-identities-determinant-and-inverse-derivatives]].
  - $D(W_1\mathbf{v})$ and $W_1^\top(D\mathbf{u})$, and the test that they are transposes, were [[m13.jacobian-vector-and-vector-jacobian-products]].
  - The three paths from $x_1$ to the loss, and the recursions that replace them, were [[m13.computational-graphs]].
  - One backward sweep for all nine parameters, keeping only $\mathbf{h}$ and $r$, was [[m13.reverse-mode-differentiation-and-its-cost]].
  - Running the network on $\mathbf{x} + \mathbf{v}\varepsilon$ and reading the tangent of the output was [[m13.forward-mode-and-dual-numbers]].
  - $(\mathbf{h} \cdot \mathbf{v})\mathbf{h}$, the eigenvalue $\|\mathbf{h}\|^2$ and the step limit were [[m13.hessian-vector-products]].
  - Differentiating $(H^\top H + \lambda I)\mathbf{w}_2 = H^\top\mathbf{t}$ and not the solver was [[m13.implicit-differentiation-through-solvers]].
  - The backward rules of the output layer, the activation and the first layer, called in reverse, were [[m13.gradients-of-common-neural-network-layers]].

  Two things here go forward. The first is the habit of the middle stage: no gradient is trusted until a second method has agreed with it, whether a product from the other side, a dual number, or a difference along one direction. The second is the shape of the backward pass itself, a short rule per layer called in reverse order with a few stored values. You have now written that by hand for a network of nine parameters. A library does exactly the same for a network of billions, recording the graph as the forward pass runs and storing one backward rule for each operation, and the next cluster of engineering puts that library in your hands.
