            assert abs(_y.b - (0.7864 * 1 - 2 * 0.9975 * 0.5 + 0.5 * 0.7116 * 2)) < 1e-3, "Seeding only the first input, the tangent of the output should be about 0.5005"
            assert output.strip() == "0.8306 -2.2809", "The program should print 0.8306 -2.2809"
