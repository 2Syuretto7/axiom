          explanation: |
            The rule for $\tanh$ used the square of its **input** where the square of its **output** belongs: the slope is $1 - \tanh^2a$, not $1 - a^2$. For small inputs the two are close, which is why the error was easy to miss: at $a = -0.05$ they agree to five decimal places.

