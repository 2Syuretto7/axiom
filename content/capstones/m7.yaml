          solution: |
            import numpy as np


            def design(r, shift, scale):
                return np.stack([np.ones(len(r)), (r - shift) / scale], axis=1)


            def conditions(r):
                raw = float(np.linalg.cond(design(r, 0.0, 1.0)))
                centred = float(np.linalg.cond(design(r, r.mean(), 1.0)))
                standard = float(np.linalg.cond(design(r, r.mean(), r.std())))
                return raw, centred, standard


            r = np.array([500.0, 510.0, 520.0, 530.0, 540.0])
            raw, centred, standard = conditions(r)
            print(round(raw, -2), round(centred, 4), round(standard, 4))
          tests: |
            import numpy as _np
            _r = _np.array([500.0, 510.0, 520.0, 530.0, 540.0])
            _keep = _r.copy()
            _A = design(_r, 520.0, 10.0)
            assert _np.array_equal(_r, _keep), "r should be left as it was"
            assert _np.shape(_A) == (5, 2), "The design matrix has one row for each reading and two columns"
            assert _np.allclose(_A[:, 0], 1.0), "The first column should be all ones"
            assert _np.allclose(_A[:, 1], [-2.0, -1.0, 0.0, 1.0, 2.0]), "With shift 520 and scale 10 the second column is -2, -1, 0, 1, 2: subtract the shift, then divide by the scale"
            _out = conditions(_r)
            assert isinstance(_out, tuple) and len(_out) == 3, "conditions should return three numbers"
            _raw, _cen, _std = _out
            assert isinstance(_raw, float) and isinstance(_cen, float) and isinstance(_std, float), "Each condition number should be a float"
            assert abs(_raw - 19134.38) < 1.0, "For the raw counts the condition number is about 19 134: shift 0 and scale 1"
            assert abs(_cen - 200 ** 0.5) < 1e-6, "For the centred counts the condition number is the square root of 200, about 14.14: shift by the mean of r"
            assert abs(_std - 1.0) < 1e-6, "For the standardised counts the condition number is 1: shift by the mean and scale by r.std()"
            _raw, _cen, _std = conditions(_np.array([2000.0, 2001.0, 2002.0, 2003.0, 2004.0, 2005.0]))
            assert abs(_cen - 1.7078251) < 1e-5 and abs(_std - 1.0) < 1e-6 and _raw > 2e6, "For the years 2000 to 2005 the three values are about 2.3 million, 1.7078 and 1"
            assert output.strip() == "19100.0 14.1421 1.0", "The program should print 19100.0 14.1421 1.0"
