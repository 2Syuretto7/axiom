          explanation: |
            The three matrices have the same column space, so they describe the same family of lines and give the same fitted temperatures. Their condition numbers are about 19 000, 14 and 1.

            With the raw counts, the normal equations would work at $19\,000^2$, about $4 \times 10^8$, and eight of sixteen digits would be at risk. That is survivable here. It would not be with a quadratic term: the design matrix of ones, $r$ and $r^2$ has a condition number of about $4 \times 10^8$ on its own, and the normal equations square it past the limit of the arithmetic. With centred counts the same quadratic design has a condition number of about 400.

            Scaling without centring, the third wrong version, leaves the two columns as nearly parallel as before. It is the centring that turns the column away from the ones, and the scaling that then evens out the lengths.
      - question:
          id: data-error
          type: choice
          system: s2
          concepts: [m7.conditioning, m7.gram-schmidt-and-qr]
          prompt: |
            The calibration is done with the raw counts, condition number about 19 000, and solved by QR so that the method adds no further loss. The reference temperatures are good to about one part in 250. How well is the offset $-183$ determined, and does it matter?
          options:
            - 'To sixteen digits, since QR was used.'
            - 'Possibly not at all: the bound allows a relative error of $19\,000/250$, far more than the whole value. The offset at count zero is an extrapolation 500 counts beyond the data, where a small tilt of the line moves it a long way. It does not matter for the device, which only ever evaluates the line near counts of 500 to 540, where offset and gain errors nearly cancel. The centred form states what the data determines: 25 degrees at count 520, to about a tenth.'
            - 'To one part in 250, the same as the data.'
            - 'It cannot be computed.'
          answer: 1
          explanation: |
            The condition number bounds the error passed from the data to the solution, whatever the method, and QR only avoids adding to it. The misread of the earlier question shows the mechanism: one degree of error in the last reading changes the gain by 0.02, and so the offset at count zero by about $0.02 \times 520$, some ten degrees, while the fitted value in the middle of the range moves by 0.2. Ill-conditioned coefficients and well-determined predictions sit together comfortably. Choosing the centred basis makes the coefficients themselves meaningful, which is the same advice as before, now for a reason that has nothing to do with rounding.
review: |
  One sensor, and the whole cluster:

  - Seeing that five readings could not all be satisfied, and replacing the demand with the least sum of squares, was [[m7.least-squares-and-the-normal-equations]].
  - Testing a claimed fit by whether its misses were orthogonal to the columns, and splitting the squared length of the readings into a fitted part and a residual part, was [[m7.orthogonal-subspaces]].
  - Finding the gain and the offset as two separate projections, because centring had made the columns orthogonal, was [[m7.orthonormal-bases]].
  - Extracting from the column of squares the one direction that was new, and reading off that the readings had no component along it, was [[m7.gram-schmidt-and-qr]].
  - The matrix that turns readings into fitted values, its diagonal, and its trace of 2 were [[m7.projection-onto-a-subspace]].
  - The rows of weights that turn readings into coefficients, and the equal split between two indistinguishable sensors, were [[m7.pseudo-inverse]].
  - The three condition numbers for one and the same line, and the offset that the data did not determine, were [[m7.conditioning]].

  Two things here go forward. The first is the habit of asking, of any fitted number, how it would move if one measurement moved. For a linear fit the answer is a fixed matrix, and the statistics of regression is largely the study of that matrix. The second is the centred, scaled basis. Every later model in this curriculum, however large, trains better when its inputs are prepared this way, and the reason is the one found here: the shape of the bowl depends on the basis in which the problem is written.
