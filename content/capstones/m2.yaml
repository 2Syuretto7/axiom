cluster: M2
title: A recurring deposit
minutes: 60
claim: You will have described a monthly savings plan as functions, composed and inverted them, summed the plan with a geometric series, checked the formula against a loop, and used the exponential and the logarithm to say how long money takes to double.
brief: |
  This cluster gave you a language: functions, composition, inverses, sigma notation, sequences and the exponential. A language is learnt by saying something with it. Here you will describe one thing, a savings plan, from beginning to end.

  **The project.** A bank offers a recurring deposit. Each month the money in the account earns 1% interest, and then you pay in ₹1000. You want to know what the account holds after any number of months, how to run the plan backwards, and how quickly money grows when it is left alone.

  Nothing here is new. The work is in recognising, at each stage, which idea from the cluster the plan is an example of. Keep your results as you go, because later stages build on earlier ones.
starter: |
  # Scratch space for the deposit. math is available after an import.
  import math

  balance = 0
  for month in range(3):
      balance = 1.01 * balance + 1000
      print(month + 1, balance)
stages:
  - title: One month as a function
    blocks:
      - text: |
          Two things happen to the account each month, and each is a function from a balance to a balance:

          $$g(x) = 1.01x \qquad\text{and}\qquad d(x) = x + 1000.$$

          $g$ adds the interest and $d$ adds the deposit. The plan applies $g$ first and then $d$. Call the result of doing both $s$, for one step of the plan.
      - question:
          id: which-composition
          type: choice
          system: s1
          concepts: [m2.composition-and-inverses, m2.functions-as-machines]
          prompt: Which is $s$, written as a composition and as a formula?
          options:
            - "$s = d \\circ g$, so $s(x) = 1.01x + 1000$"
            - "$s = g \\circ d$, so $s(x) = 1.01x + 1000$"
            - "$s = d \\circ g$, so $s(x) = 1.01x + 1010$"
            - "$s = g \\circ d$, so $s(x) = 1.01(x + 1000)$"
          answer: 0
          explanation: |
            In $d \circ g$ the function on the right acts first. Interest first, then the deposit, is $d(g(x)) = 1.01x + 1000$. The other order, $g(d(x)) = 1.01x + 1010$, is a different plan in which the new deposit earns interest in its first month.
          hints:
            - In a composition, which function touches the input first, the one written on the left or on the right?
            - Work out $d(g(x))$ and $g(d(x))$ separately and compare them with the description.
      - question:
          id: two-months
          type: numeric
          system: s1
          concepts: [m2.composition-and-inverses, m2.sequences-and-series]
          prompt: The account starts empty. What does it hold after two months, that is, what is $s(s(0))$?
          answer: "2010"
          unit: rupees
          explanation: |
            $s(0) = 1000$, and $s(1000) = 1.01 \times 1000 + 1000 = 2010$. The first deposit has earned one month's interest, ₹10, and the second has earned none yet.
          hints:
            - Evaluate the inner $s$ first.
            - Feed that result back into $s$.
  - title: Running the plan backwards
    blocks:
      - text: |
          A statement shows the balance at the end of a month. You want the balance at the end of the month before.
      - question:
          id: invertible
          type: choice
          system: s2
          concepts: [m2.injective-surjective-and-bijective-maps, m2.composition-and-inverses]
          prompt: Why can $s$, as a function from the real numbers to the real numbers, be undone?
          options:
            - It is a bijection. Different balances always give different results, and every real number is the result of some balance.
            - It is increasing, and every increasing function from the real numbers to the real numbers has an inverse defined on all of them.
            - It is a composition, and every composition of two functions can be undone.
            - Its formula contains no powers, and only powers lose information.
          answer: 0
          explanation: |
            A function has an inverse exactly when it is a bijection. $s$ is injective, since $1.01a + 1000 = 1.01b + 1000$ forces $a = b$, and surjective, since any $y$ is reached from $x = \dfrac{y - 1000}{1.01}$. Being increasing gives injectivity but not surjectivity. An exponential is increasing and never reaches a negative number.
          hints:
            - Exactly which functions have inverses?
            - Check the two properties separately. Can two different balances lead to the same result? Is every real number a result?
      - question:
          id: month-before
          type: numeric
          system: s2
          concepts: [m2.composition-and-inverses, m2.functions-as-machines]
          prompt: At the end of a month the account holds ₹6050. What did it hold at the end of the month before?
          answer: "5000"
          unit: rupees
          explanation: |
            Solve $1.01x + 1000 = 6050$ for the input: $x = \dfrac{6050 - 1000}{1.01} = 5000$. As a composition, $s^{-1} = g^{-1} \circ d^{-1}$. The deposit was added last, so it is removed first, and the interest is divided out after that.
          hints:
            - Finding an inverse is solving for the input.
            - The last thing done is the first thing undone. Which of the two steps came last?
  - title: Many months as a sum
    blocks:
      - text: |
          Follow one deposit. A deposit made at the end of some month then earns interest in every later month, so $k$ months after it was paid in it has grown to $1000 \times 1.01^{k}$.

          At the end of month $n$ the account holds $n$ deposits. The newest has had no months to grow and the oldest has had $n - 1$. Write $B_n$ for the balance.
      - question:
          id: as-sigma
          type: choice
          system: s2
          concepts: [m2.summation-and-product-notation, m2.sequences-and-series]
          prompt: Which expression is $B_n$?
          options:
            - "$\\displaystyle\\sum_{k=0}^{n-1} 1000 \\times 1.01^{k}$"
            - "$\\displaystyle\\sum_{k=1}^{n} 1000 \\times 1.01^{k}$"
            - "$\\displaystyle\\sum_{k=0}^{n-1} 1000 \\times 1.01k$"
            - "$\\displaystyle\\prod_{k=0}^{n-1} 1000 \\times 1.01^{k}$"
          answer: 0
          explanation: |
            There are $n$ deposits, aged $0, 1, \dots, n - 1$ months, and the one aged $k$ is worth $1000 \times 1.01^{k}$. Summing over the ages gives the first expression. The second gives every deposit one month too many. Check it against the first stage: for $n = 2$ the sum is $1000 + 1010 = 2010$.
          hints:
            - How old is the newest deposit, and how old is the oldest?
            - Test each candidate at $n = 2$, where you already know the balance.
      - text: |
          That sum is a finite geometric series with first term 1000 and ratio 1.01.
      - question:
          id: closed-form
          type: choice
          system: s2
          concepts: [m2.sequences-and-series, m2.summation-and-product-notation]
          prompt: Which closed form equals $B_n$?
          options:
            - "$100\\,000\\,(1.01^{n} - 1)$"
            - "$1000\\,(1.01^{n} - 1)$"
            - "$100\\,000 \\times 1.01^{n}$"
            - "$1000 \\times 1.01^{n-1}$"
          answer: 0
          explanation: |
            A geometric series with first term $a$ and ratio $r$ sums to $a\,\dfrac{r^{n} - 1}{r - 1}$. Here that is $1000 \times \dfrac{1.01^{n} - 1}{0.01} = 100\,000\,(1.01^{n} - 1)$. At $n = 2$ it gives $100\,000 \times 0.0201 = 2010$, as it must.
          hints:
            - Recall the sum of a finite geometric series in terms of its first term, its ratio and the number of terms.
            - Dividing by $0.01$ is multiplying by a hundred.
      - text: |
          A formula found by algebra and a loop that simply does what the plan says should agree. Make them.
      - question:
          id: loop-and-formula
          type: code
          mode: write
          system: s2
          concepts: [m2.summation-and-product-notation, m2.sequences-and-series, m2.composition-and-inverses]
          prompt: |
            Write two functions.

            `by_steps(n)` starts from an empty account, applies one step of the plan `n` times in a loop, and returns the balance.

            `by_formula(n)` returns the balance from the closed form, with no loop.
          starter: |
            def by_steps(n):
                return 0


            def by_formula(n):
                return 0
          solution: |
            def by_steps(n):
                balance = 0
                for month in range(n):
                    balance = 1.01 * balance + 1000
                return balance


            def by_formula(n):
                return 100000 * (1.01 ** n - 1)
          tests: |
            assert by_steps(0) == 0, "after no months the account is still empty"
            assert abs(by_steps(1) - 1000) < 1e-6, "after one month the account holds the first deposit and nothing else"
            assert abs(by_steps(2) - 2010) < 1e-6, "after two months the first deposit has earned one month of interest"
            assert abs(by_formula(2) - 2010) < 1e-6, "the formula disagrees with the plan at two months"
            for _n in [0, 1, 5, 12, 60, 120]:
                assert abs(by_steps(_n) - by_formula(_n)) < 1e-4, "the loop and the formula disagree at " + str(_n) + " months"
            assert "for" not in source.split("def by_formula")[1] and "while" not in source.split("def by_formula")[1], "by_formula should use the closed form, not a loop"
            _saved = by_steps
            by_steps = None
            try:
                by_formula(3)
            except TypeError:
                assert False, "by_formula should use the closed form on its own, not call by_steps"
            by_steps = _saved
          wrong:
            - |
              def by_steps(n):
                  balance = 0
                  for month in range(n):
                      balance = 1.01 * (balance + 1000)
                  return balance


              def by_formula(n):
                  return 100000 * (1.01 ** n - 1)
            - |
              def by_steps(n):
                  balance = 0
                  for month in range(n):
                      balance = 1.01 * balance + 1000
                  return balance


              def by_formula(n):
                  return 1000 * (1.01 ** n - 1)
            - |
              def by_steps(n):
                  balance = 0
                  for month in range(n):
                      balance = 1.01 * balance + 1000
                  return balance


              def by_formula(n):
                  return by_steps(n)
          explanation: |
            The loop is the composition $s \circ s \circ \dots \circ s$ applied to 0, one application for each pass. The formula is the geometric series in closed form. They are the same sequence described twice, once by a recurrence and once by a formula, and their agreement to many decimal places is good evidence that the algebra is right.
          hints:
            - One pass of the loop is one application of the step function from the first stage.
            - The closed form is one line. Python writes a power with two stars.
      - question:
          id: one-year
          type: numeric
          system: s1
          concepts: [m2.sequences-and-series]
          prompt: Use either function. To the nearest rupee, what does the account hold after 12 months?
          answer: "12683"
          tolerance: "1"
          unit: rupees
          explanation: |
            $B_{12} = 100\,000\,(1.01^{12} - 1) \approx 12\,682.50$. You paid in ₹12 000, so the interest over the year is a little under ₹683. It is more than 12 months of 1% on a single deposit because the earlier deposits have been earning for longer.
          hints:
            - Call one of your functions in the editor.
            - You are asked for the nearest whole rupee.
  - title: Money left alone
    blocks:
      - text: |
          Now stop depositing. A lump sum left in the account is multiplied by 1.01 every month, so after $t$ months it has been multiplied by $1.01^{t}$. That is exponential growth, and its constant ratio is 1.01.
      - question:
          id: doubling
          type: numeric
          system: s2
          concepts: [m2.the-exponential-and-e]
          prompt: After how many whole months has a lump sum first at least doubled?
          answer: "70"
          unit: months
          explanation: |
            You need $1.01^{t} \ge 2$. Taking natural logarithms, $t \ln 1.01 \ge \ln 2$, so $t \ge \dfrac{\ln 2}{\ln 1.01} \approx 69.66$. The first whole month at or beyond that is the answer. The size of the lump sum never entered, which is the mark of exponential growth: the doubling time is the same from any starting amount.
          hints:
            - Write the condition for doubling as an inequality with $t$ in the exponent. Does the starting amount matter?
            - The natural logarithm brings an exponent down. Use the scratch editor for the arithmetic.
            - The result is not whole. Which way must you round for the money to have doubled?
      - text: |
          Any exponential can be written with base $e$. Since $1.01^{t} = e^{t \ln 1.01}$, the account grows as $e^{ct}$ with $c = \ln 1.01$.
      - question:
          id: rate
          type: choice
          system: s2
          concepts: [m2.the-exponential-and-e]
          prompt: "$\\ln 1.01 \\approx 0.00995$, which is slightly less than $0.01$. What does that say?"
          options:
            - Interest added once a month at 1% grows money slightly more slowly than growth at a continuous rate of 1% a month would.
            - The bank is paying slightly less than the 1% a month it promised.
            - The natural logarithm is only an approximation, so the two numbers are really equal.
            - Money in this account grows slightly faster than any exponential with base $e$.
          answer: 0
          explanation: |
            Growth at a continuous rate of 1% a month would multiply money by $e^{0.01} \approx 1.01005$ each month, a little more than 1.01. Going the other way, a monthly factor of exactly 1.01 corresponds to the slightly smaller continuous rate $\ln 1.01$. This is the compound-interest story that defined $e$: compounding more often helps, by less and less, up to a limit.
          hints:
            - Compare $e^{0.01}$ with $1.01$. Which is larger?
            - Recall how $e$ arose from compounding interest more and more often.
review: |
  You have described one savings plan in every way this cluster offers:

  - Each month's interest and deposit were functions, from [[m2.functions-as-machines]], and a month was their composition in the right order, from [[m2.composition-and-inverses]].
  - Running the plan backwards needed an inverse, and the reason one exists was that the step is a bijection, from [[m2.injective-surjective-and-bijective-maps]].
  - The balance after many months was a sum over the deposits, written in sigma notation from [[m2.summation-and-product-notation]], and that sum was a geometric series with a closed form, from [[m2.sequences-and-series]].
  - Money left alone grew exponentially, and its doubling time and its continuous rate came from [[m2.the-exponential-and-e]].

  Notice that the same balance had three descriptions: a recurrence, where each month is computed from the last, a sum, and a closed formula. Moving between such descriptions, and checking one against another with a short program, is something you will do constantly from here on.
