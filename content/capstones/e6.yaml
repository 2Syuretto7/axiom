review: |
  The file was empty, and it now holds a tensor that records its history, a backward pass, a numerical test of that pass, layers, an optimiser and a training loop. It found the water.

  - A result that keeps its operands and a pull for each was [[e6.scalar-computational-graph]], and the same idea with arrays, where a pull maps a gradient of the result to a share of the operand's shape, was [[e6.tensor-valued-autograd]].
  - Seeding the output with 1 and handing shares back, adding where paths meet, was [[e6.reverse-mode-on-scalars]]. Taking the tensors in an order that lets each collect everything before it hands anything on was [[e6.topological-ordering-of-the-graph]].
  - Summing a gradient back down to the shape of a bias was [[e6.broadcasting-in-the-backward-pass]].
  - Refusing to believe the engine until its gradients matched measured slopes, parameter by parameter, was [[e6.gradient-checking]].
  - The list of parameters, the clearing, the update written to the data and the velocity kept by the optimiser were [[e6.modules-parameters-and-optimisers]].
  - Recording the loss as a float, and nudging a parameter's array in place only when no backward pass was waiting on it, were [[e6.memory-planning-and-in-place-operations]].
  - Knowing that a linear model would stop at 2.4 and that a hidden layer with $\tanh$ would not, and running the loop that proved it, was [[e6.training-an-mlp-on-your-own-engine]].

  The engine in your file is small, and it is not a toy version of something else. The frameworks used to train the largest models are this design with more operations and faster arithmetic underneath: tensors that record their parents, a backward pass in reverse topological order, gradients that accumulate until cleared, parameters gathered into a list for an optimiser. When you next call `backward()` on someone else's engine, you will know what it is about to do, because you have done it.
