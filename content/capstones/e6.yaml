            assert _order[-1] is _f, "The node itself should come last"
            assert all(_order.index(parent) < _i for _i, _v in enumerate(_order) for parent, _pull in _v.parents), "Every tensor should come after all of its parents"
            backward(_f)
            assert _f.grad.tolist() == [1.0], "The gradient of the output is 1"
            assert _a.grad.tolist() == [39.0] and _b.grad.tolist() == [26.0] and _c.grad.tolist() == [6.0], "For s = a b, t = s + c, f = s t at 2, 3, 1 the gradients are 39, 26 and 6: a tensor used twice must collect both shares before it hands any on"
