      - text: |
          What is left is the bookkeeping of training. An optimiser holds the list of parameters, sets their gradients to zero before each backward pass, and moves each parameter against its gradient afterwards. With **momentum** $\mu$ it keeps a velocity for each parameter: the velocity becomes $\mu$ times the old velocity plus the gradient, and the parameter moves by the learning rate times the velocity.
