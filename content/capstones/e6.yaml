          solution: |
            import numpy as np


            class Tensor:
                def __init__(self, data, parents=()):
                    self.data = np.array(data) * 1.0
                    self.parents = parents
                    self.grad = np.zeros(self.data.shape)

                def __add__(self, other):
                    return Tensor(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

                def __sub__(self, other):
                    return Tensor(self.data - other.data, ((self, lambda g: g), (other, lambda g: -g)))

                def __mul__(self, other):
                    return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

                def __matmul__(self, other):
                    return Tensor(self.data @ other.data, ((self, lambda g: g @ other.data.T), (other, lambda g: self.data.T @ g)))

                def tanh(self):
                    t = np.tanh(self.data)
                    return Tensor(t, ((self, lambda g: g * (1 - t * t)),))

                def sum(self):
                    return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


            def topological(node):
                order = []
                seen = set()

                def visit(v):
                    if v in seen:
                        return
                    seen.add(v)
                    for parent, pull in v.parents:
                        visit(parent)
                    order.append(v)

                visit(node)
                return order


            def backward(node):
                node.grad = np.ones(node.data.shape)
                for v in topological(node)[::-1]:
                    for parent, pull in v.parents:
                        parent.grad = parent.grad + pull(v.grad)


            X = Tensor([[0, 1], [1, 1], [2, 1], [3, 1]])
            w = Tensor([[2], [1]])
            y = Tensor([[1], [3], [4], [6]])
            d = X @ w - y
            L = (d * d).sum()
            backward(L)
            print(float(L.data), w.grad.tolist())
          tests: |
