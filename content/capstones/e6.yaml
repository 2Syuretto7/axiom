          explanation: |
            The backward pass adds to gradients, as it must for a tensor used more than once. So they have to be cleared before each pass, and they have to still hold the result when the update reads them. A loss frozen to the last digit means that the parameters are not being written to. A loss that falls, overshoots and climbs back is the mark of gradients piling up.
