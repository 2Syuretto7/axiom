          explanation: |
            Each operation is two things written side by side: the forward value, and for each operand a pull. For $C = AB$ with gradient $G$ of the result, the shares are $G B^\top$ and $A^\top G$, and the shapes leave no other choice: only $G B^\top$ has the shape of $A$. For $\tanh$ the local slope is $1 - \tanh^2$, written with the result, which the forward pass has already computed.

            Swapping the two orders in the product's pulls fails on shape here because the matrices are not square, which is why the example's are 3 by 2 and 2 by 4. Squaring the operand in place of the result is right only at zero.
  - title: Walking it backwards
    blocks:
      - text: |
          The record is a graph. To turn it into gradients, set the gradient of the output to 1 and hand shares back from each tensor to its parents. A tensor must have received **all** of its own gradient before it hands any on, so the tensors are taken in an order in which every result comes before its operands.
      - question:
          id: why-order
          type: choice
          system: s2
          concepts: [e6.topological-ordering-of-the-graph, e6.reverse-mode-on-scalars]
          prompt: "`s = a * b`, `t = s + c`, `f = s * t`. The tensor `s` is used twice. Why must `t` be processed before `s` in the backward pass?"
          options:
            - "Because `t` was created after `s`, and tensors are always processed newest first."
            - "Because part of the gradient of `s` arrives through `t`. If `s` handed its gradient to `a` and `b` first, it would hand on only the share that came directly from `f`, and the share through `t` would arrive too late to be passed on."
            - "Because addition must be differentiated before multiplication."
            - "It need not be. Any order gives the same gradients."
          answer: 1
          explanation: |
            The gradient of `s` is a sum of two shares, one from each of its uses. Handing on a partial sum gives `a` and `b` partial gradients, with no error raised. A topological order lists every tensor after all of its parents, so its reverse lists every tensor before all of its parents, and by the time a tensor's turn comes everything computed from it has already paid in.
      - question:
