              import numpy as np


              class Tensor:
                  def __init__(self, data, parents=()):
                      self.data = np.array(data) * 1.0
                      self.parents = parents
                      self.grad = np.zeros(self.data.shape)

                  def __add__(self, other):
                      return Tensor(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

                  def __sub__(self, other):
                      return Tensor(self.data - other.data, ((self, lambda g: g), (other, lambda g: -g)))

                  def __mul__(self, other):
                      return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

                  def __matmul__(self, other):
                      return Tensor(self.data @ other.data, ((self, lambda g: g @ other.data.T), (other, lambda g: self.data.T @ g)))

                  def tanh(self):
                      t = np.tanh(self.data)
                      return Tensor(t, ((self, lambda g: g * (1 - t * t)),))

                  def sum(self):
                      return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


              def topological(node):
                  order = []
                  seen = set()

                  def visit(v):
                      if v in seen:
                          return
                      seen.add(v)
                      for parent, pull in v.parents:
                          visit(parent)
                      order.append(v)

                  visit(node)
                  return order


              def backward(node):
                  node.grad = np.ones(node.data.shape)

                  def walk(v):
                      for parent, pull in v.parents:
                          parent.grad = parent.grad + pull(v.grad)
                          walk(parent)

                  walk(node)


              print("2.0 [[10.0], [4.0]]")
          explanation: |
            `topological` is a depth-first walk that appends a tensor after visiting its parents, with a set of tensors already seen so that a shared tensor is listed once. `backward` seeds the output with ones and runs through that list reversed, adding each share.

            Going through the list forwards hands on gradients that are still zero. Overwriting in place of adding keeps only the last share to arrive. Leaving out the set lists a shared tensor once for every path to it, so it hands its gradient on more than once. Walking depth-first from the output without the ordering passes a partial gradient down and then passes the whole of the larger total down again.

