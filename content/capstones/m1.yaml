cluster: M1
title: Pricing a chai stall
minutes: 60
claim: You will have turned a chai stall's costs and customers into equations, found when it breaks even, compared two suppliers, and found the price that earns the most, first by algebra and then with a short program that checks it.
brief: |
  Algebra was taught to you one tool at a time. A real question does not say which tool it wants. This project is one question that needs most of the cluster, in the order the question demands and not in the order the lessons came.

  **The project.** You are planning a chai stall. You know what it costs to run, what a cup costs to make, and roughly how customers react to the price. You want to know three things: how many cups you must sell before the stall earns anything, which of two suppliers to use, and what price to charge.

  Every stage sets up an expression or an equation from a description in words, and that setting up is most of the work. Nothing here is new. When you are unsure how to begin, ask what the unknown is, give it a letter, and write down what the words say about it.

  Keep your results on paper as you go. Later stages use earlier ones.
starter: |
  # Scratch space for the stall. Try an expression on a few values here.
  n = 120
  print(10 * n - (600 + 4 * n))
stages:
  - title: Profit as an expression
    blocks:
      - text: |
          The stall costs ₹600 a day to run, whether or not anyone comes. That covers the rent of the spot, the gas and your helper. Each cup of chai costs ₹4 to make, and you sell it for ₹10.

          Let $n$ be the number of cups sold in a day. The day's **profit** is the money taken in, less everything spent.
      - question:
          id: profit-expression
          type: choice
          system: s1
          concepts: [m1.variables-and-expressions]
          prompt: Which expression, fully simplified, is the day's profit in rupees?
          options:
            - "$6n - 600$"
            - "$14n - 600$"
            - "$6n + 600$"
            - "$10n - 604$"
          answer: 0
          explanation: |
            Money in is $10n$. Money out is $600 + 4n$. Subtracting the whole of what is spent, $10n - (600 + 4n) = 10n - 600 - 4n = 6n - 600$. The bracket matters: both the 600 and the $4n$ are taken away.
      - question:
          id: break-even
          type: numeric
          system: s2
          concepts: [m1.linear-equations]
          prompt: How many cups must you sell in a day for the profit to be exactly zero?
          answer: "100"
          unit: cups
          explanation: |
            Breaking even means $6n - 600 = 0$. Adding 600 to both sides gives $6n = 600$, and dividing both sides by 6 gives $n = 100$. Check by substitution: 100 cups bring in ₹1000 and cost $600 + 400 = 1000$.
      - question:
          id: target
          type: numeric
          system: s2
          concepts: [m1.inequalities-and-absolute-value]
          prompt: You want a profit of at least ₹900 a day. What is the smallest number of cups that achieves it?
          answer: "250"
          unit: cups
          explanation: |
            "At least 900" is the inequality $6n - 600 \ge 900$, so $6n \ge 1500$ and $n \ge 250$. Dividing by a positive number keeps the direction of the sign. The solutions are every $n$ from 250 upwards, and the smallest of them is the answer.
  - title: Two suppliers, two lines
    blocks:
      - text: |
          A second supplier offers a machine that makes each cup for ₹2 instead of ₹4, but renting it raises the daily running cost from ₹600 to ₹900. Call the present arrangement plan A and the new one plan B. The selling price stays ₹10.

          Each plan's profit, plotted against $n$, is a straight line. Work out plan B's profit expression for yourself before going on.
      - question:
          id: crossover
          type: numeric
          system: s2
          concepts: [m1.simultaneous-equations, m1.straight-lines-and-slope, m1.linear-equations]
          prompt: At how many cups a day do the two plans give exactly the same profit?
          answer: "150"
          unit: cups
          explanation: |
            Plan B's profit is $10n - (900 + 2n) = 8n - 900$. The plans agree where $6n - 600 = 8n - 900$. Subtracting $6n$ from both sides and adding 900 gives $300 = 2n$, so $n = 150$. On a graph this is the point where the two lines cross, and both give a profit of ₹300 there.
      - question:
          id: steeper
          type: choice
          system: s2
          concepts: [m1.straight-lines-and-slope, m1.inequalities-and-absolute-value]
          prompt: On a busy day you sell more cups than the number at which the plans agree. Which plan earns more, and why?
          options:
            - Plan B, because its line has the greater slope, so each extra cup adds more profit than it does under plan A.
            - Plan A, because its line has the greater intercept, so it starts ahead and stays ahead.
            - Plan A, because its running cost is lower on every day.
            - They earn the same, because lines that cross once have the same profit from then on.
          answer: 0
          explanation: |
            The slope of a profit line is the profit added by one more cup: ₹6 for plan A and ₹8 for plan B. Plan A starts ahead, losing only ₹600 at $n = 0$ against ₹900, but plan B gains on it by ₹2 with every cup, draws level where the lines cross and is ahead for every $n$ beyond that.
  - title: The price changes the customers
    blocks:
      - text: |
          So far the price was fixed at ₹10. But price and customers are tied together. From watching other stalls you estimate that at a price of $p$ rupees you would sell

          $$n = 400 - 20p$$

          cups a day, for prices between ₹0 and ₹20. Each extra rupee on the price loses 20 customers.

          Stay with plan A: each cup costs ₹4 to make and the stall costs ₹600 a day. Each cup sold now earns $p - 4$ rupees, so the day's profit is

          $$(p - 4)(400 - 20p) - 600.$$
      - question:
          id: expand
          type: choice
          system: s1
          concepts: [m1.quadratics, m1.variables-and-expressions]
          prompt: Which is that profit, expanded and with like terms collected?
          options:
            - "$-20p^2 + 480p - 2200$"
            - "$-20p^2 + 400p - 2200$"
            - "$-20p^2 + 480p - 1000$"
            - "$20p^2 + 480p - 2200$"
          answer: 0
          explanation: |
            Multiply each term of the first bracket by each term of the second: $400p - 20p^2 - 1600 + 80p$. Collecting like terms gives $-20p^2 + 480p - 1600$, and taking away the 600 leaves $-20p^2 + 480p - 2200$.
      - text: |
          The profit is a quadratic in $p$ whose $p^2$ term is negative, so its graph is a parabola that opens downwards. It has a highest point.
      - question:
          id: best-price
          type: numeric
          system: s2
          concepts: [m1.quadratics]
          prompt: What price, in rupees, gives the greatest daily profit?
          answer: "12"
          unit: rupees
          explanation: |
            Complete the square: $-20p^2 + 480p - 2200 = -20(p^2 - 24p) - 2200 = -20(p - 12)^2 + 2880 - 2200$. The squared term is never positive, so the profit is greatest when it is zero, at $p = 12$. The same price comes from the factorised form: the profit before the running cost, $(p - 4)(400 - 20p)$, is zero at $p = 4$ and $p = 20$, and a parabola's turning point lies midway between its roots.
      - question:
          id: best-profit
          type: numeric
          system: s2
          concepts: [m1.quadratics, m1.variables-and-expressions]
          prompt: What is the daily profit, in rupees, at that price?
          answer: "680"
          unit: rupees
          explanation: |
            Substitute the best price into either form. Each cup then earns $12 - 4 = 8$ rupees and $400 - 240 = 160$ cups are sold, so the profit is $8 \times 160 - 600 = 680$. The completed square gives the same number, $2880 - 2200$.
      - question:
          id: lowest-price
          type: numeric
          system: s2
          concepts: [m1.quadratics]
          prompt: Below a certain price the stall loses money, because each cup earns too little. What is the lowest price at which the stall breaks even? Give it to two decimal places.
          answer: "6.17"
          tolerance: "0.01"
          unit: rupees
          explanation: |
            Breaking even means $-20p^2 + 480p - 2200 = 0$. Dividing by $-20$ gives $p^2 - 24p + 110 = 0$, which does not factorise over the whole numbers. The quadratic formula gives $p = \dfrac{24 \pm \sqrt{576 - 440}}{2} = 12 \pm \sqrt{34}$, and $\sqrt{34} \approx 5.83$. The two break-even prices are about 6.17 and 17.83, placed evenly on either side of the best price, as a parabola's symmetry requires.
  - title: Let the machine check the algebra
    blocks:
      - text: |
          Algebra found the best price exactly. A program can find it by trying every whole-rupee price, and the two should agree. It can also do what the algebra would have to be redone for: answer the same question for plan B, or for any other costs.
      - question:
          id: search
          type: code
          mode: write
          system: s2
          concepts: [m1.quadratics, m1.variables-and-expressions, e0.functions, e0.loops]
          prompt: |
            Write two functions.

            `profit(p, cost, fixed)` returns the day's profit at price `p`, when each cup costs `cost` to make and the stall costs `fixed` a day to run. The number of cups sold is still $400 - 20p$.

            `best_price(cost, fixed)` tries every whole-rupee price from 0 to 20 and returns the **price** that gives the greatest profit.
          starter: |
            def profit(p, cost, fixed):
                return 0


            def best_price(cost, fixed):
                return 0
          solution: |
            def profit(p, cost, fixed):
                return (p - cost) * (400 - 20 * p) - fixed


            def best_price(cost, fixed):
                best = 0
                for p in range(21):
                    if profit(p, cost, fixed) > profit(best, cost, fixed):
                        best = p
                return best
          tests: |
            assert profit(10, 4, 600) == 600, "profit is wrong at a price of 10 on plan A: each cup earns the price less its cost"
            assert profit(4, 4, 600) == -600, "when the price equals the cost of a cup, the whole running cost is lost"
            assert profit(20, 2, 900) == -900, "at a price of 20 nobody buys, so only the running cost remains"
            _found = best_price(4, 600)
            assert _found is not None, "best_price must return the price, not print it"
            assert 0 <= _found <= 20, "best_price should return a price, not a profit"
            assert profit(_found, 4, 600) == max(profit(_p, 4, 600) for _p in range(21)), "that is not the best whole-rupee price on plan A: compare with your algebra"
            assert profit(best_price(2, 900), 2, 900) == max(profit(_p, 2, 900) for _p in range(21)), "that is not the best price on plan B, where the cost of a cup is different"
            assert best_price(8, 0) == 14 and best_price(0, 0) == 10, "the best price should move when the cost of a cup changes"
          wrong:
            - |
              def profit(p, cost, fixed):
                  return (p - cost) * (400 - 20 * p) - fixed


              def best_price(cost, fixed):
                  best = 0
                  for p in range(21):
                      if profit(p, cost, fixed) > best:
                          best = profit(p, cost, fixed)
                  return best
            - |
              def profit(p, cost, fixed):
                  return (p - cost) * (400 - 20 * p) - fixed


              def best_price(cost, fixed):
                  best = 0
                  for p in range(21):
                      if p * (400 - 20 * p) > best * (400 - 20 * best):
                          best = p
                  return best
            - |
              def profit(p, cost, fixed):
                  return p * (400 - 20 * p) - cost - fixed


              def best_price(cost, fixed):
                  best = 0
                  for p in range(21):
                      if profit(p, cost, fixed) > profit(best, cost, fixed):
                          best = p
                  return best
          explanation: |
            `profit` is the expression from the last stage with its numbers replaced by parameters. `best_price` is the search for an extreme from the loops lesson, with one care: it remembers the best **price** seen so far and compares profits, because the price is what was asked for. On plan A it agrees with the algebra. On plan B it returns 11: a cheaper cup moves the lower root of the parabola from 4 to 2, so the midpoint of the roots moves too.
  - title: Growing the stall
    blocks:
      - text: |
          At the best price on plan A the stall sells 160 cups a day. Suppose word spreads, and the number of cups sold each day grows by 8% every week, with the price left alone.

          Growing by 8% means multiplying by 1.08. After $w$ weeks the stall sells $160 \times 1.08^{w}$ cups a day. Your kettles can make at most 400 cups a day.
      - question:
          id: weeks
          type: numeric
          system: s2
          concepts: [m1.logarithms, m1.exponent-laws]
          prompt: After how many whole weeks does the number of cups first reach or pass 400 a day? Use the scratch editor for the arithmetic, where `math.log` is available.
          answer: "12"
          unit: weeks
          explanation: |
            You need $160 \times 1.08^{w} \ge 400$, that is $1.08^{w} \ge 2.5$. The unknown is an exponent, which is exactly what a logarithm finds: $w \ge \dfrac{\log 2.5}{\log 1.08} \approx 11.9$. The first whole number of weeks at or beyond that is the answer. Growth by a fixed percentage is exponential, which is why sales multiply by two and a half in about a dozen weeks although 8% sounds small.
review: |
  You began with three sentences about costs and ended with a price, a supplier and a date by which you will need more kettles. Every step was a piece of this cluster:

  - Turning words into $6n - 600$ was [[m1.variables-and-expressions]].
  - Breaking even was an equation solved by doing the same to both sides, from [[m1.linear-equations]], and the daily target was an inequality, from [[m1.inequalities-and-absolute-value]].
  - The two suppliers were two lines. Where they cross came from [[m1.simultaneous-equations]], and which one wins beyond the crossing came from reading slope as a rate, in [[m1.straight-lines-and-slope]].
  - Once the price could change, profit became a parabola, and its turning point and its roots came from [[m1.quadratics]].
  - The stall's growth put the unknown in an exponent, which [[m1.exponent-laws]] describes and [[m1.logarithms]] solves.

  Notice also what the program was for. The algebra gave an exact answer and a reason for it. The program checked that answer and then answered the same question for other costs with no further thought. Much of what comes later works this way: derive by hand so that you understand, then compute so that you can do it at scale, and make sure the two agree.
