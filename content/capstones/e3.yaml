                    return graph


                import heapq


                def fastest(graph, start, goal):
                    best = {start: 0}
                    heap = [(0, start)]
                    while heap:
                        minutes, here = heapq.heappop(heap)
                        if here == goal:
                            return minutes
                        if minutes == best[here]:
                            for there, leg in graph[here].items():
                                if there not in best or minutes + leg < best[there]:
                                    best[there] = minutes + leg
                                    heapq.heappush(heap, (best[there], there))
                    return None


                import bisect


                def next_departure(times, now):
                    i = bisect.bisect_left(times, now)
                    if i == len(times):
                        return None
                    return times[i]


                def plan(edges, timetable, start, goal, now):
                    minutes = fastest(build(edges), start, goal)
                    leave = next_departure(sorted(timetable[start]), now)
                    if minutes is None:
                        return None
                    return (leave, minutes)
          explanation: |
            Each line of `plan` hands one question to the structure that suits it. The graph is built once into dictionaries, the heap finds the least time, and the timetable is sorted so that binary search can find the train. Binary search on an unsorted list does not fail loudly; it quietly returns a wrong time, which is why the sorting cannot be skipped. `sorted` makes a new list, so the operator's timetable is left as it was. In a real planner the sorting and the building would be done once, when the data arrive, and not for every passenger.
          hints:
            - There are three questions inside this one. How long is the quickest route, when is the next train, and are both of those answers real?
            - Binary search promises a right answer only for a list in a particular state. Is the timetable in that state?
            - Either of your helpers may return None. What should plan do then?
review: |
  You have a planner, and every part of it is a choice between structures:

  - The network became a dictionary of dictionaries, so that a station's neighbours and a leg's time are each one lookup, from [[e3.hash-tables]] and [[e3.graphs-and-traversal]].
  - The fewest stops came from a queue, from [[e3.stacks-and-queues]], because giving stations back in the order they were found is what makes the first arrival the nearest.
  - The least time came from a heap, from [[e3.trees-and-heaps]], used the way [[e3.shortest-paths-and-beam-search]] uses it, because legs of different lengths need stations in order of time and not of hops.
  - The next train came from a sorted list, from [[e3.sorting]], searched by halving, from [[e3.binary-search]].

  Notice that two of the stages differ in one thing only. Swap the queue for a heap and breadth-first search becomes Dijkstra's algorithm, and the question answered changes from fewest hops to least time. The structure you choose decides what the algorithm computes as well as how fast it runs.
