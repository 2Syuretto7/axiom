cluster: M0
title: Will the photographs fit?
minutes: 40
claim: You will have worked out, by hand and from the size of a single picture, how many years of photographs a storage drive can hold, and caught a wrong answer by its size alone.
brief: |
  Every lesson in this cluster answered one kind of question about numbers. Real questions do not arrive sorted by lesson. This one needs most of the cluster at once.

  **The question.** A phone takes photographs. You want to know whether the photographs you keep will fit on a storage drive, and for how many years.

  Nothing here is new. Each stage is a step you already know how to take, and the work is in seeing which lesson each step belongs to and carrying one stage's result into the next. Keep your results on paper as you go, because later stages use them.

  A computer's storage is counted in **bytes**. A byte is simply the unit, in the way a metre is the unit of length. That is all you need to know about it.
stages:
  - title: One photograph, counted exactly
    blocks:
      - text: |
          A photograph is a grid of small coloured squares called pixels. This phone's photographs are 4000 pixels wide and 3000 pixels high.
      - question:
          id: pixels
          type: numeric
          system: s1
          concepts: [m0.the-four-operations-and-order-of-operations, m0.whole-numbers-and-place-value]
          prompt: How many pixels are in one photograph?
          answer: "12000000"
          unit: pixels
          explanation: |
            $4000 \times 3000 = (4 \times 3) \times (1000 \times 1000) = 12 \times 1\,000\,000$. Multiply the leading digits, then let place value carry the zeros.
      - text: |
          Each pixel's colour is stored as three numbers, one each for red, green and blue, and each of those numbers takes one byte.
      - question:
          id: raw-bytes
          type: numeric
          system: s1
          concepts: [m0.the-four-operations-and-order-of-operations]
          prompt: How many bytes does one photograph take when every pixel is stored in full?
          answer: "36000000"
          unit: bytes
          explanation: Three bytes for each of 12 000 000 pixels is $3 \times 12\,000\,000 = 36\,000\,000$ bytes.
  - title: The photograph as it is actually saved
    blocks:
      - text: |
          Phones do not save every pixel in full. They compress the picture. For this phone, the saved file is $\dfrac{1}{12}$ of the full size.
      - question:
          id: compressed
          type: numeric
          system: s2
          concepts: [m0.fractions]
          prompt: How many bytes is one saved photograph?
          answer: "3000000"
          unit: bytes
          explanation: |
            $\dfrac{1}{12}$ of $36\,000\,000$ is $36\,000\,000 \div 12 = 3\,000\,000$. Taking a twelfth is dividing into twelve equal parts and keeping one.
      - text: |
          A newer way of saving makes each file 40% smaller than the saved size you just found. You will not use it in the later stages, but you should be able to say what it would give.
      - question:
          id: newer-format
          type: numeric
          system: s2
          concepts: [m0.decimals-and-percentages, m0.fractions]
          prompt: How many bytes would one photograph take in the newer format?
          answer: "1800000"
          unit: bytes
          explanation: |
            40% smaller leaves 60% of the size, and $0.6 \times 3\,000\,000 = 1\,800\,000$. Finding 40% and stopping there gives the amount removed, not the amount left.
  - title: A year of photographs
    blocks:
      - text: |
          You take 250 photographs a month. Looking back over old months, you find that you keep 3 of every 10 and delete the rest.
      - question:
          id: kept-per-year
          type: numeric
          system: s2
          concepts: [m0.ratio-and-proportion, m0.the-four-operations-and-order-of-operations]
          prompt: At that rate, how many photographs do you keep in a year?
          answer: "900"
          unit: photographs
          explanation: |
            Keeping 3 of every 10 is a rate of $\dfrac{3}{10}$ kept per photograph taken. A month gives $250 \times \dfrac{3}{10} = 75$, and twelve months give $75 \times 12 = 900$.
      - text: |
          Before multiplying anything out, estimate. You keep roughly a thousand photographs a year, and each one takes a few million bytes.
      - question:
          id: magnitude
          type: choice
          system: s1
          concepts: [m0.estimation-and-orders-of-magnitude, m0.powers-and-roots]
          prompt: Which power of ten is nearest to the number of bytes a year of kept photographs takes?
          options:
            - "$10^{6}$"
            - "$10^{7}$"
            - "$10^{9}$"
            - "$10^{12}$"
          answer: 2
          explanation: |
            A thousand is $10^3$ and a million is $10^6$. Multiplying adds the exponents: $10^3 \times 10^6 = 10^9$. The "few" in front does not change the order of magnitude.
      - question:
          id: year-bytes
          type: choice
          system: s2
          concepts: [m0.estimation-and-orders-of-magnitude, m0.the-four-operations-and-order-of-operations]
          prompt: Now exactly. Using your count of kept photographs and the saved size of one photograph, how many bytes does a year take, in scientific notation?
          options:
            - "$2.7 \\times 10^{9}$"
            - "$2.7 \\times 10^{8}$"
            - "$27 \\times 10^{9}$"
            - "$9 \\times 10^{9}$"
          answer: 0
          explanation: |
            $900 \times 3\,000\,000 = 2\,700\,000\,000$. In scientific notation the front number lies between 1 and 10, so this is $2.7 \times 10^{9}$. It agrees with the estimate of $10^9$, which is the reason for estimating first.
  - title: The drive, and the phone
    blocks:
      - text: |
          The storage drive holds $64 \times 10^{9}$ bytes.
      - question:
          id: years-fit
          type: numeric
          system: s2
          concepts: [m0.estimation-and-orders-of-magnitude, m0.the-four-operations-and-order-of-operations, m0.powers-and-roots]
          prompt: How many **whole** years of kept photographs fit on the drive?
          answer: "23"
          unit: years
          explanation: |
            Both numbers carry the same power of ten, so it cancels: $\dfrac{64 \times 10^9}{2.7 \times 10^9} = \dfrac{64}{2.7}$, which is a little under 24, because $2.7 \times 24 = 64.8$ is just too much. Part of a year does not count as a whole one, so the answer rounds down.
      - text: |
          The phone itself is fuller. It has $2000$ million bytes free today. Suppose you kept one more year of photographs on the phone without moving any to the drive.
      - question:
          id: free-after
          type: numeric
          system: s2
          concepts: [m0.negative-numbers]
          prompt: Work in millions of bytes. What would the phone's free space be after that year? Give the number with its sign.
          answer: "-700"
          unit: million bytes
          explanation: |
            A year takes $2700$ million bytes, and $2000 - 2700 = -700$. The negative sign is the answer's meaning: the phone is 700 million bytes short, so the photographs do not fit.
  - title: Catching a wrong answer
    blocks:
      - text: |
          A friend does the same calculation on a calculator and tells you that a year of your photographs takes 27 000 000 bytes.
      - question:
          id: sanity
          type: choice
          system: s2
          concepts: [m0.estimation-and-orders-of-magnitude, m0.ratio-and-proportion]
          prompt: Which observation shows fastest that the friend's figure cannot be right?
          options:
            - It is the size of only nine saved photographs, and you keep hundreds in a year.
            - It is an even number, and a count of bytes for a year must be odd.
            - It has fewer digits than the drive's size, so it must be too small.
            - It does not end in enough zeros to be a number of bytes.
          answer: 0
          explanation: |
            One saved photograph is 3 000 000 bytes, so 27 000 000 bytes is $27 \div 3 = 9$ photographs. A year holds hundreds. The friend's figure is a hundred times too small, which is the kind of slip a mistyped zero or two produces, and an estimate catches it without redoing the sum.
review: |
  You started with the width and height of one picture and ended with a decision about where the photographs you keep can live, and for how long.

  Each step came from a lesson you have finished:

  - Counting the pixels and the bytes was [[m0.the-four-operations-and-order-of-operations]], with [[m0.whole-numbers-and-place-value]] carrying the zeros.
  - The saved size was a fraction of an amount, from [[m0.fractions]], and the newer format was a percentage left over, from [[m0.decimals-and-percentages]].
  - "3 of every 10" became a rate per photograph, from [[m0.ratio-and-proportion]].
  - Estimating $10^3 \times 10^6$ before multiplying, writing the result in scientific notation and cancelling the powers of ten were [[m0.powers-and-roots]] and [[m0.estimation-and-orders-of-magnitude]].
  - The phone's shortfall was a subtraction that went past zero, from [[m0.negative-numbers]].

  The habit worth keeping is the order of the third stage: estimate first, then compute, then compare the two. An estimate that disagrees with a computed answer tells you one of them is wrong before you have trusted either.
