cluster: M10
title: The cheapest tin
minutes: 75
claim: You will have found the shape of the one-litre tin that uses the least metal, proved that it is the least, confirmed it with a descent you programmed, priced a small manufacturing error, and checked by integration that a filling machine fills it exactly.
brief: |
  Calculus was built to answer questions of two kinds: where is something largest or smallest, and how much has accumulated. This project asks both about one object.

  **The project.** A factory makes cylindrical tins that must hold exactly one litre, which is $1000\ \text{cm}^3$. A tin can be tall and thin or short and wide. Metal costs money, so the factory wants the shape with the smallest surface, top and bottom included. Then it wants to know how much a small error in the radius costs, and whether its filling machine delivers the right amount.

  A cylinder of radius $r$ and height $h$, both in centimetres, has volume $\pi r^2 h$. Its surface is two discs and a side that unrolls into a rectangle: $2\pi r^2 + 2\pi r h$.

  Nothing here is new. Every step is a lesson of this cluster, used for a purpose. Keep your results as you go.
starter: |
  # Scratch space for the tin.
  import math

  for r in [2, 4, 6, 8]:
      h = 1000 / (math.pi * r * r)
      print(r, round(h, 2), round(2 * math.pi * r * r + 2 * math.pi * r * h, 1))
stages:
  - title: One variable, not two
    blocks:
      - text: |
          The surface depends on $r$ and $h$, but they are not free: the volume ties them together. Use $\pi r^2 h = 1000$ to remove $h$, so that the surface is a function of $r$ alone. Call it $S(r)$, for $r > 0$.
      - question:
          id: surface
          type: choice
          system: s1
          concepts: [m10.maxima-and-minima]
          prompt: Which is $S(r)$?
          options:
            - "$2\\pi r^2 + \\dfrac{2000}{r}$"
            - "$2\\pi r^2 + \\dfrac{1000}{r}$"
            - "$2\\pi r^2 + 2000r$"
            - "$\\pi r^2 + \\dfrac{2000}{r}$"
          answer: 0
          explanation: |
            From the volume, $h = \dfrac{1000}{\pi r^2}$. The side is then $2\pi r h = 2\pi r \cdot \dfrac{1000}{\pi r^2} = \dfrac{2000}{r}$, and the two discs are $2\pi r^2$.
          hints:
            - Solve the volume equation for $h$.
            - Substitute that $h$ into the side of the tin and simplify.
      - question:
          id: ends
          type: choice
          system: s2
          concepts: [m10.limits-and-continuity, m10.maxima-and-minima]
          prompt: Before differentiating, look at the two extremes. What happens to $S(r)$ as $r \to 0^{+}$ and as $r \to \infty$, and what does that suggest?
          options:
            - It grows without bound at both ends, the first because of $\dfrac{2000}{r}$ and the second because of $2\pi r^2$. Being continuous in between, it must have a smallest value somewhere in the middle.
            - It tends to 0 at both ends, so the smallest value is approached but never reached.
            - It grows without bound as $r \to 0^{+}$ and tends to 0 as $r \to \infty$, so wider is always better.
            - It tends to 0 as $r \to 0^{+}$ and grows without bound as $r \to \infty$, so thinner is always better.
          answer: 0
          explanation: |
            A very thin tin must be enormously tall to hold a litre, and its side, $\dfrac{2000}{r}$, blows up. A very wide tin has enormous discs, $2\pi r^2$. A continuous function that is huge at both ends of its domain comes down and goes back up, so a smallest value exists at some interior $r$. The derivative will find it.
          hints:
            - Take the two terms one at a time. Which one is large when $r$ is tiny, and which when $r$ is huge?
            - Picture the graph of a continuous function that is very large at both ends.
  - title: Where the slope is zero
    blocks:
      - question:
          id: derivative
          type: choice
          system: s1
          concepts: [m10.differentiation-rules]
          prompt: Which is $S'(r)$?
          options:
            - "$4\\pi r - \\dfrac{2000}{r^2}$"
            - "$4\\pi r + \\dfrac{2000}{r^2}$"
            - "$2\\pi r - \\dfrac{2000}{r^2}$"
            - "$4\\pi r - \\dfrac{2000}{r}$"
          answer: 0
          explanation: |
            Write $\dfrac{2000}{r}$ as $2000 r^{-1}$. By the power rule its derivative is $-2000 r^{-2}$, and the derivative of $2\pi r^2$ is $4\pi r$.
          hints:
            - Write the second term as a power of $r$ with a negative exponent.
            - The power rule brings the exponent down and lowers it by one.
      - question:
          id: best-radius
          type: numeric
          system: s2
          concepts: [m10.maxima-and-minima, m10.differentiation-rules]
          prompt: At what radius is $S'(r) = 0$? Give it in centimetres to two decimal places.
          answer: "5.42"
          tolerance: "0.01"
          unit: cm
          explanation: |
            $4\pi r = \dfrac{2000}{r^2}$ gives $r^3 = \dfrac{500}{\pi}$, so $r = \sqrt[3]{500 / \pi} \approx 5.42$. It is the only positive solution, so it is the only place where the tangent is flat.
          hints:
            - Set the derivative equal to zero and multiply through by $r^2$.
            - You will reach an equation for $r^3$. Use the scratch editor for the cube root, written as a power of one third.
  - title: Is it really the least?
    blocks:
      - text: |
          A flat tangent could be a minimum, a maximum or neither. The second derivative says how the graph bends.
      - question:
          id: convex
          type: choice
          system: s2
          concepts: [m10.second-derivative-and-curvature, m10.maxima-and-minima]
          prompt: What is $S''(r)$, and what does it tell you?
          options:
            - "$4\\pi + \\dfrac{4000}{r^3}$, which is positive for every $r > 0$. The graph bends upwards everywhere, so the one flat point is the lowest point of the whole curve."
            - "$4\\pi + \\dfrac{4000}{r^3}$, which is positive at the flat point only. It is a local minimum, and there may be lower points elsewhere."
            - "$4\\pi - \\dfrac{4000}{r^3}$, which changes sign. The flat point is a point of inflection."
            - "$4\\pi - \\dfrac{2000}{r^3}$, which is negative for small $r$. The flat point is a maximum."
          answer: 0
          explanation: |
            Differentiating $4\pi r - 2000 r^{-2}$ gives $4\pi + 4000 r^{-3}$. Both terms are positive whenever $r > 0$, so $S$ is convex on its whole domain. A convex function with a flat point has its global minimum there: the slope is negative everywhere to the left of it and positive everywhere to the right.
          hints:
            - Differentiate $S'(r)$ once more, taking care with the sign that the negative exponent brings down.
            - Is your result positive only at one radius, or at every positive radius? What does that say about the shape of the whole graph?
      - question:
          id: proportions
          type: numeric
          system: s2
          concepts: [m10.maxima-and-minima]
          prompt: For the best tin, how many times its radius is its height? That is, what is $h / r$?
          answer: "2"
          explanation: |
            At the best radius, $r^3 = \dfrac{500}{\pi}$, so $\pi r^3 = 500$. Then $\dfrac{h}{r} = \dfrac{1000}{\pi r^2 \cdot r} = \dfrac{1000}{\pi r^3} = \dfrac{1000}{500} = 2$. The height equals the diameter: seen from the side, the cheapest tin is a square. The answer is exact, and the awkward cube root has cancelled.
          hints:
            - Write $h / r$ using the formula for $h$ from the first stage.
            - You know what $\pi r^3$ equals at the best radius. Use that instead of a decimal.
      - question:
          id: least-area
          type: numeric
          system: s1
          concepts: [m10.maxima-and-minima]
          prompt: What is the least surface, in square centimetres, to one decimal place?
          answer: "553.6"
          tolerance: "0.1"
          unit: cm²
          explanation: |
            Substituting $r \approx 5.4193$ gives $S \approx 184.5 + 369.1 = 553.6$. The side uses exactly twice the metal of the two discs together, which is another way of seeing the square profile.
          hints:
            - Substitute the best radius into $S(r)$, keeping more decimal places than you were asked to report.
            - Use the scratch editor for the arithmetic.
  - title: Let the machine walk downhill
    blocks:
      - text: |
          The algebra worked because $S'(r) = 0$ could be solved by hand. Most functions worth minimising do not allow that. The method that always applies is to estimate the slope numerically and take small steps downhill.

          Write it for any function, then try it on the tin.
      - question:
          id: descend
          type: code
          mode: write
          system: s2
          concepts: [m10.derivative-as-slope-and-rate, m10.maxima-and-minima]
          prompt: |
            Write two functions.

            `slope(f, x)` estimates $f'(x)$ from two values of $f$ close to $x$, using a small step such as `0.00001`.

            `descend(f, x, rate, steps)` starts at `x` and repeats this `steps` times: move `x` against the slope by `rate` times the slope. It returns the final `x`.
          starter: |
            def slope(f, x):
                return 0


            def descend(f, x, rate, steps):
                return x
          solution: |
            def slope(f, x):
                h = 0.00001
                return (f(x + h) - f(x - h)) / (2 * h)


            def descend(f, x, rate, steps):
                for step in range(steps):
                    x = x - rate * slope(f, x)
                return x
          tests: |
            import math as _math
            assert abs(slope(lambda x: x * x, 3) - 6) < 1e-3, "the slope of x squared at 3 should be close to 6"
            assert abs(slope(lambda x: 5, 2)) < 1e-3, "a constant function has slope zero"
            assert abs(slope(lambda x: x ** 3, -2) - 12) < 1e-3, "the estimate should be a difference of two values divided by the distance between their inputs"
            assert descend(lambda x: x * x, 4, 0.1, 0) == 4, "with no steps, x does not move"
            assert abs(descend(lambda x: x * x, 1, 0.25, 1) - 0.5) < 1e-3, "one step moves x by rate times the slope, against the slope"
            assert abs(descend(lambda x: (x - 3) ** 2, 0, 0.1, 100) - 3) < 1e-3, "descending a bowl should arrive at its lowest point"
            _tin = lambda r: 2 * _math.pi * r * r + 2000 / r
            assert abs(descend(_tin, 3, 0.01, 200) - (500 / _math.pi) ** (1 / 3)) < 1e-3, "on the tin, the descent should arrive at the radius the algebra found"
          wrong:
            - |
              def slope(f, x):
                  h = 0.00001
                  return (f(x + h) - f(x - h)) / (2 * h)


              def descend(f, x, rate, steps):
                  for step in range(steps):
                      x = x + rate * slope(f, x)
                  return x
            - |
              def slope(f, x):
                  h = 0.00001
                  return f(x + h) - f(x - h)


              def descend(f, x, rate, steps):
                  for step in range(steps):
                      x = x - rate * slope(f, x)
                  return x
            - |
              def slope(f, x):
                  h = 0.00001
                  return (f(x + h) - f(x - h)) / (2 * h)


              def descend(f, x, rate, steps):
                  for step in range(steps):
                      x = x - slope(f, x)
                  return x
          explanation: |
            `slope` is the definition of the derivative with the limit left unfinished: a difference of two values divided by the distance between their inputs, for a small distance. `descend` uses only the sign and size of that slope. Where the slope is positive the function rises to the right, so it steps left, and the step shrinks as the slope flattens near the bottom. Starting from $r = 3$ it reaches the radius you found by algebra, without ever being told the formula for $S'$.
          hints:
            - The derivative is the limit of a difference quotient. Compute that quotient for one small step instead of taking the limit.
            - If the slope at x is positive, in which direction does the function get smaller?
            - Each pass changes x by rate times the slope, in the downhill direction.
  - title: The price of a small error
    blocks:
      - text: |
          The machines that cut the metal are not perfect. Suppose a batch is made with a radius $0.1\ \text{cm}$ larger than the best one, with the height adjusted so that the tin still holds a litre.

          The tangent line predicts no extra metal at all, because the slope at the minimum is zero. The first correction that does not vanish is the quadratic one: near a point $a$,

          $$S(a + d) \approx S(a) + S'(a)\,d + \tfrac{1}{2} S''(a)\,d^2.$$
      - question:
          id: error-cost
          type: numeric
          system: s2
          concepts: [m10.taylor-approximation, m10.second-derivative-and-curvature]
          prompt: Using that approximation, how many extra square centimetres of metal does each tin of the batch use? Give two decimal places.
          answer: "0.19"
          tolerance: "0.006"
          unit: cm²
          explanation: |
            At the best radius $\pi r^3 = 500$, so $S'' = 4\pi + \dfrac{4000}{r^3} = 4\pi + 8\pi = 12\pi$. The extra metal is about $\tfrac{1}{2} \times 12\pi \times 0.1^2 = 0.06\pi \approx 0.19$. Computing $S$ exactly at the two radii gives $0.186$, so the quadratic estimate is good. An error of 2% in the radius costs about 0.03% in metal. Near a minimum a function is flat, which makes minima forgiving, and is also why a descent slows down as it arrives.
          hints:
            - Which term of the approximation is zero at a minimum?
            - Evaluate the second derivative at the best radius. The fact that $\pi r^3$ has a simple value there helps.
            - Substitute $d = 0.1$ into the remaining term.
  - title: Filling it
    blocks:
      - text: |
          The filling machine opens its valve gradually and closes it gradually. For $0 \le t \le 10$ seconds it delivers liquid at a rate of

          $$q(t) = 60t - 6t^2 \quad \text{cm}^3 \text{ per second},$$

          and it delivers nothing before or after.
      - question:
          id: delivered
          type: numeric
          system: s2
          concepts: [m10.integral-as-accumulation, m10.fundamental-theorem-of-calculus]
          prompt: How many cubic centimetres does the machine deliver in one cycle?
          answer: "1000"
          unit: cm³
          explanation: |
            A total gathered from a rate is an integral: $\displaystyle\int_0^{10} (60t - 6t^2)\,dt$. An antiderivative is $30t^2 - 2t^3$, and its value at 10 less its value at 0 is $3000 - 2000 = 1000$. The machine fills the tin exactly.
          hints:
            - The amount delivered is the accumulation of the rate over the cycle. Which operation computes that?
            - Find a function whose derivative is the rate, and take the difference of its values at the two ends.
      - question:
          id: fastest
          type: numeric
          system: s1
          concepts: [m10.maxima-and-minima, m10.differentiation-rules]
          prompt: At what time, in seconds, is the liquid flowing fastest?
          answer: "5"
          unit: s
          explanation: |
            The rate is greatest where its own derivative is zero: $q'(t) = 60 - 12t = 0$ at $t = 5$, and $q''(t) = -12 < 0$ confirms a maximum. The rate is zero at both ends of the cycle, so the endpoints are not candidates.
          hints:
            - You are maximising the rate itself, so differentiate the rate.
            - Check that the point you find is a maximum and that the ends of the cycle do not beat it.
review: |
  One tin, and most of the cluster:

  - The look at the extremes, which told you a least value had to exist, was [[m10.limits-and-continuity]].
  - $S'$ came from the power rule, in [[m10.differentiation-rules]], and setting it to zero was [[m10.maxima-and-minima]].
  - The second derivative showed the curve bending upwards everywhere, which turned a flat point into the lowest point of all, from [[m10.second-derivative-and-curvature]].
  - Your `slope` was the derivative as a difference quotient, from [[m10.derivative-as-slope-and-rate]], and your descent found the same radius with no formula for the derivative.
  - The cost of a small error was the quadratic term of [[m10.taylor-approximation]].
  - The filling was a total gathered from a rate, from [[m10.integral-as-accumulation]], evaluated with an antiderivative by [[m10.fundamental-theorem-of-calculus]].

  The fourth stage is the one to carry forward. Training a model is this same descent, on a function of millions of variables whose flat points nobody can find by algebra. The slope will come from a cleverer method than a difference of two values, but the loop is the one you wrote.
