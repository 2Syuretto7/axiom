    - question:
        id: work-xor
        type: choice
        system: s2
        prompt: |
          A network computes $h_1 = \operatorname{relu}(x_1 + x_2)$, $h_2 = \operatorname{relu}(x_1 + x_2 - 1)$ and $y = h_1 - 2h_2$. Remove the two rectifiers, so that $h_1 = x_1 + x_2$ and $h_2 = x_1 + x_2 - 1$. What does it compute then?
        options:
          - "Still exclusive or."
          - "$y = 2 - x_1 - x_2$, a single affine function, which gives 2, 1, 1, 0 on the four inputs and cannot be exclusive or."
          - "The constant 0."
          - "Nothing, since the layers no longer fit."
        answer: 1
        explanation: |
          Without the rectifiers, $y = (x_1 + x_2) - 2(x_1 + x_2 - 1) = 2 - x_1 - x_2$. The two layers have collapsed into one neuron with weights $(-1, -1)$ and bias 2, and its values on $(0, 0)$, $(1, 0)$, $(0, 1)$, $(1, 1)$ are 2, 1, 1, 0. With the rectifiers, $h_2$ stays at 0 until both inputs are on and then cancels $h_1$, giving 0, 1, 1, 0. The only difference between the two networks is one function, applied to two numbers, that happens not to respect adding. That is the whole source of what depth can do.
    - question:
        id: work-entry
        type: numeric
        system: s2
        prompt: |
          $A$ has rows $(1, 2, 0)$ and $(0, 1, 3)$. $B$ has rows $(1, 1)$, $(2, 0)$ and $(0, 4)$. What is the entry of $AB$ in row 2, column 2?
        answer: "12"
        explanation: |
          $A$ is $2 \times 3$ and $B$ is $3 \times 2$, so $AB$ is $2 \times 2$. Row 2 of $A$ is $(0, 1, 3)$. Column 2 of $B$, read down its rows, is $(1, 0, 4)$. Their dot product is $0 \times 1 + 1 \times 0 + 3 \times 4$. The whole product has rows $(5, 1)$ and $(2, 12)$. The other order, $BA$, is also defined here and is a $3 \times 3$ matrix: not merely different entries but a different shape.
    - question:
        id: work-cost
        type: choice
        system: s2
        prompt: |
          $A$ and $B$ are $1000 \times 1000$ and $\mathbf{x}$ has 1000 components. You need $AB\mathbf{x}$ for this one $\mathbf{x}$. Which plan is cheaper, and by about how much?
        options:
          - "Form $AB$ first and then multiply by $\\mathbf{x}$. About a thousand times cheaper."
          - "Compute $B\\mathbf{x}$ and then apply $A$. About two million multiplications against about a thousand million, some five hundred times cheaper."
          - "They cost the same, since the answers are equal."
          - "Compute $B\\mathbf{x}$ and then apply $A$. Twice as cheap."
        answer: 1
        explanation: |
          A matrix-vector product with a $1000 \times 1000$ matrix costs $10^6$ multiplications, so $A(B\mathbf{x})$ costs $2 \times 10^6$. Forming $AB$ costs $1000^3 = 10^9$, and applying it costs another $10^6$. Associativity guarantees the two plans give the same vector. It says nothing about their cost. The rule of thumb is to keep a vector at the right-hand end and multiply into it, so that every intermediate result is a vector and never a matrix. Forming $AB$ pays only if it will be applied to more than about a thousand different inputs.
    - question:
        id: work-no-commute
        type: choice
        system: s2
        prompt: |
          $S$ is the stretch with rows $(2, 0)$ and $(0, 1)$, and $T$ is the quarter turn with rows $(0, -1)$ and $(1, 0)$. Where does $(1, 0)$ go under $TS$, and where under $ST$?
        options:
          - "To $(0, 2)$ under both."
          - "To $(0, 2)$ under $TS$ and to $(0, 1)$ under $ST$."
          - "To $(0, 1)$ under $TS$ and to $(0, 2)$ under $ST$."
          - "To $(2, 0)$ under both."
        answer: 1
        explanation: |
          $TS$ stretches first: $(1, 0)$ becomes $(2, 0)$, and the turn takes that to $(0, 2)$. $ST$ turns first: $(1, 0)$ becomes $(0, 1)$, which now points upwards, where the sideways stretch has no effect, so it stays $(0, 1)$. The stretch acts along a fixed direction of the page. Whether a vector lies along that direction when the stretch arrives depends on whether the turn has already happened. That is the geometry of $TS \ne ST$, and the same thing in arithmetic is that the first columns of the two products differ.
  connections:
    - text: |
        A model with two layers and nothing between them was matched, on every input, by a model with one. The reason is that one linear map after another is a linear map, and so has a matrix, found as any matrix is found: by sending the unit vectors through. That matrix is the product. Its columns are the first factor applied to the columns of the second, its entries are rows against columns, and its shape is what is left when the matching inner sizes are removed. None of it was decreed. It followed from wanting $(AB)\mathbf{x} = A(B\mathbf{x})$.

        From the meaning came the laws. Order matters, because doing two things in turn depends on which is first. Brackets do not, because a chain of maps has one meaning however it is grouped. And layers collapse: [[m5.matrix-vector-product]] gave a layer as $W\mathbf{x} + \mathbf{b}$, and two of those are one of those, which is why networks place a function that is not linear between every pair. You also saw the same sum over a middle index count walks in a graph, and produce the addition formulas for sine and cosine.

        The product raises new questions about single matrices. The entry rule sets rows of one factor against columns of the other, so what happens to a product when rows and columns change places? That is [[m5.transpose]]. The shear followed by the opposite shear gave back the do-nothing matrix, so when can a matrix be undone by another? That is [[m5.identity-and-inverse]]. Areas multiply when maps are chained, which [[m5.determinant]] will make exact. And the description of a map in a new set of coordinates turns out to be a product of three matrices, in [[m5.change-of-basis]].

        Take the first of these. In the design matrix, each row was a flat and each column a feature, and in the last lesson one person worked across and the other down. Exchange the roles of rows and columns and you get a new matrix, the same numbers turned about the diagonal. It looks like a mere rearrangement of storage. But it answers a real question: when a matrix moves from one side of a dot product to the other, what does it become? The answer underlies every formula for fitting a model to data, and the way errors are sent backwards through a network. That is the next lesson, [[m5.transpose]].
