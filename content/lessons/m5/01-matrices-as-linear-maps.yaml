concept: m5.matrices-as-linear-maps
minutes: 90
claim: You can say what makes a function from vectors to vectors linear, show that a linear map is completely fixed by where it sends the unit vectors, write those images as the columns of a matrix and read a matrix back as a movement of space, tell linear maps from ones that are not, and store a matrix in Python as a list of rows.
recalls: [e3.shortest-paths-and-beam-search, m4.linear-independence]
uses: [m4.linear-combinations-and-span, m4.vector-addition-and-scaling, m4.vectors-as-arrows-and-as-lists, m4.dot-product, m4.projection-onto-a-vector, m4.lines-planes-and-hyperplanes, m2.functions-as-machines, m2.composition-and-inverses, m2.trigonometric-functions-on-the-unit-circle, m10.differentiation-rules, m3.cases-and-counterexamples, e3.dynamic-programming, e3.arrays-and-linked-lists, e0.functions, e0.loops, e0.lists-and-tuples, e1.comprehensions-and-iterators]
leads: [m5.matrix-vector-product, m5.matrix-multiplication-as-composition, m5.identity-and-inverse, m5.change-of-basis, m5.determinant]
bridges:
  e3.shortest-paths-and-beam-search: |
    The last cluster ended on graphs, and on tables filled one cell at a time in dynamic programming. There a list of lists was a place to keep answers. Today a grid of numbers becomes something that acts: a matrix takes a vector in and gives a vector out. It is stored exactly as those tables were, as a list of rows, so the indexing and the loops you already write carry over unchanged. What is new is the meaning of the numbers in the grid.
starter: |
  # Scratch space. A machine that takes a vector of two numbers and gives one back.
  # Run it, then cover the last line and predict its result from the first.
  def f(v):
      return [2 * v[0] - v[1], v[0] + v[1]]

  print(f([1, 0]), f([0, 1]))
  print(f([3, 2]))
parts:
  recall:
    - text: |
        [[e3.shortest-paths-and-beam-search]] closed the cluster on data structures with a promise: a grid of numbers, a list of lists, would turn out to be a machine that takes a vector in and gives a vector out. [[m4.linear-independence]] closed the cluster on vectors with a need: a way to handle many vectors at once. Both are met today. Three quick pulls first.
    - question:
        id: recall-grid
        type: predict
        system: s1
        concepts: [e3.dynamic-programming]
        prompt: You filled tables like this one, a list of rows, in dynamic programming. What does this show?
        code: |
          grid = [[1, 2, 3], [4, 5, 6]]

          print(grid[1][0], len(grid), len(grid[0]))
        output: "4 2 3"
        explanation: The first index chooses the row and the second the place within it. Row 1 is [4, 5, 6] and its item 0 is 4. There are 2 rows, each of 3 items.
    - question:
        id: recall-combination
        type: choice
        system: s1
        concepts: [m4.linear-combinations-and-span]
        prompt: |
          Which combination of $(1, 0)$ and $(0, 1)$ equals $(3, 2)$?
        options: ['$2\,(1, 0) + 3\,(0, 1)$', '$3\,(1, 0) + 2\,(0, 1)$', '$5\,(1, 0)$', '$(1, 0) + (0, 1)$']
        answer: 1
        explanation: The components of a vector are its coefficients along the two axis directions.
    - question:
        id: recall-unique
        type: choice
        system: s1
        concepts: [m4.linear-independence]
        prompt: |
          $(1, 0)$ and $(0, 1)$ are linearly independent and span the plane. In how many ways can a given vector of the plane be written as a combination of them?
        options: ["None", "Exactly one", "Two", "Infinitely many"]
        answer: 1
        explanation: Spanning the plane gives at least one way. Independence gives at most one. Such a list is a basis.
  puzzle:
    - text: |
        Someone hands you a machine. A vector of two numbers goes in and a vector of two numbers comes out. You may not look inside. You are allowed two test runs, and you are told one thing about how the machine was built: **it respects adding and scaling**. If you feed it the sum of two vectors, out comes the sum of what it would have given for each. If you feed it three times a vector, out comes three times what it would have given.

        You spend your two tests on the simplest inputs there are.

        $$f(1, 0) = (2, 1), \qquad f(0, 1) = (-1, 1).$$

        Now the question that matters. **What is $f(3, 2)$?** You have never tested it. You have no more tests left.

        Run the starter. Its first line performs your two tests. Before you look at the second line of output, commit to an answer.

        The machine gives $(4, 5)$. And if you reasoned it out, you did not need the machine at all. That is strange when you think about it. A function on the plane has an output for each of infinitely many inputs, and in general knowing two of them tells you nothing about the rest. Knowing $\sin 0$ and $\sin 1$ does not give you $\sin 2$.

        **What is it about this machine that lets two tests settle everything? And if the machine took a thousand numbers in and gave a thousand out, as one layer of a neural network does, how many tests would you need?**
  intuition:
    - text: |
        The input $(3, 2)$ is not a new thing. It is built from the two inputs you tested:

        $$(3, 2) = 3\,(1, 0) + 2\,(0, 1).$$

        The machine respects scaling, so it sends $3\,(1, 0)$ to 3 times what it gave for $(1, 0)$, and likewise for the other. It respects adding, so it sends the sum to the sum:

        $$f(3, 2) = 3\,f(1, 0) + 2\,f(0, 1) = 3\,(2, 1) + 2\,(-1, 1) = (6 - 2,\; 3 + 2) = (4, 5).$$

        Nothing in that argument was special to $(3, 2)$. **Every** vector of the plane is some amount of $(1, 0)$ plus some amount of $(0, 1)$, and the amounts are simply its components. So the machine's answer to everything is fixed by its answers to those two. The whole machine is four numbers: the two outputs, written down.

        It helps to see what such a machine does to the entire plane at once. The figure shows a different one, called a shear. Step it from nothing to its full effect, and watch three things: the two arrows, the grid, and the marked point that starts at $(2, 1)$.
    - figure: linear-map
      props: { map: shear, amount: 0 }
    - text: |
        The arrow for $(1, 0)$ stays where it is. The arrow for $(0, 1)$ tips over to $(1, 1)$. And the grid goes with them: every line stays straight, lines that were parallel stay parallel, their spacing stays even, and the origin does not move. The marked point was 2 of the first arrow and 1 of the second before, and it is 2 of the first and 1 of the second after, $2\,(1, 0) + 1\,(1, 1) = (3, 1)$. The point keeps its recipe. Only the ingredients moved.

        Press "Next matrix" and step through the others: a stretch, a quarter turn, a reflection, and one that crushes the plane onto a line. In each, the two arrows tell you everything, and the grid follows them rigidly.

        That is the picture to hold. **A machine that respects adding and scaling moves the whole of space by moving the unit vectors and letting the grid follow.** Writing down where the unit vectors land, side by side, gives a small table of numbers. That table is called a matrix.
  derivation:
    - text: |
        **The definition.** Write $\mathbb{R}^n$ for the set of vectors with $n$ components. A function $f$ that takes vectors of $\mathbb{R}^n$ to vectors of $\mathbb{R}^m$ is a **linear map** if, for all vectors $\mathbf{u}$ and $\mathbf{v}$ and every number $c$,

        $$f(\mathbf{u} + \mathbf{v}) = f(\mathbf{u}) + f(\mathbf{v}) \qquad \text{and} \qquad f(c\,\mathbf{v}) = c\,f(\mathbf{v}).$$

        The first rule is called additivity and the second scaling. Notice that $n$ and $m$ need not be equal: a linear map may take three numbers in and give two out.

        Two consequences follow at once. Put $c = 0$ in the scaling rule: $f(\mathbf{0}) = 0\,f(\mathbf{v}) = \mathbf{0}$. **A linear map sends the zero vector to the zero vector.** And using the two rules together, again and again,

        $$f(c_1\mathbf{v}_1 + c_2\mathbf{v}_2 + \dots + c_k\mathbf{v}_k) = c_1 f(\mathbf{v}_1) + c_2 f(\mathbf{v}_2) + \dots + c_k f(\mathbf{v}_k).$$

        **A linear map carries a linear combination to the same combination of the outputs.** Vectors were given exactly two operations, adding and scaling, and everything in the last cluster was built from them. Linear maps are the functions that leave both operations undisturbed. That is why they are the natural functions between spaces of vectors, and it is the whole reason they are easy.

        **A linear map is fixed by $n$ outputs.** In $\mathbb{R}^n$ write $\mathbf{e}_1, \dots, \mathbf{e}_n$ for the **standard unit vectors**: $\mathbf{e}_j$ has a 1 in place $j$ and 0 everywhere else. In the plane they are $(1, 0)$ and $(0, 1)$. Any vector is a combination of them, with its own components as coefficients:

        $$\mathbf{x} = (x_1, x_2, \dots, x_n) = x_1\mathbf{e}_1 + x_2\mathbf{e}_2 + \dots + x_n\mathbf{e}_n.$$

        Apply a linear map $f$ to both sides and use the rule for combinations:

        $$f(\mathbf{x}) = x_1 f(\mathbf{e}_1) + x_2 f(\mathbf{e}_2) + \dots + x_n f(\mathbf{e}_n).$$

        This one line is the centre of the lesson. The left side is the output for an arbitrary input. The right side uses only the $n$ vectors $f(\mathbf{e}_1), \dots, f(\mathbf{e}_n)$, combined with the input's own components as coefficients. So $n$ test runs determine the machine on every input. Two for the plane. A thousand for a machine that takes a thousand numbers.

        **The matrix.** Give those $n$ outputs names, $\mathbf{a}_j = f(\mathbf{e}_j)$. Each is a vector of $\mathbb{R}^m$. Write them side by side as columns, and you have a rectangle of numbers with $m$ rows and $n$ columns. For the machine of the puzzle, $\mathbf{a}_1 = (2, 1)$ and $\mathbf{a}_2 = (-1, 1)$, and the rectangle is

        $$A = \begin{pmatrix} 2 & -1 \\ 1 & 1 \end{pmatrix}.$$

        A **matrix** is a rectangular table of numbers. One with $m$ rows and $n$ columns is called an $m \times n$ matrix, said "$m$ by $n$", rows always first. The number in row $i$ and column $j$ is its **entry** $a_{ij}$, again row first. The matrix of a linear map $f$ is the one whose column $j$ is $f(\mathbf{e}_j)$.

        The shape tells you what the map takes and gives. **The number of columns is the number of inputs, and the number of rows is the number of outputs.** A $2 \times 3$ matrix has three columns, one for each of $\mathbf{e}_1, \mathbf{e}_2, \mathbf{e}_3$, so it takes vectors of $\mathbb{R}^3$. Each column has two entries, so it gives vectors of $\mathbb{R}^2$.

        **Every matrix is a linear map.** You have seen that every linear map gives a matrix. The reverse holds too. Take any $m \times n$ table of numbers, with columns $\mathbf{a}_1, \dots, \mathbf{a}_n$, and **define** a function by

        $$f(\mathbf{x}) = x_1\mathbf{a}_1 + x_2\mathbf{a}_2 + \dots + x_n\mathbf{a}_n.$$

        Is it linear? Check additivity. The vector $\mathbf{x} + \mathbf{y}$ has components $x_j + y_j$, so

        $$f(\mathbf{x} + \mathbf{y}) = \sum_j (x_j + y_j)\,\mathbf{a}_j = \sum_j x_j\mathbf{a}_j + \sum_j y_j\mathbf{a}_j = f(\mathbf{x}) + f(\mathbf{y}).$$

        Scaling goes the same way: $f(c\,\mathbf{x}) = \sum_j c\,x_j\,\mathbf{a}_j = c\,f(\mathbf{x})$. And $f(\mathbf{e}_j) = \mathbf{a}_j$, since $\mathbf{e}_j$ has a single 1 in place $j$. So the function defined by the table is linear, and its matrix is the table you began with.

        The two directions together say: **linear maps from $\mathbb{R}^n$ to $\mathbb{R}^m$ and $m \times n$ matrices are the same things, written two ways.** The map is the behaviour. The matrix is its complete record. From here on the lesson, and the cluster, will pass between them without comment, and will write $A\mathbf{x}$ for the output of the map with matrix $A$ on the input $\mathbf{x}$.
    - question:
        id: derivation-zero
        type: choice
        system: s2
        prompt: |
          A function $g$ on the plane has $g(0, 0) = (1, 0)$. What follows?
        options:
          - "$g$ is linear, because its output is a unit vector."
          - "$g$ is not linear. Scaling any input by 0 must scale the output by 0, so a linear map sends the zero vector to the zero vector."
          - "Nothing follows. One value says nothing about a function."
          - "$g$ is linear only if $g(1, 0) = (2, 0)$."
        answer: 1
        explanation: |
          For a linear map, $g(\mathbf{0}) = g(0\,\mathbf{v}) = 0\,g(\mathbf{v}) = \mathbf{0}$. A single value is enough to show that a function is **not** linear, when that value breaks a consequence of the rules. It is never enough to show that one is. The test of the origin is the quickest there is, and it is the first thing to check.
    - text: |
        **In Python.** Store a matrix as a list of its **rows**, each row a list. The matrix above is `A = [[2, -1], [1, 1]]`. Then `A[i][j]` is the entry in row `i`, column `j`, counting from 0 as Python does, where mathematics counts from 1. The number of rows is `len(A)` and the number of columns is `len(A[0])`.

        A row is easy to get: `A[i]` is already a list. A column has to be collected, one entry from each row: `[row[j] for row in A]`. This asymmetry is an accident of storage and not a fact about matrices, but it is the source of the commonest bug in matrix code: reading `A[j][i]` where `A[i][j]` was meant. For a square matrix the wrong one does not even raise an error. It gives a wrong answer quietly.

        Why store rows, when the columns are what the map does to the unit vectors? Because the rows have a meaning of their own, which the next lesson brings out, and because a table of data naturally comes one row to each record.

        **Matrices you can read at sight.** The columns are where the unit vectors land. Read each of these with that in mind, and compare with the figure.

        | Map | Sends $(1, 0)$ to | Sends $(0, 1)$ to | Matrix rows |
        | --- | --- | --- | --- |
        | Stretch sideways by 2 | $(2, 0)$ | $(0, 1)$ | $(2, 0)$ and $(0, 1)$ |
        | Shear | $(1, 0)$ | $(1, 1)$ | $(1, 1)$ and $(0, 1)$ |
        | Quarter turn anticlockwise | $(0, 1)$ | $(-1, 0)$ | $(0, -1)$ and $(1, 0)$ |
        | Reflection in the horizontal axis | $(1, 0)$ | $(0, -1)$ | $(1, 0)$ and $(0, -1)$ |
        | Do nothing | $(1, 0)$ | $(0, 1)$ | $(1, 0)$ and $(0, 1)$ |

        Take care with the last column. The images of the unit vectors are the **columns**, so the quarter turn, which sends $(1, 0)$ to $(0, 1)$, has first column $(0, 1)$, and reading across it has rows $(0, -1)$ and $(1, 0)$.

        A turn through any angle $\theta$ works the same way. On the unit circle, $(1, 0)$ turns to $(\cos\theta, \sin\theta)$, and $(0, 1)$, a quarter turn ahead of it, goes to $(-\sin\theta, \cos\theta)$. Those are the columns:

        $$R_\theta = \begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}.$$

        You did not have to work out where a general point goes. Is a turn linear? Turning the parallelogram of a vector sum turns the whole parallelogram, and turning a stretched arrow gives the stretched turned arrow. So yes, and the matrix does the rest.

        **Maps you already knew.** Several things from the last cluster were linear maps all along.

        *The dot product with a fixed vector.* Fix $\mathbf{w}$ and let $f(\mathbf{x}) = \mathbf{w} \cdot \mathbf{x}$. The rules of the dot product, $\mathbf{w} \cdot (\mathbf{x} + \mathbf{y}) = \mathbf{w} \cdot \mathbf{x} + \mathbf{w} \cdot \mathbf{y}$ and $\mathbf{w} \cdot (c\,\mathbf{x}) = c\,(\mathbf{w} \cdot \mathbf{x})$, are exactly additivity and scaling. This map takes $n$ numbers and gives one, so its matrix is $1 \times n$, a single row. Its column $j$ is $\mathbf{w} \cdot \mathbf{e}_j = w_j$. **The matrix is $\mathbf{w}$ itself, laid on its side.**

        *Projection onto a vector.* Projecting onto $\mathbf{u} = (1, 1)$ sends $\mathbf{x}$ to $\dfrac{\mathbf{x} \cdot \mathbf{u}}{\mathbf{u} \cdot \mathbf{u}}\,\mathbf{u}$. The dot product is linear in $\mathbf{x}$, so this is too. It sends $(1, 0)$ to $\frac{1}{2}(1, 1)$ and $(0, 1)$ to the same, so its matrix has both columns equal to $(0.5, 0.5)$. Two equal columns: the map crushes the plane onto a line, as a projection should.

        *Differentiation.* A polynomial $a + bx + cx^2$ is settled by its three coefficients $(a, b, c)$. Its derivative is $b + 2cx$, with coefficients $(b, 2c, 0)$. The sum rule and the constant multiple rule say that differentiating respects adding and scaling. So on these coefficient vectors, differentiation is a linear map from $\mathbb{R}^3$ to $\mathbb{R}^3$. It sends $\mathbf{e}_1$, the polynomial 1, to $(0, 0, 0)$; $\mathbf{e}_2$, the polynomial $x$, to $(1, 0, 0)$; and $\mathbf{e}_3$, the polynomial $x^2$, to $(0, 2, 0)$. Its matrix is

        $$D = \begin{pmatrix} 0 & 1 & 0 \\ 0 & 0 & 2 \\ 0 & 0 & 0 \end{pmatrix}.$$

        The word linear has nothing to do with arrows on paper. It is about the two rules, wherever they hold.

        **What is not linear.** Three near misses, each of which you will meet constantly.

        *A shift.* $g(\mathbf{x}) = \mathbf{x} + (1, 0)$ moves every point one step right. It sends the origin to $(1, 0)$, so it is not linear. This matters for the neuron, which computes $\mathbf{w} \cdot \mathbf{x} + c$: the dot product is linear, and the bias $c$ is a shift that is not. A linear map followed by a shift is called **affine**. In everyday speech such things are called linear, as with the "linear" function $y = mx + c$, whose graph is a straight line. In this subject the word is reserved for maps that fix the origin.

        *Squaring.* $g(x) = x^2$ on single numbers has $g(2) = 4$, and $2\,g(1) = 2$. Scaling fails.

        *The rectifier.* $\operatorname{relu}(x) = \max(0, x)$ passes positive numbers and replaces negative ones by 0. It respects scaling by positive numbers, and its graph is made of two straight pieces, yet $\operatorname{relu}(1) + \operatorname{relu}(-1) = 1$ while $\operatorname{relu}(1 + (-1)) = 0$. Additivity fails. Hold on to this one. A neural network is made of linear maps with functions like this placed between them, and without those functions in between, the whole network would collapse into something far simpler, as you will see when maps are chained.

        **How much a matrix holds.** A linear map from $\mathbb{R}^n$ to $\mathbb{R}^m$ is $m \times n$ numbers and nothing else. One layer of a network that takes a thousand numbers and gives a thousand is a million entries. When people say a model has billions of parameters, almost all of them are the entries of matrices.
    - question:
        id: order-determined
        type: order
        system: s2
        prompt: Put the steps in order to prove that two linear maps $f$ and $g$ on the plane which agree on $(1, 0)$ and on $(0, 1)$ agree on every vector.
        steps:
          - 'Take any vector $\mathbf{x} = (x_1, x_2)$ of the plane.'
          - 'Write it as a combination of the unit vectors: $\mathbf{x} = x_1\,(1, 0) + x_2\,(0, 1)$.'
          - 'Because $f$ is linear, $f(\mathbf{x}) = x_1 f(1, 0) + x_2 f(0, 1)$.'
          - 'Because $f$ and $g$ agree on the unit vectors, this equals $x_1 g(1, 0) + x_2 g(0, 1)$.'
          - 'Because $g$ is linear, that is $g(\mathbf{x})$, so $f(\mathbf{x}) = g(\mathbf{x})$.'
        explanation: The proof takes an arbitrary vector, breaks it into unit vectors, carries $f$ inside the combination by linearity, swaps $f$ for $g$ where they are known to agree, and reassembles by the linearity of $g$. Linearity is used twice, once for each map. This is the precise sense in which a matrix is a complete record. Two linear maps with the same matrix are the same map.
  formal:
    - text: |
        **Linear map.** $f : \mathbb{R}^n \to \mathbb{R}^m$ is linear if $f(\mathbf{u} + \mathbf{v}) = f(\mathbf{u}) + f(\mathbf{v})$ and $f(c\,\mathbf{v}) = c\,f(\mathbf{v})$ for all vectors $\mathbf{u}, \mathbf{v}$ and numbers $c$. Then $f(\mathbf{0}) = \mathbf{0}$ and $f\!\left(\sum c_i\mathbf{v}_i\right) = \sum c_i f(\mathbf{v}_i)$.

        **Matrix.** An $m \times n$ matrix is a table of numbers with $m$ rows and $n$ columns. Its entry in row $i$, column $j$ is $a_{ij}$.

        **The matrix of a linear map.** Column $j$ of the matrix of $f$ is $f(\mathbf{e}_j)$, where $\mathbf{e}_j$ is the $j$-th standard unit vector. Then $f(\mathbf{x}) = x_1\mathbf{a}_1 + \dots + x_n\mathbf{a}_n$, written $A\mathbf{x}$.

        **Correspondence.** Every linear map from $\mathbb{R}^n$ to $\mathbb{R}^m$ has exactly one $m \times n$ matrix, and every $m \times n$ matrix is the matrix of exactly one linear map.

        **Rotation.** The turn through $\theta$ anticlockwise has columns $(\cos\theta, \sin\theta)$ and $(-\sin\theta, \cos\theta)$.

        **Affine.** A linear map followed by a shift, $\mathbf{x} \mapsto A\mathbf{x} + \mathbf{b}$, is affine. It is linear only when $\mathbf{b} = \mathbf{0}$.
  drill:
    - text: Seconds each. Columns are where the unit vectors land. Rows first, columns second.
    - question:
        id: drill-puzzle
        type: numeric
        system: s1
        prompt: |
          $f$ is linear with $f(1, 0) = (2, 1)$ and $f(0, 1) = (-1, 1)$. What is the first component of $f(1, 1)$?
        answer: "1"
        explanation: f(1, 1) = f(1, 0) + f(0, 1) = (2, 1) + (−1, 1) = (1, 2).
    - question:
        id: drill-rows
        type: numeric
        system: s1
        prompt: |
          How many rows has the matrix $\begin{pmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \end{pmatrix}$?
        answer: "2"
        explanation: Rows run across. There are two of them, each with three entries. The matrix is 2 by 3.
    - question:
        id: drill-entry
        type: numeric
        system: s1
        prompt: |
          In the matrix $\begin{pmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \end{pmatrix}$, what is the entry $a_{23}$?
        answer: "6"
        explanation: Row 2, column 3. In Python, with counting from 0, it is A[1][2].
    - question:
        id: drill-inputs
        type: numeric
        system: s1
        prompt: |
          A matrix has 2 rows and 3 columns. How many components has a vector that its map accepts as input?
        answer: "3"
        explanation: There is one column for each unit vector of the input space, so the input has as many components as there are columns.
    - question:
        id: drill-outputs
        type: numeric
        system: s1
        prompt: |
          A linear map takes vectors of $\mathbb{R}^5$ to vectors of $\mathbb{R}^2$. How many rows has its matrix?
        answer: "2"
        explanation: Each column is an output, a vector with 2 components, so there are 2 rows. The matrix is 2 by 5.
    - question:
        id: drill-entries
        type: numeric
        system: s1
        prompt: |
          How many numbers does it take to describe a linear map from $\mathbb{R}^4$ to $\mathbb{R}^3$ completely?
        answer: "12"
        explanation: Its matrix is 3 by 4, one column of 3 numbers for each of the 4 unit vectors.
    - question:
        id: drill-shear-column
        type: choice
        system: s1
        prompt: |
          The shear has matrix $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$. Where does it send $(0, 1)$?
        options: ['$(1, 0)$', '$(1, 1)$', '$(0, 1)$', '$(1, 2)$']
        answer: 1
        explanation: (0, 1) is the second unit vector, and its image is the second column, read downwards.
    - question:
        id: drill-shift
        type: choice
        system: s1
        prompt: |
          Is $g(\mathbf{x}) = \mathbf{x} + (0, 3)$ a linear map?
        options: ["Yes, because it moves every point the same way", "No, because it does not send the zero vector to the zero vector", "Yes, because lines stay straight", "Only for inputs on the vertical axis"]
        answer: 1
        explanation: g(0, 0) = (0, 3). A linear map must fix the origin. A shift is affine, not linear.
    - question:
        id: drill-scaling
        type: numeric
        system: s1
        prompt: |
          $f$ is linear and $f(\mathbf{v}) = (2, 6)$. What is the second component of $f(3\mathbf{v})$?
        answer: "18"
        explanation: f(3v) = 3 f(v) = (6, 18).
    - question:
        id: drill-additivity
        type: numeric
        system: s1
        prompt: |
          $f$ is linear, $f(\mathbf{u}) = (1, 2)$ and $f(\mathbf{v}) = (3, -1)$. What is the first component of $f(\mathbf{u} - \mathbf{v})$?
        answer: "-2"
        explanation: f(u − v) = f(u) − f(v) = (1 − 3, 2 + 1) = (−2, 3). Subtracting is adding −1 times a vector, so both rules are used.
    - question:
        id: drill-double
        type: choice
        system: s1
        prompt: |
          Which matrix belongs to the map that doubles every vector of the plane?
        options: ['Rows $(2, 2)$ and $(2, 2)$', 'Rows $(2, 0)$ and $(0, 2)$', 'Rows $(0, 2)$ and $(2, 0)$', 'Rows $(1, 2)$ and $(2, 1)$']
        answer: 1
        explanation: (1, 0) goes to (2, 0) and (0, 1) goes to (0, 2). Those are the columns.
    - question:
        id: drill-square
        type: choice
        system: s1
        prompt: |
          Is $g(x) = x^2$, on single numbers, linear?
        options: ["Yes, because g(0) = 0", "No, because g(2) is 4 and 2 g(1) is 2", "Yes, because it is a polynomial", "Only for positive x"]
        answer: 1
        explanation: Scaling the input by 2 scales the output by 4. Sending 0 to 0 is necessary for linearity and far from enough.
    - question:
        id: drill-row-matrix
        type: choice
        system: s1
        prompt: |
          The map $f(\mathbf{x}) = (3, -1, 2) \cdot \mathbf{x}$ takes vectors of $\mathbb{R}^3$ to single numbers. What is the shape of its matrix?
        options: ["3 by 1", "1 by 3", "3 by 3", "1 by 1"]
        answer: 1
        explanation: Three inputs, so three columns. One output, so one row. The matrix is the single row (3, −1, 2).
    - question:
        id: predict-column
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          A = [[1, 2, 3], [4, 5, 6]]

          print(len(A), len(A[0]))
          print([row[1] for row in A])
        output: |
