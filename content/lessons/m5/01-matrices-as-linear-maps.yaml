        solution: |
          def apply(A, x):
              out = [0] * len(A)
              for j in range(len(x)):
                  for i in range(len(A)):
                      out[i] += x[j] * A[i][j]
              return out

          print(apply([[1, 1], [0, 1]], [2, 1]))
        tests: |
          assert apply([[1, 1], [0, 1]], [2, 1]) == [3, 1], "The shear sends [2, 1] to 2 times [1, 0] plus 1 times [1, 1], which is [3, 1]"
          assert apply([[2, -1], [1, 1]], [3, 2]) == [4, 5], "The machine of the puzzle sends [3, 2] to [4, 5]"
          assert apply([[0, -1], [1, 0]], [1, 0]) == [0, 1], "The quarter turn sends [1, 0] to its first column, [0, 1]"
          assert apply([[1, 0], [0, 1]], [7, -2]) == [7, -2], "The map that does nothing returns its input"
          assert apply([[1, 2, 3], [4, 5, 6]], [1, 0, 1]) == [4, 10], "A 2 by 3 matrix sends [1, 0, 1] to the first column plus the third, [4, 10]"
          assert apply([[1, 0], [1, 1], [0, 5]], [2, 3]) == [2, 5, 15], "A 3 by 2 matrix sends [2, 3] to 2 times [1, 1, 0] plus 3 times [0, 1, 5]"
          assert apply([[3, -1, 2]], [1, 1, 1]) == [4], "A single row gives a single number: 3 - 1 + 2"
          assert output.strip() == "[3, 1]", "The program should print [3, 1]"
        wrong:
          - |
            def apply(A, x):
                out = [0] * len(A)
                for j in range(len(A)):
                    for i in range(len(A)):
                        out[i] += x[j] * A[j][i]
                return out

            print([3, 1])
          - |
            def apply(A, x):
                out = [0] * len(A)
                for j in range(len(A)):
                    for i in range(len(A)):
                        out[i] += x[j] * A[i][j]
                return out

            print([3, 1])
          - |
            def apply(A, x):
                out = [0] * len(x)
                for j in range(len(x)):
                    for i in range(len(x)):
                        if i < len(A):
                            out[i] += x[j] * A[i][j]
                return out

            print([3, 1])
          - |
            def apply(A, x):
                out = [0] * len(A)
                for j in range(len(x)):
                    for i in range(len(A)):
                        out[i] = x[j] * A[i][j]
                return out

            print([3, 1])
        explanation: |
          The starter read `A[j][i]`, the entry in row `j` and column `i`, where the entry in row `i` and column `j` was wanted. Column `j` runs **down** the matrix, so walking along it means holding the second index fixed and moving the first. With the indices exchanged the function combined the rows of the matrix where it should have combined the columns. For a square matrix that raises no error, and for a matrix equal to its own flip it even gives the right answer, which is how this bug survives testing. The cure is a test with a matrix that is not square, where the wrong indexing falls off the end of a row. You will see in the next lesson that the same result can be computed one output at a time, as a dot product of each row with the input.
    - question:
        id: work-other-tests
        type: numeric
        system: s2
        prompt: |
          A linear map $f$ on the plane was tested on two inputs that are not the unit vectors: $f(1, 1) = (3, 1)$ and $f(1, -1) = (1, 3)$. What is the first component of $f(1, 0)$?
        answer: "2"
        explanation: |
          The tested inputs are independent, so they span the plane and every vector is a combination of them. In particular $(1, 0) = \frac{1}{2}(1, 1) + \frac{1}{2}(1, -1)$, so $f(1, 0) = \frac{1}{2}(3, 1) + \frac{1}{2}(1, 3) = (2, 2)$. Likewise $(0, 1) = \frac{1}{2}(1, 1) - \frac{1}{2}(1, -1)$ gives $f(0, 1) = (1, -1)$. The matrix has columns $(2, 2)$ and $(1, -1)$. The unit vectors are the most convenient tests, since the answers are the columns directly, but **any basis will do**. What fixes a linear map is its values on a list of vectors that reaches everything in exactly one way.
    - question:
        id: work-derivative
        type: choice
        system: s2
        prompt: |
          Coefficient vectors $(a, b, c)$ stand for polynomials $a + bx + cx^2$, and differentiation has matrix $D$ with rows $(0, 1, 0)$, $(0, 0, 2)$, $(0, 0, 0)$. What does the third column, $(0, 2, 0)$, say?
        options:
          - "That the derivative of a constant is 0."
          - "That the derivative of $x^2$ is $2x$: the unit vector $(0, 0, 1)$ stands for $x^2$, and its image $(0, 2, 0)$ stands for $0 + 2x + 0x^2$."
          - "That the derivative of $2x$ is 2."
          - "That $x^2$ has no derivative."
        answer: 1
        explanation: |
          Column $j$ is the image of the $j$-th unit vector. The third unit vector has $c = 1$ and $a = b = 0$, the polynomial $x^2$. Its image $(0, 2, 0)$ has $b = 2$, the polynomial $2x$. The first column, all zeros, says the derivative of the constant 1 is 0. The bottom row, all zeros, says no derivative of these polynomials contains $x^2$. The whole table of derivatives of powers, together with the sum rule and the constant multiple rule, is stored in nine numbers. Differentiation was linear before you had the word for it.
    - question:
        id: work-neuron
        type: choice
        system: s2
        prompt: |
          A neuron computes $z = \mathbf{w} \cdot \mathbf{x} + c$ with $\mathbf{w} = (1, 1)$ and $c = -1.5$. Which statement about the map $\mathbf{x} \mapsto z$ is right?
        options:
          - "It is linear, with matrix the single row $(1, 1)$."
          - "It is not linear, since it sends the origin to $-1.5$. It is affine: the linear map with the single row $(1, 1)$, followed by a shift."
          - "It is not linear, because it has two inputs and one output."
          - "It is linear, because its graph is flat."
        answer: 1
        explanation: |
          At $\mathbf{x} = \mathbf{0}$ the neuron gives $c = -1.5$, not 0, so the map is not linear. Remove the bias and what remains, $\mathbf{x} \mapsto \mathbf{w} \cdot \mathbf{x}$, is linear, with the $1 \times 2$ matrix whose only row is $\mathbf{w}$. The bias then shifts every output by the same amount. The bias is not a nuisance: without it the boundary $\mathbf{w} \cdot \mathbf{x} = 0$ where the neuron switches would be forced through the origin, and you saw that the neuron for "and" needs its line elsewhere. Having different numbers of inputs and outputs is no obstacle to linearity. A matrix need not be square.
    - question:
        id: work-thousand
        type: choice
        system: s2
        prompt: |
          A layer of a network is a linear map from $\mathbb{R}^{1000}$ to $\mathbb{R}^{1000}$, hidden in a black box. Which statement is right?
        options:
          - "No number of tests can determine it, since it has infinitely many inputs."
          - "A thousand tests, one for each unit vector, determine it completely, and the results are the thousand columns of a matrix with a million entries."
          - "Two tests suffice, as in the puzzle."
          - "A million tests are needed, one for each entry."
        answer: 1
        explanation: |
          Every input is a combination of the thousand unit vectors, and a linear map carries combinations to combinations, so its outputs on those thousand vectors settle its output on everything. Each test returns a whole column of a thousand numbers, which is why a thousand tests, and not a million, yield all million entries. Two tests settled the puzzle only because the plane has two unit vectors. This is the answer to the question the puzzle ended on, and it is the reason a linear layer can be stored at all: its behaviour on an infinity of inputs is a finite table.
  connections:
    - text: |
        The puzzle gave you a sealed machine, two test runs, and the knowledge that it respects adding and scaling. That was enough to predict its output on an input you had never tried, because every input is a combination of the two unit vectors and the machine carries combinations to combinations. A function with that property is a linear map. The outputs for the unit vectors, written side by side as columns, are its matrix, and the matrix is the complete record of the map: $n$ tests, $m$ numbers each, and nothing more to know.

        This is where [[m4.linear-independence]] pays off. The unit vectors are a basis, so each vector has exactly one recipe in terms of them, and a linear map preserves the recipe while changing the ingredients. You saw that any other basis serves as well for testing. Describing one map with respect to different bases is the business of [[m5.change-of-basis]].

        You also saw that the idea is wider than arrows. The dot product with a fixed vector is a linear map with a matrix of one row. Projection is one. Differentiation of polynomials is one, with the derivatives of the powers as its columns. And a neuron is one, followed by a shift and then by a function that is deliberately not linear.

        Several questions are now waiting. If one matrix is one map, what single matrix does the work of two maps applied in turn? That is [[m5.matrix-multiplication-as-composition]], and it is where the collapse of a network without rectifiers will be proved. Which maps can be undone, and what goes wrong for the one that crushes the plane onto a line? That is [[m5.identity-and-inverse]]. The shear leaned the unit square over without changing its area, the stretch doubled it and the crushing map sent it to zero: one number records that, and it is [[m5.determinant]].

        First, though, the computation itself. Today the output $A\mathbf{x}$ was assembled from the columns: $x_1$ of the first, $x_2$ of the second, and so on. That is the right way to think about what the map does. It is not the only way to compute it, and it hides half of what a matrix is. Read **across** the matrix, and each row turns out to be a vector you take the dot product with, a neuron of its own, and a system of simultaneous equations appears, written as the single line $A\mathbf{x} = \mathbf{b}$. Both readings, and the passage between them, are the next lesson, [[m5.matrix-vector-product]].
