          The function computes each side of each rule and compares them, component by component, with a tolerance, since `0.1 * 3` and `3 * 0.1` need not be the same float. Both rules must be checked: squaring passes additivity on the inputs $1$ and $0$ and fails scaling, and the rectifier passes scaling by 2 and fails additivity on $1$ and $-1$. The more important lesson is in what `True` means. The rectifier passes on the inputs $1$ and $2$, where it cannot be told from a linear map. The definition says "for all vectors", and no amount of testing covers all of them. Testing can **refute** linearity. Only an argument, like the one that every map of the form $x_1\mathbf{a}_1 + \dots + x_n\mathbf{a}_n$ is linear, can establish it.
