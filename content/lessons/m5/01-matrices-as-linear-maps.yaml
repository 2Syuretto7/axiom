    - question:
        id: write-respects
        type: code
        mode: write
        system: s2
        prompt: |
          Write `respects(f, u, v, c)`. `f` takes a list of numbers and returns a list of numbers, `u` and `v` are vectors of the same dimension, and `c` is a number. Return `True` exactly when `f` obeys **both** rules on these particular inputs: `f` of `u + v` equals `f(u)` plus `f(v)`, and `f` of `c` times `u` equals `c` times `f(u)`. Treat two numbers that differ by less than `1e-9` as equal.

          A result of `False` proves that `f` is not linear. A result of `True` proves nothing by itself.
        starter: |
          def respects(f, u, v, c):
              # Replace the next line with your own.
              return True

          print(respects(lambda x: [x[0] + 1, x[1]], [1, 2], [3, 4], 2))
        solution: |
          def respects(f, u, v, c):
              both = f([a + b for a, b in zip(u, v)])
              apart = [a + b for a, b in zip(f(u), f(v))]
              scaled = f([c * a for a in u])
              after = [c * a for a in f(u)]
              adds = all([abs(a - b) < 1e-9 for a, b in zip(both, apart)])
              scales = all([abs(a - b) < 1e-9 for a, b in zip(scaled, after)])
              return adds and scales

          print(respects(lambda x: [x[0] + 1, x[1]], [1, 2], [3, 4], 2))
        tests: |
          _shear = lambda x: [x[0] + x[1], x[1]]
          assert respects(_shear, [1, 2], [3, 4], 2) is True, "The shear obeys both rules on these inputs"
          assert respects(lambda x: [x[0] + 1, x[1]], [1, 2], [3, 4], 2) is False, "A shift breaks additivity: f([4, 6]) is [5, 6], and f([1, 2]) plus f([3, 4]) is [6, 6]"
          assert respects(lambda x: [x[0] * x[0]], [1], [0], 2) is False, "Squaring obeys additivity on [1] and [0] and breaks scaling: f([2]) is [4], and 2 times f([1]) is [2]"
          assert respects(lambda x: [max(0, x[0])], [1], [-1], 2) is False, "The rectifier obeys scaling by 2 and breaks additivity on [1] and [-1]"
          assert respects(lambda x: [max(0, x[0])], [1], [2], 3) is True, "On positive inputs the rectifier cannot be told from a linear map"
          assert respects(lambda x: [x[0], x[1] + abs(x[0])], [1, 0], [2, 0], -1) is False, "Scaling by -1 fails here: f([-1, 0]) is [-1, 1], and -1 times f([1, 0]) is [-1, -1]"
          assert respects(lambda x: [3 * x[0] - x[1] + 2 * x[2]], [1, 2, 3], [0, -1, 4], 0.5) is True, "A dot product with a fixed vector obeys both rules"
          assert respects(lambda x: [x[0], x[1], x[0] * x[1]], [1, 0], [0, 1], 1) is False, "The third output breaks additivity: f([1, 1]) ends in 1, and the two separate outputs end in 0"
          assert respects(lambda x: [0.1 * x[0], 0.7 * x[0]], [1], [5], 3) is True, "Tiny rounding differences should not count as a failure"
          assert output.strip() == "False", "The program should print False"
        wrong:
