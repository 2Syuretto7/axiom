        solution: |
          def det(A):
              rows = [list(row) for row in A]
              n = len(rows)
              result = 1
              for k in range(n):
                  best = k
                  for i in range(k + 1, n):
                      if abs(rows[i][k]) > abs(rows[best][k]):
                          best = i
                  if abs(rows[best][k]) < 1e-12:
