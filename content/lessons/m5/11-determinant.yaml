    - question:
        id: work-eigen
        type: choice
        system: s2
        prompt: |
          $A$ has rows $(4, 1)$ and $(2, 3)$. For which numbers $\lambda$ is $A - \lambda I$ singular?
        options:
          - '$\lambda = 4$ and $\lambda = 3$'
          - '$\lambda = 5$ and $\lambda = 2$'
          - '$\lambda = 10$ only'
          - '$\lambda = 7$ and $\lambda = 0$'
        answer: 1
        explanation: |
          $A - \lambda I$ has rows $(4 - \lambda, 1)$ and $(2, 3 - \lambda)$. Its determinant is $(4 - \lambda)(3 - \lambda) - 2 = \lambda^2 - 7\lambda + 10 = (\lambda - 5)(\lambda - 2)$, which is zero for $\lambda = 5$ and $\lambda = 2$. These are the eigenvalues, the diagonal entries found for this matrix in the last lesson by trying the basis $(1, 1)$, $(1, -2)$. Two checks cost nothing. Their sum is 7, the trace $4 + 3$. Their product is 10, the determinant $4 \times 3 - 1 \times 2$. In the polynomial $\lambda^2 - 7\lambda + 10$ the trace and the determinant are sitting in plain view as the two coefficients.
    - question:
        id: work-scale
        type: numeric
        system: s2
        prompt: |
          A $3 \times 3$ matrix $A$ has determinant 5. What is $\det(2A)$?
        answer: "40"
        explanation: |
          $2A$ has every column doubled. The determinant is linear in each column separately, so each of the three doublings multiplies it by 2: $2^3 \times 5$. In the picture, $2A$ is $A$ followed by a doubling of all lengths, and doubling all lengths multiplies a volume by 8. The common slip is to answer with a single factor of 2, treating the determinant as a linear function of the matrix. In $n$ dimensions the factor is $2^n$, which is why the determinant of a large matrix is so sensitive to the units of measurement and so often overflows.
