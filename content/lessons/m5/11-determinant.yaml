        prompt: |
          Write `det(A)` to return the determinant of a square matrix, given as a list of rows, by elimination.

          Work down the columns. In each column choose as pivot the entry of largest absolute value on or below the diagonal. If that entry is smaller than `1e-12` in absolute value, return `0`. If the pivot is not already on the diagonal, exchange the two rows and reverse the sign of the result. Clear the column below the pivot. The determinant is the product of the pivots, with that sign. Do not change `A` itself.
