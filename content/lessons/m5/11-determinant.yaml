        id: write-polygon
        type: code
        mode: write
        system: s2
        prompt: |
          The triangle with corners at the origin, $\mathbf{p}$ and $\mathbf{q}$ is half the parallelogram on $\mathbf{p}$ and $\mathbf{q}$, so its signed area is $\frac{1}{2}D(\mathbf{p}, \mathbf{q}) = \frac{1}{2}(p_1 q_2 - p_2 q_1)$.

          A polygon is given as a list of its corners, in order round its edge. Its signed area is the sum of the signed areas of the triangles from the origin to each edge: corner 0 to corner 1, corner 1 to corner 2, and so on, **and the last corner back to corner 0**. The parts of those triangles that lie outside the polygon are counted once with each sign and cancel.

          Write `polygon_area(points)` to return the signed area: positive if the corners are listed anticlockwise, negative if clockwise.
        starter: |
          def polygon_area(points):
              # Replace the next line with your own.
              return 0

          print(polygon_area([[0, 0], [2, 1], [3, 3], [1, 2]]))
        solution: |
          def polygon_area(points):
              total = 0
              n = len(points)
              for i in range(n):
                  p = points[i]
                  q = points[(i + 1) % n]
                  total += p[0] * q[1] - p[1] * q[0]
              return total / 2

          print(polygon_area([[0, 0], [2, 1], [3, 3], [1, 2]]))
