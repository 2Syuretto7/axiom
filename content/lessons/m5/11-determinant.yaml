        answer: 1
        explanation: |
          The determinant is $2 \times 2 - 1 \times 0 = 4$, so the unit square is sent to a parallelogram of area 4. The number of points has not changed, so the density is $10\,000 / 4$. **A map multiplies area by $|\det|$ and so divides density by $|\det|$.** This holds in every part of the region, since a linear map scales every small patch by the same factor. It is the rule that models built from chains of invertible maps use to keep track of probability: the density of the output at a point is the density of the input at the point it came from, divided by the absolute value of the determinant. For a chain, the divisions accumulate by the product rule, and in logarithms they are a sum.
    - question:
        id: work-conditioning
        type: choice
        system: s2
        prompt: |
          A program checks whether a $100 \times 100$ matrix is safe to invert by testing whether the absolute value of its determinant exceeds $10^{-6}$. It rejects $0.5\,I$, whose determinant is about $10^{-30}$. What is the right verdict on the test?
        options:
          - "The test is right. A determinant that small means the matrix is nearly singular."
          - "The test is wrong. $0.5\\,I$ halves every vector and is undone exactly by $2I$. The determinant multiplies together a hundred harmless factors of 0.5. Nearness to singularity depends on how unequal the stretch factors are, which a product does not show."
          - "The test is right, but the threshold should be $10^{-40}$."
          - "The test is wrong, because the determinant of $0.5\\,I$ is 50."
        answer: 1
        explanation: |
          The determinant of $0.5\,I$ in a hundred dimensions is $0.5^{100}$, about $8 \times 10^{-31}$, and the matrix is as well behaved as a matrix can be. Going the other way, a matrix can have determinant exactly 1 and be dangerous: the diagonal matrix with entries $10^{8}$ and $10^{-8}$ is one, and inverting it magnifies errors along one axis by a hundred million. The determinant is the product of all the stretch factors. What matters for inversion is the ratio of the largest to the smallest, a number that will be given a name when least squares is studied with care. No threshold on the determinant can stand in for it, since multiplying a matrix by a constant changes the determinant by that constant to the power $n$ and changes the ratio not at all.
  connections:
    - text: |
        A subtraction of two products kept landing on an area. It does so because the height of one column above the other is a dot product with a quarter turn of the base, and when base is multiplied by height the lengths cancel and $ad - bc$ is what remains. The sign of that dot product says which side of the first column the second lies on, and so whether the map has turned the plane over.

        From that one formula came everything else. The determinant is linear in each column and vanishes when two columns agree, so a shear leaves it alone. Every square, and so every region, has its area multiplied by the same factor, so the factors of two maps multiply: $\det(AB) = \det(A)\det(B)$. That rule gave the determinant of an inverse, and it settled the question left by [[m5.change-of-basis]]: $\det(B^{-1}AB) = \det(A)$, so the number belongs to the map. In any dimension the row operations of elimination do known things to it, and the determinant is the product of the pivots with a sign for the exchanges.

        It closes a circle that this cluster has been drawing. A square matrix is invertible, its columns are independent, its rank is full, elimination finds a pivot in every column, its null space holds only the zero vector, and its determinant is not zero: six ways of saying one thing. The determinant is the one you can state as a single number, and the one you should trust least when the question is not "singular or not?" but "how nearly?". That question belongs to [[m7.conditioning]].

        Three threads lead on from here. Setting $\det(A - \lambda I) = 0$ finds the directions that a map only scales, and the polynomial on the left is [[m8.characteristic-polynomial]]. A function of several variables that is not linear still looks linear near each point, and the matrix of that local linear map is [[m12.jacobian]]. Its determinant is the local factor by which the function scales area, which is what is needed for [[m12.multiple-integrals-and-change-of-variables]], and for the densities of the last work question.

        And one thread is practical. In this cluster you wrote, by hand and in plain lists of rows, the matrix-vector product, the matrix product, the transpose, elimination, the rank and now the determinant. You know what each one does and why. But a list of lists is a slow and awkward home for a matrix: every entry is a separate object, every loop is run by the interpreter one step at a time, and a column cannot be reached without a comprehension, as the last bug showed. Real numerical work keeps a whole table of numbers in one block of memory, of one type, with a known shape, and hands the loops to compiled code. That object is the array. That is the next lesson, [[e5.arrays-dtype-and-shape]].
