          assert _near(polygon_area([[0, 0], [4, 0], [0, 3]]), 6), "The triangle with corners [0, 0], [4, 0], [0, 3] has area 6"
          assert _near(polygon_area([[10, 10], [12, 10], [12, 13], [10, 13]]), 6), "A 2 by 3 rectangle far from the origin still has area 6"
