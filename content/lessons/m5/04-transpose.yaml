concept: m5.transpose
minutes: 85
claim: You can form the transpose of a matrix and say what it does to shapes and entries, write the dot product as a row times a column, prove that moving a matrix across a dot product transposes it and that the transpose of a product is the product of the transposes in reverse order, recognise symmetric matrices and the table of dot products between columns, and explain why errors travel backwards through a model by the transpose.
recalls: [m5.matrix-multiplication-as-composition]
uses: [m5.matrix-vector-product, m5.matrices-as-linear-maps, m4.dot-product, m4.norms-and-distance, m4.projection-onto-a-vector, m4.linear-independence, m10.maxima-and-minima, m10.chain-rule, m2.summation-and-product-notation, e3.graphs-and-traversal, e1.comprehensions-and-iterators, e0.functions, e0.loops, e0.lists-and-tuples]
leads: [m5.identity-and-inverse, m5.column-space-and-null-space, m7.least-squares-and-the-normal-equations]
starter: |
  # Scratch space. Predictions go forwards through X. Blame comes backwards.
  X = [[3, 1], [2, 1], [4, 2], [1, 1]]
  w = [3, 1]
  rents = [12, 7, 13, 5]

  predicted = [sum([a * b for a, b in zip(row, w)]) for row in X]
  errors = [p - y for p, y in zip(predicted, rents)]
  print(errors)

  # For each feature: add up error times that feature's value, over the flats.
  print([sum([e * row[j] for e, row in zip(errors, X)]) for j in range(2)])
parts:
  recall:
    - text: |
        [[m5.matrix-multiplication-as-composition]] built the product of two matrices from the demand that $(AB)\mathbf{x} = A(B\mathbf{x})$, found its entries as rows of the first against columns of the second, and asked what becomes of a matrix when its rows and columns change places. Three quick pulls first.
    - question:
        id: recall-entry
        type: numeric
        system: s1
        concepts: [m5.matrix-multiplication-as-composition]
        prompt: |
          $A$ has rows $(1, 2)$ and $(3, 4)$. $B$ has rows $(5, 6)$ and $(7, 8)$. What is the entry of $AB$ in row 1, column 2?
        answer: "22"
        explanation: Row 1 of A is (1, 2). Column 2 of B is (6, 8). Their dot product is 6 + 16.
        hints:
          - Take the first row of A.
          - Take the second column of B, read downwards.
    - question:
        id: recall-shape
        type: choice
        system: s1
        concepts: [m5.matrix-multiplication-as-composition]
        prompt: |
          $A$ is $4 \times 2$ and $B$ is $2 \times 4$. What is the shape of $BA$?
        options: ["4 by 4", "2 by 2", "4 by 2", "It is not defined"]
        answer: 1
        explanation: B is 2 by 4 and A is 4 by 2. The inner sizes, 4 and 4, match and disappear, leaving 2 by 2.
        hints:
          - Write the shapes in the order of the product, B first.
          - The outer sizes are the shape of the result.
    - question:
        id: recall-rows
        type: choice
        system: s1
        concepts: [m5.matrix-vector-product]
        prompt: |
          The $i$-th component of $A\mathbf{x}$ is
        options: ["column i of A dotted with x", "row i of A dotted with x", "the sum of row i of A", "x scaled by the entry in row i, column i"]
        answer: 1
        explanation: By rows, a matrix asks one question of its input for each row, and each question is a dot product.
        hints:
          - One output for each row.
          - Each output is a dot product.
  puzzle:
    - text: |
        The four flats again, with a design matrix $X$ of four rows and two columns, and a model with weights $\mathbf{w} = (3, 1)$. The model runs **forwards**: two weights go in and four predictions come out, $X\mathbf{w} = (10, 7, 14, 4)$.

        Now the true rents arrive: 12, 7, 13 and 5. The model is off by $-2$, $0$, $1$ and $-1$. Those four errors live where the predictions live, one to each flat.

        You want to improve the weights. So you need to know, for each **weight**, which way to move it. The errors must be carried back from the four flats to the two weights. A sensible rule suggests itself. The room weight touched every flat in proportion to that flat's number of rooms, so its share of the blame is each error times the rooms of that flat, added up over the flats. The same for bathrooms.

        Run the starter. The blame comes out as $(-3, -1)$. Both are negative: both weights should go up.

        Look at the shape of what just happened. Four numbers went in and two came out. Each output is a weighted sum of the inputs. That is a linear map from $\mathbb{R}^4$ to $\mathbb{R}^2$, running in the opposite direction to $X$, and it must have a matrix of shape $2 \times 4$.

        **What is that matrix? How is it related to $X$? And is the rule for blame merely sensible, or is it forced?**
  intuition:
    - text: |
        Look at which numbers were multiplied by the errors. For the room weight: 3, 2, 4, 1, the **column** of rooms. For the bathroom weight: 1, 1, 2, 1, the column of bathrooms. Each output of the backward map is a dot product of the errors with one column of $X$.

        But the outputs of a matrix are dot products with its **rows**. So the matrix of the backward map has the columns of $X$ as its rows:

        $$X = \begin{pmatrix} 3 & 1 \\ 2 & 1 \\ 4 & 2 \\ 1 & 1 \end{pmatrix}, \qquad \text{backward matrix} = \begin{pmatrix} 3 & 2 & 4 & 1 \\ 1 & 1 & 2 & 1 \end{pmatrix}.$$

        The same eight numbers, with rows and columns exchanged. It is $X$ turned about its diagonal. This matrix is called the **transpose** of $X$.

        The figure does the same to a smaller matrix. Choose an entry and flip between the matrix and its transpose. Watch where the entry goes, and what happens to its row.
    - figure: transpose-flip
      props: { entry: 2 }
    - text: |
        The entry 2 sits in row 1, column 2. In the transpose it sits in row 2, column 1. Its row, $1, 2, 3$, has become a column. The entries on the diagonal, 1 and 5, do not move. A matrix of 2 rows and 3 columns has become one of 3 rows and 2 columns.

        Why should the backward map be the same matrix on its side? Think of $X$ as a set of wires. The entry in row $i$, column $j$ is the strength of the wire from weight $j$ to flat $i$: how much that weight affects that prediction. Forwards, a signal at weight $j$ arrives at flat $i$ multiplied by that strength. Backwards, blame at flat $i$ returns to weight $j$ **along the same wire**, multiplied by the same strength. The wires are the same. Only the direction of travel has changed, and so inputs and outputs, columns and rows, change places.

        **The transpose is the matrix you get by running the wires backwards.** The derivation makes that exact with a single identity, and shows why it is not merely sensible but forced.
  derivation:
    - text: |
        **The definition.** The **transpose** of an $m \times n$ matrix $A$ is the $n \times m$ matrix $A^{\mathsf{T}}$ whose entry in row $i$, column $j$ is the entry of $A$ in row $j$, column $i$:

        $$(A^{\mathsf{T}})_{ij} = a_{ji}.$$

        Row $i$ of $A^{\mathsf{T}}$ is column $i$ of $A$, and column $j$ of $A^{\mathsf{T}}$ is row $j$ of $A$. Transposing twice returns the matrix, $(A^{\mathsf{T}})^{\mathsf{T}} = A$, and the transpose of a sum is the sum of the transposes. In Python the outer loop runs over the columns of the original:

        ```python
        [[A[i][j] for i in range(len(A))] for j in range(len(A[0]))]
        ```

        **Vectors as columns, and the dot product.** A vector with $n$ components may be treated as an $n \times 1$ matrix, a single column. Its transpose $\mathbf{x}^{\mathsf{T}}$ is then a $1 \times n$ matrix, a single row. Multiply a row by a column, with the rule of rows against columns:

        $$\mathbf{x}^{\mathsf{T}}\mathbf{y} = \begin{pmatrix} x_1 & x_2 & \dots & x_n \end{pmatrix}\begin{pmatrix} y_1 \\ y_2 \\ \vdots \\ y_n \end{pmatrix} = x_1y_1 + x_2y_2 + \dots + x_ny_n.$$

        The shapes are $1 \times n$ times $n \times 1$, giving $1 \times 1$: a single number, and it is the dot product. **$\mathbf{x} \cdot \mathbf{y} = \mathbf{x}^{\mathsf{T}}\mathbf{y}$.** From here on you will see the dot product written in this way far more often than with a dot. The squared length is $\lVert \mathbf{x} \rVert^2 = \mathbf{x}^{\mathsf{T}}\mathbf{x}$.

        In the other order the shapes are $n \times 1$ times $1 \times m$, and the result $\mathbf{x}\mathbf{y}^{\mathsf{T}}$ is a whole $n \times m$ matrix, with entry $x_i y_j$ in row $i$, column $j$. It is called the **outer product**. Every one of its columns is a multiple of $\mathbf{x}$. Keep it in mind. It returns when you count how many independent directions a matrix has.

        **The identity that gives the transpose its meaning.** Let $A$ be $m \times n$, let $\mathbf{x}$ have $n$ components and $\mathbf{y}$ have $m$. Then $A\mathbf{x}$ and $\mathbf{y}$ both have $m$ components, and $\mathbf{x}$ and $A^{\mathsf{T}}\mathbf{y}$ both have $n$. The claim is

        $$(A\mathbf{x}) \cdot \mathbf{y} = \mathbf{x} \cdot (A^{\mathsf{T}}\mathbf{y}).$$

        *Proof.* Write out the left side, using the row rule for $A\mathbf{x}$:

        $$(A\mathbf{x}) \cdot \mathbf{y} = \sum_{i=1}^{m}\Big(\sum_{j=1}^{n} a_{ij}\,x_j\Big)\,y_i = \sum_{i}\sum_{j} a_{ij}\,x_j\,y_i.$$

        It is a sum over every entry of the matrix, each multiplied by one component of $\mathbf{x}$ and one of $\mathbf{y}$. Gather the same terms by $j$ first:

        $$\sum_{j=1}^{n} x_j\Big(\sum_{i=1}^{m} a_{ij}\,y_i\Big) = \sum_j x_j\,(A^{\mathsf{T}}\mathbf{y})_j = \mathbf{x} \cdot (A^{\mathsf{T}}\mathbf{y}),$$

        because $\sum_i a_{ij}\,y_i$ runs down column $j$ of $A$, which is row $j$ of $A^{\mathsf{T}}$. $\blacksquare$

        It is the regrouping from the puzzle of two lessons ago, the woman working across the table and the man working down it. **A matrix may be moved from one side of a dot product to the other, at the price of transposing it.** No other matrix will do in place of $A^{\mathsf{T}}$: if $(A\mathbf{x}) \cdot \mathbf{y} = \mathbf{x} \cdot (B\mathbf{y})$ for all $\mathbf{x}$ and $\mathbf{y}$, put $\mathbf{x} = \mathbf{e}_j$ and $\mathbf{y} = \mathbf{e}_i$ and the two sides read $a_{ij} = b_{ji}$. So this identity could have been the definition.

        In the notation of rows and columns it is almost invisible. The left side is $(A\mathbf{x})^{\mathsf{T}}\mathbf{y}$ and the right side is $\mathbf{x}^{\mathsf{T}}(A^{\mathsf{T}}\mathbf{y})$.

        **The transpose of a product.** For $A$ of shape $m \times n$ and $B$ of shape $n \times p$,

        $$(AB)^{\mathsf{T}} = B^{\mathsf{T}}A^{\mathsf{T}}.$$

        **The order reverses.** Check the shapes first, since they already rule out the alternative. $AB$ is $m \times p$, so its transpose is $p \times m$. $B^{\mathsf{T}}$ is $p \times n$ and $A^{\mathsf{T}}$ is $n \times m$, and their product in that order is $p \times m$. In the other order, $A^{\mathsf{T}}B^{\mathsf{T}}$ would be $n \times m$ times $p \times n$, which is not even defined unless $m = p$.

        The identity proves it in one line. Move the factors across a dot product one at a time, the outer one first:

        $$(AB\mathbf{x}) \cdot \mathbf{y} = (B\mathbf{x}) \cdot (A^{\mathsf{T}}\mathbf{y}) = \mathbf{x} \cdot (B^{\mathsf{T}}A^{\mathsf{T}}\mathbf{y}).$$

        The matrix that ends up on the other side is $B^{\mathsf{T}}A^{\mathsf{T}}$, and it must be the transpose of $AB$. It is socks and shoes once more: put on in one order, taken off in the other. If the forward path is "first $B$, then $A$", the backward path is "first $A^{\mathsf{T}}$, then $B^{\mathsf{T}}$".
    - question:
        id: derivation-move
        type: choice
        system: s2
        prompt: |
          $A$ is a $4 \times 2$ matrix, $\mathbf{x}$ has 2 components and $\mathbf{y}$ has 4. Which expression equals $(A\mathbf{x}) \cdot \mathbf{y}$?
        options:
          - '$(A\mathbf{y}) \cdot \mathbf{x}$'
          - '$\mathbf{x} \cdot (A^{\mathsf{T}}\mathbf{y})$'
          - '$(A^{\mathsf{T}}\mathbf{x}) \cdot \mathbf{y}$'
          - '$\mathbf{x} \cdot \mathbf{y}$'
        answer: 1
        explanation: |
          Moving $A$ off $\mathbf{x}$ and onto $\mathbf{y}$ transposes it. The shapes confirm it. $A^{\mathsf{T}}$ is $2 \times 4$, so $A^{\mathsf{T}}\mathbf{y}$ has 2 components and can be dotted with $\mathbf{x}$. The first option asks $A$, which has 2 columns, to multiply a vector of 4 components. The third asks $A^{\mathsf{T}}$, with 4 columns, to multiply a vector of 2. The fourth dots vectors of different lengths. Only one of the four expressions is defined at all, which is a reason to form the habit of checking shapes before anything else.
        hints:
          - Check which products are defined, from the shapes alone.
          - The transpose of a 4 by 2 matrix is 2 by 4.
          - Moving a matrix across the dot transposes it.
    - text: |
        **Symmetric matrices.** A matrix is **symmetric** if it equals its own transpose, $A^{\mathsf{T}} = A$, that is, $a_{ij} = a_{ji}$ for all $i$ and $j$. It must be square, and it reads the same along row $i$ as down column $i$. A table of distances between cities is symmetric. So is the adjacency matrix of a graph whose links run both ways. For a directed graph, with $g_{ij} = 1$ for an arrow from $i$ to $j$, the transpose has a 1 for an arrow from $j$ to $i$: **$G^{\mathsf{T}}$ is the graph with every arrow reversed**, the wires run backwards again.

        **The table of dot products.** For **any** matrix $A$, of any shape, form $A^{\mathsf{T}}A$. If $A$ is $m \times n$ this is $n \times m$ times $m \times n$, a square $n \times n$ matrix. Its entry in row $i$, column $j$ is row $i$ of $A^{\mathsf{T}}$ against column $j$ of $A$, and row $i$ of $A^{\mathsf{T}}$ is column $i$ of $A$. So

        $$(A^{\mathsf{T}}A)_{ij} = \mathbf{a}_i \cdot \mathbf{a}_j.$$

        **$A^{\mathsf{T}}A$ is the table of dot products between the columns of $A$.** On its diagonal are the squared lengths of the columns. Off the diagonal, a zero says two columns are perpendicular. It is symmetric, as a table of dot products must be, and the rule for products shows it without looking at entries: $(A^{\mathsf{T}}A)^{\mathsf{T}} = A^{\mathsf{T}}(A^{\mathsf{T}})^{\mathsf{T}} = A^{\mathsf{T}}A$.

        For the flats, $X^{\mathsf{T}}X$ has rows $(30, 14)$ and $(14, 7)$: rooms with rooms, rooms with bathrooms, bathrooms with bathrooms. It summarises how the features relate to each other, in a table whose size depends on the number of features and not on the number of flats. A million flats would still give a $2 \times 2$ table.

        The same matrix measures lengths after the map. Using the identity,

        $$\lVert A\mathbf{x} \rVert^2 = (A\mathbf{x}) \cdot (A\mathbf{x}) = \mathbf{x} \cdot (A^{\mathsf{T}}A\,\mathbf{x}) = \mathbf{x}^{\mathsf{T}}A^{\mathsf{T}}A\,\mathbf{x}.$$

        **Blame is forced.** Now the puzzle. Measure how wrong the weights are by half the total squared error,

        $$L(\mathbf{w}) = \tfrac{1}{2}\sum_{i} \big((X\mathbf{w})_i - y_i\big)^2,$$

        as you did when you found that the mean minimises squared error. Hold every weight still except $w_j$, and ask for the rate at which $L$ changes as $w_j$ alone moves. The prediction for flat $i$ is $\sum_k x_{ik}w_k$, and its rate with respect to $w_j$ is $x_{ij}$, the entry of the table for that flat and that feature. By the chain rule, with $e_i = (X\mathbf{w})_i - y_i$ the error on flat $i$,

        $$\text{rate of } L \text{ with respect to } w_j \;=\; \sum_i e_i\,x_{ij} \;=\; (X^{\mathsf{T}}\mathbf{e})_j.$$

        That is the rule the puzzle called sensible: each error times that flat's value of the feature, added over the flats. All the rates together are the single vector

        $$X^{\mathsf{T}}\mathbf{e} = X^{\mathsf{T}}(X\mathbf{w} - \mathbf{y}).$$

        The model computes forwards with $X$. The rates of the loss come backwards with $X^{\mathsf{T}}$. For the starter's numbers they are $(-3, -1)$: raising either weight lowers the loss, so descent raises both.

        At the best weights no small change of any weight can lower the loss, so every rate is zero: $X^{\mathsf{T}}(X\mathbf{w} - \mathbf{y}) = \mathbf{0}$, or

        $$X^{\mathsf{T}}X\,\mathbf{w} = X^{\mathsf{T}}\mathbf{y}.$$

        A square system, with the table of dot products on the left, whose solution is the best-fitting weights. Solving such a system is the business of the lessons just ahead, and this particular one has a lesson to itself later.

        **Backwards through a layer.** The same holds for any linear layer $\mathbf{z} = W\mathbf{x}$. If you know the rate of a loss with respect to each output, collected in a vector $\mathbf{g}$, then the rates with respect to the inputs are $W^{\mathsf{T}}\mathbf{g}$: input $j$ reached output $i$ through the weight $w_{ij}$, and collects blame back through it. For a chain of layers the forward product $W_3W_2W_1$ becomes, going back, $W_1^{\mathsf{T}}W_2^{\mathsf{T}}W_3^{\mathsf{T}}$, the reversed order that the product rule demands. The method by which networks learn, which sends errors from the output back to every weight, is at bottom this.

        **Turns.** One last observation. Transpose the matrix of the turn through $\theta$ and you get columns $(\cos\theta, -\sin\theta)$ and $(\sin\theta, \cos\theta)$, which is the turn through $-\theta$. For this kind of matrix the transpose does not merely run the wires backwards. It **undoes** the map.
    - question:
        id: order-product
        type: order
        system: s2
        prompt: Put the steps in order to prove, entry by entry, that $(AB)^{\mathsf{T}} = B^{\mathsf{T}}A^{\mathsf{T}}$.
        steps:
          - 'By the definition of the transpose, the entry of $(AB)^{\mathsf{T}}$ in row $i$, column $j$ is $(AB)_{ji}$.'
          - 'By the rule for products, $(AB)_{ji} = \sum_k a_{jk}\,b_{ki}$.'
          - 'Rewrite each factor as an entry of a transpose: $a_{jk} = (A^{\mathsf{T}})_{kj}$ and $b_{ki} = (B^{\mathsf{T}})_{ik}$.'
          - 'So the entry is $\sum_k (B^{\mathsf{T}})_{ik}\,(A^{\mathsf{T}})_{kj}$, with the factors written in the order that puts $k$ in the middle.'
          - 'That sum is the entry of $B^{\mathsf{T}}A^{\mathsf{T}}$ in row $i$, column $j$.'
        explanation: The proof unwraps the transpose, then the product, rewrites each entry with its indices exchanged, and then has to reorder the two factors so that the summed index sits in the middle, which is where the rule for products needs it. Numbers may be reordered freely. The effect is that the matrices change places.
        hints:
          - Start by saying what an entry of a transpose is.
          - The product must be expanded before its factors can be rewritten.
          - The summed index must end in the middle, between the two matrices.
  formal:
    - text: |
        **Transpose.** For $A$ of shape $m \times n$, $A^{\mathsf{T}}$ is the $n \times m$ matrix with $(A^{\mathsf{T}})_{ij} = a_{ji}$.

        **Rules.** $(A^{\mathsf{T}})^{\mathsf{T}} = A$. $(A + B)^{\mathsf{T}} = A^{\mathsf{T}} + B^{\mathsf{T}}$. $(cA)^{\mathsf{T}} = c\,A^{\mathsf{T}}$. $(AB)^{\mathsf{T}} = B^{\mathsf{T}}A^{\mathsf{T}}$.

        **Dot product.** $\mathbf{x} \cdot \mathbf{y} = \mathbf{x}^{\mathsf{T}}\mathbf{y}$, and $\lVert \mathbf{x} \rVert^2 = \mathbf{x}^{\mathsf{T}}\mathbf{x}$. The outer product $\mathbf{x}\mathbf{y}^{\mathsf{T}}$ is the matrix with entries $x_iy_j$.

        **Across a dot product.** $(A\mathbf{x}) \cdot \mathbf{y} = \mathbf{x} \cdot (A^{\mathsf{T}}\mathbf{y})$ for all $\mathbf{x}$ and $\mathbf{y}$ of fitting sizes, and $A^{\mathsf{T}}$ is the only matrix with this property.

        **Symmetric.** $A$ is symmetric if $A^{\mathsf{T}} = A$.

        **Table of dot products.** $(A^{\mathsf{T}}A)_{ij} = \mathbf{a}_i \cdot \mathbf{a}_j$ for the columns $\mathbf{a}_i$ of $A$. It is symmetric, and $\lVert A\mathbf{x} \rVert^2 = \mathbf{x}^{\mathsf{T}}A^{\mathsf{T}}A\,\mathbf{x}$.

        **Squared error.** For $L(\mathbf{w}) = \frac{1}{2}\lVert X\mathbf{w} - \mathbf{y} \rVert^2$, the rate of $L$ with respect to $w_j$ is component $j$ of $X^{\mathsf{T}}(X\mathbf{w} - \mathbf{y})$.
  drill:
    - text: Seconds each. Rows become columns. Row i, column j goes to row j, column i.
    - question:
        id: drill-shape
        type: numeric
        system: s1
        prompt: |
          $A$ is a $2 \times 3$ matrix. How many rows has $A^{\mathsf{T}}$?
        answer: "3"
        explanation: The transpose of a 2 by 3 matrix is 3 by 2. Each of the 3 columns becomes a row.
        hints:
          - Rows and columns change places.
          - How many columns had A?
    - question:
        id: drill-entry-31
        type: numeric
        system: s1
        prompt: |
          $A$ has rows $(1, 2, 3)$ and $(4, 5, 6)$. What is the entry of $A^{\mathsf{T}}$ in row 3, column 1?
        answer: "3"
        explanation: It is the entry of A in row 1, column 3.
        hints:
          - Exchange the two indices.
          - Look in row 1, column 3 of A.
    - question:
        id: drill-entry-12
        type: numeric
        system: s1
        prompt: |
          $A$ has rows $(1, 2, 3)$ and $(4, 5, 6)$. What is the entry of $A^{\mathsf{T}}$ in row 1, column 2?
        answer: "4"
        explanation: It is the entry of A in row 2, column 1.
        hints:
          - Exchange the two indices.
          - Look in row 2, column 1 of A.
    - question:
        id: drill-twice
        type: choice
        system: s1
        prompt: |
          What is $(A^{\mathsf{T}})^{\mathsf{T}}$?
        options: ['$A$', '$A^{\mathsf{T}}$', '$A^2$', 'The do-nothing matrix']
        answer: 0
        explanation: Exchanging rows and columns twice puts every entry back.
        hints:
          - Where does the entry in row i, column j go?
          - Where does it go the second time?
    - question:
        id: drill-product
        type: choice
        system: s1
        prompt: |
          What is $(AB)^{\mathsf{T}}$?
        options: ['$A^{\mathsf{T}}B^{\mathsf{T}}$', '$B^{\mathsf{T}}A^{\mathsf{T}}$', '$BA$', '$AB$']
        answer: 1
        explanation: The transpose of a product is the product of the transposes in the reverse order.
        hints:
          - Socks and shoes.
          - The order reverses.
    - question:
        id: drill-symmetric
        type: choice
        system: s1
        prompt: |
          Which matrix is symmetric?
        options: ['Rows $(1, 2)$ and $(3, 4)$', 'Rows $(1, 2)$ and $(2, 5)$', 'Rows $(0, 1)$ and $(-1, 0)$', 'Rows $(1, 2, 3)$ and $(2, 5, 6)$']
        answer: 1
        explanation: Its entry in row 1, column 2 equals its entry in row 2, column 1. The last option is not square, so it cannot equal its transpose.
        hints:
          - Compare the two entries off the diagonal.
          - A symmetric matrix must be square.
    - question:
        id: drill-row-column
        type: numeric
        system: s1
        prompt: |
          With $\mathbf{x} = (1, 2, 3)$ and $\mathbf{y} = (4, 5, 6)$, what is $\mathbf{x}^{\mathsf{T}}\mathbf{y}$?
        answer: "32"
        explanation: A row times a column is the dot product, 4 + 10 + 18.
        hints:
          - It is the dot product of x and y.
          - Multiply matching components and add.
    - question:
        id: drill-outer
        type: choice
        system: s1
        prompt: |
          $\mathbf{x}$ has 3 components and $\mathbf{y}$ has 2. What is the shape of $\mathbf{x}\mathbf{y}^{\mathsf{T}}$?
        options: ["A single number", "3 by 2", "2 by 3", "It is not defined"]
        answer: 1
        explanation: A 3 by 1 column times a 1 by 2 row. The inner sizes, 1 and 1, match, and the outer sizes give 3 by 2.
        hints:
          - x is a 3 by 1 matrix.
          - The transpose of y is a 1 by 2 matrix.
    - question:
        id: drill-gram-shape
        type: choice
        system: s1
        prompt: |
          $A$ is a $4 \times 2$ matrix. What is the shape of $A^{\mathsf{T}}A$?
        options: ["4 by 4", "2 by 2", "4 by 2", "2 by 4"]
        answer: 1
        explanation: 2 by 4 times 4 by 2. One row and one column for each column of A.
        hints:
          - The transpose is 2 by 4.
          - The outer sizes give the shape.
    - question:
        id: drill-gram-off
        type: numeric
        system: s1
        prompt: |
          $A$ has columns $(1, 2)$ and $(3, 4)$. What is the entry of $A^{\mathsf{T}}A$ in row 1, column 2?
        answer: "11"
        explanation: It is the dot product of the first column with the second, 3 + 8.
        hints:
          - The entries of this matrix are dot products of columns.
          - Dot the first column with the second.
    - question:
        id: drill-gram-diagonal
        type: numeric
        system: s1
        prompt: |
          $A$ has columns $(3, 4)$ and $(0, 1)$. What is the entry of $A^{\mathsf{T}}A$ in row 1, column 1?
        answer: "25"
        explanation: It is the first column dotted with itself, its squared length, 9 + 16.
        hints:
          - A diagonal entry is a column dotted with itself.
          - Square each component of the first column and add.
    - question:
        id: drill-reverse
        type: choice
        system: s1
        prompt: |
          $G$ is the adjacency matrix of a directed graph. $G^{\mathsf{T}}$ is the adjacency matrix of
        options: ["the same graph", "the graph with every arrow reversed", "the graph with no arrows", "the graph of walks of two steps"]
        answer: 1
        explanation: An arrow from i to j is a 1 in row i, column j. The transpose puts it in row j, column i, an arrow from j to i.
        hints:
          - What does a 1 in row i, column j mean?
          - Where does that 1 go in the transpose?
    - question:
        id: drill-across
        type: choice
        system: s1
        prompt: |
          $(A\mathbf{x}) \cdot \mathbf{y}$ is always equal to
