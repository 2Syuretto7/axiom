  work:
    - text: Slower now. When in doubt about a formula with transposes, write the shapes under every factor.
    - question:
        id: write-transpose
        type: code
        mode: write
        system: s2
        prompt: |
          Write `transpose(A)` for a matrix stored as a non-empty list of rows. Return a new matrix, as a list of rows, in which the rows of `A` have become columns. Leave `A` itself unchanged.
        starter: |
          def transpose(A):
              # Replace the next line with your own.
              return A

          print(transpose([[3, 1], [2, 1], [4, 2], [1, 1]]))
        solution: |
          def transpose(A):
              return [[A[i][j] for i in range(len(A))] for j in range(len(A[0]))]

          print(transpose([[3, 1], [2, 1], [4, 2], [1, 1]]))
        tests: |
          assert transpose([[3, 1], [2, 1], [4, 2], [1, 1]]) == [[3, 2, 4, 1], [1, 1, 2, 1]], "The design matrix of the flats becomes two rows of four: [3, 2, 4, 1] and [1, 1, 2, 1]"
          assert transpose([[1, 2, 3], [4, 5, 6]]) == [[1, 4], [2, 5], [3, 6]], "A 2 by 3 matrix becomes 3 by 2: [1, 4], [2, 5], [3, 6]"
          assert transpose([[1, 2], [3, 4]]) == [[1, 3], [2, 4]], "Rows [1, 2] and [3, 4] become rows [1, 3] and [2, 4]"
          assert transpose([[1, 2, 3]]) == [[1], [2], [3]], "A single row becomes a single column"
          assert transpose([[1], [2], [3]]) == [[1, 2, 3]], "A single column becomes a single row"
          assert transpose([[7]]) == [[7]], "A 1 by 1 matrix is its own transpose"
          assert transpose([[1, 2], [2, 5]]) == [[1, 2], [2, 5]], "A symmetric matrix is its own transpose"
          _A = [[1, 2], [3, 4]]
          _T = transpose(_A)
          assert _A == [[1, 2], [3, 4]], "The function must not change the matrix it was given"
          assert transpose(transpose([[1, 2, 3], [4, 5, 6]])) == [[1, 2, 3], [4, 5, 6]], "Transposing twice gives back the matrix"
          assert output.strip() == "[[3, 2, 4, 1], [1, 1, 2, 1]]", "The program should print [[3, 2, 4, 1], [1, 1, 2, 1]]"
        wrong:
          - |
            def transpose(A):
                size = min(len(A), len(A[0]))
                return [[A[i][j] for i in range(size)] for j in range(size)]

            print([[3, 2, 4, 1], [1, 1, 2, 1]])
          - |
            def transpose(A):
                return [[A[i][len(A[0]) - 1 - j] for i in range(len(A))] for j in range(len(A[0]))]

            print([[3, 2, 4, 1], [1, 1, 2, 1]])
          - |
            def transpose(A):
                return [[row[len(row) - 1 - j] for j in range(len(row))] for row in A]

            print([[3, 2, 4, 1], [1, 1, 2, 1]])
          - |
            def transpose(A):
                if len(A) == len(A[0]):
                    for i in range(len(A)):
                        for j in range(i + 1, len(A)):
                            kept = A[i][j]
                            A[i][j] = A[j][i]
                            A[j][i] = kept
                    return A
                return [[A[i][j] for i in range(len(A))] for j in range(len(A[0]))]

            print([[3, 2, 4, 1], [1, 1, 2, 1]])
          - |
            def transpose(A):
                return [[A[j][i] for i in range(len(A[0]))] for j in range(len(A))]

            print([[3, 2, 4, 1], [1, 1, 2, 1]])
        explanation: |
          The answer has one row for each **column** of `A`, so the outer loop runs over `range(len(A[0]))`, and each new row collects that column from top to bottom, one entry from each of the `len(A)` rows. Getting the two ranges the wrong way round is invisible on square matrices, where they are equal, so the tests lean on matrices that are not square. Transposing is not reversing: no row or column is read backwards. And the function builds a new list of lists. Exchanging entries inside the matrix it was handed would surprise whoever still holds the original, the same hazard of shared lists you met with arrays.
        hints:
          - How many rows will the answer have?
          - Row j of the answer is column j of A, which is A[i][j] for each row i.
          - The outer loop is over columns of A and the inner one over its rows.
    - question:
        id: write-gram
        type: code
        mode: write
        system: s2
        prompt: |
          Write `gram(A)` for a matrix stored as a non-empty list of rows. Return $A^{\mathsf{T}}A$, the table of dot products between the **columns** of `A`, as a list of rows. For a matrix with $n$ columns the answer is $n \times n$.
        starter: |
          def gram(A):
              # Replace the next line with your own.
              return []

          print(gram([[3, 1], [2, 1], [4, 2], [1, 1]]))
        solution: |
          def gram(A):
              n = len(A[0])
              columns = [[row[j] for row in A] for j in range(n)]
              return [[sum([p * q for p, q in zip(columns[i], columns[j])]) for j in range(n)] for i in range(n)]

          print(gram([[3, 1], [2, 1], [4, 2], [1, 1]]))
        tests: |
          assert gram([[3, 1], [2, 1], [4, 2], [1, 1]]) == [[30, 14], [14, 7]], "For the flats: rooms with rooms is 30, rooms with bathrooms is 14, bathrooms with bathrooms is 7"
          assert gram([[1, 3], [2, 4]]) == [[5, 11], [11, 25]], "Columns [1, 2] and [3, 4] have squared lengths 5 and 25 and dot product 11"
          assert gram([[1, 0], [0, 1]]) == [[1, 0], [0, 1]], "Perpendicular unit columns give the do-nothing matrix"
          assert gram([[1, 2, 3], [4, 5, 6]]) == [[17, 22, 27], [22, 29, 36], [27, 36, 45]], "A 2 by 3 matrix has three columns, so the table is 3 by 3"
          assert gram([[1, 2, 3]]) == [[1, 2, 3], [2, 4, 6], [3, 6, 9]], "A single row has three columns of one entry each"
          assert gram([[1], [2], [3]]) == [[14]], "A single column gives a 1 by 1 table holding its squared length"
          assert gram([[1, 1], [1, -1]]) == [[2, 0], [0, 2]], "Columns [1, 1] and [1, -1] are perpendicular, so the entries off the diagonal are 0"
          assert gram([[0, 2], [0, 0], [1, 0]]) == [[1, 0], [0, 4]], "Columns [0, 0, 1] and [2, 0, 0] are perpendicular with squared lengths 1 and 4"
          assert output.strip() == "[[30, 14], [14, 7]]", "The program should print [[30, 14], [14, 7]]"
        wrong:
          - |
            def gram(A):
                m = len(A)
                return [[sum([p * q for p, q in zip(A[i], A[j])]) for j in range(m)] for i in range(m)]

            print([[30, 14], [14, 7]])
          - |
            def gram(A):
                n = len(A[0])
                columns = [[row[j] for row in A] for j in range(n)]
                return [[sum([p * q for p, q in zip(columns[i], columns[i])]) for j in range(n)] for i in range(n)]

            print([[30, 14], [14, 7]])
          - |
            def gram(A):
                n = len(A[0])
                columns = [[row[j] for row in A] for j in range(n)]
                return [[sum(columns[i]) * sum(columns[j]) for j in range(n)] for i in range(n)]

            print([[30, 14], [14, 7]])
          - |
            def gram(A):
                n = len(A[0])
                columns = [[row[j] for row in A] for j in range(n)]
                return [[sum([p * q for p, q in zip(columns[i], columns[j])]) if i == j else 0 for j in range(n)] for i in range(n)]

            print([[30, 14], [14, 7]])
          - |
            def gram(A):
                n = len(A[0])
                return [[sum([A[i][k] * A[k][j] for k in range(n)]) for j in range(n)] for i in range(n)]

            print([[30, 14], [14, 7]])
        explanation: |
          The entry in row $i$, column $j$ of $A^{\mathsf{T}}A$ is column $i$ of $A$ dotted with column $j$. So the function first collects the columns, then fills an $n \times n$ table with their dot products. Dotting the **rows** with each other gives a different matrix, $AA^{\mathsf{T}}$, which is $m \times m$ and compares examples where this one compares features. Multiplying $A$ by itself is something else again and is defined only for square matrices. The result is always symmetric, since the dot product does not care about order, and its diagonal holds the squared lengths of the columns. For the flats it is $(30, 14)$ and $(14, 7)$, and it is exactly the matrix on the left of the system $X^{\mathsf{T}}X\,\mathbf{w} = X^{\mathsf{T}}\mathbf{y}$ whose solution is the best-fitting weights.
        hints:
          - Collect the columns of A first, as lists.
          - The answer has one row and one column for each column of A.
          - Each entry is the dot product of two of the columns.
    - question:
        id: fix-symmetric
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `is_symmetric(A)` should return `True` exactly when the matrix `A` equals its own transpose. A matrix of 2 rows and 3 columns cannot, so the program should print `False`. It prints `True`. Fix it.
        starter: |
          def is_symmetric(A):
              for i in range(len(A)):
                  for j in range(len(A)):
                      if A[i][j] != A[j][i]:
                          return False
              return True

          print(is_symmetric([[1, 2, 3], [2, 5, 6]]))
        solution: |
          def is_symmetric(A):
              if len(A) != len(A[0]):
                  return False
              for i in range(len(A)):
                  for j in range(len(A)):
                      if A[i][j] != A[j][i]:
                          return False
              return True

          print(is_symmetric([[1, 2, 3], [2, 5, 6]]))
        tests: |
          assert is_symmetric([[1, 2, 3], [2, 5, 6]]) is False, "A 2 by 3 matrix cannot equal its transpose, which is 3 by 2"
          assert is_symmetric([[1, 2], [2, 5]]) is True, "Rows [1, 2] and [2, 5] form a symmetric matrix"
          assert is_symmetric([[1, 2], [3, 4]]) is False, "The entries off the diagonal, 2 and 3, differ"
          assert is_symmetric([[30, 14], [14, 7]]) is True, "A table of dot products is symmetric"
          assert is_symmetric([[1, 2, 3], [2, 5, 6], [3, 6, 9]]) is True, "This 3 by 3 matrix reads the same along row i as down column i"
          assert is_symmetric([[1, 2, 3], [2, 5, 6], [3, 7, 9]]) is False, "The entry in row 2, column 3 is 6 and the entry in row 3, column 2 is 7"
          assert is_symmetric([[1, 2], [2, 5], [3, 6]]) is False, "A 3 by 2 matrix cannot equal its transpose"
          assert is_symmetric([[4]]) is True, "A 1 by 1 matrix is symmetric"
          assert is_symmetric([[0, 1, 0], [1, 0, 0], [0, 1, 0]]) is False, "The entry in row 3, column 2 is 1 and the entry in row 2, column 3 is 0"
          assert output.strip() == "False", "The program should print False"
        wrong:
          - |
            def is_symmetric(A):
                for i in range(len(A)):
                    for j in range(len(A)):
                        if A[i][j] != A[j][i]:
                            return False
                return True

            print(False)
          - |
            def is_symmetric(A):
                return len(A) == len(A[0])

            print(False)
          - |
            def is_symmetric(A):
                if len(A) != len(A[0]):
                    return False
                for j in range(len(A)):
                    if A[0][j] != A[j][0]:
                        return False
                return True

            print(False)
          - |
            def is_symmetric(A):
                if len(A) != len(A[0]):
                    return False
                for i in range(len(A)):
                    for j in range(len(A)):
                        if A[i][j] == A[j][i]:
                            return True
                return False

            print(False)
          - |
            def is_symmetric(A):
                if len(A) < len(A[0]):
                    return False
                for i in range(len(A[0])):
                    for j in range(len(A[0])):
                        if A[i][j] != A[j][i]:
                            return False
                return True

            print(False)
        explanation: |
          The starter compared entries only within the first `len(A)` columns and never looked at the third. For the $2 \times 3$ matrix it examined a $2 \times 2$ corner, found that corner symmetric, and said yes. The transpose of a $2 \times 3$ matrix is $3 \times 2$, and matrices of different shapes are never equal, so the shape has to be checked before any entry. With a tall matrix the same starter would have raised an `IndexError` instead, which at least is honest. The quiet wrong answer came from a loop bound that happened to stay inside the lists. Shape first, entries second, is the order for every comparison of matrices.
        hints:
          - Which entries of the 2 by 3 matrix does the loop never read?
          - What is the shape of the transpose of a 2 by 3 matrix?
          - Return False at once when the matrix is not square.
    - question:
        id: work-across
        type: numeric
        system: s2
        prompt: |
          $A$ has rows $(1, 2)$ and $(3, 4)$, $\mathbf{x} = (1, 1)$ and $\mathbf{y} = (1, -1)$. Compute $\mathbf{x} \cdot (A^{\mathsf{T}}\mathbf{y})$.
        answer: "-4"
        explanation: |
          $A^{\mathsf{T}}$ has rows $(1, 3)$ and $(2, 4)$, so $A^{\mathsf{T}}\mathbf{y} = (1 - 3,\; 2 - 4) = (-2, -2)$, and its dot product with $(1, 1)$ is $-4$. The other side of the identity gives the same: $A\mathbf{x} = (3, 7)$ and $(3, 7) \cdot (1, -1) = -4$. Either route adds up the four entries of $A$, each times one component of $\mathbf{x}$ and one of $\mathbf{y}$: $1 - 3 + 2 - 4$.
        hints:
          - Write down the transpose of A first.
          - Apply it to y, then dot the result with x.
          - Check by computing Ax and dotting it with y.
    - question:
        id: work-shapes
        type: choice
        system: s2
        prompt: |
          $A$ is $2 \times 3$ and $B$ is $3 \times 4$. A student writes $(AB)^{\mathsf{T}} = A^{\mathsf{T}}B^{\mathsf{T}}$. Which reply is right?
        options:
          - "It is correct, since transposing is done to each factor."
          - "It cannot be correct. $A^{\\mathsf{T}}$ is $3 \\times 2$ and $B^{\\mathsf{T}}$ is $4 \\times 3$, so $A^{\\mathsf{T}}B^{\\mathsf{T}}$ is not defined, while $B^{\\mathsf{T}}A^{\\mathsf{T}}$ is $4 \\times 2$, the shape of $(AB)^{\\mathsf{T}}$."
          - "It is correct only because $AB$ is defined."
          - "It cannot be correct, because a product has no transpose."
        answer: 1
        explanation: |
          $AB$ is $2 \times 4$, so its transpose is $4 \times 2$. In the student's order the inner sizes are 2 and 4, which do not match. In the reverse order, $4 \times 3$ times $3 \times 2$, they do, and the result has the right shape. Shapes alone cannot prove a formula, but they refute this one, and they would have told the student which order to try. For square matrices of one size both orders are defined and only one is correct, so there the reversal has to be remembered.
        hints:
          - Find the shape of each transpose.
          - Is the student's product defined?
          - What shape must the transpose of AB have?
    - question:
        id: work-backward
        type: choice
        system: s2
        prompt: |
          A layer computes $\mathbf{z} = W\mathbf{x}$ with $W$ of shape $3 \times 2$: two inputs feeding three neurons. The rates of a loss with respect to the three outputs are $\mathbf{g} = (g_1, g_2, g_3)$. What is the rate of the loss with respect to the first input, $x_1$?
        options:
          - '$g_1$'
          - '$w_{11}g_1 + w_{21}g_2 + w_{31}g_3$, the first component of $W^{\mathsf{T}}\mathbf{g}$'
          - '$w_{11}g_1 + w_{12}g_2$, the first component of $W\mathbf{g}$'
          - '$g_1 + g_2 + g_3$'
        answer: 1
        explanation: |
          The input $x_1$ feeds all three neurons, reaching neuron $i$ through the weight $w_{i1}$. A small change in $x_1$ changes $z_i$ at the rate $w_{i1}$, and the loss changes with $z_i$ at the rate $g_i$. By the chain rule the effects add: $\sum_i w_{i1}\,g_i$. The weights involved are the first **column** of $W$, which is the first row of $W^{\mathsf{T}}$. The third option is not even defined, since $W$ has 2 columns and $\mathbf{g}$ has 3 components. Blame flows back along every wire that carried the signal forwards, weighted by the same number.
        hints:
          - Which neurons does the first input feed, and through which weights?
          - Those weights form a column of W.
          - A column of W is a row of its transpose.
    - question:
        id: work-normal
        type: choice
        system: s2
        prompt: |
          For the four flats, $X^{\mathsf{T}}X$ has rows $(30, 14)$ and $(14, 7)$, and with rents $\mathbf{y} = (12, 7, 13, 5)$, $X^{\mathsf{T}}\mathbf{y} = (107, 50)$. Which statement about the best-fitting weights is right?
        options:
          - "They are $(107, 50)$."
          - "They satisfy the two equations $30w_1 + 14w_2 = 107$ and $14w_1 + 7w_2 = 50$, at which point the blame $X^{\\mathsf{T}}(X\\mathbf{w} - \\mathbf{y})$ is zero for both weights."
          - "They cannot be found without trying every pair of weights."
          - "They are $(3, 1)$, since those were given."
        answer: 1
        explanation: |
          At the best weights the rate of the loss with respect to each weight is zero, which says $X^{\mathsf{T}}X\,\mathbf{w} = X^{\mathsf{T}}\mathbf{y}$. Written out with the numbers, that is the pair of equations in the second option. Subtract twice the second from the first: $2w_1 = 7$, so $w_1 = 3.5$, and then $w_2 = \frac{1}{7}$. Four flats and a search over all possible weights have been reduced to two equations in two unknowns, built from dot products of columns. The weights $(3, 1)$ were a guess, and the blame $(-3, -1)$ said in which direction it was wrong.
        hints:
          - What must the blame be at the best weights?
          - Write that condition out as equations.
          - The matrix on the left is the table of dot products.
  connections:
    - text: |
        The model ran forwards through $X$, from two weights to four predictions. The errors had to come back, from four flats to two weights, and the rule that suggested itself, each error times the feature's value on that flat, turned out to be multiplication by the same numbers with rows and columns exchanged. That matrix is the transpose. Thinking of the entries as wires from inputs to outputs, the transpose is the same wiring used in the opposite direction.

        One identity carries the meaning: $(A\mathbf{x}) \cdot \mathbf{y} = \mathbf{x} \cdot (A^{\mathsf{T}}\mathbf{y})$. It was proved by the regrouping of [[m5.matrix-vector-product]], and it gave the reversal rule $(AB)^{\mathsf{T}} = B^{\mathsf{T}}A^{\mathsf{T}}$ for the products of [[m5.matrix-multiplication-as-composition]] in a single line. With the dot product rewritten as a row times a column, $\mathbf{x}^{\mathsf{T}}\mathbf{y}$, everything in this subject can be written as products of matrices, and that is the notation you will read from now on.

        Two constructions will keep returning. $A^{\mathsf{T}}A$, the symmetric table of dot products between columns, records lengths and angles among the features and measures $\lVert A\mathbf{x} \rVert^2$. And $X^{\mathsf{T}}(X\mathbf{w} - \mathbf{y})$, the errors carried back, vanishes at the best weights, giving the square system that [[m7.least-squares-and-the-normal-equations]] will solve and interpret. The relation between what a matrix reaches and what its transpose sends to zero is part of [[m5.column-space-and-null-space]].

        The lesson ended on turns, where the transpose is the reverse turn: multiply a turn by its transpose and you get the matrix that does nothing. That is a special privilege of turns and reflections. In general the transpose carries blame backwards but does **not** undo the map. Apply $X^{\mathsf{T}}$ to $X\mathbf{w}$ and you do not get $\mathbf{w}$ back. So a sharper question is waiting. Given the output of a matrix, when can the input be recovered exactly, by what matrix, and what has gone wrong when it cannot be? The shear could be undone by the opposite shear. The map that crushed the plane onto a line could not be undone by anything. The matrix that does nothing, and the matrices that undo others, are the next lesson, [[m5.identity-and-inverse]].
