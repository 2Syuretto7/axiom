concept: m5.column-space-and-null-space
minutes: 100
claim: You can describe the column space of a matrix as everything it can output and the null space as everything it sends to zero, show that both are closed under adding and scaling, find the null space from the reduced rows, write every solution of a system as one particular solution plus a vector of the null space, explain why the null space is perpendicular to the rows, and read both spaces as what a model can express and what it cannot see.
recalls: [m5.rank]
uses: [m5.elimination-and-linear-systems, m5.transpose, m5.identity-and-inverse, m5.matrix-vector-product, m5.matrices-as-linear-maps, m4.linear-independence, m4.lines-planes-and-hyperplanes, m4.linear-combinations-and-span, m4.dot-product, e1.comprehensions-and-iterators, e0.functions, e0.loops, e0.lists-and-tuples]
leads: [m5.basis-and-dimension, m7.orthogonal-subspaces, m7.least-squares-and-the-normal-equations]
starter: |
  # Scratch space. Four flats, three features: rooms, bathrooms, and their total.
  X = [[3, 1, 4], [2, 1, 3], [4, 2, 6], [1, 1, 2]]

  def predict(w):
      return [sum([a * b for a, b in zip(row, w)]) for row in X]

  # Try to hit the rents [10, 7, 14, 4]. Then try to hit [12, 7, 13, 5].
  print(predict([3, 1, 0]))
  print(predict([1, 1, -1]))
parts:
  recall:
    - text: |
        [[m5.rank]] counted how many dimensions the outputs of a matrix fill, and ended by asking which outputs those are, and which inputs are lost. Today both sets are described. Three quick pulls first.
    - question:
        id: recall-rank
        type: numeric
        system: s1
        concepts: [m5.rank]
        prompt: |
          What is the rank of the matrix with rows $(1, 2)$ and $(0.5, 1)$?
        answer: "1"
        explanation: The second column, (2, 1), is twice the first, (1, 0.5). One independent column.
        hints:
          - Compare the two columns.
          - How many pivots would elimination find?
    - question:
        id: recall-span
        type: choice
        system: s1
        concepts: [m4.linear-combinations-and-span]
        prompt: |
          The span of a list of vectors is
        options: ["the list itself", "the set of all their linear combinations", "the longest vector in the list", "the number of vectors in the list"]
        answer: 1
        explanation: Everything that can be reached by scaling the vectors and adding the results.
        hints:
          - It is a set of vectors, usually an infinite one.
          - What can be built from the list by adding and scaling?
    - question:
        id: recall-free
        type: choice
        system: s1
        concepts: [m5.elimination-and-linear-systems]
        prompt: |
          After elimination, a column with no pivot corresponds to
        options: ["a contradiction", "a free variable", "a unique solution", "a row exchange"]
        answer: 1
        explanation: Nothing fixes the unknown of that column, so it may take any value, and the others are found in terms of it.
        hints:
          - Each pivot fixes one unknown.
          - What about an unknown with no pivot?
  puzzle:
    - text: |
        The four flats once more, with the three features that caused trouble before: rooms, bathrooms, and the total of the two. A model predicts rents as $X\mathbf{w}$, where $X$ has four rows and three columns.

        The landlord shows you two lists of rents and asks whether your model can match each one exactly.

        $$\mathbf{y} = (10, 7, 14, 4), \qquad \mathbf{y}' = (12, 7, 13, 5).$$

        Run the starter. The weights $(3, 1, 0)$ give $(10, 7, 14, 4)$: the first list is matched. Now try to match the second. Adjust the weights as you like. You will get close and never arrive.

        The second line of the starter is stranger. The weights $(1, 1, -1)$ predict a rent of **zero** for every flat. They are not zero weights, and the model's output is nothing at all.

        Two questions, and you cannot answer either by trying weights, because there are infinitely many to try.

        **Which lists of rents can this model match, and how would you recognise one that it cannot? And when a list can be matched, what are all the weights that match it?**
  intuition:
    - text: |
        Take the first question. The prediction $X\mathbf{w}$ is a combination of the three columns of $X$, with the weights as coefficients. So the lists the model can match are exactly the combinations of the columns: their span. The columns are vectors in $\mathbb{R}^4$, and the third is the sum of the other two, so the span is the same as the span of the first two: a flat sheet, a plane through the origin, inside a space of four dimensions. The first list of rents lies on that sheet. The second does not. No weights will ever leave the sheet.

        Now the second question. The weights $(1, 1, -1)$ produce the zero vector. So if $\mathbf{w}$ matches a list, then $\mathbf{w} + (1, 1, -1)$ matches it too, and so does $\mathbf{w}$ plus any multiple of $(1, 1, -1)$. The weights that match are a whole line in the space of weights.

        The figure shows both ideas for a smaller matrix, one that takes the plane to the plane. The input $\mathbf{x}$ is steered by two controls. Move it along $(2, -1)$ and watch $A\mathbf{x}$.
    - figure: null-space
      props: { t: 1, s: 1 }
    - text: |
        Sliding $\mathbf{x}$ along $(2, -1)$ does not move $A\mathbf{x}$ at all. The faint line through $\mathbf{x}$ is the set of all inputs that share its output. Sliding $\mathbf{x}$ along the other control, $(1, 2)$, does move the output, but only up and down one fixed line, the line through $(2, 1)$.

        Two sets have appeared, and they live in different places.

        - In the space of **outputs**: the set of everything the matrix can produce. Here, the line through $(2, 1)$.
        - In the space of **inputs**: the set of everything the matrix sends to zero. Here, the line through $(2, -1)$.

        **The first set tells you which equations $A\mathbf{x} = \mathbf{b}$ can be solved. The second tells you how many solutions there are.** They are called the column space and the null space, and each is more than a set: adding or scaling its members never takes you out of it.
  derivation:
    - text: |
        **Subspaces.** A set $S$ of vectors in $\mathbb{R}^n$ is a **subspace** if it contains the zero vector and is closed under the two operations of vectors: whenever $\mathbf{u}$ and $\mathbf{v}$ are in $S$, so is $\mathbf{u} + \mathbf{v}$, and whenever $\mathbf{v}$ is in $S$, so is $c\,\mathbf{v}$ for every number $c$. A line through the origin is a subspace. So is a plane through the origin, the whole space, and the set containing only $\mathbf{0}$. A line that misses the origin is not, and neither is a quarter of the plane, where scaling by $-1$ leads out.

        The span of any list of vectors is a subspace: a sum of combinations is a combination, and so is a multiple of one.

        **The column space.** For an $m \times n$ matrix $A$, the **column space** $C(A)$ is the set of all vectors $A\mathbf{x}$, as $\mathbf{x}$ ranges over $\mathbb{R}^n$. Since $A\mathbf{x}$ is the combination of the columns with coefficients $\mathbf{x}$, it is the span of the columns. It is a subspace of $\mathbb{R}^m$, the space of outputs.

        $$A\mathbf{x} = \mathbf{b} \text{ has a solution} \iff \mathbf{b} \in C(A).$$

        That is the definition restated, and it is the answer to the first question of the puzzle. The rank counts the independent columns, so it measures the size of the column space: rank 1 gives a line, rank 2 a plane.

        **The null space.** The **null space** $N(A)$ is the set of all $\mathbf{x}$ with $A\mathbf{x} = \mathbf{0}$. It is a subspace of $\mathbb{R}^n$, the space of inputs. Check the three requirements. $A\mathbf{0} = \mathbf{0}$, so it contains the zero vector. If $A\mathbf{u} = \mathbf{0}$ and $A\mathbf{v} = \mathbf{0}$ then $A(\mathbf{u} + \mathbf{v}) = \mathbf{0} + \mathbf{0} = \mathbf{0}$. And $A(c\,\mathbf{v}) = c\,A\mathbf{v} = \mathbf{0}$. Each check is linearity and nothing more.

        The null space always contains $\mathbf{0}$. It contains nothing else exactly when the columns of $A$ are independent, since a non-zero $\mathbf{c}$ with $A\mathbf{c} = \mathbf{0}$ is a dependency among the columns.

        Keep the two homes apart. For a $3 \times 5$ matrix, the column space is made of vectors with 3 components and the null space of vectors with 5. Asking whether a vector belongs to both does not even make sense unless the matrix is square.

        **Finding the null space.** Elimination does it. Take the matrix of the last lesson and reduce it, then keep going: clear **above** each pivot as well, and divide each row by its pivot. The result is the **reduced** form.

        $$A = \begin{pmatrix} 1 & 2 & 1 & 4 \\ 2 & 4 & 5 & 14 \\ 3 & 6 & 6 & 18 \end{pmatrix} \to \begin{pmatrix} 1 & 2 & 1 & 4 \\ 0 & 0 & 3 & 6 \\ 0 & 0 & 0 & 0 \end{pmatrix} \to \begin{pmatrix} 1 & 2 & 0 & 2 \\ 0 & 0 & 1 & 2 \\ 0 & 0 & 0 & 0 \end{pmatrix}.$$

        Row operations do not change the solutions of $A\mathbf{x} = \mathbf{0}$, so the null space of $A$ is the null space of the last matrix, whose equations are

        $$x_1 + 2x_2 + 2x_4 = 0, \qquad x_3 + 2x_4 = 0.$$

        The pivots are in columns 1 and 3. Columns 2 and 4 have none, so $x_2$ and $x_4$ are free. Each equation gives one pivot variable in terms of the free ones: $x_1 = -2x_2 - 2x_4$ and $x_3 = -2x_4$.

        Now choose the free variables in the simplest independent ways: one of them 1 and the rest 0.

        - $x_2 = 1$, $x_4 = 0$ gives $\mathbf{s}_1 = (-2, 1, 0, 0)$.
        - $x_2 = 0$, $x_4 = 1$ gives $\mathbf{s}_2 = (-2, 0, -2, 1)$.

        These are called the **special solutions**. Every solution is a combination of them: a solution with free values $x_2$ and $x_4$ is exactly $x_2\,\mathbf{s}_1 + x_4\,\mathbf{s}_2$, as you can confirm component by component. So

        $$N(A) = \text{all combinations of } (-2, 1, 0, 0) \text{ and } (-2, 0, -2, 1).$$

        In the reduced form the recipe is mechanical. For a free column, put 1 in its own place, 0 in the other free places, and in each pivot place put **minus** the entry of the free column in that pivot's row.

        Count: one special solution for each free column, and there are $n - r$ free columns, where $r$ is the rank. Here $4 - 2 = 2$. The special solutions are independent, since each has a 1 in a place where the others have 0. So the null space is spanned by $n - r$ independent vectors. **The larger the rank, the smaller the null space.** What the outputs gain, the lost inputs give up.
    - question:
        id: derivation-homes
        type: choice
        system: s2
        prompt: |
          $A$ is a $3 \times 5$ matrix of rank 3. Which statement is right?
        options:
          - "The column space is all of $\\mathbb{R}^3$, and the null space is spanned by 2 independent vectors of $\\mathbb{R}^5$."
          - "The column space is all of $\\mathbb{R}^5$, and the null space contains only the zero vector."
          - "The column space is spanned by 2 vectors of $\\mathbb{R}^3$, and the null space is all of $\\mathbb{R}^5$."
          - "Both spaces are in $\\mathbb{R}^3$."
        answer: 0
        explanation: |
          The columns have 3 components, so the column space is inside $\mathbb{R}^3$, and with 3 independent columns it is all of $\mathbb{R}^3$: three independent vectors in three dimensions span everything. Inputs have 5 components, so the null space is inside $\mathbb{R}^5$. There are $5 - 3 = 2$ columns without pivots, hence 2 special solutions. So every right-hand side can be reached, and each is reached by a two-dimensional family of inputs. A matrix that is wider than it is tall always destroys something.
        hints:
          - How many components has a column? That is the home of the column space.
          - How many components has an input? That is the home of the null space.
          - The number of free columns is the number of columns minus the rank.
    - text: |
        **All the solutions of $A\mathbf{x} = \mathbf{b}$.** Suppose $\mathbf{x}_p$ is one solution, any one. It is called a **particular solution**.

        *Adding a null vector gives another solution.* If $A\mathbf{x}_n = \mathbf{0}$ then $A(\mathbf{x}_p + \mathbf{x}_n) = \mathbf{b} + \mathbf{0} = \mathbf{b}$.

        *Every solution arises so.* If $A\mathbf{x} = \mathbf{b}$ as well, then $A(\mathbf{x} - \mathbf{x}_p) = \mathbf{b} - \mathbf{b} = \mathbf{0}$, so $\mathbf{x} - \mathbf{x}_p$ is in the null space, and $\mathbf{x} = \mathbf{x}_p + (\mathbf{x} - \mathbf{x}_p)$.

        $$\text{all solutions of } A\mathbf{x} = \mathbf{b} \;=\; \mathbf{x}_p + N(A).$$

        **The solutions are the null space, shifted.** If the null space is a line through the origin, the solutions form a parallel line through $\mathbf{x}_p$. That is the faint line in the figure. The shifted set is not a subspace, since it misses the origin unless $\mathbf{b} = \mathbf{0}$. You met this shape before: a hyperplane $\mathbf{w} \cdot \mathbf{x} = c$ was a hyperplane through the origin, moved.

        The two spaces now answer everything about a system.

        | Question | Answer |
        | --- | --- |
        | Is there a solution? | Exactly when $\mathbf{b}$ is in the column space |
        | If there is one, how many are there? | One for each vector of the null space |
        | Is it unique? | Exactly when the null space is only $\mathbf{0}$ |

        *The flats.* The null space of $X$ is the line of multiples of $(1, 1, -1)$: three columns, rank 2, one free variable. For the first list of rents a particular solution is $(3, 1, 0)$, so all the weights that match it are

        $$\mathbf{w} = (3, 1, 0) + s\,(1, 1, -1).$$

        With $s = -1$ and $s = -3$ these are $(2, 0, 1)$ and $(0, -2, 3)$, the three models that once looked so different. For the second list, elimination on the augmented matrix ends in a row reading $0 = c$ with $c \ne 0$. That row is the certificate that $\mathbf{y}'$ is outside the column space.

        **The rows and the null space.** Read $A\mathbf{x} = \mathbf{0}$ by rows. It says that the dot product of **every row** with $\mathbf{x}$ is zero:

        $$\mathbf{r}_1 \cdot \mathbf{x} = 0, \quad \mathbf{r}_2 \cdot \mathbf{x} = 0, \quad \dots, \quad \mathbf{r}_m \cdot \mathbf{x} = 0.$$

        **A vector is in the null space exactly when it is perpendicular to every row.** Then it is perpendicular to every combination of the rows too. The span of the rows is called the **row space**. It is the column space of $A^{\mathsf{T}}$, and it lives in $\mathbb{R}^n$, alongside the null space. The two meet only at $\mathbf{0}$ and stand at right angles: every vector of one is perpendicular to every vector of the other.

        In the figure the rows are $(1, 2)$ and $(0.5, 1)$, both along the direction $(1, 2)$, and the null space is along $(2, -1)$, with $(1, 2) \cdot (2, -1) = 0$. The two controls of the figure are these two directions. Every input is some amount along the rows plus some amount along the null space. The matrix responds only to the first part and is blind to the second.

        **What the matrix cannot say, and what it cannot see.** Carry this over to models.

        The **column space** is what the model can express. For a model $X\mathbf{w}$ it is the set of prediction vectors that some weights produce. Targets outside it cannot be fitted exactly, and the best that can be done is to find the point of the column space nearest to them. At that best point the errors $\mathbf{e}$ satisfy $X^{\mathsf{T}}\mathbf{e} = \mathbf{0}$, as you found with the transpose. Read that by rows of $X^{\mathsf{T}}$, which are the columns of $X$: **the error is perpendicular to every column**. It is in the null space of $X^{\mathsf{T}}$. The nearest point is where the miss stands at right angles to the sheet.

        The **null space** is what the model cannot see. For a layer $W\mathbf{x}$, moving the input along the null space of $W$ changes nothing downstream. For a design matrix, moving the weights along its null space changes no prediction, so the data cannot choose among those weights. When there are more weights than examples, the matrix is wider than tall, its null space is never just $\mathbf{0}$, and the weights are never determined by the data alone.
    - question:
        id: order-complete
        type: order
        system: s2
        prompt: Put the steps in order to prove that if $A\mathbf{x}_p = \mathbf{b}$, then every solution of $A\mathbf{x} = \mathbf{b}$ is $\mathbf{x}_p$ plus a vector of the null space.
        steps:
          - 'Let $\mathbf{x}$ be any solution, so $A\mathbf{x} = \mathbf{b}$.'
          - 'Consider the difference $\mathbf{d} = \mathbf{x} - \mathbf{x}_p$.'
          - 'By linearity, $A\mathbf{d} = A\mathbf{x} - A\mathbf{x}_p = \mathbf{b} - \mathbf{b} = \mathbf{0}$.'
          - 'So $\mathbf{d}$ is in the null space of $A$.'
          - 'And $\mathbf{x} = \mathbf{x}_p + \mathbf{d}$, the particular solution plus a vector of the null space.'
        explanation: The proof takes an arbitrary solution and compares it with the known one. Their difference is sent to zero, because both are sent to the same place. So any two solutions differ by a vector of the null space, which is the whole content of the statement.
        hints:
          - Start with an arbitrary solution.
          - The difference must be formed before the matrix is applied to it.
          - The conclusion rewrites the solution as a sum.
  formal:
    - text: |
        **Subspace.** A set of vectors in $\mathbb{R}^n$ that contains $\mathbf{0}$ and is closed under addition and under multiplication by numbers.

        **Column space.** $C(A) = \{A\mathbf{x}\}$, the span of the columns of $A$, a subspace of $\mathbb{R}^m$ for $A$ of shape $m \times n$. $A\mathbf{x} = \mathbf{b}$ is solvable exactly when $\mathbf{b} \in C(A)$.

        **Null space.** $N(A) = \{\mathbf{x} : A\mathbf{x} = \mathbf{0}\}$, a subspace of $\mathbb{R}^n$. $N(A) = \{\mathbf{0}\}$ exactly when the columns of $A$ are independent.

        **Special solutions.** In the reduced form, each free column gives one: 1 in its own place, 0 in the other free places, and minus its entries in the pivot places. They are $n - r$ in number, independent, and span $N(A)$.

        **Complete solution.** If $A\mathbf{x}_p = \mathbf{b}$, the solutions of $A\mathbf{x} = \mathbf{b}$ are exactly the vectors $\mathbf{x}_p + \mathbf{x}_n$ with $\mathbf{x}_n \in N(A)$.

        **Row space.** The span of the rows, $C(A^{\mathsf{T}})$, a subspace of $\mathbb{R}^n$. Every vector of $N(A)$ is perpendicular to every vector of the row space.
  drill:
    - text: Seconds each. Column space is in the space of outputs. Null space is in the space of inputs.
    - question:
        id: drill-column-space
        type: choice
        system: s1
        prompt: |
          $A$ has columns $(1, 0.5)$ and $(2, 1)$. Its column space is
        options: ["the whole plane", "the line through the origin along (2, 1)", "the line through the origin along (2, −1)", "the single point (2, 1)"]
        answer: 1
        explanation: Both columns are multiples of (2, 1), so every combination of them is too.
        hints:
          - What do combinations of the two columns look like?
          - Both columns point along one direction.
    - question:
        id: drill-in-column-space
        type: choice
        system: s1
        prompt: |
          $A$ has columns $(1, 0.5)$ and $(2, 1)$. Does $A\mathbf{x} = (4, 2)$ have a solution?
        options: ["Yes, because (4, 2) is a multiple of (2, 1)", "No, because the matrix is singular", "No, because (4, 2) is too long", "Yes, exactly one"]
        answer: 0
        explanation: (4, 2) lies on the line through (2, 1), which is the column space. There are infinitely many solutions, since the null space is a line.
        hints:
          - Is (4, 2) in the span of the columns?
          - A singular matrix can still reach some right-hand sides.
    - question:
        id: drill-null-space
        type: choice
        system: s1
        prompt: |
          $A$ has rows $(1, 2)$ and $(0.5, 1)$. Which vector is in its null space?
        options: ['$(1, 2)$', '$(2, -1)$', '$(2, 1)$', '$(1, 1)$']
        answer: 1
        explanation: (1, 2) · (2, −1) = 0 and (0.5, 1) · (2, −1) = 0. The vector is perpendicular to both rows.
        hints:
          - A null vector is perpendicular to every row.
          - Dot each option with (1, 2).
    - question:
        id: drill-free
        type: numeric
        system: s1
        prompt: |
          A matrix has 5 columns and rank 2. How many special solutions span its null space?
        answer: "3"
        explanation: One for each column without a pivot, 5 − 2.
        hints:
          - How many columns have pivots?
          - The rest are free.
    - question:
        id: drill-invertible-null
        type: choice
        system: s1
        prompt: |
          The null space of an invertible matrix is
        options: ["empty", "the zero vector alone", "a line", "the whole space"]
        answer: 1
        explanation: Ax = 0 gives x = 0 on multiplying by the inverse. The null space is never empty, since it always contains the zero vector.
        hints:
          - Which vector does every matrix send to zero?
          - Can an invertible matrix send anything else there?
    - question:
        id: drill-invertible-column
        type: choice
        system: s1
        prompt: |
          The column space of an invertible $3 \times 3$ matrix is
        options: ["a line", "a plane", "all of three-dimensional space", "the zero vector alone"]
        answer: 2
        explanation: Every right-hand side b is reached, by the input that is the inverse applied to b.
        hints:
          - For which b does Ax = b have a solution?
          - An invertible matrix reaches everything.
    - question:
        id: drill-home-null
        type: numeric
        system: s1
        prompt: |
          $A$ is a $3 \times 5$ matrix. How many components have the vectors of its null space?
        answer: "5"
        explanation: The null space is a set of inputs, and inputs have one component for each column.
        hints:
          - The null space is made of inputs.
          - How many components has an input?
    - question:
        id: drill-home-column
        type: numeric
        system: s1
        prompt: |
          $A$ is a $3 \times 5$ matrix. How many components have the vectors of its column space?
        answer: "3"
        explanation: The column space is a set of outputs, and outputs have one component for each row.
        hints:
          - The column space is made of outputs.
          - How many components has a column?
    - question:
        id: drill-shift
        type: choice
        system: s1
        prompt: |
          $A\mathbf{x}_p = \mathbf{b}$ and $A\mathbf{x}_n = \mathbf{0}$. What is $A(\mathbf{x}_p + 5\mathbf{x}_n)$?
        options: ['$\mathbf{b}$', '$5\mathbf{b}$', '$\mathbf{0}$', '$6\mathbf{b}$']
        answer: 0
        explanation: By linearity it is b plus 5 times the zero vector.
        hints:
          - Apply A to each part.
          - What is 5 times the zero vector?
    - question:
        id: drill-zero
        type: choice
        system: s1
        prompt: |
          Is the zero vector in the null space of every matrix?
        options: ["Yes", "No", "Only for square matrices", "Only for singular matrices"]
        answer: 0
        explanation: Every matrix sends the zero vector to the zero vector.
        hints:
          - What is A times the zero vector?
          - Does that depend on A?
    - question:
        id: drill-row
        type: choice
        system: s1
        prompt: |
          $A$ is the single row $(1, 1, -1)$. Is $(1, 1, 2)$ in its null space?
        options: ["Yes, because 1 + 1 − 2 = 0", "No, because it is not a multiple of the row", "No, because it has three components", "Yes, because every vector is"]
        answer: 0
        explanation: The null space of a single row is the plane of vectors perpendicular to it.
        hints:
          - Dot the vector with the row.
          - Is the result zero?
    - question:
        id: drill-flats
        type: choice
        system: s1
        prompt: |
          The design matrix of the flats has columns rooms, bathrooms and their total. Which vector is in its null space?
        options: ['$(1, 1, 1)$', '$(1, 1, -1)$', '$(3, 1, 0)$', '$(0, 0, 1)$']
        answer: 1
        explanation: Rooms plus bathrooms minus total is the zero vector.
        hints:
          - Which combination of the three columns is zero?
          - The third column is the sum of the first two.
    - question:
        id: drill-not-subspace
        type: choice
        system: s1
        prompt: |
          Which of these is **not** a subspace of the plane?
        options: ["The line through the origin along (1, 2)", "The whole plane", "The line of points (x, 1)", "The zero vector alone"]
        answer: 2
        explanation: The line of points with second component 1 does not contain the zero vector.
        hints:
          - A subspace must contain the zero vector.
          - Which of the sets misses the origin?
    - question:
        id: predict-null
        type: predict
        system: s1
        prompt: Three inputs for the matrix of the lesson. What does this show?
        code: |
          A = [[1, 2, 1, 4], [2, 4, 5, 14], [3, 6, 6, 18]]

          for x in [[-2, 1, 0, 0], [-2, 0, -2, 1], [1, 0, 0, 0]]:
              print([sum([a * v for a, v in zip(row, x)]) for row in A])
        output: |
          [0, 0, 0]
          [0, 0, 0]
          [1, 2, 3]
        explanation: The first two inputs are the special solutions, and the matrix sends them to zero. The third is the first unit vector, which picks out the first column.
        hints:
          - Dot each row with the input.
          - The third input is a unit vector.
    - question:
        id: predict-family
        type: predict
        system: s1
        prompt: One set of weights, shifted along the null space. What does this show?
        code: |
          X = [[3, 1, 4], [2, 1, 3], [4, 2, 6], [1, 1, 2]]
          w = [3, 1, 0]
          n = [1, 1, -1]

          for s in [0, -1, -3]:
              shifted = [a + s * b for a, b in zip(w, n)]
              print(shifted, [sum([p * q for p, q in zip(row, shifted)]) for row in X])
        output: |
          [3, 1, 0] [10, 7, 14, 4]
          [2, 0, 1] [10, 7, 14, 4]
          [0, -2, 3] [10, 7, 14, 4]
        explanation: Adding a multiple of the null vector to the weights changes the weights and leaves every prediction where it was. These are the three models that agreed on every flat.
        hints:
          - Compute w + s n for each s.
          - What does X do to n?
  work:
    - text: Slower now. Say first which space a vector lives in, then whether it belongs.
    - question:
        id: write-in-column-space
        type: code
        mode: write
