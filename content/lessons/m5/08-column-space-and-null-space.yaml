        type: choice
        system: s2
        prompt: |
          A model has 50 weights and is fitted to 30 examples, with design matrix $X$ of shape $30 \times 50$. Suppose the weights $\mathbf{w}$ fit the data exactly. How many other weight vectors fit exactly?
        options:
          - "None. An exact fit is unique."
          - "Infinitely many. The rank is at most 30, so at least 20 columns have no pivot, the null space contains non-zero vectors, and $\\mathbf{w}$ plus any of them fits just as well."
          - "Exactly 20."
          - "It depends on whether the features were well chosen."
        answer: 1
        explanation: |
          $X$ has 30 rows, so its rank is at most 30, and with 50 columns at least 20 are free. The null space is spanned by at least 20 independent special solutions. All solutions of $X\mathbf{w} = \mathbf{y}$ are one particular solution plus the null space, so the exact fits form a family with at least 20 free directions. No care in choosing features can prevent this, since it follows from the shape alone. The data cannot tell these fits apart, though they will disagree on new examples. Something other than the data has to choose among them: a preference for small weights, or the way the training procedure happens to move.
        hints:
          - What is the largest possible rank of a 30 by 50 matrix?
