    - question:
        id: work-perpendicular
        type: choice
        system: s2
        prompt: |
          At the best-fitting weights for a design matrix $X$ and targets $\mathbf{y}$, the errors $\mathbf{e} = X\mathbf{w} - \mathbf{y}$ satisfy $X^{\mathsf{T}}\mathbf{e} = \mathbf{0}$. What does that say geometrically?
        options:
          - "The errors are all zero."
          - "The error vector is perpendicular to every column of $X$, and so to the whole column space. The prediction is the point of the column space nearest to $\\mathbf{y}$."
          - "The error vector is in the column space."
          - "The error vector is perpendicular to every row of $X$."
        answer: 1
        explanation: |
          The components of $X^{\mathsf{T}}\mathbf{e}$ are the dot products of the rows of $X^{\mathsf{T}}$ with $\mathbf{e}$, and those rows are the columns of $X$. So each column is perpendicular to $\mathbf{e}$, and therefore so is every combination of the columns. The prediction $X\mathbf{w}$ lies in the column space, and the miss $\mathbf{e}$ sticks straight out of it at a right angle. You met this picture when you projected a vector onto a line: the closest point was the one where the remainder was perpendicular to the line. This is the same fact with a sheet of any dimension in place of the line. The error is in the null space of $X^{\mathsf{T}}$, the fourth of the spaces a matrix carries, after the column space, the null space and the row space.
        hints:
          - What are the rows of the transpose of X?
          - A product equal to zero says each of those rows is perpendicular to e.
          - Compare with projection onto a line.
  connections:
    - text: |
        A model could match one list of rents and not another, and when it matched, three quite different sets of weights did equally well. Both facts are now described. The lists the model can match are the column space of its matrix, the span of the columns, a subspace of the space of outputs. The weights that change nothing are the null space, the inputs sent to zero, a subspace of the space of inputs. A system $A\mathbf{x} = \mathbf{b}$ can be solved exactly when $\mathbf{b}$ is in the first, and its solutions are one particular solution shifted along the second.

        Elimination computes both. The reduced form shows which columns have pivots, and each column without one gives a special solution. There are $n - r$ of those where the [[m5.rank]] is $r$, so a large rank means much is reached and little is lost. And reading $A\mathbf{x} = \mathbf{0}$ by rows showed that the null space is perpendicular to every row, as the errors of a best fit are perpendicular to every column. That perpendicularity between the spaces of a matrix is developed in [[m7.orthogonal-subspaces]], and finding the nearest point of the column space is [[m7.least-squares-and-the-normal-equations]].

        Throughout this lesson and the last, some words have been used on credit. The column space was "a line" or "a plane" or "a sheet". The null space was "spanned by two independent vectors". The rank "measures the size" of the column space. Each time, the same thing was being counted: how many independent vectors it takes to span a subspace. But a subspace can be spanned in many ways. The null space above was spanned by two special solutions, and it is spanned equally by their sum and their difference. Is it certain that every way of spanning it, with no waste, uses the same number of vectors? If not, "dimension" would mean nothing.

        It is certain, and proving it is short now that you have elimination. A list that spans a subspace with nothing wasted is a basis, the number of vectors in it is the dimension, and the count $r + (n - r) = n$ that appeared today becomes a theorem about every linear map. That is the next lesson, [[m5.basis-and-dimension]].
