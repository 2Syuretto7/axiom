    - question:
        id: work-certificate
        type: choice
        system: s2
        prompt: |
          For the flats with features rooms $\mathbf{r} = (3, 2, 4, 1)$ and bathrooms $\mathbf{b} = (1, 1, 2, 1)$, why can no weights match the rents $\mathbf{y}' = (12, 7, 13, 5)$?
        options:
          - "Because there are four flats and only two features, so no list of rents can be matched."
          - "The first two flats force the weights: $3a + b = 12$ and $2a + b = 7$ give $a = 5$, $b = -3$. Those weights predict 14 for the third flat, not 13. So $\\mathbf{y}'$ is not a combination of $\\mathbf{r}$ and $\\mathbf{b}$: it is outside the column space."
          - "Because the rents are not whole multiples of the features."
          - "Because the null space is not zero."
        answer: 1
        explanation: |
          The columns $\mathbf{r}$ and $\mathbf{b}$ are independent, so if $\mathbf{y}'$ were in their span the coefficients would be unique, and two of the four equations already pin them down. The remaining equations then act as tests, and the third fails: $5 \times 4 - 3 \times 2 = 14 \ne 13$. In elimination this failure appears as a row $0 = c$ with $c \ne 0$. Having more equations than unknowns does not by itself prevent a solution: the rents $(10, 7, 14, 4)$ are matched exactly. It means that the column space is a thin sheet inside the space of all possible rents, and most targets miss it. When they do, the question changes from "which weights fit?" to "which weights come closest?".
        hints:
          - Use two of the flats to find the only weights that could work.
          - Test those weights on a third flat.
          - A failed test means the target is not a combination of the columns.
    - question:
