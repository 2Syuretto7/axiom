concept: m5.rank
minutes: 95
claim: You can define the rank of a matrix as its largest number of independent columns, compute it by counting pivots and explain why that count does not depend on how elimination is carried out, show that the rows give the same number, recognise matrices of rank one as outer products, bound the rank of a product, and say what low rank means for storage, for redundant features and for a narrow layer.
recalls: [m5.elimination-and-linear-systems]
uses: [m5.identity-and-inverse, m5.transpose, m5.matrix-multiplication-as-composition, m5.matrix-vector-product, m5.matrices-as-linear-maps, m4.linear-independence, m4.linear-combinations-and-span, m4.dot-product, m4.norms-and-distance, e1.complexity-and-big-o, e1.comprehensions-and-iterators, e0.functions, e0.loops, e0.lists-and-tuples]
leads: [m5.column-space-and-null-space, m5.basis-and-dimension, m5.determinant]
starter: |
  # Scratch space. A table of 12 ratings, and 7 numbers that claim to hold all of it.
  R = [[2, 4, 6, 2], [1, 2, 3, 1], [3, 6, 9, 3]]

  keen = [2, 1, 3]         # one number for each person
  appeal = [1, 2, 3, 1]    # one number for each film

  rebuilt = [[k * a for a in appeal] for k in keen]
  print(rebuilt)
  print(rebuilt == R)
parts:
  recall:
    - text: |
        [[m5.elimination-and-linear-systems]] solved systems by clearing below pivots, and its proofs turned on a count: how many pivots, against how many rows and columns. Today that count gets its name. Three quick pulls first.
  puzzle:
    - text: |
        Three people rate four films. Twelve numbers, in a table.

        | | Film 1 | Film 2 | Film 3 | Film 4 |
        | --- | --- | --- | --- | --- |
        | Person 1 | 2 | 4 | 6 | 2 |
        | Person 2 | 1 | 2 | 3 | 1 |
        | Person 3 | 3 | 6 | 9 | 3 |

        Someone claims the table does not really hold twelve numbers. Give each person one number, how keen they are on films in general: 2, 1 and 3. Give each film one number, its appeal: 1, 2, 3 and 1. Then every rating is the person's number times the film's number. Seven numbers, and the whole table can be rebuilt. Run the starter and see.

        Now change a single entry. Suppose person 2 gives film 3 a 5 where the table has a 3. Try to find seven numbers that rebuild the new table. You will not manage. No choice of three numbers for the people and four for the films will do it.

        So some tables of twelve numbers are secretly seven, and some are not. For a table of a million users and a hundred thousand films the difference is between storing a hundred thousand million numbers and storing about a million.

        **How much does a table really hold? Is there a number that measures it, and can it be computed? And does it matter whether you look at the table by its rows or by its columns?**
  intuition:
    - text: |
        Look at the rows of the table. The second is $(1, 2, 3, 1)$. The first is twice that, and the third is three times it. Every row points along one direction in $\mathbb{R}^4$. As far as directions go, the table has **one** row, repeated at different strengths.

        Look at the columns. The first is $(2, 1, 3)$. The second is twice that, the third three times, and the fourth is the same again. Every column points along one direction in $\mathbb{R}^3$. One column, repeated.

        One independent row, and one independent column. That agreement is the first hint of something that will be proved: the two counts are **always** equal, for every matrix.

        Think of the table as a map, taking four numbers to three. Its outputs are combinations of its columns, and all the columns lie along one line. So whatever goes in, what comes out lies on that line. The figure shows a smaller matrix of the same kind, taking the plane to the plane. Move the input about and watch the output.
    - figure: null-space
      props: { t: 1, s: 0 }
    - text: |
        The output never leaves the line through $(2, 1)$. Two numbers go in, and though two numbers come out, only one number's worth of information survives: how far along the line. Now press "Turn the columns apart". The second column leaves the line, the outputs fill the plane, and nothing is lost.

        **The number of independent directions among the columns is how many dimensions the outputs fill.** For the first matrix it is 1, and for the second it is 2. That number is the rank. A table with rank 1 is a single pattern scaled, and can be stored as one column and one row. The altered table of the puzzle has two independent rows, so it holds more, and seven numbers cannot capture it.
  derivation:
    - text: |
        **The definition.** The **rank** of a matrix $A$ is the largest number of its columns that form a linearly independent list. Equivalently, it is the number of columns you need to keep so that every other column is a combination of the kept ones, with none of the kept ones redundant.

        For the table of ratings, any single non-zero column is an independent list, and any two columns are dependent. The rank is 1. For the identity matrix $I_n$, all $n$ columns are independent, and the rank is $n$. The zero matrix has rank 0.

        **Computing it: count the pivots.** Here is a $3 \times 4$ matrix, and what elimination does to it.

        $$A = \begin{pmatrix} 1 & 2 & 1 & 4 \\ 2 & 4 & 5 & 14 \\ 3 & 6 & 6 & 18 \end{pmatrix} \;\longrightarrow\; \begin{pmatrix} 1 & 2 & 1 & 4 \\ 0 & 0 & 3 & 6 \\ 0 & 0 & 0 & 0 \end{pmatrix} = U.$$

        Row 2 minus twice row 1, row 3 minus three times row 1, then row 3 minus row 2. There are two pivots, in columns 1 and 3. The claim is that the rank of $A$ is 2, the number of pivots. Two things must be shown.

        *Row operations do not change which columns are dependent.* A dependency among the columns of $A$ is a vector $\mathbf{c} \ne \mathbf{0}$ with $A\mathbf{c} = \mathbf{0}$. Elimination replaces $A$ by $EA$, with $E$ invertible. If $A\mathbf{c} = \mathbf{0}$ then $EA\mathbf{c} = \mathbf{0}$, and if $EA\mathbf{c} = \mathbf{0}$ then, multiplying by $E^{-1}$, $A\mathbf{c} = \mathbf{0}$. So $A$ and $U$ have **exactly the same dependencies** among their columns, coefficient for coefficient. A set of columns of $A$ is independent exactly when the same set of columns of $U$ is.

        *In $U$, the count is plain.* The pivot columns, $(1, 0, 0)$ and $(1, 3, 0)$, are independent: in a combination equal to zero, the second row forces the coefficient of the second to vanish, and then the first row forces the other. Each remaining column is a combination of the pivot columns to its left. Column 2 is $2$ times column 1. Column 4 is $(4, 6, 0) = 2\,(1, 0, 0) + 2\,(1, 3, 0)$. So no third column can join the pivot columns without creating a dependency.

        Put together: the largest independent set of columns has as many members as there are pivots, in $U$ and therefore in $A$. And the very same recipes hold in $A$. Column 2 of $A$ is twice column 1, and column 4 is 2 times column 1 plus 2 times column 3: $(2 + 2,\; 4 + 10,\; 6 + 12) = (4, 14, 18)$.

        $$\text{rank}(A) = \text{number of pivots}.$$

        This also answers a worry. Elimination involves choices: which rows to exchange, in what order. The **rank** was defined without any reference to elimination, so however you eliminate, you must find the same number of pivots.

        **Rows give the same number.** Now count independent **rows**. Row operations replace rows by combinations of rows, and can be reversed, so the rows of $U$ are combinations of the rows of $A$ and the rows of $A$ are combinations of the rows of $U$. The two sets of rows have the same span, and the same number of independent members. In $U$, the non-zero rows are independent, by the same staircase argument read sideways: the first row is the only one with an entry in the first pivot column, so its coefficient must be zero, and so on down. And there is one non-zero row for each pivot. So

        $$\text{number of independent rows} = \text{number of pivots} = \text{number of independent columns}.$$

        In symbols, $\text{rank}(A^{\mathsf{T}}) = \text{rank}(A)$. This is not obvious and it is worth a moment's surprise. The matrix $A$ above has four columns, which are vectors in $\mathbb{R}^3$, and three rows, which are vectors in $\mathbb{R}^4$. Different vectors in different spaces. Yet exactly two of the columns are independent and exactly two of the rows are: row 3 is row 1 plus row 2.

        **Bounds.** Each pivot has a row to itself and a column to itself. So for an $m \times n$ matrix,

        $$\text{rank}(A) \le \min(m, n).$$

        A matrix whose rank is as large as its shape allows is said to have **full rank**. For a square $n \times n$ matrix, full rank means $n$ pivots, which the last lesson showed to be the same as being invertible. **A square matrix is invertible exactly when its rank equals its size.**
    - question:
        id: derivation-same
        type: choice
        system: s2
        prompt: |
          Elimination turns $A$ into $U$, and in $U$ the fourth column equals 2 times the first plus 2 times the third. What can be said about the columns of $A$?
        options:
          - "Nothing. Row operations change the columns."
          - "The fourth column of $A$ equals 2 times its first plus 2 times its third. Row operations change the columns but keep every dependency among them, with the same coefficients."
          - "The fourth column of $A$ equals the fourth column of $U$."
          - "The fourth row of $A$ is a combination of the first and third rows."
        answer: 1
        explanation: |
          The statement about $U$ says $U\mathbf{c} = \mathbf{0}$ for $\mathbf{c} = (2, 0, 2, -1)$. Since $U = EA$ with $E$ invertible, $U\mathbf{c} = \mathbf{0}$ exactly when $A\mathbf{c} = \mathbf{0}$. So the same coefficients give a dependency among the columns of $A$. The columns themselves are different vectors after elimination: the span of the columns is generally **not** preserved by row operations. What is preserved is the set of relations among the columns. For the rows it is the other way about: their span is kept, and the particular rows are not.
        hints:
          - Write the dependency as U times a vector of coefficients.
          - How are U and A related?
          - Can an invertible matrix send a non-zero vector to zero?
    - text: |
        **Rank one.** Take non-zero vectors $\mathbf{u}$ with $m$ components and $\mathbf{v}$ with $n$. Their outer product $\mathbf{u}\mathbf{v}^{\mathsf{T}}$ is the $m \times n$ matrix with entries $u_iv_j$. Its column $j$ is $v_j\mathbf{u}$, a multiple of $\mathbf{u}$. Every column lies along one direction, so the rank is 1.

        Conversely, if a matrix has rank 1, pick a non-zero column and call it $\mathbf{u}$. Every column is a multiple of it, say column $j$ is $v_j\mathbf{u}$. Then the matrix is $\mathbf{u}\mathbf{v}^{\mathsf{T}}$. So

        $$\text{rank}(A) = 1 \iff A = \mathbf{u}\mathbf{v}^{\mathsf{T}} \text{ for some non-zero } \mathbf{u}, \mathbf{v}.$$

        The table of ratings is $(2, 1, 3)$ times the row $(1, 2, 3, 1)$. It takes $m + n$ numbers to store where the full table has $mn$. The ordinary multiplication table is the most familiar matrix of rank 1: the column $1, 2, \dots, 9$ times the row $1, 2, \dots, 9$.

        **Rank $r$: a sum of $r$ patterns.** The same idea works for any rank. Let $C$ hold the $r$ pivot columns of $A$. Every column of $A$ is a combination of them, so write the coefficients for column $j$ as column $j$ of an $r \times n$ matrix $R$. Then

        $$A = CR, \qquad C \text{ of shape } m \times r, \quad R \text{ of shape } r \times n.$$

        For the matrix above, $C$ has columns $(1, 2, 3)$ and $(1, 5, 6)$, and $R$ has rows $(1, 2, 0, 2)$ and $(0, 0, 1, 2)$. Reading the product as columns of $C$ against rows of $R$, it says that $A$ is the sum of $r$ outer products, each a matrix of rank 1.

        Two consequences. For **storage**: $r(m + n)$ numbers in place of $mn$. For **meaning**: the map $\mathbf{x} \mapsto A\mathbf{x}$ factors as $\mathbf{x} \mapsto R\mathbf{x} \mapsto C(R\mathbf{x})$. The input, however many numbers it has, is first squeezed to $r$ numbers, and the output is built from those $r$ alone. **A matrix of rank $r$ is a map that passes through a bottleneck of width $r$.**

        **The rank of a product.** For any matrices that can be multiplied,

        $$\text{rank}(AB) \le \text{rank}(A) \qquad \text{and} \qquad \text{rank}(AB) \le \text{rank}(B).$$

        For the first: each column of $AB$ is $A$ applied to a column of $B$, hence a combination of the columns of $A$. So the columns of $AB$ lie in the span of the columns of $A$, and no more of them can be independent than of the columns of $A$. For the second, transpose: $\text{rank}(AB) = \text{rank}(B^{\mathsf{T}}A^{\mathsf{T}}) \le \text{rank}(B^{\mathsf{T}}) = \text{rank}(B)$. **Multiplying can lose rank and can never create it.** Information destroyed by one map is not restored by the next.

        This has a direct reading for networks. Put a layer of 10 neurons between two layers of 1000. With nothing nonlinear between, the composition is $W_2W_1$, a $1000 \times 1000$ matrix that looks as if it had a million free entries. Its rank is at most 10.

        **A promise kept.** For square matrices, $BA = I$ implies $AB = I$. *Proof.* Suppose $BA = I$. If $A\mathbf{c} = \mathbf{0}$ then $\mathbf{c} = BA\mathbf{c} = B\mathbf{0} = \mathbf{0}$, so the columns of $A$ are independent. $A$ is square with full rank, so it is invertible. Then $B = B(AA^{-1}) = (BA)A^{-1} = A^{-1}$, and so $AB = AA^{-1} = I$. $\blacksquare$ The squareness was used where full rank gave invertibility. For a tall matrix the columns can be independent with rows to spare, and the argument stops there.

        **Rank and data.** Let $X$ be a design matrix with one column for each feature. Its rank is the number of features that carry information not already carried by the others. For the flats with rooms, bathrooms and their total, the rank is 2, though there are 3 columns. **Rank below the number of columns is redundancy among the features**, and it is what left the weights undetermined.

        The table of dot products has the same rank: $\text{rank}(X^{\mathsf{T}}X) = \text{rank}(X)$. The reason is a pretty use of the transpose. If $X\mathbf{c} = \mathbf{0}$ then certainly $X^{\mathsf{T}}X\mathbf{c} = \mathbf{0}$. And if $X^{\mathsf{T}}X\mathbf{c} = \mathbf{0}$, then $\mathbf{c}^{\mathsf{T}}X^{\mathsf{T}}X\mathbf{c} = 0$, which is $\lVert X\mathbf{c} \rVert^2 = 0$, so $X\mathbf{c} = \mathbf{0}$. The two matrices have the same dependencies among their columns, and the same number of columns, so the same rank. Hence the square system $X^{\mathsf{T}}X\,\mathbf{w} = X^{\mathsf{T}}\mathbf{y}$ for the best weights has exactly one solution precisely when the features are independent.

        **A caution about real numbers.** Measured data is never exactly redundant. Add a little noise to the table of ratings and its rank, by the definition, jumps from 1 to 3, though it is still almost entirely one pattern. The exact rank is a brittle number. What practice needs is a way to say "this matrix is very nearly of rank 1", and to find the nearest matrix of low rank. That needs tools from later clusters. The idea you have now, a table as a sum of a few patterns, is what those tools make precise, and it is the basis of compression, of recommendation systems, and of the cheap ways of adjusting a large trained model by adding a low-rank matrix to each of its weight matrices.
    - question:
        id: order-inverse
        type: order
        system: s2
        prompt: Put the steps in order to prove that for square matrices $A$ and $B$, if $BA = I$ then $AB = I$.
        steps:
          - 'Suppose $A\mathbf{c} = \mathbf{0}$. Multiplying by $B$ gives $\mathbf{c} = BA\mathbf{c} = \mathbf{0}$.'
          - 'So only the zero vector is sent to zero, which means the columns of $A$ are independent.'
          - 'A square matrix with independent columns has full rank and is therefore invertible.'
          - 'Multiply $BA = I$ on the right by $A^{-1}$: $B = A^{-1}$.'
          - 'Hence $AB = AA^{-1} = I$.'
        explanation: The proof first uses $BA = I$ to show that $A$ loses nothing, then uses squareness to turn "loses nothing" into "invertible", and only then may it speak of $A^{-1}$ and identify $B$ with it. The inverse cannot be used before it is known to exist, which is why the step about rank must come before the multiplication by $A^{-1}$.
        hints:
          - Begin by showing what BA = I says about vectors that A sends to zero.
          - The inverse of A may be used only after A is known to be invertible.
          - The conclusion AB = I comes last.
  formal:
    - text: |
        **Rank.** The rank of $A$ is the largest number of linearly independent columns of $A$.

        **Pivots.** The rank equals the number of pivots found by elimination, however it is carried out. Row operations preserve every linear relation among the columns, and preserve the span of the rows.

        **Rows.** $\text{rank}(A^{\mathsf{T}}) = \text{rank}(A)$: the largest number of independent rows equals the largest number of independent columns.

        **Bounds.** For $A$ of shape $m \times n$, $\text{rank}(A) \le \min(m, n)$. A square matrix of size $n$ is invertible exactly when its rank is $n$.

        **Rank one.** $\text{rank}(A) = 1$ exactly when $A = \mathbf{u}\mathbf{v}^{\mathsf{T}}$ with $\mathbf{u}, \mathbf{v}$ non-zero.

        **Factorisation.** A matrix of rank $r$ can be written $A = CR$ with $C$ of shape $m \times r$ and $R$ of shape $r \times n$, a sum of $r$ matrices of rank 1.

        **Products.** $\text{rank}(AB) \le \min(\text{rank}(A), \text{rank}(B))$.

        **Table of dot products.** $\text{rank}(A^{\mathsf{T}}A) = \text{rank}(A)$.
  drill:
    - text: Seconds each. Count the directions that are really different.
    - question:
        id: drill-multiple
        type: numeric
        system: s1
        prompt: |
          What is the rank of the matrix with rows $(1, 2)$ and $(2, 4)$?
        answer: "1"
        explanation: The second row is twice the first, and the second column is twice the first. One independent direction.
        hints:
          - Compare the two rows.
          - Is the matrix zero?
    - question:
        id: drill-identity
        type: numeric
        system: s1
        prompt: |
          What is the rank of the $3 \times 3$ identity matrix?
        answer: "3"
        explanation: Its columns are the three unit vectors, which are independent.
        hints:
          - What are its columns?
          - Are they independent?
    - question:
        id: drill-zero
        type: numeric
        system: s1
        prompt: |
          What is the rank of the $2 \times 2$ matrix of zeros?
        answer: "0"
        explanation: It has no non-zero column, so not even one column forms an independent list.
        hints:
          - Is a list containing only the zero vector independent?
          - How many pivots would elimination find?
    - question:
        id: drill-wide
        type: numeric
        system: s1
        prompt: |
          What is the rank of the matrix with rows $(1, 0, 0)$ and $(0, 1, 0)$?
        answer: "2"
        explanation: It is already in reduced form, with pivots in columns 1 and 2.
        hints:
          - Count the pivots.
          - The third column is zero and adds nothing.
    - question:
        id: drill-max
        type: numeric
        system: s1
        prompt: |
          What is the largest possible rank of a matrix with 3 rows and 5 columns?
        answer: "3"
        explanation: The rank is at most the smaller of the number of rows and the number of columns.
        hints:
          - Each pivot needs a row of its own.
          - Take the smaller of 3 and 5.
    - question:
        id: drill-outer
        type: numeric
        system: s1
        prompt: |
          $\mathbf{u} = (2, 1, 3)$ and $\mathbf{v} = (1, 2, 3, 1)$. What is the rank of $\mathbf{u}\mathbf{v}^{\mathsf{T}}$?
        answer: "1"
        explanation: Every column of an outer product is a multiple of u.
        hints:
          - What is each column of the outer product?
          - How many independent directions do multiples of one vector have?
    - question:
        id: drill-invertible
        type: choice
        system: s1
        prompt: |
          A $4 \times 4$ matrix has rank 3. Is it invertible?
        options: ["Yes", "No, a square matrix is invertible only when its rank equals its size", "Only if it is symmetric", "It cannot be told"]
        answer: 1
        explanation: Rank 3 means one column has no pivot, so some non-zero vector is sent to zero.
        hints:
          - How many pivots does an invertible 4 by 4 matrix have?
          - Compare the rank with the size.
    - question:
        id: drill-storage
        type: numeric
        system: s1
        prompt: |
          A table with 100 rows and 200 columns has rank 1 and is stored as one column and one row. How many numbers is that?
        answer: "300"
        explanation: A column of 100 numbers and a row of 200. The full table would need 20000.
        hints:
          - How many numbers are in the column?
          - How many are in the row?
    - question:
        id: drill-sum-row
        type: numeric
        system: s1
        prompt: |
          What is the rank of the matrix with rows $(1, 2, 3)$, $(4, 5, 6)$ and $(5, 7, 9)$?
        answer: "2"
        explanation: The third row is the sum of the first two, and the first two are not multiples of each other.
        hints:
          - Add the first two rows.
          - Are the first two rows multiples of each other?
    - question:
        id: drill-transpose
        type: choice
        system: s1
        prompt: |
          How does the rank of $A^{\mathsf{T}}$ compare with the rank of $A$?
        options: ["It is always equal", "It is always smaller", "It is equal only for square matrices", "It is the number of rows minus the rank of A"]
        answer: 0
        explanation: The number of independent rows equals the number of independent columns.
        hints:
          - The columns of the transpose are the rows of A.
          - What did the count of pivots show about rows and columns?
    - question:
        id: drill-product
        type: choice
        system: s1
        prompt: |
          $A$ has rank 5 and $B$ has rank 2. The rank of $AB$ is
        options: ["exactly 10", "exactly 7", "at most 2", "at least 5"]
        answer: 2
        explanation: A product has rank at most the smaller of the ranks of its factors.
        hints:
          - Can multiplying create rank?
          - Take the smaller of the two ranks.
    - question:
        id: drill-full
        type: numeric
        system: s1
        prompt: |
          What is the rank of the matrix with rows $(1, 1)$ and $(1, -1)$?
        answer: "2"
        explanation: ad − bc = −1 − 1 = −2, which is not zero, so the columns are independent.
        hints:
          - Compute ad − bc.
          - A non-zero value means the columns are independent.
    - question:
        id: drill-rows
        type: numeric
        system: s1
        prompt: |
          A matrix with 5 rows and 3 columns has rank 3. How many of its rows can be chosen to form an independent list, at most?
        answer: "3"
        explanation: The largest number of independent rows equals the rank. Two of the five rows are combinations of the others.
        hints:
          - The row count and the column count agree.
          - Both equal the rank.
    - question:
        id: predict-outer
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          u = [2, 1, 3]
          v = [1, 2, 3, 1]
          T = [[a * b for b in v] for a in u]

          print(T[0])
          print(T[2])
          print(len(T), len(T[0]))
        output: |
          [2, 4, 6, 2]
          [3, 6, 9, 3]
          3 4
        explanation: Each row of the table is v scaled by one component of u. The first row is 2 times v and the third is 3 times v. Seven numbers have produced a table of twelve.
        hints:
          - The outer comprehension makes one row for each component of u.
          - Each row is v multiplied by that component.
    - question:
        id: predict-pivots
        type: predict
        system: s1
        prompt: A matrix already reduced by elimination. What does this show?
        code: |
          U = [[1, 2, 1, 4], [0, 0, 3, 6], [0, 0, 0, 0]]
          pivots = []

          for row in U:
              for j in range(len(row)):
                  if row[j] != 0:
                      pivots.append(j)
                      break

          print(pivots, len(pivots))
        output: "[0, 2] 2"
        explanation: For each row the inner loop finds the position of its first non-zero entry and stops. The first row gives position 0, the second position 2, and the row of zeros gives nothing. Two pivots, so the rank is 2.
        hints:
          - break leaves the inner loop at the first non-zero entry of a row.
          - A row of zeros never reaches the append.
  work:
    - text: Slower now. The rank is a count, and counts are best found by elimination, not by eye.
    - question:
        id: write-rank
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rank(A)` for a matrix stored as a non-empty list of rows. Return its rank, found by elimination: count the pivots.

          Go through the columns from the left, keeping track of the row where the next pivot will go. In each column, look from that row down for the entry of largest size. If it is larger in size than `1e-9`, exchange it into place, clear the entries below it, and move the pivot row down by one. Otherwise the column has no pivot: go on to the next column **without** moving down. Do not change `A`.
        starter: |
          def rank(A):
              # Replace the next line with your own.
              return 0

          print(rank([[1, 2, 1, 4], [2, 4, 5, 14], [3, 6, 6, 18]]))
        solution: |
          def rank(A):
              rows = [list(row) for row in A]
              m = len(rows)
              n = len(rows[0])
              r = 0
              for k in range(n):
                  if r < m:
                      best = r
                      for i in range(r + 1, m):
                          if abs(rows[i][k]) > abs(rows[best][k]):
                              best = i
                      if abs(rows[best][k]) > 1e-9:
                          rows[r], rows[best] = rows[best], rows[r]
                          for i in range(r + 1, m):
                              mult = rows[i][k] / rows[r][k]
                              rows[i] = [a - mult * p for a, p in zip(rows[i], rows[r])]
                          r += 1
              return r

          print(rank([[1, 2, 1, 4], [2, 4, 5, 14], [3, 6, 6, 18]]))
        tests: |
          assert rank([[1, 2, 1, 4], [2, 4, 5, 14], [3, 6, 6, 18]]) == 2, "This 3 by 4 matrix has pivots in columns 1 and 3, so its rank is 2"
          assert rank([[2, 4, 6, 2], [1, 2, 3, 1], [3, 6, 9, 3]]) == 1, "The table of ratings has rank 1"
          assert rank([[2, 4, 6, 2], [1, 2, 5, 1], [3, 6, 9, 3]]) == 2, "With one rating changed, the table has rank 2"
          assert rank([[1, 0, 0], [0, 1, 0], [0, 0, 1]]) == 3, "The identity matrix of size 3 has rank 3"
          assert rank([[0, 0], [0, 0]]) == 0, "The zero matrix has rank 0"
          assert rank([[0, 1], [1, 0]]) == 2, "The first pivot position holds 0, and after an exchange there are two pivots"
          assert rank([[0, 0], [0, 1]]) == 1, "The first column has no pivot. The second has one"
          assert rank([[1, 2, 1], [2, 4, 3]]) == 2, "The second column has no pivot, and the third still does. Do not move down a row for a column without a pivot"
