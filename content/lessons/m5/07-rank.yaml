    - question:
        id: work-bottleneck
        type: numeric
        system: s2
        prompt: |
          A model multiplies its input by $W_1$, of shape $10 \times 1000$, and the result by $W_2$, of shape $1000 \times 10$, with nothing between them. The product $W_2W_1$ is a $1000 \times 1000$ matrix. What is the largest rank it can have?
        answer: "10"
        explanation: |
          The rank of a product is at most the rank of each factor, and each factor has rank at most the smaller of its two sizes, which is 10. Seen as a map: $W_1$ squeezes a thousand numbers into ten, and whatever $W_2$ does afterwards, its output is determined by those ten. The thousand output components are all combinations of just 10 columns. So although $W_2W_1$ has a million entries, it could be stored as the two factors, with $10000 + 10000$ numbers.
        hints:
          - What is the largest possible rank of the first matrix, given its two sizes?
          - Can multiplying by another matrix raise the rank?
          - The rank is limited by the narrowest point the numbers pass through.
    - question:
        id: work-rows-columns
        type: choice
        system: s2
        prompt: |
          A table of ratings has 3 rows, one for each person, and 4 columns, one for each film. Exactly two of its rows are independent. How many of its columns are independent, at most?
        options:
          - "Four, since the columns are different vectors from the rows."
          - "Three, since the columns have three components."
          - "Two. The largest number of independent columns always equals the largest number of independent rows."
          - "It cannot be known without the entries."
        answer: 2
        explanation: |
          The number of independent rows is the number of pivots, and so is the number of independent columns. Both are the rank, which here is 2. In terms of the ratings: if every person's row is a mixture of two basic taste profiles, then every film's column is a mixture of two basic appeal profiles. The table can be written as a $3 \times 2$ matrix times a $2 \times 4$ matrix, and that one factorisation shows both facts together: each row is a combination of the two rows of the second factor, and each column a combination of the two columns of the first.
        hints:
          - What number equals the count of independent rows?
          - What number equals the count of independent columns?
          - Both are counts of pivots.
    - question:
        id: work-adapter
        type: choice
        system: s2
        prompt: |
          A trained model has a weight matrix $W$ of shape $1000 \times 1000$. To adjust it cheaply, $W$ is frozen and a correction $BA$ is added, with $B$ of shape $1000 \times 8$ and $A$ of shape $8 \times 1000$, and only $A$ and $B$ are trained. Which statement is right?
        options:
          - "The correction has a million free numbers, like $W$."
          - "The correction is a $1000 \\times 1000$ matrix of rank at most 8, described by 16000 numbers. It can change the layer's output only within the span of the 8 columns of $B$."
          - "The correction has rank 1000."
          - "The correction cannot be added to $W$, since the shapes differ."
        answer: 1
        explanation: |
          $BA$ has shape $1000 \times 1000$, the same as $W$, so the two can be added. Its rank is at most 8, the width of the bottleneck. $B$ has 8000 entries and $A$ has 8000, against a million in $W$. Every output of the correction is $B$ applied to a vector of 8 numbers, a combination of the 8 columns of $B$. The bet behind the method is that the change a model needs for a new task is close to low rank, even though the weights themselves are not. It is the idea of the puzzle, a large table that secretly holds few numbers, used on purpose.
        hints:
          - What is the shape of B times A?
          - How many entries have B and A together?
          - What bounds the rank of a product?
    - question:
        id: work-gram
        type: choice
        system: s2
        prompt: |
          Suppose $X^{\mathsf{T}}X\mathbf{c} = \mathbf{0}$. Which argument shows that $X\mathbf{c} = \mathbf{0}$?
        options:
          - "Multiply both sides by the inverse of $X^{\\mathsf{T}}$."
          - "Multiply on the left by $\\mathbf{c}^{\\mathsf{T}}$: then $\\mathbf{c}^{\\mathsf{T}}X^{\\mathsf{T}}X\\mathbf{c} = 0$, which is $(X\\mathbf{c}) \\cdot (X\\mathbf{c}) = \\lVert X\\mathbf{c} \\rVert^2 = 0$, and only the zero vector has length zero."
          - "$X^{\\mathsf{T}}X$ is symmetric, so $\\mathbf{c}$ must be zero."
          - "It does not follow."
        answer: 1
        explanation: |
          $X^{\mathsf{T}}$ is usually not square and has no inverse, so the first argument is not available. The second works for any $X$. $\mathbf{c}^{\mathsf{T}}X^{\mathsf{T}}$ is the transpose of $X\mathbf{c}$, so $\mathbf{c}^{\mathsf{T}}X^{\mathsf{T}}X\mathbf{c}$ is the dot product of $X\mathbf{c}$ with itself, its squared length. A squared length of zero forces the vector to be zero. Together with the obvious converse, this shows that $X$ and $X^{\mathsf{T}}X$ send exactly the same vectors to zero, so they have the same rank. The practical meaning: the system for the best-fitting weights is singular exactly when the features are redundant, and for no other reason.
        hints:
          - The transpose of X has no inverse in general.
          - What is the transpose of Xc?
          - A row times a column is a dot product, and a vector dotted with itself is its squared length.
  connections:
    - text: |
        A table of twelve ratings could be rebuilt from seven numbers, because every row was a multiple of one row and every column a multiple of one column. Change one entry and it could not. What separates the two tables is the rank: the largest number of independent columns, which elimination finds by counting pivots, however it is carried out, because row operations keep every relation among the columns.

        The rows give the same count. That is the fact of this lesson that is hardest to see coming: a matrix with four columns in $\mathbb{R}^3$ and three rows in $\mathbb{R}^4$ has as many independent rows as independent columns. With it, [[m5.elimination-and-linear-systems]] is summed up in one number. A square matrix is invertible exactly when its rank is its size. A product cannot have greater rank than its factors, which is why a narrow layer limits everything after it. And a matrix of rank $r$ is a sum of $r$ outer products, the $\mathbf{u}\mathbf{v}^{\mathsf{T}}$ of [[m5.transpose]], a map through a bottleneck of width $r$.

        The rank is only a number. It says **how many** dimensions the outputs fill, and not **which**. The table of ratings sent everything onto one line in $\mathbb{R}^3$: which line? And if four numbers go in and only one number's worth comes out, three dimensions' worth of input has been lost: which inputs, exactly, are sent to zero? Those two sets, the outputs a matrix can reach and the inputs it destroys, are spaces in their own right, with shapes you can describe, and between them they answer every question about whether $A\mathbf{x} = \mathbf{b}$ can be solved and in how many ways. The words "dimension" and "space" have been used loosely so far, and [[m5.basis-and-dimension]] will make them exact. The single number that tells whether a square matrix has full rank is [[m5.determinant]].

        The two spaces come first. They are the next lesson, [[m5.column-space-and-null-space]].
