    - question:
        id: fix-column-basis
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `column_basis(A, U, pivots)` should return a basis for the column space of `A`, as a list of vectors. `U` is what elimination turned `A` into, and `pivots` lists the columns of the pivots, counting from 0. The column space of the matrix below is the line through $(1, 2)$, so the program should print `[[1, 2]]`. It prints `[[1, 0]]`. Fix it.
