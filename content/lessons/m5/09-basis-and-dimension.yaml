        solution: |
          def column_basis(A, U, pivots):
              return [[row[j] for row in A] for j in pivots]

          print(column_basis([[1, 2], [2, 4]], [[1, 2], [0, 0]], [0]))
        tests: |
          assert column_basis([[1, 2], [2, 4]], [[1, 2], [0, 0]], [0]) == [[1, 2]], "The column space of rows [1, 2] and [2, 4] is the line through [1, 2], its first column"
