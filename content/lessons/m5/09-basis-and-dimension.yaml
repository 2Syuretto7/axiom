          assert _close(coordinates([1, 1], [1, 1.01], [0, 1]), [-100, 100]), "With nearly parallel basis vectors, [0, 1] has coordinates [-100, 100]"
          assert _close(coordinates([3, 5], [1, 2], [13, 23]), [3, 4]), "[13, 23] is 3 of [3, 5] plus 4 of [1, 2]"
