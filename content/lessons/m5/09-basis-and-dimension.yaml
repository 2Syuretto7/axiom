concept: m5.basis-and-dimension
minutes: 95
claim: You can say what a basis of a subspace is and why it gives every vector exactly one set of coordinates, prove that every basis of a subspace has the same number of vectors, define dimension as that number, find bases for the column space and the null space of a matrix, and use the fact that their dimensions add up to the number of columns.
recalls: [m5.column-space-and-null-space]
uses: [m5.rank, m5.elimination-and-linear-systems, m5.identity-and-inverse, m5.matrix-multiplication-as-composition, m5.matrix-vector-product, m5.matrices-as-linear-maps, m4.linear-independence, m4.linear-combinations-and-span, m4.lines-planes-and-hyperplanes, m10.differentiation-rules, m3.contrapositive-and-contradiction, e1.exceptions, e1.comprehensions-and-iterators, e0.functions, e0.loops, e0.lists-and-tuples]
leads: [m5.change-of-basis, m5.determinant, m6.rank-nullity-theorem, m7.orthonormal-bases]
starter: |
  # Scratch space. Addresses in a town whose streets run along b1 and b2.
  b1 = [2, 1]
  b2 = [-1, 1]
  print([1 * p + 2 * q for p, q in zip(b1, b2)])

  # A third street direction is added: b3 = b1 + b2. Two addresses, one place.
  b3 = [1, 2]
  print([1 * p + 2 * q + 0 * r for p, q, r in zip(b1, b2, b3)])
  print([0 * p + 1 * q + 1 * r for p, q, r in zip(b1, b2, b3)])
parts:
  recall:
    - text: |
        [[m5.column-space-and-null-space]] described the outputs a matrix can reach and the inputs it sends to zero, calling them lines and planes and counting the independent vectors that span them, and ended by asking whether that count is the same however the spanning is done. Three quick pulls first.
  puzzle:
    - text: |
        A town is laid out on a plain. One surveyor gives every place an address in the usual way: so far east, so far north. A second surveyor prefers the town's own streets, which run along the directions $(2, 1)$ and $(-1, 1)$. Her address for a place is: so many blocks along the first street, so many along the second. Run the first line of the starter. The address "1 block, then 2 blocks" is the place the first surveyor calls $(0, 3)$.

        Both systems work. Every place has an address, and no place has two.

        A third surveyor wants more flexibility and adds a diagonal street, along $(1, 2)$. Now addresses have three numbers. Run the rest of the starter. The addresses $(1, 2, 0)$ and $(0, 1, 1)$ are the same place. His system is ambiguous.

        A fourth, to save paint, proposes a single street along $(2, 1)$. Now most of the town has no address at all.

        Two streets were right for this plain, and three were too many, and one too few. But is that a fact about the plain, or about these particular streets? **Could some cleverer choice of street directions give every place exactly one address using three numbers, or one? And for a tilted sheet inside a space of a thousand dimensions, what is the right number of streets, and how would you find it?**
  intuition:
    - text: |
        An addressing system has to do two things, and they pull in opposite directions.

        It must **reach everywhere**. Every place must have at least one address. That asks for enough streets: the street directions must span the plain.

        It must **never repeat**. No place may have two addresses. That asks for few enough streets: the directions must be independent, since you have seen that coefficients are unique exactly for independent lists.

        The third surveyor's streets span the plain and are dependent, since $(1, 2) = (2, 1) + (-1, 1)$. The fourth's street is independent, being one non-zero vector, and does not span. The second surveyor's two streets do both.

        The figure shows her system. The dashed grid is drawn along her streets. Move the two amounts and watch the place and its two descriptions.
    - figure: basis-grid
    - text: |
        With amounts 1 and 2 the place is $(0, 3)$ in the usual coordinates. Its address in her system is $(1, 2)$. The place has not moved. It simply has two names, one in each system, and each system gives it only one. Every crossing of the dashed grid is a place whose address is a pair of whole numbers.

        A list of vectors that spans and is independent is called a **basis**. The claim to be proved is that the number of vectors in a basis is not a matter of taste. Every basis of the plain has two vectors. Every basis of the null space in the last lesson has two. That number is a property of the space itself, and it is what the word **dimension** means.
  derivation:
    - text: |
        **Basis.** Let $S$ be a subspace of $\mathbb{R}^n$. A **basis** of $S$ is a list of vectors $\mathbf{v}_1, \dots, \mathbf{v}_k$ in $S$ that

        - **spans** $S$: every vector of $S$ is a combination of them, and
        - is **linearly independent**.

        The two conditions together say: **every vector of $S$ is a combination of the basis vectors in exactly one way.** Spanning gives at least one way and independence gives at most one. The coefficients are called the **coordinates** of the vector with respect to that basis.

        The unit vectors $\mathbf{e}_1, \dots, \mathbf{e}_n$ are a basis of $\mathbb{R}^n$, the **standard basis**, and the coordinates with respect to it are the ordinary components. But it is one basis among infinitely many. For $n$ vectors in $\mathbb{R}^n$, put them as the columns of a square matrix $B$. They span when $B\mathbf{c} = \mathbf{v}$ can always be solved, and they are independent when the solution is unique. So

        $$n \text{ vectors form a basis of } \mathbb{R}^n \iff \text{the matrix with those columns is invertible}.$$

        For the town, the columns $(2, 1)$ and $(-1, 1)$ give $ad - bc = 2 + 1 = 3 \ne 0$. A basis.

        **Every basis has the same size.** This is the theorem that makes dimension meaningful. It rests on one lemma.

        *Lemma.* If $\mathbf{v}_1, \dots, \mathbf{v}_k$ span $S$, then any list of **more than** $k$ vectors in $S$ is dependent.

        *Proof.* Take $\mathbf{w}_1, \dots, \mathbf{w}_j$ in $S$ with $j > k$. Let $V$ be the matrix with columns $\mathbf{v}_1, \dots, \mathbf{v}_k$. Each $\mathbf{w}_i$ is a combination of the $\mathbf{v}$'s, so $\mathbf{w}_i = V\mathbf{a}_i$ for some vector $\mathbf{a}_i$ of $k$ coefficients. Collect the $\mathbf{a}_i$ as the columns of a matrix $A$, of shape $k \times j$, and the $\mathbf{w}_i$ as the columns of $W$. Then

        $$W = VA.$$

        $A$ has $k$ rows and $j > k$ columns. A matrix that is wider than tall has a non-zero vector in its null space: $A\mathbf{c} = \mathbf{0}$ with $\mathbf{c} \ne \mathbf{0}$. Then $W\mathbf{c} = VA\mathbf{c} = V\mathbf{0} = \mathbf{0}$, and that is a dependency among the $\mathbf{w}$'s. $\blacksquare$

        *Theorem.* Any two bases of a subspace $S$ have the same number of vectors.

        *Proof.* Let one basis have $k$ vectors and another $j$. The first spans $S$ and the second is independent, so by the lemma $j$ cannot be more than $k$. The second spans and the first is independent, so $k$ cannot be more than $j$. Hence $j = k$. $\blacksquare$

        Notice what did the work: the fact that a wide matrix has a non-zero null vector, which was a count of pivots. The whole idea of dimension stands on elimination.

        **Dimension.** The **dimension** of a subspace $S$, written $\dim S$, is the number of vectors in any basis of $S$.

        | Subspace | A basis | Dimension |
        | --- | --- | --- |
        | $\mathbb{R}^n$ | $\mathbf{e}_1, \dots, \mathbf{e}_n$ | $n$ |
        | A line through the origin | one non-zero vector on it | 1 |
        | A plane through the origin | two independent vectors in it | 2 |
        | The zero vector alone | the empty list | 0 |

        So the answer to the puzzle is no. Three streets on a plain can never be independent, and one can never span, however they are chosen. The lemma says that the size of any independent list is at most the size of any spanning list, and for a plain the two meet at 2.

        **Two conditions for the price of one.** If you already know that $\dim S = k$, then for a list of **exactly** $k$ vectors in $S$, each condition implies the other.

        - $k$ independent vectors in $S$ must span $S$. If some vector of $S$ were outside their span, adding it would give $k + 1$ independent vectors, and the lemma forbids that.
        - $k$ vectors that span $S$ must be independent. If one were a combination of the others it could be dropped, leaving $k - 1$ vectors that span, and then a basis of $k$ independent vectors would contradict the lemma.

        So to check that three vectors are a basis of $\mathbb{R}^3$ you need only check independence, or only spanning.
    - question:
        id: derivation-three-streets
        type: choice
        system: s2
        prompt: |
          A surveyor claims to have found three street directions on the plain such that every place has exactly one address of three numbers. Which reply is right?
        options:
          - "It is possible if the three directions are chosen far apart."
          - "It is impossible. The two unit vectors span the plain, so by the lemma any three vectors of the plain are dependent, and a dependency gives some place two addresses."
          - "It is possible if one of the three is the zero vector."
          - "It is impossible, because addresses must be whole numbers."
        answer: 1
        explanation: |
          The lemma compares any independent list with any spanning list: the independent one is never longer. Since two vectors span the plain, no three vectors of it can be independent. A dependency $c_1\mathbf{v}_1 + c_2\mathbf{v}_2 + c_3\mathbf{v}_3 = \mathbf{0}$ with coefficients not all zero means the addresses $(0, 0, 0)$ and $(c_1, c_2, c_3)$ name the same place, the origin, and adding it to any address gives a second address for that place. Including the zero vector makes matters worse, since it is dependent all on its own.
    - text: |
        **Bases for the spaces of a matrix.** Let $A$ be $m \times n$ with rank $r$. Elimination hands you a basis for each of its spaces.

        *The column space.* The pivot columns **of $A$ itself** are a basis for $C(A)$. They are independent, and every other column is a combination of them, as the lesson on rank showed. So

        $$\dim C(A) = r.$$

        Take care: the pivot columns of the **reduced** matrix will not do. Row operations preserve the relations among the columns and so tell you *which* columns to take, but they change the columns themselves, and with them the column space.

        *The null space.* The special solutions are a basis for $N(A)$. They span it, and they are independent, each having a 1 where the others have 0. There is one for each free column, so

        $$\dim N(A) = n - r.$$

        *The row space.* The non-zero rows of the reduced matrix are a basis for the row space, since row operations do preserve the span of the rows. Its dimension is $r$ too.

        For the matrix of the last two lessons, with rank 2 and four columns: the column space has basis $(1, 2, 3)$ and $(1, 5, 6)$, the first and third columns. The null space has basis $(-2, 1, 0, 0)$ and $(-2, 0, -2, 1)$. The row space has basis $(1, 2, 0, 2)$ and $(0, 0, 1, 2)$.

        **The count.** Add the first two dimensions:

        $$\dim C(A) + \dim N(A) = r + (n - r) = n.$$

        The number of columns $n$ is the dimension of the space of inputs. So the statement reads: **the dimensions that go in equal the dimensions that come out plus the dimensions that are destroyed.** Every direction of input either survives as a direction of output or is flattened to zero, and none is counted twice. This is called the rank-nullity theorem, the dimension of the null space being known as the nullity.

        It makes short work of things that took effort before. For a **square** matrix, $n \times n$: the null space is $\{\mathbf{0}\}$ exactly when $n - r = 0$, which is exactly when $r = n$, which is exactly when the column space is all of $\mathbb{R}^n$. **A square matrix loses nothing exactly when it reaches everything.** For maps between spaces of the same dimension, one-to-one and onto are the same condition. That is why $BA = I$ was enough to give $AB = I$.

        And for a wide matrix, $n > m$: the rank is at most $m$, so the null space has dimension at least $n - m > 0$. For a tall one, $m > n$: the column space has dimension at most $n < m$, so it cannot be all of $\mathbb{R}^m$.

        **A basis from a spanning list.** Given vectors that span a subspace with some waste among them, put them as the columns of a matrix, eliminate, and keep those in the pivot positions. The surviving vectors span the same subspace and are independent.

        **Spaces that are not made of arrows.** The polynomials of degree at most 2 behave like vectors: they can be added and scaled. Every one is $a + bx + cx^2$ in exactly one way, so $1$, $x$, $x^2$ is a basis and the dimension is 3. The coefficient vector $(a, b, c)$ of the first lesson of this cluster was the list of coordinates in that basis.

        Differentiation on these polynomials was the matrix $D$ with rows $(0, 1, 0)$, $(0, 0, 2)$ and $(0, 0, 0)$. Its rank is 2: the derivatives are the polynomials of degree at most 1, with basis $1$ and $x$. Its null space has dimension $3 - 2 = 1$: the polynomials whose derivative is zero, which are the constants. You knew both facts from calculus. The count $2 + 1 = 3$ ties them together: differentiating loses exactly one dimension, and it is the one that integration puts back as the arbitrary constant.

        **Dimension in the language of models.** When an embedding is said to have 768 dimensions, the meaning is the plain one: each vector is a list of 768 numbers, a point of $\mathbb{R}^{768}$. A subtler use matters more. A cloud of such vectors may lie close to a subspace of far lower dimension, in which case a basis for that subspace describes each of them with far fewer coordinates. Finding such a basis is the idea behind compressing data. And when the weights that fit a data set exactly form a shifted null space, its dimension, $n - r$, is the number of directions in which the fit leaves the weights free.
    - question:
        id: order-lemma
        type: order
        system: s2
        prompt: Put the steps in order to prove that if $\mathbf{v}_1, \mathbf{v}_2$ span $S$, then any three vectors $\mathbf{w}_1, \mathbf{w}_2, \mathbf{w}_3$ of $S$ are dependent.
        steps:
          - 'Each $\mathbf{w}_i$ is in $S$, so $\mathbf{w}_i = V\mathbf{a}_i$, where $V$ has columns $\mathbf{v}_1, \mathbf{v}_2$ and $\mathbf{a}_i$ has 2 components.'
          - 'Put the $\mathbf{a}_i$ as the columns of a $2 \times 3$ matrix $A$, so that the matrix $W$ with columns $\mathbf{w}_i$ is $W = VA$.'
          - '$A$ has more columns than rows, so there is a vector $\mathbf{c} \ne \mathbf{0}$ with $A\mathbf{c} = \mathbf{0}$.'
          - 'Then $W\mathbf{c} = VA\mathbf{c} = V\mathbf{0} = \mathbf{0}$.'
          - 'So $c_1\mathbf{w}_1 + c_2\mathbf{w}_2 + c_3\mathbf{w}_3 = \mathbf{0}$ with coefficients not all zero: the three are dependent.'
        explanation: The proof writes each of the three vectors in terms of the two that span, gathers the coefficients into a small wide matrix, and uses the fact that a wide matrix always sends some non-zero vector to zero. That vector, passed through $V$, is a dependency among the three. The vectors may live in a space of any dimension. The argument only ever looks at the $2 \times 3$ table of coefficients.
  formal:
    - text: |
        **Basis.** A list of vectors in a subspace $S$ that spans $S$ and is linearly independent. Equivalently, every vector of $S$ is a combination of them in exactly one way. The coefficients are its coordinates with respect to the basis.

        **Invertibility.** $n$ vectors form a basis of $\mathbb{R}^n$ exactly when the matrix with those columns is invertible.

        **Lemma.** If $k$ vectors span $S$, any list of more than $k$ vectors of $S$ is dependent.

        **Theorem.** All bases of $S$ have the same number of vectors. That number is $\dim S$.

        **Exactly $k$ vectors.** If $\dim S = k$, a list of $k$ vectors in $S$ is a basis as soon as it is independent, and as soon as it spans.

        **Spaces of a matrix.** For $A$ of shape $m \times n$ and rank $r$: the pivot columns of $A$ are a basis of $C(A)$, the special solutions are a basis of $N(A)$, and the non-zero rows of the reduced form are a basis of the row space. $\dim C(A) = r$, $\dim N(A) = n - r$, and the row space has dimension $r$.

        **Rank-nullity.** $\dim C(A) + \dim N(A) = n$.
  drill:
    - text: Seconds each. A basis must reach everything and repeat nothing.
    - question:
        id: drill-too-many
        type: choice
        system: s1
        prompt: |
          Is the list $(1, 0)$, $(0, 1)$, $(1, 1)$ a basis of the plane?
        options: ["Yes", "No, it spans but is dependent", "No, it is independent but does not span", "No, it neither spans nor is independent"]
        answer: 1
        explanation: The third vector is the sum of the first two, so some vectors have more than one set of coefficients.
    - question:
        id: drill-too-few
        type: choice
        system: s1
        prompt: |
          Is the list containing only $(2, 1)$ a basis of the plane?
        options: ["Yes", "No, it spans but is dependent", "No, it is independent but does not span", "No, it neither spans nor is independent"]
        answer: 2
        explanation: One non-zero vector is independent, and its multiples fill only a line.
    - question:
        id: drill-basis
        type: choice
        system: s1
        prompt: |
          Is the list $(2, 1)$, $(-1, 1)$ a basis of the plane?
        options: ["Yes, because ad − bc is 3, not zero", "No, because the vectors are not perpendicular", "No, because they are not unit vectors", "No, because one component is negative"]
        answer: 0
        explanation: The matrix with these columns is invertible, so the two vectors are independent and span. A basis need not be perpendicular or of unit length.
    - question:
        id: drill-rn
        type: numeric
        system: s1
        prompt: |
          What is the dimension of $\mathbb{R}^5$?
        answer: "5"
        explanation: The five unit vectors are a basis.
    - question:
        id: drill-null-dim
        type: numeric
        system: s1
        prompt: |
          $A$ is a $4 \times 7$ matrix of rank 3. What is the dimension of its null space?
        answer: "4"
        explanation: The number of columns minus the rank, 7 − 3.
    - question:
        id: drill-column-dim
        type: numeric
        system: s1
        prompt: |
          $A$ is a $4 \times 7$ matrix of rank 3. What is the dimension of its column space?
        answer: "3"
        explanation: The dimension of the column space is the rank.
    - question:
        id: drill-plane
        type: numeric
        system: s1
        prompt: |
          What is the dimension of the set of vectors $(x, y, z)$ with $x + y + z = 0$?
        answer: "2"
        explanation: It is the null space of the single row (1, 1, 1), a matrix with 3 columns and rank 1. 3 − 1 = 2. It is a plane through the origin.
    - question:
        id: drill-coordinates
        type: numeric
        system: s1
        prompt: |
          With basis $\mathbf{b}_1 = (2, 1)$ and $\mathbf{b}_2 = (-1, 1)$, a point has coordinates $(1, 2)$. What is its second component in the usual coordinates?
        answer: "3"
        explanation: 1 × (2, 1) + 2 × (−1, 1) = (0, 3).
    - question:
        id: drill-same-size
        type: choice
        system: s1
        prompt: |
          A subspace has a basis of 3 vectors. Another basis of the same subspace has
        options: ["at least 3 vectors", "at most 3 vectors", "exactly 3 vectors", "any number of vectors"]
        answer: 2
        explanation: All bases of a subspace have the same number of vectors, the dimension.
    - question:
        id: drill-free-span
        type: choice
        system: s1
        prompt: |
          Three vectors in $\mathbb{R}^3$ are linearly independent. Do they span $\mathbb{R}^3$?
        options: ["Yes, always", "Only if they are perpendicular", "Not necessarily", "Never"]
        answer: 0
        explanation: In a space of dimension 3, three independent vectors are automatically a basis.
    - question:
        id: drill-zero
        type: numeric
        system: s1
        prompt: |
          What is the dimension of the subspace containing only the zero vector?
        answer: "0"
        explanation: Its basis is the empty list. The zero vector itself can belong to no independent list.
    - question:
        id: drill-nullity
        type: numeric
        system: s1
        prompt: |
          A $5 \times 5$ matrix has a null space of dimension 2. What is its rank?
        answer: "3"
        explanation: Rank plus the dimension of the null space is the number of columns. 5 − 2 = 3.
    - question:
        id: drill-pivot-columns
        type: choice
        system: s1
        prompt: |
          Elimination on $A$ finds pivots in columns 1 and 3. Which vectors form a basis of the column space of $A$?
        options: ["Columns 1 and 3 of the reduced matrix", "Columns 1 and 3 of A itself", "Rows 1 and 3 of A", "Columns 2 and 4 of A"]
        answer: 1
        explanation: Row operations show which columns are independent but change the columns themselves, so the basis must be taken from the original matrix.
    - question:
        id: predict-points
        type: predict
        system: s1
        prompt: Three addresses in the town. What does this show?
        code: |
          b1 = [2, 1]
          b2 = [-1, 1]

          for c in [[1, 2], [1, 0], [0.5, -1]]:
              print([c[0] * p + c[1] * q for p, q in zip(b1, b2)])
        output: |
          [0, 3]
          [2, 1]
          [2.0, -0.5]
        explanation: Each address is so much of b1 plus so much of b2. (1, 2) gives (2 − 2, 1 + 2). (1, 0) is b1 itself. (0.5, −1) gives (1.0 + 1, 0.5 − 1), with floats because of the 0.5.
    - question:
        id: predict-pivot-basis
        type: predict
        system: s1
        prompt: The matrix of the last lessons, with its pivots in columns 0 and 2. What does this show?
        code: |
          A = [[1, 2, 1, 4], [2, 4, 5, 14], [3, 6, 6, 18]]
          pivots = [0, 2]

          basis = [[row[j] for row in A] for j in pivots]
          print(basis)
          print(len(basis), len(A[0]) - len(basis))
        output: |
          [[1, 2, 3], [1, 5, 6]]
          2 2
        explanation: The pivot columns of A are collected as lists. They are a basis of the column space, so its dimension is 2. The null space has dimension 4 − 2 = 2.
