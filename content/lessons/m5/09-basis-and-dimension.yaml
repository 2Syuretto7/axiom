          def coordinates(b1, b2, v):
              a, c = b1
              b, d = b2
              det = a * d - b * c
              if det == 0:
                  raise ValueError("not a basis")
              return [(d * v[0] - b * v[1]) / det, (-c * v[0] + a * v[1]) / det]

