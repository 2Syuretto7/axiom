    - question:
        id: write-power
        type: code
        mode: write
        system: s2
        prompt: |
          A matrix $A$ becomes diagonal in the basis given by the columns of `B`, with diagonal entries listed in `d`. So $A = BMB^{-1}$, where $M$ is diagonal with entries `d`. Write `power_apply(B, B_inverse, d, n, x)` to return $A^n\mathbf{x}$ as a list, for a whole number `n` that is 0 or more, **without multiplying any two matrices together**.

          Translate `x` into the new basis, scale each coordinate by the right power of its diagonal entry, and translate back.
        starter: |
          def power_apply(B, B_inverse, d, n, x):
              # Replace the next line with your own.
              return x

          print(power_apply([[1, 1], [1, -1]], [[0.5, 0.5], [0.5, -0.5]], [3, 1], 10, [1, 0]))
        solution: |
          def power_apply(B, B_inverse, d, n, x):
              c = [sum([a * v for a, v in zip(row, x)]) for row in B_inverse]
              c = [value * factor ** n for value, factor in zip(c, d)]
              return [sum([a * v for a, v in zip(row, c)]) for row in B]

          print(power_apply([[1, 1], [1, -1]], [[0.5, 0.5], [0.5, -0.5]], [3, 1], 10, [1, 0]))
        tests: |
          def _close(got, want):
              return len(got) == len(want) and all([abs(g - w) < 1e-6 for g, w in zip(got, want)])
          _B = [[1, 1], [1, -1]]
          _Bi = [[0.5, 0.5], [0.5, -0.5]]
          assert _close(power_apply(_B, _Bi, [3, 1], 10, [1, 0]), [29525, 29524]), "Ten steps of the puzzle from [1, 0] give [29525, 29524]"
          assert _close(power_apply(_B, _Bi, [3, 1], 1, [1, 0]), [2, 1]), "One step from [1, 0] gives the first column of the matrix, [2, 1]"
          assert _close(power_apply(_B, _Bi, [3, 1], 3, [1, 0]), [14, 13]), "Three steps from [1, 0] give [14, 13]"
          assert _close(power_apply(_B, _Bi, [3, 1], 0, [7, -2]), [7, -2]), "No steps leave the vector as it was"
          assert _close(power_apply(_B, _Bi, [3, 1], 2, [0, 1]), [4, 5]), "Two steps from [0, 1] give [4, 5]"
          assert _close(power_apply(_B, _Bi, [3, 1], 5, [1, -1]), [1, -1]), "[1, -1] is left alone by every step"
          assert _close(power_apply(_B, _Bi, [3, 1], 4, [1, 1]), [81, 81]), "[1, 1] is tripled by each step, so four steps give [81, 81]"
          assert _close(power_apply([[1, 1], [1, -2]], [[2 / 3, 1 / 3], [1 / 3, -1 / 3]], [5, 2], 3, [1, 0]), [86, 78]), "For rows [4, 1] and [2, 3], three steps from [1, 0] give [86, 78]"
          assert _close(power_apply([[1, 0], [0, 1]], [[1, 0], [0, 1]], [2, 0.5], 4, [1, 16]), [16, 1]), "A matrix that is already diagonal scales each component by the fourth power of its entry"
          assert output.strip() == "[29525.0, 29524.0]", "The program should print [29525.0, 29524.0]"
        wrong:
          - |
            def power_apply(B, B_inverse, d, n, x):
                c = [sum([a * v for a, v in zip(row, x)]) for row in B]
                c = [value * factor ** n for value, factor in zip(c, d)]
                return [sum([a * v for a, v in zip(row, c)]) for row in B_inverse]

            print([29525.0, 29524.0])
          - |
            def power_apply(B, B_inverse, d, n, x):
                c = [sum([a * v for a, v in zip(row, x)]) for row in B_inverse]
                c = [value * factor * n for value, factor in zip(c, d)]
                return [sum([a * v for a, v in zip(row, c)]) for row in B]

            print([29525.0, 29524.0])
          - |
            def power_apply(B, B_inverse, d, n, x):
                c = [sum([a * v for a, v in zip(row, x)]) for row in B_inverse]
                c = [value * factor ** n for value, factor in zip(c, d)]
                return c

            print([29525.0, 29524.0])
          - |
            def power_apply(B, B_inverse, d, n, x):
                return [value * factor ** n for value, factor in zip(x, d)]

            print([29525.0, 29524.0])
          - |
            def power_apply(B, B_inverse, d, n, x):
                c = [sum([a * v for a, v in zip(row, x)]) for row in B_inverse]
                c = [value * d[0] ** n for value in c]
                return [sum([a * v for a, v in zip(row, c)]) for row in B]

            print([29525.0, 29524.0])
        explanation: |
          Three lines, for the three factors of $A^n = BM^nB^{-1}$, taken from right to left. $B^{-1}$ translates $\mathbf{x}$ into the basis where the map is diagonal. There each coordinate is simply multiplied by its own entry, $n$ times over, so by that entry to the power $n$. Then $B$ translates back. The cost is two matrix-vector products and a few powers, whatever $n$ is: a million steps cost what one step costs. Scaling the components of $\mathbf{x}$ directly would be right only if $A$ were diagonal to begin with. It is not, and the whole point is that the scaling happens to the coordinates in the **other** basis. Long-run questions about a repeated linear process, such as what happens to a quantity updated by the same matrix at every step of training, are answered in this way: by the sizes of the diagonal entries in the right basis.
        hints:
          - Apply B_inverse to x to get the coordinates in the new basis.
          - Multiply each coordinate by its own diagonal entry raised to the power n.
          - Apply B to the result.
    - question:
        id: fix-orthonormal
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `coordinates(Q, v)` should return the coordinates of `v` in a basis of perpendicular unit vectors, which are the **columns** of the matrix `Q`. Each coordinate is the dot product of `v` with one basis vector. For the basis $(0.6, 0.8)$, $(-0.8, 0.6)$ and the vector $(1, 0)$ the program should print `[0.6, -0.8]`. It prints `[0.6, 0.8]`. Fix it.
        starter: |
          def coordinates(Q, v):
              return [sum([a * b for a, b in zip(row, v)]) for row in Q]

          print(coordinates([[0.6, -0.8], [0.8, 0.6]], [1, 0]))
        solution: |
          def coordinates(Q, v):
              columns = [[row[j] for row in Q] for j in range(len(Q[0]))]
              return [sum([a * b for a, b in zip(column, v)]) for column in columns]

          print(coordinates([[0.6, -0.8], [0.8, 0.6]], [1, 0]))
        tests: |
          def _close(got, want):
              return len(got) == len(want) and all([abs(g - w) < 1e-9 for g, w in zip(got, want)])
          _Q = [[0.6, -0.8], [0.8, 0.6]]
          assert _close(coordinates(_Q, [1, 0]), [0.6, -0.8]), "[1, 0] has dot product 0.6 with [0.6, 0.8] and -0.8 with [-0.8, 0.6]"
          assert _close(coordinates(_Q, [0.6, 0.8]), [1, 0]), "The first basis vector has coordinates [1, 0]"
          assert _close(coordinates(_Q, [-0.8, 0.6]), [0, 1]), "The second basis vector has coordinates [0, 1]"
          assert _close(coordinates(_Q, [0, 5]), [4, 3]), "[0, 5] has dot product 4 with [0.6, 0.8] and 3 with [-0.8, 0.6]"
          assert _close(coordinates([[1, 0], [0, 1]], [7, -2]), [7, -2]), "In the standard basis the coordinates are the components"
          assert _close(coordinates([[0, -1], [1, 0]], [3, 4]), [4, -3]), "With basis vectors [0, 1] and [-1, 0], the vector [3, 4] has coordinates [4, -3]"
          assert _close(coordinates([[0, 0, 1], [1, 0, 0], [0, 1, 0]], [1, 2, 3]), [2, 3, 1]), "With basis vectors [0, 1, 0], [0, 0, 1], [1, 0, 0], the vector [1, 2, 3] has coordinates [2, 3, 1]"
          assert output.strip() == "[0.6, -0.8]", "The program should print [0.6, -0.8]"
        wrong:
          - |
            def coordinates(Q, v):
                return [sum([a * b for a, b in zip(row, v)]) for row in Q]

            print([0.6, -0.8])
          - |
            def coordinates(Q, v):
                columns = [[row[j] for row in Q] for j in range(len(Q[0]))]
                return [sum([a * b for a, b in zip(column, v)]) for column in columns][::-1]

            print([0.6, -0.8])
          - |
            def coordinates(Q, v):
                columns = [[row[j] for row in Q] for j in range(len(Q[0]))]
                return [abs(sum([a * b for a, b in zip(column, v)])) for column in columns]

            print([0.6, -0.8])
          - |
            def coordinates(Q, v):
                return [sum([a * b for a, b in zip(row, v)]) * (1 if i == 0 else -1) for i, row in enumerate(Q)]

            print([0.6, -0.8])
        explanation: |
          The starter dotted `v` with the **rows** of `Q`, which computes $Q\mathbf{v}$. The basis vectors are the columns, and the coordinates are $Q^{\mathsf{T}}\mathbf{v}$: the dot product of $\mathbf{v}$ with each column. $Q$ converts coordinates in the new basis to usual ones, and its inverse, which for perpendicular unit columns is the transpose, converts the other way. For a turn, applying $Q$ where $Q^{\mathsf{T}}$ was meant turns the vector the wrong way round, and the answer is off by a sign in one place: wrong, and plausible enough to pass a glance. The error is invisible for a symmetric $Q$, such as a reflection. The check that never fails is to rebuild the vector: the coordinates times the basis vectors, added up, must give back $\mathbf{v}$.
        hints:
          - Are the basis vectors the rows of Q or its columns?
          - Which product does the starter compute, Q times v or the transpose of Q times v?
          - Collect the columns of Q and dot v with each.
    - question:
        id: work-hundred
        type: choice
        system: s2
        prompt: |
          For the matrix of the puzzle, what is $A^{100}\,(1, 0)$?
        options:
          - '$(3^{100},\; 0)$'
          - '$\left(\dfrac{3^{100} + 1}{2},\; \dfrac{3^{100} - 1}{2}\right)$'
          - '$(2^{100},\; 1)$'
          - '$(3^{100},\; 3^{100})$'
        answer: 1
        explanation: |
          In the basis $(1, 1)$, $(1, -1)$ the vector $(1, 0)$ has coordinates $(0.5, 0.5)$. A hundred steps triple the first coordinate a hundred times and leave the second: $(0.5 \times 3^{100},\; 0.5)$. Translating back, the usual components are the sum and the difference of the two coordinates. The components differ by exactly 1 and add up to $3^{100}$, the pattern seen in the first few steps. As the steps go on, the part along $(1, 1)$ swamps the part along $(1, -1)$, and the vector points ever more nearly along $(1, 1)$. Repeated application of a matrix pulls almost every vector towards the direction with the largest factor.
        hints:
          - Find the coordinates of (1, 0) in the basis (1, 1), (1, −1).
          - What does one step do to each coordinate?
          - Translate back by taking the sum and the difference.
    - question:
        id: work-find-m
        type: numeric
        system: s2
        prompt: |
          $A$ has rows $(4, 1)$ and $(2, 3)$. In the basis $\mathbf{b}_1 = (1, 1)$, $\mathbf{b}_2 = (1, -2)$ its matrix $M$ is diagonal. What is the entry of $M$ in row 1, column 1?
        answer: "5"
        explanation: |
          Column 1 of $M$ holds the coordinates of $A\mathbf{b}_1$ in the new basis. $A\,(1, 1) = (5, 5) = 5\,\mathbf{b}_1 + 0\,\mathbf{b}_2$, so the first column is $(5, 0)$. Likewise $A\,(1, -2) = (2, -4) = 2\,\mathbf{b}_2$, so the second column is $(0, 2)$. $M$ is diagonal with entries 5 and 2. No inverse was needed, because each basis vector was sent to a multiple of itself. Check with the trace: $4 + 3 = 7 = 5 + 2$.
        hints:
          - Apply A to the first basis vector.
          - Express the result as a combination of the two basis vectors.
          - The coefficient of the first basis vector is the entry wanted.
    - question:
        id: work-taylor
        type: choice
        system: s2
        prompt: |
          Polynomials of degree at most 2 have the basis $1, x, x^2$ and also the basis $1, (x - 1), (x - 1)^2$. The polynomial $p(x) = 3 + x^2$ has coordinates $(3, 0, 1)$ in the first. What are its coordinates in the second?
        options:
          - '$(3, 0, 1)$'
          - '$(4, 2, 1)$'
          - '$(3, 2, 1)$'
          - '$(4, 0, 1)$'
        answer: 1
        explanation: |
          The coordinates in the basis of powers of $x - 1$ are the Taylor coefficients at 1: $p(1) = 4$, $p'(1) = 2$, and $\frac{1}{2}p''(1) = 1$. Check by expanding: $4 + 2(x - 1) + (x - 1)^2 = 4 + 2x - 2 + x^2 - 2x + 1 = 3 + x^2$. The polynomial is the same object. Only the basis used to describe it has changed, from one suited to behaviour near 0 to one suited to behaviour near 1. In the second basis, the first two coordinates alone, $4 + 2(x - 1)$, are the tangent line at 1.
        hints:
          - What are p(1) and p′(1)?
          - The third coordinate is half the second derivative.
          - Expand the candidate and compare with 3 + x².
    - question:
        id: work-hidden
        type: choice
        system: s2
        prompt: |
          A model computes $W_2W_1\mathbf{x}$ with a hidden vector $\mathbf{h} = W_1\mathbf{x}$. Someone replaces $W_1$ by $B^{-1}W_1$ and $W_2$ by $W_2B$, for an invertible matrix $B$. What changes?
        options:
          - "The output changes, since both weight matrices changed."
          - "The output is unchanged, since $(W_2B)(B^{-1}W_1) = W_2W_1$. The hidden vector becomes $B^{-1}\\mathbf{h}$: the same information in a different basis."
          - "Nothing at all changes, including the hidden vector."
          - "The model stops working unless $B$ is the identity."
        answer: 1
        explanation: |
          The inner $B\,B^{-1}$ is the identity and drops out, so the function from input to output is exactly as before. The hidden vector is now $B^{-1}W_1\mathbf{x} = B^{-1}\mathbf{h}$, the coordinates of the old hidden vector in the basis given by the columns of $B$. Two models with entirely different weights and entirely different hidden numbers compute one function. So the question "what does the third hidden number represent?" has no answer fixed by the function: it depends on a basis the function does not choose. A rectifier between the layers restricts the allowed $B$ to those that only reorder or positively rescale the coordinates, which is the reason individual neurons are sometimes, and not always, meaningful.
        hints:
          - Multiply the two new matrices together.
          - What is the hidden vector of the new model, in terms of the old one?
          - Is the output a different function of the input?
  connections:
    - text: |
        A matrix applied ten times produced numbers that grew by no visible rule, until you looked at their sum and their difference. Along $(1, 1)$ the matrix triples, and along $(1, -1)$ it does nothing. In the basis made of those two vectors the map is a diagonal matrix, and a hundred steps are as easy as one.

        The machinery is short. The matrix $B$ whose columns are a basis converts coordinates in that basis to usual ones, and $B^{-1}$ converts back, as [[m5.basis-and-dimension]] began to show. A map with usual matrix $A$ is, in the new coordinates, $B^{-1}AB$: translate in, act, translate back. Its columns are the images of the new basis vectors, expressed in the new basis, which is the rule from the first lesson of this cluster freed from the standard axes. When the basis vectors are perpendicular and of unit length, the inverse is the transpose and coordinates are dot products, the subject of [[m7.orthonormal-bases]].

        The idea reaches well past this example. A basis whose vectors a map merely scales makes the map diagonal. Finding such vectors, deciding when there are enough of them, and using them are [[m8.eigenvalues-and-eigenvectors]] and [[m8.diagonalisation]]. The general theory of one map with many matrices is [[m6.matrix-of-a-linear-map-and-similarity]]. And you saw that Taylor expansion was a change of basis all along, and that the hidden vectors of a network come with no preferred basis.

        One observation from today has not been explained. Some numbers attached to a matrix did not change when the basis did. The rank was one, for a clear reason. The sum of the diagonal was another. And a third appeared without comment: for the mixing matrix, $2 \times 2 - 1 \times 1 = 3$, and for its diagonal form, $3 \times 1 = 3$. That is $ad - bc$ again, the number that decided whether a $2 \times 2$ matrix could be inverted. It evidently belongs to the map and not to the table. What is it measuring? The shear leaned the unit square over and kept its area. The stretch doubled it. The map that crushed the plane sent it to zero. One signed number records what a map does to area, and to volume in higher dimensions, and it is zero exactly when the map cannot be undone. It closes this cluster, and it is the next lesson, [[m5.determinant]].
