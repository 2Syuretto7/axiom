    - question:
        id: work-pivoting
        type: choice
        system: s2
        prompt: |
          A system has rows $(0.0001, 1 \mid 1)$ and $(1, 1 \mid 2)$. Its solution is close to $x = 1$, $y = 1$. Why does a careful solver exchange the rows before eliminating?
        options:
          - "Because 0.0001 counts as zero."
          - "With 0.0001 as pivot the multiplier is 10000, and the second row becomes about $(0, -9999 \\mid -9998)$. The original entries 1 and 2 are swamped, and with rounded arithmetic the digits that distinguished them are lost. With 1 as pivot the multiplier is 0.0001 and nothing is swamped."
          - "Because rows should be in decreasing order."
          - "It makes no difference. The answer is the same in any arithmetic."
        answer: 1
        explanation: |
          In exact arithmetic the order would not matter. A computer keeps a fixed number of significant digits. Subtracting 10000 times row 1 from row 2 gives entries of size ten thousand in which the original 1 and 2 survive only in the last digits, and those are the first to be rounded away. Back-substitution then divides by the tiny pivot and magnifies the damage. Exchanging first makes every multiplier at most 1 in size, so no row is ever swamped by another. The rule of taking the largest available entry as pivot costs one scan down a column and removes the commonest cause of inaccurate solutions.
        hints:
          - What is the multiplier if 0.0001 is the pivot?
          - What happens to the entries 1 and 2 of the second row when ten thousand times something is subtracted?
          - How large is the multiplier if the rows are exchanged first?
  connections:
    - text: |
        Three orders at a café gave three equations, and guessing went nowhere, because every price appeared in every order. Elimination untangled them: use the first equation to clear the first unknown from those below, then the second to clear the second, until the equations form a triangle, and then recover the unknowns from the bottom upwards. Each step is reversible, so nothing true is lost and nothing false is admitted. For $n$ unknowns it costs about $\frac{n^3}{3}$ multiplications.

        The method also reports. A row reading $0 = c$ with $c \ne 0$ says there is no solution. A column with no pivot says an unknown is free, and the solutions form a line or more. A pivot in every column of a square matrix says there is exactly one solution for every right-hand side, and the same row operations applied to the identity produce the inverse of [[m5.identity-and-inverse]]. Two debts were paid along the way: a square matrix with independent columns is invertible, and more than $n$ vectors in $\mathbb{R}^n$ are always dependent, as [[m4.linear-independence]] had asked you to accept.

        Look at what carried those proofs. Not the particular numbers, but a **count**: how many pivots there were, against how many rows and how many columns. That count deserves a name. It turns out not to depend on the order in which you eliminate, or on which rows you exchange. It equals the number of independent columns, and, less obviously, the number of independent rows. It says how many dimensions the matrix's outputs really fill, how much a layer can pass on, and how far a table of data can be compressed. The solutions left free by the missing pivots, and the right-hand sides that can be reached, become [[m5.column-space-and-null-space]] and then [[m5.basis-and-dimension]]. The product of the pivots, with a sign for the row exchanges, will be [[m5.determinant]].

        The count comes first. It is called the rank, and it is the next lesson, [[m5.rank]].
