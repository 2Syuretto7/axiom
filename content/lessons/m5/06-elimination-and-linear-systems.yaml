        id: work-outcome
        type: choice
        system: s2
        prompt: |
          Elimination on a system of three equations in three unknowns ends with rows $(1, 2, 1 \mid 4)$, $(0, 0, 3 \mid 6)$ and $(0, 0, 0 \mid 0)$. What are the solutions?
        options:
          - "Exactly one: $x = 0$, $y = 1$, $z = 2$."
          - "Infinitely many: $z = 2$, $y$ is free, and $x = 2 - 2y$."
          - "None, because of the row of zeros."
          - "None, because the second column has no pivot."
        answer: 1
        explanation: |
          The pivots are the 1 in column 1 and the 3 in column 3. Column 2 has none, so $y$ is a free variable. The last row is $0 = 0$, which is no contradiction. From the second row $3z = 6$, so $z = 2$. From the first, $x + 2y + 2 = 4$, so $x = 2 - 2y$. With $y = t$ the solutions are $(2 - 2t,\; t,\; 2)$, a line in space: the point $(2, 0, 2)$ plus any multiple of $(-2, 1, 0)$. That direction is a vector the matrix sends to zero. A row of zeros with a zero right-hand side is harmless. Only a row of zeros with a non-zero right-hand side rules out solutions.
