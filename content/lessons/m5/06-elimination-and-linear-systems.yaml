    - question:
        id: work-cost
        type: choice
        system: s2
        prompt: |
          A system with 3000 unknowns takes 9 seconds to solve by elimination. About how long will one with 6000 unknowns take, and how does solving it compare with computing the inverse?
        options:
          - "About 18 seconds. Computing the inverse costs the same as one solve."
          - "About 72 seconds. Computing the inverse costs about three times as much as one solve, and gives the answer less accurately."
          - "About 36 seconds. Computing the inverse is cheaper."
          - "About 72 seconds. Computing the inverse is cheaper, since it is a formula."
        answer: 1
        explanation: |
          The cost grows as $n^3$, so doubling $n$ multiplies the time by 8: 72 seconds. One solve costs about $\frac{n^3}{3}$ multiplications. The inverse needs the solutions for $n$ right-hand sides, the columns of the identity, and done carefully that comes to about $n^3$, three times as much, after which a further matrix-vector product is still needed to get $\mathbf{x}$. Every extra operation is another chance for rounding error to grow. The cubic growth is also why very large systems, with millions of unknowns, are not solved by elimination at all but by methods that improve a guess step by step.
        hints:
          - What happens to n cubed when n doubles?
          - How many right-hand sides does an inverse amount to?
          - More arithmetic means more rounding.
    - question:
        id: work-wide
        type: choice
        system: s2
        prompt: |
          Five vectors in $\mathbb{R}^3$ are written as the columns of a $3 \times 5$ matrix $A$, and elimination is run on $A\mathbf{c} = \mathbf{0}$. Which argument shows that the vectors are dependent?
        options:
          - "Five is an odd number."
          - "There are at most 3 pivots, one to a row, so at least 2 columns have none. Each gives a free variable, so there is a solution $\\mathbf{c} \\ne \\mathbf{0}$, which is a dependency among the columns."
