        explanation: |
          Two pivots cannot share a row, and there are 3 rows, so at most 3 of the 5 columns have pivots. A column without a pivot is a free variable, which can be set to 1, and back-substitution then determines the pivot variables, giving a solution that is not the zero vector. $A\mathbf{c} = \mathbf{0}$ with $\mathbf{c} \ne \mathbf{0}$ is exactly a dependency among the columns. No contradiction row can appear, because the right-hand side starts as zero and row operations keep it zero. This is the fact you used, before it was proved, to conclude that a model with more weights than examples never has uniquely determined weights.
