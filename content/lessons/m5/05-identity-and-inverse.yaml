          assert decode([[1, 0], [1, 1]], [2, 3]) == [2, 1], "Rows [1, 0] and [1, 1] turn [2, 1] into [2, 3]"
          assert decode([[0, -1], [1, 0]], [-1, 1]) == [1, 1], "The quarter turn sends [1, 1] to [-1, 1]"
          assert decode([[1, 2], [3, 4]], [5, 11]) == [1, 2], "Rows [1, 2] and [3, 4] turn [1, 2] into [5, 11]"
          assert decode([[2, 0], [0, 4]], [6, 4]) == [3, 1], "A diagonal matrix is undone by dividing each component"
          assert output.strip() == "[3.0, 4.0]", "The program should print [3.0, 4.0]"
