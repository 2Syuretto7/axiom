        solution: |
          def decode(A, code):
              a, b = A[0]
              c, d = A[1]
              det = a * d - b * c
              inverse = [[d / det, -b / det], [-c / det, a / det]]
              return [sum([p * q for p, q in zip(row, code)]) for row in inverse]

          print(decode([[3, 1], [5, 2]], [13, 23]))
        tests: |
          assert decode([[3, 1], [5, 2]], [13, 23]) == [3, 4], "Rows [3, 1] and [5, 2] scramble [3, 4] into [13, 23]"
          assert decode([[2, 1], [1, 1]], [10, 7]) == [3, 4], "The good scrambler turns [3, 4] into [10, 7]"
          assert decode([[2, 1], [1, 1]], [10, 5]) == [5, 0], "The good scrambler turns [5, 0] into [10, 5]"
