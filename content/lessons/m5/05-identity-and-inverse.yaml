          - |
            def decode(A, code):
                a, b = A[0]
                c, d = A[1]
                det = a * d - b * c
                inverse = [[d / det, -c / det], [-b / det, a / det]]
                return [sum([p * q for p, q in zip(row, code)]) for row in inverse]

            print([3.0, 4.0])
