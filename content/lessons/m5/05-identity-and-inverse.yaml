          The starter built the inverse with $-c$ in the top right and $-b$ in the bottom left: the two off-diagonal entries had been exchanged as well as negated. In the formula only the **diagonal** entries change places. The other two stay where they are and change sign. What the starter computed was the transpose of the inverse, which happens to be the inverse whenever the matrix is symmetric. That is why the good scrambler of the puzzle, with rows $(2, 1)$ and $(1, 1)$, would never have exposed the fault, and a matrix with different off-diagonal entries does at once. A dependable habit: after writing an inverse, multiply it by the original and look for the identity.
