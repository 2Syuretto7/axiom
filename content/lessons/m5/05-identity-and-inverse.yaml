    - question:
        id: work-nearly
        type: numeric
        system: s2
        prompt: |
          $A$ has rows $(1, 1)$ and $(1, 1.01)$. What is the entry of $A^{-1}$ in row 1, column 1?
        answer: "101"
        explanation: |
          $ad - bc = 1.01 - 1 = 0.01$. The top-left entry of the inverse is $d$ divided by that, $1.01 / 0.01$. The full inverse has rows $(101, -100)$ and $(-100, 100)$. The matrix has entries of about 1, and its inverse has entries of about 100, of opposite signs. Scramble the message $(1, 1)$ and you get $(2, 2.01)$. Change the second number to $2.02$, a difference of one part in two hundred, and the recovered message becomes $(0, 2)$. The columns of $A$ are nearly parallel, the plane is nearly crushed, and undoing a near-crush magnifies every small error.
        hints:
          - Compute ad − bc first.
          - The top-left entry of the inverse is d divided by that.
          - Dividing by a hundredth multiplies by a hundred.
    - question:
        id: work-order
        type: choice
        system: s2
        prompt: |
          A message is scrambled twice: first by $B$, then by $A$, so the result is $AB\mathbf{x}$. Both matrices are invertible. How is the message recovered?
        options:
          - "Apply $B^{-1}$ and then $A^{-1}$, which is the matrix $A^{-1}B^{-1}$."
          - "Apply $A^{-1}$ and then $B^{-1}$, which is the matrix $B^{-1}A^{-1}$."
          - "Apply $A^{-1}$ twice."
          - "It cannot be recovered, since products of invertible matrices need not be invertible."
        answer: 1
        explanation: |
          The last scrambler applied was $A$, so it is the first to be undone: $A^{-1}(AB\mathbf{x}) = B\mathbf{x}$, and then $B^{-1}(B\mathbf{x}) = \mathbf{x}$. As a single matrix, "first $A^{-1}$, then $B^{-1}$" is written $B^{-1}A^{-1}$, with the first to act on the right. In the other order, $B^{-1}$ would be applied to something scrambled by $A$ on the outside, and since matrices do not commute it would not meet the $B$ it was meant to cancel. A product of invertible matrices is always invertible, and this formula is its inverse.
        hints:
          - Which scrambler acted last?
          - The last one on is the first one off.
          - In a product, the matrix that acts first is written on the right.
    - question:
        id: work-wide
        type: choice
        system: s2
        prompt: |
          A layer multiplies by a matrix $W$ of shape $2 \times 3$: three numbers in, two out. Can its input always be recovered from its output?
        options:
          - "Yes, by $W^{\\mathsf{T}}$, which is $3 \\times 2$."
          - "No. The three columns of $W$ are vectors in the plane, and more than two vectors in the plane are always dependent, so $W\\mathbf{c} = \\mathbf{0}$ for some $\\mathbf{c} \\ne \\mathbf{0}$ and different inputs collide."
          - "Yes, whenever no entry of $W$ is 0."
          - "No, because only symmetric matrices have inverses."
        answer: 1
        explanation: |
          Each column of $W$ has two components. You know that any list of more than $n$ vectors in $\mathbb{R}^n$ is dependent, so the three columns satisfy $c_1\mathbf{w}_1 + c_2\mathbf{w}_2 + c_3\mathbf{w}_3 = \mathbf{0}$ with coefficients not all zero. That is $W\mathbf{c} = \mathbf{0}$, and then $\mathbf{x}$ and $\mathbf{x} + \mathbf{c}$ have the same output. A map from more dimensions to fewer must lose information, whatever its entries. The transpose has the right shape to go back, and carries blame back, but it does not recover the input. Layers that narrow, from many numbers to few, throw information away on purpose. Choosing what to throw away is much of what a model learns.
        hints:
          - In what space do the columns of W live?
          - How many independent vectors can that space hold?
          - What does a dependency among the columns say about W times some vector?
    - question:
        id: work-orthogonal
        type: choice
        system: s2
        prompt: |
          $Q$ has columns $(0.6, 0.8)$ and $(-0.8, 0.6)$. What is the quickest correct way to find $Q^{-1}$?
        options:
          - "Use the $2 \\times 2$ formula. Nothing quicker is possible."
          - "Take the transpose. The columns are perpendicular unit vectors, so $Q^{\\mathsf{T}}Q = I$, and the inverse has rows $(0.6, 0.8)$ and $(-0.8, 0.6)$."
          - "Take the reciprocal of every entry."
          - "It has no inverse."
        answer: 1
        explanation: |
          The entries of $Q^{\mathsf{T}}Q$ are the dot products between the columns of $Q$. Each column has squared length $0.36 + 0.64 = 1$, and their dot product is $-0.48 + 0.48 = 0$. So $Q^{\mathsf{T}}Q = I$, and for a square matrix that makes $Q^{\mathsf{T}}$ the inverse. Its rows are the columns of $Q$. The formula agrees, with $ad - bc = 0.36 + 0.64 = 1$, but nothing needed computing. Matrices with perpendicular unit columns are the best-behaved of all: they preserve lengths, they are inverted by transposing, and inverting them magnifies no errors. A good deal of numerical work consists of arranging to meet only such matrices.
        hints:
          - Compute the dot products between the columns.
          - What does that say about the transpose of Q times Q?
          - For a square matrix, one product equal to the identity is enough.
  connections:
    - text: |
        Two scramblers were offered. One could be unscrambled, by a matrix found from a short formula. The other could not be unscrambled by anything, because it sent two different messages to the same place. The difference was visible in the columns: independent for the first, parallel for the second, so that some non-zero vector was sent to zero and could be added to any message unnoticed.

        The identity matrix does nothing, and the inverse of $A$ is the matrix whose product with $A$ is the identity. There is at most one. For a $2 \times 2$ matrix it exists exactly when $ad - bc \ne 0$, the old test for two independent vectors in the plane from [[m4.linear-independence]]. The inverse of a product reverses the order, as the transpose of a product did in [[m5.transpose]], and for matrices whose columns are perpendicular unit vectors the inverse **is** the transpose.

        Three things were left as promises. That a square matrix with independent columns always has an inverse, in every size. That for square matrices $BA = I$ forces $AB = I$. And that a number like $ad - bc$ exists for larger matrices too. The third is [[m5.determinant]]. The first two wait on a way of counting the independent directions a matrix has, in [[m5.rank]]. And once you can invert, you can translate between descriptions of the same vector in different coordinates, in [[m5.change-of-basis]].

        All three depend on one missing tool. For two equations in two unknowns you solved by hand, multiplying one equation and subtracting it from the other, as you have since simultaneous equations first appeared. For three unknowns the same moves work, if you are organised. For a hundred they must be a procedure: an algorithm with a fixed order of steps, a cost you can state, and a clear report when no solution exists or when there are too many. That procedure solves $A\mathbf{x} = \mathbf{b}$ without ever forming $A^{-1}$, finds $A^{-1}$ when it is wanted, and exposes every dependency among the columns. It is the oldest algorithm in the subject and still the one that runs. That is the next lesson, [[m5.elimination-and-linear-systems]].
