    - question:
        id: predict-ratio
        type: predict
        system: s1
        prompt: The Cauchy-Schwarz ratio for three pairs. What does this show?
        code: |
          import numpy as np


          def ratio(u, v):
              return round(abs(float(u @ v)) / float(np.linalg.norm(u) * np.linalg.norm(v)), 4)


          u = np.array([3.0, 4.0])
          print(ratio(u, np.array([4.0, -3.0])), ratio(u, np.array([1.0, 0.0])), ratio(u, np.array([-6.0, -8.0])))
        output: |
          0.0 0.6 1.0
        explanation: Orthogonal vectors give 0. A general pair gives something strictly between 0 and 1. The last pair is parallel, pointing opposite ways, and reaches 1, the equality case.
    - question:
        id: predict-parallelogram
        type: predict
        system: s1
        prompt: Both sides of the parallelogram law for two norms. What does this show?
        code: |
          import numpy as np

          u = np.array([1.0, 0.0])
          v = np.array([0.0, 1.0])
          two = lambda x: float(np.sqrt((x * x).sum()))
          one = lambda x: float(np.abs(x).sum())
          for norm in (two, one):
              left = norm(u + v) ** 2 + norm(u - v) ** 2
              right = 2 * norm(u) ** 2 + 2 * norm(v) ** 2
              print(round(left, 4), round(right, 4))
        output: |
          4.0 4.0
          8.0 4.0
        explanation: The usual length satisfies the law. The sum of absolute values does not, so no inner product produces it.
  work:
    - text: Slower now. Each task uses the inequality or its equality case.
    - question:
        id: write-correlation
        type: code
        mode: write
        system: s2
        prompt: |
          Write `correlation(x, y)` for two arrays of the same length: subtract from each its mean, and return the inner product of the centred arrays divided by the product of their norms. Return 0.0 if either centred array has norm zero.
        starter: |
          import numpy as np


          def correlation(x, y):
              return 0.0


          x = np.array([1.0, 2.0, 3.0, 4.0])
          print(round(correlation(x, np.array([2.0, 4.0, 6.0, 9.0])), 4))
          print(round(correlation(x, 10.0 - 3.0 * x), 4))
        solution: |
          import numpy as np


          def correlation(x, y):
              a = x - x.mean()
              b = y - y.mean()
              size = float(np.linalg.norm(a) * np.linalg.norm(b))
              if size == 0.0:
                  return 0.0
              return float(a @ b) / size


          x = np.array([1.0, 2.0, 3.0, 4.0])
          print(round(correlation(x, np.array([2.0, 4.0, 6.0, 9.0])), 4))
          print(round(correlation(x, 10.0 - 3.0 * x), 4))
        tests: |
          import numpy as _np
          _x = _np.array([1.0, 2.0, 3.0, 4.0])
          assert abs(correlation(_x, 5.0 + 2.0 * _x) - 1.0) < 1e-9, "y = 5 + 2x is an increasing straight-line function of x, so the correlation is 1. Subtract the means first"
          assert abs(correlation(_x, 10.0 - 3.0 * _x) + 1.0) < 1e-9, "y = 10 - 3x is a decreasing straight-line function of x, so the correlation is -1"
          assert abs(correlation(_x, _np.array([2.0, 4.0, 6.0, 9.0])) - 0.9943767126843688) < 1e-9, "For x = 1, 2, 3, 4 and y = 2, 4, 6, 9 the correlation is about 0.9944"
          assert abs(correlation(_np.array([1.0, -1.0, 1.0, -1.0]), _np.array([1.0, 1.0, -1.0, -1.0]))) < 1e-9, "These centred vectors are orthogonal, so the correlation is 0"
          assert correlation(_x, _np.array([7.0, 7.0, 7.0, 7.0])) == 0.0, "A constant array has centred norm zero, and the function should return 0.0"
          _r = _np.random.default_rng(0)
          assert all(abs(correlation(_r.normal(size=6), _r.normal(size=6))) <= 1.0 + 1e-12 for _ in range(200)), "By Cauchy-Schwarz a correlation is never outside [-1, 1]"
          assert abs(correlation(_x + 100.0, 3.0 * _np.array([2.0, 4.0, 6.0, 9.0])) - 0.9943767126843688) < 1e-9, "Shifting x and rescaling y by a positive number should not change the correlation"
          assert output.strip() == "0.9944\n-1.0", "The program should print 0.9944 and then -1.0"
        wrong:
          - |
            import numpy as np


            def correlation(x, y):
                size = float(np.linalg.norm(x) * np.linalg.norm(y))
                if size == 0.0:
                    return 0.0
                return float(x @ y) / size


            print("0.9944\n-1.0")
          - |
            import numpy as np


            def correlation(x, y):
                a = x - x.mean()
                b = y - y.mean()
                size = float(np.linalg.norm(a) * np.linalg.norm(b))
                if size == 0.0:
                    return 0.0
                return abs(float(a @ b)) / size


            print("0.9944\n-1.0")
          - |
            import numpy as np


            def correlation(x, y):
                a = x - x.mean()
                b = y - y.mean()
                size = float(np.linalg.norm(a) + np.linalg.norm(b))
                if size == 0.0:
                    return 0.0
                return float(a @ b) / size


            print("0.9944\n-1.0")
          - |
            import numpy as np


            def correlation(x, y):
                a = x - x.mean()
                b = y - y.mean()
                return float(a @ b) / len(x)


            print("0.9944\n-1.0")
        explanation: |
          Centring turns each list of data into a vector orthogonal to the vector of ones, and the correlation is the cosine of the angle between the two centred vectors. Cauchy-Schwarz confines it to $[-1, 1]$, and the equality case says when the ends are reached: the centred vectors are parallel, which means $y$ is exactly a straight-line function of $x$.

          Skipping the centring gives cosine similarity of the raw data, which is a different and also useful quantity. The last wrong version is the covariance. It has the right sign but no fixed scale, and dividing by the two norms is what makes correlations comparable between pairs of quantities measured in different units.
    - question:
        id: write-polarise
        type: code
        mode: write
        system: s2
        prompt: |
          `norm` is a function that takes an array and returns a number. Write `defect(norm, u, v)`: the left side of the parallelogram law minus the right side,

          $$\|\mathbf{u} + \mathbf{v}\|^2 + \|\mathbf{u} - \mathbf{v}\|^2 - 2\|\mathbf{u}\|^2 - 2\|\mathbf{v}\|^2.$$

          Then write `recover(norm, u, v)`: the inner product of `u` and `v` rebuilt from the norm by polarisation, $\tfrac14(\|\mathbf{u} + \mathbf{v}\|^2 - \|\mathbf{u} - \mathbf{v}\|^2)$.
        starter: |
          import numpy as np


          def defect(norm, u, v):
              return 0.0


          def recover(norm, u, v):
              return 0.0


          weighted = lambda x: float(np.sqrt(x[0] ** 2 + 4.0 * x[1] ** 2))
          one = lambda x: float(np.abs(x).sum())
          u = np.array([1.0, 2.0])
          v = np.array([3.0, 1.0])
          print(round(defect(weighted, u, v), 4) + 0.0, round(recover(weighted, u, v), 4))
          print(round(defect(one, u, v), 4))
        solution: |
          import numpy as np


          def defect(norm, u, v):
              return norm(u + v) ** 2 + norm(u - v) ** 2 - 2 * norm(u) ** 2 - 2 * norm(v) ** 2


          def recover(norm, u, v):
              return (norm(u + v) ** 2 - norm(u - v) ** 2) / 4


          weighted = lambda x: float(np.sqrt(x[0] ** 2 + 4.0 * x[1] ** 2))
          one = lambda x: float(np.abs(x).sum())
          u = np.array([1.0, 2.0])
          v = np.array([3.0, 1.0])
          print(round(defect(weighted, u, v), 4) + 0.0, round(recover(weighted, u, v), 4))
          print(round(defect(one, u, v), 4))
        tests: |
          import numpy as _np
          _two = lambda x: float(_np.sqrt((x * x).sum()))
          _one = lambda x: float(_np.abs(x).sum())
          _w = lambda x: float(_np.sqrt(x[0] ** 2 + 4.0 * x[1] ** 2))
          _u = _np.array([1.0, 2.0]); _v = _np.array([3.0, 1.0])
          assert abs(defect(_two, _u, _v)) < 1e-9, "The usual length satisfies the parallelogram law, so the defect is 0"
          assert abs(defect(_w, _u, _v)) < 1e-9, "The weighted norm comes from an inner product, so its defect is 0"
