    - question:
        id: fix-parallel
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `parallel(u, v)` uses the equality case of Cauchy-Schwarz to decide whether two nonzero vectors are linearly dependent. It should say `True` for $(1, 2)$ and $(-2, -4)$. It says `False`. Fix it.
        starter: |
          import numpy as np


          def parallel(u, v):
              size = float(np.linalg.norm(u) * np.linalg.norm(v))
              return abs(float(u @ v) - size) <= 1e-9 * size


          u = np.array([1.0, 2.0])
          print(parallel(u, np.array([3.0, 6.0])), parallel(u, np.array([-2.0, -4.0])), parallel(u, np.array([2.0, 1.0])))
        solution: |
          import numpy as np


          def parallel(u, v):
              size = float(np.linalg.norm(u) * np.linalg.norm(v))
              return abs(abs(float(u @ v)) - size) <= 1e-9 * size


          u = np.array([1.0, 2.0])
          print(parallel(u, np.array([3.0, 6.0])), parallel(u, np.array([-2.0, -4.0])), parallel(u, np.array([2.0, 1.0])))
        tests: |
          import numpy as _np
          _u = _np.array([1.0, 2.0])
          assert parallel(_u, _np.array([3.0, 6.0])) is True, "(3, 6) is 3 times (1, 2)"
          assert parallel(_u, _np.array([-2.0, -4.0])) is True, "(-2, -4) is -2 times (1, 2). Equality in Cauchy-Schwarz is about the absolute value of the inner product"
          assert parallel(_u, _np.array([2.0, 1.0])) is False, "(2, 1) is not a multiple of (1, 2)"
          assert parallel(_u, _np.array([-2.0, 1.0])) is False, "Orthogonal vectors are not parallel"
          assert parallel(_np.array([1.0, 0.0, -1.0]), _np.array([-0.5, 0.0, 0.5])) is True, "(-0.5, 0, 0.5) is -0.5 times (1, 0, -1)"
          assert parallel(_np.array([1.0, 1.0, 0.0]), _np.array([1.0, 1.0, 0.1])) is False, "These vectors are close to parallel but not parallel"
          assert output.strip() == "True True False", "The program should print True True False"
        wrong:
          - |
            import numpy as np


            def parallel(u, v):
                size = float(np.linalg.norm(u) * np.linalg.norm(v))
                return abs(float(u @ v) - size) <= 1e-9 * size


            print("True True False")
          - |
            import numpy as np


            def parallel(u, v):
                return abs(float(u @ v)) <= float(np.linalg.norm(u) * np.linalg.norm(v)) + 1e-9


            print("True True False")
          - |
            import numpy as np


            def parallel(u, v):
                size = float(np.linalg.norm(u) + np.linalg.norm(v))
                return abs(abs(float(u @ v)) - size) <= 1e-9 * size


            print("True True False")
          - |
            import numpy as np


            def parallel(u, v):
                size = float(np.linalg.norm(u) + np.linalg.norm(v))
                return abs(float(np.linalg.norm(u + v)) - size) <= 1e-9 * size


            print("True True False")
        explanation: |
          The theorem is about $|\langle \mathbf{u}, \mathbf{v} \rangle|$. Without the absolute value the test detects only vectors that point the same way, where the inner product equals $+\|\mathbf{u}\|\|\mathbf{v}\|$. Vectors that point opposite ways give $-\|\mathbf{u}\|\|\mathbf{v}\|$ and are just as dependent.

          The second wrong version checks the inequality instead of the equality, and the inequality is true for every pair. The last one uses equality in the triangle inequality, which again holds only for vectors pointing the same way. The comparison allows a tiny relative tolerance because rounding can leave the two sides a hair apart even for exactly parallel vectors.
    - question:
        id: work-integral
        type: choice
        system: s2
        prompt: |
          $f$ is continuous on $[0, 1]$ with $\int_0^1 f(x)^2\,dx = 9$. What can be said about $\int_0^1 f(x)\,dx$?
        options:
          - 'Nothing. The integral can be arbitrarily large.'
          - 'It lies between $-3$ and $3$. Apply Cauchy-Schwarz to $f$ and the constant function 1: $\left|\int f \cdot 1\right| \le \sqrt{\int f^2}\sqrt{\int 1^2} = 3 \cdot 1$.'
          - 'It equals 3.'
          - 'It lies between 0 and 9.'
        answer: 1
        explanation: |
          With $\langle f, g \rangle = \int_0^1 fg$, the integral of $f$ is $\langle f, 1 \rangle$, the norm of $f$ is 3 and the norm of the constant 1 is 1. Equality holds when $f$ is a multiple of 1, that is $f = 3$ or $f = -3$ throughout. This is the functional version of "the square of the mean is at most the mean of the squares", and it is how a bound on a mean squared error becomes a bound on a mean error.
    - question:
        id: work-triangle-data
        type: numeric
        system: s2
        prompt: |
          A model's prediction $\mathbf{p}$ is at distance 2 from the noisy labels $\mathbf{y}$, and the noisy labels are at distance 0.5 from the true values $\mathbf{t}$. What is the largest possible distance from $\mathbf{p}$ to $\mathbf{t}$?
        answer: "2.5"
        explanation: |
          $\|\mathbf{p} - \mathbf{t}\| = \|(\mathbf{p} - \mathbf{y}) + (\mathbf{y} - \mathbf{t})\| \le 2 + 0.5$. The reverse form gives a floor as well: the distance is at least $2 - 0.5 = 1.5$. Inserting an intermediate point and bounding each leg separately is the standard move in error analysis. Total error at most approximation error plus estimation error is a triangle inequality.
    - question:
        id: work-which-norm
        type: choice
        system: s2
        prompt: |
          For the max-norm $\|\mathbf{x}\|_\infty = \max_k |x_k|$ on the plane, take $\mathbf{u} = (1, 0)$ and $\mathbf{v} = (0, 1)$. What does the parallelogram law show?
        options:
          - 'Left side $1 + 1 = 2$, right side $2 + 2 = 4$. The law fails, so the max-norm comes from no inner product.'
          - 'Both sides are 4, so the max-norm comes from an inner product.'
          - 'The max-norm is not a norm.'
          - 'Left side 8, right side 4.'
        answer: 0
        explanation: |
          $\mathbf{u} + \mathbf{v} = (1, 1)$ and $\mathbf{u} - \mathbf{v} = (1, -1)$ both have max-norm 1, so the left side is 2, and each of $\mathbf{u}, \mathbf{v}$ has max-norm 1, so the right side is 4. One failing pair is enough. The 1-norm failed on the same pair in the other direction, with 8 against 4. Among the $p$-norms only $p = 2$ passes. That is why least **squares** has projections, normal equations and a closed form, while least absolute deviations and minimax fitting do not: they live in geometries without right angles.
  connections:
    - text: |
        A thousand random pairs never pushed the ratio past 1 because the projection of $\mathbf{u}$ onto $\mathbf{v}$ is one leg of a right triangle whose hypotenuse is $\mathbf{u}$. That is the **Cauchy-Schwarz inequality**, $|\langle \mathbf{u}, \mathbf{v} \rangle| \le \|\mathbf{u}\|\|\mathbf{v}\|$, with equality exactly for dependent vectors. It holds in every inner product space, and it is what makes angles and correlations meaningful there.

        The **triangle inequality** follows, so the length that an inner product defines is a **norm**. Not every norm arises so: the **parallelogram law** is the test, and the 1-norm and the max-norm fail it. A norm that passes determines its inner product by polarisation.

        Inner products measure vectors. The cluster began with maps, and the two have not yet met. Given a linear map on an inner product space, one can ask what it does to lengths and angles, and which map undoes its effect inside an inner product. The answer gives the transpose its final meaning, and singles out the maps that preserve all the geometry: [[m6.adjoints-orthogonal-and-unitary-maps]].
