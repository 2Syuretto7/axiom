concept: m6.cauchy-schwarz-and-the-triangle-inequality
minutes: 80
claim: You can state the Cauchy-Schwarz inequality for any inner product, prove it by projecting one vector onto the other, say exactly when equality holds, derive the triangle inequality from it, read off concrete inequalities for sums, integrals and correlations, and use the parallelogram law to tell whether a given norm comes from an inner product.
recalls: [m6.inner-product-spaces]
uses: [m6.dual-spaces-and-the-transpose, m6.fields-and-the-vector-space-axioms, m4.dot-product, m4.norms-and-distance, m4.angle-and-cosine-similarity, m4.projection-onto-a-vector, m7.orthonormal-bases, m3.reading-and-writing-epsilon-style-arguments, e5.linear-algebra-routines, e5.vectorisation, e5.axis-operations-and-reductions, e0.functions, e0.loops]
leads: [m6.adjoints-orthogonal-and-unitary-maps, m8.operator-and-frobenius-norms]
starter: |
  # Scratch space. A thousand random pairs of vectors. For each pair, the
  # size of the dot product divided by the product of the lengths.
  # How large does that ratio ever get?
  import numpy as np

  rng = np.random.default_rng(0)
  largest = 0.0
  for _ in range(1000):
      u = rng.normal(size=5)
      v = rng.normal(size=5)
      largest = max(largest, abs(float(u @ v)) / float(np.linalg.norm(u) * np.linalg.norm(v)))
  print(round(largest, 4))
parts:
  recall:
    - text: |
        [[m6.inner-product-spaces]] rebuilt length and perpendicularity from three axioms, and left one debt: the angle between two vectors needs a fraction to stay between $-1$ and $1$, and nothing proved so far says it does. Today pays that debt. Three quick pulls first.
  puzzle:
    - text: |
        The starter draws a thousand random pairs of vectors and, for each pair, divides the size of the dot product by the product of the two lengths. It prints the largest ratio seen.

        ```
        0.9468
        ```

        Change the seed, the dimension, or the number of pairs, and the answer moves about, but it never passes 1. Replace the dot product by a weighted one, or the vectors by polynomials with the integral inner product, and the same holds.

        A statistician knows this fact as "a correlation coefficient lies between $-1$ and $1$". A geometer knows it as "a cosine lies between $-1$ and $1$". Neither picture is available for polynomials or matrices, and yet the bound does not fail there either.

        **Why can an inner product never exceed the product of the lengths, in any inner product space whatever?**
  intuition:
    - text: |
        Take two vectors $\mathbf{u}$ and $\mathbf{v}$ and drop a perpendicular from $\mathbf{u}$ onto the line through $\mathbf{v}$. This splits $\mathbf{u}$ into two parts at right angles: its shadow along $\mathbf{v}$, and the remainder.

        By Pythagoras, the shadow cannot be longer than $\mathbf{u}$ itself. A leg of a right triangle is never longer than the hypotenuse.

        That one sentence is the whole proof. The length of the shadow is $\dfrac{|\langle \mathbf{u}, \mathbf{v} \rangle|}{\|\mathbf{v}\|}$. Saying that it is at most $\|\mathbf{u}\|$ gives

        $$|\langle \mathbf{u}, \mathbf{v} \rangle| \le \|\mathbf{u}\|\,\|\mathbf{v}\|,$$

        the **Cauchy-Schwarz inequality**. The shadow is as long as $\mathbf{u}$ only when there is no remainder, which is when $\mathbf{u}$ lies along $\mathbf{v}$.

        Projection and Pythagoras were both derived last lesson from the axioms alone. So the inequality holds wherever the axioms do, with no picture needed. One consequence is that the direct route is the shortest, $\|\mathbf{u} + \mathbf{v}\| \le \|\mathbf{u}\| + \|\mathbf{v}\|$, which is what entitles $\|\cdot\|$ to be called a length.
  derivation:
    - text: |
        **Theorem (Cauchy-Schwarz).** In any inner product space,

        $$|\langle \mathbf{u}, \mathbf{v} \rangle| \le \|\mathbf{u}\|\,\|\mathbf{v}\|,$$

        with equality if and only if $\mathbf{u}$ and $\mathbf{v}$ are linearly dependent.

        *Proof (real case).* If $\mathbf{v} = \mathbf{0}$ both sides are 0. Otherwise let

        $$c = \frac{\langle \mathbf{u}, \mathbf{v} \rangle}{\langle \mathbf{v}, \mathbf{v} \rangle}, \qquad \mathbf{w} = \mathbf{u} - c\mathbf{v}.$$

        Then $\langle \mathbf{w}, \mathbf{v} \rangle = \langle \mathbf{u}, \mathbf{v} \rangle - c\langle \mathbf{v}, \mathbf{v} \rangle = 0$. So $\mathbf{u} = c\mathbf{v} + \mathbf{w}$ is a sum of two orthogonal vectors, and by Pythagoras

        $$\|\mathbf{u}\|^2 = c^2\|\mathbf{v}\|^2 + \|\mathbf{w}\|^2 \ge c^2\|\mathbf{v}\|^2 = \frac{\langle \mathbf{u}, \mathbf{v} \rangle^2}{\|\mathbf{v}\|^2}.$$

        Multiply by $\|\mathbf{v}\|^2$ and take square roots. Equality holds exactly when $\|\mathbf{w}\| = 0$, that is $\mathbf{u} = c\mathbf{v}$. $\blacksquare$

        The complex case is the same with $|c|^2$ and $|\langle \mathbf{u}, \mathbf{v} \rangle|^2$.

        **What it says in each space.**

        - *Lists of numbers:* $(a_1b_1 + \dots + a_nb_n)^2 \le (a_1^2 + \dots + a_n^2)(b_1^2 + \dots + b_n^2)$.
        - *Functions:* $\left(\int fg\right)^2 \le \int f^2 \int g^2$.
        - *Random quantities with mean zero:* $\mathbb{E}[XY]^2 \le \mathbb{E}[X^2]\,\mathbb{E}[Y^2]$. Dividing, the correlation lies in $[-1, 1]$, and it is $\pm1$ only when one quantity is a multiple of the other.
        - *Matrices:* $|\operatorname{tr}(A^\top B)| \le \|A\|_F\|B\|_F$.

        Four inequalities that look unrelated are one inequality in four spaces.

        **Angles.** Since $-1 \le \dfrac{\langle \mathbf{u}, \mathbf{v} \rangle}{\|\mathbf{u}\|\|\mathbf{v}\|} \le 1$ in a real inner product space, there is exactly one angle $\theta$ in $[0, \pi]$ with that cosine. Cosine similarity is defined in every inner product space.

        **A useful special case.** Take $\mathbf{v} = (1, 1, \dots, 1)$ in $\mathbb{R}^n$:

        $$(x_1 + \dots + x_n)^2 \le n\,(x_1^2 + \dots + x_n^2).$$

        Divide by $n^2$: the square of the mean is at most the mean of the squares. The gap between them is the variance, which is why a variance is never negative. Equality needs $\mathbf{x}$ parallel to the vector of ones, that is, all entries equal.
    - question:
        id: derivation-min
        type: numeric
        system: s2
        prompt: |
          Four real numbers add up to 10. What is the smallest possible value of the sum of their squares?
        answer: "25"
        explanation: |
          Cauchy-Schwarz with the vector of ones gives $10^2 \le 4\,(x_1^2 + \dots + x_4^2)$, so the sum of squares is at least 25. Equality holds when $\mathbf{x}$ is parallel to $(1, 1, 1, 1)$, that is all four numbers equal $2.5$, and then the sum of squares is $4 \times 6.25 = 25$. The inequality gave the bound, and its equality case said where the bound is reached. Spreading a fixed total evenly minimises the sum of squares, a fact behind weight decay preferring many small weights to a few large ones.
    - text: |
        **Theorem (triangle inequality).** $\|\mathbf{u} + \mathbf{v}\| \le \|\mathbf{u}\| + \|\mathbf{v}\|$.

        *Proof (real case).*

        $$\|\mathbf{u} + \mathbf{v}\|^2 = \|\mathbf{u}\|^2 + 2\langle \mathbf{u}, \mathbf{v} \rangle + \|\mathbf{v}\|^2 \le \|\mathbf{u}\|^2 + 2\|\mathbf{u}\|\|\mathbf{v}\| + \|\mathbf{v}\|^2 = (\|\mathbf{u}\| + \|\mathbf{v}\|)^2.$$

        The middle step is Cauchy-Schwarz. Take square roots. $\blacksquare$

        Equality needs $\langle \mathbf{u}, \mathbf{v} \rangle = \|\mathbf{u}\|\|\mathbf{v}\|$: the vectors point the same way.

        **Norms in general.** A **norm** on a vector space is any function $\|\cdot\|$ with

        1. $\|\mathbf{v}\| \ge 0$, and $\|\mathbf{v}\| = 0$ only for $\mathbf{v} = \mathbf{0}$,
        2. $\|c\mathbf{v}\| = |c|\,\|\mathbf{v}\|$,
        3. $\|\mathbf{u} + \mathbf{v}\| \le \|\mathbf{u}\| + \|\mathbf{v}\|$.

        Every inner product gives a norm: the first two properties are immediate and the third was just proved. A norm gives a distance $d(\mathbf{u}, \mathbf{v}) = \|\mathbf{u} - \mathbf{v}\|$, and the triangle inequality becomes $d(\mathbf{u}, \mathbf{w}) \le d(\mathbf{u}, \mathbf{v}) + d(\mathbf{v}, \mathbf{w})$. That is the property the epsilon arguments of analysis lean on at every step.

        **Not every norm comes from an inner product.** The sum of absolute values $\|\mathbf{x}\|_1$ and the largest absolute value $\|\mathbf{x}\|_\infty$ are norms. Is there some inner product behind them? Expand, for a norm that does come from an inner product:

        $$\|\mathbf{u} + \mathbf{v}\|^2 + \|\mathbf{u} - \mathbf{v}\|^2 = 2\|\mathbf{u}\|^2 + 2\|\mathbf{v}\|^2.$$

        The cross terms cancel. This is the **parallelogram law**: the squares of the two diagonals add up to the squares of the four sides. Test $\|\cdot\|_1$ with $\mathbf{u} = (1, 0)$ and $\mathbf{v} = (0, 1)$: the left side is $4 + 4 = 8$, the right side $2 + 2 = 4$. So no inner product gives the 1-norm, and there are no angles in that geometry.

        Subtracting instead of adding recovers the inner product from its norm:

        $$\langle \mathbf{u}, \mathbf{v} \rangle = \tfrac14\left(\|\mathbf{u} + \mathbf{v}\|^2 - \|\mathbf{u} - \mathbf{v}\|^2\right).$$
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the proof of the Cauchy-Schwarz inequality for a nonzero vector v.
        steps:
          - 'Let $c\mathbf{v}$ be the projection of $\mathbf{u}$ onto $\mathbf{v}$, with $c = \langle \mathbf{u}, \mathbf{v} \rangle / \langle \mathbf{v}, \mathbf{v} \rangle$.'
          - 'The remainder $\mathbf{w} = \mathbf{u} - c\mathbf{v}$ is orthogonal to $\mathbf{v}$.'
          - 'By Pythagoras, $\|\mathbf{u}\|^2 = c^2\|\mathbf{v}\|^2 + \|\mathbf{w}\|^2$.'
          - 'Drop $\|\mathbf{w}\|^2 \ge 0$ to get $\|\mathbf{u}\|^2 \ge \langle \mathbf{u}, \mathbf{v} \rangle^2 / \|\mathbf{v}\|^2$.'
          - 'Multiply by $\|\mathbf{v}\|^2$ and take square roots.'
        explanation: Split, apply Pythagoras, and throw away the remainder. Equality holds exactly when the remainder thrown away was zero.
  formal:
    - text: |
        Let $V$ be an inner product space over $\mathbb{R}$ or $\mathbb{C}$, with $\|\mathbf{v}\| = \sqrt{\langle \mathbf{v}, \mathbf{v} \rangle}$.

        **Cauchy-Schwarz.** $|\langle \mathbf{u}, \mathbf{v} \rangle| \le \|\mathbf{u}\|\|\mathbf{v}\|$ for all $\mathbf{u}, \mathbf{v}$, with equality if and only if $\mathbf{u}, \mathbf{v}$ are linearly dependent.

        **Triangle inequality.** $\|\mathbf{u} + \mathbf{v}\| \le \|\mathbf{u}\| + \|\mathbf{v}\|$, with equality if and only if one vector is a non-negative multiple of the other. Consequently $\big|\|\mathbf{u}\| - \|\mathbf{v}\|\big| \le \|\mathbf{u} - \mathbf{v}\|$.

        **Norm.** A function $\|\cdot\|: V \to \mathbb{R}$ that is positive definite, absolutely homogeneous and satisfies the triangle inequality. The norm of an inner product is a norm. Each norm defines a metric $d(\mathbf{u}, \mathbf{v}) = \|\mathbf{u} - \mathbf{v}\|$.

        **Angle.** In a real inner product space, for nonzero $\mathbf{u}, \mathbf{v}$, $\theta = \arccos\dfrac{\langle \mathbf{u}, \mathbf{v} \rangle}{\|\mathbf{u}\|\|\mathbf{v}\|} \in [0, \pi]$ is well defined.

        **Parallelogram law.** $\|\mathbf{u} + \mathbf{v}\|^2 + \|\mathbf{u} - \mathbf{v}\|^2 = 2\|\mathbf{u}\|^2 + 2\|\mathbf{v}\|^2$. A norm comes from an inner product if and only if it satisfies this law (Jordan and von Neumann).

        **Polarisation.** Over $\mathbb{R}$, $\langle \mathbf{u}, \mathbf{v} \rangle = \tfrac14(\|\mathbf{u} + \mathbf{v}\|^2 - \|\mathbf{u} - \mathbf{v}\|^2)$. So a linear map that preserves norms preserves inner products.

        **Bessel's inequality.** For orthonormal $\mathbf{e}_1, \dots, \mathbf{e}_k$, $\sum_i |\langle \mathbf{v}, \mathbf{e}_i \rangle|^2 \le \|\mathbf{v}\|^2$. Cauchy-Schwarz is the case $k = 1$.
