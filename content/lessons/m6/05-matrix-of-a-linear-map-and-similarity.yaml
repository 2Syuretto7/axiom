        explanation: |
          $P\mathbf{y}$ turns new coordinates into old ones, so going the other way is solving $P\mathbf{y} = \mathbf{v}$. The matrix in the new basis is $P^{-1}(AP)$, and `solve` with the matrix `A @ P` on the right computes it column by column.

          The third wrong version computes $PAP^{-1}$, the translations on the wrong sides. It is the matrix of some map in some basis, but not of this map in this basis. The fourth uses $P^\top$ where $P^{-1}$ belongs. Those agree only when the columns of $P$ are orthonormal, and here they are orthogonal but of length $\sqrt5$, so the result is the right matrix multiplied by 5. An orthonormal basis would have made the transpose correct, a convenience the last cluster dwelt on and the end of this one explains.
    - question:
        id: fix-order
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `power_in_basis(A, P, k)` is meant to compute the $k$th power of `A` cheaply when the columns of `P` are a basis in which the map is diagonal. It converts to that basis, raises the diagonal entries to the power `k`, and converts back. For the reflection of the puzzle and $k = 2$ the answer must be the identity, since reflecting twice does nothing. It prints something else. Fix it. One line needs to change.
        starter: |
          import numpy as np


          def power_in_basis(A, P, k):
              B = np.linalg.solve(P, A @ P)
              powered = np.diag(np.diag(B) ** k)
              return np.linalg.solve(P, powered @ P)


          A = np.array([[0.6, 0.8], [0.8, -0.6]])
          P = np.array([[2.0, -1.0], [1.0, 2.0]])
          print([[round(float(v), 4) + 0.0 for v in row] for row in power_in_basis(A, P, 3)])
        solution: |
          import numpy as np


          def power_in_basis(A, P, k):
              B = np.linalg.solve(P, A @ P)
              powered = np.diag(np.diag(B) ** k)
              return P @ powered @ np.linalg.inv(P)


          A = np.array([[0.6, 0.8], [0.8, -0.6]])
          P = np.array([[2.0, -1.0], [1.0, 2.0]])
          print([[round(float(v), 4) + 0.0 for v in row] for row in power_in_basis(A, P, 3)])
        tests: |
          import numpy as _np
          _A = _np.array([[0.6, 0.8], [0.8, -0.6]])
          _P = _np.array([[2.0, -1.0], [1.0, 2.0]])
          assert _np.allclose(power_in_basis(_A, _P, 1), _A), "The first power should be A itself: converting to the diagonal basis and back must undo each other"
          assert _np.allclose(power_in_basis(_A, _P, 2), _np.eye(2)), "Reflecting twice is the identity"
          assert _np.allclose(power_in_basis(_A, _P, 3), _A), "Reflecting three times is reflecting once"
          _M = _np.array([[2.0, 1.0], [1.0, 2.0]])
          _Q = _np.array([[1.0, 1.0], [1.0, -1.0]])
          assert _np.allclose(power_in_basis(_M, _Q, 3), _M @ _M @ _M), "For [[2, 1], [1, 2]], diagonal in the basis (1, 1), (1, -1), the cube should equal the product of three copies: [[14, 13], [13, 14]]"
          _S = _np.array([[4.0, -2.0], [1.0, 1.0]])
          _R = _np.array([[2.0, 1.0], [1.0, 1.0]])
          assert _np.allclose(power_in_basis(_S, _R, 4), _S @ _S @ _S @ _S), "For [[4, -2], [1, 1]], diagonal in the basis (2, 1), (1, 1), the fourth power should equal the product of four copies"
          assert output.strip() == "[[0.6, 0.8], [0.8, -0.6]]", "The program should print [[0.6, 0.8], [0.8, -0.6]]"
        wrong:
          - |
            import numpy as np


            def power_in_basis(A, P, k):
                B = np.linalg.solve(P, A @ P)
                powered = np.diag(np.diag(B) ** k)
                return np.linalg.solve(P, powered @ P)


            print("[[0.6, 0.8], [0.8, -0.6]]")
          - |
            import numpy as np


            def power_in_basis(A, P, k):
                B = np.linalg.solve(P, A @ P)
                powered = np.diag(np.diag(B) ** k)
                return powered


            print("[[0.6, 0.8], [0.8, -0.6]]")
          - |
            import numpy as np


            def power_in_basis(A, P, k):
                B = np.linalg.solve(P, A @ P)
                powered = np.diag(np.diag(B) ** k)
                return P @ powered @ P.T


            print("[[0.6, 0.8], [0.8, -0.6]]")
          - |
            import numpy as np


            def power_in_basis(A, P, k):
                B = np.linalg.solve(P, A @ P)
                powered = np.diag(np.diag(B) ** k)
                return P @ powered


            print("[[0.6, 0.8], [0.8, -0.6]]")
        explanation: |
          Going to the new basis is $B = P^{-1}AP$. Coming back is the reverse: $A = PBP^{-1}$. The function applied $P^{-1}(\,\cdot\,)P$ both times, which translates twice in the same direction and ends up in a third basis that nobody asked for.

          With the return corrected, the function shows why a good basis is worth finding. $A^k = (PBP^{-1})^k = PB^kP^{-1}$, because the inner $P^{-1}P$ pairs cancel, and a power of a diagonal matrix is the powers of its entries. A thousandth power costs the same as a square. Everything depends on having a basis in which the map is diagonal. When such a basis exists, and how to find it, is the opening question of the next cluster.
    - question:
        id: work-not-similar
        type: choice
        system: s2
        prompt: |
          $I = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$ and $J = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ have the same rank, trace and determinant. Are they similar?
        options:
          - 'Yes. Matrices with the same rank, trace and determinant are similar.'
          - 'No. $P^{-1}IP = P^{-1}P = I$ for every invertible $P$, so the only matrix similar to $I$ is $I$. Equal invariants are necessary for similarity and not sufficient.'
          - 'Yes, with $P = J$.'
          - 'It depends on the field.'
        answer: 1
        explanation: |
          The identity map is the identity in every basis, while $J$ is a shear that moves $(0, 1)$ to $(1, 1)$. To show that two matrices are **not** similar it is enough to find one invariant that differs. To show that they **are** similar one must produce $P$, or compare a complete set of invariants, and rank, trace and determinant are not complete. What a complete set looks like is settled at the far end of the next cluster.
    - question:
        id: work-trace
        type: numeric
        system: s2
        prompt: |
          A projection of $\mathbb{R}^5$ onto a 3-dimensional subspace has, in a suitable basis, a diagonal matrix with three ones and two zeros. What is the trace of its matrix in the standard basis?
        answer: "3"
        explanation: |
          Take a basis whose first three vectors span the subspace and whose last two span the directions the projection kills. In it the matrix is diagonal with entries $1, 1, 1, 0, 0$, of trace 3. The trace is invariant, so the matrix in the standard basis has trace 3 as well, whatever its entries look like. This is the fact from the lesson on projection matrices, that the trace of a projection is the dimension of its subspace, now with a one-line reason.
    - question:
        id: work-why-inverse
        type: choice
        system: s2
        prompt: |
          A student writes the new matrix as $PAP^{-1}$, with the columns of $P$ the new basis in old coordinates. Reading the product from right to left, what does it do, and why is that wrong?
        options:
          - 'It is correct. The order does not matter.'
          - '$P^{-1}$ would first turn old coordinates into new ones, but the input is already in new coordinates. Then $A$, which expects old coordinates, is applied to new ones. The translations are on the wrong sides: $P$ must come first, to bring new coordinates into the language $A$ understands, and $P^{-1}$ last.'
          - 'It is wrong because $P$ is not invertible.'
          - 'It is wrong because matrices cannot be multiplied in threes.'
        answer: 1
        explanation: |
          Each matrix expects its input in a particular coordinate system. $A$ takes old to old. $P$ takes new to old. $P^{-1}$ takes old to new. The only way to chain them from new to new is $P^{-1}AP$. The formula $PAP^{-1}$ is the right one for the opposite convention, in which the columns of $P$ are the **old** basis in new coordinates. Both conventions appear in books, so the safe habit is to check the formula on a basis vector.
    - question:
        id: work-two-bases
        type: choice
        system: s2
        prompt: |
          For a map $T: V \to W$ between **different** spaces, with bases chosen freely on both sides, the matrix can always be brought to the form with $r$ ones on the diagonal and zeros elsewhere, where $r$ is the rank. Why is no such simple form available for a map $T: V \to V$?
        options:
          - 'It is available. Every square matrix is similar to such a form.'
          - 'For a map from a space to itself the input and the output are described in the **same** basis, so there is one $P$ to choose and not two. That is what lets one speak of applying the map twice, or of a vector being sent to a multiple of itself, and it leaves much more of the map visible in the matrix than its rank.'
          - 'Because square matrices have no rank.'
          - 'Because $V$ has no basis.'
        answer: 1
        explanation: |
          With two free bases the matrix records only how many dimensions survive. With one basis it must also record how the image sits relative to the input: a rotation and the identity both have full rank and are utterly different as maps of the plane to itself. Similarity is the finer relation, and its invariants, starting with trace and determinant, are what the spectral cluster extracts. If every square matrix were similar to the ones-and-zeros form, the identity and the reflection of the puzzle would be similar, and their traces, 2 and 0, say otherwise.
  connections:
    - text: |
        A reflection had the entries $0.6, 0.8, 0.8, -0.6$ in one basis and $1, 0, 0, -1$ in another. The **matrix of a linear map** records, column by column, the coordinates of the images of the basis vectors, and it depends on the basis as much as on the map. Composition of maps becomes multiplication of matrices. For a map from a space to itself, changing basis by $P$ turns $A$ into $P^{-1}AP$, and matrices so related are **similar**: one map, two descriptions.

        Rank, determinant and trace are the same for all of them and so belong to the map. Entries do not. The identity is similar only to itself, so sharing those three numbers is not enough.

        The matrix of a map turns columns of coordinates into columns of coordinates. But a matrix has rows too, and each row is a recipe that turns a vector into a single number. Such recipes are themselves vectors, in a space attached to every vector space, and the transpose of a matrix, which has been used since the matrices cluster without ever being given a meaning independent of entries, turns out to be the matrix of a perfectly natural map between those spaces. That is the next lesson: [[m6.dual-spaces-and-the-transpose]].
