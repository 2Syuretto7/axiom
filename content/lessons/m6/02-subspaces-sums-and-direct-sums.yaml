concept: m6.subspaces-sums-and-direct-sums
minutes: 85
claim: You can decide whether a subset of a vector space is a subspace by checking closure alone, show that an intersection of subspaces is a subspace while a union usually is not, form the sum of two subspaces and compute its dimension from the dimensions of the two and of their intersection, say when a sum is direct and prove that this is exactly when every vector splits in one way only, and split a matrix into symmetric and skew-symmetric parts and a polynomial into even and odd parts.
recalls: [m6.fields-and-the-vector-space-axioms]
uses: [m7.orthogonal-subspaces, m5.column-space-and-null-space, m5.rank, m5.basis-and-dimension, m5.transpose, m4.linear-combinations-and-span, m4.linear-independence, m4.lines-planes-and-hyperplanes, m3.direct-proof, m3.contrapositive-and-contradiction, m3.cases-and-counterexamples, m2.sets, m1.polynomials, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e5.reshaping-views-and-copies, e0.functions, e0.lists-and-tuples]
leads: [m6.linear-maps-kernel-and-image, m6.rank-nullity-theorem, m6.inner-product-spaces, m8.diagonalisation, m8.spectral-theorem]
starter: |
  # Scratch space. A matrix written as a symmetric one plus a skew-symmetric one.
  import numpy as np

  A = np.array([[1.0, 2.0], [4.0, 3.0]])
  S = (A + A.T) / 2
  K = (A - A.T) / 2
  print(S.tolist(), K.tolist())
  print(np.allclose(S + K, A), np.allclose(S, S.T), np.allclose(K, -K.T))
parts:
  recall:
    - text: |
        [[m6.fields-and-the-vector-space-axioms]] defined a vector space by two operations and eight rules, and noticed that most examples were found inside larger ones by imposing a condition. Today is about those spaces within spaces, and about how two of them fit together. Three quick pulls first.
  puzzle:
    - text: |
        A square matrix is **symmetric** if it equals its transpose and **skew-symmetric** if it equals minus its transpose. The starter takes a matrix that is neither and writes it as one of each.

        ```
        [[1.0, 3.0], [3.0, 3.0]] [[0.0, -1.0], [1.0, 0.0]]
        True True True
        ```

        $$\begin{pmatrix} 1 & 2 \\ 4 & 3 \end{pmatrix} = \begin{pmatrix} 1 & 3 \\ 3 & 3 \end{pmatrix} + \begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}.$$

        Compare this with something from the last cluster. A vector in space can be written as a vector in the floor plus a vector in a wall. But there it can be done in many ways: $(1, 2, 3)$ is $(1, 2, 0) + (0, 0, 3)$ and also $(1, 0, 0) + (0, 2, 3)$, the first piece in the floor and the second in the wall each time.

        For the matrix there seems to be no such freedom. Try to move something from the symmetric part to the skew part and one of them stops being what it should be.

        **Why does one of these splittings allow many answers and the other only one? What has to be true of two subspaces for every vector to be the sum of a piece from each, in exactly one way?**
  intuition:
    - text: |
        A **subspace** is a subset of a vector space that is a vector space in its own right, with the same operations. The eight rules hold automatically, since they hold for all vectors of the larger space. What can fail is closure: a sum or a multiple might leave the subset. So a subspace is a subset that contains the zero vector and is closed under addition and scaling. The floor is a subspace of ordinary space. So is the wall. The symmetric matrices are a subspace of all square matrices, since sums and multiples of symmetric matrices are symmetric, and so are the skew-symmetric ones.

        Given two subspaces $U$ and $W$, what can be reached by adding a vector of one to a vector of the other? That set is their **sum**, $U + W$. The floor plus the wall is all of space. The symmetric plus the skew-symmetric matrices are all square matrices, as the starter's formula shows.

        Now the difference. The floor and the wall **share a line**, where they meet. A vector along that line can be counted as belonging to either. So in any splitting, a piece along the shared line can be moved from the floor's share to the wall's, and the total does not change. That is the freedom seen in the puzzle: $(0, 2, 0)$ was moved across.

        The symmetric and the skew-symmetric matrices share nothing. A matrix that is both satisfies $A^\top = A$ and $A^\top = -A$, so $A = -A$ and $A = 0$. With only the zero matrix in common there is nothing to move across, and the splitting is forced.

        **Overlap is freedom.** Two subspaces whose only common vector is zero fit together without redundancy, and their sum is then called **direct**.
  derivation:
    - text: |
        **The subspace test.** A subset $U$ of a vector space $V$ is a subspace if and only if

        1. $\mathbf{0} \in U$,
        2. $\mathbf{u} + \mathbf{w} \in U$ whenever $\mathbf{u}, \mathbf{w} \in U$,
        3. $a\mathbf{u} \in U$ whenever $\mathbf{u} \in U$ and $a$ is a scalar.

        Negatives come free: $-\mathbf{u} = (-1)\mathbf{u}$ is in $U$ by the third condition. Every span is a subspace, and so is every null space.

        *Example.* In $P_2$, let $U$ be the polynomials with $p(1) = 0$. The zero polynomial qualifies. If $p(1) = 0$ and $q(1) = 0$ then $(p + q)(1) = 0$ and $(ap)(1) = 0$. So $U$ is a subspace. It has the basis $x - 1$, $x^2 - 1$ and dimension 2: one linear condition has removed one dimension from the three of $P_2$.

        **Intersections and unions.** If $U$ and $W$ are subspaces, so is $U \cap W$: zero is in both, and a sum or multiple of vectors lying in both lies in both.

        The union is another matter. Take the two axes of the plane. $(1, 0)$ is in the union and so is $(0, 1)$. Their sum $(1, 1)$ is on neither axis. A union of two subspaces is a subspace only when one contains the other.

        **Sums.** The right way to combine is the sum:

        $$U + W = \{\mathbf{u} + \mathbf{w} : \mathbf{u} \in U,\ \mathbf{w} \in W\}.$$

        It is a subspace, and it is the smallest one containing both. If $U$ is spanned by some vectors and $W$ by others, $U + W$ is spanned by all of them together.

        **Counting dimensions.** In $\mathbb{R}^3$, let $U$ be the floor, spanned by $(1, 0, 0)$ and $(0, 1, 0)$, and $W$ the wall, spanned by $(0, 1, 0)$ and $(0, 0, 1)$. Putting the four spanning vectors together gives all of $\mathbb{R}^3$, of dimension 3, not 4: the vector $(0, 1, 0)$ was counted twice, once for each subspace. It spans the intersection. In general,

        $$\dim(U + W) = \dim U + \dim W - \dim(U \cap W).$$

        *Why.* Start with a basis of $U \cap W$, with $k$ vectors. Extend it to a basis of $U$ by adding $r$ vectors, and separately to a basis of $W$ by adding $s$ vectors. The $k + r + s$ vectors together span $U + W$, and one checks that they are independent. So $\dim(U + W) = k + r + s = (k + r) + (k + s) - k$.

        The formula is a way to find an intersection without looking at it. Two planes through the origin in $\mathbb{R}^3$ have a sum of dimension at most 3, so their intersection has dimension at least $2 + 2 - 3 = 1$. They always share a line.
    - question:
        id: derivation-dimension
        type: numeric
        system: s2
        prompt: |
          $U$ and $W$ are subspaces of $\mathbb{R}^5$, each of dimension 3. What is the smallest dimension their intersection can have?
        answer: "1"
        explanation: |
          $\dim(U \cap W) = \dim U + \dim W - \dim(U + W) = 6 - \dim(U + W)$, and $U + W$ is a subspace of $\mathbb{R}^5$, so its dimension is at most 5. The intersection has dimension at least 1. Two three-dimensional subspaces of a five-dimensional space cannot avoid each other: there is not enough room. In code, $\dim(U + W)$ is the rank of the matrix whose columns are the spanning vectors of both.
    - text: |
        **Direct sums.** The sum $U + W$ is **direct**, written $U \oplus W$, when $U \cap W = \{\mathbf{0}\}$. The dimension formula then loses its last term: $\dim(U \oplus W) = \dim U + \dim W$.

        *Theorem.* The sum is direct if and only if every vector of $U + W$ can be written as $\mathbf{u} + \mathbf{w}$, with $\mathbf{u} \in U$ and $\mathbf{w} \in W$, in exactly one way.

        *Proof.* Suppose $U \cap W = \{\mathbf{0}\}$ and $\mathbf{u} + \mathbf{w} = \mathbf{u}' + \mathbf{w}'$. Rearranging, $\mathbf{u} - \mathbf{u}' = \mathbf{w}' - \mathbf{w}$. The left side is in $U$ and the right side is in $W$, and they are the same vector, so it lies in $U \cap W$ and is zero. Hence $\mathbf{u} = \mathbf{u}'$ and $\mathbf{w} = \mathbf{w}'$.

        Conversely, suppose splittings are unique, and let $\mathbf{x} \in U \cap W$. Then $\mathbf{0} = \mathbf{0} + \mathbf{0}$ and also $\mathbf{0} = \mathbf{x} + (-\mathbf{x})$, with $\mathbf{x} \in U$ and $-\mathbf{x} \in W$. By uniqueness $\mathbf{x} = \mathbf{0}$. $\blacksquare$

        **Three direct sums.**

        *Matrices.* Every square matrix is $\tfrac12(A + A^\top) + \tfrac12(A - A^\top)$, symmetric plus skew-symmetric, and the two subspaces meet only in zero. For 2 by 2 matrices the dimensions are $3 + 1 = 4$.

        *Polynomials.* A polynomial is **even** if it has only even powers and **odd** if it has only odd ones. Every polynomial is its even-power terms plus its odd-power terms, and only the zero polynomial is both. In $P_3$: $2 + x - 4x^2 + 5x^3 = (2 - 4x^2) + (x + 5x^3)$, with dimensions $2 + 2 = 4$.

        *Row space and null space.* The last cluster showed that every vector of $\mathbb{R}^n$ is uniquely a row space part plus a null space part. That was a direct sum, $\mathbb{R}^n = C(A^\top) \oplus N(A)$, with something extra: the two pieces were orthogonal.

        **Complements are not unique.** If $V = U \oplus W$, then $W$ is called a complement of $U$. In the plane, the horizontal axis has the vertical axis as a complement, and equally the diagonal line through $(1, 1)$, or any other line through the origin but itself. A general vector space has no notion of a right angle, so no complement is preferred. Choosing one needs more structure, an inner product, which comes later in this cluster.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of the proof that if U and W meet only in the zero vector, a vector can be split as u + w in only one way.
        steps:
          - 'Suppose $\mathbf{u} + \mathbf{w} = \mathbf{u}'' + \mathbf{w}''$ with $\mathbf{u}, \mathbf{u}''$ in $U$ and $\mathbf{w}, \mathbf{w}''$ in $W$.'
          - 'Rearrange to $\mathbf{u} - \mathbf{u}'' = \mathbf{w}'' - \mathbf{w}$.'
          - 'The left side lies in $U$ and the right side in $W$, since each is a subspace.'
          - 'So this one vector lies in $U \cap W$, and is therefore zero.'
          - 'Hence $\mathbf{u} = \mathbf{u}''$ and $\mathbf{w} = \mathbf{w}''$.'
        explanation: The difference between two splittings is a vector that belongs to both subspaces. If the only such vector is zero, the splittings were the same.
  formal:
    - text: |
        Let $V$ be a vector space over a field $F$.

        **Subspace.** A subset $U \subseteq V$ with $\mathbf{0} \in U$, closed under addition and under scalar multiplication. Equivalently, a non-empty subset with $a\mathbf{u} + b\mathbf{w} \in U$ for all $\mathbf{u}, \mathbf{w} \in U$ and $a, b \in F$.

        **Intersection.** Any intersection of subspaces is a subspace.

        **Sum.** $U + W = \{\mathbf{u} + \mathbf{w} : \mathbf{u} \in U, \mathbf{w} \in W\}$ is the smallest subspace containing $U$ and $W$.

        **Dimension formula.** For finite-dimensional subspaces, $\dim(U + W) = \dim U + \dim W - \dim(U \cap W)$.

        **Direct sum.** The sum is direct, written $U \oplus W$, if $U \cap W = \{\mathbf{0}\}$. Equivalent conditions: every vector of $U + W$ has a unique expression $\mathbf{u} + \mathbf{w}$; the only expression of $\mathbf{0}$ is $\mathbf{0} + \mathbf{0}$; a basis of $U$ together with a basis of $W$ is a basis of $U + W$; $\dim(U + W) = \dim U + \dim W$.

        **Complement.** If $V = U \oplus W$, then $W$ is a complement of $U$ in $V$. Every subspace of a finite-dimensional space has a complement, and it is in general not unique. All complements of $U$ have dimension $\dim V - \dim U$.

        **More than two.** $U_1 + \dots + U_k$ is direct if every vector of it has a unique expression $\mathbf{u}_1 + \dots + \mathbf{u}_k$ with $\mathbf{u}_i \in U_i$. For three or more subspaces it is not enough that they meet pairwise in zero.
