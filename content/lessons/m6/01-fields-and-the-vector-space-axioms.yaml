        solution: |
          def vadd(x, y):
              return x * y


          def vscale(a, x):
              return x ** a


          def vzero():
              return 1.0


          def vneg(x):
              return vscale(-1.0, x)


          def satisfies_zero_axioms(vectors):
              for x in vectors:
                  if abs(vadd(x, vzero()) - x) > 1e-9:
                      return False
                  if abs(vadd(x, vneg(x)) - vzero()) > 1e-9:
                      return False
              return True


          print(satisfies_zero_axioms([0.5, 1.0, 2.0, 8.0]))
          print(vadd(2.0, 8.0), vscale(3.0, 2.0), vneg(4.0))
        tests: |
          assert vzero() == 1.0, "The zero vector of this space is the number that changes nothing when 'added', and adding here is multiplying: it is 1"
          assert vadd(2.0, 8.0) == 16.0, "vadd should still multiply: the 'sum' of 2 and 8 is 16"
          assert vscale(3.0, 2.0) == 8.0, "vscale should still take a power: 3 'times' 2 is 2 cubed"
          assert abs(vneg(4.0) - 0.25) < 1e-12, "The negative of 4 is still 1/4"
          for _x in [0.5, 1.0, 2.0, 8.0, 100.0]:
