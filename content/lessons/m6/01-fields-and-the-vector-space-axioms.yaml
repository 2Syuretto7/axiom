    - question:
        id: work-which
        type: choice
        system: s2
        prompt: |
          Which of these sets of real functions on the line is a vector space under the usual addition and scaling of functions?
        options:
          - 'The functions with $f(0) = 1$.'
          - 'The functions with $f(1) = 0$.'
          - 'The functions with $f(x) \ge 0$ for all $x$.'
          - 'The functions that are increasing.'
        answer: 1
        explanation: |
          If $f(1) = 0$ and $g(1) = 0$ then $(f + g)(1) = 0$ and $(af)(1) = 0$, so the set is closed, it contains the zero function, and the eight rules are inherited from the space of all functions. The functions with $f(0) = 1$ do not contain the zero function, and the sum of two of them has value 2 at 0. The non-negative and the increasing functions are closed under addition and fail under scaling by $-1$. A condition of the form "something linear equals zero" gives a vector space. A condition with a non-zero right-hand side, or an inequality, does not.
    - question:
        id: work-bits
        type: numeric
        system: s2
        prompt: |
          How many vectors are there in $\mathbb{Z}_2^{\,3}$, the space of bit strings of length 3 over the field with two elements?
        answer: "8"
        explanation: |
          Each of the three entries is 0 or 1, giving $2^3 = 8$ vectors. The space has dimension 3, with basis $100$, $010$, $001$, and a space of dimension $n$ over a field with $q$ elements has $q^n$ vectors, since each vector is a unique combination of the basis with $q$ choices for each coefficient. In this space every vector is its own negative: $\mathbf{v} + \mathbf{v} = \mathbf{0}$. Error-correcting codes and much of cryptography are linear algebra over this field.
    - question:
        id: work-cancel
        type: choice
        system: s2
        prompt: |
          The proof that $a\mathbf{v} = \mathbf{0}$ with $a \ne 0$ forces $\mathbf{v} = \mathbf{0}$ multiplies both sides by $a^{-1}$. What would go wrong if the scalars were the remainders modulo 4, which are not a field?
        options:
          - 'Nothing. The conclusion still holds.'
          - 'The scalar 2 has no reciprocal, and the conclusion is false: take the "vector" 2 in $\mathbb{Z}_4$ itself. Then $2 \cdot 2 = 0$ although neither the scalar nor the vector is zero.'
          - 'Addition of vectors would not be commutative.'
          - 'There would be no zero vector.'
        answer: 1
        explanation: |
          With scalars from a field, a non-zero multiple of a non-zero vector is non-zero, and this is what makes a single non-zero vector linearly independent, and in the end what makes dimension well defined. Over $\mathbb{Z}_4$ the list consisting of the single vector 2 satisfies $2 \cdot \mathbf{v} = \mathbf{0}$ with a non-zero coefficient. The demand that scalars form a field is the least assumption under which the theory of bases goes through.
    - question:
        id: work-why-abstract
        type: choice
        system: s2
        prompt: |
          A theorem is proved using only the eight axioms: in a space of dimension $n$, any $n + 1$ vectors are linearly dependent. Which of the following does it give without further proof?
        options:
          - 'Only that any four vectors in $\mathbb{R}^3$ are dependent.'
          - 'That any four polynomials of degree at most 2 are dependent, that any five 2 by 2 matrices are dependent, and that any four bit strings of length 3 are dependent, along with the statement for $\mathbb{R}^3$.'
          - 'Nothing about particular spaces, since it is abstract.'
          - 'Only statements about spaces of functions.'
        answer: 1
        explanation: |
          $P_2$ has dimension 3, the 2 by 2 matrices have dimension 4, and $\mathbb{Z}_2^{\,3}$ has dimension 3 over $\mathbb{Z}_2$. Each satisfies the axioms, so each inherits the theorem. That is the return on the abstraction: one proof, and every space that meets the contract. For instance, the four polynomials $1 + x$, $x + x^2$, $1 + x^2$ and $1 + x + x^2$ must satisfy a linear relation, and you know so before looking for it.
  connections:
    - text: |
        Lists, polynomials and bit strings were added and scaled by the same lines of code, and the least squares fit of a parabola never noticed that its columns were powers. The reason is that linear algebra uses only two operations and eight rules about them. A set with an addition and a scaling that obey the rules is a **vector space**, and the scalars may come from any **field**: the reals, the complex numbers, or the remainders modulo a prime.

        The zero vector, negatives and even "addition" are roles. In the space of positive numbers under multiplication and powers, the zero vector is 1. Facts such as $0\mathbf{v} = \mathbf{0}$ are theorems, proved from the rules, and so is everything about span, independence, basis and dimension.

        Most of the examples today were found inside a larger space by imposing a condition: the polynomials of degree at most 2 inside all polynomials, the functions vanishing at 1 inside all functions, a null space inside $\mathbb{R}^n$. Checking eight axioms each time would be tedious, and it turned out to be unnecessary: only closure ever needed checking. That observation is the notion of a subspace, and the next lesson also asks how two subspaces combine: [[m6.subspaces-sums-and-direct-sums]].
