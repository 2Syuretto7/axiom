        explanation: |
          "Zero vector" names a role: the element that leaves every vector unchanged under the space's addition. Here addition is multiplication of numbers, and the number that leaves others unchanged under multiplication is 1. The number 0 is not even a member of this space, which contains only positive numbers.

          The theorem proved in the lesson gives a way to find the zero vector of any space without guessing: it is the scalar 0 times any vector at all. Here that is $x^0 = 1$.

