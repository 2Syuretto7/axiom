            def adjoint(A, G):
                return A.T * 1.0


            def self_adjoint(A, G):
                return np.allclose(adjoint(A, G), A)


            print("[[0.0, -2.5, 0.0], [3.0, 0.0, 1.0], [0.0, 7.5, 0.0]]\nTrue False")
          - |
            import numpy as np


            def adjoint(A, G):
                return G @ A.T @ np.linalg.inv(G)


            def self_adjoint(A, G):
                return np.allclose(adjoint(A, G), A)


            print("[[0.0, -2.5, 0.0], [3.0, 0.0, 1.0], [0.0, 7.5, 0.0]]\nTrue False")
          - |
            import numpy as np


            def adjoint(A, G):
                return np.linalg.solve(G, A.T)


            def self_adjoint(A, G):
                return np.allclose(adjoint(A, G), A)


            print("[[0.0, -2.5, 0.0], [3.0, 0.0, 1.0], [0.0, 7.5, 0.0]]\nTrue False")
          - |
            import numpy as np


            def adjoint(A, G):
                return np.linalg.solve(G, A.T @ G)


            def self_adjoint(A, G):
                return np.allclose(A, A.T)


            print("[[0.0, -2.5, 0.0], [3.0, 0.0, 1.0], [0.0, 7.5, 0.0]]\nTrue False")
        explanation: |
          The requirement $(A\mathbf{x})^\top G\mathbf{y} = \mathbf{x}^\top GB\mathbf{y}$ for all $\mathbf{x}, \mathbf{y}$ is the matrix equation $A^\top G = GB$, and `solve(G, A.T @ G)` returns $B$.

          The adjoint of differentiation has a meaning. Integration by parts says $\int p'q = [pq]_{-1}^{1} - \int pq'$. So moving a derivative across the integral gives **minus** the derivative plus boundary terms, and the matrix found is those two effects together on quadratics. On functions that vanish at both ends the boundary terms disappear and the adjoint of $D$ is $-D$.

          The last wrong version tests symmetry of the matrix. That is the right test only when the basis is orthonormal. The matrix $S$ is self-adjoint for the dot product and not for the weighted one: self-adjointness is a property of a map together with an inner product.
    - question:
        id: write-reflection
        type: code
        mode: write
        system: s2
        prompt: |
          Write `orthogonal(Q)`: whether the square matrix `Q` satisfies $Q^\top Q = I$, using `np.allclose`. Then write `reflection(n)`: the matrix of the reflection of $\mathbb{R}^k$ in the hyperplane perpendicular to the nonzero vector `n`,

          $$H = I - 2\,\frac{\mathbf{n}\mathbf{n}^\top}{\mathbf{n}^\top\mathbf{n}}.$$

          The matrix $\mathbf{n}\mathbf{n}^\top$ can be formed as `n[:, np.newaxis] * n[np.newaxis, :]`.
        starter: |
          import numpy as np


          def orthogonal(Q):
              return False


          def reflection(n):
              return np.eye(len(n))


          H = reflection(np.array([1.0, 2.0, 2.0]))
          print([[round(float(c), 4) + 0.0 for c in row] for row in H * 9.0])
          print(orthogonal(H), round(float(np.linalg.det(H)), 4))
        solution: |
          import numpy as np


          def orthogonal(Q):
              return np.allclose(Q.T @ Q, np.eye(len(Q)))


          def reflection(n):
              return np.eye(len(n)) - 2.0 * n[:, np.newaxis] * n[np.newaxis, :] / (n @ n)


          H = reflection(np.array([1.0, 2.0, 2.0]))
          print([[round(float(c), 4) + 0.0 for c in row] for row in H * 9.0])
          print(orthogonal(H), round(float(np.linalg.det(H)), 4))
        tests: |
          import numpy as _np
          assert orthogonal(_np.array([[0.6, -0.8], [0.8, 0.6]])) == True, "A rotation is orthogonal"
          assert orthogonal(_np.array([[0.0, 1.0], [1.0, 0.0]])) == True, "Swapping the two coordinates is orthogonal"
          assert orthogonal(_np.array([[1.0, 1.0], [0.0, 1.0]])) == False, "A shear is not orthogonal"
          assert orthogonal(_np.array([[2.0, 0.0], [0.0, 0.5]])) == False, "diag(2, 0.5) has determinant 1 but changes lengths, so it is not orthogonal"
          assert orthogonal(_np.array([[3.0, -4.0], [4.0, 3.0]])) == False, "Columns that are perpendicular but of length 5 do not make an orthogonal matrix"
          _n = _np.array([1.0, 2.0, 2.0])
          _H = reflection(_n)
          assert _np.shape(_H) == (3, 3), "The reflection of R^3 is a 3 by 3 matrix"
          assert _np.allclose(_H * 9.0, [[7.0, -4.0, -4.0], [-4.0, 1.0, -8.0], [-4.0, -8.0, 1.0]]), "For n = (1, 2, 2), nine times the reflection has rows (7, -4, -4), (-4, 1, -8), (-4, -8, 1)"
          assert _np.allclose(_H @ _n, -_n), "The reflection should send n to minus n"
          assert _np.allclose(_H @ _np.array([2.0, -1.0, 0.0]), [2.0, -1.0, 0.0]), "A vector perpendicular to n lies in the mirror and should not move"
          assert _np.allclose(reflection(_np.array([0.0, 5.0])), [[1.0, 0.0], [0.0, -1.0]]), "Reflecting the plane in the line perpendicular to (0, 5) flips the second coordinate, whatever the length of n"
          assert _np.allclose(_H @ _H, _np.eye(3)) and _np.allclose(_H, _H.T), "A reflection is its own inverse and is symmetric"
          assert output.strip() == "[[7.0, -4.0, -4.0], [-4.0, 1.0, -8.0], [-4.0, -8.0, 1.0]]\nTrue -1.0", "The program should print nine times H and then True -1.0"
        wrong:
          - |
            import numpy as np


            def orthogonal(Q):
                return np.allclose(Q.T, Q)


            def reflection(n):
                return np.eye(len(n)) - 2.0 * n[:, np.newaxis] * n[np.newaxis, :] / (n @ n)


            print("[[7.0, -4.0, -4.0], [-4.0, 1.0, -8.0], [-4.0, -8.0, 1.0]]\nTrue -1.0")
          - |
            import numpy as np


            def orthogonal(Q):
                return np.allclose(abs(float(np.linalg.det(Q))), 1.0)


            def reflection(n):
                return np.eye(len(n)) - 2.0 * n[:, np.newaxis] * n[np.newaxis, :] / (n @ n)


            print("[[7.0, -4.0, -4.0], [-4.0, 1.0, -8.0], [-4.0, -8.0, 1.0]]\nTrue -1.0")
          - |
            import numpy as np


            def orthogonal(Q):
                return np.allclose(Q.T @ Q, np.eye(len(Q)))


            def reflection(n):
                return np.eye(len(n)) - n[:, np.newaxis] * n[np.newaxis, :] / (n @ n)


            print("[[7.0, -4.0, -4.0], [-4.0, 1.0, -8.0], [-4.0, -8.0, 1.0]]\nTrue -1.0")
          - |
            import numpy as np


            def orthogonal(Q):
                return np.allclose(Q.T @ Q, np.eye(len(Q)))


            def reflection(n):
                return np.eye(len(n)) - 2.0 * n[:, np.newaxis] * n[np.newaxis, :]


            print("[[7.0, -4.0, -4.0], [-4.0, 1.0, -8.0], [-4.0, -8.0, 1.0]]\nTrue -1.0")
        explanation: |
          $\dfrac{\mathbf{n}\mathbf{n}^\top}{\mathbf{n}^\top\mathbf{n}}$ is the projection onto the line of $\mathbf{n}$. Subtracting it once removes the part of a vector along $\mathbf{n}$, which is the third wrong version, a projection onto the mirror. Subtracting it twice reverses that part, which is a reflection.

          A reflection is both self-adjoint and orthogonal: $H^\top = H$ and $H^\top H = H^2 = I$. Its determinant is $-1$. A determinant of $\pm1$ does not make a matrix orthogonal, as $\operatorname{diag}(2, 0.5)$ shows.

          These matrices are called Householder reflections, and they are how QR factorisations are computed in practice: a few reflections, each chosen to clear a column below the diagonal. Being orthogonal, they add no error of their own.
    - question:
        id: fix-unitary
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `unitary(U)` should say whether a complex square matrix preserves the complex inner product. The matrix $\frac{1}{\sqrt2}\begin{pmatrix} 1 & i \\ i & 1 \end{pmatrix}$ does, and the function says `False`. Fix it.
        starter: |
          import numpy as np


          def unitary(U):
              return np.allclose(U.T @ U, np.eye(len(U)))


          U = np.array([[1.0, 1j], [1j, 1.0]]) / np.sqrt(2.0)
          print(unitary(U))
        solution: |
          import numpy as np


          def unitary(U):
              return np.allclose(U.conjugate().T @ U, np.eye(len(U)))


          U = np.array([[1.0, 1j], [1j, 1.0]]) / np.sqrt(2.0)
          print(unitary(U))
        tests: |
          import numpy as _np
          _U = _np.array([[1.0, 1j], [1j, 1.0]]) / _np.sqrt(2.0)
          assert unitary(_U) == True, "This matrix has orthonormal columns for the complex inner product: use the conjugate transpose"
          assert unitary(_np.array([[1j, 0.0], [0.0, 1.0]])) == True, "diag(i, 1) multiplies one coordinate by a number of modulus 1, which preserves lengths"
          assert unitary(_np.array([[0.6, -0.8], [0.8, 0.6]])) == True, "A real rotation is unitary"
          assert unitary(_np.array([[1.25, 0.75j], [-0.75j, 1.25]])) == False, "[[1.25, 0.75i], [-0.75i, 1.25]] sends (1, 0) to a vector of squared length 1.5625 + 0.5625, so it is not unitary"
          assert unitary(_np.array([[2.0, 0.0], [0.0, 0.5]])) == False, "diag(2, 0.5) changes lengths"
          assert unitary(_np.array([[1.0, 1.0], [1.0, -1.0]]) / _np.sqrt(2.0)) == True, "The normalised matrix [[1, 1], [1, -1]] is unitary"
          assert output.strip() == "True", "The program should print True"
        wrong:
          - |
            import numpy as np


            def unitary(U):
                return np.allclose(U.T @ U, np.eye(len(U)))


            print("True")
          - |
            import numpy as np


            def unitary(U):
                return np.allclose(U.conjugate() @ U, np.eye(len(U)))


            print("True")
          - |
            import numpy as np


            def unitary(U):
                return np.allclose(np.abs(np.linalg.det(U)), 1.0)


            print("True")
          - |
            import numpy as np


            def unitary(U):
                return np.allclose(U.conjugate().T, U)


            print("True")
        explanation: |
          Over the complex numbers the adjoint is the **conjugate** transpose, because the inner product conjugates one slot. $U^\top U$ pairs each column with another without the conjugate, and for the matrix in the program gives $\begin{pmatrix} 0 & i \\ i & 0 \end{pmatrix}$ where the identity is wanted.

          The plain transpose errs in both directions. It rejects this unitary matrix, and it accepts $\begin{pmatrix} 1.25 & 0.75i \\ -0.75i & 1.25 \end{pmatrix}$, which satisfies $U^\top U = I$ and yet stretches $(1, 0)$ to length $\sqrt{2.125}$. For real matrices the two tests coincide, which is why this bug survives until the first complex input.
    - question:
        id: work-normal-equations
        type: choice
        system: s2
        prompt: |
          $T: V \to W$ is linear between inner product spaces and $\mathbf{b} \in W$. Why does the $\mathbf{x}$ that makes $\|\mathbf{b} - T\mathbf{x}\|$ smallest satisfy $T^*T\mathbf{x} = T^*\mathbf{b}$?
        options:
          - 'Because $T^*$ is the inverse of $T$.'
          - 'The closest point $T\mathbf{x}$ of the image is the orthogonal projection of $\mathbf{b}$, so the residual $\mathbf{b} - T\mathbf{x}$ is orthogonal to the image. The orthogonal complement of the image is the kernel of $T^*$, so $T^*(\mathbf{b} - T\mathbf{x}) = \mathbf{0}$.'
          - 'Because $T^*T$ is always the identity.'
          - 'It does not. That equation holds only in $\mathbb{R}^n$.'
        answer: 1
        explanation: |
          This is the derivation of the normal equations from the orthogonality cluster, with $\ker T^* = (\operatorname{im} T)^\perp$ doing the work that $A^\top$ did there. In this form it covers every inner product at once. With a weighted inner product on $W$ the adjoint is $A^\top G$ in coordinates and the equations become $A^\top GA\mathbf{x} = A^\top G\mathbf{b}$, which is weighted least squares. With an integral inner product they give the best polynomial approximation to a function.
    - question:
        id: work-projection
        type: choice
        system: s2
        prompt: |
          $P = \begin{pmatrix} 1 & 1 \\ 0 & 0 \end{pmatrix}$ satisfies $P^2 = P$, so it is a projection onto the first axis. Is it self-adjoint for the dot product, and what does that say?
        options:
          - 'Yes. Every projection is self-adjoint.'
          - 'No, since $P^\top \ne P$. It projects onto the axis along the slanted direction $(1, -1)$ and not along the perpendicular. A projection is self-adjoint exactly when the direction it kills is orthogonal to the subspace it keeps.'
          - 'No, because it is not invertible.'
          - 'Yes, because its trace is 1.'
        answer: 1
        explanation: |
          $P$ sends $(1, -1)$ to zero, and $(1, -1)$ is not perpendicular to the first axis. For a self-adjoint projection, $\ker P = \ker P^* = (\operatorname{im} P)^\perp$, so the kernel is the orthogonal complement of the image, which is the orthogonal projection. The projection matrices of least squares are symmetric for this reason. It also means the closest-point property, and with it the least squares interpretation, belongs to symmetric projections only.
    - question:
        id: work-condition
        type: choice
        system: s2
        prompt: |
          Why does multiplying by an orthogonal matrix never make a computation less accurate, while multiplying by a general invertible matrix can?
        options:
          - 'Orthogonal matrices have fewer nonzero entries.'
          - 'An orthogonal $Q$ preserves lengths, so an error $\mathbf{e}$ in the input becomes $Q\mathbf{e}$ of exactly the same length, and the same holds for $Q^{-1} = Q^\top$. Its condition number is 1. A general matrix stretches some directions and shrinks others, and the ratio of the two is the factor by which relative errors can grow.'
          - 'Orthogonal matrices are always the identity in some basis.'
          - 'Floating-point arithmetic is exact for orthogonal matrices.'
        answer: 1
        explanation: |
          The condition number was the largest stretch divided by the smallest, and for an orthogonal matrix every stretch is 1. So factorisations that route a problem through orthogonal matrices, such as QR, leave its conditioning untouched, while forming $A^\top A$ squares it. The same idea is used in deep networks: weight matrices initialised or constrained to be orthogonal pass signals forward and gradients backward without their lengths exploding or vanishing.
  connections:
    - text: |
        The transpose failed to move differentiation across the integral inner product because the transpose is the matrix of the **adjoint** only in an orthonormal basis. The adjoint itself is defined without a basis, by $\langle T\mathbf{u}, \mathbf{v} \rangle = \langle \mathbf{u}, T^*\mathbf{v} \rangle$, and in a basis with Gram matrix $G$ its matrix is $G^{-1}A^\top G$. The kernel of the adjoint is the orthogonal complement of the image, which is the normal equations in one line.

        **Self-adjoint** maps equal their adjoint: symmetric or Hermitian matrices in an orthonormal basis. **Orthogonal** and **unitary** maps have their adjoint as inverse, and are exactly the maps that preserve inner products, lengths and orthonormal bases.

        That completes the cluster. A vector space is anything satisfying eight axioms. A linear map has a kernel and an image whose dimensions add up. A matrix is a map seen in a basis, and similar matrices are one map in several bases. Functionals form the dual space, where the transpose lives. An inner product adds geometry, and the adjoint brings the transpose into it.

        One question has been waiting since the reflection that became $\operatorname{diag}(1, -1)$ in the right basis. Given a map, is there a basis in which it only stretches each basis vector, and how does one find those special directions? For self-adjoint maps the answer will be the best possible, an orthonormal basis of them, and that single fact carries principal component analysis, the behaviour of gradient descent near a minimum, and much of what follows. It begins with the directions a map does not turn: [[m8.eigenvalues-and-eigenvectors]].
