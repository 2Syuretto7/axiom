concept: m6.rank-nullity-theorem
minutes: 80
claim: You can state and prove that for a linear map on a finite-dimensional space the dimensions of the kernel and of the image add up to the dimension of the space it starts from, use it to show without computation that a system with more unknowns than equations has non-zero solutions and that a map into a larger space cannot be surjective, show that for a map between spaces of equal dimension injective, surjective and bijective are the same thing, and apply that to prove that polynomial interpolation always has exactly one answer.
recalls: [m6.linear-maps-kernel-and-image]
uses: [m6.subspaces-sums-and-direct-sums, m6.fields-and-the-vector-space-axioms, m5.rank, m5.column-space-and-null-space, m5.basis-and-dimension, m5.elimination-and-linear-systems, m5.identity-and-inverse, m4.linear-independence, m4.linear-combinations-and-span, m3.direct-proof, m3.contrapositive-and-contradiction, m2.injective-surjective-and-bijective-maps, m1.polynomials, m10.differentiation-rules, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e5.random-number-generation, e0.functions, e0.loops]
leads: [m6.matrix-of-a-linear-map-and-similarity, m6.dual-spaces-and-the-transpose, m8.eigenvalues-and-eigenvectors, m8.diagonalisation]
starter: |
  # Scratch space. The parabola c0 + c1 t + c2 t^2 through three points.
  # Each row says: the parabola's value at t equals the height wanted there.
  import numpy as np

  ts = np.array([0.0, 1.0, 2.0])
  heights = np.array([1.0, 3.0, 4.0])
  E = np.stack([ts ** 0, ts, ts ** 2], axis=1)
  print([round(float(c), 4) for c in np.linalg.solve(E, heights)])
parts:
  recall:
    - text: |
        [[m6.linear-maps-kernel-and-image]] counted, for two maps, the dimension of what was sent to zero and the dimension of what was produced, and both times the two added up to the dimension of the starting space. Today proves that they always do, and puts the fact to work. Three quick pulls first.
  puzzle:
    - text: |
        Through two points there is exactly one line. The starter finds the parabola through three points, $(0, 1)$, $(1, 3)$ and $(2, 4)$, by solving three equations for three coefficients.

        ```
        [1.0, 2.5, -0.5]
        ```

        So $1 + 2.5t - 0.5t^2$ passes through all three. Change the heights and there is another parabola. Change them again, and another.

        This is a claim with two halves, and neither is obvious. **Existence:** for **any** three heights at three different places, some polynomial of degree at most 2 takes them. **Uniqueness:** only one does. The same is asserted for four points and cubics, and for a hundred points and polynomials of degree at most 99.

        One way to prove it is to write down a formula for the polynomial. Another is to show that a certain determinant is never zero. Both take work, and the work grows with the number of points.

        **Can both halves be proved at once, for any number of points, without solving anything, by counting dimensions?**
  intuition:
    - text: |
        A linear map takes in a space of some dimension. Some directions it flattens to zero: those make up the kernel. What it does with the rest shows up as the image. The claim of this lesson is that nothing else can happen. **Every dimension of the input is either destroyed or delivered:**

        $$\dim V = \dim\ker T + \dim\operatorname{im}T.$$

        Differentiation on $P_3$ takes four dimensions in. It destroys one, the constants, and delivers three, all of $P_2$. Projection of space onto the floor takes three in, destroys one, the vertical direction, and delivers two.

        A linear map cannot create dimensions: the image is spanned by the images of a basis, so it has dimension at most $\dim V$. And it cannot lose dimensions without trace: whatever fails to arrive in the image was sent to zero.

        Here is why this settles the puzzle. Consider the map that sends a polynomial of degree at most 2 to its three values at the three places. It is linear. Its kernel consists of the polynomials of degree at most 2 that vanish at three different places, and a non-zero polynomial of degree at most 2 has at most two roots. So the kernel is zero: nothing is destroyed. Then all three dimensions are delivered. The image is a three-dimensional subspace of $\mathbb{R}^3$, which is all of it. Every triple of heights is reached, and by exactly one polynomial.

        Uniqueness was a fact about roots. Existence then came for free, by counting.
  derivation:
    - text: |
        **Theorem (rank-nullity).** Let $T: V \to W$ be linear with $V$ finite-dimensional. Then

        $$\dim V = \dim\ker T + \dim\operatorname{im}T.$$

        The dimension of the image is called the **rank** of $T$ and the dimension of the kernel its **nullity**.

        *Proof.* Let $\mathbf{k}_1, \dots, \mathbf{k}_p$ be a basis of $\ker T$. Extend it to a basis of $V$ by adding vectors $\mathbf{v}_1, \dots, \mathbf{v}_r$, so that $\dim V = p + r$. The claim is that $T(\mathbf{v}_1), \dots, T(\mathbf{v}_r)$ is a basis of $\operatorname{im}T$, which gives $\dim\operatorname{im}T = r$.

        *They span the image.* Any vector of $V$ is $\sum a_i\mathbf{k}_i + \sum b_j\mathbf{v}_j$. Applying $T$ kills the first sum, leaving $\sum b_jT(\mathbf{v}_j)$.

        *They are independent.* Suppose $\sum b_jT(\mathbf{v}_j) = \mathbf{0}$. Then $T(\sum b_j\mathbf{v}_j) = \mathbf{0}$, so $\sum b_j\mathbf{v}_j$ lies in the kernel and equals some $\sum a_i\mathbf{k}_i$. That is a linear relation among the vectors of a basis of $V$, so all coefficients are zero. In particular every $b_j = 0$. $\blacksquare$

        The proof shows more than the count. The added vectors $\mathbf{v}_j$ span a complement of the kernel, and $T$ maps that complement isomorphically onto the image: $V = \ker T \oplus U$ with $U \cong \operatorname{im}T$.

        **For matrices.** For $A$ with $n$ columns, the map $\mathbf{x} \mapsto A\mathbf{x}$ starts from $F^n$, and the theorem reads

        $$n = \dim N(A) + \operatorname{rank}A.$$

        In elimination: every column is a pivot column or a free column. Pivot columns count the rank and free columns count the null space.

        **Three consequences, none needing computation.**

        *More unknowns than equations.* If $T: V \to W$ with $\dim V > \dim W$, then $\dim\operatorname{im}T \le \dim W < \dim V$, so $\dim\ker T > 0$. A homogeneous linear system with more unknowns than equations always has a non-zero solution. Five vectors in $\mathbb{R}^3$ always satisfy a non-trivial relation.

        *Fewer unknowns than equations.* If $\dim V < \dim W$, then $\dim\operatorname{im}T \le \dim V < \dim W$. The map misses something. Three vectors cannot span $\mathbb{R}^5$.

        *Equal dimensions.* If $\dim V = \dim W$, then

        $$T \text{ injective} \iff \ker T = \{\mathbf{0}\} \iff \dim\operatorname{im}T = \dim W \iff T \text{ surjective}.$$

        For a square system, "at most one solution for every right-hand side" and "at least one solution for every right-hand side" are the same condition. To prove a square matrix invertible it is enough to show that $A\mathbf{x} = \mathbf{0}$ forces $\mathbf{x} = \mathbf{0}$.
    - question:
        id: derivation-kernel
        type: numeric
        system: s2
        prompt: |
          A linear map $T: \mathbb{R}^7 \to \mathbb{R}^4$ is surjective. What is the dimension of its kernel?
        answer: "3"
        explanation: |
          Surjective means the image is all of $\mathbb{R}^4$, of dimension 4. Then $\dim\ker T = 7 - 4 = 3$. In terms of equations: four independent equations in seven unknowns leave three degrees of freedom. If the map were not known to be surjective, the theorem would still give a bound: the image has dimension at most 4, so the kernel has dimension at least 3.
    - text: |
        **Interpolation.** Let $t_0, \dots, t_n$ be $n + 1$ different numbers. Define

        $$E: P_n \to F^{n+1}, \qquad E(p) = (p(t_0), \dots, p(t_n)).$$

        $E$ is linear, since evaluation is. If $E(p) = \mathbf{0}$ then $p$ has $n + 1$ different roots and degree at most $n$, so $p = 0$. Hence $\ker E = \{\mathbf{0}\}$. Both spaces have dimension $n + 1$, so $E$ is also surjective. **For any $n + 1$ values there is exactly one polynomial of degree at most $n$ taking them at the given places.**

        In the basis $1, t, \dots, t^n$ the map $E$ is the matrix whose row $i$ is $(1, t_i, t_i^2, \dots, t_i^n)$, the matrix in the starter. The argument shows that it is invertible whenever the places are different, with no determinant computed. It says nothing about how **well-conditioned** it is, which the last cluster showed can be very badly.

        **Where it fails: infinite dimensions.** On the space $P$ of all polynomials, differentiation is surjective and not injective: every polynomial is a derivative, and constants are killed. Multiplication by $x$ is injective and not surjective: nothing has image 1. The equivalence of injective and surjective needs a finite dimension to count against. A set can be put in bijection with a proper part of itself only if it is infinite, and something like that is true of spaces.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of the proof of the rank-nullity theorem.
        steps:
          - 'Choose a basis of the kernel.'
          - 'Extend it to a basis of the whole space by adding further vectors.'
          - 'Apply the map to a general vector: the kernel part vanishes, so the images of the added vectors span the image.'
          - 'Show those images are independent: a relation among them would put a combination of the added vectors into the kernel, contradicting independence of the full basis.'
          - 'Count: the dimension of the space is the number of kernel vectors plus the number of added vectors.'
        explanation: The proof splits a basis of the space into the part the map destroys and the part it carries faithfully to a basis of the image.
  formal:
    - text: |
        Let $T: V \to W$ be linear and $V$ finite-dimensional.

        **Rank-nullity.** $\dim V = \dim\ker T + \dim\operatorname{im}T$. Moreover, if $U$ is any complement of $\ker T$ in $V$, the restriction of $T$ to $U$ is an isomorphism onto $\operatorname{im}T$.

        **Matrix form.** For $A \in F^{m \times n}$: $n = \operatorname{rank}A + \dim N(A)$, and likewise $m = \operatorname{rank}A + \dim N(A^\top)$, using $\operatorname{rank}A^\top = \operatorname{rank}A$.

        **Corollaries.**

        - If $\dim V > \dim W$, no linear map $V \to W$ is injective.
        - If $\dim V < \dim W$, no linear map $V \to W$ is surjective.
        - If $\dim V = \dim W$ is finite, then $T$ is injective $\iff$ $T$ is surjective $\iff$ $T$ is an isomorphism.
        - Finite-dimensional $V$ and $W$ are isomorphic if and only if they have the same dimension.

        **Interpolation.** For distinct $t_0, \dots, t_n \in F$ and any $y_0, \dots, y_n \in F$ there is exactly one $p \in P_n(F)$ with $p(t_i) = y_i$ for all $i$.

        **Rank of a composition.** $\operatorname{rank}(ST) \le \min(\operatorname{rank}S, \operatorname{rank}T)$.
