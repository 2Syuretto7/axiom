        explanation: |
          `A @ psi` treats the functional as a vector and pushes it forward through the map. A functional goes the other way: $\psi \circ T$ is the row $\boldsymbol\psi A$, and stored as a flat array that is `A.T @ psi`.

          With a square matrix nothing complains, because the shapes fit either way. With a map between spaces of different dimensions the wrong version would have raised an error at once, which is a reason to test such code on non-square matrices.

          This function is the heart of reverse-mode differentiation. A loss is a number computed from the output of a chain of maps, so its sensitivity to the output is a functional. Passing that functional back through each layer, by the transpose of the layer's matrix, gives the sensitivity to the input. Gradients travel backwards through a network because functionals pull back.
    - question:
        id: work-annihilator
        type: numeric
        system: s2
        prompt: |
          A 4 by 7 matrix $A$ has rank 3. Consider the rows $\mathbf{y}$ of length 4 with $\mathbf{y}A = \mathbf{0}$. What is the dimension of the space they form?
        answer: "1"
        explanation: |
          $\mathbf{y}A = \mathbf{0}$ says that the functional $\mathbf{y}$ vanishes on every column of $A$, so on the whole column space. These rows are the annihilator of the image, of dimension $4 - 3 = 1$. Equivalently they are the kernel of $A^\top$, and rank-nullity for $A^\top$, which is 7 by 4 of rank 3, gives $4 - 3 = 1$ again. In the lesson on orthogonal subspaces this space appeared as the left null space, the vectors perpendicular to the column space. The annihilator is the same idea without needing a dot product.
    - question:
        id: work-units
        type: choice
        system: s2
        prompt: |
          A model has one parameter, a length $x$ in metres, and the slope of its loss is $g$ per metre. The same length is now recorded in centimetres. What happens to the two numbers, and why?
        options:
          - 'Both are multiplied by 100, since both describe the same quantity.'
          - 'The coordinate is multiplied by 100 and the slope is divided by 100. The coordinate belongs to a vector and the slope to a functional, and they must change oppositely so that slope times displacement, a change in loss, stays the same.'
          - 'Neither changes. Units do not affect mathematics.'
          - 'The coordinate is divided by 100 and the slope multiplied by 100.'
        answer: 1
        explanation: |
          The new basis vector is one centimetre, $P = (0.01)$. Vector coordinates become $P^{-1}x = 100x$, and functional rows become $gP = g/100$. Their product is unchanged, as it must be: it is a number that does not care about units. One consequence is that the rule "new parameters = old parameters minus a step size times the slope" subtracts a functional from a vector, and its result depends on the units chosen. Rescale a parameter and plain gradient descent takes a different path. Much of the craft of optimisation is a response to this fact.
    - question:
        id: work-not-natural
        type: choice
        system: s2
        prompt: |
          $V$ and $V^*$ have the same dimension, so they are isomorphic. Why does one still keep them apart?
        options:
          - 'They are not really isomorphic, since functionals are not vectors.'
          - 'An isomorphism exists, but each one depends on a choice. Sending each basis vector to its dual basis functional gives a different map for a different basis, and no choice-free candidate exists. Only extra structure, such as a dot product, singles one out.'
          - 'Because the dual space has no zero vector.'
          - 'Because the dual space is over a different field.'
        answer: 1
        explanation: |
          For the basis $(1, 1), (1, 2)$ the dual basis was $(2, -1), (-1, 1)$, so "turn each basis vector into its dual functional" sends $(1, 1)$ to the row $(2, -1)$. For the standard basis the same recipe sends $(1, 1)$ to the row $(1, 1)$. The identification moves when the basis moves. In $\mathbb{R}^n$ we have always identified the column $\mathbf{a}$ with the functional $\mathbf{x} \mapsto \mathbf{a} \cdot \mathbf{x}$, and that used the dot product. A dot product is exactly the extra structure that ties a space to its dual, and it is the subject of the next lesson.
  connections:
    - text: |
        Simpson's rule computes an integral from three values because integration and evaluation are **linear functionals** on quadratics, the functionals form the **dual space**, of dimension 3, and three evaluations are a basis of it. Every basis of a space has a **dual basis** of coordinate functionals, which in $\mathbb{R}^n$ are the rows of $P^{-1}$.

        A linear map $T$ has a **dual map** $\psi \mapsto \psi \circ T$ that carries functionals backwards, and its matrix is the **transpose**. The kernel of the dual map is the annihilator of the image, and from that the rank of a matrix equals the rank of its transpose. Under a change of basis, vectors and functionals change in opposite ways, so that a functional applied to a vector is the same number in every basis.

        Until now, a column $\mathbf{a}$ and the functional "take the dot product with $\mathbf{a}$" have been treated as the same object. That identification is not free. It is made by the dot product, and a different way of multiplying vectors would make it differently. The next lesson asks what a dot product is, abstractly, and finds that spaces of polynomials, of matrices and of random quantities all carry one, with lengths and right angles to match: [[m6.inner-product-spaces]].
