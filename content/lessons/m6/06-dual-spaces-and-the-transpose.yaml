concept: m6.dual-spaces-and-the-transpose
minutes: 90
claim: You can say what a linear functional is and recognise examples such as evaluation and integration, describe the dual space and compute the dual basis of a given basis, define the dual of a linear map as composition and show that its matrix is the transpose, use annihilators to explain why the row rank of a matrix equals its column rank, and say how the coordinates of vectors and of functionals change in opposite ways when the basis changes.
recalls: [m6.matrix-of-a-linear-map-and-similarity]
uses: [m6.rank-nullity-theorem, m6.linear-maps-kernel-and-image, m6.subspaces-sums-and-direct-sums, m6.fields-and-the-vector-space-axioms, m5.transpose, m5.rank, m5.identity-and-inverse, m5.change-of-basis, m5.basis-and-dimension, m7.orthogonal-subspaces, m4.dot-product, m1.polynomials, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m6.inner-product-spaces, m6.adjoints-orthogonal-and-unitary-maps]
starter: |
  # Scratch space. Three numbers w such that, for every quadratic p,
  # the integral of p from -1 to 1 equals
  # w[0] * p(-1) + w[1] * p(0) + w[2] * p(1).
  import numpy as np

  nodes = [-1.0, 0.0, 1.0]
  V = np.array([[t ** k for k in range(3)] for t in nodes])
  moments = np.array([2.0, 0.0, 2.0 / 3.0])
  w = np.linalg.solve(V.T, moments)
  print([round(float(c), 4) for c in w])
parts:
  recall:
    - text: |
        [[m6.matrix-of-a-linear-map-and-similarity]] read a matrix by its columns: each column is where a basis vector goes. Today reads a matrix by its rows, and finds out what the transpose has meant all along. Three quick pulls first.
  puzzle:
    - text: |
        Simpson's rule says that for every quadratic polynomial $p$,

        $$\int_{-1}^{1} p(x)\,dx = \tfrac13\,p(-1) + \tfrac43\,p(0) + \tfrac13\,p(1).$$

        The starter finds those weights by solving one linear system.

        ```
        [0.3333, 1.3333, 0.3333]
        ```

        This is a strange thing to be possible. An integral looks at a polynomial over a whole interval. The right-hand side looks at it in three places only. And the three weights do not depend on the polynomial.

        Notice also the system that was solved. `V` has one row for each point, holding $1, t, t^2$. The weights came from solving with `V.T`, the transpose, and not with `V`.

        **Why can the integral of every quadratic be read off from three of its values? And what is the transpose doing there?**
  intuition:
    - text: |
        "Integrate from $-1$ to $1$" is a machine that takes a polynomial and returns one number. So is "evaluate at $0$". Both machines are linear: the integral of a sum is the sum of the integrals, and the same holds for values. A linear machine from a vector space to its field of scalars is called a **linear functional**.

        Functionals on a space can be added to each other and multiplied by scalars, and the results are functionals again. So they form a vector space of their own, the **dual space**. The surprise is its size: for a space of dimension $n$, the dual space also has dimension $n$. A functional is fixed by its values on a basis, and that is $n$ numbers.

        Quadratics form a space of dimension 3, so their dual has dimension 3. Evaluation at $-1$, at $0$ and at $1$ are three functionals, and they are independent. So they are a basis of the dual space, and **every** functional on quadratics is a combination of them. Integration is a functional. Simpson's rule is integration written in that basis, and its weights are coordinates.

        In $\mathbb{R}^n$ a functional is a **row**: the row $(a_1, \dots, a_n)$ sends the column $\mathbf{x}$ to the number $a_1x_1 + \dots + a_nx_n$. Vectors are columns and functionals are rows, and the product of a row and a column is a number. That is the pattern of the whole lesson. The transpose is what a linear map does to the rows.
  derivation:
    - text: |
        **Functionals and the dual space.** A **linear functional** on a vector space $V$ over $F$ is a linear map $\varphi: V \to F$. The set of all of them, with pointwise addition and scaling, is the **dual space** $V^*$.

        Examples.

        - On $\mathbb{R}^3$: $\varphi(x, y, z) = 2x - y + 5z$, the row $(2, -1, 5)$.
        - On polynomials: evaluation $\operatorname{ev}_t(p) = p(t)$, and integration $p \mapsto \int_{-1}^{1} p$.
        - On square matrices: the trace.
        - On random quantities: the expectation.

        Squaring the first coordinate, or taking the length, is **not** a functional: neither is linear.

        **The dual basis.** Let $\mathbf{b}_1, \dots, \mathbf{b}_n$ be a basis of $V$. Define $\varphi_i$ as the functional that reads off the $i$th coordinate:

        $$\varphi_i(c_1\mathbf{b}_1 + \dots + c_n\mathbf{b}_n) = c_i, \qquad\text{so}\qquad \varphi_i(\mathbf{b}_j) = \begin{cases} 1 & i = j \\ 0 & i \ne j. \end{cases}$$

        These are a basis of $V^*$, the **dual basis**. Any functional $\varphi$ equals $\varphi(\mathbf{b}_1)\varphi_1 + \dots + \varphi(\mathbf{b}_n)\varphi_n$, since both sides agree on every basis vector. Hence $\dim V^* = \dim V$.

        *In coordinates.* Put the basis vectors of $\mathbb{R}^n$ in the columns of $P$. The dual basis is the rows of $P^{-1}$, because $P^{-1}P = I$ says exactly that row $i$ times column $j$ is 1 or 0. For the basis $(1, 1), (1, 2)$ of the plane:

        $$P = \begin{pmatrix} 1 & 1 \\ 1 & 2 \end{pmatrix}, \qquad P^{-1} = \begin{pmatrix} 2 & -1 \\ -1 & 1 \end{pmatrix},$$

        so $\varphi_1 = (2, -1)$ and $\varphi_2 = (-1, 1)$. The coordinates of $(3, 4)$ in this basis are $\varphi_1(3, 4) = 2$ and $\varphi_2(3, 4) = 1$, and indeed $(3, 4) = 2(1, 1) + 1(1, 2)$.

        Note that $\varphi_1$ is not determined by $\mathbf{b}_1$ alone. Change $\mathbf{b}_2$ and $\varphi_1$ changes too. The dual basis belongs to the basis as a whole.
    - question:
        id: derivation-functional
        type: numeric
        system: s2
        prompt: |
          A linear functional $\varphi$ on $\mathbb{R}^2$ has $\varphi(1, 1) = 3$ and $\varphi(1, 2) = 5$. What is $\varphi(0, 1)$?
        answer: "2"
        explanation: |
          $(0, 1) = (1, 2) - (1, 1)$, and $\varphi$ is linear, so $\varphi(0, 1) = 5 - 3 = 2$. Likewise $\varphi(1, 0) = 3 - 2 = 1$, so $\varphi$ is the row $(1, 2)$. Two values on a basis fixed the whole functional. In the dual basis found above, $\varphi = 3\varphi_1 + 5\varphi_2 = 3(2, -1) + 5(-1, 1) = (1, 2)$.
    - text: |
        **Simpson's rule, explained.** In $P_2$ with the basis $1, x, x^2$, the functional $\operatorname{ev}_t$ is the row $(1, t, t^2)$, since $p(t) = c_0 + c_1t + c_2t^2$. Integration over $[-1, 1]$ is the row $(2, 0, \tfrac23)$, since $\int 1 = 2$, $\int x = 0$, $\int x^2 = \tfrac23$. We want weights with

        $$w_1(1, -1, 1) + w_2(1, 0, 0) + w_3(1, 1, 1) = (2, 0, \tfrac23).$$

        The rows of $V$ are the evaluation functionals. A combination of the **rows** of $V$ with weights $\mathbf{w}$ is $V^\top\mathbf{w}$. That is why the starter solved with the transpose.

        **The dual of a map.** Let $T: V \to W$ be linear. A functional $\psi$ on $W$ can be turned into a functional on $V$: first apply $T$, then $\psi$. This defines the **dual map**

        $$T^*: W^* \to V^*, \qquad T^*(\psi) = \psi \circ T.$$

        It is linear, and it runs backwards: $T$ carries vectors from $V$ to $W$, and $T^*$ carries functionals from $W$ back to $V$.

        *Example.* $D$ is differentiation on $P_2$ and $\psi = \operatorname{ev}_2$. Then $D^*(\psi)$ is the functional "differentiate, then evaluate at 2", the slope at 2.

        **Its matrix is the transpose.** In coordinates $T$ is $\mathbf{x} \mapsto A\mathbf{x}$ and $\psi$ is a row $\mathbf{a}$. Then $\psi \circ T$ sends $\mathbf{x}$ to $\mathbf{a}(A\mathbf{x}) = (\mathbf{a}A)\mathbf{x}$, so it is the row $\mathbf{a}A$. Written as a column, that is $A^\top\mathbf{a}^\top$. So with respect to the dual bases,

        > **the matrix of $T^*$ is $A^\top$.**

        For the example: $(1, 2, 4)$ times the matrix of $D$ is $(0, 1, 4)$, the functional $c_1 + 4c_2$, which is indeed the slope of $c_0 + c_1x + c_2x^2$ at $x = 2$.

        The rule $(AB)^\top = B^\top A^\top$ now needs no computation with entries. $(S \circ T)^*(\psi) = \psi \circ S \circ T = T^*(S^*(\psi))$. Maps that run backwards compose in the reverse order.

        **Annihilators, and why row rank equals column rank.** For a subspace $U$ of $V$, the **annihilator** $U^0$ is the set of functionals that vanish on all of $U$. It is a subspace of $V^*$, and

        $$\dim U^0 = \dim V - \dim U.$$

        (Extend a basis of $U$ to a basis of $V$. The dual basis functionals belonging to the added vectors are a basis of $U^0$.)

        Now ask which functionals $\psi$ on $W$ are killed by $T^*$. $\psi \circ T = 0$ means that $\psi$ vanishes on everything $T$ produces. So

        $$\ker T^* = (\operatorname{im} T)^0.$$

        Its dimension is $\dim W - \operatorname{rank} T$. By rank-nullity applied to $T^*$, whose domain $W^*$ has dimension $\dim W$,

        $$\operatorname{rank} T^* = \dim W - (\dim W - \operatorname{rank} T) = \operatorname{rank} T.$$

        In matrices: $A^\top$ and $A$ have the same rank. The number of independent rows equals the number of independent columns, for a reason that has nothing to do with elimination.

        **Vectors and functionals change in opposite ways.** Change basis by $P$, whose columns are the new basis vectors. Coordinates of a vector go from $\mathbf{x}$ to $P^{-1}\mathbf{x}$. A functional with row $\mathbf{a}$ must still give the same number, $\mathbf{a}\mathbf{x} = (\mathbf{a}P)(P^{-1}\mathbf{x})$, so its row becomes $\mathbf{a}P$. Measure a length in centimetres instead of metres: the coordinate is multiplied by 100, and a price per unit of length is divided by 100. The total price is unchanged.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that a matrix and its transpose have the same rank.
        steps:
          - 'The transpose is the matrix of the dual map, which sends a functional $\psi$ to $\psi \circ T$.'
          - 'The dual map kills $\psi$ exactly when $\psi$ vanishes on the image of $T$.'
          - 'So the kernel of the dual map is the annihilator of the image, of dimension $\dim W - \operatorname{rank} T$.'
          - 'Rank-nullity for the dual map gives its rank as $\dim W$ minus that.'
          - 'Hence the rank of the dual map equals the rank of $T$.'
        explanation: Each step uses one definition. The kernel of the dual map is found first, and rank-nullity converts it into a rank.
  formal:
    - text: |
        Let $V, W$ be vector spaces over $F$, finite-dimensional unless stated.

        **Dual space.** $V^* = \mathcal{L}(V, F)$. Its elements are linear functionals.

        **Dual basis.** For a basis $(\mathbf{b}_j)$ of $V$ there are unique $\varphi_i \in V^*$ with $\varphi_i(\mathbf{b}_j) = \delta_{ij}$. They form a basis of $V^*$, $\varphi = \sum_i \varphi(\mathbf{b}_i)\varphi_i$ for $\varphi \in V^*$, and $\mathbf{v} = \sum_i \varphi_i(\mathbf{v})\mathbf{b}_i$ for $\mathbf{v} \in V$. So $\dim V^* = \dim V$.

        **Dual map.** For $T \in \mathcal{L}(V, W)$, $T^*: W^* \to V^*$ is $T^*(\psi) = \psi \circ T$. It is linear, $(S \circ T)^* = T^* \circ S^*$, and $(\lambda S + T)^* = \lambda S^* + T^*$. If $A$ is the matrix of $T$ in bases $\mathcal{B}, \mathcal{C}$, then the matrix of $T^*$ in the dual bases is $A^\top$.

        **Annihilator.** $U^0 = \{\varphi \in V^* : \varphi(\mathbf{u}) = 0 \text{ for all } \mathbf{u} \in U\}$, with $\dim U^0 = \dim V - \dim U$.

        **Kernel and image of the dual map.** $\ker T^* = (\operatorname{im} T)^0$ and $\operatorname{im} T^* = (\ker T)^0$. Hence $\operatorname{rank} T^* = \operatorname{rank} T$, and $T$ is injective if and only if $T^*$ is surjective, and the other way round.

        **Double dual.** Each $\mathbf{v} \in V$ gives a functional on $V^*$, namely $\varphi \mapsto \varphi(\mathbf{v})$. This map $V \to V^{**}$ is linear and injective, and for finite-dimensional $V$ it is an isomorphism that involves no choice of basis.

        **Change of basis.** If the columns of $P$ are a new basis, coordinates of vectors become $P^{-1}\mathbf{x}$ and rows of functionals become $\mathbf{a}P$.

        **Infinite dimension.** $V^*$ is still defined, but can be strictly larger than $V$, and the map to the double dual need not be surjective.
  drill:
