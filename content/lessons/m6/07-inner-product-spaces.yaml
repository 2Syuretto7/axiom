            import numpy as np


            def gram(n):
                return np.array([[2.0 / (i + j + 1) if (i + j) % 2 == 0 else 0.0 for j in range(n)] for i in range(n)])


            def inner(p, q):
                return float(p @ gram(len(p)) @ q)


            def norm(p):
                return inner(p, p)


            print("0.6667 0.0 0.8165")
        explanation: |
          Once the Gram matrix is known, an inner product on a space of functions becomes a computation with coefficient arrays: $\mathbf{p}^\top G\mathbf{q}$. No integral is evaluated at run time.

          `p @ q` alone, the third wrong version, is also an inner product on polynomials, and a perfectly legitimate one. It is the one for which the monomials are orthonormal. It is just not the integral. The second wrong version is the Gram matrix for the interval $[0, 1]$, known as the Hilbert matrix. It has no zeros, because on $[0, 1]$ no two monomials are orthogonal, and it is a famous example of a badly conditioned matrix: the monomials there point in nearly the same direction.
    - question:
        id: write-orthogonalise
        type: code
        mode: write
        system: s2
        prompt: |
          Write `orthogonalise(vectors, G)`. `vectors` is a list of independent coordinate arrays and `G` is a Gram matrix, so that the inner product of `u` and `v` is `u @ G @ v`. Return a list of arrays, orthogonal for that inner product, by Gram-Schmidt: from each vector subtract its projections onto the vectors already produced. Do not normalise.
        starter: |
          import numpy as np


          def orthogonalise(vectors, G):
              return [v * 1.0 for v in vectors]


          G = np.array([[2.0 / (i + j + 1) if (i + j) % 2 == 0 else 0.0 for j in range(4)] for i in range(4)])
          for q in orthogonalise(list(np.eye(4)), G):
              print([round(float(c), 4) + 0.0 for c in q])
        solution: |
          import numpy as np


          def orthogonalise(vectors, G):
              result = []
              for v in vectors:
                  w = v * 1.0
                  for q in result:
                      w = w - (v @ G @ q) / (q @ G @ q) * q
                  result.append(w)
              return result


          G = np.array([[2.0 / (i + j + 1) if (i + j) % 2 == 0 else 0.0 for j in range(4)] for i in range(4)])
          for q in orthogonalise(list(np.eye(4)), G):
              print([round(float(c), 4) + 0.0 for c in q])
