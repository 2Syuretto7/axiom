          assert _np.allclose(_Q[2], [-1 / 3, 0.0, 1.0, 0.0]), "The third polynomial should be x^2 - 1/3"
          assert _np.allclose(_Q[3], [0.0, -0.6, 0.0, 1.0]), "The fourth polynomial should be x^3 - (3/5) x"
