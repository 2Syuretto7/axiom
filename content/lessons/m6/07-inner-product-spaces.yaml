    - text: |
        Seconds each.
    - question:
        id: drill-axioms
        type: choice
        system: s1
        prompt: |
          Which is **not** one of the axioms of a real inner product?
        options: ['Symmetry', 'The inner product of two vectors is at most 1', 'Linearity in each slot', 'Positivity of $\langle \mathbf{v}, \mathbf{v} \rangle$ for nonzero $\mathbf{v}$']
        answer: 1
        explanation: There is no bound on its size.
    - question:
        id: drill-norm
        type: choice
        system: s1
        prompt: |
          The norm that comes from an inner product is
        options: ['$\langle \mathbf{v}, \mathbf{v} \rangle$', '$\sqrt{\langle \mathbf{v}, \mathbf{v} \rangle}$', '$\langle \mathbf{v}, \mathbf{v} \rangle^2$', '$|\mathbf{v}|$ entry by entry']
        answer: 1
        explanation: The square root, as for the dot product.
    - question:
        id: drill-orthogonal
        type: choice
        system: s1
        prompt: |
          Two vectors of an inner product space are orthogonal when
        options: ['their inner product is 1', 'their inner product is 0', 'they have the same norm', 'one is a multiple of the other']
        answer: 1
        explanation: That is the definition.
    - question:
        id: drill-one-x
        type: numeric
        system: s1
        prompt: |
          With $\langle p, q \rangle = \int_{-1}^{1} p(x)q(x)\,dx$, what is $\langle 1, x \rangle$?
        answer: "0"
        explanation: The integral of an odd function over a symmetric interval vanishes.
    - question:
        id: drill-one-one
        type: numeric
        system: s1
        prompt: |
          With the same inner product, what is $\langle 1, 1 \rangle$?
        answer: "2"
        explanation: The length of the interval. So the constant 1 has norm $\sqrt2$, not 1.
    - question:
        id: drill-weighted
        type: numeric
        system: s1
        prompt: |
          With $\langle \mathbf{x}, \mathbf{y} \rangle = x_1y_1 + 3x_2y_2$, what is the inner product of $(1, 1)$ and $(1, -1)$?
        answer: "-2"
        explanation: $1 - 3$. These two are perpendicular for the dot product and not for this one.
    - question:
        id: drill-fails
        type: choice
        system: s1
        prompt: |
          $\langle \mathbf{x}, \mathbf{y} \rangle = x_1y_1 - x_2y_2$ fails to be an inner product because
        options: ['it is not symmetric', 'it is not positive definite', 'it is not linear', 'it is not defined']
        answer: 1
        explanation: $(0, 1)$ would have a negative square, and $(1, 1)$ a zero one.
    - question:
        id: drill-gram
        type: choice
        system: s1
        prompt: |
          Entry $(i, j)$ of the Gram matrix of a basis is
        options: ['the $j$th coordinate of $\mathbf{b}_i$', '$\langle \mathbf{b}_i, \mathbf{b}_j \rangle$', '$\|\mathbf{b}_i\| + \|\mathbf{b}_j\|$', '1 if $i = j$ and 0 otherwise']
        answer: 1
        explanation: The table of all inner products of basis vectors.
    - question:
        id: drill-gram-formula
        type: choice
        system: s1
        prompt: |
          In coordinates $\mathbf{x}, \mathbf{y}$ with Gram matrix $G$, the real inner product is
        options: ['$\mathbf{x}^\top\mathbf{y}$', '$\mathbf{x}^\top G\,\mathbf{y}$', '$G\mathbf{x} + G\mathbf{y}$', '$\mathbf{x}^\top G^{-1}\mathbf{y}$']
        answer: 1
        explanation: Expand both vectors in the basis and use linearity in each slot.
    - question:
        id: drill-gram-orthonormal
        type: choice
        system: s1
        prompt: |
          The Gram matrix of an orthonormal basis is
        options: ['zero', 'the identity', 'diagonal with arbitrary entries', 'all ones']
        answer: 1
        explanation: Inner products are 1 on the diagonal and 0 off it.
    - question:
        id: drill-complex
        type: numeric
        system: s1
        prompt: |
          With the complex inner product $\langle \mathbf{z}, \mathbf{w} \rangle = \sum z_k\overline{w_k}$, what is $\langle \mathbf{z}, \mathbf{z} \rangle$ for $\mathbf{z} = (1, i)$?
        answer: "2"
        explanation: $1 \cdot 1 + i \cdot (-i) = 2$. Without the conjugate it would be 0.
    - question:
        id: drill-conj-symmetry
        type: choice
        system: s1
        prompt: |
          In a complex inner product space, $\langle \mathbf{v}, \mathbf{u} \rangle$ equals
        options: ['$\langle \mathbf{u}, \mathbf{v} \rangle$', 'the conjugate of $\langle \mathbf{u}, \mathbf{v} \rangle$', '$-\langle \mathbf{u}, \mathbf{v} \rangle$', '$|\langle \mathbf{u}, \mathbf{v} \rangle|$']
        answer: 1
        explanation: Conjugate symmetry.
    - question:
        id: drill-riesz
        type: choice
        system: s1
        prompt: |
          On a finite-dimensional inner product space, every linear functional has the form
        options: ['$\mathbf{v} \mapsto \|\mathbf{v}\|$', '$\mathbf{v} \mapsto \langle \mathbf{v}, \mathbf{a} \rangle$ for one fixed $\mathbf{a}$', '$\mathbf{v} \mapsto \langle \mathbf{v}, \mathbf{v} \rangle$', '$\mathbf{v} \mapsto \mathbf{a}$']
        answer: 1
        explanation: The inner product identifies the space with its dual.
    - question:
        id: predict-frobenius
        type: predict
        system: s1
        prompt: Two ways of taking an inner product of matrices. What does this show?
        code: |
          import numpy as np

          A = np.array([[1.0, 2.0], [3.0, 4.0]])
          B = np.array([[0.0, 1.0], [1.0, 0.0]])
          print(float(np.trace(A.T @ B)), float((A * B).sum()))
          print(float(np.trace(A.T @ A)), round(float(np.linalg.norm(A)) ** 2, 4))
        output: |
          5.0 5.0
          30.0 30.0
        explanation: The trace of A transpose B is the sum of products of matching entries. The inner product of A with itself is the sum of the squares of its entries, the square of the norm that `np.linalg.norm` gives for a matrix.
    - question:
        id: predict-gram
        type: predict
        system: s1
        prompt: The Gram matrix of 1, x, x^2 for the integral from -1 to 1. What does this show?
        code: |
          import numpy as np

          G = np.array([[2.0 / (i + j + 1) if (i + j) % 2 == 0 else 0.0 for j in range(3)] for i in range(3)])
          one = np.array([1.0, 0.0, 0.0])
          x = np.array([0.0, 1.0, 0.0])
          q = np.array([-1.0 / 3.0, 0.0, 1.0])
          print(round(float(one @ G @ x), 4), round(float(one @ G @ q), 4) + 0.0, round(float(x @ G @ q), 4))
          print(round(float(q @ G @ q), 4))
        output: |
          0.0 0.0 0.0
          0.1778
        explanation: The polynomials 1, x and x^2 - 1/3 are mutually orthogonal for the integral inner product. The last number is the squared norm of x^2 - 1/3, which is 8/45.
  work:
    - text: Slower now. In each task the only change from the orthogonality cluster is which inner product is used.
    - question:
        id: write-inner
        type: code
        mode: write
        system: s2
        prompt: |
          Polynomials are coefficient arrays, lowest power first. Write `gram(n)`: the $n \times n$ Gram matrix of $1, x, \dots, x^{n-1}$ for $\langle p, q \rangle = \int_{-1}^{1} p\,q$. Its entry $(i, j)$ is $\frac{2}{i + j + 1}$ if $i + j$ is even and 0 otherwise. Then write `inner(p, q)` for two coefficient arrays of the same length, and `norm(p)`.
        starter: |
          import numpy as np


          def gram(n):
              return np.eye(n)


          def inner(p, q):
              return 0.0


          def norm(p):
              return 0.0


          x = np.array([0.0, 1.0, 0.0])
          x2 = np.array([0.0, 0.0, 1.0])
          one = np.array([1.0, 0.0, 0.0])
          print(round(inner(one, x2), 4), round(inner(x, x2), 4), round(norm(x), 4))
        solution: |
          import numpy as np


          def gram(n):
              return np.array([[2.0 / (i + j + 1) if (i + j) % 2 == 0 else 0.0 for j in range(n)] for i in range(n)])


          def inner(p, q):
              return float(p @ gram(len(p)) @ q)


          def norm(p):
              return float(np.sqrt(inner(p, p)))


          x = np.array([0.0, 1.0, 0.0])
          x2 = np.array([0.0, 0.0, 1.0])
          one = np.array([1.0, 0.0, 0.0])
          print(round(inner(one, x2), 4), round(inner(x, x2), 4), round(norm(x), 4))
        tests: |
          import numpy as _np
          _G = gram(3)
          assert _np.shape(_G) == (3, 3), "gram(3) should be 3 by 3"
          assert _np.allclose(_G, [[2.0, 0.0, 2 / 3], [0.0, 2 / 3, 0.0], [2 / 3, 0.0, 2 / 5]]), "The Gram matrix of 1, x, x^2 on [-1, 1] has rows (2, 0, 2/3), (0, 2/3, 0), (2/3, 0, 2/5)"
          assert _np.allclose(gram(4)[1], [0.0, 2 / 3, 0.0, 2 / 5]), "Row 1 of gram(4) is (0, 2/3, 0, 2/5): the integrals of x, x^2, x^3, x^4"
          _one = _np.array([1.0, 0.0, 0.0]); _x = _np.array([0.0, 1.0, 0.0]); _x2 = _np.array([0.0, 0.0, 1.0])
          assert abs(inner(_one, _x2) - 2 / 3) < 1e-9, "The integral of x^2 from -1 to 1 is 2/3"
          assert abs(inner(_x, _x2)) < 1e-9, "x and x^2 are orthogonal: the integral of x^3 over [-1, 1] is 0"
          assert abs(inner(_np.array([1.0, 2.0]), _np.array([3.0, -1.0])) - (6.0 - 4.0 / 3.0)) < 1e-9, "For 1 + 2x and 3 - x the product is 3 + 5x - 2x^2, with integral 6 - 4/3"
          assert abs(norm(_x) - (2 / 3) ** 0.5) < 1e-9, "The norm of x is the square root of 2/3"
          assert abs(norm(_np.array([1.0])) - 2 ** 0.5) < 1e-9, "The constant 1 has norm sqrt(2) on [-1, 1]"
          assert output.strip() == "0.6667 0.0 0.8165", "The program should print 0.6667 0.0 0.8165"
        wrong:
