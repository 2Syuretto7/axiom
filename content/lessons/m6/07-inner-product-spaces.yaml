    - question:
        id: fix-complex
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `inner(z, w)` should be the complex inner product $\sum_k z_k\overline{w_k}$ and `norm(z)` the length that comes from it. The program prints the norm of $(1, i)$, which must be $\sqrt2 \approx 1.4142$, and prints 0.0. Fix it.
        starter: |
          import numpy as np


          def inner(z, w):
              return (z * w).sum()


          def norm(z):
              return float(np.sqrt(inner(z, z).real))


          print(round(norm(np.array([1.0, 1j])), 4))
        solution: |
          import numpy as np


          def inner(z, w):
              return (z * w.conjugate()).sum()


          def norm(z):
              return float(np.sqrt(inner(z, z).real))


          print(round(norm(np.array([1.0, 1j])), 4))
        tests: |
          import numpy as _np
          _z = _np.array([1.0, 1j])
          _w = _np.array([1j, 2.0])
          assert abs(inner(_z, _z) - 2.0) < 1e-9, "The inner product of (1, i) with itself is 1 + i times (-i) = 2: conjugate the second vector"
          assert abs(inner(_z, _w) - 1j) < 1e-9, "For z = (1, i) and w = (i, 2) the inner product is 1 times (-i) plus i times 2, which is i"
          assert abs(inner(_w, _z) - _np.conjugate(inner(_z, _w))) < 1e-9, "Swapping the two vectors should conjugate the result"
          assert abs(inner(2j * _z, _w) - 2j * inner(_z, _w)) < 1e-9, "A scalar in the first slot should come out unchanged"
          assert abs(norm(_z) - 2 ** 0.5) < 1e-9, "The norm of (1, i) is sqrt(2)"
          assert abs(norm(_np.array([3.0, 4.0])) - 5.0) < 1e-9, "For real vectors the norm is the usual length: (3, 4) has norm 5"
          assert abs(norm(_np.array([3j, 4.0])) - 5.0) < 1e-9, "The norm of (3i, 4) is 5"
          assert output.strip() == "1.4142", "The program should print 1.4142"
        wrong:
          - |
            import numpy as np


            def inner(z, w):
                return (z * w).sum()


            def norm(z):
                return float(np.sqrt(inner(z, z).real))


            print("1.4142")
          - |
            import numpy as np


            def inner(z, w):
                return (z.conjugate() * w).sum()


            def norm(z):
                return float(np.sqrt(inner(z, z).real))


            print("1.4142")
          - |
            import numpy as np


            def inner(z, w):
                return (z.conjugate() * w.conjugate()).sum()


            def norm(z):
                return float(np.sqrt(inner(z, z).real))


            print("1.4142")
          - |
            import numpy as np


            def inner(z, w):
                return (z.real * w.real).sum()


            def norm(z):
                return float(np.sqrt(inner(z, z).real))


            print("1.4142")
        explanation: |
          Without the conjugate, $(1, i)$ has "length squared" $1 + i^2 = 0$, and a nonzero vector of length zero breaks every argument that divides by a norm. With it, each term is $z_k\overline{z_k} = |z_k|^2$, which is real and not negative.

          The second wrong version conjugates the first vector instead of the second. It also gives correct norms, and it is the other common convention, the one `np.vdot` follows. The tests here reject it only because the prompt fixed the convention: linear in the first slot. The two differ by a conjugate, and mixing them in one calculation is a classic source of sign errors in the imaginary part.
    - question:
        id: work-riesz
        type: choice
        system: s2
        prompt: |
          On $P_2$ with $\langle p, q \rangle = \int_{-1}^{1} p\,q$, the functional $\varphi(p) = \int_{-1}^{1} p(x)\,dx$ must equal $\langle p, a \rangle$ for exactly one polynomial $a$. Which one?
        options:
          - '$a(x) = x$'
          - '$a(x) = 1$, since $\langle p, 1 \rangle = \int_{-1}^{1} p(x) \cdot 1\,dx$.'
          - '$a(x) = x^2 - \tfrac13$'
          - 'No such polynomial exists.'
        answer: 1
        explanation: |
          The inner product with the constant 1 is the integral itself. The representing vector depends on the inner product: with the inner product that makes $1, x, x^2$ orthonormal, the same functional has coefficients $(2, 0, \tfrac23)$ and is represented by $2 + \tfrac23x^2$. A functional is one object, and the vector that stands for it is a matter of which inner product is in force. For evaluation at a point the representing polynomial is less obvious, but it exists, and finding it is a small linear system with the Gram matrix.
    - question:
        id: work-same-space
        type: choice
        system: s2
        prompt: |
          In what sense is every real inner product space of dimension $n$ "the same as" $\mathbb{R}^n$ with the dot product?
        options:
          - 'Its vectors are lists of $n$ numbers.'
          - 'Choosing an orthonormal basis, which Gram-Schmidt always provides, gives each vector coordinates, and in those coordinates the inner product of two vectors is the dot product of their coordinate lists. Lengths, angles and projections can all be computed there.'
          - 'Its Gram matrix is always the identity, in every basis.'
          - 'It is not the same in any sense.'
        answer: 1
        explanation: |
          The coordinate map for an orthonormal basis is an isomorphism of vector spaces that also preserves inner products. So no new theorem about finite-dimensional geometry can come from changing the inner product, and what was proved about orthogonality in $\mathbb{R}^n$ holds for polynomials and matrices at once. The Gram matrix is the identity only in orthonormal bases. In other bases it records how far the basis is from orthonormal, and it is what turns up as $A^\top A$ in the normal equations.
    - question:
        id: work-weighted
        type: numeric
        system: s2
        prompt: |
          Use $\langle \mathbf{x}, \mathbf{y} \rangle = x_1y_1 + 4x_2y_2$ on the plane. The projection of $(1, 1)$ onto the line spanned by $(1, 0)$ is $c\,(1, 0)$, and the projection onto the line spanned by $(1, 1)$ of the vector $(5, 0)$ is $d\,(1, 1)$. What is $d$?
        answer: "1"
        explanation: |
          $d = \dfrac{\langle (5, 0), (1, 1) \rangle}{\langle (1, 1), (1, 1) \rangle} = \dfrac{5}{1 + 4} = 1$. With the plain dot product it would have been $\tfrac52$. The weight 4 makes the second coordinate four times as costly, so the closest point on the line is pulled towards a smaller second coordinate. This is weighted least squares: observations with large weights are fitted more closely. (And $c = 1$, the same as for the dot product, since $(1, 0)$ has no second coordinate to weigh.)
  connections:
    - text: |
        Gram-Schmidt turned $1, x, x^2$ into $1, x, x^2 - \tfrac13$ because, for the integral of a product over $[-1, 1]$, the first two are already perpendicular and the third is not. An **inner product** is any rule on pairs of vectors that is symmetric (conjugate symmetric over $\mathbb{C}$), linear in a slot and positive definite. It gives a **norm** and a notion of **orthogonality**, and with them projections, Gram-Schmidt and closest points.

        In a basis the inner product is $\mathbf{x}^\top G\mathbf{y}$ with the **Gram matrix** $G$, and in an orthonormal basis it is the dot product of coordinates. Every functional is the inner product with one vector, which is how a space with an inner product is identified with its dual.

        One piece of the old geometry has not been carried over. The angle between two vectors was defined through $\cos\theta = \dfrac{\mathbf{u} \cdot \mathbf{v}}{\|\mathbf{u}\|\|\mathbf{v}\|}$, and that needs the fraction to lie between $-1$ and $1$. For arrows in the plane a picture shows it. For polynomials, matrices and random quantities there is no picture, and the claim has to be proved from the three axioms alone. It is the most used inequality in mathematics: [[m6.cauchy-schwarz-and-the-triangle-inequality]].
