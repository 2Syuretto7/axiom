            def gram(n):
                return np.array([[2.0 / (i + j + 1) for j in range(n)] for i in range(n)])


            def inner(p, q):
                return float(p @ gram(len(p)) @ q)


            def norm(p):
                return float(np.sqrt(inner(p, p)))


            print("0.6667 0.0 0.8165")
          - |
