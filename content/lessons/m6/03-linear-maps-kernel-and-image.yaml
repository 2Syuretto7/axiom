                    total = v[i] * images[i]
                return total


            print("[-2.0, 3.0]")
          - |
            import numpy as np


            def apply(images, v):
                total = images[0] * 0.0
                for i in range(len(v)):
                    total = total + v[i] + images[i]
                return total


            print("[-2.0, 3.0]")
        explanation: |
          $\mathbf{v} = v_1\mathbf{e}_1 + \dots + v_n\mathbf{e}_n$, so by linearity $T(\mathbf{v}) = v_1T(\mathbf{e}_1) + \dots + v_nT(\mathbf{e}_n)$. The loop added up the images and left out the coefficients, which computes $T(1, 1, \dots, 1)$ for every input.

          The last test is the point of the exercise. Put the images side by side as columns and the formula is the matrix-vector product: a matrix **is** the list of images of the basis vectors, and multiplying by it is extending by linearity. For a map between spaces that are not made of lists, the same recipe needs a choice of basis on each side first. What matrix results, and how it changes with the choice, comes two lessons from now.
    - question:
        id: work-which
        type: choice
        system: s2
        prompt: |
          Which of these maps from $P_2$ to $P_2$ is linear?
        options:
          - '$p \mapsto p + 1$'
          - '$p \mapsto x\,p''$, the derivative multiplied by $x$'
          - '$p \mapsto p \cdot p''$'
          - '$p \mapsto p(0)^2$, as a constant polynomial'
        answer: 1
        explanation: |
          $x(p + q)' = xp' + xq'$ and $x(ap)' = a\,xp'$, so the second is linear. It sends $1 \mapsto 0$, $x \mapsto x$, $x^2 \mapsto 2x^2$: each basis polynomial is multiplied by its own degree. Adding 1 does not send zero to zero. The third and fourth multiply two things that both depend on $p$, so doubling $p$ quadruples the output. A composition of linear maps, here differentiation followed by multiplication by $x$, is linear.
    - question:
        id: work-plus-c
        type: choice
        system: s2
        prompt: |
          All antiderivatives of a function differ by a constant. Which statement about linear maps is this an instance of?
        options:
          - 'A linear map sends zero to zero.'
          - 'If $T(\mathbf{u}) = \mathbf{w}$, the solutions of $T(\mathbf{x}) = \mathbf{w}$ are exactly $\mathbf{u} + \ker T$. Here $T$ is differentiation, whose kernel is the constants.'
          - 'The image of a linear map is a subspace.'
          - 'Every linear map has an inverse.'
        answer: 1
        explanation: |
          If $D(\mathbf{x}) = D(\mathbf{u})$ then $D(\mathbf{x} - \mathbf{u}) = 0$, so $\mathbf{x} - \mathbf{u}$ is in the kernel. The same statement, for a matrix, says that the general solution of $A\mathbf{x} = \mathbf{b}$ is a particular solution plus the null space, and for the pseudo-inverse lesson, that all solutions share their row space part. "Particular solution plus anything from the kernel" is one fact about linear maps, met three times under different names.
    - question:
        id: work-kernel-eval
        type: numeric
        system: s2
        prompt: |
          Let $T: P_3 \to \mathbb{R}^2$ send a polynomial to the pair of its values at 0 and at 1: $T(p) = (p(0), p(1))$. The image is all of $\mathbb{R}^2$. Given that the dimensions of kernel and image add up to the dimension of $P_3$, what is the dimension of the kernel?
        answer: "2"
        explanation: |
          $\dim P_3 = 4$ and the image has dimension 2, so the kernel has dimension 2. It consists of the polynomials of degree at most 3 that vanish at both 0 and 1, which are the multiples of $x(x - 1)$ by a polynomial of degree at most 1. A basis is $x(x - 1)$ and $x^2(x - 1)$. Each independent linear condition removes one dimension.
    - question:
        id: work-isomorphic
        type: choice
        system: s2
        prompt: |
          The 2 by 2 real matrices and the polynomials of degree at most 3 are both real vector spaces of dimension 4. What follows?
        options:
          - 'Nothing. Matrices and polynomials are different kinds of thing.'
          - 'They are isomorphic: send the basis $1, x, x^2, x^3$ to the four matrices with a single entry 1, and extend by linearity. Any statement about addition and scaling, such as "these five vectors are dependent", holds in one exactly when it holds in the other. Statements using more than that, such as matrix multiplication or evaluation at a point, are not transported.'
          - 'They are the same set.'
          - 'Every linear map between them is an isomorphism.'
        answer: 1
        explanation: |
          A linear map sending a basis to a basis is a bijection, and its inverse is linear. An isomorphism preserves precisely the vector space structure and nothing more. Matrices can be multiplied and polynomials can be evaluated, and those extra operations are not part of what "vector space" means, so the isomorphism has no duty to respect them. Knowing which structure a statement uses tells you which identifications it survives.
  connections:
    - text: |
        Differentiation took polynomials to polynomials, respected sums and multiples, and had no matrix in sight. A map between vector spaces that respects the two operations is **linear**. It sends zero to zero, and it is fixed completely by its values on a basis. What it sends to zero is its **kernel**, what it produces is its **image**, and both are subspaces. It is injective exactly when the kernel is zero, and the solutions of $T(\mathbf{x}) = \mathbf{w}$ are one solution plus the kernel, which is the "$+\,C$" of integration.

        A linear bijection is an **isomorphism**. Polynomials of degree at most $n$ are $F^{n+1}$ under another name, and so is every space of dimension $n + 1$.

        Twice today the dimensions of a kernel and an image were counted, and twice they added up to the dimension of the space the map started from: $1 + 3 = 4$ for the derivative on $P_3$, and $2 + 2 = 4$ for the second derivative. Whatever a linear map destroys and whatever it preserves together account for everything it was given. That is a theorem, perhaps the most used one in the subject: [[m6.rank-nullity-theorem]].
