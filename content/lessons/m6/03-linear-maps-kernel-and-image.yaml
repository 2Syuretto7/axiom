          The function is the definition, run on one pair of vectors and one scalar. Both conditions are needed. The absolute value respects the sum of two vectors with positive entries and fails for the scalar $-1$. A map that only checks $T(\mathbf{0}) = \mathbf{0}$ passes squaring, which fixes zero and is far from linear.

          The name says "looks". A `True` is evidence about three inputs, not a proof about all of them: the product of the two entries passes whenever both vectors lie on the same axis. A `False` is a proof, since one counterexample refutes a statement that begins "for all". To **prove** a map linear you argue from its formula, as with the sum rule for derivatives. Random testing of this kind is still worth having in a test suite for anything that is supposed to be linear, such as a layer of a network with its non-linearity removed.
    - question:
        id: fix-extend
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A linear map from $\mathbb{R}^n$ is fixed by the images of the standard basis vectors. `apply(images, v)` receives those images as a list of arrays, `images[i]` being $T(\mathbf{e}_i)$, and should return $T(\mathbf{v})$. For the rotation of the plane by a quarter turn, with $T(\mathbf{e}_1) = (0, 1)$ and $T(\mathbf{e}_2) = (-1, 0)$, it should send $(3, 2)$ to $(-2, 3)$. It returns $(-1, 1)$ whatever `v` is. Fix it. One line needs to change.
        starter: |
          import numpy as np


          def apply(images, v):
              total = images[0] * 0.0
              for i in range(len(v)):
                  total = total + images[i]
              return total


          quarter_turn = [np.array([0.0, 1.0]), np.array([-1.0, 0.0])]
          print(apply(quarter_turn, np.array([3.0, 2.0])).tolist())
        solution: |
          import numpy as np


          def apply(images, v):
              total = images[0] * 0.0
              for i in range(len(v)):
                  total = total + v[i] * images[i]
              return total


          quarter_turn = [np.array([0.0, 1.0]), np.array([-1.0, 0.0])]
          print(apply(quarter_turn, np.array([3.0, 2.0])).tolist())
        tests: |
          import numpy as _np
          _q = [_np.array([0.0, 1.0]), _np.array([-1.0, 0.0])]
          _keep = [_w.copy() for _w in _q]
          _r = apply(_q, _np.array([3.0, 2.0]))
          assert all(_np.array_equal(_a, _b) for _a, _b in zip(_q, _keep)), "The images should be left as they were"
          assert _np.allclose(_r, [-2.0, 3.0]), "The quarter turn sends (3, 2) to (-2, 3): 3 times the image of e1 plus 2 times the image of e2"
          assert _np.allclose(apply(_q, _np.array([1.0, 0.0])), [0.0, 1.0]), "A basis vector should be sent to its given image"
          assert _np.allclose(apply(_q, _np.array([0.0, 0.0])), [0.0, 0.0]), "The zero vector should be sent to zero"
          _im = [_np.array([1.0, 0.0, 2.0]), _np.array([0.0, 1.0, -1.0])]
          assert _np.allclose(apply(_im, _np.array([2.0, 5.0])), [2.0, 5.0, -1.0]), "For a map from the plane to space with images (1, 0, 2) and (0, 1, -1), the vector (2, 5) goes to (2, 5, -1)"
          _A = _np.random.default_rng(0).normal(size=(3, 4))
          _x = _np.random.default_rng(1).normal(size=4)
          assert _np.allclose(apply([_A[:, _j] for _j in range(4)], _x), _A @ _x), "With the columns of a matrix as the images, the result should be the matrix times the vector"
          assert output.strip() == "[-2.0, 3.0]", "The program should print [-2.0, 3.0]"
        wrong:
          - |
            import numpy as np


            def apply(images, v):
                total = images[0] * 0.0
                for i in range(len(v)):
                    total = total + images[i]
                return total


            print("[-2.0, 3.0]")
          - |
            import numpy as np


            def apply(images, v):
                total = images[0] * 0.0
                for i in range(len(v)):
                    total = total + v[i] * images[0]
                return total


            print("[-2.0, 3.0]")
          - |
