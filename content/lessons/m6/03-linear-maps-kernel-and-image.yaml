concept: m6.linear-maps-kernel-and-image
minutes: 85
claim: You can say what makes a map between vector spaces linear and test a given map against the definition, recognise differentiation, evaluation and transposition as linear maps, show that a linear map is fixed by what it does to a basis, define the kernel and the image and prove that they are subspaces, prove that a linear map is injective exactly when its kernel is zero, and say what it means for two vector spaces to be isomorphic.
recalls: [m6.subspaces-sums-and-direct-sums]
uses: [m6.fields-and-the-vector-space-axioms, m5.matrices-as-linear-maps, m5.matrix-vector-product, m5.column-space-and-null-space, m5.basis-and-dimension, m5.identity-and-inverse, m4.linear-combinations-and-span, m3.direct-proof, m3.cases-and-counterexamples, m2.functions-as-machines, m2.composition-and-inverses, m2.injective-surjective-and-bijective-maps, m10.differentiation-rules, m10.integral-as-accumulation, m1.polynomials, m1.logarithms, e5.arrays-dtype-and-shape, e0.functions, e0.loops, e0.lists-and-tuples]
leads: [m6.rank-nullity-theorem, m6.matrix-of-a-linear-map-and-similarity, m6.dual-spaces-and-the-transpose, m6.adjoints-orthogonal-and-unitary-maps, m8.eigenvalues-and-eigenvectors]
starter: |
  # Scratch space. Differentiation, acting on a polynomial stored as its
  # coefficients of 1, x, x^2, x^3.
  def D(p):
      return [k * p[k] for k in range(1, len(p))]


  p, q = [1.0, 0.0, 2.0, 5.0], [0.0, 3.0, -2.0, 1.0]
  print(D(p), D(q))
  print(D([a + b for a, b in zip(p, q)]))
  print(D([7.0, 0.0, 0.0, 0.0]))
parts:
  recall:
    - text: |
        [[m6.subspaces-sums-and-direct-sums]] ended by noticing that subspaces arise as what a rule produces, or as what it sends to zero, and that the rules were all of one kind. Today studies that kind of rule. Three quick pulls first.
  puzzle:
    - text: |
        The starter differentiates polynomials of degree at most 3, held as lists of four coefficients. The derivative of $1 + 2x^2 + 5x^3$ is $4x + 15x^2$.

        ```
        [0.0, 4.0, 15.0] [3.0, -4.0, 3.0]
        [3.0, 0.0, 18.0]
        [0.0, 0.0, 0.0]
        ```

        The second line differentiates the **sum** of the two polynomials, and it equals the sum of the two derivatives on the first line. The third differentiates the constant 7 and gets the zero polynomial.

        This rule takes vectors in one space, $P_3$, of dimension 4, and returns vectors in another, $P_2$, of dimension 3. It respects addition. No matrix was written down anywhere. And yet two questions from the matrices cluster make perfect sense for it. Which inputs does it send to zero? Which outputs can it produce?

        For a matrix those were the null space and the column space, found by elimination. Here there is nothing to eliminate.

        **What is a "matrix" when there are no rows and columns: what property did matrices have that differentiation shares? And what can be said about what such a rule kills and what it reaches, from that property alone?**
  intuition:
    - text: |
        A matrix $A$ acts on vectors, and the action has two properties used in every argument of the last two clusters: $A(\mathbf{u} + \mathbf{v}) = A\mathbf{u} + A\mathbf{v}$, and $A(c\mathbf{v}) = c\,A\mathbf{v}$. Add first and then apply, or apply first and then add: the same. Likewise for scaling.

        Differentiation has exactly these properties. $(p + q)' = p' + q'$ and $(cp)' = c\,p'$ are the first two differentiation rules you learned. So does evaluation at a point: $(p + q)(2) = p(2) + q(2)$. So does transposing a matrix, taking a definite integral, or shifting a sequence one place along.

        A map between vector spaces with these two properties is called **linear**. It is the kind of map that fits the structure: a vector space is a set with an addition and a scaling, and a linear map is one that respects both. Whatever is true of a combination of inputs is carried to the same combination of outputs:

        $$T(a\mathbf{u} + b\mathbf{v}) = a\,T(\mathbf{u}) + b\,T(\mathbf{v}).$$

        This one fact has a strong consequence. If you know what $T$ does to each vector of a basis, you know what it does to everything, because everything is a combination of the basis. For differentiation on $P_3$: knowing $1 \mapsto 0$, $x \mapsto 1$, $x^2 \mapsto 2x$ and $x^3 \mapsto 3x^2$ is knowing the whole map. A linear map on a space of dimension $n$ is $n$ vectors' worth of information.

        And the two questions of the puzzle have names that do not mention matrices. What $T$ sends to zero is its **kernel**. What $T$ can produce is its **image**.
  derivation:
    - text: |
        **Definition.** Let $V$ and $W$ be vector spaces over the same field. A map $T: V \to W$ is **linear** if, for all $\mathbf{u}, \mathbf{v} \in V$ and all scalars $a$,

        $$T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v}), \qquad T(a\mathbf{v}) = a\,T(\mathbf{v}).$$

        A first consequence: $T(\mathbf{0}) = T(0\mathbf{v}) = 0\,T(\mathbf{v}) = \mathbf{0}$. A linear map sends zero to zero. That gives a quick test for **non**-linearity: the map $x \mapsto x + 1$ on the real line sends 0 to 1, so it is not linear, even though its graph is a straight line. In linear algebra "linear" means through the origin.

        **Examples.**

        - $\mathbf{x} \mapsto A\mathbf{x}$ from $F^n$ to $F^m$, for any $m \times n$ matrix.
        - Differentiation $D: P_n \to P_{n-1}$.
        - Evaluation at a point, $p \mapsto p(t)$, from $P_n$ to the scalars.
        - $A \mapsto A^\top$ on matrices, and $A \mapsto \operatorname{tr}A$ from square matrices to the scalars.
        - $p \mapsto x\,p(x)$, multiplication by $x$, from $P_n$ to $P_{n+1}$.
        - The logarithm, from the strange space of positive numbers (where adding is multiplying and scaling is taking powers) to the real line: $\log(xy) = \log x + \log y$ and $\log(x^a) = a\log x$ say precisely that it is linear.

        **Not linear.** $p \mapsto p^2$, since $(2p)^2 = 4p^2$. The length of a vector, since $\lVert -\mathbf{v}\rVert \ne -\lVert\mathbf{v}\rVert$. The determinant, since $\det(2A) = 2^n\det A$.

        **Fixed by a basis.** Let $\mathbf{b}_1, \dots, \mathbf{b}_n$ be a basis of $V$. Choose any vectors $\mathbf{w}_1, \dots, \mathbf{w}_n$ in $W$. There is exactly one linear map with $T(\mathbf{b}_i) = \mathbf{w}_i$ for every $i$, namely

        $$T(c_1\mathbf{b}_1 + \dots + c_n\mathbf{b}_n) = c_1\mathbf{w}_1 + \dots + c_n\mathbf{w}_n.$$

        Linearity forces the formula, and the formula defines a linear map. The choices are free: a basis has no relations among its members that the images would have to respect.

        **Kernel and image.** For a linear map $T: V \to W$,

        $$\ker T = \{\mathbf{v} \in V : T(\mathbf{v}) = \mathbf{0}\}, \qquad \operatorname{im}T = \{T(\mathbf{v}) : \mathbf{v} \in V\}.$$

        The kernel is a subspace of $V$: if $T(\mathbf{u}) = \mathbf{0}$ and $T(\mathbf{v}) = \mathbf{0}$ then $T(\mathbf{u} + \mathbf{v}) = \mathbf{0} + \mathbf{0}$ and $T(a\mathbf{u}) = a\mathbf{0}$. The image is a subspace of $W$: $T(\mathbf{u}) + T(\mathbf{v}) = T(\mathbf{u} + \mathbf{v})$ is again an output, and so is $a\,T(\mathbf{u}) = T(a\mathbf{u})$. For a matrix they are the null space and the column space.

        *Differentiation on $P_3$.* $p' = 0$ exactly for constants, so $\ker D$ is the constants, of dimension 1. Every polynomial of degree at most 2 is the derivative of something, so $\operatorname{im}D = P_2$, of dimension 3.

        *Evaluation at 1 on $P_2$.* The kernel is the polynomials with $p(1) = 0$, the subspace with basis $x - 1$, $x^2 - 1$ from the last lesson. The image is all scalars.
    - question:
        id: derivation-kernel
        type: numeric
        system: s2
        prompt: |
          Let $T: P_3 \to P_1$ be the second derivative, $T(p) = p''$. What is the dimension of its kernel?
        answer: "2"
        explanation: |
          $p'' = 0$ exactly when $p$ has degree at most 1, so the kernel is $P_1$, with basis $1, x$ and dimension 2. The image is all of $P_1$, of dimension 2, since $a + bx$ is the second derivative of $\tfrac{a}{2}x^2 + \tfrac{b}{6}x^3$. Kernel and image dimensions add to 4, the dimension of $P_3$. The same happened for the first derivative, with $1 + 3$. That is not an accident, and it is the subject of the next lesson.
    - text: |
        **Injective means zero kernel.**

        *Theorem.* A linear map $T$ is injective if and only if $\ker T = \{\mathbf{0}\}$.

        *Proof.* If $T$ is injective, only one vector can be sent to $\mathbf{0}$, and $\mathbf{0}$ is. Conversely, suppose $\ker T = \{\mathbf{0}\}$ and $T(\mathbf{u}) = T(\mathbf{v})$. Then $T(\mathbf{u} - \mathbf{v}) = T(\mathbf{u}) - T(\mathbf{v}) = \mathbf{0}$, so $\mathbf{u} - \mathbf{v}$ is in the kernel and is zero. $\blacksquare$

        For a general function, checking injectivity means comparing all pairs of inputs. For a linear map it is enough to look at what goes to zero. More: if $T(\mathbf{u}) = \mathbf{w}$, then the full set of solutions of $T(\mathbf{x}) = \mathbf{w}$ is $\mathbf{u} + \ker T$, one particular solution plus the kernel. For differentiation this is the "$+\,C$" of integration: all antiderivatives of a function differ by a constant, because the constants are the kernel of $D$.

        **Compositions and inverses.** If $S$ and $T$ are linear, so is $S \circ T$, when it is defined. If a linear map is a bijection, its inverse is linear as well.

        **Isomorphism.** A linear bijection $T: V \to W$ is an **isomorphism**, and $V$ and $W$ are then **isomorphic**. Everything that can be said using only addition and scaling is true in one exactly when it is true in the other: independence, span, dimension, subspaces. As vector spaces they are the same space with different names for the vectors.

        The map sending $a_0 + a_1x + \dots + a_nx^n$ to the list $(a_0, a_1, \dots, a_n)$ is an isomorphism from $P_n$ to $F^{n+1}$. That is why storing polynomials as lists worked. The logarithm is an isomorphism from the strange space of positive numbers to the real line, which is why that space obeyed all eight axioms. And choosing a basis of any $n$-dimensional space $V$ gives an isomorphism to $F^n$, by sending a vector to its coordinates. **Every finite-dimensional vector space is $F^n$ in disguise**, and the disguise is removed by choosing a basis. The choice is not unique, and much of what follows is about what does not depend on it.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of the proof that a linear map T with kernel zero is injective.
        steps:
          - 'Suppose $T(\mathbf{u}) = T(\mathbf{v})$.'
          - 'Then $T(\mathbf{u}) - T(\mathbf{v}) = \mathbf{0}$.'
          - 'By linearity, $T(\mathbf{u} - \mathbf{v}) = \mathbf{0}$.'
          - 'So $\mathbf{u} - \mathbf{v}$ lies in the kernel, which contains only the zero vector.'
          - 'Therefore $\mathbf{u} = \mathbf{v}$.'
        explanation: Linearity converts a statement about two inputs with the same output into a statement about one input with output zero. That conversion is what makes the kernel so informative.
  formal:
    - text: |
        Let $V, W$ be vector spaces over $F$.

        **Linear map.** $T: V \to W$ with $T(a\mathbf{u} + b\mathbf{v}) = a\,T(\mathbf{u}) + b\,T(\mathbf{v})$ for all $\mathbf{u}, \mathbf{v} \in V$, $a, b \in F$. Then $T(\mathbf{0}) = \mathbf{0}$ and $T(\sum a_i\mathbf{v}_i) = \sum a_i T(\mathbf{v}_i)$.

        **Determination by a basis.** If $\mathbf{b}_1, \dots, \mathbf{b}_n$ is a basis of $V$ and $\mathbf{w}_1, \dots, \mathbf{w}_n \in W$ are arbitrary, there is a unique linear $T$ with $T(\mathbf{b}_i) = \mathbf{w}_i$.

        **Kernel and image.** $\ker T = T^{-1}(\{\mathbf{0}\})$ is a subspace of $V$. $\operatorname{im}T = T(V)$ is a subspace of $W$. The image is spanned by the images of any spanning set of $V$.

        **Injectivity.** $T$ is injective $\iff \ker T = \{\mathbf{0}\}$ $\iff$ $T$ sends every independent list to an independent list.

        **Fibres.** If $T(\mathbf{u}) = \mathbf{w}$, then $\{\mathbf{x} : T(\mathbf{x}) = \mathbf{w}\} = \mathbf{u} + \ker T$.

        **Algebra of maps.** Sums, scalar multiples and compositions of linear maps are linear. The linear maps from $V$ to $W$ form a vector space, $\mathcal{L}(V, W)$.

        **Isomorphism.** A bijective linear map. Its inverse is linear. $V \cong W$ if an isomorphism exists. Finite-dimensional $V$ and $W$ are isomorphic if and only if $\dim V = \dim W$. In particular $V \cong F^n$ when $\dim V = n$.
  drill:
    - text: |
        Seconds each.
    - question:
        id: drill-definition
        type: choice
        system: s1
        prompt: |
          A map $T$ is linear when
        options: ['its graph is a straight line', '$T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v})$ and $T(a\mathbf{v}) = a\,T(\mathbf{v})$', '$T(\mathbf{v}) \ne \mathbf{0}$ for all $\mathbf{v}$', 'it is given by a formula']
        answer: 1
        explanation: It respects addition and scaling.
    - question:
        id: drill-zero
        type: choice
        system: s1
        prompt: |
          What does every linear map do to the zero vector?
        options: ['Sends it to any vector', 'Sends it to the zero vector', 'Leaves it undefined', 'Sends it to 1']
        answer: 1
        explanation: $T(\mathbf{0}) = T(0\mathbf{v}) = 0\,T(\mathbf{v})$.
    - question:
        id: drill-shift
        type: choice
        system: s1
        prompt: |
          Is $x \mapsto x + 1$ on the real line a linear map?
        options: ['Yes', 'No, it sends 0 to 1', 'Yes, its graph is a line', 'Only for positive $x$']
        answer: 1
        explanation: Linear maps fix zero.
    - question:
        id: drill-derivative
        type: choice
        system: s1
        prompt: |
          Which rule says that differentiation respects addition?
        options: ['The product rule', '$(p + q)'' = p'' + q''$', 'The chain rule', '$(pq)'' = p''q''$']
        answer: 1
        explanation: The sum rule. The last option is false.
    - question:
        id: drill-square
        type: choice
        system: s1
        prompt: |
          Is $p \mapsto p^2$ on polynomials linear?
        options: ['Yes', 'No, $(2p)^2 = 4p^2$', 'Yes, squares are polynomials', 'Only on constants']
        answer: 1
        explanation: Scaling the input by 2 scales the output by 4.
    - question:
        id: drill-kernel
        type: choice
        system: s1
        prompt: |
          The kernel of $T: V \to W$ is
        options: ['the set of outputs', 'the set of inputs sent to zero', 'the zero vector of $W$', 'the set of inputs sent to themselves']
        answer: 1
        explanation: A subspace of $V$.
    - question:
        id: drill-image
        type: choice
        system: s1
        prompt: |
          The image of $T: V \to W$ is a subspace of
        options: ['$V$', '$W$', 'the scalars', 'neither']
