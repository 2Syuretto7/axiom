    - question:
        id: drill-kernel-d
        type: choice
        system: s1
        prompt: |
          What is the kernel of differentiation on $P_3$?
        options: ['The zero polynomial only', 'The constants', 'The polynomials of degree 3', 'All of $P_3$']
        answer: 1
        explanation: Exactly the constants have derivative zero.
    - question:
        id: drill-matrix
        type: choice
        system: s1
