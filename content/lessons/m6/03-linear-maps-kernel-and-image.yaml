    - question:
        id: drill-isomorphic
        type: choice
        system: s1
        prompt: |
          $P_2$ is isomorphic to
        options: ['$\mathbb{R}^2$', '$\mathbb{R}^3$', '$\mathbb{R}^4$', 'no $\mathbb{R}^n$']
        answer: 1
        explanation: Same dimension, 3.
    - question:
        id: predict-not-linear
        type: predict
        system: s1
        prompt: Two maps on the plane, each applied to a sum and to the two pieces. What does this show?
        code: |
          import numpy as np


          def shift(x):
              return x + 1.0


          def double(x):
              return 2.0 * x


          u, v = np.array([1.0, 2.0]), np.array([3.0, -1.0])
          print(shift(u + v).tolist(), (shift(u) + shift(v)).tolist())
          print(double(u + v).tolist(), (double(u) + double(v)).tolist())
        output: |
          [5.0, 2.0] [6.0, 3.0]
          [8.0, 2.0] [8.0, 2.0]
        explanation: Adding 1 to every entry does not respect addition, since the 1 is added once on the left and twice on the right. Doubling does. One failing pair is a proof that a map is not linear. One passing pair proves nothing, but is consistent with linearity.
    - question:
        id: predict-log
        type: predict
        system: s1
        prompt: The logarithm, tested against the two operations of the space of positive numbers. What does this show?
        code: |
          import numpy as np

          x, y, a = 2.0, 8.0, 3.0
          print(round(float(np.log(x * y)), 6), round(float(np.log(x) + np.log(y)), 6))
          print(round(float(np.log(x ** a)), 6), round(float(a * np.log(x)), 6))
        output: |
          2.772589 2.772589
          2.079442 2.079442
        explanation: In the space of positive numbers the sum of 2 and 8 is their product and 3 times 2 is 2 cubed. The logarithm carries that sum to an ordinary sum and that scaling to an ordinary scaling. It is a linear map, and since it has an inverse, the exponential, it is an isomorphism onto the real line.
  work:
    - text: Slower now. A linear map with no matrix is still something a program can hold, apply and test.
    - question:
        id: write-derivative
        type: code
        mode: write
        system: s2
        prompt: |
          Polynomials are lists of coefficients, lowest power first. Write `derivative(p)`, returning the coefficient list of the derivative, one entry shorter than `p` (and the empty list for a constant or for the empty list). Write `antiderivative(p)`, returning the list for the antiderivative with constant term 0.0, one entry longer than `p`.

          The program applies them in both orders.
        starter: |
          def derivative(p):
              return []


          def antiderivative(p):
              return [0.0]


          p = [7.0, 4.0, 3.0]
          print(derivative(antiderivative(p)))
          print(antiderivative(derivative(p)))
        solution: |
          def derivative(p):
              return [k * p[k] for k in range(1, len(p))]


          def antiderivative(p):
              return [0.0] + [p[k] / (k + 1) for k in range(len(p))]


          p = [7.0, 4.0, 3.0]
          print(derivative(antiderivative(p)))
          print(antiderivative(derivative(p)))
        tests: |
          _p = [1.0, 0.0, 2.0, 5.0]
          _d = derivative(_p)
          assert _p == [1.0, 0.0, 2.0, 5.0], "p should be left as it was"
          assert _d == [0.0, 4.0, 15.0], "The derivative of 1 + 2x^2 + 5x^3 is 4x + 15x^2: the coefficient of x^k becomes k times itself, one place down"
          assert derivative([7.0]) == [] and derivative([]) == [], "The derivative of a constant has no coefficients left"
          assert derivative([0.0, 1.0]) == [1.0], "The derivative of x is 1"
          _a = antiderivative([7.0, 4.0, 3.0])
          assert len(_a) == 4, "The antiderivative has one more coefficient than p"
          assert _a == [0.0, 7.0, 2.0, 1.0], "The antiderivative of 7 + 4x + 3x^2 with constant term 0 is 7x + 2x^2 + x^3"
          assert antiderivative([]) == [0.0], "The antiderivative of the zero polynomial with constant term 0 is the constant 0"
          _q, _r = [2.0, -1.0, 0.5, 4.0], [1.0, 1.0, 0.0, -2.0]
          _s = [a + b for a, b in zip(_q, _r)]
          assert derivative(_s) == [a + b for a, b in zip(derivative(_q), derivative(_r))], "The derivative of a sum should be the sum of the derivatives"
          assert derivative([3.0 * c for c in _q]) == [3.0 * c for c in derivative(_q)], "The derivative of 3p should be 3 times the derivative of p"
          assert derivative(antiderivative(_q)) == _q, "Differentiating an antiderivative should give back the polynomial"
          assert antiderivative(derivative(_q)) == [0.0, -1.0, 0.5, 4.0], "Integrating the derivative gives back the polynomial with its constant term replaced by 0"
          assert output.strip() == "[7.0, 4.0, 3.0]\n[0.0, 4.0, 3.0]", "The program should print [7.0, 4.0, 3.0] and then [0.0, 4.0, 3.0]"
        wrong:
          - |
            def derivative(p):
                return [k * p[k] for k in range(len(p))]


            def antiderivative(p):
                return [0.0] + [p[k] / (k + 1) for k in range(len(p))]


            print("[7.0, 4.0, 3.0]\n[0.0, 4.0, 3.0]")
          - |
            def derivative(p):
                return [p[k] for k in range(1, len(p))]


            def antiderivative(p):
                return [0.0] + [p[k] / (k + 1) for k in range(len(p))]


            print("[7.0, 4.0, 3.0]\n[0.0, 4.0, 3.0]")
          - |
            def derivative(p):
                return [k * p[k] for k in range(1, len(p))]


            def antiderivative(p):
                return [p[k] / (k + 1) for k in range(len(p))]


            print("[7.0, 4.0, 3.0]\n[0.0, 4.0, 3.0]")
          - |
            def derivative(p):
                return [k * p[k] for k in range(1, len(p))]


            def antiderivative(p):
                return [0.0] + [p[k] / k for k in range(1, len(p))]


            print("[7.0, 4.0, 3.0]\n[0.0, 4.0, 3.0]")
        explanation: |
          Each function is fixed by what it does to the basis $1, x, x^2, \dots$: the derivative sends $x^k$ to $kx^{k-1}$, and the antiderivative sends $x^k$ to $x^{k+1}/(k+1)$. The code applies that to each coefficient and moves it one place.

          The two printed lines differ. Differentiating after integrating returns the polynomial: $D \circ I$ is the identity. Integrating after differentiating returns $4x + 3x^2$: the constant 7 is gone, and cannot be recovered, because $D$ sent it to zero. $D$ is surjective and not injective, with the constants as its kernel. $I$ is injective and not surjective, since its image contains only polynomials with constant term 0. A one-sided inverse, as with the pseudo-inverse of a rectangular matrix.
    - question:
        id: write-looks-linear
        type: code
        mode: write
        system: s2
        prompt: |
          Write `looks_linear(T, u, v, a)`. `T` is a function taking a NumPy array and returning one, `u` and `v` are arrays and `a` is a float. Return `True` if `T` passes both conditions of linearity for these inputs, `T(u + v)` close to `T(u) + T(v)` and `T(a * u)` close to `a * T(u)`, and `False` otherwise. Compare with `np.allclose`.
        starter: |
          import numpy as np


          def looks_linear(T, u, v, a):
              return True


          def double(x):
              return 2.0 * x


          def shift(x):
              return x + 1.0


          def square(x):
              return x * x


          u, v = np.array([1.0, 2.0]), np.array([3.0, -1.0])
          print(looks_linear(double, u, v, 3.0), looks_linear(shift, u, v, 3.0), looks_linear(square, u, v, 3.0))
        solution: |
          import numpy as np


          def looks_linear(T, u, v, a):
              if not np.allclose(T(u + v), T(u) + T(v)):
                  return False
              if not np.allclose(T(a * u), a * T(u)):
                  return False
              return True


          def double(x):
              return 2.0 * x


          def shift(x):
              return x + 1.0


          def square(x):
              return x * x


          u, v = np.array([1.0, 2.0]), np.array([3.0, -1.0])
          print(looks_linear(double, u, v, 3.0), looks_linear(shift, u, v, 3.0), looks_linear(square, u, v, 3.0))
