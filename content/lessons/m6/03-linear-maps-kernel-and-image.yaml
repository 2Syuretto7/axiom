          assert looks_linear(lambda x: _A @ x, _u, _v, 3.0) == True, "Multiplication by a matrix passes both conditions"
          assert looks_linear(lambda x: 2.0 * x, _u, _v, 3.0) == True, "Doubling passes both conditions"
          assert looks_linear(lambda x: x[::-1] * 1.0, _u, _v, -2.0) == True, "Reversing the entries passes both conditions"
          assert looks_linear(lambda x: x * 0.0, _u, _v, 3.0) == True, "The zero map is linear"
          assert looks_linear(lambda x: x + 1.0, _u, _v, 3.0) == False, "Adding 1 to every entry fails: the 1 is added once to u + v and twice to T(u) + T(v)"
          assert looks_linear(lambda x: x * x, _u, _v, 3.0) == False, "Squaring every entry fails both conditions"
