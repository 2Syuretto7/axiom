  work:
    - text: Slower now. Decide first whether you are dealing with a sequence or with the sequence of its partial sums.
    - question:
        id: work-repeating-decimal
        type: choice
        system: s2
        prompt: |
          Write the repeating decimal $0.272727\ldots$ as a fraction, by treating it as a geometric series.
        options: ["$\\dfrac{27}{100}$", "$\\dfrac{3}{11}$", "$\\dfrac{27}{90}$", "$\\dfrac{2}{7}$"]
        answer: 1
        explanation: |
          $0.2727\ldots = \dfrac{27}{100} + \dfrac{27}{100^2} + \cdots$, geometric with $a = \dfrac{27}{100}$ and $r = \dfrac{1}{100}$. The sum is $\dfrac{27/100}{99/100} = \dfrac{27}{99} = \dfrac{3}{11}$. Check: $3 \div 11 = 0.2727\ldots$
    - question:
        id: work-bouncing-ball
        type: numeric
        system: s2
        prompt: |
          A ball is dropped from a height of 10 m. After each bounce it rises to $\tfrac{3}{5}$ of the height it fell from. What is the **total** distance in metres it travels, down and up, before coming to rest?
        answer: "40"
        unit: m
        explanation: |
          It falls 10 m. After that every bounce is a rise and an equal fall: $2 \times 6 + 2 \times 3.6 + \cdots$, a geometric series with $a = 12$ and $r = \tfrac{3}{5}$, whose sum is $\dfrac{12}{1 - 3/5} = 30$. Total $10 + 30$. Infinitely many bounces, a finite distance, and a finite time too.
    - question:
        id: write-exp-series
        type: code
        mode: write
        system: s2
        prompt: |
          Write `exp_series(x, terms)` that approximates $e^x$ by the sum of the first `terms` terms of its series,

          $$\sum_{k=0}^{\text{terms} - 1} \frac{x^k}{k!}.$$

          Do not import anything, and do not compute any factorial or power from scratch. Each term is the one before multiplied by $\dfrac{x}{k}$, so keep a running term and a running total.
        starter: |
          def exp_series(x, terms):
              # Replace the next line with your own.
              return 1.0

          print(exp_series(1, 10))
          print(exp_series(2, 20))
        solution: |
          def exp_series(x, terms):
              total = 0.0
              term = 1.0
              for k in range(terms):
                  total = total + term
                  term = term * x / (k + 1)
              return total

          print(exp_series(1, 10))
          print(exp_series(2, 20))
        tests: |
          import math as _m
          assert "import" not in source, "Do not import anything"
          assert exp_series(1, 1) == 1, "One term: just the 1"
          assert exp_series(1, 2) == 2, "Two terms: 1 + 1"
          assert abs(exp_series(1, 3) - 2.5) < 1e-12, "Three terms: 1 + 1 + 1/2"
          assert abs(exp_series(1, 4) - (2.5 + 1 / 6)) < 1e-12, "Four terms: 1 + 1 + 1/2 + 1/6"
          assert abs(exp_series(1, 20) - _m.e) < 1e-12, "Twenty terms at x = 1 give e to twelve places"
          assert abs(exp_series(2, 30) - _m.exp(2)) < 1e-9, "At x = 2 the series gives e squared"
          assert abs(exp_series(-1, 30) - _m.exp(-1)) < 1e-12, "It should work for negative x, where the terms alternate in sign"
          assert exp_series(0, 5) == 1, "e to the 0 is 1"
          assert exp_series(3, 0) == 0, "With no terms the sum is empty"
        wrong:
          - "def exp_series(x, terms):\n    total = 0.0\n    term = 1.0\n    for k in range(terms):\n        total = total + term\n        term = term * x / k if k > 0 else term * x\n    return total\n"
          - "def exp_series(x, terms):\n    total = 0.0\n    term = 1.0\n    for k in range(terms):\n        term = term * x / (k + 1)\n        total = total + term\n    return total\n"
          - "def exp_series(x, terms):\n    total = 0.0\n    term = 1.0\n    for k in range(terms):\n        total = total + term\n        term = term * x\n    return total\n"
        explanation: |
          The term with index $k + 1$ is $\dfrac{x^{k+1}}{(k+1)!} = \dfrac{x^k}{k!} \cdot \dfrac{x}{k + 1}$. So the terms obey a recurrence, and no power or factorial ever needs to be computed. That keeps every intermediate number small. This is, in essence, how `math.exp` works: a function with no formula, evaluated by adding the terms of a rapidly convergent series.
    - question:
        id: write-terms-to-exceed
        type: code
        mode: write
        system: s2
        prompt: |
          Write `harmonic_terms(target)` that returns the smallest number of terms $n$ for which the partial sum $1 + \tfrac{1}{2} + \dots + \tfrac{1}{n}$ is **greater than** `target`. For a target below 1 the answer is 1. The program then prints the answers for the targets 2, 4 and 8.
        starter: |
          def harmonic_terms(target):
              # Replace the next line with your own.
              return 1

          print(harmonic_terms(2), harmonic_terms(4), harmonic_terms(8))
        solution: |
          def harmonic_terms(target):
              total = 0.0
              n = 0
              while total <= target:
                  n = n + 1
                  total = total + 1 / n
              return n

          print(harmonic_terms(2), harmonic_terms(4), harmonic_terms(8))
        tests: |
          assert harmonic_terms(0.5) == 1, "The first term alone, 1, already exceeds 0.5"
          assert harmonic_terms(1) == 2, "1 is not greater than 1, so two terms are needed: 1 + 1/2"
          assert harmonic_terms(1.5) == 3, "1 + 1/2 is exactly 1.5, which is not greater than 1.5. A third term is needed."
          assert harmonic_terms(2) == 4, "1 + 1/2 + 1/3 + 1/4 is about 2.083"
          assert harmonic_terms(4) == 31, "It takes 31 terms to pass 4"
          assert harmonic_terms(8) == 1674, "It takes 1,674 terms to pass 8"
          assert output.strip() == "4 31 1674", "The program should print 4 31 1674"
        wrong:
          - "def harmonic_terms(target):\n    total = 0.0\n    n = 0\n    while total < target:\n        n = n + 1\n        total = total + 1 / n\n    return n\n\nprint(harmonic_terms(2), harmonic_terms(4), harmonic_terms(8))\n"
          - "def harmonic_terms(target):\n    total = 0.0\n    n = 0\n    while total <= target:\n        total = total + 1 / (n + 1)\n        n = n + 1\n    return n + 1\n\nprint(harmonic_terms(2), harmonic_terms(4), harmonic_terms(8))\n"
          - "def harmonic_terms(target):\n    total = 1.0\n    n = 1\n    while total <= target:\n        total = total + 1 / n\n        n = n + 1\n    return n\n\nprint(harmonic_terms(2), harmonic_terms(4), harmonic_terms(8))\n"
        explanation: |
          A `while` loop is right when the number of steps is not known in advance. It ends as soon as the running total is greater than the target, and the count of terms added is the answer. Look at the three results: passing 2 takes 4 terms, passing 4 takes 31, and passing 8 takes 1,674. Each doubling of the target multiplies the work by more than 50. That is logarithmic growth seen from the other side. The loop always ends, because the series diverges, but for a target of 40 it would not end in your lifetime.
    - question:
        id: fix-convergence-check
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `settles(f, tolerance)` is meant to estimate the limit of the sequence $f(1), f(2), f(3), \dots$ by computing terms until two **consecutive** terms differ by less than `tolerance`, and then returning the later of the two. For $f(n) = 3 + \dfrac{1}{n}$ and a tolerance of 0.001 it should stop at $n = 33$, the first index whose term is within 0.001 of the one before. Instead it returns after the very first comparison. Find the mistake in the condition and fix it.
        starter: |
          def settles(f, tolerance):
              n = 1
              previous = f(1)
              while True:
                  n = n + 1
                  current = f(n)
                  if current - previous < tolerance:
                      return current
                  previous = current

          print(settles(lambda n: 3 + 1 / n, 0.001))
        solution: |
          def settles(f, tolerance):
              n = 1
              previous = f(1)
              while True:
                  n = n + 1
                  current = f(n)
                  if abs(current - previous) < tolerance:
                      return current
                  previous = current

          print(settles(lambda n: 3 + 1 / n, 0.001))
        tests: |
          assert abs(settles(lambda n: 3 + 1 / n, 0.001) - (3 + 1 / 33)) < 1e-12, "For 3 + 1/n the first consecutive terms closer than 0.001 are those with n = 32 and 33. The terms are decreasing, so their difference is negative."
          assert abs(settles(lambda n: 1 - 1 / n, 0.01) - (1 - 1 / 11)) < 1e-12, "For an increasing sequence the difference is positive, and it should still work"
          assert settles(lambda n: 5, 0.1) == 5, "A constant sequence settles at once"
          assert abs(settles(lambda n: (-0.5) ** n, 0.01) - (-0.5) ** 9) < 1e-12, "For a sequence that alternates in sign, the size of the difference is what matters"
        wrong:
          - "def settles(f, tolerance):\n    n = 1\n    previous = f(1)\n    while True:\n        n = n + 1\n        current = f(n)\n        if previous - current < tolerance:\n            return current\n        previous = current\n\nprint(settles(lambda n: 3 + 1 / n, 0.001))\n"
          - "def settles(f, tolerance):\n    n = 1\n    previous = f(1)\n    while True:\n        n = n + 1\n        current = f(n)\n        if abs(current - previous) < tolerance:\n            return previous\n        previous = current\n\nprint(settles(lambda n: 3 + 1 / n, 0.001))\n"
          - "def settles(f, tolerance):\n    n = 1\n    previous = f(1)\n    while True:\n        n = n + 1\n        current = f(n)\n        if abs(current) - abs(previous) < tolerance:\n            return current\n        previous = current\n\nprint(settles(lambda n: 3 + 1 / n, 0.001))\n"
        explanation: |
          "Within a tolerance" is a statement about distance, $|a_n - a_{n-1}| < \varepsilon$, and distance needs the absolute value. For a decreasing sequence the raw difference is negative, and a negative number is smaller than any tolerance, so the starter stopped at once. A serious caution goes with this function: consecutive terms being close does **not** prove convergence. The partial sums of the harmonic series have consecutive differences $\tfrac{1}{n}$, which become as small as you like, and they diverge. This stopping rule is used throughout numerical computing and in training models, and it can be fooled in exactly this way.
    - question:
        id: work-discounted
        type: numeric
        system: s2
        prompt: |
          An agent receives a reward of 1 at every step, for ever. Rewards in the future are worth less: a reward $t$ steps ahead is multiplied by $\gamma^t$, with the discount factor $\gamma = 0.99$. What is the total discounted reward, $\displaystyle\sum_{t=0}^{\infty} \gamma^t$?
        answer: "100"
        explanation: |
          A geometric series with $a = 1$ and $r = 0.99$: $\dfrac{1}{1 - 0.99}$. Without discounting the sum would be infinite and no two strategies could be compared. With it, the agent effectively looks about $\dfrac{1}{1 - \gamma}$ steps ahead. This is the standard device of reinforcement learning.
    - question:
        id: work-shrinking-not-enough
        type: choice
        system: s2
        prompt: |
          A student argues: "The terms of $\displaystyle\sum_{k=1}^{\infty} \frac{1}{\sqrt{k}}$ shrink to 0, so the series converges." What is the right response?
        options:
          - "Correct. Any series whose terms shrink to 0 converges."
          - "The conclusion is right but the reason is wrong."
          - "The argument is invalid, and the series in fact diverges: each term is at least as large as the matching term 1/k of the harmonic series, whose partial sums already grow without bound."
          - "The series diverges because its terms do not shrink to 0."
        answer: 2
        explanation: |
          For $k \ge 1$, $\sqrt{k} \le k$, so $\dfrac{1}{\sqrt{k}} \ge \dfrac{1}{k}$. Each partial sum is therefore at least the matching partial sum of the harmonic series, and those exceed every bound. Terms shrinking to 0 is necessary for convergence, not sufficient. The divergence test can only ever prove divergence.
    - question:
        id: work-learning-rate
        type: choice
        system: s2
        prompt: |
          A learning rate starts at 0.1 and is multiplied by 0.5 after every epoch. The total distance a model's parameters can move is at most proportional to the sum of all the learning rates used, one per epoch, for ever. What is that sum?
        options: ["It is infinite", "0.2", "0.15", "0.1"]
        answer: 1
        explanation: |
          $0.1 + 0.05 + 0.025 + \cdots$ is geometric with $a = 0.1$ and $r = 0.5$: $\dfrac{0.1}{1 - 0.5} = 0.2$. A learning rate that decays geometrically has a finite total, so training with it can stall before reaching the best parameters if they are too far away. A learning rate that decays like $\dfrac{1}{k}$ has an infinite total, by the harmonic series, and can travel any distance. This difference is one reason schedules are chosen with care.
  connections:
    - text: |
        This is the end of the cluster on functions and notation, and it ended by reaching past the finite. A limit is the first idea in this course that cannot be checked by finite computation. A program can show you a million terms and still tell you nothing certain about the rest, as the harmonic series proved. To know what happens "for every tolerance" and "from some point onwards" takes an **argument**. The definition of convergence is built from those two phrases, "for every" and "there is", and learning to handle such phrases exactly, and to construct the arguments, is the subject of the cluster on logic and proof, which opens with [[m3.propositions-and-connectives]].

        Sequences and limits are also the foundation of calculus. The slope of a curve is a limit of slopes of lines. An area is a limit of sums. And they are how every numerical method works. Training a neural network produces a sequence: the model's parameters after step 0, step 1, step 2, each computed from the last by a recurrence. Whether that sequence converges, to what, and how fast, is the central question of optimisation, and the `settles` function you repaired is the stopping rule in use. The learning rate is a sequence chosen by the engineer, the discounted reward of an agent is a geometric series, and the smooth averages shown on every training dashboard are computed by a recurrence whose explicit form is a geometric series of past values.

        Look back over the eight lessons. Sets gave you the nouns. Functions gave you the verb, and composition and inversion the ways to combine and undo it. Injective and surjective told you what a function loses and what it reaches. The exponential, the logarithm, the sine and the cosine are the particular functions that the rest of the subject is made of. And sigma notation, sequences and series are how many numbers are handled as one.

        Before the proofs, though, the programming needs to catch up with the mathematics. You have been writing loops that build sets, add up sums and generate sequences, each one by hand. Python has a notation for all three that is modelled directly on the mathematics of this cluster: set-builder notation becomes a comprehension, a sum over a set becomes a single line, and a sequence that never ends becomes an iterator that produces terms only when asked. That is where the next lesson goes: [[e1.comprehensions-and-iterators]].
