concept: m2.trigonometric-functions-on-the-unit-circle
minutes: 110
claim: You can measure angles in radians, define sine, cosine and tangent for every angle as coordinates on the unit circle, recall their exact values and symmetries, read the period and amplitude of a wave, and rotate a point by any angle.
recalls: [m2.the-exponential-and-e]
uses: [m2.sets, m2.functions-as-machines, m2.composition-and-inverses, m2.injective-surjective-and-bijective-maps, m0.fractions, m0.negative-numbers, m0.powers-and-roots, m0.ratio-and-proportion, m1.variables-and-expressions, m1.linear-equations, m1.coordinates-and-the-plane, m1.straight-lines-and-slope, m1.quadratics, m1.exponent-laws, m1.complex-numbers, e0.expressions, e0.booleans-and-conditionals, e0.loops, e0.functions, e0.lists-and-tuples, e0.reading-errors-and-debugging]
leads: [m2.summation-and-product-notation]
starter: |
  # Scratch space. Walk round the unit circle in twelve steps.
  import math

  for k in range(13):
      angle = k * math.pi / 6
      print(k * 30, round(math.cos(angle), 3), round(math.sin(angle), 3))
parts:
  recall:
    - text: |
        [[m2.the-exponential-and-e]] described quantities that grow or decay: functions that only ever go one way. It ended by pointing at everything that does neither, the things that come round again. Today's functions are built for those. Three quick pulls first.
  puzzle:
    - text: |
        A giant wheel at a fair has a radius of 1, in some unit: say one unit is 30 metres. Put the origin at its centre. You board at the rightmost point, $(1, 0)$, and the wheel turns anticlockwise.

        After a quarter of a turn you are at the top, $(0, 1)$. After half a turn you are at $(-1, 0)$. Those are easy.

        **Where are you after one twelfth of a turn?** Or after a third? How high above the centre, and how far to the side?

        Try your tools. It is not a linear question: after a twelfth of a turn you are certainly not a twelfth of the way up. In fact you are exactly **half** way up, which seems far too much for a twelfth of a turn, and after a sixth of a turn you are about 87% of the way up. It is not a polynomial question or an exponential one either. Your height rises, slows, stops at the top, falls, goes negative, and then does the whole thing again, for ever. No function you have met returns to its starting value over and over.

        And yet the rule "angle turned through $\mapsto$ height" is a perfectly good function. Each angle gives exactly one height. It simply has no formula in terms of the operations you know, so it needs a name of its own. In fact two rules are hiding in the wheel: one for your height, and one for how far across you are. They are the most important functions in mathematics after the exponential, and they are not about triangles. They are about **going round**.
  intuition:
    - text: |
        Take the circle of radius 1 centred at the origin: the **unit circle**. Every point on it is at distance 1 from the centre, so by the distance formula its coordinates satisfy $x^2 + y^2 = 1$.

        Start at $(1, 0)$ and travel anticlockwise through an angle $\theta$, the Greek letter theta, customary for angles. You arrive at some point of the circle. That point has two coordinates, and they are given names:

        - the horizontal coordinate, how far across, is the **cosine** of $\theta$, written $\cos\theta$;
        - the vertical coordinate, how far up, is the **sine** of $\theta$, written $\sin\theta$.

        That is the whole definition. Nothing more is hidden in those two words than "the $x$ and the $y$ of the point on the unit circle at angle $\theta$".

        Drag the angle in the figure. Watch the two blue segments, the cosine along the axis and the sine standing up from it. Notice when each is positive, negative or zero. Find where they are equal. Take the angle past a full turn, and below zero, and see that nothing new happens.
    - figure: unit-circle
      props: { degrees: 30 }
    - text: |
        Three things should have struck you.

        **Neither coordinate ever leaves the interval from $-1$ to $1$.** The point is on a circle of radius 1. It cannot be further than 1 from the centre in any direction.

        **Sine is steepest where it is zero and flat where it is largest.** As you leave $(1, 0)$ you are moving straight up, so your height changes fast and your sideways position hardly at all. Near the top you are moving sideways, and your height barely changes. That is why a twelfth of a turn takes you half way up.

        **Everything repeats.** An angle of one full turn more lands on the same point. So do two full turns more, or one full turn less. The two functions have no choice but to repeat with it.
  derivation:
    - text: |
        **Measuring angles.** The degree divides a full turn into 360 parts. The number 360 is a gift from the astronomers of Babylon, who liked it because it has many divisors and is close to the number of days in a year. It has nothing to do with circles.

        There is a measure that does. On the unit circle, an angle can be measured by **the length of the arc it cuts off**. Walk along the circle from $(1, 0)$: the distance you have walked **is** the angle. This measure is called the **radian**.

        The whole circumference of a circle of radius $r$ is $2\pi r$, so the unit circle has circumference $2\pi$. Therefore

        $$\text{a full turn} = 360° = 2\pi \text{ radians}, \qquad \text{so} \qquad 180° = \pi \text{ radians}.$$

        Everything else follows by proportion. A quarter-turn is $\dfrac{\pi}{2}$, and one radian is $\dfrac{180°}{\pi} \approx 57.3°$. To convert, multiply by the fraction that cancels the unit you have: degrees $\times \dfrac{\pi}{180}$ gives radians, and radians $\times \dfrac{180}{\pi}$ gives degrees.

        | Degrees | 0° | 30° | 45° | 60° | 90° | 180° | 270° | 360° |
        | --- | --- | --- | --- | --- | --- | --- | --- | --- |
        | Radians | $0$ | $\dfrac{\pi}{6}$ | $\dfrac{\pi}{4}$ | $\dfrac{\pi}{3}$ | $\dfrac{\pi}{2}$ | $\pi$ | $\dfrac{3\pi}{2}$ | $2\pi$ |

        A radian is a ratio of two lengths, arc over radius, so it has no unit: an angle in radians is a plain real number. That is why radians are used in all of mathematics beyond geometry, and by `math.sin` and every other library function. On a circle of radius $r$, an angle of $\theta$ radians cuts off an arc of length $r\theta$, with no constants to remember. **From here on, an angle with no degree sign is in radians.**

        **Sine and cosine for every real number.** For a real number $\theta$, start at $(1, 0)$ and move along the unit circle a distance $|\theta|$, anticlockwise if $\theta$ is positive and clockwise if it is negative. The point reached is, by definition,

        $$(\cos\theta, \sin\theta).$$

        So $\cos$ and $\sin$ are functions from $\mathbb{R}$ to $\mathbb{R}$. Their domain is all of $\mathbb{R}$: any amount of turning is allowed. Their range is $[-1, 1]$.

        **The one identity.** The point lies on the unit circle, whose equation is $x^2 + y^2 = 1$. So for every $\theta$,

        $$\cos^2\theta + \sin^2\theta = 1.$$

        Here $\cos^2\theta$ is the customary way of writing $(\cos\theta)^2$. This is the theorem of Pythagoras in its purest form, and it means that either function determines the other up to a sign.

        **The values on the axes.** At $\theta = 0$ you have not moved: the point is $(1, 0)$, so $\cos 0 = 1$ and $\sin 0 = 0$. At $\dfrac{\pi}{2}$ you are at the top, $(0, 1)$. At $\pi$ you are at $(-1, 0)$, and at $\dfrac{3\pi}{2}$ at the bottom, $(0, -1)$.

        **Three exact values in between.** They come from two triangles.

        *At $\dfrac{\pi}{4}$, 45°*, the point is half way between the axes, so by symmetry its two coordinates are equal: $x = y$. Then $x^2 + x^2 = 1$, so $x^2 = \dfrac{1}{2}$ and

        $$\cos\frac{\pi}{4} = \sin\frac{\pi}{4} = \frac{1}{\sqrt{2}} = \frac{\sqrt{2}}{2} \approx 0.707.$$

        *At $\dfrac{\pi}{6}$, 30°.* Mark the point at $30°$ and the point at $-30°$, its mirror image in the horizontal axis. Together with the origin they make a triangle with two sides of length 1, the radii, and an angle of 60° between them. A triangle with two equal sides and 60° between them has all three angles equal to 60°, so it is equilateral, and the third side, the vertical one joining the two points, also has length 1. The horizontal axis cuts that side in half. So the height of the upper point is exactly $\dfrac{1}{2}$:

        $$\sin\frac{\pi}{6} = \frac{1}{2}, \qquad \cos\frac{\pi}{6} = \sqrt{1 - \tfrac{1}{4}} = \frac{\sqrt{3}}{2} \approx 0.866.$$

        That is the puzzle's surprise, proved: a twelfth of a turn takes you half way up.

        *At $\dfrac{\pi}{3}$, 60°*, the picture is the same one reflected in the line $y = x$, which exchanges the two coordinates: $\cos\dfrac{\pi}{3} = \dfrac{1}{2}$ and $\sin\dfrac{\pi}{3} = \dfrac{\sqrt{3}}{2}$.

        | $\theta$ | $0$ | $\dfrac{\pi}{6}$ | $\dfrac{\pi}{4}$ | $\dfrac{\pi}{3}$ | $\dfrac{\pi}{2}$ |
        | --- | --- | --- | --- | --- | --- |
        | $\sin\theta$ | $0$ | $\dfrac{1}{2}$ | $\dfrac{\sqrt{2}}{2}$ | $\dfrac{\sqrt{3}}{2}$ | $1$ |
        | $\cos\theta$ | $1$ | $\dfrac{\sqrt{3}}{2}$ | $\dfrac{\sqrt{2}}{2}$ | $\dfrac{1}{2}$ | $0$ |

        A way to hold the sine row in your head: it is $\dfrac{\sqrt{0}}{2}, \dfrac{\sqrt{1}}{2}, \dfrac{\sqrt{2}}{2}, \dfrac{\sqrt{3}}{2}, \dfrac{\sqrt{4}}{2}$. The cosine row is the same list backwards.

        **Every other angle, by symmetry.** These five columns give the whole circle, because the circle is symmetric and the signs can be read from the quadrant. Cosine is the $x$-coordinate, so it is positive on the right half and negative on the left. Sine is the $y$-coordinate, positive on the upper half and negative on the lower.

        - *Reflecting in the horizontal axis* turns $\theta$ into $-\theta$. It keeps $x$ and flips $y$: $\cos(-\theta) = \cos\theta$ and $\sin(-\theta) = -\sin\theta$.
        - *Reflecting in the vertical axis* turns $\theta$ into $\pi - \theta$. It flips $x$ and keeps $y$: $\cos(\pi - \theta) = -\cos\theta$ and $\sin(\pi - \theta) = \sin\theta$.
        - *A half-turn* adds $\pi$ and flips both: $\cos(\theta + \pi) = -\cos\theta$ and $\sin(\theta + \pi) = -\sin\theta$.

        For example, $\dfrac{2\pi}{3}$ is 120°, which is $\pi - \dfrac{\pi}{3}$. So after a third of a turn, the wheel has you at

        $$\left(\cos\frac{2\pi}{3}, \sin\frac{2\pi}{3}\right) = \left(-\frac{1}{2}, \frac{\sqrt{3}}{2}\right).$$

        Never memorise more than the first quadrant. Draw the circle, mark the point, and read the signs.
    - question:
        id: exact-value-by-symmetry
        type: choice
        system: s2
        prompt: |
          What is $\sin\dfrac{7\pi}{6}$?
        options: ["$\\dfrac{1}{2}$", "$-\\dfrac{1}{2}$", "$-\\dfrac{\\sqrt{3}}{2}$", "$\\dfrac{\\sqrt{3}}{2}$"]
        answer: 1
        explanation: |
          $\dfrac{7\pi}{6} = \pi + \dfrac{\pi}{6}$, which is 210°: a half-turn beyond 30°. A half-turn flips both coordinates, so $\sin\dfrac{7\pi}{6} = -\sin\dfrac{\pi}{6} = -\dfrac{1}{2}$. The point is in the third quadrant, below the axis, so the sine must be negative.
    - text: |
        **Periodicity.** Adding a full turn returns to the same point. So for every $\theta$,

        $$\cos(\theta + 2\pi) = \cos\theta, \qquad \sin(\theta + 2\pi) = \sin\theta.$$

        A function that repeats like this is **periodic**, and the smallest positive amount by which the input can be shifted without changing anything is its **period**. Sine and cosine have period $2\pi$. Being periodic, they are as far from injective as a function can be: every value in $[-1, 1]$ is taken infinitely often.

        **The two waves.** Plot $\sin\theta$ against $\theta$ and you get a wave: starting at 0, rising to 1 at $\dfrac{\pi}{2}$, falling through 0 at $\pi$ to $-1$ at $\dfrac{3\pi}{2}$, and back to 0 at $2\pi$, then the same again for ever in both directions. The graph of cosine is the same wave started a quarter of a period earlier. It begins at its peak.

        That last remark is an identity. A quarter-turn anticlockwise sends the point $(x, y)$ to $(-y, x)$, as you found when multiplying by $i$. Applied to the point at angle $\theta$:

        $$\cos\!\left(\theta + \frac{\pi}{2}\right) = -\sin\theta, \qquad \sin\!\left(\theta + \frac{\pi}{2}\right) = \cos\theta.$$

        Sine and cosine are one wave seen from two positions a quarter-turn apart.

        **Shaping a wave.** Real oscillations have their own size and speed. The general wave is

        $$y = A\sin(\omega t + \varphi).$$

        Read it as a composition. $A$, the **amplitude**, multiplies the output: the wave swings between $-A$ and $A$. $\omega$, the Greek letter omega, the **angular frequency**, multiplies the input: it says how many radians are turned through per unit of time. A full cycle needs $\omega t$ to increase by $2\pi$, so the period is

        $$T = \frac{2\pi}{\omega}.$$

        A larger $\omega$ means a shorter period. And $\varphi$, the Greek letter phi, the **phase**, says where in the cycle the wave is at time 0.

        **Tangent.** A third function is the ratio of the first two:

        $$\tan\theta = \frac{\sin\theta}{\cos\theta}.$$

        It is "rise over run" for the line from the origin to the point, so $\tan\theta$ is the **slope** of the line that makes the angle $\theta$ with the positive $x$-axis. It is undefined where $\cos\theta = 0$, at $\dfrac{\pi}{2}$ and every half-turn from it, where that line is vertical. Its period is $\pi$, since a half-turn flips both coordinates and leaves their ratio alone. And $\tan\dfrac{\pi}{4} = 1$: the line $y = x$ has slope 1.

        **Triangles, at last.** Trigonometry is usually begun with right-angled triangles. They are a special case. Take a right-angled triangle with an angle $\theta$ between 0 and $\dfrac{\pi}{2}$, and hypotenuse of length $h$. Shrink it by the factor $h$ and its hypotenuse becomes a radius of the unit circle, its horizontal side $\cos\theta$ and its vertical side $\sin\theta$. Scaling back up,

        $$\text{adjacent} = h\cos\theta, \qquad \text{opposite} = h\sin\theta, \qquad \tan\theta = \frac{\text{opposite}}{\text{adjacent}}.$$

        A point at distance $r$ from the origin in the direction $\theta$ has coordinates $(r\cos\theta, r\sin\theta)$. This is the dictionary between "distance and direction" and "across and up", and it is used whenever something is aimed.

        **Rotation.** Now the pay-off, and it uses the complex numbers. What happens to a point $(x, y)$ when the whole plane is rotated anticlockwise by an angle $\theta$ about the origin?

        Rotation takes the point $(1, 0)$ to $(\cos\theta, \sin\theta)$. That is the definition of the two functions. It takes $(0, 1)$, which is a quarter-turn ahead of $(1, 0)$, to the point a quarter-turn ahead of that: $(-\sin\theta, \cos\theta)$. Now $(x, y)$ is $x$ steps of the first kind and $y$ steps of the second, and rotating a figure does not change how it is built from its parts. So

        $$(x, y) \;\longmapsto\; x(\cos\theta, \sin\theta) + y(-\sin\theta, \cos\theta) = (x\cos\theta - y\sin\theta,\; x\sin\theta + y\cos\theta).$$

        Compare this with a complex product:

        $$(x + yi)(\cos\theta + i\sin\theta) = (x\cos\theta - y\sin\theta) + (x\sin\theta + y\cos\theta)i.$$

        They are the same. **Rotating by $\theta$ is multiplying by the complex number $\cos\theta + i\sin\theta$**, the point of the unit circle at angle $\theta$. For $\theta = \dfrac{\pi}{2}$ that number is $i$, and the quarter-turn you already knew is the first case of a general law.

        **Adding angles.** Rotate by $\alpha$ and then by $\beta$. The result is a rotation by $\alpha + \beta$. In complex numbers:

        $$(\cos\alpha + i\sin\alpha)(\cos\beta + i\sin\beta) = \cos(\alpha + \beta) + i\sin(\alpha + \beta).$$

        Expand the left side, replace $i^2$ by $-1$, and compare real and imaginary parts:

        $$\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta, \qquad \sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta.$$

        These **angle-addition formulas** are worth more than all the other identities of trigonometry together, since the rest follow from them. You need not memorise them, because you can now rebuild them in two lines.

        **The exponential returns.** Look once more at the function $\theta \mapsto \cos\theta + i\sin\theta$. It equals 1 at $\theta = 0$. And it turns **addition** of inputs into **multiplication** of outputs. Those are the two defining habits of an exponential function, $b^0 = 1$ and $b^{x + h} = b^x b^h$. It **is** an exponential, and its base is settled by calculus:

        $$e^{i\theta} = \cos\theta + i\sin\theta.$$

        This is **Euler's formula**. The proof must wait, but the meaning is in your hands already. With a real exponent, $e^x$ grows. With an imaginary exponent, it goes round the unit circle. Growth and rotation are the same function, pointed in two perpendicular directions. Put $\theta = \pi$, a half-turn, and you get the most famous equation in mathematics, $e^{i\pi} = -1$.

        **In Python.** The functions are in `math`, and they take radians.

        ```python
        import math
        print(math.pi)
        print(math.sin(math.pi / 2), math.cos(0))
        print(math.sin(math.radians(30)))
        ```

        The last line shows `0.49999999999999994`, not `0.5`. $\pi$ has no exact float, so neither has $\dfrac{\pi}{6}$, and the tiny error comes through. Compare trigonometric results with a tolerance or round them, never with `==`. `math.radians` and `math.degrees` convert between the two measures.
    - question:
        id: fix-degrees
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `height(radius, degrees)` should return the height above the centre of a wheel of the given radius, after it has turned through an angle given **in degrees**. A wheel of radius 30 that has turned 90° has you at the top, at height 30, but the function prints about `26.82`. Fix it.
        starter: |
          import math

          def height(radius, degrees):
              return radius * math.sin(degrees)

          print(round(height(30, 90), 2))
        solution: |
          import math

          def height(radius, degrees):
              return radius * math.sin(math.radians(degrees))

          print(round(height(30, 90), 2))
        tests: |
          assert abs(height(30, 90) - 30) < 1e-9, "After a quarter-turn you are at the top: height 30. math.sin expects radians."
          assert abs(height(30, 30) - 15) < 1e-9, "After 30 degrees you are half way up: the sine of 30 degrees is one half"
          assert abs(height(1, 0)) < 1e-9, "At the start the height is 0"
          assert abs(height(2, 270) + 2) < 1e-9, "After three quarters of a turn you are at the bottom"
          assert abs(height(10, 360 + 45) - height(10, 45)) < 1e-9, "A full turn more gives the same height"
          assert abs(height(5, -90) + 5) < 1e-9, "A negative angle turns clockwise"
        wrong:
          - "import math\n\ndef height(radius, degrees):\n    return radius * math.cos(math.radians(degrees))\n\nprint(round(height(30, 90), 2))\n"
          - "import math\n\ndef height(radius, degrees):\n    return radius * math.sin(math.degrees(degrees))\n\nprint(round(height(30, 90), 2))\n"
          - "import math\n\ndef height(radius, degrees):\n    return radius * math.sin(degrees * math.pi / 360)\n\nprint(round(height(30, 90), 2))\n"
        explanation: |
          `math.sin(90)` is the sine of 90 **radians**, more than fourteen full turns. The angle must be converted first, with `math.radians`, or by multiplying by $\dfrac{\pi}{180}$. Passing degrees to a function that expects radians is the classic trigonometry bug, and it is hard to spot because it never raises an error. It just returns a number between $-1$ and 1 that looks plausible.
  formal:
    - text: |
        **Radians.** An angle of $\theta$ radians cuts an arc of length $r\theta$ from a circle of radius $r$. $2\pi$ radians $= 360°$.

        **Definition.** For real $\theta$, let $P$ be the point reached from $(1, 0)$ by moving a distance $\lvert\theta\rvert$ along the unit circle $x^2 + y^2 = 1$, anticlockwise if $\theta \ge 0$ and clockwise otherwise. Then $P = (\cos\theta, \sin\theta)$, and $\tan\theta = \dfrac{\sin\theta}{\cos\theta}$ wherever $\cos\theta \ne 0$.

        | Function | Domain | Range | Period |
        | --- | --- | --- | --- |
        | $\sin$ | $\mathbb{R}$ | $[-1, 1]$ | $2\pi$ |
        | $\cos$ | $\mathbb{R}$ | $[-1, 1]$ | $2\pi$ |
        | $\tan$ | $\mathbb{R} \setminus \{\tfrac{\pi}{2} + k\pi : k \in \mathbb{Z}\}$ | $\mathbb{R}$ | $\pi$ |

        For all real $\theta$, $\alpha$ and $\beta$:

        | Identity | Statement |
        | --- | --- |
        | Pythagorean | $\cos^2\theta + \sin^2\theta = 1$ |
        | Even and odd | $\cos(-\theta) = \cos\theta$, $\sin(-\theta) = -\sin\theta$ |
        | Supplement | $\cos(\pi - \theta) = -\cos\theta$, $\sin(\pi - \theta) = \sin\theta$ |
        | Half-turn | $\cos(\theta + \pi) = -\cos\theta$, $\sin(\theta + \pi) = -\sin\theta$ |
        | Quarter-turn | $\cos(\theta + \tfrac{\pi}{2}) = -\sin\theta$, $\sin(\theta + \tfrac{\pi}{2}) = \cos\theta$ |
        | Addition | $\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$ |
        | Addition | $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$ |

        **Waves.** $y = A\sin(\omega t + \varphi)$ with $A > 0$ and $\omega > 0$ has amplitude $A$, period $\dfrac{2\pi}{\omega}$ and phase $\varphi$.

        **Polar form.** The point at distance $r \ge 0$ from the origin in the direction $\theta$ is $(r\cos\theta, r\sin\theta)$. In a right-angled triangle with hypotenuse $h$ and an acute angle $\theta$, the side adjacent to $\theta$ is $h\cos\theta$ and the side opposite is $h\sin\theta$.

        **Rotation.** The anticlockwise rotation about the origin by $\theta$ sends $(x, y)$ to $(x\cos\theta - y\sin\theta,\ x\sin\theta + y\cos\theta)$. Equivalently it sends the complex number $z$ to $(\cos\theta + i\sin\theta)\,z$.

        **Euler's formula.** $e^{i\theta} = \cos\theta + i\sin\theta$ for every real $\theta$. In particular $\lvert e^{i\theta} \rvert = 1$ and $e^{i\pi} = -1$.
  drill:
    - text: Seconds each. Draw the circle in your head, mark the point, read a coordinate.
    - question:
        id: drill-degrees-to-radians
        type: choice
        system: s1
        prompt: |
          What is 60° in radians?
        options: ["$\\dfrac{\\pi}{6}$", "$\\dfrac{\\pi}{4}$", "$\\dfrac{\\pi}{3}$", "$\\dfrac{2\\pi}{3}$"]
        answer: 2
        explanation: 180 degrees is pi radians, and 60 is a third of 180.
    - question:
        id: drill-radians-to-degrees
        type: numeric
        system: s1
        prompt: |
          How many degrees are $\dfrac{3\pi}{4}$ radians?
        answer: "135"
        unit: degrees
        explanation: Pi radians is 180 degrees, so three quarters of it is 135.
    - question:
        id: drill-sin-quarter
        type: numeric
        system: s1
        prompt: |
          What is $\sin\dfrac{\pi}{2}$?
        answer: "1"
        explanation: A quarter-turn takes you to the top of the circle, the point (0, 1), and the sine is the height.
    - question:
        id: drill-cos-pi
        type: numeric
        system: s1
        prompt: |
          What is $\cos\pi$?
        answer: "-1"
        explanation: A half-turn takes you to the leftmost point, (-1, 0), and the cosine is the horizontal coordinate.
    - question:
        id: drill-sin-thirty
        type: numeric
        system: s1
        prompt: |
          What is $\sin\dfrac{\pi}{6}$? Give a decimal.
        answer: "0.5"
        explanation: The point at 30 degrees and its mirror image make an equilateral triangle with the origin, so its height is half of 1.
    - question:
        id: drill-cos-sixty
        type: choice
        system: s1
        prompt: |
          What is $\cos\dfrac{\pi}{3}$?
        options: ["$\\dfrac{1}{2}$", "$\\dfrac{\\sqrt{2}}{2}$", "$\\dfrac{\\sqrt{3}}{2}$", "$1$"]
        answer: 0
        explanation: The cosine row of the table is the sine row backwards. The cosine of 60 degrees is the sine of 30 degrees.
    - question:
        id: drill-quadrant-signs
        type: choice
        system: s1
        prompt: |
          For an angle in the second quadrant, between $\dfrac{\pi}{2}$ and $\pi$, which is true?
        options: ["Sine and cosine are both positive", "Sine is positive and cosine is negative", "Sine is negative and cosine is positive", "Both are negative"]
        answer: 1
        explanation: The point is above the horizontal axis and to the left of the vertical one.
    - question:
        id: drill-identity
        type: numeric
        system: s1
        prompt: |
          What is $\cos^2(1.234) + \sin^2(1.234)$?
        answer: "1"
        explanation: The point lies on the unit circle whatever the angle is, so the squares of its coordinates add to 1.
    - question:
        id: drill-period
        type: choice
        system: s1
        prompt: |
          What is the period of $y = \sin(4t)$?
        options: ["$4$", "$8\\pi$", "$\\dfrac{\\pi}{2}$", "$2\\pi$"]
        answer: 2
        explanation: A full cycle needs 4t to increase by 2 pi, so t increases by 2 pi over 4. A larger multiplier inside means a shorter period.
    - question:
        id: predict-trig
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math
          print(round(math.cos(math.pi), 3), round(math.sin(math.pi), 3), math.degrees(math.pi))
        output: "-1.0 0.0 180.0"
        explanation: Half a turn puts the point at (-1, 0). The sine is not exactly zero as a float, but it rounds to 0.0. Pi radians is 180 degrees.
    - question:
        id: predict-radians
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math
          a = math.radians(30)
          print(round(math.sin(a), 3), round(math.sin(-a), 3), round(math.sin(math.pi - a), 3))
        output: "0.5 -0.5 0.5"
        explanation: The sine of 30 degrees is one half. Sine is odd, so the negative angle gives minus a half. And 150 degrees is the mirror image of 30 degrees in the vertical axis, with the same height.
  work:
    - text: Slower now. Sketch the circle for every question.
    - question:
        id: work-wheel
        type: choice
        system: s2
        prompt: |
          A wheel of radius 20 m has its centre 25 m above the ground. You board at the rightmost point and it turns anticlockwise. How high above the **ground** are you after $\dfrac{5\pi}{6}$ radians?
        options: ["15 m", "35 m", "42.3 m", "7.7 m"]
        answer: 1
        explanation: |
          $\dfrac{5\pi}{6} = \pi - \dfrac{\pi}{6}$, so $\sin\dfrac{5\pi}{6} = \sin\dfrac{\pi}{6} = \dfrac{1}{2}$. Your height above the centre is $20 \times \dfrac{1}{2} = 10$ m, and the centre is 25 m up.
    - question:
        id: work-find-cos
        type: choice
        system: s2
        prompt: |
          $\sin\theta = \dfrac{3}{5}$ and $\theta$ lies between $\dfrac{\pi}{2}$ and $\pi$. What is $\cos\theta$?
        options: ["$\\dfrac{4}{5}$", "$-\\dfrac{4}{5}$", "$\\dfrac{2}{5}$", "$-\\dfrac{3}{5}$"]
        answer: 1
        explanation: |
          $\cos^2\theta = 1 - \dfrac{9}{25} = \dfrac{16}{25}$, so $\cos\theta = \pm\dfrac{4}{5}$. The identity cannot choose the sign. The quadrant does: in the second quadrant the point is to the left of the vertical axis, so the cosine is negative.
    - question:
        id: write-point
        type: code
        mode: write
        system: s2
        prompt: |
          Write `point(r, degrees)` that returns the coordinates, as a tuple `(x, y)`, of the point at distance `r` from the origin in the direction `degrees`, measured anticlockwise from the positive $x$-axis. Round each coordinate to 6 decimal places.
        starter: |
          import math

          def point(r, degrees):
              # Replace the next line with your own.
              return (r, 0.0)

          print(point(1, 90), point(2, 60), point(10, 225))
        solution: |
          import math

          def point(r, degrees):
              angle = math.radians(degrees)
              return (round(r * math.cos(angle), 6), round(r * math.sin(angle), 6))

          print(point(1, 90), point(2, 60), point(10, 225))
        tests: |
          assert point(1, 0) == (1, 0), "Direction 0 is along the positive x-axis"
          assert point(1, 90) == (0, 1), "Direction 90 degrees is straight up. Round to 6 places so that the tiny float error disappears."
          assert point(2, 60) == (1, 1.732051), "At 60 degrees and distance 2 the point is (1, root 3)"
          assert point(10, 225) == (-7.071068, -7.071068), "At 225 degrees the point is in the third quadrant, with equal coordinates"
          assert point(5, 180) == (-5, 0), "Direction 180 degrees is along the negative x-axis"
          assert point(3, -90) == (0, -3), "A negative angle turns clockwise"
          assert point(0, 77) == (0, 0), "At distance 0 the direction does not matter"
        wrong:
          - "import math\n\ndef point(r, degrees):\n    angle = math.radians(degrees)\n    return (round(r * math.sin(angle), 6), round(r * math.cos(angle), 6))\n"
          - "import math\n\ndef point(r, degrees):\n    return (round(r * math.cos(degrees), 6), round(r * math.sin(degrees), 6))\n"
          - "import math\n\ndef point(r, degrees):\n    angle = math.radians(degrees)\n    return (round(math.cos(angle), 6), round(math.sin(angle), 6))\n"
        explanation: Convert the angle to radians. The point on the unit circle in that direction is (cos, sin), cosine first because it is the x-coordinate, and scaling by r moves it out to the right distance. This function turns a distance and a direction into a position, which is what every robot, game and plotting library does.
    - question:
        id: write-rotate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rotate(x, y, theta)` that returns, as a tuple, the point obtained by rotating $(x, y)$ anticlockwise about the origin by `theta` **radians**. Use the rotation formula, with sines and cosines, not Python's complex numbers. Do not round.
        starter: |
          import math

          def rotate(x, y, theta):
              # Replace the next line with your own.
              return (x, y)

          print(rotate(1, 0, math.pi / 2))
          print(rotate(3, 4, math.pi))
        solution: |
          import math

          def rotate(x, y, theta):
              c = math.cos(theta)
              s = math.sin(theta)
              return (x * c - y * s, x * s + y * c)

          print(rotate(1, 0, math.pi / 2))
          print(rotate(3, 4, math.pi))
        tests: |
          import math as _m
          def _close(p, q):
              return p is not None and len(p) == 2 and abs(p[0] - q[0]) < 1e-9 and abs(p[1] - q[1]) < 1e-9
          assert "j" not in source.replace("import", ""), "Use the rotation formula, not complex numbers"
          assert _close(rotate(1, 0, _m.pi / 2), (0, 1)), "A quarter-turn takes (1, 0) to (0, 1)"
          assert _close(rotate(0, 1, _m.pi / 2), (-1, 0)), "A quarter-turn takes (0, 1) to (-1, 0)"
          assert _close(rotate(3, 4, _m.pi), (-3, -4)), "A half-turn changes both signs"
          assert _close(rotate(3, 4, 0), (3, 4)), "Rotating by 0 changes nothing"
          assert _close(rotate(1, 0, _m.pi / 6), (_m.sqrt(3) / 2, 0.5)), "Rotating (1, 0) by 30 degrees gives (cos 30, sin 30)"
          _p = rotate(2, -5, 1.1)
          assert abs(_p[0] ** 2 + _p[1] ** 2 - 29) < 1e-9, "A rotation does not change the distance from the origin"
          _q = rotate(_p[0], _p[1], -1.1)
          assert _close(_q, (2, -5)), "Rotating by -theta undoes rotating by theta"
          _z = complex(2, -5) * complex(_m.cos(0.7), _m.sin(0.7))
          assert _close(rotate(2, -5, 0.7), (_z.real, _z.imag)), "The result should agree with multiplying by cos + i sin"
        wrong:
          - "import math\n\ndef rotate(x, y, theta):\n    c = math.cos(theta)\n    s = math.sin(theta)\n    return (x * c + y * s, x * s - y * c)\n"
          - "import math\n\ndef rotate(x, y, theta):\n    c = math.cos(theta)\n    s = math.sin(theta)\n    return (x * c + y * s, -x * s + y * c)\n"
          - "import math\n\ndef rotate(x, y, theta):\n    c = math.cos(theta)\n    s = math.sin(theta)\n    return (x * c - y * s, x * c + y * s)\n"
        explanation: |
          The formula is the product $(x + yi)(\cos\theta + i\sin\theta)$ written out in real and imaginary parts. The minus sign in the first coordinate is the $i^2$. The second wrong version, with the signs of the sine terms exchanged, is a perfectly good rotation, but clockwise. This function, applied to pairs of numbers with a different angle for each position in a sentence, is how many language models encode word order.
    - question:
        id: fix-period
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `wave(t, amplitude, period)` should return the value at time `t` of a sine wave with the given amplitude and **period**, starting from 0 at `t = 0`. A wave with amplitude 3 and period 8 should reach its first peak, 3, a quarter of a period in, at `t = 2`. The function gives about `-0.84` there. Fix it.
        starter: |
          import math

          def wave(t, amplitude, period):
              return amplitude * math.sin(period * t)

          print(round(wave(2, 3, 8), 3))
        solution: |
          import math

          def wave(t, amplitude, period):
              return amplitude * math.sin(2 * math.pi * t / period)

          print(round(wave(2, 3, 8), 3))
        tests: |
          assert abs(wave(2, 3, 8) - 3) < 1e-9, "A quarter of a period in, the wave is at its peak. The angular frequency is 2 pi divided by the period."
          assert abs(wave(0, 3, 8)) < 1e-9, "The wave starts at 0"
          assert abs(wave(4, 3, 8)) < 1e-9, "Half a period in, the wave is back at 0"
          assert abs(wave(6, 3, 8) + 3) < 1e-9, "Three quarters of a period in, it is at its lowest"
          assert abs(wave(1.3, 5, 2) - wave(1.3 + 2, 5, 2)) < 1e-9, "The wave repeats after one period"
          assert abs(wave(0.25, 1, 1) - 1) < 1e-9, "Amplitude 1 and period 1: the peak is at t = 0.25"
        wrong:
          - "import math\n\ndef wave(t, amplitude, period):\n    return amplitude * math.sin(2 * math.pi * t * period)\n\nprint(round(wave(2, 3, 8), 3))\n"
          - "import math\n\ndef wave(t, amplitude, period):\n    return amplitude * math.sin(t / period)\n\nprint(round(wave(2, 3, 8), 3))\n"
          - "import math\n\ndef wave(t, amplitude, period):\n    return amplitude * math.cos(2 * math.pi * t / period)\n\nprint(round(wave(2, 3, 8), 3))\n"
        explanation: |
          The number multiplying $t$ inside the sine is the angular frequency $\omega$, not the period. They are related by $T = \dfrac{2\pi}{\omega}$, so $\omega = \dfrac{2\pi}{T}$. After one period the angle must have advanced by exactly one full turn, $2\pi$.
    - question:
        id: work-addition-formula
        type: choice
        system: s2
        prompt: |
          Use an angle-addition formula with $75° = 45° + 30°$ to find $\sin 75°$.
        options: ["$\\dfrac{\\sqrt{6} + \\sqrt{2}}{4}$", "$\\dfrac{\\sqrt{2} + 1}{2}$", "$\\dfrac{\\sqrt{6} - \\sqrt{2}}{4}$", "$\\dfrac{\\sqrt{3} + \\sqrt{2}}{2}$"]
        answer: 0
        explanation: |
          $\sin(45° + 30°) = \sin 45°\cos 30° + \cos 45°\sin 30° = \dfrac{\sqrt{2}}{2}\cdot\dfrac{\sqrt{3}}{2} + \dfrac{\sqrt{2}}{2}\cdot\dfrac{1}{2} = \dfrac{\sqrt{6} + \sqrt{2}}{4} \approx 0.966$. The second option is $\sin 45° + \sin 30°$. The sine of a sum is **not** the sum of the sines, and the value $1.207$ could not be a sine at all.
    - question:
        id: work-double-angle
        type: choice
        system: s2
        prompt: |
          Putting $\alpha = \beta = \theta$ in the addition formula for cosine gives a formula for $\cos 2\theta$. Which of these is it?
        options: ["$2\\cos\\theta$", "$\\cos^2\\theta + \\sin^2\\theta$", "$\\cos^2\\theta - \\sin^2\\theta$", "$2\\sin\\theta\\cos\\theta$"]
        answer: 2
        explanation: |
          $\cos(\theta + \theta) = \cos\theta\cos\theta - \sin\theta\sin\theta$. The fourth option is the corresponding formula for $\sin 2\theta$. The second is always 1. And the first is the natural mistake: a function applied to twice the input is not twice the function, unless the function is a straight line through the origin.
    - question:
        id: work-euler
        type: choice
        system: s2
        prompt: |
          By Euler's formula, what is $e^{i\pi/2}$?
        options: ["$-1$", "$i$", "$1$", "$e^{1.57}$, about 4.8"]
        answer: 1
        explanation: |
          $e^{i\pi/2} = \cos\dfrac{\pi}{2} + i\sin\dfrac{\pi}{2} = 0 + i$. It is the point a quarter-turn round the unit circle. Squaring it gives $e^{i\pi} = -1$, which is the statement $i^2 = -1$ read as "two quarter-turns make a half-turn". An imaginary exponent never makes the size grow: every $e^{i\theta}$ has modulus 1.
  connections:
    - text: |
        You have the functions of everything that repeats. Sound is a pressure wave, and a pure note is a sine of time whose frequency is its pitch and whose amplitude is its loudness. Light and radio are waves. So are alternating current, the tides, and the yearly swing of temperature. The deepest fact about waves, which you will meet as the Fourier transform, is that **every** signal, however jagged, is a sum of sines and cosines of different frequencies. Audio models and image compression are built on it.

        Inside the models you are heading towards, these two functions do a job that has nothing to do with physics. A language model reads its words all at once and has no built-in sense of order. So each position in the sentence is given a fingerprint made of sines and cosines at many different frequencies, or, in the newer designs, each pair of numbers describing a word is **rotated** by an angle proportional to its position, using exactly the `rotate` function you wrote. Because rotations compose by adding angles, the model can read off how far apart two words are.

        The cosine will also return as a measure of likeness. Two lists of numbers can be thought of as two arrows, and the cosine of the angle between them says how nearly they point the same way: 1 for the same direction, 0 for perpendicular, $-1$ for opposite. That is cosine similarity, the standard test of whether two pieces of text mean similar things.

        And Euler's formula joined the two great functions of this cluster into one. $e^{x}$ grows, $e^{i\theta}$ turns, and $e^{x + i\theta}$ does both at once, a spiral.

        Several times in this lesson and the last, a phrase like "and so on" or "a sum of many terms" has stood in for something exact: the compound-interest product of $n$ equal factors, a signal as a sum of waves. Sums and products of many terms are about to become the main objects of study, and writing them with dots will no longer do. The next lesson gives them a compact and exact notation: [[m2.summation-and-product-notation]].
