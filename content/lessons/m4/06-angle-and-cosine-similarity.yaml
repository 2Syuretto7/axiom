    - question:
        id: work-law-of-cosines
        type: numeric
        system: s2
        prompt: |
          $\lVert \mathbf{u} \rVert = 3$, $\lVert \mathbf{v} \rVert = 4$, and the angle between them is $60^\circ$. What is $\lVert \mathbf{u} - \mathbf{v} \rVert^2$, the **square** of the distance between them?
        answer: "13"
        explanation: |
          By the law of cosines, $\lVert \mathbf{u} - \mathbf{v} \rVert^2 = 9 + 16 - 2 \times 3 \times 4 \times \frac{1}{2} = 25 - 12 = 13$. At a right angle the answer would have been 25, Pythagoras's 3, 4, 5 triangle. Closing the angle to 60° brings the tips nearer. The middle term, $2\,\mathbf{u} \cdot \mathbf{v}$, is the correction that Pythagoras needs when the angle is not a right angle.
        hints:
          - Expand the squared length of u − v.
          - The dot product is the product of the lengths and the cosine of the angle.
          - Add the two squared lengths and subtract twice the dot product.
    - question:
        id: write-most-similar
        type: code
        mode: write
        system: s2
        prompt: |
          Write `most_similar(query, vectors)`. `vectors` is a non-empty list of non-zero vectors of the same dimension as the non-zero `query`. Return the **index** of the one with the highest cosine similarity to `query`. If two are equally similar, return the earlier one.
        starter: |
          import math

          def most_similar(query, vectors):
              # Replace the next line with your own.
              return 0

          print(most_similar([4, 1], [[1, 4], [40, 10], [3, 3]]))
        solution: |
          import math

          def cosine(u, v):
              top = sum([a * b for a, b in zip(u, v)])
              return top / (math.sqrt(sum([a * a for a in u])) * math.sqrt(sum([b * b for b in v])))

          def most_similar(query, vectors):
              best = 0
              best_score = cosine(query, vectors[0])
              for i in range(1, len(vectors)):
                  score = cosine(query, vectors[i])
                  if score > best_score:
                      best = i
                      best_score = score
              return best

          print(most_similar([4, 1], [[1, 4], [40, 10], [3, 3]]))
        tests: |
          assert most_similar([4, 1], [[1, 4], [40, 10], [3, 3]]) == 1, "[40, 10] points the same way as [4, 1], so the answer is 1. You returned " + repr(most_similar([4, 1], [[1, 4], [40, 10], [3, 3]]))
          assert most_similar([4, 1], [[5, 2], [1, 4], [100, 100]]) == 0, "[5, 2] is closest in direction to [4, 1]. A long vector such as [100, 100] has a large dot product and a lower similarity. You returned " + repr(most_similar([4, 1], [[5, 2], [1, 4], [100, 100]]))
          assert most_similar([1, 0], [[0, 1], [-1, 0], [1, 5]]) == 2, "The similarities are 0, -1 and about 0.2, so the answer is 2. You returned " + repr(most_similar([1, 0], [[0, 1], [-1, 0], [1, 5]]))
          assert most_similar([1, 1], [[10, 9], [1, 1.2], [1, 0]]) == 0, "[10, 9] is closest in direction to [1, 1], though [1, 1.2] is nearest in distance. You returned " + repr(most_similar([1, 1], [[10, 9], [1, 1.2], [1, 0]]))
          assert most_similar([1, 0, 0], [[0, 1, 0], [1, 1, 1], [2, 1, 0]]) == 2, "In three dimensions the similarities are 0, about 0.58 and about 0.89. You returned " + repr(most_similar([1, 0, 0], [[0, 1, 0], [1, 1, 1], [2, 1, 0]]))
          assert most_similar([0, 2], [[3, 4], [-3, 4], [0, -1]]) == 0, "The first two are equally similar, so return the earlier, index 0. You returned " + repr(most_similar([0, 2], [[3, 4], [-3, 4], [0, -1]]))
          assert most_similar([2, 3], [[2, 3]]) == 0, "With a single vector the answer is 0"
          assert output.strip() == "1", "The program should print 1"
        wrong:
