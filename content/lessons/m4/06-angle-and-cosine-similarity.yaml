          - "import math\n\ndef cosine(u, v):\n    top = sum([a * b for a, b in zip(u, v)])\n    return top / (math.sqrt(sum([a * a for a in u])) * math.sqrt(sum([b * b for b in v])))\n\ndef most_similar(query, vectors):\n    best = 0\n    best_score = cosine(query, vectors[0])\n    for i in range(1, len(vectors)):\n        score = cosine(query, vectors[i])\n        if score >= best_score:\n            best = i\n            best_score = score\n    return best\n\nprint(1)\n"
          - "import math\n\ndef cosine(u, v):\n    top = sum([a * b for a, b in zip(u, v)])\n    return top / (math.sqrt(sum([a * a for a in u])) * math.sqrt(sum([b * b for b in v])))\n\ndef most_similar(query, vectors):\n    best = 0\n    best_score = cosine(query, vectors[0])\n    for i in range(1, len(vectors)):\n        score = cosine(query, vectors[i])\n        if score < best_score:\n            best = i\n            best_score = score\n    return best\n\nprint(1)\n"
          - "import math\n\ndef cosine(u, v):\n    top = sum([a * b for a, b in zip(u, v)])\n    return top / (math.sqrt(sum([a * a for a in u])) * math.sqrt(sum([b * b for b in v])))\n\ndef most_similar(query, vectors):\n    best = 0\n    best_score = cosine(query, vectors[0])\n    for i in range(1, len(vectors)):\n        score = cosine(query, vectors[i])\n        if score > best_score:\n            best = i\n    return best\n\nprint(1)\n"
        explanation: |
          The shape is the one you wrote for the nearest neighbour: remember the best index and its score, and replace both when a strictly better score appears. Two things changed. The score is a similarity, so better means **larger**, and the comparison turns round. And the score is the cosine, so length is divided out. Ranking by the bare dot product rewards long vectors, and `[100, 100]` would beat `[5, 2]` for the query `[4, 1]`. Ranking by distance prefers `[1, 1.2]` to `[10, 9]` for the query `[1, 1]`, though the second lies closer in direction. This function, run over millions of stored embeddings, is the retrieval step of a search engine built on a language model.
