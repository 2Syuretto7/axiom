    - question:
        id: work-unit-distance
        type: numeric
        system: s2
        prompt: |
          Two **unit** vectors are at distance exactly 1 from each other. What is their cosine similarity?
        answer: "1/2"
        explanation: |
          For unit vectors $\lVert \hat{\mathbf{u}} - \hat{\mathbf{v}} \rVert^2 = 2 - 2\cos\theta$. With the distance equal to 1, $1 = 2 - 2\cos\theta$, so $\cos\theta = \frac{1}{2}$ and the angle is 60°. That fits a picture: the origin and the two tips are the corners of a triangle whose three sides all have length 1, and every angle of such a triangle is 60°. Among unit vectors, each distance corresponds to exactly one similarity, which is why the two measures always agree there about which vector is closest.
        hints:
          - Use the relation between squared distance and cosine for unit vectors.
          - Set 2 − 2 cos θ equal to the square of 1.
          - Solve for the cosine.
    - question:
        id: work-high-dimension
        type: choice
        system: s2
        prompt: |
          In $\mathbb{R}^n$ let $\mathbf{d}$ be the vector of all ones and $\mathbf{e}$ the vector $(1, 0, 0, \dots, 0)$. What happens to the angle between them as $n$ grows?
        options:
          - "It stays at 45°."
          - "It shrinks towards 0°."
          - "The cosine is $\\frac{1}{\\sqrt{n}}$, which shrinks towards 0, so the angle grows towards 90°: 45° for $n = 2$, about 55° for $n = 3$, and about 84° for $n = 100$."
          - "It grows beyond 90°."
        answer: 2
        explanation: |
          $\mathbf{d} \cdot \mathbf{e} = 1$, $\lVert \mathbf{d} \rVert = \sqrt{n}$ and $\lVert \mathbf{e} \rVert = 1$, so the cosine is $\frac{1}{\sqrt{n}}$. For $n = 100$ that is 0.1, and $\arccos 0.1 \approx 84^\circ$. The cosine stays positive, so the angle never reaches 90°, but it comes as close as you like. The diagonal of a high-dimensional cube is nearly perpendicular to every one of its edges. In such spaces two vectors chosen without care are almost always close to perpendicular, so when two embeddings do have a similarity of 0.8, that is strong evidence of a real connection.
        hints:
          - Compute the dot product and the two lengths for a general n.
          - What happens to 1 over the root of n as n grows?
          - Which angle has a cosine near 0?
  connections:
    - text: |
        The puzzle asked which report is most like a sports report: a longer sports report or a politics report of the same length. Distance could barely tell them apart, because it measures how far apart the tips of the arrows are, and that mixes direction with length. Dividing the dot product by both lengths removes the lengths and leaves the cosine of the angle. By that measure the two sports reports are identical and the politics report is about 62° away.

        The cosine formula was a fact in the plane, and became the definition of angle everywhere else. What allowed the step was the Cauchy-Schwarz inequality from [[m4.norms-and-distance]]: it keeps the ratio between $-1$ and 1, where the arccosine can accept it. An inequality proved with a little calculus and no picture is what gives geometry to spaces of a thousand dimensions.

        Distance and angle were then reconciled by the law of cosines. For vectors of length 1, the squared distance is $2 - 2\cos\theta$, so the nearest vector is the most similar one. Normalise first, and a single dot product does the comparing. That is how documents are retrieved by meaning.

        The cosine tells you **how much** two vectors agree, as a pure number. It does not hand you the part of one vector that lies along the other, as a vector you can subtract and work with. The dot product's shadow was the length of that part. The next lesson, [[m4.projection-onto-a-vector]], builds the part itself, shows that what remains is perpendicular, and finds in it the best approximation of one vector by a multiple of another. From there the cluster goes on to flat sets cut out by a dot product, in [[m4.lines-planes-and-hyperplanes]], and to the question of when a vector adds a new direction at all, in [[m4.linear-independence]].
