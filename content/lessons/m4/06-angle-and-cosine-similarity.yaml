          - "import math\n\ndef angle(u, v):\n    top = sum([a * b for a, b in zip(u, v)])\n    size_u = math.sqrt(sum([a * a for a in u]))\n    size_v = math.sqrt(sum([b * b for b in v]))\n    ratio = max(-1, min(1, top / (size_u * size_v)))\n    return math.degrees(ratio)\n\nprint(90.0)\n"
