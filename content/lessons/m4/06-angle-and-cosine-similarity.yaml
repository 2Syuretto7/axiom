          _near(angle([1, 0], [0, 1]), 90, "The angle between [1, 0] and [0, 1]")
          _near(angle([1, 0], [1, 1]), 45, "The angle between [1, 0] and [1, 1]")
          _near(angle([1, 0], [-1, 0]), 180, "The angle between opposite vectors")
