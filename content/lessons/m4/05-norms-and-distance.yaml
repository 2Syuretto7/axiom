concept: m4.norms-and-distance
minutes: 90
claim: You can measure the distance between two vectors as the length of their difference, prove the Cauchy-Schwarz and triangle inequalities, compute the Euclidean, taxicab and maximum norms and say what each one counts, and use norms for squared error, nearest neighbours and limiting the size of a step.
recalls: [m4.dot-product]
uses: [m4.vector-addition-and-scaling, m4.vectors-as-arrows-and-as-lists, m1.inequalities-and-absolute-value, m1.quadratics, m1.coordinates-and-the-plane, m10.maxima-and-minima, m3.direct-proof, e0.functions, e0.loops, e0.lists-and-tuples, e1.comprehensions-and-iterators, e1.modules-and-imports]
leads: [m4.angle-and-cosine-similarity, m4.projection-onto-a-vector, m12.gradient, m19.gradient-descent]
starter: |
  # Scratch space. Your flat is at [0, 0]. Two shops, measured in blocks.
  # Which is nearer in a straight line? Which is nearer along the streets?
  import math

  shops = {"P": [3, 3], "Q": [0, 5]}
  for name in shops:
      x, y = shops[name]
      print(name, "straight", math.sqrt(x * x + y * y), "streets", abs(x) + abs(y))
parts:
  recall:
    - text: |
        [[m4.dot-product]] produced length out of the dot product, $\lVert \mathbf{v} \rVert = \sqrt{\mathbf{v} \cdot \mathbf{v}}$, and claimed, from a picture, that $\mathbf{u} \cdot \mathbf{v}$ can never exceed the product of the two lengths. Today that claim is proved, and length itself is looked at more carefully. Three quick pulls first.
    - question:
        id: recall-dot
        type: numeric
        system: s1
        concepts: [m4.dot-product]
        prompt: |
          What is $(2, 3) \cdot (4, -1)$?
        answer: "5"
        explanation: 8 − 3.
    - question:
        id: recall-self
        type: choice
        system: s1
        concepts: [m4.dot-product]
        prompt: |
          What is $\mathbf{v} \cdot \mathbf{v}$?
        options: ["$\\lVert \\mathbf{v} \\rVert$", "$\\lVert \\mathbf{v} \\rVert^2$", "$2\\mathbf{v}$", "$0$"]
        answer: 1
        explanation: The sum of the squares of the components, which is the square of the length.
    - question:
        id: recall-between
        type: choice
        system: s1
        concepts: [m4.vector-addition-and-scaling]
        prompt: |
          Drawn from the same point, which arrow joins the tip of $\mathbf{v}$ to the tip of $\mathbf{u}$?
        options: ["$\\mathbf{u} + \\mathbf{v}$", "$\\mathbf{u} - \\mathbf{v}$", "$\\mathbf{v} - \\mathbf{u}$", "$\\mathbf{u} \\cdot \\mathbf{v}$"]
        answer: 1
        explanation: End minus start. It is what must be added to v to reach u.
  puzzle:
    - text: |
        You live in a city laid out as a grid of streets. From your flat, shop P is 3 blocks east and 3 blocks north. Shop Q is 5 blocks due north. **Which shop is nearer?**

        Run the starter. In a straight line, P is about 4.24 blocks away and Q is 5: P is nearer. But you cannot walk through buildings. Along the streets, P is 6 blocks away and Q is 5: Q is nearer.

        Both answers are correct. They answer different questions, because "how far" was never one question. A bird, a pedestrian and a delivery planner each have their own sensible meaning for it.

        This matters more than it seems to. A great deal of machine learning comes down to one of two instructions. "Find the stored example **closest** to this new one." "Adjust the weights until the predictions are as **close** as possible to the truth." Each depends entirely on what "close" means, and different meanings give different answers.

        **What may count as a measure of distance? What must every sensible one have in common? And what changes when you choose one over another?**
  intuition:
    - text: |
        Start with what does not change. However you measure, the distance from $\mathbf{u}$ to $\mathbf{v}$ should depend only on the **journey** between them, and that journey is the vector $\mathbf{v} - \mathbf{u}$. So measuring distances between points comes down to measuring the **size of a single vector**. Decide how big a vector is, and distance follows: the distance between two vectors is the size of their difference.

        A rule that assigns a size to every vector is called a **norm**. The bird's rule is the one you know, the root of the sum of the squares. The pedestrian's rule is to add up the blocks walked along each axis, east-west and north-south, ignoring direction: the sum of the absolute values of the components. A third rule looks only at the **largest** component: if two cranes move a load in both directions at once, the time taken is set by the longer of the two movements.

        What should any such rule satisfy? Three things, each hard to argue with.

        1. Sizes are never negative, and only the zero vector has size zero.
        2. Doubling a vector doubles its size, and reversing it changes nothing.
        3. A detour is never a shortcut. Going from A to B by way of C is at least as long as going direct.

        All three rules above pass all three tests. They disagree about the numbers, and one picture shows how. Take all the vectors whose size is exactly 1, and draw their tips. For the bird this is a circle. Change the norm in the figure and see what the "circle" becomes.
    - figure: norm-balls
      props: { x: 1.5, y: 1 }
    - text: |
        For the pedestrian the points at distance 1 form a diamond, and for the largest-component rule a square. Along the axes all three agree. Along the diagonals they differ most: the pedestrian finds diagonal journeys expensive, and the square rule finds them cheap.
  derivation:
    - text: |
        **The Euclidean norm and distance.** The norm you have been using is

        $$\lVert \mathbf{v} \rVert_2 = \sqrt{v_1^2 + \dots + v_n^2} = \sqrt{\mathbf{v} \cdot \mathbf{v}},$$

        named after Euclid and written with a small 2 when other norms are about. The **distance** between two vectors is the norm of their difference:

        $$d(\mathbf{u}, \mathbf{v}) = \lVert \mathbf{u} - \mathbf{v} \rVert = \sqrt{(u_1 - v_1)^2 + \dots + (u_n - v_n)^2}.$$

        In the plane this is the distance formula of your first lesson on coordinates. It is the same in either direction, since $\lVert \mathbf{u} - \mathbf{v} \rVert = \lVert -(\mathbf{v} - \mathbf{u}) \rVert = \lVert \mathbf{v} - \mathbf{u} \rVert$.

        The first two requirements are immediate for this norm. A sum of squares is never negative and is zero only if every component is zero. And $\lVert c\,\mathbf{v} \rVert = \lvert c \rvert\,\lVert \mathbf{v} \rVert$ was shown when scaling was introduced. The third requirement is not obvious at all, and proving it takes an inequality that is among the most used in mathematics.

        **The Cauchy-Schwarz inequality.** For all vectors $\mathbf{u}$ and $\mathbf{v}$ of the same dimension,

        $$\lvert \mathbf{u} \cdot \mathbf{v} \rvert \le \lVert \mathbf{u} \rVert\,\lVert \mathbf{v} \rVert.$$

        *Proof.* If $\mathbf{v} = \mathbf{0}$ both sides are 0. Otherwise, consider the vector $\mathbf{u} - t\,\mathbf{v}$ for a real number $t$. Whatever $t$ is, its squared length is not negative. Expand it by the rules of the dot product:

        $$f(t) = \lVert \mathbf{u} - t\,\mathbf{v} \rVert^2 = \lVert \mathbf{u} \rVert^2 - 2t\,(\mathbf{u} \cdot \mathbf{v}) + t^2\,\lVert \mathbf{v} \rVert^2 \;\ge\; 0.$$

        This is a quadratic in $t$, a bowl, since the coefficient of $t^2$ is positive. Find its lowest point as you learned to: $f'(t) = -2\,(\mathbf{u} \cdot \mathbf{v}) + 2t\,\lVert \mathbf{v} \rVert^2 = 0$ at

        $$t = \frac{\mathbf{u} \cdot \mathbf{v}}{\lVert \mathbf{v} \rVert^2}.$$

        Put that $t$ back. The least value of $f$ is

        $$\lVert \mathbf{u} \rVert^2 - \frac{(\mathbf{u} \cdot \mathbf{v})^2}{\lVert \mathbf{v} \rVert^2}.$$

        Even this least value is not negative, because $f$ never is. So $(\mathbf{u} \cdot \mathbf{v})^2 \le \lVert \mathbf{u} \rVert^2\,\lVert \mathbf{v} \rVert^2$, and taking square roots gives the inequality. $\blacksquare$

        No picture and no angle appeared, so the proof holds in any number of dimensions. It has a consequence worth noticing. The ratio $\dfrac{\mathbf{u} \cdot \mathbf{v}}{\lVert \mathbf{u} \rVert\,\lVert \mathbf{v} \rVert}$ always lies between $-1$ and 1. That is exactly the range of a cosine, and it is what will allow an **angle** to be defined between vectors in a space no one can draw.

        When does equality hold? When the least value of $f$ is 0, which means that $\mathbf{u} - t\,\mathbf{v} = \mathbf{0}$ for that $t$: $\mathbf{u}$ is a multiple of $\mathbf{v}$. The dot product reaches its limit exactly when the vectors are parallel.

        **The triangle inequality.** For all $\mathbf{u}$ and $\mathbf{v}$,

        $$\lVert \mathbf{u} + \mathbf{v} \rVert \le \lVert \mathbf{u} \rVert + \lVert \mathbf{v} \rVert.$$

        *Proof.* Expand the square, and use Cauchy-Schwarz on the middle term:

        $$\lVert \mathbf{u} + \mathbf{v} \rVert^2 = \lVert \mathbf{u} \rVert^2 + 2\,\mathbf{u} \cdot \mathbf{v} + \lVert \mathbf{v} \rVert^2 \;\le\; \lVert \mathbf{u} \rVert^2 + 2\,\lVert \mathbf{u} \rVert\,\lVert \mathbf{v} \rVert + \lVert \mathbf{v} \rVert^2 = \bigl(\lVert \mathbf{u} \rVert + \lVert \mathbf{v} \rVert\bigr)^2.$$

        Both sides are squares of non-negative numbers, so the inequality passes to the square roots. $\blacksquare$

        With arrows tip to tail, $\mathbf{u}$, $\mathbf{v}$ and $\mathbf{u} + \mathbf{v}$ are the three sides of a triangle, and the statement is that one side is never longer than the other two together. This is the promise made when vectors were first added: lengths 3 and 4 give a sum of length at most 7. For distances it reads $d(A, B) \le d(A, C) + d(C, B)$: the detour by way of $C$ is never shorter.
    - question:
        id: derivation-cs
        type: choice
        system: s2
        prompt: |
          The proof of the Cauchy-Schwarz inequality studied $f(t) = \lVert \mathbf{u} - t\,\mathbf{v} \rVert^2$. What single fact about $f$ was the source of the inequality?
        options:
          - "$f$ is a polynomial."
          - "$f(t) \\ge 0$ for every $t$, since it is a squared length. So even its least value, $\\lVert \\mathbf{u} \\rVert^2 - \\frac{(\\mathbf{u} \\cdot \\mathbf{v})^2}{\\lVert \\mathbf{v} \\rVert^2}$, is not negative."
          - "$f(0) = \\lVert \\mathbf{u} \\rVert^2$."
          - "$f$ has no minimum."
        answer: 1
        explanation: |
          A squared length cannot be negative, whatever $t$ is. The proof then asks where $f$ is smallest, because that is where the statement "$f \ge 0$" says the most. Setting the derivative to zero gives $t = \frac{\mathbf{u} \cdot \mathbf{v}}{\lVert \mathbf{v} \rVert^2}$, and writing out $f \ge 0$ at that point is the inequality. The value of $t$ found here is not a trick. It is the multiple of $\mathbf{v}$ that comes closest to $\mathbf{u}$, and it returns two lessons from now as the projection.
    - text: |
        **Other norms.** A **norm** is any function $\lVert \cdot \rVert$ from vectors to numbers that satisfies the three requirements:

        | Requirement | Statement |
        | --- | --- |
        | positive | $\lVert \mathbf{v} \rVert \ge 0$, and $\lVert \mathbf{v} \rVert = 0$ only for $\mathbf{v} = \mathbf{0}$ |
        | scales | $\lVert c\,\mathbf{v} \rVert = \lvert c \rvert\,\lVert \mathbf{v} \rVert$ |
        | triangle inequality | $\lVert \mathbf{u} + \mathbf{v} \rVert \le \lVert \mathbf{u} \rVert + \lVert \mathbf{v} \rVert$ |

        Three norms are in constant use.

        | Name | Formula | Counts |
        | --- | --- | --- |
        | Euclidean, or 2-norm | $\lVert \mathbf{v} \rVert_2 = \sqrt{v_1^2 + \dots + v_n^2}$ | the straight-line length |
        | taxicab, or 1-norm | $\lVert \mathbf{v} \rVert_1 = \lvert v_1 \rvert + \dots + \lvert v_n \rvert$ | the total change, component by component |
        | maximum, or infinity-norm | $\lVert \mathbf{v} \rVert_\infty = \max_i \lvert v_i \rvert$ | the largest single change |

        For the 1-norm and the maximum norm the triangle inequality follows directly from $\lvert a + b \rvert \le \lvert a \rvert + \lvert b \rvert$ for numbers, applied to each component.

        For $\mathbf{v} = (3, -4)$ the three norms are 5, 7 and 4. They always come in that order,

        $$\lVert \mathbf{v} \rVert_\infty \le \lVert \mathbf{v} \rVert_2 \le \lVert \mathbf{v} \rVert_1,$$

        and they coincide when only one component is non-zero. The puzzle's two shops are a case where the order of two **points** depends on the norm: P is $(3, 3)$ with norms about 4.24 and 6, and Q is $(0, 5)$ with norms 5 and 5.

        **Why the choice matters.** The norm decides how a total discrepancy is shared out among the components.

        *Squared error.* If $\mathbf{y}$ holds the true values for $n$ examples and $\hat{\mathbf{y}}$ the predictions, the error vector is $\mathbf{y} - \hat{\mathbf{y}}$, and the most common measure of a model's failure is the square of its Euclidean norm, averaged:

        $$\text{mean squared error} = \frac{1}{n}\,\lVert \mathbf{y} - \hat{\mathbf{y}} \rVert_2^2 = \frac{1}{n}\sum_{i=1}^{n} (y_i - \hat{y}_i)^2.$$

        This is the quantity you minimised in the lesson on maxima and minima, where the best single prediction turned out to be the mean. Squaring punishes one large miss far more than several small ones: errors of $(1, 1, 1, 10)$ have a 1-norm of 13 and a squared 2-norm of 103, of which the last component supplies 100. A model trained on squared error will work hard to avoid large misses. One trained on the 1-norm, the **mean absolute error**, will tolerate an occasional large miss, and is less disturbed by a few wild measurements.

        *Nearest neighbours.* The simplest way to classify a new example is to find the stored example nearest to it and copy its label. "Nearest" is a norm, and as the shops show, the answer can depend on which.

        *Keeping weights small.* In the lesson on minima a penalty $\frac{1}{2}w^2$ pulled a weight towards zero. For a weight vector the penalty is $\lVert \mathbf{w} \rVert_2^2$, which shrinks all the weights a little. A penalty $\lVert \mathbf{w} \rVert_1$ behaves differently: it tends to push some weights to **exactly** zero, because of the sharp corners of its diamond on the axes.

        *Limiting a step.* The size of a descent step is $\eta\,\lVert \mathbf{g} \rVert$. If the vector of slopes is occasionally enormous, one step can throw the weights far away. A common remedy is to **clip**: if $\lVert \mathbf{g} \rVert$ exceeds a limit $L$, replace $\mathbf{g}$ by $\dfrac{L}{\lVert \mathbf{g} \rVert}\,\mathbf{g}$, the vector in the same direction with length exactly $L$.
    - question:
        id: order-triangle
        type: order
        system: s2
        prompt: Put the steps in order to prove the triangle inequality $\lVert \mathbf{u} + \mathbf{v} \rVert \le \lVert \mathbf{u} \rVert + \lVert \mathbf{v} \rVert$.
        steps:
          - "Expand the squared length: $\\lVert \\mathbf{u} + \\mathbf{v} \\rVert^2 = \\lVert \\mathbf{u} \\rVert^2 + 2\\,\\mathbf{u} \\cdot \\mathbf{v} + \\lVert \\mathbf{v} \\rVert^2$."
          - "By Cauchy-Schwarz, $\\mathbf{u} \\cdot \\mathbf{v} \\le \\lVert \\mathbf{u} \\rVert\\,\\lVert \\mathbf{v} \\rVert$."
          - "So $\\lVert \\mathbf{u} + \\mathbf{v} \\rVert^2 \\le \\lVert \\mathbf{u} \\rVert^2 + 2\\,\\lVert \\mathbf{u} \\rVert\\,\\lVert \\mathbf{v} \\rVert + \\lVert \\mathbf{v} \\rVert^2$."
          - "The right-hand side is $\\bigl(\\lVert \\mathbf{u} \\rVert + \\lVert \\mathbf{v} \\rVert\\bigr)^2$."
          - "Both sides are squares of non-negative numbers, so take square roots."
        explanation: The squared length is expanded so that the dot product appears. Cauchy-Schwarz bounds that one term. The bound is then recognised as a perfect square, and only at the end are the squares removed, which is allowed because neither side is negative.
  formal:
    - text: |
        **Norm.** A function $\lVert \cdot \rVert$ on $\mathbb{R}^n$ with $\lVert \mathbf{v} \rVert \ge 0$ and $\lVert \mathbf{v} \rVert = 0$ only if $\mathbf{v} = \mathbf{0}$, $\ \lVert c\,\mathbf{v} \rVert = \lvert c \rvert\,\lVert \mathbf{v} \rVert$, and $\lVert \mathbf{u} + \mathbf{v} \rVert \le \lVert \mathbf{u} \rVert + \lVert \mathbf{v} \rVert$.

        **Three norms.** $\lVert \mathbf{v} \rVert_1 = \sum \lvert v_i \rvert$, $\quad \lVert \mathbf{v} \rVert_2 = \sqrt{\sum v_i^2}$, $\quad \lVert \mathbf{v} \rVert_\infty = \max \lvert v_i \rvert$, with $\lVert \mathbf{v} \rVert_\infty \le \lVert \mathbf{v} \rVert_2 \le \lVert \mathbf{v} \rVert_1$.

        **Distance.** $d(\mathbf{u}, \mathbf{v}) = \lVert \mathbf{u} - \mathbf{v} \rVert$. It is symmetric, zero only when $\mathbf{u} = \mathbf{v}$, and satisfies $d(\mathbf{u}, \mathbf{w}) \le d(\mathbf{u}, \mathbf{v}) + d(\mathbf{v}, \mathbf{w})$.

        **Cauchy-Schwarz.** $\lvert \mathbf{u} \cdot \mathbf{v} \rvert \le \lVert \mathbf{u} \rVert_2\,\lVert \mathbf{v} \rVert_2$, with equality exactly when one vector is a multiple of the other.

        **Mean squared error.** $\frac{1}{n}\,\lVert \mathbf{y} - \hat{\mathbf{y}} \rVert_2^2$. **Mean absolute error.** $\frac{1}{n}\,\lVert \mathbf{y} - \hat{\mathbf{y}} \rVert_1$.

        **Clipping.** If $\lVert \mathbf{g} \rVert > L$, replace $\mathbf{g}$ by $\dfrac{L}{\lVert \mathbf{g} \rVert}\,\mathbf{g}$.
  drill:
    - text: Seconds each. Subtract first, then measure the difference.
    - question:
        id: drill-distance
        type: numeric
        system: s1
        prompt: |
          What is the Euclidean distance between $(1, 2)$ and $(4, 6)$?
        answer: "5"
        explanation: The difference is (3, 4), of length 5.
    - question:
        id: drill-l1
        type: numeric
        system: s1
        prompt: |
          What is the taxicab norm $\lVert (3, -4) \rVert_1$?
        answer: "7"
        explanation: 3 + 4. The sign of a component is ignored.
    - question:
        id: drill-linf
        type: numeric
        system: s1
        prompt: |
          What is the maximum norm $\lVert (3, -4) \rVert_\infty$?
        answer: "4"
        explanation: The largest absolute value among the components.
    - question:
        id: drill-l2
        type: numeric
        system: s1
        prompt: |
          What is the Euclidean norm $\lVert (3, -4) \rVert_2$?
        answer: "5"
        explanation: The square root of 9 + 16. It lies between the maximum norm 4 and the taxicab norm 7.
    - question:
        id: drill-taxi-distance
        type: numeric
        system: s1
        prompt: |
          What is the taxicab distance between $(1, 1)$ and $(4, 5)$?
        answer: "7"
        explanation: The difference is (3, 4), and 3 + 4 = 7.
    - question:
        id: drill-triangle-bound
        type: numeric
        system: s1
        prompt: |
          $\lVert \mathbf{u} \rVert = 3$ and $\lVert \mathbf{v} \rVert = 4$. What is the largest possible value of $\lVert \mathbf{u} + \mathbf{v} \rVert$?
        answer: "7"
        explanation: The triangle inequality gives at most 3 + 4, reached when the vectors point the same way.
    - question:
        id: drill-cs-bound
        type: numeric
        system: s1
        prompt: |
          $\lVert \mathbf{u} \rVert = 3$ and $\lVert \mathbf{v} \rVert = 4$. What is the largest possible value of $\mathbf{u} \cdot \mathbf{v}$?
        answer: "12"
        explanation: By Cauchy-Schwarz the dot product is at most the product of the lengths, reached when the vectors are parallel.
    - question:
        id: drill-squared-error
        type: numeric
        system: s1
        prompt: |
          The true values are $(1, 2)$ and the predictions $(3, 5)$. What is the squared Euclidean norm of the error?
        answer: "13"
        explanation: The error is (−2, −3), and 4 + 9 = 13.
    - question:
        id: drill-shape
        type: choice
        system: s1
        prompt: |
          In the plane, what shape is formed by all the points whose taxicab norm is 1?
        options: ["A circle", "A square with sides parallel to the axes", "A diamond with corners on the axes", "A cross"]
        answer: 2
        explanation: The points with |x| + |y| = 1 lie on four straight segments joining (1, 0), (0, 1), (−1, 0) and (0, −1).
    - question:
        id: drill-order
        type: choice
        system: s1
        prompt: |
          Which ordering holds for every vector?
        options:
          - "$\\lVert \\mathbf{v} \\rVert_1 \\le \\lVert \\mathbf{v} \\rVert_2 \\le \\lVert \\mathbf{v} \\rVert_\\infty$"
          - "$\\lVert \\mathbf{v} \\rVert_\\infty \\le \\lVert \\mathbf{v} \\rVert_2 \\le \\lVert \\mathbf{v} \\rVert_1$"
          - "$\\lVert \\mathbf{v} \\rVert_2 \\le \\lVert \\mathbf{v} \\rVert_\\infty \\le \\lVert \\mathbf{v} \\rVert_1$"
          - "No ordering always holds."
        answer: 1
        explanation: For (3, −4) the three are 4, 5 and 7. The largest component is at most the straight-line length, which is at most the total walked along the axes.
    - question:
        id: drill-zero
        type: choice
        system: s1
        prompt: |
          $d(\mathbf{u}, \mathbf{v}) = 0$. What follows?
        options: ["$\\mathbf{u} \\perp \\mathbf{v}$", "$\\mathbf{u} = \\mathbf{v}$", "$\\mathbf{u} = -\\mathbf{v}$", "Nothing"]
        answer: 1
        explanation: The norm of u − v is zero only if u − v is the zero vector.
    - question:
        id: predict-three-norms
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          v = [3, -4]
          print(sum([abs(x) for x in v]), math.sqrt(sum([x * x for x in v])), max([abs(x) for x in v]))
        output: "7 5.0 4"
        explanation: The taxicab norm is 3 + 4, the Euclidean norm is the root of 25, and the maximum norm is the larger of 3 and 4.
    - question:
        id: predict-distance
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          u = [1, 2]
          v = [4, 6]
          print(math.sqrt(sum([(a - b) ** 2 for a, b in zip(u, v)])))
        output: "5.0"
        explanation: The differences are −3 and −4, their squares 9 and 16, and the root of 25 is 5.0. The distance is the length of the difference.
  work:
    - text: Slower now. Say which norm each question is about, and why that norm suits it.
    - question:
        id: work-mse
        type: numeric
        system: s2
        prompt: |
          The true values are $\mathbf{y} = (1, 3, 5, 7)$ and a model predicts $\hat{\mathbf{y}} = (2, 2, 6, 6)$. What is the mean squared error?
        answer: "1"
        explanation: |
          The error vector is $(-1, 1, -1, 1)$. Its squared norm is $1 + 1 + 1 + 1 = 4$, and the mean over the four examples is 1. Notice that the errors themselves add up to 0: the model is as often too high as too low. Adding the errors without squaring would report a perfect model. Squaring, or taking absolute values, stops positive and negative errors from cancelling.
    - question:
        id: work-shops
        type: choice
        system: s2
        prompt: |
          From your flat at the origin, shop P is at $(3, 3)$ and shop Q is at $(0, 5)$. Which statement is correct?
        options:
          - "P is nearer by every norm."
          - "P is nearer in the Euclidean norm, about 4.24 against 5. Q is nearer in the taxicab norm, 5 against 6. In the maximum norm P is nearer, 3 against 5."
          - "Q is nearer by every norm."
          - "The two are equally far by every norm."
        answer: 1
        explanation: |
          $\lVert (3, 3) \rVert_2 = \sqrt{18} \approx 4.24$, $\lVert (3, 3) \rVert_1 = 6$ and $\lVert (3, 3) \rVert_\infty = 3$. For $(0, 5)$ all three norms are 5, since only one component is non-zero. A vector along a diagonal is the one on which the three norms differ most, and a vector along an axis is the one on which they agree. Which shop is "nearest" depends on the norm, and a nearest-neighbour method inherits that dependence.
    - question:
        id: write-nearest
        type: code
        mode: write
        system: s2
        prompt: |
          Write `nearest(point, points)`. `points` is a non-empty list of vectors of the same dimension as `point`. Return the **index** of the one closest to `point` in Euclidean distance. If two are equally close, return the earlier one.
        starter: |
          import math

          def nearest(point, points):
              # Replace the next line with your own.
              return 0

          print(nearest([0, 0], [[3, 3], [0, 5], [-4, 1]]))
        solution: |
          import math

          def nearest(point, points):
              best = 0
              best_distance = math.sqrt(sum([(a - b) ** 2 for a, b in zip(point, points[0])]))
              for i in range(1, len(points)):
                  distance = math.sqrt(sum([(a - b) ** 2 for a, b in zip(point, points[i])]))
                  if distance < best_distance:
                      best = i
                      best_distance = distance
              return best

          print(nearest([0, 0], [[3, 3], [0, 5], [-4, 1]]))
        tests: |
          assert nearest([0, 0], [[3, 3], [0, 5], [-4, 1]]) == 2, "From the origin the distances are about 4.24, 5 and 4.12, so the nearest has index 2. You returned " + repr(nearest([0, 0], [[3, 3], [0, 5], [-4, 1]]))
          assert nearest([0, 0], [[3, 3], [0, 5]]) == 0, "In Euclidean distance [3, 3] is nearer the origin than [0, 5]. You returned " + repr(nearest([0, 0], [[3, 3], [0, 5]]))
          assert nearest([4, 1], [[8, 2], [1, 4], [4, 2]]) == 2, "The nearest point to [4, 1] is [4, 2], at index 2. You returned " + repr(nearest([4, 1], [[8, 2], [1, 4], [4, 2]]))
          assert nearest([10, 10], [[0, 0], [9, 12], [10, 13]]) == 1, "From [10, 10] the distances are about 14.1, 2.24 and 3, so the answer is 1. You returned " + repr(nearest([10, 10], [[0, 0], [9, 12], [10, 13]]))
          assert nearest([5], [[1], [9], [6]]) == 2, "With one component, 6 is the nearest to 5. You returned " + repr(nearest([5], [[1], [9], [6]]))
