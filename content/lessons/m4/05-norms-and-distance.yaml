    - question:
        id: fix-mse
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `mse(y, predicted)` should return the mean squared error between the true values and the predictions. For the values below it should print 1.0. It prints 0.0, as if the predictions were perfect. Fix it.
        starter: |
          def mse(y, predicted):
              return sum([a - b for a, b in zip(y, predicted)]) / len(y)

          print(mse([1, 3, 5, 7], [2, 2, 6, 6]))
        solution: |
          def mse(y, predicted):
              return sum([(a - b) ** 2 for a, b in zip(y, predicted)]) / len(y)

          print(mse([1, 3, 5, 7], [2, 2, 6, 6]))
        tests: |
          assert abs(mse([1, 3, 5, 7], [2, 2, 6, 6]) - 1) < 1e-12, "The errors are -1, 1, -1, 1. Their squares add to 4, and the mean is 1. You returned " + repr(mse([1, 3, 5, 7], [2, 2, 6, 6]))
          assert abs(mse([1, 2], [3, 5]) - 6.5) < 1e-12, "The errors are -2 and -3. Their squares add to 13, and the mean is 6.5. You returned " + repr(mse([1, 2], [3, 5]))
          assert mse([4, 4, 4], [4, 4, 4]) == 0, "Perfect predictions have error 0"
          assert abs(mse([0, 0, 0, 0], [1, 1, 1, 10]) - 25.75) < 1e-12, "The squares are 1, 1, 1 and 100, with mean 25.75. You returned " + repr(mse([0, 0, 0, 0], [1, 1, 1, 10]))
          assert abs(mse([5], [2]) - 9) < 1e-12, "With one example the error is 3 and its square is 9. You returned " + repr(mse([5], [2]))
          assert abs(mse([2, 2], [3, 5]) - mse([3, 5], [2, 2])) < 1e-12, "The error is the same whichever list is called the truth"
          assert output.strip() == "1.0", "The program should print 1.0"
        wrong:
          - "def mse(y, predicted):\n    return sum([a - b for a, b in zip(y, predicted)]) / len(y)\n\nprint(1.0)\n"
          - "def mse(y, predicted):\n    return sum([abs(a - b) for a, b in zip(y, predicted)]) / len(y)\n\nprint(1.0)\n"
          - "def mse(y, predicted):\n    return sum([(a - b) ** 2 for a, b in zip(y, predicted)])\n\nprint(1.0)\n"
          - "def mse(y, predicted):\n    return sum([a - b for a, b in zip(y, predicted)]) ** 2 / len(y)\n\nprint(1.0)\n"
          - "def mse(y, predicted):\n    return sum([a ** 2 - b ** 2 for a, b in zip(y, predicted)]) / len(y)\n\nprint(1.0)\n"
        explanation: |
          The starter averaged the errors themselves. These predictions are too high twice and too low twice by the same amount, so the errors cancel and the average is 0, although not one prediction is right. A measure of error must not let misses in opposite directions cancel, and squaring each one before adding sees to that. Squaring the **total** afterwards does not help, because the cancelling has already happened. Taking absolute values in place of squares gives a different, equally legitimate measure, the mean absolute error, which happens to agree here and differs as soon as the errors are not all of size 1.
    - question:
        id: write-clip
        type: code
        mode: write
        system: s2
        prompt: |
          Write `clip(g, limit)`. If the Euclidean norm of `g` is at most `limit`, return `g` unchanged, as a new list. Otherwise return the vector in the same direction whose norm is exactly `limit`:

          $$\frac{\text{limit}}{\lVert \mathbf{g} \rVert}\,\mathbf{g}.$$
        starter: |
          import math

          def clip(g, limit):
              # Replace the next line with your own.
              return g

          print(clip([3, 4], 2.5), clip([3, 4], 10))
        solution: |
          import math

          def clip(g, limit):
              size = math.sqrt(sum([x * x for x in g]))
              if size <= limit:
                  return [x for x in g]
              return [x * limit / size for x in g]

          print(clip([3, 4], 2.5), clip([3, 4], 10))
        tests: |
          import math as _m
          def _close(got, want, name):
              assert len(got) == len(want), name + " should have " + str(len(want)) + " components"
              for _a, _b in zip(got, want):
                  assert abs(_a - _b) < 1e-9, name + " should be " + str(want) + " and you returned " + repr(got)
          _close(clip([3, 4], 2.5), [1.5, 2], "clip([3, 4], 2.5)")
          _close(clip([3, 4], 1), [0.6, 0.8], "clip([3, 4], 1)")
          _close(clip([3, 4], 10), [3, 4], "clip([3, 4], 10), which is already short enough,")
          _close(clip([3, 4], 5), [3, 4], "clip([3, 4], 5), which is exactly at the limit,")
          _close(clip([-6, 8], 5), [-3, 4], "clip([-6, 8], 5)")
          _close(clip([0, 0, 0], 1), [0, 0, 0], "clip of the zero vector")
          _close(clip([1, 2, 2], 1.5), [0.5, 1, 1], "clip([1, 2, 2], 1.5)")
          for _g in [[30, -40], [1, 1, 1, 1], [0, 9]]:
              _c = clip(_g, 2)
              assert abs(_m.sqrt(sum([x * x for x in _c])) - 2) < 1e-9, "A vector longer than the limit should come back with norm exactly 2. For " + str(_g) + " you returned " + repr(_c)
          assert output.strip() == "[1.5, 2.0] [3, 4]", "The program should print [1.5, 2.0] [3, 4]"
        wrong:
          - "import math\n\ndef clip(g, limit):\n    size = math.sqrt(sum([x * x for x in g]))\n    return [x * limit / size for x in g]\n\nprint([1.5, 2.0], [3, 4])\n"
          - "import math\n\ndef clip(g, limit):\n    return [min(x, limit) for x in g]\n\nprint([1.5, 2.0], [3, 4])\n"
          - "import math\n\ndef clip(g, limit):\n    size = sum([abs(x) for x in g])\n    if size <= limit:\n        return [x for x in g]\n    return [x * limit / size for x in g]\n\nprint([1.5, 2.0], [3, 4])\n"
          - "import math\n\ndef clip(g, limit):\n    size = math.sqrt(sum([x * x for x in g]))\n    if size <= limit:\n        return [x for x in g]\n    return [x / size for x in g]\n\nprint([1.5, 2.0], [3, 4])\n"
          - "import math\n\ndef clip(g, limit):\n    size = math.sqrt(sum([x * x for x in g]))\n    if size <= limit:\n        return [x for x in g]\n    return [x * size / limit for x in g]\n\nprint([1.5, 2.0], [3, 4])\n"
        explanation: |
          Dividing a vector by its norm gives the unit vector in its direction, and multiplying that by the limit gives a vector of exactly that length, pointing the same way. The scaling is applied only when the vector is too long. A short vector must be left alone, and the zero vector would cause a division by zero if it were not caught by the same check. Cutting each component off separately at the limit is a different operation: it changes the **direction** of the vector, which for a descent step means no longer heading straight downhill. Clipping by the norm keeps the direction and limits only how far one step can go, a standard safeguard when training networks.
    - question:
        id: work-outlier
        type: choice
        system: s2
        prompt: |
          Two models are tested on four examples. Model A's errors are $(3, 3, 3, 3)$. Model B's errors are $(0, 0, 0, 10)$. Which statement is correct?
        options:
          - "B is better by both the mean absolute error and the mean squared error."
          - "A is better by both."
          - "By mean absolute error B is better, 2.5 against 3. By mean squared error A is better, 9 against 25. The squared error is dominated by B's one large miss."
          - "The two measures always agree on which model is better."
        answer: 2
        explanation: |
          Mean absolute error: A has $\frac{12}{4} = 3$ and B has $\frac{10}{4} = 2.5$. Mean squared error: A has $\frac{36}{4} = 9$ and B has $\frac{100}{4} = 25$. The two norms rank the models in opposite orders. The 1-norm cares about the total amount of error. The squared 2-norm cares much more about how the error is distributed, and treats one miss of 10 as worse than four misses of 3. Neither is right in general. If a large miss is a catastrophe, squared error expresses that. If the large miss is probably a faulty measurement that should not drive the model, absolute error is the safer guide.
    - question:
        id: work-high-dimension
        type: choice
        system: s2
        prompt: |
          In $\mathbb{R}^n$, let $\mathbf{u}$ be the vector of all zeros and $\mathbf{v}$ the vector of all ones: every component differs by exactly 1. How do their Euclidean and maximum distances behave as $n$ grows?
        options:
          - "Both stay equal to 1."
          - "Both grow like $n$."
          - "The maximum distance stays 1, while the Euclidean distance is $\\sqrt{n}$, growing without limit: 10 in a hundred dimensions and 1000 in a million."
          - "The Euclidean distance stays 1 and the maximum distance grows."
        answer: 2
        explanation: |
          The difference is the vector of $n$ ones. Its maximum norm is 1 for every $n$. Its Euclidean norm is $\sqrt{1 + 1 + \dots + 1} = \sqrt{n}$, and its taxicab norm is $n$. Many small differences, one in each of many components, add up to a large Euclidean distance. This is one reason distances behave strangely in high dimensions: points that are close in every single coordinate can still be far apart, and nearly all pairs of points in a large data set tend to be at similar, large distances from one another. A measure of likeness that is less sensitive to size is often preferred there, and that is the subject of the next lesson.
  connections:
    - text: |
        The puzzle asked which of two shops is nearer, and found two right answers. Distance is the size of the difference between two vectors, and "size" can be measured by any rule that is positive, scales with the vector, and never makes a detour shorter than the direct route. Such a rule is a norm. The Euclidean norm measures the straight line, the taxicab norm adds up the change in each component, and the maximum norm reports the largest single change. By the first, shop P at $(3, 3)$ is nearer than Q at $(0, 5)$. By the second, Q is.

        For the Euclidean norm the triangle inequality needed proof, and the proof ran through the Cauchy-Schwarz inequality, $\lvert \mathbf{u} \cdot \mathbf{v} \rvert \le \lVert \mathbf{u} \rVert\,\lVert \mathbf{v} \rVert$, which came from nothing more than the fact that a squared length is never negative, and from finding the minimum of a quadratic as you learned in calculus.

        The choice of norm is a choice about what matters. Squared Euclidean error punishes large misses severely. Absolute error forgives them. Norms measure the size of a weight vector to keep it small and the size of a step to keep it safe, and you will meet them in those roles in [[m12.gradient]] and [[m19.gradient-descent]].

        Two things were left pointing forwards. Cauchy-Schwarz says that $\dfrac{\mathbf{u} \cdot \mathbf{v}}{\lVert \mathbf{u} \rVert\,\lVert \mathbf{v} \rVert}$ always lies between $-1$ and 1, which is the range of a cosine. And the last question showed distance becoming a poor guide to likeness when there are many components, or when vectors differ greatly in length, like the short and the long report on the same subject. Put together, these suggest comparing vectors by their **direction** alone. That is the next lesson, [[m4.angle-and-cosine-similarity]]. The value of $t$ that appeared inside the proof, the multiple of one vector that comes closest to another, is taken up after that in [[m4.projection-onto-a-vector]].
