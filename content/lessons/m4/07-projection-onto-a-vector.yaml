concept: m4.projection-onto-a-vector
minutes: 90
claim: You can find the multiple of one vector that lies closest to another, by calculus and by a right angle, split a vector into a part along a direction and a part perpendicular to it, and recognise fitting a line through the origin, and taking a mean, as projections.
recalls: [m4.angle-and-cosine-similarity]
uses: [m4.norms-and-distance, m4.dot-product, m4.linear-combinations-and-span, m4.vector-addition-and-scaling, m4.vectors-as-arrows-and-as-lists, m10.maxima-and-minima, m1.quadratics, m1.straight-lines-and-slope, m3.direct-proof, e0.functions, e0.loops, e0.lists-and-tuples, e1.comprehensions-and-iterators, e1.modules-and-imports]
leads: [m4.lines-planes-and-hyperplanes, m4.linear-independence, m7.projection-onto-a-subspace, m7.gram-schmidt-and-qr, m7.least-squares-and-the-normal-equations]
starter: |
  # Scratch space. A rail runs through the origin along a = [3, 1].
  # A lamp hangs at b = [1, 2]. Try multiples of a. Which comes closest to b?
  import math

  a = [3, 1]
  b = [1, 2]

  for k in [0, 0.25, 0.5, 0.75, 1]:
      point = [k * x for x in a]
      print(k, point, math.sqrt(sum([(p - q) ** 2 for p, q in zip(point, b)])))
parts:
  recall:
    - text: |
        [[m4.angle-and-cosine-similarity]] measured how much two vectors agree, as a pure number. Earlier, the dot product was read as one length times the other's **shadow**, and inside the proof of the Cauchy-Schwarz inequality a quadratic was minimised to find the multiple of one vector closest to another. Today those pieces become one object. Three quick pulls first.
  puzzle:
    - text: |
        A straight rail runs through the origin in the direction $\mathbf{a} = (3, 1)$. A trolley can sit anywhere on it, so its position is always some multiple $k\,\mathbf{a}$. A lamp hangs at $\mathbf{b} = (1, 2)$, off the rail.

        **Where on the rail should the trolley stop to be as close as possible to the lamp?**

        Run the starter. At $k = 0$ the trolley is at the origin, 2.24 away. At $k = 1$ it is at $(3, 1)$, also 2.24 away. In between it does better, and of the five positions tried, $k = 0.5$ wins with 1.58.

        Trying values will not do. Is 0.5 exactly the best, or is the true answer 0.48? And the question is far more general than a trolley. The points $k\,\mathbf{a}$ are the span of $\mathbf{a}$, everything a single vector can reach. The lamp is a target outside that span. You met this in the lesson on span, where a target that could not be reached was left unreached. In practice an unreachable target is the usual case, and nobody gives up. They ask for the **closest** reachable point.

        **Which multiple of $\mathbf{a}$ is closest to $\mathbf{b}$, exactly? And what is special about that point, so that you could recognise it without a search?**
  intuition:
    - text: |
        Stand at the lamp and look at the rail. The nearest point of a straight line to you is the one **straight across** from you: the foot of the perpendicular. From any other point of the rail, the line to the lamp slants, and a slanted line is longer than the perpendicular one, as the long side of a right-angled triangle is longer than either of the others.

        So the best position $\mathbf{p}$ on the rail should be recognisable by a right angle. The leftover arrow from $\mathbf{p}$ to the lamp, $\mathbf{b} - \mathbf{p}$, should be perpendicular to the rail. And you have a test for a right angle: a dot product of zero.

        This is also the shadow from the lesson on the dot product. Shine a light straight down onto the rail, at right angles to it. The lamp's arrow $\mathbf{b}$ casts a shadow along the rail, and the tip of the shadow is $\mathbf{p}$. The dot product gave the **length** of the shadow. Now you want the shadow itself, as a vector.

        Move $\mathbf{b}$ in the figure. The marked arrow along the rail is the shadow, and the dashed line is what is left over.
    - figure: projection
      props: { bx: 1, by: 2 }
    - text: |
        For the lamp at $(1, 2)$ the figure reports the shadow as $(1.5, 0.5)$, which is $0.5\,\mathbf{a}$, and a leftover of $(-0.5, 1.5)$ whose dot product with $\mathbf{a}$ is zero. Put $\mathbf{b}$ on the rail and the leftover vanishes. Put it at right angles to the rail and the shadow shrinks to the origin.
  derivation:
    - text: |
        **Finding the best multiple by calculus.** Let $\mathbf{a}$ be a non-zero vector and $\mathbf{b}$ any vector of the same dimension. The squared distance from $k\,\mathbf{a}$ to $\mathbf{b}$ is a function of the one number $k$. Expand it with the rules of the dot product:

        $$f(k) = \lVert \mathbf{b} - k\,\mathbf{a} \rVert^2 = \lVert \mathbf{b} \rVert^2 - 2k\,(\mathbf{a} \cdot \mathbf{b}) + k^2\,(\mathbf{a} \cdot \mathbf{a}).$$

        This is a quadratic in $k$ with a positive coefficient of $k^2$, a bowl with one lowest point. Minimising the squared distance is the same as minimising the distance, and avoids a square root. Set the derivative to zero:

        $$f'(k) = -2\,(\mathbf{a} \cdot \mathbf{b}) + 2k\,(\mathbf{a} \cdot \mathbf{a}) = 0 \quad\Longrightarrow\quad k = \frac{\mathbf{a} \cdot \mathbf{b}}{\mathbf{a} \cdot \mathbf{a}}.$$

        For the rail, $\mathbf{a} \cdot \mathbf{b} = 3 + 2 = 5$ and $\mathbf{a} \cdot \mathbf{a} = 9 + 1 = 10$, so $k = \frac{1}{2}$ exactly. The search had landed on the true answer.

        The closest point is called the **projection of $\mathbf{b}$ onto $\mathbf{a}$**:

        $$\operatorname{proj}_{\mathbf{a}}\mathbf{b} = \frac{\mathbf{a} \cdot \mathbf{b}}{\mathbf{a} \cdot \mathbf{a}}\,\mathbf{a}.$$

        Read the formula as "a number times a vector". The fraction is a scalar. The result points along $\mathbf{a}$, or against it when the dot product is negative.

        This is the quadratic that proved the Cauchy-Schwarz inequality, with the letters changed. There the best $t$ was a step in a proof. Here it is the thing wanted.

        **The leftover is perpendicular.** Write $\mathbf{p} = \operatorname{proj}_{\mathbf{a}}\mathbf{b}$ and $\mathbf{e} = \mathbf{b} - \mathbf{p}$ for what remains. Then

        $$\mathbf{a} \cdot \mathbf{e} = \mathbf{a} \cdot \mathbf{b} - k\,(\mathbf{a} \cdot \mathbf{a}) = \mathbf{a} \cdot \mathbf{b} - \frac{\mathbf{a} \cdot \mathbf{b}}{\mathbf{a} \cdot \mathbf{a}}\,(\mathbf{a} \cdot \mathbf{a}) = 0.$$

        The picture's right angle has come out of the algebra. In fact the condition $f'(k) = 0$ **is** the right angle: $f'(k) = -2\,\mathbf{a} \cdot (\mathbf{b} - k\,\mathbf{a})$, so the derivative vanishes exactly when the leftover is perpendicular to $\mathbf{a}$.

        **The same result without calculus.** Start instead from the right angle. Suppose $\mathbf{p} = k\,\mathbf{a}$ has $\mathbf{e} = \mathbf{b} - \mathbf{p}$ perpendicular to $\mathbf{a}$. Take any other point of the line, $\mathbf{q} = m\,\mathbf{a}$. Then

        $$\mathbf{b} - \mathbf{q} = (\mathbf{b} - \mathbf{p}) + (\mathbf{p} - \mathbf{q}) = \mathbf{e} + (k - m)\,\mathbf{a}.$$

        The two parts on the right are perpendicular, so the cross term in the squared length vanishes and Pythagoras's theorem applies:

        $$\lVert \mathbf{b} - \mathbf{q} \rVert^2 = \lVert \mathbf{e} \rVert^2 + (k - m)^2\,\lVert \mathbf{a} \rVert^2 \;\ge\; \lVert \mathbf{e} \rVert^2,$$

        with equality only when $m = k$. Every other point of the line is strictly further from $\mathbf{b}$. Two routes, one through a derivative and one through a right angle, arrive at the same point.
    - question:
        id: derivation-why-closest
        type: choice
        system: s2
        prompt: |
          $\mathbf{p}$ is the point of the line through $\mathbf{a}$ for which $\mathbf{e} = \mathbf{b} - \mathbf{p}$ is perpendicular to $\mathbf{a}$. Why is every other point $\mathbf{q}$ of the line further from $\mathbf{b}$?
        options:
          - "Because $\\mathbf{q}$ is longer than $\\mathbf{p}$."
          - "Because $\\mathbf{b} - \\mathbf{q}$ is $\\mathbf{e}$ plus a non-zero multiple of $\\mathbf{a}$, the two are perpendicular, and so by Pythagoras $\\lVert \\mathbf{b} - \\mathbf{q} \\rVert^2$ is $\\lVert \\mathbf{e} \\rVert^2$ plus something positive."
          - "Because the dot product of $\\mathbf{b}$ and $\\mathbf{q}$ is negative."
          - "Because $\\mathbf{q}$ is not a multiple of $\\mathbf{a}$."
        answer: 1
        explanation: |
          Moving along the line from $\mathbf{p}$ to $\mathbf{q}$ adds a multiple of $\mathbf{a}$ to the leftover. That addition is at right angles to $\mathbf{e}$, so the squared lengths add, with no cross term to cancel anything. The distance can only grow. This is the precise form of "the perpendicular is the shortest path to a line", and nothing in it depended on the number of dimensions.
    - text: |
        **Splitting a vector in two.** Every vector $\mathbf{b}$ is now the sum of two parts, relative to a chosen non-zero $\mathbf{a}$:

        $$\mathbf{b} = \underbrace{\mathbf{p}}_{\text{along } \mathbf{a}} + \underbrace{\mathbf{e}}_{\text{perpendicular to } \mathbf{a}}, \qquad \lVert \mathbf{b} \rVert^2 = \lVert \mathbf{p} \rVert^2 + \lVert \mathbf{e} \rVert^2.$$

        For the lamp, $\mathbf{p} = (1.5, 0.5)$ and $\mathbf{e} = (-0.5, 1.5)$, with squared lengths 2.5 and 2.5 adding to $\lVert \mathbf{b} \rVert^2 = 5$. The distance from the lamp to the rail is $\lVert \mathbf{e} \rVert = \sqrt{2.5} \approx 1.58$, the number the starter printed.

        The split is unique. It is how a force on a slope is divided into the part that drives a cart along the slope and the part that presses it into the ground, and how any vector is "cleaned" of its component in an unwanted direction: subtract the projection, and what is left has none of $\mathbf{a}$ in it.

        **Unit vectors make it simple.** If $\hat{\mathbf{a}}$ has length 1, then $\hat{\mathbf{a}} \cdot \hat{\mathbf{a}} = 1$ and the formula loses its denominator:

        $$\operatorname{proj}_{\hat{\mathbf{a}}}\mathbf{b} = (\mathbf{b} \cdot \hat{\mathbf{a}})\,\hat{\mathbf{a}}.$$

        The number $\mathbf{b} \cdot \hat{\mathbf{a}} = \lVert \mathbf{b} \rVert\cos\theta$ is the signed length of the shadow, called the **component of $\mathbf{b}$ along $\hat{\mathbf{a}}$**. Along the axes this is nothing new: the component of $(x, y)$ along $(1, 0)$ is $x$. The coordinates of a vector are its components along the axis directions, and projection extends the idea of a coordinate to any direction you choose.

        **Three properties.**

        | Property | Statement |
        | --- | --- |
        | only the line matters | $\operatorname{proj}_{c\,\mathbf{a}}\mathbf{b} = \operatorname{proj}_{\mathbf{a}}\mathbf{b}$ for any $c \neq 0$ |
        | projecting twice changes nothing | $\operatorname{proj}_{\mathbf{a}}(\operatorname{proj}_{\mathbf{a}}\mathbf{b}) = \operatorname{proj}_{\mathbf{a}}\mathbf{b}$ |
        | it never lengthens | $\lVert \operatorname{proj}_{\mathbf{a}}\mathbf{b} \rVert \le \lVert \mathbf{b} \rVert$ |

        For the first, replacing $\mathbf{a}$ by $c\,\mathbf{a}$ multiplies the top of the fraction by $c$, the bottom by $c^2$, and the vector by $c$: all the factors cancel. The second holds because a point already on the line is its own closest point. The third follows from $\lVert \mathbf{b} \rVert^2 = \lVert \mathbf{p} \rVert^2 + \lVert \mathbf{e} \rVert^2$, and written out it is the Cauchy-Schwarz inequality once more.

        **Fitting a line is a projection.** You have three measurements. The inputs were $x = 1, 2, 3$ and the outputs $y = 1, 3, 7$. You want a rule $y \approx kx$, a straight line through the origin, and must choose the slope $k$.

        Collect the inputs into one vector $\mathbf{x} = (1, 2, 3)$ and the outputs into $\mathbf{y} = (1, 3, 7)$. For a given $k$ the predictions are $k\,\mathbf{x}$, a multiple of $\mathbf{x}$. The squared error is $\lVert \mathbf{y} - k\,\mathbf{x} \rVert^2$. Choosing the slope with the least squared error is exactly the trolley problem, in $\mathbb{R}^3$: find the multiple of $\mathbf{x}$ closest to $\mathbf{y}$. So

        $$k = \frac{\mathbf{x} \cdot \mathbf{y}}{\mathbf{x} \cdot \mathbf{x}} = \frac{1 + 6 + 21}{1 + 4 + 9} = \frac{28}{14} = 2.$$

        The predictions are $(2, 4, 6)$ and the errors $\mathbf{y} - 2\mathbf{x} = (-1, -1, 1)$. Check the right angle: $\mathbf{x} \cdot (-1, -1, 1) = -1 - 2 + 3 = 0$. The errors of the best fit are perpendicular to the inputs. No other slope does better, and no search or descent was needed.

        Notice the change of view. The data were three points in a plane. They became **two** vectors in a space with one dimension for each measurement, and the fitted slope came out of the geometry of that space. With a thousand measurements the vectors live in $\mathbb{R}^{1000}$ and the formula is unchanged.

        **The mean is a projection.** Suppose you must predict every output by a single number $c$. The predictions are $c\,(1, 1, \dots, 1)$, a multiple of the vector of ones. The best $c$ is the projection coefficient onto $\mathbf{1}$:

        $$c = \frac{\mathbf{1} \cdot \mathbf{y}}{\mathbf{1} \cdot \mathbf{1}} = \frac{y_1 + \dots + y_n}{n},$$

        the mean. You found by calculus, in the lesson on maxima and minima, that the mean minimises the squared error. Now you can see why: it is the foot of a perpendicular. And the perpendicularity says something familiar, $\mathbf{1} \cdot (\mathbf{y} - c\,\mathbf{1}) = 0$: the deviations from the mean add up to zero.
    - question:
        id: order-projection
        type: order
        system: s2
        prompt: Put the steps in order to find the multiple of $\mathbf{a}$ closest to $\mathbf{b}$ by calculus.
        steps:
          - "Write the squared distance from $k\\,\\mathbf{a}$ to $\\mathbf{b}$ as $f(k) = \\lVert \\mathbf{b} - k\\,\\mathbf{a} \\rVert^2$."
          - "Expand it: $f(k) = \\lVert \\mathbf{b} \\rVert^2 - 2k\\,(\\mathbf{a} \\cdot \\mathbf{b}) + k^2\\,(\\mathbf{a} \\cdot \\mathbf{a})$."
          - "Differentiate: $f'(k) = -2\\,(\\mathbf{a} \\cdot \\mathbf{b}) + 2k\\,(\\mathbf{a} \\cdot \\mathbf{a})$."
          - "Set $f'(k) = 0$ and solve: $k = \\dfrac{\\mathbf{a} \\cdot \\mathbf{b}}{\\mathbf{a} \\cdot \\mathbf{a}}$."
          - "The coefficient of $k^2$ is positive, so this is the minimum, and the closest point is $k\\,\\mathbf{a}$."
        explanation: The quantity to be minimised is named first, then expanded into a quadratic in k so that it can be differentiated. Setting the derivative to zero gives one candidate, and the shape of the parabola confirms that the candidate is the lowest point and not the highest.
  formal:
    - text: |
        Throughout, $\mathbf{a} \neq \mathbf{0}$.

        **Projection.** $\operatorname{proj}_{\mathbf{a}}\mathbf{b} = \dfrac{\mathbf{a} \cdot \mathbf{b}}{\mathbf{a} \cdot \mathbf{a}}\,\mathbf{a}$. For a unit vector, $\operatorname{proj}_{\hat{\mathbf{a}}}\mathbf{b} = (\mathbf{b} \cdot \hat{\mathbf{a}})\,\hat{\mathbf{a}}$, and $\mathbf{b} \cdot \hat{\mathbf{a}}$ is the component of $\mathbf{b}$ along $\hat{\mathbf{a}}$.

        **Closest point.** $\lVert \mathbf{b} - k\,\mathbf{a} \rVert$ is least exactly when $k\,\mathbf{a} = \operatorname{proj}_{\mathbf{a}}\mathbf{b}$.

        **Decomposition.** With $\mathbf{p} = \operatorname{proj}_{\mathbf{a}}\mathbf{b}$ and $\mathbf{e} = \mathbf{b} - \mathbf{p}$: $\ \mathbf{b} = \mathbf{p} + \mathbf{e}$, $\ \mathbf{a} \cdot \mathbf{e} = 0$, and $\lVert \mathbf{b} \rVert^2 = \lVert \mathbf{p} \rVert^2 + \lVert \mathbf{e} \rVert^2$. The distance from $\mathbf{b}$ to the line through $\mathbf{a}$ is $\lVert \mathbf{e} \rVert$.

        **Line through the origin.** The slope minimising $\sum (y_i - kx_i)^2$ is $k = \dfrac{\mathbf{x} \cdot \mathbf{y}}{\mathbf{x} \cdot \mathbf{x}}$. **Mean.** The constant minimising $\sum (y_i - c)^2$ is $c = \dfrac{\mathbf{1} \cdot \mathbf{y}}{\mathbf{1} \cdot \mathbf{1}}$.
  drill:
    - text: Seconds each. One dot product over another, then times the vector.
    - question:
        id: drill-coefficient
        type: numeric
        system: s1
        prompt: |
          $\mathbf{a} = (3, 1)$ and $\mathbf{b} = (1, 2)$. Which multiple $k$ of $\mathbf{a}$ is closest to $\mathbf{b}$?
        answer: "1/2"
        explanation: a · b = 5 and a · a = 10.
    - question:
        id: drill-coefficient-two
        type: numeric
        system: s1
        prompt: |
          $\mathbf{a} = (1, 1)$ and $\mathbf{b} = (4, 2)$. Which multiple $k$ of $\mathbf{a}$ is closest to $\mathbf{b}$?
        answer: "3"
        explanation: a · b = 6 and a · a = 2.
    - question:
        id: drill-axis
        type: choice
        system: s1
        prompt: |
          What is the projection of $(2, 3)$ onto $(1, 0)$?
        options: ["$(2, 3)$", "$(2, 0)$", "$(0, 3)$", "$(1, 0)$"]
        answer: 1
        explanation: The dot product is 2 and (1, 0) is a unit vector, so the projection is 2 times (1, 0). Projecting onto an axis keeps one coordinate.
    - question:
        id: drill-vector
        type: choice
        system: s1
        prompt: |
          What is the projection of $(4, 2)$ onto $(1, 1)$?
        options: ["$(4, 2)$", "$(1, 1)$", "$(3, 3)$", "$(6, 6)$"]
        answer: 2
        explanation: The coefficient is 6 / 2 = 3, and 3 times (1, 1) is (3, 3).
    - question:
        id: drill-perpendicular
        type: choice
        system: s1
        prompt: |
          $\mathbf{b}$ is perpendicular to $\mathbf{a}$. What is the projection of $\mathbf{b}$ onto $\mathbf{a}$?
        options: ["$\\mathbf{b}$", "$\\mathbf{a}$", "The zero vector", "It does not exist"]
        answer: 2
        explanation: The dot product on top of the fraction is 0. A perpendicular vector casts no shadow.
    - question:
        id: drill-on-the-line
        type: choice
        system: s1
        prompt: |
          What is the projection of $5\mathbf{a}$ onto $\mathbf{a}$?
        options: ["$\\mathbf{a}$", "$5\\mathbf{a}$", "$25\\mathbf{a}$", "The zero vector"]
        answer: 1
        explanation: A point already on the line is its own closest point.
    - question:
        id: drill-leftover
        type: numeric
        system: s1
        prompt: |
          $\mathbf{p}$ is the projection of $\mathbf{b}$ onto $\mathbf{a}$. What is $\mathbf{a} \cdot (\mathbf{b} - \mathbf{p})$?
        answer: "0"
        explanation: What is left after the projection is removed is perpendicular to a.
    - question:
        id: drill-pythagoras
        type: numeric
        system: s1
        prompt: |
          $\lVert \mathbf{b} \rVert = 5$ and its projection onto $\mathbf{a}$ has length 3. How far is $\mathbf{b}$ from the line through $\mathbf{a}$?
        answer: "4"
        explanation: The squared lengths of the two parts add to 25, so the leftover has squared length 16.
    - question:
        id: drill-unit
        type: numeric
        system: s1
        prompt: |
          $\hat{\mathbf{a}}$ is a unit vector and $\mathbf{b} \cdot \hat{\mathbf{a}} = -3$. How long is the projection of $\mathbf{b}$ onto $\hat{\mathbf{a}}$?
        answer: "3"
        explanation: The projection is −3 times a unit vector. It points against the unit vector and has length 3.
    - question:
        id: drill-rescale
        type: choice
        system: s1
        prompt: |
          How does the projection of $\mathbf{b}$ onto $2\mathbf{a}$ compare with its projection onto $\mathbf{a}$?
        options: ["It is twice as long", "It is half as long", "It is the same vector", "It points the opposite way"]
        answer: 2
        explanation: Both describe the same line, and the closest point of a line does not depend on which vector was used to name the line.
    - question:
        id: drill-slope
        type: numeric
        system: s1
        prompt: |
          The inputs are $\mathbf{x} = (1, 2)$ and the outputs $\mathbf{y} = (1, 7)$. What slope $k$ makes $k\,\mathbf{x}$ closest to $\mathbf{y}$?
        answer: "3"
        explanation: x · y = 1 + 14 and x · x = 1 + 4.
    - question:
        id: drill-mean
        type: numeric
        system: s1
        prompt: |
          Which multiple $c$ of $(1, 1, 1)$ is closest to $(2, 3, 7)$?
        answer: "4"
        explanation: The dot product with the ones is the total, 12, and the ones have squared length 3. It is the mean.
    - question:
        id: predict-coefficient
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          a = [3, 1]
          b = [1, 2]
          k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a])
          print(k, [k * p for p in a])
        output: "0.5 [1.5, 0.5]"
        explanation: The dot products are 5 and 10, so k is 0.5, and the projection is half of a.
    - question:
        id: predict-leftover
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          a = [3, 1]
          b = [1, 2]
          p = [1.5, 0.5]
          e = [y - x for x, y in zip(p, b)]
          print(e, sum([x * y for x, y in zip(a, e)]))
        output: "[-0.5, 1.5] 0.0"
        explanation: The leftover is b − p, which is (−0.5, 1.5). Its dot product with a is −1.5 + 1.5, zero, because what remains after the projection is perpendicular to a.
  work:
    - text: Slower now. In each, name the vector being projected and the direction it is projected onto.
    - question:
        id: work-distance
        type: numeric
        system: s2
        prompt: |
          A rail runs through the origin along $\mathbf{a} = (1, 2)$. A lamp is at $\mathbf{b} = (5, 0)$. What is the **square** of the distance from the lamp to the rail?
        answer: "20"
        explanation: |
          $\mathbf{a} \cdot \mathbf{b} = 5$ and $\mathbf{a} \cdot \mathbf{a} = 5$, so $k = 1$ and the closest point is $\mathbf{p} = (1, 2)$. The leftover is $\mathbf{e} = (5, 0) - (1, 2) = (4, -2)$, with squared length $16 + 4 = 20$. Check the right angle: $(1, 2) \cdot (4, -2) = 4 - 4 = 0$. The same answer comes from Pythagoras without finding $\mathbf{e}$: $\lVert \mathbf{b} \rVert^2 - \lVert \mathbf{p} \rVert^2 = 25 - 5$.
    - question:
        id: write-project
        type: code
        mode: write
        system: s2
        prompt: |
          Write `project(b, a)`, the projection of `b` onto the non-zero vector `a`, as a list:

          $$\frac{\mathbf{a} \cdot \mathbf{b}}{\mathbf{a} \cdot \mathbf{a}}\,\mathbf{a}.$$
        starter: |
          def project(b, a):
              # Replace the next line with your own.
              return a

          print(project([1, 2], [3, 1]))
        solution: |
          def project(b, a):
              k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a])
              return [k * p for p in a]

          print(project([1, 2], [3, 1]))
        tests: |
          def _close(got, want, name):
              assert isinstance(got, list), name + " should be a list and you returned " + repr(got)
              assert len(got) == len(want), name + " should have " + str(len(want)) + " components"
              for _a, _b in zip(got, want):
                  assert abs(_a - _b) < 1e-9, name + " should be " + str(want) + " and you returned " + repr(got)
          _close(project([1, 2], [3, 1]), [1.5, 0.5], "project([1, 2], [3, 1])")
          _close(project([4, 2], [1, 1]), [3, 3], "project([4, 2], [1, 1])")
          _close(project([2, 3], [1, 0]), [2, 0], "project([2, 3], [1, 0])")
          _close(project([2, 3], [0, 5]), [0, 3], "project([2, 3], [0, 5])")
          _close(project([-1, 3], [3, 1]), [0, 0], "The projection of a vector perpendicular to a")
          _close(project([6, 2], [3, 1]), [6, 2], "The projection of a vector already along a")
          _close(project([-3, -1], [3, 1]), [-3, -1], "project([-3, -1], [3, 1])")
          _close(project([1, 3, 7], [1, 2, 3]), [2, 4, 6], "project([1, 3, 7], [1, 2, 3])")
          _close(project([1, 2], [30, 10]), [1.5, 0.5], "project([1, 2], [30, 10]), where only the line of a matters,")
          assert output.strip() == "[1.5, 0.5]", "The program should print [1.5, 0.5]"
        wrong:
          - "def project(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a])\n    return [k * p for p in b]\n\nprint([1.5, 0.5])\n"
          - "def project(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in b])\n    return [k * p for p in a]\n\nprint([1.5, 0.5])\n"
          - "def project(b, a):\n    k = sum([p * q for p, q in zip(a, b)])\n    return [k * p for p in a]\n\nprint([1.5, 0.5])\n"
          - "def project(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a]) ** 0.5\n    return [k * p for p in a]\n\nprint([1.5, 0.5])\n"
          - "def project(b, a):\n    return [p * q for p, q in zip(a, b)]\n\nprint([1.5, 0.5])\n"
        explanation: |
          Two dot products give the coefficient, and the coefficient multiplies $\mathbf{a}$, because the answer has to lie on the line through $\mathbf{a}$. Multiplying $\mathbf{b}$ by it gives a vector that is generally not on that line at all. The denominator is $\mathbf{a} \cdot \mathbf{a}$, the squared length. Dividing by the length alone is right only when the result is then multiplied by the **unit** vector, and dividing by nothing is right only when $\mathbf{a}$ already has length 1. The last test uses a vector ten times as long along the same line, and the projection must not change.
    - question:
        id: fix-reject
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `remove_component(b, a)` should return what is left of `b` after its projection onto the non-zero vector `a` is subtracted, so that the result is perpendicular to `a`. For the vectors below it should print `[-0.5, 1.5]`. It prints something else. Fix it.
        starter: |
          import math

          def remove_component(b, a):
              k = sum([p * q for p, q in zip(a, b)]) / math.sqrt(sum([p * p for p in a]))
              return [q - k * p for p, q in zip(a, b)]

          print(remove_component([1, 2], [3, 1]))
        solution: |
          import math

          def remove_component(b, a):
              k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a])
              return [q - k * p for p, q in zip(a, b)]

          print(remove_component([1, 2], [3, 1]))
        tests: |
          def _close(got, want, name):
              assert isinstance(got, list), name + " should be a list and you returned " + repr(got)
              assert len(got) == len(want), name + " should have " + str(len(want)) + " components"
              for _a, _b in zip(got, want):
                  assert abs(_a - _b) < 1e-9, name + " should be " + str(want) + " and you returned " + repr(got)
          _close(remove_component([1, 2], [3, 1]), [-0.5, 1.5], "remove_component([1, 2], [3, 1])")
          _close(remove_component([5, 0], [1, 2]), [4, -2], "remove_component([5, 0], [1, 2])")
          _close(remove_component([2, 3], [1, 0]), [0, 3], "remove_component([2, 3], [1, 0])")
          _close(remove_component([6, 2], [3, 1]), [0, 0], "Removing a from a multiple of a")
          _close(remove_component([-1, 3], [3, 1]), [-1, 3], "A vector perpendicular to a should come back unchanged, and it")
          _close(remove_component([1, 3, 7], [1, 2, 3]), [-1, -1, 1], "remove_component([1, 3, 7], [1, 2, 3])")
          for _b, _a in [([4, 7], [2, 5]), ([1, 2, 3], [3, 0, 4]), ([9, -2], [0, 3])]:
              _e = remove_component(_b, _a)
              assert abs(sum([x * y for x, y in zip(_a, _e)])) < 1e-9, "The result should be perpendicular to a. For b = " + str(_b) + " and a = " + str(_a) + " you returned " + repr(_e)
          assert output.strip() == "[-0.5, 1.5]", "The program should print [-0.5, 1.5]"
        wrong:
          - "import math\n\ndef remove_component(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / math.sqrt(sum([p * p for p in a]))\n    return [q - k * p for p, q in zip(a, b)]\n\nprint([-0.5, 1.5])\n"
          - "import math\n\ndef remove_component(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a])\n    return [k * p for p in a]\n\nprint([-0.5, 1.5])\n"
          - "import math\n\ndef remove_component(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / sum([p * p for p in a])\n    return [k * p - q for p, q in zip(a, b)]\n\nprint([-0.5, 1.5])\n"
          - "import math\n\ndef remove_component(b, a):\n    k = sum([p * q for p, q in zip(a, b)]) / sum([q * q for q in b])\n    return [q - k * p for p, q in zip(a, b)]\n\nprint([-0.5, 1.5])\n"
          - "import math\n\ndef remove_component(b, a):\n    k = sum([p * q for p, q in zip(a, b)])\n    return [q - k * p for p, q in zip(a, b)]\n\nprint([-0.5, 1.5])\n"
        explanation: |
          The coefficient was divided by the length of $\mathbf{a}$, where the formula has the **squared** length, $\mathbf{a} \cdot \mathbf{a}$. The square root should not be there. The mistake is easy to make and hard to spot, because it gives correct answers whenever $\mathbf{a}$ has length 1, where the length and its square are the same number. A good check for any function of this kind is the property it exists to deliver: take the dot product of the result with $\mathbf{a}$ and see whether it is zero. Several of the tests do exactly that.
    - question:
        id: work-fit-meaning
        type: choice
        system: s2
        prompt: |
          The inputs are $\mathbf{x} = (1, 2, 3)$, the outputs $\mathbf{y} = (1, 3, 7)$, and the best slope for $y \approx kx$ is $k = 2$, with errors $\mathbf{y} - 2\mathbf{x} = (-1, -1, 1)$. Which statement about the errors is correct?
        options:
          - "They add up to zero."
          - "They are all equal in size, which is what makes the fit the best."
          - "Their dot product with $\\mathbf{x}$ is zero: $-1 - 2 + 3 = 0$. The error vector is perpendicular to the input vector, and that right angle is what identifies the best slope."
          - "They are perpendicular to $\\mathbf{y}$."
        answer: 2
        explanation: |
          The best multiple of $\mathbf{x}$ is the foot of the perpendicular from $\mathbf{y}$, so the leftover is perpendicular to $\mathbf{x}$. That is the whole content of the fit. The errors need not add up to zero: here they add to $-1$. They would add to zero if the fit were also allowed a constant term, because then the vector of ones would be among the directions the errors must be perpendicular to. And the errors are not perpendicular to $\mathbf{y}$: $(1, 3, 7) \cdot (-1, -1, 1) = 3$, which is the squared length of the error vector itself.
    - question:
        id: write-fit
        type: code
        mode: write
        system: s2
        prompt: |
          Write `fit_slope(xs, ys)`. The lists hold the inputs and outputs of several measurements, and the inputs are not all zero. Return the slope $k$ for which the line $y = kx$ through the origin has the least squared error.
        starter: |
          def fit_slope(xs, ys):
              # Replace the next line with your own.
              return 0.0

          print(fit_slope([1, 2, 3], [1, 3, 7]))
        solution: |
          def fit_slope(xs, ys):
              return sum([x * y for x, y in zip(xs, ys)]) / sum([x * x for x in xs])

          print(fit_slope([1, 2, 3], [1, 3, 7]))
        tests: |
          def _near(got, want, what):
              assert isinstance(got, (int, float)), what + " should be a number and you returned " + repr(got)
              assert abs(got - want) < 1e-9, what + " should be " + str(want) + " and you returned " + repr(got)
          _near(fit_slope([1, 2, 3], [1, 3, 7]), 2, "fit_slope([1, 2, 3], [1, 3, 7])")
          _near(fit_slope([1, 2], [1, 7]), 3, "fit_slope([1, 2], [1, 7])")
          _near(fit_slope([1, 2, 3], [2, 4, 6]), 2, "For points exactly on the line y = 2x, fit_slope")
          _near(fit_slope([1, 1, 1], [2, 3, 7]), 4, "With all inputs 1 the best slope is the mean of the outputs, and fit_slope")
          _near(fit_slope([2], [5]), 2.5, "fit_slope([2], [5])")
          _near(fit_slope([1, -1], [3, 1]), 1, "fit_slope([1, -1], [3, 1])")
          _near(fit_slope([0, 2, 4], [9, 1, 3]), 0.7, "fit_slope([0, 2, 4], [9, 1, 3])")
          _xs, _ys = [1, 2, 4, 5], [2, 1, 9, 8]
          _k = fit_slope(_xs, _ys)
          assert abs(sum([x * (y - _k * x) for x, y in zip(_xs, _ys)])) < 1e-9, "The errors of the best fit should be perpendicular to the inputs. For xs = " + str(_xs) + " and ys = " + str(_ys) + " you returned " + repr(_k)
          assert output.strip() == "2.0", "The program should print 2.0"
        wrong:
          - "def fit_slope(xs, ys):\n    return sum(ys) / sum(xs)\n\nprint(2.0)\n"
          - "def fit_slope(xs, ys):\n    return sum([y / x for x, y in zip(xs, ys)]) / len(xs)\n\nprint(2.0)\n"
          - "def fit_slope(xs, ys):\n    return sum([x * y for x, y in zip(xs, ys)]) / sum([y * y for y in ys])\n\nprint(2.0)\n"
          - "def fit_slope(xs, ys):\n    return sum([x * y for x, y in zip(xs, ys)]) / len(xs)\n\nprint(2.0)\n"
          - "def fit_slope(xs, ys):\n    return (ys[-1] - ys[0]) / (xs[-1] - xs[0]) if len(xs) > 1 else ys[0] / xs[0]\n\nprint(2.0)\n"
        explanation: |
          The predictions $k\,\mathbf{x}$ are multiples of the input vector, so the best slope is the projection coefficient, $\mathbf{x} \cdot \mathbf{y}$ over $\mathbf{x} \cdot \mathbf{x}$. Other recipes sound reasonable and are not the least-squares answer. Dividing the total of the outputs by the total of the inputs, or averaging the separate ratios $y / x$, gives a slope, but not the one with the least squared error, and the second fails outright when an input is 0. Joining the first point to the last ignores everything in between. This one line is the smallest case of linear regression: a model with a single weight, trained exactly, with no descent steps. When all the inputs are 1 it returns the mean.
    - question:
        id: work-slope-force
        type: numeric
        system: s2
        prompt: |
          A cart stands on a slope that runs in the direction of the unit vector $\hat{\mathbf{a}} = (0.8, 0.6)$. Gravity pulls on it with the force $\mathbf{b} = (0, -10)$. What is the component of the force along $\hat{\mathbf{a}}$? Give the sign.
        answer: "-6"
        explanation: |
          For a unit vector the component is the dot product alone: $0 \times 0.8 + (-10) \times 0.6 = -6$. The sign is negative because $\hat{\mathbf{a}}$ points up the slope and gravity pulls the cart down it. The projection is $-6\,\hat{\mathbf{a}} = (-4.8, -3.6)$, the part of the force that makes the cart roll. The leftover, $(0, -10) - (-4.8, -3.6) = (4.8, -6.4)$, is perpendicular to the slope and has length 8: it presses the cart into the ground. And $6^2 + 8^2 = 10^2$, the two parts accounting for the whole force.
    - question:
        id: work-descent-step
        type: choice
        system: s2
        prompt: |
          The vector of slopes of a loss is $\mathbf{g} = (3, -4)$. You are only allowed to change the weights along the direction $\hat{\mathbf{a}} = (1, 0)$. How fast does the loss change, per unit moved along $\hat{\mathbf{a}}$, and what does this say about a direction perpendicular to $\mathbf{g}$?
        options:
          - "At rate 5, the length of $\\mathbf{g}$, in every direction."
          - "At rate $\\mathbf{g} \\cdot \\hat{\\mathbf{a}} = 3$, the component of $\\mathbf{g}$ along that direction. Along a direction perpendicular to $\\mathbf{g}$ the component is 0, and the loss does not change at all to first order."
          - "At rate $-4$, since that is the steeper slope."
          - "It cannot be known without the loss function."
        answer: 1
        explanation: |
          Moving one unit along $(1, 0)$ changes only the first weight, and the loss responds at the first slope, 3. That is $\mathbf{g} \cdot \hat{\mathbf{a}}$, the component of $\mathbf{g}$ along the direction of travel. The same rule holds for every unit direction: the rate of change is the shadow of $\mathbf{g}$ on it. The shadow is longest, 5, along $\mathbf{g}$ itself, which is why stepping against $\mathbf{g}$ is the steepest way down. It is zero in a direction perpendicular to $\mathbf{g}$, such as $(0.8, 0.6)$, where the loss is level. You will make this precise when partial derivatives arrive, and it is the reason the vector of slopes deserves to be treated as a vector.
  connections:
    - text: |
        The puzzle asked where on a rail a trolley comes closest to a lamp. The rail is the span of one vector $\mathbf{a}$, the lamp is a vector $\mathbf{b}$ outside it, and the closest point is the projection, $\dfrac{\mathbf{a} \cdot \mathbf{b}}{\mathbf{a} \cdot \mathbf{a}}\,\mathbf{a}$. For $\mathbf{a} = (3, 1)$ and $\mathbf{b} = (1, 2)$ it is exactly half of $\mathbf{a}$.

        Two arguments found it. Calculus minimised a quadratic, the same one that proved the Cauchy-Schwarz inequality. Geometry asked for a right angle, and Pythagoras's theorem showed that every other point of the line is further away. They agree because the derivative of the squared distance **is** the dot product that tests for the right angle. The cosine of [[m4.angle-and-cosine-similarity]] said how much two vectors agree. The projection is the agreeing part itself, and what is left over is perpendicular.

        Then the same formula fitted a line. Three measurements became two vectors in $\mathbb{R}^3$, the best slope was a projection coefficient, and the errors of the best fit came out perpendicular to the inputs. The mean turned out to be the projection onto the vector of ones. Fitting by least squares is geometry: find the reachable point closest to the target.

        One direction is as far as this lesson goes. A real model has many inputs, and its predictions range over the span of several vectors, a plane or something larger. Projecting onto that takes machinery you will build in [[m7.projection-onto-a-subspace]], [[m7.gram-schmidt-and-qr]] and [[m7.least-squares-and-the-normal-equations]], and the idea will be the one you have now: the error of the best approximation is perpendicular to everything you were allowed to use.

        First, the right angle has more to give. Fix a vector $\mathbf{w}$ and ask for all the points whose component along it has one given value. They form a line in the plane, and a flat sheet in space, with $\mathbf{w}$ standing at right angles to it. That is the next lesson, [[m4.lines-planes-and-hyperplanes]], where a dot product and one number will draw the boundary on which a neuron changes its mind. After it, [[m4.linear-independence]] closes the cluster.
