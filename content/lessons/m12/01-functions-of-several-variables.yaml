            print([1.5, 1.0, 0.5])
          - |
            import numpy as np

            xs = np.array([0.0, 1.0, 2.0, 3.0])
            ys = np.array([1.0, 3.0, 4.0, 6.0])

            def best_on_grid(ws, bs):
                w = ws[:, np.newaxis, np.newaxis]
                b = bs[np.newaxis, :, np.newaxis]
                table = (w * xs + b - ys).sum(axis=2) ** 2
                k = int(table.argmin())
                return [float(ws[k // len(bs)]), float(bs[k % len(bs)]), float(table.min())]

