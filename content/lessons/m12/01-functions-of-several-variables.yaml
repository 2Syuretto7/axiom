        explanation: |
          Three axes: candidates for $w$ along the first, candidates for $b$ along the second, and the four data points along the third. `w * xs + b - ys` broadcasts to shape `(len(ws), len(bs), 4)`, the miss of every line at every point. Squaring and summing over the last axis collapses the points and leaves the table of losses. `argmin` gives a place in the flattened block, and with `len(bs)` columns the row is the quotient and the column the remainder. On a grid of tenths the answer lands exactly on the true minimum, 1.6 and 1.1, by luck of the numbers. On any other grid it would be merely near. And the cost of the table is the product of the grid sizes, which is why this is a way of looking at a loss and not a way of training.
    - question:
        id: fix-path
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `along(m, t)` should return the value of $g(x, y) = \dfrac{xy}{x^2 + y^2}$ at the point a distance-parameter `t` along the line $y = mx$, that is, at $x = t$, $y = mt$. Away from the origin the value should not depend on `t` at all. The program prints two different numbers for the same line. Fix the function.
        starter: |
          def along(m, t):
              x = t
              y = m * t
              return x * y / (x ** 2 + y) ** 2

          print(round(along(1.0, 0.1), 6), round(along(1.0, 0.001), 6))
        solution: |
          def along(m, t):
              x = t
              y = m * t
              return x * y / (x ** 2 + y ** 2)

          print(round(along(1.0, 0.1), 6), round(along(1.0, 0.001), 6))
        tests: |
          assert abs(along(1.0, 0.1) - 0.5) < 1e-12, "Along y = x the value is one half"
          assert abs(along(1.0, 0.001) - 0.5) < 1e-12, "Along y = x the value is one half however close to the origin"
          assert abs(along(2.0, 0.3) - 0.4) < 1e-12, "Along y = 2x the value is two fifths"
          assert abs(along(0.0, 0.5)) < 1e-12, "Along the x-axis the value is 0"
          assert abs(along(-1.0, 0.25) + 0.5) < 1e-12, "Along y = -x the value is minus one half"
          assert abs(along(3.0, -0.2) - 0.3) < 1e-12, "Along y = 3x the value is three tenths, on either side of the origin"
          assert output.strip() == "0.5 0.5", "The program should print 0.5 0.5"
        wrong:
          - |
            def along(m, t):
                x = t
                y = m * t
                return x * y / (x ** 2 + y) ** 2

            print("0.5 0.5")
          - |
            def along(m, t):
                x = t
                y = m * t
                return x * y / (x + y) ** 2

            print("0.5 0.5")
          - |
            def along(m, t):
                return 0.5
            print("0.5 0.5")
        explanation: |
          The bottom line was written as $(x^2 + y)^2$ where $x^2 + y^2$ was meant: the power sits outside the bracket. With the correct bottom, both top and bottom are $t^2$ times a number that depends only on $m$, so $t$ cancels and the value along the line is $\dfrac{m}{1 + m^2}$ whatever $t$ is. That constancy is the whole point of the example. Each line into the origin carries its own value right up to the origin, and different lines carry different values, so there is nothing for the function to tend to.
    - question:
        id: work-limit
        type: choice
        system: s2
        prompt: |
          $h(x, y) = \dfrac{x^2 y}{x^2 + y^2}$ for $(x, y) \ne (0, 0)$. Does it have a limit at the origin?
        options:
          - 'No, because the bottom is 0 at the origin.'
          - 'Yes, the limit is 0. Since $x^2 \le x^2 + y^2$, the fraction $\dfrac{x^2}{x^2 + y^2}$ is at most 1, so $\lvert h \rvert \le \lvert y \rvert$, and $\lvert y \rvert$ is at most the distance from the origin. A bound that shrinks with the distance covers every path at once.'
          - 'Yes, because the value along both axes is 0, and two paths that agree settle it.'
          - 'No, because along $y = x$ the value is $\tfrac12$.'
        answer: 1
        explanation: |
          A zero on the bottom only means the formula gives no value at the point. The limit is about nearby points. Along $y = x$ the value is $\dfrac{x^3}{2x^2} = \dfrac{x}{2}$, which tends to 0, and not $\tfrac12$. But agreement along some paths, even along all straight lines, proves nothing: the one sound argument is a bound in terms of the distance. Compare with $g$, whose top $xy$ has the same degree as its bottom, so nothing is left over to shrink. In $h$ the top has one more factor than the bottom, and that spare factor is what goes to 0.
    - question:
        id: work-slice-min
        type: numeric
        system: s2
        prompt: |
          For the puzzle's loss, the slice with $b$ fixed at 1 is $L(w, 1) = 14w^2 - 46w + 38$. At what value of $w$ is this slice lowest? Give it to two decimal places.
        answer: "1.64"
        tolerance: "0.01"
        explanation: |
          A slice is a function of one variable, so set its derivative to zero: $28w - 46 = 0$ gives $w = \tfrac{46}{28} \approx 1.64$. Notice that this is not 1.6, the $w$ of the true lowest point. The best $w$ depends on which $b$ you have fixed, because of the term $12wb$ that ties the two together. Had you fixed $b$ at 1.1, the best $w$ would be exactly 1.6. To find the bottom of the bowl, both slices must be level at the same point at once, and that is two equations in two unknowns.
    - question:
        id: work-level-linear
        type: choice
        system: s2
        prompt: |
          $f(\mathbf{x}) = \mathbf{a} \cdot \mathbf{x}$ with $\mathbf{a} = (3, 4)$. In which direction should you move from any point to stay at the same height, and in which to gain height fastest?
        options:
          - 'Stay level by moving along $(3, 4)$, and climb fastest along $(4, -3)$.'
          - 'Stay level by moving along $(4, -3)$, which is at right angles to $\mathbf{a}$, since that adds $\mathbf{a} \cdot (4, -3) = 0$ to the value. Climb fastest along $\mathbf{a}$ itself, since among steps of one length the dot product with $\mathbf{a}$ is greatest for the step that points the same way.'
          - 'Every direction changes the height by the same amount.'
          - 'Stay level along the $x$-axis and climb fastest along the $y$-axis.'
        answer: 1
        explanation: |
          Moving from $\mathbf{x}$ to $\mathbf{x} + \mathbf{d}$ changes the value by $\mathbf{a} \cdot \mathbf{d}$, because the dot product is linear. That is zero exactly when $\mathbf{d}$ is at right angles to $\mathbf{a}$, so the level sets are the lines perpendicular to $\mathbf{a}$. And $\mathbf{a} \cdot \mathbf{d} = \lVert \mathbf{a} \rVert \lVert \mathbf{d} \rVert \cos\theta$ is greatest when the angle is zero. For a linear function the vector $\mathbf{a}$ is at once the direction of steepest climb and the direction square to the contours. The cluster will show that every smooth function has such a vector at every point.
  connections:
    - text: |
        The score of a line, $L(w, b)$, takes two numbers in and gives one out. It is a function on a plane, and its graph is a surface over that plane: here a long bowl, lowest at $w = 1.6$, $b = 1.1$. There is no single slope because there is no single direction to move in.

        Three ways of seeing such a function. The **surface** itself. Its **level curves**, the contours of a map, drawn in the plane of the inputs: circles for $x^2 + y^2$, parallel lines for a linear function, hyperbolas for the saddle $x^2 - y^2$. And its **slices**, the functions of one variable left when all inputs but one are held still. A grid of values, computed by broadcasting a column against a row, shows all three, at a cost that grows as a power of the number of inputs.

        Limits and continuity carry over word for word, with distance between vectors in place of distance between numbers. The new feature is that a point can be approached along infinitely many paths, and $\dfrac{xy}{x^2 + y^2}$ tends to a different value along each line into the origin.

        The slices are where the calculus you know gets its grip. Hold $b$ still, and $L$ is an ordinary function of $w$ with an ordinary derivative. Hold $w$ still, and there is another. Those two numbers, the slopes of the two slices through a point, are the subject of the next lesson, [[m12.partial-derivatives]]. After that they are put together into one vector, [[m12.gradient]], which will turn out to point straight across the contours.
