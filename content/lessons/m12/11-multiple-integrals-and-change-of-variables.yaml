          Evaluate $\displaystyle\int_0^2\!\!\int_0^x (x + y)\,dy\,dx$.
        answer: "4"
        explanation: |
          Inner integral, with $x$ frozen: $\left[xy + \tfrac{y^2}{2}\right]_0^x = x^2 + \tfrac{x^2}{2} = \tfrac32 x^2$. Outer: $\tfrac32\left[\tfrac{x^3}{3}\right]_0^2 = \tfrac32 \cdot \tfrac83 = 4$. The region is the triangle under the line $y = x$ out to $x = 2$, of area 2, and the average value of $x + y$ over it is 2.
    - question:
        id: work-puzzle
        type: choice
        system: s2
        prompt: |
          In the puzzle, the area under $e^{-x^2}$ came to $\sqrt{\pi}$. Where did $\pi$ come from?
        options:
          - 'From the numerical method, which uses circles.'
          - 'The square of the area is the volume under $e^{-(x^2 + y^2)}$, since that function is a product of a function of $x$ and one of $y$. This hill depends only on the distance from the origin. In polar coordinates the cells have area $r\,dr\,d\theta$, the factor $r$ makes the integral over $r$ elementary and equal to $\tfrac12$, and the integral over the angle, once round, contributes $2\pi$.'
          - 'From the number $e$, which is related to $\pi$.'
          - 'It is a coincidence of the particular limits $-5$ and $5$.'
        answer: 1
        explanation: |
          Three ideas of this lesson are used in turn. Fubini's theorem turns the product of two single integrals into one double integral. The change of variables to polar coordinates suits the rotational symmetry of the integrand. And the Jacobian factor $r$ supplies exactly what the single integral lacked for a substitution. The $2\pi$ is the total angle round a point: a pair of independent bell curves, taken together, is a round hill. The limits $\pm 5$ only cut off tails that are already smaller than $10^{-10}$.
    - question:
        id: work-ellipse
        type: numeric
        system: s2
        prompt: |
          The map $x = 3u$, $y = 2v$ sends the unit disc $u^2 + v^2 \le 1$ onto the ellipse $\dfrac{x^2}{9} + \dfrac{y^2}{4} \le 1$. Use the change of variables formula to find the integral of the constant function 5 over the ellipse. Give it to two decimal places.
        answer: "94.25"
        tolerance: "0.01"
        explanation: |
          The Jacobian of the map is $\begin{pmatrix} 3 & 0 \\ 0 & 2 \end{pmatrix}$, with determinant 6, so $dx\,dy = 6\,du\,dv$. The integral is $\iint 5 \cdot 6\,du\,dv$ over the unit disc, which is $30\pi \approx 94.25$. Equivalently, the area of the ellipse is 6 times that of the disc, $6\pi$, and a constant 5 over it gives $30\pi$. A linear map multiplies every area by the same factor, its determinant, so the factor comes outside the integral.
    - question:
        id: work-density
        type: choice
        system: s2
        prompt: |
          A random number generator scatters points uniformly over the unit square of the $(u, v)$ plane, with density 1. Each point is then moved by $\mathbf{x} = A\mathbf{u}$, where $A = \begin{pmatrix} 2 & 1 \\ 0 & 3 \end{pmatrix}$. What is the density of the moved points in the region they cover?
        options:
          - '6, since the map magnifies by 6.'
          - '$\tfrac16$. The square, of area 1, is sent to a parallelogram of area $\lvert \det A \rvert = 6$. The same points are now spread over six times the area, so there are a sixth as many per unit of area. Density is divided by the Jacobian determinant, where area is multiplied by it.'
          - '1, since moving points does not change how many there are.'
          - '$\tfrac15$, the reciprocal of the sum of the entries.'
        answer: 1
        explanation: |
          The total amount of probability is fixed at 1: the points are only moved. The integral of the new density over the parallelogram must therefore be 1, and the parallelogram has area 6, so the density is $\tfrac16$. In general, if $\mathbf{x} = \mathbf{T}(\mathbf{u})$ then the density of $\mathbf{x}$ at a point is the density of $\mathbf{u}$ at the corresponding point divided by $\lvert \det J_{\mathbf{T}} \rvert$. Models that build a complicated distribution by pushing a simple one through an invertible map rely on this formula, and must be able to compute that determinant.
    - question:
        id: work-order
        type: choice
        system: s2
        prompt: |
          The integral $\displaystyle\int_0^1\!\!\int_x^1 e^{y^2}\,dy\,dx$ cannot be done as written, since $e^{y^2}$ has no elementary antiderivative. What does reversing the order of integration give?
        options:
          - 'The same impossible integral.'
          - 'The region is $0 \le x \le y \le 1$. With $y$ outside, $x$ runs from 0 to $y$: $\displaystyle\int_0^1\!\!\int_0^y e^{y^2}\,dx\,dy = \int_0^1 y\,e^{y^2}\,dy = \tfrac12(e - 1)$. The inner integral supplied the factor $y$ that makes the substitution work.'
          - '$\displaystyle\int_x^1\!\!\int_0^1 e^{y^2}\,dx\,dy$, which equals $e - 1$.'
          - 'Zero, since the region has no area.'
        answer: 1
        explanation: |
          The region is the triangle above the line $y = x$ in the unit square. Described with $y$ outermost, $y$ runs over $[0, 1]$ and for each $y$, $x$ runs from 0 to $y$. The integrand does not depend on $x$, so the inner integral is just the length of that run, $y$. Then $\int_0^1 y\,e^{y^2}\,dy$ yields to the substitution $u = y^2$ and equals $\tfrac12(e - 1) \approx 0.859$. The same thing happened in the Gaussian integral, where the area of the polar cell supplied a factor $r$. A double integral offers a choice of order and of coordinates, and the right choice can turn an impossible single integral into an easy one.
  connections:
    - text: |
        The area under $e^{-x^2}$ is $\sqrt{\pi}$. Its square is the volume under the round hill $e^{-(x^2 + y^2)}$, and in polar coordinates, where each cell has area $r\,dr\,d\theta$, that volume is $2\pi \times \tfrac12 = \pi$.

        A **double integral** adds up value times area over small cells of a region. By **Fubini's theorem** it is an iterated integral, one variable at a time with the other frozen, in either order. For a region with slanting or curved edges the inner limits depend on the outer variable.

        Under a **change of variables** $\mathbf{x} = \mathbf{T}(\mathbf{u})$ three things change together: the integrand, the description of the region, and the size of the cells, $d\mathbf{x} = \lvert \det J_{\mathbf{T}} \rvert\,d\mathbf{u}$. For polar coordinates the factor is $r$. For a linear map it is the determinant of the matrix. Densities transform by the reciprocal factor.

        That closes the cluster. You began with a loss that depended on two knobs and no notion of its slope. You now have the partial derivatives, the linear approximation that makes them meaningful, the gradient that points uphill, the rate along any direction or path, the chain rule that multiplies rates along routes and adds over them, the Jacobian and Hessian matrices, the quadratic model, the local undoing of functions and equations, and the integral over a region with its Jacobian factor.

        One of these is about to be turned into a machine. The chain rule, worked backwards from the output, gave the gradient of a neuron's loss from a handful of local rates. Every step was mechanical: each operation knew its own derivative, and the rates were multiplied along routes and added where routes met. Nothing in it needed a person. A program can record a computation as it runs, as a graph of operations, and then walk that graph backwards. Building that program, from an empty file, is the next cluster, and it begins with [[e6.scalar-computational-graph]].
