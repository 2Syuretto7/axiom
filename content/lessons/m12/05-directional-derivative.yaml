    - question:
        id: fix-check
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `agrees(f, grad, a, v)` should test a claimed gradient function `grad` against `f` at the point `a`: it compares the slope along the direction of `v` predicted by the gradient with a central difference along that direction, and returns `True` when they agree to within `1e-6`. `v` need not be a unit vector. It reports that the correct gradient of the squared length is wrong. Fix it.
        starter: |
          import numpy as np

          def agrees(f, grad, a, v):
              u = v / np.linalg.norm(v)
              t = 1e-5
              measured = (f(a + t * u) - f(a - t * u)) / (2 * t)
              predicted = grad(a) @ v
              return abs(measured - predicted) < 1e-6

          f = lambda p: (p ** 2).sum()
          print(agrees(f, lambda p: 2 * p, np.array([1.0, 2.0, 3.0]), np.array([2.0, -1.0, 2.0])))
        solution: |
          import numpy as np

          def agrees(f, grad, a, v):
              u = v / np.linalg.norm(v)
              t = 1e-5
              measured = (f(a + t * u) - f(a - t * u)) / (2 * t)
              predicted = grad(a) @ u
              return abs(measured - predicted) < 1e-6

          f = lambda p: (p ** 2).sum()
          print(agrees(f, lambda p: 2 * p, np.array([1.0, 2.0, 3.0]), np.array([2.0, -1.0, 2.0])))
        tests: |
          import numpy as _np
          _f = lambda p: (p ** 2).sum()
          _a = _np.array([1.0, 2.0, 3.0])
          assert bool(agrees(_f, lambda p: 2 * p, _a, _np.array([2.0, -1.0, 2.0]))) is True, "The gradient of the squared length is twice the point, and should pass along (2, -1, 2)"
          assert bool(agrees(_f, lambda p: 2 * p, _a, _np.array([0.0, 0.0, 7.0]))) is True, "The correct gradient should pass along any direction"
          assert bool(agrees(_f, lambda p: p, _a, _np.array([2.0, -1.0, 2.0]))) is False, "A gradient that is half the right one should fail"
          assert bool(agrees(_f, lambda p: 2 * p + _np.array([0.0, 0.0, 0.5]), _a, _np.array([0.0, 0.0, 2.0]))) is False, "A gradient wrong in its third entry should fail along the third axis"
          assert bool(agrees(_f, lambda p: 2 * p + _np.array([0.0, 0.0, 0.5]), _a, _np.array([3.0, 4.0, 0.0]))) is True, "A gradient wrong only in its third entry passes along a direction with no third part, which is why one direction is not proof"
          _g = lambda p: p[0] * p[1]
          assert bool(agrees(_g, lambda p: _np.array([p[1], p[0]]), _np.array([2.0, 5.0]), _np.array([1.0, 1.0]))) is True, "The gradient of xy is (y, x)"
          assert bool(agrees(_g, lambda p: _np.array([p[0], p[1]]), _np.array([2.0, 5.0]), _np.array([1.0, 0.0]))) is False, "The gradient of xy is not (x, y)"
          assert output.strip() == "True", "The program should print True"
        wrong:
          - |
            import numpy as np

            def agrees(f, grad, a, v):
                u = v / np.linalg.norm(v)
                t = 1e-5
                measured = (f(a + t * u) - f(a - t * u)) / (2 * t)
                predicted = grad(a) @ v
                return abs(measured - predicted) < 1e-6

            print(True)
          - |
            import numpy as np

            def agrees(f, grad, a, v):
                return True

            print(True)
          - |
            import numpy as np

            def agrees(f, grad, a, v):
                u = v / np.linalg.norm(v)
                t = 1e-5
                measured = (f(a + t * u) - f(a)) / t
                predicted = grad(a) @ u
                return abs(measured - predicted) < 1e-6

            print(True)
        explanation: |
          The measurement was made along the unit vector `u`, a slope per unit of distance. The prediction was made with `v`, three times as long, so it was three times the slope. The two sides of a comparison must describe the same quantity: dot the gradient with the same unit vector that was stepped along. The fifth test is worth a second look. A gradient that is wrong in one entry agrees perfectly along any direction with no component in that entry. One direction tests one combination of the entries. A direction chosen at random has a part along every axis, so it catches an error in any entry, and a few random directions leave very little room for a wrong gradient to hide.
    - question:
        id: work-headings
        type: numeric
        system: s2
        prompt: |
          On the hill, at $(1, 1)$, the gradient is $(-0.6, -0.8)$ with length 1. The engineer decides the road may have slope at most 0.8. What is the smallest angle, in degrees to the nearest whole number, that the road must make with the line straight up the hill?
        answer: "37"
        tolerance: "1"
        unit: "°"
        explanation: |
          The slope at angle $\theta$ to the gradient is $\cos\theta$, since the gradient has length 1. $\cos\theta = 0.8$ gives $\theta \approx 36.9°$. Any heading at least that far from straight up is gentle enough. One such heading is due south, $(0, -1)$: its dot product with the gradient is exactly 0.8, and it makes the angle whose cosine is 0.8 with $(-0.6, -0.8)$.
    - question:
        id: work-all-directions
        type: choice
        system: s2
        prompt: |
          $q(x, y) = \dfrac{x^2 y}{x^4 + y^2}$ away from the origin, and $q(0, 0) = 0$. Along every straight line through the origin, $q$ has a directional derivative there. Is $q$ differentiable at the origin?
        options:
          - 'Yes. A function with a slope in every direction has a tangent plane.'
          - 'No. On the parabola $y = x^2$, $q = \dfrac{x^4}{x^4 + x^4} = \dfrac12$ at points as near the origin as you like, while $q(0, 0) = 0$. So $q$ is not continuous at the origin, and a differentiable function is continuous.'
          - 'Yes, because both partial derivatives are 0 there.'
          - 'No, because the directional derivatives do not exist along the axes.'
        answer: 1
        explanation: |
          Directional derivatives examine the function along straight lines through the point, each on its own. A straight line $y = mx$ into the origin eventually lies well away from the parabola $y = x^2$, so on each line the function settles down. But the parabola itself approaches the origin tangent to the $x$-axis and carries the value $\tfrac12$ all the way in. Differentiability is a statement about all nearby points at once, with the error controlled by the distance alone. No collection of one-dimensional slices, however complete, can substitute for it. For formulas with continuous partial derivatives none of this arises.
    - question:
        id: work-random-direction
        type: choice
        system: s2
        prompt: |
          A program computes the gradient of a function of 10 000 variables. You want to check it. Comparing every entry with a central difference costs 20 000 evaluations. What does a check along one random unit direction $\mathbf{u}$ cost, and what does it establish?
        options:
          - 'It costs 20 000 evaluations as well, and establishes that every entry is right.'
          - 'It costs two evaluations. It compares the single number $\nabla f \cdot \mathbf{u}$ with the measured slope along $\mathbf{u}$. Agreement does not prove every entry right, but a random direction has a part along every axis, so an error in any entry shows up unless it is cancelled by coincidence.'
          - 'It costs two evaluations and proves the gradient is exactly right.'
          - 'It cannot be done, since a directional derivative needs the gradient first.'
        answer: 1
        explanation: |
          The measured slope along $\mathbf{u}$ needs only $f$ at two points. The predicted slope is one dot product with the gradient under test. If the gradient has an error vector $\mathbf{e}$, the two differ by $\mathbf{e} \cdot \mathbf{u}$, which is zero only if the error happens to be at right angles to the direction chosen. For a random direction that has probability zero. Repeating with a few independent directions makes an accidental pass even less likely. This is the standard quick check on a hand-written or machine-computed gradient.
  connections:
    - text: |
        On the hill, the slope under the engineer's feet depended on the heading: 1 straight up, 0 along the contour, and one half along the two headings 60° to either side of straight up, at about 173° and 293°.

        The **directional derivative** $D_{\mathbf{u}} f(\mathbf{a})$ is the derivative of the slice of $f$ along the line through $\mathbf{a}$ with unit direction $\mathbf{u}$. Partial derivatives are the special case of the axes. When $f$ is differentiable, $D_{\mathbf{u}} f = \nabla f \cdot \mathbf{u}$: the shadow of the gradient on the direction, $\lVert \nabla f \rVert \cos\theta$.

        It costs two evaluations to estimate, whatever the number of inputs, and a random direction gives a cheap test of a whole gradient. The slice along a direction can also be minimised, which chooses the length of a descent step: for least squares, $t^{*} = -\mathbf{r} \cdot X\mathbf{d} / \lVert X\mathbf{d} \rVert^2$.

        Without differentiability, slopes can exist in every direction and fail to be a dot product, or even coexist with a jump. Slices along straight lines do not capture a function. The linear approximation does.

        Every slice today was along a straight line, $\mathbf{a} + t\mathbf{u}$. But the engineer's finished road is not straight. It curves as the hillside curves. A weight in a network does not reach the loss directly: it passes through layer after layer first. What is the rate of change of $f$ along a **curved** path, or through a chain of intermediate quantities, each depending on the one before? That is the rule on which all of machine learning's differentiation rests, and it is the next lesson, [[m12.multivariable-chain-rule]].
