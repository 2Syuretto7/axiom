            import numpy as np

            def loss_partials(w, b, xs, ys):
                return [28 * w + 12 * b - 58, 12 * w + 8 * b - 28]

            print([10.0, 4.0])
        explanation: |
          One array of residuals serves both. The chain rule on each squared term gives twice the residual times the derivative of the residual, which is $x_i$ for $w$ and 1 for $b$. The sign matters: the residual must be prediction less target, since that is what is inside the square as a function of $w$ and $b$. Writing target less prediction flips the sign of both answers and would send a training step uphill. The formulas with 28, 12 and 58 in them are right for the puzzle's four points only. The form with the residuals is right for any data.
    - question:
