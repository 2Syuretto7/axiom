        solution: |
          import numpy as np

          def all_partials(f, a):
              h = 1e-5
              out = np.zeros(a.size)
              for i in range(a.size):
                  up = a.copy()
                  up[i] += h
                  high = f(up)
                  down = a.copy()
                  down[i] -= h
                  low = f(down)
                  out[i] = (high - low) / (2 * h)
              return out

          print([round(float(g), 4) for g in all_partials(lambda v: (v ** 2).sum(), np.array([1.0, 2.0, 3.0]))])
        tests: |
          import numpy as _np
          _a = _np.array([1.0, 2.0, 3.0])
          _g = all_partials(lambda v: (v ** 2).sum(), _a)
          assert _g.shape == (3,), "Return one estimate for each coordinate"
          assert _np.allclose(_g, [2.0, 4.0, 6.0], atol=1e-6), "The partial derivatives of the squared length at (1, 2, 3) are 2, 4, 6"
          assert _a.tolist() == [1.0, 2.0, 3.0], "The array passed in must not be changed"
          _b = _np.array([2.0, 5.0])
          _g = all_partials(lambda v: v[0] ** 2 * v[1] + 3 * v[1], _b)
          assert _np.allclose(_g, [20.0, 7.0], atol=1e-6), "At (2, 5) the partial derivatives of x squared y plus 3y are 20 and 7"
          assert _b.tolist() == [2.0, 5.0], "The array passed in must not be changed"
          _g = all_partials(lambda v: v[0] * v[1] * v[2], _np.array([2.0, 3.0, 4.0]))
          assert _np.allclose(_g, [12.0, 8.0, 6.0], atol=1e-6), "Each partial derivative of xyz is the product of the other two"
          assert output.strip() == "[2.0, 4.0, 6.0]", "The program should print [2.0, 4.0, 6.0]"
        wrong:
          - |
            import numpy as np

            def all_partials(f, a):
                h = 1e-5
                out = np.zeros(a.size)
                for i in range(a.size):
                    up = a
                    up[i] += h
                    high = f(up)
                    down = a
                    down[i] -= h
                    low = f(down)
                    out[i] = (high - low) / (2 * h)
                return out

            print([2.0, 4.0, 6.0])
          - |
            import numpy as np

            def all_partials(f, a):
                h = 1e-5
                out = np.zeros(a.size)
                for i in range(a.size):
                    up = a.copy()
                    up[i] += h
                    out[i] = (f(up) - f(a)) / (2 * h)
                return out

            print([2.0, 4.0, 6.0])
          - |
            import numpy as np

            def all_partials(f, a):
                h = 1e-5
                up = a.copy()
                down = a.copy()
                out = np.zeros(a.size)
                for i in range(a.size):
                    up[i] += h
                    down[i] -= h
                    out[i] = (f(up) - f(down)) / (2 * h)
                return out

            print([2.0, 4.0, 6.0])
        explanation: |
          `up = a` does not make a new array. It gives the caller's array a second name. Stepping `up[i]` up by $h$ moves `a` itself, and then `down = a` starts from the moved array, steps it back to where it began, and evaluates $f$ at the original point. So the difference measured is between $\mathbf{a} + h\mathbf{e}_i$ and $\mathbf{a}$, a forward difference divided by $2h$: half the right answer. Each coordinate needs its own fresh copies, so that one coordinate's step is not still in place when the next is taken. Keeping two copies across the loop without resetting them steps coordinate 0 and then coordinate 1 as well, measuring a slope in a diagonal direction.
    - question:
        id: work-stationary
        type: numeric
        system: s2
        prompt: |
          $f(x, y) = x^2 + 2y^2 - 4x + 4y + 1$. Its only stationary point is at $(x, y)$. What is the value of $f$ there?
        answer: "-5"
        explanation: |
          $\partial f / \partial x = 2x - 4$ is zero at $x = 2$, and $\partial f / \partial y = 4y + 4$ is zero at $y = -1$. Here the two equations do not involve each other, because $f$ has no term in $xy$: each variable can be settled on its own. The value is $4 + 2 - 8 - 4 + 1 = -5$. Both slices through the point are parabolas opening upwards, and since there is no cross term every other slice is too, so this is the lowest value of $f$.
    - question:
        id: work-not-continuous
        type: choice
        system: s2
        prompt: |
          $g(x, y) = \dfrac{xy}{x^2 + y^2}$ away from the origin, and $g(0, 0) = 0$. Both partial derivatives of $g$ exist at the origin and equal 0. Yet $g$ is not continuous there. How can both be true?
        options:
          - 'They cannot. One of the two claims is mistaken.'
          - 'The partial derivatives at the origin are computed from the values of $g$ along the two axes only, and along both axes $g$ is identically 0. Continuity concerns every point near the origin, and on the line $y = x$, which the partial derivatives never look at, $g$ is $\tfrac12$ however near the origin.'
          - 'The partial derivatives are only approximately 0.'
          - 'A function of two variables is never continuous where its formula has a zero on the bottom.'
        answer: 1
        explanation: |
          A partial derivative at a point is a limit taken along one line through it, parallel to an axis. Two partial derivatives sample two lines out of infinitely many. This function is perfectly flat along those two and jumps along all the rest. In one variable there is only one line, so a derivative there sees everything, and differentiability forces continuity. In several variables the existence of partial derivatives at a single point is a weak condition. What repairs it is to ask that the partial derivatives exist near the point and are continuous, which holds for every formula built from polynomials, exponentials, logarithms and the like wherever it is defined.
    - question:
        id: work-rectangle
        type: numeric
        system: s2
        prompt: |
          A rectangle has sides $x = 3$ and $y = 5$, and area $A = xy$. Using the partial derivatives, estimate the change in area when $x$ grows by 0.1 and, separately, $y$ grows by 0.2, both at once. Add the two separate estimates.
        answer: "1.1"
        tolerance: "0.001"
        explanation: |
          $\partial A / \partial x = y = 5$, so lengthening $x$ by 0.1 adds about $5 \times 0.1 = 0.5$: a strip of height 5 and width 0.1. $\partial A / \partial y = x = 3$, so lengthening $y$ by 0.2 adds about $3 \times 0.2 = 0.6$. Together 1.1. The true new area is $3.1 \times 5.2 = 16.12$, a change of 1.12. The estimate misses the little corner rectangle, $0.1 \times 0.2 = 0.02$, where the two strips overlap. Adding up the separate effects of separate nudges, and being off only by something of the second order of smallness, is the idea the next lesson makes precise.
  connections:
    - text: |
        At the line $w = 2$, $b = 1$ the loss rose by about 0.010 when $w$ was nudged by a thousandth and by about 0.004 when $b$ was. Those are the slopes of the two slices through the point, 10 and 4. The **partial derivative** of a function with respect to one input is the ordinary derivative of the slice in which only that input moves. You compute it by treating every other input as a constant.

        For the loss, $\dfrac{\partial L}{\partial w} = \sum 2 r_i x_i$ and $\dfrac{\partial L}{\partial b} = \sum 2 r_i$, with $r_i$ the miss at each point. Both are zero at the bottom of the bowl, which gave two linear equations and the best line, $w = 1.6$, $b = 1.1$. Points where all the partial derivatives vanish are **stationary**. A minimum is always one of them, and so is a saddle.

        A central difference in one coordinate estimates a partial derivative, at a cost of two evaluations for each input. That is far too slow for training and ideal for checking.

        One thing was left unsettled, twice. The last question added up the effects of two separate nudges and came out nearly right. And the function $\dfrac{xy}{x^2 + y^2}$ had both partial derivatives at the origin and was not even continuous there. The partial derivatives describe the function along the axes. When do they describe it in **every** direction, so that the effect of any small step is the sum of the effects of its parts? The answer is the proper notion of a derivative in several variables, and it is the next lesson, [[m12.total-derivative-as-best-linear-approximation]].
