concept: m12.hessian-and-symmetry-of-mixed-partials
minutes: 90
claim: You can compute the second partial derivatives of a function, explain why the two mixed ones agree when they are continuous, assemble them into the symmetric Hessian matrix, read the curvature of the function along any direction from it, classify a stationary point of a function of two variables as a minimum, a maximum or a saddle, and use the Hessian to take a Newton step towards a minimum.
recalls: [m12.jacobian]
uses: [m12.gradient, m12.partial-derivatives, m12.directional-derivative, m12.functions-of-several-variables, m12.total-derivative-as-best-linear-approximation, m12.multivariable-chain-rule, m10.second-derivative-and-curvature, m10.maxima-and-minima, m10.taylor-approximation, m10.differentiation-rules, m5.determinant, m5.transpose, m5.matrix-vector-product, m5.elimination-and-linear-systems, m5.identity-and-inverse, m4.dot-product, m1.quadratics, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e5.reshaping-views-and-copies, e5.vectorisation, e5.numerical-error-analysis-in-practice, e0.functions, e0.loops, e0.booleans-and-conditionals]
leads: [m12.multivariable-taylor-expansion, m13.hessian-vector-products, m19.newton-and-quasi-newton-methods, m19.convex-functions-and-their-conditions]
starter: |
  # Scratch space. Three functions, each with a level tangent plane at the origin.
  # Their values a short way out along the two axes and the two diagonals.
  def bowl(x, y):
      return x * x + y * y

  def saddle(x, y):
      return x * x - y * y

  def third(x, y):
      return x * x + 3 * x * y + y * y

  s = 0.1
  for f in [bowl, saddle, third]:
      print(f.__name__, [round(f(s * a, s * b), 3) for a, b in [(1, 0), (0, 1), (1, 1), (1, -1)]])
parts:
  recall:
    - text: |
        [[m12.jacobian]] gathered the first derivatives of a function with several outputs into a matrix, and ended by pointing out that the gradient of a scalar function is itself a function with several outputs. Today it gets a Jacobian of its own. Three quick pulls first.
  puzzle:
    - text: |
        Here are three functions. Each has both partial derivatives equal to zero at the origin, so each has a stationary point there, with a level tangent plane.

        $$x^2 + y^2, \qquad x^2 - y^2, \qquad x^2 + 3xy + y^2.$$

        The first is the bowl, with a minimum at the origin. The second is the saddle, which you settled in the first lesson of this cluster by slicing along the two axes: a bowl one way, a dome the other.

        Apply the same test to the third. Along the $x$-axis, where $y = 0$, it is $x^2$: a bowl. Along the $y$-axis it is $y^2$: a bowl again. Both slices curve upwards. It looks like a minimum.

        The starter prints the values of all three a short way from the origin, along both axes and along both diagonals.

        Run it. For the third function the values along the axes are 0.01 and 0.01, positive, as expected. Along the diagonal $y = x$ the value is 0.05. **Along the other diagonal, $y = -x$, it is $-0.01$.** The function goes **down** in that direction. The origin is not a minimum. It is a saddle, whose downhill directions happen to lie between the axes, where the two axis slices cannot see them.

        **So checking the axes is not enough, and there are infinitely many other directions. How can a stationary point be classified without trying them all? What is it about $x^2 + 3xy + y^2$ that the two axis slices missed? And what, for a function of several variables, plays the part that the second derivative played for one?**
  intuition:
    - text: |
        In one variable the second derivative measured how the slope changes: positive where the graph bends upwards like a bowl, negative where it bends like a dome. At a point with a level tangent, its sign told a minimum from a maximum.

        Try to say "how the slope changes" in two variables and you find there is more to say. There are two slopes, $f_x$ and $f_y$. And each of them can change in two ways, as $x$ moves or as $y$ moves. That makes **four** second derivatives:

        - $f_{xx}$: how the slope along $x$ changes as you move along $x$. The bend of the slice along $x$.
        - $f_{yy}$: how the slope along $y$ changes as you move along $y$. The bend of the slice along $y$.
        - $f_{xy}$ and $f_{yx}$: how the slope along one axis changes as you move along the **other**. These are the **mixed** partial derivatives.

        The mixed ones are the new thing, and they are what the puzzle's axis slices missed. Picture a flat sheet of card. Hold one edge still and lift the far corner, so that the card twists. Along any line parallel to an edge the card is still straight: no bend at all in the $x$ direction or in the $y$ direction. Yet the card is plainly not flat. The slope along $x$ is different at different values of $y$. **A mixed partial derivative measures twist.** The function $xy$ is exactly this twisted card: $f_{xx} = 0$, $f_{yy} = 0$ and $f_{xy} = 1$.

        The third function of the puzzle is a bowl, $x^2 + y^2$, plus three helpings of twist, $3xy$. Along the axes the twist contributes nothing, because $xy = 0$ there. Along the diagonal $y = -x$ it contributes $-3x^2$, and that overwhelms the bowl's $+2x^2$.

        **Four numbers, in a table.** Arrange them with a row for each slope and a column for each direction of movement:

        $$H = \begin{pmatrix} f_{xx} & f_{xy} \\ f_{yx} & f_{yy} \end{pmatrix}.$$

        This is the **Hessian matrix**. It is the Jacobian of the gradient: row $i$ says how the $i$-th partial derivative changes with each input. For the three functions of the puzzle it is

        $$\begin{pmatrix} 2 & 0 \\ 0 & 2 \end{pmatrix}, \qquad \begin{pmatrix} 2 & 0 \\ 0 & -2 \end{pmatrix}, \qquad \begin{pmatrix} 2 & 3 \\ 3 & 2 \end{pmatrix}.$$

        The diagonal entries are the bends of the axis slices, and for the third function they are both positive, as you found. The trouble is off the diagonal.

        Something else shows in all three: the two off-diagonal entries are equal. **That is no accident.** For any function smooth enough to be worth differentiating twice, $f_{xy} = f_{yx}$: the order in which you take the two partial derivatives does not matter. So the Hessian is a symmetric matrix, and there are really three second derivatives in two variables, not four.

        The figure shows the third function. Turn the direction through the full circle and watch the slice along it change from a bowl to a dome and back.
    - figure: contours
      props: { surface: twist, x: 0, y: 0, show: bend, angle: 135 }
  derivation:
    - text: |
        **Second partial derivatives.** Each first partial derivative of $f : \mathbb{R}^n \to \mathbb{R}$ is a function and may be differentiated again. Write

        $$\frac{\partial^2 f}{\partial x_i\,\partial x_j} = \frac{\partial}{\partial x_i}\!\left( \frac{\partial f}{\partial x_j} \right), \qquad\text{also written } f_{x_j x_i}.$$

        For $f(x, y) = x^3 y^2$: $f_x = 3x^2 y^2$ and $f_y = 2x^3 y$. Then $f_{xx} = 6xy^2$, $f_{yy} = 2x^3$, and the two mixed ones are $\dfrac{\partial}{\partial y}(3x^2 y^2) = 6x^2 y$ and $\dfrac{\partial}{\partial x}(2x^3 y) = 6x^2 y$. Equal.

        **Symmetry of mixed partials.** *If the second partial derivatives of $f$ are continuous near a point, then at that point $\dfrac{\partial^2 f}{\partial x\,\partial y} = \dfrac{\partial^2 f}{\partial y\,\partial x}$.*

        *Why.* Take a small rectangle with corners $(a, b)$, $(a + h, b)$, $(a, b + k)$ and $(a + h, b + k)$, and form the alternating sum of the values of $f$ at its corners:

        $$\Delta = f(a + h, b + k) - f(a + h, b) - f(a, b + k) + f(a, b).$$

        Group it as (the change along $y$ at $x = a + h$) minus (the change along $y$ at $x = a$). Each change along $y$ is about $k f_y$, and the difference between the two, a distance $h$ apart in $x$, is about $h$ times the rate of change of $f_y$ with $x$. So $\Delta \approx hk\,\dfrac{\partial}{\partial x} f_y$. Now group the same four numbers the other way: (the change along $x$ at $y = b + k$) minus (the change along $x$ at $y = b$). The same reasoning gives $\Delta \approx hk\,\dfrac{\partial}{\partial y} f_x$. One quantity, two descriptions: so the two mixed partial derivatives agree. Making each "about" precise takes the mean value theorem twice and continuity of the second derivatives at the end. $\blacksquare$

        The condition is needed. The function $\dfrac{xy(x^2 - y^2)}{x^2 + y^2}$, with value 0 at the origin, has mixed partial derivatives $-1$ and $+1$ there. Its second derivatives are not continuous at the origin. For polynomials, exponentials and every other smooth formula, the order never matters.

        **The Hessian.** For $f : \mathbb{R}^n \to \mathbb{R}$ the **Hessian** at $\mathbf{a}$ is the $n$ by $n$ matrix

        $$H_f(\mathbf{a}) = \left( \frac{\partial^2 f}{\partial x_i\,\partial x_j}(\mathbf{a}) \right), \qquad H_f = J_{\nabla f}.$$

        By the theorem it is symmetric, $H = H^{\mathsf T}$, so of its $n^2$ entries only $\tfrac{n(n+1)}{2}$ are different.

        **Two Hessians to know.** For a quadratic $f(\mathbf{x}) = \mathbf{x}^{\mathsf T} A\mathbf{x}$, the gradient is $(A + A^{\mathsf T})\mathbf{x}$, a linear map, whose Jacobian is its matrix: $H = A + A^{\mathsf T}$, the same at every point, and $2A$ when $A$ is symmetric. For the least-squares loss $\lVert X\boldsymbol\theta - \mathbf{y} \rVert^2$ the gradient is $2X^{\mathsf T}(X\boldsymbol\theta - \mathbf{y})$ and so

        $$H = 2X^{\mathsf T}X.$$

        For the four points of the running example, $H = \begin{pmatrix} 28 & 12 \\ 12 & 8 \end{pmatrix}$, which you can read off the multiplied-out loss $14w^2 + 12wb + 4b^2 - \dots$ directly. It does not depend on $\mathbf{y}$ at all: the shape of the bowl is fixed by where the data points are along $x$, and the targets only decide where its bottom lies.

        **Curvature along a direction.** Slice $f$ along the line $\mathbf{a} + t\mathbf{u}$ and call the slice $\varphi(t)$. By the chain rule $\varphi'(t) = \nabla f(\mathbf{a} + t\mathbf{u}) \cdot \mathbf{u}$. Differentiate again: the gradient changes at the rate $H\mathbf{u}$ along the line, so

        $$\varphi''(0) = \mathbf{u}^{\mathsf T} H\,\mathbf{u} = \sum_{i, j} H_{ij}\,u_i u_j.$$

        **The second derivative of the slice in direction $\mathbf{u}$ is $\mathbf{u}^{\mathsf T}H\mathbf{u}$.** One symmetric matrix holds the curvature in every direction. With $\mathbf{u} = \mathbf{e}_i$ it gives the diagonal entry $H_{ii}$, the bend of an axis slice. For the puzzle's third function and the unit vector $\mathbf{u} = \tfrac{1}{\sqrt2}(1, -1)$, it gives $\tfrac12(2 - 3 - 3 + 2) = -1$: a dome.
    - question:
        id: derivation-twist
        type: choice
        system: s2
        prompt: |
          $f(x, y) = xy$ has $f_{xx} = 0$ and $f_{yy} = 0$ everywhere. Is its graph a plane?
        options:
          - 'Yes. With no bend along $x$ and none along $y$, it is flat.'
          - 'No. $f_{xy} = 1$: the slope along $x$, which is $y$, changes as $y$ changes. Each slice parallel to an axis is a straight line, but the lines tilt more and more steeply as you move across them, so the surface is twisted. Along the diagonal $y = x$ it is $x^2$, which curves up, and along $y = -x$ it is $-x^2$, which curves down.'
          - 'No, because its gradient is never zero.'
          - 'Yes, because its Hessian is the zero matrix.'
        answer: 1
        explanation: |
          The Hessian of $xy$ is $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, which is not zero. The diagonal entries give the curvature along the axes only. The curvature along a general unit direction $\mathbf{u}$ is $\mathbf{u}^{\mathsf T}H\mathbf{u} = 2u_1u_2$, which is $+1$ along one diagonal and $-1$ along the other. The surface is a saddle, the same shape as $x^2 - y^2$ turned through 45°. A function is flat to second order only when the whole Hessian vanishes.
    - text: |
        **Classifying a stationary point.** At a stationary point the gradient is zero, so along every direction the slice has a level tangent, and the sign of $\mathbf{u}^{\mathsf T}H\mathbf{u}$ decides whether that slice has a minimum or a maximum there.

        - If $\mathbf{u}^{\mathsf T}H\mathbf{u} > 0$ for **every** direction $\mathbf{u}$, every slice is a bowl and the point is a **local minimum**. Such a matrix is called **positive definite**.
        - If $\mathbf{u}^{\mathsf T}H\mathbf{u} < 0$ for every direction, the point is a **local maximum**. The matrix is **negative definite**.
        - If it is positive for some directions and negative for others, the point is a **saddle**. The matrix is **indefinite**.

        This turns the question into one about a matrix: is $\mathbf{u}^{\mathsf T}H\mathbf{u}$ of one sign for all $\mathbf{u}$? For two variables there is a test that needs only three numbers. Write $H = \begin{pmatrix} A & B \\ B & C \end{pmatrix}$, so that for $\mathbf{u} = (p, q)$

        $$\mathbf{u}^{\mathsf T}H\mathbf{u} = Ap^2 + 2Bpq + Cq^2.$$

        Complete the square, as for any quadratic. When $A \ne 0$,

        $$Ap^2 + 2Bpq + Cq^2 = A\left(p + \frac{B}{A}q\right)^2 + \frac{AC - B^2}{A}\,q^2.$$

        Two squares, with coefficients $A$ and $\dfrac{AC - B^2}{A}$. Both coefficients are positive exactly when $A > 0$ and $AC - B^2 > 0$. Both are negative exactly when $A < 0$ and $AC - B^2 > 0$. They have opposite signs exactly when $AC - B^2 < 0$. And $AC - B^2$ is the determinant of $H$.

        | $\det H = f_{xx}f_{yy} - f_{xy}^2$ | $f_{xx}$ | The stationary point is |
        |---|---|---|
        | positive | positive | a local minimum |
        | positive | negative | a local maximum |
        | negative | either | a saddle |
        | zero | either | undecided by this test |

        This is the **second-derivative test** in two variables. The puzzle's third function has $\det H = 4 - 9 = -5$: a saddle, whatever its diagonal says. The loss of the running example has $\det H = 224 - 144 = 80 > 0$ and $f_{ww} = 28 > 0$: its stationary point is a minimum. For more than two variables the same question is answered by the eigenvalues of $H$, which a later cluster introduces.

        **Newton's method for a minimum.** A minimum is where the gradient is zero, and that is a system of equations, $\nabla f(\mathbf{x}) = \mathbf{0}$. The last lesson solved systems by Newton's method, which needs the Jacobian of the function being set to zero. The Jacobian of the gradient is the Hessian. So the step is

        $$H(\mathbf{x})\,\mathbf{d} = -\nabla f(\mathbf{x}), \qquad \mathbf{x} \leftarrow \mathbf{x} + \mathbf{d}.$$

        For the loss, from $(2, 1)$: solve $28d_1 + 12d_2 = -10$, $12d_1 + 8d_2 = -4$, giving $\mathbf{d} = (-0.4, 0.1)$, and the new point is $(1.6, 1.1)$. **One step, and exactly at the minimum**, where gradient descent needed about a hundred. The Hessian knows the shape of the bowl, and so it knows where the bottom is. For a quadratic the linear approximation of the gradient is exact, so one step suffices. For other functions the step is repeated.

        **Why this is not how networks are trained.** A model with a million weights has a Hessian with a million million entries. It cannot be stored, let alone solved with. What can be had cheaply is the Hessian **applied to one vector**: since $H\mathbf{v}$ is the rate of change of the gradient along $\mathbf{v}$,

        $$H\mathbf{v} \approx \frac{\nabla f(\mathbf{x} + \varepsilon\mathbf{v}) - \nabla f(\mathbf{x} - \varepsilon\mathbf{v})}{2\varepsilon},$$

        two gradients and no matrix. Much of practical optimisation consists of ways to get some of the Hessian's knowledge at something like the gradient's price.
    - question:
        id: order-classify
        type: order
        system: s2
        prompt: Put in order the steps for finding and classifying the stationary point of $f(x, y) = x^2 + 3xy + y^2 - 5x$.
        steps:
          - 'Find the gradient: $(2x + 3y - 5,\ 3x + 2y)$.'
          - 'Set it to zero and solve the two equations: $x = -2$, $y = 3$.'
          - 'Find the Hessian: $f_{xx} = 2$, $f_{xy} = 3$, $f_{yy} = 2$.'
          - 'Compute its determinant: $2 \times 2 - 3^2 = -5$.'
          - 'The determinant is negative, so the stationary point is a saddle.'
        explanation: The first derivatives locate the candidates and the second derivatives classify them. Here the Hessian is constant, so it need not be evaluated at the point, but in general it must be. The linear term −5x moves the stationary point away from the origin and has no effect on the Hessian, so the point is a saddle like that of the puzzle.
  formal:
    - text: |
        **Schwarz's theorem** (also called Clairaut's). If $\dfrac{\partial^2 f}{\partial x_i\,\partial x_j}$ and $\dfrac{\partial^2 f}{\partial x_j\,\partial x_i}$ exist near $\mathbf{a}$ and are continuous at $\mathbf{a}$, they are equal at $\mathbf{a}$. A function whose second partial derivatives are all continuous is said to be of class $C^2$.

        **Hessian.** For $f$ of class $C^2$, $H_f(\mathbf{a})$ is the symmetric $n \times n$ matrix with entries $\dfrac{\partial^2 f}{\partial x_i\,\partial x_j}(\mathbf{a})$. It is the Jacobian of $\nabla f$.

        **Second directional derivative.** $\dfrac{d^2}{dt^2} f(\mathbf{a} + t\mathbf{u})\Big|_{t=0} = \mathbf{u}^{\mathsf T}H_f(\mathbf{a})\,\mathbf{u}$.

        **Definiteness.** A symmetric matrix $H$ is positive definite if $\mathbf{u}^{\mathsf T}H\mathbf{u} > 0$ for all $\mathbf{u} \ne \mathbf{0}$, negative definite if $-H$ is positive definite, and indefinite if $\mathbf{u}^{\mathsf T}H\mathbf{u}$ takes both signs.

        **Second-derivative test.** Let $\nabla f(\mathbf{a}) = \mathbf{0}$ with $f$ of class $C^2$. If $H_f(\mathbf{a})$ is positive definite, $\mathbf{a}$ is a strict local minimum. If negative definite, a strict local maximum. If indefinite, a saddle. For $n = 2$: positive definite iff $\det H > 0$ and $f_{xx} > 0$, negative definite iff $\det H > 0$ and $f_{xx} < 0$, indefinite iff $\det H < 0$.

        **Newton step for a minimum.** $\mathbf{x}_{k+1} = \mathbf{x}_k - H_f(\mathbf{x}_k)^{-1}\,\nabla f(\mathbf{x}_k)$.
