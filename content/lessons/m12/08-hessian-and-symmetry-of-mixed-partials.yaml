    - question:
        id: predict-hessian
        type: predict
        system: s1
        prompt: The Hessian of the puzzle's third function, and its curvature along four directions. What does this show?
        code: |
          import numpy as np

          H = np.array([[2.0, 3.0], [3.0, 2.0]])
          for u in [np.array([1.0, 0.0]), np.array([0.0, 1.0]), np.array([1.0, 1.0]), np.array([1.0, -1.0])]:
              u = u / np.linalg.norm(u)
              print(round(float(u @ H @ u), 6))
          print(round(float(np.linalg.det(H)), 6))
        output: |
          2.0
          2.0
          5.0
          -1.0
          -5.0
        explanation: Along both axes the curvature is the diagonal entry, 2, a bowl. Along one diagonal the twist adds 3, and along the other it takes 3 away and leaves a dome. The negative determinant says in one number that the curvature takes both signs.
    - question:
        id: predict-newton
        type: predict
        system: s1
        prompt: One Newton step on the least-squares loss. What does this show?
        code: |
          import numpy as np

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          theta = np.array([2.0, 1.0])
          H = 2 * X.T @ X
          g = 2 * X.T @ (X @ theta - y)
          print(H.tolist())
          print([round(float(v), 6) for v in theta + np.linalg.solve(H, -g)])
        output: |
          [[28.0, 12.0], [12.0, 8.0]]
          [1.6, 1.1]
        explanation: The Hessian is twice X transpose X, whose entries are twice the sum of the squares of the x values, twice their sum, and twice the number of points. Solving with it against minus the gradient gives the step (−0.4, 0.1), which lands on the best line in one move.
  work:
    - text: Slower now. The diagonal of a Hessian speaks for the axes only.
    - question:
        id: write-hessian
        type: code
        mode: write
        system: s2
        prompt: |
          Write `hessian(grad, a)`. `grad` takes a point, an array of length $n$, and returns the gradient of some function there, an array of length $n$. Return the $n$ by $n$ array of central-difference estimates of the Hessian at `a`, with step `1e-5`, made exactly symmetric by averaging the estimate with its transpose. Leave `a` unchanged.
        starter: |
          import numpy as np

          def hessian(grad, a):
              # Replace the next line with your own.
              return np.zeros((a.size, a.size))

          grad = lambda p: np.array([2 * p[0] + 3 * p[1], 3 * p[0] + 2 * p[1]])
          print([[round(float(v), 4) for v in row] for row in hessian(grad, np.array([0.0, 0.0]))])
        solution: |
          import numpy as np

          def hessian(grad, a):
              h = 1e-5
              columns = []
              for j in range(a.size):
                  step = np.zeros(a.size)
                  step[j] = h
                  columns.append((grad(a + step) - grad(a - step)) / (2 * h))
              H = np.stack(columns, axis=1)
              return (H + H.T) / 2

          grad = lambda p: np.array([2 * p[0] + 3 * p[1], 3 * p[0] + 2 * p[1]])
          print([[round(float(v), 4) for v in row] for row in hessian(grad, np.array([0.0, 0.0]))])
        tests: |
          import numpy as _np
          _grad = lambda p: _np.array([2 * p[0] + 3 * p[1], 3 * p[0] + 2 * p[1]])
          _a = _np.array([0.0, 0.0])
          _H = hessian(_grad, _a)
          assert _H.shape == (2, 2), "Two inputs give a 2 by 2 matrix"
