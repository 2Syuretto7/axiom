            import numpy as np

            def classify(H):
                if H[0, 0] > 0 and H[1, 1] > 0:
                    return "minimum"
                if H[0, 0] < 0 and H[1, 1] < 0:
                    return "maximum"
                if H[0, 0] * H[1, 1] < 0:
                    return "saddle"
                return "undecided"

            print("minimum saddle saddle")
