    - question:
        id: write-classify
        type: code
        mode: write
        system: s2
        prompt: |
          Write `classify(H)` for a symmetric 2 by 2 array `H`, the Hessian at a stationary point. Return the string `"minimum"`, `"maximum"`, `"saddle"` or `"undecided"` according to the second-derivative test. Treat a determinant whose absolute value is below `1e-12` as zero.
        starter: |
          import numpy as np

          def classify(H):
              # Replace the next line with your own.
              return "undecided"

          for H in [np.array([[2.0, 0.0], [0.0, 2.0]]), np.array([[2.0, 0.0], [0.0, -2.0]]), np.array([[2.0, 3.0], [3.0, 2.0]])]:
              print(classify(H))
        solution: |
          import numpy as np

          def classify(H):
              det = H[0, 0] * H[1, 1] - H[0, 1] * H[1, 0]
              if abs(det) < 1e-12:
                  return "undecided"
              if det < 0:
                  return "saddle"
              if H[0, 0] > 0:
                  return "minimum"
              return "maximum"

          for H in [np.array([[2.0, 0.0], [0.0, 2.0]]), np.array([[2.0, 0.0], [0.0, -2.0]]), np.array([[2.0, 3.0], [3.0, 2.0]])]:
              print(classify(H))
        tests: |
          import numpy as _np
          _c = lambda rows: classify(_np.array(rows))
          assert _c([[2.0, 0.0], [0.0, 2.0]]) == "minimum", "The bowl has a minimum"
          assert _c([[2.0, 0.0], [0.0, -2.0]]) == "saddle", "The saddle is a saddle"
          assert _c([[2.0, 3.0], [3.0, 2.0]]) == "saddle", "With both diagonal entries positive and a large twist, the point is still a saddle"
          assert _c([[-2.0, 1.0], [1.0, -3.0]]) == "maximum", "Positive determinant and negative first entry: a maximum"
          assert _c([[28.0, 12.0], [12.0, 8.0]]) == "minimum", "The least-squares loss has a minimum"
          assert _c([[0.0, 1.0], [1.0, 0.0]]) == "saddle", "The twisted card xy is a saddle though its diagonal is zero"
          assert _c([[1.0, 1.0], [1.0, 1.0]]) == "undecided", "A zero determinant leaves the test undecided"
          assert _c([[0.0, 0.0], [0.0, 0.0]]) == "undecided", "The zero matrix leaves the test undecided"
          assert _c([[-1.0, 0.0], [0.0, 5.0]]) == "saddle", "Opposite signs on the diagonal: a saddle"
          assert output.split() == ["minimum", "saddle", "saddle"], "The program should print minimum, saddle, saddle on three lines"
        wrong:
