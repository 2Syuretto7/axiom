            import numpy as np

            def classify(H):
                det = H[0, 0] * H[1, 1] + H[0, 1] * H[1, 0]
                if abs(det) < 1e-12:
                    return "undecided"
                if det < 0:
                    return "saddle"
                if H[0, 0] > 0:
                    return "minimum"
                return "maximum"

            print("minimum saddle saddle")
        explanation: |
          The determinant comes first. If it is negative the curvature takes both signs and the point is a saddle, whatever the diagonal says. If it is positive the curvature has one sign in every direction, and the sign of any diagonal entry tells which. If it is zero there is a direction along which the function is flat to second order, and higher derivatives would be needed. The first wrong version looks only at the diagonal, which is the mistake of the puzzle: it calls $x^2 + 3xy + y^2$ a minimum.
    - question:
        id: fix-hvp
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `hessian_times(grad, a, v)` should return an estimate of the Hessian at `a` applied to the vector `v`, using two evaluations of the gradient function and no matrix. For the least-squares loss it should match `2 * X.T @ X @ v`, and the program prints `False`. Fix it.
        starter: |
          import numpy as np

          def hessian_times(grad, a, v):
              eps = 1e-5
              return (grad(a + eps * v) - grad(a - eps * v)) / eps

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          grad = lambda t: 2 * X.T @ (X @ t - y)
          v = np.array([1.0, -2.0])
          print(np.allclose(hessian_times(grad, np.array([2.0, 1.0]), v), 2 * X.T @ X @ v))
        solution: |
          import numpy as np

          def hessian_times(grad, a, v):
              eps = 1e-5
              return (grad(a + eps * v) - grad(a - eps * v)) / (2 * eps)

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          grad = lambda t: 2 * X.T @ (X @ t - y)
          v = np.array([1.0, -2.0])
          print(np.allclose(hessian_times(grad, np.array([2.0, 1.0]), v), 2 * X.T @ X @ v))
        tests: |
          import numpy as _np
          _X = _np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          _y = _np.array([1.0, 3.0, 4.0, 6.0])
          _grad = lambda t: 2 * _X.T @ (_X @ t - _y)
          _a = _np.array([2.0, 1.0])
          assert _np.allclose(hessian_times(_grad, _a, _np.array([1.0, -2.0])), [4.0, -4.0], atol=1e-6), "For the least-squares loss, H times (1, -2) is (4, -4)"
          assert _np.allclose(hessian_times(_grad, _a, _np.array([1.0, 0.0])), [28.0, 12.0], atol=1e-6), "H times the first basis vector is the first column of H"
          assert _np.allclose(hessian_times(_grad, _a, _np.array([0.0, 1.0])), [12.0, 8.0], atol=1e-6), "H times the second basis vector is the second column of H"
          _g = lambda p: _np.array([3 * p[0] ** 2 * p[1] ** 2, 2 * p[0] ** 3 * p[1]])
          assert _np.allclose(hessian_times(_g, _np.array([1.0, 2.0]), _np.array([1.0, 1.0])), [36.0, 14.0], atol=1e-5), "For x cubed y squared at (1, 2), H is [[24, 12], [12, 2]] and H times (1, 1) is (36, 14)"
          _n = [0]
          def _counted(p):
              _n[0] += 1
              return 2 * p
          hessian_times(_counted, _np.zeros(50), _np.ones(50))
          assert _n[0] == 2, "Use exactly two evaluations of the gradient"
          assert output.strip() == "True", "The program should print True"
        wrong:
          - |
            import numpy as np

            def hessian_times(grad, a, v):
                eps = 1e-5
                return (grad(a + eps * v) - grad(a - eps * v)) / eps

            print(True)
          - |
            import numpy as np

            def hessian_times(grad, a, v):
                eps = 1e-5
                return (grad(a + eps) - grad(a - eps)) / (2 * eps)

            print(True)
          - |
            import numpy as np

            def hessian_times(grad, a, v):
                eps = 1e-5
                return (grad(a + eps * v) - grad(a)) / (2 * eps)

            print(True)
        explanation: |
          The two points at which the gradient is evaluated are $2\varepsilon$ apart along $\mathbf{v}$, so the difference must be divided by $2\varepsilon$. Dividing by $\varepsilon$ gives twice the right answer. The idea deserves notice more than the slip does. $H\mathbf{v}$ is the directional derivative of the gradient along $\mathbf{v}$: how the gradient changes as you move that way. So it costs two gradients, and the Hessian itself, with its $n^2$ entries, is never formed. For fifty variables the matrix would have 2500 entries. For a network it could not be stored at all, and this product still could be computed.
    - question:
        id: work-find-classify
        type: choice
        system: s2
        prompt: |
          $f(x, y) = x^3 - 3x + y^2$. It has two stationary points. What are they?
        options:
          - '$(1, 0)$ is a local minimum and $(-1, 0)$ is a saddle.'
          - '$(1, 0)$ is a saddle and $(-1, 0)$ is a local maximum.'
          - 'Both are local minima.'
          - '$(1, 0)$ is a local minimum and $(-1, 0)$ is a local maximum.'
        answer: 0
        explanation: |
          $\nabla f = (3x^2 - 3,\ 2y)$ is zero where $x = \pm 1$ and $y = 0$. The Hessian is $\begin{pmatrix} 6x & 0 \\ 0 & 2 \end{pmatrix}$, which depends on the point, so it must be evaluated at each. At $(1, 0)$ it is $\begin{pmatrix} 6 & 0 \\ 0 & 2 \end{pmatrix}$: determinant 12, first entry positive, a minimum. At $(-1, 0)$ it is $\begin{pmatrix} -6 & 0 \\ 0 & 2 \end{pmatrix}$: determinant $-12$, a saddle. Along $x$ the point $(-1, 0)$ is the top of a hump of the cubic, and along $y$ it is the bottom of a parabola.
    - question:
        id: work-curvature-direction
        type: numeric
        system: s2
        prompt: |
          The least-squares loss of the running example has Hessian $\begin{pmatrix} 28 & 12 \\ 12 & 8 \end{pmatrix}$. What is its curvature $\mathbf{u}^{\mathsf T}H\mathbf{u}$ along the unit direction $\mathbf{u} = (0.6, -0.8)$? Give it to two decimal places.
        answer: "3.68"
        tolerance: "0.01"
        explanation: |
          $\mathbf{u}^{\mathsf T}H\mathbf{u} = 28(0.36) + 2 \times 12 \times (0.6)(-0.8) + 8(0.64) = 10.08 - 11.52 + 5.12 = 3.68$. Compare the curvature along the $w$-axis, 28. The bowl is nearly eight times as sharply curved along $w$ as along this slanting direction, which runs roughly along the floor of the valley. That disparity is what limited the step size of gradient descent to 0.05 or so and made it take a hundred steps. Raising $w$ while lowering $b$ changes the predictions little, since the two changes partly cancel over the data, so the loss is insensitive to that combination.
    - question:
        id: work-why-symmetric
        type: choice
        system: s2
        prompt: |
          For a smooth function, why must $\dfrac{\partial}{\partial x}\!\left(\dfrac{\partial f}{\partial y}\right)$ equal $\dfrac{\partial}{\partial y}\!\left(\dfrac{\partial f}{\partial x}\right)$?
        options:
          - 'Because multiplication of numbers is commutative.'
          - 'Because both describe one quantity. Take the alternating sum of $f$ at the four corners of a tiny rectangle of sides $h$ and $k$. Seen as the difference between the changes along $y$ on its two vertical sides, it is about $hk$ times the first expression. Seen as the difference between the changes along $x$ on its two horizontal sides, it is about $hk$ times the second.'
          - 'Because the Hessian is defined to be symmetric.'
          - 'They need not be equal for any function.'
        answer: 1
        explanation: |
          The four-corner sum $f(a+h, b+k) - f(a+h, b) - f(a, b+k) + f(a, b)$ does not care in which order its terms are grouped. Each grouping exhibits it as a second difference, first in one variable and then in the other, and a second difference divided by $hk$ approaches the matching mixed partial derivative as the rectangle shrinks. The argument needs the second derivatives to be continuous so that "approaches" can be justified, and there are functions without that property whose mixed partials differ. The symmetry is a theorem about smooth functions and not a convention.
    - question:
        id: work-newton-vs-descent
        type: choice
        system: s2
        prompt: |
          On the least-squares loss, one Newton step from any starting point lands exactly on the minimum, while gradient descent takes many steps. Why is Newton's method not simply used to train large networks?
        options:
          - 'Because Newton steps go uphill.'
          - 'Because it needs the Hessian, which for $n$ weights has $n^2$ entries and costs of the order of $n^3$ operations to solve with. For a million weights that is a million million entries. Also, away from a minimum the Hessian may be indefinite, and then the Newton step heads for a saddle as readily as for a minimum.'
          - 'Because the gradient is not available for networks.'
          - 'Because Newton''s method only works for functions of two variables.'
        answer: 1
        explanation: |
          Newton's method solves $\nabla f = \mathbf{0}$, and saddles and maxima satisfy that equation as well as minima do. For a bowl-shaped quadratic the Hessian is positive definite everywhere and the single stationary point is the minimum, so there is no difficulty. A network's loss is not a bowl, and its Hessian is too large to form. The gradient costs about as much as evaluating the loss a few times, independent of the number of weights, which is why first-order methods dominate. The methods of the later cluster on optimisation sit between the two: they use gradients, and products of the Hessian with a vector, to recover some of what Newton's method knows.
  connections:
    - text: |
        $x^2 + 3xy + y^2$ curves upwards along both axes and is a saddle all the same, because of its twist: along $y = -x$ it is $-x^2$.

        A function of several variables has a second partial derivative for every ordered pair of inputs. The **mixed** ones measure how the slope along one input changes as another moves. When the second derivatives are continuous the order does not matter, $f_{xy} = f_{yx}$, because both describe the four-corner sum of $f$ round a small rectangle.

        The **Hessian** $H$ is the symmetric matrix of all of them, the Jacobian of the gradient. The curvature of $f$ along a unit direction $\mathbf{u}$ is $\mathbf{u}^{\mathsf T}H\mathbf{u}$. At a stationary point, if that is positive in every direction the point is a minimum, if negative in every direction a maximum, and if it takes both signs a saddle. In two variables, $\det H > 0$ with $f_{xx} > 0$ is a minimum, $\det H > 0$ with $f_{xx} < 0$ a maximum, and $\det H < 0$ a saddle.

        For least squares $H = 2X^{\mathsf T}X$. Solving $H\mathbf{d} = -\nabla f$ is a Newton step, which reaches the minimum of a quadratic at once. The Hessian is too large to form for big models, but $H\mathbf{v}$ costs two gradients.

        Everything in this lesson came from looking at $f$ near a point to second order: its value, plus a slope term from the gradient, plus a curvature term from the Hessian. In one variable that was the Taylor polynomial of degree 2, and it had an error you could estimate. The same expansion for several variables, which justifies today's test and Newton's step, is the next lesson, [[m12.multivariable-taylor-expansion]].
