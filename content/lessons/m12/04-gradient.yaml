    - question:
        id: drill-length
        type: numeric
        system: s1
        prompt: |
          At a point, $\nabla f = (3, 4)$. What is the steepest rate of increase of $f$ there, per unit of distance?
        answer: "5"
        explanation: It is the length of the gradient.
    - question:
        id: drill-level
        type: choice
        system: s1
        prompt: |
          At a point, $\nabla f = (3, 4)$. A small step in which direction leaves $f$ unchanged to first order?
        options: ['$(3, 4)$', '$(-3, -4)$', '$(4, -3)$', '$(1, 1)$']
        answer: 2
        explanation: Its dot product with the gradient is 12 less 12.
    - question:
        id: drill-down
        type: choice
        system: s1
        prompt: |
          At a point, $\nabla f = (3, 4)$. In which direction does $f$ fall fastest?
        options: ['$(3, 4)$', '$(-3, -4)$', '$(4, -3)$', '$(-4, 3)$']
        answer: 1
        explanation: Fastest descent is exactly against the gradient.
    - question:
        id: drill-entries
        type: numeric
        system: s1
        prompt: |
          A loss depends on 1000 weights. How many entries has its gradient?
        answer: "1000"
        explanation: One partial derivative for each input.
    - question:
        id: drill-contour
        type: choice
        system: s1
        prompt: |
          How does the gradient at a point meet the level curve through that point?
        options: ['It runs along it', 'At right angles', 'At 45°', 'It depends on the function']
        answer: 1
        explanation: Along the level curve the function does not change, so the dot product of that direction with the gradient is zero.
    - question:
        id: drill-step
        type: choice
        system: s1
        prompt: |
          One step of gradient descent from $\mathbf{x}$ with step size $\eta$ goes to which point?
        options: ['$\mathbf{x} + \eta\,\nabla f(\mathbf{x})$', '$\mathbf{x} - \eta\,\nabla f(\mathbf{x})$', '$\eta\,\nabla f(\mathbf{x})$', '$\mathbf{x} - \nabla f(\mathbf{x}) / \eta$']
        answer: 1
        explanation: The step is against the gradient, scaled by the step size.
    - question:
        id: drill-one-step
        type: choice
        system: s1
        prompt: |
          $f(x, y) = x^2 + y^2$. One step of gradient descent from $(4, 2)$ with step size 0.25 lands where?
        options: ['$(2, 1)$', '$(3.75, 1.75)$', '$(0, 0)$', '$(6, 3)$']
        answer: 0
        explanation: The gradient is (8, 4), and a quarter of it is (2, 1).
    - question:
        id: drill-zero
        type: choice
        system: s1
        prompt: |
          At a local minimum inside the domain of a differentiable function, what is the gradient?
        options: ['The zero vector', 'A unit vector', 'It points straight up', 'It points at the origin']
        answer: 0
        explanation: Every partial derivative vanishes at a minimum.
    - question:
        id: drill-quadratic
        type: choice
        system: s1
        prompt: |
          $A$ is a symmetric matrix and $f(\mathbf{x}) = \mathbf{x}^{\mathsf T} A\,\mathbf{x}$. What is $\nabla f$?
        options: ['$A\mathbf{x}$', '$2A\mathbf{x}$', '$\mathbf{x}^{\mathsf T}A$', '$2\mathbf{x}$']
        answer: 1
        explanation: It is the many-variable form of the derivative of a times x squared.
    - question:
        id: predict-zigzag
        type: predict
        system: s1
        prompt: Three steps of gradient descent on $x^2 + 4y^2$ with step size 0.25. What does this show?
        code: |
          import numpy as np

          p = np.array([1.0, 1.0])
          for k in range(3):
              g = np.array([2 * p[0], 8 * p[1]])
              p = p - 0.25 * g
              print(p.tolist())
        output: |
          [0.5, -1.0]
          [0.25, 1.0]
          [0.125, -1.0]
        explanation: The x coordinate is multiplied by 1 less 2 times 0.25, a half, at each step. The y coordinate is multiplied by 1 less 8 times 0.25, which is minus 1, so it jumps across the valley and back without ever getting closer.
    - question:
        id: predict-matrix-form
        type: predict
        system: s1
        prompt: The gradient of the loss in matrix form, at two lines. What does this show?
        code: |
          import numpy as np

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          for theta in [np.array([2.0, 1.0]), np.array([1.0, 1.0])]:
              g = 2 * X.T @ (X @ theta - y)
              print(g.tolist())
        output: |
          [10.0, 4.0]
          [-18.0, -8.0]
        explanation: At slope 2 and intercept 1 the residuals are 0, 0, 1, 1, and the gradient is the pair found two lessons ago. At slope 1 and intercept 1 the line is too low at three points, with residuals 0, −1, −1, −2, so both entries are negative and both knobs should be raised.
  work:
    - text: Slower now. Keep two pictures in mind - the arrow on the contour map, and the dot product of that arrow with a step.
    - question:
        id: write-loss-gradient
        type: code
        mode: write
        system: s2
        prompt: |
          Write `loss_gradient(theta, X, y)` to return the gradient of $L(\boldsymbol\theta) = \lVert X\boldsymbol\theta - \mathbf{y} \rVert^2$ as an array with one entry for each entry of `theta`. `X` is a matrix with a row for each data point, and `theta` and `y` are one-dimensional arrays. Use no loop.
        starter: |
          import numpy as np

          def loss_gradient(theta, X, y):
              # Replace the next line with your own.
              return np.zeros(theta.size)

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          print(loss_gradient(np.array([2.0, 1.0]), X, y).tolist())
        solution: |
          import numpy as np

          def loss_gradient(theta, X, y):
              return 2 * X.T @ (X @ theta - y)

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          print(loss_gradient(np.array([2.0, 1.0]), X, y).tolist())
        tests: |
          import numpy as _np
          _X = _np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          _y = _np.array([1.0, 3.0, 4.0, 6.0])
          _g = loss_gradient(_np.array([2.0, 1.0]), _X, _y)
          assert _g.shape == (2,), "The gradient has one entry for each entry of theta"
          assert _np.allclose(_g, [10.0, 4.0]), "At theta = (2, 1) the gradient is (10, 4)"
          assert _np.allclose(loss_gradient(_np.array([1.6, 1.1]), _X, _y), [0.0, 0.0], atol=1e-9), "At the best line the gradient is zero"
          assert _np.allclose(loss_gradient(_np.array([0.0, 0.0]), _X, _y), [-58.0, -28.0]), "At theta = 0 the gradient is (-58, -28)"
          _rng = _np.random.default_rng(3)
          _A = _rng.normal(size=(6, 3))
          _b = _rng.normal(size=6)
          _t = _rng.normal(size=3)
          _f = lambda t: ((_A @ t - _b) ** 2).sum()
          _num = _np.zeros(3)
          for _i in range(3):
              _e = _np.zeros(3)
              _e[_i] = 1e-5
              _num[_i] = (_f(_t + _e) - _f(_t - _e)) / 2e-5
          assert _np.allclose(loss_gradient(_t, _A, _b), _num, atol=1e-6), "For a random problem with three knobs the gradient should match central differences"
          assert "for " not in source, "Do it without a loop"
          assert output.strip() == "[10.0, 4.0]", "The program should print [10.0, 4.0]"
        wrong:
          - |
            import numpy as np

            def loss_gradient(theta, X, y):
                return 2 * X.T @ (y - X @ theta)

            print([10.0, 4.0])
          - |
            import numpy as np

            def loss_gradient(theta, X, y):
                return X.T @ (X @ theta - y)

            print([10.0, 4.0])
          - |
            import numpy as np

            def loss_gradient(theta, X, y):
                r = X @ theta - y
                return np.array([2 * r.sum(), 2 * r.sum()])

            print([10.0, 4.0])
          - |
            import numpy as np

            def loss_gradient(theta, X, y):
                r = X @ theta - y
                return np.array([(2 * r * X[:, 0]).sum(), (2 * r).sum()])

            print([10.0, 4.0])
        explanation: |
          `X @ theta - y` is the vector of residuals, with one entry for each data point. Each entry of the gradient is twice the dot product of the residuals with one **column** of `X`, and `X.T @ r` takes all those dot products at once. The shapes confirm it: `X.T` is knobs by points, the residual is points, the result is knobs. A gradient always has the shape of the thing being adjusted. Writing out the two sums by hand works for a line and fails as soon as there is a third knob, which is what the random test with three checks.
    - question:
        id: write-descend
        type: code
        mode: write
        system: s2
        prompt: |
          Write `descend(grad, start, rate, steps)`. `grad` is a function that takes a point, an array, and returns the gradient there, an array. Starting from the array `start`, take `steps` steps of gradient descent with step size `rate`, and return the final point as an array. The array `start` must be unchanged afterwards.
        starter: |
          import numpy as np

          def descend(grad, start, rate, steps):
              # Replace the next line with your own.
              return start

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          end = descend(lambda t: 2 * X.T @ (X @ t - y), np.array([2.0, 1.0]), 0.05, 300)
          print([round(float(v), 4) for v in end])
        solution: |
          import numpy as np

          def descend(grad, start, rate, steps):
              p = start.copy()
              for k in range(steps):
                  p = p - rate * grad(p)
              return p

          X = np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          end = descend(lambda t: 2 * X.T @ (X @ t - y), np.array([2.0, 1.0]), 0.05, 300)
          print([round(float(v), 4) for v in end])
        tests: |
          import numpy as _np
          _s = _np.array([8.0, -4.0])
          _e = descend(lambda v: 2 * v, _s, 0.25, 3)
          assert _np.allclose(_e, [1.0, -0.5]), "On the squared length with rate 0.25 each step halves the point, so three steps from (8, -4) reach (1, -0.5)"
          assert _s.tolist() == [8.0, -4.0], "The starting array must not be changed"
          assert _np.allclose(descend(lambda v: 2 * v, _s, 0.25, 0), [8.0, -4.0]), "With no steps the result is the start"
          _e = descend(lambda v: _np.array([2 * v[0], 8 * v[1]]), _np.array([1.0, 1.0]), 0.25, 3)
          assert _np.allclose(_e, [0.125, -1.0]), "On x squared plus 4 y squared with rate 0.25, three steps from (1, 1) reach (0.125, -1)"
          _X = _np.array([[0.0, 1.0], [1.0, 1.0], [2.0, 1.0], [3.0, 1.0]])
          _y = _np.array([1.0, 3.0, 4.0, 6.0])
          _e = descend(lambda t: 2 * _X.T @ (_X @ t - _y), _np.array([2.0, 1.0]), 0.05, 300)
          assert _np.allclose(_e, [1.6, 1.1], atol=1e-6), "On the puzzle's loss with rate 0.05, 300 steps reach the best line"
          assert output.strip() == "[1.6, 1.1]", "The program should print [1.6, 1.1]"
        wrong:
          - |
            import numpy as np

            def descend(grad, start, rate, steps):
                p = start.copy()
                for k in range(steps):
                    p = p + rate * grad(p)
                return p

            print([1.6, 1.1])
          - |
            import numpy as np

            def descend(grad, start, rate, steps):
                p = start
                for k in range(steps):
                    p -= rate * grad(p)
                return p

            print([1.6, 1.1])
          - |
            import numpy as np

            def descend(grad, start, rate, steps):
                g = grad(start)
                p = start.copy()
                for k in range(steps):
                    p = p - rate * g
                return p

            print([1.6, 1.1])
          - |
            import numpy as np

            def descend(grad, start, rate, steps):
                p = start.copy()
                for k in range(steps):
                    p = p - grad(p)
                return p

            print([1.6, 1.1])
        explanation: |
          The loop has one line: evaluate the gradient **at the current point** and move against it. Evaluating it once at the start and reusing it walks in a straight line for ever, straight through the valley and up the other side. The gradient must be recomputed at each new point, since the whole method rests on its changing as you move. `p -= ...` on the caller's own array changes it in place, so the copy at the start matters. That four-line loop, with the gradient supplied by a program that differentiates the model automatically, is the training loop of machine learning.
    - question:
        id: fix-steepest
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `steepest_step(g, length)` should return the step of the given length that **lowers** the function fastest, where `g` is the gradient at the current point, an array that is not zero. For the gradient $(3, 4)$ and length 0.1 it should give $(-0.06, -0.08)$. It gives a step that is far too long. Fix it.
        starter: |
          import numpy as np

          def steepest_step(g, length):
              return -length * g

          print([round(float(v), 4) for v in steepest_step(np.array([3.0, 4.0]), 0.1)])
        solution: |
          import numpy as np

          def steepest_step(g, length):
              return -length * g / np.linalg.norm(g)

          print([round(float(v), 4) for v in steepest_step(np.array([3.0, 4.0]), 0.1)])
        tests: |
          import numpy as _np
          _s = steepest_step(_np.array([3.0, 4.0]), 0.1)
          assert _np.allclose(_s, [-0.06, -0.08]), "For the gradient (3, 4) and length 0.1 the step is (-0.06, -0.08)"
          assert abs(_np.linalg.norm(_s) - 0.1) < 1e-12, "The step must have the length asked for"
          _g = _np.array([10.0, 4.0])
          _s = steepest_step(_g, 0.01)
          assert abs(_np.linalg.norm(_s) - 0.01) < 1e-12, "The step must have the length asked for"
          assert abs(_g @ _s + 0.01 * _np.linalg.norm(_g)) < 1e-12, "The change predicted by the gradient should be minus its length times the length of the step"
          _s = steepest_step(_np.array([0.0, -2.0, 0.0]), 3.0)
          assert _np.allclose(_s, [0.0, 3.0, 0.0]), "For the gradient (0, -2, 0) and length 3 the step is (0, 3, 0)"
          assert output.strip() == "[-0.06, -0.08]", "The program should print [-0.06, -0.08]"
        wrong:
          - |
            import numpy as np

            def steepest_step(g, length):
                return -length * g

            print([-0.06, -0.08])
          - |
            import numpy as np

            def steepest_step(g, length):
                return length * g / np.linalg.norm(g)

            print([-0.06, -0.08])
          - |
            import numpy as np

            def steepest_step(g, length):
                return -length * g / g.sum()

            print([-0.06, -0.08])
          - |
            import numpy as np

            def steepest_step(g, length):
                return -length * g / (g ** 2).sum()

            print([-0.06, -0.08])
        explanation: |
          The gradient carries two pieces of information, a direction and a length, and this question wants only the direction. Dividing by the norm leaves a unit vector, and scaling that by the length asked for gives a step of exactly that length. `-length * g` is the step of gradient descent, whose length is proportional to the steepness, and that is a different thing: right for descending, wrong when the length of the step has been fixed in advance. The puzzle's answer is this function applied to $(10, 4)$ with length 0.01, and the loss falls by about $0.01 \times \sqrt{116} \approx 0.108$ to first order.
    - question:
        id: work-puzzle
        type: numeric
        system: s2
        prompt: |
          In the puzzle, the gradient at the starting line is $(10, 4)$. On the compass of the starter, where 0° is the direction of increasing $w$ and 90° of increasing $b$, at what angle is the direction of steepest descent? Give it in degrees to the nearest whole number, between 0 and 360.
        answer: "202"
        tolerance: "1"
        unit: "°"
        explanation: |
          The gradient points at the angle whose tangent is $\tfrac{4}{10}$, about 21.8°. Steepest descent is the opposite direction, 180° further round: about 201.8°. That lies between the two best trials of the starter, 180° and 225°, and nearer to 180°, as the numbers suggested. The drop along it for a step of 0.01 is 0.106, against 0.0986 for the best of the eight.
    - question:
        id: work-rate
        type: choice
        system: s2
        prompt: |
          Gradient descent is run on $f(x, y) = x^2 + 25y^2$ from the point $(1, 1)$. Which step sizes make it converge to the minimum?
        options:
          - 'Any positive step size, since the function is a bowl.'
          - 'Step sizes below $\tfrac{1}{25} = 0.04$. A step multiplies $x$ by $1 - 2\eta$ and $y$ by $1 - 50\eta$, and the second factor is between $-1$ and 1 only when $\eta < 0.04$. At such a step size $x$ is multiplied by at least 0.92, so the shallow direction converges slowly.'
          - 'Step sizes below 1, since $1 - 2\eta$ must be more than $-1$.'
          - 'Only the step size 0.5, which sends $x$ to 0 in one step.'
        answer: 1
        explanation: |
          The gradient is $(2x, 50y)$, so the two coordinates evolve separately, each multiplied by its own factor at every step. Convergence needs both factors to have size below 1. The steep direction, $y$, gives the binding condition. Then the gentle direction is stuck with a step far smaller than it could bear. With $\eta = 0.039$, $y$ is multiplied by $-0.95$ and $x$ by $0.922$: about 85 steps to reduce $x$ a thousand-fold. The ratio of the steepest curvature to the shallowest, here 25, measures how badly matched the two demands are. The cluster on optimisation calls it the condition number, the same idea you met for matrices.
    - question:
        id: work-normal
        type: choice
        system: s2
        prompt: |
          The surface $x^2 + y^2 + z^2 = 14$ is a sphere, a level set of $f(x, y, z) = x^2 + y^2 + z^2$. What is the tangent plane to it at the point $(1, 2, 3)$?
        options:
          - '$x + 2y + 3z = 14$, since the gradient $(2, 4, 6)$ is normal to the level set, and the plane through $(1, 2, 3)$ with that normal is $2(x - 1) + 4(y - 2) + 6(z - 3) = 0$.'
          - '$x + y + z = 6$.'
          - '$2x + 4y + 6z = 14$.'
          - 'It cannot be found without solving for $z$ first.'
        answer: 0
        explanation: |
          The gradient of $f$ at the point is $(2x, 2y, 2z) = (2, 4, 6)$. Every direction tangent to the level surface has zero dot product with it, so the tangent plane is the set of $\mathbf{x}$ with $\nabla f \cdot (\mathbf{x} - \mathbf{a}) = 0$. Expanding gives $2x + 4y + 6z = 28$, which is $x + 2y + 3z = 14$. The normal to a sphere at a point is the radius to that point, and the gradient $(2, 4, 6)$ is indeed twice the position vector. No formula for $z$ in terms of $x$ and $y$ was needed.
  connections:
    - text: |
        From the line $w = 2$, $b = 1$, the best of eight compass directions lowered the loss by 0.0986 for a step of 0.01. The best of all directions is against the vector $(10, 4)$, at about 202°, and lowers it by 0.106.

        The **gradient** $\nabla f$ is the vector of partial derivatives. Because a differentiable function changes by about $\nabla f \cdot \mathbf{h}$ over a small step, and a dot product is the product of the lengths and the cosine of the angle, three things follow. The gradient points in the direction of **steepest increase**. Its length is the rate of increase in that direction. And it is **at right angles to the level set** through the point.

        The gradient of $\mathbf{a} \cdot \mathbf{x}$ is $\mathbf{a}$. Of $\mathbf{x}^{\mathsf T}A\mathbf{x}$, $(A + A^{\mathsf T})\mathbf{x}$. Of the least-squares loss $\lVert X\boldsymbol\theta - \mathbf{y} \rVert^2$, $2X^{\mathsf T}(X\boldsymbol\theta - \mathbf{y})$: the residuals, sent back through the transpose.

        **Gradient descent** repeats $\mathbf{x} \leftarrow \mathbf{x} - \eta\,\nabla f(\mathbf{x})$. A small enough step always descends. The steepest direction of the bowl limits the step size, and the shallowest direction then converges slowly. The full study of that is [[m19.gradient-descent]].

        The argument today used the linear approximation to say how $f$ changes along the gradient, against it, and across it. Those are three directions. What about any other? The rate of change of $f$ along an arbitrary direction, its relation to the gradient when the function is differentiable, and what is left of it when the function is not, is the next lesson, [[m12.directional-derivative]].
