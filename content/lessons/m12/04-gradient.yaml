        explanation: Its entries are the two partial derivatives, in order.
    - question:
        id: drill-grad-at
        type: choice
        system: s1
        prompt: |
          $f(x, y) = x^2 + y^2$. What is $\nabla f(3, -1)$?
        options: ['$(6, -2)$', '$(3, -1)$', '$(9, 1)$', '$10$']
        answer: 0
        explanation: The gradient is twice the position vector.
    - question:
        id: drill-linear
        type: choice
        system: s1
        prompt: |
          $f(\mathbf{x}) = \mathbf{a} \cdot \mathbf{x}$. What is $\nabla f$?
        options: ['$\mathbf{a}$', '$\mathbf{x}$', '$2\mathbf{a}$', '$\mathbf{0}$']
        answer: 0
