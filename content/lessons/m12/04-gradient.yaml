concept: m12.gradient
minutes: 90
claim: You can assemble the partial derivatives of a function into its gradient vector, explain from the dot product why the gradient points in the direction of steepest increase with length equal to that steepest rate and why it is at right angles to the level sets, compute the gradients of linear functions, squared lengths, quadratic forms and least-squares losses, and minimise a function by stepping against its gradient with a step size that converges.
recalls: [m12.total-derivative-as-best-linear-approximation]
uses: [m12.partial-derivatives, m12.functions-of-several-variables, m4.dot-product, m4.angle-and-cosine-similarity, m4.norms-and-distance, m4.vector-addition-and-scaling, m4.lines-planes-and-hyperplanes, m5.transpose, m5.matrix-vector-product, m5.matrices-as-linear-maps, m10.maxima-and-minima, m10.chain-rule, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e5.reshaping-views-and-copies, e5.vectorisation, e5.axis-operations-and-reductions, e5.numerical-error-analysis-in-practice, m2.trigonometric-functions-on-the-unit-circle, m2.summation-and-product-notation, e0.functions, e0.loops]
leads: [m12.directional-derivative, m12.multivariable-chain-rule, m12.hessian-and-symmetry-of-mixed-partials, m19.gradient-descent, e6.reverse-mode-on-scalars]
starter: |
  # Scratch space. From the line w = 2, b = 1, take a step of length 0.01
  # in each of eight compass directions and see what the loss does.
  import math
  import numpy as np

  xs = np.array([0.0, 1.0, 2.0, 3.0])
  ys = np.array([1.0, 3.0, 4.0, 6.0])

  def loss(w, b):
      return ((w * xs + b - ys) ** 2).sum()

  for degrees in range(0, 360, 45):
      angle = math.radians(degrees)
      dw, db = 0.01 * math.cos(angle), 0.01 * math.sin(angle)
      print(degrees, round(loss(2.0 + dw, 1.0 + db) - loss(2.0, 1.0), 4))
parts:
  recall:
    - text: |
        [[m12.total-derivative-as-best-linear-approximation]] showed that near a point a differentiable function changes by very nearly $\dfrac{\partial f}{\partial x_1} h_1 + \dots + \dfrac{\partial f}{\partial x_n} h_n$ over a step $\mathbf{h}$, and ended by noticing that this is a dot product. Today that dot product is read geometrically. Three quick pulls first.
  puzzle:
    - text: |
        You are at the line $w = 2$, $b = 1$ once more, where the loss is 2 and its partial derivatives are 10 and 4. You may take one small step, of length 0.01, in any direction you like in the plane of $(w, b)$. You want the loss to fall as far as possible.

        The starter tries eight directions, at 0°, 45°, 90° and so on round the compass, where 0° means increasing $w$ alone and 90° means increasing $b$ alone.

        Run it. At 0° the loss rises by 0.1014. At 180° it falls by 0.0986. At 270° it falls by 0.0396. At 225°, down and to the left together, it falls by 0.0975. **The best of the eight is 180°, and 225° is a close second.** The truly best direction, then, is probably somewhere between them.

        Eight directions is a crude search. In a plane you could try 360, or 36 000. But a network's loss lives in a space of a million dimensions, where there is no compass to walk round, and the number of directions worth trying is beyond counting.

        **Among all the directions there are, which one makes the loss fall fastest? How steeply does it fall that way? And can the answer be had exactly, from the two numbers 10 and 4, without trying a single direction?**
  intuition:
    - text: |
        The linear approximation answers at once. For a small step $\mathbf{h} = (dw, db)$,

        $$\text{change in } L \approx 10\,dw + 4\,db.$$

        Put the two partial derivatives into a vector, $\mathbf{g} = (10, 4)$. The right-hand side is then $\mathbf{g} \cdot \mathbf{h}$, a dot product. And you know what a dot product is, from the lessons on vectors:

        $$\mathbf{g} \cdot \mathbf{h} = \lVert \mathbf{g} \rVert\,\lVert \mathbf{h} \rVert \cos\theta,$$

        where $\theta$ is the angle between the two.

        The length of the step is fixed at 0.01. The length of $\mathbf{g}$ is whatever it is. **The only thing you control is the angle.** And the cosine of an angle runs from 1, when the vectors point the same way, through 0, when they are at right angles, to $-1$, when they point in opposite ways.

        So the whole question is settled in three lines.

        - To make the function **rise** fastest, step along $\mathbf{g}$.
        - To make it **fall** fastest, step exactly against $\mathbf{g}$.
        - To keep it **level**, step at right angles to $\mathbf{g}$.

        The vector of partial derivatives is called the **gradient**. **It points in the direction in which the function increases fastest.** Nobody designed it to. It was built by measuring slopes along the axes, one input at a time, which looks like a bookkeeping device. That the result points uphill, in whatever direction uphill happens to be, is a consequence of the function being locally linear.

        In the puzzle, $\mathbf{g} = (10, 4)$ points right and a little up. The best direction to step is the opposite one, $(-10, -4)$, left and a little down, at about 202° on the compass. That is between 180° and 225°, as the eight trials suggested, and nearer to 180°.

        **How steep?** Stepping along the gradient, the cosine is 1 and the change is $\lVert \mathbf{g} \rVert$ times the length of the step. So **the length of the gradient is the steepest slope**: the rate of climb per unit of distance in the best direction. Here $\lVert \mathbf{g} \rVert = \sqrt{116} \approx 10.77$. A step of 0.01 straight downhill lowers the loss by about 0.1077 according to the linear approximation, and by 0.106 in truth, since the bowl curves up a little even over so short a step. That beats all eight of the compass directions.

        The figure shows the gradient at a point of the bowl. Move the point about.
    - figure: contours
      props: { surface: bowl, x: 2, y: 1, show: gradient }
    - text: |
        Notice where the arrow points relative to the contours. **It always crosses them at right angles.** That is the third line of the list above, read backwards. A contour is a path along which the function does not change. Stepping along it must therefore have zero dot product with the gradient. So the contour runs at right angles to the gradient, and the gradient at right angles to the contour.

        A walker's map shows this. Water runs straight downhill, and streams on a map cross the contours squarely. Where the contours are crowded the slope is steep, and there the gradient is long. Where they are far apart it is short. At the top of a hill and at the bottom of a hollow the ground is level in every direction, and the gradient is the zero vector: it has no direction to point in.

        **Following it down.** If the gradient says which way is up, a method for finding a minimum suggests itself. Take a small step against the gradient. You are now at a new point, a little lower. The gradient there is different, so work it out again. Step against that one. Repeat. This is **gradient descent**, and it is how almost every model in machine learning is trained. You met it for one variable in the lesson on maxima and minima. In several variables the rule is the same with the derivative replaced by the gradient.
  derivation:
    - text: |
        **Definition.** The **gradient** of $f : \mathbb{R}^n \to \mathbb{R}$ at $\mathbf{a}$ is the vector of its partial derivatives there:

        $$\nabla f(\mathbf{a}) = \left( \frac{\partial f}{\partial x_1}(\mathbf{a}),\ \dots,\ \frac{\partial f}{\partial x_n}(\mathbf{a}) \right).$$

        The symbol $\nabla$ is read "del" or "nabla", and $\nabla f$ as "grad $f$". The gradient lives in the space of **inputs**: it has one entry for each input, and it can be drawn as an arrow on the contour map, starting at the point $\mathbf{a}$.

        When $f$ is differentiable, the linear approximation of the last lesson reads

        $$f(\mathbf{a} + \mathbf{h}) \approx f(\mathbf{a}) + \nabla f(\mathbf{a}) \cdot \mathbf{h}.$$

        The total derivative was a matrix of one row. The gradient is that row stood up as a vector, and applying the row to $\mathbf{h}$ is taking the dot product with it.

        **Steepest ascent.** Let $\mathbf{u}$ be a unit vector and take the step $\mathbf{h} = t\mathbf{u}$. The change in $f$ per unit of distance is about $\nabla f \cdot \mathbf{u} = \lVert \nabla f \rVert \cos\theta$. Over all unit vectors this is greatest when $\theta = 0$, that is, when $\mathbf{u} = \nabla f / \lVert \nabla f \rVert$, and the greatest value is $\lVert \nabla f \rVert$. It is least, $-\lVert \nabla f \rVert$, when $\mathbf{u}$ points the opposite way.

        **Level sets.** If $\mathbf{u}$ is a direction along the level set through $\mathbf{a}$, the function does not change to first order in that direction, so $\nabla f \cdot \mathbf{u} = 0$. The gradient is **normal** to the level set. For $f(x, y) = x^2 + y^2$ the gradient is $(2x, 2y)$, which points straight out from the origin, along the radius, and the level curves are circles, which a radius meets at right angles.

        This gives the tangent line to a level curve, or the tangent plane to a level surface, for nothing: it is the set of points $\mathbf{x}$ with $\nabla f(\mathbf{a}) \cdot (\mathbf{x} - \mathbf{a}) = 0$. That is the equation of a hyperplane with normal $\nabla f(\mathbf{a})$, in the form you met in the lesson on hyperplanes.

        **Gradients to know.** Each is found by taking the partial derivative with respect to one coordinate and recognising the pattern.

        | $f(\mathbf{x})$ | $\nabla f(\mathbf{x})$ |
        |---|---|
        | $\mathbf{a} \cdot \mathbf{x}$ | $\mathbf{a}$ |
        | $\lVert \mathbf{x} \rVert^2 = \mathbf{x} \cdot \mathbf{x}$ | $2\mathbf{x}$ |
        | $\mathbf{x}^{\mathsf T} A\,\mathbf{x}$ | $(A + A^{\mathsf T})\,\mathbf{x}$, which is $2A\mathbf{x}$ if $A$ is symmetric |
        | $\lVert A\mathbf{x} - \mathbf{b} \rVert^2$ | $2A^{\mathsf T}(A\mathbf{x} - \mathbf{b})$ |

        They are the many-variable forms of "the derivative of $ax$ is $a$" and "the derivative of $ax^2$ is $2ax$". The third deserves its derivation. Written out, $\mathbf{x}^{\mathsf T} A \mathbf{x} = \sum_i \sum_j a_{ij} x_i x_j$. The variable $x_k$ appears in the terms with $i = k$ and in the terms with $j = k$, so

        $$\frac{\partial}{\partial x_k} \sum_{i, j} a_{ij} x_i x_j = \sum_j a_{kj} x_j + \sum_i a_{ik} x_i = (A\mathbf{x})_k + (A^{\mathsf T}\mathbf{x})_k.$$

        **The loss as the fourth row.** Stack the data of the puzzle into a matrix with a row for each point, holding $x_i$ and a 1, and put the two knobs in a vector:

        $$X = \begin{pmatrix} 0 & 1 \\ 1 & 1 \\ 2 & 1 \\ 3 & 1 \end{pmatrix}, \qquad \boldsymbol{\theta} = \begin{pmatrix} w \\ b \end{pmatrix}, \qquad \mathbf{y} = \begin{pmatrix} 1 \\ 3 \\ 4 \\ 6 \end{pmatrix}.$$

        Then $X\boldsymbol{\theta}$ is the vector of predictions, $\mathbf{r} = X\boldsymbol{\theta} - \mathbf{y}$ is the vector of residuals, and $L = \lVert \mathbf{r} \rVert^2$. Two lessons ago you found $\partial L / \partial w = \sum 2 r_i x_i$ and $\partial L / \partial b = \sum 2 r_i$. Those are the dot products of $2\mathbf{r}$ with the two **columns** of $X$, and taking dot products with the columns of a matrix is multiplying by its transpose:

        $$\nabla L(\boldsymbol{\theta}) = 2X^{\mathsf T}(X\boldsymbol{\theta} - \mathbf{y}).$$

        At $\boldsymbol{\theta} = (2, 1)$ the residuals are $(0, 0, 1, 1)$ and $2X^{\mathsf T}\mathbf{r} = (10, 4)$. In code it is one line, `2 * X.T @ (X @ theta - y)`, whether there are two knobs or two thousand.
    - question:
        id: derivation-angle
        type: choice
        system: s2
        prompt: |
          At a point, $\nabla f = (3, 4)$. Among all steps of length 0.1 from that point, which changes $f$ the most, and by about how much?
        options:
          - 'The step $(0.1, 0)$, by about 0.3.'
          - 'The step $(0.06, 0.08)$, which has length 0.1 and points along the gradient. The change is about the length of the gradient times the length of the step, $5 \times 0.1 = 0.5$.'
          - 'The step $(0.1, 0.1)$, by about 0.7.'
          - 'The step $(0, 0.1)$, by about 0.4.'
        answer: 1
        explanation: |
          The change is $\nabla f \cdot \mathbf{h} = \lVert \nabla f \rVert \lVert \mathbf{h} \rVert \cos\theta$, and with both lengths fixed it is greatest when the cosine is 1. The gradient has length 5, so the unit vector along it is $(0.6, 0.8)$ and the step is a tenth of that. Stepping along the axis with the larger partial derivative gets only 0.4. The step $(0.1, 0.1)$ would do better still, but it is not allowed: its length is about 0.141, not 0.1.
    - text: |
        **Gradient descent.** Choose a starting point $\mathbf{x}_0$ and a positive number $\eta$, the **step size** or **learning rate**. Repeat

        $$\mathbf{x}_{k+1} = \mathbf{x}_k - \eta\,\nabla f(\mathbf{x}_k).$$

        By the linear approximation, one step changes $f$ by about $\nabla f \cdot (-\eta \nabla f) = -\eta \lVert \nabla f \rVert^2$, which is negative whenever the gradient is not zero. So a small enough step always goes down. The step is not of fixed length: it is proportional to the gradient, long on steep ground and short on gentle ground, and it shrinks to nothing as a stationary point is approached.

        "Small enough" is the whole difficulty. Take $f(x, y) = x^2 + 4y^2$, a bowl four times as steep along $y$ as along $x$. Its gradient is $(2x, 8y)$, so one step does

        $$x \leftarrow (1 - 2\eta)\,x, \qquad y \leftarrow (1 - 8\eta)\,y.$$

        Each coordinate is multiplied by its own factor at every step, as in the lesson on maxima and minima, where the one factor was $1 - 2\eta$. For both to shrink, both factors must lie between $-1$ and 1, and the second is the stricter: it needs $\eta < \tfrac14$. With $\eta = 0.25$ exactly, $y$ is multiplied by $-1$ and jumps from side to side of the valley for ever. With $\eta = 0.3$ it grows by 1.4 times at each step and the method diverges, even though the other coordinate is converging happily.

        **The steepest direction sets the largest safe step, and the shallowest direction then crawls.** With $\eta = 0.2$, $y$ is multiplied by $-0.6$ and $x$ by $0.6$. But for a bowl a hundred times steeper one way than the other, the safe step makes the shallow coordinate shrink by only about 2% a step. A long narrow valley is the hard case for gradient descent, and a large part of the later cluster on optimisation is about what to do there.

        The puzzle's loss is such a valley, moderately so. With $\eta = 0.05$ it converges to $(1.6, 1.1)$ in about a hundred steps. With $\eta = 0.07$ it diverges.

        **What the gradient does not say.** It is local. It describes the function at one point, to first order. It promises a descent only for a small step. And a zero gradient marks a stationary point, which may be a minimum, a maximum or a saddle. Gradient descent stops, or nearly stops, at all three.
    - question:
        id: order-descent
        type: order
        system: s2
        prompt: Put in order one full step of gradient descent on $f(x, y) = x^2 + 4y^2$ from the point $(1, 1)$ with step size 0.1.
        steps:
          - 'Find the gradient as a function: $\nabla f = (2x, 8y)$.'
          - 'Evaluate it at the current point: $\nabla f(1, 1) = (2, 8)$.'
          - 'Scale it by the step size: $0.1 \times (2, 8) = (0.2, 0.8)$.'
          - 'Subtract from the current point: $(1, 1) - (0.2, 0.8) = (0.8, 0.2)$.'
          - 'Check: $f$ has fallen from 5 to $0.64 + 0.16 = 0.8$.'
        explanation: The gradient is evaluated where you are, scaled, and subtracted. The step is longer along y, where the bowl is steeper. Notice that the step does not point at the minimum, the origin, which from (1, 1) is in the direction (−1, −1). Steepest descent goes square to the contour through the current point, and for an elongated bowl that is not the way to the bottom.
  formal:
    - text: |
        **Gradient.** For $f : D \to \mathbb{R}$ differentiable at $\mathbf{a}$, $\nabla f(\mathbf{a}) = \bigl(\partial_1 f(\mathbf{a}), \dots, \partial_n f(\mathbf{a})\bigr) \in \mathbb{R}^n$, and $Df(\mathbf{a})\,\mathbf{h} = \nabla f(\mathbf{a}) \cdot \mathbf{h}$.

        **Steepest ascent.** If $\nabla f(\mathbf{a}) \ne \mathbf{0}$, then over unit vectors $\mathbf{u}$ the quantity $\nabla f(\mathbf{a}) \cdot \mathbf{u}$ has greatest value $\lVert \nabla f(\mathbf{a}) \rVert$, attained only at $\mathbf{u} = \nabla f(\mathbf{a}) / \lVert \nabla f(\mathbf{a}) \rVert$.

        **Level sets.** $\nabla f(\mathbf{a})$ is orthogonal to every direction tangent to the level set $\{f = f(\mathbf{a})\}$ at $\mathbf{a}$. The tangent hyperplane to the level set is $\nabla f(\mathbf{a}) \cdot (\mathbf{x} - \mathbf{a}) = 0$.

        **Rules.** $\nabla(f + g) = \nabla f + \nabla g$, $\nabla(cf) = c\nabla f$, $\nabla(fg) = f\nabla g + g\nabla f$.

        **Standard gradients.** $\nabla(\mathbf{a} \cdot \mathbf{x}) = \mathbf{a}$. $\nabla(\mathbf{x}^{\mathsf T}A\mathbf{x}) = (A + A^{\mathsf T})\mathbf{x}$. $\nabla \lVert A\mathbf{x} - \mathbf{b} \rVert^2 = 2A^{\mathsf T}(A\mathbf{x} - \mathbf{b})$.

        **Gradient descent.** $\mathbf{x}_{k+1} = \mathbf{x}_k - \eta\,\nabla f(\mathbf{x}_k)$, with $\eta > 0$.
