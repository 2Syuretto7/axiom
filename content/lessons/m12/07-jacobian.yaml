            print([[1.0, 0.0], [0.0, 2.0]])
          - |
            import numpy as np

            def jacobian(f, a):
                h = 1e-5
                columns = []
                for j in range(a.size):
                    columns.append((f(a + h) - f(a - h)) / (2 * h))
                return np.stack(columns, axis=1)

            print([[1.0, 0.0], [0.0, 2.0]])
        explanation: |
          Stepping input $j$ and differencing the **whole output vector** gives every entry of column $j$ at once, so the loop is over inputs, and the results are stacked side by side as columns, along axis 1. Stacking them along axis 0 makes them rows, which is the transpose. For a square matrix that mistake keeps the right shape and is easy to miss, which is why the tests use a function from three inputs to four outputs. The cost is two evaluations for each input and does not depend on the number of outputs.
    - question:
        id: write-newton
        type: code
        mode: write
        system: s2
        prompt: |
          Write `newton(F, J, x, steps)`. `F` takes a point (an array of length $n$) and returns an array of length $n$, and `J` takes a point and returns the $n$ by $n$ Jacobian of `F` there. Starting from the array `x`, take `steps` steps of Newton's method for solving $\mathbf{F}(\mathbf{x}) = \mathbf{0}$ and return the final point. Do not compute an inverse matrix, and leave `x` unchanged.
        starter: |
          import numpy as np

          def newton(F, J, x, steps):
              # Replace the next line with your own.
              return x

          F = lambda p: np.array([p[0] ** 2 + p[1] ** 2 - 4, p[0] - p[1]])
          J = lambda p: np.array([[2 * p[0], 2 * p[1]], [1.0, -1.0]])
          print([round(float(v), 6) for v in newton(F, J, np.array([2.0, 1.0]), 5)])
        solution: |
          import numpy as np

          def newton(F, J, x, steps):
              p = x.copy()
              for k in range(steps):
                  p = p + np.linalg.solve(J(p), -F(p))
              return p

          F = lambda p: np.array([p[0] ** 2 + p[1] ** 2 - 4, p[0] - p[1]])
          J = lambda p: np.array([[2 * p[0], 2 * p[1]], [1.0, -1.0]])
          print([round(float(v), 6) for v in newton(F, J, np.array([2.0, 1.0]), 5)])
        tests: |
          import numpy as _np
          _F = lambda p: _np.array([p[0] ** 2 + p[1] ** 2 - 4, p[0] - p[1]])
          _J = lambda p: _np.array([[2 * p[0], 2 * p[1]], [1.0, -1.0]])
          _s = _np.array([2.0, 1.0])
          assert _np.allclose(newton(_F, _J, _s, 1), [1.5, 1.5]), "One step from (2, 1) lands on (1.5, 1.5)"
          assert _s.tolist() == [2.0, 1.0], "The starting array must not be changed"
          assert _np.allclose(newton(_F, _J, _s, 2), [17.0 / 12.0, 17.0 / 12.0]), "Two steps land on (17/12, 17/12)"
          assert float(abs(newton(_F, _J, _s, 6) - _np.sqrt(2.0)).max()) < 1e-12, "Six steps reach the square root of 2 in both coordinates, to twelve places"
          assert _np.allclose(newton(_F, _J, _s, 0), [2.0, 1.0]), "With no steps the result is the start"
          _A = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 4.0]])
          _b = _np.array([1.0, 2.0, 3.0])
          _r = newton(lambda p: _A @ p - _b, lambda p: _A, _np.zeros(3), 1)
          assert _np.allclose(_A @ _r, _b), "For a linear system one step gives the exact solution"
          assert "inv" not in source, "Solve the linear system and do not form an inverse"
          assert output.strip() == "[1.414214, 1.414214]", "The program should print [1.414214, 1.414214]"
        wrong:
          - |
            import numpy as np

            def newton(F, J, x, steps):
                p = x.copy()
                for k in range(steps):
                    p = p + np.linalg.solve(J(p), F(p))
                return p

            print([1.414214, 1.414214])
          - |
            import numpy as np

            def newton(F, J, x, steps):
                p = x.copy()
                J0 = J(p)
                for k in range(steps):
                    p = p + np.linalg.solve(J0, -F(p))
                return p

            print([1.414214, 1.414214])
          - |
            import numpy as np

            def newton(F, J, x, steps):
                p = x.copy()
                for k in range(steps):
                    p = p - J(p).T @ F(p)
                return p

            print([1.414214, 1.414214])
        explanation: |
          At each guess, the function is replaced by its linear approximation, $\mathbf{F}(\mathbf{p}) + J\mathbf{d}$, and the step is the $\mathbf{d}$ that makes that zero: the solution of $J\mathbf{d} = -\mathbf{F}$. `np.linalg.solve` finds it by elimination, which is both cheaper and more accurate than forming the inverse, as you saw in the lesson on linear algebra routines. The Jacobian must be evaluated afresh at every guess. Keeping the first one still converges here, and far more slowly: after six steps it is right to about eight places, where the true method was right to sixteen after five. For a function that is already linear, the approximation is exact and one step solves the system.
    - question:
        id: fix-layer
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A layer computes $\mathbf{y} = \tanh(W\mathbf{x})$. `layer_jacobian(W, x)` should return its Jacobian with respect to $\mathbf{x}$: one row for each output and one column for each input. It should agree with central differences, and the program prints `False`. Fix `layer_jacobian`.
        starter: |
          import numpy as np

          def layer_jacobian(W, x):
              y = np.tanh(W @ x)
              return W * (1 - y * y)

          W = np.array([[1.0, 2.0, 0.0], [0.0, -1.0, 1.0]])
          x = np.array([0.5, -0.2, 0.3])
          h = 1e-5
          numeric = np.stack([(np.tanh(W @ (x + h * e)) - np.tanh(W @ (x - h * e))) / (2 * h) for e in np.eye(3)], axis=1)
          print(np.allclose(layer_jacobian(W, x), numeric, atol=1e-8))
        solution: |
          import numpy as np

          def layer_jacobian(W, x):
              y = np.tanh(W @ x)
              return (1 - y * y)[:, np.newaxis] * W

          W = np.array([[1.0, 2.0, 0.0], [0.0, -1.0, 1.0]])
          x = np.array([0.5, -0.2, 0.3])
          h = 1e-5
          numeric = np.stack([(np.tanh(W @ (x + h * e)) - np.tanh(W @ (x - h * e))) / (2 * h) for e in np.eye(3)], axis=1)
          print(np.allclose(layer_jacobian(W, x), numeric, atol=1e-8))
        tests: |
          import numpy as _np
          def _num(W, x):
              h = 1e-5
              return _np.stack([(_np.tanh(W @ (x + h * e)) - _np.tanh(W @ (x - h * e))) / (2 * h) for e in _np.eye(x.size)], axis=1)
          _W = _np.array([[1.0, 2.0, 0.0], [0.0, -1.0, 1.0]])
          _x = _np.array([0.5, -0.2, 0.3])
          _J = layer_jacobian(_W, _x)
          assert _J.shape == (2, 3), "Two outputs and three inputs give a 2 by 3 matrix"
          assert _np.allclose(_J, _num(_W, _x), atol=1e-8), "It should agree with central differences"
          _rng = _np.random.default_rng(5)
          _W2 = _rng.normal(size=(3, 3))
          _x2 = _rng.normal(size=3)
          assert _np.allclose(layer_jacobian(_W2, _x2), _num(_W2, _x2), atol=1e-8), "It should agree with central differences for a square layer too"
          _W3 = _rng.normal(size=(4, 2))
          _x3 = _rng.normal(size=2)
          assert _np.allclose(layer_jacobian(_W3, _x3), _num(_W3, _x3), atol=1e-8), "It should agree for a layer with more outputs than inputs"
          assert _np.allclose(layer_jacobian(_W, _np.zeros(3)), _W), "At x = 0 the tanh has slope 1 everywhere and the Jacobian is W"
          assert output.strip() == "True", "The program should print True"
        wrong:
          - |
            import numpy as np

            def layer_jacobian(W, x):
                y = np.tanh(W @ x)
                return W * (1 - y * y)[np.newaxis, :]

            print(True)
          - |
            import numpy as np

            def layer_jacobian(W, x):
                y = np.tanh(W @ x)
                return (1 - y)[:, np.newaxis] * W

            print(True)
          - |
            import numpy as np

            def layer_jacobian(W, x):
                return W

            print(True)
        explanation: |
          The layer is a composition: the linear map $W$, then $\tanh$ on each entry. By the chain rule its Jacobian is the diagonal matrix of $1 - y_i^2$ times $W$. Multiplying by a diagonal matrix **on the left** scales the **rows**: row $i$ of $W$, which produces output $i$, is scaled by the slope of the tanh at output $i$. The slopes are one for each output, so they must be lined up with the rows, as a column of shape `(2, 1)`. `W * (1 - y * y)` tries to line them up with the last axis, the columns: for this 2 by 3 matrix the shapes do not broadcast, and for a square matrix they do and silently scale the wrong way, which is the multiplication by the diagonal matrix on the right. The square test is there for that.
    - question:
        id: work-patch
        type: choice
        system: s2
        prompt: |
          In the puzzle, the same small square of readings gave a patch on the map three times as large at distance 3 as at distance 1. Why?
        options:
          - 'Because errors always grow with the size of the numbers.'
          - 'Near each point the conversion acts as its Jacobian. One column, the response to distance, has length 1. The other, the response to bearing, has length $r$, since a given angle sweeps an arc proportional to the distance. The columns are at right angles, so the patch is close to a rectangle of sides $h$ and $rh$, and its area is $r$ times that of the square: the determinant.'
          - 'Because the conversion is linear and has determinant 3.'
          - 'Because the radar is less accurate at long range.'
        answer: 1
        explanation: |
          The radar's accuracy, in its own readings, was the same at every range: that was given. The patch grows because of what the conversion does with an error in angle. The Jacobian's columns show it directly, and its determinant, $r$, is the factor on area. The conversion is not linear, so there is no single determinant: it has a different linear approximation at every point, and the magnification varies from place to place. This factor $r$ is the same one that will appear in integrals over a disc, three lessons from now.
    - question:
        id: work-chain-shapes
        type: numeric
        system: s2
        prompt: |
          A network is $\mathbf{x} \mapsto \mathbf{f}_3(\mathbf{f}_2(\mathbf{f}_1(\mathbf{x})))$, where $\mathbf{f}_1 : \mathbb{R}^{784} \to \mathbb{R}^{100}$, $\mathbf{f}_2 : \mathbb{R}^{100} \to \mathbb{R}^{10}$ and $\mathbf{f}_3 : \mathbb{R}^{10} \to \mathbb{R}$. How many entries has the Jacobian of the whole network?
        answer: "784"
        explanation: |
          The Jacobians of the three layers have shapes 100 by 784, 10 by 100 and 1 by 10. Their product, in the order $J_3 J_2 J_1$, has shape 1 by 784: one output and 784 inputs. It is the gradient of the single output, laid on its side. The largest matrix in the chain has 78 400 entries, and whether it ever needs to be formed depends on the order in which the product is worked out. Starting from the left, $J_3 J_2$ is a row of 100, and that times $J_1$ is a row of 784: only rows are ever held.
    - question:
        id: work-singular
        type: choice
        system: s2
        prompt: |
          $\mathbf{f}(x, y) = (x^2 - y^2,\ 2xy)$. Its Jacobian is $\begin{pmatrix} 2x & -2y \\ 2y & 2x \end{pmatrix}$. Where is the Jacobian determinant zero, and what does the map do to a small disc of radius $\varepsilon$ around that point?
        options:
          - 'Nowhere. The map scales every small region by the same factor.'
          - 'Only at the origin, since the determinant is $4x^2 + 4y^2$. There the linear approximation is the zero matrix, and the map sends the disc of radius $\varepsilon$ to a disc of radius $\varepsilon^2$: far smaller than any linear map with an inverse would.'
          - 'Along the line $y = x$.'
          - 'Everywhere, since the two rows are the same.'
        answer: 1
        explanation: |
          $\det J = (2x)(2x) - (-2y)(2y) = 4(x^2 + y^2)$, zero only at the origin. Elsewhere small areas are multiplied by $4(x^2 + y^2)$, which grows with the distance from the origin. At the origin every entry of the Jacobian is zero, and the map is purely second order: a point at distance $\varepsilon$ goes to a point at distance $\varepsilon^2$. The map also wraps the plane twice round the origin, sending $(x, y)$ and $(-x, -y)$ to the same place, so it has no inverse near the origin. Away from the origin, where the determinant is not zero, it can be undone locally.
    - question:
        id: work-softmax-direction
        type: choice
        system: s2
        prompt: |
          The Jacobian of softmax is $J = \operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^{\mathsf T}$. What is $J\mathbf{1}$, where $\mathbf{1}$ is the vector of all ones, and what does it mean?
        options:
          - '$\mathbf{p}$, meaning that adding 1 to every score adds the probabilities to themselves.'
          - '$\mathbf{0}$. Row $i$ sums to $p_i - p_i \sum_j p_j = 0$. The step $\mathbf{1}$ adds the same amount to every score, and softmax depends only on the differences between scores, so the output does not change.'
          - '$\mathbf{1}$, meaning that the output moves by as much as the input.'
          - 'It is not defined, since the matrix has no inverse.'
        answer: 1
        explanation: |
          $J\mathbf{1} = \mathbf{p} - \mathbf{p}(\mathbf{p}^{\mathsf T}\mathbf{1}) = \mathbf{p} - \mathbf{p} = \mathbf{0}$, because the probabilities sum to 1. The Jacobian applied to a direction is the rate of change of the output along that direction, and shifting every score equally changes nothing. This is the invariance the log-sum-exp lesson exploited when it subtracted the largest score. It also means the vector of ones is in the null space of $J$, so this Jacobian is never invertible: the scores cannot be recovered from the probabilities, only their differences.
  connections:
    - text: |
        A square of readings in distance and bearing became a patch on the map $r$ times as large. Near each point the conversion acts as a matrix, with one column of length 1 for the response to distance and one of length $r$ for the response to bearing, and the determinant of that matrix is $r$.

        The **Jacobian** of a function from $n$ inputs to $m$ outputs is the $m$ by $n$ matrix of its partial derivatives, outputs down and inputs across. Its rows are the gradients of the outputs. Its columns are the responses to each input. It is the matrix of the best linear approximation: $\mathbf{f}(\mathbf{a} + \mathbf{h}) \approx \mathbf{f}(\mathbf{a}) + J\mathbf{h}$.

        A linear map has itself as Jacobian. An elementwise function has a diagonal one. Softmax has $\operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^{\mathsf T}$. A composition has the **product** of the Jacobians.

        For a square Jacobian, the **determinant** is the local magnification of area or volume, and where it is zero the map cannot be undone. Solving $J\mathbf{d} = -\mathbf{F}$ repeatedly is Newton's method for a system of equations.

        The Jacobian is a first derivative: it records slopes. Slopes found the candidates for a minimum, the stationary points, and could not tell a bowl from a saddle. For that, in one variable, you needed the second derivative. A function of several variables has a first derivative that is itself a function with several outputs, the gradient. Take the Jacobian of **that**, and you have a matrix of second derivatives. It is the next lesson, [[m12.hessian-and-symmetry-of-mixed-partials]].
