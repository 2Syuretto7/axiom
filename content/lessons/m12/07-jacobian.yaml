concept: m12.jacobian
minutes: 90
claim: You can write the Jacobian matrix of a function with several inputs and several outputs, read its rows as gradients of the outputs and its columns as the effect of each input, use it as the matrix of the best linear approximation, compute it numerically one column at a time, multiply Jacobians to differentiate a composition, interpret its determinant as the local factor by which the function scales area, and use it to solve a system of nonlinear equations by Newton's method.
recalls: [m12.multivariable-chain-rule]
uses: [m12.total-derivative-as-best-linear-approximation, m12.gradient, m12.partial-derivatives, m12.directional-derivative, m12.functions-of-several-variables, m5.determinant, m5.matrices-as-linear-maps, m5.matrix-vector-product, m5.matrix-multiplication-as-composition, m5.identity-and-inverse, m5.transpose, m5.elimination-and-linear-systems, m10.taylor-approximation, m10.derivatives-of-exp-log-and-trig, m2.trigonometric-functions-on-the-unit-circle, m2.the-exponential-and-e, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e5.indexing-and-slicing, e5.reshaping-views-and-copies, e5.vectorisation, e5.broadcasting, e5.einsum, e5.axis-operations-and-reductions, e5.numerical-error-analysis-in-practice, e5.log-sum-exp-and-stable-formulations, e0.functions, e0.loops]
leads: [m12.hessian-and-symmetry-of-mixed-partials, m12.inverse-and-implicit-function-theorems, m12.multiple-integrals-and-change-of-variables, m13.jacobian-vector-and-vector-jacobian-products, e6.tensor-valued-autograd]
starter: |
  # Scratch space. The map from polar coordinates (r, angle) to the point (x, y).
  # Take a tiny square of side h in the (r, angle) plane, with a corner at
  # (r, 0.5), and see what area its image has.
  import numpy as np

  def polar(p):
      return np.array([p[0] * np.cos(p[1]), p[0] * np.sin(p[1])])

  h = 0.01
  for r in [1.0, 2.0, 3.0]:
      corner = np.array([r, 0.5])
      side1 = polar(corner + np.array([h, 0.0])) - polar(corner)
      side2 = polar(corner + np.array([0.0, h])) - polar(corner)
      area = abs(side1[0] * side2[1] - side1[1] * side2[0])
      print(r, round(float(area / (h * h)), 3))
parts:
  recall:
    - text: |
        [[m12.multivariable-chain-rule]] ended by writing the derivative of a composition as a product of two matrices, each the matrix of a linear approximation. Today that matrix is studied for itself. Three quick pulls first.
  puzzle:
    - text: |
        A radar reports where an aircraft is by two numbers: its distance $r$ and its bearing $\theta$. To put the aircraft on a map you convert:

        $$x = r\cos\theta, \qquad y = r\sin\theta.$$

        This is a function with two inputs and two outputs. It is not linear: double the angle and the point does not move twice as far.

        The radar is accurate to within a small amount $h$ in distance and a small amount $h$ in bearing. So what it really reports is a tiny square in the plane of $(r, \theta)$, of area $h^2$. On the map, that square becomes a small patch of uncertainty, in which the aircraft could be. **How big is the patch?**

        The starter works it out for a square at distance 1, at distance 2 and at distance 3, all at the same bearing, by sending three corners of the square through the conversion and measuring the parallelogram they make.

        Run it. At distance 1 the patch has the same area as the square. At distance 2 it has twice the area. At distance 3, three times.

        **Why should the same small error in the readings make a patch three times as large when the aircraft is three times as far away? What, exactly, does a function that is not linear do to a small square? And where does the factor $r$ come from?**
  intuition:
    - text: |
        You know what a **linear** map does to a square. It sends it to a parallelogram, whose sides are the columns of the matrix scaled by the sides of the square, and whose area is the area of the square times the determinant. That was the last lesson of the cluster on matrices.

        The conversion from polar coordinates is not linear. But it is differentiable, and three lessons ago you learnt what that means: **near any point it is very nearly linear.** Zoom in on a small enough square and the curved map looks like a matrix acting on it. So the patch is very nearly a parallelogram, and its area is very nearly the area of the square times a determinant.

        Which matrix? The one whose entries say how each output responds to each input. There are two outputs and two inputs, so there are four partial derivatives, and they arrange themselves into a table with a row for each output and a column for each input:

        $$J = \begin{pmatrix} \dfrac{\partial x}{\partial r} & \dfrac{\partial x}{\partial \theta} \\[2mm] \dfrac{\partial y}{\partial r} & \dfrac{\partial y}{\partial \theta} \end{pmatrix} = \begin{pmatrix} \cos\theta & -r\sin\theta \\ \sin\theta & r\cos\theta \end{pmatrix}.$$

        This is the **Jacobian matrix** of the conversion. Read its columns, as you learnt to read the columns of any matrix: each is where a basis vector goes.

        The first column, $(\cos\theta, \sin\theta)$, is what a small increase in $r$ does to the point: it moves it straight outwards, one unit of distance for each unit of $r$.

        The second column, $(-r\sin\theta, r\cos\theta)$, is what a small increase in $\theta$ does: it moves the point sideways, round the circle, and **$r$ units of distance for each unit of angle.** The further out the aircraft is, the further a given swing of the bearing carries it.

        So the tiny square of side $h$ becomes a tiny patch with one side of length $h$, pointing outwards, and the other of length $rh$, pointing round the circle. Its area is $rh^2$. The factor is $r$, and it is the determinant of the Jacobian: $\cos\theta \cdot r\cos\theta + r\sin\theta \cdot \sin\theta = r$.

        The figure shows the patch. Change the distance and watch one side of it grow.
    - figure: polar-cell
      props: { r: 2 }
    - text: |
        That is the whole idea of this lesson, said twice. **The Jacobian is the matrix that a function looks like when you zoom in.** Everything you know about matrices then applies locally. Its columns say what each input does. Its rows say what each output listens to. Its determinant says how areas are scaled near the point. Whether it has an inverse says whether the function can be undone near the point. And the product of two Jacobians is the Jacobian of doing one function after the other.

        A function of one variable had, at each point, one number that summarised it: its slope. A scalar function of several variables had a vector, its gradient. A function with several inputs **and** several outputs has a matrix. The slope and the gradient are the cases where the matrix has one entry or one row.
  derivation:
    - text: |
        **Definition.** Let $\mathbf{f} : \mathbb{R}^n \to \mathbb{R}^m$ have component functions $f_1, \dots, f_m$. Its **Jacobian matrix** at $\mathbf{a}$ is the $m$ by $n$ matrix of all first partial derivatives:

        $$J_{\mathbf{f}}(\mathbf{a}) = \begin{pmatrix} \dfrac{\partial f_1}{\partial x_1} & \cdots & \dfrac{\partial f_1}{\partial x_n} \\ \vdots & & \vdots \\ \dfrac{\partial f_m}{\partial x_1} & \cdots & \dfrac{\partial f_m}{\partial x_n} \end{pmatrix}, \qquad J_{ij} = \frac{\partial f_i}{\partial x_j}.$$

        **Outputs down, inputs across.** It has as many rows as outputs and as many columns as inputs, so that it can multiply a step in the inputs and give a change in the outputs.

        - **Row $i$** is the gradient of the output $f_i$.
        - **Column $j$** is $\partial \mathbf{f} / \partial x_j$: the velocity of the output as input $j$ alone is increased.

        When $\mathbf{f}$ is differentiable, the Jacobian is the matrix of its total derivative, and

        $$\mathbf{f}(\mathbf{a} + \mathbf{h}) \approx \mathbf{f}(\mathbf{a}) + J_{\mathbf{f}}(\mathbf{a})\,\mathbf{h}.$$

        For $m = 1$ the Jacobian is a single row, the gradient laid on its side.

        **Three Jacobians to know.**

        *A linear map.* $\mathbf{f}(\mathbf{x}) = A\mathbf{x}$. Output $i$ is $\sum_j a_{ij} x_j$, whose partial derivative with respect to $x_j$ is $a_{ij}$. So $J = A$, at every point. A linear map is its own linear approximation.

        *An elementwise function.* Apply one function $\sigma$ of one variable to every entry: $f_i(\mathbf{x}) = \sigma(x_i)$. Output $i$ depends on input $i$ and on no other, so the Jacobian is **diagonal**, with entries $\sigma'(x_i)$. For $\tanh$ it is the diagonal matrix of $1 - \tanh^2 x_i$. Nobody stores such a matrix. Multiplying by it is multiplying entry by entry.

        *Softmax.* $p_i = \dfrac{e^{s_i}}{\sum_k e^{s_k}}$ turns scores into probabilities. Every output depends on every score, through the sum on the bottom. Differentiating with the quotient rule,

        $$\frac{\partial p_i}{\partial s_j} = p_i\,(\delta_{ij} - p_j), \qquad\text{that is,}\qquad J = \operatorname{diag}(\mathbf{p}) - \mathbf{p}\,\mathbf{p}^{\mathsf T},$$

        where $\delta_{ij}$ is 1 if $i = j$ and 0 otherwise. Raising a score raises its own probability, the diagonal term, and lowers all the others, since the probabilities must still add up to 1. For that reason every column of this Jacobian sums to 0.

        **Numerically.** Column $j$ is a partial derivative of the whole output vector, so one central difference gives a whole column:

        $$\text{column } j \approx \frac{\mathbf{f}(\mathbf{a} + h\mathbf{e}_j) - \mathbf{f}(\mathbf{a} - h\mathbf{e}_j)}{2h}.$$

        The full Jacobian costs $2n$ evaluations, whatever the number of outputs.
    - question:
        id: derivation-columns
        type: choice
        system: s2
        prompt: |
          For the polar conversion at $r = 3$, $\theta = 0$, the Jacobian is $\begin{pmatrix} 1 & 0 \\ 0 & 3 \end{pmatrix}$. The radar's bearing is off by a small angle $\varepsilon$ and its distance is exact. Where does the map put the aircraft, relative to where it is?
        options:
          - 'About $\varepsilon$ too far out, along the $x$-axis.'
          - 'About $3\varepsilon$ to the side, along the $y$-axis. The error in the inputs is the step $(0, \varepsilon)$, and the Jacobian sends it to $3\varepsilon$ times the second basis vector: the second column says what a change of bearing does.'
          - 'About $\varepsilon$ to the side, along the $y$-axis.'
          - 'Exactly where it is, since the distance is right.'
        answer: 1
        explanation: |
          The error in the output is approximately the Jacobian applied to the error in the input: $J\,(0, \varepsilon)^{\mathsf T} = (0, 3\varepsilon)^{\mathsf T}$. The second column of the Jacobian is the response to the second input. At bearing 0 a change in bearing swings the point sideways, in the $y$ direction, and at distance 3 an angle $\varepsilon$ subtends an arc of length $3\varepsilon$. This is error propagation, as in the lesson on the total derivative, for several outputs at once.
    - text: |
        **The chain rule.** In this notation the last lesson's theorem is

        $$J_{\mathbf{f} \circ \mathbf{g}}(\mathbf{a}) = J_{\mathbf{f}}(\mathbf{g}(\mathbf{a}))\;J_{\mathbf{g}}(\mathbf{a}).$$

        The shapes must chain: if $\mathbf{g}$ goes from $k$ inputs to $n$ and $\mathbf{f}$ from $n$ to $m$, the product is $(m \times n)(n \times k) = m \times k$. A network of layers has a Jacobian that is the product of the Jacobians of its layers. For a layer $\mathbf{x} \mapsto \tanh(W\mathbf{x})$ it is a diagonal matrix times $W$.

        **The determinant.** When $m = n$ the Jacobian is square and has a determinant, called the **Jacobian determinant** or simply "the Jacobian". Since $\mathbf{f}$ acts on a small region near $\mathbf{a}$ approximately as the linear map $J$, and a linear map multiplies every area by the absolute value of its determinant:

        $$\text{area of the image of a small region near } \mathbf{a} \;\approx\; |\det J_{\mathbf{f}}(\mathbf{a})| \times \text{area of the region}.$$

        In three dimensions read volume for area. **The Jacobian determinant is the local magnification of the map.** For polar coordinates it is $r$. Its sign says whether the map keeps the orientation of small figures or mirrors them.

        Where the determinant is zero, the map squashes small regions flat, at least to first order. For polar coordinates that happens at $r = 0$: the whole edge $r = 0$ of the $(r, \theta)$ plane, every bearing at distance zero, is sent to the single point at the origin. At such a point the map cannot be undone, since the bearing cannot be recovered. Where the determinant is not zero, the linear approximation has an inverse, and the next lesson but two shows that the map itself then has one nearby.

        **Newton's method for systems.** In one variable, Newton's method solved $f(x) = 0$ by replacing $f$ with its tangent line and solving that instead. The same idea solves $n$ equations in $n$ unknowns, $\mathbf{F}(\mathbf{x}) = \mathbf{0}$. Near the current guess, $\mathbf{F}(\mathbf{x} + \mathbf{d}) \approx \mathbf{F}(\mathbf{x}) + J\mathbf{d}$. Ask for the step that makes the approximation zero:

        $$J(\mathbf{x})\,\mathbf{d} = -\mathbf{F}(\mathbf{x}), \qquad \mathbf{x} \leftarrow \mathbf{x} + \mathbf{d}.$$

        Each step is one linear system, solved with `np.linalg.solve`. For example, to find where the circle $x^2 + y^2 = 4$ meets the line $y = x$, take $\mathbf{F}(x, y) = (x^2 + y^2 - 4,\ x - y)$, with Jacobian $\begin{pmatrix} 2x & 2y \\ 1 & -1 \end{pmatrix}$. From the guess $(2, 1)$, where $\mathbf{F} = (1, 1)$, the system $4d_1 + 2d_2 = -1$, $d_1 - d_2 = -1$ gives $\mathbf{d} = (-0.5, 0.5)$ and the new guess $(1.5, 1.5)$. One more step gives $(1.4167, 1.4167)$, and the answer is $(\sqrt2, \sqrt2) \approx (1.4142, 1.4142)$. Near a solution the number of correct digits roughly doubles at each step, as it did in one variable.
    - question:
        id: order-newton
        type: order
        system: s2
        prompt: Put in order one step of Newton's method for a system $\mathbf{F}(\mathbf{x}) = \mathbf{0}$.
        steps:
          - 'Evaluate $\mathbf{F}$ at the current guess.'
          - 'Evaluate the Jacobian of $\mathbf{F}$ at the current guess.'
          - 'Solve the linear system $J\mathbf{d} = -\mathbf{F}$ for the step $\mathbf{d}$.'
          - 'Add the step to the guess.'
          - 'Check whether $\mathbf{F}$ at the new guess is close enough to zero, and if not, repeat.'
        explanation: Both the value and the Jacobian are taken at the current guess, since the linear approximation is only good near the point where it was made. The step solves the approximate problem exactly. Because the approximation improves as the guesses close in, each step is better than the last.
  formal:
    - text: |
        **Jacobian.** For $\mathbf{f} : D \to \mathbb{R}^m$, $D \subseteq \mathbb{R}^n$, the Jacobian at $\mathbf{a}$ is the $m \times n$ matrix $J_{\mathbf{f}}(\mathbf{a})$ with entries $\dfrac{\partial f_i}{\partial x_j}(\mathbf{a})$. If $\mathbf{f}$ is differentiable at $\mathbf{a}$, then $D\mathbf{f}(\mathbf{a})\,\mathbf{h} = J_{\mathbf{f}}(\mathbf{a})\,\mathbf{h}$.

        **Relation to the gradient.** For $m = 1$, $J_f = (\nabla f)^{\mathsf T}$.

        **Chain rule.** $J_{\mathbf{f} \circ \mathbf{g}}(\mathbf{a}) = J_{\mathbf{f}}(\mathbf{g}(\mathbf{a}))\,J_{\mathbf{g}}(\mathbf{a})$.

        **Standard Jacobians.** For $\mathbf{f}(\mathbf{x}) = A\mathbf{x} + \mathbf{b}$, $J = A$. For $f_i(\mathbf{x}) = \sigma(x_i)$, $J = \operatorname{diag}(\sigma'(x_1), \dots, \sigma'(x_n))$. For softmax, $J = \operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^{\mathsf T}$.

        **Jacobian determinant.** For $m = n$, $\det J_{\mathbf{f}}(\mathbf{a})$ is the factor by which $\mathbf{f}$ scales signed volume to first order at $\mathbf{a}$. By the chain rule and the product rule for determinants, $\det J_{\mathbf{f} \circ \mathbf{g}} = \det J_{\mathbf{f}} \cdot \det J_{\mathbf{g}}$.

        **Newton's method.** $\mathbf{x}_{k+1} = \mathbf{x}_k - J_{\mathbf{F}}(\mathbf{x}_k)^{-1}\,\mathbf{F}(\mathbf{x}_k)$.
