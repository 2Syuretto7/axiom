concept: m1.quadratics
minutes: 110
claim: You can expand and factorise quadratic expressions, solve quadratic equations by factorising, by completing the square and by the formula you derive from it, and read the number of solutions and the turning point of a parabola from its coefficients.
recalls: [m1.simultaneous-equations]
uses: [m1.variables-and-expressions, m1.linear-equations, m1.inequalities-and-absolute-value, m1.coordinates-and-the-plane, m1.straight-lines-and-slope, m0.powers-and-roots, m0.fractions, m0.negative-numbers, e0.expressions, e0.booleans-and-conditionals, e0.loops, e0.functions, e0.lists-and-tuples, e0.reading-errors-and-debugging]
leads: [m1.polynomials]
starter: |
  # Scratch space. Equal steps in x: are the steps in y equal?
  for x in range(-3, 4):
      print(x, x * x - 2 * x - 3)
parts:
  recall:
    - text: |
        In [[m1.simultaneous-equations]] two straight lines met in at most one point, and a single number, the determinant, told you whether they would. Today one of the lines bends. Two quick pulls first.
  puzzle:
    - text: |
        You have 20 metres of fencing to make a rectangular vegetable plot, and you want its area to be 24 square metres. How wide should it be?

        The four sides use up the 20 metres, so one width and one length together make 10. If the width is $w$, the length is $10 - w$, and the area is

        $$w(10 - w) = 24.$$

        Expand the left side: $10w - w^2 = 24$. Now try to solve it as you have solved every equation so far. The unknown is there twice, once plain and once squared, and they are not like terms. You cannot collect them. Subtract $10w$ and you still have a $w^2$. Take a square root and the $10w$ is in the way. Every attempt to isolate $w$ leaves a $w$ behind.

        Guessing finds $w = 4$, since $4 \times 6 = 24$. But $w = 6$ works as well, giving the same plot turned round. An equation with **two** solutions is something new.

        **How do you solve an equation in which the unknown is multiplied by itself?**
  intuition:
    - text: |
        First see what the equation looks like. Tabulate $y = x^2 - 2x - 3$ for whole values of $x$.

        | $x$ | $-2$ | $-1$ | $0$ | $1$ | $2$ | $3$ | $4$ |
        | --- | --- | --- | --- | --- | --- | --- | --- |
        | $y$ | $5$ | $0$ | $-3$ | $-4$ | $-3$ | $0$ | $5$ |

        The steps in $y$ are $-5, -3, -1, 1, 3, 5$. They are not equal, so this is no straight line. The values fall, turn round at the bottom, and rise again, and the table is a mirror image of itself about $x = 1$.

        The curve is called a **parabola**. Steer one below with its three sliders. Find a setting where it crosses the horizontal axis twice, one where it just touches, and one where it misses altogether.
    - figure: parabola
      props: { a: 1, b: -2, c: -3 }
    - text: |
        The solutions of $x^2 - 2x - 3 = 0$ are the places where the curve meets the $x$-axis, because that is where $y = 0$. In the table those are $x = -1$ and $x = 3$. A bent curve can cross a straight line twice, which is why two solutions are possible. It can also touch once, or miss.

        Now for the idea that cracks these equations. A product is a much better thing to have equal to zero than a sum. If you are told that two numbers **multiply** to zero, you know for certain that one of them is zero. No other product gives such information: two numbers multiplying to 24 could be anything.

        So if an expression such as $x^2 - 2x - 3$ could be rewritten as a **product** of two simpler pieces, the equation would fall apart into two easy ones. The whole subject of quadratics is the art of turning sums into products.
  derivation:
    - text: |
        **Multiplying two brackets.** Start in the easy direction. What is $(x + 2)(x + 3)$? Think of a rectangle $x + 2$ wide and $x + 3$ tall. Split each side into its two parts and the rectangle falls into four pieces: an $x$ by $x$ square, an $x$ by 3 strip, a 2 by $x$ strip, and a 2 by 3 corner.

        $$(x + 2)(x + 3) = x^2 + 3x + 2x + 6 = x^2 + 5x + 6.$$

        Without the picture, it is the distributive law used twice: **every term of the first bracket multiplies every term of the second.** Signs travel with their terms:

        $$(x - 4)(x + 1) = x^2 + x - 4x - 4 = x^2 - 3x - 4.$$

        Three products come up so often that they are worth knowing by sight.

        $$\begin{aligned} (a + b)^2 &= a^2 + 2ab + b^2 \\ (a - b)^2 &= a^2 - 2ab + b^2 \\ (a + b)(a - b) &= a^2 - b^2 \end{aligned}$$

        The first is the square of side $a + b$ cut into two squares and two equal rectangles. It is the reason $(a + b)^2$ is not $a^2 + b^2$: the two rectangles, $2ab$, are missing. You found that gap by experiment six lessons ago. In the third, the two middle terms $-ab$ and $+ab$ cancel, leaving a **difference of two squares**.

        An expression $ax^2 + bx + c$ with $a \neq 0$ is called a **quadratic**.

        **Factorising: the reverse.** Look again at $(x + 2)(x + 3) = x^2 + 5x + 6$. The 5 is $2 + 3$ and the 6 is $2 \times 3$. In general

        $$(x + p)(x + q) = x^2 + (p + q)x + pq.$$

        So to factorise $x^2 + bx + c$, find two numbers whose **product is $c$** and whose **sum is $b$**. For $x^2 - 2x - 3$: the product is $-3$, so one number is negative, and the candidates are $1, -3$ and $-1, 3$. The sum must be $-2$, which picks $1$ and $-3$:

        $$x^2 - 2x - 3 = (x + 1)(x - 3).$$

        Always check a factorisation by multiplying it out again.

        **The zero-product property.** If $AB = 0$, then $A = 0$ or $B = 0$. Why? Suppose $A$ is not zero. Then you may divide both sides by it, and $B = 0 \div A = 0$. So one of the two must be zero.

        Now the equation falls apart:

        $$x^2 - 2x - 3 = 0 \quad\Longleftrightarrow\quad (x + 1)(x - 3) = 0 \quad\Longleftrightarrow\quad x = -1 \;\text{ or }\; x = 3.$$

        Those are the two crossings in the table.

        The property works only when the other side is **zero**. So the first move with any quadratic equation is to bring everything to one side. For the vegetable plot: $10w - w^2 = 24$ becomes $w^2 - 10w + 24 = 0$. Two numbers with product 24 and sum $-10$ are $-4$ and $-6$, so $(w - 4)(w - 6) = 0$ and $w = 4$ or $w = 6$.

        One warning. Never divide both sides of an equation by an expression containing the unknown. From $x^2 = 5x$, dividing by $x$ gives $x = 5$ and silently loses the solution $x = 0$. Instead write $x^2 - 5x = 0$, factorise as $x(x - 5) = 0$, and read off both.
    - question:
        id: solve-by-factorising
        type: choice
        system: s2
        prompt: "Solve $x^2 + 2x = 15$."
        options: ["$x = 3$ or $x = 5$", "$x = -5$ or $x = 3$", "$x = -3$ or $x = 5$", "$x = 15$ or $x = 13$"]
        answer: 1
        explanation: "Bring everything to one side: $x^2 + 2x - 15 = 0$. Two numbers with product $-15$ and sum 2 are 5 and $-3$, so $(x + 5)(x - 3) = 0$, giving $x = -5$ or $x = 3$. Check: $25 - 10 = 15$ and $9 + 6 = 15$."
    - text: |
        **When factorising fails.** Try $x^2 - 6x + 7 = 0$. Two whole numbers with product 7 and sum $-6$ do not exist. That does not mean there is no solution, only that the solutions are not whole numbers. A method is needed that always works.

        Start from the one kind of quadratic equation that is easy without factorising: a square equal to a number. If $(x - 3)^2 = 2$, then $x - 3$ is a number whose square is 2. There are two such numbers, $\sqrt{2}$ and $-\sqrt{2}$, so

        $$x = 3 + \sqrt{2} \quad\text{or}\quad x = 3 - \sqrt{2}.$$

        The plan is to force any quadratic into that shape.

        **Completing the square.** Look at $x^2 - 6x$. Compare it with the expansion $(x - 3)^2 = x^2 - 6x + 9$. They agree except for the 9. So

        $$x^2 - 6x = (x - 3)^2 - 9.$$

        The recipe: **halve the coefficient of $x$, write the bracket squared, and subtract the square of the half.** In a picture, $x^2 + 6x$ is a square of side $x$ with two 3 by $x$ strips on adjacent sides, an L-shape that needs one 3 by 3 corner to become a full square of side $x + 3$.

        Now solve the stubborn equation.

        $$\begin{aligned} x^2 - 6x + 7 &= 0 \\ (x - 3)^2 - 9 + 7 &= 0 \\ (x - 3)^2 &= 2 \\ x &= 3 \pm \sqrt{2} \end{aligned}$$

        The sign $\pm$ is read "plus or minus" and stands for two answers at once. Numerically they are about 4.414 and 1.586.

        **The quadratic formula.** Do the same thing once with letters and the work never needs doing again. Take $ax^2 + bx + c = 0$ with $a \neq 0$.

        $$\begin{aligned} x^2 + \frac{b}{a}x + \frac{c}{a} &= 0 && \text{divide by } a \\ \left(x + \frac{b}{2a}\right)^2 - \frac{b^2}{4a^2} + \frac{c}{a} &= 0 && \text{complete the square} \\ \left(x + \frac{b}{2a}\right)^2 &= \frac{b^2 - 4ac}{4a^2} && \text{rearrange, with a common denominator} \\ x + \frac{b}{2a} &= \pm\frac{\sqrt{b^2 - 4ac}}{2a} && \text{take square roots} \end{aligned}$$

        and so

        $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}.$$

        Every quadratic equation is solved by this formula. It is not a fact to be taken on trust. It is completing the square, done once and for all.

        **How many solutions?** Everything hangs on the quantity under the root, $D = b^2 - 4ac$, called the **discriminant**.

        | Discriminant | Solutions | The parabola |
        | --- | --- | --- |
        | $D > 0$ | two different ones | crosses the $x$-axis twice |
        | $D = 0$ | exactly one, $x = -\dfrac{b}{2a}$ | touches the $x$-axis |
        | $D < 0$ | none among the numbers you know | misses the $x$-axis |

        When $D$ is negative the formula asks for the square root of a negative number. No number on the number line has a negative square, since a positive times a positive and a negative times a negative are both positive. So there is no solution, for now. The last lesson of this cluster returns to that "for now".

        A warning for programs. In Python, `(-4) ** 0.5` does not stop with an error. It quietly returns a strange value with a `j` in it, a kind of number you have not met. So always test the sign of the discriminant **before** taking its root.

        **The turning point.** The two solutions are $-\frac{b}{2a}$ plus and minus the same amount, so they sit symmetrically about $x = -\frac{b}{2a}$. That is the parabola's line of symmetry, and its turning point, the **vertex**, lies on it. Completing the square shows the same: $a(x - h)^2 + k$ is least, when $a > 0$, exactly when the square is zero, at $x = h$. If $a > 0$ the parabola opens upwards and the vertex is its lowest point. If $a < 0$ it opens downwards and the vertex is its highest.
    - question:
        id: fix-formula-precedence
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `larger_root(a, b, c)` should return the larger solution of $ax^2 + bx + c = 0$, for cases where $a > 0$ and the discriminant is not negative. For $x^2 - 2x - 3 = 0$ the solutions are $-1$ and 3, so it should return 3.0, but it returns 4.0. The formula has been typed as it is read aloud. Compare the line with the fraction as it is written on paper, where the bar groups everything above it and everything below it, and fix the function.
        starter: |
          def larger_root(a, b, c):
              d = b * b - 4 * a * c
              return -b + d ** 0.5 / 2 * a

          print(larger_root(1, -2, -3))
        solution: |
          def larger_root(a, b, c):
              d = b * b - 4 * a * c
              return (-b + d ** 0.5) / (2 * a)

          print(larger_root(1, -2, -3))
        tests: |
          assert abs(larger_root(1, -2, -3) - 3) < 1e-9, "For x^2 - 2x - 3 = 0 the larger solution is 3. What does the fraction bar group together?"
          assert abs(larger_root(1, 0, -4) - 2) < 1e-9, "For x^2 - 4 = 0 the larger solution is 2"
          assert abs(larger_root(2, -4, 0) - 2) < 1e-9, "For 2x^2 - 4x = 0 the solutions are 0 and 2. The whole numerator is divided by the whole of 2a."
          assert abs(larger_root(1, -6, 7) - (3 + 2 ** 0.5)) < 1e-9, "For x^2 - 6x + 7 = 0 the larger solution is 3 plus the square root of 2"
          assert abs(larger_root(4, 4, 1) - (-0.5)) < 1e-9, "For 4x^2 + 4x + 1 = 0 the only solution is -0.5"
        wrong:
          - "def larger_root(a, b, c):\n    d = b * b - 4 * a * c\n    return (-b + d ** 0.5) / 2 * a\n\nprint(larger_root(1, -2, -3))\n"
          - "def larger_root(a, b, c):\n    d = b * b - 4 * a * c\n    return -b + d ** 0.5 / (2 * a)\n\nprint(larger_root(1, -2, -3))\n"
          - "def larger_root(a, b, c):\n    d = b * b + 4 * a * c\n    return (-b + d ** 0.5) / (2 * a)\n\nprint(larger_root(1, -2, -3))\n"
        explanation: Two pairs of brackets were missing. Without the first, only the root is divided and not the whole numerator. Without the second, the result is divided by 2 and then multiplied by $a$. With $a = 1$ the second slip is invisible, which is why a test with $a = 2$ matters.
  formal:
    - text: |
        A **quadratic** in $x$ is an expression $ax^2 + bx + c$ with $a \neq 0$.

        **Products.** For all numbers:

        | Identity | |
        | --- | --- |
        | $(x + p)(x + q) = x^2 + (p + q)x + pq$ | product of two brackets |
        | $(a + b)^2 = a^2 + 2ab + b^2$ | square of a sum |
        | $(a - b)^2 = a^2 - 2ab + b^2$ | square of a difference |
        | $(a + b)(a - b) = a^2 - b^2$ | difference of two squares |

        **Zero-product property.** $AB = 0$ if and only if $A = 0$ or $B = 0$.

        **Completing the square.** $x^2 + bx = \left(x + \dfrac{b}{2}\right)^2 - \dfrac{b^2}{4}$. More generally,

        $$ax^2 + bx + c = a\left(x + \frac{b}{2a}\right)^2 + c - \frac{b^2}{4a}.$$

        **Quadratic formula.** The solutions of $ax^2 + bx + c = 0$, with $a \neq 0$, are

        $$x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

        provided the **discriminant** $D = b^2 - 4ac$ is not negative. There are two real solutions if $D > 0$, one if $D = 0$ and none if $D < 0$.

        **The parabola** $y = ax^2 + bx + c$ is symmetric about the vertical line $x = -\dfrac{b}{2a}$. Its **vertex** is the point on that line. It opens upwards, with the vertex lowest, if $a > 0$, and downwards, with the vertex highest, if $a < 0$. It meets the $y$-axis at $c$ and the $x$-axis at the solutions of $ax^2 + bx + c = 0$, which are called its **roots**.

        If the roots are $r$ and $s$, then $ax^2 + bx + c = a(x - r)(x - s)$, so $r + s = -\dfrac{b}{a}$ and $rs = \dfrac{c}{a}$.
  drill:
    - text: Seconds each. For a product of brackets, every term meets every term.
    - question:
        id: drill-expand
        type: choice
        system: s1
        prompt: "Expand $(x + 4)(x + 2)$."
        options: ["$x^2 + 8$", "$x^2 + 6x + 8$", "$x^2 + 8x + 6$", "$2x + 6$"]
        answer: 1
        explanation: "$x^2 + 2x + 4x + 8$. The sum 6 goes with $x$ and the product 8 stands alone."
    - question:
        id: drill-expand-signs
        type: choice
        system: s1
        prompt: "Expand $(x - 5)(x + 2)$."
        options: ["$x^2 - 3x - 10$", "$x^2 + 3x - 10$", "$x^2 - 7x - 10$", "$x^2 - 3x + 10$"]
        answer: 0
        explanation: "The sum of $-5$ and 2 is $-3$, and their product is $-10$."
    - question:
        id: drill-square
        type: choice
        system: s1
        prompt: "Expand $(x + 3)^2$."
        options: ["$x^2 + 9$", "$x^2 + 3x + 9$", "$x^2 + 6x + 9$", "$2x + 6$"]
        answer: 2
        explanation: "$(a + b)^2 = a^2 + 2ab + b^2$, and $2 \\times 3 \\times x = 6x$."
    - question:
        id: drill-difference-squares
        type: choice
        system: s1
        prompt: "Factorise $x^2 - 49$."
        options: ["$(x - 7)^2$", "$(x + 7)(x - 7)$", "$(x - 49)(x + 1)$", "It cannot be factorised"]
        answer: 1
        explanation: "A difference of two squares, $x^2 - 7^2$."
    - question:
        id: drill-factorise
        type: choice
        system: s1
        prompt: "Factorise $x^2 + 7x + 12$."
        options: ["$(x + 6)(x + 2)$", "$(x + 3)(x + 4)$", "$(x + 12)(x + 1)$", "$(x - 3)(x - 4)$"]
        answer: 1
        explanation: "Product 12 and sum 7: the numbers are 3 and 4."
    - question:
        id: drill-zero-product
        type: choice
        system: s1
        prompt: "Solve $(x - 2)(x + 7) = 0$."
        options: ["$x = 2$ or $x = 7$", "$x = -2$ or $x = 7$", "$x = 2$ or $x = -7$", "$x = -2$ or $x = -7$"]
        answer: 2
        explanation: "Either $x - 2 = 0$ or $x + 7 = 0$."
    - question:
        id: drill-discriminant
        type: numeric
        system: s1
        prompt: "What is the discriminant of $x^2 + 4x + 5$?"
        answer: "-4"
        explanation: "$b^2 - 4ac = 16 - 20$. It is negative, so the parabola never meets the $x$-axis."
    - question:
        id: drill-vertex
        type: numeric
        system: s1
        prompt: "At what value of $x$ is the turning point of $y = x^2 - 8x + 3$?"
        answer: "4"
        explanation: "$-\\dfrac{b}{2a} = \\dfrac{8}{2}$."
    - question:
        id: drill-complete-square
        type: choice
        system: s1
        prompt: "Complete the square: $x^2 + 10x$ equals which of these?"
        options: ["$(x + 5)^2$", "$(x + 5)^2 - 25$", "$(x + 10)^2 - 100$", "$(x + 5)^2 + 25$"]
        answer: 1
        explanation: "Halve 10 to get 5. Then $(x + 5)^2 = x^2 + 10x + 25$, so the extra 25 must be taken off."
    - question:
        id: predict-roots-check
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def q(x):
              return x * x - 2 * x - 3

          print(q(-1), q(3), q(1))
        output: "0 0 -4"
        explanation: "$-1$ and 3 are the roots, where the value is 0. Halfway between them, at $x = 1$, is the vertex, with the least value, $-4$."
  work:
    - text: Slower now. Bring everything to one side first. Estimate where the roots are before you compute, and substitute them back after.
    - question:
        id: work-formula
        type: numeric
        system: s2
        prompt: "Solve $2x^2 - 7x + 3 = 0$ with the formula. What is the **smaller** solution? Give an exact answer."
        answer: "1/2"
        explanation: "$D = 49 - 24 = 25$, so $x = \\dfrac{7 \\pm 5}{4}$, which is 3 or $\\dfrac{1}{2}$. Check: $2 \\times \\frac{1}{4} - \\frac{7}{2} + 3 = 0$. Indeed $2x^2 - 7x + 3 = (2x - 1)(x - 3)$."
    - question:
        id: work-max-area
        type: numeric
        system: s2
        prompt: |
          With the 20 metres of fencing from the puzzle, the area of the plot is $A = w(10 - w) = -w^2 + 10w$. What is the largest area that can be enclosed, in square metres? Find the vertex.
        answer: "25"
        explanation: "The parabola opens downwards, so its vertex is the highest point. It is at $w = -\\dfrac{10}{2 \\times (-1)} = 5$, where $A = 5 \\times 5 = 25$. The best rectangle is a square. As a check, the roots of $w(10 - w) = 0$ are 0 and 10, and the vertex is midway between them."
    - question:
        id: write-roots
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `roots(a, b, c)` that returns a **list** of the real solutions of $ax^2 + bx + c = 0$, in increasing order, where `a` is not zero. The list has two numbers when the discriminant is positive, one when it is zero, and is empty when it is negative. Test the discriminant before taking its square root.
        starter: |
          def roots(a, b, c):
              # Replace the next line with your own.
              return []

          print(roots(1, -2, -3))
          print(roots(1, 2, 1))
          print(roots(1, 0, 1))
        solution: |
          def roots(a, b, c):
              d = b * b - 4 * a * c
              if d < 0:
                  return []
              if d == 0:
                  return [-b / (2 * a)]
              r = d ** 0.5
              return sorted([(-b - r) / (2 * a), (-b + r) / (2 * a)])

          print(roots(1, -2, -3))
          print(roots(1, 2, 1))
          print(roots(1, 0, 1))
        tests: |
          def _close(got, want):
              if got is None or len(got) != len(want):
                  return False
              for i in range(len(want)):
                  if type(got[i]) == complex or abs(got[i] - want[i]) > 1e-9:
                      return False
              return True
          assert roots(1, -2, -3) is not None, "The function returns None. It should return a list."
          assert _close(roots(1, -2, -3), [-1, 3]), "x^2 - 2x - 3 = 0 has the solutions -1 and 3, in that order"
          assert _close(roots(1, 2, 1), [-1]), "x^2 + 2x + 1 = 0 has the single solution -1, so the list has one item"
          assert _close(roots(1, 0, 1), []), "x^2 + 1 = 0 has no real solution, so return the empty list. Test the discriminant before taking a root."
          assert _close(roots(2, -7, 3), [0.5, 3]), "2x^2 - 7x + 3 = 0 has the solutions 0.5 and 3. Divide by the whole of 2a."
          assert _close(roots(-1, 10, -24), [4, 6]), "-x^2 + 10x - 24 = 0 has the solutions 4 and 6. With a negative a, which root is the smaller?"
          assert _close(roots(1, -6, 7), [3 - 2 ** 0.5, 3 + 2 ** 0.5]), "It should work when the solutions are not whole numbers"
        wrong:
          - "def roots(a, b, c):\n    d = b * b - 4 * a * c\n    r = d ** 0.5\n    return sorted([(-b - r) / (2 * a), (-b + r) / (2 * a)])\n"
          - "def roots(a, b, c):\n    d = b * b - 4 * a * c\n    if d < 0:\n        return []\n    r = d ** 0.5\n    return [(-b - r) / (2 * a), (-b + r) / (2 * a)]\n"
          - "def roots(a, b, c):\n    d = b * b - 4 * a * c\n    if d < 0:\n        return []\n    if d == 0:\n        return [-b / (2 * a)]\n    r = d ** 0.5\n    return sorted([(-b - r) / 2 * a, (-b + r) / 2 * a])\n"
        explanation: The discriminant decides the shape of the answer before any root is taken. When $a$ is negative, dividing by $2a$ reverses the order of the two solutions, so they are sorted before being returned.
    - question:
        id: write-vertex
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `vertex(a, b, c)` that returns the turning point of the parabola $y = ax^2 + bx + c$ as a tuple `(x, y)`, where `a` is not zero. Then write a function `least_value(a, b, c)` that returns the least value the quadratic takes if it has one, and `None` if the parabola opens downwards and so has no least value.
        starter: |
          def vertex(a, b, c):
              # Replace the next line with your own.
              return (0, 0)

          def least_value(a, b, c):
              # Replace the next line with your own.
              return 0

          print(vertex(1, -2, -3))
          print(least_value(1, -2, -3))
        solution: |
          def vertex(a, b, c):
              x = -b / (2 * a)
              return (x, a * x * x + b * x + c)

          def least_value(a, b, c):
              if a < 0:
                  return None
              x, y = vertex(a, b, c)
              return y

          print(vertex(1, -2, -3))
          print(least_value(1, -2, -3))
        tests: |
          assert vertex(1, -2, -3) == (1, -4), "The vertex of y = x^2 - 2x - 3 is (1, -4)"
          assert vertex(1, 0, 0) == (0, 0), "The vertex of y = x^2 is the origin"
          assert vertex(-1, 10, 0) == (5, 25), "The vertex of y = -x^2 + 10x is (5, 25)"
          assert vertex(2, 8, 1) == (-2, -7), "The vertex of y = 2x^2 + 8x + 1 is (-2, -7). Divide by the whole of 2a."
          assert least_value(1, -2, -3) == -4, "The least value of x^2 - 2x - 3 is -4"
          assert least_value(2, 8, 1) == -7, "The least value of 2x^2 + 8x + 1 is -7"
          assert least_value(-1, 10, 0) is None, "A parabola that opens downwards has a greatest value but no least one, so return None"
        wrong:
          - "def vertex(a, b, c):\n    x = -b / 2 * a\n    return (x, a * x * x + b * x + c)\n\ndef least_value(a, b, c):\n    if a < 0:\n        return None\n    x, y = vertex(a, b, c)\n    return y\n"
          - "def vertex(a, b, c):\n    x = -b / (2 * a)\n    return (x, a * x * x + b * x + c)\n\ndef least_value(a, b, c):\n    x, y = vertex(a, b, c)\n    return y\n"
          - "def vertex(a, b, c):\n    x = -b / (2 * a)\n    return (x, a * x * x + b * x + c)\n\ndef least_value(a, b, c):\n    if a < 0:\n        return None\n    x, y = vertex(a, b, c)\n    return x\n"
        explanation: "The vertex lies on the line of symmetry $x = -\\frac{b}{2a}$, and its height is the quadratic evaluated there. Whether that height is the least or the greatest value depends on the sign of $a$."
    - question:
        id: fix-lost-solution
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `solve(k)` should return the list of all solutions of $x^2 = kx$, in increasing order. Its author divided both sides by $x$ and concluded that the only solution is $x = k$. Substitute $x = 0$ into the equation to see what was lost, redo the algebra by bringing everything to one side and factorising, and fix the function. When the two solutions coincide, the list should hold that solution once.
        starter: |
          def solve(k):
              return [k]

          print(solve(5))
        solution: |
          def solve(k):
              if k == 0:
                  return [0]
              return sorted([0, k])

          print(solve(5))
        tests: |
          assert solve(5) == [0, 5], "x^2 = 5x has the solutions 0 and 5. Dividing by x is not allowed when x might be 0."
          assert solve(-3) == [-3, 0], "x^2 = -3x has the solutions -3 and 0, in increasing order"
          assert solve(0) == [0], "x^2 = 0 has the single solution 0, listed once"
          assert solve(1) == [0, 1], "It should work for any k"
        wrong:
          - "def solve(k):\n    return [0, k]\n\nprint(solve(5))\n"
          - "def solve(k):\n    if k == 0:\n        return [0]\n    return sorted([k, -k])\n\nprint(solve(5))\n"
        explanation: "$x^2 - kx = 0$ factorises as $x(x - k) = 0$, so $x = 0$ or $x = k$. Dividing by $x$ assumed that $x$ was not zero and so threw away the solution in which it is."
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: "Put the steps of the derivation of the quadratic formula from $ax^2 + bx + c = 0$ in order."
        steps:
          - "Divide both sides by $a$, so that the coefficient of $x^2$ is 1."
          - "Complete the square, writing $x^2 + \\dfrac{b}{a}x$ as $\\left(x + \\dfrac{b}{2a}\\right)^2 - \\dfrac{b^2}{4a^2}$."
          - "Move the constants to the right side and combine them over the denominator $4a^2$."
          - "Take square roots of both sides, allowing for both signs."
          - "Subtract $\\dfrac{b}{2a}$ from both sides."
        explanation: The formula is completing the square carried out with letters. Each step is one you can do with numbers.
    - question:
        id: discriminant-meaning
        type: choice
        system: s2
        prompt: "For which values of $k$ does $x^2 + 6x + k = 0$ have two different real solutions?"
        options: ["$k > 9$", "$k = 9$", "$k < 9$", "All values of $k$"]
        answer: 2
        explanation: "The discriminant is $36 - 4k$. It is positive exactly when $4k < 36$, that is, $k < 9$. At $k = 9$ the quadratic is $(x + 3)^2$ and just touches the axis. Raising $k$ lifts the whole parabola, and above 9 it clears the axis."
  connections:
    - text: |
        The unknown can now be multiplied by itself and you can still find it, by turning a sum into a product or, when that fails, by building a perfect square. Two solutions, one or none: the discriminant tells you which before you start.

        The parabola is the simplest curve with a lowest point, and that makes it the most important curve in machine learning. Training a model means searching for the settings where its error is least. The standard measure of error squares each miss, so the error is a quadratic in each setting, a bowl with a single bottom, and finding the vertex is the whole game. For one setting you did it today with $-\frac{b}{2a}$. For millions, the bowl lives in a space of millions of dimensions, and it is descended step by step, but near its bottom it still looks like a parabola.

        Completing the square will reappear whenever a quadratic must be understood rather than merely solved, most famously in the bell-shaped curve of statistics, whose formula has a completed square in its exponent.

        And remember the equations with no solution. $x^2 + 1 = 0$ asks for a number whose square is $-1$. Python's odd answer to `(-1) ** 0.5` was a hint that the story does not end with "impossible".

        A quadratic is built from $x^2$, $x$ and a constant. Nothing stops you from adding $x^3$, $x^4$ and beyond. Such expressions can be added, multiplied and even divided, much like whole numbers, and their graphs can turn more than once. They are the next lesson: [[m1.polynomials]].
