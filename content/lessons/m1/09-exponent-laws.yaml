concept: m1.exponent-laws
minutes: 100
claim: You can simplify expressions with the laws of exponents, explain why they force the meaning of fractional exponents as roots, and recognise exponential growth and why it outruns every polynomial.
recalls: [m1.polynomials]
uses: [m1.variables-and-expressions, m1.linear-equations, m1.inequalities-and-absolute-value, m1.quadratics, m0.powers-and-roots, m0.fractions, m0.estimation-and-orders-of-magnitude, m0.negative-numbers, e0.expressions, e0.booleans-and-conditionals, e0.loops, e0.functions, e0.lists-and-tuples, e0.reading-errors-and-debugging]
leads: [m1.logarithms]
starter: |
  # Scratch space. What does a fractional exponent do?
  print(9 ** 0.5, 8 ** (1 / 3), 16 ** 0.25)
  print(2 ** 0.5 * 2 ** 0.5)
parts:
  recall:
    - text: |
        In [[m1.polynomials]] you multiplied terms by adding exponents, $x^2 \times x^3 = x^5$, and saw that the degree of a product is the sum of the degrees. Today that one rule is pushed as far as it will go. Two quick pulls first.
  puzzle:
    - text: |
        Several lessons ago you were handed a piece of magic and asked to accept it for the time being: in Python, a square root can be written as a power of one half.

        ```python
        print(9 ** 0.5)
        print(2 ** 0.5)
        ```

        This shows 3.0 and 1.4142135623730951.

        But what could it **mean**? You learnt that $9^2$ is two nines multiplied together, and $9^3$ is three. On that reading $9^{0.5}$ is half a nine multiplied together, which is nonsense. One cannot write down half a factor.

        And yet Python does not complain, and the answer is not arbitrary. It is exactly the square root. Nobody **decided** that a half should mean a root. In arithmetic you saw that the meanings of $a^0$ and $a^{-n}$ were forced by demanding that a rule keep working.

        **Is the meaning of $9^{1/2}$ forced in the same way? And if so, by which rule?**
  intuition:
    - text: |
        Recall how the zero exponent got its meaning. "No copies of $a$ multiplied together" says nothing by itself. But the rule for multiplying powers, exponents add, was too good to give up. Demanding that it hold for an exponent of 0 gave $a^0 \times a^n = a^n$, and only one number leaves $a^n$ unchanged when it multiplies it. So $a^0$ had to be 1.

        This is the pattern of the whole lesson. An exponent starts life as a count of copies. Counting makes sense only for 1, 2, 3 and so on. To give meaning to any other exponent, do not ask what it would mean to count. Ask what value would **keep the laws true**. Each time, there turns out to be exactly one candidate.

        Try it on the puzzle. Whatever $9^{1/2}$ is, call it $r$. If exponents are to go on adding, then

        $$r \times r = 9^{1/2} \times 9^{1/2} = 9^{1/2 + 1/2} = 9^1 = 9.$$

        So $r$ is a number whose square is 9. That is the definition of a square root. The rule left no choice: **the power one half is the square root.**

        Step the exponent below one at a time. Each step right multiplies by ten and each step left divides by ten, straight through zero and into the negatives, with no break. A half sits between 0 and 1 on that slider, and its value, $10^{1/2}$, should sit between 1 and 10 in the same multiplying sense: the number that, applied twice, takes you the whole step from 1 to 10. That number is $\sqrt{10}$, about 3.16.
    - figure: powers-of-ten
      props: { start: 1 }
  derivation:
    - text: |
        **The laws for whole exponents.** For a whole number $n \geq 1$, $a^n$ means $n$ copies of $a$ multiplied together. Everything follows from counting copies.

        *Multiplying powers of the same base.* $a^m \times a^n$ is $m$ copies followed by $n$ more:

        $$a^m \times a^n = a^{m + n}.$$

        *Dividing powers of the same base.* Each copy below cancels one above:

        $$\frac{a^5}{a^2} = \frac{a \times a \times a \times a \times a}{a \times a} = a^3, \qquad\text{in general}\qquad \frac{a^m}{a^n} = a^{m - n}.$$

        *A power of a power.* $(a^2)^3$ is three copies of $a^2$, which is $a^2 \times a^2 \times a^2 = a^6$. There are 3 groups of 2 copies:

        $$(a^m)^n = a^{mn}.$$

        *A power of a product, and of a quotient.* $(ab)^3 = ab \times ab \times ab$, and since order does not matter in multiplication the $a$'s and $b$'s can be gathered:

        $$(ab)^n = a^n b^n, \qquad \left(\frac{a}{b}\right)^n = \frac{a^n}{b^n}.$$

        Keep the first and third laws apart. **Multiplying** powers **adds** exponents: $x^2 \times x^3 = x^5$. **Raising** a power to a power **multiplies** them: $(x^2)^3 = x^6$.

        **What the laws do not say.** There is no law for a **sum** of powers. $a^2 + a^3$ cannot be simplified, and $(a + b)^2$ is not $a^2 + b^2$, as you know. The laws concern multiplication only. Nor does anything combine powers with **different bases and different exponents**: $2^3 \times 5^2$ is just 200.

        **Zero and negative exponents.** You derived these in arithmetic. Put $m = n$ in the division law: $\frac{a^n}{a^n} = a^0$, and a number divided by itself is 1. Put $m = 0$: $\frac{1}{a^n} = a^{-n}$.

        $$a^0 = 1, \qquad a^{-n} = \frac{1}{a^n} \qquad (a \neq 0).$$

        A negative exponent means a reciprocal. It never makes the value negative. With these, all five laws hold for every integer exponent, and they let an expression be tidied in whichever direction is convenient:

        $$\frac{6x^5 y^2}{2x^2 y^3} = 3x^{5 - 2}y^{2 - 3} = 3x^3 y^{-1} = \frac{3x^3}{y}.$$
    - question:
        id: simplify-mixed
        type: choice
        system: s2
        prompt: "Simplify $\\dfrac{(2x^3)^2}{4x^{-1}}$."
        options: ["$x^5$", "$x^7$", "$\\dfrac{x^6}{2}$", "$x^4$"]
        answer: 1
        explanation: "The power of a product gives $(2x^3)^2 = 2^2 x^6 = 4x^6$. Dividing, $\\dfrac{4x^6}{4x^{-1}} = x^{6 - (-1)} = x^7$. Check with $x = 2$: the top is $(16)^2 = 256$, the bottom is $4 \\times \\frac{1}{2} = 2$, and $256 \\div 2 = 128 = 2^7$."
        hints:
          - Square everything inside the bracket, the 2 included.
          - A power of a power multiplies the exponents.
          - Dividing subtracts exponents, and subtracting a negative adds.
    - text: |
        **Fractional exponents.** Now the puzzle, in general. What must $a^{1/n}$ be? Use the power-of-a-power law:

        $$\left(a^{1/n}\right)^n = a^{\frac{1}{n} \times n} = a^1 = a.$$

        So $a^{1/n}$ is a number whose $n$th power is $a$. That is the **$n$th root**:

        $$a^{1/2} = \sqrt{a}, \qquad a^{1/3} = \sqrt[3]{a}, \qquad a^{1/n} = \sqrt[n]{a}.$$

        For example $8^{1/3} = 2$, because $2^3 = 8$. For a positive $a$ there are two numbers whose square is $a$, and by convention $a^{1/2}$ means the positive one.

        What about a fraction with a numerator other than 1? Since $\frac{m}{n} = \frac{1}{n} \times m$, the same law gives

        $$a^{m/n} = \left(a^{1/n}\right)^m = \left(\sqrt[n]{a}\right)^m.$$

        **Root first, then power**, because the root makes the number smaller and the arithmetic easier:

        $$8^{2/3} = \left(8^{1/3}\right)^2 = 2^2 = 4, \qquad 16^{-3/4} = \frac{1}{\left(16^{1/4}\right)^3} = \frac{1}{2^3} = \frac{1}{8}.$$

        Read a fractional exponent in three parts: the **denominator** is a root, the **numerator** is a power, and a **minus sign** is a reciprocal.

        The laws of exponents hold for these too, which makes roots much easier to handle. The awkward-looking $\sqrt{x} \times \sqrt[3]{x}$ is just $x^{1/2} \times x^{1/3} = x^{5/6}$.

        One restriction. Fractional powers are safe only for a **positive** base. $(-4)^{1/2}$ would be a number whose square is $-4$, and you know there is none on the number line. This is what Python was hinting at when it returned something strange for `(-4) ** 0.5`.

        **Any exponent at all.** What is $2^{1.5}$? It is $2^{3/2} = (\sqrt{2})^3$, about 2.83. And $2^{1.41}$ is $2^{141/100}$, the hundredth root of 2 raised to the 141st power, a perfectly definite number. Any decimal exponent is a fraction, so it has a meaning. As the exponent slides smoothly from 1 to 2, the value $2^x$ slides smoothly from 2 to 4. The gaps between the whole-number powers have been filled in, and $2^x$ has become a smooth curve defined for every $x$. That is what lets `**` accept a float.

        **Exponential growth.** Now compare two ways of growing. In $x^2$, the variable is the base. In $2^x$, the variable is the **exponent**.

        | $x$ | 1 | 2 | 5 | 10 | 20 | 30 |
        | --- | --- | --- | --- | --- | --- | --- |
        | $x^2$ | 1 | 4 | 25 | 100 | 400 | 900 |
        | $2^x$ | 2 | 4 | 32 | 1024 | 1048576 | 1073741824 |

        They start level and then part company for ever. The reason is in how each responds to one more step. Going from $x$ to $x + 1$ **adds** to a polynomial: $x^2$ goes up by $2x + 1$. The same step **multiplies** an exponential: $2^{x + 1} = 2 \times 2^x$, by the first law. Adding a fixed amount to the input multiplies the output by a fixed factor. A quantity that doubles at every step is said to grow **exponentially**, and no polynomial, of any degree, can keep up with it in the end.

        A rule of thumb worth memorising: $2^{10} = 1024$, which is about $10^3$. So every ten doublings is roughly a thousandfold. Twenty doublings make a million, thirty a billion.

        When the base is between 0 and 1 the same law gives exponential **decay**: $\left(\frac{1}{2}\right)^x$ halves at each step, shrinking towards zero without ever reaching it.
    - question:
        id: fix-fast-power
        type: code
        mode: find-bug
        system: s2
        prompt: |
          The law $(a^m)^n = a^{mn}$ gives a fast way to compute a large power: $a^{16} = \big(\big((a^2)^2\big)^2\big)^2$ takes 4 squarings instead of 15 multiplications. `fast_power(a, n)` uses it for any whole number `n` that is 0 or more: while `n` is positive, if `n` is odd it multiplies one copy of `a` into the result, and then it squares `a` and halves `n`. It gives the right answer for $2^8$ and the wrong answer, 16, for $2^5$. Trace `result`, `a` and `n` by hand for $2^5$, find the line that is wrong, and fix it.
        starter: |
          def fast_power(a, n):
              result = 1
              while n > 0:
                  if n % 2 == 1:
                      result = a
                  a = a * a
                  n = n // 2
              return result

          print(fast_power(2, 8))
          print(fast_power(2, 5))
        solution: |
          def fast_power(a, n):
              result = 1
              while n > 0:
                  if n % 2 == 1:
                      result = result * a
                  a = a * a
                  n = n // 2
              return result

          print(fast_power(2, 8))
          print(fast_power(2, 5))
        tests: |
          assert fast_power(2, 8) == 256, "2 to the power 8 is 256"
          assert fast_power(2, 5) == 32, "2 to the power 5 is 32. Trace it: 5 is odd, then 2 is even, then 1 is odd. What should happen to result at each odd step?"
          assert fast_power(3, 4) == 81, "3 to the power 4 is 81"
          assert fast_power(7, 0) == 1, "Any number to the power 0 is 1"
          assert fast_power(7, 1) == 7, "Any number to the power 1 is itself"
          assert fast_power(2, 10) == 1024, "2 to the power 10 is 1024"
          assert fast_power(3, 7) == 2187, "3 to the power 7 is 2187"
          assert fast_power(2, 100) == 2 ** 100, "It should work for a large exponent"
        wrong:
          - "def fast_power(a, n):\n    result = 1\n    while n > 0:\n        if n % 2 == 1:\n            result = result + a\n        a = a * a\n        n = n // 2\n    return result\n\nprint(fast_power(2, 5))\n"
          - "def fast_power(a, n):\n    result = 1\n    while n > 0:\n        if n % 2 == 0:\n            result = result * a\n        a = a * a\n        n = n // 2\n    return result\n\nprint(fast_power(2, 5))\n"
          - "def fast_power(a, n):\n    result = 1\n    while n > 1:\n        if n % 2 == 1:\n            result = result * a\n        a = a * a\n        n = n // 2\n    return result\n\nprint(fast_power(2, 5))\n"
        explanation: "At an odd step one copy of the current `a` must be multiplied **into** the result, not replace it. For $2^5$: `result` becomes 2, `a` becomes 4 and then 16, and at the last step `result` should become $2 \\times 16 = 32$. This is $2^5 = 2^1 \\times 2^4$, the first law at work. The method reaches $2^{100}$ in seven squarings."
        hints:
          - Make a table of result, a and n after each time round the loop, for 2 to the power 5.
          - The result is an accumulator for a product. How is a product accumulator updated?
          - Which line replaces the result where it should multiply into it?
  formal:
    - text: |
        For $a > 0$, the power $a^x$ is defined in stages:

        | Exponent | Definition |
        | --- | --- |
        | whole number $n \geq 1$ | $a^n = a \times a \times \dots \times a$, with $n$ factors |
        | zero | $a^0 = 1$ |
        | negative integer | $a^{-n} = \dfrac{1}{a^n}$ |
        | unit fraction | $a^{1/n} = \sqrt[n]{a}$, the positive number whose $n$th power is $a$ |
        | any fraction | $a^{m/n} = \left(\sqrt[n]{a}\right)^m$ |

        Each stage is the only definition for which the following laws remain true. For $a, b > 0$ and all rational exponents $x$ and $y$:

        | Law | Statement |
        | --- | --- |
        | Product | $a^x a^y = a^{x + y}$ |
        | Quotient | $\dfrac{a^x}{a^y} = a^{x - y}$ |
        | Power of a power | $(a^x)^y = a^{xy}$ |
        | Power of a product | $(ab)^x = a^x b^x$ |
        | Power of a quotient | $\left(\dfrac{a}{b}\right)^x = \dfrac{a^x}{b^x}$ |

        For zero and negative integer exponents the base may be any non-zero number. For fractional exponents the base is taken positive.

        There is no corresponding law for $a^x + a^y$ or for $(a + b)^x$.

        **Monotonicity.** If $a > 1$, then $x < y$ implies $a^x < a^y$: the larger exponent gives the larger power. If $0 < a < 1$, the order is reversed. In either case, $a^x = a^y$ only when $x = y$.

        An **exponential** expression in $x$ has the form $c \, a^x$ with $a > 0$ and $a \neq 1$. Increasing $x$ by 1 multiplies it by $a$. For $a > 1$ it eventually exceeds every polynomial in $x$.
  drill:
    - text: Seconds each. Say which law you are using.
    - question:
        id: drill-product
        type: choice
        system: s1
        prompt: "Simplify $x^4 \\times x^3$."
        options: ["$x^{12}$", "$x^7$", "$2x^7$", "$x^1$"]
        answer: 1
        explanation: Multiplying powers of the same base adds the exponents.
        hints:
          - Four copies followed by three more.
          - Add the exponents.
    - question:
        id: drill-power-of-power
        type: choice
        system: s1
        prompt: "Simplify $(x^4)^3$."
        options: ["$x^{12}$", "$x^7$", "$x^{64}$", "$3x^4$"]
        answer: 0
        explanation: Three groups of four copies. A power of a power multiplies the exponents.
        hints:
          - Three copies of x to the fourth.
          - Multiply the exponents.
    - question:
        id: drill-quotient
        type: choice
        system: s1
        prompt: "Simplify $\\dfrac{x^3}{x^7}$."
        options: ["$x^4$", "$x^{-4}$", "$x^{10}$", "$-x^4$"]
        answer: 1
        explanation: "Dividing subtracts exponents: $3 - 7 = -4$. It equals $\\dfrac{1}{x^4}$."
        hints:
          - Subtract the bottom exponent from the top.
          - The result is a reciprocal, not a negative number.
    - question:
        id: drill-negative
        type: numeric
        system: s1
        prompt: "What is $2^{-3}$? Give an exact answer."
        answer: "1/8"
        explanation: "$\\dfrac{1}{2^3}$."
        hints:
          - A negative exponent means a reciprocal.
          - One over two cubed.
    - question:
        id: drill-half
        type: numeric
        system: s1
        prompt: "What is $49^{1/2}$?"
        answer: "7"
        explanation: The power one half is the square root.
        hints:
          - Which number squared gives 49?
          - The denominator 2 is a square root.
    - question:
        id: drill-third
        type: numeric
        system: s1
        prompt: "What is $27^{1/3}$?"
        answer: "3"
        explanation: "The cube root: $3^3 = 27$."
        hints:
          - Which number cubed gives 27?
          - The denominator 3 is a cube root.
    - question:
        id: drill-two-thirds
        type: numeric
        system: s1
        prompt: "What is $27^{2/3}$?"
        answer: "9"
        explanation: "Root first: $27^{1/3} = 3$. Then the power: $3^2 = 9$."
        hints:
          - Take the cube root first.
          - Then square.
    - question:
        id: drill-product-power
        type: choice
        system: s1
        prompt: "Simplify $(3x)^2$."
        options: ["$3x^2$", "$6x^2$", "$9x^2$", "$9x$"]
        answer: 2
        explanation: The power applies to every factor in the bracket, the 3 included.
        hints:
          - Both the 3 and the x are squared.
          - Three squared is nine.
    - question:
        id: predict-powers
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(2 ** 3 * 2 ** 2, (2 ** 3) ** 2, 4 ** -1)
        output: "32 64 0.25"
        explanation: "$2^3 \\times 2^2 = 2^5$, $(2^3)^2 = 2^6$, and $4^{-1} = \\frac{1}{4}$."
        hints:
          - Multiplying adds exponents. A power of a power multiplies them.
          - A negative exponent is a reciprocal.
  work:
    - text: Slower now. Check each simplification by putting a small number in for the variable on both sides.
    - question:
        id: work-simplify-fractional
        type: choice
        system: s2
        prompt: "Simplify $\\dfrac{\\sqrt{x} \\times x^2}{x^{-1/2}}$ for $x > 0$."
        options: ["$x^2$", "$x^3$", "$x^{5/2}$", "$x^{3/2}$"]
        answer: 1
        explanation: "$\\sqrt{x} = x^{1/2}$. The top is $x^{1/2 + 2} = x^{5/2}$. Dividing by $x^{-1/2}$ subtracts $-\\frac{1}{2}$: $\\frac{5}{2} + \\frac{1}{2} = 3$. Check with $x = 4$: the top is $2 \\times 16 = 32$, the bottom is $\\frac{1}{2}$, and $32 \\div \\frac{1}{2} = 64 = 4^3$."
        hints:
          - Write the square root as a power.
          - Add the exponents on top, then subtract the one below.
          - Subtracting a negative adds.
    - question:
        id: work-solve-exponent
        type: numeric
        system: s2
        prompt: "Solve $2^{3x - 1} = 32$. Write 32 as a power of 2, and use the fact that equal powers of the same base have equal exponents."
        answer: "2"
        explanation: "$32 = 2^5$, so $3x - 1 = 5$, giving $x = 2$. Check: $2^{6 - 1} = 2^5 = 32$."
        hints:
          - 32 is 2 to which power?
          - If 2 to one exponent equals 2 to another, the exponents are equal.
          - Solve the linear equation that results.
    - question:
        id: write-nth-root
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `power(a, m, n)` that returns $a^{m/n}$ for a positive number `a`, an integer `m` and a positive whole number `n`, computed as the lesson recommends: the $n$th root first, then the $m$th power. Then write a function `check_law(a, x, y)` that returns True exactly when $a^x \times a^y$ and $a^{x + y}$ agree to within 0.000001, so that the product law can be tested on fractional exponents.
        starter: |
          def power(a, m, n):
              # Replace the next line with your own.
              return 0

          def check_law(a, x, y):
              # Replace the next line with your own.
              return False

          print(power(8, 2, 3))
          print(check_law(2, 0.5, 0.5))
        solution: |
          def power(a, m, n):
              root = a ** (1 / n)
              return root ** m

          def check_law(a, x, y):
              return abs(a ** x * a ** y - a ** (x + y)) < 0.000001

          print(power(8, 2, 3))
          print(check_law(2, 0.5, 0.5))
        tests: |
          assert abs(power(8, 2, 3) - 4) < 1e-9, "8 to the power 2/3 is the cube root of 8, squared, which is 4"
          assert abs(power(9, 1, 2) - 3) < 1e-9, "9 to the power 1/2 is 3"
          assert abs(power(16, -3, 4) - 0.125) < 1e-9, "16 to the power -3/4 is 1 over 2 cubed, which is 0.125"
          assert abs(power(5, 0, 7) - 1) < 1e-9, "Any positive number to the power 0 is 1"
          assert abs(power(32, 3, 5) - 8) < 1e-9, "32 to the power 3/5 is the fifth root of 32, cubed, which is 8"
          assert check_law(2, 0.5, 0.5) == True, "2 to the 0.5 times 2 to the 0.5 is 2 to the 1"
          assert check_law(3, 1.5, -0.25) == True, "The product law holds for every pair of exponents"
          assert check_law(10, 2, 3) == True, "The product law holds for whole exponents too"
        wrong:
          - "def power(a, m, n):\n    return a ** m / n\n\ndef check_law(a, x, y):\n    return abs(a ** x * a ** y - a ** (x + y)) < 0.000001\n"
          - "def power(a, m, n):\n    return a ** (n / m)\n\ndef check_law(a, x, y):\n    return abs(a ** x * a ** y - a ** (x + y)) < 0.000001\n"
          - "def power(a, m, n):\n    root = a ** (1 / n)\n    return root ** m\n\ndef check_law(a, x, y):\n    return abs(a ** x * a ** y - a ** (x * y)) < 0.000001\n"
        explanation: "The denominator of the exponent is a root, written `** (1 / n)` with brackets, since without them `a ** 1 / n` would raise to the power 1 and then divide. The numerator is then an ordinary power. Floats are compared with a tolerance."
        hints:
          - The nth root is the power 1/n. Mind the brackets round the fraction.
          - Then raise the root to the power m.
          - For the law, compare the two sides with an absolute difference.
    - question:
        id: write-doublings
        type: code
        mode: write
        system: s2
        prompt: |
          A quantity grows by a fixed factor at every step. Write a function `steps_to_exceed(start, factor, target)` that returns how many steps are needed before the quantity first **exceeds** `target`, where `start` is positive and `factor` is greater than 1. Then bind `polynomial_wins_until` to the largest whole number $n \geq 1$ for which $n^3 > 2^n$, found with a loop over $n$ from 1 to 50.
        starter: |
          def steps_to_exceed(start, factor, target):
              # Replace the next line with your own.
              return 0

          polynomial_wins_until = 0
        solution: |
          def steps_to_exceed(start, factor, target):
              steps = 0
              value = start
              while value <= target:
                  value *= factor
                  steps += 1
              return steps

          polynomial_wins_until = 0
          for n in range(1, 51):
              if n ** 3 > 2 ** n:
                  polynomial_wins_until = n
        tests: |
          assert steps_to_exceed(1, 2, 1000) == 10, "Starting at 1 and doubling, the value first exceeds 1000 after 10 steps, at 1024"
          assert steps_to_exceed(1, 2, 1024) == 11, "1024 does not exceed 1024, so one more doubling is needed"
          assert steps_to_exceed(5, 2, 3) == 0, "A quantity already above the target needs no steps"
          assert steps_to_exceed(100, 1.1, 200) == 8, "Growing by 10 percent a step, 100 first exceeds 200 after 8 steps"
          assert steps_to_exceed(1, 10, 999999) == 6, "Six tenfold steps reach a million"
          assert polynomial_wins_until == 9, "Compare n cubed with 2 to the n for each n. At n = 9 they are 729 and 512. At n = 10 they are 1000 and 1024."
        wrong:
          - "def steps_to_exceed(start, factor, target):\n    steps = 0\n    value = start\n    while value < target:\n        value *= factor\n        steps += 1\n    return steps\n\npolynomial_wins_until = 9\n"
          - "def steps_to_exceed(start, factor, target):\n    steps = 0\n    value = start\n    while value <= target:\n        value += factor\n        steps += 1\n    return steps\n\npolynomial_wins_until = 9\n"
          - "def steps_to_exceed(start, factor, target):\n    steps = 0\n    value = start\n    while value <= target:\n        value *= factor\n        steps += 1\n    return steps\n\npolynomial_wins_until = 10\n"
        explanation: "Exponential growth is repeated multiplication, so the loop multiplies and counts. The cubic $n^3$ leads from $n = 2$ to $n = 9$, and from $n = 10$ onwards $2^n$ is ahead for good, since each further step doubles it while $n^3$ grows by an ever smaller proportion."
        hints:
          - Keep going while the value has not yet exceeded the target. What is the opposite of exceeds?
          - Each step multiplies the value. It does not add to it.
          - For the comparison, remember the last n at which the cubic was the larger.
    - question:
        id: fix-scientific
        type: code
        mode: find-bug
        system: s2
        prompt: |
          Two numbers are given in scientific notation as a front number and an exponent of ten, so `(3.0, 4)` stands for $3.0 \times 10^4$. `multiply(a, b)` should return their product in the same form, before any adjustment of the front number. For $(3.0 \times 10^4) \times (2.0 \times 10^5)$ it should return `(6.0, 9)`, but it returns `(6.0, 20)`. Decide which law of exponents applies, and fix it.
        starter: |
          def multiply(a, b):
              front_a, exp_a = a
              front_b, exp_b = b
              return (front_a * front_b, exp_a * exp_b)

          print(multiply((3.0, 4), (2.0, 5)))
        solution: |
          def multiply(a, b):
              front_a, exp_a = a
              front_b, exp_b = b
              return (front_a * front_b, exp_a + exp_b)

          print(multiply((3.0, 4), (2.0, 5)))
        tests: |
          assert multiply((3.0, 4), (2.0, 5)) == (6.0, 9), "3 x 10^4 times 2 x 10^5 is 6 x 10^9. When powers of ten are multiplied, what happens to the exponents?"
          assert multiply((1.5, 2), (2.0, -2)) == (3.0, 0), "10^2 times 10^-2 is 10^0"
          assert multiply((2.0, 0), (4.0, 3)) == (8.0, 3), "10^0 times 10^3 is 10^3"
          assert multiply((1.0, -3), (1.0, -4)) == (1.0, -7), "10^-3 times 10^-4 is 10^-7"
        wrong:
          - "def multiply(a, b):\n    front_a, exp_a = a\n    front_b, exp_b = b\n    return (front_a + front_b, exp_a + exp_b)\n\nprint(multiply((3.0, 4), (2.0, 5)))\n"
          - "def multiply(a, b):\n    front_a, exp_a = a\n    front_b, exp_b = b\n    return (front_a * front_b, exp_a - exp_b)\n\nprint(multiply((3.0, 4), (2.0, 5)))\n"
        explanation: "$10^4 \\times 10^5 = 10^9$. Multiplying powers of the same base adds the exponents. Multiplying the exponents would be right for a power of a power, $(10^4)^5 = 10^{20}$, which is a different thing."
        hints:
          - How many tens are multiplied together in 10^4 times 10^5?
          - Which law multiplies exponents, and which adds them?
    - question:
        id: thousand-rule
        type: numeric
        system: s2
        prompt: |
          Using the rule of thumb $2^{10} \approx 10^3$, a model with $2^{40}$ parameters has roughly $10^n$ parameters. What is $n$?
        answer: "12"
        explanation: "$2^{40} = (2^{10})^4 \\approx (10^3)^4 = 10^{12}$, by the power-of-a-power law. About a trillion."
        hints:
          - Write 2 to the 40 as a power of 2 to the 10.
          - A power of a power multiplies the exponents.
    - question:
        id: why-half-is-root
        type: choice
        system: s2
        prompt: "Why must $a^{1/2}$ equal $\\sqrt{a}$, for a positive $a$?"
        options:
          - "It is a notation that mathematicians agreed on, with no deeper reason."
          - "Because half of a is its root."
          - "Because if the law $a^x a^y = a^{x+y}$ is to hold, then $a^{1/2} \\times a^{1/2} = a^1 = a$, so $a^{1/2}$ is a number whose square is $a$."
          - "Because Python computes it that way."
        answer: 2
        explanation: The meaning is forced by requiring the product law to continue to hold. A number that multiplied by itself gives $a$ is, by definition, a square root of $a$.
        hints:
          - What happens when a to the half is multiplied by itself?
          - Which law says what to do with the exponents?
  connections:
    - text: |
        An exponent began as a count of copies and has become any number you like, each extension forced by the wish to keep five laws true. This way of growing mathematics, by asking what a new thing **must** mean for the old rules to survive, is the same one that gave you negative numbers, and it will give you one more new kind of number before this cluster ends.

        Exponentials are everywhere in machine learning, and so is the need to respect them. The step size of training is tuned on a scale of powers of ten. The cost of trying every combination of $n$ yes-or-no choices is $2^n$, which is why brute force fails so quickly and why the fast-power trick, which gets by on a number of steps equal to the count of **doublings**, is so striking. A model's output is turned into probabilities by a formula built from exponentials. And computer memory itself is counted in powers of two, which is where the rule $2^{10} \approx 10^3$ earns its keep.

        The contrast between polynomial and exponential growth is the dividing line of computer science. Roughly, a problem whose cost grows polynomially with its size is tractable, and one whose cost grows exponentially is not. You will meet this again when you study the cost of algorithms.

        One thing is conspicuously missing. You can solve $2^x = 32$, because 32 happens to be a power of 2. But what is $x$ if $2^x = 20$? The answer lies somewhere between 4 and 5, and nothing you know will find it. Every operation so far has had an undoing: subtraction for addition, division for multiplication, roots for powers with a known exponent. The undoing that finds an unknown **exponent** is the subject of the next lesson: [[m1.logarithms]].
