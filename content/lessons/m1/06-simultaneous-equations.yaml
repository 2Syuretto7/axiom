concept: m1.simultaneous-equations
minutes: 100
claim: You can solve two linear equations in two unknowns by substitution and by elimination, interpret the solution as the crossing point of two lines, and recognise when there is no solution or infinitely many.
recalls: [m1.straight-lines-and-slope]
uses: [m1.variables-and-expressions, m1.linear-equations, m1.coordinates-and-the-plane, m0.fractions, m0.negative-numbers, e0.expressions, e0.booleans-and-conditionals, e0.loops, e0.functions, e0.lists-and-tuples, e0.reading-errors-and-debugging]
leads: [m1.quadratics]
starter: |
  # Scratch space. Does the pair (2, 3) satisfy both equations?
  x, y = 2, 3
  print(x + y == 5, x - y == -1)
parts:
  recall:
    - text: |
        In [[m1.straight-lines-and-slope]] a line became two numbers, a slope and an intercept, and parallel lines were the ones with equal slopes. Today two lines are on the page at once. Two quick pulls first.
    - question:
        id: recall-slope
        type: numeric
        system: s1
        concepts: [m1.straight-lines-and-slope]
        prompt: "What is the slope of the line through $(2, 1)$ and $(6, 9)$?"
        answer: "2"
        explanation: "Rise $9 - 1 = 8$, run $6 - 2 = 4$."
        hints:
          - Rise over run.
          - Eight over four.
    - question:
        id: recall-parallel
        type: choice
        system: s1
        concepts: [m1.straight-lines-and-slope]
        prompt: "Which pair of lines is parallel?"
        options:
          - "$y = 2x + 1$ and $y = -2x + 1$"
          - "$y = 2x + 1$ and $y = 2x - 5$"
          - "$y = 2x + 1$ and $y = \\frac{1}{2}x + 1$"
          - "$y = x + 2$ and $y = 2x + 2$"
        answer: 1
        explanation: Parallel lines have the same slope and different intercepts.
        hints:
          - Read off the slope of each line.
          - Which pair shares a slope?
  puzzle:
    - text: |
        A stall sells samosas and cups of tea. One customer buys 2 samosas and 1 tea and pays 40 rupees. The next buys 1 samosa and 3 teas and pays 45 rupees. What does a samosa cost?

        Write $s$ for the price of a samosa and $t$ for the price of a tea. The first customer tells you

        $$2s + t = 40.$$

        This is one equation with two unknowns, and by itself it settles nothing. A samosa at 15 with tea at 10 fits. So does a samosa at 10 with tea at 20, or a samosa at 19 with tea at 2. As you saw two lessons ago, the solutions of such an equation are a whole line of pairs.

        The second customer gives another equation, $s + 3t = 45$, with a line of solutions of its own.

        Neither customer alone reveals the prices. Yet the prices are whatever they are, the same for both customers. **How do you find the one pair of numbers that satisfies two equations at the same time?**
  intuition:
    - text: |
        Each equation, taken alone, is satisfied by all the points of a line. A pair that satisfies **both** equations is a point lying on **both** lines. Two different straight lines can share at most one point: the place where they cross.

        So the answer to the puzzle is a crossing point, and that picture tells you what to expect before any algebra is done.

        The figure shows two lines. One is fixed. Steer the other, and watch what happens to the crossing point. Then try to make the two slopes equal.
    - figure: plane-lines
      props: { slope: 1, intercept: 1, otherSlope: -1, otherIntercept: 5 }
    - text: |
        You will have found three situations, and there are no others.

        - The lines **cross once**. One pair satisfies both equations.
        - The lines are **parallel**. They never meet, and no pair satisfies both.
        - The lines are **the same line**. Every point of it satisfies both.

        A picture shows that a solution exists and roughly where. It cannot give the solution exactly: a crossing at $(1.37, 2.63)$ cannot be read off a sketch. For that you need a way to compute, and the idea behind every such way is the same. You know how to solve an equation with **one** unknown. So combine the two equations to make a new equation in which one of the unknowns has disappeared.
  derivation:
    - text: |
        Two equations that are to hold together are called **simultaneous equations**, or a **system**. A **solution** of the system is a pair of values that makes every equation true.

        **Method 1: substitution.** Solve one equation for one unknown, and substitute the result into the other. Take the stall.

        $$\begin{aligned} 2s + t &= 40 && (1) \\ s + 3t &= 45 && (2) \end{aligned}$$

        Equation (1) gives $t$ at once: $t = 40 - 2s$. This says that whatever $s$ is, $t$ must be $40 - 2s$. So wherever $t$ appears in equation (2), write $40 - 2s$ in its place:

        $$\begin{aligned} s + 3(40 - 2s) &= 45 \\ s + 120 - 6s &= 45 \\ -5s &= -75 \\ s &= 15. \end{aligned}$$

        One unknown is found. Go back for the other: $t = 40 - 2 \times 15 = 10$. A samosa costs 15 rupees and a tea 10.

        **Check in both equations.** $2 \times 15 + 10 = 40$ and $15 + 3 \times 10 = 45$. Checking in only one proves little, since that equation has a whole line of solutions. A pair that satisfies one but not the other is on one line and off the other.

        **Method 2: elimination.** The balance principle says you may add the same thing to both sides of an equation. If $A = B$ and $C = D$, then $C$ and $D$ are the same thing, so

        $$A + C = B + D.$$

        **Two equations can be added, left side to left and right to right**, or subtracted. This is useful when adding makes an unknown cancel.

        $$\begin{aligned} x + y &= 5 && (1) \\ x - y &= -1 && (2) \end{aligned}$$

        Add them. The $y$ and the $-y$ cancel: $2x = 4$, so $x = 2$. Then from (1), $y = 3$.

        Usually nothing cancels at first, and you must arrange it by multiplying an equation through by a suitable number, which is another permitted move.

        $$\begin{aligned} 3x + 2y &= 16 && (1) \\ 5x - 3y &= 1 && (2) \end{aligned}$$

        To eliminate $y$, make its coefficients opposite. Multiply (1) by 3 and (2) by 2:

        $$\begin{aligned} 9x + 6y &= 48 \\ 10x - 6y &= 2 \end{aligned}$$

        Add: $19x = 50$, so $x = \frac{50}{19}$. The solution is not a whole number, and no sketch would have found it. Substituting back, $2y = 16 - \frac{150}{19} = \frac{154}{19}$, so $y = \frac{77}{19}$.

        **Which method?** Use substitution when an unknown already stands alone, or nearly, as in $y = 2x + 1$. Use elimination when both equations are in the form $ax + by = c$. They always give the same answer, because both are sequences of moves that preserve the solutions.

        **Where two lines cross.** When both equations are in slope–intercept form, substitution takes a particularly simple shape. If $y = 3x + 199$ and $y = 5x + 99$, both right-hand sides equal the same $y$, so they equal each other:

        $$3x + 199 = 5x + 99, \qquad 100 = 2x, \qquad x = 50.$$

        Then $y = 349$. This is the phone-plan problem of three lessons ago. The boundary you found there with an inequality is the crossing point of the two cost lines.
    - question:
        id: solve-by-substitution
        type: numeric
        system: s2
        prompt: |
          Solve the system $y = 2x - 3$ and $3x + 2y = 15$. What is the value of $y$? Check your pair in both equations.
        answer: "3"
        explanation: "Substitute $2x - 3$ for $y$ in the second equation: $3x + 2(2x - 3) = 15$, so $7x - 6 = 15$ and $x = 3$. Then $y = 2 \\times 3 - 3 = 3$. Checks: $3 = 6 - 3$, and $9 + 6 = 15$."
        hints:
          - The first equation already gives y in terms of x.
          - Replace y in the second equation by that expression, in brackets.
          - After finding x, go back to the first equation for y.
    - text: |
        **When the method breaks down.** Try this system.

        $$\begin{aligned} 2x + y &= 4 \\ 4x + 2y &= 10 \end{aligned}$$

        Multiply the first equation by 2: $4x + 2y = 8$. Subtract it from the second. Both unknowns vanish together, leaving

        $$0 = 2.$$

        That is false, so there is **no solution**. You saw this ending for a single equation, and it means the same here. The picture explains it. In slope–intercept form the equations are $y = -2x + 4$ and $y = -2x + 5$: equal slopes, different intercepts. The lines are parallel.

        Change the 10 to 8 and the second equation is just twice the first. Subtracting leaves $0 = 0$, true for every pair on the line. There are **infinitely many solutions**, because the two equations describe the same line and the second customer has told you nothing new.

        **The general solution.** Write the system with letters for its numbers.

        $$\begin{aligned} ax + by &= e \\ cx + dy &= f \end{aligned}$$

        Eliminate $y$: multiply the first equation by $d$ and the second by $b$, and subtract.

        $$(ad - bc)\,x = ed - bf.$$

        Eliminate $x$ in the same way: multiply the first by $c$ and the second by $a$, and subtract the first from the second.

        $$(ad - bc)\,y = af - ec.$$

        The same number, $ad - bc$, multiplies the unknown both times. If it is not zero, divide by it:

        $$x = \frac{ed - bf}{ad - bc}, \qquad y = \frac{af - ec}{ad - bc}.$$

        If it **is** zero, the division is impossible, and you are in one of the two odd cases, parallel lines or the same line. So this one number, computed from the coefficients alone, decides whether the system has exactly one solution. It is called the **determinant** of the system. You will meet it again, much enlarged, in linear algebra.

        A formula is a function waiting to be written:

        ```python
        def solve(a, b, e, c, d, f):
            det = a * d - b * c
            return ((e * d - b * f) / det, (a * f - e * c) / det)

        print(solve(2, 1, 40, 1, 3, 45))
        ```

        This shows `(15.0, 10.0)`, the stall's prices.

        **From words to a system.** Name **each** unknown with its own letter and unit. Find two independent facts and turn each into an equation. Solve, and check against the story. As a rule, two unknowns need two equations, three need three, and so on. A model with a million unknown numbers needs at least a million pieces of information to pin them down, which is one reason machine learning needs so much data.
    - question:
        id: fix-elimination
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `solve(a, b, e, c, d, f)` should return the solution `(x, y)` of the system $ax + by = e$, $cx + dy = f$, and you may assume the determinant is not zero. For the stall, $2s + t = 40$ and $s + 3t = 45$, it should return `(15.0, 10.0)`. The value of `x` is right and the value of `y` is wrong. Derive the formula for $y$ on paper by eliminating $x$, compare, and fix the function.
        starter: |
          def solve(a, b, e, c, d, f):
              det = a * d - b * c
              x = (e * d - b * f) / det
              y = (e * c - a * f) / det
              return (x, y)

          x, y = solve(2, 1, 40, 1, 3, 45)
          print(x, y)
          print(2 * x + y == 40, x + 3 * y == 45)
        solution: |
          def solve(a, b, e, c, d, f):
              det = a * d - b * c
              x = (e * d - b * f) / det
              y = (a * f - e * c) / det
              return (x, y)

          x, y = solve(2, 1, 40, 1, 3, 45)
          print(x, y)
          print(2 * x + y == 40, x + 3 * y == 45)
        tests: |
          def _ok(a, b, e, c, d, f):
              _x, _y = solve(a, b, e, c, d, f)
              return abs(a * _x + b * _y - e) < 1e-9 and abs(c * _x + d * _y - f) < 1e-9
          assert _ok(2, 1, 40, 1, 3, 45), "For 2s + t = 40 and s + 3t = 45 the solution is (15, 10). Substitute the pair returned into both equations."
          assert _ok(1, 1, 5, 1, -1, -1), "For x + y = 5 and x - y = -1 the solution is (2, 3)"
          assert _ok(3, 2, 16, 5, -3, 1), "It should work when the solution is not a whole number"
          assert _ok(1, 0, 4, 0, 1, -7), "For x = 4 and y = -7 the solution is (4, -7)"
          assert _ok(0, 2, 6, 3, 1, 9), "It should work when a coefficient is zero"
        wrong:
          - "def solve(a, b, e, c, d, f):\n    det = a * d - b * c\n    x = (e * d - b * f) / det\n    y = (a * f + e * c) / det\n    return (x, y)\n\nx, y = solve(2, 1, 40, 1, 3, 45)\n"
          - "def solve(a, b, e, c, d, f):\n    det = a * d + b * c\n    x = (e * d - b * f) / det\n    y = (a * f - e * c) / det\n    return (x, y)\n\nx, y = solve(2, 1, 40, 1, 3, 45)\n"
          - "def solve(a, b, e, c, d, f):\n    return (15.0, 10.0)\n\nx, y = solve(2, 1, 40, 1, 3, 45)\n"
        explanation: "Multiply the first equation by $c$ and the second by $a$: $acx + bcy = ec$ and $acx + ady = af$. Subtracting the first from the second gives $(ad - bc)y = af - ec$. The starter had the numerator with its sign reversed, so $y$ came out as the opposite of its true value."
        hints:
          - The check on the last line of the program shows which equations fail.
          - Eliminate x on paper. Which equation is subtracted from which?
          - Compare the sign of your numerator with the one in the function.
  formal:
    - text: |
        A **system** of two linear equations in two unknowns is a pair

        $$\begin{aligned} ax + by &= e \\ cx + dy &= f \end{aligned}$$

        A **solution** is a pair $(x, y)$ satisfying both equations. Geometrically, it is a point common to the two lines.

        The following moves replace a system by one with exactly the same solutions:

        - multiplying both sides of an equation by a non-zero number;
        - adding a multiple of one equation to the other;
        - solving one equation for an unknown and substituting the result into the other.

        The number $ad - bc$ is the **determinant** of the system.

        | Determinant | The two lines | Solutions |
        | --- | --- | --- |
        | $ad - bc \neq 0$ | cross at one point | exactly one: $x = \dfrac{ed - bf}{ad - bc}$, $y = \dfrac{af - ec}{ad - bc}$ |
        | $ad - bc = 0$, equations inconsistent | are parallel | none |
        | $ad - bc = 0$, one equation a multiple of the other | coincide | infinitely many |

        Two lines $y = m_1 x + b_1$ and $y = m_2 x + b_2$ with $m_1 \neq m_2$ cross where $m_1 x + b_1 = m_2 x + b_2$, that is, at

        $$x = \frac{b_2 - b_1}{m_1 - m_2}.$$
  drill:
    - text: Seconds each. Look for the unknown that is easiest to remove.
    - question:
        id: drill-check-pair
        type: choice
        system: s1
        prompt: "Which pair $(x, y)$ satisfies both $x + y = 7$ and $x - y = 1$?"
        options: ["$(5, 2)$", "$(4, 3)$", "$(3, 4)$", "$(6, 1)$"]
        answer: 1
        explanation: "$4 + 3 = 7$ and $4 - 3 = 1$. The first option satisfies the first equation but not the second."
        hints:
          - A solution must satisfy both equations.
          - Test each pair in the second equation as well.
    - question:
        id: drill-add
        type: numeric
        system: s1
        prompt: "Given $x + y = 10$ and $x - y = 4$, add the two equations. What is $x$?"
        answer: "7"
        explanation: "Adding gives $2x = 14$."
        hints:
          - What happens to y when the equations are added?
          - Halve the result.
    - question:
        id: drill-then-y
        type: numeric
        system: s1
        prompt: "Given $x + y = 10$ and $x = 7$, what is $y$?"
        answer: "3"
        explanation: "$7 + y = 10$."
        hints:
          - Substitute 7 for x.
          - Solve for y.
    - question:
        id: drill-substitute
        type: numeric
        system: s1
        prompt: "Given $y = 2x$ and $x + y = 12$, what is $x$?"
        answer: "4"
        explanation: "Substituting, $x + 2x = 12$, so $3x = 12$."
        hints:
          - Replace y by 2x in the second equation.
          - Collect like terms.
    - question:
        id: drill-how-many
        type: choice
        system: s1
        prompt: "How many solutions has the system $y = 3x + 1$, $y = 3x + 4$?"
        options: ["None", "Exactly one", "Exactly two", "Infinitely many"]
        answer: 0
        explanation: Equal slopes and different intercepts. The lines are parallel and never meet.
        hints:
          - Compare the slopes.
          - Compare the intercepts.
    - question:
        id: drill-same-line
        type: choice
        system: s1
        prompt: "How many solutions has the system $x + y = 3$, $2x + 2y = 6$?"
        options: ["None", "Exactly one", "Exactly two", "Infinitely many"]
        answer: 3
        explanation: The second equation is the first multiplied by 2. They describe the same line, and every point of it is a solution.
        hints:
          - Multiply the first equation by 2.
          - Does the second equation say anything new?
    - question:
        id: drill-determinant
        type: numeric
        system: s1
        prompt: "What is the determinant $ad - bc$ of the system $3x + 2y = 1$, $4x + 5y = 2$?"
        answer: "7"
        explanation: "$3 \\times 5 - 2 \\times 4 = 15 - 8$."
        hints:
          - Here a = 3, b = 2, c = 4 and d = 5.
          - Multiply the corners and subtract.
    - question:
        id: drill-multiplier
        type: choice
        system: s1
        prompt: "To eliminate $x$ from $2x + 3y = 7$ and $6x - y = 1$ by subtracting, the first equation should be multiplied by which number?"
        options: ["2", "3", "6", "$-1$"]
        answer: 1
        explanation: "Multiplying by 3 gives $6x + 9y = 21$, whose $x$ term matches the second equation's."
        hints:
          - The coefficients of x must be made equal.
          - Two times what gives six?
    - question:
        id: predict-check-system
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          x, y = 3, -1
          print(2 * x + y == 5, x - 2 * y == 4)
        output: "True False"
        explanation: "$6 - 1 = 5$, so the first equation holds. But $3 + 2 = 5$, not 4, so the pair is on the first line and off the second."
        hints:
          - Evaluate each left side for the given pair.
          - Minus two times minus one is positive.
  work:
    - text: Slower now. Number your equations, say what you do to each, and check the pair in both.
    - question:
        id: work-elimination
        type: numeric
        system: s2
        prompt: "Solve the system $4x + 3y = 5$ and $2x - 5y = 9$. What is the value of $x$?"
        answer: "2"
        explanation: "Multiply the second equation by 2: $4x - 10y = 18$. Subtract it from the first: $13y = -13$, so $y = -1$. Then $4x - 3 = 5$ gives $x = 2$. Checks: $8 - 3 = 5$ and $4 + 5 = 9$."
        hints:
          - Doubling the second equation makes the x terms match.
          - Subtract, taking care with the signs of the y terms.
          - Find y first, then go back for x.
    - question:
        id: work-word-problem
        type: numeric
        system: s2
        prompt: |
          A test has 30 questions. Each correct answer scores 4 marks and each wrong answer loses 1 mark. A student answers every question and scores 85. How many answers were correct? Use one letter for the number correct and another for the number wrong.
        answer: "23"
        explanation: "With $c$ correct and $w$ wrong: $c + w = 30$ and $4c - w = 85$. Adding eliminates $w$: $5c = 115$, so $c = 23$ and $w = 7$. Check against the story: $92 - 7 = 85$."
        hints:
          - One equation counts the questions. The other counts the marks.
          - The two equations have opposite terms in the number wrong.
          - Check your answer by working out the score.
    - question:
        id: write-intersection
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `intersection(m1, b1, m2, b2)` that returns the point, as a tuple `(x, y)`, where the lines $y = m_1 x + b_1$ and $y = m_2 x + b_2$ cross. If the lines have the same slope they do not cross at a single point, and the function must return `None`.
        starter: |
          def intersection(m1, b1, m2, b2):
              # Replace the next line with your own.
              return (0, 0)

          print(intersection(3, 199, 5, 99))
          print(intersection(2, 1, 2, 5))
        solution: |
          def intersection(m1, b1, m2, b2):
              if m1 == m2:
                  return None
              x = (b2 - b1) / (m1 - m2)
              return (x, m1 * x + b1)

          print(intersection(3, 199, 5, 99))
          print(intersection(2, 1, 2, 5))
        tests: |
          def _safe(m1, b1, m2, b2):
              try:
                  return intersection(m1, b1, m2, b2)
              except ZeroDivisionError:
                  return "zero-division"
          assert _safe(3, 199, 5, 99) == (50, 349), "The plans y = 3x + 199 and y = 5x + 99 cross at (50, 349)"
          assert _safe(1, 1, -1, 5) == (2, 3), "y = x + 1 and y = -x + 5 cross at (2, 3)"
          assert _safe(2, 0, 0, 6) == (3, 6), "y = 2x and y = 6 cross at (3, 6)"
          assert _safe(2, 1, 2, 5) != "zero-division", "For two lines with the same slope the function divides by zero. Test for that before dividing."
          assert _safe(2, 1, 2, 5) is None, "Parallel lines do not cross, so return None"
          assert _safe(1, 0, 3, -1) == (0.5, 0.5), "y = x and y = 3x - 1 cross at (0.5, 0.5)"
        wrong:
          - "def intersection(m1, b1, m2, b2):\n    x = (b2 - b1) / (m1 - m2)\n    return (x, m1 * x + b1)\n"
          - "def intersection(m1, b1, m2, b2):\n    if m1 == m2:\n        return None\n    x = (b2 - b1) / (m2 - m1)\n    return (x, m1 * x + b1)\n"
          - "def intersection(m1, b1, m2, b2):\n    if m1 == m2:\n        return None\n    x = (b2 - b1) / (m1 - m2)\n    return (x, m1 * x)\n"
        explanation: "At the crossing both expressions give the same $y$, so $m_1 x + b_1 = m_2 x + b_2$. Gathering terms, $(m_1 - m_2)x = b_2 - b_1$. Either line then gives $y$. Equal slopes make the divisor zero, which is the algebra's way of saying the lines are parallel."
        hints:
          - At the crossing point the two right-hand sides are equal. Write that as an equation in x.
          - Solve it for x, keeping careful track of which side each term ends on.
          - When is the number you divide by zero, and what does that mean for the lines?
    - question:
        id: write-solve-system
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `solve(a, b, e, c, d, f)` for the system $ax + by = e$, $cx + dy = f$ that handles every case. When the determinant is not zero, return the solution as a tuple `(x, y)`. When it is zero, return the string `"none"` if the system has no solution and `"all"` if it has infinitely many. You may assume that `a` and `b` are not both zero and that `c` and `d` are not both zero. When the determinant is zero the two left-hand sides are multiples of one another, and the question is whether the right-hand sides are in the same proportion. That holds exactly when $ed = bf$ **and** $af = ec$.
        starter: |
          def solve(a, b, e, c, d, f):
              # Replace the next line with your own.
              return "none"

          print(solve(2, 1, 40, 1, 3, 45))
          print(solve(2, 1, 4, 4, 2, 10))
          print(solve(2, 1, 4, 4, 2, 8))
        solution: |
          def solve(a, b, e, c, d, f):
              det = a * d - b * c
              if det != 0:
                  return ((e * d - b * f) / det, (a * f - e * c) / det)
              if e * d == b * f and a * f == e * c:
                  return "all"
              return "none"

          print(solve(2, 1, 40, 1, 3, 45))
          print(solve(2, 1, 4, 4, 2, 10))
          print(solve(2, 1, 4, 4, 2, 8))
        tests: |
          def _safe(*args):
              try:
                  return solve(*args)
              except ZeroDivisionError:
                  return "zero-division"
          assert _safe(2, 1, 40, 1, 3, 45) == (15, 10), "2x + y = 40 and x + 3y = 45 have the solution (15, 10)"
          assert _safe(1, 1, 5, 1, -1, -1) == (2, 3), "x + y = 5 and x - y = -1 have the solution (2, 3)"
          assert _safe(2, 1, 4, 4, 2, 10) != "zero-division", "When the determinant is zero the function divides by zero. Test the determinant first."
          assert _safe(2, 1, 4, 4, 2, 10) == "none", "2x + y = 4 and 4x + 2y = 10 are parallel lines, so return the string none"
          assert _safe(2, 1, 4, 4, 2, 8) == "all", "4x + 2y = 8 is twice 2x + y = 4, the same line, so return the string all"
          assert _safe(1, 0, 3, 2, 0, 6) == "all", "x = 3 and 2x = 6 are the same vertical line"
          assert _safe(1, 0, 3, 2, 0, 7) == "none", "x = 3 and 2x = 7 are parallel vertical lines"
          assert _safe(0, 1, 2, 0, 3, 6) == "all", "y = 2 and 3y = 6 are the same horizontal line"
          assert _safe(1, 2, 0, 3, 4, 0) == (0, 0), "x + 2y = 0 and 3x + 4y = 0 have the single solution (0, 0)"
        wrong:
          - "def solve(a, b, e, c, d, f):\n    det = a * d - b * c\n    return ((e * d - b * f) / det, (a * f - e * c) / det)\n"
          - "def solve(a, b, e, c, d, f):\n    det = a * d - b * c\n    if det != 0:\n        return ((e * d - b * f) / det, (a * f - e * c) / det)\n    return \"none\"\n"
          - "def solve(a, b, e, c, d, f):\n    det = a * d - b * c\n    if det != 0:\n        return ((e * d - b * f) / det, (a * f - e * c) / det)\n    if e * d == b * f:\n        return \"all\"\n    return \"none\"\n"
        explanation: The determinant decides whether there is exactly one solution. When it is zero, the eliminated equations read $0 = ed - bf$ and $0 = af - ec$. If both are true statements the lines coincide, and if either is false they are parallel.
        hints:
          - Compute the determinant first and branch on whether it is zero.
          - When it is zero, elimination leaves two statements without unknowns. When are both of them true?
          - Test the two vertical-line cases by hand.
    - question:
        id: fix-break-even
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A workshop pays 6000 rupees a month in rent and 40 rupees in materials for each lamp it makes, and sells each lamp for 160 rupees. `break_even()` should return the number of lamps at which income equals cost. The cost line is $y = 40n + 6000$ and the income line is $y = 160n$. The function returns a negative number of lamps, which cannot be right. Solve for the crossing on paper and fix the function.
        starter: |
          def break_even():
              rent = 6000
              material = 40
              price = 160
              return rent / (material - price)

          n = break_even()
          print(n)
          print(160 * n == 40 * n + 6000)
        solution: |
          def break_even():
              rent = 6000
              material = 40
              price = 160
              return rent / (price - material)

          n = break_even()
          print(n)
          print(160 * n == 40 * n + 6000)
        tests: |
          assert break_even() == 50, "Each lamp brings in 120 rupees more than it costs, so 50 lamps cover the rent of 6000"
          assert n == 50, "n should be bound to 50"
          assert output.strip().endswith("True"), "The check on the last line should show True"
        wrong:
          - "def break_even():\n    rent = 6000\n    material = 40\n    price = 160\n    return rent / price\n\nn = break_even()\nprint(n)\n"
          - "def break_even():\n    rent = 6000\n    material = 40\n    price = 160\n    return rent / (price + material)\n\nn = break_even()\nprint(n)\n"
        explanation: "Setting income equal to cost, $160n = 40n + 6000$, gives $120n = 6000$. The rent is divided by the amount each lamp earns over its own cost, price minus material. The starter subtracted the other way round, and the impossible negative answer was the clue."
        hints:
          - Write income = cost as an equation in n.
          - Gather the n terms on the side where the coefficient is positive.
          - A negative count of lamps is impossible. Which subtraction has the wrong order?
    - question:
        id: three-outcomes
        type: choice
        system: s2
        prompt: |
          While solving a system of two linear equations correctly, you eliminate one unknown and the other vanishes too, leaving $0 = 0$. What does this tell you?
        options:
          - "The solution is x = 0, y = 0."
          - "The system has no solution."
          - "The two equations describe the same line, so every point on that line is a solution."
          - "You made an arithmetic mistake."
        answer: 2
        explanation: "$0 = 0$ is true whatever the unknowns are, so the second equation adds no new condition to the first. Had the last line been false, such as $0 = 2$, the lines would have been parallel with no solution."
        hints:
          - For which pairs is 0 = 0 true?
          - What must be true of two equations if one can be turned into the other?
    - question:
        id: elimination-order
        type: order
        system: s2
        prompt: "Put the lines of this solution of $3x + y = 11$, $x - 2y = -1$ in order."
        steps:
          - "Multiply the first equation by 2: $6x + 2y = 22$."
          - "Add the second equation to it: $7x = 21$."
          - "Divide by 7: $x = 3$."
          - "Substitute into the first equation: $9 + y = 11$, so $y = 2$."
          - "Check in the second equation: $3 - 4 = -1$."
        explanation: The first equation is scaled so that the $y$ terms become opposites. Adding then removes $y$, leaving one equation in one unknown. The check uses the equation that was not used for the back-substitution.
        hints:
          - The y terms must be made to cancel before the equations are added.
          - One unknown is found before the other.
          - The check comes last.
  connections:
    - text: |
        Two equations, two unknowns, one crossing point. You can now find it exactly, and you can tell in advance, from a single number, whether there is one to find.

        This lesson is linear algebra in miniature. Real problems have not two unknowns but thousands or millions, and elimination, done methodically by a program, is still how such systems are solved. The array of coefficients gets a name, a **matrix**, and the determinant grows with it. The three outcomes remain exactly the three you met today: one solution, none, or infinitely many.

        Fitting a line to data, mentioned in the last lesson, comes down to this. The best slope and the best intercept are two unknowns, and the conditions that make them best turn out to be two linear equations. You will derive and solve them.

        When a model has more unknowns than it has independent facts, you are in the "same line" case: infinitely many settings fit the data equally well, and something extra must be said about which to prefer. That predicament has a name, underdetermination, and much of the craft of machine learning is about handling it.

        Everything so far has been straight. Lines have constant slope, and their equations contain $x$ and nothing wilder. The simplest step beyond is to allow $x$ to be multiplied by itself. The graph bends, a ball's flight and a square's area become describable, and an equation can suddenly have two solutions. That is the next lesson: [[m1.quadratics]].
