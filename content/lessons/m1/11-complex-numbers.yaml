concept: m1.complex-numbers
minutes: 105
claim: You can compute with complex numbers in the form a + bi, picture them as points of the plane with a modulus and a conjugate, see multiplication by i as a quarter-turn, and solve any quadratic equation.
recalls: [m1.logarithms]
uses: [m1.variables-and-expressions, m1.linear-equations, m1.inequalities-and-absolute-value, m1.coordinates-and-the-plane, m1.straight-lines-and-slope, m1.quadratics, m1.polynomials, m1.exponent-laws, m0.negative-numbers, m0.fractions, m0.powers-and-roots, e0.expressions, e0.booleans-and-conditionals, e0.loops, e0.functions, e0.lists-and-tuples, e0.reading-errors-and-debugging]
leads: [m2.sets]
starter: |
  # Scratch space. Python writes the new number as 1j.
  z = 3 + 4j
  print(z * z)
  print(1j * 1j)
  print(abs(z))
parts:
  recall:
    - text: |
        In [[m1.logarithms]] a new operation was defined by what it had to undo, and its laws were the old laws of exponents read backwards. Today a new **number** is defined by what it has to do, and its laws will be the old laws of algebra, unchanged. Two quick pulls first.
  puzzle:
    - text: |
        Solve $x^2 + 1 = 0$.

        It asks for a number whose square is $-1$. A positive number squared is positive. A negative number squared is positive. Zero squared is zero. Every number on the number line has a square that is zero or more, so no such number exists, and four lessons ago that was the end of the matter: "no real solution".

        But ask Python.

        ```python
        print((-1) ** 0.5)
        ```

        It does not stop with an error. It shows `(6.123233995736766e-17+1j)`. The first part is a rounding error, a number with sixteen zeros after the decimal point. The second part, `1j`, is something you have never seen. And if you ask for `1j * 1j`, Python answers `(-1+0j)`.

        Python has a number whose square is $-1$.

        You have been in this position before. "Take 5 from 3" had no answer until negative numbers were admitted. "Divide 1 by 3" had no answer among the whole numbers. Each time the answer to "it cannot be done" was "not with the numbers you have so far". **Is there a larger system of numbers in which $x^2 = -1$ can be solved, and can it be built without breaking the arithmetic you already trust?**
  intuition:
    - text: |
        Do what was done for negative numbers: invent a symbol for the missing number, insist that all the old laws of arithmetic go on holding, and see whether anything breaks.

        Call the new number $i$. Its one defining property is

        $$i^2 = -1.$$

        Nothing else about it is assumed. It is not on the number line, because nothing on the line has a negative square. So where is it?

        Here is a way to find out. Multiplying by $-1$, you learnt, **reflects** the number line through zero: it turns 3 into $-3$, a half-turn about the origin. Now, multiplying by $i$ twice is multiplying by $i^2 = -1$. So $i$ is an operation which, done twice, makes a half-turn. There is an obvious candidate for such an operation: **a quarter-turn**.

        A quarter-turn takes the number 1 off the line altogether, to a point one unit straight above zero. That is where $i$ lives. The numbers were never confined to a line. They fill a plane, and the number line you have used all your life is its horizontal axis.

        Put the point below at $(3, 2)$, and think of it as a single number, $3 + 2i$: three ordinary units along, and two of the new units up.
    - figure: plane-point
      props: { x: 3, y: 2 }
    - text: |
        Every point of the plane is one number of this new kind. They are called **complex numbers**. The word means "made of parts", not "complicated". The ordinary numbers, now called **real numbers**, are the ones whose second part is zero.

        The historical name for $i$ is the "imaginary" unit, a name given by people who distrusted it. It is no more imaginary than $-1$, which nobody can hold in their hand either. Both are positions on a map, and both obey rules.
  derivation:
    - text: |
        **The form $a + bi$.** A **complex number** is an expression $a + bi$ in which $a$ and $b$ are real numbers. $a$ is its **real part** and $b$ its **imaginary part**. Note that the imaginary part is the real number $b$, without the $i$. Two complex numbers are equal exactly when both parts agree.

        **Arithmetic.** Compute as if $i$ were an ordinary variable, and replace $i^2$ by $-1$ whenever it appears. That is the entire rule.

        *Adding and subtracting* collect like terms:

        $$(3 + 2i) + (1 - 5i) = 4 - 3i.$$

        *Multiplying* expands the brackets, every term meeting every term:

        $$\begin{aligned} (3 + 2i)(1 - 5i) &= 3 - 15i + 2i - 10i^2 \\ &= 3 - 13i - 10 \times (-1) \\ &= 13 - 13i. \end{aligned}$$

        The step that needs care is the last term. $-10i^2$ is $-10 \times (-1) = +10$, a **real** number that joins the 3. In general,

        $$(a + bi)(c + di) = (ac - bd) + (ad + bc)i.$$

        Do not memorise this. Expand and replace $i^2$ each time.

        **Powers of $i$.** $i^1 = i$, $i^2 = -1$, $i^3 = i^2 \times i = -i$, $i^4 = (i^2)^2 = 1$, and then the cycle repeats: $i^5 = i$. Four quarter-turns make a full turn. So any power of $i$ is found from the remainder of its exponent on division by 4.

        **Square roots of negative numbers.** Now $\sqrt{-9}$ has a meaning. Since $(3i)^2 = 9i^2 = -9$, one square root of $-9$ is $3i$, and the other is $-3i$. For a positive $k$, $\sqrt{-k} = i\sqrt{k}$.

        **The plane.** The number $a + bi$ is drawn as the point $(a, b)$. The horizontal axis is the **real axis** and the vertical the **imaginary axis**. Adding two complex numbers adds their horizontal parts and their vertical parts separately, so it is the same as following one arrow from the origin and then the other.

        The **modulus** of $z = a + bi$, written $|z|$, is its distance from the origin. By the theorem of Pythagoras,

        $$|a + bi| = \sqrt{a^2 + b^2}.$$

        So $|3 + 4i| = 5$. For a real number this is the absolute value you know, which is why the same bars are used. A warning: complex numbers have a size, but **no order**. It makes no sense to ask whether $i$ is greater or less than 1. Inequalities belong to the real line only.

        **The conjugate.** The **conjugate** of $z = a + bi$ is $\bar{z} = a - bi$, its mirror image in the real axis. Multiply a number by its conjugate and something useful happens. It is a difference of two squares:

        $$(a + bi)(a - bi) = a^2 - (bi)^2 = a^2 - b^2 i^2 = a^2 + b^2.$$

        The product is **real**, and it equals $|z|^2$.
    - question:
        id: multiply-by-hand
        type: choice
        system: s2
        prompt: "Compute $(2 - 3i)(4 + i)$."
        options: ["$8 - 3i$", "$11 - 10i$", "$5 - 10i$", "$11 + 10i$"]
        answer: 1
        explanation: "$8 + 2i - 12i - 3i^2 = 8 - 10i + 3 = 11 - 10i$. The last term is $-3 \\times (-1) = +3$."
    - text: |
        **Dividing.** How can one divide by $3 + 4i$? The conjugate turns the divisor into a real number. Multiply the top and bottom of the fraction by the conjugate of the bottom, which changes nothing, since it is multiplying by 1:

        $$\frac{5 + 10i}{3 + 4i} = \frac{(5 + 10i)(3 - 4i)}{(3 + 4i)(3 - 4i)} = \frac{15 - 20i + 30i - 40i^2}{9 + 16} = \frac{55 + 10i}{25} = \frac{11}{5} + \frac{2}{5}i.$$

        Every complex number except zero can be divided by. So complex numbers can be added, subtracted, multiplied and divided, and all the laws in the table of the first lesson of this cluster, commutative, associative, distributive, hold for them. Nothing broke. Everything you derived from those laws, expanding, factorising, the quadratic formula, the laws of exponents for whole powers, is still true.

        **Multiplication by $i$ is a quarter-turn.** Take any number $a + bi$ and multiply by $i$:

        $$i(a + bi) = ai + bi^2 = -b + ai.$$

        The point $(a, b)$ has moved to $(-b, a)$. You have seen exactly this before. It is what a quarter-turn anticlockwise did to the point $(1, m)$ when you found the slope of a perpendicular line. The guess made in the intuition is confirmed by calculation: multiplying by $i$ rotates the plane by a right angle about the origin. And the modulus is unchanged, since $(-b)^2 + a^2 = a^2 + b^2$. More generally, multiplying by any complex number rotates and stretches the plane, and the moduli multiply: $|zw| = |z|\,|w|$.

        **Every quadratic has solutions.** Return to the quadratic formula with a negative discriminant. For $x^2 - 4x + 13 = 0$, $D = 16 - 52 = -36$, and $\sqrt{-36} = 6i$. So

        $$x = \frac{4 \pm 6i}{2} = 2 \pm 3i.$$

        Check one of them by substitution. $(2 + 3i)^2 = 4 + 12i + 9i^2 = -5 + 12i$. Then $-5 + 12i - 4(2 + 3i) + 13 = -5 + 12i - 8 - 12i + 13 = 0$. It works.

        When the coefficients are real and $D < 0$, the two solutions are always **conjugates** of one another, $p + qi$ and $p - qi$, mirror images in the real axis. The parabola misses the real axis, and its roots sit symmetrically above and below it.

        **Enough numbers at last.** Negative numbers were needed to solve $x + 3 = 0$, fractions for $3x = 1$, roots for $x^2 = 2$, and $i$ for $x^2 = -1$. You might expect the next kind of equation to need yet another new number. It does not. The **fundamental theorem of algebra** says that every polynomial of degree $n \geq 1$, even one whose coefficients are complex, has a root among the complex numbers, and therefore, dividing out one factor at a time, factorises completely into $n$ factors of degree 1. Counting repeated roots as many times as they repeat, a polynomial of degree $n$ has **exactly** $n$ complex roots. The proof is beyond this lesson, but the statement is the reason the story of extending the number system ends here.

        **In Python.** Python has complex numbers built in. It writes $i$ as `j`, following the engineers, and the `j` must be attached to a number: `1j`, `2.5j`.

        ```python
        z = 3 + 4j
        w = 1 - 2j
        print(z + w, z * w)
        print(z.real, z.imag, abs(z))
        print(z.conjugate())
        ```

        This shows `(4+2j) (11-2j)`, then `3.0 4.0 5.0`, then `(3-4j)`. The two parts are stored as floats, `abs` gives the modulus, and `==` compares both parts. There is no `<` for complex numbers: trying it is a `TypeError`.
    - question:
        id: fix-complex-multiply
        type: code
        mode: find-bug
        system: s2
        prompt: |
          To see that there is no magic in Python's complex numbers, here they are built from scratch: a complex number is a tuple `(a, b)` standing for $a + bi$. `multiply(z, w)` should return the product as a tuple. For $(3 + 2i)(1 - 5i)$ it should return `(13, -13)`, but it returns `(-7, -13)`. Expand $(a + bi)(c + di)$ on paper, replacing $i^2$ by $-1$, compare with the function, and fix it.
        starter: |
          def multiply(z, w):
              a, b = z
              c, d = w
              return (a * c + b * d, a * d + b * c)

          print(multiply((3, 2), (1, -5)))
        solution: |
          def multiply(z, w):
              a, b = z
              c, d = w
              return (a * c - b * d, a * d + b * c)

          print(multiply((3, 2), (1, -5)))
        tests: |
          assert multiply((3, 2), (1, -5)) == (13, -13), "(3 + 2i)(1 - 5i) is 13 - 13i. What does the product of the two imaginary terms become?"
          assert multiply((0, 1), (0, 1)) == (-1, 0), "i times i is -1"
          assert multiply((2, 0), (3, 0)) == (6, 0), "Two real numbers multiply as usual"
          assert multiply((3, 4), (3, -4)) == (25, 0), "A number times its conjugate is real: (3 + 4i)(3 - 4i) is 25"
          assert multiply((0, 1), (5, 2)) == (-2, 5), "Multiplying 5 + 2i by i gives -2 + 5i, a quarter-turn"
          for _z, _w in [((1, 2), (3, -1)), ((-2, 5), (4, 7)), ((0, -3), (2, 2))]:
              _p = complex(_z[0], _z[1]) * complex(_w[0], _w[1])
              assert multiply(_z, _w) == (_p.real, _p.imag), "The result should agree with Python's own complex multiplication"
        wrong:
          - "def multiply(z, w):\n    a, b = z\n    c, d = w\n    return (a * c - b * d, a * d - b * c)\n\nprint(multiply((3, 2), (1, -5)))\n"
          - "def multiply(z, w):\n    a, b = z\n    c, d = w\n    return (a * c, b * d)\n\nprint(multiply((3, 2), (1, -5)))\n"
          - "def multiply(z, w):\n    a, b = z\n    c, d = w\n    return (a * c - b * d, a * c + b * d)\n\nprint(multiply((3, 2), (1, -5)))\n"
        explanation: "Expanding, $(a + bi)(c + di) = ac + adi + bci + bd\\,i^2$. The last term is $bd \\times (-1)$, so the real part is $ac - bd$. The starter added it, as if $i^2$ were $+1$."
  formal:
    - text: |
        A **complex number** is an expression $z = a + bi$ with $a$ and $b$ real, where $i^2 = -1$. The real number $a$ is the **real part** of $z$ and the real number $b$ its **imaginary part**. $a + bi = c + di$ if and only if $a = c$ and $b = d$. A real number $a$ is the complex number $a + 0i$.

        | Operation | Definition |
        | --- | --- |
        | Sum | $(a + bi) + (c + di) = (a + c) + (b + d)i$ |
        | Product | $(a + bi)(c + di) = (ac - bd) + (ad + bc)i$ |
        | Conjugate | $\overline{a + bi} = a - bi$ |
        | Modulus | $\lvert a + bi \rvert = \sqrt{a^2 + b^2}$ |
        | Quotient | $\dfrac{z}{w} = \dfrac{z\,\bar{w}}{\lvert w \rvert^2}$ for $w \neq 0$ |

        Addition and multiplication of complex numbers are commutative and associative, and multiplication distributes over addition. Every non-zero complex number has a reciprocal. There is no ordering of the complex numbers compatible with these operations.

        For all complex numbers $z$ and $w$:

        | Fact | Statement |
        | --- | --- |
        | Conjugate product | $z\,\bar{z} = \lvert z \rvert^2$ |
        | Conjugates respect arithmetic | $\overline{z + w} = \bar{z} + \bar{w}$ and $\overline{zw} = \bar{z}\,\bar{w}$ |
        | Modulus of a product | $\lvert zw \rvert = \lvert z \rvert\,\lvert w \rvert$ |
        | Triangle inequality | $\lvert z + w \rvert \le \lvert z \rvert + \lvert w \rvert$ |
        | Powers of $i$ | $i^{4k} = 1$, $i^{4k+1} = i$, $i^{4k+2} = -1$, $i^{4k+3} = -i$ |

        In the **complex plane**, $a + bi$ is the point $(a, b)$. Multiplication by $i$ is the rotation by a right angle anticlockwise about the origin.

        **Quadratics.** For real $a \neq 0$, $b$ and $c$ with $D = b^2 - 4ac < 0$, the solutions of $ax^2 + bx + c = 0$ are the conjugate pair

        $$x = \frac{-b \pm i\sqrt{-D}}{2a}.$$

        **Fundamental theorem of algebra.** Every polynomial of degree $n \geq 1$ with complex coefficients has exactly $n$ complex roots, counted with their multiplicities. If the coefficients are real, the roots that are not real occur in conjugate pairs.
  drill:
    - text: Seconds each. Treat i as a letter, and replace its square by minus one.
    - question:
        id: drill-add
        type: choice
        system: s1
        prompt: "Compute $(2 + 5i) + (4 - 7i)$."
        options: ["$6 - 2i$", "$6 + 12i$", "$-2 + 6i$", "$4i$"]
        answer: 0
        explanation: Real parts together, imaginary parts together.
    - question:
        id: drill-i-squared
        type: choice
        system: s1
        prompt: "Compute $(3i)^2$."
        options: ["$9i$", "$-9$", "$9$", "$-3$"]
        answer: 1
        explanation: "$9i^2 = 9 \\times (-1)$."
    - question:
        id: drill-i-times
        type: choice
        system: s1
        prompt: "Compute $i(2 + 3i)$."
        options: ["$2i + 3$", "$-3 + 2i$", "$3 - 2i$", "$5i$"]
        answer: 1
        explanation: "$2i + 3i^2 = 2i - 3$. The point $(2, 3)$ has turned a quarter-turn to $(-3, 2)$."
    - question:
        id: drill-power-of-i
        type: choice
        system: s1
        prompt: "What is $i^{10}$?"
        options: ["$1$", "$i$", "$-1$", "$-i$"]
        answer: 2
        explanation: "The powers cycle with period 4, and 10 leaves the remainder 2. So $i^{10} = i^2 = -1$."
    - question:
        id: drill-modulus
        type: numeric
        system: s1
        prompt: "What is $|6 - 8i|$?"
        answer: "10"
        explanation: "$\\sqrt{36 + 64} = \\sqrt{100}$."
    - question:
        id: drill-conjugate
        type: choice
        system: s1
        prompt: "What is the conjugate of $-2 + 7i$?"
        options: ["$2 - 7i$", "$-2 - 7i$", "$2 + 7i$", "$7 - 2i$"]
        answer: 1
        explanation: Only the sign of the imaginary part changes. It is a reflection in the real axis.
    - question:
        id: drill-conjugate-product
        type: numeric
        system: s1
        prompt: "Compute $(2 + 3i)(2 - 3i)$."
        answer: "13"
        explanation: "A number times its conjugate is $a^2 + b^2 = 4 + 9$."
    - question:
        id: drill-root-negative
        type: choice
        system: s1
        prompt: "Which of these are the solutions of $x^2 = -25$?"
        options: ["$x = 5$ and $x = -5$", "$x = 5i$ and $x = -5i$", "$x = 25i$", "There are none, even among the complex numbers"]
        answer: 1
        explanation: "$(5i)^2 = 25i^2 = -25$, and likewise for $-5i$."
    - question:
        id: predict-complex
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          z = 1 + 2j
          w = 3 - 1j
          print(z + w, z * w)
        output: "(4+1j) (5+5j)"
        explanation: "The sum is $4 + i$. The product is $3 - i + 6i - 2i^2 = 3 + 5i + 2 = 5 + 5i$."
    - question:
        id: predict-parts
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          z = 3 - 4j
          print(z.real, z.imag, abs(z))
        output: "3.0 -4.0 5.0"
        explanation: The parts are stored as floats. The imaginary part is $-4$, without the `j`, and the modulus is 5.
  work:
    - text: Slower now. Expand in full, and write the replacement of i squared as a separate step.
    - question:
        id: work-divide
        type: choice
        system: s2
        prompt: "Compute $\\dfrac{10}{1 + 3i}$ in the form $a + bi$."
        options: ["$10 - 30i$", "$1 - 3i$", "$1 + 3i$", "$\\dfrac{5}{2} - \\dfrac{15}{2}i$"]
        answer: 1
        explanation: "Multiply top and bottom by the conjugate $1 - 3i$. The bottom becomes $1 + 9 = 10$ and the top $10(1 - 3i)$, so the quotient is $1 - 3i$. Check by multiplying back: $(1 - 3i)(1 + 3i) = 10$."
    - question:
        id: work-quadratic
        type: numeric
        system: s2
        prompt: "The equation $x^2 - 6x + 34 = 0$ has the solutions $p \\pm qi$ with $q > 0$. What is $q$?"
        answer: "5"
        explanation: "$D = 36 - 136 = -100$, so $\\sqrt{D} = 10i$ and $x = \\dfrac{6 \\pm 10i}{2} = 3 \\pm 5i$. Check: the two roots add to 6 and multiply to $9 + 25 = 34$, as the coefficients require."
    - question:
        id: write-complex-roots
        type: code
        mode: write
        system: s2
        prompt: |
          Write a function `roots(a, b, c)` that returns both solutions of $ax^2 + bx + c = 0$, for real coefficients with `a` not zero, as a tuple of two Python complex numbers. Put the root with the minus sign first. Handle the sign of the discriminant yourself: when it is negative, the square root is `1j` times the root of its opposite. Do not take a fractional power of a negative number.
        starter: |
          def roots(a, b, c):
              # Replace the next line with your own.
              return (0j, 0j)

          print(roots(1, -4, 13))
          print(roots(1, -2, -3))
        solution: |
          def roots(a, b, c):
              d = b * b - 4 * a * c
              if d >= 0:
                  r = d ** 0.5 + 0j
              else:
                  r = (-d) ** 0.5 * 1j
              return ((-b - r) / (2 * a), (-b + r) / (2 * a))

          print(roots(1, -4, 13))
          print(roots(1, -2, -3))
        tests: |
          def _check(a, b, c, want):
              got = roots(a, b, c)
              if got is None or len(got) != 2:
                  return False
              for g, w in zip(got, want):
                  if abs(complex(g) - w) > 1e-9:
                      return False
              return True
          assert _check(1, -4, 13, (2 - 3j, 2 + 3j)), "x^2 - 4x + 13 = 0 has the solutions 2 - 3i and 2 + 3i, in that order"
          assert _check(1, -2, -3, (-1, 3)), "x^2 - 2x - 3 = 0 has the real solutions -1 and 3"
          assert _check(1, 0, 1, (-1j, 1j)), "x^2 + 1 = 0 has the solutions -i and i"
          assert _check(1, 2, 1, (-1, -1)), "x^2 + 2x + 1 = 0 has the repeated solution -1"
          assert _check(2, -4, 10, (1 - 2j, 1 + 2j)), "2x^2 - 4x + 10 = 0 has the solutions 1 - 2i and 1 + 2i. Divide by the whole of 2a."
          _r = roots(1, -4, 13)
          assert complex(_r[0]).real == 2 and complex(_r[1]).real == 2, "The real parts should be exactly 2. Taking a fractional power of a negative number leaves a small rounding error: use 1j times the root of the positive number."
        wrong:
          - "def roots(a, b, c):\n    d = b * b - 4 * a * c\n    r = d ** 0.5\n    return ((-b - r) / (2 * a), (-b + r) / (2 * a))\n"
          - "def roots(a, b, c):\n    d = b * b - 4 * a * c\n    if d >= 0:\n        r = d ** 0.5 + 0j\n    else:\n        r = (-d) ** 0.5\n    return ((-b - r) / (2 * a), (-b + r) / (2 * a))\n"
          - "def roots(a, b, c):\n    d = b * b - 4 * a * c\n    if d >= 0:\n        r = d ** 0.5 + 0j\n    else:\n        r = (-d) ** 0.5 * 1j\n    return ((-b - r) / 2 * a, (-b + r) / 2 * a)\n"
        explanation: "When $D$ is negative, $\\sqrt{D} = i\\sqrt{-D}$, and $-D$ is positive, so its root is an ordinary float. The formula then works unchanged, because complex numbers obey the same algebra. This one function never has to say \"no solution\"."
    - question:
        id: write-modulus-conjugate
        type: code
        mode: write
        system: s2
        prompt: |
          Using tuples `(a, b)` for $a + bi$ once more, write three functions without using Python's complex numbers: `conjugate(z)` returns the conjugate as a tuple, `modulus(z)` returns the modulus as a number, and `divide(z, w)` returns the quotient $z \div w$ as a tuple, for a non-zero `w`, by multiplying top and bottom by the conjugate of the bottom. The function `multiply` is given.
        starter: |
          def multiply(z, w):
              a, b = z
              c, d = w
              return (a * c - b * d, a * d + b * c)

          def conjugate(z):
              # Replace the next line with your own.
              return z

          def modulus(z):
              # Replace the next line with your own.
              return 0

          def divide(z, w):
              # Replace the next line with your own.
              return z

          print(conjugate((3, 4)), modulus((3, 4)), divide((5, 10), (3, 4)))
        solution: |
          def multiply(z, w):
              a, b = z
              c, d = w
              return (a * c - b * d, a * d + b * c)

          def conjugate(z):
              a, b = z
              return (a, -b)

          def modulus(z):
              a, b = z
              return (a * a + b * b) ** 0.5

          def divide(z, w):
              top = multiply(z, conjugate(w))
              c, d = w
              bottom = c * c + d * d
              return (top[0] / bottom, top[1] / bottom)

          print(conjugate((3, 4)), modulus((3, 4)), divide((5, 10), (3, 4)))
        tests: |
          assert "j" not in source.replace("conjugate", ""), "Use tuples throughout, without Python's complex numbers"
          assert multiply((3, 2), (1, -5)) == (13, -13), "Leave the function multiply as it was"
          assert conjugate((3, 4)) == (3, -4), "The conjugate of 3 + 4i is 3 - 4i"
          assert conjugate((-2, -7)) == (-2, 7), "Only the imaginary part changes sign"
          assert abs(modulus((3, 4)) - 5) < 1e-9, "The modulus of 3 + 4i is 5"
          assert abs(modulus((0, -2)) - 2) < 1e-9, "The modulus of -2i is 2"
          _q = divide((5, 10), (3, 4))
          assert abs(_q[0] - 2.2) < 1e-9 and abs(_q[1] - 0.4) < 1e-9, "(5 + 10i) / (3 + 4i) is 2.2 + 0.4i"
          _q = divide((10, 0), (1, 3))
          assert abs(_q[0] - 1) < 1e-9 and abs(_q[1] + 3) < 1e-9, "10 / (1 + 3i) is 1 - 3i"
          _q = divide((7, -2), (7, -2))
          assert abs(_q[0] - 1) < 1e-9 and abs(_q[1]) < 1e-9, "Any non-zero number divided by itself is 1"
          _b = multiply(divide((2, 5), (4, -1)), (4, -1))
          assert abs(_b[0] - 2) < 1e-9 and abs(_b[1] - 5) < 1e-9, "Dividing by w and then multiplying by w should give the original number back"
        wrong:
          - "def multiply(z, w):\n    a, b = z\n    c, d = w\n    return (a * c - b * d, a * d + b * c)\n\ndef conjugate(z):\n    a, b = z\n    return (-a, b)\n\ndef modulus(z):\n    a, b = z\n    return (a * a + b * b) ** 0.5\n\ndef divide(z, w):\n    top = multiply(z, conjugate(w))\n    c, d = w\n    bottom = c * c + d * d\n    return (top[0] / bottom, top[1] / bottom)\n"
          - "def multiply(z, w):\n    a, b = z\n    c, d = w\n    return (a * c - b * d, a * d + b * c)\n\ndef conjugate(z):\n    a, b = z\n    return (a, -b)\n\ndef modulus(z):\n    a, b = z\n    return a * a + b * b\n\ndef divide(z, w):\n    top = multiply(z, conjugate(w))\n    c, d = w\n    bottom = c * c + d * d\n    return (top[0] / bottom, top[1] / bottom)\n"
          - "def multiply(z, w):\n    a, b = z\n    c, d = w\n    return (a * c - b * d, a * d + b * c)\n\ndef conjugate(z):\n    a, b = z\n    return (a, -b)\n\ndef modulus(z):\n    a, b = z\n    return (a * a + b * b) ** 0.5\n\ndef divide(z, w):\n    top = multiply(z, w)\n    c, d = w\n    bottom = c * c + d * d\n    return (top[0] / bottom, top[1] / bottom)\n"
        explanation: The conjugate flips the sign of the imaginary part. The modulus is the distance formula from the origin. Division multiplies the top by the conjugate of the bottom, and divides both parts by the bottom times its own conjugate, which is the real number $c^2 + d^2$.
    - question:
        id: fix-power-of-i
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `power_of_i(n)` should return $i^n$ for a whole number `n` that is 0 or more, as one of the strings `"1"`, `"i"`, `"-1"` and `"-i"`, using the fact that the powers repeat with period 4. It is right for $n = 0$, 1 and 2, and wrong for $i^3$ and for $i^4$. Write out the first five powers of $i$ on paper, compare with the list in the function, and fix it.
        starter: |
          def power_of_i(n):
              cycle = ["1", "i", "-1", "-i"]
              return cycle[n % 3]

          print(power_of_i(3), power_of_i(4))
        solution: |
          def power_of_i(n):
              cycle = ["1", "i", "-1", "-i"]
              return cycle[n % 4]

          print(power_of_i(3), power_of_i(4))
        tests: |
          assert power_of_i(0) == "1", "i to the power 0 is 1"
          assert power_of_i(1) == "i", "i to the power 1 is i"
          assert power_of_i(2) == "-1", "i to the power 2 is -1"
          assert power_of_i(3) == "-i", "i to the power 3 is i squared times i, which is -i. How long is the cycle?"
          assert power_of_i(4) == "1", "i to the power 4 is 1, and the cycle starts again"
          assert power_of_i(10) == "-1", "i to the power 10 is i squared, since 10 leaves the remainder 2 on division by 4"
          assert power_of_i(2023) == "-i", "It should work for a large exponent"
        wrong:
          - "def power_of_i(n):\n    cycle = [\"1\", \"i\", \"-1\", \"-i\"]\n    return cycle[n % 4 - 1]\n\nprint(power_of_i(3), power_of_i(4))\n"
          - "def power_of_i(n):\n    cycle = [\"i\", \"-1\", \"-i\", \"1\"]\n    return cycle[n % 4]\n\nprint(power_of_i(3), power_of_i(4))\n"
        explanation: The cycle has four entries, one for each quarter-turn, so the position is the remainder on division by 4. Dividing by 3 never reaches the last entry and falls out of step with the cycle.
    - question:
        id: quarter-turn
        type: choice
        system: s2
        prompt: |
          The complex number $z = 4 + i$ is multiplied by $i$ three times in succession. Where does it end up, and why?
        options:
          - "At $-4 - i$, because three multiplications by i make a half-turn."
          - "At $1 - 4i$, because three quarter-turns anticlockwise are the same as one quarter-turn clockwise, taking $(4, 1)$ to $(1, -4)$."
          - "At $-1 + 4i$, because one multiplication does that and the others cancel."
          - "At $4 + i$ again, because the powers of i repeat."
        answer: 1
        explanation: "$i^3 = -i$, and $-i(4 + i) = -4i - i^2 = 1 - 4i$. Step by step: $(4, 1)$ goes to $(-1, 4)$, then to $(-4, -1)$, then to $(1, -4)$. The modulus, $\\sqrt{17}$, never changes."
    - question:
        id: counting-roots
        type: choice
        system: s2
        prompt: |
          The polynomial $x^4 - 1$ has degree 4. Over the real numbers it has only two roots, 1 and $-1$. What are all of its roots over the complex numbers?
        options:
          - "Still only 1 and −1."
          - "$1$, $-1$, $i$ and $-i$, since $x^4 - 1 = (x^2 - 1)(x^2 + 1) = (x - 1)(x + 1)(x - i)(x + i)$."
          - "$1$, $-1$, $i$ and $2i$."
          - "It has infinitely many complex roots."
        answer: 1
        explanation: "The difference of two squares factorises $x^4 - 1$ into $(x^2 - 1)(x^2 + 1)$, and $x^2 + 1 = (x - i)(x + i)$. Four roots for degree four, as the fundamental theorem of algebra promises. In the plane they are the four points at distance 1 from the origin along the axes, a quarter-turn apart."
  connections:
    - text: |
        The number system is now complete, in the precise sense that every polynomial equation has all the roots its degree calls for. Getting here took five extensions, each one forced by an equation that could not be solved and each one made safe by keeping the old laws: negatives, fractions, roots, and finally a second dimension.

        Complex numbers are worth having for a reason beyond equations: **multiplication is rotation**. Anything that turns, cycles or oscillates is described most simply by them. Sound, radio and alternating current are analysed by breaking a signal into rotating complex numbers. The method, the Fourier transform, is one you will meet when you study how models handle audio and images. Modern language models tell the position of each word in a sentence apart by rotating pairs of numbers through angles that depend on the position, which is complex multiplication under another name.

        They also explain things about real numbers that the real numbers cannot explain themselves. The way a matrix stretches and turns space is read from the roots of a polynomial attached to it. When those roots are complex, the matrix rotates, and when they are real, it does not. You will need this in linear algebra, and you could not even state it without today's lesson.

        This is the end of the algebra cluster. Look at what you carry out of it. Letters that stand for numbers, and laws for reshaping what is written. Equations as balances and solving as undoing. A plane in which every equation is a shape. Lines, with their steady rate. Parabolas, with their single turning point. Polynomials stored as lists. Exponents that mean growth, and logarithms that tame it. And for every one of them, a program you wrote that checks the mathematics, and mathematics that tells you what the program must print.

        Throughout, one word has been used loosely: **function**. A recipe that turns an input into an output, in Python and on paper alike. The next cluster makes that idea exact, and it begins with the language in which all exact mathematics is written, the language of collections of things: [[m2.sets]].
