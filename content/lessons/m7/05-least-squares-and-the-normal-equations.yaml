    - question:
        id: predict-lstsq
        type: predict
        system: s1
        prompt: The library routine on the same problem. What does this show?
        code: |
          import numpy as np

          X = np.array([[1.0, 0.0], [1.0, 1.0], [1.0, 2.0], [1.0, 3.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          w, sse, rank, _ = np.linalg.lstsq(X, y, rcond=None)
          print([round(float(v), 4) for v in w], [round(float(v), 4) for v in sse], int(rank))
          print(round(float(y @ y - (X @ w) @ (X @ w)), 4))
        output: |
          [1.1, 1.6] [0.2] 2
          0.2
        explanation: The routine returns the minimiser, the least sum of squares in an array of its own, and the rank, 2, which says the two columns are independent and the answer is unique. The last line gets the same 0.2 from Pythagoras, as the squared length of the heights minus that of the fitted values.
  work:
    - text: Slower now. The mathematics is two lines. The care goes into building the matrix that the two lines are applied to.
    - question:
        id: write-least-squares
        type: code
        mode: write
        system: s2
        prompt: |
          Write `least_squares(A, b)`. `A` has independent columns. Return the pair `(x_hat, sse)`: the solution of the normal equations, and the least sum of squares $\lVert A\hat{\mathbf{x}} - \mathbf{b}\rVert^2$ as a float. Use `np.linalg.solve`, not `np.linalg.lstsq`.
        starter: |
          import numpy as np


          def least_squares(A, b):
              # Solve the normal equations, then measure what is left.
              return np.zeros(A.shape[1]), 0.0


          X = np.array([[1.0, 0.0], [1.0, 1.0], [1.0, 2.0], [1.0, 3.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          w, sse = least_squares(X, y)
          print([round(float(v), 4) for v in w], round(sse, 4))
        solution: |
          import numpy as np


          def least_squares(A, b):
              x_hat = np.linalg.solve(A.T @ A, A.T @ b)
              r = A @ x_hat - b
              return x_hat, float(r @ r)


          X = np.array([[1.0, 0.0], [1.0, 1.0], [1.0, 2.0], [1.0, 3.0]])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          w, sse = least_squares(X, y)
          print([round(float(v), 4) for v in w], round(sse, 4))
        tests: |
          import numpy as _np
          _X = _np.array([[1.0, 0.0], [1.0, 1.0], [1.0, 2.0], [1.0, 3.0]])
          _y = _np.array([1.0, 3.0, 4.0, 6.0])
          _r = least_squares(_X, _y)
          assert isinstance(_r, tuple) and len(_r) == 2, "least_squares should return the pair (x_hat, sse)"
          _w, _s = _r
          assert _np.shape(_w) == (2,), "x_hat has one entry for each column of A"
          assert _np.allclose(_w, [1.1, 1.6]), "For the four points the solution is intercept 1.1 and slope 1.6: solve with A.T @ A on the left and A.T @ b on the right"
          assert isinstance(_s, float), "The sum of squares should be returned as a float"
          assert abs(_s - 0.2) < 1e-9, "For the four points the least sum of squares is 0.2: the sum of the squares of A @ x_hat - b"
          _w, _s = least_squares(_np.array([[2.0], [1.0]]), _np.array([2.0, 3.0]))
          assert _np.allclose(_w, [1.4]) and abs(_s - 3.2) < 1e-9, "For 2x = 2 and x = 3 the solution is 1.4 and the sum of squares is 3.2"
          _w, _s = least_squares(_np.array([[1.0], [1.0], [1.0]]), _np.array([1.0, 2.0, 6.0]))
          assert _np.allclose(_w, [3.0]) and abs(_s - 14.0) < 1e-9, "Fitting a constant to 1, 2, 6 gives their mean, 3, with a sum of squares of 14"
          _A = _np.random.default_rng(0).normal(size=(8, 3))
          _b = _np.random.default_rng(1).normal(size=8)
          _w, _s = least_squares(_A, _b)
          assert _np.allclose(_A.T @ (_A @ _w - _b), 0), "For a random 8 by 3 problem the residual should be orthogonal to the columns"
          assert abs(_s - float(_b @ _b - (_A @ _w) @ (_A @ _w))) < 1e-9, "The sum of squares should equal the squared length of b minus that of the fitted vector"
          _w, _s = least_squares(_A, _A @ _np.array([1.0, -2.0, 0.5]))
          assert _np.allclose(_w, [1.0, -2.0, 0.5]) and abs(_s) < 1e-12, "When b is in the column space the solution is exact and the sum of squares is 0"
          assert output.strip() == "[1.1, 1.6] 0.2", "The program should print [1.1, 1.6] 0.2"
        wrong:
          - |
            import numpy as np


            def least_squares(A, b):
                x_hat = np.linalg.solve(A.T @ A, A.T @ b)
                r = A @ x_hat - b
                return x_hat, float(r.sum())


            print("[1.1, 1.6] 0.2")
          - |
            import numpy as np


            def least_squares(A, b):
                x_hat = np.linalg.solve(A.T @ A, A.T @ b)
                r = A @ x_hat - b
                return x_hat, float(np.linalg.norm(r))


            print("[1.1, 1.6] 0.2")
          - |
            import numpy as np


            def least_squares(A, b):
                x_hat = A.T @ b
                r = A @ x_hat - b
                return x_hat, float(r @ r)


            print("[1.1, 1.6] 0.2")
          - |
            import numpy as np


            def least_squares(A, b):
                x_hat = np.linalg.solve(A.T @ A, A.T @ b)
                return x_hat, float(b @ b)


            print("[1.1, 1.6] 0.2")
        explanation: |
          The first line is the normal equations. The second and third measure the residual and take its squared length, as a dot product with itself.

          Summing the residual without squaring gives zero whenever there is a column of ones, since the residual is orthogonal to that column. A loss that is always zero is a warning sign. Taking the norm without squaring gives the length, 0.4472 for the line fit, where 0.2 is wanted.

          For this problem the function replaces the whole training loop of the autograd cluster. That loop is still needed for models that are not linear in their weights. Where the model **is** linear, as in the last layer of a network with everything before it held fixed, this is the exact answer that the loop approximates.
    - question:
        id: write-polynomial
        type: code
        mode: write
        system: s2
        prompt: |
          Write `design(x, degree)`, returning the design matrix for a polynomial of the given degree: one row for each entry of the array `x`, and columns $x^0, x^1, \dots, x^{\text{degree}}$ in that order, so the first column is all ones. Then write `fit_polynomial(x, y, degree)`, returning the least squares coefficients, lowest power first.

          `np.stack(columns, axis=1)` turns a list of equally long arrays into the columns of a matrix.
        starter: |
          import numpy as np


          def design(x, degree):
              return np.zeros((len(x), degree + 1))


          def fit_polynomial(x, y, degree):
              return np.zeros(degree + 1)


          x = np.array([-2.0, -1.0, 0.0, 1.0, 2.0])
          y = np.array([7.5, 3.5, 1.0, 2.5, 10.5])
          print(design(x, 2).tolist()[0])
          print([round(float(v), 4) for v in fit_polynomial(x, y, 2)])
        solution: |
          import numpy as np


          def design(x, degree):
              return np.stack([x ** k for k in range(degree + 1)], axis=1)


          def fit_polynomial(x, y, degree):
              A = design(x, degree)
              return np.linalg.solve(A.T @ A, A.T @ y)


          x = np.array([-2.0, -1.0, 0.0, 1.0, 2.0])
          y = np.array([7.5, 3.5, 1.0, 2.5, 10.5])
          print(design(x, 2).tolist()[0])
          print([round(float(v), 4) for v in fit_polynomial(x, y, 2)])
