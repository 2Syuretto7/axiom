          Stopping the range at `degree` loses the highest power. Starting it at 1 loses the constant. Stacking along axis 0 puts the features in rows. Running the powers downwards is a legitimate convention, and some libraries use it, but then the coefficients come back highest power first and anything that reads them the other way is wrong without an error.

