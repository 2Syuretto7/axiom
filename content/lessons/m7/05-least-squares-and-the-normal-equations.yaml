    - question:
        id: fix-no-intercept
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `fitted_line(x, y)` should return the heights of the least squares line at the given `x` values. For the four points it should return $(1.1, 2.7, 4.3, 5.9)$. It returns $(0, 2.0714, 4.1429, 6.2143)$: a line, and a plausible one, but with a sum of squared misses of 1.93 where 0.2 is possible. Fix it. One line needs to change.
        starter: |
          import numpy as np


          def fitted_line(x, y):
              A = np.stack([x], axis=1)
              w = np.linalg.solve(A.T @ A, A.T @ y)
              return A @ w


          x = np.array([0.0, 1.0, 2.0, 3.0])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          print([round(float(v), 4) for v in fitted_line(x, y)])
        solution: |
          import numpy as np


          def fitted_line(x, y):
              A = np.stack([np.ones(len(x)), x], axis=1)
              w = np.linalg.solve(A.T @ A, A.T @ y)
              return A @ w


          x = np.array([0.0, 1.0, 2.0, 3.0])
          y = np.array([1.0, 3.0, 4.0, 6.0])
          print([round(float(v), 4) for v in fitted_line(x, y)])
        tests: |
          import numpy as _np
          _x = _np.array([0.0, 1.0, 2.0, 3.0])
          _y = _np.array([1.0, 3.0, 4.0, 6.0])
          _f = fitted_line(_x, _y)
          assert _np.shape(_f) == (4,), "There should be one fitted height for each point"
          assert _np.allclose(_f, [1.1, 2.7, 4.3, 5.9]), "For the four points the fitted heights are 1.1, 2.7, 4.3, 5.9: the line needs an intercept, which is the coefficient of a column of ones"
          assert abs(float((_y - _f).sum())) < 1e-9, "With an intercept in the model the misses should add up to zero"
          assert _np.allclose(fitted_line(_x, _np.array([5.0, 5.0, 5.0, 5.0])), 5.0), "Points at a constant height of 5 should be fitted by the horizontal line at 5"
          assert _np.allclose(fitted_line(_np.array([10.0, 11.0, 12.0]), _np.array([3.0, 5.0, 7.0])), [3.0, 5.0, 7.0]), "Three points on the line y = 2x - 17 should be fitted exactly"
          assert _np.allclose(fitted_line(_x, 2 * _x), 2 * _x), "Points on a line through the origin should still be fitted exactly"
          assert output.strip() == "[1.1, 2.7, 4.3, 5.9]", "The program should print [1.1, 2.7, 4.3, 5.9]"
        wrong:
          - |
            import numpy as np


            def fitted_line(x, y):
                A = np.stack([x], axis=1)
                w = np.linalg.solve(A.T @ A, A.T @ y)
                return A @ w


            print("[1.1, 2.7, 4.3, 5.9]")
          - |
            import numpy as np


            def fitted_line(x, y):
                A = np.stack([x, x], axis=1)
                w = np.linalg.solve(A.T @ A + 1e-9 * np.eye(2), A.T @ y)
                return A @ w


            print("[1.1, 2.7, 4.3, 5.9]")
          - |
            import numpy as np


            def fitted_line(x, y):
                A = np.stack([np.zeros(len(x)) + y.mean(), x - x.mean()], axis=1)
                w = np.linalg.solve(A.T @ A + 1e-9 * np.eye(2), A.T @ y)
                return x * w[1]


            print("[1.1, 2.7, 4.3, 5.9]")
          - |
            import numpy as np


            def fitted_line(x, y):
                A = np.stack([x], axis=1)
                w = np.linalg.solve(A.T @ A, A.T @ y)
                return A @ w + y[0]


            print("[1.1, 2.7, 4.3, 5.9]")
        explanation: |
          The design matrix had one column, the $x$ values. The model it describes is $y = mx$, a line forced through the origin, and least squares found the best such line, with slope $29/14 = 2.0714$. The code solved correctly the problem it was given. The problem was the wrong one.

          An intercept is not built into least squares. It is the coefficient of a feature that equals 1 for every data point, and that feature has to be put into the matrix like any other. Libraries differ in whether they add it for you, which makes this one of the commonest mistakes in fitting.

          There is a quick test for it. With a column of ones in the model, the residual is orthogonal to that column, so the misses add up to zero. Here they add up to 1.57. Misses that do not sum to zero mean that the fit could be improved by shifting it up or down, and so that the model has no constant term.

          Adding the first height afterwards, as the last wrong version does, puts the line through the first point and is not a least squares fit of anything.
    - question:
        id: work-same-condition
        type: choice
        system: s2
        prompt: |
          The normal equations were derived twice, from orthogonality and from the gradient. Why do the two derivations give the same equations?
        options:
          - 'By coincidence, for this loss.'
          - 'The gradient of the squared distance is $2A^\top(A\mathbf{x} - \mathbf{b})$, whose entries are twice the dot products of the columns with the miss. Entry $j$ says how fast the loss changes when coefficient $j$ changes, which moves $A\mathbf{x}$ along column $j$. The loss stops changing in that direction exactly when the miss has no component along the column.'
          - 'Because $A^\top A$ is symmetric.'
          - 'Because gradient descent was used to derive both.'
        answer: 1
        explanation: |
          Moving coefficient $j$ slides the fitted point along column $j$. If the miss leans along that column, sliding one way shortens it, and the derivative is not zero. The derivative vanishes for every $j$ exactly when the miss is orthogonal to every column. Calculus and geometry are describing the same picture: the calculus speaks of the coefficients, and the geometry of the fitted vector. This identification holds for squared distance. Another measure of misfit, such as the sum of absolute misses, has a minimum too, but it is not a projection and has no normal equations.
    - question:
        id: work-sse
        type: numeric
        system: s2
        prompt: |
          A vector $\mathbf{b}$ with $\lVert\mathbf{b}\rVert^2 = 50$ is fitted by least squares, and the fitted vector $A\hat{\mathbf{x}}$ has squared length 41. What is the least sum of squared misses?
        answer: "9"
        explanation: |
          The fitted vector and the residual are orthogonal and add up to $\mathbf{b}$, so $50 = 41 + \lVert\mathbf{r}\rVert^2$ and the sum of squares is 9. The misses themselves were not needed. This holds only at the least squares solution. For any other choice of coefficients the two parts are not orthogonal and the squared lengths do not add.
    - question:
        id: work-exact-fit
        type: choice
        system: s2
        prompt: |
          Five data points are fitted with a polynomial of degree 4, which has five coefficients. The sum of squared misses is 0. What should be concluded?
        options:
          - 'The data follows a polynomial of degree 4.'
          - 'Nothing about the data. With five independent columns the column space is all of $\mathbb{R}^5$, so any five heights whatever are fitted exactly. The zero says that the model had as much freedom as there were measurements.'
          - 'Least squares has failed.'
          - 'The points lie on a line.'
        answer: 1
        explanation: |
          A square design matrix with independent columns is invertible, and $A\mathbf{x} = \mathbf{b}$ has an exact solution for every $\mathbf{b}$. A fit says something only when it could have failed: when there are more measurements than coefficients, the column space is a small part of the whole, and the data lands near it anyway. The honest test of a model is its miss on points it was not fitted to, which the learning track takes up.
    - question:
        id: work-dependent
        type: choice
        system: s2
        prompt: |
          A design matrix has columns ones, temperature in degrees Celsius, and temperature in kelvin, which is Celsius plus 273.15. What happens to least squares?
        options:
          - 'It works as usual and gives one answer.'
          - 'The third column is the second plus 273.15 times the first, so the columns are dependent. The fitted values are still uniquely determined, as the projection onto the column space, but infinitely many coefficient vectors produce them, $A^\top A$ is singular, and solving the normal equations fails or returns nonsense.'
          - 'There is no best fit at all.'
          - 'The fit improves, since there is an extra feature.'
        answer: 1
        explanation: |
          The column space is the same plane as without the third column, so the nearest point and the misses are unchanged. What is lost is uniqueness of the coefficients: any amount can be moved from the Celsius coefficient to the kelvin one, with the intercept compensating, and the predictions do not change. $A^\top A$ has a non-zero null space and no inverse. Choosing one answer among the infinitely many, in a principled way, is the business of the next lesson.
  connections:
    - text: |
        Six pairs of equations gave six lines, and none had a claim to be the answer. **Least squares** stops asking for $A\mathbf{x} = \mathbf{b}$ and asks for the $\mathbf{x}$ that makes $\lVert A\mathbf{x} - \mathbf{b}\rVert^2$ least. The answer solves the **normal equations**, $A^\top A\,\hat{\mathbf{x}} = A^\top\mathbf{b}$, which say at once that the residual is orthogonal to the columns and that the gradient of the loss is zero.

        The loss is an exact bowl, $E(\hat{\mathbf{x}} + \mathbf{d}) = E(\hat{\mathbf{x}}) + \lVert A\mathbf{d}\rVert^2$, so there is nothing to tune and nowhere to get stuck. The model enters only through the **design matrix**, and anything linear in its coefficients qualifies: lines, polynomials, combinations of any fixed features. With independent columns the solution is unique.

        That last condition has been assumed since the middle of this cluster. The final question above shows what happens without it: the fit survives and the coefficients do not. And there is the opposite shape of problem, with fewer equations than unknowns, where there is no misfit at all and still infinitely many solutions. Both need a rule for picking one answer, and a single matrix that plays, for every $A$, the part that $A^{-1}$ plays for an invertible one. That is the next lesson: [[m7.pseudo-inverse]].
