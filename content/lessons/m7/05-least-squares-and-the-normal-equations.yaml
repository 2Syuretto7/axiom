concept: m7.least-squares-and-the-normal-equations
minutes: 90
claim: You can recognise a system with more equations than unknowns as one that usually has no solution, replace it by the problem of making the sum of squared misses as small as possible, derive the normal equations for the minimiser both from the right angle of projection and from setting the gradient to zero, say when the minimiser is unique, build the design matrix for a model that is linear in its coefficients, and solve the problem in code by the normal equations and by a library routine.
recalls: [m7.projection-onto-a-subspace]
uses: [m7.gram-schmidt-and-qr, m7.orthogonal-subspaces, m5.elimination-and-linear-systems, m5.identity-and-inverse, m5.transpose, m5.rank, m5.column-space-and-null-space, m4.linear-independence, m4.norms-and-distance, m12.gradient, m12.hessian-and-symmetry-of-mixed-partials, e6.modules-parameters-and-optimisers, e5.linear-algebra-routines, e5.indexing-and-slicing, e5.arrays-dtype-and-shape, e5.axis-operations-and-reductions, e0.functions, e0.loops]
leads: [m7.pseudo-inverse, m7.conditioning, l2.linear-regression-in-closed-form-and-as-geometry, l2.ridge-and-lasso, l2.basis-and-polynomial-features, m8.positive-definite-matrices-and-cholesky]
starter: |
  # Scratch space. Four points, and a line has two unknowns: intercept and slope.
  # Any two of the four equations can be solved exactly. Try every pair.
  import numpy as np

  X = np.array([[1.0, 0.0], [1.0, 1.0], [1.0, 2.0], [1.0, 3.0]])
  y = np.array([1.0, 3.0, 4.0, 6.0])

  for i in range(4):
      for j in range(i + 1, 4):
          w = np.linalg.solve(np.array([X[i], X[j]]), np.array([y[i], y[j]]))
          print(i, j, [round(float(v), 4) for v in w])
parts:
  recall:
    - text: |
        [[m7.projection-onto-a-subspace]] found the nearest point of a column space and wrote it as a matrix. Today turns the same fact to face the other way: from a vector and a subspace, to a system of equations that has no solution and needs one anyway. Three quick pulls first.
  puzzle:
    - text: |
        A line $y = c + mx$ through the four points $(0, 1)$, $(1, 3)$, $(2, 4)$, $(3, 6)$ would have to satisfy four equations in two unknowns:

        $$c = 1, \qquad c + m = 3, \qquad c + 2m = 4, \qquad c + 3m = 6.$$

        Two equations are enough to fix two unknowns. The starter takes the equations two at a time and solves each pair exactly.

        ```
        0 1 [1.0, 2.0]
        0 2 [1.0, 1.5]
        0 3 [1.0, 1.6667]
        1 2 [2.0, 1.0]
        1 3 [1.5, 1.5]
        2 3 [0.0, 2.0]
        ```

        Six pairs, six different lines. The slopes run from 1 to 2 and the intercepts from 0 to 2. Each line passes exactly through its own two points and misses the other two, and no pair has a better claim than another. Elimination on all four equations at once reports what it must: the system is inconsistent.

        And yet a single answer is wanted. The four measurements are all the evidence there is, and each is a little wrong. Throwing two away to make the algebra work discards half the evidence and trusts the other half completely.

        **If no line satisfies all four equations, what should "the solution" mean? And is the line that gradient descent crept towards, intercept 1.1 and slope 1.6, one of a kind, or just one more candidate?**
  intuition:
    - text: |
        Write the four equations as $A\mathbf{x} = \mathbf{b}$, with $\mathbf{x} = (c, m)$, the column of ones and the column of $x$ values in $A$, and the heights in $\mathbf{b}$. As $\mathbf{x}$ varies, $A\mathbf{x}$ sweeps out the column space of $A$, a plane in $\mathbb{R}^4$. The system has a solution exactly when $\mathbf{b}$ lies in that plane. Four measured numbers have no reason to lie in a particular plane, and these do not.

        So change the question. Instead of demanding $A\mathbf{x} = \mathbf{b}$, ask for the $\mathbf{x}$ that makes $A\mathbf{x}$ **as close to $\mathbf{b}$ as possible**:

        $$\text{minimise} \quad \lVert A\mathbf{x} - \mathbf{b}\rVert^2 = \sum_i (\text{row } i \text{ of } A\mathbf{x} - b_i)^2.$$

        The quantity is the sum of the squares of the misses, one for each equation. This is the **least squares** problem. Every equation gets a say, none is satisfied exactly, and the total disagreement is as small as it can be.

        You have already solved it. The point of the column space nearest to $\mathbf{b}$ is the projection $\mathbf{p}$, and the $\hat{\mathbf{x}}$ with $A\hat{\mathbf{x}} = \mathbf{p}$ solves $A^\top A\,\hat{\mathbf{x}} = A^\top\mathbf{b}$. Nothing new has to be computed. What is new is the reading: **least squares replaces an unsolvable right-hand side by the nearest solvable one, and solves that.**

        The figure starts at the line through the first and third points, one of the puzzle's six.
    - figure: line-fit
      props: { slope: 1.5, intercept: 1 }
    - text: |
        That line misses the second and fourth points by 0.5 each, for a sum of squares of 0.5. Its misses add up to 1 and, weighted by $x$, to 2. All of its error falls on two points and none on the other two. Raise the intercept by one tenth and the slope by one tenth: now every point is missed, by at most 0.3, the sum of squares is 0.2, and both sums are zero. The best line passes through none of the points. It spreads the disagreement so that the misses cancel, both plainly and when weighted by $x$.
  derivation:
    - text: |
        **From geometry.** The minimiser satisfies $A^\top(\mathbf{b} - A\hat{\mathbf{x}}) = \mathbf{0}$, the leftover orthogonal to every column. Rearranged:

        $$A^\top A\,\hat{\mathbf{x}} = A^\top\mathbf{b}.$$

        These are the **normal equations**. "Normal" is an old word for perpendicular. They are what you get by multiplying both sides of the unsolvable $A\mathbf{x} = \mathbf{b}$ by $A^\top$, and that is the usual way to remember them. Multiplying by $A^\top$ is not an innocent step: it turns $m$ equations that cannot all hold into $n$ equations that can.

        **From calculus.** Forget the geometry and treat $E(\mathbf{x}) = \lVert A\mathbf{x} - \mathbf{b}\rVert^2$ as a function of several variables to be minimised. The autograd cluster computed its gradient many times:

        $$\nabla E(\mathbf{x}) = 2A^\top(A\mathbf{x} - \mathbf{b}).$$

        At a minimum the gradient is zero, and $2A^\top(A\mathbf{x} - \mathbf{b}) = \mathbf{0}$ is the normal equations again. **The right angle and the zero gradient are one condition.** Gradient descent moves $\mathbf{x}$ by a multiple of $-A^\top(A\mathbf{x} - \mathbf{b})$ at each step. It stops moving exactly when the leftover has no component along any column, which is when the leftover is orthogonal to the column space.

        **Is it really the minimum?** For any other $\mathbf{x} = \hat{\mathbf{x}} + \mathbf{d}$, the miss is $A\mathbf{x} - \mathbf{b} = (A\hat{\mathbf{x}} - \mathbf{b}) + A\mathbf{d}$. The first part is orthogonal to the column space and the second lies in it, so by Pythagoras

        $$E(\hat{\mathbf{x}} + \mathbf{d}) = E(\hat{\mathbf{x}}) + \lVert A\mathbf{d}\rVert^2.$$

        This is exact, with no higher-order terms. The loss is a bowl whose bottom is at $\hat{\mathbf{x}}$, and moving away by $\mathbf{d}$ costs $\lVert A\mathbf{d}\rVert^2$. There are no other valleys for descent to be trapped in. The minimiser is unique exactly when $A\mathbf{d} = \mathbf{0}$ forces $\mathbf{d} = \mathbf{0}$, that is, when the columns of $A$ are independent.

        **The line, by hand.** For the four points,

        $$A^\top A = \begin{pmatrix} 4 & 6 \\ 6 & 14 \end{pmatrix}, \qquad A^\top\mathbf{b} = \begin{pmatrix} 14 \\ 29 \end{pmatrix}.$$

        The entries are sums over the data: the number of points, the sum of the $x$ values, the sum of their squares, the sum of the heights, and the sum of the products $x_i y_i$. Solve $4c + 6m = 14$ and $6c + 14m = 29$. One and a half times the first is $6c + 9m = 21$. Subtracting, $5m = 8$, so $m = 1.6$ and $c = (14 - 9.6)/4 = 1.1$.

        The least value of the sum of squares does not need the misses. By Pythagoras it is $\lVert\mathbf{b}\rVert^2 - \lVert\mathbf{p}\rVert^2 = 62 - 61.8 = 0.2$.

        Gradient descent, after 40 steps from zero with learning rate 0.02, stood at intercept 1.0591 and slope 1.6192, with a loss of 0.2024. It was heading for this point all along.
    - question:
        id: derivation-two-equations
        type: numeric
        system: s2
        prompt: |
          Two instruments measure the same quantity $x$. The first is known to read double, and shows 2. The second reads true, and shows 3. So $2x = 2$ and $x = 3$, which cannot both hold. What is the least squares solution? Give it as a decimal.
        answer: "1.4"
        explanation: |
          $A$ is the single column $(2, 1)$ and $\mathbf{b} = (2, 3)$. The normal equation is $A^\top A\,x = A^\top\mathbf{b}$, which is $5x = 4 + 3 = 7$, so $x = 1.4$. It is not the average of the two separate answers, 1 and 3. The first equation carries more weight because its coefficient is larger: a change in $x$ moves its miss twice as fast. The misses are $2.8 - 2 = 0.8$ and $1.4 - 3 = -1.6$, and $(0.8, -1.6)$ is orthogonal to the column $(2, 1)$.
    - text: |
        **Design matrices.** Nothing above used the fact that the model was a line. What was used is that the prediction is $A\mathbf{x}$: a **linear combination of fixed columns**, with the unknowns as coefficients. The columns themselves may be anything computed from the data.

        To fit a parabola $y = c_0 + c_1 x + c_2 x^2$, give $A$ three columns: ones, the $x$ values, and their squares. To fit $y = c_0 + c_1\sin x$, use ones and $\sin x_i$. The matrix whose row $i$ holds the features of data point $i$ is the **design matrix**. "Linear" in "linear least squares" refers to the coefficients. The curve fitted can be as bent as the columns allow.

        A model such as $y = c\,e^{kx}$ is different in kind: $k$ is not a coefficient of a fixed column. Its loss is not a bowl, the normal equations do not apply, and it is back to descent.

        **Fitting a constant.** With one column of ones, the normal equation is $m\,c = \sum_i b_i$. The least squares fit of a constant to a list of numbers is their **mean**. For the four heights it is 3.5, with a sum of squares of 13. Bringing in the slope lowers that to 0.2.

        **Adding columns.** A larger design matrix has a larger column space, which contains the old one. The nearest point of a larger subspace is at least as near. So adding a feature never increases the least sum of squares **on the data used for fitting**. With as many independent columns as data points, the column space is everything and the misses are all zero. That is not a triumph. A model that can reproduce any measurements whatever has learned nothing from the ones it was given.

        **In code.** `np.linalg.solve(A.T @ A, A.T @ b)` solves the normal equations. `np.linalg.lstsq(A, b, rcond=None)` solves the least squares problem by a more careful route and returns four things: the minimiser, the least sum of squares, the rank of $A$, and a fourth array that the next cluster explains.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of fitting a model that is linear in its coefficients to data by least squares.
        steps:
          - 'Choose the features: the functions of the input whose combination will be the prediction.'
          - 'Build the design matrix $A$, one row for each data point and one column for each feature, and the vector $\mathbf{b}$ of measured values.'
          - 'Form $A^\top A$ and $A^\top\mathbf{b}$.'
          - 'Solve the normal equations for the coefficients.'
          - 'Compute the misses $A\hat{\mathbf{x}} - \mathbf{b}$ and check that $A^\top$ times them is zero.'
        explanation: The choice of features is the modelling decision and everything after it is mechanical. The final check is the same right angle as always, and it is also the statement that the gradient of the loss is zero.
  formal:
    - text: |
        Let $A \in \mathbb{R}^{m \times n}$ and $\mathbf{b} \in \mathbb{R}^m$.

        **Least squares problem.** Find $\hat{\mathbf{x}} \in \mathbb{R}^n$ minimising $E(\mathbf{x}) = \lVert A\mathbf{x} - \mathbf{b}\rVert^2$. The vector $\mathbf{r} = \mathbf{b} - A\hat{\mathbf{x}}$ is the **residual**.

        **Normal equations.** $\hat{\mathbf{x}}$ is a minimiser if and only if $A^\top A\,\hat{\mathbf{x}} = A^\top\mathbf{b}$, equivalently $A^\top\mathbf{r} = \mathbf{0}$, equivalently $\nabla E(\hat{\mathbf{x}}) = \mathbf{0}$. The normal equations always have at least one solution.

        **Uniqueness.** For any minimiser $\hat{\mathbf{x}}$ and any $\mathbf{d}$, $E(\hat{\mathbf{x}} + \mathbf{d}) = E(\hat{\mathbf{x}}) + \lVert A\mathbf{d}\rVert^2$. The minimiser is unique if and only if the columns of $A$ are linearly independent, and then $\hat{\mathbf{x}} = (A^\top A)^{-1}A^\top\mathbf{b}$. Otherwise the minimisers form the set $\hat{\mathbf{x}} + N(A)$. In every case the fitted vector $A\hat{\mathbf{x}}$ is the same: the projection of $\mathbf{b}$ onto the column space.

        **Least value.** $E(\hat{\mathbf{x}}) = \lVert\mathbf{b}\rVert^2 - \lVert A\hat{\mathbf{x}}\rVert^2$.

        **With QR.** If $A = QR$ with independent columns, the normal equations reduce to $R\,\hat{\mathbf{x}} = Q^\top\mathbf{b}$.

        **Hessian.** $\nabla^2 E = 2A^\top A$, constant, with $\mathbf{d}^\top(2A^\top A)\mathbf{d} = 2\lVert A\mathbf{d}\rVert^2 \ge 0$.
