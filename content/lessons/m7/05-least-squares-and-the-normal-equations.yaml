          assert _np.shape(_A) == (5, 3), "For five points and degree 2 the design matrix is 5 by 3"
          assert _np.allclose(_A[:, 0], 1.0), "The first column should be all ones, the power 0"
          assert _np.allclose(_A[:, 1], _x), "The second column should be x itself"
          assert _np.allclose(_A[:, 2], _x ** 2), "The third column should be the squares of x"
          assert _np.shape(design(_x, 0)) == (5, 1) and _np.allclose(design(_x, 0), 1.0), "Degree 0 is a single column of ones"
          assert _np.allclose(design(_np.array([3.0]), 3), [[1.0, 3.0, 9.0, 27.0]]), "For x = 3 and degree 3 the row is 1, 3, 9, 27"
          _c = fit_polynomial(_x, _y, 2)
          assert _np.shape(_c) == (3,), "A polynomial of degree 2 has three coefficients"
          assert _np.allclose(_c, [1.0, 0.5, 2.0]), "For these five points the best parabola is 1 + 0.5 x + 2 x squared, lowest power first"
          assert _np.allclose(fit_polynomial(_x, _y, 1), [5.0, 0.5]), "For these five points the best line is 5 + 0.5 x"
          assert _np.allclose(fit_polynomial(_x, _y, 0), [5.0]), "The best constant is the mean of y, 5"
          _t = _np.array([0.0, 1.0, 2.0, 3.0])
          assert _np.allclose(fit_polynomial(_t, _np.array([1.0, 3.0, 4.0, 6.0]), 1), [1.1, 1.6]), "For the four points of the line fit the coefficients are 1.1 and 1.6"
          assert _np.allclose(fit_polynomial(_t, 2 - _t + 3 * _t ** 3, 3), [2.0, -1.0, 0.0, 3.0]), "Data that is exactly a cubic should give back its coefficients"
          assert output.strip() == "[1.0, -2.0, 4.0]\n[1.0, 0.5, 2.0]", "The program should print [1.0, -2.0, 4.0] and then [1.0, 0.5, 2.0]"
