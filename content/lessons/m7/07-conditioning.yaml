          _e = 1e-6
          _A = _np.array([[1.0, 1.0], [1.0, 1.0 + _e], [1.0, 1.0 + 2 * _e], [1.0, 1.0 + 3 * _e]])
          _t = _np.array([-3.0, 5.0])
          try:
              _x = lstsq_qr(_A, _A @ _t)
          except _np.linalg.LinAlgError:
              assert False, "For nearly parallel columns the solver reported a singular matrix: factor A itself"
          assert float(_np.abs(_x - _t).max()) < 1e-7, "For four rows with columns differing by parts in a million the answer should be within a ten-millionth of (-3, 5)"
          assert output.strip() == "True", "The program should print True"
