          import numpy as np


          def trend(years, y, at):
              shift = 0.0
              t = years - shift
              A = np.stack([np.ones(len(t)), t, t ** 2], axis=1)
              c = np.linalg.solve(A.T @ A, A.T @ y)
              s = at - shift
              return float(c[0] + c[1] * s + c[2] * s ** 2)


          years = np.array([2000.0, 2001.0, 2002.0, 2003.0, 2004.0, 2005.0])
          u = years - 2000
          y = 3 + 0.5 * u + 0.25 * u ** 2
          print(round(trend(years, y, 2006.0), 6))
        solution: |
          import numpy as np


          def trend(years, y, at):
              shift = float(years.mean())
              t = years - shift
              A = np.stack([np.ones(len(t)), t, t ** 2], axis=1)
              c = np.linalg.solve(A.T @ A, A.T @ y)
              s = at - shift
              return float(c[0] + c[1] * s + c[2] * s ** 2)


          years = np.array([2000.0, 2001.0, 2002.0, 2003.0, 2004.0, 2005.0])
          u = years - 2000
          y = 3 + 0.5 * u + 0.25 * u ** 2
          print(round(trend(years, y, 2006.0), 6))
        tests: |
          import numpy as _np
          _years = _np.array([2000.0, 2001.0, 2002.0, 2003.0, 2004.0, 2005.0])
          _u = _years - 2000
          _y = 3 + 0.5 * _u + 0.25 * _u ** 2
          _keep = _years.copy()
          try:
              _v = trend(_years, _y, 2006.0)
          except _np.linalg.LinAlgError:
              assert False, "The solver reported a singular matrix: with raw years the three columns are nearly parallel. Subtract the mean year before building the design matrix"
          assert _np.array_equal(_years, _keep), "years should be left as it was"
          assert isinstance(_v, float), "trend should return a float"
          assert abs(_v - 15.0) < 1e-6, "For data that follows 3 + 0.5 u + 0.25 u squared exactly, the value in 2006 is 15 to within a millionth: the design matrix built from raw years is too ill-conditioned. Subtract the mean year"
          try:
              _v = trend(_years, _y, 2010.0)
          except _np.linalg.LinAlgError:
              assert False, "The solver reported a singular matrix: subtract the mean year before building the design matrix"
          assert abs(_v - 33.0) < 1e-6, "For the same data the value in 2010 is 3 + 5 + 25 = 33 to within a millionth"
          _z = _np.array([3.1, 3.6, 5.2, 6.6, 9.1, 11.8])
          try:
              _v = trend(_years, _z, 2006.0)
          except _np.linalg.LinAlgError:
              assert False, "The solver reported a singular matrix: subtract the mean year before building the design matrix"
          assert abs(_v - 15.14) < 1e-6, "For the measurements 3.1, 3.6, 5.2, 6.6, 9.1, 11.8 the fitted value in 2006 is 15.14"
          _s = _np.array([-2.0, -1.0, 0.0, 1.0, 2.0])
          assert abs(trend(_s, _np.array([7.5, 3.5, 1.0, 2.5, 10.5]), 3.0) - 20.5) < 1e-9, "For inputs already centred the result should be unchanged: 1 + 0.5 x + 2 x squared at x = 3 is 20.5"
          assert output.strip() == "15.0", "The program should print 15.0"
        wrong:
          - |
            import numpy as np


            def trend(years, y, at):
                shift = 0.0
                t = years - shift
                A = np.stack([np.ones(len(t)), t, t ** 2], axis=1)
                c = np.linalg.solve(A.T @ A, A.T @ y)
                s = at - shift
                return float(c[0] + c[1] * s + c[2] * s ** 2)


            print("15.0")
          - |
            import numpy as np


            def trend(years, y, at):
                shift = float(years.mean())
                t = years - shift
                A = np.stack([np.ones(len(t)), t, t ** 2], axis=1)
                c = np.linalg.solve(A.T @ A, A.T @ y)
                s = at
                return float(c[0] + c[1] * s + c[2] * s ** 2)


            print("15.0")
          - |
            import numpy as np


            def trend(years, y, at):
                shift = 1.0
                t = years - shift
                A = np.stack([np.ones(len(t)), t, t ** 2], axis=1)
                c = np.linalg.solve(A.T @ A, A.T @ y)
                s = at - shift
                return float(c[0] + c[1] * s + c[2] * s ** 2)


            print("15.0")
          - |
            import numpy as np


            def trend(years, y, at):
                shift = 0.0
                t = years - shift
                A = np.stack([np.ones(len(t)), t, t ** 2], axis=1)
                c = np.linalg.solve(A.T @ A + 1e-3 * np.eye(3), A.T @ y)
                s = at - shift
                return float(c[0] + c[1] * s + c[2] * s ** 2)


            print("15.0")
        explanation: |
          With `shift = 0.0` the design matrix has columns of ones, of numbers near 2000, and of numbers near 4 000 000. Over six years the second column varies by a quarter of a per cent, and all three are nearly parallel. Its condition number is about $6 \times 10^{12}$, and the normal equations square that to beyond anything 16 digits can hold. The computed coefficients are huge numbers that almost cancel, and the cancellation is not exact.

          Setting the shift to the mean year moves the origin to the middle of the data. The columns become ones, $(-2.5, \dots, 2.5)$ and their squares, with a condition number of about 6. The same normal equations then give fifteen correct digits. The parabola is the same curve as before, written about a different origin. That is why the function evaluates it at `at - shift`: a model fitted to shifted inputs has to be given shifted inputs, which is what the second wrong version forgets.

          Changing the solver to QR would also help, and is what a library routine does. But it would leave a condition number of $10^{12}$, with four digits of safety, where centring leaves a condition number of 6. **Fix the problem before fixing the method.**

          The last wrong version adds a ridge to make the matrix safely invertible. It runs without error on every machine, and returns the answer to a different question.
    - question:
        id: work-residual
        type: choice
        system: s2
        prompt: |
          For the puzzle's system with right-hand side $(2, 2.0001)$, a program returns $(-1, 3)$. Substituting back gives $(2, 2.0003)$, a residual of size 0.0002. A colleague says the answer is verified to four decimal places. Is that right?
        options:
          - 'Yes. A residual of 0.0002 means the answer is correct to about 0.0002.'
          - 'No. The residual measures the error after the matrix has been applied to it. This matrix shrinks the direction $(1, -1)$ by a factor of about fourteen thousand, so an error of 2 in each entry along that direction appears in the residual as 0.0002. The true answer is $(1, 1)$.'
          - 'No, because the residual should be exactly zero.'
          - 'Yes, since the matrix is invertible.'
        answer: 1
        explanation: |
          If $\hat{\mathbf{x}} = \mathbf{x} + \mathbf{e}$, the residual is $A\mathbf{e}$, and $\lVert A\mathbf{e}\rVert$ can be as small as $\sigma_{\min}\lVert\mathbf{e}\rVert$. A small residual bounds the error only through $\lVert\mathbf{e}\rVert \le \lVert A\mathbf{e}\rVert/\sigma_{\min}$, and here $\sigma_{\min}$ is about 0.00005. In a fitting problem the same fact reads: two very different sets of coefficients can predict the training data almost equally well. When that happens, the predictions may be trusted on similar data and the individual coefficients may not be interpreted at all.
    - question:
        id: work-digits
        type: numeric
        system: s2
        prompt: |
          A design matrix has condition number $10^5$. Arithmetic carries 16 decimal digits. About how many correct digits can be expected in the coefficients if the least squares problem is solved by the normal equations?
        answer: "6"
        explanation: |
          The normal equations have condition number $(10^5)^2 = 10^{10}$, which can cost 10 of the 16 digits, leaving about 6. Solving by QR meets a condition number of $10^5$ and leaves about 11. Five digits are lost to the choice of method alone. At a condition number of $10^8$, which is not unusual for a polynomial of moderate degree on uncentred data, the normal equations leave nothing and QR still leaves eight.
    - question:
        id: work-determinant
        type: choice
        system: s2
        prompt: |
          A 100 by 100 matrix is $0.1\,I$. Its determinant is $10^{-100}$. A program tests for near-singularity by comparing the determinant with $10^{-12}$, and rejects the matrix. What should it have done?
        options:
          - 'Used a smaller threshold, such as $10^{-200}$.'
          - 'Computed the condition number, which is 1. The matrix is as well-conditioned as a matrix can be, and solving with it is multiplication by 10. The determinant is the product of the stretches and collapses towards zero or overflows with the dimension, whatever their ratio. No threshold on it is meaningful.'
          - 'Rejected it, since the determinant is essentially zero.'
          - 'Multiplied the matrix by itself first.'
        answer: 1
        explanation: |
          The determinant answers a yes-or-no question exactly: zero or not. It does not measure distance from singularity, because it changes by $c^n$ when the matrix is multiplied by $c$, while the difficulty of solving does not change at all. The lesson on the determinant warned against testing invertibility in floating point by comparing a determinant with zero. The condition number is the quantity that warning was pointing at.
    - question:
        id: work-units
        type: choice
        system: s2
        prompt: |
          A model has two features: a length in kilometres, with values around 1, and the same kind of quantity for another part in millimetres, with values around 1 000 000. The features are unrelated to each other. Is the design matrix well-conditioned?
        options:
          - 'Yes, since the columns are not nearly parallel.'
          - 'No. Even orthogonal columns give a large condition number if their lengths differ greatly: the matrix stretches one coordinate direction a million times more than the other. Rescaling each column to a comparable size, for example to unit standard deviation, removes this, and changes nothing about the fitted values.'
          - 'It cannot be known without the data.'
          - 'Yes, since larger numbers are more precise.'
        answer: 1
        explanation: |
          For a matrix with orthogonal columns the stretches are the column lengths, so the condition number is the ratio of the longest to the shortest. Ill-conditioning has two sources, columns that are nearly parallel and columns of very different size, and standardising the features deals with the second as centring deals with the commonest case of the first. It also matters for gradient descent, where a badly scaled feature forces a small learning rate on every weight. Rescaling a column changes its coefficient by the inverse factor and leaves the column space, and so every prediction, as it was.
  connections:
    - text: |
        One part in ten thousand of change in the data moved the solution from $(1, 1)$ to $(-1, 3)$, because the two columns of the matrix were nearly parallel and the matrix stretched one direction forty thousand times more than another. The **condition number**, greatest stretch over least, measures this, and bounds the relative error of a solution by $\kappa$ times the relative error of the data. Neither the determinant nor a small residual does.

        Of this cluster's two ways to solve least squares, the normal equations work with $\kappa(A)^2$ and QR with $\kappa(A)$. Before choosing between them, improve the problem: centre the features, scale them, and drop the ones that repeat each other.

        That completes the cluster. A subspace and its orthogonal complement split every vector in two. An orthonormal basis makes the split a matter of dot products, and Gram-Schmidt builds one. The split is a projection, the projection solves least squares, the pseudo-inverse extends it to every matrix, and the condition number says how far to trust the result.

        One thing was left without proof today: the greatest and least stretch of a matrix were asserted to exist and were never computed by hand. They are the largest and smallest of a list of numbers, one for each dimension, that describe a matrix completely: along certain orthogonal directions it simply stretches, by those amounts. Finding the directions and the amounts is the work of the spectral cluster, and it ends in the factorisation that makes the pseudo-inverse, the condition number and the best low-rank approximation all visible at once: [[m8.singular-value-decomposition]].
