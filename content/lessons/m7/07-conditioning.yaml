          - |
            import numpy as np


            def lstsq_qr(A, b):
                return np.linalg.solve(A.T @ A, A.T @ b)


            print("True")
          - |
            import numpy as np


            def lstsq_qr(A, b):
                Q, R = np.linalg.qr(A)
                return Q.T @ b


            print("True")
          - |
            import numpy as np


            def lstsq_qr(A, b):
                Q, R = np.linalg.qr(A)
                return np.linalg.solve(R.T @ R, A.T @ b)


            print("True")
          - |
            import numpy as np


            def lstsq_qr(A, b):
                Q, R = np.linalg.qr(A)
                return np.linalg.solve(R.T, Q.T @ b)


            print("True")
        explanation: |
          Two lines, the same two as in the lesson on Gram-Schmidt, where they were a convenience. Here they are a necessity. The matrix has a condition number of about 24 million. The normal equations square that to about $6 \times 10^{14}$, and with 16 digits to spend, one or two are left: each coefficient comes back wrong by about 0.06. QR works with the unsquared number and keeps about nine digits.

          The third wrong version is the instructive one. It computes a QR factorisation and then solves $R^\top R\,\mathbf{x} = A^\top\mathbf{b}$. Since $A^\top A = R^\top R$, that is the normal equations again, reached by a longer road, and it is just as inaccurate. The benefit of QR does not come from having computed the factors. It comes from never multiplying the matrix by its own transpose.

          Notice what the test had to do to find the difference: it compared with a known true answer. On the line fit both methods agree to fifteen digits, and a test suite of well-conditioned examples would pass either.
    - question:
        id: fix-uncentred
        type: code
        mode: find-bug
