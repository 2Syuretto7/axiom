        prompt: |
          `trend(years, y, at)` fits a parabola to yearly measurements and returns its value in the year `at`. The data in the program follows $3 + 0.5u + 0.25u^2$ exactly, with $u$ the number of years since 2000, so the value in 2006 is exactly 15. The function returns about 14.998, wrong in the fourth significant digit although every number given to it is exact. On another machine it may stop with a singular matrix error instead. Fix it so that it is accurate to a millionth. One line needs to change, and the solver may stay as it is.
