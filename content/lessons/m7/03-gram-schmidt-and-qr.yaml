        explanation: |
          The line `R[i, j] = Q[:, i] @ A[:, j]` measures the **original** column against each earlier direction. That is the classical process. Changing it to `Q[:, i] @ v` measures the column **as reduced so far**, which is the modified process.

          Here is why it matters for this matrix. The three columns differ from one another only in entries of size $10^{-8}$, whose squares, $10^{-16}$, are below what a 64-bit float can register next to 1. After the first subtraction the second and third remainders are tiny vectors made almost entirely of rounding. The second step produces a $\mathbf{q}_2$ that is not quite orthogonal to $\mathbf{q}_1$. The classical form, computing the third column's coefficients from the untouched original, never sees that, and the leftover contamination, tiny in absolute size, is then magnified by the division by a tiny length. The modified form measures the remainder it actually has, contamination included, and removes it.

          In exact arithmetic the two lines give the same number. That is what makes this bug instructive: **the algebra cannot tell the two versions apart, and one of them is wrong by one half.** The check that revealed it is the one to run after any orthogonalisation: compute $Q^\top Q$ and compare with the identity.
    - question:
        id: work-triangular
        type: choice
        system: s2
        prompt: |
          Why is the matrix $R$ of a QR factorisation upper triangular?
        options:
          - 'Because $Q$ is orthogonal.'
          - 'Because column $j$ of $A$ is rebuilt from $\mathbf{q}_1, \dots, \mathbf{q}_j$ alone. The later $\mathbf{q}$''s were made orthogonal to the span of the first $j$ columns, which contains $\mathbf{a}_j$, so their coefficients $r_{ij} = \mathbf{q}_i \cdot \mathbf{a}_j$ with $i > j$ are zero.'
          - 'Because elimination was applied to it.'
          - 'Because $A$ is square.'
        answer: 1
        explanation: |
          $r_{ij} = \mathbf{q}_i \cdot \mathbf{a}_j$. For $i > j$, the vector $\mathbf{q}_i$ is orthogonal to $\mathbf{q}_1, \dots, \mathbf{q}_j$, hence to their span, which is the span of $\mathbf{a}_1, \dots, \mathbf{a}_j$, and $\mathbf{a}_j$ lies in it. The triangular shape is the algebraic trace of the order in which the columns were processed: each column may depend on earlier directions and never on later ones.
    - question:
        id: work-det
        type: numeric
        system: s2
        prompt: |
          A 3 by 3 matrix $A$ has the factorisation $A = QR$ with $R = \begin{pmatrix} 3 & 3 & 5 \\ 0 & 3 & 1 \\ 0 & 0 & 4 \end{pmatrix}$. What is the absolute value of $\det A$?
        answer: "36"
        explanation: |
          $\det A = \det Q \cdot \det R$. An orthogonal matrix has determinant $\pm1$, and a triangular matrix has the product of its diagonal as its determinant: $3 \times 3 \times 4 = 36$. Geometrically, the volume of the box on the columns of $A$ is the length of the first column, times the height of the second above the first, times the height of the third above the plane of the first two. Those three heights are the diagonal of $R$.
    - question:
        id: work-mean
        type: choice
        system: s2
        prompt: |
          A data matrix has a column of ones followed by a column of measurements. Gram-Schmidt replaces the second column by the measurements minus their mean, scaled. What does that say about fitting a line to centred data?
        options:
          - 'Nothing. It is a coincidence of this example.'
          - 'If the $x$ values are centred first, the column of ones and the column of $x$ are already orthogonal, so the intercept and the slope can each be found alone: the intercept is the mean of the $y$ values, and the slope is the dot product of $y$ with the centred $x$ divided by the squared length of the centred $x$.'
          - 'Centred data cannot be fitted by a line.'
          - 'The slope becomes zero.'
        answer: 1
        explanation: |
          With orthogonal columns each coefficient is one projection, independent of the other. For the puzzle's data, the mean of $y$ is 3.5 and the centred $x$ is $(-1.5, -0.5, 0.5, 1.5)$, so the slope is $(-1.5 - 1.5 + 2 + 9)/5 = 1.6$, and the line is $y = 3.5 + 1.6(x - 1.5)$, which is $1.6x + 1.1$. This is why centring features before fitting is standard advice: it removes the overlap between each feature and the constant column, the largest overlap there usually is.
    - question:
        id: work-library
        type: choice
        system: s2
        prompt: |
          `np.linalg.qr` returns, for the line fit's matrix, an $R$ whose entries are $-2$, $-3$ and $-2.2361$ where Gram-Schmidt by hand gives 2, 3 and 2.2361. Is one of them wrong?
        options:
          - 'Yes, the library has a bug.'
          - 'No. Negating a column of $Q$ and the matching row of $R$ leaves the product $QR$ unchanged, so the factorisation is determined only up to these signs. Gram-Schmidt fixes them by making the diagonal of $R$ positive. The library uses a different method and does not.'
          - 'Yes, the hand calculation is wrong.'
          - 'They are factorisations of different matrices.'
        answer: 1
        explanation: |
          $(-\mathbf{q})(-r) = \mathbf{q}r$. Both pairs are valid: orthonormal columns times an upper triangular matrix, with the right product. Anything computed from the factorisation in a way that does not depend on that choice, such as the solution of $R\mathbf{c} = Q^\top\mathbf{b}$ or the projection $QQ^\top\mathbf{b}$, comes out the same. A test that compares a hand-written $R$ with the library's must compare up to sign, or compare the products.
  connections:
    - text: |
        Dividing the two columns of the line fit by their lengths left an overlap of 0.8018, because scaling does not turn a vector. **Gram-Schmidt** turns it: from each column, subtract its projections onto the orthonormal directions already found, and normalise what remains. For a column of ones followed by data, that subtraction is centring.

        The numbers the process uses form an upper triangular $R$, and the result is the factorisation $A = QR$: orthonormal columns times a triangular matrix. Coefficients then come from $R\mathbf{c} = Q^\top\mathbf{b}$ by **back substitution**. In floating point, measure each coefficient on the current remainder, the **modified** form, and check $Q^\top Q$ against the identity.

        You can now build an orthonormal basis of any column space, and with it project onto that space. So far the projection has been seen only through such a basis, as $QQ^\top\mathbf{b}$. But it is a property of the subspace and not of the basis chosen for it, and it can be written directly in terms of the original matrix $A$. Doing so gives a single matrix that carries every vector to its nearest point in the subspace, with properties that say a great deal in two short equations. That is the next lesson: [[m7.projection-onto-a-subspace]].
