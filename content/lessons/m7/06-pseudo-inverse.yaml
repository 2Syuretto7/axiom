          print([[round(float(v), 4) for v in row] for row in pinv_full_rank(A) * 3])
        solution: |
          import numpy as np


          def pinv_full_rank(A):
              m, n = A.shape
              if m >= n:
                  return np.linalg.solve(A.T @ A, A.T)
              return A.T @ np.linalg.inv(A @ A.T)


          A = np.array([[1.0, 0.0, 1.0], [0.0, 1.0, 1.0]])
          print([[round(float(v), 4) for v in row] for row in pinv_full_rank(A) * 3])
        tests: |
          import numpy as _np
          _A = _np.array([[1.0, 0.0, 1.0], [0.0, 1.0, 1.0]])
          try:
              _P = pinv_full_rank(_A)
          except _np.linalg.LinAlgError:
              assert False, "For a wide matrix, A.T @ A is singular: the wide formula, with A @ A.T, is the one to use when there are fewer rows than columns"
          assert _np.shape(_P) == (3, 2), "The pseudo-inverse of a 2 by 3 matrix is 3 by 2"
          assert _np.allclose(_P * 3, [[2.0, -1.0], [-1.0, 2.0], [1.0, 1.0]]), "For the puzzle's matrix, three times the pseudo-inverse is [[2, -1], [-1, 2], [1, 1]]"
          assert _np.allclose(_A @ _P, _np.eye(2)), "For a wide matrix of full rank, A @ A+ should be the identity"
          _X = _np.array([[1.0, 0.0], [1.0, 1.0], [1.0, 2.0], [1.0, 3.0]])
          try:
              _P = pinv_full_rank(_X)
          except _np.linalg.LinAlgError:
              assert False, "For a tall matrix, A @ A.T is singular: the tall formula, with A.T @ A, is the one to use when there are at least as many rows as columns"
          assert _np.allclose(_P, [[0.7, 0.4, 0.1, -0.2], [-0.3, -0.1, 0.1, 0.3]]), "For the line fit's tall matrix the pseudo-inverse is [[0.7, 0.4, 0.1, -0.2], [-0.3, -0.1, 0.1, 0.3]]"
          _S = _np.array([[2.0, 1.0], [1.0, 1.0]])
          assert _np.allclose(pinv_full_rank(_S), [[1.0, -1.0], [-1.0, 2.0]]), "For an invertible square matrix the result should be its inverse"
          _B = _np.random.default_rng(0).normal(size=(3, 6))
          assert _np.allclose(pinv_full_rank(_B), _np.linalg.pinv(_B)) and _np.allclose(pinv_full_rank(_B.T), _np.linalg.pinv(_B.T)), "For a random 3 by 6 matrix and its transpose the result should agree with the library"
          assert output.strip() == "[[2.0, -1.0], [-1.0, 2.0], [1.0, 1.0]]", "The program should print [[2.0, -1.0], [-1.0, 2.0], [1.0, 1.0]]"
