            def pinv_full_rank(A):
                m, n = A.shape
                if m >= n:
                    return np.linalg.solve(A.T @ A, A.T)
                return A.T


            print("[[2.0, -1.0], [-1.0, 2.0], [1.0, 1.0]]")
          - |
            import numpy as np


            def pinv_full_rank(A):
                m, n = A.shape
                return A.T @ np.linalg.inv(A @ A.T)


            print("[[2.0, -1.0], [-1.0, 2.0], [1.0, 1.0]]")
        explanation: |
          The comparison was the wrong way round, so each shape was sent to the other's formula. For the 2 by 3 matrix, $A^\top A$ is 3 by 3 but has rank 2, the rank of $A$. It has no inverse, and the solver says so.

          The rule behind the choice: $A^\top A$ is invertible when the **columns** are independent, and $AA^\top$ when the **rows** are. A matrix cannot have more independent columns than it has rows. So for a wide matrix $A^\top A$ is always singular, and for a tall one $AA^\top$ always is. Invert the smaller of the two products.

          Here the mistake was announced by an error, which is the fortunate case. Had the matrix been only **nearly** singular, the solver would have returned an answer with no warning, and the answer would have been mostly rounding. How to tell, and how much to trust the result of solving a linear system at all, is the next lesson.
    - question:
        id: work-row-space
        type: choice
        system: s2
        prompt: |
          Why is the shortest solution of $A\mathbf{x} = \mathbf{b}$ the one that lies in the row space of $A$?
        options:
          - 'Because the row space is smaller than the null space.'
          - 'Any solution is a row space part plus a null space part, and the two are orthogonal. $A$ ignores the null space part, so the row space part alone already solves the system, and it is the same for every solution. The null space part adds its squared length to the total and contributes nothing, so the shortest solution has none.'
          - 'Because $\mathbf{b}$ lies in the row space.'
          - 'It is a convention, and any solution could have been chosen.'
        answer: 1
        explanation: |
          $\lVert\mathbf{x}\rVert^2 = \lVert\mathbf{x}_r\rVert^2 + \lVert\mathbf{x}_n\rVert^2$, with $\mathbf{x}_r$ fixed by the equations and $\mathbf{x}_n$ free. The minimum is at $\mathbf{x}_n = \mathbf{0}$. Note that $\mathbf{b}$ lives in a different space from $\mathbf{x}$, with one entry for each equation and not for each unknown, so it cannot be in the row space. The picture to hold is the first lesson's: the row space and the null space split the space of unknowns at right angles, and the equations see only one of the two.
    - question:
        id: work-not-inverse
        type: choice
        system: s2
        prompt: |
          For the line fit's 4 by 2 matrix $X$, the pseudo-inverse satisfies $X^+X = I$. A colleague concludes that $X\mathbf{w} = \mathbf{y}$ can be solved exactly as $\mathbf{w} = X^+\mathbf{y}$. What is wrong?
        options:
          - 'Nothing. $X^+$ is the inverse of $X$.'
          - '$X^+X = I$ says that weights survive the round trip: from $\mathbf{w}$ to $X\mathbf{w}$ and back. It says nothing about starting from an arbitrary $\mathbf{y}$. Going from $\mathbf{y}$ to $X^+\mathbf{y}$ and forward again gives $XX^+\mathbf{y}$, the projection of $\mathbf{y}$, which equals $\mathbf{y}$ only if $\mathbf{y}$ was in the column space to begin with.'
          - '$X^+X$ is not the identity.'
          - 'The pseudo-inverse of a tall matrix does not exist.'
        answer: 1
        explanation: |
          A left inverse undoes $X$. It does not make $X$ reach everything. $X\,X^+\mathbf{y} = (1.1, 2.7, 4.3, 5.9)$, not $(1, 3, 4, 6)$. For a true inverse both products are the identity, which is possible only for a square matrix. The pseudo-inverse splits the two halves of invertibility: a tall matrix of full rank keeps "nothing is lost going forward", and a wide one keeps "everything can be reached".
    - question:
        id: work-rank-deficient
        type: numeric
        system: s2
        prompt: |
          The equations $x_1 + x_2 = 1$, $x_1 + x_2 = 2$, $x_1 + x_2 = 6$ have no solution, and their least squares solutions are all the pairs with $x_1 + x_2 = 3$. What is $x_1$ in the solution the pseudo-inverse returns? Give a decimal.
        answer: "1.5"
        explanation: |
          Among the pairs with sum 3, the shortest is the one in the row space, the line through $(1, 1)$: $x_1 = x_2 = 1.5$. Both steps of the definition are visible. The inconsistent right-hand side $(1, 2, 6)$ is replaced by its projection onto the column space, $(3, 3, 3)$. Then, of the many solutions of the repaired system, the one with no null space part is taken. With two identical columns nothing in the data distinguishes them, and the pseudo-inverse treats them alike.
    - question:
        id: work-ridge
        type: choice
        system: s2
        prompt: |
          For the puzzle's system, solving $(A^\top A + \lambda I)\mathbf{x} = A^\top\mathbf{b}$ gives $(0.75, 0.75, 1.5)$ for $\lambda = 1$, $(0.9967, 0.9967, 1.9934)$ for $\lambda = 0.01$, and $(1, 1, 2)$ to four places for $\lambda = 10^{-6}$. What does this suggest?
        options:
          - 'That adding $\lambda I$ is a mistake.'
          - 'Adding a small multiple of the identity makes the singular matrix $A^\top A$ invertible, which amounts to adding a small penalty on the length of $\mathbf{x}$. As the penalty shrinks, the solution tends to the pseudo-inverse solution, the shortest one. The pseudo-inverse is the limit of a preference for small solutions as that preference becomes infinitely weak.'
          - 'That the system has a unique solution.'
          - 'That $\lambda$ should be as large as possible.'
        answer: 1
        explanation: |
          The modified equations are the normal equations of minimising $\lVert A\mathbf{x} - \mathbf{b}\rVert^2 + \lambda\lVert\mathbf{x}\rVert^2$. For any $\lambda > 0$ the minimiser is unique and lies in the row space. A large $\lambda$ gives up some fit to gain shortness, as at $\lambda = 1$, where the equations are missed. A vanishing $\lambda$ fits as well as possible and uses shortness only to break ties. This penalised problem is ridge regression, a standard tool of the learning track, and it is also the practical way to compute with matrices that are close to rank deficient.
  connections:
    - text: |
        Two equations in three unknowns had infinitely many solutions, and `pinv` returned $(1, 1, 2)$. Every solution is that vector plus something from the null space, which the equations cannot see and which only adds length. The **shortest solution lies in the row space**, and for independent rows it is $A^\top(AA^\top)^{-1}\mathbf{b}$.

        With the last lesson's $(A^\top A)^{-1}A^\top$ for independent columns, that makes two mirror-image formulas, each a one-sided inverse. Behind both is one definition valid for every matrix: the **pseudo-inverse** $A^+$ sends $\mathbf{b}$ to the shortest of the vectors that minimise $\lVert A\mathbf{x} - \mathbf{b}\rVert$. It is where gradient descent from zero ends up, and the limit of a vanishing penalty on length.

        Everything in this cluster has so far been exact: a matrix has independent columns or it does not, and $A^\top A$ is invertible or singular. Computation is not like that. Columns can be almost dependent, a matrix almost singular, and then the formulas run without complaint and return digits that mean nothing. The last lesson of the cluster measures how close to that edge a problem sits, and shows that one of the formulas you have been using, the normal equations, moves every problem closer to it. That is [[m7.conditioning]].
