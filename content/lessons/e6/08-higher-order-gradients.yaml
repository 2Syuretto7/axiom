          Take the gradient as nodes, form $s = \sum_i g_i v_i$ with each $v_i$ wrapped as a constant, and take the gradient of $s$. The first pass produces nodes, the weighted sum is built with recorded operations, and the second pass reads the answer off.

          Summing the gradient entries without the weights computes $H$ applied to the vector of all ones. Multiplying the **numbers** `g.data * vi` gives the right value of $s$ on a node with no history, and every entry of the answer is 0. Differentiating each gradient entry with respect to its own input uses only the diagonal of the Hessian. The last wrong version is correct arithmetic and the wrong algorithm: it differentiates every gradient entry separately, one pass for each input, building the whole Hessian a row at a time to use it once. For two inputs nobody would notice. For a million it would never finish, and avoiding it is the point of the product.
