        solution: |
          class Value:
              def __init__(self, data, parents=()):
                  self.data = data
                  self.parents = parents

              def __add__(self, other):
                  return Value(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

              def __sub__(self, other):
                  return Value(self.data - other.data, ((self, lambda g: g), (other, lambda g: g * Value(-1.0))))

              def __mul__(self, other):
                  return Value(self.data * other.data, ((self, lambda g: g * other), (other, lambda g: g * self)))


          def topological(node):
              order = []
              seen = set()

              def visit(v):
                  if v in seen:
                      return
                  seen.add(v)
                  for parent, pull in v.parents:
                      visit(parent)
                  order.append(v)

              visit(node)
              return order


          def gradient(node, inputs):
              grads = {node: Value(1.0)}
              for v in topological(node)[::-1]:
                  for parent, pull in v.parents:
                      share = pull(grads[v])
                      grads[parent] = grads[parent] + share if parent in grads else share
              return [grads[x] if x in grads else Value(0.0) for x in inputs]


          x = Value(5.0)
