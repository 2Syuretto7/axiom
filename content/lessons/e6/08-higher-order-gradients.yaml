          _a = Value(2.0); _b = Value(3.0); _c = Value(7.0)
          _f = _a * _a * _b + _b * _b * _b
          _g = gradient(_f, [_a, _b, _c])
          assert len(_g) == 3, "gradient should return one entry for each input"
          assert all(isinstance(_v, Value) for _v in _g), "Each gradient should be a Value, so that it can be differentiated again"
          assert _g[0].data == 12.0 and _g[1].data == 31.0, "For a squared times b plus b cubed at (2, 3) the gradient is (12, 31): add the shares that reach the same node, and take nodes in reverse topological order"
          assert _g[2].data == 0.0, "An input the result does not depend on should get a gradient of 0"
          _h = gradient(_g[0], [_a, _b])
          assert _h[0].data == 6.0 and _h[1].data == 4.0, "Differentiating the first gradient entry again should give the Hessian row (6, 4): pass each pull the gradient node itself, not a copy of its number"
          _h = gradient(_g[1], [_a, _b])
          assert _h[0].data == 4.0 and _h[1].data == 18.0, "Differentiating the second gradient entry again should give the Hessian row (4, 18)"
