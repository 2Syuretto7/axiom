        explanation: |
          The pull multiplied the incoming gradient by `Value(1 - t * t)`, where `t` is a float. The number is right, which is why the first derivative is right. But $1 - \tanh^2 z$ depends on $z$, and a fresh `Value` made from a float does not know that. The first derivative's graph ended in a constant, and its derivative was 0.

          The local derivative has to be **built out of nodes**. The neatest node to build it from is the result itself: $\tanh' = 1 - \tanh^2$, so the pull is `g * (Value(1.0) - out * out)` with `out` the node that `tanh` returns. The node must exist before its pull can mention it, so it is created first and given its parents on the next line. Now the first derivative contains `out * out`, which leads back through `out` to `z`, and can be differentiated as often as you like.

          Wrapping `out.data` in fresh values is the same bug written more elaborately.

          **The rule for writing a pull in a twice-differentiable engine: every quantity in it that depends on the operands must be a node, reached by recorded operations. A bare number in a pull is a claim that the local derivative is a constant.** For addition that claim is true. For almost everything else it is false, and only a second-derivative test will catch it.
    - question:
        id: work-newton
        type: numeric
        system: s2
        prompt: |
          Newton's method for a minimum of $f$ replaces $x$ by $x - f'(x) / f''(x)$. For $f(x) = x^3 - 12x$ at $x = 3$, the engine returns `d1.data` and `d2.data` from two calls of `gradient`. What is the next $x$, to three decimal places?
        answer: "2.167"
        tolerance: "0.001"
        explanation: |
          $f'(x) = 3x^2 - 12$, which is 15 at 3, and $f''(x) = 6x$, which is 18. The step is $3 - 15/18 = 2.1667$. The minimum is at $x = 2$, where $f' = 0$ and $f'' = 12 > 0$, so one step has covered five sixths of the distance. Gradient descent needs a learning rate chosen by hand. Newton's method takes its step length from the curvature, and a twice-differentiable engine supplies that curvature for nothing more than a second call.
    - question:
        id: work-check
        type: choice
        system: s2
        prompt: |
          How would you test that an engine's second derivatives are right, using only tools from this cluster?
        options:
          - 'Check that the loss falls when training with them.'
          - 'Treat the first derivative, as computed by the engine, as a function of the input, and gradient-check it: nudge the input each way, run forward and backward at each, take the central difference of the two first derivatives, and compare with the engine''s second derivative by relative error.'
          - 'Compare the second derivative with the first.'
          - 'Second derivatives cannot be tested numerically.'
        answer: 1
        explanation: |
          A second derivative is the first derivative of a function, and that function is "the engine's first derivative". The gradient check of two lessons ago applies to it unchanged. The first derivatives are exact to rounding, so the central difference of them is as accurate as any other, good to nine digits or so. A detached pull, which gives a second derivative of 0 where $-0.73$ was due, has a relative error of 1 and fails at once. Differencing the function twice would also give a second derivative, but with far more rounding error, so difference the gradient.
    - question:
        id: work-size
        type: choice
        system: s2
        prompt: |
          A model has a million weights. Which of these can be computed in about the time of a few gradient evaluations?
        options:
          - 'The full Hessian.'
          - 'The inverse of the Hessian.'
          - 'The product of the Hessian with one given vector.'
          - 'All the eigenvalues of the Hessian.'
        answer: 2
        explanation: |
          The Hessian has $10^{12}$ entries, which could not even be stored, and each of the first, second and fourth options needs all of them. A Hessian-vector product is two backward passes: the gradient as nodes, then the gradient of its dot product with the vector. Methods that want curvature at this scale are designed around that fact. They never ask for $H$, only for $H\mathbf{v}$ for a handful of well-chosen vectors, from which the largest curvature, or an approximate Newton step, can be worked out.
    - question:
        id: work-through-step
        type: numeric
        system: s2
        prompt: |
          $L(w) = w^2$, $w = 3$, and a gradient step with learning rate $\eta$ is done **inside the graph**: $w_1 = w - \eta \, L'(w)$. With $\eta = 0.1$ the loss after the step is $L(w_1) = 5.76$. What is the derivative of $L(w_1)$ with respect to $w$, the starting point?
        answer: "3.84"
        tolerance: "0.001"
        explanation: |
          $w_1 = w - \eta \cdot 2w = (1 - 2\eta)\,w = 0.8w$, so $L(w_1) = 0.64 w^2$ and its derivative is $1.28 w = 3.84$. The engine reaches the same number by the chain rule: $2 w_1 = 4.8$ flows back into $w_1$, and from there into $w$ along two paths, directly with factor 1, and through the gradient $L'(w) = 2w$ with factor $-\eta \times 2 = -0.2$. The second path exists only because the gradient is a node. With a detached gradient the engine would answer 4.8, treating the step as a shift by a constant. That difference, between differentiating through the gradient and treating it as fixed, is a choice that some learning methods make deliberately, to save the cost of the second-order path.
  connections:
    - text: |
        The old engine's gradient of $x^3$ at 5 was the float 75.0, and a float has no history. The backward pass had been carried out in bare arithmetic, so the engine, whose whole purpose is to record computations, had not recorded its own.

        The remedy is to write the backward pass **with the engine's operations**. Gradients are nodes, local derivatives are nodes, and pulls combine them with recorded multiplications and additions. Then a gradient is the tip of a graph, and the backward pass can be run from it: `gradient(gradient(y, [x])[0], [x])` is the second derivative. Differentiation takes a graph to a graph and can be fed its own output.

        From that follow the **Hessian**, a row for each backward pass from a gradient entry; the **Hessian-vector product**, $\nabla(\nabla f \cdot \mathbf{v})$, in two passes for any number of inputs; and derivatives **through an update step**. The standing danger is **detaching** by accident: a pull that uses a bare number is right at first order and silently zero at second.

        All of this was bought with memory. The graph of a first derivative keeps the forward graph alive, and its own nodes besides. Even in an ordinary backward pass, every pull holds on to the arrays it will need, for as long as the graph exists. What an engine keeps, when it may let go, and what goes wrong when an array it was keeping is changed underneath it, is the next lesson: [[e6.memory-planning-and-in-place-operations]].
