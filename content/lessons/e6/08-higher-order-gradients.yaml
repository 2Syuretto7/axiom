concept: e6.higher-order-gradients
minutes: 80
claim: You can explain why a gradient stored as a plain number cannot be differentiated, rebuild the backward pass out of the engine's own operations so that every gradient is a node with a history, take second and third derivatives by running that backward pass on its own result, compute a Hessian-vector product with two backward passes and no Hessian, and recognise the bug in which a pull uses a bare number and silently cuts the second derivative off.
recalls: [e6.modules-parameters-and-optimisers]
uses: [e6.topological-ordering-of-the-graph, e6.reverse-mode-on-scalars, e6.scalar-computational-graph, e6.gradient-checking, m12.hessian-and-symmetry-of-mixed-partials, m12.gradient, m12.directional-derivative, m10.second-derivative-and-curvature, m10.differentiation-rules, m10.maxima-and-minima, e0.dictionaries-and-sets, e1.special-methods-and-operator-overloading, e1.classes-and-objects, e0.functions, e0.loops]
leads: [e6.memory-planning-and-in-place-operations, e6.training-an-mlp-on-your-own-engine, e7.autograd-in-pytorch, e7.custom-autograd-functions-and-extensions]
starter: |
  # Scratch space. The scalar engine from the lesson on topological ordering.
  # It finds the slope of the cube at 5. What kind of thing is that slope?
  class Value:
      def __init__(self, data, parents=()):
          self.data = data
          self.parents = parents
          self.grad = 0.0

      def __mul__(self, other):
          return Value(self.data * other.data, ((self, other.data), (other, self.data)))


  def topological(node):
      order = []
      seen = set()

      def visit(v):
          if v in seen:
              return
          seen.add(v)
          for parent, local in v.parents:
              visit(parent)
          order.append(v)

      visit(node)
      return order


  def backward(node):
      node.grad = 1.0
      for v in topological(node)[::-1]:
          for parent, local in v.parents:
              parent.grad += v.grad * local


  x = Value(5.0)
  y = x * x * x
  backward(y)
  print(y.data, x.grad, type(x.grad).__name__)
parts:
  recall:
    - text: |
        [[e6.modules-parameters-and-optimisers]] wrapped the engine in layers and an optimiser and left the engine alone. Today goes back inside it, to the one line of the backward pass, and changes what a gradient is. Three quick pulls first.
  puzzle:
    - text: |
        The starter is the scalar engine from early in this cluster. It builds $y = x^3$ at $x = 5$ and runs the backward pass.

        Run it.

        ```
        125.0 75.0 float
        ```

        The slope is 75, which is $3x^2$ at 5, and it is correct.

        Now suppose you want the **second** derivative, the curvature. For $x^3$ it is $6x$, which is 30 at $x = 5$. Curvature is what tells a minimum from a maximum, what Newton's method divides by, and what the Hessian of the last cluster is made of. The engine found the first derivative by recording how $y$ was computed and walking back along the record. The second derivative is the derivative of the first. So do the same again: walk back from `x.grad`.

        You cannot. `x.grad` is a `float`. It is the number 75.0, with no parents and no record of where it came from. The engine computed $3x^2$ at 5 and kept only the answer. The expression, which is what would have to be differentiated, was never written down anywhere.

        You could nudge $x$ and measure how the gradient changes, as in the lesson on gradient checking. That gives a rough number at two backward passes for every input.

        **The backward pass is itself a computation: a run of multiplications and additions. The engine exists to record computations. Why was this one not recorded, and what would have to change for it to be?**
  intuition:
    - text: |
        Look at the line that does the work in the old backward pass:

        ```python
        parent.grad += v.grad * local
        ```

        `v.grad` is a float. `local` is a float, saved during the forward pass: for a product it was `other.data`. The `*` and the `+=` are Python's arithmetic on floats, which leaves no trace. That is the whole reason. **The forward pass was written with the engine's operations, which record. The backward pass was written with bare numbers, which do not.**

        So write the backward pass with the engine's operations.

        - A gradient becomes a `Value`, not a float.
        - A local derivative becomes a `Value` too. For the product $c = a \times b$, the derivative with respect to $a$ is not the number `b.data`. It is **`b` itself**, the node.
        - The multiplication and the addition in that line become the engine's `__mul__` and `__add__`.

        Nothing else changes, and the consequence is large. When the backward pass now multiplies an incoming gradient by `b`, that product is a new node whose parents are the gradient and `b`. The gradient of $x$ comes out as the tip of a graph that reaches back to $x$. It has a `data`, which is the 75.0 of before. And it has a history, so it can be handed to the same backward pass again.

        For $y = x^3$:

        | pass | result | its value at $x = 5$ | nodes in its graph |
        | --- | --- | --- | --- |
        | forward | $y = x^3$ | 125 | 3 |
        | backward from $y$ | $y' = 3x^2$ | 75 | 9 |
        | backward from $y'$ | $y'' = 6x$ | 30 | 17 |
        | backward from $y''$ | $y''' = 6$ | 6 | |

        The engine never learns the rule "the derivative of $x^3$ is $3x^2$". It only ever knows that the local derivatives of a product are its two operands. Applied to the graph of the forward pass, that knowledge builds the graph of the first derivative. Applied to that, it builds the second. **Differentiation is a transformation of graphs into graphs, and it can be applied to its own output.**
  derivation:
    - text: |
        **The engine, rebuilt.** As with tensors, each parent comes with a **pull**: a function from the gradient of the result to this parent's share. The only difference from before is that the pull receives a `Value` and returns a `Value`, built with recorded operations.

        ```python
        class Value:
            def __init__(self, data, parents=()):
                self.data = data
                self.parents = parents

            def __add__(self, other):
                return Value(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

            def __sub__(self, other):
                return Value(self.data - other.data, ((self, lambda g: g), (other, lambda g: g * Value(-1.0))))

            def __mul__(self, other):
                return Value(self.data * other.data, ((self, lambda g: g * other), (other, lambda g: g * self)))
        ```

        Read the pull of the product: `lambda g: g * other`. That `*` is `Value.__mul__`. It makes a node, and that node has pulls of its own. This is where the second derivative comes from.

        **The backward pass, as a function.** Since gradients are now nodes of a graph and there may be several graphs, a `grad` slot on each value would get crowded. Keep the gradients of one backward pass in a dictionary, and return the ones asked for.

        ```python
        def gradient(node, inputs):
            grads = {node: Value(1.0)}
            for v in topological(node)[::-1]:
                for parent, pull in v.parents:
                    share = pull(grads[v])
                    grads[parent] = grads[parent] + share if parent in grads else share
            return [grads[x] if x in grads else Value(0.0) for x in inputs]
        ```

        It is the backward pass of the lesson on topological ordering, line for line. The output's gradient is 1. Nodes are taken in reverse topological order, so each has its full gradient before it shares it out. Shares arriving at the same parent are added, and that `+` is recorded as well. An input the output never used gets 0. A side benefit of the dictionary is that nothing is left behind to be cleared.

        **Derivatives of derivatives.**

        ```python
        x = Value(5.0)
        y = x * x * x
        d1 = gradient(y, [x])[0]
        d2 = gradient(d1, [x])[0]
        d3 = gradient(d2, [x])[0]
        print(d1.data, d2.data, d3.data)
        ```

        That prints `75.0 30.0 6.0`. `d1` is a `Value`, and `gradient` neither knows nor cares that it was produced by a backward pass.

        **What it costs.** A backward pass does a fixed, small amount of work for each node of the graph it walks, and so the graph it builds is a small multiple of that size. Here 3 nodes became 9 and then 17. Each further derivative costs a few times the one before, which is affordable for the second and steep by the fourth. And the graph of the first derivative keeps the whole forward graph alive, since its nodes are the forward nodes' children.
    - question:
        id: derivation-step
        type: choice
        system: s2
        prompt: |
          In the rebuilt engine someone writes the pull of the product as `lambda g: g * Value(other.data)`, wrapping the operand's number in a fresh `Value`. For $y = x^3$ at $x = 5$, what do `gradient(y, [x])` and then the gradient of that give?
        options:
          - 'An error in the first pass, since `Value(other.data)` is not in the graph.'
          - 'The first derivative is 75, which is correct. The second comes out as 0. The fresh value has the right number and no parents, so the first derivative''s graph is built from constants and never reaches back to $x$.'
          - 'Both are correct. Wrapping the number changes nothing.'
          - 'The first derivative is 0.'
        answer: 1
        explanation: |
          The first derivative only needs the numbers, and the numbers are right. The second needs to know that the 25 which multiplied the incoming gradient was $x \times x$, and so depends on $x$. A fresh `Value` holding 25 has forgotten that. The backward pass from the first derivative then finds no path to $x$ and reports 0, without complaint. Cutting a value off from its history like this is called **detaching** it. It is sometimes done on purpose. Done by accident inside a pull, it is the characteristic bug of higher-order gradients: every first-order test passes.
    - text: |
        **Several inputs: the Hessian.** For $f(a, b) = a^2 b + b^3$ at $(2, 3)$, `gradient(f, [a, b])` returns two nodes, with values $(2ab, \; a^2 + 3b^2) = (12, 31)$. Each can be differentiated again with respect to both inputs. Those four numbers are the Hessian of the last cluster:

        $$H = \begin{pmatrix} 2b & 2a \\ 2a & 6b \end{pmatrix} = \begin{pmatrix} 6 & 4 \\ 4 & 18 \end{pmatrix}.$$

        One row of the Hessian is one backward pass, from one entry of the gradient. For $n$ inputs that is $n$ passes and $n^2$ numbers. A model with a million weights has a Hessian with a million million entries. Nobody computes it.

        **The Hessian-vector product.** What is wanted is almost never $H$ itself but $H$ applied to some vector $\mathbf{v}$: how the gradient changes when the inputs move along $\mathbf{v}$. That can be had without $H$. Take the gradient $\mathbf{g}$ as nodes. Form the single number

        $$s = \mathbf{g} \cdot \mathbf{v} = g_1 v_1 + \dots + g_n v_n,$$

        with the $v_i$ as constants. Then

        $$\frac{\partial s}{\partial x_j} = \sum_i \frac{\partial g_i}{\partial x_j} v_i = \sum_i H_{ij} v_i = (H\mathbf{v})_j,$$

        using the symmetry of $H$. **The gradient of $\mathbf{g} \cdot \mathbf{v}$ is $H\mathbf{v}$.** Two backward passes, whatever $n$ is.

        ```python
        def hvp(node, inputs, v):
            grads = gradient(node, inputs)
            s = Value(0.0)
            for g, vi in zip(grads, v):
                s = s + g * Value(vi)
            return [h.data for h in gradient(s, inputs)]
        ```

        For the example with $\mathbf{v} = (1, 2)$ this returns $(14, 40)$, which is $(6 + 8, \; 4 + 36)$. With $\mathbf{v} = (1, 0)$ it returns the first column of $H$, so the whole Hessian is still available, a column at a time, when $n$ is small.

        **Differentiating through an update.** In the last lesson the optimiser wrote to the data outside the graph, on purpose. Do the update inside the graph, with a gradient that is a node, and the step itself can be differentiated. Take $L(w) = w^2$ at $w = 3$ and a learning rate $\eta = 0.1$ that is a `Value`:

        ```python
        w, lr = Value(3.0), Value(0.1)
        g = gradient(w * w, [w])[0]
        w1 = w - lr * g
        L1 = w1 * w1
        print(w1.data, L1.data, gradient(L1, [lr])[0].data)
        ```

        The step lands at 2.4, where the loss is 5.76, and the last number, $-28.8$, is the derivative of **the loss after the step** with respect to the learning rate. It says that a larger rate would have left the loss lower, and by how much. Tuning a learning rate by gradient descent, and learning starting weights from which one step goes a long way, are both built on this.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of computing a Hessian-vector product $H\mathbf{v}$ with the rebuilt engine.
        steps:
          - 'Run the forward pass, building the graph of $f$.'
          - 'Run a backward pass from $f$ to get the gradient entries as nodes.'
          - 'Multiply each gradient entry by its entry of $\mathbf{v}$, taken as a constant, and add the products into one node $s$.'
          - 'Run a backward pass from $s$.'
          - 'Read off the numbers of the gradients of $s$ with respect to the inputs.'
        explanation: The first backward pass must produce nodes, since the second walks through them. Weighting by v before the second pass is what turns n separate rows of the Hessian into the one combination that is wanted.
  formal:
    - text: |
        **Differentiable backward pass.** An engine in which each pull maps a node (the gradient of a result) to a node (an operand's share), using only recorded operations. For such an engine, $\texttt{gradient}(y, x)$ is a node of a graph containing $x$, and $\texttt{gradient}(\texttt{gradient}(y, x), x)$ has the value $\dfrac{d^2 y}{dx^2}$.

        **Pulls.** For $c = a + b$: $g \mapsto g$ for each. For $c = a - b$: $g \mapsto g$ and $g \mapsto -g$. For $c = a \times b$: $g \mapsto g \times b$ and $g \mapsto g \times a$, with $a$ and $b$ the nodes.

        **Detaching.** Replacing a node by a parentless node of equal value. Derivatives through a detached node are zero.

        **Hessian-vector product.** For $f : \mathbb{R}^n \to \mathbb{R}$ twice continuously differentiable and a constant $\mathbf{v} \in \mathbb{R}^n$,

        $$H(\mathbf{x})\,\mathbf{v} = \nabla_{\mathbf{x}} \big( \nabla f(\mathbf{x}) \cdot \mathbf{v} \big).$$

        Its cost is a constant multiple of the cost of evaluating $f$, independent of $n$.
