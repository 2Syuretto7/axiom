        explanation: |
          The broken version walks the graph as if it were a tree. `L` has `e` as a parent twice, so everything below `e`, seven nodes, is counted twice: $1 + 7 + 7 = 15$. A graph with sharing must be walked with a record of where you have already been, exactly as in the lessons on graph traversal. The `seen` set holds the `Value` objects themselves, which Python can put in a set because each object is its own key. Remembering the numbers instead would merge different nodes that hold equal values. Making the set a default argument, `seen=set()`, creates it once for the whole program, so the second call finds everything already seen and returns 0.

