    - question:
        id: work-two-uses
        type: numeric
        system: s2
        prompt: |
          $f = (a + b) \times (a \times b)$ with $a = 2$ and $b = 3$. Name the intermediate values $s = a + b$ and $t = a \times b$, put the local derivative on each edge, and find $\dfrac{\partial f}{\partial a}$ as a sum over paths.
        answer: "21"
        explanation: |
          $s = 5$ and $t = 6$. The edges into $f$ carry $\partial f / \partial s = t = 6$ and $\partial f / \partial t = s = 5$. The edge from $a$ to $s$ carries 1, and the edge from $a$ to $t$ carries $b = 3$. There are two paths from $a$ to $f$. Through $s$: $1 \times 6 = 6$. Through $t$: $3 \times 5 = 15$. Together 21. As a check, $f = a^2 b + ab^2$, so $\partial f / \partial a = 2ab + b^2 = 12 + 9 = 21$.
    - question:
        id: work-count
        type: numeric
        system: s2
        prompt: |
          `a` is one `Value`. How many edges are in the graph of `a * a * a + a`? Count one edge for every parent entry of every node.
        answer: "6"
        explanation: |
          Python works from the left. `a * a` is one node with 2 parent entries. Multiplying that by `a` makes a second node with 2 parent entries, the first product and `a`. Adding `a` makes a third node with 2 more. Three operations, two operands each: 6 edges, joining only 4 nodes, since `a` is used four times. There are 4 paths from `a` to the result: three through the cube, each contributing $a^2$, and one through the last addition, contributing 1. The derivative is $3a^2 + 1$, as it should be.
    - question:
        id: work-branch
        type: choice
        system: s2
        prompt: |
          A function contains `if x.data > 0: y = x * x` and otherwise `y = x * -1.0`, with `x` a `Value`. It is called with `x` holding 3.0. What does the graph of `y` record?
        options:
          - 'Both branches, with a node that chooses between them.'
          - 'Only the multiplication `x * x`, since that is what ran. The graph describes this run. Called again with a negative number, the program would build a different graph, and that graph would be the right one to differentiate for that input.'
          - 'Nothing, because a `Value` cannot be used in an `if`.'
          - 'The comparison `x.data > 0`, as a node with local derivative 0.'
        answer: 1
        explanation: |
          The `if` looked at `x.data`, a plain float, and Python chose a branch. Only then was any `Value` arithmetic done. The graph holds one multiplication and has no memory of a choice. This is the strength of recording by running: loops, conditions, recursion and function calls all vanish, leaving a straight list of the operations actually performed. It is also a limit to keep in mind. The derivative you get is that of the branch taken, which is the derivative of the whole function everywhere except exactly at the boundary, where the function may have a corner and no derivative at all.
    - question:
        id: work-why-not-rerun
        type: choice
        system: s2
        prompt: |
          The starter found $\partial L / \partial w$ by running the formula a second time with $w$ nudged. Apart from the cost of one run for each input, what else is wrong with that method, which a derivative read from the graph does not suffer from?
        options:
          - 'Nothing else. It is exact.'
          - 'It is an approximation. The step must be small for the tangent to be a good stand-in for the curve, and a small step makes the difference of two nearly equal floats lose most of its digits. A path sum uses the exact local derivatives and involves no step at all.'
          - 'It only works for squares.'
          - 'It changes the value of $w$ permanently.'
        answer: 1
        explanation: |
          The last lesson on numerical error weighed exactly this: too large a step and the curve's bend spoils the estimate, too small and rounding does. At best about half the digits survive. The graph method has no step. It multiplies and adds numbers like 2 and 3 that are the true local rates, so its answer is right to the last digit that floating-point arithmetic keeps. Numerical differences keep one honourable job, which a later lesson gives them: checking that an engine like this one has been built correctly.
  connections:
    - text: |
        The float 4.0 knew nothing of where it came from, so the slope had to be measured by running again. A `Value` holding 4.0 knows its **parents** and, for each, the **local derivative**: how strongly this one operation responds to that operand. Those notes are written by `__add__` and `__mul__` during ordinary arithmetic, so the **computational graph** appears as a side effect, for any program, loops and conditions included, as a record of the one run that happened.

        With the graph in hand the chain rule becomes a walk: **multiply along each path, add over the paths**. `path_sum(L, w)` returned 8 exactly, from the record of a single run.

        Two things about it should bother you. It answers for one input at a time, so a million weights still means a million walks. And it follows every path separately, though most paths share most of their edges. The first fault is cured by turning the walk round: start from the output, and let each value collect its share on the way back, so that one sweep serves every input. That is [[e6.reverse-mode-on-scalars]].
