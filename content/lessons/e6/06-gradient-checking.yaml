          At five random points the candidates separate at once. Tightening the tolerance at zero changes nothing, since the wrong formulas are not approximately right there but exactly right. Loosening it to a half at random points lets the near misses through.

          This is the bug in the second lesson of this cluster seen from the other side. There a `tanh` with the wrong local derivative printed the correct gradient for the neuron, because the lesson's example happened to have a weighted input of 0. **Zeros, ones, equal operands, square shapes and symmetric matrices are the inputs people reach for when writing a test, and they are the inputs on which wrong code is most often right.**
    - question:
        id: work-weights
        type: choice
        system: s2
        prompt: |
          To check an operation's pull, a scalar is made from its result $C$ by a weighted sum $\sum R_{ij} C_{ij}$ with random weights $R$, in place of the plain sum $\sum C_{ij}$. Why?
        options:
          - 'Because the plain sum has no gradient.'
          - 'With the plain sum, the gradient of $C$ is all ones, so the pull is only ever tested on that one input. A pull that is wrong for general gradients can still be right for all ones. With random weights the gradient of $C$ is $R$, a generic array, and a pull that passes is right in general.'
          - 'Because random numbers make the test faster.'
          - 'Because the weights make the function non-linear.'
        answer: 1
        explanation: |
          A pull is a linear map from gradients of the result to shares for the operand. Testing it on a single input, all ones, checks one direction out of many. A pull that summed where it should not, or that ignored its argument and used ones, or that mixed up rows in a way that ones cannot reveal, would pass. A random $R$ has no special structure for a bug to hide behind. This is the same principle as testing at a random point, applied to the gradient flowing in as well as to the values.
    - question:
        id: work-kink
        type: choice
        system: s2
        prompt: |
          An engine's `relu`, which computes $\max(z, 0)$ entry by entry, is checked on 1,000 random inputs. The relative error is about $10^{-10}$ on 999 of them and 0.3 on one. The pull is `g * (z > 0)`. What is the likeliest explanation?
        options:
          - 'The pull is wrong, and 999 passes were luck.'
          - 'In the one failing case some entry of $z$ lay within $h$ of zero. The two nudged points fell on opposite sides of the corner, so the measured slope there was neither 0 nor 1. The pull is right and the measurement is not valid at that point. Looking at the entry with the largest error, and re-running with a smaller $h$ or another random input, would confirm it.'
          - 'Floating-point numbers cannot represent the slope of relu.'
          - 'The tolerance should be raised to 0.5.'
        answer: 1
        explanation: |
          At a corner the function has no derivative, the central difference returns something between the two one-sided slopes, and the engine has had to pick one convention, here 0. Neither is wrong, and they disagree. The signs to look for are that the failures are rare, that they come and go with the random inputs, and that the entry at fault has an input of tiny size. A real bug fails every time. Raising the tolerance to make the report go away would also blind the test to real bugs, which is the one thing a test must not do.
