          Which is the central difference?
        options: ['$\dfrac{f(x + h) - f(x)}{h}$', '$\dfrac{f(x + h) - f(x - h)}{2h}$', '$\dfrac{f(x + h) - f(x - h)}{h}$', '$\dfrac{f(x) - f(x - h)}{2h}$']
        answer: 1
        explanation: One step each side, and the two points are 2h apart.
