          What is a gradient check?
        options: ['Watching the loss fall during training', 'Comparing a computed gradient with slopes measured by nudging each input', 'Computing the gradient twice with the same code', 'Checking that the gradient is not zero']
        answer: 1
        explanation: Two independent computations of the same quantity.
