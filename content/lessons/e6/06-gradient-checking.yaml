        prompt: |
          $f(x, y) = x^2 y$. Someone's code claims that the gradient at $(1, 2)$ is $(4, 2)$. Check it along the direction $\mathbf{v} = (0.6, -0.8)$ using exact values in place of nudges: the true slope of $f$ along $\mathbf{v}$ at that point is $\nabla f \cdot \mathbf{v}$ with the true gradient. What slope does the **claimed** gradient predict along $\mathbf{v}$?
        answer: "0.8"
        tolerance: "0.001"
        explanation: |
          The claimed gradient predicts $4 \times 0.6 + 2 \times (-0.8) = 2.4 - 1.6 = 0.8$. The true gradient is $(2xy, x^2) = (4, 1)$, and the true slope along $\mathbf{v}$ is $2.4 - 0.8 = 1.6$, which is what two runs of $f$ would measure. The prediction is off by a factor of 2, so the claim is wrong, and one direction was enough to show it, though it does not say which entry is at fault. Had $\mathbf{v}$ been $(1, 0)$, both would have said 4 and the wrong second entry would have gone unseen. That is why the direction is random, and why a careful test uses a few.
    - question:
        id: work-cost
        type: choice
        system: s2
        prompt: |
          A model has ten million weights and one evaluation of its loss takes a second. Why is a full gradient check not run on it, and what is done instead?
        options:
          - 'It is run before every training step, since correctness matters most.'
          - 'A full check needs two evaluations for every weight: twenty million seconds, most of a year. So the engine is checked where checking is cheap. Each operation is tested by itself on small random arrays, small versions of the model are checked in full, and on the real model a few random directions, or a random sample of individual weights, are compared.'
          - 'Large models do not need checking, because errors average out.'
          - 'The check is run in 32 bits to save time.'
        answer: 1
        explanation: |
          The cost of numerical differentiation that made it useless for training makes it expensive for testing too, so it is spent where it buys the most. An engine's correctness lives in its operations, and an operation's pull is the same code whether the array has six entries or six million, so testing each on tiny inputs tests the code that the big model will run. A directional check costs two evaluations whatever the size. And a model's own composite logic, such as weights shared between layers, can be exercised on a version of it with a handful of units.
  connections:
    - text: |
        The loss fell from 1.59 to 0.51 and sat there, and the gradient that produced that reassuring curve had forgotten a factor of $x$. **A falling loss is not evidence that a gradient is right.** Almost anything roughly downhill makes a loss fall.

        The evidence is a comparison with **measured slopes**. Nudge each input by $h$ each way and take the **central difference**, accurate to order $h^2$. Choose $h$ near $10^{-6}$ in 64 bits: larger and the curve's bend intrudes, smaller and rounding does. Compare by **relative error**: below about $10^{-7}$ is agreement, above $10^{-3}$ is a bug, and real bugs are usually near 1.

        A check proves something only at the point where it is made. So make it at **random** points, with shapes that are all different, with **random weights** on the output so that the pull meets a generic gradient, and away from kinks. For a large model, check a few random directions.

        With this, the engine can be trusted, and extended without fear: any new operation is a forward line, a pull, and a check. What it still lacks is convenience. A model with a dozen weight arrays needs them created, gathered, cleared before each backward pass and updated after it, and so far all of that has been done by hand. Organising it is the next lesson: [[e6.modules-parameters-and-optimisers]].
