        prompt: |
          How does the error of the central difference shrink as $h$ shrinks, before rounding takes over?
        options: ['Like $h$', 'Like $h^2$', 'Like $\sqrt{h}$', 'It does not shrink']
        answer: 1
        explanation: The terms in h squared cancel between the two sides, leaving an error of order h squared in the quotient.
