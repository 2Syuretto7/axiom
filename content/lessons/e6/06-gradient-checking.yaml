concept: e6.gradient-checking
minutes: 80
claim: You can test any gradient, whoever computed it, against slopes measured by central differences, choose a step that balances the error of the approximation against the error of rounding, compare the two gradients by a relative error and say what size of error means a bug, write the checker for arrays of any shape, and design a check that a wrong gradient cannot slip through by testing at random points, with random weights on the output, away from kinks.
recalls: [e6.broadcasting-in-the-backward-pass]
uses: [e6.tensor-valued-autograd, e6.reverse-mode-on-scalars, e5.numerical-error-analysis-in-practice, e5.random-number-generation, e5.reshaping-views-and-copies, e5.arrays-dtype-and-shape, e5.vectorisation, e5.axis-operations-and-reductions, m12.directional-derivative, m12.gradient, m12.partial-derivatives, m10.taylor-approximation, m10.derivative-as-slope-and-rate, e1.testing-with-pytest, m2.composition-and-inverses, e0.functions, e0.loops]
leads: [e6.modules-parameters-and-optimisers, e6.higher-order-gradients, e6.training-an-mlp-on-your-own-engine, e7.autograd-in-pytorch, e7.custom-autograd-functions-and-extensions]
starter: |
  # Scratch space. A neuron trained by gradient descent with a hand-written
  # gradient. Watch the loss.
  import numpy as np

  x = np.array([-1.0, 0.5, 2.0, 3.0])
  y = np.array([-0.5, 0.2, 0.9, 0.7])


  def loss(w, b):
      a = np.tanh(w * x + b)
      return float(((a - y) ** 2).sum())


  def gradient(w, b):
      a = np.tanh(w * x + b)
      dz = 2 * (a - y) * (1 - a * a)
      return float(dz.sum()), float(dz.sum())


  w, b = 0.0, 0.0
  print(0, round(loss(w, b), 4))
  for step in range(1, 151):
      gw, gb = gradient(w, b)
      w -= 0.05 * gw
      b -= 0.05 * gb
      if step % 50 == 0:
          print(step, round(loss(w, b), 4))
parts:
  recall:
    - text: |
        [[e6.broadcasting-in-the-backward-pass]] repaired a gradient that had the wrong shape and raised no error, one lesson after a closure bug that gave every tensor the wrong gradient and raised no error. Both printed a correct loss. Today's subject is how to know that a gradient is right. Three quick pulls first.
  puzzle:
    - text: |
        The starter trains one neuron, $a = \tanh(wx + b)$, on four data points, by gradient descent on the sum of squared errors, from $w = 0$, $b = 0$. Its gradient was written by hand.

        Run it.

        ```
        0 1.59
        50 0.5109
        100 0.5109
        150 0.5109
        ```

        The loss falls from 1.59 to 0.51, a drop of two thirds, and then holds perfectly steady. That is the picture of a model that has learnt what it can from its data and settled at a minimum. Anyone watching this training run would be content. Perhaps the model is a little weak. One might try a bigger one.

        The gradient is wrong. Look at the last line of `gradient`: it returns `dz.sum()` twice. The first should be `(dz * x).sum()`. Somebody forgot that $w$ is multiplied by $x$. With the correct gradient the same loop reaches a loss of 0.0629, eight times lower.

        Nothing in the output said so. The loss fell, as it does with almost any vector that points roughly downhill. It levelled off, because the wrong vector happened to reach zero somewhere. The program never raised an error, and no number in it was absurd.

        **If a falling loss does not show that a gradient is right, what does? What could you compare a gradient with, that does not depend on the code that produced it? And how close must the two be before you believe it?**
  intuition:
    - text: |
        A gradient is not defined by the code that computes it. It is defined by the function: entry $i$ of $\nabla f$ is the rate at which $f$ changes when input $i$ is nudged and the others are held still. That definition can be carried out directly, with no knowledge of how $f$ works inside. Nudge the input, run $f$, and see how far the output moved.

        You did this in the last lesson on NumPy, and then spent this whole cluster getting away from it, because it needs two runs of $f$ for every input and its answer is only approximate. Both complaints are fair when the job is training. Neither matters when the job is **testing**. A test may be slow. A test may use a model with ten weights. And an answer good to seven digits is plenty to catch a gradient that is wrong in the first.

        So there are two computations of the same quantity, as different in method as they could be:

        | | the engine's gradient | the measured gradient |
        | --- | --- | --- |
        | how | chain rule through the recorded graph | nudge each input and run the function again |
        | cost | about one extra run | two runs for every input |
        | accuracy | exact to rounding | about 8 or 9 digits at best |
        | can be wrong because | any pull is wrong, an order is wrong, a shape is wrong | almost nothing: it is a subtraction and a division |

        **Compare them. If they agree to many digits at a point chosen at random, the engine's gradient is right there. If they do not, it is wrong.** This is **gradient checking**, and it is the one test that matters for an autograd engine.

        Try it on the starter. At $w = 0$, $b = 0$ the hand-written gradient is $(-2.6, -2.6)$. Measure instead: nudge $w$ by a millionth each way and divide the change in the loss by two millionths, then the same for $b$.

        ```python
        import numpy as np

        x = np.array([-1.0, 0.5, 2.0, 3.0])
        y = np.array([-0.5, 0.2, 0.9, 0.7])


        def loss(w, b):
            a = np.tanh(w * x + b)
            return float(((a - y) ** 2).sum())


        h = 1e-6
        print(round((loss(h, 0.0) - loss(-h, 0.0)) / (2 * h), 4))
        print(round((loss(0.0, h) - loss(0.0, -h)) / (2 * h), 4))
        ```

        That prints `-9.0` and `-2.6`. The second entry agrees. The first is $-9$ where the code claimed $-2.6$. Four runs of the loss have found, and located, a bug that 150 steps of training hid.

        Notice what kind of evidence this is. The check knows nothing about $\tanh$ or the chain rule. It cannot share a misunderstanding with the code it is checking, which is what makes it worth having. A second derivation by hand could repeat the first one's mistake.
  derivation:
    - text: |
        **The measured slope.** For a function $f$ of one number, two estimates of $f'(x)$ from nearby values:

        $$\text{forward: } \frac{f(x + h) - f(x)}{h}, \qquad \text{central: } \frac{f(x + h) - f(x - h)}{2h}.$$

        Taylor's expansion says how wrong each is. Since $f(x \pm h) = f(x) \pm h f'(x) + \tfrac{h^2}{2} f''(x) \pm \tfrac{h^3}{6} f'''(x) + \dots$, the forward estimate is off by about $\tfrac{h}{2} f''(x)$, and in the central one the $h^2$ terms cancel, leaving an error of about $\tfrac{h^2}{6} f'''(x)$. **The central difference is accurate to order $h^2$ and costs one more run. Always use it for checking.** For $f(x) = x^3$ at $x = 2$, where the slope is 12, a step of $h = 0.001$ gives 12.006001 forwards and 12.000001 centrally.

        **The step.** A smaller $h$ shrinks that error. But the lesson on numerical error showed the other side: $f(x + h)$ and $f(x - h)$ are nearly equal, subtracting them cancels their leading digits, and what is left is rounding error of about $\varepsilon \lvert f \rvert$, with $\varepsilon \approx 10^{-16}$, which is then divided by the small number $2h$. The total error is roughly

        $$\frac{h^2}{6}\lvert f''' \rvert + \frac{\varepsilon \lvert f \rvert}{h},$$

        large when $h$ is large and large again when $h$ is tiny. For $x^3$ at 2:

        | $h$ | error of the central estimate |
        | --- | --- |
        | $10^{-2}$ | about $10^{-4}$ |
        | $10^{-4}$ | about $10^{-8}$ |
        | $10^{-6}$ | about $10^{-9}$ |
        | $10^{-8}$ | about $10^{-7}$ |
        | $10^{-10}$ | about $10^{-6}$ |
        | $10^{-12}$ | about $10^{-3}$ |

        The best step is near $\varepsilon^{1/3}$, about $10^{-5}$, and anything from $10^{-4}$ to $10^{-6}$ serves, for inputs of ordinary size in 64-bit floats. With 32-bit floats $\varepsilon$ is about $10^{-7}$ and the best that can be hoped for is two or three good digits. **Check gradients in 64 bits.**

        **Many inputs.** For $f : \mathbb{R}^n \to \mathbb{R}$, do it one entry at a time: add $h$ to entry $i$, run $f$, subtract to get $x_i - h$, run $f$, put the entry back, and store the central difference. That is $2n$ runs. For an input that is an array of any shape, a flat view lets one loop reach every entry.

        ```python
        def numeric_grad(f, x, h=1e-6):
            grad = np.zeros(x.shape)
            flat_x = x.reshape(-1)
            flat_grad = grad.reshape(-1)
            for i in range(x.size):
                old = flat_x[i]
                flat_x[i] = old + h
                up = f(x)
                flat_x[i] = old - h
                down = f(x)
                flat_x[i] = old
                flat_grad[i] = (up - down) / (2 * h)
            return grad
        ```

        `x.reshape(-1)` is a view of the same memory, as you learnt in the lesson on reshaping, so writing to `flat_x[i]` changes `x` itself, and `f(x)` sees the nudge. The line `flat_x[i] = old` puts the entry back exactly. Restoring by subtracting $h$ again would leave rounding crumbs in the input, and forgetting to restore at all leaves every earlier entry displaced while the later ones are measured.

        **Comparing.** Let $a$ be the analytic gradient, from the engine, and $n$ the numerical one. How far apart are they? The difference alone will not do. An absolute difference of $10^{-9}$ is a superb match between gradients of size 1 and a ten per cent disagreement between gradients of size $10^{-8}$. Measure the difference **relative to the size of the things compared**:

        $$\text{relative error} = \frac{\max_i \lvert a_i - n_i \rvert}{\max_i \lvert a_i \rvert + \max_i \lvert n_i \rvert + 10^{-12}}.$$

        The $10^{-12}$ only guards against dividing by zero when both gradients vanish. With central differences in 64 bits and $h$ about $10^{-6}$:

        | relative error | reading |
        | --- | --- |
        | below about $10^{-7}$ | correct |
        | $10^{-7}$ to $10^{-4}$ | probably correct. Look for a kink, or try another $h$ |
        | above $10^{-3}$ | a bug |

        A wrong gradient is seldom subtly wrong. A missing factor, a swapped operand, a dropped term or a wrong sign gives a relative error of 0.1 or 1, six or more orders of magnitude away from a correct one. The gap between "right" and "wrong" is enormous, and that is why this test is so decisive.
    - question:
        id: derivation-step
        type: choice
        system: s2
        prompt: |
          A gradient check uses central differences with $h = 10^{-12}$, "to be as accurate as possible", and reports a relative error of $10^{-3}$ for a gradient that is in fact correct. What has happened?
        options:
          - 'The analytic gradient is wrong after all.'
          - 'The step is far too small. The two values of the function differ only in their last few digits, their difference is mostly rounding error, and dividing by $2 \times 10^{-12}$ magnifies it. The numerical gradient is the inaccurate one. A step near $10^{-5}$ would give agreement to nine digits or so.'
          - 'Central differences do not work for small steps. Forward differences should be used.'
          - 'The relative error should have been an absolute error.'
        answer: 1
        explanation: |
          The error of the estimate is the sum of a truncation part, which shrinks like $h^2$, and a rounding part, which grows like $\varepsilon / h$. At $h = 10^{-12}$ the rounding part is about $10^{-16} / 10^{-12} = 10^{-4}$ times the size of the function, which swamps everything. A gradient check compares two computations, and either can be the faulty one. Before blaming the engine, vary $h$: a real bug stays at a relative error near 1 whatever the step, and a step problem moves with it.
    - text: |
        **Checking an engine's operation.** A pull maps a gradient of the result to a share for an operand. To test it, a scalar function is needed, so put a made-up loss on top of the operation. The obvious one is the sum of the result's entries, and it is a poor choice: its gradient is all ones, and a pull can be wrong in a way that only shows for other gradients. Use a **weighted** sum with random weights $R$ of the result's shape. Then the gradient of the result is $R$, a generic array, and the pull is tested on that.

        ```python
        def relative_error(a, n):
            return float(np.abs(a - n).max() / (np.abs(a).max() + np.abs(n).max() + 1e-12))


        rng = np.random.default_rng(0)
        A, B, R = rng.normal(size=(4, 3)), rng.normal(size=(3, 2)), rng.normal(size=(4, 2))
        f = lambda M: float(((M @ B) * R).sum())
        print(relative_error(R @ B.T, numeric_grad(f, A)))
        ```

        That prints about $1.6 \times 10^{-10}$: the pull of the matrix product for its left operand, `R @ B.T`, agrees with 24 measured slopes to ten digits.

        **Where to check.** A check is only as good as the point it is made at.

        - **At random points.** Special inputs hide bugs. At zero, $\tanh$ has slope 1, and the wrong formulas $1 - \tanh z$ and $1 - z^2$ both give 1 as well. An input of all ones, or two operands that are equal, can make two different formulas agree by accident.
        - **With shapes all different.** A square matrix lets a missing transpose through. Use 4 by 3 and 3 by 2. Include shapes that broadcast.
        - **Away from kinks.** Functions such as $\max(z, 0)$ have a corner. If $z$ is within $h$ of the corner, the two nudged points fall on different sides of it, the measured slope is an average of two slopes, and it matches neither. That is a failure of the measurement and not of the engine. Random inputs seldom land so close, and when the error is in the doubtful middle range, this is the first thing to suspect.
        - **With everything random held fixed.** If the function draws random numbers, both runs must draw the same ones, or the difference between them is noise.

        **A cheaper check.** For a model too large to nudge every weight, use the directional derivative. Pick a random direction $\mathbf{v}$. The engine's gradient predicts the slope along it, $\nabla f \cdot \mathbf{v}$. Two runs measure it: $\dfrac{f(\mathbf{x} + h\mathbf{v}) - f(\mathbf{x} - h\mathbf{v})}{2h}$. One number is compared, for two runs, however many weights there are. A wrong gradient would have to be wrong in a way exactly at right angles to $\mathbf{v}$ to pass, and a few random directions make that vanishingly unlikely.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of measuring one entry of a gradient by a central difference, working in place on the array `x`.
        steps:
          - 'Remember the entry: `old = flat_x[i]`.'
          - 'Set the entry to `old + h` and run the function, keeping the value as `up`.'
          - 'Set the entry to `old - h` and run the function, keeping the value as `down`.'
          - 'Put the entry back: `flat_x[i] = old`.'
          - 'Store `(up - down) / (2 * h)` as entry `i` of the gradient.'
        explanation: The entry is saved first so that it can be restored exactly, with no rounding left behind. It is restored before moving on, so that when the next entry is measured this one is where it started. The two values are 2h apart, hence the division by 2h.
  formal:
    - text: |
        **Central difference.** For $f : \mathbb{R}^n \to \mathbb{R}$ three times differentiable,

        $$\frac{f(\mathbf{x} + h\mathbf{e}_i) - f(\mathbf{x} - h\mathbf{e}_i)}{2h} = \frac{\partial f}{\partial x_i}(\mathbf{x}) + \frac{h^2}{6}\frac{\partial^3 f}{\partial x_i^3}(\mathbf{x}) + O(h^4).$$

        In floating point with unit round-off $\varepsilon$ the computed quotient carries a further error of order $\varepsilon \lvert f(\mathbf{x}) \rvert / h$. The sum is least for $h$ of order $\varepsilon^{1/3}$.

        **Relative error.** For gradients $a$ and $n$, $\dfrac{\lVert a - n \rVert_\infty}{\lVert a \rVert_\infty + \lVert n \rVert_\infty + \delta}$ with a tiny $\delta > 0$.

        **Gradient check.** An analytic gradient $a$ of $f$ at $\mathbf{x}$ passes if its relative error against the central-difference gradient is below a tolerance, typically $10^{-6}$ in 64-bit arithmetic with $h \approx 10^{-6}$.

        **Directional check.** For a direction $\mathbf{v}$, compare $a \cdot \mathbf{v}$ with $\dfrac{f(\mathbf{x} + h\mathbf{v}) - f(\mathbf{x} - h\mathbf{v})}{2h}$.
