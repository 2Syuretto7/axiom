          Each pull does the last lesson's job and then this lesson's. `g * other.data` is the gradient with respect to every copy, in the full shape of the result. `unbroadcast(..., self.data.shape)` adds the copies together. For an operand that was not stretched the second step does nothing, so one piece of code serves every pairing of shapes.

