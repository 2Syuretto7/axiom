          A table `a` of shape `(4, 3)` has the mean of each **row** subtracted from that row: `d = a - mu`, where `mu` has shape `(4, 1)` and was made by summing `a` along axis 1, keeping the axis, and dividing by 3. In the backward pass, through which operations does the gradient's shape change, and how?
        options:
          - 'It never changes. Every gradient in this calculation has shape `(4, 3)`.'
          - 'At the subtraction, the share for `mu` is summed along axis 1 down to `(4, 1)`, because `mu` was stretched along that axis. At the sum that made `mu`, that `(4, 1)` gradient is copied back along axis 1 to `(4, 3)`, because each of the three entries of a row contributed to its total.'
          - 'At the subtraction it is copied to `(4, 3)`, and at the sum it is summed to `(4, 1)`.'
          - 'The subtraction sums it down to a single number.'
        answer: 1
        explanation: |
          Going forwards, the sum collapsed axis 1 and the subtraction stretched it out again. Going backwards each of those is undone by its mirror image: the stretch by a sum, the collapse by a stretch. `a` is used twice, directly in the subtraction and inside the mean, so it receives two shares, both of shape `(4, 3)`, and they add. If the loss is the sum of the squares of `d`, the second share turns out to be zero, since the entries of each row of `d` add up to nothing: moving a whole row up together does not change how far its entries are from their own mean.
    - question:
        id: work-silent
        type: choice
        system: s2
        prompt: |
          The starter's wrong gradient for `b`, of shape `(4, 1)` for a tensor of shape `(1,)`, raised no error. Why is this kind of bug so much more dangerous in array code than a mismatch of shapes usually is?
        options:
          - 'It is not dangerous, since the numbers were right.'
          - 'Because the same broadcasting that hid the copying on the way forwards also hides the mistake on the way back. Adding a `(4, 1)` array to a `(1,)` array is legal, so the gradient, and then the updated parameter, quietly take the larger shape. The model becomes a different model, one that may even fit the training data better, and nothing fails.'
          - 'Because NumPy rounds the numbers.'
          - 'Because shapes cannot be checked in Python.'
        answer: 1
        explanation: |
          A program that multiplies a `(4, 3)` matrix by a `(4, 3)` matrix stops with an error and is fixed in a minute. A program whose shapes are wrong but compatible keeps running. Here the intercept would become four intercepts, one for each training point, each free to move its own point's error towards zero: the training loss would fall beautifully, and the model would be useless on a fifth point. The defences are the invariant, gradient shape equals data shape, checked after every backward pass, and the numerical check of the next lesson, which compares each entry of each gradient with a measured slope.
    - question:
        id: work-count
        type: numeric
        system: s2
        prompt: |
          A bias `b` of shape `(8,)` is added to activations of shape `(32, 10, 8)`: 32 examples, 10 positions, 8 features. The gradient of the result is all ones. What is each entry of `b.grad`?
        answer: "320"
        explanation: |
          Lined up from the right, `b` has the last axis and lacks the first two, so each of its 8 entries was copied into $32 \times 10 = 320$ places. The gradient is summed over both missing axes, and with ones everywhere each entry of the result is 320. This is why the gradient of a bias, or of any small parameter used across a large batch, is large when the loss is a sum over the batch, and why losses are usually defined as means.
  connections:
    - text: |
        The intercept was one number and came back with four gradients. They were the gradients of its four **copies**: NumPy had stretched `b` down the rows on the way forwards, and the engine's pull returned the gradient in the stretched shape.

        Copying is a use, and uses add. So the pull of every two-operand operation ends with `unbroadcast`: **sum over the axes that were added in front, and sum, keeping the axis, wherever a length of 1 was stretched.** For a product, multiply by the other operand first and sum afterwards. The four numbers $0, 0, 2, 2$ became 4, which is $\partial L / \partial b$.

        The mirror image holds for reductions: **a sum along an axis sends its gradient back by copying along that axis**, and a mean does the same and divides. Copying and summing are each other's backward pass.

        The test of all of it is one invariant: after a backward pass, every gradient has the shape of its tensor.

        The bug in this lesson raised no error and printed a correct loss. The closure bug in the last lesson did the same. An engine can be wrong in many quiet ways, and reading the code is not a reliable way to find them. There is a mechanical one, and it uses the oldest tool you have for derivatives, the measured slope. That is the next lesson: [[e6.gradient-checking]].
