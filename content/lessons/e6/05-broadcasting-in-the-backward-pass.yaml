  work:
    - text: Slower now. For each operand, write its shape, the shape of the result, and which axes were added or stretched.
    - question:
        id: write-unbroadcast
        type: code
        mode: write
        system: s2
        prompt: |
          Write `unbroadcast(grad, shape)`. `grad` is an array with the shape of the result of a broadcast operation, and `shape` is the shape of one operand, a tuple. Return the gradient brought down to that shape: summed over the leading axes the operand did not have, and summed, keeping the axis, wherever the operand had length 1 and the gradient does not.
        starter: |
          import numpy as np


          def unbroadcast(grad, shape):
              # Replace the next line with your own.
              return grad


          g = np.arange(12.0).reshape(4, 3)
          print(unbroadcast(g, (3,)).tolist())
          print(unbroadcast(g, (4, 1)).tolist())
        solution: |
          import numpy as np


          def unbroadcast(grad, shape):
              while grad.ndim > len(shape):
                  grad = grad.sum(axis=0)
              for axis, n in enumerate(shape):
                  if n == 1 and grad.shape[axis] != 1:
                      grad = grad.sum(axis=axis, keepdims=True)
              return grad


          g = np.arange(12.0).reshape(4, 3)
          print(unbroadcast(g, (3,)).tolist())
          print(unbroadcast(g, (4, 1)).tolist())
        tests: |
          import numpy as _np
          _g = _np.arange(12.0).reshape(4, 3)
          _keep = _g.copy()
          _u = unbroadcast(_g, (3,))
          assert _u.shape == (3,) and _u.tolist() == [18.0, 22.0, 26.0], "For an operand of shape (3,), sum away the leading axis: the column totals"
          _u = unbroadcast(_g, (1, 3))
          assert _u.shape == (1, 3) and _u.tolist() == [[18.0, 22.0, 26.0]], "For an operand of shape (1, 3), sum over axis 0 and keep it with length 1"
          _u = unbroadcast(_g, (4, 1))
          assert _u.shape == (4, 1) and _u.tolist() == [[3.0], [12.0], [21.0], [30.0]], "For an operand of shape (4, 1), sum over axis 1 and keep it with length 1"
          _u = unbroadcast(_g, (4, 3))
          assert _u.shape == (4, 3) and _np.array_equal(_u, _keep), "For an operand of the same shape, the gradient comes back unchanged"
          _u = unbroadcast(_g, ())
          assert _np.shape(_u) == () and float(_u) == 66.0, "For a single number, of shape (), every axis is summed away"
          _u = unbroadcast(_g, (1, 1))
          assert _u.shape == (1, 1) and float(_u[0, 0]) == 66.0, "For an operand of shape (1, 1), both axes are summed and kept"
          _h = _np.ones((2, 4, 3))
