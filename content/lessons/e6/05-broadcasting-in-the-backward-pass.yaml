    - question:
        id: work-by-hand
        type: numeric
        system: s2
        prompt: |
          `a` has shape `(2, 3)` and holds `[[1, 2, 3], [4, 5, 6]]`. `c` has shape `(2, 1)` and holds `[[10], [100]]`. $L$ is the sum of all the entries of `a * c`. What is the gradient of the first entry of `c`?
        answer: "6"
        explanation: |
          `c` is stretched along axis 1: its first entry, 10, is copied across the three places of row 0. The gradient of `a * c` is all ones, from the sum. Multiply first: each copy's gradient is $1 \times$ the entry of `a` it met, giving `[[1, 2, 3], [4, 5, 6]]`. Then sum along axis 1, keeping it: `[[6], [15]]`. So the first entry of `c` has gradient 6. That is right, since $L = 10(1 + 2 + 3) + 100(4 + 5 + 6)$. The gradient of `a` is `c` copied across each row, `[[10, 10, 10], [100, 100, 100]]`.
