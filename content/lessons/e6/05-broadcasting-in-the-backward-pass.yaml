          Summing before multiplying is the instructive mistake. For the stretched operand it brings `g` down to shape `(3,)` and then multiplies by `self.data` of shape `(2, 3)`, which broadcasts straight back up to `(2, 3)`: the share has the wrong shape and the wrong numbers.
