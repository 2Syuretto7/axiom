concept: e6.broadcasting-in-the-backward-pass
minutes: 85
claim: You can explain why an operand that NumPy stretched to fit receives a gradient of the wrong shape, see broadcasting as the silent copying of a value and therefore add the gradients of the copies, write the function that sums a gradient back down to an operand's shape, use it in the pulls of every two-operand operation, and state the matching rule that a sum along an axis spreads its gradient back along that axis.
recalls: [e6.tensor-valued-autograd]
uses: [e6.reverse-mode-on-scalars, e6.topological-ordering-of-the-graph, e5.broadcasting, e5.axis-operations-and-reductions, e5.arrays-dtype-and-shape, e5.reshaping-views-and-copies, e5.vectorisation, m12.multivariable-chain-rule, m12.gradient, e1.special-methods-and-operator-overloading, e1.classes-and-objects, e0.loops, e0.functions]
leads: [e6.gradient-checking, e6.modules-parameters-and-optimisers, e6.training-an-mlp-on-your-own-engine, e7.autograd-in-pytorch, e7.debugging-shapes-and-nans]
starter: |
  # Scratch space. The line through four points again, with the intercept as a
  # tensor of its own, on the engine of the last lesson.
  import numpy as np


  class Tensor:
      def __init__(self, data, parents=()):
          self.data = np.array(data) * 1.0
          self.parents = parents
          self.grad = np.zeros(self.data.shape)

      def __add__(self, other):
          return Tensor(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

      def __sub__(self, other):
          return Tensor(self.data - other.data, ((self, lambda g: g), (other, lambda g: -g)))

      def __mul__(self, other):
          return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

      def __matmul__(self, other):
          return Tensor(self.data @ other.data, ((self, lambda g: g @ other.data.T), (other, lambda g: self.data.T @ g)))

      def sum(self):
          return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


  def topological(node):
      order = []
      seen = set()

      def visit(v):
          if v in seen:
              return
          seen.add(v)
          for parent, pull in v.parents:
              visit(parent)
          order.append(v)

      visit(node)
      return order


  def backward(node):
      node.grad = np.ones(node.data.shape)
      for v in topological(node)[::-1]:
          for parent, pull in v.parents:
              parent.grad = parent.grad + pull(v.grad)


  X = Tensor([[0], [1], [2], [3]])
  y = Tensor([[1], [3], [4], [6]])
  w = Tensor([[2]])
  b = Tensor([1])
  r = X @ w + b - y
  L = (r * r).sum()
  backward(L)
  print(float(L.data), w.grad.tolist())
  print(b.data.shape, b.grad.shape)
  print(b.grad.tolist())
  print((b.data - 0.1 * b.grad).shape)
parts:
  recall:
    - text: |
        [[e6.tensor-valued-autograd]] put whole arrays in the boxes of the graph and gave each arrow a pull, a function from the gradient of a result to the share owed to an operand. It ended by admitting that every pair of operands so far had the same shape. Today they do not. Three quick pulls first.
  puzzle:
    - text: |
        The starter fits the line $wx + b$ to the four points $(0, 1), (1, 3), (2, 4), (3, 6)$, at $w = 2$ and $b = 1$. This time the model is written the way anyone would write it: `X @ w + b`, with `X` holding the four values of $x$ in a column, `w` a one-by-one matrix, and `b` a tensor holding the single number 1.

        `X @ w` has shape `(4, 1)` and `b` has shape `(1,)`. NumPy adds them without complaint, stretching `b` down the four rows, as the lesson on broadcasting described.

        Run it. The first line shows a loss of 2.0 and a gradient of 10.0 for `w`, both right. The second line is where it goes wrong:

        ```
        (1,) (4, 1)
        ```

        `b` holds one number. Its gradient holds four: `[[0.0], [0.0], [2.0], [2.0]]`. The definition from the last lesson was that a gradient has the shape of the thing it is the gradient of, one rate for each entry. `b` has one entry. There is one number, $\dfrac{\partial L}{\partial b}$, and you know from the lessons on multivariable calculus that at this point it is 4.

        The last line shows what happens next if nobody notices. A step of gradient descent, `b.data - 0.1 * b.grad`, has shape `(4, 1)`. After one update the model would have four intercepts, a private one for each data point, and no error would be raised then or ever.

        **Where did four numbers come from, when `b` is one? What should be done with them to get the one that is wanted: pick one, average them, add them? And what is the rule for any pair of shapes that NumPy is willing to combine?**
  intuition:
    - text: |
        Ask what NumPy did on the way forwards. It could not add a `(4, 1)` array to a `(1,)` array as they stood, so it behaved **as if** `b` had first been copied into a `(4, 1)` array, with the same number in every row, and then added entry by entry. No copy is really made in memory, but the arithmetic is the arithmetic of the copies.

        So write the calculation with the copying shown as a step of its own:

        ```
        b  ──(copy into 4 rows)──▶  b4  ──┐
                                          ├── X @ w + b4
        X @ w  ───────────────────────────┘
        ```

        The addition is now between two arrays of the same shape, and the last lesson's rule applies to it: `b4` receives the gradient of the sum, unchanged. That is the four numbers the starter printed. They are right. They are the gradient of `b4`: how the loss responds to the copy of the intercept in row 0, in row 1, in row 2 and in row 3.

        The step that the engine left out is the copy itself. How does a gradient pass back through "one number copied into four places"?

        You answered that in the second lesson of this cluster, for scalars. **A value used in several places receives a share from each use, and the shares add.** The number in `b` was used four times, once in each row. The loss responds to it through all four copies at once, because nudging `b` nudges all four. So

        $$\frac{\partial L}{\partial b} = 0 + 0 + 2 + 2 = 4.$$

        **The four numbers are added.** Averaging would give 1, which is the gradient of a different model, one in which each row used a quarter of `b`. Picking one would ignore three of the four places where `b` acts.

        That is the whole idea, and it is worth saying as a pair of mirror images:

        **Forwards, broadcasting copies a value along an axis. Backwards, the gradient is summed along that axis.**

        A value that was stretched from length 1 to length 4 gets back the sum of 4 gradients. A value that was not stretched gets back exactly what arrived.

        The mirror works the other way round too. Take an operation that sums forwards, `a.sum()`. Its pull, in the last lesson, **spread** the gradient over all the entries. Each entry was used once in the total, and each receives the total's gradient.

        | forwards | backwards |
        | --- | --- |
        | one value copied to many places | the many gradients are summed into one |
        | many values summed into one | the one gradient is copied to the many places |

        Copying and summing are each other's backward pass. Once you see that, the shapes in a backward pass stop being a puzzle. **The gradient always ends with the shape of the thing it belongs to**, and whichever of the two operations changed the shape going forwards, the other one changes it back.
  derivation:
    - text: |
        **What broadcasting does to a shape.** Recall the rule. Two shapes are lined up from the **right**. A shape with fewer axes is given extra axes of length 1 on the left. Then along each axis the lengths must be equal, or one of them must be 1, and an axis of length 1 is stretched to match the other.

        So an operand can be changed in two ways on its way into an operation:

        1. **new axes are added on the left**, as when `(3,)` meets `(4, 3)` and is treated as `(1, 3)`;
        2. **an axis of length 1 is stretched**, as when `(1, 3)` becomes `(4, 3)`, or `(4, 1)` becomes `(4, 3)`.

        The gradient that arrives has the shape of the result. To bring it back to the operand's shape, undo both, in the same order:

        1. **sum over the leading axes that the operand did not have**, which removes them;
        2. **sum over each axis where the operand has length 1 and the gradient does not, keeping that axis** with length 1.

        ```python
        import numpy as np


        def unbroadcast(grad, shape):
            while grad.ndim > len(shape):
                grad = grad.sum(axis=0)
            for axis, n in enumerate(shape):
                if n == 1 and grad.shape[axis] != 1:
                    grad = grad.sum(axis=axis, keepdims=True)
            return grad


        g = np.arange(12.0).reshape(4, 3)
        print(unbroadcast(g, (3,)).tolist())
        print(unbroadcast(g, (4, 1)).tolist())
        print(unbroadcast(g, (4, 3)).shape, unbroadcast(g, ()).tolist())
        ```

        That prints

        ```
        [18.0, 22.0, 26.0]
        [[3.0], [12.0], [21.0], [30.0]]
        (4, 3) 66.0
        ```

        For the shape `(3,)`, the gradient has one more axis than the operand, so the leading axis is summed away: the column totals. For `(4, 1)`, the number of axes agrees, and axis 1 has length 1 in the operand and 3 in the gradient, so it is summed and kept: the row totals, as a column. For `(4, 3)` nothing was stretched and nothing is done. For `()`, a single number that was stretched over everything, every axis is summed away and the total of all twelve remains.

        `keepdims=True` matters in the second step. Without it the row totals would come back with shape `(4,)`, and a `(4, 1)` operand would be handed a `(4,)` gradient: the wrong shape again, one more bug of the kind this lesson is curing.

        *Why summing is right.* Let operand $B$ be broadcast to $\tilde B$ with the shape of the result, so that each entry of $\tilde B$ is a copy of one entry of $B$. By the chain rule, $\dfrac{\partial L}{\partial B_p} = \sum_q \dfrac{\partial L}{\partial \tilde B_q}\,\dfrac{\partial \tilde B_q}{\partial B_p}$, and $\dfrac{\partial \tilde B_q}{\partial B_p}$ is 1 when position $q$ is a copy of position $p$ and 0 otherwise. So the gradient of $B_p$ is the sum of the gradients of its copies, and the copies of $B_p$ are exactly the positions that differ from $p$ only along the added and stretched axes. $\blacksquare$

        **In the operations.** Every operation that takes two arrays and lets NumPy broadcast them needs the same repair: work out the share as before, for the full shape of the result, and then bring it down to the operand's own shape.

        ```python
        class Tensor:
            def __init__(self, data, parents=()):
                self.data = np.array(data) * 1.0
                self.parents = parents
                self.grad = np.zeros(self.data.shape)

            def __add__(self, other):
                return Tensor(self.data + other.data, (
                    (self, lambda g: unbroadcast(g, self.data.shape)),
                    (other, lambda g: unbroadcast(g, other.data.shape)),
                ))

            def __mul__(self, other):
                return Tensor(self.data * other.data, (
                    (self, lambda g: unbroadcast(g * other.data, self.data.shape)),
                    (other, lambda g: unbroadcast(g * self.data, other.data.shape)),
                ))
        ```

        Look at the order inside the pull for a product: **multiply first, then sum.** `g * other.data` is the gradient with respect to each copy, entry by entry. Only then are the copies' gradients added. Summing `g` first and multiplying afterwards gives a different number, as $\sum_i g_i a_i$ differs from $\bigl(\sum_i g_i\bigr) a$, and usually a different shape as well.

        The matrix product needs no repair. `A @ B` does not broadcast in this engine: its shapes must fit exactly.
    - question:
        id: derivation-why-sum
        type: choice
        system: s2
        prompt: |
          `b`, of shape `(1,)`, was added to an array of shape `(4, 1)`, and the gradient of the result is `[[0.0], [0.0], [2.0], [2.0]]`. Someone proposes that the gradient of `b` should be the **mean** of the four, 1.0, "so that it does not grow with the amount of data". What is wrong with that?
        options:
          - 'Nothing. The mean and the sum differ only by a constant, so either can be called the gradient.'
          - 'The gradient of `b` is a definite number: the rate at which this loss changes when `b` changes. Nudging `b` moves all four rows, so the rate is the sum of the four, 4.0. If a loss that does not grow with the amount of data is wanted, the loss should be defined as a mean, and then the factor of a quarter arrives through the backward pass of that mean.'
          - 'The mean cannot be computed for a column.'
          - 'The gradient should be the largest of the four.'
        answer: 1
        explanation: |
          An engine reports the derivative of the function that was actually computed. Here that function is a **sum** of squared errors, and its derivative with respect to the intercept is $2\sum_i r_i = 4$. A numerical check agrees: raise $b$ by a thousandth and the loss rises by about four thousandths. Whether to average over the data is a decision about the loss, made in the forward code, where it can be seen. An engine that quietly averaged inside its backward pass would give a wrong gradient for every function, and the error would change with the batch size.
    - text: |
        **Sums along an axis.** The other half of the mirror. Let `a` have shape `(4, 3)` and take `s = a.sum(axis=0)`, the column totals, of shape `(3,)`. Entry `a[i, j]` contributes to `s[j]` at the rate 1. So the gradient of `a[i, j]` is the gradient of `s[j]`, for every row `i`: the gradient of `s` is **copied down the rows**. Summing forwards along an axis is broadcasting backwards along it.

        The neatest way to write it is to keep the summed axis, with length 1, in the result. Then the pull is one line, and NumPy's own broadcasting does the copying:

        ```python
        class Tensor:
            def __init__(self, data, parents=()):
                self.data = np.array(data) * 1.0
                self.parents = parents
                self.grad = np.zeros(self.data.shape)

            def sum(self, axis=None):
                if axis is None:
                    return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))
                return Tensor(self.data.sum(axis=axis, keepdims=True), ((self, lambda g: g * np.ones(self.data.shape)),))
        ```

        With `axis=0` on a `(4, 3)` array the result has shape `(1, 3)`, its gradient has shape `(1, 3)`, and multiplying by ones of shape `(4, 3)` stretches it down the four rows. A mean is the same with a division: each entry contributes at the rate $\frac1n$, so the gradient is spread and divided by the number of entries averaged.

        **The pair at work.** Subtract from each row of a table its own mean, as you did to standardise features: `a - a.sum(axis=1) * third`, where `third` holds $\frac13$. Forwards, the sum collapses an axis and the subtraction broadcasts the result back along it. Backwards, the subtraction's pull sums along that axis and the sum's pull broadcasts along it. Each operation's pull undoes what that operation did to the shape, and the gradient arrives at `a` with the shape of `a`.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: |
          `c = a * b` with `a` of shape `(4, 3)` and `b` of shape `(3,)`. The gradient of `c` is `g`, of shape `(4, 3)`. Put in order the steps by which the pull produces the share for `b`.
        steps:
          - 'Multiply `g` by `a.data`, entry by entry, giving a `(4, 3)` array: the gradient with respect to each copy of `b`.'
          - 'Compare shapes: that array has 2 axes and `b` has 1.'
          - 'Sum over axis 0, the axis `b` did not have, giving shape `(3,)`.'
          - 'No axis of `b` has length 1, so nothing more is summed, and the `(3,)` array is returned.'
        explanation: The product comes first, because each of the four copies of an entry of b was multiplied by a different entry of a and so has a different local derivative. Then the copies' gradients are added, by summing away the axis that broadcasting put in front of b.
  formal:
    - text: |
        **Broadcast as an operation.** Broadcasting an array $B$ of shape $s$ to a shape $t$ is the linear map that copies each entry of $B$ to every position of the result that agrees with it on the axes $B$ has with length greater than 1. Its pull sends a gradient $G$ of shape $t$ to the array of shape $s$ obtained by summing $G$ over the axes absent from $s$, and over the axes where $s$ has length 1 and $t$ does not, keeping the latter with length 1.

        **Two-operand operations.** If $C = f(\tilde A, \tilde B)$ where $\tilde A$ and $\tilde B$ are $A$ and $B$ broadcast to a common shape, then the pull for $A$ is the pull of $f$ for $\tilde A$, followed by the pull of the broadcast.

        **Reduction.** For $S = \sum_{\text{axis } k} A$, kept with length 1 on axis $k$, the pull sends $G$ to $G$ broadcast along axis $k$ to the shape of $A$. For a mean over $n$ entries, to that divided by $n$.

        **Invariant.** After a backward pass, `v.grad.shape == v.data.shape` for every node $v$.
