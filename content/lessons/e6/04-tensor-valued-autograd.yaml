concept: e6.tensor-valued-autograd
minutes: 95
claim: You can let one node of a computational graph hold a whole array, say why its gradient is an array of the same shape, replace the number on each arrow by a function that turns the gradient of the result into the share owed to an operand, derive that function for elementwise operations, for a sum and for a matrix product without ever writing out a Jacobian, and write a backward pass for arrays that differentiates a linear model in one sweep.
recalls: [e6.topological-ordering-of-the-graph]
uses: [e6.reverse-mode-on-scalars, e6.scalar-computational-graph, m12.jacobian, m12.multivariable-chain-rule, m12.gradient, m12.partial-derivatives, m5.matrix-multiplication-as-composition, m5.transpose, m5.matrix-vector-product, m2.summation-and-product-notation, e5.arrays-dtype-and-shape, e5.vectorisation, e5.axis-operations-and-reductions, e5.linear-algebra-routines, e5.random-number-generation, e1.special-methods-and-operator-overloading, e1.classes-and-objects, e1.comprehensions-and-iterators, m2.composition-and-inverses, e0.functions, e0.loops]
leads: [e6.broadcasting-in-the-backward-pass, e6.gradient-checking, e6.modules-parameters-and-optimisers, e6.memory-planning-and-in-place-operations, e7.autograd-in-pytorch, e7.tensors-and-devices]
starter: |
  # Scratch space. A sum of squared errors for 50 data points and 10 weights,
  # built from scalar Values, with a count of the nodes it makes.
  import numpy as np

  made = [0]


  class Value:
      def __init__(self, data, parents=()):
          made[0] += 1
          self.data = data
          self.parents = parents

      def __add__(self, other):
          return Value(self.data + other.data, ((self, 1.0), (other, 1.0)))

      def __sub__(self, other):
          return Value(self.data - other.data, ((self, 1.0), (other, -1.0)))

      def __mul__(self, other):
          return Value(self.data * other.data, ((self, other.data), (other, self.data)))


  rng = np.random.default_rng(0)
  X = rng.normal(size=(50, 10))
  w = rng.normal(size=10)
  y = rng.normal(size=50)

  Xv = [[Value(float(v)) for v in row] for row in X]
  wv = [Value(float(v)) for v in w]
  yv = [Value(float(v)) for v in y]
  L = None
  for i in range(50):
      p = Xv[i][0] * wv[0]
      for j in range(1, 10):
          p = p + Xv[i][j] * wv[j]
      e = p - yv[i]
      L = e * e if L is None else L + e * e
  print(made[0], round(L.data, 4))

  # The same number from NumPy, in four whole-array operations.
  r = X @ w - y
  print(round(float((r * r).sum()), 4))
parts:
  recall:
    - text: |
        [[e6.topological-ordering-of-the-graph]] finished the scalar engine: a graph of `Value` objects, and a backward pass that visits each once, in an order in which every value has heard from all its users, at a cost of one multiplication for each arrow. Today the boxes of the graph grow from single numbers to whole arrays. Three quick pulls first.
  puzzle:
    - text: |
        The starter computes a sum of squared errors, $L = \sum_i \bigl( \sum_j X_{ij} w_j - y_i \bigr)^2$, for 50 data points and 10 weights. It does it twice.

        The first time it uses the scalar engine. Every number becomes a `Value`, and every multiplication and addition becomes a node. Run it: the count of nodes is `1659`, and the loss is `462.8727`.

        The second time it uses NumPy: `r = X @ w - y` and then `(r * r).sum()`. The same `462.8727`, from four operations on whole arrays.

        This is a toy. A real layer multiplies a batch of a thousand rows by a matrix of a thousand by a thousand: a thousand million scalar multiplications, each of which the scalar engine would turn into a Python object with its own tuple of parents. The lessons on NumPy were about exactly this, that looping over numbers one at a time in Python is a hundred times too slow, and that the cure is to hand whole arrays to compiled code.

        So the graph should be made of the four array operations, not the 1,659 scalar ones. Four nodes, each holding an array. But then look at an arrow. On the scalar graph each arrow carried one number, a local derivative. The arrow from `X` to `X @ w` joins an array of 500 numbers to an array of 50. Every one of the 50 depends on some of the 500. The "local derivative" is a table of $50 \times 500$ partial derivatives. For the thousand-by-thousand layer, the table for one arrow has a million million entries.

        **What should an arrow between two arrays carry? Is that enormous table really needed to pass a gradient back, or only something much smaller that can be worked out from it? And what, for an array, is a gradient?**
  intuition:
    - text: |
        Take the last question first, since it is the easy one.

        The output of the whole calculation is still one number, the loss $L$. A node now holds an array, say `r` with 50 entries. Each entry is a number that $L$ depends on, so each has its own $\dfrac{\partial L}{\partial r_i}$. Collect them and you have 50 numbers, arranged exactly as `r` is.

        **The gradient of an array node is an array of the same shape. Entry by entry, it says how the output responds to that entry.** For a matrix `W` of shape `(3, 4)`, `W.grad` has shape `(3, 4)`, and `W.grad[1, 2]` is $\dfrac{\partial L}{\partial W_{12}}$. Nothing new has been defined. It is the scalar definition, used once for each number in the box.

        Now the arrow. Go back to what the scalar backward pass did with the number on an arrow. It did one thing only: `parent.grad += v.grad * local`. The number was never looked at for its own sake. It was a way of **turning the gradient of the result into the share owed to the operand**.

        That job is what an arrow must do, and the job can be given directly. Let each arrow carry, in place of a number, a **function**: it takes the gradient of the result, an array shaped like the result, and returns the operand's share, an array shaped like the operand. This lesson calls that function the arrow's **pull**, since it pulls the gradient back along the arrow.

        ```
        scalar arrow:   share = v.grad * local
        array arrow:    share = pull(v.grad)
        ```

        What is the pull for each operation? For most, it is what you would guess.

        **Adding arrays.** `c = a + b`, entry by entry: $c_i = a_i + b_i$. Entry $a_i$ affects only $c_i$, at the rate 1. So $\dfrac{\partial L}{\partial a_i} = \dfrac{\partial L}{\partial c_i}$, for every $i$. The pull for `a` hands the gradient back unchanged, and so does the pull for `b`.

        **Multiplying arrays entry by entry.** $c_i = a_i b_i$. Entry $a_i$ affects only $c_i$, at the rate $b_i$. So the pull for `a` is: multiply the arriving gradient, entry by entry, by `b`. It is the scalar rule fifty times side by side.

        **Adding up.** `s = a.sum()`. Every entry of `a` affects the one number `s` at the rate 1. So every entry of `a` receives the gradient of `s`: the pull spreads one number over the whole shape of `a`.

        **A matrix product.** This is the only one that needs thought, and it gets the derivation section. Here is the answer in advance, with the reason it could hardly be anything else. Let `C = A @ B`, where `A` is $m \times k$ and `B` is $k \times n$, so `C` and its gradient `G` are $m \times n$. The share for `A` must be $m \times k$, and it must be built from `G` and `B`. The share for `B` must be $k \times n$, built from `G` and `A`.

        $$\text{share for } A = G\,B^{\mathsf T}, \qquad \text{share for } B = A^{\mathsf T} G.$$

        Check the shapes: $(m \times n)(n \times k)$ is $m \times k$, and $(k \times m)(m \times n)$ is $k \times n$. No other product of those pieces has the right shape.

        Look at what was avoided. The table of all the partial derivatives of `C` with respect to `A` has $mn \times mk$ entries. The pull never makes it. It does one matrix product, the same size of work as the forward operation. **The backward pass needs the Jacobian's effect on a gradient, and never the Jacobian.**
    - text: |
        ```python
        import numpy as np


        class Tensor:
            def __init__(self, data, parents=()):
                self.data = np.array(data) * 1.0
                self.parents = parents
                self.grad = np.zeros(self.data.shape)

            def __sub__(self, other):
                return Tensor(self.data - other.data, ((self, lambda g: g), (other, lambda g: -g)))

            def __mul__(self, other):
                return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

            def __matmul__(self, other):
                return Tensor(self.data @ other.data, ((self, lambda g: g @ other.data.T), (other, lambda g: self.data.T @ g)))

            def sum(self):
                return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


        def topological(node):
            order = []
            seen = set()

            def visit(v):
                if v in seen:
                    return
                seen.add(v)
                for parent, pull in v.parents:
                    visit(parent)
                order.append(v)

            visit(node)
            return order


        def backward(node):
            node.grad = np.ones(node.data.shape)
            for v in topological(node)[::-1]:
                for parent, pull in v.parents:
                    parent.grad = parent.grad + pull(v.grad)


        X = Tensor([[0, 1], [1, 1], [2, 1], [3, 1]])
        w = Tensor([[2], [1]])
        y = Tensor([[1], [3], [4], [6]])
        r = X @ w - y
        L = (r * r).sum()
        backward(L)
        print(float(L.data), w.grad.tolist(), len(topological(L)))
        ```

        That prints `2.0 [[10.0], [4.0]] 7`.

        This is the scalar engine with two changes. `data` and `grad` are arrays. And each entry of `parents` pairs a parent with a small function, written as a `lambda`, where it used to pair it with a number. `topological` is untouched. `backward` has `pull(v.grad)` where it had `v.grad * local`.

        The data are old friends: the four points $(0, 1), (1, 3), (2, 4), (3, 6)$ and the line with slope 2 and intercept 1, from the lessons on multivariable calculus. The second column of `X` is all ones, so that `X @ w` is $2x + 1$ for each point. The loss is 2 and its gradient is $(10, 4)$, as it was when you worked it out by hand. The graph has 7 nodes: three leaves and four operations.
  derivation:
    - text: |
        **Setting.** Every node $V$ holds an array. The output $L$ is a single number. The gradient of a node, $\bar V$, is the array with the shape of $V$ whose entries are $\dfrac{\partial L}{\partial V_{\dots}}$. For an operation with result $C$ and an operand $A$, the **pull** for $A$ is the function that sends $\bar C$ to the contribution of this use to $\bar A$:

        $$(\text{pull}(\bar C))_{p} = \sum_{q} \bar C_{q}\,\frac{\partial C_q}{\partial A_p},$$

        where $p$ runs over the positions of $A$ and $q$ over the positions of $C$. That is the multivariable chain rule: entry $A_p$ reaches $L$ through every entry of $C$ it affects, and the routes add.

        If the arrays are flattened into vectors, the numbers $\dfrac{\partial C_q}{\partial A_p}$ form the Jacobian $J$ of the operation, with a row for each output and a column for each input, and the formula says $\text{pull}(\mathbf{g}) = J^{\mathsf T}\mathbf{g}$. You met that in the project that closed multivariable calculus: **a gradient is carried backwards through a function by the transpose of its Jacobian.** A pull is that product, computed without building $J$. The usual name for it is a **vector-Jacobian product**.

        **Elementwise operations.** If $C_i = \phi(A_i)$ for some function $\phi$ of one number, then $C_q$ depends on $A_p$ only when $q = p$, the Jacobian is diagonal, and the sum collapses to one term:

        $$\text{pull}(G)_i = G_i\,\phi'(A_i).$$

        For $\tanh$ that is $G \times (1 - C^2)$, entry by entry. Addition, subtraction and the entry-by-entry product are the same with two operands.

        **Sum.** $s = \sum_i A_i$ has $\dfrac{\partial s}{\partial A_p} = 1$ for every $p$. With $\bar s$ a single number, $\text{pull}(\bar s)_p = \bar s$: an array shaped like $A$, filled with $\bar s$.

        **Matrix product.** Let $C = AB$, so $C_{ij} = \sum_{l} A_{il}B_{lj}$. Which entries of $C$ does $A_{ik}$ affect? Only those in row $i$, and $\dfrac{\partial C_{ij}}{\partial A_{ik}} = B_{kj}$. So

        $$\bar A_{ik} = \sum_{j} \bar C_{ij}\,B_{kj} = \sum_j \bar C_{ij}\,(B^{\mathsf T})_{jk} = (\bar C\,B^{\mathsf T})_{ik}.$$

        And $B_{kj}$ affects only column $j$ of $C$, with $\dfrac{\partial C_{ij}}{\partial B_{kj}} = A_{ik}$, so

        $$\bar B_{kj} = \sum_i A_{ik}\,\bar C_{ij} = (A^{\mathsf T}\,\bar C)_{kj}. \qquad \blacksquare$$

        $$\boxed{\;C = AB: \qquad \bar A \mathrel{+}= \bar C\,B^{\mathsf T}, \qquad \bar B \mathrel{+}= A^{\mathsf T}\,\bar C\;}$$

        These two lines are worth knowing as well as the product rule. Every dense layer of every network is differentiated by them.

        **The linear model by hand.** With $r = Xw - y$ and $L = \sum r_i^2$: $\bar L = 1$. The sum spreads it: the gradient of the array of squares is all ones. The product $r * r$ uses $r$ twice, each use contributing $1 \times r$, so $\bar r = 2r$. Subtraction passes that to $Xw$ unchanged. The matrix product gives $\bar w = X^{\mathsf T}(2r) = 2X^{\mathsf T}(Xw - y)$. That is the formula for the gradient of least squares, and nobody typed it in. With $r = (0, 0, 1, 1)$, $2X^{\mathsf T} r = 2\,(2 + 3,\ 1 + 1) = (10, 4)$.
    - question:
        id: derivation-shapes
        type: choice
        system: s2
        prompt: |
          `C = A @ B` with `A` of shape `(5, 3)` and `B` of shape `(3, 2)`. `G` is the gradient of `C`. Which expression is the share owed to `A`?
        options:
          - '`G @ B.data`'
          - '`G @ B.data.T`'
          - '`B.data.T @ G`'
          - '`A.data.T @ G`'
        answer: 1
        explanation: |
          `G` has the shape of `C`, which is `(5, 2)`. The share for `A` must have the shape of `A`, `(5, 3)`. `G @ B.data.T` is `(5, 2)` times `(2, 3)`, giving `(5, 3)`. `G @ B.data` cannot be formed at all, since 2 does not match 3. `B.data.T @ G` cannot either. `A.data.T @ G` is `(3, 5)` times `(5, 2)`, giving `(3, 2)`: that is the share for `B`. When in doubt about a pull, write the shapes down. For a matrix product they leave only one possibility.
    - text: |
        **Pulls are closures.** A `lambda` written inside `__mul__` uses `self` and `other`, and it goes on being able to use them after `__mul__` has returned. It carries them with it. That is how the pull finds the operands when the backward pass calls it, much later.

        It has a cost. As long as the result exists, so do its pulls, and so does every array they hold on to. That is the memory price of reverse mode from two lessons ago, now visible in the code: the multiplication keeps both operands alive, and `tanh` keeps its output.

        There is also a trap. A closure holds on to a **variable**, not to the value the variable had when the `lambda` was written. Make several pulls in a loop, each using the loop variable, and by the time any of them is called the loop has finished, and they all see the variable's last value.

        ```python
        pulls = []
        for k in [0.5, 2.0, -1.0]:
            pulls.append(lambda g: g * k)
        print([pull(10.0) for pull in pulls])

        pulls = []
        for k in [0.5, 2.0, -1.0]:
            pulls.append(lambda g, k=k: g * k)
        print([pull(10.0) for pull in pulls])
        ```

        The first line printed is `[-10.0, -10.0, -10.0]` and the second is `[5.0, 20.0, -10.0]`. Writing `k=k` gives the `lambda` a parameter of its own with a default, and a default is worked out at once, when the `lambda` is made. In the operations above there is no loop, each call of `__mul__` has its own `self` and `other`, and the trap does not arise. It arises as soon as an operation takes a list of operands.

        **Why not `+=`.** The sweep says `parent.grad = parent.grad + pull(v.grad)`, building a new array, where the scalar version said `+=`. For addition the pull returns the very array it was given. Two nodes could then be holding the same array as their gradient, and changing one in place would change the other. A later lesson of this cluster is about that kind of accident. Until then the engine makes a new array every time.
    - question:
        id: derivation-jacobian
        type: choice
        system: s2
        prompt: |
          A layer computes `C = A @ B` with `A` of shape `(1000, 1000)` and `B` of shape `(1000, 1000)`. Why does the engine not store the Jacobian of `C` with respect to `A` on the arrow, as the scalar engine stored a local derivative?
        options:
          - 'Because a matrix product has no derivative.'
          - 'Because that Jacobian has a row for each of the million entries of `C` and a column for each of the million entries of `A`: a million million numbers, nearly all of them zero. The backward pass only ever needs its transpose applied to one gradient, and that is `G @ B.data.T`, a single matrix product.'
          - 'Because the Jacobian depends on the loss, which is not yet known.'
          - 'Because NumPy cannot store arrays with more than two axes.'
        answer: 1
        explanation: |
          The Jacobian exists and is easy to describe: the derivative of $C_{ij}$ with respect to $A_{ik}$ is $B_{kj}$, and with respect to any entry of $A$ outside row $i$ it is 0. Stored in full it would need about eight million megabytes. Applied to a gradient it costs one matrix product. This is the idea that makes array autograd possible at all: each operation supplies a short piece of code that applies its transposed Jacobian, and the table itself is never formed. The Jacobian does not depend on the loss. Only the gradient passed through it does.
  formal:
    - text: |
        **Gradient of an array node.** For a scalar output $L$ and a node $V$, $\bar V$ is the array of the shape of $V$ with $\bar V_p = \partial L / \partial V_p$.

        **Pull (vector-Jacobian product).** For an operation $C = f(A, \dots)$, the pull for $A$ is the linear map $G \mapsto \sum_q G_q\,\dfrac{\partial C_q}{\partial A_p}$, equal to $J_A^{\mathsf T}\,G$ when arrays are flattened and $J_A$ is the Jacobian of $C$ with respect to $A$.

        **Rules.**

        | operation | pull for $A$ | pull for $B$ |
        | --- | --- | --- |
        | $C = A + B$ | $G$ | $G$ |
        | $C = A - B$ | $G$ | $-G$ |
        | $C = A * B$ (entry by entry) | $G * B$ | $G * A$ |
        | $C = \tanh A$ | $G * (1 - C * C)$ | |
        | $s = \operatorname{sum}(A)$ | $G$ spread over the shape of $A$ | |
        | $C = AB$ (matrix product) | $G\,B^{\mathsf T}$ | $A^{\mathsf T} G$ |

        **Backward pass.** Set $\bar L = 1$ and every other gradient to zeros. In reverse topological order, for each node $V$ and each parent entry $(P, \text{pull})$, add $\text{pull}(\bar V)$ to $\bar P$.
