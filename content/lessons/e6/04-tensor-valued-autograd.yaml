        explanation: |
          All three pulls were written as `lambda g: g * c`, and all three hold on to the one variable `c` of the function, not to the number it held when each was made. The pulls are called during the backward pass, long after the loop has ended with `c` at $-1.0$. So every tensor received $-1$ times the gradient. The value was right because `total` was worked out at once, inside the loop's own time.

          `lambda g, c=c: g * c` gives each pull a parameter of its own, whose default is fixed when the `lambda` is made. Another cure is a small function that takes `c` and returns the `lambda`, since each call of a function has its own variables. This bug is easy to write and hard to see, because the forward values are perfect and the gradients have a plausible size. It is one of the reasons the next lesson but one exists: gradients are checked numerically, always.
    - question:
        id: work-by-hand
        type: numeric
        system: s2
        prompt: |
          $X = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$, $w = \begin{pmatrix} 1 \\ -1 \end{pmatrix}$, and $L$ is the sum of the entries of $Xw$. Work backwards: the gradient of $Xw$ is all ones. What is the first entry of the gradient of $w$?
        answer: "4"
        explanation: |
          The sum spreads the gradient 1 over both entries of $Xw$, so $G = (1, 1)^{\mathsf T}$. The matrix product gives $\bar w = X^{\mathsf T} G = \begin{pmatrix} 1 & 3 \\ 2 & 4 \end{pmatrix}\begin{pmatrix} 1 \\ 1 \end{pmatrix} = \begin{pmatrix} 4 \\ 6 \end{pmatrix}$: the column sums of $X$. That is right, since $L = (1 + 3)w_1 + (2 + 4)w_2$. The values in $w$ did not matter, because this $L$ is linear in $w$. The gradient of $X$ is $G\,w^{\mathsf T} = \begin{pmatrix} 1 & -1 \\ 1 & -1 \end{pmatrix}$, and there the values of $w$ are everything.
    - question:
        id: work-vjp
        type: choice
        system: s2
        prompt: |
          An operation takes an array of a million numbers and applies $\tanh$ to each. Its Jacobian, flattened, is a million by a million. What does its pull do, and what does that cost?
        options:
          - 'It builds the Jacobian and multiplies the gradient by its transpose: a million million multiplications.'
          - 'It multiplies the arriving gradient, entry by entry, by one less the square of the output: a million multiplications. The Jacobian is diagonal, so applying its transpose needs only the diagonal, which is a single array.'
          - 'It returns the gradient unchanged.'
          - 'It cannot be done for so large an array.'
        answer: 1
        explanation: |
          Entry $i$ of the output depends on entry $i$ of the input and on no other, so the only non-zero partial derivatives are the million on the diagonal, $1 - \tanh^2$ of each input. Multiplying a vector by a diagonal matrix is an entry-by-entry product. The pull does that directly and the matrix is never written down. Every operation in an array engine is like this: its Jacobian has a structure, the pull is a few lines that exploit the structure, and the cost of going backwards through the operation is about the cost of going forwards.
    - question:
        id: work-node-count
        type: choice
        system: s2
        prompt: |
          The starter's loss took 1,659 scalar nodes and takes 7 tensor nodes. For 5,000 data points and 1,000 weights, what happens to each count?
        options:
          - 'Both grow by the same factor.'
          - 'The scalar count grows to about ten million, since there is a node for every multiplication and addition. The tensor count stays at 7. The arrays inside the nodes are larger, but the graph, and the Python work of walking it, is the same.'
          - 'The tensor count grows to 5,000, one for each data point.'
          - 'The scalar count stays the same and the tensor count grows.'
        answer: 1
        explanation: |
          The scalar graph has roughly two nodes for every entry of `X`, a multiplication and an addition, so about ten million for a 5,000 by 1,000 table. The tensor graph depends on how many array operations the program performs, and not at all on how big the arrays are. All the heavy arithmetic happens inside NumPy's compiled loops, in the forward operations and in the pulls. The engine's own Python runs seven times. This is the same bargain as vectorisation in the lessons on NumPy, now applied to the derivative as well as to the value.
    - question:
        id: work-share-twice
        type: numeric
        system: s2
        prompt: |
          `a` is a `Tensor` holding `[1, 2, 3]`. `L = (a * a).sum()`. During the backward pass, how many times is a share added to `a.grad`, and what is `a.grad[2]` at the end? Give the final value of `a.grad[2]`.
        answer: "6"
        explanation: |
          The product node has `a` as a parent twice, so `a` receives two shares. The gradient of the product is all ones, from the sum. Each pull multiplies it by the other operand, which is `a` itself, giving `[1, 2, 3]` each time. The two shares add to `[2, 4, 6]`, which is $2a$, the gradient of $\sum a_i^2$. Sharing works for arrays exactly as it did for numbers: one share for each arrow, and they add.
  connections:
    - text: |
        The scalar engine needed 1,659 nodes where NumPy needed four operations. So a node now holds an **array**, and its **gradient is an array of the same shape**: one $\partial L / \partial(\text{entry})$ for each entry.

        An arrow can no longer carry a number, and it must not carry the Jacobian, which for a matrix product would have millions of millions of entries. It carries a **pull**: a function from the gradient of the result to the share owed to the operand. The pull applies the transposed Jacobian without forming it. For entry-by-entry operations it is the scalar rule in every entry. For a sum it spreads. For a matrix product $C = AB$ it is $\bar C B^{\mathsf T}$ for $A$ and $A^{\mathsf T}\bar C$ for $B$, which the shapes alone nearly force.

        The sweep is unchanged: seed the output with 1, go through the reversed topological order, add `pull(v.grad)` to each parent. It gave the gradient of least squares, $2X^{\mathsf T}(Xw - y)$, without being told the formula.

        There is a gap in the engine, and you may have noticed it in the choice of example. The intercept was folded into `X` as a column of ones, and every pair of operands had the same shape. Write the model the natural way, `X @ w + b` with one number `b` added to every row, and NumPy stretches `b` to fit. The forward value is right. The gradient that comes back for `b` has the wrong shape. Repairing that is the next lesson: [[e6.broadcasting-in-the-backward-pass]].
