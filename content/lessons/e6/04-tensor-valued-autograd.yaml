    - question:
        id: predict-elementwise
        type: predict
        system: s1
        prompt: A dot product written as a product and a sum, run backwards. What does this show?
        code: |
          import numpy as np


          class Tensor:
              def __init__(self, data, parents=()):
                  self.data = np.array(data) * 1.0
                  self.parents = parents
                  self.grad = np.zeros(self.data.shape)

              def __mul__(self, other):
                  return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

              def sum(self):
                  return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


          a = Tensor([1, 2, 3])
          b = Tensor([4, 5, 6])
          p = a * b
          L = p.sum()
          L.grad = np.ones(L.data.shape)
          for v in [L, p]:
              for parent, pull in v.parents:
                  parent.grad = parent.grad + pull(v.grad)
          print(float(L.data), p.grad.tolist())
          print(a.grad.tolist(), b.grad.tolist())
        output: |
          32.0 [1.0, 1.0, 1.0]
          [4.0, 5.0, 6.0] [1.0, 2.0, 3.0]
        explanation: The sum is 4 + 10 + 18. Its pull spreads the gradient 1 over the three products. The product's pulls then multiply by the other operand, so a receives b and b receives a. The gradient of a dot product with respect to one vector is the other vector.
    - question:
        id: predict-matmul
        type: predict
