        explanation: |
          The gradients were cleared after the backward pass had filled them and before the update read them. Every update subtracted 0.02 times zero. The parameters never moved, the loss never moved, and no error was raised, because subtracting zero is a perfectly good thing to do.

          Moving `opt.zero_grad()` above `backward(L)` restores the order: clear, fill, use. Deleting the clearing altogether brings back the puzzle, where each step uses the sum of every gradient so far. Clearing once, before the loop, is the same mistake with one correct first step.

          A loss that does not change **at all**, to the last digit, is a strong hint. A learning rate that is too small gives a loss that changes slowly. A model that has stopped learning gives one that changes in its late digits. A loss frozen exactly means that the parameters are not being written to, and the order of these four lines is the first place to look.
    - question:
        id: work-chain
        type: choice
        system: s2
        prompt: |
          Someone writes the update with tensor operations and puts the result back into the layer: `layer.weight = layer.weight - lr_tensor * grad_tensor`, where the right-hand side is built with the engine's `__sub__` and `__mul__`. Training works, and each step is slower than the last. Why?
        options:
          - 'The learning rate grows with each step.'
          - 'The new weight is a node whose parent is the old weight, whose parent is the weight before that. The graph now contains every step of training so far, and each backward pass walks back through all of it, to the very first weights.'
          - 'Tensor subtraction is slower than array subtraction by a constant factor.'
          - 'The gradients are not being cleared.'
        answer: 1
        explanation: |
          An operation on tensors records its operands, and that is right for the model's forward pass and wrong for the update. After a thousand steps the weight is the tip of a chain a thousand subtractions long, each link holding arrays alive through its closures. Time and memory for each step grow in proportion to the number of steps taken. Writing to `.data` makes the weight a leaf again at every step: the same object, with new numbers and no history. Frameworks have a special mode for this, in which operations are computed and not recorded.
    - question:
        id: work-frozen
        type: choice
        system: s2
        prompt: |
          A model's `parameters()` returns the parameters of its first layer only. The second layer's are left out. The optimiser is built from that list. What happens in training?
        options:
          - 'An error is raised at the first step, because gradients exist for tensors that are not in the list.'
          - 'The second layer keeps its random starting values for ever. Its gradients are computed by every backward pass, never used, and never cleared, so they also grow without limit. The loss still falls, because the first layer adapts to the frozen second one, and the model ends up worse than it should be.'
          - 'Nothing trains.'
          - 'The second layer is trained with a learning rate of 1.'
        answer: 1
        explanation: |
          The engine does not know which tensors are parameters. It gives every tensor in the graph its share. The optimiser, for its part, knows only the list. A tensor outside the list is simply never visited: not updated and not cleared. Because the rest of the model can partly make up for it, the loss curve looks healthy. The check is cheap: count the numbers in `parameters()` and compare with the count worked out by hand, as in the derivation.
    - question:
        id: work-momentum
        type: numeric
        system: s2
        prompt: |
          An optimiser has learning rate 0.1 and momentum 0.5. A parameter starts at 5 with velocity 0, and its gradient is 1 at every step. What is the parameter after three steps?
        answer: "4.575"
        tolerance: "0.0005"
        explanation: |
          The velocities are $1$, then $0.5 \times 1 + 1 = 1.5$, then $0.5 \times 1.5 + 1 = 1.75$. The parameter moves by 0.1 times each: $5 - 0.1 - 0.15 - 0.175 = 4.575$. Plain descent would have reached 4.7. The velocity is heading for $1/(1 - 0.5) = 2$, so in the long run momentum 0.5 doubles the speed along a steady slope, and momentum 0.9 multiplies it by ten.
    - question:
        id: work-engine-split
        type: choice
        system: s2
        prompt: |
          The engine's `backward` adds to gradients and never clears them, and clearing is left to the optimiser. Would it be better for `backward` to set every gradient in the graph to zero before it starts?
        options:
          - 'Yes. Accumulating is only ever a source of bugs.'
          - 'It is a design choice with a cost either way. Clearing inside `backward` would prevent the puzzle. But accumulating across backward passes is sometimes wanted: the gradient of a sum of losses can be gathered one loss at a time, which lets a batch too large for memory be processed in pieces before a single update. Leaving the clearing explicit keeps that possible, at the price of one line that must not be forgotten.'
          - 'No, because `backward` cannot find the leaves of the graph.'
          - 'No, because zero is not a valid gradient.'
        answer: 1
        explanation: |
          The gradient of $L_1 + L_2$ is the gradient of $L_1$ plus the gradient of $L_2$. With an accumulating engine, running `backward(L1)` and then `backward(L2)` leaves exactly that sum in the parameters, and only one of the two graphs needs to exist at a time. This is how a large batch is split into small ones. The framework you will meet in the next cluster made the same choice as this engine, for this reason, and `zero_grad` is one of the four lines of every training loop written with it.
  connections:
    - text: |
        The loss fell to 0.34 and climbed back to 66, with gradients that were all correct. Nothing had cleared them. The backward pass **accumulates**, as it must, and so each step had used the sum of all the gradients before it.

        Training asks three chores of every parameter: create it, clear its gradient, update it. Doing them by name, one line for each parameter, cannot be kept up. So the parameters go in a **list**. A **module** owns parameters and returns that list, and a module made of modules joins the lists of its parts. An **optimiser** holds the list, clears with `zero_grad`, and updates with `step`, writing to the data **outside the graph** so that parameters stay leaves. Any memory an update rule needs, such as the **velocity** of momentum, lives in the optimiser. A training step is forward, clear, backward, update.

        The engine itself did not change today. That separation, an engine that differentiates and a thin layer of bookkeeping around it, is the architecture of every deep-learning framework.

        One thing about the engine's gradients has been taken for granted. A gradient is stored as a plain array. It is a number, and not a node, so it has no history, and it cannot itself be differentiated. Yet the curvature of a loss is a derivative of a derivative. Making the backward pass build a graph of its own is the next lesson: [[e6.higher-order-gradients]].
