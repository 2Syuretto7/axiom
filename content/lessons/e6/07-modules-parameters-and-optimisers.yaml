        explanation: |
          Both methods are a loop over the list. `zero_grad` gives each parameter a fresh array of zeros. `step` blends the gradient into that parameter's velocity, stores the velocity, and moves the data against it.

          The first wrong version is the rebinding trap from the derivation: `p = Tensor(...)` makes a new tensor and attaches the loop's name to it, and the tensor in the list is untouched. Adding where it should subtract climbs the loss. Ignoring the velocity is correct only when the momentum is zero, and computing it without storing it forgets it by the next step, which comes to the same thing. One velocity shared by every parameter mixes their gradients together.

          The program is the puzzle's line fit with the chores handed over. The loop no longer names `w` or `b`, and it would not change if the model had a hundred parameters.
