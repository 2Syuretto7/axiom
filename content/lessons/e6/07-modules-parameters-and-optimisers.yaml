concept: e6.modules-parameters-and-optimisers
minutes: 80
claim: You can separate the three chores of training from the engine that computes gradients, write a layer as an object that owns its parameters and can list them, gather the parameters of nested layers into one flat list, write an optimiser that clears gradients and applies the update to the data outside the graph, add momentum to it, and put the four lines of a training step in an order that works.
recalls: [e6.gradient-checking]
uses: [e6.broadcasting-in-the-backward-pass, e6.tensor-valued-autograd, e6.topological-ordering-of-the-graph, e6.reverse-mode-on-scalars, e5.random-number-generation, e5.broadcasting, e5.arrays-dtype-and-shape, e5.linear-algebra-routines, m12.gradient, m10.maxima-and-minima, e1.classes-and-objects, e1.special-methods-and-operator-overloading, e1.comprehensions-and-iterators, e0.loops, e0.functions]
leads: [e6.higher-order-gradients, e6.memory-planning-and-in-place-operations, e6.training-an-mlp-on-your-own-engine, e7.nn-module, e7.optimisers-and-schedulers, e7.anatomy-of-a-training-loop]
starter: |
  # Scratch space. A line fitted to four points with the tensor engine,
  # every chore done by hand. Watch the loss.
  import numpy as np


  def unbroadcast(grad, shape):
      while grad.ndim > len(shape):
          grad = grad.sum(axis=0)
      for axis, n in enumerate(shape):
          if n == 1 and grad.shape[axis] != 1:
              grad = grad.sum(axis=axis, keepdims=True)
      return grad


  class Tensor:
      def __init__(self, data, parents=()):
          self.data = np.array(data) * 1.0
          self.parents = parents
          self.grad = np.zeros(self.data.shape)

      def __add__(self, other):
          return Tensor(self.data + other.data, (
              (self, lambda g: unbroadcast(g, self.data.shape)),
              (other, lambda g: unbroadcast(g, other.data.shape)),
          ))

      def __sub__(self, other):
          return Tensor(self.data - other.data, (
              (self, lambda g: unbroadcast(g, self.data.shape)),
              (other, lambda g: unbroadcast(-g, other.data.shape)),
          ))

      def __mul__(self, other):
          return Tensor(self.data * other.data, (
              (self, lambda g: unbroadcast(g * other.data, self.data.shape)),
              (other, lambda g: unbroadcast(g * self.data, other.data.shape)),
          ))

      def __matmul__(self, other):
          return Tensor(self.data @ other.data, (
              (self, lambda g: g @ other.data.T),
              (other, lambda g: self.data.T @ g),
          ))

      def tanh(self):
          t = np.tanh(self.data)
          return Tensor(t, ((self, lambda g: g * (1 - t * t)),))

      def sum(self):
          return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


  def topological(node):
      order = []
      seen = set()

      def visit(v):
          if v in seen:
              return
          seen.add(v)
          for parent, pull in v.parents:
              visit(parent)
          order.append(v)

      visit(node)
      return order


  def backward(node):
      node.grad = np.ones(node.data.shape)
      for v in topological(node)[::-1]:
          for parent, pull in v.parents:
              parent.grad = parent.grad + pull(v.grad)


  X = Tensor([[0], [1], [2], [3]])
  y = Tensor([[1], [3], [4], [6]])
  w = Tensor([[0.0]])
  b = Tensor([[0.0]])

  for step in range(41):
      d = X @ w + b - y
      L = (d * d).sum()
      if step % 10 == 0:
          print(step, round(float(L.data), 4))
      backward(L)
      w.data = w.data - 0.02 * w.grad
      b.data = b.data - 0.02 * b.grad
parts:
  recall:
    - text: |
        [[e6.gradient-checking]] gave the engine a test that a wrong gradient cannot pass. Every gradient in today's lesson is correct. What goes wrong is everything around the gradient. Three quick pulls first.
  puzzle:
    - text: |
        The starter fits a line $wx + b$ to four points by gradient descent on the sum of squared errors, using the tensor engine. The engine has been checked. Its gradients are right.

        Run it.

        ```
        0 62.0
        10 53.9309
        20 0.3371
        30 48.2069
        40 66.255
        ```

        The loss drops almost to its floor, which for these points is 0.2, and then climbs back above where it started. Run it for longer and it keeps swinging, down and up, for ever.

        A learning rate that is too large makes a loss blow up, but it does not make it swing slowly like this, and 0.02 is not too large here. With one more pair of lines in the loop the same rate gives

        ```
        0 62.0
        10 0.2452
        20 0.2171
        30 0.2064
        40 0.2024
        ```

        **Which lines are missing? And when a model has not two parameters but twenty arrays of them, in layers inside layers, how do you make sure that no such line is ever forgotten for any of them?**
  intuition:
    - text: |
        The missing lines clear the gradients. Recall how `backward` hands out shares: `parent.grad = parent.grad + pull(v.grad)`. It **adds**. It has to, because a value used in two places collects a share from each. But nothing ever sets a gradient back to zero, so the second backward pass adds its shares on top of the first's, and the third on top of both. By step 10 the "gradient" of $w$ is the sum of ten gradients from ten different places. The loop was not doing gradient descent at all. It was rolling a ball with no friction, which gathers speed downhill, overshoots the bottom and climbs the far side.

        The fix is two lines before `backward(L)`:

        ```python
        w.grad = np.zeros(w.data.shape)
        b.grad = np.zeros(b.data.shape)
        ```

        Now count what the loop does by hand for each parameter. It must be **created**, with the right shape and a sensible starting value. Its gradient must be **cleared** before each backward pass. And it must be **updated** after each one. Three chores for each parameter, and each is a line that names the parameter. With two parameters that is six lines. A small network with three layers has six arrays and eighteen such lines, and leaving one out raises no error. A forgotten update leaves a bias frozen at zero for the whole run. A forgotten clearing does what you have just watched.

        The cure is the usual one for repeated code that must not be forgotten. **Stop naming the parameters one by one. Put them in a list, and loop.** That needs two kinds of object.

        - A **module** is a piece of a model that owns its parameters and can hand over a list of them. A layer is a module. A model made of layers is a module too, and its list is its layers' lists joined end to end.
        - An **optimiser** is given that list once. It knows how to clear every gradient and how to update every parameter.

        The engine stays as it is. It knows about tensors, operations and pulls, and nothing about layers or learning rates. The training loop shrinks to four lines that never mention a parameter by name:

        ```python
        L = loss(model(X), y)
        opt.zero_grad()
        backward(L)
        opt.step()
        ```

        A **parameter**, in this picture, is nothing more than a tensor that the model owns and the optimiser changes. `X` and `y` are tensors as well, and the engine computes gradients for them just the same, but nobody puts them in the list, so nobody updates them. Being in the list is the whole distinction.
  derivation:
    - text: |
        **A layer.** The affine map $XW + \mathbf{b}$ is the workhorse. As a module it creates its two parameters, applies them when called, and lists them.

        ```python
        class Linear:
            def __init__(self, n_in, n_out, rng):
                self.weight = Tensor(rng.normal(size=(n_in, n_out)) / np.sqrt(n_in))
                self.bias = Tensor(np.zeros((1, n_out)))

            def __call__(self, x):
                return x @ self.weight + self.bias

            def parameters(self):
                return [self.weight, self.bias]
        ```

        `__call__` lets the layer be used like a function, `layer(x)`. The input has one example per row, so $X$ is $m \times n_\text{in}$, the weight is $n_\text{in} \times n_\text{out}$, and the bias, of shape $1 \times n_\text{out}$, broadcasts down the rows. The backward pass un-broadcasts it, as two lessons ago.

        The starting values matter. The bias starts at zero. The weights must not: if every weight in a layer were equal, every unit of the layer would compute the same thing, receive the same gradient and stay equal for ever. Random values break the tie. Dividing by $\sqrt{n_\text{in}}$ keeps the outputs about the size of the inputs however wide the layer is, since a sum of $n_\text{in}$ random terms grows like $\sqrt{n_\text{in}}$.

        **`parameters` returns the tensors themselves.** Not copies and not their arrays. The optimiser will write to these very objects, and the next forward pass must read what it wrote.

        **A model of layers.** A multi-layer perceptron is a chain of layers with a squashing function between them.

        ```python
        class MLP:
            def __init__(self, sizes, rng):
                self.layers = [Linear(a, b, rng) for a, b in zip(sizes, sizes[1:])]

            def __call__(self, x):
                for layer in self.layers[:-1]:
                    x = layer(x).tanh()
                return self.layers[-1](x)

            def parameters(self):
                return [p for layer in self.layers for p in layer.parameters()]
        ```

        `MLP([3, 4, 2], rng)` has a layer from 3 inputs to 4 units and one from 4 units to 2 outputs. Its `parameters` asks each layer for its list and joins them: four tensors, holding $3 \times 4 + 4 + 4 \times 2 + 2 = 26$ numbers. The model does not know what a layer keeps inside, only that it can be asked. A module made of modules made of modules works the same way, each level asking the one below. This is the recursion of a tree, and it is all there is to the "module system" of a large framework.
    - question:
        id: derivation-count
        type: numeric
        system: s2
        prompt: |
          `MLP([2, 8, 8, 1], rng)` is built from `Linear` layers as above. How many numbers does it have to learn in total, counting every entry of every weight and bias?
        answer: "105"
        explanation: |
          Three layers. From 2 to 8: $2 \times 8 = 16$ weights and 8 biases, 24. From 8 to 8: 64 and 8, 72. From 8 to 1: 8 and 1, 9. In all $24 + 72 + 9 = 105$, held in six tensors. `parameters()` returns a list of length 6, and the count of numbers is the sum of their sizes.
    - text: |
        **The optimiser.** It is given the list once and keeps it.

        ```python
        class SGD:
            def __init__(self, params, lr):
                self.params = params
                self.lr = lr

            def zero_grad(self):
                for p in self.params:
                    p.grad = np.zeros(p.data.shape)

            def step(self):
                for p in self.params:
                    p.data = p.data - self.lr * p.grad
        ```

        The name stands for stochastic gradient descent, the rule $\theta \leftarrow \theta - \eta \, \nabla_\theta L$ applied to every parameter $\theta$, with learning rate $\eta$. On the line fit, from $w = 0$, $b = 0$, the first gradients are $-58$ and $-28$, and one step at $\eta = 0.02$ gives $w = 1.16$, $b = 0.56$.

        **The update writes to `p.data`, outside the graph.** It is tempting to write `p = p - lr * p.grad` with tensors, and it fails twice over. First, that line makes a new tensor and binds the local name `p` to it. The model's layer still holds the old one, and nothing has changed. Second, even if the new tensor were put back into the layer, it would carry parents: this step's parameter would be a node computed from last step's, which was computed from the one before. The graph would grow by a link every step, and each backward pass would walk the whole history of training. The update is not part of the function being differentiated. It is something done **to** the leaves between one graph and the next.

        **The order of a step.** Forward, clear, backward, update. The clearing may go anywhere after the previous update and before the backward pass. Two orders are fatal and silent: clearing between the backward pass and the update, which hands the update a gradient of zero, and updating before the backward pass, which uses the gradient of the previous step, or of none.

        **Momentum.** The puzzle's accident, tamed, is useful. Keep for each parameter a **velocity** $v$, a running blend of past gradients, and move along that:

        $$v \leftarrow \mu v + \nabla_\theta L, \qquad \theta \leftarrow \theta - \eta v.$$

        With $\mu = 0$ this is plain descent. With $\mu = 1$ it is the frictionless ball of the puzzle, which never settles. In between, usually $\mu = 0.9$, old gradients fade by a factor of $\mu$ each step. Along a direction where successive gradients agree the velocity builds up to $1/(1 - \mu)$ times one gradient, and where they alternate in sign they cancel. On the line fit, 40 steps at $\eta = 0.02$ reach a loss of 0.2024 with no momentum and 0.2000 with $\mu = 0.5$.

        The velocity is **state that belongs to the optimiser**, one array for each parameter, of the same shape. That is the second reason the optimiser is an object and not a function: it remembers.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put the lines of one training step in an order that works.
        steps:
          - 'Run the model on the inputs and compute the loss, which builds a new graph.'
          - 'Set the gradient of every parameter to zero.'
          - 'Run the backward pass from the loss.'
          - 'Let the optimiser update every parameter from its gradient.'
        explanation: The gradients must be clear when the backward pass starts adding to them, and they must still hold its result when the update reads them. Clearing first of all, before the forward pass, would work equally well. Clearing between the backward pass and the update leaves the update nothing to use.
  formal:
    - text: |
        **Parameter.** A leaf tensor of the graph that the model owns and an optimiser updates.

        **Module.** An object with a method `parameters()` returning a list of its parameters, the same objects on every call. For a module composed of sub-modules, the list is the concatenation of theirs.

        **Linear layer.** For input $X \in \mathbb{R}^{m \times n_\text{in}}$, weight $W \in \mathbb{R}^{n_\text{in} \times n_\text{out}}$ and bias $\mathbf{b} \in \mathbb{R}^{1 \times n_\text{out}}$, the output is $XW + \mathbf{b}$, with $n_\text{in} n_\text{out} + n_\text{out}$ parameters.

        **Gradient descent with momentum.** With learning rate $\eta > 0$ and momentum $0 \le \mu < 1$, for each parameter $\theta$ with velocity $v$, initially zero:

        $$v_{t+1} = \mu v_t + \nabla_\theta L(\theta_t), \qquad \theta_{t+1} = \theta_t - \eta \, v_{t+1}.$$

        The update is applied to the stored values and is not recorded in the graph.

        **Training step.** Forward pass, zero the gradients, backward pass, optimiser step.
  drill:
    - text: |
        Seconds each.
    - question:
        id: drill-accumulate
        type: choice
        system: s1
        prompt: |
          Why does the engine's backward pass add to `grad` and not overwrite it?
        options: ['To save memory', 'A value used in several places must collect a share from each use', 'Because addition is faster than assignment', 'So that training has momentum']
        answer: 1
        explanation: The gradient of a value is the sum over every path from it to the output.
    - question:
        id: drill-forgot
        type: choice
        system: s1
        prompt: |
          What happens if the gradients are never cleared between training steps?
        options: ['An error is raised', 'Each step uses the sum of all gradients so far', 'The gradients stay at zero', 'Nothing, clearing is optional']
        answer: 1
        explanation: Every backward pass adds its shares to what is already there.
    - question:
