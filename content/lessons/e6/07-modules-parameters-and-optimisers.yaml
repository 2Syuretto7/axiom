        type: choice
        system: s1
        prompt: |
          In this lesson's design, what makes a tensor a parameter?
        options: ['It has a gradient', 'It is in the list that the model hands to the optimiser', 'It is a matrix', 'It was made with random numbers']
        answer: 1
        explanation: The engine gives every tensor a gradient. Only those in the list are updated.
