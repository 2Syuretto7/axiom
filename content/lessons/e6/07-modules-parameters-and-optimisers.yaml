        explanation: |
          The layer's output is built from tensor operations, so the graph reaches back through the sum and the product to the weight and the bias. Its list holds those two objects. The model's list is a comprehension with two loops, over layers and then over each layer's list, which flattens as it goes.

          Each wrong version is a bug that real training code has had. Leaving the bias out of the forward line gives a model that runs and has a parameter that never receives a gradient. Returning fresh tensors made from the same arrays gives the optimiser strangers to update: their gradients are zero and the layer never hears of them. Returning only the last layer's list trains the last layer on top of a first layer frozen at its random start, which often still lowers the loss, and so goes unnoticed. A list of lists is not a list of tensors. And computing the output from the raw arrays gives the right numbers with no parents, so no gradient flows at all.
