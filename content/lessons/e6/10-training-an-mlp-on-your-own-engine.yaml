    - text: |
        One linear layer, trained without a fault, answered 0.5 to every row of exclusive-or and stopped at a loss of 1.0. **An optimiser finds the best the model can represent, and a model with no non-linearity can represent only linear functions**, however many layers it has. With a $\tanh$ between two layers, four hidden units and 17 parameters, the same loop reached a loss of zero.

        To bring up a model: **count** its parameters, **check** its gradients as a whole against measured slopes, **fit** a few rows to nearly zero, and **look** at the predictions. To read a failure: frozen means not updated, swinging means not cleared, exploding means the rate is too large, settling at a simpler model's level means the model has become that simpler model, settling on some seeds only means an unlucky start, and falling proves nothing about the gradient.

        That closes the cluster. You began with a single line of arithmetic and the wish to know how its answer depends on its inputs. You have built a graph that records scalars, a backward pass over it, the ordering that makes that pass correct, tensors with their pulls, broadcasting undone, a numerical test of all of it, modules and an optimiser around it, gradients of gradients, and an account of its memory. Then you trained a network with it.

        Every deep-learning framework is this engine, with more operations, compiled kernels, and devices other than the processor. When you meet one, nothing about it need be taken on faith: `backward()`, `zero_grad()`, `step()` and the error raised when a saved tensor is modified in place are all things you have written.

        Before that, there is a question this cluster kept walking past. The line fitted in the lesson on optimisers took 40 steps of gradient descent to bring its loss to 0.2024, on its way to a floor of 0.2. For that kind of problem the floor can be reached exactly, in one step, with no learning rate at all, and the reason is a right angle. That is the next cluster, and it begins with [[m7.orthogonal-subspaces]].
