        prompt: |
          An engine's $\tanh$ has the wrong pull, $g(1 - t)$ in place of $g(1 - t^2)$. On exclusive-or, `MLP([2, 4, 1])` still trains from a loss of 2.84 to 0.0000 in 300 steps. A whole-model gradient check reports a relative error of 0.14. What should you conclude?
        options:
          - 'The check is too strict. The model learnt, so the gradient is good enough.'
          - 'The engine is wrong and must be fixed. The wrong pull has the right sign, since $1 - t$ and $1 - t^2$ are both positive, so the steps were still roughly downhill, which was enough for four rows. On a harder problem the same engine would learn more slowly or settle somewhere worse, and nothing in its loss curve would say why.'
          - 'The check must be at fault, because training succeeded.'
          - 'Exclusive-or does not depend on $\tanh$.'
        answer: 1
        explanation: |
          This is the opening puzzle of the lesson on gradient checking, met again at full scale. A direction within a right angle of the true gradient lowers the loss for a small enough step, so success in training is very weak evidence about the gradient. The relative error of 0.14 is five orders of magnitude from the $10^{-7}$ that separates right from wrong, and no amount of numerical noise produces that. The check and the training run are answering different questions, and only the check's question is "is the engine correct?".
    - question:
        id: work-seeds
        type: choice
        system: s2
        prompt: |
          `MLP([2, 2, 1])` is trained on exclusive-or from five different random starts, with correct gradients and a sensible rate. Two runs reach a loss of 0.0000. Three settle at 0.5 or 0.67, and stay there. A solution with two hidden units is known to exist. What explains the three, and what is the practical remedy?
        options:
          - 'The gradients are wrong on those three seeds.'
          - 'The loss of a network has more than one resting place. From some starts, gradient descent reaches a point where the gradient is zero and the loss is not the least possible, and it stops there. Using more hidden units than the bare minimum, four here, gives the model spare ways down, and every start tried then reaches zero.'
          - 'Two hidden units cannot represent exclusive-or.'
          - 'The learning rate must be made much larger.'
        answer: 1
        explanation: |
          Gradient descent follows the slope from where it starts and stops where the slope vanishes. For the linear model there was one such place, and it was the best available. For a network there are several, and some are poor. A model with exactly as many units as a solution needs must find that solution from every start. A wider model has many arrangements of its units that work, and far fewer starts from which none is reachable. This is one of the reasons networks in practice are much larger than the smallest that could represent their target, and it is why a result should be checked across a few seeds before it is believed.
