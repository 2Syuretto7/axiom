        explanation: |
          Clear, run one backward pass, and then for each parameter measure the loss's slopes with respect to its array and compare. The function `f` ignores its argument, since `numeric_grad` has already written the nudge into `p.data`, the array that the model's forward pass reads. That in-place write is safe by the rule of the last lesson: no backward pass is pending on the graphs that `f` builds.

          The **largest** error is the verdict, because one wrong parameter is a wrong model. Taking the smallest, or checking only the first parameter, passes an engine that mishandles biases alone, and the tests include exactly that engine. Comparing a gradient with itself reports a perfect 0, which is why the test also refuses an error of exactly zero. And an `f` that returns a loss computed once reports slopes of zero everywhere.

          This is the function to run on every new model, and after every change to the engine. It takes a moment, and it is the only thing that tells a correct engine from one that merely trains.
