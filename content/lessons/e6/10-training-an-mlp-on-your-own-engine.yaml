        answer: "37"
        explanation: |
          From 2 to 4: 8 weights and 4 biases, 12. From 4 to 4: 16 and 4, 20. From 4 to 1: 4 and 1, 5. In all 37, in six tensors. The middle layer, whose input and output are both hidden, holds more than half of them: the count of weights between two layers is the product of their widths, so widening a network makes it grow much faster than deepening it.
    - question:
        id: work-rate
        type: choice
        system: s2
        prompt: |
          With learning rate 1.0 and no momentum, the loss of `MLP([2, 4, 1])` on exclusive-or goes 2.84, 106.59, 47,311, 5,979,288. With rate 0.1 it falls smoothly. The gradients are identical in the two runs at step 0. Why does the larger rate fail?
        options:
          - 'A larger rate makes the gradient wrong.'
          - 'The gradient gives the slope at the current point, and that slope holds only nearby. A step of 1.0 times the gradient lands far beyond where the linear picture is valid, on the other side of the valley and higher up, where the gradient is larger still. The next step overshoots by more.'
          - 'The optimiser subtracts when it should add.'
          - 'Momentum is required for any rate above 0.5.'
        answer: 1
        explanation: |
          A gradient is the best linear approximation, and a linear approximation is trustworthy only for small moves. The learning rate is the statement of how far you are willing to trust it. Too small and training crawls. Too large and each step lands somewhere worse, with a steeper slope, so the error feeds itself and the loss grows geometrically until the numbers overflow to `inf` and then `nan`. The engine is blameless throughout: it reports the slope accurately at every one of those absurd points.
