          import numpy as np


          def unbroadcast(grad, shape):
              while grad.ndim > len(shape):
                  grad = grad.sum(axis=0)
              for axis, n in enumerate(shape):
                  if n == 1 and grad.shape[axis] != 1:
                      grad = grad.sum(axis=axis, keepdims=True)
              return grad


          class Tensor:
              def __init__(self, data, parents=()):
                  self.data = np.array(data) * 1.0
                  self.parents = parents
                  self.grad = np.zeros(self.data.shape)

              def __add__(self, other):
                  return Tensor(self.data + other.data, (
                      (self, lambda g: unbroadcast(g, self.data.shape)),
                      (other, lambda g: unbroadcast(g, other.data.shape)),
                  ))

              def __sub__(self, other):
                  return Tensor(self.data - other.data, (
                      (self, lambda g: unbroadcast(g, self.data.shape)),
                      (other, lambda g: unbroadcast(-g, other.data.shape)),
                  ))

              def __mul__(self, other):
                  return Tensor(self.data * other.data, (
                      (self, lambda g: unbroadcast(g * other.data, self.data.shape)),
                      (other, lambda g: unbroadcast(g * self.data, other.data.shape)),
                  ))

              def __matmul__(self, other):
                  return Tensor(self.data @ other.data, (
                      (self, lambda g: g @ other.data.T),
                      (other, lambda g: self.data.T @ g),
                  ))

              def tanh(self):
                  t = np.tanh(self.data)
                  return Tensor(t, ((self, lambda g: g * (1 - t * t)),))

              def sum(self):
                  return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


          def topological(node):
              order = []
              seen = set()

              def visit(v):
                  if v in seen:
                      return
                  seen.add(v)
                  for parent, pull in v.parents:
                      visit(parent)
                  order.append(v)

              visit(node)
              return order


          def backward(node):
              node.grad = np.ones(node.data.shape)
              for v in topological(node)[::-1]:
                  for parent, pull in v.parents:
                      parent.grad = parent.grad + pull(v.grad)


