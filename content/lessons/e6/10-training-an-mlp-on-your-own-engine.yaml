          The forward pass applied the layers one after another with nothing between them. Two linear layers are one linear layer, so this model, for all its 17 parameters, was the puzzle's model, and its loss stopped at the puzzle's floor of 1.0.

          The fix is the $\tanh$ after every layer but the last. A $\tanh$ after the last as well confines the output between $-1$ and 1. A $\tanh$ on the last layer only, or on the inputs only, leaves a model that is one squashing of one linear map, which is no better at exclusive-or. Squashing only the first hidden layer is right for this model and wrong for a deeper one, whose later layers would collapse together.

