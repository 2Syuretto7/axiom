concept: e6.reverse-mode-on-scalars
minutes: 85
claim: You can say what the gradient stored on a node of a computational graph means, pass gradients backwards from the output so that each value adds up a contribution from every place it was used, write that backward pass for scalars and use it to get the derivative with respect to every input in one sweep, explain why contributions are added and why old gradients must be cleared, and choose between forward and reverse mode from the numbers of inputs and outputs.
recalls: [e6.scalar-computational-graph]
uses: [m12.multivariable-chain-rule, m12.gradient, m12.partial-derivatives, m10.differentiation-rules, m10.chain-rule, m10.derivatives-of-exp-log-and-trig, m10.maxima-and-minima, e1.classes-and-objects, e1.special-methods-and-operator-overloading, e1.recursion, e1.comprehensions-and-iterators, e3.graphs-and-traversal, e0.functions, e0.loops]
leads: [e6.topological-ordering-of-the-graph, e6.tensor-valued-autograd, e6.gradient-checking, e7.autograd-in-pytorch]
starter: |
  # Scratch space. The squared error again, differentiated by walking paths,
  # with a count of how many times the walker is called.
  class Value:
      def __init__(self, data, parents=()):
          self.data = data
          self.parents = parents

      def __add__(self, other):
          return Value(self.data + other.data, ((self, 1.0), (other, 1.0)))

      def __sub__(self, other):
          return Value(self.data - other.data, ((self, 1.0), (other, -1.0)))

      def __mul__(self, other):
          return Value(self.data * other.data, ((self, other.data), (other, self.data)))


  calls = [0]


  def path_sum(node, target):
      calls[0] += 1
      if node is target:
          return 1.0
      return sum(local * path_sum(parent, target) for parent, local in node.parents)


  w, x, b, y = Value(3.0), Value(2.0), Value(1.0), Value(5.0)
  e = w * x + b - y
  L = e * e
  print([path_sum(L, leaf) for leaf in [w, x, b, y]])
  print(calls[0])
parts:
  recall:
    - text: |
        [[e6.scalar-computational-graph]] made arithmetic leave a trail: each `Value` remembers its parents and the local derivative for each, and a derivative is the sum over paths of the product of the local derivatives. It ended with a complaint, that the walk had to be done again for every input. Today the walk is turned round. Three quick pulls first.
  puzzle:
    - text: |
        The starter is the last lesson's squared error, $L = (wx + b - y)^2$ at $w = 3$, $x = 2$, $b = 1$, $y = 5$, with one addition: a counter of how many times `path_sum` is called. It asks for the derivative of $L$ with respect to each of the four inputs.

        Run it. The derivatives are `[8.0, 12.0, 4.0, -4.0]`, as before. The count is `60`.

        Sixty calls for a graph with eight nodes. Each of the four questions set off its own walk of 15 calls, and the four walks were nearly the same walk. Every one of them began at `L`, went down both arrows to `e`, and multiplied by 2. Every one of them then went on to `q` and `y`. The products along the top of the graph were worked out four times over and thrown away four times.

        With four inputs that is a nuisance. A network has a million weights, each one an input to the loss, and a million walks is no better than the million and one runs of the formula that the graph was supposed to save.

        Look at where the waste is. All the paths, for all the inputs, **end** at `L`. They differ only in where they start. Walking from `L`, the first steps are the same whatever input you are asking about.

        **Can one walk, started at the output, deliver all four derivatives? What would each value in the graph have to collect as the walk passes through it? And when a value was used in two places, what should it do with the two things it is handed?**
  intuition:
    - text: |
        The last lesson asked, of every node in turn: how does this node respond to $w$? That question has an input fixed in it, so it must be asked again for each input.

        Ask a different question of each node: **how does the output respond to this node?** For a node $v$, that is $\dfrac{\partial L}{\partial v}$. There is one output, so the question is asked once, and the answers for the four leaves are exactly the four derivatives wanted. The answers for the nodes in between are not wasted either. They are the shared beginnings of the paths, worked out once.

        Give each `Value` a place to keep its answer, an attribute called `grad`. From now on, **`v.grad` means the rate at which the output changes when `v` changes.** It is called the gradient of the node, since for the leaves these numbers are the components of $\nabla L$.

        Start at the end, where the answer is known without any work. How does $L$ respond to $L$? At the rate 1. So `L.grad` is 1.

        Now step back along one arrow. `L = e * e`, and the arrow from `e` carries the local derivative 2. If $L$ responds to itself at the rate 1, and $L$ responds to `e` along this arrow at the rate 2, then this arrow tells `e`: the output responds to you at $1 \times 2$. But there is a second arrow from `e` to `L`, and it says the same. `e` was used twice, the output responds to it through both uses, and **the two responses add**. So `e.grad` is $2 + 2 = 4$.

        Step back again. `e = q - y`, with local derivatives 1 and $-1$. The output responds to `e` at the rate 4, so it responds to `q` at $4 \times 1 = 4$ and to `y` at $4 \times (-1) = -4$. Each of those was used once only, so that is their whole gradient.

        Carry on to the leaves. The figure does it one node at a time.
    - figure: trail-graph
      props: { step: 5 }
    - text: |
        One rule did all of it. **A node that knows its own gradient hands each parent that gradient times the local derivative on the arrow between them. A parent adds up everything it is handed.**

        Read it as a conversation. Each node says to each of its parents: "The output cares about me this much. I care about you this much. So through me, the output cares about you by the product." A parent that fed several later computations hears from each of them, and its gradient is the total.

        That is the chain rule again, the same multiplying along paths and adding over paths. What has changed is the order of the work. `path_sum` followed each path separately from one end to the other. Here the product along the shared part of many paths is held in one place, the `grad` of the node where they part, and is used for all of them.

        In the program it is a few lines.

        ```python
        class Value:
            def __init__(self, data, parents=()):
                self.data = data
                self.parents = parents
                self.grad = 0.0

            def __add__(self, other):
                return Value(self.data + other.data, ((self, 1.0), (other, 1.0)))

            def __sub__(self, other):
                return Value(self.data - other.data, ((self, 1.0), (other, -1.0)))

            def __mul__(self, other):
                return Value(self.data * other.data, ((self, other.data), (other, self.data)))


        def backward(node, upstream=1.0):
            node.grad += upstream
            for parent, local in node.parents:
                backward(parent, upstream * local)


        w, x, b, y = Value(3.0), Value(2.0), Value(1.0), Value(5.0)
        e = w * x + b - y
        L = e * e
        backward(L)
        print(w.grad, x.grad, b.grad, y.grad)
        ```

        That prints `8.0 12.0 4.0 -4.0`. One call, and every input has its derivative. The intermediate nodes have theirs too: `e.grad` is 4.0.

        Every gradient starts at 0. `backward(L)` adds 1 to `L.grad` and then, for each parent, calls itself with what that parent is owed by this route: the amount arriving, times the local derivative. Each node adds what arrives to what it already has. Because the walk begins at the output, this way of differentiating is called **reverse mode**, and when the graph is a neural network it is called **backpropagation**.
  derivation:
    - text: |
        **The quantity.** Fix one output node $L$. For every node $v$ define its **gradient**, or **adjoint**,

        $$\bar v = \frac{\partial L}{\partial v},$$

        the rate at which $L$ responds to a change in $v$ with the values computed before $v$ held fixed and everything computed from $v$ allowed to follow. The program's `v.grad` is $\bar v$.

        **The rule.** $\bar L = 1$. For any other node $u$, let the **uses** of $u$ be the edges that leave it, one for each time $u$ was an operand. Then

        $$\bar u = \sum_{\text{uses } u \to v} \bar v \cdot \frac{\partial v}{\partial u},$$

        where $\dfrac{\partial v}{\partial u}$ is the local derivative on that edge.

        *Why.* A change in $u$ can reach $L$ only through the values computed directly from $u$. That is the situation of the multivariable chain rule, with the uses of $u$ as the intermediate variables: $\dfrac{\partial L}{\partial u} = \sum_v \dfrac{\partial L}{\partial v}\dfrac{\partial v}{\partial u}$. If $u$ is used twice in one operation, as in $e \times e$, both edges appear in the sum. $\blacksquare$

        Compare this with the rule of the last lesson, which summed over the **parents** of a node. This one sums over the **uses**. The graph stores parents, not uses, and that is why the program is written as a push: no node goes looking for its uses. Each use, when its turn comes, delivers its term to the parent, and `+=` builds the sum.

        **Why add.** It is the commonest slip in a first engine to write `node.grad = upstream`. On a graph where every value is used once, that is right. On `e * e` it leaves `e.grad` at 2, the contribution of whichever arrow came last, and every gradient below `e` is then half what it should be. Nothing crashes. The numbers are simply wrong.
    - question:
        id: derivation-add
        type: choice
        system: s2
        prompt: An engine's backward pass writes `node.grad = upstream` in place of `node.grad += upstream`. For which of these does it still give the right gradient for `a`?
        options:
          - '`a * a`'
          - '`a * b + c`, with `a`, `b` and `c` different leaves'
          - '`a * b + a`'
          - '`(a + b) * (a + c)`'
        answer: 1
        explanation: |
          In `a * b + c` every value is used exactly once, so each node receives one contribution and it does not matter whether it is added or stored. In each of the others `a` is used twice, by one operation or by two, and receives two contributions. Storing keeps only the last. Since nearly every real computation uses some value twice (a weight applied to every data point, an activation feeding many units of the next layer), an engine with this slip is wrong almost always, and right on exactly the tiny cases a hurried test would try.
    - text: |
        **The order of the walk.** Follow `backward(L)` on a smaller graph, `q = w * x + b` with $w = 3$, $x = 2$, $b = 1$. The call adds 1 to `q.grad`, then goes to its first parent, the product, with $1 \times 1$. That call adds 1 to the product's gradient and goes to `w` with $1 \times 2$, then to `x` with $1 \times 3$. Only then does the first call move on to its second parent, `b`, with $1 \times 1$. The walk goes as deep as it can before turning aside, the depth-first order of the lessons on graphs.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: With `q = w * x + b` and $w = 3$, $x = 2$, $b = 1$, put in order what `backward(q)` does.
        steps:
          - '`q.grad` becomes 1.0.'
          - 'The gradient of the product `w * x` becomes 1.0.'
          - '`w.grad` becomes 2.0.'
          - '`x.grad` becomes 3.0.'
          - '`b.grad` becomes 1.0.'
        explanation: The output is seeded with 1. Its first parent is the product, which receives 1 times the local derivative 1, and at once passes on to its own parents, w receiving 1 times 2 and x receiving 1 times 3. Only when that call has returned does the first call reach its second parent, b.
    - text: |
        **Old gradients.** `backward` adds to whatever is in `grad`. If the gradients are not zero when it starts, the old values are still in the sum. Call `backward(L)` twice and every gradient is doubled. Build a second expression from the same leaves and call `backward` on it, and each leaf ends with the sum of the two gradients. So **before each backward pass, the gradients of the values that will be reused are set back to zero.** In a training loop the leaves are the weights, they live from one step to the next, and forgetting to clear them is a classic bug: the engine is correct and the descent goes wrong.

        **New operations.** Any function with a known derivative can be an operation. It makes one node, with one parent and one local derivative:

        ```python
        import math


        class Value:
            def __init__(self, data, parents=()):
                self.data = data
                self.parents = parents
                self.grad = 0.0

            def tanh(self):
                t = math.tanh(self.data)
                return Value(t, ((self, 1 - t * t),))


        z = Value(0.0)
        a = z.tanh()
        print(a.data, a.parents[0][1])
        ```

        That prints `0.0 1.0`. The derivative of $\tanh$ is $1 - \tanh^2$, which is conveniently written in terms of the output, already computed. Note the comma in `((self, 1 - t * t),)`: the parents are a tuple containing one pair.

        With `tanh` the engine can do the neuron from the lesson on the chain rule, $z = wx + b$, $a = \tanh z$, $L = (a - y)^2$ at $w = 0.5$, $x = 2$, $b = -1$, $y = 1$. There the gradient was found by hand, working backwards from the output, to be $\dfrac{\partial L}{\partial w} = -4$ and $\dfrac{\partial L}{\partial b} = -2$. `backward` gives the same, and it is doing the same steps in the same order.

        **Two modes.** You have met the opposite way of organising the chain rule. In the lesson on differentiation rules a `Dual` number carried a value and a rate through a calculation. The rate was the derivative of each intermediate result **with respect to one chosen input**, and it travelled forwards with the values. That is **forward mode**. It needs no graph and no stored trail. But one pass answers for one input.

        | | forward mode | reverse mode |
        | --- | --- | --- |
        | carried through the graph | $\partial v / \partial x$ for one input $x$ | $\partial L / \partial v$ for one output $L$ |
        | direction | with the calculation | against it |
        | one pass gives | every output's derivative by one input | one output's derivative by every input |
        | passes for $n$ inputs, $m$ outputs | $n$ | $m$ |
        | must keep | nothing but the current values | the whole graph until the backward pass |

        Training a model means minimising **one** number, the loss, over a million inputs, the weights. That is $m = 1$ against $n = 10^6$, and reverse mode gets the whole gradient for about the cost of computing the loss a few times over. This is the reason for the whole cluster. The price is in the last row: nothing can be thrown away until the backward pass has used it, so the memory needed grows with the length of the calculation. A later lesson is about that price.

        **Still wasteful.** Count the calls. `backward(L)` on the squared error calls itself 15 times for 8 nodes, since it goes down both arrows from `e` and repeats everything below. That is a quarter of the starter's 60 and still more than it need be. The gradients are right, because each walk delivers its own path's product and `+=` adds them. But the walk is still tracing paths one by one, and the next lesson shows how badly that can go and how to visit each node once.
  formal:
    - text: |
        **Adjoint.** For a fixed scalar output $L$ of a computational graph, the adjoint of a node $v$ is $\bar v = \partial L / \partial v$.

        **Reverse accumulation.** $\bar L = 1$, and for every other node $u$,

        $$\bar u = \sum_{\text{edges } u \to v} \bar v \, \frac{\partial v}{\partial u}.$$

        The adjoints of the leaves are the components of the gradient of $L$ with respect to the inputs.

        **Forward accumulation.** For a fixed input $x$, the tangent of a node $v$ is $\dot v = \partial v / \partial x$, with $\dot x = 1$, the tangents of the other leaves 0, and $\dot v = \sum_{u \in \text{parents}(v)} \dfrac{\partial v}{\partial u}\,\dot u$.

        **Cost.** For $f : \mathbb{R}^n \to \mathbb{R}^m$, forward mode finds all the partial derivatives in $n$ passes and reverse mode in $m$, each pass costing a small constant multiple of one evaluation of $f$. Reverse mode must store every intermediate value that a local derivative depends on.
