    - question:
        id: work-by-hand
        type: numeric
        system: s2
        prompt: |
          $f = (a + b) \times (a \times b)$ at $a = 2$, $b = 3$. Work backwards from $f$: give the gradient 1 to $f$, find the gradients of $s = a + b$ and $t = a \times b$, and then the gradient of $b$. What is it?
        answer: "16"
        explanation: |
          $s = 5$ and $t = 6$. From $f = s \times t$: $\bar s = 1 \times t = 6$ and $\bar t = 1 \times s = 5$. Now $b$ has two uses. From $s$ it receives $6 \times 1 = 6$. From $t$ it receives $5 \times a = 10$. So $\bar b = 16$. In the same sweep $\bar a = 6 \times 1 + 5 \times 3 = 21$. Check: $f = a^2 b + ab^2$, so $\partial f / \partial b = a^2 + 2ab = 4 + 12 = 16$. Notice that $\bar s$ and $\bar t$ were each computed once and used for both inputs.
    - question:
        id: work-mode
        type: choice
        system: s2
        prompt: |
          A simulation takes 3 design settings and produces 1,000 measurements. You want the derivative of every measurement with respect to every setting. Which mode, and why?
        options:
          - 'Reverse mode, because it is always the faster of the two.'
          - 'Forward mode. One forward pass carries the derivatives of everything with respect to one input, so 3 passes give the whole table. Reverse mode would need a pass for each of the 1,000 outputs.'
          - 'Reverse mode, because there are more outputs than inputs.'
          - 'Neither can do it. Numerical differences are the only way.'
        answer: 1
        explanation: |
          The count of passes is the number of inputs for forward mode and the number of outputs for reverse. Here that is 3 against 1,000. Reverse mode wins in machine learning because of the shape of that one problem, a single loss over very many weights, and not because it is better in general. Forward mode also needs no stored graph. When the numbers of inputs and outputs are both large, neither is cheap, and the full table of derivatives, the Jacobian, is usually not what is wanted anyway.
    - question:
        id: work-memory
        type: choice
        system: s2
        prompt: |
          A calculation runs for a million operations and ends in one number. In forward mode with dual numbers, each intermediate result can be discarded as soon as it has been used. Why can reverse mode not do the same?
        options:
          - 'It can. The backward pass needs only the final answer.'
          - 'The backward pass begins only when the forward calculation has finished, and it visits the operations in the opposite order. At each one it needs the local derivatives, which depend on the values that went into that operation. So every one of them must still exist, the earliest longest of all.'
          - 'Because Python never frees memory.'
          - 'Because gradients are larger numbers than values.'
        answer: 1
        explanation: |
          Forward mode differentiates each operation at the moment it happens, with the operands in hand, and then moves on. Reverse mode cannot know how the output responds to an early value until everything after it has been accounted for, so it must wait, and while it waits the whole trail stays in memory. The first operation's record is needed last. For a long calculation this is the real cost of reverse mode: time is about that of a few forward runs, but memory grows with the number of operations. Managing that is the subject of a later lesson of this cluster.
    - question:
        id: work-calls
        type: numeric
        system: s2
        prompt: |
          `a` is a leaf. Then `d = a + a`, `d = d + d`, `d = d + d`: three doublings, making three new nodes. Counting the first, how many times is `backward` called by `backward(d)`?
        answer: "15"
        explanation: |
          The top node is visited once. It has the node below as a parent twice, so that node is visited 2 times. Each of those visits goes down two arrows, so the next node is visited 4 times, and the leaf 8 times. $1 + 2 + 4 + 8 = 15$ calls for 4 nodes, and `a.grad` comes out as 8, correctly, built from eight separate deliveries of 1. Each further doubling doubles the count. Thirty doublings would be a graph of 31 nodes and over two thousand million calls. That is the subject of the next lesson.
  connections:
    - text: |
        Sixty calls found four derivatives by walking from the output once for each input. One walk does it, if each node keeps the right thing: **its gradient, the rate at which the output responds to it**. The output's gradient is 1. Each node hands every parent its gradient times the **local derivative** on the arrow, and a parent **adds** what it receives from every use. `backward(L)` left 8, 12, 4 and $-4$ on the four leaves in one sweep.

        This is **reverse mode**, and on a network it is backpropagation. One pass serves every input, which is why it is the method for a loss with a million weights. **Forward mode**, the dual numbers of an earlier lesson, serves one input per pass and every output. Reverse mode pays in memory, since the trail must be kept until the walk back.

        Gradients accumulate, so they must be cleared before a pass, or yesterday's gradient is added to today's.

        The walk still follows paths one at a time: 15 calls for 8 nodes, and for a value doubled thirty times, thousands of millions. A node ought to speak once, when it has heard from everyone who used it. Arranging the nodes so that this is possible is a problem you have already solved, in the lessons on algorithms, and it is the next lesson: [[e6.topological-ordering-of-the-graph]].
