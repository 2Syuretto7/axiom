                  self.data = data
                  self.parents = parents
                  self.grad = 0.0

              def __add__(self, other):
                  return Value(self.data + other.data, ((self, 1.0), (other, 1.0)))

              def __sub__(self, other):
                  return Value(self.data - other.data, ((self, 1.0), (other, -1.0)))

              def __mul__(self, other):
                  return Value(self.data * other.data, ((self, other.data), (other, self.data)))


          def topological(node):
              order = []
              seen = set()

              def visit(v):
                  if v in seen:
                      return
                  seen.add(v)
                  for parent, local in v.parents:
                      visit(parent)
                  order.append(v)

              visit(node)
              return order


          w, x, b, y = Value(3.0), Value(2.0), Value(1.0), Value(5.0)
          e = w * x + b - y
          L = e * e
          print([v.data for v in topological(L)])
        tests: |
          def _check(_node, _count, _what):
              _order = topological(_node)
              assert len(_order) == _count, _what + ": the order should hold " + str(_count) + " values, each once"
              assert len(set(_order)) == _count, _what + ": no value should appear twice"
              assert _order[-1] is _node, _what + ": the value asked about should come last"
              _place = {}
              for _i, _v in enumerate(_order):
                  _place[_v] = _i
              for _v in _order:
                  for _parent, _local in _v.parents:
                      assert _parent in _place and _place[_parent] < _place[_v], _what + ": every value should come after all of its parents"
          _w, _x, _b, _y = Value(3.0), Value(2.0), Value(1.0), Value(5.0)
          _e = _w * _x + _b - _y
          _L = _e * _e
          _check(_L, 8, "For the squared error")
          _a, _bb, _c = Value(2.0), Value(3.0), Value(1.0)
          _s = _a * _bb
          _t = _s + _c
          _check(_s * _t, 6, "For s * t with t = s + c")
          _check(_t * _s, 6, "For t * s with t = s + c")
          _d = Value(1.0)
          for _i in range(25):
