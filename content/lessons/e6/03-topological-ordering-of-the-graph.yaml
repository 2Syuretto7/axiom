concept: e6.topological-ordering-of-the-graph
minutes: 85
claim: You can show that passing gradients back along every path costs a number of steps that can double with each operation, state the condition under which a node may hand its gradient back once and for all, obtain an order that meets the condition by reversing a topological order of the computational graph, write the backward pass that visits each node once and costs one multiplication for each edge, and say why the order in which the values were created is itself such an order.
recalls: [e6.reverse-mode-on-scalars]
uses: [e6.scalar-computational-graph, e3.topological-sort, e3.graphs-and-traversal, e3.stacks-and-queues, e1.recursion, e1.complexity-and-big-o, e1.classes-and-objects, e1.special-methods-and-operator-overloading, e1.exceptions, m12.multivariable-chain-rule, e0.dictionaries-and-sets, e0.lists-and-tuples, e0.loops, e0.functions]
leads: [e6.tensor-valued-autograd, e6.memory-planning-and-in-place-operations, e6.training-an-mlp-on-your-own-engine, e7.autograd-in-pytorch]
starter: |
  # Scratch space. A value doubled n times, and the backward pass of the last
  # lesson with a counter on it.
  class Value:
      def __init__(self, data, parents=()):
          self.data = data
          self.parents = parents
          self.grad = 0.0

      def __add__(self, other):
          return Value(self.data + other.data, ((self, 1.0), (other, 1.0)))


  calls = [0]


  def backward(node, upstream=1.0):
      calls[0] += 1
      node.grad += upstream
      for parent, local in node.parents:
          backward(parent, upstream * local)


  for n in [5, 10, 15]:
      a = Value(1.0)
      d = a
      for i in range(n):
          d = d + d
      calls[0] = 0
      backward(d)
      print(n, a.grad, calls[0])
parts:
  recall:
    - text: |
        [[e6.reverse-mode-on-scalars]] gave every value a gradient, the rate at which the output responds to it, and filled the gradients in by a walk that starts at the output and hands each parent its share. The walk was correct and it retraced its steps. Today each value is visited once. Three quick pulls first.
  puzzle:
    - text: |
        The starter builds a very plain calculation. Take a value `a` and double it $n$ times: `d = a + a`, then `d = d + d`, and so on. After $n$ doublings there are $n + 1$ nodes, and the result is $2^n a$, so the gradient of `a` should be $2^n$.

        Run it. The gradients are right: 32, 1024, 32768. Now read the last column, the number of times `backward` was called.

        | doublings | nodes | calls |
        | --- | --- | --- |
        | 5 | 6 | 63 |
        | 10 | 11 | 2,047 |
        | 15 | 16 | 65,535 |

        Five more nodes, and the work grows by a factor of 32. At 30 doublings, a graph of 31 nodes, it would be over two thousand million calls. At 60, more calls than there have been seconds since the universe began.

        Nothing about the graph is large. Sixteen nodes and thirty arrows could be drawn on a postcard. And the answer at each node is one number. A person doing it by hand would write sixteen numbers and be done: 1 at the top, then 2, then 4, each node getting twice what the one above it has.

        **What is the walk doing 65,535 times that the person does 16 times? What would a node have to wait for, so that it need hand its gradient back only once? And how can a program work out, for any graph, an order of visiting in which every node has finished waiting when its turn comes?**
  intuition:
    - text: |
        The walk of the last lesson delivers gradients **one path at a time**. Each call carries the product of the local derivatives along a single route from the output, and adds it in where the route ends. In the doubled value every node has two arrows down to the next, so the number of routes doubles at each level: 2 routes to the second node, 4 to the third, $2^n$ to `a`. The 32,768 at the bottom was built from 32,768 separate deliveries of 1.

        The person with the pencil delivers **one node at a time**. They do not think about routes. They look at a node, see that its gradient is 4, and hand 4 down each of its two arrows. The node below receives $4 + 4 = 8$. Then they turn to that node, and it hands 8 down each of its arrows. Each node speaks once and each arrow is used once.

        The rule from the last lesson was already written for that: *a node that knows its gradient hands each parent that gradient times the local derivative, and a parent adds what it is handed.* The words to notice are **knows its gradient**. A node's gradient is a sum, with one term from every place the node was used. Until all those terms have arrived, the node does not yet know its gradient. If it speaks early, it passes on a part of the truth, and nothing that arrives afterwards will ever be passed on.

        So there is a condition, and it is the whole of this lesson:

        **A node may hand its gradient back only after every node that used it has handed back.**

        Here is a graph on which the condition bites. Three inputs $a = 2$, $b = 3$, $c = 1$, and

        $$s = a \times b, \qquad t = s + c, \qquad f = s \times t.$$

        So $s = 6$, $t = 7$, $f = 42$. The value $s$ is used twice: by $t$, and by $f$ directly.

        ```
           a ──┐
               ├── s ────────────┐
           b ──┘    \            ├── f
                     t ──────────┘
           c ───────/
        ```

        Start at $f$ with gradient 1. It hands $s$ its share, $1 \times t = 7$, and hands $t$ its share, $1 \times s = 6$.

        Who speaks next? Suppose $s$ does, since it was handed something first. It holds 7, and passes $7 \times b = 21$ to $a$. Then $t$ speaks. It holds 6 and hands $6 \times 1 = 6$ to $s$, whose gradient becomes 13, which is right: $f = s(s + c)$, so $\partial f / \partial s = 2s + c = 13$. But $s$ has already spoken, with 7. The 6 that came late never reaches $a$. The program reports $\partial f / \partial a = 21$, and the truth is $13 \times 3 = 39$.

        Now let $t$ speak before $s$. Then $s$ has heard from both of its users, holds 13, speaks once, and $a$ receives 39.

        **The order is everything.** $f$ first, then $t$, then $s$, then the leaves. Each node after everything that used it.

        You know what such an order is called. In the lessons on algorithms, a **topological order** of a directed graph without cycles lists the nodes so that every arrow points from earlier to later. Draw the arrows the way the data flowed, from operand to result. In a topological order every value comes after the values it was computed from, which is an order in which the calculation could have been carried out. **Read that list backwards and every value comes before the values it was computed from, which is to say after every value that used it.** That is the condition exactly.
    - figure: trail-graph
      props: { step: 6 }
    - text: |
        Step the figure on from where it stands. `L` has just spoken, and `e` holds 4, having received from both of the arrows that leave it. Only now does `e` speak. The sweep visits `L`, `e`, `q`, `p`: the four results in the reverse of the order they were computed.
  derivation:
    - text: |
        **Finding the order.** The depth-first method from the lesson on topological sorting applies as it stands, with `parents` in the role of "needs". Visit a node: first visit each of its parents, then write the node down. A set records which nodes have been visited, so that a shared node is written once.

        ```python
        class Value:
            def __init__(self, data, parents=()):
                self.data = data
                self.parents = parents
                self.grad = 0.0

            def __add__(self, other):
                return Value(self.data + other.data, ((self, 1.0), (other, 1.0)))

            def __mul__(self, other):
                return Value(self.data * other.data, ((self, other.data), (other, self.data)))


        def topological(node):
            order = []
            seen = set()

            def visit(v):
                if v in seen:
                    return
                seen.add(v)
                for parent, local in v.parents:
                    visit(parent)
                order.append(v)

            visit(node)
            return order


        w, x, b = Value(3.0), Value(2.0), Value(1.0)
        q = w * x + b
        print([v.data for v in topological(q)])
        ```

        That prints `[3.0, 2.0, 6.0, 1.0, 7.0]`: `w`, `x`, their product, `b`, and last the sum.

        *Why it is a topological order.* A node is appended only after `visit` has returned for each of its parents, and by then each parent is in the list, put there either by that call or by an earlier one. So every node appears after all its parents. The output is appended last of all.

        **The backward pass.** Seed the output and go through the list from the back.

        ```python
        def backward(node):
            node.grad = 1.0
            for v in topological(node)[::-1]:
                for parent, local in v.parents:
                    parent.grad += v.grad * local
        ```

        *Why it is correct.* Claim: when the loop reaches a node $v$, `v.grad` is the complete $\partial f / \partial v$. It is true of the output, which is first and holds 1. Take any other node $u$. Every node that uses $u$ comes after $u$ in the topological order, so before $u$ in the reversed one. By the time the loop reaches $u$, each user $v$ has had its turn, its gradient was complete at that turn, and it added $\bar v \times (\text{local})$ to `u.grad` once for each arrow from $u$. So `u.grad` holds $\sum \bar v\, \dfrac{\partial v}{\partial u}$ over all its uses, which is the rule for $\bar u$ from the last lesson. $\blacksquare$

        **The cost.** Finding the order visits each node once and looks along each arrow once. The sweep does one multiplication and one addition for each arrow. With $V$ nodes and $E$ arrows, the whole backward pass costs $O(V + E)$. Every operation of this engine has at most two operands, so $E \le 2V$, and the cost is proportional to the number of operations in the forward calculation.

        **The backward pass costs about the same as the forward pass.** That is the fact which makes training large models possible. For the value doubled 15 times it is 16 visits and 30 multiplications in place of 65,535 calls.
    - question:
        id: derivation-condition
        type: choice
        system: s2
        prompt: |
          With $s = a \times b$, $t = s + c$ and $f = s \times t$, a backward pass handles the nodes in the order $f$, $s$, $t$, each once. Which gradients come out wrong?
        options:
          - 'All of them.'
          - 'Those of $a$ and $b$. When $s$ had its turn it had received only the share from $f$. The share from $t$ arrived afterwards, so the gradient of $s$ itself ends up right, but what $s$ passed down to $a$ and $b$ was too small.'
          - 'Only that of $c$.'
          - 'None. The order does not matter so long as every node is handled once.'
        answer: 1
        explanation: |
          $f$ gives 7 to $s$ and 6 to $t$. Then $s$ passes on $7 \times 3 = 21$ to $a$ and $7 \times 2 = 14$ to $b$. Then $t$ gives $6 \times 1$ to $s$ and to $c$. At the end $s$ holds 13 and $c$ holds 6, both correct, but $a$ and $b$ hold 21 and 14 where 39 and 26 are owed. The mistake is not in any gradient that was received late. It is in everything downstream of the node that spoke early.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: With $a = 2$, $b = 3$, $c = 1$, $s = a \times b$, $t = s + c$, $f = s \times t$, put the steps of a correct backward pass in order.
        steps:
          - 'The gradient of $f$ is set to 1.'
          - '$f$ hands back: $s$ receives 7 and $t$ receives 6.'
          - '$t$ hands back: $s$ receives 6 more, making 13, and $c$ receives 6.'
          - '$s$ hands back: $a$ receives 39 and $b$ receives 26.'
        explanation: The reverse of a topological order is f, t, s and then the leaves. t must come before s because t used s, so s is not complete until t has spoken. Once s holds 13 it speaks once, passing 13 times b to a and 13 times a to b.
    - text: |
        **Counting uses instead.** The condition can be enforced directly, in the manner of Kahn's algorithm. First count, for every node, the arrows that leave it: its number of uses. A node is **ready** when every one of its uses has delivered. The output, used by nothing, is ready at the start. Take a ready node, deliver along each of its parent arrows, and lower that parent's count by one for each arrow. A parent whose count reaches zero becomes ready. This is the same sweep, arranged around the condition itself, and it needs no recursion.

        **Deep graphs.** Recursion matters in practice. The depth-first `visit` calls itself once for every step down a chain of parents. Add to a running total ten thousand times in a loop, and the graph is a chain ten thousand nodes long, and Python stops the recursion with a `RecursionError` long before the bottom. Real engines do not recurse. They use an explicit stack, or counts of uses, or the method below.

        **The tape.** There is an order that costs nothing to find. A value can only be computed from values that already exist. So **the order in which the values were created is a topological order.** An engine can simply append every new `Value` to a list as it is made. That list is called the **tape**, and the backward pass plays it in reverse.

        The tape holds every value made since recording began, including ones that have nothing to do with the output being differentiated. That is harmless: such a value never receives anything, its gradient stays 0, and it hands back zeros. But the tape must be cleared between one calculation and the next, or it grows without limit.

        Whichever way the order is found, the sweep is the same four lines, and those four lines are the centre of every reverse-mode engine ever written.
  formal:
    - text: |
        **Readiness.** In a reverse sweep over a computational graph with output $f$, a node $u \ne f$ is **complete** when every edge $u \to v$ has contributed $\bar v\,\dfrac{\partial v}{\partial u}$ to $\bar u$. A node may propagate to its parents only when complete.

        **Theorem.** Let $v_1, \dots, v_N$ be a topological order of the graph, so that every edge goes from an earlier node to a later one, with $v_N = f$. Set $\bar v_N = 1$ and all other adjoints to 0. For $k = N, N - 1, \dots, 1$ in turn, and for each parent edge $u \to v_k$, add $\bar v_k\,\dfrac{\partial v_k}{\partial u}$ to $\bar u$. Then at the end $\bar v = \dfrac{\partial f}{\partial v}$ for every node $v$, and each edge has been used exactly once.

        **Cost.** $O(V + E)$ time for $V$ nodes and $E$ edges, the same order as the forward evaluation.

        **Creation order.** Any order in which the nodes could have been computed, in particular the order in which they were, is a topological order.
