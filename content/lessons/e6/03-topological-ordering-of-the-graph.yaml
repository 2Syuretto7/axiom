    - question:
        id: work-uses
        type: numeric
        system: s2
        prompt: |
          $u = p \times q$, $v = u + p$, $w = v \times u + v$, at $p = 4$ and $q = 5$. In the backward pass from $w$, what is the complete gradient of $u$ at the moment it hands back?
        answer: "45"
        explanation: |
          $u = 20$ and $v = 24$. Name the product $m = v \times u = 480$, so $w = m + v$. Backwards: $\bar w = 1$, so $\bar m = 1$ and $v$ receives 1 from the addition. Then $m$ hands back: $v$ receives $1 \times u = 20$, making $\bar v = 21$, and $u$ receives $1 \times v = 24$. Now $v$ is complete, since both of its uses have reported, and it hands back: $u$ receives $21 \times 1 = 21$, making $\bar u = 45$, and $p$ receives 21. Only now is $u$ complete, and it passes $45 \times 5 = 225$ to $p$ and $45 \times 4 = 180$ to $q$. So $\bar p = 21 + 225 = 246$ and $\bar q = 180$. Check with algebra: $w = (u + p)(u + 1)$, so $\partial w / \partial u = 2u + p + 1 = 45$.
    - question:
        id: work-tape
        type: choice
        system: s2
        prompt: |
          An engine appends every `Value` to a global list, the tape, as it is created, and its backward pass goes through the tape from the end. During one forward calculation the program also computed some statistics for logging, with `Value` objects that the loss does not depend on. What effect do those extra nodes have on the gradients of the weights?
        options:
          - 'They corrupt the gradients, since they are in the wrong place on the tape.'
          - 'None. The tape is still in creation order, which is a topological order. The extra nodes receive nothing from the loss, hold gradient 0 at their turn, and hand zeros to their parents. They cost a little time and memory only.'
          - 'The backward pass stops when it reaches the first of them.'
          - 'They double every gradient.'
        answer: 1
        explanation: |
          Creation order puts every value after its parents whatever else was created in between, so the reversed tape still meets the condition. A node that the output does not depend on has no path to it from the output, never receives a contribution, and multiplies its zero gradient by its local derivatives. The price of the tape is elsewhere: it remembers everything made since recording began, wanted or not, so it has to be cleared between calculations, and work that needs no gradient is best done with recording turned off. Both of these come back in the lesson on memory.
    - question:
        id: work-cost
        type: choice
        system: s2
        prompt: |
          A network's forward calculation performs ten million operations, each with at most two operands. Roughly how much work is the ordered backward pass?
        options:
          - 'About ten million squared steps, since every node may depend on every other.'
          - 'At most about twenty million multiply-and-add steps, one for each arrow, on top of finding the order. That is the same order of work as the forward calculation itself.'
          - 'It depends on the number of paths, which could be astronomically large.'
          - 'One step, since the gradient is one vector.'
        answer: 1
        explanation: |
          One visit for each node and one multiplication and addition for each arrow, and there are at most two arrows into each node. The number of paths does not enter into it at all, which is the point of the lesson: sharing, which made the path-by-path walk explode, costs the ordered sweep nothing. This is sometimes called the cheap gradient principle. The whole gradient, with respect to every one of the inputs, costs a small fixed multiple of one evaluation of the function, however many inputs there are.
    - question:
        id: work-kahn
        type: numeric
        system: s2
        prompt: |
          The sweep is to be organised by counting uses. For the squared error, `e = w * x + b - y` and `L = e * e`, each value's count starts as the number of arrows leaving it. What is the count of `e` at the start?
        answer: "2"
        explanation: |
          `e` is the left operand and the right operand of the one multiplication, so two arrows leave it. `L` starts with count 0 and is ready. When `L` hands back, it delivers along both arrows and lowers the count of `e` twice, to 0, and only then is `e` ready. Had the count been kept as the number of different nodes that use `e`, which is 1, the bookkeeping would still come out here, but the rule that works in general is one count for each arrow, matching one delivery for each arrow.
  connections:
    - text: |
        The recursive walk followed every path from the output: 65,535 calls for a value doubled fifteen times, and the number doubles with each further operation. The paths are many because values are shared, and the walk repeated itself wherever they were.

        A gradient is a sum over a node's uses, so a node may hand back **only when every node that used it has handed back**. The reverse of a **topological order** meets that condition for every node at once. Find the order by a depth-first search that writes each node down as it leaves, sweep it from the back, and each node speaks once, each arrow is used once, and the cost is $O(V + E)$: about as much as the forward calculation. The order of creation is also a topological order, so an engine can keep a **tape** and play it backwards.

        Visiting once is not enough if the order is wrong: a node that speaks early passes on part of its gradient, and everything below it is silently too small.

        The engine is now correct and fast, for numbers. A model does not compute with single numbers. It computes with arrays of thousands of them at a time, and a node for every scalar multiplication would be millions of Python objects. The next lesson lets one node hold a whole array, and asks what the local derivative of an operation on arrays is: [[e6.tensor-valued-autograd]].
