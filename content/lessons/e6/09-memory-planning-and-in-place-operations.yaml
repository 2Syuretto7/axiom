    - text: |
        The gradient came out as $(10, 20, 30)$, the data of a batch that the loss never saw. The forward pass had recorded a **reference** to the array of $x$, and one line later the array was overwritten in place.

        A graph keeps alive every array its pulls can reach, until nothing refers to its tip. That memory is usually larger than the parameters, and it scales with batch size and depth. **Memory planning** asks of each operation what its pulls actually read: shapes for sums, both operands for products, the result for $\tanh$. What no pull reads need not be kept, and the graph can be **freed as the backward pass consumes it**.

        An **in-place** write saves an allocation and is safe exactly when no pending pull reads the old values. A **version counter** lets the engine enforce that for its own operations, turning a silently wrong gradient into an error. And two names for one array, an **alias**, can make even a harmless-looking `+=` corrupt a gradient.

        The engine is finished. It records scalars and tensors, orders the graph, handles broadcasting, checks itself numerically, organises parameters, differentiates its own gradients and looks after its memory. Nothing in it is taken on trust. The last lesson of the cluster puts all of it to work on a problem that a single layer cannot solve: [[e6.training-an-mlp-on-your-own-engine]].
