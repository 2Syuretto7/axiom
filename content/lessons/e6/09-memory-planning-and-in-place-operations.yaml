concept: e6.memory-planning-and-in-place-operations
minutes: 80
claim: You can say which arrays a recorded graph keeps alive and for how long, work out the memory a forward pass holds from its shapes, list for each operation what its pull truly needs, free a graph as the backward pass consumes it, explain how changing an array in place can corrupt a gradient without any error, guard saved values with a version counter so that the corruption is reported, and tell a safe in-place operation from an unsafe one.
recalls: [e6.higher-order-gradients]
uses: [e6.modules-parameters-and-optimisers, e6.tensor-valued-autograd, e6.broadcasting-in-the-backward-pass, e6.topological-ordering-of-the-graph, e6.reverse-mode-on-scalars, e5.reshaping-views-and-copies, e5.indexing-and-slicing, e5.arrays-dtype-and-shape, e5.strides-and-memory-layout, e3.amortised-analysis, e1.exceptions, e1.special-methods-and-operator-overloading, e1.classes-and-objects, e0.functions, e0.loops]
leads: [e6.training-an-mlp-on-your-own-engine, e7.autograd-in-pytorch, e7.tensors-and-devices, e7.debugging-shapes-and-nans, e7.anatomy-of-a-training-loop]
starter: |
  # Scratch space. One buffer holds the current batch of data. The loss of
  # batch 1 is computed, the next batch is loaded, and then the backward pass
  # for batch 1 is run. What is the gradient of w?
  import numpy as np


  class Tensor:
      def __init__(self, data, parents=()):
          self.data = np.array(data) * 1.0
          self.parents = parents
          self.grad = np.zeros(self.data.shape)

      def __add__(self, other):
          return Tensor(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

      def __mul__(self, other):
          return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

      def sum(self):
          return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


  def topological(node):
      order = []
      seen = set()

      def visit(v):
          if v in seen:
              return
          seen.add(v)
          for parent, pull in v.parents:
              visit(parent)
          order.append(v)

      visit(node)
      return order


  def backward(node):
      node.grad = np.ones(node.data.shape)
      for v in topological(node)[::-1]:
          for parent, pull in v.parents:
              parent.grad = parent.grad + pull(v.grad)


  batch1 = [1.0, 2.0, 3.0]
  batch2 = [10.0, 20.0, 30.0]

  x = Tensor(batch1)
  w = Tensor([0.5, 0.5, 0.5])
  L = (x * w).sum()
  print(float(L.data))

  x.data[:] = batch2
  backward(L)
  print(w.grad.tolist())
parts:
  recall:
    - text: |
        [[e6.higher-order-gradients]] ended on a cost: a gradient that is a graph keeps the forward graph alive beneath it. Today is about what any graph keeps alive, what that costs, and what happens when something it was keeping is changed. Three quick pulls first.
  puzzle:
    - text: |
        The starter computes $L = \sum_i x_i w_i$ for a batch of data $x = (1, 2, 3)$ and weights of 0.5. The gradient of $L$ with respect to $w$ is $x$ itself: $(1, 2, 3)$.

        Between the forward pass and the backward pass there is one extra line. To save an allocation, the program loads the next batch into the array it already has: `x.data[:] = batch2`. The loss of batch 1 has been computed and printed by then. The line changes no tensor that the loss is waiting on.

        Run it.

        ```
        3.0
        [10.0, 20.0, 30.0]
        ```

        The loss is right: $0.5 + 1 + 1.5 = 3$. The gradient is $(10, 20, 30)$. That is not the gradient of the loss that was printed. It is the data of a batch that the loss never saw.

        No operation in the engine is wrong, and the gradient would pass a gradient check if you ran one before that line. The forward pass finished correctly. The damage was done afterwards, to something the backward pass had not yet read.

        **What, exactly, does a graph hold on to between the forward pass and the backward pass? How much memory is that? And how could an engine notice that something it was holding has been changed?**
  intuition:
    - text: |
        Look at the pull that the product recorded for $w$:

        ```python
        (other, lambda g: g * self.data)
        ```

        It does not contain the numbers $(1, 2, 3)$. It contains `self`, a reference to the tensor `x`, and it will read `self.data` when it is called, during the backward pass. Recording a graph does not copy values. It keeps **references** to the tensors, and trusts that their arrays will still hold the same numbers when the pulls come to run.

        Two consequences follow, and they are the two halves of this lesson.

        **A graph is a memory debt.** As long as the loss node exists, it refers to its parents through its pulls, they refer to theirs, and so on down to the leaves. Python frees an object only when nothing refers to it. So every intermediate array of the forward pass stays in memory until the graph is let go. A plain function would have dropped each intermediate as soon as the next was computed. This is the price of reverse mode that the second lesson of this cluster named: the trail must be kept until it has been walked backwards.

        **A graph is fragile.** Anything that writes into one of those arrays between the forward and the backward pass changes what the pulls will read. Operations that write into an existing array are called **in-place** operations: `x += 1`, `x[:] = values`, `x *= 2`. They are attractive for the very reason above, since they need no new memory. And they are dangerous for the same reason. `x = x + 1` makes a new array and leaves the old one, which the graph still refers to, untouched. `x += 1` overwrites it.

        The puzzle's line was an in-place write to an array that a pull was still going to read. Python has no way to object. The engine could, if it kept track.
  derivation:
    - text: |
        **How much a graph holds.** An array of $n$ numbers in 64-bit floats takes $8n$ bytes. Take one layer of a network, $H = \tanh(XW + \mathbf{b})$, on a batch of 1,024 rows with 512 units in and out. The engine performs three operations and each makes a new array of $1024 \times 512$ numbers:

        | step | result | bytes |
        | --- | --- | --- |
        | `X @ W` | $Z_1$ | 4,194,304 |
        | `Z1 + b` | $Z_2$ | 4,194,304 |
        | `Z2.tanh()` | $H$ | 4,194,304 |

        About 12.6 million bytes for one layer, all of it held until the backward pass is over. The weight $W$ is $512 \times 512$, about 2.1 million bytes. **The values computed along the way outweigh the parameters, and they grow with the batch size and with the depth.** When a training run fails for lack of memory, this is nearly always what has run out, and halving the batch halves it.

        **What a pull truly needs.** Not every result has to be kept. Go through the pulls:

        | operation | its pulls read |
        | --- | --- |
        | $C = A + B$, $C = A - B$ | only the shapes of $A$ and $B$ |
        | $C = A * B$ | the values of $A$ and of $B$ |
        | $C = A @ B$ | the values of $A$ and of $B$ |
        | $C = \tanh A$ | the values of $C$, the result |
        | $s = \operatorname{sum}(A)$ | only the shape of $A$ |

        In the layer above, $Z_1$ is an operand of an addition, which reads only its shape. $Z_2$ is the operand of $\tanh$, whose pull reads its **result** and not its operand. So neither $Z_1$ nor $Z_2$ is ever read by the backward pass. Only $H$ is, by its own pull and by the next layer's product. Two of the three arrays are dead weight.

        An engine avoids keeping them by making each pull capture **only what it reads**. Compare two ways of writing the pull of a sum:

        ```python
        lambda g: g * np.ones(self.data.shape)      # holds on to self, array and all

        shape = self.data.shape
        lambda g: g * np.ones(shape)                # holds on to a tuple of two integers
        ```

        The first keeps the whole tensor alive in order to ask its shape later. The second asks now. Deciding, operation by operation, what must be saved for the backward pass and what may be dropped or overwritten is **memory planning**. With it, the bias can be added to $Z_1$ in place and $\tanh$ taken in place on top, and the layer holds one array where it held three.

        **Letting go.** When is the graph freed? When nothing refers to it. In a training loop the name `L` is bound to a new loss each step, and the old graph is released at that moment. Two habits defeat this. Appending `L` to a list, to plot the loss later, keeps every graph of the run alive: append `float(L.data)`. And holding the old `L` while the next forward pass runs means that two graphs exist at once at the peak.

        The engine can do better than wait. Once a node has handed its shares to its parents during the backward pass, its pulls will never be called again. Setting `v.parents = ()` at that point drops the node's references, and its operands can be freed while the backward pass is still running, layer by layer from the output down.

        ```python
        def backward(node):
            node.grad = np.ones(node.data.shape)
            for v in topological(node)[::-1]:
                for parent, pull in v.parents:
                    parent.grad = parent.grad + pull(v.grad)
                v.parents = ()
        ```

        The graph is consumed by its own backward pass. A second backward pass from the same loss then finds no parents and does nothing. Frameworks do the same and raise an error on the second attempt, unless asked to retain the graph, which is what the higher-order gradients of the last lesson require.
    - question:
        id: derivation-keep
        type: choice
        system: s2
        prompt: |
          In $H = \tanh(XW + \mathbf{b})$, computed as `Z1 = X @ W`, `Z2 = Z1 + b`, `H = Z2.tanh()`, which of these arrays could be overwritten after the forward pass without changing any gradient?
        options:
          - '$X$, because it is data and not a parameter.'
          - '$Z_1$ and $Z_2$. The addition''s pulls read only shapes, and the pull of $\tanh$ reads its result $H$ and not its operand $Z_2$.'
          - '$H$, because it is the output.'
          - '$W$, because its gradient does not depend on its own value.'
        answer: 1
        explanation: |
          $X$ is read by the product's pull for $W$, which is $X^\top G$: that is the puzzle. $W$ is read by the product's pull for $X$, which is $G W^\top$, and that matters whenever $X$ is itself the output of an earlier layer. $H$ is read by the pull of $\tanh$, as $1 - H^2$. That leaves $Z_1$, which only the addition uses, and $Z_2$, which only $\tanh$ uses as an operand. Neither value appears in any pull.
    - text: |
        **Catching an unsafe write.** The engine cannot stop Python from writing into an array. It can make its own in-place operations leave a mark. Give every tensor a **version**, a counter that starts at 0 and goes up by one each time the tensor is changed in place:

        ```python
        def add_(self, other):
            self.data += other.data
            self.version += 1
            return self
        ```

        The trailing underscore is the usual sign of an operation that changes its tensor. Now a pull that will need a tensor's values notes the version at the time of the forward pass, and checks it when it comes to read:

        ```python
        def guard(t):
            version = t.version

            def read():
                if t.version != version:
                    raise RuntimeError("a value needed by the backward pass was changed in place")
                return t.data

            return read
        ```

        `guard(t)` is called during the forward pass and returns a function. Calling that function later gives `t.data` if the tensor is as it was, and raises if it has been changed since. The product uses it for both operands:

        ```python
        def __mul__(self, other):
            a, b = guard(self), guard(other)
            return Tensor(self.data * other.data, ((self, lambda g: g * b()), (other, lambda g: g * a())))
        ```

        An addition takes no guard, because its pulls read no values. So changing a tensor in place is **allowed** when only additions have used it and **reported** when a product has. The check costs one integer for each saved value. It turns the worst kind of bug, a wrong number with no error, into the best kind, an error at the line that tried to use the stale value.

        **Safe and unsafe.** An in-place write is safe when no pull that is still to run will read the old values.

        - The optimiser's update after the backward pass: safe. The graph has been walked. `p.data -= lr * p.grad` writes where `p.data = p.data - lr * p.grad` allocates a new array at every step.
        - Adding into the result of a product, before a $\tanh$: safe, by the table above.
        - Overwriting an operand of a product, or the result of a $\tanh$, before the backward pass: unsafe.
        - Writing through a **view**, a slice or a reshape that shares memory with a tensor's array: as unsafe as writing to the array itself, and harder to see.

        **One more alias.** The backward pass has had a small oddity since the lesson on tensors: it writes `parent.grad = parent.grad + share`, never `parent.grad += share`. The pulls of an addition return `g`, the very array that is the child's gradient. If a parent's gradient were ever that same array, adding into it in place would change the child's gradient too, and every other parent's that shared it. Making a new array each time is the price of never having to ask who else is holding this one.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order what happens when a version counter catches an unsafe in-place write.
        steps:
          - 'The forward pass computes a product, and its pulls note the current versions of both operands.'
          - 'An in-place operation changes one operand and raises its version by one.'
          - 'The backward pass reaches the product and calls the pull that needs that operand.'
          - 'The pull compares the noted version with the current one, finds them different, and raises an error.'
        explanation: The version is noted when the value is saved and checked when it is used. The write itself is not an error, since nothing may ever need the old value. The error comes only if a pull tries to read it.
  formal:
    - text: |
        **Retention.** A node holds references to its parents through its pulls. Every array reachable from a node in this way is kept in memory for as long as the node is referred to.

        **Memory of a graph.** The sum of the sizes in bytes of the arrays of its distinct nodes. An array of shape $(d_1, \dots, d_k)$ and item size $s$ occupies $s \, d_1 \cdots d_k$ bytes.

        **Saved values.** For each operation, the set of arrays its pulls read. Sums, differences and reductions save shapes only. Products, of either kind, save both operands. Entry-wise functions whose derivative can be written in terms of the result, such as $\tanh$, save the result.

        **In-place operation.** One that writes its result into the memory of an existing array. It is safe if no pull yet to be called reads the overwritten values.

        **Version counter.** An integer on each tensor, incremented by every in-place operation on it. A pull records the version of each value it saves and raises an error if the version has changed when the value is read.

        **Freeing.** After a node's shares have been distributed in a backward pass its pulls may be discarded. A graph freed in this way supports one backward pass.
