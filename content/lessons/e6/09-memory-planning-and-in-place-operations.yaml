        solution: |
          import numpy as np


          class Tensor:
              def __init__(self, data, parents=()):
                  self.data = np.array(data) * 1.0
                  self.parents = parents
                  self.grad = np.zeros(self.data.shape)

              def __add__(self, other):
                  return Tensor(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

              def __mul__(self, other):
                  return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

              def sum(self):
                  return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


          def topological(node):
              order = []
              seen = set()

              def visit(v):
                  if v in seen:
                      return
                  seen.add(v)
                  for parent, pull in v.parents:
                      visit(parent)
                  order.append(v)

              visit(node)
              return order


          def graph_bytes(node):
              return sum(v.data.nbytes for v in topological(node))


          def backward(node):
              node.grad = np.ones(node.data.shape)
              for v in topological(node)[::-1]:
                  for parent, pull in v.parents:
                      parent.grad = parent.grad + pull(v.grad)
                  v.parents = ()


          x = Tensor([1.0, 2.0, 3.0])
          w = Tensor([0.5, 0.5, 0.5])
          L = (x * w).sum()
          before = graph_bytes(L)
          backward(L)
          print(before, graph_bytes(L), w.grad.tolist())
        tests: |
          import numpy as _np
          _a = Tensor(_np.ones((4, 5)))
          _b = Tensor(_np.full((4, 5), 2.0))
          _s = _a + _b
          _t = _s * _s
          _u = (_t + _a).sum()
          assert graph_bytes(_a) == 160, "A tensor of shape (4, 5) alone holds 160 bytes"
          assert graph_bytes(_u) == 5 * 160 + 8, "This graph has five arrays of 160 bytes and one of 8: count each distinct tensor once, however often it is used"
          _nodes = topological(_u)
          backward(_u)
          assert _np.allclose(_a.grad, 7.0) and _np.allclose(_b.grad, 6.0), "The gradients should still be right: for (a + b) squared plus a, at a = 1 and b = 2, they are 7 and 6. Hand out a tensor's shares before clearing its parents"
          assert all(v.parents == () for v in _nodes), "After the backward pass every tensor's parents should be the empty tuple"
          assert graph_bytes(_u) == 8, "After the backward pass the loss should hold on to nothing but its own array"
          backward(_u)
          assert _np.allclose(_a.grad, 7.0) and _np.allclose(_b.grad, 6.0), "A second backward pass on a freed graph should hand out nothing"
          assert output.strip() == "80 8 [1.0, 2.0, 3.0]", "The program should print 80 8 [1.0, 2.0, 3.0]"
