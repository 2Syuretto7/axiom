            import numpy as np


            class Tensor:
                def __init__(self, data, parents=()):
                    self.data = np.array(data) * 1.0
                    self.parents = parents
                    self.grad = None

                def __add__(self, other):
                    return Tensor(self.data + other.data, ((self, lambda g: g), (other, lambda g: g)))

                def __mul__(self, other):
                    return Tensor(self.data * other.data, ((self, lambda g: g * other.data), (other, lambda g: g * self.data)))

                def sum(self):
                    return Tensor(self.data.sum(), ((self, lambda g: g * np.ones(self.data.shape)),))


            def topological(node):
                order = []
                seen = set()

                def visit(v):
                    if v in seen:
                        return
                    seen.add(v)
                    for parent, pull in v.parents:
                        visit(parent)
                    order.append(v)

                visit(node)
                return order


            def backward(node):
                node.grad = np.ones(node.data.shape)
                for v in topological(node)[::-1]:
                    for parent, pull in v.parents:
                        share = pull(v.grad)
                        if parent.grad is None:
                            parent.grad = share
                        else:
                            parent.grad *= 0
                            parent.grad += share + share


            print("[2.0, 2.0] [1.0, 1.0]")
        explanation: |
          The pull of an addition returns `g`, the very array it was given. So when the backward pass reaches the outer sum, whose gradient is one array of ones, it gives that **same array** to both operands as their first share: the gradient of $a + b$ and the gradient of $a$ are now two names for one piece of memory, which is also the outer sum's own gradient.

          Next the inner sum hands its gradient on. Its share for $a$ arrives where $a$ already has a gradient, so it is added in place. That write doubles the array, which is the inner sum's gradient too. The share then computed for $b$ is read from the doubled array, and $b$ receives 2.

          `parent.grad = parent.grad + share` builds a new array for the total and leaves alone whatever the old one was shared with. Taking a copy of the first share, `share.copy()`, cures it as well, at the cost of the allocation the trick was meant to save.

          **An in-place write is safe only if you know every name the array has.** A pull that returns its argument is an optimisation, and so is adding in place, and each is correct alone. The bug was in the two together. That is the usual shape of an aliasing bug, and it is why this cluster's backward pass has never used `+=`.
