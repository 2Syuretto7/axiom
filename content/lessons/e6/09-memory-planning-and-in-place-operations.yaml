          `self.data = self.data + other.data` is not in place. It makes a new array, and the old one, which the graph still holds, keeps its values. That happens to make the gradient right, and it bumps a version that then raises a false alarm. An `add_` that forgets the version disarms every guard. A guard that reads the version inside `read` compares the current version with itself. One that compares with 0 raises for any tensor that was ever changed, including one changed long before the product was computed.

          The guard knows only about changes made through the engine's own operations. A write straight into `x.data` goes past it, which is one reason frameworks discourage reaching for the raw array.
