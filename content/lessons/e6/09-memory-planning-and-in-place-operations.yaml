    - question:
        id: predict-closure
        type: predict
        system: s1
        prompt: A pull that refers to an array, and a copy taken at the same moment. Then the array is changed in place. What does this show?
        code: |
          import numpy as np

          x = np.array([1.0, 2.0, 3.0])
          pull = lambda g: g * x
          saved = x.copy()
          x += 10
