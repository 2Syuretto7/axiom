        output: |
          [11.0, 12.0, 13.0]
          [1.0, 2.0, 3.0]
        explanation: The function looks at `x` when it is called, and by then `x` holds the new numbers. The copy is a separate array and kept the old ones. An engine that copied every saved value would be safe and would double its memory.
