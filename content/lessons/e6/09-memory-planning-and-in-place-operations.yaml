        type: numeric
        system: s2
        prompt: |
          A network has 4 layers, each $H = \tanh(XW + \mathbf{b})$ computed as three operations with a new array for each result. Every layer is 256 units wide and the batch has 1,000 rows, in 64-bit floats. An engine with memory planning keeps, for each layer, only the one result that a pull will read. How many bytes of results does planning save over keeping all of them?
        answer: "16384000"
        explanation: |
          One result is $1000 \times 256 \times 8 = 2{,}048{,}000$ bytes. Without planning each layer holds three, $Z_1$, $Z_2$ and $H$, so 12 arrays, 24,576,000 bytes. With planning each layer holds only $H$, the result of $\tanh$, which its own pull reads and which the next layer's product reads as an operand: 4 arrays, 8,192,000 bytes. The saving is 8 arrays, 16,384,000 bytes, two thirds of the total. The input batch and the weights are held either way.
    - question:
        id: work-safe
        type: choice
        system: s2
        prompt: |
          Which of these in-place writes, made after a forward pass and **before** its backward pass, changes a gradient?
        options:
          - 'Writing into $Z_1 = XW$, whose only use was as an operand of `Z1 + b`.'
          - 'Writing into $H = \tanh(Z_2)$.'
          - 'Writing into an array that no tensor of the graph refers to.'
          - 'Writing into $Z_2 = Z_1 + \mathbf{b}$, whose only use was as the operand of $\tanh$.'
        answer: 1
        explanation: |
          The pull of $\tanh$ computes $G \times (1 - H^2)$ from its result, so overwriting $H$ changes the local derivative that the backward pass will use. If a further layer took $H$ as an operand of a product, that pull would read the wrong values as well. $Z_1$ and $Z_2$ are read by no pull, as in the derivation: an addition needs shapes and $\tanh$ needs its result. This is why a framework can compute a function such as $\tanh$ or $\max(z, 0)$ in place on top of its operand, and why it refuses when the operand is something a product had saved.
    - question:
        id: work-history
        type: choice
        system: s2
        prompt: |
          A training loop runs for 10,000 steps and its memory use climbs steadily until it fails. Each step builds a graph holding 50 megabytes. The loop contains `losses.append(L)` for plotting. What is wrong, and what is the fix?
        options:
          - 'The optimiser is leaking velocities. Use momentum 0.'
          - 'The list holds a reference to every loss node, and each loss node holds its whole graph through its parents. Nothing is ever freed. Append `float(L.data)`, a plain number with no parents.'
          - 'The gradients are not being cleared. Call `zero_grad`.'
          - 'NumPy does not free arrays. Nothing can be done.'
        answer: 1
        explanation: |
          References run from results to operands, so one reference to the loss is a reference to everything beneath it. After 200 steps the list is keeping 10 gigabytes alive, in order to remember 200 numbers. Converting to a float takes the number and lets go of the node. The same leak appears in subtler forms: a running total kept as `total = total + L`, built with tensor operations, is a node whose graph contains every loss so far. A backward pass that clears parents as it goes makes the engine forgiving here, since the freed graphs hold nothing, but the habit to form is: **what leaves the training step should be a number, not a node.**
    - question:
        id: work-retain
        type: choice
        system: s2
        prompt: |
          An engine frees each node's pulls during the backward pass. Which task from this cluster does that break, so that an option to retain the graph is needed?
        options:
          - 'An ordinary training step.'
          - 'Gradient checking with central differences.'
          - 'Taking a second derivative: the first derivative is a graph built on the forward graph''s nodes, and a backward pass through it must call pulls that the first pass would have thrown away.'
          - 'Momentum.'
        answer: 2
        explanation: |
          A training step runs one backward pass and discards the graph, so freeing is pure gain. Gradient checking calls the function afresh for every nudge, building new graphs. A second derivative is different in kind. The first backward pass produces nodes whose parents include nodes of the forward graph, and the second backward pass walks through all of them. So the first pass must leave the forward graph whole. That is the memory cost flagged at the end of the last lesson, and the reason frameworks free by default and keep only on request.
