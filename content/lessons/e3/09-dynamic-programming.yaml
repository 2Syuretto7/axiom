concept: e3.dynamic-programming
minutes: 100
claim: You can recognise a problem whose pieces overlap, turn an exponential recursion into a fast one by remembering each answer, design a table by saying what an entry means, how it follows from earlier entries and in what order to fill it, and use this to count routes, find cheapest paths, make change and measure the distance between two strings.
recalls: [e3.divide-and-conquer]
uses: [e3.hash-tables, e3.graphs-and-traversal, e1.recursion, e1.complexity-and-big-o, e1.comprehensions-and-iterators, e1.modules-and-imports, e0.dictionaries-and-sets, e0.lists-and-tuples, e0.loops, e0.strings, m3.induction-and-strong-induction]
leads: [e3.amortised-analysis, e3.topological-sort, e3.shortest-paths-and-beam-search]
starter: |
  # Scratch space. A robot starts in the top-left cell of a grid and may step right or down.
  # routes(rows, cols) counts its routes to the bottom-right cell, and count[0] counts the calls made.
  count = [0]

  def routes(rows, cols):
      count[0] += 1
      if rows == 1 or cols == 1:
          return 1
      return routes(rows - 1, cols) + routes(rows, cols - 1)

  for size in [(4, 5), (8, 8), (12, 12), (13, 13)]:
      count[0] = 0
      print(size, routes(size[0], size[1]), "routes,", count[0], "calls")
parts:
  recall:
    - text: |
        [[e3.divide-and-conquer]] ended with a recursion that fails. `fib(40)` asks only forty-one different questions and takes three hundred million calls to answer them, because its pieces overlap. Today you repair it, and the repair turns out to be one of the most widely used ideas in computing. Three quick pulls first.
    - question:
        id: recall-overlap
        type: choice
        system: s1
        concepts: [e3.divide-and-conquer]
        prompt: |
          Merge sort is fast and the recursive `fib` is slow, though both make two recursive calls. One reason is that the two halves of a list
        options:
          - "are sorted already"
          - "share no items, so no piece of work is done twice"
          - "are stored in a hash table"
          - "are always of equal length"
        answer: 1
        explanation: The pieces of merge sort are separate problems. The pieces of `fib` need the same smaller pieces as each other.
        hints:
          - What do fib(39) and fib(38) have in common?
          - Do the two halves of a list have anything in common?
    - question:
        id: recall-dict-cost
        type: choice
        system: s1
        concepts: [e3.hash-tables]
        prompt: |
          Looking up a key in a dictionary of $n$ entries costs on average
        options: ["$O(1)$", "$O(\\log n)$", "$O(n)$", "$O(n \\log n)$"]
        answer: 0
        explanation: The key is hashed to a bucket, and the bucket holds a constant number of entries on average.
        hints:
          - How is the right bucket found?
          - Does that depend on how many entries there are?
    - question:
        id: recall-doubling-levels
        type: numeric
        system: s1
        concepts: [e3.divide-and-conquer]
        prompt: |
          A tree of calls has 1 call on its top level, and each call makes 2 more. How many calls are on the level 10 below the top?
        answer: "1024"
        explanation: The count doubles at each level, so it is $2^{10}$.
        hints:
          - One level down there are 2, and two levels down there are 4.
          - Double once for each level.
  puzzle:
    - text: |
        A robot stands in the top-left cell of a grid and must reach the bottom-right. At each step it may move one cell **right** or one cell **down**, nothing else.

        **In how many different ways can it cross a grid of 30 rows and 30 columns?**

        Here is a line of thought that looks as if it settles the matter. The robot's last step entered the final cell either from above or from the left. So the routes to the final cell are the routes to the cell above together with the routes to the cell on the left. Each of those is the same question about a smaller grid. A cell on the top edge or the left edge can be reached in only one way. That is a complete recursive definition, and the starter is exactly it.

        Run the starter. A grid of 4 by 5 has 35 routes, found in 69 calls. A grid of 12 by 12 has 705432 routes, found in 1410863 calls, and you can feel the wait for 13 by 13. Look at the two columns: the calls are about twice the routes. The function is in effect counting the routes **one at a time**.

        For 30 by 30 the answer is 30067266499541040. A computer making ten million calls a second would need about two hundred years to count that high.

        And yet the whole grid has only 900 cells, and the reasoning above involved nothing but adding two numbers per cell.

        **Where is all the time going? And how do you get the answer in 900 additions?**
  intuition:
    - text: |
        Ask what questions the recursion poses. Every call is `routes(r, c)` for some number of rows $r$ from 1 to 30 and some number of columns $c$ from 1 to 30. There are $30 \times 30 = 900$ possible questions, and no others can ever arise.

        So $6 \times 10^{16}$ calls are being spent on 900 different questions. On average each question is answered sixty million million times over, and each time from scratch.

        You can see the repetition start at the first step. `routes(30, 30)` asks for `routes(29, 30)` and `routes(30, 29)`. Each of **those** asks for `routes(29, 29)`. It is computed twice, and each of the two computations repeats everything beneath it. One level further down there are questions asked three times, then six, and the repeats multiply.

        The cure is the one you would use yourself. **The first time a question is answered, write the answer down. Ever after, look it up.**

        A person would do it on squared paper. Draw the grid, and write in each cell the number of routes to it. The cells along the top and the left get 1. Every other cell gets the sum of the number above it and the number to its left, both of which are already written if you work along the rows from the top. Step through it.
    - figure: dp-grid
    - text: |
        Twenty cells, twelve additions, and the far corner holds 35, the number the recursion took 69 calls to find. For 30 by 30 the same procedure writes 900 numbers.

        Nothing about the reasoning has changed. The relation between a cell and its two neighbours is the same one the recursion used. All that changed is that each answer is computed **once**. That is the whole of **dynamic programming**: a recursion whose pieces overlap, with a table in which each piece is solved once.

        The name tells you little. It was chosen in the 1950s by Richard Bellman, who said later that he wanted a name impressive enough that no official would object to funding it. "Programming" meant planning, as in a programme of events. Think of it as **filling in a table**.
  derivation:
    - text: |
        **Remembering.** Begin with the function that failed.

        ```python
        def fib(n):
            if n < 2:
                return n
            return fib(n - 1) + fib(n - 2)
        ```

        Add a dictionary, and consult it before computing.

        ```python
        memo = {}

        def fib(n):
            if n < 2:
                return n
            if n not in memo:
                memo[n] = fib(n - 1) + fib(n - 2)
            return memo[n]
        ```

        This is called **memoisation**, from memo, a note to oneself. Count the work now. The line that adds runs **once** for each `n` from 2 upwards, because after that `n` is in the dictionary. Each run makes two calls, so `fib(40)` makes fewer than 80 calls, where before it made over three hundred million. The cost is $O(n)$, and it rests on a dictionary lookup costing $O(1)$, as you showed in [[e3.hash-tables]].

        The general rule for the cost of a memoised recursion is worth stating, since you will use it every time:

        $$\text{cost} = (\text{number of different questions}) \times (\text{work for one question, not counting its calls}).$$

        **Bottom up.** Memoisation starts from the question you want and works down, which is called **top down**. The other way is to start from the smallest questions and work up, so that whatever an entry needs is already there. That is **bottom up**, and it is what you did on squared paper.

        ```python
        def fib(n):
            table = [0, 1]
            for k in range(2, n + 1):
                table.append(table[k - 1] + table[k - 2])
            return table[n]
        ```

        No recursion and no dictionary. The two ways do the same additions. Bottom up is usually a little faster and cannot run out of room for waiting calls, which in Python happens at a depth of about a thousand. Top down is often easier to write, since it is the recursion you first thought of, and it computes only the entries that are needed.

        **The grid.** For the robot, let $R(r, c)$ be the number of routes across a grid of $r$ rows and $c$ columns. Then

        $$R(r, c) = R(r - 1, c) + R(r, c - 1), \qquad R(1, c) = R(r, 1) = 1.$$

        Bottom up, with a list of lists as the table:

        ```python
        def routes(rows, cols):
            table = [[1] * cols for _ in range(rows)]
            for r in range(1, rows):
                for c in range(1, cols):
                    table[r][c] = table[r - 1][c] + table[r][c - 1]
            return table[rows - 1][cols - 1]
        ```

        The table is made with every entry 1, which is right for the top row and the left column, and the loops fill the rest. Rows are taken from the top and, within a row, cells from the left, so the entry above and the entry to the left are always ready. There are `rows * cols` entries and each costs one addition: `routes(30, 30)` is 841 additions.
    - question:
        id: derive-memo-count
        type: numeric
        system: s2
        prompt: |
          The recursive `routes` is memoised, with a dictionary keyed by the pair `(rows, cols)`. `routes(30, 30)` is called. At most how many entries can the dictionary ever hold?
        answer: "900"
        explanation: |
          Every call has a number of rows from 1 to 30 and a number of columns from 1 to 30, so there are $30 \times 30$ different questions and no more. Each is computed once, at the cost of one addition, and every later call for it is a lookup. The recursion that would have taken two centuries finishes in under a millisecond, and nothing was changed but the addition of a memory.
        hints:
          - What values can the first argument take in any call? And the second?
          - Each different pair is one question.
          - Multiply the number of possibilities for each argument.
    - text: |
        **A recipe.** Every problem of this kind is solved by answering the same questions in the same order. Here they are for the grid.

        1. **What does an entry mean?** `table[r][c]` is the number of routes from the top-left cell to the cell in row `r`, column `c`. State this in a full sentence. Most errors come from being vague here.
        2. **How does an entry follow from earlier ones?** The last step came from above or from the left, so add those two entries. This is the **recurrence**.
        3. **Which entries need no others?** Those on the top and left edges, which are 1. These are the **base cases**.
        4. **In what order?** So that everything an entry needs is filled before it: row by row, left to right.
        5. **Where is the answer?** In the bottom-right entry.

        The cost is the number of entries times the work per entry.

        **Choosing the best, not counting.** The same recipe finds a best choice among exponentially many. Give each cell of the grid a cost, and ask for the **cheapest route**: the one whose cells add up to the least.

        Entry: `best[r][c]` is the cost of the cheapest route from the top-left to that cell, counting both ends. Recurrence: a route to the cell arrives from above or from the left, and it should use whichever of those is cheaper to reach:

        $$\text{best}(r, c) = \text{cost}(r, c) + \min\bigl(\text{best}(r-1, c), \ \text{best}(r, c-1)\bigr).$$

        One point needs an argument. Why is it right to extend the **cheapest** route to the neighbouring cell? Could the cheapest route to this cell pass through the cell above by some route that is not the cheapest to that cell? No. If it did, you could swap that part for the cheaper one and get a cheaper route overall. So a best route is made of best routes to the cells it passes through. That property has a name, **optimal substructure**, and it is what a problem must have for the recipe to apply.

        Notice what the table does **not** do. It does not walk forward from the start always stepping to the cheaper neighbour. That is called a **greedy** method, and it is wrong here: a cheap first step can lead into an expensive region. The table commits to nothing until every way of arriving has been weighed.

        **Making change.** A second example in one dimension. You have coins of 1, 4 and 5, as many of each as you like. What is the fewest coins that make 8?

        The greedy answer takes the largest coin first: $5 + 1 + 1 + 1$, four coins. The best is $4 + 4$, two.

        Entry: `fewest[a]` is the fewest coins that make the amount `a`. Recurrence: some coin $c$ is the last one added, and before it the amount was $a - c$, which should itself have been made with the fewest coins:

        $$\text{fewest}(a) = 1 + \min_{c \,\le\, a} \ \text{fewest}(a - c), \qquad \text{fewest}(0) = 0.$$

        | amount | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |
        | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
        | fewest coins | 0 | 1 | 2 | 3 | 1 | 1 | 2 | 3 | 2 |

        The entry for 8 looks back at the entries for 7, 4 and 3, which hold 3, 1 and 3, takes the least, and adds one. Order: amounts from 0 upwards. Cost: one entry per amount, and one look back per kind of coin.

        If some amount cannot be made at all, its entry needs a value meaning "impossible" that loses every comparison under `min`. Python has one: `math.inf`, a float larger than every number.
    - question:
        id: derive-recipe
        type: order
        system: s2
        prompt: Put the steps of designing a table in the order in which they have to be settled.
        steps:
          - "Say in a sentence exactly what one entry of the table means"
          - "Express an entry in terms of entries for smaller problems"
          - "Fix the entries that depend on no others"
          - "Choose an order of filling in which whatever an entry needs is already there"
          - "Say which entry holds the answer, and count entries times work for each"
        explanation: The meaning of an entry comes first, since the recurrence is a statement about entries and cannot be written, or checked, until you know what they are. The recurrence shows which entries have nothing to refer back to, and which entries each one looks at, and that decides the order.
        hints:
          - You cannot relate entries to each other before you know what an entry is.
          - The order of filling depends on which entries each entry looks at.
          - Reading off the answer comes last.
    - text: |
        **The distance between two strings.** Now a problem with two things varying at once, and one you will use. How different are two strings? A natural measure is the fewest **edits** that turn one into the other, where an edit inserts a character, deletes a character, or replaces one character by another. It is called the **edit distance**. From "flaw" to "lawn" it is 2: delete the f, and add an n at the end.

        Spelling correctors use it to find the dictionary word nearest to what you typed. Biologists use it to compare genes. And a system that turns speech into text is scored by the edit distance, counted in words, between what it wrote and what was said.

        Trying every sequence of edits is hopeless. Apply the recipe to strings `a` and `b`.

        **Entry.** `d[i][j]` is the edit distance between the **first `i` characters of `a`** and the **first `j` characters of `b`**. The pieces are beginnings of the strings.

        **Base cases.** `d[i][0] = i`: to turn $i$ characters into nothing, delete them all. `d[0][j] = j`: to make $j$ characters from nothing, insert them all.

        **Recurrence.** Look at the last character of each beginning, `a[i - 1]` and `b[j - 1]`.

        - If they are **equal**, nothing need be done to them, and the distance is that of the beginnings without them: `d[i - 1][j - 1]`.
        - If they **differ**, the last edit is one of three, and you take the cheapest:
          - delete the last character of `a`'s beginning, and then turn the rest into `b`'s beginning: `d[i - 1][j]`,
          - turn `a`'s beginning into `b`'s beginning without its last character, and then insert that character: `d[i][j - 1]`,
          - replace one last character by the other, having matched the rest: `d[i - 1][j - 1]`,

          and add 1 for the edit.

        **Order.** Each entry looks up, left, and diagonally up-left, so rows from the top, left to right. **Answer.** `d[len(a)][len(b)]`.

        Here is the table for "flaw" and "lawn". The row labelled with a letter is the row for the beginning of "flaw" that ends with that letter.

        |  | (none) | l | a | w | n |
        | --- | --- | --- | --- | --- | --- |
        | (none) | 0 | 1 | 2 | 3 | 4 |
        | f | 1 | 1 | 2 | 3 | 4 |
        | l | 2 | 1 | 2 | 3 | 4 |
        | a | 3 | 2 | 1 | 2 | 3 |
        | w | 4 | 3 | 2 | 1 | 2 |

        Follow the diagonal of 1s. "fl" to "l" costs 1, the deleted f. Then l, a and w match in turn, and each match copies the entry diagonally above it. The final n costs one insertion, and the corner reads 2.

        The cost is one entry for each pair of beginnings: $(m + 1)(n + 1)$ entries for strings of lengths $m$ and $n$, each needing three looks. Two strings of a thousand characters take a million entries, where the sequences of edits are beyond counting.
  formal:
    - text: |
        **Overlapping sub-problems.** A recursion has them when the same smaller problem is reached along many paths of calls.

        **Memoisation.** Store the answer to each sub-problem the first time it is computed, and return the stored answer on every later call. Its cost is the number of different sub-problems times the work for one, not counting its recursive calls.

        **Dynamic programming.** Solving a problem by computing the answer to each sub-problem once, either top down by memoised recursion or bottom up by filling a table in an order in which each entry's needs are met.

        **Optimal substructure.** A problem has it when a best solution is made of best solutions to its sub-problems.

        **Route count.** $R(r, c) = R(r-1, c) + R(r, c-1)$ with $R(1, c) = R(r, 1) = 1$. Cost $O(rc)$.

        **Fewest coins.** $F(0) = 0$ and $F(a) = 1 + \min_{c \le a} F(a - c)$ over the kinds of coin $c$. Cost $O(\text{amount} \times \text{kinds})$.

        **Edit distance.** $D(i, 0) = i$, $D(0, j) = j$, and for $i, j \ge 1$: $D(i, j) = D(i-1, j-1)$ if the $i$th character of $a$ equals the $j$th of $b$, and otherwise $1 + \min\bigl(D(i-1, j), D(i, j-1), D(i-1, j-1)\bigr)$. Cost $O(mn)$.
  drill:
    - text: Seconds each. In the grids, the robot starts in the top-left cell and moves only right or down. Coins are of 1, 4 and 5.
    - question:
        id: drill-fib-questions
        type: numeric
        system: s1
        prompt: |
          `fib(40)` is called. How many different values of `n` are ever asked about, counting 40 and 0?
        answer: "41"
        explanation: Every whole number from 0 to 40, and no other.
        hints:
          - The arguments only ever go down by 1 or 2.
          - Count the whole numbers from 0 up to the one asked for, both included.
    - question:
        id: drill-cell
        type: numeric
        system: s1
        prompt: |
          In the table of routes, the entry above a cell is 4 and the entry to its left is 6. What is the cell's entry?
        answer: "10"
        explanation: A route arrives from above or from the left, so the two counts are added.
        hints:
          - From which cells can the robot step into this one?
          - Every route to one of those extends to exactly one route here.
    - question:
        id: drill-two-by-two
        type: numeric
        system: s1
        prompt: |
          How many routes cross a grid of 2 rows and 2 columns?
        answer: "2"
        explanation: Right then down, or down then right.
        hints:
          - The far corner is entered from above or from the left.
          - Each of those two cells is on an edge.
    - question:
        id: drill-three-by-three
        type: numeric
        system: s1
        prompt: |
          How many routes cross a grid of 3 rows and 3 columns?
        answer: "6"
        explanation: The rows of the table are 1 1 1, then 1 2 3, then 1 3 6.
        hints:
          - Fill the table. The top row and left column are all 1.
          - The middle row is 1, 2, 3.
    - question:
        id: drill-edge
        type: numeric
        system: s1
