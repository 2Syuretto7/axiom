    - question:
        id: work-greedy
        type: choice
        system: s2
        prompt: |
          With coins of 1, 4 and 5, taking the largest coin first makes 8 with four coins, where two are enough. With coins of 1, 2, 5 and 10 the same method always gives the fewest. What does the table do that the greedy method does not?
        options:
          - "It tries the coins in a better order."
          - "The greedy method commits to its first choice and never reconsiders. The table computes the best answer for every smaller amount, and so compares every possible last coin, each followed by the best possible remainder."
          - "It uses more memory, which makes it more accurate."
          - "Nothing. They are the same method, and 1, 4 and 5 are simply bad coins."
        answer: 1
        explanation: |
          A greedy method makes the choice that looks best now and lives with it. Sometimes that can be proved right, and for coins of 1, 2, 5 and 10 it can. Often it is not, and nothing in the method warns you. The table makes no early commitment. For the amount 8 it weighs a last coin of 1, 4 or 5 against the best that can be done with the 7, 4 or 3 that remain. This costs more, one entry for every amount, and it is always right. When you meet a problem of choosing the best, the first question is whether a greedy choice can be proved safe. If it cannot, a table is the reliable method.
        hints:
          - What does the greedy method do after taking the 5?
          - Which entries does the table's entry for 8 look at?
          - Does the table ever commit to a coin before seeing what remains?
    - question:
        id: work-one-row
        type: choice
        system: s2
        prompt: |
          The table of routes for a grid of 10000 rows and 10000 columns has a hundred million entries, too many to keep comfortably. How much of the table is needed at any moment?
        options:
          - "All of it, since the answer depends on every entry."
          - "One row. An entry looks only at the entry above it and the entry to its left, so while a row is being filled only the previous row and the row itself are needed, and the new row can overwrite the old one place by place."
          - "Only the last entry."
          - "Half of it, since the table is symmetric."
        answer: 1
        explanation: |
          The answer does depend on every entry, and every entry is computed. But an entry is needed only until the row below it has been filled. So keep a single list of 10000 numbers. Moving along it from the left, the old value at a position is the entry above, the value just written to its left is the entry to the left, and their sum replaces the old value. Time is unchanged at a hundred million additions, and space falls from a hundred million numbers to ten thousand. The same saving applies to edit distance, whose entries look one row back and no further. The price is that the full table is gone, and with it the means of tracing back **which** route or which edits gave the answer, so when you need the solution itself and not just its cost, you keep the table.
        hints:
          - Which entries does one entry look at?
          - Once a row has been filled, is the row two above it ever looked at again?
          - What would be lost by throwing away old rows?
  connections:
    - text: |
        The puzzle asked where the time goes when routes across a grid are counted by recursion, and how to get the answer in 900 additions. The time goes on answering the same 900 questions sixty million million times over. Write each answer down when it is first found, on squared paper or in a dictionary, and each is computed once. The number of routes across a grid of 30 by 30 is 30067266499541040, and a table finds it in 841 additions.

        The repair used things you had. The recurrence is the recursion of [[e1.recursion]] and the failed `fib` of [[e3.divide-and-conquer]], untouched. The memory is the dictionary of [[e3.hash-tables]], whose constant-time lookup is what makes remembering cheaper than recomputing. And the claim that a table is filled correctly is induction: each entry is right because the earlier entries it looks at are right.

        One step of the recipe passed quickly: the **order** of filling. Whatever an entry needs must be there before it. For a grid, row by row is plainly safe. But picture the entries as nodes, with an arrow from each entry to the entries that need it. That is a directed graph, of the kind met in [[e3.graphs-and-traversal]], and a safe order of filling is an order of its nodes in which every arrow points forward. When the dependencies are not a tidy grid, as in the web of operations inside a neural network, finding such an order is a problem in itself, and you will solve it in [[e3.topological-sort]]. When you later compute how a network's output depends on each of its millions of numbers, the method will be this lesson's: each intermediate result is computed once, stored, and reused by everything that needs it.

        Before that, a loose end in the accounting. Three times in this cluster a cost was called $O(1)$ with a quiet qualification: appending to a list, though the array beneath it must sometimes be copied to a larger one, and inserting into a hash table, though the table must sometimes be rebuilt. An operation that is usually cheap and occasionally very dear needs a more careful kind of count, one that spreads the dear cases over the cheap. That is the next lesson, [[e3.amortised-analysis]].
