          - How many choices does it have at each step?
    - question:
        id: drill-entries
        type: numeric
        system: s1
        prompt: |
          How many entries has the table of routes for a grid of 20 rows and 50 columns?
        answer: "1000"
        explanation: One entry for each cell, $20 \times 50$.
        hints:
          - There is one entry for each cell of the grid.
          - Rows times columns.
    - question:
        id: drill-coins-seven
        type: numeric
        system: s1
        prompt: |
          What is the fewest coins that make 7?
        answer: "3"
        explanation: $5 + 1 + 1$. The entries for 6, 3 and 2 are 2, 3 and 2, and the least of them plus one is 3.
        hints:
          - The last coin is 1, 4 or 5. What amount was there before it?
          - Look up the entries for 6, 3 and 2 in the table of the lesson.
    - question:
        id: drill-coins-twelve
        type: numeric
        system: s1
        prompt: |
          What is the fewest coins that make 12?
        answer: "3"
        explanation: $4 + 4 + 4$. Taking the largest coin first gives $5 + 5 + 1 + 1$, which is four.
        hints:
