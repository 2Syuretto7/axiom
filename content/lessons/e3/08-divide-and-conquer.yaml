        explanation: |
          Every inversion is of one of three kinds: both items in the left half, both in the right, or one in each. The recursion counts the first two kinds. For the third, look at the moment the merge takes an item from the right half. It is taken because it is smaller than `left[i]`, and since the left half is sorted, it is smaller than everything from position `i` onwards as well: `len(left) - i` items, each of which stood before it in the original list. Each of those pairs is an inversion, and all are counted with one addition. Adding 1 counts a single pair where there are many. Adding `i` counts the items of the left half already placed, which are the ones **not** inverted with it. Sorting the halves first does not disturb the count, since sorting a half moves no item across the middle. The recurrence is that of merge sort, $T(n) = 2T(n/2) + n$, so the count costs $n \log n$ where checking every pair costs $n^2$. This is the remark from the sorting lesson made exact: one comparison in a merge accounts for many inversions.
    - question:
        id: fix-power
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `power(x, n)` should compute $x^n$ for a whole number $n \ge 0$ with about $\log_2 n$ multiplications. It should print `1024 243 1`. It prints `256 9 1`. Fix it, keeping it fast.
        starter: |
          def power(x, n):
              if n == 0:
                  return 1
              half = power(x, n // 2)
              return half * half

          print(power(2, 10), power(3, 5), power(7, 0))
        solution: |
          def power(x, n):
              if n == 0:
                  return 1
              half = power(x, n // 2)
              if n % 2 == 0:
                  return half * half
              return half * half * x

          print(power(2, 10), power(3, 5), power(7, 0))
        tests: |
          for _x, _n in [(2, 10), (3, 5), (7, 0), (5, 1), (2, 2), (2, 3), (10, 6), (3, 13), (2, 64), (2, 100), (-2, 5), (1, 999)]:
              assert power(_x, _n) == _x ** _n, str(_x) + " to the power " + str(_n) + " is " + str(_x ** _n) + ". You returned " + repr(power(_x, _n))
          assert abs(power(1.5, 4) - 5.0625) < 1e-9, "1.5 to the power 4 is 5.0625. You returned " + repr(power(1.5, 4))
          class _Counted:
              used = 0
              def __init__(self, v):
                  self.v = v
              def __mul__(self, other):
                  _Counted.used += 1
                  return _Counted(self.v * (other.v if isinstance(other, _Counted) else other))
              def __rmul__(self, other):
                  _Counted.used += 1
                  return _Counted(self.v * other)
          _r = power(_Counted(3), 1000)
          assert _r.v == 3 ** 1000, "3 to the power 1000 came out wrong"
          assert _Counted.used <= 40, "3 to the power 1000 should need about 20 multiplications. Yours used " + str(_Counted.used)
          assert output.strip() == "1024 243 1", "The program should print 1024 243 1"
        wrong:
          - |
            def power(x, n):
                result = 1
                for k in range(n):
                    result = result * x
                return result

            print(power(2, 10), power(3, 5), power(7, 0))
          - |
            def power(x, n):
                if n == 0:
                    return 1
                if n % 2 == 0:
                    return power(x, n // 2) * power(x, n // 2)
                return power(x, n // 2) * power(x, n // 2) * x

            print(power(2, 10), power(3, 5), power(7, 0))
          - |
            def power(x, n):
                if n == 0:
                    return 1
                half = power(x, n // 2)
                return half * half * x

            print("1024 243 1")
          - |
            def power(x, n):
                if n == 0:
                    return 1
                half = power(x, n // 2)
                if n % 2 == 0:
                    return half * half
                return half * half + x

            print("1024 243 1")
        explanation: |
          `n // 2` rounds down, so for an odd `n` the half-power squared is $x^{n-1}$, one factor of $x$ short. The call `power(2, 10)` passes through $n = 5$ and $n = 1$, both odd, and loses a factor of 2 at each, giving 256. The repair is to multiply by `x` once more when `n` is odd. Two tempting repairs are no repairs. A loop that multiplies `n` times is correct and has thrown away the method. Calling `power(x, n // 2)` twice in one line is also correct, and it turns the recurrence $T(n) = T(n/2) + 2$ into $T(n) = 2T(n/2) + 1$: two pieces of half the size, the bottom level dominates, and the cost is back to about $n$ multiplications. Compute the half once and keep it in a variable.
    - question:
        id: work-strassen
        type: choice
        system: s2
        prompt: |
          Multiplying two $n \times n$ grids of numbers, which you will meet as matrices, costs $n^3$ by the direct method. Split each grid into four quarters of side $n/2$, and the direct method needs 8 products of quarters, with $n^2$ additions to combine. Volker Strassen found a way to manage with 7 products. What are the two costs?
        options:
          - "8 products give $n^3$ and 7 products give $n^2$."
          - "8 products give $n^{\\log_2 8} = n^3$, no gain. 7 products give $n^{\\log_2 7} \\approx n^{2.81}$. In both, the pieces multiply faster than the factor of 4 by which the combining cost shrinks, so the bottom level dominates."
          - "Both give $n^2 \\log n$, since combining costs $n^2$."
          - "7 products give $\\frac{7}{8} n^3$, a saving of one eighth."
        answer: 1
        explanation: |
          Here $a$ is 8 or 7, $b = 2$ and $d = 2$, so $b^d = 4$. Both 8 and 7 exceed 4, the levels grow going down, and the cost is the number of leaves, $n^{\log_2 a}$. With 8 that is $n^3$: as with the four-product multiplication, splitting alone gains nothing. With 7 the exponent drops to about 2.81. This is Karatsuba's discovery over again, one fewer product at every level of the recursion, compounded over all the levels. A saving of one eighth would be the result of saving one product once. Saving it at every level changes the exponent. Multiplying grids of numbers is the main work of a neural network, which is why the question of how fast it can be done is still studied.
    - question:
        id: work-fib
        type: choice
        system: s2
        prompt: |
          `fib(n)` returns `fib(n - 1) + fib(n - 2)`, and `fib(40)` makes over three hundred million calls. Merge sort also makes two recursive calls, and sorts a million items with about two million. What is the essential difference?
        options:
          - "Addition is slower than merging."
          - "Merge sort's two pieces are half the size and share nothing, so the tree is 20 levels deep and every piece is a different problem. The pieces of `fib` are smaller by only 1 and 2, so the tree is 40 levels deep, and they overlap: there are only 41 different problems, each solved over and over."
          - "`fib` has no base case."
          - "Merge sort uses a loop inside, and loops are faster."
        answer: 1
        explanation: |
          Two things separate them. First, the depth. Halving reaches the bottom in $\log_2 n$ levels, while subtracting 1 takes $n$ levels, and a tree that doubles for $n$ levels is exponential in $n$. Second, the overlap. The two halves of a list have no item in common, so no work is repeated. But `fib(38)` is needed by `fib(40)` directly and again by `fib(39)`, and `fib(37)` is needed three times, and the repeats multiply all the way down. Three hundred million calls are being spent on forty-one different questions. Divide and conquer has nothing to say about that. The cure is plain once it is put that way: answer each question once and remember the answer.
    - question:
        id: work-median
        type: choice
        system: s2
        prompt: |
          To find the middle value of an unsorted list, a method picks an item, splits the list into the items smaller and the items larger in one pass costing $n$, and then continues in only the part that must hold the middle value. Suppose each split leaves a part about half as long. What is the cost?
        options:
          - "About $n \\log_2 n$, since it is like sorting."
          - "About $2n$. The recurrence is $T(n) = T(n/2) + n$, the levels cost $n, n/2, n/4, \\dots$, and these add to less than $2n$."
          - "About $\\log_2 n$, like binary search."
          - "About $n^2$."
        answer: 1
        explanation: |
          One piece of half the size, with a combining cost of $n$: $a = 1$, $b = 2$, $d = 1$. Since $a < b^d$, the top level dominates and the cost is about $n$. The middle value is found without sorting, and for less than the cost of sorting. Compare the three methods that halve. Binary search keeps one half and pays 1 per level: $\log n$. This method keeps one half and pays $n$ on the first level, with each later level cheaper: $n$. Merge sort keeps both halves and pays $n$ on every level: $n \log n$. The same three numbers, pieces, size and combining cost, decide them all.
  connections:
    - text: |
        The puzzle asked what could be faster than multiplying every digit by every digit, and what decides whether splitting a problem pays. Splitting a product into four half-length products gains nothing, because the pieces quadruple exactly as fast as their cost falls. Karatsuba saw that the middle term can be had from one product in place of two, and three pieces of half the size cost $n^{\log_2 3}$, about $n^{1.585}$. Whether splitting pays is a race between the number of pieces and the factor by which each shrinks, and you can read off the winner by costing one level of the tree of calls and seeing whether the levels grow, shrink or stay equal.

        The methods of the last two lessons are now cases of one table. Binary search from [[e3.binary-search]] keeps one half and combines for nothing. Merge sort from [[e3.sorting]] keeps two and combines for $n$, the balanced case in which every level costs the same. The tool throughout was the logarithm as a count of halvings, and the correctness of each method rested on the leap of faith of [[e1.recursion]].

        You will meet the same analysis wherever something is halved: in the fast Fourier transform, which is two pieces of half the size with a linear combining step and so costs $n \log n$, and in the layers of a network that repeatedly halve an image.

        The lesson ended on a method that fails. `fib` divides and combines, and takes three hundred million calls to answer forty-one questions, because its pieces overlap. Problems like that are everywhere: the best way to break a sentence into words, the cheapest route through a grid, the smallest number of edits that turn one string into another. Each has pieces that share their own pieces. The remedy is to solve each piece once and write its answer in a table, and it turns exponential costs into small polynomial ones. That is the next lesson, [[e3.dynamic-programming]].
