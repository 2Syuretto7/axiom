                    return items, 0
                middle = len(items) // 2
                left, in_left = sort_and_count(items[:middle])
                right, in_right = sort_and_count(items[middle:])
                count = in_left + in_right
                merged = []
                i = 0
                j = 0
                while i < len(left) and j < len(right):
                    if left[i] <= right[j]:
                        merged.append(left[i])
                        i += 1
                    else:
                        merged.append(right[j])
                        j += 1
                        count += len(left)
                return merged + left[i:] + right[j:], count

