        prompt: |
          Five jobs: P needs nothing, Q needs P, and X, Y and Z need each other in a ring. How many jobs does Kahn's algorithm write down before its queue is empty?
        answer: "2"
        explanation: P and then Q. The three in the ring never reach a count of zero.
        hints:
