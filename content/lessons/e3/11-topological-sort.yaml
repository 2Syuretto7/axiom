        solution: |
          from collections import deque

          def order(needs):
              waiting = {job: len(needs[job]) for job in needs}
              unlocks = {job: [] for job in needs}
              for job in needs:
                  for need in needs[job]:
                      unlocks[need].append(job)
              ready = deque([job for job in needs if waiting[job] == 0])
              done = []
              while len(ready) > 0:
                  job = ready.popleft()
                  done.append(job)
                  for other in unlocks[job]:
                      waiting[other] -= 1
                      if waiting[other] == 0:
                          ready.append(other)
              return done

          needs = {
              "data": [],
              "clean": ["data"],
              "split": ["clean"],
              "model": [],
              "train": ["split", "model"],
              "test": ["train", "split"],
          }
          print(" ".join(order(needs)))
        tests: |
          def _check(needs, name):
              got = order({job: list(needs[job]) for job in needs})
              assert sorted(got) == sorted(needs), "For " + name + " the order should hold every job exactly once. You returned " + repr(got)
              place = {job: k for k, job in enumerate(got)}
              for job in needs:
                  for need in needs[job]:
                      assert place[need] < place[job], "For " + name + ", " + repr(need) + " must come before " + repr(job) + ". You returned " + repr(got)
          _check({"data": [], "clean": ["data"], "split": ["clean"], "model": [], "train": ["split", "model"], "test": ["train", "split"]}, "the six jobs")
          _check({"a": ["b"], "b": ["c", "d"], "c": [], "d": []}, "a needs b, and b needs c and d")
          _check({"p": [], "q": ["p"], "r": ["p", "q"], "s": ["p", "q", "r"]}, "four jobs each needing all before it")
          _check({"x": [], "y": [], "z": ["x", "y"]}, "z needs x and y")
          _check({"m": []}, "a single job")
          assert output.strip() == "data model clean split train test", "The program should print data model clean split train test"
