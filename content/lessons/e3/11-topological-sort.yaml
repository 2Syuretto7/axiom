    - question:
        id: work-leftover
        type: choice
        system: s2
        prompt: |
          Kahn's algorithm stops with its queue empty and 40 of 100 jobs never written down. Why must the needs contain a cycle?
        options:
          - "Because 40 is even."
          - "Each of the 40 has an unmet need, and that need is itself one of the 40, since everything written down has been counted off. Walk from any leftover job to an unmet need of it, and on to a need of that. The walk can always continue and has only 40 jobs to visit, so it must return to a job it has visited, which closes a cycle."
          - "Because the queue should never be empty."
          - "It need not. The algorithm may simply have taken the jobs in a bad order."
        answer: 1
        explanation: |
          A job is left over only if its count never reached zero, so at least one of its needs was never written down, and that need is a leftover job too. The leftover jobs therefore each point back to another of their number. Follow those pointers and you can never be stuck, yet you have only finitely many jobs to step on, so some job is stepped on twice, and the steps between its two visits are a cycle of needs. The order in which ready jobs are taken cannot matter: taking a ready job never makes another job less ready. So a short result is proof of a cycle, and a full result is proof that there is none.
        hints:
          - What must be true of a job whose count never reached zero?
          - Is the job it waits for written down, or left over?
          - Keep walking from a job to something it waits for. What must eventually happen among finitely many jobs?
    - question:
        id: work-backward
        type: choice
        system: s2
        prompt: |
          A network computes $s = a + b$, then $t = b + 1$, then $y = s \times t$. To find how much $y$ changes when $b$ changes, the effect is passed backwards along the arrows: $y$ tells $s$ and $t$ how much each matters, and they in turn tell their inputs. $b$ feeds both $s$ and $t$. In what order must the nodes be handled?
        options:
          - "In any order, since the arrows show where everything goes."
          - "In the reverse of a topological order: $y$ first, then $s$ and $t$, and $b$ only after both, because $b$'s total is the sum of what arrives from $s$ and from $t$, and it must be complete before $b$ is dealt with."
          - "In a topological order, $a$ and $b$ first, as when computing $y$."
          - "In alphabetical order."
        answer: 1
        explanation: |
          Going forwards, a node can be computed when all its inputs are ready, which is a topological order. Going backwards the arrows are turned round: a node can be dealt with when everything that **uses** it has reported how much it matters. That is a topological order of the reversed graph, which is the reverse of a topological order of the original. $b$ has two users, and handling it after hearing from only one of them would pass on half the story. This is the count of unmet needs again, with "needs" meaning the nodes that use this one. When you build a system that differentiates a computation automatically, its backward pass will begin by computing exactly this order.
        hints:
          - Which nodes use b?
          - What must have happened to both of them before b's total is known?
          - Going backwards, which node has nothing waiting on it at the start?
  connections:
    - text: |
        The puzzle asked for an order in which to do jobs that depend on each other, found in one pass, and for a way to tell when no order exists. Count each job's unmet needs. Put the jobs with none in a queue. Take a job, write it down, and lower the count of each job it unlocks, queueing any that reach zero. Each job and each arrow is handled once, so the cost is $O(\lvert V \rvert + \lvert E \rvert)$. If jobs remain when the queue is empty, they wait on each other in a cycle and no order exists.

        The parts were all in your hands. The queue and the loop are the breadth-first search of [[e3.graphs-and-traversal]], with a node admitted on its last sighting in place of its first. The count of the cost is the item-by-item accounting of [[e3.amortised-analysis]]. And the order is what [[e3.dynamic-programming]] took for granted: a memoised recursion follows a topological order of its sub-problems without being told to, and a table filled bottom up needs one supplied.

        You computed finishing times by taking each job after its needs, with a maximum over the arrows coming in. Replace the maximum by a minimum and the same pass finds **shortest** routes through a DAG, where the arrows carry lengths. That works because a DAG has an order in which every node is settled before anything that depends on it.

        A road map has no such order. Its roads run both ways and its routes go round in circles, so there is no node that is safely first, and no order that can be fixed in advance. Yet shortest routes on a map are found billions of times a day. The method discovers an order as it goes, by always settling next the place that is **nearest**, and to find the nearest it uses the heap you built in [[e3.trees-and-heaps]]. And when the map is too vast to search, as the space of all sentences a language model might write is, a search is used that keeps only the few most promising routes at each step. Both are in the next lesson, the last of this cluster: [[e3.shortest-paths-and-beam-search]].
