        explanation: |
          The faulty line adds a job to the queue every time **one** of its needs is done. train is queued when model is done, while it still waits for split, and is written down too early. It is queued again when split is done, and written down a second time. The count `waiting[other]` is kept up to date and then ignored. A job is ready only when that count reaches zero, which happens exactly once, when the last of its needs is done: so the test `if waiting[other] == 0` cures the wrong order and the repeats together. Refusing to queue a job that is already queued or done removes the repeats and leaves train before split. This is the one place where the method differs from breadth-first search, which queues a node the first time it is seen.
