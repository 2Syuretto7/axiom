        type: numeric
        system: s2
        prompt: |
          How many different topological orders have the six jobs of the puzzle?
        answer: "4"
        explanation: |
          Five of the jobs are forced into a chain: data, clean, split, train, test. clean needs data, split needs clean, train needs split, and test needs train. The only freedom is where model goes, and its one constraint is to come before train. It can be placed first, or after data, or after clean, or after split: four places, four orders. In general the number of orders measures how loosely the arrows constrain the jobs. A chain has one, and jobs with no arrows have every arrangement. Jobs that can go in either order are also jobs that two workers could do at the same time.
