concept: e3.topological-sort
minutes: 80
claim: You can describe tasks and their prerequisites as a directed graph, find an order in which nothing comes before what it needs by repeatedly taking a task with no unmet needs, show that this costs $O(\lvert V \rvert + \lvert E \rvert)$, explain why it succeeds exactly when there is no cycle, and use such an order to compute over a graph of dependencies.
recalls: [e3.amortised-analysis]
uses: [e3.graphs-and-traversal, e3.trees-and-heaps, e3.dynamic-programming, e3.stacks-and-queues, e3.hash-tables, e3.sorting, e1.recursion, e1.comprehensions-and-iterators, e1.complexity-and-big-o, e0.dictionaries-and-sets, e0.lists-and-tuples, e0.loops, e0.functions]
leads: [e3.shortest-paths-and-beam-search]
starter: |
  # Scratch space. Six jobs of a machine-learning project. needs[job] lists what must be done first.
  # This plan looks through all the jobs for one that can be done now, does it, and starts again.
  needs = {
      "data": [],
      "clean": ["data"],
      "split": ["clean"],
      "model": [],
      "train": ["split", "model"],
      "test": ["train", "split"],
  }

  done = []
  looks = 0
  while len(done) < len(needs):
      for job in sorted(needs):
          looks += 1
          if job not in done and all([need in done for need in needs[job]]):
              done.append(job)
              break
  print(done)
  print(looks, "looks")
parts:
  recall:
    - text: |
        [[e3.amortised-analysis]] left you with a habit of counting: do not ask how long one trip round a loop can take, ask how many times any one item is handled in the whole run. Today's method is counted that way. It also settles a question left open when you filled tables: in what order? Three quick pulls first.
  puzzle:
    - text: |
        A machine-learning project has six jobs. The **data** must be collected before it is **cleaned**. Cleaned data is **split** into a part for training and a part for testing. A **model** must be written, which needs nothing. To **train**, you need the split and the model. To **test**, you need the trained model and the split.

        **In what order can one person do the six jobs?**

        With six, you can see an answer: data, clean, split, model, train, test. So can the starter, which looks through the jobs for one whose needs are all done, does it, and starts looking again. Run it. It finds an order in 21 looks, and each look itself searches the list of jobs done.

        Now make it real. The lessons of this course are joined by several hundred arrows saying "this before that". A program of ten thousand files states for each file which others it uses, and they must be built in an order that respects every one of those statements. A neural network is a web of many thousands of operations, each needing the results of others. A spreadsheet has a million cells whose formulas refer to each other. In every case the starter's plan of looking through everything, again and again, costs about the square of the number of jobs or worse.

        And there is a worse possibility. Suppose someone has written that A needs B, B needs C, and C needs A. Then there is **no** order. The starter would search for ever.

        **How do you find an order for a hundred thousand jobs in one pass? And how can a program tell that no order exists?**
  intuition:
    - text: |
        Draw the jobs as nodes, and an arrow from each job to every job that needs it. Then an acceptable order is a way of writing the nodes in a row so that **every arrow points forwards**.

        Which job can be written first? One with **no arrow coming in**. It needs nothing. Here there are two, data and model.

        Write one down. Now imagine it erased from the picture, together with the arrows leaving it. Those arrows were needs, and they have been met. Perhaps some other node now has no arrow coming in. It has become ready.

        That is the whole method: **take any node with no incoming arrow, write it down, erase it and its outgoing arrows, and repeat.** Step through it. Where two jobs are ready, the figure takes the one earlier in the alphabet.
    - figure: topo-order
    - text: |
        The figure's order is data, clean, model, split, train, test. Taking model first would have been as good. There is usually more than one acceptable order, and the method finds one of them.

        Two details turn this into a fast program. First, nothing need actually be erased. Keep for each job a **count of the needs not yet met**. Finishing a job lowers the count of each job it points to, and a job whose count reaches zero is ready. Second, keep the ready jobs in a queue, so that no searching is ever done. Each arrow is then looked at exactly once, at the moment its tail is finished.
  derivation:
    - text: |
        **The terms.** A directed graph with no cycle is called a **directed acyclic graph**, or **DAG**. A **topological order** of a directed graph is a list of all its nodes in which, for every arrow from $u$ to $v$, $u$ comes before $v$. The number of arrows coming into a node is its **in-degree**, and that is the count of unmet needs.

        **Two ways to write the graph down.** The puzzle gave, for each job, what it **needs**: its incoming arrows. The method wants, for each job, what it **unlocks**: its outgoing arrows, the adjacency list of [[e3.graphs-and-traversal]]. One pass turns the first into the second.

        ```python
        from collections import deque

        def order(needs):
            waiting = {job: len(needs[job]) for job in needs}
            unlocks = {job: [] for job in needs}
            for job in needs:
                for need in needs[job]:
                    unlocks[need].append(job)

            ready = deque([job for job in needs if waiting[job] == 0])
            done = []
            while len(ready) > 0:
                job = ready.popleft()
                done.append(job)
                for other in unlocks[job]:
                    waiting[other] -= 1
                    if waiting[other] == 0:
                        ready.append(other)
            return done
        ```

        `waiting[job]` is the number of needs of `job` not yet done. `ready` holds the jobs whose count is zero and which have not yet been written down. This is known as **Kahn's algorithm**.

        Look at its shape. It is the breadth-first search of [[e3.graphs-and-traversal]], with one change: a node joins the queue not when it is first **seen** but when it has been seen from **every** direction, that is, when its last need is met.

        **Is the order right?** A job is appended to `ready` only when its count reaches zero. The count starts at the number of its needs and falls by one each time one of them is written into `done`. So when a job becomes ready, every one of its needs is already in `done`, and it is written after them all. Every arrow points forwards.

        **The cost.** Follow the items, as in [[e3.amortised-analysis]]. Each job enters the queue once and leaves once. Each arrow is looked at once, in the inner loop, when its tail leaves the queue. Building `unlocks` handles each arrow once more. So the cost is

        $$O(\lvert V \rvert + \lvert E \rvert),$$

        with $\lvert V \rvert$ jobs and $\lvert E \rvert$ arrows. A hundred thousand jobs with half a million arrows are ordered in well under a second.
    - question:
        id: derive-kahn-trace
        type: order
        system: s2
        prompt: The method runs on the six jobs of the puzzle. When several jobs are ready, the one earliest in the alphabet is taken. Put the jobs in the order they are written down.
        steps:
          - "data"
          - "clean"
          - "model"
          - "split"
          - "train"
          - "test"
        explanation: |
          At the start data and model are ready, and data is earlier in the alphabet. Finishing data makes clean ready, and clean comes before model. Finishing clean makes split ready, and now model is the earlier of the two. Then split, which lowers the count of train to zero, since model is already done, and the count of test to one. Then train, and last test.
        hints:
          - At the start, which jobs need nothing? Take the one earlier in the alphabet.
          - After data, the ready jobs are clean and model.
          - train needs both split and model, so it becomes ready only when the second of them is done.
    - text: |
        **When there is no order.** Suppose the needs contain a cycle: A needs B, B needs C, C needs A. No order can exist, since each of the three would have to come before itself.

        What does the method do? None of the three ever reaches a count of zero, because each waits on another of the three. They never enter the queue. The queue empties, the loop ends, and `done` is **short**.

        So the method reports a cycle by itself: when it finishes, compare `len(done)` with the number of jobs.

        Is that test exact? It must be shown that when there is **no** cycle, nothing is left behind. Suppose some jobs are left when the queue empties. Each of them has a count above zero, so it has an unmet need, which is another leftover job. Start at any leftover job and walk backwards to one of its unmet needs, and from there to one of its, and so on. The walk never has to stop, since every leftover job has an unmet need. But there are only finitely many jobs, so the walk must come to a job it has visited before. That closes a cycle. So

        $$\text{jobs are left over} \iff \text{the graph has a cycle}.$$

        A directed graph has a topological order exactly when it is a DAG, and one pass both finds the order and proves there is one.

        This is how a package installer tells you that two libraries each require the other, and how a spreadsheet detects a formula that refers to itself by a roundabout way.

        **The other way: needs first.** There is a second method, and you have in fact already used it. To do a job: first do everything it needs, then do the job, and never do anything twice.

        ```python
        def do(job, needs, seen, done):
            if job in seen:
                return
            seen.add(job)
            for need in needs[job]:
                do(need, needs, seen, done)
            done.append(job)
        ```

        Call `do` on every job and `done` is a topological order. This is the depth-first search of [[e3.graphs-and-traversal]], run along the arrows backwards, with each job written down as the search **leaves** it.

        And it is exactly the memoised recursion of [[e3.dynamic-programming]]. There, `seen` was the dictionary of answers, the needs of an entry were the smaller entries in its recurrence, and "written down" meant "computed". A memoised recursion computes its entries in a topological order of their dependencies, without anyone having to say what the order is. That is why top-down dynamic programming needs no thought about the order of filling, and why bottom-up needs some: bottom up, **you** must supply a topological order.

        The recursive method is shorter. It does not detect cycles unless more is added, and on a long chain of needs it runs out of room for waiting calls. Kahn's algorithm has neither fault.

        **Computing along the order.** A topological order is seldom the goal. It is what lets you **compute** something for every node from the values of the nodes it depends on, each once.

        Suppose each job takes some hours, and there are as many workers as you like, so that jobs not depending on each other can be done at once. When can each job finish at the earliest? A job starts when the **last** of its needs finishes:

        $$\text{finish}(j) = \text{hours}(j) + \max_{n \,\in\, \text{needs}(j)} \text{finish}(n),$$

        with the maximum taken as 0 for a job with no needs. Take the jobs in a topological order and every value on the right is ready when wanted. This is a table filled in dependency order, dynamic programming on a graph that is not a grid.

        The same pattern runs a neural network. Its operations form a DAG. To compute the output, the operations are evaluated in a topological order, each from the results of its inputs. And to find how the output depends on every number inside, which is how a network learns, the same graph is walked in the **reverse** of that order, so that everything which depends on a node has been dealt with before the node itself. You will build exactly that.
    - question:
        id: derive-finish
        type: numeric
        system: s2
        prompt: |
          The jobs take these hours: data 2, clean 3, split 1, model 4, train 8, test 1. With as many workers as needed, at what hour does **train** finish at the earliest, counting from 0?
        answer: "14"
        explanation: |
          Work in a topological order. data finishes at 2, clean at $2 + 3 = 5$, split at $5 + 1 = 6$, and model, which needs nothing, at 4. train needs split and model, and can start when the later of them finishes, at hour 6, so it finishes at $6 + 8$. The model was ready at 4 and had to wait: the chain through the data decides the time. test then finishes at 15, though the six jobs contain 19 hours of work, because the model was written while the data was being prepared.
        hints:
          - Find when data, clean and split finish, each starting when the one before ends.
          - When does model finish? Which of split and model is the later?
          - train starts when the later of its two needs finishes, and runs for 8 hours.
  formal:
    - text: |
        **DAG.** A directed graph with no cycle.

        **Topological order.** A list of all the nodes of a directed graph in which every arrow goes from an earlier node to a later one. It exists exactly when the graph is a DAG, and is in general not unique.

        **In-degree.** The number of arrows coming into a node. The in-degrees of a graph add up to its number of arrows.

        **Kahn's algorithm.** Compute every in-degree. Put the nodes of in-degree 0 in a queue. Repeatedly remove a node from the queue, append it to the order, and lower the in-degree of each node it points to, adding to the queue any that reach 0. Cost $O(\lvert V \rvert + \lvert E \rvert)$. If the order ends with fewer than $\lvert V \rvert$ nodes, the graph has a cycle, and otherwise the order is topological.

        **Depth-first method.** Visit each node once. On visiting a node, first visit everything it needs, then append it. On a DAG the result is a topological order.

        **Computing on a DAG.** A value defined for each node in terms of the values of the nodes it depends on can be computed for all nodes in $O(\lvert V \rvert + \lvert E \rvert)$ by taking the nodes in topological order.
