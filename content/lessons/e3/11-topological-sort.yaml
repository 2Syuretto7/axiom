  work:
    - text: Slower now. For each graph, say which way the arrows point and what a count of zero means, before you trace or write anything.
    - question:
        id: write-order
        type: code
        mode: write
        system: s2
        prompt: |
          Write `order(needs)`. `needs` is a dictionary from each job to the list of jobs that must be done before it, and every job mentioned is a key. Return a list of all the jobs in an order in which each comes after everything it needs. If no such order exists, because the needs go round in a cycle, return `None`. Use counts of unmet needs and a queue, so that each need is looked at once.
        starter: |
          from collections import deque

          def order(needs):
              # Replace the next line with your own.
              return list(needs)

          needs = {
              "test": ["train", "split"],
              "train": ["split", "model"],
              "model": [],
              "split": ["clean"],
              "clean": ["data"],
              "data": [],
          }
          print(order(needs))
        solution: |
          from collections import deque

          def order(needs):
              waiting = {job: len(needs[job]) for job in needs}
              unlocks = {job: [] for job in needs}
              for job in needs:
                  for need in needs[job]:
                      unlocks[need].append(job)
              ready = deque([job for job in needs if waiting[job] == 0])
              done = []
              while len(ready) > 0:
                  job = ready.popleft()
                  done.append(job)
                  for other in unlocks[job]:
                      waiting[other] -= 1
                      if waiting[other] == 0:
                          ready.append(other)
              if len(done) < len(needs):
                  return None
              return done

          needs = {
              "test": ["train", "split"],
              "train": ["split", "model"],
              "model": [],
              "split": ["clean"],
              "clean": ["data"],
              "data": [],
          }
          print(order(needs))
        tests: |
          def _check(needs, name):
              got = order({job: list(needs[job]) for job in needs})
              assert got is not None, "For " + name + " an order exists, and you returned None"
              assert sorted(got) == sorted(needs), "For " + name + " the order should hold every job exactly once. You returned " + repr(got)
              place = {job: k for k, job in enumerate(got)}
              for job in needs:
                  for need in needs[job]:
                      assert place[need] < place[job], "For " + name + ", " + repr(need) + " must come before " + repr(job) + ". You returned " + repr(got)
          _check({"test": ["train", "split"], "train": ["split", "model"], "model": [], "split": ["clean"], "clean": ["data"], "data": []}, "the six jobs of the puzzle")
          _check({"a": ["b"], "b": ["c", "d"], "c": [], "d": []}, "a needs b, and b needs c and d")
          _check({"z": [], "y": ["z"], "x": ["y"], "w": ["x"]}, "the chain z, y, x, w")
          _check({"p": [], "q": [], "r": []}, "three jobs with no needs")
          _check({"only": []}, "a single job")
          _check({}, "no jobs at all")
          _check({"shoes": ["socks", "trousers"], "socks": [], "trousers": ["pants"], "pants": [], "belt": ["trousers"], "coat": ["shirt", "belt"], "shirt": []}, "getting dressed")
          _check({k: [j for j in range(k) if (k - j) % 3 == 1] for k in range(30)}, "thirty numbered jobs")
          assert order({"a": ["c"], "b": ["a"], "c": ["b"]}) is None, "a needs c, c needs b and b needs a: there is no order, so the answer is None. You returned " + repr(order({"a": ["c"], "b": ["a"], "c": ["b"]}))
          assert order({"p": [], "q": ["p"], "x": ["z"], "y": ["x"], "z": ["y"]}) is None, "When some jobs form a cycle the answer is None, even if other jobs can be done. You returned " + repr(order({"p": [], "q": ["p"], "x": ["z"], "y": ["x"], "z": ["y"]}))
          assert order({"self": ["self"]}) is None, "A job that needs itself can never be done, so the answer is None. You returned " + repr(order({"self": ["self"]}))
          _lines = output.strip().splitlines()
          assert len(_lines) == 1 and _lines[0].startswith("[") and "'test'" in _lines[0], "The program should print the order of the six jobs as a list"
