        explanation: |
          The starter looked only at the left child. After the first pop the value 3 sat at the root with children 5 and 2. The left child, 5, is not smaller than 3, so the loop stopped at once and left 3 above 2. The next pop then returned 3. Sifting down must find the least of three values, the node and **both** children, and swap with the smaller child when the node is not the least. The right child may not exist, so its index is checked against the length before it is read. Removing index 0 with `pop(0)` returns the right value the first time, but it shifts every item left, which breaks the positions the heap property depends on and costs $O(n)$ besides.
    - question:
        id: write-height
        type: code
        mode: write
        system: s2
        prompt: |
          Write `height(tree)` for a binary tree made of `Tree` nodes, where a missing child is `None`. The height of a single node is 0, and the height of the empty tree `None` is $-1$.
        starter: |
          class Tree:
              def __init__(self, value, left, right):
                  self.value = value
                  self.left = left
                  self.right = right

          def height(tree):
              # Replace the next line with your own.
              return 0

          leaf = Tree(9, None, None)
          print(height(Tree(2, Tree(5, leaf, None), Tree(3, None, None))))
        solution: |
          class Tree:
              def __init__(self, value, left, right):
                  self.value = value
                  self.left = left
                  self.right = right

          def height(tree):
              if tree is None:
                  return -1
              return 1 + max(height(tree.left), height(tree.right))

          leaf = Tree(9, None, None)
          print(height(Tree(2, Tree(5, leaf, None), Tree(3, None, None))))
        tests: |
          def _leaf(v):
              return Tree(v, None, None)
          assert height(None) == -1, "The empty tree has height -1. You returned " + repr(height(None))
          assert height(_leaf(1)) == 0, "A single node has height 0. You returned " + repr(height(_leaf(1)))
          assert height(Tree(2, Tree(5, _leaf(9), None), _leaf(3))) == 2, "The longest path from the root goes down two links. You returned " + repr(height(Tree(2, Tree(5, _leaf(9), None), _leaf(3))))
          assert height(Tree(1, _leaf(2), _leaf(3))) == 1, "A root with two leaves has height 1. You returned " + repr(height(Tree(1, _leaf(2), _leaf(3))))
          assert height(Tree(1, None, Tree(2, None, Tree(3, None, _leaf(4))))) == 3, "A chain of four nodes going right has height 3. You returned " + repr(height(Tree(1, None, Tree(2, None, Tree(3, None, _leaf(4))))))
          assert height(Tree(1, Tree(2, Tree(3, _leaf(4), None), None), _leaf(5))) == 3, "The left side is deeper, with height 3. You returned " + repr(height(Tree(1, Tree(2, Tree(3, _leaf(4), None), None), _leaf(5))))
          _full = _leaf(0)
          for _ in range(5):
              _full = Tree(0, _full, _full)
          assert height(_full) == 5, "A full tree built in five doublings has height 5. You returned " + repr(height(_full))
          assert output.strip() == "2", "The program should print 2"
        wrong:
          - "class Tree:\n    def __init__(self, value, left, right):\n        self.value = value\n        self.left = left\n        self.right = right\n\ndef height(tree):\n    if tree is None:\n        return 0\n    return 1 + max(height(tree.left), height(tree.right))\n\nprint(2)\n"
          - "class Tree:\n    def __init__(self, value, left, right):\n        self.value = value\n        self.left = left\n        self.right = right\n\ndef height(tree):\n    if tree is None:\n        return -1\n    return 1 + height(tree.left)\n\nprint(2)\n"
          - "class Tree:\n    def __init__(self, value, left, right):\n        self.value = value\n        self.left = left\n        self.right = right\n\ndef height(tree):\n    if tree is None:\n        return -1\n    return 1 + height(tree.left) + height(tree.right)\n\nprint(2)\n"
          - "class Tree:\n    def __init__(self, value, left, right):\n        self.value = value\n        self.left = left\n        self.right = right\n\ndef height(tree):\n    if tree is None:\n        return -1\n    return 1 + min(height(tree.left), height(tree.right))\n\nprint(2)\n"
          - "class Tree:\n    def __init__(self, value, left, right):\n        self.value = value\n        self.left = left\n        self.right = right\n\ndef height(tree):\n    if tree is None:\n        return -1\n    return max(height(tree.left), height(tree.right))\n\nprint(2)\n"
        explanation: |
          A tree is a root with two smaller trees beneath it, so its height is one link more than the height of the taller of the two. The empty tree is the base case, and giving it height $-1$ is what makes a single node come out as $1 + \max(-1, -1) = 0$. Taking only the left subtree measures one path and misses a deeper right side. Adding the two heights counts something else, and taking the smaller finds the shortest way to a gap. The function visits every node once, so it is $O(n)$. Its shape, a base case for `None` and a combination of the answers for the two children, is the pattern of nearly every function on trees.
    - question:
        id: work-million
        type: numeric
        system: s2
        prompt: |
          A heap holds a million values, and $2^{19} = 524288$ while $2^{20} = 1048576$. What is the height of its tree, and so the greatest number of swaps one insertion or removal can need?
        answer: "19"
        explanation: |
          A complete tree of height $h$ holds between $2^h$ and $2^{h + 1} - 1$ nodes. A million lies between $2^{19}$ and $2^{20}$, so the height is 19. An insertion climbs at most 19 levels and a removal descends at most 19. Had the million values been kept in a sorted list, an insertion would move half a million of them on average. Doubling the heap to two million values raises the height to 20, one more swap.
    - question:
        id: work-top-k
        type: choice
        system: s2
        prompt: |
          To find the 5 **largest** of a million scores, a program keeps a **min**-heap of at most 5 scores. For each score it pushes, and if the heap then holds 6 it pops. Why a min-heap, when the largest are wanted?
        options:
          - "It is a mistake, and a max-heap should be used."
          - "The heap holds the best 5 seen so far, and the one that must be found quickly is the weakest of them, which is the one to throw out when a better score arrives. A min-heap keeps exactly that one at its root."
          - "Because a min-heap is faster than a max-heap."
          - "Because the scores are negative."
        answer: 1
        explanation: |
          At every moment the heap holds the 5 largest scores so far. A new score either displaces the smallest of those 5 or is itself the smallest of the 6 and leaves at once. In both cases the item removed is the minimum of the heap, so the minimum is what needs to be at hand. Each step works on a heap of at most 6 items, a constant amount, so the whole scan is $O(n)$ and uses memory for 6 scores. Sorting all million scores to read off the top 5 would cost $O(n \log n)$ and hold them all. The same device keeps the best few candidates at each step of a search, which you will meet at the end of this cluster.
    - question:
        id: work-search-tree
        type: choice
        system: s2
        prompt: |
          The keys 1, 2, 3, …, 1000 are inserted in that order into a binary search tree with no balancing. What shape results, and what does a search for 1000 cost?
        options:
          - "A full tree of height about 10, and about 10 comparisons."
          - "A chain. Each key is larger than all before it, so it becomes the right child of the previous one. The tree has height 999 and the search makes 1000 comparisons, as a linked list would."
          - "A heap, with 1 at the root."
          - "The insertions fail, because the keys are already sorted."
        answer: 1
        explanation: |
          The search tree rule fixes where each new key goes: to the right of every smaller key. Arriving in increasing order, each key ends up as the right child of the one before, and no node has a left child. The height is $n - 1$, where a full tree would have $\lfloor \log_2 n \rfloor = 9$. The $O(\text{height})$ cost of searching is then $O(n)$. A search tree's shape depends on the order of insertion, and sorted input, which is common, is the worst case. Practical search trees rearrange themselves as they grow to stay shallow. A heap needs none of that: its shape is always the complete tree, and only its values move.
  connections:
    - text: |
        The puzzle asked for a way to add jobs and repeatedly remove the most urgent, without one of the two operations costing $O(n)$. A list that keeps no order is slow to search, and one that keeps full order is slow to insert into. The heap keeps a partial order. Each value is at most the values of its two children, which puts the smallest at the root and promises nothing about the rest.

        That is enough because of the shape. A complete binary tree of $n$ nodes is about $\log_2 n$ levels deep, since each level holds twice as many nodes as the one above. Adding at the bottom or replacing the top can break the rule only along one path, and the repair climbs or descends that path with one swap for each level. Both operations are $O(\log n)$. And because the shape is always the same, the tree needs no links: it lives in an array, with children at $2i + 1$ and $2i + 2$.

        A [[e3.hash-tables]] table finds any key and knows nothing of order. A heap knows the minimum and cannot find anything else quickly. Each structure is fast at the question it was arranged for.

        The heap returns at once. Pushing $n$ values and popping them all yields them in increasing order in $O(n \log n)$ steps, which is a way of sorting, taken up in [[e3.sorting]]. The search tree's habit of discarding half at each comparison is the subject of [[e3.binary-search]]. And a priority queue is the engine of the shortest-path method in [[e3.shortest-paths-and-beam-search]].

        First, the tree itself needs widening. In a tree every node but the root has exactly one parent, so there is one path between any two nodes and no way of going round in a circle. Most networks are not like that. Roads form loops, pages link back to one another, and a lesson in this course can have two prerequisites. Drop the rule of one parent and you have a **graph**. Exploring a graph without getting lost or going round for ever takes the stack and the queue from two lessons ago, and a set of places already seen. That is the next lesson, [[e3.graphs-and-traversal]].
