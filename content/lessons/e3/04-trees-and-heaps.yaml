    - question:
        id: predict-heapq
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import heapq

          jobs = []
          for priority in [5, 2, 8, 1]:
              heapq.heappush(jobs, priority)
          print(heapq.heappop(jobs), heapq.heappop(jobs), len(jobs))
        output: "1 2 2"
        explanation: Whatever order the values were pushed in, each pop removes the smallest remaining, 1 and then 2. Two values are left.
  work:
    - text: Slower now. After every change, ask where the heap property could have been broken, and nowhere else.
    - question:
        id: write-push
        type: code
        mode: write
        system: s2
        prompt: |
          Write `push(heap, value)`. `heap` is a list in min-heap order. Add `value` to it and restore the heap property by sifting up, changing the list in place. Do not sort the list and do not use `heapq`.
        starter: |
          def push(heap, value):
              # Replace the next line with your own.
              heap.append(value)

          heap = [2, 5, 3, 9, 6, 8]
          push(heap, 1)
          print(heap)
        solution: |
          def push(heap, value):
              heap.append(value)
              i = len(heap) - 1
              while i > 0 and heap[(i - 1) // 2] > heap[i]:
                  parent = (i - 1) // 2
                  heap[parent], heap[i] = heap[i], heap[parent]
                  i = parent

          heap = [2, 5, 3, 9, 6, 8]
          push(heap, 1)
          print(heap)
        tests: |
          def _is_heap(xs):
              return all([xs[(i - 1) // 2] <= xs[i] for i in range(1, len(xs))])
          _h = [2, 5, 3, 9, 6, 8]
          push(_h, 1)
          assert _h == [1, 5, 2, 9, 6, 8, 3], "Pushing 1 onto [2, 5, 3, 9, 6, 8] should give [1, 5, 2, 9, 6, 8, 3]. You got " + repr(_h)
          _h = [2, 5, 3, 9, 6, 8]
          push(_h, 7)
          assert _h == [2, 5, 3, 9, 6, 8, 7], "Pushing 7 needs no swaps, since its parent 3 is smaller. You got " + repr(_h)
          _h = [2, 5, 3, 9, 6, 8]
          push(_h, 4)
          assert _h == [2, 5, 3, 9, 6, 8, 4], "Pushing 4 needs no swaps, since its parent 3 is smaller. You got " + repr(_h)
          _h = [1, 5, 2, 9, 6, 8, 3]
          push(_h, 4)
          assert _h == [1, 4, 2, 5, 6, 8, 3, 9], "Pushing 4 onto [1, 5, 2, 9, 6, 8, 3] should swap it past 9 and 5. You got " + repr(_h)
          _h = []
          push(_h, 3)
          assert _h == [3], "Pushing onto an empty heap gives a heap of one. You got " + repr(_h)
          _h = []
          for _v in [5, 9, 7, 2, 10, 3, 8, 1, 6, 4, 4, 0]:
              push(_h, _v)
              assert _is_heap(_h), "After pushing " + str(_v) + " the list is not a heap: " + repr(_h)
          assert sorted(_h) == [0, 1, 2, 3, 4, 4, 5, 6, 7, 8, 9, 10], "No value may be lost or repeated. You have " + repr(sorted(_h))
          assert _h != sorted(_h), "The list should be in heap order, which is weaker than sorted order. Do not sort it"
          assert output.strip() == "[1, 5, 2, 9, 6, 8, 3]", "The program should print [1, 5, 2, 9, 6, 8, 3]"
        wrong:
          - "def push(heap, value):\n    heap.append(value)\n\nprint([1, 5, 2, 9, 6, 8, 3])\n"
          - "def push(heap, value):\n    heap.append(value)\n    i = len(heap) - 1\n    if i > 0 and heap[(i - 1) // 2] > heap[i]:\n        parent = (i - 1) // 2\n        heap[parent], heap[i] = heap[i], heap[parent]\n\nprint([1, 5, 2, 9, 6, 8, 3])\n"
          - "def push(heap, value):\n    heap.append(value)\n    i = len(heap) - 1\n    while i > 0 and heap[i // 2] > heap[i]:\n        parent = i // 2\n        heap[parent], heap[i] = heap[i], heap[parent]\n        i = parent\n\nprint([1, 5, 2, 9, 6, 8, 3])\n"
          - "def push(heap, value):\n    heap.append(value)\n    xs = sorted(heap)\n    for i in range(len(xs)):\n        heap[i] = xs[i]\n\nprint([1, 5, 2, 9, 6, 8, 3])\n"
          - "def push(heap, value):\n    heap.insert(0, value)\n\nprint([1, 5, 2, 9, 6, 8, 3])\n"
        explanation: |
          The new value goes at the end, which keeps the tree complete, and is then compared with its parent at `(i - 1) // 2`. While the parent is larger, the two are swapped and the index moves up. A single swap is not enough: the value 1 had to rise two levels to reach the top. The parent's index must be computed exactly. With `i // 2`, the node at index 2 is taken to have its parent at index 1, when its parent is the root, and the repair goes up the wrong path. Sorting the whole list also gives a valid heap, since a sorted list satisfies the heap property, but it costs $O(n \log n)$ for each insertion where sifting costs $O(\log n)$, which throws away the reason for having a heap.
    - question:
        id: fix-pop
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `pop(heap)` should remove and return the smallest value of a min-heap, leaving a valid heap. Popping three times from the heap below should print `1 2 3`. It prints `1 3 2`. Fix it.
        starter: |
          def pop(heap):
              smallest = heap[0]
              last = heap.pop()
              if len(heap) > 0:
                  heap[0] = last
                  i = 0
                  while 2 * i + 1 < len(heap) and heap[2 * i + 1] < heap[i]:
                      child = 2 * i + 1
                      heap[child], heap[i] = heap[i], heap[child]
                      i = child
              return smallest

          heap = [1, 5, 2, 9, 6, 8, 3]
          print(pop(heap), pop(heap), pop(heap))
        solution: |
          def pop(heap):
              smallest = heap[0]
              last = heap.pop()
              if len(heap) > 0:
                  heap[0] = last
                  i = 0
                  while True:
                      least = i
                      for child in [2 * i + 1, 2 * i + 2]:
                          if child < len(heap) and heap[child] < heap[least]:
                              least = child
                      if least == i:
                          break
                      heap[least], heap[i] = heap[i], heap[least]
                      i = least
              return smallest

          heap = [1, 5, 2, 9, 6, 8, 3]
          print(pop(heap), pop(heap), pop(heap))
        tests: |
          def _is_heap(xs):
              return all([xs[(i - 1) // 2] <= xs[i] for i in range(1, len(xs))])
          _h = [1, 5, 2, 9, 6, 8, 3]
          assert pop(_h) == 1, "The smallest of [1, 5, 2, 9, 6, 8, 3] is 1"
          assert _h == [2, 5, 3, 9, 6, 8], "After popping 1, the last value 3 goes to the root and swaps with its smaller child 2, giving [2, 5, 3, 9, 6, 8]. You have " + repr(_h)
          assert pop(_h) == 2, "The next smallest is 2. You returned something else, so the heap was not repaired correctly"
          assert _is_heap(_h), "After two pops the list is not a heap: " + repr(_h)
          _h = [1, 2, 3]
          assert pop(_h) == 1 and _h == [2, 3], "Popping from [1, 2, 3] should leave [2, 3]. You have " + repr(_h)
          _h = [4]
