          assert _out == [0, 1, 2, 3, 4, 4, 5, 6, 7, 8, 9, 10], "Popping until empty should give the values in increasing order. You got " + repr(_out)
          assert output.strip() == "1 2 3", "The program should print 1 2 3"
        wrong:
          - "def pop(heap):\n    smallest = heap[0]\n    last = heap.pop()\n    if len(heap) > 0:\n        heap[0] = last\n        i = 0\n        while 2 * i + 1 < len(heap) and heap[2 * i + 1] < heap[i]:\n            child = 2 * i + 1\n            heap[child], heap[i] = heap[i], heap[child]\n            i = child\n    return smallest\n\nprint(1, 2, 3)\n"
          - "def pop(heap):\n    smallest = heap[0]\n    last = heap.pop()\n    if len(heap) > 0:\n        heap[0] = last\n    return smallest\n\nprint(1, 2, 3)\n"
          - "def pop(heap):\n    smallest = heap[0]\n    last = heap.pop()\n    if len(heap) > 0:\n        heap[0] = last\n        i = 0\n        while True:\n            least = i\n            for child in [2 * i + 1, 2 * i + 2]:\n                if child < len(heap) and heap[child] > heap[least]:\n                    least = child\n            if least == i:\n                break\n            heap[least], heap[i] = heap[i], heap[least]\n            i = least\n    return smallest\n\nprint(1, 2, 3)\n"
