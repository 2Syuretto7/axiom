concept: e3.trees-and-heaps
minutes: 90
claim: You can describe a tree by its root, children, leaves and height, show that a full binary tree of n nodes is only about log n levels deep, store a complete tree in an array with no links, and build a heap that gives its smallest item and accepts a new one in logarithmic time, using it as a priority queue.
recalls: [e3.hash-tables]
uses: [e3.stacks-and-queues, e3.arrays-and-linked-lists, e1.recursion, e1.complexity-and-big-o, e1.classes-and-objects, e1.modules-and-imports, e0.lists-and-tuples, e0.loops, e0.functions, e0.expressions, m1.logarithms, m1.exponent-laws, m2.sequences-and-series, m3.induction-and-strong-induction]
leads: [e3.graphs-and-traversal, e3.sorting, e3.binary-search, e3.shortest-paths-and-beam-search]
starter: |
  # Scratch space. Jobs arrive with a priority, and the smallest number is the most urgent.
  # This keeps them in a plain list. How much work is each "take the most urgent"?
  jobs = []
  looks = 0

  for priority in [5, 9, 7, 2, 10, 3, 8, 1]:
      jobs.append(priority)

  while len(jobs) > 0:
      looks += len(jobs)
      urgent = min(jobs)
      jobs.remove(urgent)
      print(urgent, end=" ")
  print()
  print("items looked at:", looks)
parts:
  recall:
    - text: |
        [[e3.hash-tables]] found any key in a step by scattering keys across an array, and paid for it by losing all sense of order: it cannot tell you its smallest key without looking everywhere. Today's structure keeps just enough order to answer that one question fast. Three quick pulls first.
  puzzle:
    - text: |
        A machine that trains models receives jobs all day. Each job has a priority, and whenever the machine falls idle it must take the **most urgent** job waiting. Jobs keep arriving in between. So two operations alternate, over and over: **add a job**, and **remove the most urgent**.

        A stack would give you the newest job and a queue the oldest. Neither is wanted. Here are the two plans a list allows.

        | Plan | Add a job | Remove the most urgent |
        | --- | --- | --- |
        | keep the list in any order | append, $O(1)$ | search the whole list, $O(n)$ |
        | keep the list sorted | find the place and shift the rest, $O(n)$ | take it from the end, $O(1)$ |

        Run the starter. It follows the first plan with eight jobs and looks at 36 items to serve them all, $8 + 7 + \dots + 1$. With a million jobs that sum is five hundred thousand million. The second plan moves the cost to the other operation and does no better overall. Either way, one of the two operations is $O(n)$, and $n$ jobs cost $O(n^2)$.

        Each plan does more than it was asked. The first keeps no order at all, and pays when the smallest is wanted. The second keeps **complete** order, which nobody requested: you never asked which job is seventeenth.

        **Is there an arrangement that keeps only as much order as is needed to find the smallest, so that both operations are fast?**
  intuition:
    - text: |
        Think of a knockout tournament with eight players. The champion is known after seven matches, and to become champion she played only three, one in each round. She never met most of the field. Their defeats by others stood in for it.

        Draw the tournament as a diagram with the champion at the top, the two finalists beneath, and so on down. The shape is a **tree**: one item at the top, each item having up to two beneath it. In such a shape the number of rounds grows very slowly. Doubling the players adds one round. A million players need only twenty.

        Now arrange jobs the same way, with one rule: **every job is at least as urgent as the two beneath it**. The most urgent job is then at the top, since nothing above it could be less urgent. And little else is promised. Two jobs side by side may be in either order. This is far less than sorting, and it is all the puzzle needs.

        The reward comes when the arrangement is disturbed. Put a new job at the bottom. The rule can be broken only between it and the job above it, so swap those two if need be, and look again one level up. The repair climbs a single path to the top, one swap for each level, about twenty for a million jobs. Removing the top is repaired the same way, downwards.

        The figure shows such an arrangement, called a **heap**, as a tree and as the list that stores it. Insert an item and remove the smallest.
    - figure: heap
    - text: |
        Inserting 1 placed it at the bottom, and two swaps carried it to the top. Removing the smallest moved the last item to the top, and one swap with its smaller child restored the rule. Each repair touched one path and left the rest of the heap alone.
  derivation:
    - text: |
        **Trees.** A **tree** is a set of nodes in which one node, the **root**, is at the top, and every other node hangs from exactly one node above it, its **parent**. The nodes hanging from a node are its **children**. A node with no children is a **leaf**. In a **binary** tree no node has more than two children, a left and a right.

        A tree is the linked list of an earlier lesson with more than one link to a node. Where a list node has `next`, a binary tree node has `left` and `right`:

        ```python
        class Tree:
            def __init__(self, value, left, right):
                self.value = value
                self.left = left
                self.right = right
        ```

        The **depth** of a node is the number of links from the root down to it, so the root has depth 0. The **height** of a tree is the greatest depth of any node. Trees are recursive by nature: each child of a node is the root of a smaller tree. So functions on trees are naturally recursive, with the empty tree, `None`, as the base case. The height is one more than the taller of the two subtrees.

        **How many nodes fit.** In a binary tree, depth 0 holds at most 1 node, depth 1 at most 2, depth 2 at most 4, and depth $d$ at most $2^d$, each level doubling the last. A tree of height $h$ with every level full therefore holds

        $$1 + 2 + 4 + \dots + 2^h = 2^{h + 1} - 1$$

        nodes, by the formula for a geometric series. Turn that round. If the levels are filled in order, a tree of $n$ nodes has height

        $$h = \lfloor \log_2 n \rfloor.$$

        Seven nodes fill a tree of height 2. A million nodes fit in a tree of height 19, since $2^{19} \le 10^6 < 2^{20}$. This is the fact everything rests on. **A path from the root to a leaf in a full tree is logarithmically short.** Any operation that works along one such path is $O(\log n)$.

        **A complete tree needs no links.** Call a binary tree **complete** if every level is full except perhaps the last, which is filled from the left. Number its nodes level by level, left to right, from 0. The numbering has a pattern:

        | Node | Position |
        | --- | --- |
        | the root | 0 |
        | the children of the node at $i$ | $2i + 1$ and $2i + 2$ |
        | the parent of the node at $i$ | $\lfloor (i - 1) / 2 \rfloor$ |

        So a complete tree can be stored in a plain array, the node numbered $i$ in slot $i$, with **no links at all**. Moving to a child or a parent is arithmetic on the index, in the spirit of the address formula. In Python the parent of `i` is `(i - 1) // 2`.

        **The heap.** A **min-heap** is a complete binary tree in which every node's value is at most the values of its children. That rule is the **heap property**.

        *The smallest value is at the root.* Take any node and walk up to the root. Each step goes to a parent whose value is no larger. So the root's value is no larger than that of any node.

        The list `[2, 5, 3, 9, 6, 8]` is a heap. The root 2 has children 5 and 3. The node 5, at index 1, has children 9 and 6, at indices 3 and 4. The node 3, at index 2, has one child, 8, at index 5. Notice that the list is **not sorted**: 5 comes before 3. A heap orders each parent against its children and leaves siblings alone.

        **Inserting.** To add a value, keep the tree complete by putting it in the next free slot, the end of the array. Then repair the heap property, which can be broken only between the new value and its parent.

        ```python
        def push(heap, value):
            heap.append(value)
            i = len(heap) - 1
            while i > 0 and heap[(i - 1) // 2] > heap[i]:
                parent = (i - 1) // 2
                heap[parent], heap[i] = heap[i], heap[parent]
                i = parent
        ```

        While the value is smaller than its parent, swap them and continue from the parent's position. This is called **sifting up**. A swap puts a smaller value above the parent's other child, which can only help the rule there. The loop stops at the root or when the parent is no larger. It makes at most one swap for each level, so at most $\lfloor \log_2 n \rfloor$: inserting is $O(\log n)$.

        **Removing the smallest.** The smallest is at index 0, but the root cannot simply be deleted, as that would leave two separate trees. Keep the tree complete instead: move the **last** value into the root and shorten the array. The shape is right and the root is probably wrong. Repair downwards.

        ```python
        def pop(heap):
            smallest = heap[0]
            last = heap.pop()
            if len(heap) > 0:
                heap[0] = last
                i = 0
                while True:
                    least = i
                    for child in [2 * i + 1, 2 * i + 2]:
                        if child < len(heap) and heap[child] < heap[least]:
                            least = child
                    if least == i:
                        break
                    heap[least], heap[i] = heap[i], heap[least]
                    i = least
            return smallest
        ```

        At each step, find the least among the node and its children. If the node itself is least, stop. Otherwise swap it with that **smaller child** and continue from there. This is **sifting down**. It follows one path towards a leaf, so it too is $O(\log n)$.

        Why the smaller child and not either? After the swap, the child that moved up becomes the parent of the other child. It must be no larger than that other child, and only the smaller of the two is sure to be.
    - question:
        id: derivation-smaller-child
        type: choice
        system: s2
        prompt: |
          While sifting down, a node holding 7 has children holding 4 and 2. The node must be swapped with one of them. Which, and why?
        options:
          - "Either, since both are smaller than 7."
          - "The 2. After the swap the value that moved up is the parent of the other child, and 2 is at most 4. Swapping with the 4 would leave 4 above 2, breaking the heap property."
          - "The 4, because it is on the left."
          - "Neither, since the heap is already valid."
        answer: 1
        explanation: |
          The value brought up becomes the parent of two nodes: the value sent down, and the sibling that stayed. It is smaller than the value sent down, since that was the reason for swapping. It must also be no larger than the sibling. The smaller child passes that test by definition and the larger one fails it. An implementation that always swaps with the left child, or with the first smaller child it finds, gives a tree that looks plausible and is not a heap. It is the most common error in writing one.
    - text: |
        **The priority queue.** A collection that supports "add an item" and "remove the smallest" is called a **priority queue**, and the heap is the standard way to build one. Here is the answer to the puzzle, with the two plans it began with.

        | Structure | Add | Remove the smallest | $n$ of each |
        | --- | --- | --- | --- |
        | unordered list | $O(1)$ | $O(n)$ | $O(n^2)$ |
        | sorted list | $O(n)$ | $O(1)$ | $O(n^2)$ |
        | heap | $O(\log n)$ | $O(\log n)$ | $O(n \log n)$ |

        Neither operation is as cheap as the best of the list plans, and neither is ever as costly as the worst. For a million jobs that is the difference between five hundred thousand million steps and about forty million.

        Python provides a heap in the module `heapq`. It has no heap type of its own. Its functions work on an ordinary list, kept in heap order.

        ```python
        import heapq

        jobs = []
        heapq.heappush(jobs, 5)
        heapq.heappush(jobs, 2)
        heapq.heappush(jobs, 8)
        print(heapq.heappop(jobs), jobs[0])
        ```

        This shows `2 5`: the smallest is removed, and the next smallest is now at index 0, where it can be looked at without removing it. To attach a job to a priority, push a tuple such as `(2, "retrain")`. Tuples compare by their first items first, so the heap orders them by priority. For the **largest** first, push the negated priorities.

        **Keeping the best few.** Suppose you scan a million stored vectors and want the 5 most similar to a query. Sorting all the similarities is more than is needed. Keep a min-heap of at most 5 scores. For each new score, push it, and if the heap now holds 6, pop the smallest. At the end the heap holds the 5 largest. Its root is the weakest of the best, which is the one a newcomer has to beat. Each step costs $O(\log 5)$, a constant, so the whole scan is $O(n)$.

        **A second way to order a tree.** The heap property is one rule a tree can obey. Another is the **search tree** rule: every value in a node's left subtree is smaller than the node's value, and every value in its right subtree is larger. Now the tree can be searched for a particular value. Compare with the root and go left or right, discarding the other half, as you would look up a word in a dictionary. The work is one path, $O(\text{height})$. A search tree answers questions of order that a hash table cannot, such as the nearest key below a given one. Its difficulty is that nothing forces it to stay full. Insert keys in increasing order and each goes to the right of the last, giving a tree of height $n - 1$ that is a linked list in all but name. Keeping search trees shallow takes extra machinery. The heap never has this difficulty, because its shape is fixed in advance and only the values move.
    - question:
        id: order-push
        type: order
        system: s2
        prompt: The heap `[2, 5, 3, 9, 6, 8]` receives the new value 1. Put the states of the list in order as it is inserted and sifted up.
        steps:
          - "`[2, 5, 3, 9, 6, 8, 1]`, with 1 appended at index 6."
          - "Its parent is at index 2 and holds 3, which is larger, so they swap."
          - "`[2, 5, 1, 9, 6, 8, 3]`, with 1 now at index 2."
          - "Its parent is at index 0 and holds 2, which is larger, so they swap."
          - "`[1, 5, 2, 9, 6, 8, 3]`, with 1 at the root, where sifting stops."
        explanation: The value goes into the next free slot, index 6, whose parent is at (6 − 1) // 2 = 2. It is smaller than its parent, so they swap, and the same test is made from index 2, whose parent is index 0. After the second swap the value is at the root and has no parent to compare with.
  formal:
    - text: |
        **Tree.** Nodes with one root, every other node having exactly one parent. Depth of a node: the number of links from the root. Height: the greatest depth. A binary tree of height $h$ has at most $2^{h + 1} - 1$ nodes.

        **Complete binary tree.** Every level full except possibly the last, which is filled from the left. With $n$ nodes its height is $\lfloor \log_2 n \rfloor$. Stored in an array level by level: the children of index $i$ are at $2i + 1$ and $2i + 2$, and its parent at $\lfloor (i - 1) / 2 \rfloor$.

        **Min-heap.** A complete binary tree with each value at most the values of its children. The minimum is at index 0.

        **Operations.** Insert: append, then swap with the parent while smaller. Remove the minimum: move the last value to the root, then swap with the smaller child while larger than it. Each is $O(\log n)$. Reading the minimum is $O(1)$.

        **Priority queue.** A collection with "add" and "remove the smallest". In Python, `heapq.heappush(xs, x)` and `heapq.heappop(xs)` on a list.

        **Binary search tree.** A binary tree in which each node's value is greater than all values in its left subtree and less than all in its right. Searching costs $O(\text{height})$, which is $O(\log n)$ only if the tree is kept shallow.
