          - The size at which the block shrinks and the size at which it grows must be well apart.
          - Halve the block only when the list has fallen to a quarter of the room.
    - question:
        id: work-odometer
        type: numeric
        system: s2
        prompt: |
          A car's odometer has wheels for units, tens, hundreds and thousands. Each kilometre turns the units wheel. Whenever a wheel passes from 9 to 0, it also turns the wheel on its left. From 0000, the car drives 1000 km. How many wheel turns are there in all?
        answer: "1111"
        explanation: |
          Add up by wheel, not by kilometre. The units wheel turns every kilometre, 1000 times. The tens wheel turns once every 10 km, 100 times. The hundreds wheel turns 10 times and the thousands wheel once. The total is $1000 + 100 + 10 + 1$, about 1.11 turns per kilometre, though the kilometre from 0999 to 1000 alone turned four wheels. The dear steps are rare in exact proportion to their cost, which is the pattern of the doubling list, and the same sum shows that counting upwards in binary changes fewer than 2 digits per step on average.
        hints:
          - Do not count kilometre by kilometre. Count how many times each wheel turns.
          - The tens wheel turns once for every ten turns of the units wheel.
          - Add the turns of the four wheels.
    - question:
        id: work-building-strings
        type: choice
        system: s2
        prompt: |
          A language model produces a text one piece at a time, 100000 pieces in all. One program keeps the text in a string and does `text = text + piece` each time. Another appends each piece to a list and calls `"".join(pieces)` once at the end. A string cannot be changed, so `text + piece` builds a new string by copying both. How do the two compare?
        options:
          - "They do the same work, since both add one piece at a time."
          - "The first copies the whole text so far at every step, which is the rule of growing by one slot: about $n^2 / 2$ copies of pieces, five thousand million. The second makes $n$ cheap appends and one pass to join, about $n$ steps in each."
          - "The first is faster, because it avoids making a list."
          - "The second is slower, because `join` must copy everything."
        answer: 1
        explanation: |
          Adding to an unchangeable string is an append with no spare room: every step copies everything so far, and the copies add up to $1 + 2 + \dots + n$. The list has spare room, so its appends are $O(1)$ amortised, and `join` measures the total length, makes one string of that size, and copies each piece once. The same trap waits in every structure of fixed size. When you meet NumPy, whose arrays have no spare room, appending to an array inside a loop will be the same quadratic mistake, and the cure will be the same: collect in a list and convert once, or make the array at its final size before the loop.
        hints:
          - How much is copied by text + piece when text already holds 50000 pieces?
          - Which rule of growth from the lesson does that resemble?
          - How many times is each piece copied by the list and the join?
    - question:
        id: work-deadline
        type: choice
        system: s2
        prompt: |
          A program records sound. Every millisecond it must store one new sample, and if storing ever takes longer than a millisecond, there is a click in the recording. A doubling list makes appends $O(1)$ amortised. Is that good enough?
        options:
          - "Yes. $O(1)$ amortised means every append is fast."
          - "No. The total time is small, but the one append that copies millions of samples may overrun the deadline. Here the worst case of a single operation is what matters, so reserve all the room before recording starts, or use a structure whose every append is one step."
          - "Yes, provided the list grows by a fixed amount instead of doubling."
          - "No, because lists cannot hold numbers."
        answer: 1
        explanation: |
          Amortised analysis answers the question "how long does the whole job take?". The recorder is asking a different one: "how long can any single step take?". For that question the doubling list's answer is $n$, however rare the bad step is. The usual remedies are to obtain the full block in advance, so that no move ever happens, or to store the samples in fixed-size chunks linked together, where adding a chunk never touches the old ones. Growing by a fixed amount makes things worse on both counts: the moves become frequent, and each still copies everything. Most programs care about totals, and for them amortised cost is the right measure. Recognise the ones that do not.
        hints:
          - Does an amortised bound limit the cost of one particular append?
          - What does the append cost when the block happens to be full?
          - How could the program make sure that no append ever moves the list?
  connections:
    - text: |
        The puzzle asked for the honest cost of an append, when a full list must be copied in its entirety. A single append can cost $n$. But if the new block is twice as large, the moves grow rarer exactly as they grow dearer, the copies over $n$ appends total less than $2n$, and the whole costs less than $3n$. Appending is $O(1)$ amortised: a guarantee about the total for every sequence, with no promise about any one step. Grow by a fixed amount and the guarantee is lost.

        This lesson paid three debts. The "if there is spare room" of [[e3.arrays-and-linked-lists]] is now explained. So is the claim in [[e3.hash-tables]] that a table which doubles its buckets stays $O(1)$, and the claim in [[e3.stacks-and-queues]] that a queue of two stacks is cheap because each item moves once. The sum that made it work, $1 + 2 + 4 + \dots$, is the one that decided which level dominates in [[e3.divide-and-conquer]]: when terms double, the last outweighs all the rest.

        The habit to take away is the third way of counting. Do not ask how long one trip round a loop can take. Ask how many times, in the whole run, any one item can be handled, and add up over the items. Breadth-first search was counted that way, by its edges.

        The next method is counted that way too. In [[e3.dynamic-programming]] the order of filling a table was easy, because the entries lay in a grid. In general, the things to be done form a directed graph, with an arrow from each task to the tasks that need it first, and the question is in what order to do them so that nothing is done before what it depends on. The method removes one arrow at a time and never looks at an arrow twice. That is the next lesson, [[e3.topological-sort]].
