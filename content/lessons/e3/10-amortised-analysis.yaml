                        self.resize(self.size)
                    return value

            print(0)
        explanation: |
          After 33 appends the block has room for 64. A pop leaves 32 items, which is half, so the block is halved to 32 and all 32 items are copied. The block is now exactly full, so the append that follows doubles it and copies 32 again. Each pair of operations costs 64 copies, and a hundred pairs cost 6400. The trouble is that the two thresholds touch: straight after a move in one direction, the list is one step from a move in the other. Halving only when the list is a quarter full separates them. After any move the block is half full, and a quarter of its room must be used up or emptied before the next, so every move is paid for by a long run of cheap operations before it. Changing `<=` to `<` only shifts the boundary by one: the cycle of two pops and two appends then does the same damage. Removing the shrinking cures the copying and keeps the room of the largest size the list ever had.
