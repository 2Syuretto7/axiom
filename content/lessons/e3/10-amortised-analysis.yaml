                def __init__(self):
                    self.block = [None]
                    self.size = 0
                    self.copies = 0

                def get(self, k):
                    return self.block[k]

                def append(self, value):
                    if self.size == len(self.block):
                        self.block = [None] * (2 * len(self.block))
                        self.copies += self.size
                    self.block[self.size] = value
                    self.size += 1

            print(9, 16, 15, 64)
          - |
            class Growable:
                def __init__(self):
                    self.block = [None]
                    self.size = 0
                    self.copies = 0

                def get(self, k):
                    return self.block[k]

                def append(self, value):
                    if self.size == 0:
                        self.block[0] = value
                    else:
                        self.block.append(value)
                    self.size += 1

            print(9, 16, 15, 64)
