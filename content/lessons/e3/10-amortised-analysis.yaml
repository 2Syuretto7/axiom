    - question:
        id: drill-promise
        type: choice
        system: s1
        prompt: |
          "Appending is $O(1)$ amortised" promises that
        options:
          - "every append takes a constant number of steps"
          - "any $n$ appends together take at most a constant times $n$ steps"
          - "appends are fast unless you are unlucky"
          - "an append is fast on average over random lists"
        answer: 1
        explanation: The promise is about the total over a sequence, and it holds for every sequence. Luck and randomness have no part in it, and a single append may still be slow.
        hints:
          - Is any single append guaranteed to be cheap?
          - Does the bound depend on chance?
    - question:
        id: drill-fixed-step
        type: choice
        system: s1
        prompt: |
          A list grows by 1000 slots whenever it is full. For a very long run of appends, the amortised cost of an append is
        options: ["$O(1)$", "$O(\\log n)$", "$O(n)$", "$O(n^2)$"]
        answer: 2
        explanation: The moves come every 1000 appends for ever, and each copies everything present, so the copies total about $n^2 / 2000$, which is of order $n$ for each append.
        hints:
          - How often does a move happen once the list is long?
          - How much does each of those moves copy?
    - question:
        id: predict-doubling
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          room = 1
          size = 0
          copies = 0
          for _ in range(20):
              if size == room:
                  copies += size
                  room = 2 * room
              size += 1
          print(room, copies)
        output: "32 31"
        explanation: The block is found full at sizes 1, 2, 4, 8 and 16, and those five moves copy $1 + 2 + 4 + 8 + 16$ items and leave room for 32. Twenty appends, 31 copies.
        hints:
          - At which sizes does the test size == room succeed?
          - The room ends as the smallest power of 2 that holds 20 items.
    - question:
        id: predict-two-stacks
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          inbox = [1, 2, 3]
          outbox = []
          moves = 0
          while len(inbox) > 0:
              outbox.append(inbox.pop())
              moves += 1
          first = outbox.pop()
          inbox.append(4)
          second = outbox.pop()
          print(first, second, moves, inbox, outbox)
        output: "1 2 3 [4] [3]"
        explanation: Moving the three items reverses them, so `outbox` is `[3, 2, 1]` with the oldest, 1, on top. It leaves first and 2 leaves second. The 4 that arrived meanwhile waits in `inbox` and is not moved, since `outbox` is not empty.
        hints:
          - pop takes the last item of a list. What is outbox after the loop?
          - The item on top of outbox is the one that arrived first.
  work:
    - text: Slower now. For each structure, say which operations are dear, how often they can happen, and who pays for them.
    - question:
        id: write-growable
        type: code
        mode: write
        system: s2
        prompt: |
          `Growable` is a list built on a block of fixed room. The block is the Python list `self.block`, whose length is the room and never changes: you may assign to its slots, and you may **not** call `append` on it. `self.size` is the number of slots in use and `self.copies` counts every item copied between blocks. Write the method `append`. When the block is full, make a new block of twice the room, copy the items across one by one, counting each, and use it from then on.
        starter: |
          class Growable:
              def __init__(self):
                  self.block = [None]
                  self.size = 0
                  self.copies = 0

              def get(self, k):
                  return self.block[k]

              def append(self, value):
                  # Replace the next line with your own.
                  self.block[0] = value

          items = Growable()
          for k in range(9):
              items.append(k * k)
          print(items.size, len(items.block), items.copies, items.get(8))
        solution: |
          class Growable:
              def __init__(self):
                  self.block = [None]
                  self.size = 0
                  self.copies = 0

              def get(self, k):
                  return self.block[k]

              def append(self, value):
                  if self.size == len(self.block):
                      bigger = [None] * (2 * len(self.block))
                      for k in range(self.size):
                          bigger[k] = self.block[k]
                          self.copies += 1
                      self.block = bigger
                  self.block[self.size] = value
                  self.size += 1

          items = Growable()
          for k in range(9):
              items.append(k * k)
          print(items.size, len(items.block), items.copies, items.get(8))
        tests: |
          _g = Growable()
          _rooms = []
          for _k in range(40):
              _g.append(_k * 3)
              _rooms.append(len(_g.block))
              assert _g.size == _k + 1, "After " + str(_k + 1) + " appends the size should be " + str(_k + 1) + ". It is " + repr(_g.size)
          assert [_g.get(_k) for _k in range(40)] == [_k * 3 for _k in range(40)], "Every item appended should still be there, in order. The first ten are " + repr([_g.get(_k) for _k in range(10)])
          assert _rooms[:9] == [1, 2, 4, 4, 8, 8, 8, 8, 16], "The room after each of the first nine appends should be 1, 2, 4, 4, 8, 8, 8, 8, 16. Yours was " + repr(_rooms[:9])
          assert _rooms[39] == 64, "After 40 appends the room should be 64. It is " + repr(_rooms[39])
          assert _g.copies == 63, "Forty appends should copy 1 + 2 + 4 + 8 + 16 + 32 = 63 items. Yours counted " + repr(_g.copies)
          _h = Growable()
          _h.append("a")
          assert _h.copies == 0 and len(_h.block) == 1 and _h.get(0) == "a", "The first append fits in the first block, with no copying"
          _i = Growable()
          for _k in range(1000):
              _i.append(_k)
          assert _i.copies == 1023, "A thousand appends should copy 1023 items in all. Yours counted " + repr(_i.copies)
          assert output.strip() == "9 16 15 64", "The program should print 9 16 15 64"
        wrong:
          - |
            class Growable:
                def __init__(self):
                    self.block = [None]
                    self.size = 0
                    self.copies = 0

                def get(self, k):
                    return self.block[k]

                def append(self, value):
                    if self.size == len(self.block):
                        bigger = [None] * (len(self.block) + 1)
                        for k in range(self.size):
                            bigger[k] = self.block[k]
                            self.copies += 1
                        self.block = bigger
                    self.block[self.size] = value
                    self.size += 1

            print(9, 16, 15, 64)
          - |
