concept: e3.amortised-analysis
minutes: 80
claim: You can explain how a list grows when its block of memory is full, show that doubling makes $n$ appends cost fewer than $3n$ steps in total though a single append can cost $n$, state what an amortised cost does and does not promise, and apply the same accounting to hash tables, to a queue made of two stacks, and to code that builds things piece by piece.
recalls: [e3.dynamic-programming]
uses: [e3.arrays-and-linked-lists, e3.stacks-and-queues, e3.hash-tables, e3.graphs-and-traversal, e3.divide-and-conquer, e1.classes-and-objects, e1.complexity-and-big-o, e1.comprehensions-and-iterators, e0.lists-and-tuples, e0.loops, e0.strings]
leads: [e3.topological-sort, e3.shortest-paths-and-beam-search]
starter: |
  # Scratch space. A list lives in a block of fixed room. When the block is full, a larger block
  # is found and every item is copied across. copies_made counts the copying for a run of appends.
  # Two rules for the size of the new block are compared: one more slot, or twice as many.
  def copies_made(appends, grow):
      room = 1
      size = 0
      copies = 0
      for _ in range(appends):
          if size == room:
              copies += size
              room = grow(room)
          size += 1
      return copies

  for n in [1000, 2000, 4000, 8000]:
      print(n, copies_made(n, lambda room: room + 1), copies_made(n, lambda room: 2 * room))
parts:
  recall:
    - text: |
        [[e3.dynamic-programming]] closed on a loose end in the accounts. Appending to a list has been called $O(1)$ since your first lesson on complexity, with a quiet "if there is spare room". Today the qualification is removed, and with it you gain a way of counting that you will need again. Three quick pulls first.
    - question:
        id: recall-dp-cost
        type: choice
        system: s1
        concepts: [e3.dynamic-programming]
        prompt: |
          The cost of a memoised recursion is the number of different questions multiplied by
        options:
          - "the number of calls made"
          - "the work for one question, not counting its recursive calls"
          - "the depth of the recursion"
          - "the size of the answer"
        answer: 1
        explanation: Each question is computed once, and every later call for it is a lookup.
        hints:
          - How many times is each question actually computed?
          - What does a later call for the same question cost?
    - question:
        id: recall-array-end
        type: numeric
        system: s1
        concepts: [e3.arrays-and-linked-lists]
        prompt: |
          An array holds 10 items and has spare room at the end. How many items must move when a new one is added at the end?
        answer: "0"
        explanation: Nothing comes after the new item, so nothing has to make way.
        hints:
          - Which items come after the new one?
          - Only items after the new one would need to move.
    - question:
        id: recall-doubling-sum
        type: numeric
        system: s1
        concepts: [e3.divide-and-conquer]
        prompt: |
          What is $1 + 2 + 4 + 8 + 16$?
        answer: "31"
        explanation: One less than the next power of 2. Each term is one more than all the terms before it together.
        hints:
          - Add from the left, or notice how the sum compares with the next power of 2.
          - $1 + 2 + 4 = 7$, which is one less than 8.
  puzzle:
    - text: |
        In [[e3.arrays-and-linked-lists]] you learnt that a Python list is an array: a run of slots side by side in memory, which is why `items[k]` takes one step. You also learnt that the run cannot be stretched, because the slots just beyond it may belong to something else.

        So what happens when the run is full and you append?

        There is only one thing that can happen. A larger run is found somewhere else, **every item is copied across**, and the old run is given up. Appending to a full list of a million items costs a million steps.

        Yet the table of costs says appending is $O(1)$, and you have relied on that in nearly every program you have written.

        **Both statements cannot be the whole truth. What is the honest cost of an append?**

        It depends on a decision: when a list must move, **how much room should the new block have?** Run the starter, which counts the copying for two rules. Making the new block one slot larger, the copies for 1000, 2000, 4000 and 8000 appends are 499500, 1999000, 7998000 and 31996000: four times as many each time the appends double. Making it twice as large, they are 1023, 2047, 4095 and 8191.

        The second rule sometimes copies thousands of items for a single append, and still its total is tiny.

        **Why does doubling make the total so small? And in what sense is an operation $O(1)$ if it sometimes costs $n$?**
  intuition:
    - text: |
        Watch the costs one append at a time. The list starts in a block with room for 1, and doubles the room whenever it is full. Step through seventeen appends.
    - figure: doubling-array
      props: { appends: 9 }
    - text: |
        Most appends cost one step. A few are tall: the 2nd, 3rd, 5th, 9th and 17th, each of which finds the block full and copies everything before writing.

        Now look at two things together. The tall bars get **taller**, doubling each time. And they get **rarer**, the gaps between them doubling too. After the copy of 8 items there are eight cheap appends before the next copy. After the copy of 16 there are sixteen.

        Those two doublings cancel. Spread each tall bar over the cheap appends that follow it, and it adds about one step to each of them. The figure's running total says it: after 17 appends the work is 17 writes and 31 copies, 48 steps, fewer than 3 per append. It stays below 3 per append for ever.

        Here is a way to see that it must. Imagine each append is charged **three** rupees. One pays for writing the item. The other two are put in a savings box. When the block is full with $m$ items, the last $m/2$ of them arrived since the previous move, and each put in two rupees: $m$ rupees are in the box, which is exactly the cost of copying $m$ items. The box is never overdrawn. So three rupees an append pays for everything, the expensive moves included.

        The rule of one more slot has no such balance. Every append finds the block full, and every one pays for a complete copy.
  derivation:
    - text: |
        **The total, added up.** Do $n$ appends, starting with room for 1 and doubling when full. Each append writes one item: $n$ writes. Copies happen when the size is 1, 2, 4, 8 and so on, and each copies as many items as there are:

        $$1 + 2 + 4 + \dots + 2^k,$$

        where $2^k$ is the largest power of 2 below $n$. You know this sum. Each term is one more than all the terms before it, so the whole is one less than the next power of 2:

        $$1 + 2 + 4 + \dots + 2^k = 2^{k+1} - 1 < 2n.$$

        So

        $$\text{total work} < n + 2n = 3n.$$

        **The definition.** When any sequence of $n$ operations costs at most $c \cdot n$ steps in total, the operation is said to have an **amortised cost** of $c$. The word is the accountant's word for spreading the price of something expensive over the period in which it is used.

        Appending to a doubling list has an amortised cost of less than 3. In the usual notation, it is $O(1)$ **amortised**.

        Be exact about what this promises. It is not an average over lucky and unlucky inputs. There is no luck in it. It is a guarantee about the **total** for every possible sequence: $n$ appends never cost more than $3n$, whatever is appended. What it does not promise is that any one append is cheap. The worst single append still costs $n$.

        For a loop that appends a million items, the total is all that matters, and the amortised cost is the honest one. That is why every count you have made so far, with appends inside loops, stands.

        **Why doubling, and not adding.** Try growing by a fixed amount, say 100 more slots each time. The copies are then of 100, 200, 300 items and so on up to $n$:

        $$100 + 200 + \dots + n = 100\left(1 + 2 + \dots + \frac{n}{100}\right) \approx \frac{n^2}{200}.$$

        That is $O(n^2)$ in total, so $O(n)$ amortised. The 100 delays the trouble and does not cure it. However large the fixed step, the moves come at a steady rate while their cost keeps rising.

        What cures it is growing by a **factor**, so that the gaps between moves grow in step with their cost. The factor need not be 2. With a factor of $g$, the copies are a sum in which each term is $g$ times the one before, and such a sum is less than $\frac{g}{g - 1}$ times its last term. A factor of 2 gives copies below $2n$. A factor of $1.5$ gives $3n$. Python grows its lists by about one eighth, a factor of $1.125$, giving about $9n$.

        The choice trades two things. A large factor copies less and wastes more: just after doubling, half of the block is empty. A small factor wastes little and copies more often. Every factor above 1 gives $O(1)$ amortised.
    - question:
        id: derive-total
        type: numeric
        system: s2
        prompt: |
          A list starts with room for 1 and doubles when full. 1000 items are appended. How many item copies are made in all?
        answer: "1023"
        explanation: |
          A move happens whenever an append finds the block full, which is when the size is 1, 2, 4, and so on up to 512. The next would be at size 1024, which is not reached. The copies are $1 + 2 + 4 + \dots + 512 = 2 \times 512 - 1$. With the 1000 writes that is 2023 steps, about 2 per append, and the starter printed the same number of copies.
        hints:
          - At which sizes is the block full?
          - The largest of those sizes below 1000 is 512.
          - The sum of the powers of 2 up to 512 is one less than the next power.
    - text: |
        **Three ways to count.** You have now seen two arguments for the same fact, and there is a third. All three are worth owning, since each is the easy one for some problem.

        *Add up the total.* Count the whole sequence at once, as with the sum of powers of 2.

        *Charge in advance.* Give each operation a fixed charge larger than its real cost, bank the difference, and show the bank is never overdrawn. That was the three rupees.

        *Follow one item.* Ask how many times any single item can be handled in its whole life.

        The third is the natural one for the queue made of two stacks from [[e3.stacks-and-queues]]. Enqueue pushes onto `inbox`. Dequeue pops from `outbox`, and when `outbox` is empty it first moves the whole of `inbox` across. One dequeue can move a million items. But follow an item: it is pushed onto `inbox` once, moved once, and popped from `outbox` once. Three steps in its life, whatever happens around it. So $n$ operations cost at most $3n$ steps, and both operations are $O(1)$ amortised.

        You have used this argument before without its name. In [[e3.graphs-and-traversal]], one trip round the loop of breadth-first search can be long, since a node may have many neighbours. Nobody tried to bound a single trip. The count was that each edge is looked at twice **over the whole run**, giving $O(\lvert V \rvert + \lvert E \rvert)$. That was charging the work to the edges.

        **Hash tables.** The same doubling keeps a hash table fast. In [[e3.hash-tables]] the average chain had length $n/m$, the load factor, and you wrote a `resize` that doubles the buckets and puts every pair in its new place. A table resizes when the load factor passes some limit. Each resize handles every pair, exactly as a list's move copies every item, and by the same sum the total is below $2n$ over $n$ insertions.

        So the cost of inserting into a dictionary carries two qualifications, and they are different in kind. It is $O(1)$ **on average**, over how the hash function scatters the keys. And it is $O(1)$ **amortised**, over the occasional resize. The first is a statement about luck. The second is not.

        **Where the promise is not enough.** An amortised bound is about totals. Sometimes one slow operation is the thing that matters. A program that must answer within a millisecond, to keep sound playing or to serve a request before a deadline, cannot shrug off the one append in a million that copies everything. There the worst case of a single operation is the right measure, and structures are chosen that never have a bad moment, such as the linked list, whose every append is one step. Know which of the two questions you are being asked.

        **Shrinking.** One more trap. If lists grow by doubling, it seems natural to halve the block when the list falls to half full. Consider a list sitting exactly at the boundary, and a program that pops one item and appends one, over and over. The pop takes it to half full: halve, copying everything. The append fills the smaller block: double, copying everything. Every operation costs $n$. The savings-box argument has collapsed, because after a move there is no longer a long run of cheap operations before the next.

        The cure is to leave a gap between the two thresholds: double when full, and halve only when the list is a **quarter** full. After either kind of move the block is half full, and at least a quarter of its room must be filled or emptied before the next move. The run of cheap operations is back, and so is the $O(1)$.
    - question:
        id: derive-move-order
        type: order
        system: s2
        prompt: An item is appended to a list whose block is full. Put what happens in order.
        steps:
          - "The list finds that its size equals its room"
          - "A new block with a multiple of the old room is obtained"
          - "Each item is copied from the old block to the same position in the new one"
          - "The old block is given up"
          - "The new item is written in the first free slot, and the size goes up by one"
        explanation: The costly part is the copying, one step for each item already present. After it the list is in a block with spare room, and the write is the ordinary one-step append. The many cheap appends that can now follow before the room runs out are what pay for the copy.
        hints:
          - The new block must exist before anything can be copied into it.
          - The old block cannot be given up while it still holds the only copy of the items.
          - The new item is written last, into the room the move has made.
  formal:
    - text: |
        **Amortised cost.** An operation has amortised cost $c$ if every sequence of $n$ operations, starting from an empty structure, costs at most $c \cdot n$ in total. It bounds the total for every sequence, involves no probability, and does not bound any single operation.

        **Dynamic array.** A list in a block that is replaced by one $g$ times as large, $g > 1$, when full. Starting from room 1 with $g = 2$, $n$ appends make fewer than $2n$ copies and cost fewer than $3n$ steps: $O(1)$ amortised, $O(n)$ in the worst single case. Growing by a fixed number of slots gives $O(n)$ amortised.

        **Three methods.** Add up the total over the sequence. Or charge each operation a fixed amount, and show that the amounts banked always cover the real costs. Or bound the number of times any one item is handled.

        **Hash table.** Doubling the buckets when the load factor passes a limit makes insertion $O(1)$ amortised, in addition to $O(1)$ on average over the hash.

        **Shrinking.** Doubling when full and halving when a quarter full keeps appending and popping $O(1)$ amortised. Halving when half full does not.
