          class TwoStackQueue:
              def __init__(self):
                  self.inbox = []
                  self.outbox = []
                  self.moves = 0

              def enqueue(self, value):
                  self.inbox.append(value)

              def dequeue(self):
                  if len(self.outbox) == 0:
                      while len(self.inbox) > 0:
                          self.outbox.append(self.inbox.pop())
                          self.moves += 1
                  return self.outbox.pop()

