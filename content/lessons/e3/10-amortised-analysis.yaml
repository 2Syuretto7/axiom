            class Growable:
                def __init__(self):
                    self.block = [None]
                    self.size = 0
                    self.copies = 0

                def resize(self, room):
                    fresh = [None] * room
                    for k in range(self.size):
                        fresh[k] = self.block[k]
                        self.copies += 1
                    self.block = fresh

                def append(self, value):
