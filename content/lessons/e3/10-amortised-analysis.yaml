    - question:
        id: drill-which-appends
        type: choice
        system: s1
        prompt: |
          Which of the first twenty appends find the block full and cause a copy?
        options:
          - "The 2nd, 4th, 8th and 16th"
          - "The 2nd, 3rd, 5th, 9th and 17th"
          - "Every second append"
          - "The 10th and the 20th"
        answer: 1
        explanation: The block is full when the size is a power of 2, and the append that finds it so is the next one.
        hints:
