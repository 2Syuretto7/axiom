          - "def balanced(text):\n    closes = {')': '(', ']': '[', '}': '{'}\n    stack = []\n    for c in text:\n        if c in '([{':\n            stack.append(c)\n        elif c in closes:\n            if len(stack) == 0 or stack.pop() != closes[c]:\n                return False\n    return True\n\nprint(True, False)\n"
          - "def balanced(text):\n    closes = {')': '(', ']': '[', '}': '{'}\n    stack = []\n    for c in text:\n        if c in '([{':\n            stack.append(c)\n        elif c in closes:\n            if len(stack) == 0:\n                return False\n            stack.pop()\n    return len(stack) == 0\n\nprint(True, False)\n"
          - "def balanced(text):\n    closes = {')': '(', ']': '[', '}': '{'}\n    stack = []\n    for c in text:\n        if c in '([{':\n            stack.append(c)\n        elif c in closes:\n            if len(stack) > 0 and stack.pop() != closes[c]:\n                return False\n    return len(stack) == 0\n\nprint(True, False)\n"
          - "def balanced(text):\n    closes = {')': '(', ']': '[', '}': '{'}\n    stack = []\n    for c in text:\n        if c in '([{':\n            stack.append(c)\n        elif c in closes:\n            if len(stack) == 0 or stack[0] != closes[c]:\n                return False\n            stack.pop()\n    return len(stack) == 0\n\nprint(True, False)\n"
        explanation: |
          The stack holds the brackets that are open and not yet closed, the most recent on top. An opener is pushed. A closer must find a partner of its own kind on top, and there are two ways for it to fail: the stack is empty, or the top is the wrong kind. At the end, anything still on the stack was never closed. Each of the three checks catches a different mistake, and leaving out any one lets a bad line through. Counting cannot work, because the counts of `([)]` are identical to those of `([])`. What distinguishes them is order, and the stack is the record of order.
