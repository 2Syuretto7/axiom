concept: e3.stacks-and-queues
minutes: 80
claim: You can say what a stack and a queue promise, build each so that every operation takes constant time, explain why a list makes a good stack and a poor queue, and choose between them by asking which item must be dealt with next, as in matching brackets, evaluating an expression, and serving requests in order.
