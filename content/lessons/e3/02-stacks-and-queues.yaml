        explanation: |
          When the last item leaves, the head becomes `None` but the tail was left pointing at the node just removed. `enqueue` tests the tail to decide whether the queue is empty, concluded that it was not, and attached the new node behind the dead one, where the head cannot reach it. The repair is one line in `dequeue`: when the head has become `None`, set the tail to `None` as well. Setting the tail to `None` on every dequeue is too much, since it cuts off the items still waiting. The fault only shows after the queue has been emptied and used again, which is exactly the kind of case a test must be written for on purpose.
    - question:
        id: write-postfix
        type: code
        mode: write
        system: s2
        prompt: |
          Write `evaluate(tokens)`. `tokens` is a list making up a valid postfix expression: each token is a whole number, or one of the strings `"+"`, `"-"`, `"*"`. Return the value of the expression.
        starter: |
          def evaluate(tokens):
              # Replace the next line with your own.
              return 0

          print(evaluate([3, 4, "+", 2, "*"]), evaluate([9, 4, "-"]))
        solution: |
          def evaluate(tokens):
              stack = []
              for token in tokens:
                  if token == "+" or token == "-" or token == "*":
                      b = stack.pop()
                      a = stack.pop()
                      if token == "+":
                          stack.append(a + b)
                      elif token == "-":
                          stack.append(a - b)
                      else:
                          stack.append(a * b)
                  else:
                      stack.append(token)
              return stack.pop()

          print(evaluate([3, 4, "+", 2, "*"]), evaluate([9, 4, "-"]))
        tests: |
          assert evaluate([3, 4, "+", 2, "*"]) == 14, "3 4 + 2 * is (3 + 4) * 2 = 14. You returned " + repr(evaluate([3, 4, "+", 2, "*"]))
          assert evaluate([9, 4, "-"]) == 5, "9 4 - is 9 - 4 = 5. You returned " + repr(evaluate([9, 4, "-"]))
          assert evaluate([7]) == 7, "A single number is its own value. You returned " + repr(evaluate([7]))
          assert evaluate([5, 1, 2, "+", "-"]) == 2, "5 1 2 + - is 5 - (1 + 2) = 2. You returned " + repr(evaluate([5, 1, 2, "+", "-"]))
          assert evaluate([2, 3, 4, "*", "+"]) == 14, "2 3 4 * + is 2 + 3 * 4 = 14. You returned " + repr(evaluate([2, 3, 4, "*", "+"]))
          assert evaluate([2, 3, "+", 4, "*"]) == 20, "2 3 + 4 * is (2 + 3) * 4 = 20. You returned " + repr(evaluate([2, 3, "+", 4, "*"]))
          assert evaluate([10, 2, 3, "-", "-"]) == 11, "10 2 3 - - is 10 - (2 - 3) = 11. You returned " + repr(evaluate([10, 2, 3, "-", "-"]))
          assert evaluate([0, 6, "-"]) == -6, "0 6 - is 0 - 6 = -6. You returned " + repr(evaluate([0, 6, "-"]))
          assert evaluate([1, 2, "+", 3, 4, "+", "*"]) == 21, "1 2 + 3 4 + * is (1 + 2) * (3 + 4) = 21. You returned " + repr(evaluate([1, 2, "+", 3, 4, "+", "*"]))
          assert output.strip() == "14 5", "The program should print 14 5"
        wrong:
          - "def evaluate(tokens):\n    stack = []\n    for token in tokens:\n        if token == '+' or token == '-' or token == '*':\n            a = stack.pop()\n            b = stack.pop()\n            if token == '+':\n                stack.append(a + b)\n            elif token == '-':\n                stack.append(a - b)\n            else:\n                stack.append(a * b)\n        else:\n            stack.append(token)\n    return stack.pop()\n\nprint(14, 5)\n"
          - "def evaluate(tokens):\n    stack = []\n    for token in tokens:\n        if token == '+' or token == '-' or token == '*':\n            b = stack.pop(0)\n            a = stack.pop(0)\n            if token == '+':\n                stack.append(a + b)\n            elif token == '-':\n                stack.append(b - a)\n            else:\n                stack.append(a * b)\n        else:\n            stack.append(token)\n    return stack.pop()\n\nprint(14, 5)\n"
          - "def evaluate(tokens):\n    result = 0\n    for token in tokens:\n        if token != '+' and token != '-' and token != '*':\n            result += token\n    return result\n\nprint(14, 5)\n"
          - "def evaluate(tokens):\n    stack = []\n    for token in tokens:\n        if token == '+' or token == '-' or token == '*':\n            b = stack.pop()\n            a = stack.pop()\n            if token == '+':\n                stack.append(a + b)\n            elif token == '-':\n                stack.append(a - b)\n            else:\n                stack.append(a + b)\n        else:\n            stack.append(token)\n    return stack.pop()\n\nprint(14, 5)\n"
          - "def evaluate(tokens):\n    stack = []\n    for token in tokens:\n        if token == '+' or token == '-' or token == '*':\n            b = stack.pop()\n            a = stack.pop()\n            if token == '+':\n                stack.append(a + b)\n            elif token == '-':\n                stack.append(abs(a - b))\n            else:\n                stack.append(a * b)\n        else:\n            stack.append(token)\n    return stack.pop()\n\nprint(14, 5)\n"
        explanation: |
          The stack holds the values that have been computed and not yet used. A number is such a value and is pushed. An operator uses the two most recent values and replaces them by one. Because the stack returns the most recent first, the first pop yields the **second** operand, and for subtraction the order must be put right: pop `b`, then `a`, and compute `a - b`. Taking the operands from the front of the list turns the stack into a queue and pairs up the wrong numbers as soon as an expression nests. Each token is handled in constant time, so the evaluation is $O(n)$. The way a Python expression is turned into steps for the machine is very close to this.
    - question:
        id: work-two-stacks
        type: choice
        system: s2
        prompt: |
          A queue is built from two stacks, `inbox` and `outbox`. Enqueue pushes onto `inbox`. Dequeue pops from `outbox`, but if `outbox` is empty it first pops **every** item from `inbox` and pushes each onto `outbox`. Does this behave as a queue, and what does it cost?
        options:
          - "It is not a queue, because stacks reverse the order."
          - "It is a queue. Moving the items from one stack to the other reverses them, so the oldest ends up on top of `outbox`. One dequeue may move many items, but each item is moved only once in its life, so $n$ operations cost $O(n)$ in all."
          - "It is a queue, but every dequeue costs $O(n)$, so $n$ operations cost $O(n^2)$."
          - "It works only when the queue is never empty."
        answer: 1
        explanation: |
          A stack reverses order, and reversing twice restores it: the first item pushed onto `inbox` is at its bottom, so it is the last to be moved and lands on top of `outbox`, ready to leave first. Items already in `outbox` are older than everything in `inbox`, so they rightly leave first. As to cost, a single dequeue can be expensive, moving the whole of `inbox`. But follow one item through its life: pushed once onto `inbox`, moved once, popped once. That is at most a fixed number of steps for each item, so any sequence of $n$ operations takes $O(n)$ steps in total, an average of $O(1)$ each. Reasoning about the total over a sequence, when single operations vary, is called amortised analysis, and it has a lesson of its own in this cluster.
    - question:
        id: work-recursion-depth
        type: choice
        system: s2
        prompt: |
          A recursive function that walks a linked list of a million nodes, calling itself once for each node, fails in Python with "maximum recursion depth exceeded". The loop with an explicit stack from this lesson, or a plain loop, does not. Why?
        options:
          - "Recursion is always slower than a loop."
          - "Each unfinished call occupies a frame on Python's call stack, which is limited to about a thousand frames by default. A million nested calls exceed it. A loop keeps its pending work in an ordinary list, or needs none, and is limited only by memory."
          - "Linked lists cannot be used with recursion."
          - "The recursive function has a bug."
        answer: 1
        explanation: |
          Recursion uses the call stack as its memory of what remains to be done: each call that is waiting for a deeper one holds a frame. The depth of the recursion is the height of that stack, and Python refuses to let it grow past a set limit, to turn runaway recursion into an error instead of a crash. Recursion that halves its problem is only about 20 deep for a million items and is safe. Recursion that goes one step deeper for each item is as deep as the data is long. Knowing that the call stack is a real stack with a real limit tells you when to replace recursion by a loop with a stack of your own.
  connections:
    - text: |
        The puzzle asked what you must remember to check brackets, when counting fails. You must remember the brackets still open, in order, and a closer must match the most recent of them. A pile that you add to and take from only at the top holds exactly that. It is a stack, and the three ways a line can be malformed are the three ways the check can fail: a closer meets an empty stack, a closer meets the wrong opener, or openers are left at the end.

        A stack returns the newest item and a queue the oldest. That is the whole difference, and it was enough to decide how each should be built. From [[e3.arrays-and-linked-lists]] you knew that an array is cheap at its end, so a list is a ready-made stack. A queue works at both ends, so it needs a linked list that remembers its tail, or a deque. In both, every operation is $O(1)$.

        The stack also explained something you had been using since you met recursion: waiting function calls are kept on one, which is why the last call made is the first to return, and why recursion a million deep fails.

        Two threads lead on. Keeping pending work on a stack or on a queue gives the two great ways of exploring, depth first and breadth first, in [[e3.graphs-and-traversal]]. And when the next item to handle is neither the newest nor the oldest but the **smallest**, you need the priority queue of [[e3.trees-and-heaps]]. The two-stack queue, cheap on average though not at every step, returns in [[e3.amortised-analysis]].

        Before those, a different question about collections. A stack and a queue hand you an item of **their** choosing. Often you want a particular one: is this word in the vocabulary, what is the count for this key? A list must search for it, item by item. You were told that a set and a dictionary answer in $O(1)$, however much they hold, and were given a picture of houses arranged by name. The next lesson, [[e3.hash-tables]], builds one out of the only two things you have: an array, which can jump to any position, and linked lists, to hold what collides.
