  puzzle:
    - text: |
        A program editor must tell you, as you type, whether your brackets are well formed. Four lines to judge:

        | Line | Well formed? |
        | --- | --- |
        | `f(a[1], {2: (3)})` | yes |
        | `([)]` | no |
        | `(()` | no |
        | `())(` | no |

        The obvious method is to count. Run the starter: it counts each kind of bracket. The third line is caught, with two `(` and one `)`. But the second and fourth lines have perfectly equal counts and are still wrong. In `([)]` the round bracket is closed while a square one is still open inside it. In `())(` a bracket is closed before it was opened.

        Counting is not enough. As you read along the line, you need to remember something about the brackets you have passed.

        **What, exactly, do you have to remember? And when a closing bracket arrives, which one of the remembered brackets does it have to match?**

        The answer is a way of organising memory so simple that it hardly seems like a data structure. It is also how your own function calls have been kept track of all along.
  intuition:
    - text: |
        Read `f(a[1], {2: (3)})` slowly. You meet `(`, then `[`. Now `]` arrives. Which opener must it match? Not the first one you saw. The **most recent** one that is still open. Brackets nest, so whatever opened last must close first.

        So keep the openers in a pile. Each new opener goes on top. A closer is compared with the top of the pile, and if they match, the top is taken off. You never look at anything but the top. At the end the pile must be empty.

        A pile that you add to and take from at the top only is a **stack**. A pile of plates is one: the last plate put on is the first taken off. Last in, first out.

        Now a different job. Requests arrive at a server faster than it can answer them. They must wait, and fairness says that the one that has waited longest is served next. That is a line of people at a counter: join at the back, leave from the front. It is a **queue**. First in, first out.

        Both hold a collection of items, and both let you do only two things, add one and remove one. The entire difference is **which** item comes out. Try it.
    - figure: stack-queue
      props: { items: 3 }
    - text: |
        With A, B, C added in that order, the stack gives them back as C, B, A, reversed. The queue gives them back as A, B, C, in the order they came. Add and remove in a mixed sequence and the two orders part company quickly.
  derivation:
    - text: |
        **The stack.** A stack supports two operations and promises one thing about them.

        | Operation | Meaning |
        | --- | --- |
        | **push** | add an item |
        | **pop** | remove and return the item most recently pushed and not yet popped |

        A third, **peek**, looks at that item without removing it.

        A Python list is already a good stack, and the last lesson says why. Treat the **end** of the list as the top. Then push is `append` and pop is `pop()`, both at the end of an array, where nothing moves: $O(1)$ each. Peek is `stack[-1]`.

        ```python
        stack = []
        stack.append("(")
        stack.append("[")
        print(stack.pop(), stack)
        ```

        This shows `[ ['(']`. Had you used the front of the list as the top, every push and pop would have moved every item, and the same idea would cost $O(n)$ an operation. The structure is the same. Only the choice of end differs.

        **Matching brackets.** Here is the method from the intuition, made exact.

        ```python
        def balanced(text):
            closes = {")": "(", "]": "[", "}": "{"}
            stack = []
            for c in text:
                if c in "([{":
                    stack.append(c)
                elif c in closes:
                    if len(stack) == 0 or stack.pop() != closes[c]:
                        return False
            return len(stack) == 0
        ```

        Follow it on `([)]`. Push `(`, push `[`. Then `)` arrives, and the top is `[`, which is not its partner: `False`. On `())(`, push `(`, pop it for the first `)`, and then the second `)` finds the stack empty: `False`. On `(()`, the line ends with one `(` still on the stack: `False`. The three ways a line can be wrong are the three places the function can refuse. Other characters are ignored.

        Each character is handled in $O(1)$, so the whole check is $O(n)$ in the length of the line.

        **The call stack is a stack.** When you studied recursion you watched calls pile up and unwind. A function that calls another must wait, and the one called last finishes first. Python keeps the waiting calls on a stack, which is where the name came from. This means any recursive function can be rewritten with a loop and a stack of your own, holding the work still to be done. Here is the total of a nested list, without recursion:

        ```python
        def total(nested):
            stack = [nested]
            result = 0
            while len(stack) > 0:
                item = stack.pop()
                if type(item) == list:
                    for part in item:
                        stack.append(part)
                else:
                    result += item
            return result
        ```

        Whatever is popped is either a number, which is added, or a list, whose parts are pushed to be dealt with later. Nothing is lost and nothing is done twice. The stack holds exactly the work not yet done.

        **The queue.** A queue also supports two operations.

        | Operation | Meaning |
        | --- | --- |
        | **enqueue** | add an item at the back |
        | **dequeue** | remove and return the item that has been waiting longest |

        A Python list makes a poor queue. Items must join at one end and leave from the other, and one of those ends is the front of the array. `xs.pop(0)` moves every remaining item, $O(n)$. You met the consequence at the end of the last lesson: emptying a list from the front is $O(n^2)$ in all.

        A linked list has the opposite shape, and it can be made to fit. Removing at the head is $O(1)$. Adding at the far end is $O(1)$ too, **if the last node is remembered** as well as the first, so that no walk is needed to find it.

        ```python
        class Node:
            def __init__(self, value, next):
                self.value = value
                self.next = next

        class Queue:
            def __init__(self):
                self.head = None
                self.tail = None

            def enqueue(self, value):
                node = Node(value, None)
                if self.tail is None:
                    self.head = node
                else:
                    self.tail.next = node
                self.tail = node

            def dequeue(self):
                node = self.head
                self.head = node.next
                if self.head is None:
                    self.tail = None
                return node.value
        ```

        Items join at the tail and leave from the head. The one delicate point is the empty queue. When the last item leaves, the head becomes `None`, and the tail must be set to `None` with it. Otherwise the tail goes on pointing at a node that is no longer in the queue.

        In practice you will not write this class. Python supplies `collections.deque`, a double-ended queue, with $O(1)$ adding and removing at **both** ends.

        ```python
        from collections import deque

        queue = deque()
        queue.append("first")
        queue.append("second")
        print(queue.popleft(), len(queue))
        ```

        This shows `first 1`. Use `append` to join at the back and `popleft` to leave from the front. A deque used with `append` and `pop` is a stack, so it serves as either.
    - question:
        id: derivation-tail
        type: choice
        system: s2
        prompt: |
          In the linked queue, `dequeue` sets `self.tail = None` when the head has become `None`. What goes wrong if that line is left out?
        options:
          - "Nothing. The tail is only used for speed."
          - "After the queue empties, the tail still points at the removed node. The next `enqueue` attaches the new node to that dead node and leaves the head as `None`, so the new item can never be dequeued."
          - "The queue returns its items in reverse order."
          - "`dequeue` becomes $O(n)$."
        answer: 1
        explanation: |
          `enqueue` decides whether the queue is empty by testing the tail. With a stale tail it takes the queue to be non-empty and links the new node after the old one, which the head no longer leads to. The head remains `None`, and the next `dequeue` fails. A structure that keeps two records of one fact, here "the queue is empty", must change both together. The property that must hold between operations, that head and tail are both `None` or both nodes of the same list, is called an **invariant**, and bugs in data structures are almost always a broken invariant.
    - text: |
        **Choosing between them.** The only question is which item should be dealt with next.

        | If the next item to handle is | Use | Examples |
        | --- | --- | --- |
        | the most recent one | a stack | brackets, undo, function calls, going back a page |
        | the oldest one | a queue | requests to a server, print jobs, a buffer of batches waiting to be trained on |

        The choice shapes whole algorithms. When you explore a maze and keep the places still to visit on a stack, you plunge down one corridor as far as it goes before trying another. Keep them in a queue and you spread out evenly, reaching everything one step away before anything two steps away. Same loop, different container, and a completely different search. You will see this made precise when graphs arrive.

        **Evaluating an expression.** A calculator can be built on a stack. Write the expression with each operator **after** its two operands: $(3 + 4) \times 2$ becomes `3 4 + 2 *`. This is called postfix notation. It needs no brackets and no rules of precedence. Read it left to right:

        - a number is pushed;
        - an operator pops two numbers, combines them, and pushes the result.

        For `3 4 + 2 *`: push 3, push 4. The `+` pops 4 and 3 and pushes 7. Push 2. The `*` pops 2 and 7 and pushes 14. At the end the stack holds the answer alone. The order of the two pops matters for subtraction: the first number popped is the **second** operand.
    - question:
        id: order-postfix
        type: order
        system: s2
        prompt: Put the stack's contents in the order they occur while evaluating the postfix expression `5 1 2 + -`, starting after the first token.
        steps:
          - "`[5]`"
          - "`[5, 1]`"
          - "`[5, 1, 2]`"
          - "`[5, 3]`"
          - "`[2]`"
        explanation: The three numbers are pushed in turn. The plus pops 2 and 1 and pushes 3. The minus pops 3, then 5, and computes 5 − 3, because the first number popped is the second operand. The result, 2, is left alone on the stack.
  formal:
    - text: |
        **Stack.** A collection with push and pop, where pop returns the item most recently pushed and not yet popped: last in, first out. With a Python list, push is `append` and pop is `pop()`, each $O(1)$.

        **Queue.** A collection with enqueue and dequeue, where dequeue returns the item enqueued earliest and not yet dequeued: first in, first out. With a linked list that remembers its head and its tail, or with `collections.deque` using `append` and `popleft`, each is $O(1)$. With a Python list, `pop(0)` is $O(n)$.

        **Balanced brackets.** A text is balanced exactly when, reading left to right with a stack of openers, every closer matches the top of the stack, which is then popped, and the stack is empty at the end.

        **Postfix evaluation.** Push numbers. For an operator, pop $b$, then pop $a$, and push $a \mathbin{\text{op}} b$.
