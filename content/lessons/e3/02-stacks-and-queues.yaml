        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          class Queue:
              def __init__(self):
                  self.head = None
                  self.tail = None

              def enqueue(self, value):
                  node = Node(value, None)
                  if self.tail is None:
                      self.head = node
                  else:
                      self.tail.next = node
                  self.tail = node

              def dequeue(self):
                  node = self.head
                  self.head = node.next
                  if self.head is None:
                      self.tail = None
                  return node.value

          queue = Queue()
          queue.enqueue(1)
          print(queue.dequeue())
          queue.enqueue(2)
          print(queue.dequeue())
        tests: |
          _q = Queue()
          _q.enqueue(1)
          assert _q.dequeue() == 1, "A queue holding only 1 should give back 1"
          _q.enqueue(2)
          assert _q.head is not None, "After the queue has been emptied, a new item must still become the head"
          assert _q.dequeue() == 2, "After emptying and refilling, the queue should give back 2"
          _q = Queue()
          for _v in [4, 7, 9]:
              _q.enqueue(_v)
          assert [_q.dequeue(), _q.dequeue(), _q.dequeue()] == [4, 7, 9], "Items should leave in the order they arrived"
          _q.enqueue(5)
          _q.enqueue(6)
          assert [_q.dequeue(), _q.dequeue()] == [5, 6], "The queue should work again after being emptied"
          _q = Queue()
          _q.enqueue(1)
          _q.enqueue(2)
          assert _q.dequeue() == 1, "The first item in is the first out"
          _q.enqueue(3)
          assert [_q.dequeue(), _q.dequeue()] == [2, 3], "An item added while others wait should leave after them"
          assert _q.head is None and _q.tail is None, "An empty queue should have both head and tail set to None"
          assert output.split() == ["1", "2"], "The program should print 1 and then 2"
