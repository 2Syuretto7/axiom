    - question:
        id: work-negative
        type: choice
        system: s2
        prompt: |
          Three nodes: S to A has weight 2, S to B has weight 5, and B to A has weight $-4$, all one-way. Dijkstra's algorithm from S settles A first, at distance 2. What is the true distance to A, and what went wrong?
        options:
          - "2. Nothing went wrong."
          - "1, by way of B: $5 - 4$. A was settled as final because every other way to it had to pass through B, which is farther, and the argument assumed that the rest of such a path cannot shorten it. A negative edge breaks exactly that step."
          - "$-4$, since that is the smallest weight."
          - "There is no shortest path when a weight is negative."
        answer: 1
        explanation: |
          The proof said: any other path to the nearest unsettled node must first reach some other unsettled node, which is at least as far, and then continue for a length that is at least zero. Here the continuation from B to A has length $-4$, so being farther at B does not prevent being nearer at A. The method has already settled A at 2 and never revisits a settled node, so it reports the wrong distance. Lengths of roads and times are never negative, and neither is $-\log p$ for a probability, which is why the method serves so widely. Where negative weights do arise, as with gains and losses of money, a slower method is used that relaxes every edge again and again until nothing changes.
    - question:
        id: work-beam-cost
        type: numeric
        system: s2
        prompt: |
          A model has a vocabulary of 50000 words. A beam search of width 4 writes a sentence of 20 words. At each step, every sentence in the beam is extended by every word of the vocabulary. How many candidates are formed in all? Ignore the first step's being smaller.
        answer: "4000000"
        explanation: |
          Each step forms $4 \times 50000 = 200000$ candidates, and there are 20 steps, so 4 million in all. Set that against the $50000^{20}$ sentences there are, a number of 94 digits. Beam search looks at a part of the tree so small that it is hard to express, and in practice it often finds a sentence close to the best, because most of the tree is made of sentences that go wrong early and are rightly dropped. The price is paid in the cases the figure showed, where the best sentence starts badly. Doubling the width doubles the cost and recovers some of those.
    - question:
        id: work-log-lengths
        type: choice
        system: s2
        prompt: |
          The most probable sentence is the one whose word probabilities have the greatest product. The lesson turned this into a shortest-path problem by giving a word of probability $p$ the length $-\log p$. Why does that work?
        options:
          - "Because logarithms make numbers smaller."
          - "The logarithm of a product is the sum of the logarithms, so the length of a path is $-\\log$ of its probability. The logarithm is increasing, so a larger probability means a smaller length. And since $p \\le 1$, every length is at least zero, as Dijkstra's algorithm requires."
          - "Because $-\\log p$ is always a whole number."
          - "It does not work exactly. It is an approximation."
        answer: 1
        explanation: |
          Three facts about the logarithm do all the work. It turns products into sums, and paths are measured by sums. It is increasing, so the order of probabilities is preserved, and the minus sign turns "largest" into "smallest". And the logarithm of a number between 0 and 1 is negative or zero, so $-\log p$ is never negative. The translation is exact. It has a practical side too: the product of several hundred probabilities is smaller than any float can hold and collapses to zero, while the sum of their logarithms is an ordinary number. You will meet $-\log p$ again as the quantity a language model is trained to make small, where it measures how surprised the model was by the word that actually came next.
    - question:
        id: work-three-searches
        type: choice
        system: s2
        prompt: |
          Depth-first search, breadth-first search and Dijkstra's algorithm share one loop: take a node from a container, look at its neighbours, and put some of them in. What does the choice of container decide, and where does beam search stand?
        options:
          - "Nothing. The three searches always visit nodes in the same order."
          - "It decides which node is taken next: the newest from a stack, the oldest from a queue, the nearest from a heap. Beam search is the breadth-first kind, ring by ring, with a container that holds only the best $k$ of each ring and throws the rest away, trading the guarantee for the ability to run at all."
          - "It decides how much memory is used, and nothing else."
          - "A stack is for trees, a queue for graphs and a heap for sorted lists."
        answer: 1
        explanation: |
          The loop is the same and the container sets the order of exploration, which sets what is found. A stack plunges, and finds some path. A queue spreads evenly, and finds paths of fewest edges. A heap keyed by distance spreads according to length, and finds shortest paths. All three keep every node they discover, and so are certain to reach whatever can be reached. Beam search gives that up. Its container has a fixed size, and a node that does not make the cut is forgotten together with all its descendants. That is the only way to search a tree with fifty thousand branches at every node, and it is why its answer is good and not guaranteed. Choosing a data structure, as the whole of this cluster has shown, is choosing what a program can do cheaply, and here it decides what the program can find.
  connections:
    - text: |
        The puzzle asked for the shortest way from A to F without measuring every route, and for what can be done when the places are too many to visit. Breadth-first search gave 15 km, because it counts roads and not kilometres. Settling always the nearest unsettled town, and improving the notes on its neighbours, gave 13 km by way of every town, and it is right because no road has a negative length: nothing farther away can offer a shorter way back. For the sentences of a language model, which form a tree too vast to explore, a beam keeps the best few at each step, at a cost of width times vocabulary per word, and without a guarantee.

        This last lesson used the whole cluster. The graph is the adjacency list of [[e3.graphs-and-traversal]], a dictionary of arrays. The distances live in a hash table. The nearest town comes from the heap of [[e3.trees-and-heaps]], itself a tree stored in an array. The stale entries are paid for by the accounting of [[e3.amortised-analysis]], one push for each relaxation. The order of settling is the order of [[e3.topological-sort]], discovered on the way. The beam is cut by the sort of [[e3.sorting]]. And a tentative distance improved step by step from nearer nodes is a table of [[e3.dynamic-programming]], filled in order of distance.

        One idea ran through all twelve lessons. A data structure is a decision about what to make cheap: a position, an insertion, a lookup by key, the smallest item, the next thing to explore. An algorithm is a way of arranging work so that nothing is done twice and nothing is examined that an earlier answer has ruled out. Halving, remembering, ordering and keeping only the best are the four moves, and you have now made each of them.

        They are about to be put to use. A neural network is a graph of operations, evaluated in a topological order and differentiated in the reverse of it. Its numbers are held in arrays, laid out side by side in memory as in the first lesson of this cluster, and the grids of numbers called matrices will give the graph itself a new form, a table of which node is joined to which, that can be multiplied. The text a model reads is looked up in a hash table of its vocabulary, and the text it writes is found by the searches of this lesson. From here on, these structures stop being the subject and become the material.

        The first of those steps is the grid of numbers. So far a vector has been a list, and every operation on vectors has been a loop over one list. A grid, a list of lists, turns out to be far more than a way of storing several vectors: it is a machine that takes a vector in and gives a vector out, and the machines that can be written this way are exactly the ones a neural network is built from. That is the next lesson, [[m5.matrices-as-linear-maps]].
