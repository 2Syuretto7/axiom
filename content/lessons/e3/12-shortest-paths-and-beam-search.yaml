concept: e3.shortest-paths-and-beam-search
minutes: 100
claim: You can find the shortest routes through a graph whose edges have lengths by always settling the nearest unsettled node, explain why that is right when no length is negative, implement it with a heap and recover the route, and search a space too large to explore by keeping only the best few candidates at each step, knowing what that can miss.
recalls: [e3.topological-sort]
uses: [e3.trees-and-heaps, e3.graphs-and-traversal, e3.dynamic-programming, e3.sorting, e3.amortised-analysis, e3.hash-tables, e3.stacks-and-queues, e1.complexity-and-big-o, e1.comprehensions-and-iterators, e0.dictionaries-and-sets, e0.lists-and-tuples, e0.loops, m1.logarithms]
leads: [m5.matrices-as-linear-maps, m5.matrix-multiplication-as-composition, e6.topological-ordering-of-the-graph, e4.bits-integers-and-ieee-754-floating-point]
starter: |
  # Scratch space. Six towns and the roads between them, with lengths in kilometres.
  # Breadth-first search finds the route from A to F with the fewest roads. How long is it?
  from collections import deque

  roads = {
      "A": [("B", 4), ("C", 1)],
      "B": [("A", 4), ("C", 2), ("D", 5)],
      "C": [("A", 1), ("B", 2), ("D", 8), ("E", 10)],
      "D": [("B", 5), ("C", 8), ("E", 2), ("F", 6)],
      "E": [("C", 10), ("D", 2), ("F", 3)],
      "F": [("D", 6), ("E", 3)],
  }

  hops = {"A": 0}
  km = {"A": 0}
  queue = deque(["A"])
  while len(queue) > 0:
      town = queue.popleft()
      for other, length in roads[town]:
          if other not in hops:
              hops[other] = hops[town] + 1
              km[other] = km[town] + length
              queue.append(other)
  print("to F:", hops["F"], "roads,", km["F"], "km")
parts:
  recall:
    - text: |
        [[e3.topological-sort]] ended at the edge of what an order fixed in advance can do. A graph with cycles has no node that is safely first. Today, in the last lesson of this cluster, you find shortest routes through such a graph, and then face graphs too large to search at all. Three quick pulls first.
  puzzle:
    - text: |
        Six towns are joined by roads, and each road has a length in kilometres. A–B is 4, A–C is 1, C–B is 2, B–D is 5, C–D is 8, C–E is 10, D–E is 2, D–F is 6, and E–F is 3.

        **What is the shortest way from A to F?**

        You have a method for routes. Run the starter, which is the breadth-first search of [[e3.graphs-and-traversal]]. It reports a route of 3 roads, A to B to D to F, which is $4 + 5 + 6 = 15$ km.

        But go A to C to B to D to E to F. That is five roads, and $1 + 2 + 5 + 2 + 3 = 13$ km. The route with the fewest roads is not the shortest. Breadth-first search counts every road as one step, and the direct road from A to B, at 4 km, is longer than the detour through C.

        You could list every route and measure each. Among six towns that is possible. On the road map of a country, the routes between two cities outnumber the atoms in the universe.

        And here is a second problem with the same shape and a far worse size. A language model writes a sentence one word at a time, and for each next word it has fifty thousand choices, each with a probability. The sentences of twenty words number $50000^{20}$. Somewhere among them is the most probable one.

        **How do you find the shortest route without measuring every route? And what can be done when even the places are too many to visit?**
  intuition:
    - text: |
        Imagine pouring water in at A, so that it runs along every road at the same speed, one kilometre a minute. The moment the water first arrives at a town is that town's shortest distance from A, in minutes, because the water tries every route at once and the first arrival is by the shortest.

        Follow the water. It reaches C at minute 1, along the road of 1 km. Where next? Not B by the direct road, which takes 4 minutes. The water that reached C at minute 1 runs on and reaches B at minute 3. So B is reached at 3.

        Notice how that was worked out. At each moment there are towns the water has **reached**, whose times are known for certain, and towns it has not. For each unreached town you can note the earliest arrival you know of so far, by some road out of a reached town. Those notes are provisional. A better way may turn up.

        But one of the notes is safe: **the smallest**. The unreached town with the earliest noted arrival will really be reached then. Any other way to it would have to pass first through some other unreached town, and every one of those is reached later still. So nothing can beat it.

        That gives the method. **Settle the unsettled town with the smallest noted distance. Then look along its roads, and improve the notes of its neighbours where the way through it is shorter. Repeat.** Step through it.
    - figure: shortest-path
    - text: |
        The towns are settled in order of distance: A at 0, C at 1, B at 3, D at 8, E at 10, F at 13. Watch the note on B change from 4 to 3 when C is settled, and the note on F from 14 to 13 when E is.

        This is breadth-first search with one change. There, the next node was the one that had waited longest, and a queue supplied it. Here, the next node is the one with the smallest distance, and you know the structure that supplies the smallest of a changing collection.
  derivation:
    - text: |
        **Graphs with lengths.** A graph whose edges carry numbers is a **weighted graph**, and the numbers are **weights**: lengths, times, costs. In the adjacency list each neighbour is stored with the weight of the edge to it.

        ```python
        roads = {
            "A": [("B", 4), ("C", 1)],
            "B": [("A", 4), ("C", 2), ("D", 5)],
            "C": [("A", 1), ("B", 2), ("D", 8), ("E", 10)],
            "D": [("B", 5), ("C", 8), ("E", 2), ("F", 6)],
            "E": [("C", 10), ("D", 2), ("F", 3)],
            "F": [("D", 6), ("E", 3)],
        }
        ```

        The **length of a path** is the sum of its weights, and the **distance** from one node to another is the least length of any path between them.

        **The method.** Keep for every node a **tentative distance**: the length of the shortest path to it found so far. The start has 0 and every other node has infinity, meaning no path is known. Then repeat:

        1. Among the nodes not yet settled, take the one with the smallest tentative distance, and **settle** it.
        2. For each edge from it to a neighbour, see whether going through it gives the neighbour a smaller distance. If so, lower the neighbour's tentative distance. This is called **relaxing** the edge.

        This is **Dijkstra's algorithm**, published by Edsger Dijkstra in 1959. Here it is on the six towns. Each row shows the tentative distances after the town on the left is settled, with settled values in bold.

        | settled | A | B | C | D | E | F |
        | --- | --- | --- | --- | --- | --- | --- |
        | A | **0** | 4 | 1 | ∞ | ∞ | ∞ |
        | C | **0** | 3 | **1** | 9 | 11 | ∞ |
        | B | **0** | **3** | **1** | 8 | 11 | ∞ |
        | D | **0** | **3** | **1** | **8** | 10 | 14 |
        | E | **0** | **3** | **1** | **8** | **10** | 13 |
        | F | **0** | **3** | **1** | **8** | **10** | **13** |

        **Why the smallest is safe.** The whole method rests on one claim: when a node is settled, its tentative distance is its true distance. Here is the argument, and note where it uses a fact about the weights.

        Let $u$ be the unsettled node with the smallest tentative distance, $d$. Consider any path at all from the start to $u$. It begins among the settled nodes and ends at $u$, which is unsettled, so somewhere it leaves the settled nodes for the first time, stepping to an unsettled node $x$. The part of the path up to $x$ has length at least the tentative distance of $x$, because the edge into $x$ from a settled node was relaxed when that node was settled. And the tentative distance of $x$ is at least $d$, since $d$ is the smallest. The rest of the path, from $x$ on to $u$, has length **at least zero**. So the whole path has length at least $d$. No path beats $d$.

        The words "at least zero" are the assumption: **no edge has a negative weight**. With roads that is certain. If some edge could have a negative length, a path might wander off through far nodes and come back shorter, and settling the nearest first would be unsound.

        Set this beside [[e3.topological-sort]]. There, a node could be dealt with when everything it depended on was done, and the arrows said what that was. Here there are no arrows to say so. The distances themselves supply the order: a node's distance depends only on nodes that are nearer, so taking the nodes nearest first is a topological order, discovered as the method runs.
    - question:
        id: derive-settle-order
        type: order
        system: s2
        prompt: Dijkstra's algorithm runs on the six towns from A. Put the towns in the order in which they are settled.
        steps:
          - "A"
          - "C"
          - "B"
          - "D"
          - "E"
          - "F"
        explanation: |
          Towns are settled in order of their distance from A: 0, 1, 3, 8, 10 and 13. After A, the notes are B 4 and C 1, so C is next. Settling C lowers B to 3 and notes D at 9 and E at 11, so B is next. Settling B lowers D to 8. Settling D lowers E to 10 and notes F at 14. Settling E lowers F to 13.
    - text: |
        **The code.** The step "take the unsettled node with the smallest tentative distance" is a job for the heap of [[e3.trees-and-heaps]]. The heap holds pairs `(distance, node)`, and since tuples compare by their first items, the smallest distance comes out first.

        ```python
        import heapq
        import math

        def shortest(roads, start):
            dist = {town: math.inf for town in roads}
            dist[start] = 0
            heap = [(0, start)]
            while len(heap) > 0:
                d, town = heapq.heappop(heap)
                if d == dist[town]:
                    for other, length in roads[town]:
                        if d + length < dist[other]:
                            dist[other] = d + length
                            heapq.heappush(heap, (d + length, other))
            return dist
        ```

        One line needs explaining: `if d == dist[town]`. When a node's tentative distance is lowered, the natural thing would be to find its entry in the heap and change it. A heap offers no way to do that. So a **new** entry is pushed with the better distance, and the old one is left where it is. When B's note fell from 4 to 3, the heap held both `(4, "B")` and `(3, "B")`. The entry with 3 comes out first and B is settled. Later the entry with 4 comes out, and it is **stale**: its distance no longer matches `dist["B"]`. The test recognises it and passes over it.

        **The cost.** Count as in [[e3.amortised-analysis]], by what each edge can cause. An edge is relaxed when its tail is settled, which happens once, and a relaxation pushes at most one entry. So the heap never holds more than $\lvert E \rvert$ entries, there are at most $\lvert E \rvert$ pushes and pops, and each costs the logarithm of the heap's size:

        $$O\bigl((\lvert V \rvert + \lvert E \rvert) \log \lvert V \rvert\bigr).$$

        A road map of ten million junctions is searched in a few seconds.

        **One skeleton, three containers.** Look back over the cluster. Depth-first search keeps the nodes to explore in a stack and takes the newest. Breadth-first search keeps them in a queue and takes the oldest. Dijkstra's algorithm keeps them in a heap and takes the nearest. The loop around the container is the same. When every weight is 1, the nearest is the oldest, and Dijkstra's algorithm becomes breadth-first search.

        **Recovering the route.** `dist` gives lengths, not routes. To get the route, record for each node the neighbour **through which its distance was last improved**:

        ```python
        if d + length < dist[other]:
            dist[other] = d + length
            came_from[other] = town
        ```

        When the method ends, `came_from` holds, for each node, the node before it on a shortest path. Start at the goal and follow `came_from` back to the start: F came from E, E from D, D from B, B from C, C from A. Reverse that and you have the route A, C, B, D, E, F.
    - question:
        id: derive-relax
        type: numeric
        system: s2
        prompt: |
          In the run on the six towns, A and then C have been settled. What is the tentative distance of E at that moment?
        answer: "11"
        explanation: |
          Before C was settled E had no known path. C is at distance 1 and the road from C to E is 10 km long, so relaxing that road notes E at $1 + 10$. The note is provisional. When D is later settled at distance 8, the road from D to E, of 2 km, lowers it to 10, and that is E's true distance. A tentative distance only ever goes down, and becomes final when the node is settled.
    - text: |
        **Too large to search.** Now the second half of the puzzle. A language model writes a sentence a word at a time. Given the words so far, it assigns every word of its vocabulary a probability of coming next. The probability of a whole sentence is the product of the probabilities of its words, each given the words before.

        Draw this as a tree. The root is the empty sentence. Each node is a sentence so far, and each edge adds one word. With a vocabulary of fifty thousand, every node has fifty thousand children, and there are $50000^{20}$ sentences of twenty words. The task is to find a sentence of high probability.

        This is a shortest-path problem in disguise. Give the edge that adds a word of probability $p$ the length $-\log p$. Probabilities lie between 0 and 1, so their logarithms are negative and $-\log p$ is positive: a likely word is a short edge and an unlikely word a long one. And since the logarithm of a product is the sum of the logarithms,

        $$-\log(p_1 p_2 \cdots p_k) = (-\log p_1) + (-\log p_2) + \dots + (-\log p_k).$$

        The most probable sentence is the **shortest path** from the root to a leaf, and no length is negative. Dijkstra's algorithm would find it.

        But it cannot be run. Settling one node pushes fifty thousand entries, and the heap would hold more entries than any machine has memory for long before a sentence was finished. The graph is not too large to store, since it is never stored. It is too large to **explore**.

        **Greedy.** The cheapest plan is to take the most probable next word every time. It is fast, with one sentence kept and one step of the model per word. And it can go wrong at the first word. In the figure below, a small model chooses a first word among "the", "a" and "one". "the" is the most probable, at 0.5. But after "the" the probability is spread over several continuations, the best being "cat" at 0.4, for a sentence of probability $0.5 \times 0.4 = 0.2$. After "a", at 0.4, the word "cat" is nearly certain, at 0.9, giving $0.4 \times 0.9 = 0.36$. The best sentence begins with the second-best word.

        **Beam search.** The remedy lies between taking one and keeping all. **Keep the best $k$ sentences so far.** At each step, extend every one of the $k$ by every possible word, and from all those candidates keep the best $k$ again. The $k$ sentences kept are called the **beam**, and $k$ is the **beam width**. Set the width in the figure to 1, 2 and 3.
    - figure: beam-search
      props: { width: 1 }
    - text: |
        With a width of 1 the beam is greedy, and ends with "the cat" at 0.2. With a width of 2, "a" survives the first step alongside "the", and "a cat" is found at 0.36.

        ```python
        def beam_search(next_words, width, steps):
            beam = [(1.0, [])]
            for _ in range(steps):
                candidates = []
                for p, words in beam:
                    for word, q in next_words(words).items():
                        candidates.append((p * q, words + [word]))
                candidates.sort(reverse=True)
                beam = candidates[:width]
            return beam
        ```

        `next_words(words)` stands for the model: given the words so far, it returns a dictionary from each possible next word to its probability. The beam begins with the empty sentence, of probability 1.

        The cost is plain from the loops. Each step extends $k$ sentences by $V$ words: $k \cdot V$ candidates, sorted and cut to $k$. Over $n$ steps that is about $n \cdot k \cdot V$ candidates, where exploring everything needs $V^n$. A width of 5 costs five times what greedy costs.

        What is given up is the guarantee. Beam search is breadth-first search with each ring of the tree cut down to its best $k$ nodes. A sentence dropped from the beam is gone, with everything that would have grown from it. Dijkstra's algorithm never discards a node and is always right. Beam search discards nearly everything and is usually good. No width short of keeping everything makes it certain.

        Real systems make one change to the code above. A product of twenty probabilities is a very small number, and the product of a few hundred is too small for a float to hold at all. So they keep the **sum of the logarithms** of the probabilities in place of the product. The largest sum belongs to the largest product, and sums do not shrink towards zero.
  formal:
    - text: |
        **Weighted graph.** A graph in which each edge has a number, its weight. The length of a path is the sum of the weights of its edges, and the distance between two nodes is the least length of a path between them.

        **Dijkstra's algorithm.** Give the start the tentative distance 0 and every other node $\infty$. Repeatedly settle the unsettled node $u$ of least tentative distance, and for each edge from $u$ to $v$ of weight $w$, replace the tentative distance of $v$ by $\text{dist}(u) + w$ if that is smaller. If no weight is negative, each node's tentative distance when settled is its true distance. With a heap the cost is $O((\lvert V \rvert + \lvert E \rvert) \log \lvert V \rvert)$.

        **Route.** If each node records the node from which its distance was last lowered, following the records back from a node gives a shortest path to it in reverse.

        **Three searches.** Taking the next node from a stack, a queue or a heap ordered by distance gives depth-first search, breadth-first search and Dijkstra's algorithm.

        **Probabilities as lengths.** With each edge of probability $p$ given the length $-\log p$, the path of greatest probability is the path of least length.

        **Beam search.** Keep a set of at most $k$ partial solutions. At each step form every extension of every member, and keep the $k$ best. With $V$ extensions per member and $n$ steps the cost is about $n \cdot k \cdot V$. It is not guaranteed to find the best solution. $k = 1$ is the greedy method.
