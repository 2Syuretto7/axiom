  work:
    - text: Slower now. For each search, say what is kept, what is taken next, and what is thrown away.
    - question:
        id: write-shortest
        type: code
        mode: write
        system: s2
        prompt: |
          Write `shortest(roads, start)`. `roads` is a dictionary from each town to a list of pairs `(other, length)`, one for each road leaving it, and no length is negative. Return a dictionary giving the distance from `start` to every town, with `math.inf` for a town that cannot be reached. Use a heap of `(distance, town)` pairs.
        starter: |
          import heapq
          import math

          def shortest(roads, start):
              dist = {town: math.inf for town in roads}
              dist[start] = 0
              # Fill in the rest.
              return dist

          roads = {
              "A": [("B", 4), ("C", 1)],
              "B": [("A", 4), ("C", 2), ("D", 5)],
              "C": [("A", 1), ("B", 2), ("D", 8), ("E", 10)],
              "D": [("B", 5), ("C", 8), ("E", 2), ("F", 6)],
              "E": [("C", 10), ("D", 2), ("F", 3)],
              "F": [("D", 6), ("E", 3)],
          }
          print(shortest(roads, "A")["F"])
        solution: |
          import heapq
          import math

          def shortest(roads, start):
              dist = {town: math.inf for town in roads}
              dist[start] = 0
              heap = [(0, start)]
              while len(heap) > 0:
                  d, town = heapq.heappop(heap)
                  if d == dist[town]:
                      for other, length in roads[town]:
                          if d + length < dist[other]:
                              dist[other] = d + length
                              heapq.heappush(heap, (d + length, other))
              return dist

          roads = {
              "A": [("B", 4), ("C", 1)],
              "B": [("A", 4), ("C", 2), ("D", 5)],
              "C": [("A", 1), ("B", 2), ("D", 8), ("E", 10)],
              "D": [("B", 5), ("C", 8), ("E", 2), ("F", 6)],
              "E": [("C", 10), ("D", 2), ("F", 3)],
              "F": [("D", 6), ("E", 3)],
          }
          print(shortest(roads, "A")["F"])
        tests: |
          _towns = {"A": [("B", 4), ("C", 1)], "B": [("A", 4), ("C", 2), ("D", 5)], "C": [("A", 1), ("B", 2), ("D", 8), ("E", 10)], "D": [("B", 5), ("C", 8), ("E", 2), ("F", 6)], "E": [("C", 10), ("D", 2), ("F", 3)], "F": [("D", 6), ("E", 3)]}
          assert shortest(_towns, "A") == {"A": 0, "B": 3, "C": 1, "D": 8, "E": 10, "F": 13}, "From A the distances are A 0, B 3, C 1, D 8, E 10, F 13. You returned " + repr(shortest(_towns, "A"))
          assert shortest(_towns, "F") == {"F": 0, "E": 3, "D": 5, "B": 10, "C": 12, "A": 13}, "From F the distances are F 0, E 3, D 5, B 10, C 12, A 13. You returned " + repr(shortest(_towns, "F"))
          _apart = {"P": [("Q", 2)], "Q": [("P", 2)], "R": []}
          assert shortest(_apart, "P") == {"P": 0, "Q": 2, "R": float("inf")}, "A town that cannot be reached keeps the distance math.inf. You returned " + repr(shortest(_apart, "P"))
          assert shortest({"S": []}, "S") == {"S": 0}, "A single town is at distance 0 from itself. You returned " + repr(shortest({"S": []}, "S"))
          _oneway = {"S": [("M", 1), ("G", 9)], "M": [("G", 2)], "G": []}
