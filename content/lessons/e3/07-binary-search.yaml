    - question:
        id: work-infinite
        type: choice
        system: s2
        prompt: |
          In `find`, someone writes `low = middle` in place of `low = middle + 1`. The search for 99 in the figure's list never ends. With `low` at 13 and `high` at 14, what happens?
        options:
          - "`middle` is 14, and `low` jumps past `high`."
          - "`middle` is $(13 + 14) // 2 = 13$, the item there is smaller than 99, and `low` is set to 13, which it already was. Nothing has changed, so the next trip is identical, for ever."
          - "`middle` is 13.5, which is not a position."
          - "`high` is reduced below `low` and the loop ends."
        answer: 1
        explanation: |
          The division rounds down, so when two positions remain the middle is the lower one. If the code then sets `low = middle`, the stretch does not shrink. A loop is certain to end only if something gets strictly smaller on every trip, and here that something is the length of the stretch. `low = middle + 1` always removes at least the middle. In the boundary search, `high = middle` is safe for the mirror-image reason: `middle` is always strictly less than `high`, so `high` strictly falls. Whenever you write a loop like this, ask two questions: is the invariant kept, and what shrinks?
