            print("1 3 6")
          - |
            def first_at_least(items, target):
                low = 0
                high = len(items)
                while low < high:
                    middle = (low + high) // 2
                    if items[middle] <= target:
                        low = middle + 1
                    else:
                        high = middle
                return low

            print("1 3 6")
          - |
            def first_at_least(items, target):
                low = 0
                high = len(items)
                while low < high:
                    middle = (low + high) // 2
                    if items[middle] == target:
                        return middle
                    if items[middle] < target:
                        low = middle + 1
                    else:
                        high = middle
                return low

            print("1 3 6")
        explanation: |
          The invariant is that every position before `low` holds an item smaller than the target and every position from `high` on holds an item that is at least the target. It dictates each edge. `high` must start at `len(items)`, one past the end, because the answer can be the length itself: start it at the last position and a target larger than everything can never get the right answer. A middle item that is at least the target might be the first such, so `high = middle` keeps it in play. Returning early when the middle equals the target finds **a** matching item, and among repeats it need not be the first. Comparing with `<=` moves the boundary to the first item greater than the target, which is `bisect_right`. A scan from the front gets every answer right and misses the point, at 70000 looks where 17 will do.
    - question:
        id: write-largest-fitting
        type: code
        mode: write
        system: s2
        prompt: |
          You want the largest batch of examples that fits in memory. You are given a function `fits(b)` that returns `True` if a batch of size `b` fits and `False` if not. Every size up to some unknown threshold fits, and no larger size does. Write `largest_fitting(fits, limit)` to return the largest size from 1 to `limit` that fits, or 0 if not even a batch of 1 fits. Each call of `fits` is slow, so call it only about $\log_2$ of `limit` times.
        starter: |
          def largest_fitting(fits, limit):
              # Replace the next line with your own.
              return 0

          def fits(b):
              # 900 megabytes are always in use, and each example takes 37 more. There are 16000.
              return 900 + 37 * b <= 16000

          print(largest_fitting(fits, 4096))
        solution: |
          def largest_fitting(fits, limit):
              low = 1
              high = limit + 1
              while low < high:
                  middle = (low + high) // 2
                  if fits(middle):
                      low = middle + 1
                  else:
                      high = middle
              return low - 1

          def fits(b):
              # 900 megabytes are always in use, and each example takes 37 more. There are 16000.
              return 900 + 37 * b <= 16000

          print(largest_fitting(fits, 4096))
        tests: |
          assert largest_fitting(lambda b: 900 + 37 * b <= 16000, 4096) == 408, "With 900 + 37 b megabytes needed and 16000 available, the largest batch is 408. You returned " + repr(largest_fitting(lambda b: 900 + 37 * b <= 16000, 4096))
          assert largest_fitting(lambda b: b <= 5, 10) == 5, "If sizes up to 5 fit and the limit is 10, the answer is 5. You returned " + repr(largest_fitting(lambda b: b <= 5, 10))
          assert largest_fitting(lambda b: True, 64) == 64, "If every size fits, the answer is the limit, 64. You returned " + repr(largest_fitting(lambda b: True, 64))
          assert largest_fitting(lambda b: False, 64) == 0, "If nothing fits, the answer is 0. You returned " + repr(largest_fitting(lambda b: False, 64))
