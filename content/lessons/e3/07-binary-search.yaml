concept: e3.binary-search
minutes: 80
claim: You can find an item in a sorted list by halving, state the invariant that makes the code correct at its edges, count the looks as $\log_2 n$, find where an item belongs when it is absent, and apply the same halving to any question whose answer changes from no to yes exactly once.
recalls: [e3.sorting]
uses: [e3.hash-tables, e3.arrays-and-linked-lists, e1.complexity-and-big-o, e1.modules-and-imports, e0.lists-and-tuples, e0.loops, e0.functions, e0.booleans-and-conditionals, m1.logarithms]
leads: [e3.divide-and-conquer, e3.dynamic-programming]
starter: |
  # Scratch space. I am thinking of a number from 1 to 1000000.
  # After each guess you are told only whether the secret is higher, lower, or found.
  # This strategy guesses 1, 2, 3 and so on. Change `secret` and watch the count.
  secret = 618034

  def answer(guess):
      if guess < secret:
          return "higher"
      if guess > secret:
          return "lower"
      return "found"

  guess = 1
  guesses = 1
  while answer(guess) != "found":
      guess += 1
      guesses += 1
  print("found", guess, "after", guesses, "guesses")
parts:
  recall:
    - text: |
        [[e3.sorting]] ended by saying what a sorted list gives you: knowledge about every item without looking at it. Today you spend that knowledge. Three quick pulls first.
  puzzle:
    - text: |
        I am thinking of a whole number from 1 to a million. You guess, and I tell you one of three things: found, higher, or lower.

        **How many guesses do you need to be certain of finding it?**

        Run the starter. It guesses 1, then 2, then 3, and finds 618034 after 618034 guesses. In the worst case it needs a million. It uses my answers only to learn whether it has finished. Each "higher" could have told it much more.

        You already know a better plan, since you have played this game: guess the middle. Whatever I answer, half of the numbers are ruled out at once. Twenty guesses are enough for a million numbers, and thirty for a billion.

        This is the game being played whenever a program looks something up in a sorted list, and the plan is called **binary search**. Here is the surprising part. The plan can be explained to a child, and yet for sixteen years after it was first published, no correct program for it appeared in print. Even in careful hands it tends to come out with a fault at the edges: an item at the very end that cannot be found, or a search that goes round for ever when two candidates remain.

        **How do you write the halving so that you know it is right, at the edges as well as in the middle?**
  intuition:
    - text: |
        Take a sorted list and something to look for, the **target**. Look at the middle item.

        If it is the target, you are done. If it is smaller than the target, then so is everything to its left, since the list is sorted, and the target can only be to the right. If it is larger, the target can only be to the left. One look, and half of the list never needs looking at.

        The thing to hold in mind is the **stretch of positions where the target could still be**. It starts as the whole list. Each look cuts it roughly in half. When it is empty, the target is not in the list.

        Step through a search for 23 among fifteen sorted numbers. Then move the slider to search for others, and press the button to search for 50, which is not there.
    - figure: binary-search
      props: { target: 5 }
    - text: |
        Fifteen positions become seven, then three, then one. No item needs more than four looks, and 50 is shown to be absent after four looks, with eleven of the fifteen items never examined.

        Notice also where the search for 50 ends: with the possible stretch squeezed to nothing between 42 and 56. That is exactly the place where 50 would go if it were added. A search that fails still tells you something, and that will turn out to be the more useful half of the idea.
  derivation:
    - text: |
        **Looking without order.** In a list in no particular order, an item can only be found by looking at each in turn. That is **linear search**. It takes up to $n$ looks, and a look that fails rules out one position.

        **The code.** Now assume the list is sorted. Keep two positions, `low` and `high`, marking the ends of the stretch where the target could still be, both ends included.

        ```python
        def find(items, target):
            low = 0
            high = len(items) - 1
            while low <= high:
                middle = (low + high) // 2
                if items[middle] == target:
                    return middle
                if items[middle] < target:
                    low = middle + 1
                else:
                    high = middle - 1
            return None
        ```

        Every line here is decided by one sentence, the **invariant** of the loop:

        > If the target is in the list at all, its position is from `low` to `high` inclusive.

        Check each line against it.

        - **The start.** `low = 0` and `high = len(items) - 1` make the stretch the whole list, so the sentence is true.
        - **Moving `low`.** If `items[middle] < target`, then every item at or before `middle` is too small. The target can only be from `middle + 1` onwards. Setting `low = middle + 1` keeps the sentence true.
        - **Moving `high`.** If `items[middle] > target`, everything at or after `middle` is too large, and `high = middle - 1` keeps it true.
        - **The condition.** The stretch from `low` to `high` holds `high - low + 1` positions. It is empty exactly when `low > high`. So the loop runs while `low <= high`, and when it stops, the sentence says the target is nowhere.

        **Does it stop?** Each trip round the loop either returns or removes `middle` and one whole side from the stretch. So the stretch gets shorter by at least one position every time, and cannot do so for ever.

        The two classic faults are both breaches of this reasoning. Write `while low < high` and the loop stops while one candidate remains unexamined: the last item of the list can then never be found. Write `low = middle` in place of `low = middle + 1` and, when `high` is `low + 1`, the middle is `low` itself, nothing changes, and the loop never ends. Neither fault shows in a casual test. Both are plain once you ask whether the invariant is kept and whether the stretch shrinks.

        **Counting the looks.** If the stretch holds $m$ positions, then after one look that fails it holds at most $m/2$, rounded down, since the middle is removed and the larger side is kept at worst. So the sizes go at most

        $$n, \ \left\lfloor \frac{n}{2} \right\rfloor, \ \left\lfloor \frac{n}{4} \right\rfloor, \ \dots$$

        and the number of looks is at most the number of times $n$ can be halved before reaching zero, which is $\lfloor \log_2 n \rfloor + 1$. For 15 items that is $3 + 1 = 4$. For a million it is 20. Binary search is $O(\log n)$.

        Set that beside linear search. Doubling the list adds a million looks to one and a single look to the other.
    - question:
        id: derive-missing
        type: order
        system: s2
        prompt: The figure's list holds 2, 5, 8, 12, 16, 23, 38, 42, 56, 61, 72, 80, 91, 95, 99 at positions 0 to 14. `find` looks for 50. Put the stretches of possible positions in the order they occur.
        steps:
          - "positions 0 to 14"
          - "positions 8 to 14"
          - "positions 8 to 10"
          - "position 8 only"
          - "no positions"
        explanation: |
          The middle of 0 to 14 is position 7, holding 42, which is too small, so `low` becomes 8. The middle of 8 to 14 is position 11, holding 80, too large, so `high` becomes 10. The middle of 8 to 10 is position 9, holding 61, too large, so `high` becomes 8. Position 8 holds 56, too large, so `high` becomes 7, which is below `low`, and the stretch is empty. Four looks, and `low` has stopped at 8, the position where 50 would be inserted.
    - text: |
        **Where would it go?** `find` answers "is it there, and where?". A better question is "**how many items are smaller than the target?**". The answer is a position: the first position holding an item that is not smaller, which is where the target is if present and where it would be inserted if absent.

        Imagine asking of every position in turn, "is this item at least the target?". Because the list is sorted, the answers read no, no, no, yes, yes, yes: once the answer is yes it stays yes. The search is for the **boundary**, the first yes.

        ```python
        def first_at_least(items, target):
            low = 0
            high = len(items)
            while low < high:
                middle = (low + high) // 2
                if items[middle] < target:
                    low = middle + 1
                else:
                    high = middle
            return low
        ```

        The invariant has changed, and so the edges have changed with it:

        > Every position before `low` is a no. Every position from `high` onwards is a yes.

        At the start `low = 0` and `high = len(items)`, so both halves of the sentence speak of no positions at all and are true. Note that `high` starts one past the end, because the answer may be "all of them are smaller". The positions not yet known are those from `low` up to but not including `high`, and there are `high - low` of them, so the loop runs while `low < high`. A no at `middle` makes everything up to `middle` a no: `low = middle + 1`. A yes at `middle` makes `middle` a yes, and it may be the first: `high = middle`, not `middle - 1`. Since `middle` is always less than `high`, the stretch shrinks every time. When `low` meets `high`, the boundary is found.

        There is no early return and no special case, and the function answers several questions at once.

        - **Is the target present?** Only if the position returned is inside the list and holds the target.
        - **How many items are below $b$ and at least $a$?** `first_at_least(items, b) - first_at_least(items, a)`. A count over a range, in two searches.
        - **Where does a new item go to keep the list sorted?** At the position returned.

        Python has this function in the module `bisect`, under the name `bisect.bisect_left`. Its twin `bisect.bisect_right` finds the first item strictly greater than the target, which differs only when the target is present.

        ```python
        import bisect

        marks = [35, 48, 48, 61, 77, 90]
        print(bisect.bisect_left(marks, 48))    # 1
        print(bisect.bisect_right(marks, 48))   # 3
        print(bisect.bisect_left(marks, 50))    # 3
        ```
    - question:
        id: derive-range-count
        type: numeric
        system: s2
        prompt: |
          `marks = [35, 48, 48, 61, 77, 90]`. Using `first_at_least(marks, 80) - first_at_least(marks, 48)`, how many marks are at least 48 and below 80?
        answer: "4"
        explanation: |
          `first_at_least(marks, 80)` is 5, since five marks are below 80. `first_at_least(marks, 48)` is 1, since one mark is below 48. The difference counts the marks that are below 80 and not below 48: the two 48s, 61 and 77.
    - text: |
        **Searching without a list.** Look again at `first_at_least`. It never used the list except to ask a yes-or-no question about a position. All it needed was that the answers go no, no, no, yes, yes, yes.

        So binary search does not need a list at all. It needs a question about whole numbers whose answer **changes exactly once**. Then the boundary among a million candidates is found by asking the question twenty times.

        Here is a case you will meet when training a model. A batch of examples is processed together, and the larger the batch, the more memory it takes. You want the largest batch that fits. Running out of memory takes a minute to discover, so trying every size is hopeless. But "does a batch of size $b$ fail to fit?" is no for small $b$ and yes for large, and changes once. Halving finds the boundary among sizes up to 4096 in thirteen trials.

        The guessing game of the puzzle was this too. Nobody stored the numbers from 1 to a million. The question "is the secret at most my guess?" changes once, at the secret.

        The same halving works on real numbers, where it is called **bisection**. To find $\sqrt{2}$, ask "is $x^2 \ge 2$?", which changes once on the positive numbers. Start with the stretch from 1 to 2 and halve it:

        $$[1, 2] \to [1, 1.5] \to [1.25, 1.5] \to [1.375, 1.5] \to [1.375, 1.4375] \to \dots$$

        Each step halves the width, so each step buys one more binary digit of the answer. Ten steps narrow the stretch a thousandfold, and about fifty exhaust the precision of a float.
  formal:
    - text: |
        **Linear search.** Examine each item in turn. Up to $n$ looks, and needs no order.

        **Binary search.** On a sorted list, keep `low` and `high` such that the target, if present, lies at a position from `low` to `high` inclusive. Compare the target with the item at `middle = (low + high) // 2`, and return, or set `low = middle + 1`, or set `high = middle - 1`. Stop when `low > high`. At most $\lfloor \log_2 n \rfloor + 1$ looks.

        **Boundary search.** Given a question on positions $0, \dots, n-1$ whose answers are a run of no followed by a run of yes, keep `low` and `high` such that every position before `low` is a no and every position from `high` on is a yes, starting from $0$ and $n$. While `low < high`, a no at `middle` gives `low = middle + 1` and a yes gives `high = middle`. The result is the position of the first yes, or $n$ if there is none. At most $\lceil \log_2 (n + 1) \rceil$ questions.

        **`bisect_left(items, x)`** is the first position holding an item $\ge x$, which equals the number of items $< x$. **`bisect_right(items, x)`** is the first position holding an item $> x$.

        **Bisection.** On real numbers, halving a stretch of width $w$ a total of $k$ times leaves width $w / 2^k$.
