  work:
    - text: Slower now. For each loop, write down its invariant in a sentence before writing any code, and let the sentence decide each edge.
    - question:
        id: write-first-at-least
        type: code
        mode: write
        system: s2
        prompt: |
          Write `first_at_least(items, target)`. `items` is sorted, smallest first, and may hold repeats. Return the position of the first item that is at least `target`, or the length of the list if every item is smaller. Do it by halving, so that a list of 100000 items needs about 17 looks. Do not use the `bisect` module.
        starter: |
          def first_at_least(items, target):
              # Replace the next line with your own.
              return 0

          marks = [35, 48, 48, 61, 77, 90]
          print(first_at_least(marks, 48), first_at_least(marks, 50), first_at_least(marks, 95))
        solution: |
          def first_at_least(items, target):
              low = 0
              high = len(items)
              while low < high:
                  middle = (low + high) // 2
                  if items[middle] < target:
                      low = middle + 1
                  else:
                      high = middle
              return low

          marks = [35, 48, 48, 61, 77, 90]
          print(first_at_least(marks, 48), first_at_least(marks, 50), first_at_least(marks, 95))
        tests: |
          _m = [35, 48, 48, 61, 77, 90]
          assert first_at_least(_m, 48) == 1, "In [35, 48, 48, 61, 77, 90] the first item at least 48 is at position 1. You returned " + repr(first_at_least(_m, 48))
          assert first_at_least(_m, 50) == 3, "In [35, 48, 48, 61, 77, 90] the first item at least 50 is at position 3. You returned " + repr(first_at_least(_m, 50))
          assert first_at_least(_m, 95) == 6, "Every item is below 95, so the answer is the length, 6. You returned " + repr(first_at_least(_m, 95))
          assert first_at_least(_m, 10) == 0, "Every item is at least 10, so the answer is 0. You returned " + repr(first_at_least(_m, 10))
          assert first_at_least(_m, 90) == 5, "The last item is 90, at position 5. You returned " + repr(first_at_least(_m, 90))
          assert first_at_least([], 3) == 0, "For an empty list the answer is 0. You returned " + repr(first_at_least([], 3))
          assert first_at_least([4], 4) == 0, "first_at_least([4], 4) should be 0. You returned " + repr(first_at_least([4], 4))
          assert first_at_least([4], 5) == 1, "first_at_least([4], 5) should be 1. You returned " + repr(first_at_least([4], 5))
          assert first_at_least([1, 2, 2, 2, 2, 2, 3], 2) == 1, "With repeats, the first of them is wanted. first_at_least([1, 2, 2, 2, 2, 2, 3], 2) should be 1. You returned " + repr(first_at_least([1, 2, 2, 2, 2, 2, 3], 2))
          for _t in range(-1, 42):
              _want = len([x for x in range(0, 40, 3) if x < _t])
              assert first_at_least(list(range(0, 40, 3)), _t) == _want, "Among 0, 3, 6, up to 39, the first item at least " + str(_t) + " is at position " + str(_want) + ". You returned " + repr(first_at_least(list(range(0, 40, 3)), _t))
          class _Counting(list):
              looks = 0
              def __getitem__(self, i):
                  _Counting.looks += 1
                  return list.__getitem__(self, i)
              def __iter__(self):
                  _Counting.looks += 1000000
                  return list.__iter__(self)
          _big = _Counting(range(100000))
          assert first_at_least(_big, 70000) == 70000, "Among the numbers 0 to 99999, the first at least 70000 is at position 70000"
          assert _Counting.looks <= 40, "A list of 100000 items should need about 17 looks. Yours looked at items " + str(_Counting.looks) + " times, so it is not halving"
          assert output.strip() == "1 3 6", "The program should print 1 3 6"
        wrong:
          - |
            def first_at_least(items, target):
                position = 0
                while position < len(items) and items[position] < target:
                    position += 1
                return position

            marks = [35, 48, 48, 61, 77, 90]
