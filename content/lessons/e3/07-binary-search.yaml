          A language model gives four possible next words the probabilities 0.1, 0.3, 0.05 and 0.55. To pick one at random, the running totals are formed, `[0.1, 0.4, 0.45, 1.0]`, a random number `r` is drawn between 0 and 1, and the word chosen is at the first position whose running total is at least `r`. With `r = 0.42`, which position is chosen?
        answer: "2"
        explanation: |
          `first_at_least([0.1, 0.4, 0.45, 1.0], 0.42)` is 2, since two running totals are below 0.42. Why this picks fairly: position 2 is chosen exactly when `r` falls between 0.4 and 0.45, a stretch of width 0.05, which is that word's probability. Running totals of positive numbers are always sorted, so the lookup is a binary search, and choosing among fifty thousand words takes sixteen looks. You will write exactly this when you sample text from a model of your own.
    - question:
        id: work-sort-or-not
        type: choice
        system: s2
        prompt: |
          You have a million records in no order. Which is the best advice about looking things up in them?
        options:
          - "Always sort first, since binary search is faster than linear search."
          - "For one lookup, search linearly: a million looks is less than the twenty million comparisons of sorting. For many lookups, sort once and each costs 20. For exact matches only, a hash table costs $O(1)$ each, though it cannot answer questions about ranges or nearest values, which a sorted list can."
          - "Never sort, since sorting costs more than searching."
          - "Use binary search on the unsorted records. It is right most of the time."
        answer: 1
        explanation: |
          Sorting is an investment of about $n \log_2 n$ comparisons, repaid a little with each search. With $k$ lookups the choice is between $k \cdot n$ looks unsorted and $n \log_2 n + k \log_2 n$ sorted, and the sorted side wins once $k$ exceeds about $\log_2 n$, which is 20 here. A hash table from the third lesson of this cluster does better still for the question "is exactly this key present?". What it cannot do is use order. "How many records fall between these two times?" and "which record is nearest to this value?" need the items laid out in order, and there the sorted list and the boundary search have no rival.
  connections:
    - text: |
        The puzzle asked how many guesses find a number from 1 to a million, and how to write the halving so that it is right at the edges. Twenty guesses, because each rules out half of what remains and a million can be halved only twenty times. And the edges are settled by an invariant: a sentence saying what is known about the positions outside `low` and `high`, which is true at the start, is kept true by every assignment, and gives the answer when the loop stops. The condition of the loop, the `+ 1` and the starting values are consequences of the sentence, not matters of taste.

        The order that made this possible was bought in [[e3.sorting]], where a look at the middle of a sorted list was promised to rule out half of it. The logarithm is the same one that counted the rounds of merge sort. And the boundary search went beyond lists: any question whose answer changes once can be halved, whether the candidates are positions, batch sizes or real numbers.

        Set binary search beside merge sort. Both split the problem in half. Merge sort must then solve **both** halves and pay $n$ to combine them. Binary search solves **one** half and throws the other away. One costs $n \log_2 n$ and the other $\log_2 n$, and the difference is in how many halves are kept and what the combining costs.

        That observation is the beginning of a method. A problem is split into smaller copies of itself, some number of the copies are solved, and the results are combined. How many copies, how much smaller, and how costly the combining: those three numbers decide the running time, and there is a way to read it off. That is the next lesson, [[e3.divide-and-conquer]].
