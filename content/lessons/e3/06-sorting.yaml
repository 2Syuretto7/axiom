concept: e3.sorting
minutes: 90
claim: You can sort a list by insertion and by merging, count the comparisons each needs, explain where the $n^2$ of one and the $n \log_2 n$ of the other come from, say why no method that works by comparing can do better, and use Python's sort with keys and stability to rank things.
recalls: [e3.graphs-and-traversal]
uses: [e3.trees-and-heaps, e3.arrays-and-linked-lists, e1.recursion, e1.complexity-and-big-o, e1.modules-and-imports, e0.lists-and-tuples, e0.dictionaries-and-sets, e0.loops, e0.functions, m1.logarithms, m2.composition-and-inverses, m4.angle-and-cosine-similarity]
leads: [e3.binary-search, e3.divide-and-conquer]
starter: |
  # Scratch space. Sort by moving each item left until it is in place, and count the comparisons.
  # Each list is twice as long as the one before. How does the count grow?
  import random

  def comparisons_to_sort(items):
      items = list(items)
      count = 0
      for i in range(1, len(items)):
          j = i
          while j > 0:
              count += 1
              if items[j - 1] <= items[j]:
                  break
              items[j - 1], items[j] = items[j], items[j - 1]
              j -= 1
      return count

  random.seed(1)
  for n in [250, 500, 1000, 2000]:
      items = [random.random() for _ in range(n)]
      print(n, comparisons_to_sort(items))
