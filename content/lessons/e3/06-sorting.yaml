  puzzle:
    - text: |
        Eight cards lie face down in a row, carrying the numbers 5, 2, 8, 1, 9, 3, 7 and 4. You cannot read them. All you may do is point at two cards and ask which is larger, and swap cards if you wish. Each question costs one rupee.

        **How much must you spend to be sure the row is in order? And how much for a million cards?**

        The second question is the one that matters. Run the starter. It sorts lists of 250, 500, 1000 and 2000 random numbers by the method most people use on a hand of cards, and counts the questions asked. Each time the list doubles, the count is multiplied by about four. For 2000 items it is about a million. Carry on doubling and a million items would need about $2.5 \times 10^{11}$, a quarter of a trillion comparisons, and several hours of a computer's time.

        Yet `sorted` puts a million numbers in order in under a second. It is not a faster computer. It asks far fewer questions: about twenty million.

        **What does it know that the hand of cards does not? And could some cleverer method ask fewer still?**
  intuition:
    - text: |
        Begin with the hand of cards. You pick up cards one at a time, and each new card is slid left past every card larger than it until it meets one that is not. The cards already in your hand are always in order, and each new card is **inserted** into its place among them. That is **insertion sort**.

        Step through it on the row of the puzzle and watch the count of comparisons.
    - figure: sort-steps
    - text: |
        After seven passes the row is sorted, at a cost of 18 comparisons. Notice which passes were dear. The 9 cost one comparison, because it was already larger than everything before it. The 1 cost three and the 4 cost five, because each had to pass nearly everything placed so far. A small item arriving late is the expensive case, and in a random list an item passes about half of those before it. Item number $i$ costs about $i/2$ comparisons, and those add up to about $n^2/4$. That is the fourfold growth the starter showed.

        The waste is that insertion sort moves an item **one place per comparison**. An item a thousand places from home costs a thousand comparisons.

        Now a different observation. Suppose someone hands you two piles of cards, **each already in order**, and asks for one pile in order. This is easy. Look at the top card of each pile, take the smaller, and repeat. Each comparison places one card for good, and it never needs revisiting. Two sorted piles of half a million are merged into one sorted million with fewer than a million comparisons.

        So a million cards can be sorted cheaply **if the two halves are already sorted**. And the halves? Each can be sorted cheaply if its own halves are sorted. Carry on halving and you reach piles of one card, which are sorted already. Then merge your way back up. That is **merge sort**. Switch the figure to it.
    - figure: sort-steps
      props: { method: merge }
    - text: |
        Three rounds of merging, since eight halves three times to reach one. The rounds cost 4, 6 and 7 comparisons, 17 in all. For eight cards that is no better than insertion sort's 18. The difference is in how the two grow. Every round of merging costs fewer than $n$ comparisons, and there are only $\log_2 n$ rounds.
  derivation:
    - text: |
        **Insertion sort.** In code, the item at position `i` is swapped leftwards while the item before it is larger.

        ```python
        def insertion_sort(items):
            for i in range(1, len(items)):
                j = i
                while j > 0 and items[j - 1] > items[j]:
                    items[j - 1], items[j] = items[j], items[j - 1]
                    j -= 1
        ```

        The line with two names on each side of the `=` swaps two items: the right side is built first, as a tuple, and then unpacked into the two places. The function changes the list it is given, and returns nothing. That is called sorting **in place**.

        Why is it correct? Before each pass, the first `i` items are in order among themselves. The pass slides item `i` left until the item before it is no larger, and now the first `i + 1` items are in order. A statement like that, true before every pass and kept true by each pass, is a **loop invariant**, and it is induction from [[e1.recursion]] written as a loop. When the last pass ends, "the first $n$ items are in order" says the list is sorted.

        **Counting its work.** How many comparisons? It depends on the list.

        If the list is **already sorted**, every pass asks one question, gets the answer "no larger", and stops: $n - 1$ comparisons.

        If the list is **in reverse**, item $i$ passes all $i$ items before it. The total is

        $$1 + 2 + \dots + (n-1) = \frac{n(n-1)}{2}.$$

        For anything between, count **inversions**. An inversion is a pair of items in the wrong order: a larger one somewhere before a smaller one. The row 5, 2, 8, 1, 9, 3, 7, 4 has 13 of them. A sorted list has none, and a reversed list has every pair, $n(n-1)/2$.

        Each swap of insertion sort exchanges two **neighbours** that are in the wrong order. That removes exactly one inversion, the pair itself, and changes no other, since every other item stays on the same side of both. So

        $$\text{swaps} = \text{inversions}.$$

        The number of swaps is fixed by the list, not by the luck of the method. In a random list each pair is equally likely to be either way round, so half of all pairs are inversions: about $n(n-1)/4$. Insertion sort is $O(n^2)$ on average and in the worst case, and $O(n)$ on a list that is nearly sorted. Keep that last fact. It will be used.
    - question:
        id: derive-inversions
        type: numeric
        system: s2
        prompt: |
          The list `[4, 1, 3, 2]` is sorted by insertion sort. How many swaps does it make?
        answer: "4"
        explanation: |
          Count the inversions, the pairs with the larger item first: (4, 1), (4, 3), (4, 2) and (3, 2). There are four, and each swap of neighbours removes exactly one. Check by running it: 1 passes 4, one swap. 3 passes 4, one swap. 2 passes 4 and 3, two swaps.
        hints:
          - Each swap removes exactly one pair that is in the wrong order.
          - List the pairs in which a larger number stands before a smaller one.
          - 4 stands before three smaller numbers. What about 3?
    - text: |
        **Merging.** Two sorted lists are merged by walking a finger along each.

        ```python
        def merge(left, right):
            result = []
            i = 0
            j = 0
            while i < len(left) and j < len(right):
                if left[i] <= right[j]:
                    result.append(left[i])
                    i += 1
                else:
                    result.append(right[j])
                    j += 1
            return result + left[i:] + right[j:]
        ```

        Each trip round the loop asks one question and places one item. When one list runs out, whatever remains of the other is already in order and larger than everything placed, so it is added whole. One of the two slices on the last line is always empty.

        To merge lists of lengths $a$ and $b$, the loop runs at most $a + b - 1$ times, because the last item is never compared with anything. At best it runs $\min(a, b)$ times, when one list lies wholly below the other.

        **Merge sort.** Now the recursion writes itself.

        ```python
        def merge_sort(items):
            if len(items) <= 1:
                return items
            middle = len(items) // 2
            return merge(merge_sort(items[:middle]), merge_sort(items[middle:]))
        ```

        A list of one item or none is sorted. Otherwise sort each half and merge. This is the leap of faith of [[e1.recursion]]: trust that the function sorts lists shorter than this one, and it follows that it sorts this one.

        **Counting its work.** Take $n$ a power of 2 and lay the calls out in levels. At the top, one merge producing $n$ items. Below it, two merges producing $n/2$ each. Below that, four producing $n/4$ each. On every level the merges together produce $n$ items, and so ask fewer than $n$ questions. How many levels? The lists halve until they reach length 1, which takes $\log_2 n$ halvings. So

        $$\text{comparisons} \le n \log_2 n.$$

        For the eight cards that is at most $8 \times 3 = 24$, and the figure counted 17. For a million items, $\log_2 10^6$ is about 20, so about twenty million comparisons against insertion sort's quarter of a trillion. That is the gap of the puzzle: a factor of more than ten thousand, from one idea.

        There is a price. Merge sort builds new lists, so it needs room for a second copy of the data, $O(n)$ extra space, where insertion sort needs none.
    - question:
        id: derive-merge-rounds
        type: order
        system: s2
        prompt: Merge sort runs on the row 5, 2, 8, 1, 9, 3, 7, 4. Put these stages in the order they occur, from the moment the list has been split into single items.
        steps:
          - "[5] [2] [8] [1] [9] [3] [7] [4]"
          - "[2, 5] [1, 8] [3, 9] [4, 7]"
          - "[1, 2, 5, 8] [3, 4, 7, 9]"
          - "[1, 2, 3, 4, 5, 7, 8, 9]"
        explanation: Neighbouring runs are merged in pairs, so the length of the sorted runs doubles each round, from 1 to 2 to 4 to 8. Three doublings reach eight, which is $\log_2 8$ rounds.
        hints:
          - Each round merges neighbouring sorted runs in pairs.
          - The runs double in length each round.
          - The last stage is one run holding everything.
    - text: |
        **Can anything do better?** Here is an argument that settles it for every method at once, including ones nobody has invented.

        Think of the puzzle as a game of questions. The cards are in one of $n!$ possible orders, and you must find out which, since different orders need different rearrangements. Each comparison has two possible answers. So after $k$ comparisons, a method can have seen at most $2^k$ different sequences of answers, and can tell apart at most $2^k$ orders. To tell apart all $n!$ it needs

        $$2^k \ge n!, \qquad \text{so} \qquad k \ge \log_2 (n!).$$

        How large is that? The larger half of the factors of $n!$ are each at least $n/2$, so $n! \ge (n/2)^{n/2}$ and

        $$\log_2 (n!) \ge \frac{n}{2} \log_2 \frac{n}{2}.$$

        That grows like $n \log_2 n$. **No method that sorts by comparing can beat $n \log n$ in the worst case**, and merge sort reaches it. For the eight cards, $8! = 40320$ lies between $2^{15}$ and $2^{16}$, so sixteen rupees are needed in the worst case whatever you do, and merge sort's worst case of seventeen is within one of the best possible.

        The same count of questions is the reason a heap can be no faster than it is. Push $n$ items into a heap and pop them all, and they come out in order. That is a sort, **heap sort**, costing $O(n \log n)$. If pushing and popping were both $O(1)$, it would sort in $O(n)$, which has just been shown impossible.

        **Sorting in Python.** `sorted(items)` returns a new sorted list and leaves the original alone. The method `items.sort()` sorts the list in place and returns `None`. Both use a method called Timsort, which is merge sort with one refinement: it first looks for stretches that are already in order, and it sorts short stretches by insertion sort, which you saw is fastest on small and nearly sorted lists. On a list that is already sorted it costs $O(n)$.

        Both take a **key**, a function applied to each item to produce the value it is sorted by.

        ```python
        words = ["pear", "fig", "apple", "kiwi"]
        print(sorted(words, key=len))             # ['fig', 'pear', 'kiwi', 'apple']
        print(sorted(words, key=len, reverse=True))  # ['apple', 'pear', 'kiwi', 'fig']
        ```

        Look at "pear" and "kiwi". They have the same length, and in both results "pear" comes first, as it did in the original. A sort that keeps items with equal keys in their original order is called **stable**. Python's sort is stable. Merge sort is stable provided the merge takes from the left pile on a tie, which is what the `<=` in `merge` does. Stability is what lets you sort by one thing and then another: sort by name, then sort by marks, and those with equal marks remain in order of name.

        Tuples are compared item by item, the first deciding and the second breaking ties. So a key that returns a tuple sorts by several things at once.

        ```python
        scores = {"cat": 0.9, "dog": 0.7, "ant": 0.9}
        ranked = sorted(scores, key=lambda name: (-scores[name], name))
        print(ranked)                             # ['ant', 'cat', 'dog']
        ```

        The minus sign puts the largest score first, and the name settles the tie. This is how a search ranks its results: compute the cosine similarity of [[m4.angle-and-cosine-similarity]] between the query and each document, and sort by it, largest first.
  formal:
    - text: |
        **Sorting.** Rearranging a list so that each item is no larger than the next. An **inversion** is a pair of positions $i < j$ with the item at $i$ larger than the item at $j$. A list is sorted exactly when it has no inversions.

        **Insertion sort.** For $i = 1, \dots, n-1$, swap item $i$ leftwards while the item before it is larger. Swaps equal inversions. Comparisons are $n - 1$ at best, $n(n-1)/2$ at worst, about $n^2/4$ on average. In place.

        **Merge.** Two sorted lists of lengths $a$ and $b$ are combined into one sorted list with at most $a + b - 1$ comparisons.

        **Merge sort.** Sort each half recursively and merge. At most $n \log_2 n$ comparisons, in every case. Needs $O(n)$ extra space.

        **Lower bound.** Any method that sorts by comparing pairs needs at least $\log_2(n!)$ comparisons in the worst case, which grows like $n \log_2 n$.

        **Stable.** A sort is stable if items with equal keys keep their original order. Insertion sort, merge sort and Python's `sorted` and `sort` are stable.
