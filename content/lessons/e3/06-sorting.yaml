  work:
    - text: Slower now. Before writing a loop, say what is true of the list each time the loop comes round.
    - question:
        id: write-merge
        type: code
        mode: write
        system: s2
        prompt: |
          Write `merge(left, right)`. Both arguments are lists already in order, smallest first. Return one new list holding every item of both, in order. Walk along the two lists as in the lesson, without calling `sorted` or `sort`, so that the work is one comparison for each item placed.
        starter: |
          def merge(left, right):
              # Replace the next line with your own.
              return left + right

          print(merge([1, 4, 9], [2, 3, 10, 11]))
        solution: |
          def merge(left, right):
              result = []
              i = 0
              j = 0
              while i < len(left) and j < len(right):
                  if left[i] <= right[j]:
                      result.append(left[i])
                      i += 1
                  else:
                      result.append(right[j])
                      j += 1
              return result + left[i:] + right[j:]

          print(merge([1, 4, 9], [2, 3, 10, 11]))
        tests: |
          assert merge([1, 4, 9], [2, 3, 10, 11]) == [1, 2, 3, 4, 9, 10, 11], "merge([1, 4, 9], [2, 3, 10, 11]) should be [1, 2, 3, 4, 9, 10, 11]. You returned " + repr(merge([1, 4, 9], [2, 3, 10, 11]))
          assert merge([], [1, 2]) == [1, 2], "Merging an empty list with [1, 2] should give [1, 2]. You returned " + repr(merge([], [1, 2]))
          assert merge([5], []) == [5], "Merging [5] with an empty list should give [5]. You returned " + repr(merge([5], []))
          assert merge([], []) == [], "Merging two empty lists should give an empty list. You returned " + repr(merge([], []))
          assert merge([2, 2, 7], [2, 3, 7]) == [2, 2, 2, 3, 7, 7], "Equal items must all be kept. merge([2, 2, 7], [2, 3, 7]) should be [2, 2, 2, 3, 7, 7]. You returned " + repr(merge([2, 2, 7], [2, 3, 7]))
          assert merge([8, 9], [1, 2, 3]) == [1, 2, 3, 8, 9], "When one list lies wholly above the other, the lower comes first. You returned " + repr(merge([8, 9], [1, 2, 3]))
          assert merge([1, 3, 5, 7], [2, 4, 6]) == [1, 2, 3, 4, 5, 6, 7], "merge([1, 3, 5, 7], [2, 4, 6]) should be [1, 2, 3, 4, 5, 6, 7]. You returned " + repr(merge([1, 3, 5, 7], [2, 4, 6]))
          _a = [1, 5]
          _b = [2, 6]
          merge(_a, _b)
          assert _a == [1, 5] and _b == [2, 6], "The two lists given should be left unchanged"
          assert output.strip() == "[1, 2, 3, 4, 9, 10, 11]", "The program should print [1, 2, 3, 4, 9, 10, 11]"
        wrong:
          - |
            def merge(left, right):
                result = []
                i = 0
                j = 0
                while i < len(left) and j < len(right):
                    if left[i] <= right[j]:
                        result.append(left[i])
                        i += 1
                    else:
                        result.append(right[j])
                        j += 1
                return result

            print([1, 2, 3, 4, 9, 10, 11])
          - |
            def merge(left, right):
                result = []
                for k in range(max(len(left), len(right))):
                    if k < len(left):
                        result.append(left[k])
                    if k < len(right):
                        result.append(right[k])
                return result

            print([1, 2, 3, 4, 9, 10, 11])
          - |
            def merge(left, right):
                return sorted(set(left + right))

            print(merge([1, 4, 9], [2, 3, 10, 11]))
          - |
            def merge(left, right):
                result = []
                while len(left) > 0 and len(right) > 0:
                    if left[0] <= right[0]:
                        result.append(left.pop(0))
                    else:
                        result.append(right.pop(0))
                return result + left + right

            print(merge([1, 4, 9], [2, 3, 10, 11]))
        explanation: |
          Two fingers, `i` and `j`, mark the smallest item not yet taken from each list. Whichever is smaller is the smallest of everything that remains, so it is safe to place it and never look at it again. The loop ends when one list is used up, and what remains of the other is added whole, since it is in order and nothing smaller is left. Forgetting that last step loses the tail. Taking items alternately ignores their sizes. Removing items from the front of the lists with `pop(0)` gives the right answer and two faults: it empties the lists you were given, and each removal from the front of an array shifts everything after it, as you found in the first lesson of this cluster, which turns a merge of $n$ items into $O(n^2)$ work.
        hints:
          - Keep an index into each list, both starting at 0.
          - While both indexes are inside their lists, append the smaller of the two items they point at and advance that index.
          - When the loop ends, add what remains of each list with the slices left[i:] and right[j:].
    - question:
        id: write-rank
        type: code
        mode: write
        system: s2
        prompt: |
          A search has computed the cosine similarity between a query and each document, and holds the results in a dictionary from the document's name to its similarity. Write `rank(scores)` to return the list of names with the most similar first. Documents with equal similarity go in alphabetical order.
        starter: |
          def rank(scores):
              # Replace the next line with your own.
              return list(scores)

          scores = {"tides": 0.31, "moons": 0.87, "orbits": 0.87, "crabs": 0.05}
          print(rank(scores))
        solution: |
          def rank(scores):
              return sorted(scores, key=lambda name: (-scores[name], name))

          scores = {"tides": 0.31, "moons": 0.87, "orbits": 0.87, "crabs": 0.05}
          print(rank(scores))
        tests: |
          assert rank({"tides": 0.31, "moons": 0.87, "orbits": 0.87, "crabs": 0.05}) == ["moons", "orbits", "tides", "crabs"], "The most similar should come first. You returned " + repr(rank({"tides": 0.31, "moons": 0.87, "orbits": 0.87, "crabs": 0.05}))
          assert rank({"b": 0.5, "a": 0.5, "c": 0.5}) == ["a", "b", "c"], "Equal similarities should come out in alphabetical order. You returned " + repr(rank({"b": 0.5, "a": 0.5, "c": 0.5}))
          assert rank({"z": 0.2, "y": 0.9, "x": 0.2, "w": 0.9}) == ["w", "y", "x", "z"], "With scores z 0.2, y 0.9, x 0.2, w 0.9 the ranking is w, y, x, z. You returned " + repr(rank({"z": 0.2, "y": 0.9, "x": 0.2, "w": 0.9}))
          assert rank({"only": -0.4}) == ["only"], "One document ranks first. You returned " + repr(rank({"only": -0.4}))
          assert rank({}) == [], "No documents give an empty list. You returned " + repr(rank({}))
          assert rank({"up": 0.1, "down": -0.8, "flat": 0.0}) == ["up", "flat", "down"], "A negative similarity ranks below zero. You returned " + repr(rank({"up": 0.1, "down": -0.8, "flat": 0.0}))
          _s = {"q": 0.3, "p": 0.6}
          rank(_s)
          assert _s == {"q": 0.3, "p": 0.6}, "The dictionary given should be left unchanged"
          assert output.strip() == "['moons', 'orbits', 'tides', 'crabs']", "The program should print ['moons', 'orbits', 'tides', 'crabs']"
        wrong:
          - |
            def rank(scores):
                return sorted(scores, key=lambda name: scores[name])

            print(['moons', 'orbits', 'tides', 'crabs'])
          - |
            def rank(scores):
                return sorted(scores)

            print(['moons', 'orbits', 'tides', 'crabs'])
          - |
            def rank(scores):
                return sorted(scores, key=lambda name: scores[name], reverse=True)

            scores = {"tides": 0.31, "moons": 0.87, "orbits": 0.87, "crabs": 0.05}
            print(rank(scores))
          - |
            def rank(scores):
                return sorted(scores, key=lambda name: (scores[name], name), reverse=True)

            print(['moons', 'orbits', 'tides', 'crabs'])
        explanation: |
          Sorting a dictionary sorts its keys, and the key function says what to sort them by. The tuple `(-scores[name], name)` is compared first by the negated score, so the largest score is the smallest tuple and comes first, and then by the name when two scores are equal. Sorting by the score alone with `reverse=True` looks right and fails on ties: a stable sort leaves equal items in the order the dictionary happened to hold them, which is the order of insertion, not of the alphabet. Reversing a tuple key reverses the names as well as the scores. A second way that works is two stable sorts, the less important one first: `sorted(sorted(scores), key=lambda name: -scores[name])`.
        hints:
          - sorted applied to a dictionary gives a sorted list of its keys, and takes a key function.
          - To put the largest first while keeping names ascending, sort by the negated score.
          - Let the key return a tuple, the negated score first and the name second.
    - question:
        id: fix-insertion
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `insertion_sort(items)` should sort the list it is given in place. For the row of the puzzle it should print `1 2 3 4 5 7 8 9`. It prints `5 1 2 3 4 7 8 9`. Fix it.
        starter: |
          def insertion_sort(items):
              for i in range(1, len(items)):
                  j = i
                  while j > 1 and items[j - 1] > items[j]:
                      items[j - 1], items[j] = items[j], items[j - 1]
                      j -= 1

          row = [5, 2, 8, 1, 9, 3, 7, 4]
          insertion_sort(row)
          print(" ".join([str(x) for x in row]))
        solution: |
          def insertion_sort(items):
              for i in range(1, len(items)):
                  j = i
                  while j > 0 and items[j - 1] > items[j]:
                      items[j - 1], items[j] = items[j], items[j - 1]
                      j -= 1

          row = [5, 2, 8, 1, 9, 3, 7, 4]
          insertion_sort(row)
          print(" ".join([str(x) for x in row]))
        tests: |
          _r = [5, 2, 8, 1, 9, 3, 7, 4]
          insertion_sort(_r)
          assert _r == [1, 2, 3, 4, 5, 7, 8, 9], "The row of the puzzle should become [1, 2, 3, 4, 5, 7, 8, 9]. It became " + repr(_r)
          _r = [2, 1]
          insertion_sort(_r)
          assert _r == [1, 2], "[2, 1] should become [1, 2]. It became " + repr(_r)
          _r = [3, 3, 1, 2, 1]
          insertion_sort(_r)
          assert _r == [1, 1, 2, 3, 3], "[3, 3, 1, 2, 1] should become [1, 1, 2, 3, 3]. It became " + repr(_r)
          _r = [9, 8, 7, 6]
          insertion_sort(_r)
          assert _r == [6, 7, 8, 9], "A reversed list should be sorted. [9, 8, 7, 6] became " + repr(_r)
          _r = []
          insertion_sort(_r)
          assert _r == [], "An empty list should stay empty"
          _r = [4]
          insertion_sort(_r)
          assert _r == [4], "A list of one item should be unchanged"
          _r = [1, 2, 3]
          insertion_sort(_r)
          assert _r == [1, 2, 3], "A sorted list should be unchanged. [1, 2, 3] became " + repr(_r)
          assert output.strip() == "1 2 3 4 5 7 8 9", "The program should print 1 2 3 4 5 7 8 9"
        wrong:
          - |
            def insertion_sort(items):
                for i in range(1, len(items)):
                    j = i
                    while j > 0 and items[j - 1] < items[j]:
                        items[j - 1], items[j] = items[j], items[j - 1]
                        j -= 1

            print("1 2 3 4 5 7 8 9")
          - |
            def insertion_sort(items):
                items = sorted(items)

            print("1 2 3 4 5 7 8 9")
          - |
            def insertion_sort(items):
                for i in range(2, len(items)):
                    j = i
                    while j > 0 and items[j - 1] > items[j]:
                        items[j - 1], items[j] = items[j], items[j - 1]
                        j -= 1

            print("1 2 3 4 5 7 8 9")
        explanation: |
          The condition `j > 1` stops every item one place short of the front, so nothing is ever compared with the item at position 0. Everything after the first item is sorted perfectly, and the 5 that began at the front stays there. The invariant shows the fault: after a pass, the first `i + 1` items should be in order, and with `j > 1` only the items from position 1 onwards are. An item may need to travel all the way to position 0, and the last comparison it can make is with `j` equal to 1, between positions 0 and 1. So the loop must run while `j > 0`. Writing `items = sorted(items)` inside the function is no repair, because it makes the name `items` refer to a new list and leaves the caller's list as it was.
        hints:
          - The output is sorted apart from one item. Which one, and where is it?
          - What is the smallest value of j for which the loop still compares two items?
          - With j equal to 1 the comparison is between positions 0 and 1, and that one is needed.
    - question:
        id: work-why-nlogn
        type: choice
        system: s2
        prompt: |
          Insertion sort averages about $n^2/4$ comparisons, and merge sort never more than $n \log_2 n$. Which statement best explains the gap?
        options:
          - "Merge sort is recursive, and recursion is faster than loops."
          - "A swap of neighbours removes one inversion, and a random list has about $n^2/4$ of them, so a method that only swaps neighbours cannot escape $n^2$. A merge moves an item past many others with one comparison, and each of the $\\log_2 n$ rounds costs fewer than $n$."
          - "Merge sort uses more memory, and memory is faster than comparisons."
          - "Insertion sort makes mistakes that it must later correct."
        answer: 1
        explanation: |
          The count of inversions is the real obstacle. A random list has about $n^2/4$ pairs in the wrong order, and each swap of neighbours repairs exactly one. No ordering of the swaps helps. In a merge, when an item of the right pile is taken ahead of the left pile's top item, it jumps ahead of everything remaining in the left pile at once: one comparison removes many inversions. That is possible only because the piles are already sorted, so that one answer carries information about many pairs. The recursion is a way of arranging for the piles to be sorted, and the second copy of the data is the price.
        hints:
          - How many inversions does one swap of neighbours remove?
          - In a merge, how many items of the left pile does an item from the right pile get ahead of in one step?
          - How many rounds of merging are there?
    - question:
        id: work-nearly-sorted
        type: choice
        system: s2
        prompt: |
          A log holds a million records that arrived almost in order of time: no record is more than 3 places from where it belongs. Which is true of sorting it?
        options:
          - "Insertion sort needs about a quarter of a trillion comparisons, as for any million items."
          - "Insertion sort moves each record at most 3 places, so it makes at most about 3 million swaps and 4 million comparisons, fewer than merge sort's twenty million."
          - "No method can use fewer than about twenty million comparisons, by the lower bound."
          - "The log cannot be sorted without first shuffling it."
        answer: 1
        explanation: |
          The cost of insertion sort is the number of inversions plus about one comparison per pass, and a list in which nothing is far from home has few inversions: at most about $3n$ here. So it finishes in $O(n)$. The lower bound of $\log_2(n!)$ is not contradicted. It counts the questions needed to tell apart all $n!$ orders, and here you have been told that most of those orders are impossible. With fewer possibilities to distinguish, fewer questions are needed. This is why Timsort looks for order that is already present before it does anything else. Real data is seldom random.
        hints:
          - How many swaps can one record need if it is at most 3 places from home?
          - Multiply by the number of records, and compare with twenty million.
          - The lower bound assumes every order is possible. Is that so here?
    - question:
        id: work-lower-bound
        type: choice
        system: s2
        prompt: |
          Someone claims a new method that sorts any 5 items using at most 6 comparisons. Without seeing it, what can you say?
        options:
          - "It may well be right, since 6 is more than 5."
          - "It is impossible. Five items have $5! = 120$ orders, and 6 comparisons give at most $2^6 = 64$ different sequences of answers, so two different orders would get identical treatment and one of them would come out wrong."
          - "It is impossible, because merge sort needs 8 and merge sort is the best there is."
          - "It is possible only if the items are numbers."
        answer: 1
        explanation: |
          A method that works by comparing can react only to the answers it receives. If two different starting orders produce the same six answers, the method performs the same rearrangement on both, and one rearrangement cannot sort two different orders. So it needs at least as many possible sequences of answers as there are orders: $2^k \ge 120$, which forces $k \ge 7$. Seven is in fact achievable for five items. The argument does not mention any particular method, which is its strength: it rules out every method at once. It would not rule out a method that does something other than compare, such as counting how many items have each value, which is how small whole numbers can be sorted in $O(n)$.
        hints:
          - How many orders can 5 items be in?
          - How many different sequences of answers can 6 yes-or-no questions have?
          - What happens if two orders give the same answers?
  connections:
    - text: |
        The puzzle asked what it costs to sort eight face-down cards, and a million. Sliding each card left into place costs one comparison for each place moved, which is one for each pair out of order: 18 for the eight cards and about $n^2/4$ in general. Merging two sorted piles places a card with every comparison, and halving until the piles are single cards gives $\log_2 n$ rounds of fewer than $n$ comparisons each: 17 for the eight cards and twenty million for a million. And no method of comparing can do better than $\log_2(n!)$, because $k$ answers can tell apart only $2^k$ orders.

        Much of this was assembled from what you had. The count of insertion sort is the sum $1 + 2 + \dots + (n-1)$. The correctness of merge sort is the leap of faith of [[e1.recursion]]. The logarithm is the number of halvings, as it was for the height of a heap in [[e3.trees-and-heaps]], and the heap gave a second $n \log n$ sort for nothing. Even the ranking of documents by similarity was a sort with a key.

        Merge sort is the first example of a plan you will use again and again: split a problem into halves, solve each, and combine. That plan has a name, and a method for counting its cost, in [[e3.divide-and-conquer]].

        First, collect what sorting buys. A sorted list is a list in which you know something about every item without looking: everything to the left of a position is smaller, everything to the right larger. One look at the middle therefore rules out half the list. Finding one name among a million then takes twenty looks, where an unsorted list takes up to a million. That is the next lesson, [[e3.binary-search]].
