          What does it cost to ask whether a node is in a set of $n$ nodes already seen?
        options: ["$O(1)$", "$O(\\log n)$", "$O(n)$", "$O(n^2)$"]
        answer: 0
        explanation: A set is a hash table, which computes where to look.
  puzzle:
    - text: |
        Seven computers are joined by links, and a message can pass along a link in either direction: A–B, A–C, B–D, B–E, C–F, E–F and F–G. A message must travel from A to G. Two questions.

        **Can it get there at all? And what is the smallest number of links it must cross?**

        With a drawing in front of you, your eye answers both in a moment. A program has no drawing. It has a table saying, for each computer, which others it is linked to. Run the starter, which holds that table and tries the simplest plan: from each computer, pass the message to the first neighbour listed. The message goes A, B, A, B, A, B, and never arrives. It is not that there is no way. The plan has no memory, so it cannot tell that it has been here before.

        A more careful wanderer would notice a loop in this network: A to B to E to F to C and back to A. Any method that explores without remembering can circle it for ever.

        And even a method that does arrive may arrive by a poor route. A–B–E–F–G crosses four links. A–C–F–G crosses three.

        **How do you explore a network so that every reachable place is visited, none is visited twice, and the route found to each is the shortest there is?**
  intuition:
    - text: |
        Two kinds of memory are needed.

        First, a record of **where you have been**, so that you never set out from the same place twice. This must be quick to consult, since you will consult it at every link. A set does it in one step.

        Second, a list of **places discovered and not yet explored**. When you stand at A you learn of B and C. You can go to only one of them now. The other must be written down for later, along with everything you learn of along the way.

        The whole method is then a loop: take a place from the list of pending places, look at its neighbours, and add to the list any that you have not seen. Stop when the list is empty.

        One decision is left open, and it changes everything. **Which pending place do you take next?**

        Take the one that has waited **longest**, and you explore in rings: first everything one link from the start, then everything two links away, then three. Like a ripple spreading on water. This is **breadth-first search**, and the list is a queue.

        Take the one discovered **most recently**, and you plunge: from A to a neighbour, to a neighbour of that, as far as the links go, backing up only at a dead end. Like someone exploring a maze with a hand on the wall. This is **depth-first search**, and the list is a stack.

        Step through both on the network of the puzzle.
    - figure: graph-walk
    - text: |
        Breadth first visits A, then B and C, then D, E and F, then G, nearest first, and G is reached in the third ring. Depth first visits A, B, D, backs up, then E, F, C, and G last, having gone the long way round through E. Both visit all seven and neither visits any twice.
  derivation:
    - text: |
        **Graphs.** A **graph** is a set of **nodes**, also called vertices, and a set of **edges**, each joining two nodes. The network of the puzzle is a graph with 7 nodes and 7 edges. Its edges can be crossed in either direction, which makes it **undirected**. In a **directed** graph each edge has a direction, like a one-way street or the "must come before" between two lessons of this course.

        Two nodes joined by an edge are **neighbours**. The number of a node's neighbours is its **degree**. A **path** is a sequence of nodes each joined to the next by an edge, and its length is the number of edges crossed. A path that returns to its start without repeating an edge is a **cycle**. A graph is **connected** if there is a path between every two nodes.

        A tree is the special case with no cycles: a connected graph in which there is exactly one path between any two nodes. Everything in this lesson works on trees too. The new difficulty is the cycle.

        Add up the degrees of all the nodes of an undirected graph and each edge is counted twice, once from each end:

        $$\sum_{v} \deg(v) = 2\,\lvert E \rvert.$$

        **Storing a graph.** The usual form is the **adjacency list**: for each node, the list of its neighbours. A dictionary from node to list does it, and you have built both parts.

        ```python
        links = {
            "A": ["B", "C"],
            "B": ["A", "D", "E"],
            "C": ["A", "F"],
            "D": ["B"],
            "E": ["B", "F"],
            "F": ["C", "E", "G"],
            "G": ["F"],
        }
        ```

        Each undirected edge appears twice, once in each direction. The memory used is in proportion to the number of nodes plus the number of edges, and the neighbours of a node are at hand in one lookup.

        The other form is the **adjacency matrix**: a grid with a row and a column for each node, holding 1 where two nodes are joined and 0 elsewhere. It answers "are these two joined?" in one step, and takes room for $\lvert V \rvert^2$ entries, however few the edges are. A network of a million pages with ten links each would need a million million entries, nearly all of them 0, against about ten million items in adjacency lists. Graphs with few edges for their size are called **sparse**, and most real graphs are.

        **Breadth-first search.**

        ```python
        from collections import deque

        def bfs(links, start):
            seen = {start}
            queue = deque([start])
            order = []
            while len(queue) > 0:
                node = queue.popleft()
                order.append(node)
                for other in links[node]:
                    if other not in seen:
                        seen.add(other)
                        queue.append(other)
            return order
        ```

        `seen` holds every node that has ever been put in the queue. A node is marked as seen **at the moment it is discovered**, when it joins the queue, and not later when it leaves. That is what guarantees each node enters the queue once. If marking waited until a node left the queue, a node could be discovered by two neighbours in the meantime and be queued twice.

        *It ends, and it visits every reachable node once.* Each node enters the queue at most once, so the loop runs at most $\lvert V \rvert$ times. A node reachable from the start is joined to it by a path, and each node on that path is discovered when the one before it is processed.

        *The cost.* Each node is dequeued once, and when it is, its list of neighbours is read once. So the total work is the number of nodes plus the total length of all the lists, which is twice the number of edges: $O(\lvert V \rvert + \lvert E \rvert)$. The search looks at each node and each edge a fixed number of times, and no method that must examine the whole graph can do better.

        **Why breadth first finds the fewest links.** Call the fewest edges on any path from the start to a node its **distance**. The claim is that breadth-first search takes nodes from the queue in order of distance: every node at distance $d$ before any node at distance $d + 1$.

        Argue by induction on $d$. The start, at distance 0, is first. Suppose the nodes at distance $d$ all leave the queue before any node further away. As each is processed, its unseen neighbours join the **back** of the queue. Those neighbours are exactly the nodes at distance $d + 1$: each such node has a neighbour at distance $d$, and could not have been discovered earlier, since anything processed earlier was at distance $d$ or less. So all the nodes at distance $d + 1$ are queued, in a block, behind those at distance $d$, and ahead of anything at distance $d + 2$, which can only be discovered from them.

        So when a node is discovered from a node at distance $d$, its own distance is $d + 1$, and this can be recorded on the spot:

        ```python
        def distances(links, start):
            dist = {start: 0}
            queue = deque([start])
            while len(queue) > 0:
                node = queue.popleft()
                for other in links[node]:
                    if other not in dist:
                        dist[other] = dist[node] + 1
                        queue.append(other)
            return dist
        ```

        The dictionary of distances doubles as the record of nodes seen. For the puzzle it gives G the distance 3. Record also, for each node, the node it was discovered from, and following those records back from G spells out a shortest route: G from F, F from C, C from A.
    - question:
        id: derivation-mark
        type: choice
        system: s2
        prompt: |
          In breadth-first search a node is added to `seen` when it is put **into** the queue. What happens if it is instead added only when it is **taken out**?
        options:
          - "Nothing changes."
          - "A node can be discovered by several neighbours before it is taken out, and is then put in the queue once for each. It is processed more than once, and the visiting order contains repeats."
          - "The search never ends on any graph."
          - "Some reachable nodes are never visited."
        answer: 1
        explanation: |
          In the puzzle's network, F is a neighbour of both C and E. When C is processed, F joins the queue. With late marking F is not yet in `seen` when E is processed shortly after, so F joins the queue a second time, and each copy will later queue G. The search still ends, because a node can be queued at most once for each of its neighbours, but it does repeated work and reports nodes twice. Marking at discovery makes "in the queue or already processed" a single fact that is recorded the moment it becomes true.
    - text: |
        **Depth-first search.** Replace the queue by a stack and the newest discovery is explored first. The most natural way to write it uses the stack you get for nothing, the call stack:

        ```python
        def dfs(links, node, seen, order):
            seen.add(node)
            order.append(node)
            for other in links[node]:
                if other not in seen:
                    dfs(links, other, seen, order)
        ```

        Calling `dfs(links, "A", set(), order)` fills `order`. Each call explores everything reachable from one node before returning, and the waiting calls are the path back to the start. The cost is the same as before, $O(\lvert V \rvert + \lvert E \rvert)$, for the same reason. On a very long path the recursion can become too deep for Python, and then an explicit stack is used instead.

        Depth-first search does **not** find shortest paths. In the puzzle it reaches G by way of B, E and F, four links. What it does give is a full exploration using memory only for the current path, and an order of visiting that is the key to several later methods.

        | | Breadth first | Depth first |
        | --- | --- | --- |
        | pending nodes kept in | a queue | a stack |
        | explores | nearest first, in rings | one route to its end, then back |
        | finds fewest-link paths | yes | no |
        | memory | the whole of a ring | one path |
        | cost | $O(\lvert V \rvert + \lvert E \rvert)$ | $O(\lvert V \rvert + \lvert E \rvert)$ |

        **Connected pieces.** A search from one node visits exactly the nodes reachable from it, its **connected component**. To find all the pieces of a graph, go through the nodes in turn, and whenever you meet one not yet seen, start a search there and count one more component. Each node and edge is still handled once, so the whole thing is $O(\lvert V \rvert + \lvert E \rvert)$.

        **Where graphs are found.** Almost anything made of things and relations between pairs of them is a graph.

        - The lessons of this course are nodes, and "must be learnt before" is a directed edge.
        - A neural network's computation is a directed graph: each operation is a node, and an edge carries one operation's result to the next. Training walks this graph backwards.
        - The positions of a puzzle are nodes, and a legal move is an edge. Breadth-first search from the starting position then finds the solution with the fewest moves, with no knowledge of the puzzle at all.

        In the last example the graph is never stored. Its neighbours are computed when needed, and the search explores a graph too large to write down.
    - question:
        id: order-bfs
        type: order
        system: s2
        prompt: Breadth-first search runs on the puzzle's network from A, with neighbours taken in alphabetical order. Put the contents of the queue in the order they occur, starting just after A has been processed.
        steps:
          - "B, C"
          - "C, D, E"
          - "D, E, F"
          - "E, F"
          - "F"
          - "G"
        explanation: Processing A queues its neighbours B and C. Processing B adds D and E behind C. Processing C adds F. D has no unseen neighbour, and neither has E, since F is already marked. Processing F adds G. New discoveries always join the back, so the queue holds one ring of nodes followed by the beginning of the next.
  formal:
    - text: |
        **Graph.** A set $V$ of nodes and a set $E$ of edges, each joining two nodes. Undirected if edges have no direction, directed if they do. The degree of a node is its number of neighbours, and $\sum_v \deg(v) = 2\lvert E \rvert$ in an undirected graph.

        **Path, cycle, distance.** A path is a sequence of nodes each joined to the next, and its length is its number of edges. A cycle is a path returning to its start. The distance between two nodes is the least length of a path between them.

        **Adjacency list.** For each node, the list of its neighbours. Space $O(\lvert V \rvert + \lvert E \rvert)$. **Adjacency matrix.** A $\lvert V \rvert \times \lvert V \rvert$ grid of 0s and 1s. Space $O(\lvert V \rvert^2)$.

        **Breadth-first search.** Keep a set of seen nodes and a queue. Repeatedly dequeue a node and enqueue each unseen neighbour, marking it seen at once. It visits each node reachable from the start exactly once, in order of distance, in $O(\lvert V \rvert + \lvert E \rvert)$ time.

        **Depth-first search.** The same with a stack, or by recursion. It visits each reachable node exactly once in $O(\lvert V \rvert + \lvert E \rvert)$ time, and does not in general find shortest paths.

        **Connected component.** The set of nodes reachable from a given node of an undirected graph.
