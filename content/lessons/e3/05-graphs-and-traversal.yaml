  work:
    - text: Slower now. For each search, say what is in the set of seen nodes and what is in the queue or stack.
    - question:
        id: write-distances
        type: code
        mode: write
        system: s2
        prompt: |
          Write `distances(links, start)`. `links` is an adjacency list, a dictionary from each node to the list of its neighbours. Return a dictionary giving, for every node reachable from `start`, the fewest edges on a path to it from `start`. The start itself has distance 0. Nodes that cannot be reached do not appear.
        starter: |
          from collections import deque

          def distances(links, start):
              # Replace the next line with your own.
              return {start: 0}

          links = {
              "A": ["B", "C"],
              "B": ["A", "D", "E"],
              "C": ["A", "F"],
              "D": ["B"],
              "E": ["B", "F"],
              "F": ["C", "E", "G"],
              "G": ["F"],
          }
          print(distances(links, "A")["G"])
        solution: |
          from collections import deque

          def distances(links, start):
              dist = {start: 0}
              queue = deque([start])
              while len(queue) > 0:
                  node = queue.popleft()
                  for other in links[node]:
                      if other not in dist:
                          dist[other] = dist[node] + 1
                          queue.append(other)
              return dist

          links = {
              "A": ["B", "C"],
              "B": ["A", "D", "E"],
              "C": ["A", "F"],
              "D": ["B"],
              "E": ["B", "F"],
              "F": ["C", "E", "G"],
              "G": ["F"],
          }
          print(distances(links, "A")["G"])
        tests: |
          _net = {"A": ["B", "C"], "B": ["A", "D", "E"], "C": ["A", "F"], "D": ["B"], "E": ["B", "F"], "F": ["C", "E", "G"], "G": ["F"]}
          assert distances(_net, "A") == {"A": 0, "B": 1, "C": 1, "D": 2, "E": 2, "F": 2, "G": 3}, "From A the distances should be A 0, B 1, C 1, D 2, E 2, F 2, G 3. You returned " + repr(distances(_net, "A"))
          assert distances(_net, "G") == {"G": 0, "F": 1, "C": 2, "E": 2, "A": 3, "B": 3, "D": 4}, "From G the distances should be G 0, F 1, C 2, E 2, A 3, B 3, D 4. You returned " + repr(distances(_net, "G"))
          _split = {"A": ["B"], "B": ["A"], "C": ["D"], "D": ["C"], "E": []}
          assert distances(_split, "A") == {"A": 0, "B": 1}, "C, D and E cannot be reached from A and should not appear. You returned " + repr(distances(_split, "A"))
          assert distances(_split, "E") == {"E": 0}, "A node with no neighbours reaches only itself. You returned " + repr(distances(_split, "E"))
          _ring = {0: [1, 5], 1: [0, 2], 2: [1, 3], 3: [2, 4], 4: [3, 5], 5: [4, 0]}
          assert distances(_ring, 0) == {0: 0, 1: 1, 5: 1, 2: 2, 4: 2, 3: 3}, "Round a ring of six, the far side is 3 away, whichever way round. You returned " + repr(distances(_ring, 0))
          _lasso = {"S": ["X", "T"], "X": ["S", "Y"], "Y": ["X", "Z"], "Z": ["Y", "T"], "T": ["S", "Z"]}
          assert distances(_lasso, "S")["Z"] == 2, "Z is reached in 2 by way of T, though the route by X and Y takes 3. You returned " + repr(distances(_lasso, "S")["Z"])
          _one_way = {"A": ["B"], "B": ["C"], "C": []}
          assert distances(_one_way, "B") == {"B": 0, "C": 1}, "With directed edges only what lies ahead can be reached. You returned " + repr(distances(_one_way, "B"))
          assert output.strip() == "3", "The program should print 3"
        wrong:
          - "from collections import deque\n\ndef distances(links, start):\n    dist = {start: 0}\n    stack = [start]\n    while len(stack) > 0:\n        node = stack.pop()\n        for other in links[node]:\n            if other not in dist:\n                dist[other] = dist[node] + 1\n                stack.append(other)\n    return dist\n\nprint(3)\n"
          - "from collections import deque\n\ndef distances(links, start):\n    dist = {start: 0}\n    queue = deque([start])\n    while len(queue) > 0:\n        node = queue.popleft()\n        for other in links[node]:\n            if other not in dist:\n                dist[other] = 1\n                queue.append(other)\n    return dist\n\nprint(3)\n"
          - "from collections import deque\n\ndef distances(links, start):\n    dist = {start: 0}\n    for other in links[start]:\n        dist[other] = 1\n    return dist\n\nprint(3)\n"
          - "from collections import deque\n\ndef distances(links, start):\n    dist = {}\n    count = 0\n    for node in links:\n        dist[node] = count\n        count += 1\n    return dist\n\nprint(3)\n"
          - "from collections import deque\n\ndef distances(links, start):\n    dist = {start: 0}\n    queue = deque([start])\n    while len(queue) > 0:\n        node = queue.popleft()\n        for other in links[node]:\n            if other not in dist:\n                dist[other] = dist[node] + 1\n                queue.append(other)\n    for node in links:\n        if node not in dist:\n            dist[node] = 0\n    return dist\n\nprint(3)\n"
        explanation: |
          This is breadth-first search with the dictionary of distances serving also as the record of nodes seen. A node is given its distance at the moment it is discovered, one more than the node it was discovered from, and never again. Because nodes leave the queue in order of distance, the first discovery of a node is by a shortest route. Swap the queue for a stack and the same code still labels every reachable node, but with the length of whichever path the plunge happened to take: in the lasso-shaped test it reaches Z by way of X and Y and reports 3 where the answer is 2. Nodes that cannot be reached are left out, since no number of edges leads to them.
    - question:
        id: fix-bfs
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `visit_order(links, start)` should return the nodes reachable from `start` in breadth-first order, each exactly once. For the puzzle's network it should print `A B C D E F G`. It prints `A B C D E F F G G`. Fix it.
        starter: |
          from collections import deque

          def visit_order(links, start):
