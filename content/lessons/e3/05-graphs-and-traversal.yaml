    - question:
        id: write-components
        type: code
        mode: write
        system: s2
        prompt: |
          Write `components(links)` for an undirected graph given as an adjacency list in which every node appears as a key. Return the number of connected pieces.
        starter: |
          def components(links):
              # Replace the next line with your own.
              return 1

          links = {"A": ["B"], "B": ["A"], "C": ["D"], "D": ["C", "E"], "E": ["D"], "F": []}
          print(components(links))
        solution: |
          def components(links):
              seen = set()
              count = 0
              for start in links:
                  if start not in seen:
                      count += 1
                      seen.add(start)
                      stack = [start]
                      while len(stack) > 0:
                          node = stack.pop()
                          for other in links[node]:
                              if other not in seen:
                                  seen.add(other)
                                  stack.append(other)
              return count

          links = {"A": ["B"], "B": ["A"], "C": ["D"], "D": ["C", "E"], "E": ["D"], "F": []}
          print(components(links))
        tests: |
          assert components({"A": ["B"], "B": ["A"], "C": ["D"], "D": ["C", "E"], "E": ["D"], "F": []}) == 3, "The pieces are A and B, then C, D and E, then F alone: 3. You returned " + repr(components({"A": ["B"], "B": ["A"], "C": ["D"], "D": ["C", "E"], "E": ["D"], "F": []}))
          _net = {"A": ["B", "C"], "B": ["A", "D", "E"], "C": ["A", "F"], "D": ["B"], "E": ["B", "F"], "F": ["C", "E", "G"], "G": ["F"]}
          assert components(_net) == 1, "The puzzle's network is connected, so it has 1 piece. You returned " + repr(components(_net))
          assert components({}) == 0, "A graph with no nodes has 0 pieces. You returned " + repr(components({}))
          assert components({1: [], 2: [], 3: [], 4: []}) == 4, "Four nodes and no edges make 4 pieces. You returned " + repr(components({1: [], 2: [], 3: [], 4: []}))
          _cut = {"A": ["B", "C"], "B": ["A", "D", "E"], "C": ["A"], "D": ["B"], "E": ["B"], "F": ["G"], "G": ["F"]}
          assert components(_cut) == 2, "With C-F and E-F removed the network has 2 pieces. You returned " + repr(components(_cut))
          _late = {"Z": ["Y"], "Y": ["Z", "X"], "X": ["Y"], "W": ["V"], "V": ["W"]}
          assert components(_late) == 2, "Z, Y and X are one piece and W and V another. You returned " + repr(components(_late))
          _chain = {i: [j for j in [i - 1, i + 1] if 0 <= j < 2000] for i in range(2000)}
          assert components(_chain) == 1, "A chain of 2000 nodes is one piece, and should not exhaust the recursion limit. You returned " + repr(components(_chain))
          assert output.strip() == "3", "The program should print 3"
        wrong:
          - "def components(links):\n    return len(links)\n\nprint(3)\n"
          - "def components(links):\n    return len([node for node in links if len(links[node]) == 0]) + 1\n\nprint(3)\n"
          - "def components(links):\n    seen = set()\n    count = 0\n    for start in links:\n        if start not in seen:\n            count += 1\n            seen.add(start)\n            for other in links[start]:\n                seen.add(other)\n    return count\n\nprint(3)\n"
          - "def components(links):\n    seen = set()\n    count = 0\n    for start in links:\n        count += 1\n        seen.add(start)\n        stack = [start]\n        while len(stack) > 0:\n            node = stack.pop()\n            for other in links[node]:\n                if other not in seen:\n                    seen.add(other)\n                    stack.append(other)\n    return count\n\nprint(3)\n"
          - "def components(links):\n    edges = sum([len(links[node]) for node in links]) // 2\n    return len(links) - edges\n\nprint(3)\n"
        explanation: |
          One search finds exactly one connected piece: everything reachable from where it starts. So go through the nodes, and each time you meet one that no earlier search has reached, count a new piece and search from it, marking all it reaches. The set of seen nodes is shared by all the searches, which is what keeps the whole computation at $O(\lvert V \rvert + \lvert E \rvert)$: every node is marked once and every list of neighbours read once. Marking only a node's immediate neighbours is not a search, and counts a chain of three as two pieces. Subtracting edges from nodes happens to work for graphs with no cycles and fails once there is one. A stack is used here, though a queue would serve equally, since only reachability matters and not the order.
    - question:
        id: work-why-shortest
        type: choice
        system: s2
        prompt: |
          Depth-first search from A reaches G in the puzzle's network by the path A, B, E, F, G, of length 4. Breadth-first search gives G the distance 3. Why can breadth-first search be trusted to give the least?
        options:
          - "Because it tries every path and keeps the best."
          - "Because nodes leave the queue in order of distance. All nodes one edge away are processed before any two edges away, and so on, so a node is first discovered from a node as near the start as any of its neighbours."
          - "Because it visits the neighbours in alphabetical order."
          - "It cannot. The answer 3 is a coincidence."
        answer: 1
        explanation: |
          Breadth-first search does not compare paths at all. It never needs to, because of the order in which it works: the queue holds the nodes of one ring followed by those of the next, and new discoveries join at the back. So when a node is discovered, the discoverer is at the smallest distance of any of its neighbours, and one more than that is the node's own distance. Depth-first search has no such order. It follows whichever edge comes first as far as it leads, and may reach a nearby node at the end of a long detour. The order of neighbours changes which shortest path is found when there are several, never its length.
    - question:
        id: work-sparse
        type: choice
        system: s2
        prompt: |
          A graph has a million nodes, and each node has about 10 neighbours. How do the two ways of storing it compare?
        options:
          - "They take about the same room."
          - "The adjacency matrix has $10^6 \\times 10^6 = 10^{12}$ entries, nearly all 0. The adjacency lists hold about $10^7$ items in all. The lists are smaller by a factor of about a hundred thousand."
          - "The matrix is smaller, since it stores only 0s and 1s."
          - "Neither can store a graph that large."
        answer: 1
        explanation: |
          The matrix has room for every possible pair of nodes whether or not they are joined. The lists hold only the edges that exist: a million lists of about 10 names. The matrix also makes a search slow, because finding the neighbours of a node means reading a whole row of a million entries to find the ten that are 1, so that breadth-first search costs $O(\lvert V \rvert^2)$ where the lists allow $O(\lvert V \rvert + \lvert E \rvert)$. The matrix is the right choice when most pairs **are** joined, or when the question asked most often is whether two given nodes are neighbours. You will meet it again when matrices arrive, where multiplying it by itself counts paths.
    - question:
        id: work-states
        type: choice
        system: s2
        prompt: |
          A sliding-tile puzzle has about 180000 reachable positions, and from each position between 2 and 4 moves are possible. You want the solution with the fewest moves. What is the graph, and which search finds it?
        options:
          - "The tiles are nodes and their neighbours on the board are edges. Use depth-first search."
          - "Each position of the whole puzzle is a node, and a legal move is an edge between two positions. Breadth-first search from the starting position reaches the solved position by a path with the fewest edges, which is the fewest moves."
          - "There is no graph, since nothing is stored."
          - "The moves are nodes. Use a hash table."
        answer: 1
        explanation: |
          The graph of a puzzle is its space of positions. A node is one complete arrangement, and an edge joins two arrangements that differ by one move. A sequence of moves is then a path, and the fewest moves is the distance. Breadth-first search finds it without any insight into the puzzle. The graph need never be built: the neighbours of a position are computed by trying each legal move, and a set of positions already seen keeps the search from going round. Positions can be stored in that set as tuples, since a set needs keys that cannot change. With 180000 nodes and a few edges each, the search is a fraction of a second's work.
  connections:
    - text: |
        The puzzle asked whether a message can pass from A to G, and by how few links. A wanderer with no memory circled between A and B for ever. A search needs two kinds of memory: a set of nodes seen, so that nothing is explored twice, and a container of nodes discovered and still to be explored. Take from that container the oldest and the search spreads in rings, reaching every node by a shortest route. Take the newest and it plunges down one route to its end. With a queue, G is found at distance 3 by way of C and F.

        Everything here was assembled from earlier lessons. The graph is a dictionary of lists. The set of seen nodes is a hash table, which is what makes each check $O(1)$ and the whole search $O(\lvert V \rvert + \lvert E \rvert)$. The queue and the stack decide the order, as was promised when you first met them. And the tree of [[e3.trees-and-heaps]] is a graph with no cycles, where no set of seen nodes is needed because there is only one way to anywhere.

        Three directions open from here. In this lesson every edge counted as one step. When edges have lengths, the nearest node is no longer the one with fewest edges, and the queue must give way to a priority queue: that is [[e3.shortest-paths-and-beam-search]]. When edges have directions and mean "must come before", the question becomes in what order to do things, in [[e3.topological-sort]]. And when the nodes are the sub-problems of a larger problem, searching the graph while remembering answers is [[e3.dynamic-programming]].

        Before those, a problem you have been leaning on without examining it. Twice in this cluster a sorted list made something easy: taking the most urgent job from its end, and the prospect of searching by halving. Python's `sorted` has been there since your first lessons, with a cost you were told was $O(n \log n)$. How is a list put in order at all, why do the obvious methods take $O(n^2)$, and where does the logarithm come from? That is the next lesson, [[e3.sorting]].
