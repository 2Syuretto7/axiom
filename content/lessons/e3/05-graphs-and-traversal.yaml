          In a tree, how many different paths lead from the root to a given node?
        options: ["Exactly one", "At most two", "One for each level", "It depends on the tree"]
        answer: 0
        explanation: Every node has exactly one parent, so the way up, and therefore the way down, is forced.
    - question:
