concept: e3.graphs-and-traversal
minutes: 90
claim: You can describe a network as a graph of nodes and edges, store it as an adjacency list, explore it breadth first with a queue and depth first with a stack without going round in circles, explain why breadth-first search finds the fewest hops, and use a search to find distances, routes and connected pieces.
recalls: [e3.trees-and-heaps]
uses: [e3.hash-tables, e3.stacks-and-queues, e3.arrays-and-linked-lists, e1.recursion, e1.complexity-and-big-o, e1.comprehensions-and-iterators, e0.dictionaries-and-sets, e0.lists-and-tuples, e0.loops, e0.functions, m3.induction-and-strong-induction, m2.sets]
leads: [e3.topological-sort, e3.shortest-paths-and-beam-search, e3.dynamic-programming, e3.sorting]
starter: |
  # Scratch space. Seven computers and the links between them.
  # A message starts at A and is always passed to the first neighbour listed. Where does it go?
  links = {
      "A": ["B", "C"],
      "B": ["A", "D", "E"],
      "C": ["A", "F"],
      "D": ["B"],
      "E": ["B", "F"],
      "F": ["C", "E", "G"],
      "G": ["F"],
  }

  node = "A"
  for step in range(10):
      print(node, end=" ")
      node = links[node][0]
  print()
parts:
