    - question:
        id: predict-walk
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          head = Node(3, Node(8, Node(1, None)))
          head = Node(5, head)
          node = head.next
          total = 0
          while node is not None:
              total += node.value
              node = node.next
          print(head.value, total)
        output: "5 12"
        explanation: A new node holding 5 becomes the head, in front of 3, 8, 1. The walk starts at the second node, so it adds 3 + 8 + 1.
        hints:
          - After the second assignment the list is 5, 3, 8, 1.
          - The walk begins at head.next, not at head.
  work:
    - text: Slower now. Before choosing a structure, say which operations will be done most.
    - question:
        id: work-front-total
        type: numeric
        system: s2
        prompt: |
          A program builds an array of 1000 items by inserting each new item at the front. The first insertion moves 0 items, the second moves 1, and so on. How many moves are made in all?
        answer: "499500"
        explanation: |
          The moves are $0 + 1 + 2 + \dots + 999 = \frac{999 \times 1000}{2} = 499500$. Building the same array by appending takes 1000 writes and no moves. The ratio grows with the size: for a million items it would be about 500 thousand million moves against a million writes. If the items are wanted in the reverse order, append them all and reverse once at the end, which is $O(n)$.
        hints:
          - Write the total as a sum from 0 to 999.
          - Use the formula for the sum of the first whole numbers.
          - Half of 999 times 1000.
    - question:
        id: write-to-list
        type: code
        mode: write
        system: s2
        prompt: |
          Write `to_list(head)`. `head` is the first node of a linked list, or `None` for an empty list. Return an ordinary Python list of the values, in order.
        starter: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              # Replace the next line with your own.
              return []

          print(to_list(Node(3, Node(8, Node(1, None)))))
        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              node = head
              while node is not None:
                  values.append(node.value)
                  node = node.next
              return values

          print(to_list(Node(3, Node(8, Node(1, None)))))
        tests: |
          assert to_list(Node(3, Node(8, Node(1, None)))) == [3, 8, 1], "The list 3, 8, 1 should give [3, 8, 1]. You returned " + repr(to_list(Node(3, Node(8, Node(1, None)))))
          assert to_list(None) == [], "An empty list, given as None, should give []"
          assert to_list(Node(7, None)) == [7], "A single node should give [7]. You returned " + repr(to_list(Node(7, None)))
          assert to_list(Node(0, Node(0, None))) == [0, 0], "Values of 0 are still values. You returned " + repr(to_list(Node(0, Node(0, None))))
          assert to_list(Node(None, Node(2, None))) == [None, 2], "A node may hold the value None. Only the link decides where the list ends. You returned " + repr(to_list(Node(None, Node(2, None))))
          _head = None
          for _v in range(50):
              _head = Node(_v, _head)
          assert to_list(_head) == list(range(49, -1, -1)), "A list of 50 nodes should come back whole and in order"
          _keep = Node(1, Node(2, None))
          to_list(_keep)
          assert _keep.next is not None and _keep.next.value == 2, "to_list should not change the linked list"
          assert output.strip() == "[3, 8, 1]", "The program should print [3, 8, 1]"
        wrong:
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef to_list(head):\n    values = []\n    node = head\n    while node.next is not None:\n        values.append(node.value)\n        node = node.next\n    return values\n\nprint([3, 8, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef to_list(head):\n    values = []\n    node = head\n    while node is not None:\n        values.insert(0, node.value)\n        node = node.next\n    return values\n\nprint([3, 8, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef to_list(head):\n    values = []\n    node = head\n    while node is not None and node.value:\n        values.append(node.value)\n        node = node.next\n    return values\n\nprint([3, 8, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef to_list(head):\n    if head is None:\n        return []\n    return [head.value]\n\nprint([3, 8, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef to_list(head):\n    values = []\n    node = head\n    while node is not None:\n        node = node.next\n        if node is not None:\n            values.append(node.value)\n    return values\n\nprint([3, 8, 1])\n"
        explanation: |
          This is the standard walk: hold a node, use it, step to the next, and stop when the node in hand is `None`. The test must be on the node itself. Testing `node.next` stops one node early and misses the last value, and it fails outright on an empty list, where there is no node to ask. Testing the value confuses "the list has ended" with "this item happens to be 0". The walk visits each node once, so it is $O(n)$, and appending to the result keeps it so. Inserting each value at the front of the result would both reverse the order and make the function quadratic.
        hints:
          - Start with node = head and an empty list.
          - While node is not None, append its value and move to node.next.
          - Return the list after the loop.
    - question:
        id: fix-shift
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `insert_shift(cells, count, i, value)` works on an array with spare room: only the first `count` slots of `cells` are in use. It should insert `value` at position `i`, moving the later items one place right. For the call below it should print `[3, 8, 5, 1, 9, None]`. It prints `[3, 8, 5, 1, 1, None]`: the 9 has been lost. Fix it.
        starter: |
          def insert_shift(cells, count, i, value):
              for j in range(i, count):
                  cells[j + 1] = cells[j]
              cells[i] = value

          cells = [3, 8, 1, 9, None, None]
          insert_shift(cells, 4, 2, 5)
          print(cells)
        solution: |
          def insert_shift(cells, count, i, value):
              for j in range(count - 1, i - 1, -1):
                  cells[j + 1] = cells[j]
              cells[i] = value

          cells = [3, 8, 1, 9, None, None]
          insert_shift(cells, 4, 2, 5)
          print(cells)
        tests: |
          def _run(cells, count, i, value):
              copy = [c for c in cells]
              insert_shift(copy, count, i, value)
              return copy
          assert _run([3, 8, 1, 9, None, None], 4, 2, 5) == [3, 8, 5, 1, 9, None], "Inserting 5 at position 2 should give [3, 8, 5, 1, 9, None]. You got " + repr(_run([3, 8, 1, 9, None, None], 4, 2, 5))
          assert _run([3, 8, 1, 9, None], 4, 0, 5) == [5, 3, 8, 1, 9], "Inserting at the front moves every item. You got " + repr(_run([3, 8, 1, 9, None], 4, 0, 5))
          assert _run([3, 8, 1, 9, None], 4, 4, 5) == [3, 8, 1, 9, 5], "Inserting at the end moves nothing. You got " + repr(_run([3, 8, 1, 9, None], 4, 4, 5))
          assert _run([3, 8, 1, 9, None], 4, 3, 5) == [3, 8, 1, 5, 9], "Inserting at position 3 moves one item. You got " + repr(_run([3, 8, 1, 9, None], 4, 3, 5))
          assert _run([None, None], 0, 0, 7) == [7, None], "Inserting into an empty array writes one item. You got " + repr(_run([None, None], 0, 0, 7))
          assert _run([1, 2, 3, 4, 5, 6, None], 6, 1, 0) == [1, 0, 2, 3, 4, 5, 6], "Inserting 0 at position 1 of six items. You got " + repr(_run([1, 2, 3, 4, 5, 6, None], 6, 1, 0))
          assert output.strip() == "[3, 8, 5, 1, 9, None]", "The program should print [3, 8, 5, 1, 9, None]"
        wrong:
          - "def insert_shift(cells, count, i, value):\n    for j in range(i, count):\n        cells[j + 1] = cells[j]\n    cells[i] = value\n\nprint([3, 8, 5, 1, 9, None])\n"
          - "def insert_shift(cells, count, i, value):\n    for j in range(count - 1, i, -1):\n        cells[j + 1] = cells[j]\n    cells[i] = value\n\nprint([3, 8, 5, 1, 9, None])\n"
          - "def insert_shift(cells, count, i, value):\n    for j in range(count - 1, i - 1, -1):\n        cells[j + 1] = cells[j]\n\nprint([3, 8, 5, 1, 9, None])\n"
          - "def insert_shift(cells, count, i, value):\n    for j in range(count - 1, i - 1, -1):\n        cells[j] = cells[j + 1]\n    cells[i] = value\n\nprint([3, 8, 5, 1, 9, None])\n"
          - "def insert_shift(cells, count, i, value):\n    for j in range(count - 1, -1, -1):\n        cells[j + 1] = cells[j]\n    cells[i] = value\n\nprint([3, 8, 5, 1, 9, None])\n"
        explanation: |
          The starter moved items from the left. It copied position 2 into position 3 before the old contents of position 3 had been saved, then copied that same value into position 4, and so smeared one item over all the rest. The moves must start at the far end, where the next slot is free: the last item first, then the one before it, back to position `i`. `range(count - 1, i - 1, -1)` counts down from the last used position to `i` itself. Stopping one short would leave the item at position `i` unmoved, to be overwritten by the new value. This loop is what `xs.insert(i, x)` does inside Python, and its $n - i$ passes are the cost you measured.
        hints:
          - Trace the starter by hand on the example, one copy at a time.
          - Which slot is safe to copy into first?
          - Run the loop from the last used position down to i.
    - question:
        id: write-insert-at
        type: code
        mode: write
        system: s2
        prompt: |
          Write `insert_at(head, i, value)` for a linked list. Insert a new node holding `value` so that it ends up at position `i`, and return the head of the list, which is a new node when `i` is 0. You may assume `i` is between 0 and the length of the list.
        starter: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
