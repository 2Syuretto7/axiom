          print(to_list(insert_at(Node(3, Node(8, Node(1, None))), 2, 5)))
        solution: |
          class Node:
              def __init__(self, value, next):
                  self.value = value
                  self.next = next

          def to_list(head):
              values = []
              while head is not None:
                  values.append(head.value)
                  head = head.next
              return values

          def insert_at(head, i, value):
              if i == 0:
                  return Node(value, head)
              node = head
              for _ in range(i - 1):
                  node = node.next
              node.next = Node(value, node.next)
              return head

          print(to_list(insert_at(Node(3, Node(8, Node(1, None))), 2, 5)))
        tests: |
          def _make(values):
              head = None
              for v in values[::-1]:
                  head = Node(v, head)
              return head
          def _read(head):
              values = []
              steps = 0
              while head is not None and steps < 1000:
                  values.append(head.value)
                  head = head.next
                  steps += 1
              assert steps < 1000, "The list never ends. A node points back into the list"
              return values
          assert _read(insert_at(_make([3, 8, 1]), 2, 5)) == [3, 8, 5, 1], "Inserting 5 at position 2 of 3, 8, 1 should give 3, 8, 5, 1. You got " + repr(_read(insert_at(_make([3, 8, 1]), 2, 5)))
          assert _read(insert_at(_make([3, 8, 1]), 0, 5)) == [5, 3, 8, 1], "Inserting at position 0 should return a new head. You got " + repr(_read(insert_at(_make([3, 8, 1]), 0, 5)))
          assert _read(insert_at(_make([3, 8, 1]), 3, 5)) == [3, 8, 1, 5], "Inserting at position 3 puts the node at the end. You got " + repr(_read(insert_at(_make([3, 8, 1]), 3, 5)))
          assert _read(insert_at(_make([3, 8, 1]), 1, 5)) == [3, 5, 8, 1], "Inserting at position 1 should give 3, 5, 8, 1. You got " + repr(_read(insert_at(_make([3, 8, 1]), 1, 5)))
          assert _read(insert_at(None, 0, 9)) == [9], "Inserting into an empty list gives a list of one node. You got " + repr(_read(insert_at(None, 0, 9)))
          _h = _make([1, 2, 3, 4])
          assert insert_at(_h, 2, 0) is _h, "When i is not 0 the head does not change, so return the same head"
          assert output.strip() == "[3, 8, 5, 1]", "The program should print [3, 8, 5, 1]"
        wrong:
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef insert_at(head, i, value):\n    node = head\n    for _ in range(i - 1):\n        node = node.next\n    node.next = Node(value, node.next)\n    return head\n\nprint([3, 8, 5, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef insert_at(head, i, value):\n    if i == 0:\n        return Node(value, head)\n    node = head\n    for _ in range(i):\n        node = node.next\n    node.next = Node(value, node.next)\n    return head\n\nprint([3, 8, 5, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef insert_at(head, i, value):\n    if i == 0:\n        return Node(value, head)\n    node = head\n    for _ in range(i - 1):\n        node = node.next\n    node.next = Node(value, None)\n    return head\n\nprint([3, 8, 5, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef insert_at(head, i, value):\n    if i == 0:\n        return Node(value, head)\n    node = head\n    for _ in range(i - 1):\n        node = node.next\n    fresh = Node(value, None)\n    node.next = fresh\n    fresh.next = node.next\n    return head\n\nprint([3, 8, 5, 1])\n"
          - "class Node:\n    def __init__(self, value, next):\n        self.value = value\n        self.next = next\n\ndef insert_at(head, i, value):\n    if i == 0:\n        return Node(value, head)\n    node = head\n    for _ in range(i - 1):\n        node = node.next\n    node.next = Node(value, node.next)\n    return node\n\nprint([3, 8, 5, 1])\n"
        explanation: |
          To put a node at position $i$ you need the node at position $i - 1$ in hand, because that is the node whose link changes. So the walk follows $i - 1$ links, and one more would overshoot. Position 0 has no node before it and is handled on its own: the new node points at the old head and is returned as the head. The new node must be given the old link at the moment it is made. If it is made with `None` the rest of the list is cut off, and if the old link is overwritten first the new node ends up pointing at itself, which one of the tests detects as a list that never ends. The walk is $O(i)$ and the insertion itself $O(1)$.
        hints:
          - If i is 0, return a new node that points at head.
          - Otherwise walk to the node at position i − 1 by following i − 1 links.
          - Set its link to a new node that points where it used to point, and return head.
    - question:
        id: work-choose
        type: choice
        system: s2
        prompt: |
          A program stores a million embedding vectors. It looks them up constantly by their position, and now and then adds a new one at the end. It never inserts in the middle. Which structure suits it, and why?
        options:
          - "A linked list, because insertion is $O(1)$."
          - "An array, because reading by position is $O(1)$ and adding at the end moves nothing. A linked list would follow up to a million links for each lookup."
          - "Either, since walking both is $O(n)$."
          - "Neither can hold a million items."
        answer: 1
        explanation: |
          The work is almost all reads by position, which is the one thing an array does in a single step and a linked list does worst. Additions happen only at the end, where an array moves nothing. The linked list's strength, cheap insertion at a place you already hold, is never used. Its weaknesses all are: slow lookups, an extra address stored beside every item, and nodes scattered through memory. Choosing a data structure is this kind of bookkeeping. List the operations, weigh them by how often they happen, and read off the costs.
        hints:
          - Which operation does the program perform most?
          - What does that operation cost in each structure?
          - Is the linked list's cheap insertion ever needed here?
    - question:
        id: work-remove-all
        type: choice
        system: s2
        prompt: |
          A list of $n$ items is emptied by repeatedly removing the **first** item with `xs.pop(0)`. A second copy is emptied by repeatedly removing the **last** item with `xs.pop()`. How do the total costs compare?
        options:
          - "Both are $O(n)$."
          - "Removing from the front is $O(n^2)$ in all, since each removal moves every remaining item, $(n - 1) + (n - 2) + \\dots + 0$ moves. Removing from the end is $O(n)$ in all."
          - "Both are $O(n^2)$."
          - "Removing from the end is slower, because the end is further away."
        answer: 1
        explanation: |
          Removing position 0 of an array closes the gap by moving every remaining item one place left. With $k$ items left that is $k - 1$ moves, and the total is $\frac{n(n - 1)}{2}$, of order $n^2$. Removing the last item moves nothing, so $n$ removals cost $n$ steps. "The end is further away" is the intuition of someone who has to walk there. An array does not walk: the last position is $n - 1$, and the address formula reaches it as fast as any other. A loop that takes items from the front of a long Python list is a common and well-hidden cause of slow programs, and the next lesson has the proper tool for it.
        hints:
          - What must happen to the other items when position 0 is removed?
          - Add up the moves over all n removals.
          - How does an array reach its last position?
  connections:
    - text: |
        The puzzle asked how a list can reach its middle item in one step, and why inserting at the front is a thousand times slower. A list is an array: equal slots packed side by side from a known address, so that the address of slot $i$ is $\text{start} + \text{size} \times i$, found by arithmetic. The same packing leaves no gaps, so inserting anywhere but the end means moving everything after it. Both facts are one fact about the layout.

        A linked list makes the opposite bargain. Its nodes sit anywhere and each points to the next, so an insertion sets two links and moves nothing, but a position can only be reached by following links from the head. Neither structure is better. You weigh the operations you will perform and choose.

        This is the pattern of the whole cluster. A data structure is a way of arranging values in memory, and every arrangement makes some operations cheap by making others dear. The costs you were handed as a table in the lesson on complexity will each be explained by an arrangement: constant-time membership by [[e3.hash-tables]], and the quiet "if there is spare room" behind every append by [[e3.amortised-analysis]]. The node with links, which looked like a poor substitute for an array here, becomes the building block of [[e3.trees-and-heaps]].

        First, notice what the cheap operations had in common. An array is fast at one end. A linked list is fast at its head. A great many programs need nothing more than that: put things in, take things out, always at an end. Restricting yourself on purpose to the ends gives two of the most useful structures there are, and the difference between them, which end things leave from, decides the order in which a whole computation unfolds. That is the next lesson, [[e3.stacks-and-queues]].
