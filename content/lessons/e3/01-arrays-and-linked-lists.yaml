concept: e3.arrays-and-linked-lists
minutes: 85
claim: You can explain how an array finds its item at position i in one step, why inserting or removing anywhere but the end costs time in proportion to the items after it, how a linked list trades that cost for the cost of reaching a position, and choose between the two for a given pattern of use.
recalls: [e1.generators-and-context-managers, m4.linear-independence]
uses: [e1.complexity-and-big-o, e1.classes-and-objects, e1.modules-and-imports, e1.comprehensions-and-iterators, e0.lists-and-tuples, e0.loops, e0.functions, e0.values-types-and-variables, m4.vectors-as-arrows-and-as-lists, m4.dot-product, m2.summation-and-product-notation, m1.straight-lines-and-slope]
leads: [e3.stacks-and-queues, e3.hash-tables, e3.trees-and-heaps, e3.amortised-analysis]
bridges:
  m4.linear-independence: |
    Every vector in the last cluster was a Python list. You read its components by position, looped over them for a dot product, and tested lists of vectors for independence, all without asking what any of that costs the machine. This lesson asks. It starts from how the items of a list sit in memory, which is why component $i$ of a vector is found in one step however long the vector is. That one fact decides which operations on a list are cheap and which are slow.
starter: |
  # Scratch space. A list of 200000 numbers. Time three things, 200 times each.
  import time

  def clock(label, action):
      start = time.perf_counter()
      for _ in range(200):
          action()
      print(label, round((time.perf_counter() - start) * 1000, 2), "ms")

  xs = list(range(200000))
  clock("read the middle item ", lambda: xs[100000])
  clock("add at the end       ", lambda: xs.append(0))
  clock("insert at the front  ", lambda: xs.insert(0, 0))
parts:
  recall:
    - text: |
        [[m4.linear-independence]] closed the cluster on vectors with a remark: every vector there was a Python list, and no one had asked what a list costs to use. [[e1.generators-and-context-managers]] taught you to produce values one at a time so that they need never all sit in memory. Today is about the opposite case, values that do all sit in memory, and exactly how they sit. Three quick pulls first.
  puzzle:
    - text: |
        Run the starter. It makes a list of 200000 numbers and times three operations, each done 200 times. On an ordinary machine the result looks something like this.

        | Operation | Time for 200 |
        | --- | --- |
        | read the item in the middle, `xs[100000]` | about 0.01 ms |
        | add an item at the end, `xs.append(0)` | about 0.01 ms |
        | insert an item at the front, `xs.insert(0, 0)` | about 20 ms |

        The third is slower than the others by a factor of a thousand or more. You were told this would happen: in the lesson on complexity, a table gave reading by position as $O(1)$ and inserting at the front as $O(n)$. You were not told **why**.

        And the first row ought to puzzle you more than the third. The list has 200000 items. Python went straight to the one in the middle without passing the 100000 before it. Make the list ten times longer and the read is no slower. A person asked for the 100000th name on a list would have to count.

        **How can a list reach any position in one step? And why does the very arrangement that makes this possible make inserting at the front so slow?**

        You will answer both, and then build a second kind of list with the opposite strengths, to see that the cost was a choice.
  intuition:
    - text: |
        A computer's memory is one very long row of small numbered boxes. The number of a box is its **address**. The machine can open any box in one step if it is given the address. That is the only trick it has.

        To store a list, the simplest plan is to take a run of boxes that are **next to each other**, and give every item the same amount of room. This is an **array**. Suppose the run starts at address 1000 and each item takes 8 boxes. Where is item 0? At 1000. Item 1? At 1008. Item 5? At $1000 + 5 \times 8 = 1040$. No counting along is needed. One multiplication and one addition give the address, and the machine opens it. Item 100000 is found exactly as fast as item 5.

        This is the same arithmetic as a straight line, $\text{address} = \text{start} + \text{size} \times i$. It works only because the items are packed together with no gaps and are all the same size.

        And there is the price. With no gaps, there is nowhere to put a new item in the middle. To insert at position 2, every item from position 2 onwards must shuffle one place along to make room. To insert at the front, **every** item moves.

        The other plan gives up the packing. Let the items live anywhere in memory, and let each one carry a note saying where the next one is. This is a **linked list**. Now an insertion disturbs nobody: write the new item wherever there is room, and change two notes. But the formula is gone. To find item 5 you must start at the first and follow five notes.

        Try both in the figure. Move the place of insertion from the front to the back.
    - figure: array-list
      props: { index: 2 }
    - text: |
        At the front, the array moves all six items and the linked list follows no links. At the back, the array moves nothing and the linked list follows all six. Each structure is quick exactly where the other is slow.
  derivation:
    - text: |
        **The address formula.** An array is a block of memory holding $n$ slots of equal size $s$, starting at address $a$. Slot $i$ is at

        $$\text{address}(i) = a + s \cdot i.$$

        Reading or writing slot $i$ is one computation and one visit to memory, whatever $i$ and $n$ are. This is called **random access**, and it is $O(1)$.

        A Python list is an array. That may seem impossible, since a Python list can hold a number, a string and another list side by side, which are not the same size. The slots do not hold the items themselves. Each slot holds the **address of an item**, and an address is always the same size, 8 bytes on today's machines. The items live elsewhere. You have seen the consequence already: two names, or two slots, can refer to one object.

        **What an array makes cheap and what it makes dear.** Let the array hold $n$ items.

        | Operation | Work | Order |
        | --- | --- | --- |
        | read or write position $i$ | one address computed | $O(1)$ |
        | add at the end, if there is spare room | one write | $O(1)$ |
        | remove the last item | one step | $O(1)$ |
        | insert at position $i$ | the $n - i$ items from $i$ onwards move right | $O(n)$ |
        | remove position $i$ | the $n - i - 1$ items after it move left | $O(n)$ |

        The number of moves depends on where you insert. At the end it is 0, at the front $n$, and on average, over all positions, about $\frac{n}{2}$. Half of $n$ is still of order $n$.

        The phrase "if there is spare room" hides a real question. A block of memory cannot simply be stretched, because the boxes just after it may belong to something else. Python keeps some spare slots at the end, and when they run out it must do something drastic. What it does, and why appending still deserves to be called $O(1)$, has its own lesson later in this cluster.

        Here is why the front is so costly in bulk. Build a list of $n$ items by inserting each new one at the front. The first insertion moves 0 items, the second 1, the third 2, and the last $n - 1$:

        $$0 + 1 + 2 + \dots + (n - 1) = \frac{n(n - 1)}{2}.$$

        That is $O(n^2)$. For $n = 200000$ it is about 20 thousand million moves. Building the same list by appending is $n$ writes.

        **A linked list.** Give each item its own small object, a **node**, holding the item and the address of the next node. The last node holds `None`, meaning there is no next. The list as a whole is known by its first node, the **head**.

        ```python
        class Node:
            def __init__(self, value, next):
                self.value = value
                self.next = next

        head = Node(3, Node(8, Node(1, None)))
        ```

        This is the list 3, 8, 1. The nodes may be anywhere in memory. Nothing about their addresses is regular, so there is no formula for the third node. The only way to it is through the first two. Walking the whole list is a loop that follows links until it meets `None`:

        ```python
        node = head
        while node is not None:
            print(node.value)
            node = node.next
        ```

        Reaching position $i$ takes $i$ steps of `node = node.next`. That is $O(n)$ in the worst case, where the array took $O(1)$.

        In return, insertion needs no shuffling. To insert a value **after a node you already hold**, make a new node that points where the old one pointed, then point the old one at the new one:

        ```python
        def insert_after(node, value):
            node.next = Node(value, node.next)
        ```

        Two links are set, and the length of the list does not enter into it: $O(1)$. The order of the two actions matters. The new node must take over the old link before the old link is overwritten, or the rest of the list is lost. The single line above does this correctly because the right-hand side, including `node.next`, is worked out before the assignment happens.

        Inserting at the front is simpler still. The new node points at the old head and becomes the head: `head = Node(value, head)`. Removing the node after one you hold is one assignment, `node.next = node.next.next`, which makes the list skip over it.
    - question:
        id: derivation-order-of-links
        type: choice
        system: s2
        prompt: |
          To insert a new node `fresh` after `node` in a linked list, two links must be set. Which order is correct, and what goes wrong with the other?
        options:
          - "`node.next = fresh` and then `fresh.next = node.next`. Either order works."
          - "`fresh.next = node.next` and then `node.next = fresh`. In the other order `node.next` is already `fresh` when it is copied, so `fresh` points at itself and the rest of the list is lost."
          - "`fresh.next = node` and then `node.next = fresh`."
          - "Only one link needs to be set."
        answer: 1
        explanation: |
          The old value of `node.next` is the only record of where the rest of the list is. It has to be copied into the new node before it is overwritten. Done the other way round, `node.next` is first set to `fresh`, and then `fresh.next = node.next` copies that same address: the new node points at itself. A loop walking the list would then never reach `None`. With linked structures the usual discipline is to attach the new piece to what follows it first, and only then let the old structure point at it.
        hints:
          - What is the only place that remembers where the rest of the list is?
          - What happens to that record if it is overwritten first?
          - Follow the links after the wrong order, starting at node.
    - text: |
        **The two side by side.** For a list of $n$ items:

        | Operation | Array | Linked list |
        | --- | --- | --- |
        | reach position $i$ | $O(1)$ | $O(n)$ |
        | insert or remove at the front | $O(n)$ | $O(1)$ |
        | insert or remove at the end | $O(1)$ | $O(n)$, or $O(1)$ if the last node is also remembered |
        | insert or remove after a node already in hand | $O(n)$ | $O(1)$ |
        | walk through every item | $O(n)$ | $O(n)$ |

        Neither is better. They answer different questions quickly. An array is right when you mostly read by position or work at the end. A linked list is right when you hold your place in the list and keep inserting and removing there.

        **What the orders of growth leave out.** Walking is $O(n)$ for both, and in practice the array is several times faster. Two things big-O ignores make the difference. A node carries an address beside every item, so the linked list takes more memory. And processors fetch memory in neighbouring chunks, so stepping through an array finds the next items already fetched, while each link of a linked list may lead somewhere far away that has to be fetched afresh. For this reason the array is the default choice, and most programs never need a linked list as such.

        The idea of the linked list is worth more than the structure. Nodes that hold addresses of other nodes are how every branching structure is built. Give each node two links instead of one and you have a tree. Give it any number and you have a graph. You will build both in this cluster.

        **Vectors are arrays.** The vectors of the last cluster were lists, and now you know what that means: a dot product is a walk along two blocks of memory side by side, the cheapest pattern there is. A grid of numbers with $r$ rows and $c$ columns is usually stored as **one** array of $r \cdot c$ numbers, row after row. The entry in row $i$ and column $j$ is then at position

        $$i \cdot c + j,$$

        the address formula again, one level up. A table that looks two-dimensional to you is a single run of boxes to the machine, and arithmetic finds any entry in one step.
    - question:
        id: order-insert
        type: order
        system: s2
        prompt: An array holds 6 items in a block with spare room at the end. Put the steps in order to insert a new item at position 2 without losing anything.
        steps:
          - "Copy the item at position 5 into position 6."
          - "Copy the item at position 4 into position 5."
          - "Copy the item at position 3 into position 4."
          - "Copy the item at position 2 into position 3."
          - "Write the new item into position 2."
        explanation: The shuffling must start from the far end. Position 6 is empty, so the last item can move into it safely, which frees position 5 for the item before it, and so on back to position 2. Starting from position 2 instead would copy its item over position 3 before that one had been saved, and the same value would then be smeared along the whole array.
        hints:
          - Which position is empty at the start?
          - An item may only be copied into a position whose old contents are no longer needed.
          - The new item is written last, once its place is free.
  formal:
    - text: |
        **Array.** $n$ slots of equal size $s$ in consecutive memory from address $a$. Slot $i$ is at $a + s \cdot i$, so reading and writing by position are $O(1)$. Inserting at position $i$ moves $n - i$ items, and removing position $i$ moves $n - i - 1$: both $O(n)$, except at the end.

        **Python list.** An array of addresses of objects.

        **Linked list.** Nodes, each holding a value and the address of the next node, the last holding `None`. The list is known by its head. Reaching position $i$ follows $i$ links, $O(n)$. Inserting or removing after a node in hand, or at the head, sets a fixed number of links, $O(1)$.

        **Building at the front of an array.** $0 + 1 + \dots + (n - 1) = \frac{n(n - 1)}{2}$ moves, $O(n^2)$.

        **Row-major storage.** A grid with $c$ columns stored row after row has its entry $(i, j)$ at position $i \cdot c + j$.
  drill:
