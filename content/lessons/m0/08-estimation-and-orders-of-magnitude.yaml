concept: m0.estimation-and-orders-of-magnitude
minutes: 80
claim: You can round sensibly, write any number in scientific notation, estimate the size of a calculation in your head, and use that estimate to catch a wrong answer.
recalls: [m0.ratio-and-proportion]
uses: [m0.whole-numbers-and-place-value, m0.the-four-operations-and-order-of-operations, m0.fractions, m0.decimals-and-percentages, m0.negative-numbers, m0.powers-and-roots]
leads: [e0.what-a-program-is, m1.variables-and-expressions, m1.logarithms]
parts:
  recall:
    - text: |
        In [[m0.ratio-and-proportion]] numbers were compared by division: one is so many times another. This lesson turns that into a habit of mind. Two quick pulls first.
    - question:
        id: recall-scale
        type: numeric
        system: s1
        concepts: [m0.ratio-and-proportion]
        prompt: |
          $3 : 5 = x : 20$. What is $x$?
        answer: "12"
        explanation: Five was multiplied by 4, so three is too.
        hints:
          - What was 5 multiplied by?
          - Do the same to 3.
    - question:
        id: recall-rate
        type: numeric
        system: s1
        concepts: [m0.ratio-and-proportion]
        prompt: A program labels 90 pictures in 6 seconds. How many per second?
        answer: "15"
        explanation: Scale the 6 seconds down to 1.
        hints:
          - The word per means for each one.
          - Divide by the number of seconds.
  puzzle:
    - text: |
        A colleague hands you a line from a report:

        $$4870 \times 0.0213 = 1037.31$$

        You have no calculator and five seconds. **Is it right?**

        It is not, and with the right habit you can know that almost instantly, without working out a single exact digit. The true value is 103.731. The digits are all correct. Only the decimal point is in the wrong place, which makes the answer wrong by a factor of ten.

        That kind of mistake is the most common and the most damaging in all numerical work. A slip in the last digit rarely matters. A slip in the *size* turns a sensible result into nonsense: a rate ten times too large, a data set a thousand times too small. Programs make these slips as readily as people, and they do not blush. The only protection is to know roughly what the answer must be **before** you see it. How?
  intuition:
    - text: |
        Look at the calculation the way you would look at a map from far above. From that height the fine detail vanishes and only the big features remain.

        4870 is *about five thousand*. 0.0213 is *about two hundredths*. Five thousand lots of two hundredths: two hundredths of a thousand is 20, and five of those make 100. The answer must be near 100. So 1037.31 is impossible and 103.731 is believable. That took less time than reading this paragraph.

        Two moves were made there.

        **Rounding.** Each number was replaced by a nearby number that is easy to work with. Almost all of the size of 4870 lives in its leading digit and its place. The 870 on the end changes the answer by less than a fifth.

        **Thinking in powers of ten.** The real question was never "what are the digits?" It was "is this near 10, near 100 or near 1000?" Each of those is ten times the one before. Scientists call each such step an **order of magnitude**. Being off by one order of magnitude is being off by a factor of ten.

        Slide the exponent below from one end to the other, and get a feel for the ladder.
    - figure: powers-of-ten
      props: { start: 2 }
    - text: |
        Most of the time, the rung of the ladder matters far more than the exact position on it. A program that takes 2 seconds and one that takes 3 are much the same. One that takes 2 seconds and one that takes 2,000 are different creatures. When people who work with data talk casually, they talk in orders of magnitude: "about a million pictures", "an error rate around a tenth of a per cent", "a setting near ten to the minus three".
  derivation:
    - text: |
        **Rounding to a place.** To round to the nearest hundred, ask which multiple of a hundred the number is closest to. 6,482 lies between 6,400 and 6,500. The halfway mark is 6,450, and 6,482 is beyond it, so it rounds to 6,500. In practice: look at the digit immediately to the right of the place you are keeping. If it is 5 or more, round up. If it is 4 or less, round down. Rounding to the nearest hundred can never move a number by more than 50, which is half of the place you rounded to.

        **Significant figures.** Rounding "to the nearest hundred" suits numbers in the thousands, but is useless for 0.0213. What we really want is to keep a certain number of **leading digits**, wherever they are. The first non-zero digit of a number, reading from the left, is its first **significant figure**. To one significant figure, 4870 is 5000 and 0.0213 is 0.02. To two, they are 4900 and 0.021. Zeros in front, as in 0.0213, only hold the place and are not significant.

        One significant figure is enough to catch a mistake in size. Two are enough for most everyday estimates.

        **Scientific notation.** We want to pull a number apart into "the digits" and "the size". Any positive number can be written as

        $$a \times 10^n \quad \text{with } 1 \le a < 10,$$

        where $n$ is an integer. To find it, move the digits past the point until exactly one non-zero digit stands to its left, and count the moves. For 4870, three moves give 4.87, so

        $$4870 = 4.87 \times 10^3.$$

        For 0.0213 the digits must move the other way, two places, and the exponent is negative:

        $$0.0213 = 2.13 \times 10^{-2}.$$

        Check it with the meaning of a negative exponent from two lessons ago: $10^{-2}$ is a hundredth, and 2.13 hundredths is 0.0213. The front number $a$ carries the digits. The exponent $n$ carries the size, and is the number's **order of magnitude**.
    - question:
        id: to-scientific
        type: numeric
        system: s2
        prompt: |
          A collection holds 60,000 pictures. Written in scientific notation that is $6 \times 10^n$. What is $n$?
        answer: "4"
        explanation: The digits move four places to leave 6 alone before the point. Sixty thousand is six ten-thousands, and ten thousand is $10^4$.
        hints:
          - Move the digits until exactly one non-zero digit is left of the point.
          - Count how many places they moved.
    - text: |
        **Multiplying in scientific notation.** Order does not matter in a multiplication, so gather the front numbers together and the powers of ten together:

        $$(4.87 \times 10^3) \times (2.13 \times 10^{-2}) = (4.87 \times 2.13) \times (10^3 \times 10^{-2}).$$

        Powers of the same base multiply by adding exponents: $10^{3 + (-2)} = 10^1$. And $4.87 \times 2.13$ is roughly $5 \times 2 = 10$. So the product is about $10 \times 10^1 = 100$. This is the bird's-eye estimate again, now with each step justified: commutativity lets us regroup, and the exponent rule handles the size.

        Division works the same way, with exponents subtracted: $\dfrac{6 \times 10^4}{3 \times 10^{-2}} = 2 \times 10^{4 - (-2)} = 2 \times 10^6$.

        **Estimating a whole problem.** The same method answers questions that seem at first to need data you do not have. How many seconds are there in a year? Nobody remembers. But

        $$60 \times 60 \times 24 \times 365 \approx (6 \times 10^1) \times (6 \times 10^1) \times (2 \times 10^1) \times (4 \times 10^2).$$

        The sign $\approx$ means "is approximately". Front numbers: $6 \times 6 \times 2 \times 4 = 288$, about $3 \times 10^2$. Powers: $10^{1+1+1+2} = 10^5$. Together about $3 \times 10^7$, thirty million. The exact figure is 31,536,000. One significant figure each, and the estimate is within five per cent.

        Why did it work so well when every factor was rounded? Because some were rounded up (24 to 20 is down, 365 to 400 is up) and the errors partly cancelled. That is typical, not lucky. It also suggests a tactic: when you round one factor up, round another down if you can.

        **Three checks for any answer.** Before trusting a result, ask:

        1. **Sign.** Should it be positive or negative?
        2. **Size.** Which power of ten should it be near?
        3. **Sense.** Does it respect an obvious limit? A fraction of a whole cannot exceed the whole. A product of two numbers below one must be smaller than either.

        None of these needs exact arithmetic, and together they catch most errors.
    - question:
        id: catch-error
        type: choice
        system: s2
        prompt: |
          Which of these is closest to $4870 \times 0.0213$?
        options: ["10", "100", "1,000", "10,000"]
        answer: 1
        explanation: |
          About $(5 \times 10^3) \times (2 \times 10^{-2}) = 10 \times 10^1$. The report in the puzzle was out by one order of magnitude.
        hints:
          - Round each number to one significant figure.
          - Write each as a front number times a power of ten.
          - Multiply the front numbers and add the exponents.
  formal:
    - text: |
        **Rounding** a number to a given place replaces it by the nearest multiple of that place. A number exactly halfway is, by the usual convention, rounded up. The change made by rounding is at most half a unit of the place rounded to.

        The **significant figures** of a number are its digits starting from the first non-zero digit on the left. Rounding to $k$ significant figures keeps $k$ of them.

        **Scientific notation.** Every positive number can be written in exactly one way as $a \times 10^n$ with $1 \le a < 10$ and $n$ an integer. The integer $n$ is its **order of magnitude**. Two numbers differ by $k$ orders of magnitude when their ratio is about $10^k$.

        **Arithmetic.**

        $$(a \times 10^m) \times (b \times 10^n) = (a \times b) \times 10^{m+n}, \qquad \frac{a \times 10^m}{b \times 10^n} = \frac{a}{b} \times 10^{m-n}.$$

        If the new front number falls outside the range from 1 to 10, move one power of ten across: $12 \times 10^4 = 1.2 \times 10^5$.

        To **add** numbers in scientific notation, first rewrite them with the same power of ten. Notice what this implies: adding a number to one that is several orders of magnitude larger barely changes the larger. $10^6 + 10^2$ is 1,000,100, still about $10^6$.

        A useful bridge between the two bases you have met: $2^{10} = 1024 \approx 10^3$. So $2^{20} \approx 10^6$ and $2^{30} \approx 10^9$.
  drill:
    - text: Seconds each.
    - question:
        id: round-hundred
        type: numeric
        system: s1
        prompt: Round 6,482 to the nearest hundred.
        answer: "6500"
        explanation: The tens digit is 8, which is 5 or more, so round up.
        hints:
          - Look at the digit to the right of the hundreds place.
          - Is it 5 or more?
    - question:
        id: round-sigfig
        type: numeric
        system: s1
        prompt: Round 0.0473 to one significant figure.
        answer: "0.05"
        explanation: The first significant figure is the 4. The next digit is 7, so it rounds up.
        hints:
          - Find the first digit that is not zero.
          - Look at the digit after it.
    - question:
        id: from-scientific
        type: numeric
        system: s1
        prompt: Write $3 \times 10^4$ as an ordinary number.
        answer: "30000"
        explanation: Three ten-thousands.
        hints:
          - The exponent counts places.
          - A 3 followed by how many zeros?
    - question:
        id: small-scientific
        type: numeric
        system: s1
        prompt: |
          $0.006 = 6 \times 10^n$. What is $n$?
        answer: "-3"
        explanation: Six thousandths. The digits moved three places, and the number is less than one, so the exponent is negative.
        hints:
          - Which place is the 6 in?
          - Numbers below one have negative exponents.
    - question:
        id: multiply-scientific
        type: numeric
        system: s1
        prompt: |
          $(2 \times 10^3) \times (4 \times 10^2) = 8 \times 10^n$. What is $n$?
        answer: "5"
        explanation: Front numbers multiply, exponents add.
        hints:
          - Handle the powers of ten separately from the front numbers.
          - Multiplying powers adds exponents.
    - question:
        id: orders-apart
        type: numeric
        system: s1
        prompt: By how many orders of magnitude is $10^{-1}$ larger than $10^{-4}$?
        answer: "3"
        explanation: |
          Their ratio is $10^{-1 - (-4)} = 10^3$. A thousand times.
        hints:
          - Divide one by the other.
          - Dividing powers subtracts exponents.
  work:
    - text: Slower now. For each, estimate before you calculate anything exactly.
    - question:
        id: fermi-steps
        type: order
        system: s2
        prompt: Put the steps of estimating a product of several awkward numbers into order.
        steps:
          - Round every number to one significant figure.
          - Write each rounded number as a front number times a power of ten.
          - Multiply the front numbers together.
          - Add the exponents of the powers of ten.
          - If the front number has left the range from 1 to 10, move a power of ten across.
        explanation: Round first so the arithmetic is easy, then separate digits from size, handle each, and tidy at the end.
        hints:
          - The numbers must be made simple before they are pulled apart.
          - Tidying the form is the last thing to do.
    - question:
        id: layer-size
        type: choice
        system: s2
        prompt: |
          One part of a program stores a separate number for every pairing of 784 inputs with 512 outputs, $784 \times 512$ numbers in all. Without calculating exactly, which is closest?
        options: ["4,000", "40,000", "400,000", "4,000,000"]
        answer: 2
        explanation: |
          About $(8 \times 10^2) \times (5 \times 10^2) = 40 \times 10^4 = 4 \times 10^5$. The exact value is 401,408.
        hints:
          - Round each number to one significant figure.
          - One was rounded up and one down, so the errors partly cancel.
          - Multiply the front numbers and add the exponents.
    - question:
        id: time-estimate
        type: numeric
        system: s2
        prompt: |
          A program labels $2 \times 10^3$ pictures per second. How many seconds does it need for $6 \times 10^6$ pictures?
        answer: "3000"
        unit: seconds
        explanation: |
          $\dfrac{6 \times 10^6}{2 \times 10^3} = 3 \times 10^{6-3} = 3 \times 10^3$. That is 50 minutes.
        hints:
          - Pictures divided by pictures per second gives seconds.
          - Divide the front numbers and subtract the exponents.
    - question:
        id: divide-scientific
        type: numeric
        system: s2
        prompt: |
          $\dfrac{6 \times 10^4}{3 \times 10^{-2}} = 2 \times 10^n$. What is $n$?
        answer: "6"
        explanation: |
          $4 - (-2)$. Subtracting a negative adds its opposite. Dividing by a number much smaller than one makes the result much larger.
        hints:
          - Dividing powers subtracts exponents.
          - Take care with the sign of the second exponent.
    - question:
        id: sense-check
        type: choice
        system: s2
        prompt: |
          A report states that $0.48 \times 0.52 = 2.496$. Without calculating exactly, what can you say?
        options:
          - "It is plausible, since $48 \\times 52 = 2496$."
          - "It must be wrong. Both numbers are about a half, so the product is about a quarter, and a product of two numbers below one cannot exceed either of them."
          - "It must be wrong, because the answer should be negative."
          - "Nothing can be said without a calculator."
        answer: 1
        explanation: The digits are right and the size is wrong by an order of magnitude. The true value is 0.2496. This is the sense check.
        hints:
          - Round both numbers to something very simple.
          - Can taking about half of about a half give more than two?
    - question:
        id: powers-bridge
        type: numeric
        system: s2
        prompt: |
          Using $2^{10} \approx 10^3$, a row of 20 switches can show about $10^n$ patterns. What is $n$?
        answer: "6"
        explanation: |
          $2^{20} = 2^{10} \times 2^{10} \approx 10^3 \times 10^3$. About a million. The exact value is 1,048,576.
        hints:
          - Split the 20 switches into two rows of ten.
          - Multiplying powers adds exponents.
    - question:
        id: percent-estimate
        type: choice
        system: s2
        prompt: Which is closest to 19.6% of 5,120?
        options: ["100", "1,000", "2,500", "10,000"]
        answer: 1
        explanation: About 20% of about 5,000, which is a fifth of 5,000.
        hints:
          - Round the percentage to something friendly.
          - What simple fraction is that?
  connections:
    - text: |
        That completes the first cluster. Look at how far the ground has been built up from nothing. You began with digits in places. You defined four operations and found the laws they obey. You sealed two leaks, one with fractions and one with negative numbers, each time by demanding that the laws survive. You gave repeated multiplication a notation, learned to compare by ratio, and now can judge the size of an answer before computing it.

        Estimation is not a lesser skill than exact calculation. It is the supervisor of exact calculation. From now on, every numeric question in this course is an invitation to estimate first, and many will be easier that way.

        The very next lesson puts all of this arithmetic to work in a new place. Until now you have done every calculation yourself. A computer can do them for you, exactly and by the million, if you can say precisely what you want. That is programming, and it begins with [[e0.what-a-program-is]]. The first things you type will be the operations of this cluster, and the three checks, sign, size and sense, will be the first tests you run on anything a program prints.

        Something else has been building quietly. In almost every lesson, a statement about *all* numbers needed letters: $a \times (b + c)$, $a^m \times a^n$, $y = k \times x$. So far the letters were only a convenience for stating laws. Once you can program, the algebra cluster turns them into a tool for working, starting with [[m1.variables-and-expressions]].

        And one last thread. Scientific notation described a number's size by an exponent. Later you will meet a function that takes a number and hands back that exponent directly, for any number, not just the tidy powers. It is called the logarithm, in [[m1.logarithms]], and it is one of the most heavily used ideas in machine learning.
