concept: m0.ratio-and-proportion
minutes: 85
claim: You can compare quantities by ratio, turn a ratio into a rate per one, recognise when two quantities are proportional, and find a missing value in a proportion while saying why the method works.
recalls: [m0.powers-and-roots]
uses: [m0.the-four-operations-and-order-of-operations, m0.fractions, m0.decimals-and-percentages]
leads: [m0.estimation-and-orders-of-magnitude, m1.straight-lines-and-slope]
parts:
  recall:
    - text: |
        In [[m0.powers-and-roots]] repeated multiplication got its own shorthand, and the lesson ended by noticing that there are two ways to compare numbers: by how much more, and by how many times. First, two quick pulls on the last lesson.
    - question:
        id: recall-power
        type: numeric
        system: s1
        concepts: [m0.powers-and-roots]
        prompt: "$2^6$"
        answer: "64"
        explanation: 2, 4, 8, 16, 32, and once more.
        hints:
          - Double repeatedly.
          - Six factors in all.
    - question:
        id: recall-root
        type: numeric
        system: s1
        concepts: [m0.powers-and-roots]
        prompt: "$\\sqrt{144}$"
        answer: "12"
        explanation: "$12 \\times 12 = 144$. It is one of the squares worth knowing by sight."
        hints:
          - Which number times itself gives 144?
          - It is a little more than ten.
  puzzle:
    - text: |
        Two programs label pictures. Each is tested, and its mistakes are counted.

        - Program A makes **45** mistakes.
        - Program B makes **60** mistakes.

        Which is the better program?

        Subtract and A looks better, by 15 mistakes. But one fact was left out. A was tested on 900 pictures, and B on 1,500. B was given far more chances to go wrong.

        So the raw counts cannot be compared, and neither can their difference. A program tested on a million pictures will make more mistakes than one tested on ten, however good it is. **What is the fair way to compare two counts that come from different totals?**
  intuition:
    - text: |
        The fair question is not "how many mistakes?" but "how many mistakes **for each** picture?", or, the same thing scaled up, "how many mistakes for every hundred pictures?"

        Program A made 45 mistakes in 900 pictures. Cut both numbers down together. That is 5 mistakes in every 100. Program B made 60 in 1,500. That is 4 in every 100. B is the better program, even though it made more mistakes.

        What we just did has a name. We compared each count with its total **by division instead of by subtraction**. A comparison by division is called a **ratio**.

        The idea underneath is one you already own. In the lesson on fractions, $\frac{3}{4}$ and $\frac{6}{8}$ were the same amount because both numbers were scaled by the same factor. A ratio is exactly that: a relationship between two quantities that stays the same when both are multiplied, or both divided, by the same number. "45 in 900" and "5 in 100" are the same ratio.

        In the figure, a collection of pictures is split so that for every 4 used for training, 1 is kept for testing. Slide the multiplier. Both bars grow, but watch what does not change.
    - figure: ratio-table
      props: { a: 4, b: 1, first: for training, second: for testing, start: 1 }
    - text: |
        The amounts change. The total changes. The **shape** does not: the first bar is always four times as long as the second. Four to one, eight to two, forty to ten: all are the same ratio, written $4 : 1$.

        That is the difference between the two kinds of comparison. If you **add** the same amount to two quantities, the gap between them stays fixed, but their ratio changes. If you **multiply** two quantities by the same number, their ratio stays fixed, but the gap changes. Ratios are for situations where things scale together: recipes, maps, speeds, error rates, the way a data set is split.
  derivation:
    - text: |
        **Writing a ratio.** "Four parts to one part" is written $4 : 1$. A ratio can be scaled up or down like a fraction: $12 : 8$, dividing both by 4, is $3 : 2$. When no further common factor remains, the ratio is in simplest form.

        **Two kinds of ratio, and how they relate.** The split $4 : 1$ compares one part with the other part. It does not say that training is $\frac{4}{1}$ of the collection, which would be more than all of it. To compare a part with the **whole**, first find the whole in the same units: $4 + 1 = 5$ parts. Then training is $\frac{4}{5}$ of the whole and testing is $\frac{1}{5}$.

        This is the single most common slip with ratios, so say it once more. A ratio $a : b$ between two parts corresponds to the fractions $\frac{a}{a+b}$ and $\frac{b}{a+b}$ of the whole.

        **Rates: ratios per one.** The most useful way to scale a ratio is until the second number is 1. Program A's 45 mistakes in 900 pictures becomes

        $$\frac{45}{900} = \frac{5}{100} = 0.05 \text{ mistakes per picture.}$$

        A ratio scaled so that it speaks about **one** unit of the second quantity is called a **unit rate**, and the word "per" means "for each one". Speeds are unit rates: kilometres per hour. So are prices per kilogram. A percentage is a rate per hundred instead of per one, which is the same idea with a friendlier size.

        Unit rates are what make comparison fair, because they put everything on the same footing: one picture, one hour, one kilogram.
    - question:
        id: error-rate
        type: numeric
        system: s2
        prompt: |
          Program B made 60 mistakes on 1,500 pictures. Its error rate is $x\%$. What is $x$?
        answer: "4"
        explanation: |
          $\frac{60}{1500}$. Dividing top and bottom by 15 gives $\frac{4}{100}$. Four mistakes per hundred pictures, against A's five. B is better.
        hints:
          - A percentage is a rate per hundred.
          - Scale the ratio of mistakes to pictures until the second number is a hundred.
          - What must 1,500 be divided by to give a hundred? Do the same to the mistakes.
    - text: |
        **Proportion.** Two quantities are **proportional** when their ratio never changes: double one and the other doubles, halve one and the other halves. If a program handles pictures at a steady speed, the time taken is proportional to the number of pictures.

        Since the ratio is fixed, call its value $k$. Then the second quantity is always $k$ times the first:

        $$y = k \times x.$$

        The number $k$ is the unit rate, here called the **constant of proportionality**. Everything about a proportional relationship is contained in that one number.

        **Finding a missing value.** Suppose 3 pictures take 0.6 seconds, at a steady speed. How long do 20 take? There are two routes, and they are the same idea.

        *Through one.* Find the unit rate: $0.6 \div 3 = 0.2$ seconds per picture. Then 20 pictures take $20 \times 0.2 = 4$ seconds. Go down to one, then up to what you need.

        *By the equation.* The two ratios must be equal:

        $$\frac{0.6}{3} = \frac{t}{20}.$$

        In the lesson on fractions, two fractions $\frac{a}{b}$ and $\frac{c}{d}$ were equal exactly when $a \times d = b \times c$. Apply that here: $0.6 \times 20 = 3 \times t$, so $12 = 3 \times t$, and $t = 4$. This is what people call "cross-multiplying". It is not a trick. It is the test for equal fractions, used backwards.
    - question:
        id: missing-value
        type: numeric
        system: s2
        prompt: |
          At a steady speed, a program labels 8 pictures in 2 seconds. How many seconds does it need for 100 pictures?
        answer: "25"
        unit: seconds
        explanation: |
          Through one: $2 \div 8 = 0.25$ seconds per picture, and $100 \times 0.25 = 25$. Or by the equation: $\frac{2}{8} = \frac{t}{100}$ gives $8 \times t = 200$.
        hints:
          - Find the time for one picture first.
          - Then scale up to the number you need.
          - Check that your result is larger than 2 seconds, since there are more pictures.
    - text: |
        **When things are not proportional.** Proportion is so convenient that it is tempting to assume it everywhere. Two warnings.

        First, adding is not scaling. The ratio $2 : 3$ is not the same as $3 : 4$, although one was added to each side. As decimals, $\frac{2}{3}$ is about 0.67 and $\frac{3}{4}$ is 0.75.

        Second, some quantities scale by a **power**. Double the side of a square picture from 28 pixels to 56 and the number of pixels does not double. The picture is twice as wide *and* twice as tall, so the count is multiplied by $2 \times 2 = 2^2 = 4$. In general, scaling every length by a factor $k$ scales an area by $k^2$. A picture three times as wide and tall holds nine times as many pixels, which is why larger pictures are so much more costly for a program to handle.

        **Inverse proportion.** Sometimes one quantity goes up exactly as another goes down. If 4 machines finish a job in 6 hours, then 8 identical machines finish it in 3. Here it is the **product**, not the ratio, that stays fixed: $4 \times 6 = 8 \times 3 = 24$ machine-hours of work. Doubling one quantity halves the other.
  formal:
    - text: |
        A **ratio** $a : b$, with $b$ not zero, compares two quantities by division. Its value is the fraction $\frac{a}{b}$. For any $n$ not zero, $a : b$ and $n \times a : n \times b$ are the same ratio.

        If a whole is divided into two parts in the ratio $a : b$, the parts are $\frac{a}{a+b}$ and $\frac{b}{a+b}$ of the whole. The same holds for three or more parts: in the ratio $a : b : c$ the first part is $\frac{a}{a+b+c}$ of the whole.

        A **rate** is a ratio of quantities of different kinds, and a **unit rate** is a rate whose second quantity is 1.

        Two quantities $x$ and $y$ are **proportional** if there is a fixed number $k$, the constant of proportionality, with $y = k \times x$ for every pair of values. Equivalently, $\frac{y}{x}$ is the same for every pair.

        A **proportion** is a statement that two ratios are equal, $\frac{a}{b} = \frac{c}{d}$, and it holds exactly when $a \times d = b \times c$.

        Two quantities are **inversely proportional** if their product is fixed: $x \times y = k$.

        If all lengths of a flat shape are multiplied by $k$, its area is multiplied by $k^2$.
  drill:
    - text: Seconds each.
    - question:
        id: simplify-ratio
        type: numeric
        system: s1
        prompt: |
          $12 : 8 = 3 : x$. What is $x$?
        answer: "2"
        explanation: Both numbers were divided by 4.
        hints:
          - What was 12 divided by to give 3?
          - Do the same to 8.
    - question:
        id: part-of-whole
        type: numeric
        system: s1
        prompt: |
          A collection is split in the ratio $3 : 1$. What fraction of the whole is the larger part?
        answer: "3/4"
        explanation: There are $3 + 1 = 4$ parts in all.
        hints:
          - How many parts make the whole?
          - The larger part is three of them.
    - question:
        id: unit-rate
        type: numeric
        system: s1
        prompt: A program labels 150 pictures in 3 seconds. How many pictures per second is that?
        answer: "50"
        unit: per second
        explanation: Per second means for each one second. Divide by 3.
        hints:
          - The word per means for each one.
          - Scale the 3 seconds down to 1.
    - question:
        id: scale-up
        type: numeric
        system: s1
        prompt: |
          $3 : 4 = 15 : x$. What is $x$?
        answer: "20"
        explanation: Three was multiplied by 5.
        hints:
          - What was 3 multiplied by?
          - Do the same to 4.
    - question:
        id: share
        type: numeric
        system: s1
        prompt: "35 pictures are split in the ratio $2 : 5$. How many are in the smaller part?"
        answer: "10"
        explanation: Seven parts in all, so each part is 5 pictures. Two parts.
        hints:
          - How many parts in all?
          - How big is one part?
    - question:
        id: solve-proportion
        type: numeric
        system: s1
        prompt: |
          $\dfrac{x}{12} = \dfrac{3}{4}$. What is $x$?
        answer: "9"
        explanation: Twelve is three fours, so the top is three threes.
        hints:
          - How was the bottom scaled?
          - Scale the top the same way.
  work:
    - text: Slower now.
    - question:
        id: three-way-split
        type: numeric
        system: s2
        prompt: |
          A collection of 60,000 pictures is split into three sets, for training, for checking during training, and for the final test, in the ratio $8 : 1 : 1$. How many pictures are in the final test set?
        answer: "6000"
        unit: pictures
        explanation: |
          There are $8 + 1 + 1 = 10$ parts, so one part is $60000 \div 10$. The test set is one part.
        hints:
          - Add up the parts to find the whole in parts.
          - Find the size of one part.
    - question:
        id: throughput
        type: numeric
        system: s2
        prompt: |
          At a steady speed a program labels 240 pictures in 8 seconds. How many does it label in one minute?
        answer: "1800"
        unit: pictures
        explanation: |
          The unit rate is $240 \div 8 = 30$ pictures per second. A minute is 60 seconds.
        hints:
          - Find the number per second first.
          - Both times must be in the same unit before you scale.
    - question:
        id: proportion-steps
        type: order
        system: s2
        prompt: |
          5 pictures take 2 seconds at a steady speed. Put the steps for finding the time $t$ for 35 pictures, by the equation method, into order.
        steps:
          - "State that the two ratios of time to pictures are equal: $\\dfrac{2}{5} = \\dfrac{t}{35}$."
          - "Use the test for equal fractions: $2 \\times 35 = 5 \\times t$."
          - "Work out the left side: $70 = 5 \\times t$."
          - "Undo the multiplication by dividing: $t = 14$."
        explanation: The proportion is set up first, with matching quantities in matching positions. The test for equal fractions then removes the fractions, and one division finishes it.
        hints:
          - Nothing can be solved before the equation exists.
          - The fractions must go before the single multiplication can be undone.
    - question:
        id: area-scaling
        type: numeric
        system: s2
        prompt: |
          A square picture is enlarged so that its side goes from 28 pixels to 84 pixels. By what factor is the number of pixels multiplied?
        answer: "9"
        explanation: |
          The side is multiplied by $84 \div 28 = 3$. The count of pixels is rows times columns, and both are tripled, so it is multiplied by $3^2$.
        hints:
          - Find the scale factor of the side first.
          - Both the rows and the columns are scaled by that factor.
          - Area scales by the square of the scale factor.
    - question:
        id: inverse
        type: numeric
        system: s2
        prompt: |
          A job takes 4 identical machines 6 hours. Working in the same way, how many hours would 12 machines take?
        answer: "2"
        unit: hours
        explanation: |
          The total work is fixed: $4 \times 6 = 24$ machine-hours. Then $24 \div 12$. Three times the machines, a third of the time.
        hints:
          - More machines should take less time, so this is not ordinary proportion.
          - What quantity stays fixed here?
          - Find the total machine-hours, then share it among the machines.
    - question:
        id: is-proportional
        type: choice
        system: s2
        prompt: |
          In which case are the two quantities proportional?
        options:
          - "Pictures labelled: 10, 20, 30. Seconds taken: 4, 8, 12."
          - "Pictures labelled: 10, 20, 30. Seconds taken: 5, 7, 9."
          - "Side of a square: 1, 2, 3. Pixels in it: 1, 4, 9."
          - "Machines: 1, 2, 4. Hours for the job: 8, 4, 2."
        answer: 0
        explanation: Only in the first is the ratio the same in every pair, 0.4 seconds per picture. The second adds a fixed 2 for each extra 10 pictures but starts from the wrong place, the third scales by a square, and the fourth is inverse proportion.
        hints:
          - Work out the ratio of the second quantity to the first for every pair.
          - Proportional means that ratio never changes.
    - question:
        id: fair-comparison
        type: choice
        system: s2
        prompt: |
          Program C makes 30 mistakes on 500 pictures. Program D makes 54 mistakes on 1,000 pictures. Which statement is correct?
        options:
          - "C is better, because it made fewer mistakes."
          - "D is better, because its error rate is 5.4% against C's 6%."
          - "They are equally good, because D saw twice as many pictures and made about twice as many mistakes."
          - "They cannot be compared, because the totals differ."
        answer: 1
        explanation: Per hundred pictures, C makes 6 mistakes and D makes 5.4. Rates put both on the same footing.
        hints:
          - Counts from different totals cannot be compared directly.
          - Turn each into a rate per hundred.
  connections:
    - text: |
        The puzzle is answered. Counts that come from different totals are compared by ratio, most conveniently as a rate per one or per hundred. Every accuracy and every error rate you will ever read is such a ratio.

        Proportion will come back in a new form very soon. The equation $y = k \times x$ says that $y$ is a fixed multiple of $x$. Drawn as a picture it is a straight line through zero, and the constant $k$ is the steepness of that line. That is the subject of [[m1.straight-lines-and-slope]], and a great deal of machine learning is, underneath, the business of finding good values for constants like $k$.

        You have now met every kind of number and operation in this cluster. One skill remains, and it is the one that experienced people use more than any other: knowing roughly what the answer must be before calculating it. That is the last lesson, [[m0.estimation-and-orders-of-magnitude]].
