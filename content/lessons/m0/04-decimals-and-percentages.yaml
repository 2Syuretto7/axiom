concept: m0.decimals-and-percentages
minutes: 90
claim: You can read a decimal as a sum of fractions with place-value bottoms, convert freely between fractions, decimals and percentages, and tell a change in percentage points from a percentage change.
recalls: [m0.fractions]
uses: [m0.whole-numbers-and-place-value, m0.the-four-operations-and-order-of-operations]
leads: [m0.negative-numbers]
parts:
  recall:
    - text: |
        In [[m0.fractions]] a fraction was a count of equal pieces, and the same amount could be renamed with a different bottom by cutting every piece more finely. Both ideas are about to be used with one special family of bottoms.
    - question:
        id: recall-add
        type: numeric
        system: s1
        concepts: [m0.fractions]
        prompt: "$\\dfrac{1}{2} + \\dfrac{1}{4}$"
        answer: "3/4"
        explanation: A half is two quarters. Two quarters and one quarter.
        hints:
          - The pieces must be the same size before they can be counted.
          - Rename the half.
    - question:
        id: recall-rename
        type: numeric
        system: s1
        concepts: [m0.fractions]
        prompt: |
          $\dfrac{3}{5} = \dfrac{x}{100}$. What is $x$?
        answer: "60"
        explanation: A hundred is twenty fives, so each fifth was cut into twenty.
        hints:
          - How many times finer is the cut on the right?
          - Do to the top what was done to the bottom.
  puzzle:
    - text: |
        Three programs are tested. The first labels $\frac{7}{8}$ of its test pictures correctly. The second gets $\frac{22}{25}$. The third gets $\frac{17}{20}$. Which is best?

        You know how to settle it. Find a common bottom for 8, 25 and 20, which is 200, rename all three, and compare tops: 175, 176 and 170. The second program wins, narrowly.

        That was a lot of work for one comparison. And it gets worse. Add a fourth program with a score of $\frac{13}{15}$ and 200 no longer works as a bottom. Every new fraction can force a new common bottom and a full round of renaming.

        Whole numbers never had this problem. To compare 8,999 with 10,000 you just read the digits. **Is there a way to write fractions so that they can be compared, added and multiplied digit by digit, the way whole numbers are?**
  intuition:
    - text: |
        Recall the trays from the first lesson. Each place was worth ten of the place to its right: thousands, hundreds, tens, ones. Read that sentence backwards. Each place is worth **one tenth** of the place to its left.

        Nothing says the pattern has to stop at the ones. Keep going right. One tenth of a one is a tenth. One tenth of a tenth is a hundredth. One tenth of a hundredth is a thousandth. The shopkeeper who wrapped ten coins into a roll can also cut one coin into ten slivers.

        The only thing needed is a mark to show where the ones place is, since it is no longer the last digit. That mark is the **decimal point**. It sits immediately to the right of the ones.

        $$3.75 = 3 \times 1 + 7 \times \frac{1}{10} + 5 \times \frac{1}{100}$$

        So a decimal is not a new kind of number. It is a fraction, or a sum of a few fractions, whose bottoms are restricted to 10, 100, 1000 and so on. The digits after the point are the tops. Once every fraction is written with these agreed bottoms, comparison is a matter of reading digits from the left, exactly as it was for whole numbers. The common denominator has been chosen in advance, once, for everybody.

        On the number line below each step is one tenth. Step from 0 to 1 and count the steps. Then keep going past 1.
    - figure: number-line
      props: { min: 0, max: 2, start: 0, parts: 10 }
    - text: |
        The figure labels a stop as $\frac{7}{10}$. In decimal writing that is 0.7. Thirteen tenths is one whole and three tenths, 1.3. The carry works across the point exactly as it works everywhere else: ten tenths are wrapped into a one.

        **Percentages** are the same idea with one fixed bottom. "Per cent" is Latin for "out of a hundred". 75% means $\frac{75}{100}$, which is 0.75, which is $\frac{3}{4}$. Three names, one number. Percentages are popular for scores and rates because a hundred is fine enough for most purposes and people find "94 out of 100" easier to feel than "0.94".
  derivation:
    - text: |
        **From decimal to fraction.** Read the digits after the point as a whole number, and put it over the place of the last digit. In 0.375 the last digit is in the thousandths place, so

        $$0.375 = \frac{375}{1000} = \frac{3}{8}.$$

        The first step is just adding $\frac{3}{10} + \frac{7}{100} + \frac{5}{1000}$ with the common bottom 1000. The second is ordinary simplifying.

        **From fraction to decimal.** A fraction is a division, so divide, and when you run out of ones, do what the puzzle with the rotis taught: change to a smaller unit and carry on. Take $\frac{3}{4}$, which is $3 \div 4$.

        - Ones: 4 goes into 3 zero times, remainder 3. Write `0.`
        - Change the 3 ones into 30 tenths. 4 goes into 30 seven times, remainder 2. Write `7`.
        - Change the 2 tenths into 20 hundredths. 4 goes into 20 five times, remainder 0. Write `5`.

        The remainder is zero, so the division is finished: $\frac{3}{4} = 0.75$.
    - question:
        id: to-decimal
        type: numeric
        system: s2
        prompt: |
          Convert $\dfrac{3}{8}$ to a decimal by dividing, changing each remainder into the next smaller place.
        answer: "0.375"
        explanation: |
          30 tenths divided by 8 is 3, remainder 6. 60 hundredths divided by 8 is 7, remainder 4. 40 thousandths divided by 8 is 5, remainder 0.
        hints:
          - Eight does not go into 3 ones, so change them into tenths.
          - After each step, change the remainder into ten of the next place and divide again.
          - Stop when the remainder is zero. That takes three places here.
    - text: |
        **When it never ends.** Try $\frac{1}{3}$. Three goes into 10 tenths three times, remainder 1. Change that 1 into 10 hundredths. Three goes into 10 three times, remainder 1. You are now in exactly the position you were in a moment ago, so the same thing will happen for ever:

        $$\frac{1}{3} = 0.3333\ldots$$

        The decimal does not stop, but it is perfectly well behaved: it **repeats**. And this must happen for any fraction whose division does not finish. When dividing by 3 the remainder can only be 1 or 2. When dividing by 7 it can only be 1 to 6. There are only so many possible remainders, so sooner or later one must come back, and from that point the digits cycle.

        The division does finish when the bottom, in simplest form, divides evenly into 10 or 100 or 1000 and so on. Since $10 = 2 \times 5$, that means the bottom is built only out of 2s and 5s. Halves, quarters, fifths, eighths, twentieths and twenty-fifths all terminate. Thirds, sixths, sevenths and ninths all repeat.

        This matters more than it looks. A decimal with a fixed number of places cannot hold $\frac{1}{3}$ exactly. A computer, which stores a fixed number of places, cannot either. Small errors from this are a fact of life in every numerical program, and you will learn to manage them later.

        **Multiplying and dividing by ten.** Multiplying by 10 turns every tenth into a one, every one into a ten, every ten into a hundred. Each digit moves one place to the left. So $2.5 \times 10 = 25$ and $0.07 \times 100 = 7$. Dividing by 10 moves each digit one place to the right. People say "the point moves", but it is better to think that the point stays where it is, guarding the ones place, and the digits march past it.

        **Multiplying decimals.** Go back to fractions and there is nothing new:

        $$0.3 \times 0.2 = \frac{3}{10} \times \frac{2}{10} = \frac{6}{100} = 0.06.$$

        Tenths times tenths are hundredths. This is where the school rule "count the decimal places in both numbers and add them" comes from. One place and one place make two places.
    - question:
        id: multiply-decimals
        type: numeric
        system: s2
        prompt: |
          A quantity is repeatedly multiplied by 0.1. Starting from 1, what is it after being multiplied by 0.1 three times, that is, $0.1 \times 0.1 \times 0.1$?
        answer: "0.001"
        explanation: |
          $\frac{1}{10} \times \frac{1}{10} \times \frac{1}{10} = \frac{1}{1000}$. Each multiplication by a tenth moves the digit one place to the right.
        hints:
          - Write each 0.1 as a fraction.
          - Tops multiply and bottoms multiply.
          - What happens to a digit's place each time it is multiplied by a tenth?
    - text: |
        **Percentages of things.** "15% of 60,000" uses the word "of" exactly as the last lesson did: it means multiply. $\frac{15}{100} \times 60000$. Since dividing by 100 just moves digits two places, 1% of 60,000 is 600, and 15% is fifteen of those, 9,000. Finding 1% first, or 10% first, is almost always the quickest route.

        **Two different kinds of change.** Suppose a program's error rate falls from 10% to 5%. How much did it improve? There are two honest answers, and they are different numbers.

        - The rate fell by 5 **percentage points**. That is plain subtraction of the two percentages: $10 - 5$.
        - The rate fell by 50 **per cent**. The change, 5, is half of where it started, 10.

        Both are true. They answer different questions. The first is the size of the gap. The second is the gap compared with the starting value. A report that says "errors fell by 50%" and one that says "errors fell by 5 points" can be describing the very same result. Whenever you read a percentage change, ask: per cent *of what*?
  formal:
    - text: |
        A **decimal** is a string of digits with a point, $d_k \ldots d_1 d_0 \,.\, e_1 e_2 \ldots e_m$, whose value is

        $$d_k \times 10^k + \dots + d_0 \times 1 + e_1 \times \frac{1}{10} + e_2 \times \frac{1}{100} + \dots + e_m \times \frac{1}{10^m}.$$

        Zeros added at the far right, after the point, change nothing: $0.5 = 0.50 = 0.500$, because $\frac{5}{10} = \frac{50}{100} = \frac{500}{1000}$.

        **Comparing.** Pad both decimals with trailing zeros until they have the same number of places after the point. Then compare as whole numbers. So 0.5 is larger than 0.45, because 0.50 has 50 hundredths against 45.

        **Fractions and decimals.** Every fraction is a decimal that either terminates or eventually repeats. In simplest form it terminates exactly when its bottom has no factor other than 2s and 5s.

        **Percentage.** $p\% = \frac{p}{100}$. To convert a decimal to a percentage, multiply by 100. To convert back, divide by 100.

        **Change.** If a quantity goes from an old value to a new value, its **percentage change** is $\frac{\text{new} - \text{old}}{\text{old}} \times 100\%$. If the quantity is itself a percentage, the plain difference new minus old is measured in **percentage points**.
  drill:
    - text: Seconds each.
    - question:
        id: tenths
        type: numeric
        system: s1
        prompt: Write $\dfrac{7}{10}$ as a decimal.
        answer: "0.7"
        explanation: Seven in the tenths place.
        hints:
          - Which place is immediately right of the point?
          - Put the top there.
    - question:
        id: add-decimals
        type: numeric
        system: s1
        prompt: "$0.4 + 0.35$"
        answer: "0.75"
        explanation: Pad to $0.40 + 0.35$. Forty hundredths and thirty-five hundredths.
        hints:
          - Line up the places, not the last digits.
          - Pad the shorter one with a zero.
    - question:
        id: largest-decimal
        type: choice
        system: s1
        prompt: Which is the largest?
        options: ["0.45", "0.5", "0.409", "0.05"]
        answer: 1
        explanation: Padded to three places they are 450, 500, 409 and 50 thousandths. More digits does not mean a bigger number once you are right of the point.
        hints:
          - Pad them all to the same number of places.
          - Then compare as whole numbers.
    - question:
        id: times-ten
        type: numeric
        system: s1
        prompt: "$0.25 \\times 100$"
        answer: "25"
        explanation: Each digit moves two places to the left.
        hints:
          - Multiplying by ten moves each digit one place left.
          - A hundred is ten tens.
    - question:
        id: percent-of
        type: numeric
        system: s1
        prompt: 25% of 80
        answer: "20"
        explanation: A quarter of 80.
        hints:
          - What simple fraction is this percentage?
          - Take that fraction of 80.
    - question:
        id: decimal-to-percent
        type: numeric
        system: s1
        prompt: |
          $0.07 = x\%$. What is $x$?
        answer: "7"
        explanation: Seven hundredths is seven per hundred. Not seventy.
        hints:
          - Per cent means out of a hundred.
          - Which place is the 7 in?
  work:
    - text: Slower now.
    - question:
        id: divide-steps
        type: order
        system: s2
        prompt: Put the steps for converting $\dfrac{3}{4}$ to a decimal into order.
        steps:
          - "4 goes into 3 ones zero times, so write 0 and the point. Remainder 3."
          - "Change 3 ones into 30 tenths."
          - "4 goes into 30 seven times. Write 7. Remainder 2."
          - "Change 2 tenths into 20 hundredths."
          - "4 goes into 20 five times. Write 5. Remainder 0, so stop."
        explanation: Each remainder is changed into ten of the next smaller place, and the division continues there.
        hints:
          - Start at the ones place.
          - A remainder must be changed into the next place before it can be divided.
    - question:
        id: accuracy-percent
        type: numeric
        system: s2
        prompt: |
          A program labels 47 of 50 test pictures correctly. Its accuracy is $x\%$. What is $x$?
        answer: "94"
        explanation: |
          $\frac{47}{50} = \frac{94}{100}$, by cutting each fiftieth in two.
        hints:
          - Per cent means out of a hundred.
          - Rename the fraction so that its bottom is a hundred.
    - question:
        id: validation-size
        type: numeric
        system: s2
        prompt: |
          15% of a collection of 60,000 pictures is set aside. How many pictures is that?
        answer: "9000"
        unit: pictures
        explanation: 1% is 600. Fifteen of those. Or 10% is 6,000 and 5% is half of that, 3,000.
        hints:
          - Find 1% or 10% first by moving digits.
          - Build the percentage you need out of those.
    - question:
        id: points-or-percent
        type: choice
        system: s2
        prompt: |
          After a change to a program, its accuracy rises from 80% to 90%. Which statement is correct?
        options:
          - "Accuracy rose by 10 percentage points, which is a 12.5% increase."
          - "Accuracy rose by 10%, and there is no other way to say it."
          - "Accuracy rose by 12.5 percentage points."
          - "Accuracy rose by 10 percentage points, which is a 10% increase."
        answer: 0
        explanation: |
          The gap is $90 - 80 = 10$ points. Compared with the starting value, $\frac{10}{80} = \frac{1}{8} = 0.125$, which is 12.5%.
        hints:
          - The plain difference of two percentages is measured in points.
          - A percentage increase compares the change with the starting value.
          - What fraction of 80 is 10?
    - question:
        id: decimal-to-fraction
        type: choice
        system: s2
        prompt: Which fraction, in simplest form, is equal to 0.125?
        options: ["$\\dfrac{125}{100}$", "$\\dfrac{1}{8}$", "$\\dfrac{1}{125}$", "$\\dfrac{5}{4}$"]
        answer: 1
        explanation: |
          The last digit is in the thousandths place, so $0.125 = \frac{125}{1000}$. Dividing top and bottom by 125 gives $\frac{1}{8}$.
        hints:
          - Which place is the last digit in? That is the bottom.
          - Then simplify. The top divides into the bottom evenly.
    - question:
        id: why-repeats
        type: choice
        system: s2
        prompt: Why must the decimal for $\dfrac{2}{7}$ eventually repeat?
        options:
          - "Because 7 is an odd number."
          - "Because when dividing by 7 only the remainders 1 to 6 are possible, so one must recur, and from then on the same digits follow."
          - "Because every decimal repeats."
          - "Because 2 is smaller than 7."
        answer: 1
        explanation: Each step of the division depends only on the current remainder. The same remainder leads to the same next digit and the same next remainder, so the cycle is locked in. Seven has a factor other than 2 or 5, so the remainder never reaches zero.
        hints:
          - What decides the next digit at each step of the division?
          - How many different values can that thing take?
  connections:
    - text: |
        The puzzle is solved. By agreeing in advance that every bottom will be a ten, a hundred, a thousand and so on, fractions slot into the place-value system and can be compared and calculated digit by digit. The price is that some fractions, like a third, need digits without end.

        Nearly every number you will see reported in machine learning is written this way: an accuracy of 0.94, a loss of 0.031, a rate of 0.001. You can now read each of those as a fraction with a known bottom, which is the only way to have a real feel for its size.

        One of today's questions quietly did something new. It subtracted to find a change: new minus old. When the new value is bigger, that is fine. When an error rate falls, new minus old asks you to take a larger number from a smaller one, and none of the numbers so far can answer. The next lesson, [[m0.negative-numbers]], builds the numbers that can.
