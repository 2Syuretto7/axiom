concept: m0.fractions
minutes: 90
claim: You can say what a fraction is, recognise when two fractions are the same number, and add, subtract, multiply and divide fractions while explaining why each rule works.
recalls: [m0.the-four-operations-and-order-of-operations]
uses: [m0.whole-numbers-and-place-value]
leads: [m0.decimals-and-percentages]
parts:
  recall:
    - text: |
        The last lesson, [[m0.the-four-operations-and-order-of-operations]], defined division as the undoing of multiplication and fixed the order in which a line of arithmetic is read. Both are about to be used hard.
  puzzle:
    - text: |
        Share 3 rotis equally among 4 people.

        With whole numbers this cannot be done. $3 = 0 \times 4 + 3$: the quotient is zero and all three are left over. The arithmetic says nobody gets anything. But anyone who has shared a meal knows that is nonsense. Tear each roti into four equal pieces. There are now twelve pieces, and each person takes three of them. Everyone has the same amount, nothing is left, and nobody went hungry.

        So the sharing has an exact answer. The trouble is that the answer is not a whole number. It is an amount greater than nothing and less than one. Here is the puzzle. **What kind of number is that amount, and how do you add, multiply and divide numbers of that kind?**
  intuition:
    - text: |
        The move that saved the meal was to **change the unit**. Whole rotis could not be shared, so we stopped counting whole rotis and started counting quarter rotis. In quarters, the problem is easy: twelve quarters shared among four people is three quarters each.

        That is all a fraction is. It is a count of pieces, together with a note saying how big each piece is.

        $$\frac{3}{4}$$

        The bottom number, the **denominator**, names the piece: cut one whole into 4 equal parts, and take one. The top number, the **numerator**, counts how many of those pieces you have: 3. The word denominator comes from "to name", and numerator from "to number". One names the unit and the other counts it. Three quarters is three of something, in the same way that three metres is three of something.

        In the figure, the upper bar shows a fraction. Change the parts taken and the parts in a whole. Go past one whole and see that nothing breaks. Then use the third control to cut every part more finely, and watch the lower bar.
    - figure: fraction-bar
      props: { numerator: 3, denominator: 4, finer: 1 }
    - text: |
        The lower bar shows the one fact about fractions that surprises everyone at first: **the same amount has many names.** Cut every quarter in two and three quarters becomes six eighths. Cut every quarter in three and it becomes nine twelfths. The shaded length never moves. Only the way of counting it changes.

        Nothing like this happens with whole numbers, where each number has exactly one name. With fractions, much of the skill lies in choosing the most convenient name for the job at hand. Adding wants one kind of name. Comparing wants another. The shortest name, with the smallest numbers, is best for reading.
  derivation:
    - text: |
        **What a fraction is.** Start from division, as the puzzle did. $\frac{1}{4}$ is defined to be the number which, taken 4 times, makes 1:

        $$4 \times \frac{1}{4} = 1.$$

        It is the answer to $1 \div 4$, a division that has no whole-number answer. Then $\frac{3}{4}$ means three of these: $3 \times \frac{1}{4}$. From this, the fraction line *is* a division sign. Three rotis among four people is $3 \div 4$, and each person gets $\frac{3}{4}$.

        **Equal fractions.** Cut each of the $b$ parts of a whole into $n$ smaller parts. There are now $n \times b$ parts in the whole, and each of your $a$ pieces has become $n$ smaller pieces, so you hold $n \times a$ of them. The amount has not changed. Therefore

        $$\frac{a}{b} = \frac{n \times a}{n \times b}.$$

        Read from left to right this makes the numbers bigger. Read from right to left it makes them smaller: if the top and bottom share a common factor, divide both by it. $\frac{6}{8}$ has a common factor of 2, giving $\frac{3}{4}$, where no further factor is shared. That is the fraction in **simplest form**.
    - question:
        id: equivalent
        type: numeric
        system: s2
        prompt: |
          $\dfrac{3}{4} = \dfrac{x}{20}$. What number is $x$?
        answer: "15"
        explanation: Twenty is five fours, so every quarter was cut into five. Three pieces become $5 \times 3$ pieces.
    - text: |
        **Adding.** You can add 3 metres and 2 metres to get 5 metres. You cannot add 3 metres and 2 feet to get 5 of anything, until you convert them to the same unit. Fractions are no different. Quarters add to quarters:

        $$\frac{1}{4} + \frac{2}{4} = \frac{3}{4}.$$

        One piece and two pieces are three pieces, and the name of the piece does not change. This is why you add the tops and **leave the bottom alone**. Adding the bottoms as well would be like saying 1 metre plus 2 metres is 3 "double-metres".

        When the pieces differ, rename both fractions so that the pieces match. To add $\frac{1}{2}$ and $\frac{1}{3}$, find a piece that both halves and thirds can be cut into. Sixths work, because 6 is a multiple of both 2 and 3:

        $$\frac{1}{2} + \frac{1}{3} = \frac{3}{6} + \frac{2}{6} = \frac{5}{6}.$$

        A number that works as the shared bottom is called a **common denominator**. The product of the two bottoms always works. A smaller common multiple, when you can see one, keeps the numbers small.

        **Comparing** uses the same trick. Which is larger, $\frac{2}{3}$ or $\frac{3}{5}$? In fifteenths they are $\frac{10}{15}$ and $\frac{9}{15}$. Ten pieces beat nine pieces of the same size.
    - text: |
        **Multiplying.** Read the sign $\times$ as "of". What is $\frac{2}{3}$ of $\frac{4}{5}$? Draw a square that is one whole. Cut it into 5 vertical strips and shade 4: that is $\frac{4}{5}$. Now cut it into 3 horizontal strips and keep 2 of them. The square is now a grid of $3 \times 5 = 15$ small cells, and the region that is shaded both ways is 2 rows by 4 columns, $2 \times 4 = 8$ cells. So

        $$\frac{2}{3} \times \frac{4}{5} = \frac{2 \times 4}{3 \times 5} = \frac{8}{15}.$$

        Tops multiply because they count rows and columns of what you keep. Bottoms multiply because they count rows and columns of the whole. It is the rectangle from the last lesson, on a square of side one.

        Notice that multiplying by a fraction less than one makes a number **smaller**. "Multiply" does not mean "make bigger". It means "take this many of", and you can take less than one of something.

        **Dividing.** Go back to what division means: $2 \div \frac{1}{4}$ asks how many quarters make 2. Each whole holds 4 quarters, so 2 wholes hold 8. Dividing by a quarter gave the same result as multiplying by 4.

        In general $\div \frac{c}{d}$ asks "what number, multiplied by $\frac{c}{d}$, gives this?" Try the candidate "multiply by $\frac{d}{c}$" and check it: multiplying by $\frac{d}{c}$ and then by $\frac{c}{d}$ multiplies by $\frac{d \times c}{c \times d}$, which is 1, which changes nothing. So it is the right undoing:

        $$\frac{a}{b} \div \frac{c}{d} = \frac{a}{b} \times \frac{d}{c}.$$

        The flipped fraction $\frac{d}{c}$ is called the **reciprocal** of $\frac{c}{d}$. "Flip and multiply" is not a trick to memorise. It is the only thing that undoes the multiplication.
    - question:
        id: add-unlike
        type: numeric
        system: s2
        prompt: |
          $\dfrac{1}{4} + \dfrac{1}{6}$. Give the result as a fraction.
        answer: "5/12"
        explanation: |
          Twelfths suit both: $\frac{1}{4} = \frac{3}{12}$ and $\frac{1}{6} = \frac{2}{12}$. Three pieces and two pieces make five pieces. Twenty-fourths would also work and would simplify to the same number.
  formal:
    - text: |
        A **fraction** $\frac{a}{b}$, with $a$ and $b$ whole numbers and $b$ not zero, is the number that satisfies $b \times \frac{a}{b} = a$. In words, it is the result of $a \div b$. The bottom cannot be zero for the reason given in the last lesson: division by zero has no meaning.

        Every whole number is a fraction: $5 = \frac{5}{1}$.

        **Equality.** $\frac{a}{b} = \frac{c}{d}$ exactly when $a \times d = b \times c$. This is the common-denominator comparison with the shared bottom $b \times d$ left unwritten.

        **Operations.**

        $$\frac{a}{b} + \frac{c}{d} = \frac{a \times d + c \times b}{b \times d} \qquad \frac{a}{b} - \frac{c}{d} = \frac{a \times d - c \times b}{b \times d}$$

        $$\frac{a}{b} \times \frac{c}{d} = \frac{a \times c}{b \times d} \qquad \frac{a}{b} \div \frac{c}{d} = \frac{a \times d}{b \times c} \quad (c \text{ not zero})$$

        All the laws from the last lesson, commutative, associative and distributive, continue to hold for fractions. That is not luck. The rules above are the only ones under which those laws survive.

        A fraction whose top is at least as large as its bottom is one or more: $\frac{7}{2}$ is seven halves, which is three wholes and one half, written $3\frac{1}{2}$ as a **mixed number**. Both forms name the same number. The first is easier to calculate with and the second is easier to picture.
  drill:
    - text: Seconds each. You may type fractions as `3/4`.
    - question:
        id: rename-down
        type: numeric
        system: s1
        prompt: |
          $\dfrac{12}{16} = \dfrac{x}{4}$. What is $x$?
        answer: "3"
        explanation: Top and bottom share the factor 4.
    - question:
        id: add-like
        type: numeric
        system: s1
        prompt: "$\\dfrac{2}{7} + \\dfrac{3}{7}$"
        answer: "5/7"
        explanation: Two sevenths and three sevenths are five sevenths. The piece does not change.
    - question:
        id: compare
        type: choice
        system: s1
        prompt: Which is the largest?
        options: ["$\\dfrac{2}{3}$", "$\\dfrac{3}{5}$", "$\\dfrac{7}{12}$", "$\\dfrac{1}{2}$"]
        answer: 0
        explanation: In sixtieths they are 40, 36, 35 and 30.
    - question:
        id: whole-times
        type: numeric
        system: s1
        prompt: "$3 \\times \\dfrac{2}{7}$"
        answer: "6/7"
        explanation: Three lots of two sevenths is six sevenths.
    - question:
        id: half-of
        type: numeric
        system: s1
        prompt: "$\\dfrac{1}{2} \\times \\dfrac{1}{3}$"
        answer: "1/6"
        explanation: Half of a third. Tops multiply and bottoms multiply.
    - question:
        id: mixed
        type: numeric
        system: s1
        prompt: How many halves are there in $3\dfrac{1}{2}$?
        answer: "7"
        explanation: Each whole is two halves, so three wholes are six halves, and one more.
  work:
    - text: Slower now. Draw a bar or a square whenever a step does not feel obvious.
    - question:
        id: add-work
        type: numeric
        system: s2
        prompt: "$\\dfrac{2}{3} + \\dfrac{1}{4}$"
        answer: "11/12"
        explanation: |
          In twelfths: $\frac{8}{12} + \frac{3}{12}$.
    - question:
        id: add-steps
        type: order
        system: s2
        prompt: Put the steps for adding two fractions with different bottoms into order.
        steps:
          - Find a number that both bottoms divide into evenly.
          - Rename each fraction with that number as its bottom, multiplying its top by whatever its bottom was multiplied by.
          - Add the tops and keep the shared bottom.
          - Divide top and bottom by any factor they share.
        explanation: Pieces must match before they can be counted together. Simplifying comes last because it changes only the name, not the amount.
    - question:
        id: multiply-work
        type: numeric
        system: s2
        prompt: "$\\dfrac{3}{4} \\times \\dfrac{2}{5}$, in simplest form."
        answer: "3/10"
        explanation: |
          $\frac{3 \times 2}{4 \times 5} = \frac{6}{20}$, and both share the factor 2.
    - question:
        id: divide-work
        type: numeric
        system: s2
        prompt: "$\\dfrac{3}{4} \\div \\dfrac{3}{8}$"
        answer: "2"
        explanation: |
          It asks how many pieces of size $\frac{3}{8}$ fit in $\frac{3}{4}$, which is $\frac{6}{8}$. Two fit. By the rule: $\frac{3}{4} \times \frac{8}{3} = \frac{24}{12}$.
    - question:
        id: split-data
        type: numeric
        system: s2
        prompt: |
          A collection of 60,000 pictures is split in two. Four fifths are used to train a program, and the rest are kept back to test it later. How many pictures are used for training?
        answer: "48000"
        unit: pictures
        explanation: |
          One fifth of 60,000 is $60000 \div 5 = 12000$. Four fifths is four of those. The remaining fifth, 12,000 pictures, is the test set.
    - question:
        id: accuracy-fraction
        type: choice
        system: s2
        prompt: |
          A program is shown 60 test pictures and labels 45 of them correctly. What fraction did it get right, in simplest form?
        options: ["$\\dfrac{45}{60}$", "$\\dfrac{3}{4}$", "$\\dfrac{9}{12}$", "$\\dfrac{4}{3}$"]
        answer: 1
        explanation: |
          $\frac{45}{60}$ is correct but not simplest. Top and bottom share the factor 15. $\frac{9}{12}$ still shares a factor of 3. $\frac{4}{3}$ is upside down and more than one, which a score out of the total can never be.
  connections:
    - text: |
        The puzzle is answered. The amount each person gets when 3 is shared among 4 is a new kind of number, a fraction, and all four operations extend to it without breaking a single law from before. In fact the fraction is what makes division always possible, except by zero. Whole numbers were closed under adding and multiplying but leaked under dividing. Fractions seal the leak.

        Look back at the two uses in the last questions. A split of a data set is a fraction of it. A score is a fraction right out of the total. You will read numbers like these constantly later on, and almost never written as one whole number over another. They will be written like 0.75 or 75%. Those are not new numbers. They are fractions whose bottoms have been chosen to fit the place-value system from the first lesson. The next lesson, [[m0.decimals-and-percentages]], shows how.
