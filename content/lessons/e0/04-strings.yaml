concept: e0.strings
minutes: 80
claim: You can build text from values, pick out any character or slice of a string by position, and use string methods while remembering that a string never changes in place.
recalls: [e0.expressions]
uses: [e0.what-a-program-is, e0.values-types-and-variables, m0.decimals-and-percentages, m0.negative-numbers, m0.whole-numbers-and-place-value]
leads: [e0.booleans-and-conditionals]
starter: |
  # Scratch space. Try indexing and slicing.
  word = "tensor"
  print(word[0], word[-1])
  print(word[1:4])
  print(len(word))
parts:
  recall:
    - text: |
        In [[e0.expressions]] you evaluated expressions by rank, and met the three divisions. Two quick pulls before the same habit of careful evaluation is applied to text.
  puzzle:
    - text: |
        A program has measured its accuracy and you want it to show this, exactly:

        ```
        Accuracy: 94.0%
        ```

        The obvious attempt uses commas inside `print`:

        ```python
        accuracy = 47 / 50 * 100
        print("Accuracy:", accuracy, "%")
        ```

        It shows `Accuracy: 94.0 %`, with a space before the per cent sign, because `print` always puts a space between the things it is given. Close, and wrong.

        The second attempt joins the pieces with `+`:

        ```
        print("Accuracy: " + accuracy + "%")
        ```

        That stops with a `TypeError`, because `+` will not join a string to a float.

        Reporting results is half of what programs do, so this matters. **How do you build one piece of text, exactly as you want it, out of fixed words and computed values?** And once text is built, how do you take it apart again?
  intuition:
    - text: |
        Think of a string as a row of numbered pigeonholes with one character in each.

        ```
         t   e   n   s   o   r
         0   1   2   3   4   5
        ```

        Everything you can do with a string is some way of using those numbers: fetch the character in one hole, copy out a run of holes, count the holes, or build a new row from pieces of old ones.

        Notice where the numbering starts. The first character is at position **0**, not 1. This looks odd for about a week and then becomes natural, and there is a good reason for it. The number is not "which character" but "how far from the start". The first character is zero steps from the start. The second is one step. So in a string of six characters the positions run from 0 to 5, and there is no position 6.

        As for the puzzle, Python has a way to write a string with **holes** in it, to be filled by values:

        ```python
        accuracy = 47 / 50 * 100
        print(f"Accuracy: {accuracy}%")
        ```

        The `f` before the opening quotation mark makes this a **formatted string**, or f-string. Inside it, anything in curly brackets is an expression. Python evaluates it, converts the result to text, and drops it into the hole. Everything outside the curly brackets is kept as written. The result is exactly `Accuracy: 94.0%`.
  derivation:
    - text: |
        **Joining and repeating.** For strings, `+` joins and `*` repeats:

        ```python
        print("ab" + "cd")
        print("ab" * 3)
        ```

        This shows `abcd` and `ababab`. To join a number onto a string with `+` you must convert it first, as in `"Step " + str(7)`. An f-string does the conversion for you, which is why f-strings are usually the better tool.

        **Length.** `len(s)` gives the number of characters in `s`. Spaces count. `len("hello world")` is 11.

        **Indexing.** `s[i]` is the character at position `i`. The position is called an **index**.

        ```python
        word = "tensor"
        print(word[0])
        print(word[5])
        ```

        This shows `t` and `r`. Since positions start at 0, the last character of a string of length $n$ is at index $n - 1$. Asking for `word[6]` stops the program with an `IndexError`.

        Counting from the end is so common that Python allows **negative** indexes. `word[-1]` is the last character, `word[-2]` the one before it, and so on. Think of the number line: $-1$ is one step back from the end.

        **Slicing.** `s[a:b]` is the piece of `s` starting at index `a` and stopping **just before** index `b`.

        ```python
        word = "tensor"
        print(word[1:4])
        ```

        This shows `ens`: the characters at positions 1, 2 and 3. Position 4 is not included.

        Stopping before the end index seems strange until you see what it buys. Picture the indexes as marking the **gaps between** characters, like fence posts:

        ```
        | t | e | n | s | o | r |
        0   1   2   3   4   5   6
        ```

        Then `word[1:4]` is everything between post 1 and post 4. Three consequences follow, and each makes programs simpler.

        - The length of `s[a:b]` is $b - a$. No adding or subtracting one.
        - `s[:k]` is the first `k` characters, and `s[k:]` is everything after them. Leaving a side blank means "from the very start" or "to the very end".
        - `s[:k] + s[k:]` is always the whole of `s`. The two pieces meet exactly, with nothing doubled and nothing dropped.

        A slice is forgiving where an index is not: `word[2:100]` simply stops at the end and gives `nsor`.
    - question:
        id: predict-index-slice
        type: predict
        system: s2
        prompt: Number the characters from 0 on paper, then predict each line.
        code: |
          text = "gradient"
          print(text[0], text[-1])
          print(text[2:5])
          print(text[:4] + text[4:])
          print(len(text[3:]))
        output: |
          g t
          adi
          gradient
          5
        explanation: |
          The string has 8 characters at positions 0 to 7. `text[2:5]` takes positions 2, 3 and 4. The two halves split at post 4 rejoin into the whole. `text[3:]` runs from position 3 to the end, which is $8 - 3 = 5$ characters.
        hints:
          - Write the word out and put a number under each letter, starting at 0.
          - A slice stops just before its second number.
          - The length of a slice is its end minus its start.
    - text: |
        **Strings cannot be changed.** A string, once made, is fixed. You cannot replace its third character. What you can do is build a **new** string and, if you wish, rebind the old name to it. This property is called **immutability**, and forgetting it causes the most common string bug there is.

        Strings come with built-in operations called **methods**, written after a dot:

        ```python
        name = "  Axiom "
        print(name.strip())
        print(name.upper())
        print(name.replace("A", "a"))
        ```

        `strip()` gives a copy without spaces at either end. `upper()` and `lower()` give copies in capital or small letters. `replace(old, new)` gives a copy with every `old` changed to `new`. Every one of them **gives back a new string and leaves the original untouched**. So this does nothing useful:

        ```python
        name = "  Axiom "
        name.strip()
        print(name)
        ```

        The second line builds the stripped copy and then throws it away, because nothing was done with it. `name` still has its spaces. To keep the result, bind a name to it: `name = name.strip()`.

        **Formatting numbers.** Inside the curly brackets of an f-string, a colon introduces instructions for how to show the value. The one you will use most rounds a float to a fixed number of decimal places:

        ```python
        loss = 0.031415
        print(f"loss {loss:.2f}")
        ```

        This shows `loss 0.03`. Read `.2f` as "two places after the point, as a float". It always shows exactly that many places, so `f"{2.5:.2f}"` is `2.50`. The value of `loss` itself is not changed. Only its appearance in the text is.

        **Strings of digits are not numbers, but they are useful.** `str(60000)` is the five characters `60000`, so `len(str(60000))` is 5: the number of digits. Place value, seen as text.

        **Special characters.** Inside a string, `\n` stands for "start a new line", so `print("a\nb")` shows two lines. And to put a double quotation mark inside a string, wrap the string in single ones: `'She said "yes"'`.
    - question:
        id: fix-immutable
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A label was read from a file with stray spaces and in mixed case. This program should end with `label` bound to the tidy text `cat`, and show it. It runs without error but still shows the untidy version. Fix it.
        starter: |
          label = "  Cat "
          label.strip()
          label.lower()
          print(label)
        solution: |
          label = "  Cat "
          label = label.strip()
          label = label.lower()
          print(label)
        tests: |
          assert label == "cat", "label should end up as cat, with no spaces and no capital. Do the methods change label, or give back something new?"
          assert output == "cat\n", "The program should show the tidy label, with no spaces around it"
        wrong:
          - "label = \"  Cat \"\nlabel.strip().lower()\nprint(label)\n"
          - "label = \"  Cat \"\nlabel = label.lower()\nprint(label)\n"
        explanation: String methods give back a new string and leave the original alone. The results have to be bound to a name, here the same name, or they are lost.
        hints:
          - What does a string method do to the string it is called on?
          - Lines 2 and 3 each build a new string. Where does it go?
          - Bind the result of each method to label.
  formal:
    - text: |
        A **string** is an immutable sequence of characters. For a string `s` of length $n$:

        | Expression | Value |
        | --- | --- |
        | `len(s)` | the number of characters, $n$ |
        | `s[i]` | the character at index `i`, for $0 \le i \le n - 1$ |
        | `s[-k]` | the same as `s[n - k]`, for $1 \le k \le n$ |
        | `s[a:b]` | the characters at indexes `a`, `a + 1`, …, `b - 1` |
        | `s[:b]`, `s[a:]` | from the start, or to the end |
        | `s + t` | `s` followed by `t` |
        | `s * k` | `s` repeated `k` times |

        An index outside the string raises an **IndexError**. A slice never does: its ends are quietly moved inside the string.

        For any `k`, `s[:k] + s[k:]` equals `s`, and when $0 \le a \le b \le n$ the slice `s[a:b]` has length $b - a$.

        A **method** is an operation belonging to a value, called as *value*`.`*name*`(`*arguments*`)`. The string methods `strip()`, `upper()`, `lower()` and `replace(old, new)` each return a new string. No operation alters an existing string.

        An **f-string** `f"..."` is evaluated by replacing each `{expression}` with the text of its value. `{expression:.Nf}` shows a number rounded to exactly `N` decimal places.
  drill:
    - text: Seconds each.
    - question:
        id: predict-repeat
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print("ab" * 3)
        output: "ababab"
        explanation: For a string, the star repeats.
        hints:
          - What does the star do for a string?
          - Three copies, end to end.
    - question:
        id: predict-len
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(len("hello world"))
        output: "11"
        explanation: Five letters, a space, and five more. The space counts.
        hints:
          - Count every character.
          - Do not forget the space.
    - question:
        id: predict-index
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print("data"[1])
        output: "a"
        explanation: Index 1 is the second character, because counting starts at 0.
        hints:
          - What index does the first character have?
          - So which character is at index 1?
    - question:
        id: predict-slice
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print("learning"[:5])
        output: "learn"
        explanation: The first five characters, at positions 0 to 4.
        hints:
          - A blank start means from the beginning.
          - How many characters does the slice have?
    - question:
        id: predict-fstring
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          print(f"{2 + 3} items")
        output: "5 items"
        explanation: The expression in curly brackets is evaluated and dropped into the hole.
        hints:
          - What happens to anything in curly brackets?
          - The rest is kept as written.
    - question:
        id: predict-upper
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          name = "axiom"
          name.upper()
          print(name)
        output: "axiom"
        explanation: The method built `AXIOM` and nothing kept it. `name` is unchanged, because strings are immutable.
        hints:
          - Does upper change the string it is called on?
          - Was the result bound to anything?
    - question:
        id: last-index
        type: choice
        system: s1
        prompt: A string has 10 characters. What is the index of its last character?
        options: ["10", "9", "11", "1"]
        answer: 1
        explanation: Indexes start at 0, so they run from 0 to 9.
        hints:
          - What index does the first character have?
          - Count ten positions starting from there.
  work:
    - text: Slower now. Number the characters on paper when you are unsure.
    - question:
        id: write-report
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `right` and `total`. Build a string called `report` using an f-string, with the percentage computed inside it from the two variables, so that showing it gives exactly:

          ```
          Accuracy: 94.0%
          ```

          Then show `report`.
        starter: |
          right = 47
          total = 50
        solution: |
          right = 47
          total = 50
          report = f"Accuracy: {right / total * 100}%"
          print(report)
        tests: |
          assert "report" in dir(), "Create a variable called report"
          assert type(report) == str, "report should be a string"
          assert report == "Accuracy: 94.0%", "report is not exactly right. Check the space after the colon, and that nothing separates the number from the per cent sign."
          assert output == "Accuracy: 94.0%\n", "Show report, and nothing else"
        wrong:
          - "right = 47\ntotal = 50\nreport = f\"Accuracy: {right / total * 100} %\"\nprint(report)\n"
          - "right = 47\ntotal = 50\nreport = \"Accuracy: {right / total * 100}%\"\nprint(report)\n"
          - "right = 47\ntotal = 50\nreport = f\"Accuracy: {right / total}%\"\nprint(report)\n"
        explanation: The `f` turns curly brackets into holes. The expression inside is the percentage from the last lesson, and the per cent sign sits immediately after the closing bracket.
        hints:
          - Which kind of string has holes for values?
          - Put the whole calculation inside one pair of curly brackets.
          - Without the letter f in front, curly brackets are just characters.
    - question:
        id: write-initials
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `first` and `last` to two names in small letters. Create `initials`, a string made of the first character of each, in capitals. Your lines must work for any two names.
        starter: |
          first = "ada"
          last = "lovelace"
        solution: |
          first = "ada"
          last = "lovelace"
          initials = (first[0] + last[0]).upper()
        tests: |
          assert "initials" in dir(), "Create a variable called initials"
          assert len(initials) == 2, "initials should be exactly two characters"
          assert initials == first[0].upper() + last[0].upper(), "initials should be the first character of each name, in capitals"
          assert rerun(first="grace", last="hopper")["initials"] == "GH", "Your lines should work for any two names. Build initials from first and last."
        wrong:
          - "first = \"ada\"\nlast = \"lovelace\"\ninitials = first[1] + last[1]\n"
          - "first = \"ada\"\nlast = \"lovelace\"\ninitials = first[0] + last[0]\n"
        explanation: Index 0 is the first character. The two characters are joined, and `upper()` gives back the capital version, which must be the value bound to `initials`.
        hints:
          - Which index holds the first character of a string?
          - Join the two characters with the plus sign.
          - A method gives back a new string. Make sure that is what the name ends up bound to.
    - question:
        id: write-digit-count
        type: code
        mode: write
        system: s1
        prompt: |
          The starter binds `n` to a whole number. Create `digits`, the number of digits `n` has, by converting `n` to text and measuring it.
        starter: |
          n = 60000
        solution: |
          n = 60000
          digits = len(str(n))
        tests: |
          assert "digits" in dir(), "Create a variable called digits"
          assert type(digits) == int, "digits should be a whole number"
          assert digits == len(str(n)), "digits should be the number of characters in n written as text"
          assert rerun(n=7)["digits"] == 1, "Compute digits from n, so that it works for any whole number"
        wrong:
          - "n = 60000\ndigits = str(n)\n"
          - "n = 60000\ndigits = len(str(n)) - 1\n"
        explanation: "`str(n)` is the five characters `60000`, and `len` counts them."
        hints:
          - First turn the number into a string.
          - Then ask how long the string is.
    - question:
        id: write-format
        type: code
        mode: write
        system: s2
        prompt: |
          The starter binds `loss`. Create a string `line` that reads `loss 0.03`, using an f-string that shows `loss` rounded to exactly 2 decimal places. Then show `line`.
        starter: |
          loss = 0.031415
        solution: |
          loss = 0.031415
          line = f"loss {loss:.2f}"
          print(line)
        tests: |
          assert "line" in dir(), "Create a variable called line"
          assert line == "loss 0.03", "line should be the word loss, a space, then the value to exactly two decimal places"
          assert loss == 0.031415, "Do not change the value of loss itself"
          assert output == "loss 0.03\n", "Show line"
        wrong:
          - "loss = 0.031415\nline = f\"loss {loss}\"\nprint(line)\n"
          - "loss = 0.031415\nline = f\"loss {loss:.3f}\"\nprint(line)\n"
        explanation: Inside the curly brackets, `:.2f` asks for exactly two places after the point. Only the text is rounded. The variable keeps its full value.
        hints:
          - Formatting instructions go inside the curly brackets, after the expression.
          - They begin with a colon.
          - Two places, as a float.
    - question:
        id: fix-slice
        type: code
        mode: find-bug
        system: s2
        prompt: |
          Every file name starts with a three-letter code. This should bind `code` to those first three characters, but it gets only two. Fix the slice.
        starter: |
          name = "img_0042.png"
          code = name[0:2]
          print(code)
        solution: |
          name = "img_0042.png"
          code = name[0:3]
          print(code)
        tests: |
          assert name == "img_0042.png", "Keep name as it is"
          assert len(code) == 3, "code should have three characters. How long is a slice from a to b?"
          assert code == name[:3], "code should be the first three characters of name"
        wrong:
          - "name = \"img_0042.png\"\ncode = name[1:3]\nprint(code)\n"
          - "name = \"img_0042.png\"\ncode = name[0:4]\nprint(code)\n"
        explanation: A slice stops just before its second number, and its length is the end minus the start. Three characters from the start need `[0:3]`.
        hints:
          - Which positions does the slice in the starter take?
          - The second number is not included.
          - The length of a slice is its end minus its start.
    - question:
        id: why-half-open
        type: choice
        system: s2
        prompt: "Which is a real advantage of a slice `s[a:b]` stopping just before index `b`?"
        options:
          - "It makes slices run faster."
          - "`s[:k]` and `s[k:]` split a string into two pieces that join back into the whole with nothing repeated or missing, and the length of `s[a:b]` is simply $b - a$."
          - "It means the first character has index 1."
          - "It prevents the string from being changed."
        answer: 1
        explanation: With the indexes read as fence posts between characters, pieces that share a post meet exactly. The same convention is used for every sequence in Python and for the ranges you will meet with loops.
        hints:
          - Think of the indexes as marking gaps between characters.
          - What happens where two slices share a number?
  connections:
    - text: |
        The puzzle is solved with an f-string: fixed words, holes for values, and control over how each number is shown. You can also take text apart by position, and you have met the first data in Python with internal structure.

        Almost everything in this lesson will be reused unchanged. Zero-based indexes, negative indexes and half-open slices apply to every sequence in Python. In a few lessons you will index lists the same way, and later the large tables of numbers that machine learning runs on. Learning it properly once, on something as plain as a word, pays off many times.

        Immutability also returns. Some kinds of data can be changed in place and some cannot, and knowing which is which prevents a whole family of bugs.

        Until now every program has done the same thing on every run, top to bottom. Real programs make decisions: do this if the label matches, that otherwise. To decide, a program must first be able to ask a question with a yes-or-no answer. That is next, in [[e0.booleans-and-conditionals]].
