concept: m10.integration-techniques
minutes: 100
claim: You can integrate by substitution, the chain rule in reverse, and by parts, the product rule in reverse, change the limits of a definite integral correctly, evaluate integrals over an infinite range as limits, recognise when no formula exists and fall back on numerical integration, and check any antiderivative by differentiating it or by comparing with a sum of slices.
recalls: [m10.fundamental-theorem-of-calculus]
uses: [m10.integral-as-accumulation, m10.chain-rule, m10.differentiation-rules, m10.derivatives-of-exp-log-and-trig, m10.derivative-as-slope-and-rate, m10.limits-and-continuity, m10.taylor-approximation, m2.composition-and-inverses, m2.sequences-and-series, m2.the-exponential-and-e, m1.logarithms, e0.functions, e0.loops, e1.comprehensions-and-iterators, e1.modules-and-imports]
leads: [m4.vectors-as-arrows-and-as-lists, m11.the-riemann-integral, m12.multiple-integrals-and-change-of-variables, m12.functions-of-several-variables]
starter: |
  # Scratch space. Is F an antiderivative of f? Differentiate F numerically
  # and compare with f at a few points.
  import math

  def f(x):
      return 2 * x * math.cos(x * x)

  def F(x):
      return math.sin(x * x)

  h = 1e-5
  for x in [0, 0.5, 1, 2]:
      print(x, f(x), (F(x + h) - F(x - h)) / (2 * h))
parts:
  recall:
    - text: |
        [[m10.fundamental-theorem-of-calculus]] turned integration into a search. To integrate $f$ from $a$ to $b$, find an $F$ whose derivative is $f$, and subtract: $F(b) - F(a)$. For powers, exponentials, sines and cosines the search is a matter of reading the table of derivatives backwards. Three quick pulls first.
    - question:
        id: recall-ftc
        type: numeric
        system: s1
        concepts: [m10.fundamental-theorem-of-calculus]
        prompt: |
          What is $\displaystyle\int_0^3 x^2\,dx$?
        answer: "9"
        explanation: |
          An antiderivative is $\frac{x^3}{3}$, which is 9 at 3 and 0 at 0.
        hints:
          - Raise the exponent by one and divide by the new exponent.
          - Evaluate at 3.
    - question:
        id: recall-chain
        type: choice
        system: s1
        concepts: [m10.chain-rule]
        prompt: |
          What is the derivative of $\sin(x^2)$?
        options: ["$\\cos(x^2)$", "$2x\\cos(x^2)$", "$\\cos(2x)$", "$2x\\sin(x^2)$"]
        answer: 1
        explanation: The chain rule multiplies the outer derivative, the cosine of the inside, by the derivative of the inside, 2x.
        hints:
          - Outer derivative at the inside, times the derivative of the inside.
          - The inside is x squared.
    - question:
        id: recall-product
        type: choice
        system: s1
        concepts: [m10.differentiation-rules]
        prompt: |
          What is the derivative of $x\,e^x$?
        options: ["$e^x$", "$x\\,e^x$", "$e^x + x\\,e^x$", "$x\\,e^{x-1}$"]
        answer: 2
        explanation: The product rule differentiates each factor in turn, keeping the other, and adds.
        hints:
          - Use the product rule.
          - The derivative of x is 1, and the exponential is its own derivative.
  puzzle:
    - text: |
        Here are two integrals. Neither integrand appears in the table of antiderivatives.

        $$\int_0^1 2x\cos(x^2)\,dx \qquad\qquad \int_0^1 x\,e^x\,dx$$

        It is tempting to integrate each factor separately and multiply the results. For the second that would give $\frac{x^2}{2} \cdot e^x$. Differentiate it to check: the product rule gives $x\,e^x + \frac{x^2}{2}e^x$, which is not $x\,e^x$. **The integral of a product is not the product of the integrals**, just as the derivative of a product was not the product of the derivatives.

        Differentiation never needed luck. Whatever function you wrote down, the sum, product and chain rules took it apart piece by piece. Integration has, so far, no such machinery. You can only integrate what you recognise as a derivative.

        But look at the two answers you gave a moment ago in the recall. The derivative of $\sin(x^2)$ was $2x\cos(x^2)$: the first integrand exactly. The derivative of $x\,e^x$ was $e^x + x\,e^x$: the second integrand, plus an extra piece.

        **Each of these integrands is the footprint of a differentiation rule. Can the rules be run backwards, to give methods of integration?**
  intuition:
    - text: |
        The first integrand is what the **chain rule** leaves behind. The chain rule always produces a product of a particular shape: an outer derivative with something inside it, multiplied by the derivative of that inside. In $2x\cos(x^2)$ the inside is $x^2$, and its derivative, $2x$, is standing beside it. When you see an inside function with its own derivative alongside as a factor, a chain rule has been at work, and the antiderivative is the outer antiderivative with the same inside: $\sin(x^2)$. The starter confirms it numerically.

        There is a tidy way to do this without guessing. Give the inside a name, $u = x^2$. A small change $dx$ in $x$ changes $u$ by $du = 2x\,dx$, which is what the derivative means. Then the awkward integrand collapses:

        $$\int \cos(\underbrace{x^2}_{u})\,\underbrace{2x\,dx}_{du} = \int \cos u\,du = \sin u + C = \sin(x^2) + C.$$

        In terms of $u$ the integral is in the table. This is **substitution**. In a picture, it is a change of the scale along the horizontal axis. Where $u$ moves fast as $x$ moves, the slices in $u$ are wider than the slices in $x$, by the factor $\frac{du}{dx}$, and that factor is exactly what the integrand must contain to compensate.

        The second integrand is what the **product rule** leaves behind, in part. Differentiating $x\,e^x$ gave two terms, $e^x + x\,e^x$. We want an antiderivative of the second term alone. So start from $x\,e^x$, whose derivative has one term too many, and remove the surplus: subtract something whose derivative is $e^x$. That something is $e^x$.

        $$\bigl(x\,e^x - e^x\bigr)' = e^x + x\,e^x - e^x = x\,e^x.$$

        This is **integration by parts**. It does not finish the integral in one stroke. It trades the integral you have for a different one, and the art lies in making the trade so that the new one is easier.
  derivation:
    - text: |
        **Substitution.** Suppose $F' = f$. The chain rule says $\bigl(F(g(x))\bigr)' = f(g(x))\,g'(x)$. Read from right to left, that is a statement about antiderivatives:

        $$\int f(g(x))\,g'(x)\,dx = F(g(x)) + C.$$

        In practice: choose $u = g(x)$, write $du = g'(x)\,dx$, replace everything, integrate in $u$, and put $g(x)$ back.

        *Example: a linear inside.* $\int (3x + 1)^4\,dx$. Let $u = 3x + 1$, so $du = 3\,dx$ and $dx = \frac{1}{3}du$.

        $$\int (3x+1)^4\,dx = \int u^4 \cdot \tfrac{1}{3}\,du = \frac{u^5}{15} + C = \frac{(3x+1)^5}{15} + C.$$

        When the inside is $kx + c$, integrating divides by $k$ where differentiating would multiply by it. The same reasoning gives $\int e^{kx}\,dx = \frac{e^{kx}}{k}$ and $\int \cos(kx)\,dx = \frac{\sin(kx)}{k}$.

        *Example: a missing constant.* $\int x\,e^{-x^2/2}\,dx$. Let $u = -\frac{x^2}{2}$, so $du = -x\,dx$. The integrand contains $x\,dx$, which is $-du$.

        $$\int x\,e^{-x^2/2}\,dx = -\int e^u\,du = -e^u + C = -e^{-x^2/2} + C.$$

        A constant factor can always be supplied in this way. A missing factor of $x$ cannot: $\int e^{-x^2/2}\,dx$, with no $x$ in front, is not reached by this substitution. That matters, and the lesson returns to it.

        *Example: a derivative over its function.* $\int \dfrac{2x}{x^2 + 1}\,dx$. Let $u = x^2 + 1$, so $du = 2x\,dx$.

        $$\int \frac{2x}{x^2+1}\,dx = \int \frac{1}{u}\,du = \ln u + C = \ln(x^2 + 1) + C.$$

        Whenever the top is the derivative of the bottom, the integral is the logarithm of the bottom, as long as the bottom is positive.

        **Definite integrals: change the limits.** When there are limits, they are values of $x$. After substituting, the variable is $u$, and the limits must become the corresponding values of $u$:

        $$\int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du.$$

        For the first integral of the puzzle, $u = x^2$ runs from $0^2 = 0$ to $1^2 = 1$:

        $$\int_0^1 2x\cos(x^2)\,dx = \int_0^1 \cos u\,du = \bigl[\sin u\bigr]_0^1 = \sin 1 \approx 0.841.$$

        Here the limits happened not to change. Usually they do: with $u = x^2 + 1$ and $x$ from 0 to 3, $u$ runs from 1 to 10, and $\int_0^3 \frac{2x}{x^2 + 1}\,dx = \bigl[\ln u\bigr]_1^{10} = \ln 10$. With the new limits in place there is no need to return to $x$ at all.

        **A promise kept.** In the last lesson you used, without deriving it, the fact that softplus is an antiderivative of the sigmoid. Now it can be found. Multiply the top and bottom of the sigmoid by $e^x$:

        $$\sigma(x) = \frac{1}{1 + e^{-x}} = \frac{e^x}{1 + e^x}.$$

        The top is the derivative of the bottom. So $\int \sigma(x)\,dx = \ln(1 + e^x) + C$: softplus.
    - question:
        id: derivation-limits
        type: choice
        system: s2
        prompt: |
          To evaluate $\displaystyle\int_0^2 2x\,(x^2 + 1)^3\,dx$ you substitute $u = x^2 + 1$. Which integral in $u$ is equal to it?
        options:
          - "$\\displaystyle\\int_0^2 u^3\\,du$"
          - "$\\displaystyle\\int_1^5 u^3\\,du$"
          - "$\\displaystyle\\int_1^5 2x\\,u^3\\,du$"
          - "$\\displaystyle\\int_0^4 u^3\\,du$"
        answer: 1
        explanation: |
          $du = 2x\,dx$, so the factor $2x\,dx$ becomes $du$ and disappears from the integrand, leaving $u^3$. The limits 0 and 2 are values of $x$. The corresponding values of $u = x^2 + 1$ are $0 + 1 = 1$ and $4 + 1 = 5$. So the integral is $\left[\frac{u^4}{4}\right]_1^5 = \frac{625 - 1}{4} = 156$. Keeping the old limits with the new variable is the commonest error in substitution: it integrates over the wrong stretch of $u$.
        hints:
          - What does 2x dx become?
          - The limits 0 and 2 are values of x. What is u at each?
          - No x should remain once the substitution is complete.
    - text: |
        **Integration by parts.** The product rule says $(uv)' = u'v + uv'$. Integrate both sides. The integral of a derivative is the function itself, so $uv = \int u'v\,dx + \int uv'\,dx$, and rearranging,

        $$\int u\,v'\,dx = u\,v - \int u'\,v\,dx.$$

        To use it, split the integrand into a factor $u$ that you will **differentiate** and a factor $v'$ that you will **integrate**. The formula exchanges $\int u v'$ for $\int u' v$. It helps when $u'$ is simpler than $u$ and $v$ is no worse than $v'$.

        *The puzzle's second integral.* $\int x\,e^x\,dx$. Take $u = x$, which differentiates to 1, and $v' = e^x$, which integrates to $v = e^x$.

        $$\int x\,e^x\,dx = x\,e^x - \int 1 \cdot e^x\,dx = x\,e^x - e^x + C.$$

        With limits, every term takes them: $\int_0^1 x\,e^x\,dx = \bigl[x\,e^x - e^x\bigr]_0^1 = (e - e) - (0 - 1) = 1$.

        Had the split been made the other way, $u = e^x$ and $v' = x$, the new integral would be $\int e^x \cdot \frac{x^2}{2}\,dx$, worse than the one we began with. A good choice of $u$ is something that **simplifies when differentiated**: a power of $x$, or a logarithm.

        *The logarithm.* $\int \ln x\,dx$ does not look like a product. Make it one: $\ln x \cdot 1$. Take $u = \ln x$, with $u' = \frac{1}{x}$, and $v' = 1$, with $v = x$.

        $$\int \ln x\,dx = x\ln x - \int \frac{1}{x} \cdot x\,dx = x\ln x - x + C.$$

        Check by differentiating: $(x\ln x - x)' = \ln x + 1 - 1 = \ln x$.

        *Twice over.* $\int x^2 e^x\,dx$ with $u = x^2$ gives $x^2 e^x - \int 2x\,e^x\,dx$, and the new integral is twice the one already done. Each application lowers the power of $x$ by one.

        **Integrals over an infinite range.** How much area lies under $e^{-x}$ from 0 onwards, for ever? The region is infinitely long, but it thins out fast. Define the integral to infinity as a limit: integrate up to $b$, then let $b$ grow.

        $$\int_0^{\infty} e^{-x}\,dx = \lim_{b \to \infty} \bigl[-e^{-x}\bigr]_0^b = \lim_{b \to \infty} \bigl(1 - e^{-b}\bigr) = 1.$$

        An infinitely long region with a finite area, exactly 1. Such integrals are called **improper**. Whether the limit exists depends on how fast the integrand dies away:

        | Integral | Up to $b$ | As $b \to \infty$ |
        | --- | --- | --- |
        | $\int_1^{\infty} \frac{1}{x^2}\,dx$ | $1 - \frac{1}{b}$ | tends to $1$ |
        | $\int_0^{\infty} e^{-kx}\,dx$, $k > 0$ | $\frac{1}{k}\bigl(1 - e^{-kb}\bigr)$ | tends to $\frac{1}{k}$ |
        | $\int_1^{\infty} \frac{1}{x}\,dx$ | $\ln b$ | grows without limit |

        The last one **diverges**: $\ln b$ grows slowly, but it passes every bound. This is the continuous twin of the harmonic series $1 + \frac{1}{2} + \frac{1}{3} + \dots$, which you saw grow without limit while its terms shrank to zero.

        These are not curiosities. A quantity that can take any positive value, such as the waiting time until an event, is described by a curve whose total area must be 1, and $k\,e^{-kx}$ is the simplest such curve. Its average is found by parts, with $u = x$ and $v' = k\,e^{-kx}$, so that $v = -e^{-kx}$:

        $$\int_0^{\infty} x\,k\,e^{-kx}\,dx = \bigl[-x\,e^{-kx}\bigr]_0^{\infty} + \int_0^{\infty} e^{-kx}\,dx = 0 + \frac{1}{k}.$$

        The bracket vanishes at both ends: at 0 because of the factor $x$, and at infinity because an exponential outgrows any power, so $x\,e^{-kx} \to 0$.

        **When there is no formula.** Differentiating any formula built from powers, exponentials, logarithms and trigonometric functions gives another such formula. Integration is not like that. The function $e^{-x^2}$, the bell curve at the centre of statistics, is continuous, so by the fundamental theorem it has an antiderivative. But that antiderivative **cannot be written** as any finite combination of the familiar functions. This is a theorem, not a failure of ingenuity. The same is true of $\frac{\sin x}{x}$ and of $\sqrt{1 + x^3}$.

        For such functions the integral is still a perfectly good number, and the methods of two lessons ago compute it: sum the slices.
    - figure: riemann
      props: { fn: sin, doublings: 3, rule: 1 }
    - text: |
        The figure does this for the sine, where the exact answer, 2, is known, and with the midpoint rule a few dozen slices already agree with it to several figures. For $e^{-x^2}$ there is no exact formula to compare with, and the sum of slices is the answer. The antiderivative of the bell curve is important enough to have been given a name and a place in the library, `math.erf`, and what stands behind that name is a numerical method.

        **Always check.** Integration by formula has more ways to go wrong than differentiation: a lost factor from the inside function, a wrong sign in parts, limits left unchanged. There are two checks, and both are cheap.

        - **Differentiate your answer.** If $F' \ne f$, then $F$ is wrong. Differentiation is mechanical, so this check is reliable.
        - **Compare with a sum of slices.** $F(b) - F(a)$ must agree with a midpoint sum of $f$.

        ```python
        def integral_check(f, F, a, b):
            width = (b - a) / 1000
            slices = sum([f(a + (i + 0.5) * width) * width for i in range(1000)])
            return abs(slices - (F(b) - F(a))) < 1e-4
        ```

        This is the integral's counterpart of the gradient check, and it is used in the same spirit: the slow method that cannot be wrong is the judge of the fast one that can.
    - question:
        id: order-sigmoid
        type: order
        system: s2
        prompt: Put the steps in order to find $\displaystyle\int \frac{1}{1 + e^{-x}}\,dx$.
        steps:
          - "Multiply top and bottom by $e^x$ to get $\\dfrac{e^x}{1 + e^x}$."
          - "Notice that the top is the derivative of the bottom, and set $u = 1 + e^x$."
          - "Then $du = e^x\\,dx$, and the integral becomes $\\displaystyle\\int \\frac{1}{u}\\,du$."
          - "Integrate: $\\ln u + C$."
          - "Return to $x$: $\\ln(1 + e^x) + C$."
          - "Check by differentiating: $\\dfrac{e^x}{1 + e^x}$, the integrand."
        explanation: The integrand is first rewritten so that a function and its derivative are both visible. That suggests the substitution, which turns the integral into one from the table. After integrating in u the answer is returned to x, and it is checked last by differentiating. The result is softplus.
        hints:
          - The substitution cannot be seen until the fraction has been rewritten.
          - The differential du is found after u is chosen.
          - The check comes at the end.
  formal:
    - text: |
        **Substitution.** If $F' = f$ and $g$ is differentiable with continuous derivative, then

        $$\int f(g(x))\,g'(x)\,dx = F(g(x)) + C, \qquad \int_a^b f(g(x))\,g'(x)\,dx = \int_{g(a)}^{g(b)} f(u)\,du.$$

        **By parts.** $\displaystyle\int u\,v'\,dx = u\,v - \int u'\,v\,dx$, and with limits $\displaystyle\int_a^b u\,v'\,dx = \bigl[u\,v\bigr]_a^b - \int_a^b u'\,v\,dx$.

        **Improper integral.** $\displaystyle\int_a^{\infty} f(x)\,dx = \lim_{b \to \infty} \int_a^b f(x)\,dx$, when the limit exists. Otherwise the integral diverges.

        | Integrand | Antiderivative | Method |
        | --- | --- | --- |
        | $f(kx + c)$ | $\frac{1}{k}F(kx + c)$ | substitution, linear inside |
        | $\dfrac{g'(x)}{g(x)}$, $g > 0$ | $\ln g(x)$ | substitution, $u = g(x)$ |
        | $g'(x)\,e^{g(x)}$ | $e^{g(x)}$ | substitution, $u = g(x)$ |
        | $x\,e^x$ | $x\,e^x - e^x$ | parts, $u = x$ |
        | $\ln x$ | $x\ln x - x$ | parts, $u = \ln x$, $v' = 1$ |
        | $x\cos x$ | $x\sin x + \cos x$ | parts, $u = x$ |
        | $\dfrac{1}{1 + e^{-x}}$ | $\ln(1 + e^x)$ | substitution, $u = 1 + e^x$ |

        **Standard improper integrals.** $\int_0^{\infty} e^{-kx}\,dx = \frac{1}{k}$ for $k > 0$. $\ \int_1^{\infty} x^{-2}\,dx = 1$. $\ \int_1^{\infty} x^{-1}\,dx$ diverges.
  drill:
    - text: Seconds each. Look for an inside function with its derivative beside it, or a product in which one factor simplifies when differentiated.
    - question:
        id: drill-linear-inside
        type: choice
        system: s1
        prompt: |
          Which is an antiderivative of $\cos(3x)$?
        options: ["$\\sin(3x)$", "$3\\sin(3x)$", "$\\dfrac{\\sin(3x)}{3}$", "$-\\dfrac{\\sin(3x)}{3}$"]
        answer: 2
        explanation: Differentiating sin(3x) brings out a factor 3 by the chain rule, so a division by 3 is needed to cancel it.
        hints:
          - Differentiate sin(3x) and see what factor appears.
          - Divide by that factor.
    - question:
        id: drill-exp-linear
        type: choice
        system: s1
        prompt: |
          What is $\displaystyle\int_0^1 e^{2x}\,dx$?
        options: ["$e^2 - 1$", "$\\dfrac{e^2 - 1}{2}$", "$2(e^2 - 1)$", "$\\dfrac{e^2}{2}$"]
        answer: 1
        explanation: An antiderivative is e to the 2x divided by 2. At 1 that is e squared over 2, and at 0 it is a half.
        hints:
          - The inside is 2x, so divide by 2.
          - The value at the lower limit is not zero.
    - question:
        id: drill-choose-u
        type: choice
        system: s1
        prompt: |
          Which substitution fits $\displaystyle\int 3x^2\,e^{x^3}\,dx$?
        options: ["$u = 3x^2$", "$u = x^3$", "$u = e^x$", "$u = x$"]
        answer: 1
        explanation: The inside function is x cubed, and its derivative, 3x squared, is standing beside it as a factor.
        hints:
          - Which function sits inside another?
          - Its derivative should be the remaining factor.
    - question:
        id: drill-new-limit
        type: numeric
        system: s1
        prompt: |
          In $\displaystyle\int_0^1 (3x + 1)^4\,dx$ you substitute $u = 3x + 1$. What is the new upper limit?
        answer: "4"
        explanation: The upper limit x = 1 corresponds to u = 3 + 1.
        hints:
          - The old upper limit is a value of x.
          - Put x = 1 into the formula for u.
    - question:
        id: drill-sub-definite
        type: numeric
        system: s1
        prompt: |
          What is $\displaystyle\int_0^1 2x\,(x^2 + 1)\,dx$? Use $u = x^2 + 1$, which runs from 1 to 2.
        answer: "1.5"
        explanation: |
          $\int_1^2 u\,du = \left[\frac{u^2}{2}\right]_1^2 = 2 - \frac{1}{2}$.
        hints:
          - The integral becomes the integral of u from 1 to 2.
          - An antiderivative of u is u squared over 2.
    - question:
        id: drill-log-form
        type: choice
        system: s1
        prompt: |
          What is $\displaystyle\int_0^3 \frac{2x}{x^2 + 1}\,dx$?
        options: ["$\\ln 9$", "$\\ln 10$", "$\\dfrac{1}{10}$", "$\\ln 3$"]
        answer: 1
        explanation: The top is the derivative of the bottom, so an antiderivative is the logarithm of the bottom. The bottom is 10 at 3 and 1 at 0, and the logarithm of 1 is 0.
        hints:
          - The top is the derivative of the bottom.
          - Evaluate the bottom at 3 and at 0.
    - question:
        id: drill-parts-choice
        type: choice
        system: s1
        prompt: |
          For $\displaystyle\int x\cos x\,dx$ by parts, which choice makes the new integral simpler?
        options:
          - "$u = x$ and $v' = \\cos x$"
          - "$u = \\cos x$ and $v' = x$"
          - "$u = x\\cos x$ and $v' = 1$"
          - "It makes no difference."
        answer: 0
        explanation: With u = x the derivative is 1, and the new integral is just the integral of sin x. The other way round raises the power of x.
        hints:
          - Choose u to be the factor that becomes simpler when differentiated.
          - What is the derivative of x?
    - question:
        id: drill-parts-value
        type: numeric
        system: s1
        prompt: |
          An antiderivative of $x\,e^x$ is $x\,e^x - e^x$. What is $\displaystyle\int_0^1 x\,e^x\,dx$?
        answer: "1"
        explanation: |
          At 1 the antiderivative is $e - e = 0$. At 0 it is $0 - 1 = -1$. The difference is $0 - (-1)$.
        hints:
          - Evaluate the antiderivative at 1 and at 0.
          - At 0 it is minus 1, and subtracting that adds.
    - question:
        id: drill-ln
        type: numeric
        system: s1
        prompt: |
          An antiderivative of $\ln x$ is $x\ln x - x$. What is $\displaystyle\int_1^{e} \ln x\,dx$?
        answer: "1"
        explanation: |
          At $e$: $e \cdot 1 - e = 0$. At 1: $0 - 1 = -1$. The difference is 1.
        hints:
          - The logarithm of e is 1 and of 1 is 0.
          - The value at the lower limit is minus 1.
    - question:
        id: drill-improper-exp
        type: numeric
        system: s1
        prompt: |
          What is $\displaystyle\int_0^{\infty} e^{-2x}\,dx$?
        answer: "0.5"
        explanation: |
          An antiderivative is $-\frac{1}{2}e^{-2x}$, which tends to 0 as $x$ grows and is $-\frac{1}{2}$ at 0.
        hints:
          - Integrate up to b and let b grow.
          - The inside is minus 2x, so divide by minus 2.
    - question:
        id: drill-improper-power
        type: numeric
        system: s1
        prompt: |
          What is $\displaystyle\int_1^{\infty} \frac{1}{x^2}\,dx$?
        answer: "1"
        explanation: |
          An antiderivative is $-\frac{1}{x}$, which tends to 0 as $x$ grows and is $-1$ at 1.
        hints:
          - An antiderivative of x to the minus 2 is minus x to the minus 1.
          - What happens to 1 over b as b grows?
    - question:
        id: drill-diverge
        type: choice
        system: s1
        prompt: |
          What happens to $\displaystyle\int_1^{b} \frac{1}{x}\,dx$ as $b \to \infty$?
        options: ["It tends to 1", "It tends to 0", "It grows without limit", "It tends to $e$"]
        answer: 2
        explanation: The integral up to b is the logarithm of b, which grows slowly and passes every bound.
        hints:
          - The antiderivative is the natural logarithm.
          - Is there a largest value of the logarithm?
    - question:
        id: predict-new-limits
        type: predict
        system: s1
        prompt: An integral in x from a to b is being changed to one in u, where u = g(x). What does this show?
        code: |
          def g(x):
              return x * x + 1

          a, b = 0, 3
          print(g(a), g(b))
        output: "1 10"
