    - question:
        id: work-bell
        type: numeric
        system: s2
        prompt: |
          Evaluate $\displaystyle\int_0^{\infty} x\,e^{-x^2/2}\,dx$.
        answer: "1"
        explanation: |
          An antiderivative, found by the substitution $u = -\frac{x^2}{2}$, is $-e^{-x^2/2}$. As $x \to \infty$ it tends to 0, and at $x = 0$ it is $-1$. So the integral is $0 - (-1) = 1$. The factor $x$ in front is what made this possible: it is, up to sign, the derivative of the exponent. Without it the integrand is the bell curve itself, which has no antiderivative that can be written down.
