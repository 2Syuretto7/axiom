        solution: |
          import math

          def f(x):
              return math.cos(2 * x)

          def F(x):
              return math.sin(2 * x) / 2

          print(round(F(1) - F(0), 4))
        tests: |
          import math as _m
          def _slices(a, b):
              w = (b - a) / 2000
              return sum([_m.cos(2 * (a + (i + 0.5) * w)) * w for i in range(2000)])
          for _a, _b in [(0, 1), (0, 0.5), (-1, 2), (1, 3)]:
              assert abs((F(_b) - F(_a)) - _slices(_a, _b)) < 1e-5, "F(" + str(_b) + ") - F(" + str(_a) + ") should equal the integral of cos(2x) over that interval, " + str(round(_slices(_a, _b), 5)) + ", and you have " + repr(F(_b) - F(_a))
          for _x in [0, 0.3, 1, 2.5]:
              _slope = (F(_x + 1e-5) - F(_x - 1e-5)) / 2e-5
              assert abs(_slope - _m.cos(2 * _x)) < 1e-6, "The derivative of F at " + str(_x) + " should be cos(2x) = " + str(_m.cos(2 * _x)) + " and it is " + repr(_slope)
          assert abs(f(0.3) - _m.cos(0.6)) < 1e-12, "Do not change f"
          assert output.strip() == "0.4546", "The program should print 0.4546"
        wrong:
          - "import math\n\ndef f(x):\n    return math.cos(2 * x)\n\ndef F(x):\n    return math.sin(2 * x)\n\nprint(0.4546)\n"
          - "import math\n\ndef f(x):\n    return math.cos(2 * x)\n\ndef F(x):\n    return 2 * math.sin(2 * x)\n\nprint(0.4546)\n"
          - "import math\n\ndef f(x):\n    return math.cos(2 * x)\n\ndef F(x):\n    return -math.sin(2 * x) / 2\n\nprint(0.4546)\n"
          - "import math\n\ndef f(x):\n    return math.cos(2 * x)\n\ndef F(x):\n    return math.sin(x) / 2\n\nprint(0.4546)\n"
        explanation: |
          Differentiate the starter's $F$: by the chain rule $\bigl(\sin(2x)\bigr)' = 2\cos(2x)$, twice the integrand. So $F$ was twice too large, and so was the answer. Dividing by 2 repairs it. When the inside function is $kx$, differentiation multiplies by $k$ and integration must divide by $k$. The tests apply both checks from the lesson: the difference $F(b) - F(a)$ is compared with a sum of slices over several intervals, and the numerical derivative of $F$ is compared with $f$. Either would have caught the missing factor.
        hints:
          - Differentiate sin(2x) with the chain rule.
