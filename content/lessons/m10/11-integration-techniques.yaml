          With $u = 3x + 1$, $dx = \frac{1}{3}du$ and $u$ runs from 1 to 4. The integral is $\frac{1}{3}\left[\frac{u^5}{5}\right]_1^4 = \frac{1024 - 1}{15} = \frac{1023}{15} = 68.2$. Without the $\frac{1}{3}$ the answer would be three times too large: the factor from the inside function is the thing most often lost.
