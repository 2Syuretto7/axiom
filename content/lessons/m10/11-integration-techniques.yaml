    - question:
        id: write-integral-check
        type: code
        mode: write
        system: s2
        prompt: |
          Write `integral_check(f, F, a, b)`. It returns `True` if `F` behaves like an antiderivative of `f` on the interval from `a` to `b`, and `False` otherwise.

          Compute the midpoint sum of `f` with 1000 slices, and compare it with `F(b) - F(a)`. Return `True` when the two differ by less than `1e-4` in absolute value.
        starter: |
          import math

          def integral_check(f, F, a, b):
              # Replace the next line with your own.
              return True

          print(integral_check(lambda x: x * math.exp(x), lambda x: x * math.exp(x) - math.exp(x), 0, 1))
          print(integral_check(lambda x: x * math.exp(x), lambda x: x * x * math.exp(x) / 2, 0, 1))
        solution: |
          import math

          def integral_check(f, F, a, b):
              width = (b - a) / 1000
              slices = sum([f(a + (i + 0.5) * width) * width for i in range(1000)])
              return abs(slices - (F(b) - F(a))) < 1e-4

          print(integral_check(lambda x: x * math.exp(x), lambda x: x * math.exp(x) - math.exp(x), 0, 1))
          print(integral_check(lambda x: x * math.exp(x), lambda x: x * x * math.exp(x) / 2, 0, 1))
        tests: |
          import math as _m
          assert integral_check(lambda x: x * x, lambda x: x ** 3 / 3, 0, 3) is True, "x^3 / 3 is an antiderivative of x^2, so the check should pass"
          assert integral_check(lambda x: x * x, lambda x: x ** 3 / 3 + 50, 0, 3) is True, "Adding a constant to an antiderivative gives another antiderivative"
          assert integral_check(lambda x: x * x, lambda x: x ** 3, 0, 3) is False, "x^3 is not an antiderivative of x^2. The check should fail"
          assert integral_check(_m.cos, _m.sin, 1, 4) is True, "sin is an antiderivative of cos, on [1, 4] as on any interval"
          assert integral_check(_m.sin, _m.cos, 1, 4) is False, "cos is not an antiderivative of sin. The sign is wrong"
          assert integral_check(lambda x: 2 * x * _m.cos(x * x), lambda x: _m.sin(x * x), 0, 2) is True, "sin(x^2) is an antiderivative of 2x cos(x^2)"
          assert integral_check(lambda x: _m.cos(2 * x), lambda x: _m.sin(2 * x), 0, 1) is False, "sin(2x) is not an antiderivative of cos(2x). A factor of 1/2 is missing"
          assert integral_check(lambda x: 1 / x, _m.log, 2, 5) is True, "ln x is an antiderivative of 1/x on [2, 5]"
          assert integral_check(lambda x: 2 * x, lambda x: x * x - 0.01 * x, 1, 2) is False, "An F whose difference is off by 0.01 must fail. Compare the absolute difference with 1e-4"
          assert integral_check(lambda x: 2 * x, lambda x: x * x + 0.01 * x, 1, 2) is False, "An F whose difference is too large by 0.01 must fail as well. Use the absolute value"
          assert output.split() == ["True", "False"], "The program should print True and then False"
        wrong:
          - "import math\n\ndef integral_check(f, F, a, b):\n    width = (b - a) / 1000\n    slices = sum([f(a + (i + 0.5) * width) * width for i in range(1000)])\n    return slices - (F(b) - F(a)) < 1e-4\n\nprint(True)\nprint(False)\n"
          - "import math\n\ndef integral_check(f, F, a, b):\n    width = (b - a) / 1000\n    slices = sum([f(a + (i + 0.5) * width) * width for i in range(1000)])\n    return abs(slices - F(b)) < 1e-4\n\nprint(True)\nprint(False)\n"
          - "import math\n\ndef integral_check(f, F, a, b):\n    width = (b - a) / 1000\n    slices = sum([f((i + 0.5) * width) * width for i in range(1000)])\n    return abs(slices - (F(b) - F(a))) < 1e-4\n\nprint(True)\nprint(False)\n"
          - "import math\n\ndef integral_check(f, F, a, b):\n    width = (b - a) / 1000\n    slices = sum([f(a + (i + 0.5) * width) for i in range(1000)])\n    return abs(slices - (F(b) - F(a))) < 1e-4\n\nprint(True)\nprint(False)\n"
          - "import math\n\ndef integral_check(f, F, a, b):\n    width = (b - a) / 1000\n    slices = sum([F(a + (i + 0.5) * width) * width for i in range(1000)])\n    return abs(slices - (f(b) - f(a))) < 1e-4\n\nprint(True)\nprint(False)\n"
        explanation: |
          The function computes one number in two unrelated ways. The midpoint sum needs no insight: it only evaluates $f$. The difference $F(b) - F(a)$ depends entirely on $F$ being right. If they agree, $F$ has passed a test that a wrong factor or sign cannot survive. The program's second line shows it catching the mistake from the puzzle, the product of the two separate antiderivatives. Three details matter. The comparison uses the absolute value, since $F$ may err in either direction. A constant added to $F$ makes no difference, because it cancels in the subtraction. And the tolerance must be looser than the midpoint rule's own error, which with 1000 slices is far below $10^{-4}$ for functions like these.
        hints:
          - Compute the width, (b - a) / 1000, and the midpoint sum of f.
          - Compute F(b) - F(a).
          - Return whether the absolute value of their difference is less than 1e-4.
    - question:
        id: fix-antiderivative
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `F` should be an antiderivative of `f`, where $f(x) = \cos(2x)$. The program should print $\int_0^1 \cos(2x)\,dx$ to four places, 0.4546. It prints 0.9093. Fix `F`.
