    - text: Slower now. Name the method before you use it, and check each answer by differentiating.
    - question:
        id: work-power-linear
        type: numeric
        system: s2
        prompt: |
          Evaluate $\displaystyle\int_0^1 (3x + 1)^4\,dx$.
        answer: "68.2"
