    - question:
        id: write-mean-of-density
        type: code
        mode: write
        system: s2
        prompt: |
          A curve $p(x)$ on an interval from `a` to `b`, with total area 1, describes how a varying quantity is spread out. Its average is

          $$\int_a^b x\,p(x)\,dx.$$

          Write `mean_of_density(p, a, b, n)`, which estimates that integral by the midpoint rule with `n` slices.
        starter: |
          def mean_of_density(p, a, b, n):
              # Replace the next line with your own.
              return 0

          print(round(mean_of_density(lambda x: 2 * x, 0, 1, 1000), 4))
        solution: |
          def mean_of_density(p, a, b, n):
              width = (b - a) / n
              total = 0
              for i in range(n):
                  x = a + (i + 0.5) * width
                  total = total + x * p(x) * width
              return total

          print(round(mean_of_density(lambda x: 2 * x, 0, 1, 1000), 4))
        tests: |
          import math as _m
          assert abs(mean_of_density(lambda x: 0.5, 0, 2, 100) - 1) < 1e-9, "A flat curve of height 0.5 on [0, 2] has average 1, the middle of the interval. You returned " + repr(mean_of_density(lambda x: 0.5, 0, 2, 100))
          assert abs(mean_of_density(lambda x: 0.25, 3, 7, 100) - 5) < 1e-9, "A flat curve of height 0.25 on [3, 7] has average 5. You returned " + repr(mean_of_density(lambda x: 0.25, 3, 7, 100))
          assert abs(mean_of_density(lambda x: 2 * x, 0, 1, 1000) - 2 / 3) < 1e-5, "For the curve 2x on [0, 1] the average is the integral of 2x^2, which is 2/3. You returned " + repr(mean_of_density(lambda x: 2 * x, 0, 1, 1000))
          assert abs(mean_of_density(lambda x: 2 * _m.exp(-2 * x), 0, 20, 4000) - 0.5) < 1e-4, "For 2e^(-2x), cut off at 20, the average is 0.5. You returned " + repr(mean_of_density(lambda x: 2 * _m.exp(-2 * x), 0, 20, 4000))
          assert abs(mean_of_density(lambda x: 1, 0, 1, 1) - 0.5) < 1e-12, "With one slice on [0, 1] and a flat curve of height 1, the estimate is 0.5 * 1 * 1"
          assert output.strip() == "0.6667", "The program should print 0.6667"
        wrong:
          - "def mean_of_density(p, a, b, n):\n    width = (b - a) / n\n    total = 0\n    for i in range(n):\n        x = a + (i + 0.5) * width\n        total = total + p(x) * width\n    return total\n\nprint(0.6667)\n"
          - "def mean_of_density(p, a, b, n):\n    width = (b - a) / n\n    total = 0\n    for i in range(n):\n        x = a + i * width\n        total = total + x * p(x) * width\n    return total\n\nprint(0.6667)\n"
          - "def mean_of_density(p, a, b, n):\n    width = (b - a) / n\n    total = 0\n    for i in range(n):\n        x = (i + 0.5) * width\n        total = total + x * p(x) * width\n    return total\n\nprint(0.6667)\n"
          - "def mean_of_density(p, a, b, n):\n    width = (b - a) / n\n    total = 0\n    for i in range(n):\n        x = a + (i + 0.5) * width\n        total = total + x * p(x)\n    return total / n\n\nprint(0.6667)\n"
          - "def mean_of_density(p, a, b, n):\n    width = (b - a) / n\n    total = 0\n    for i in range(n):\n        x = a + (i + 0.5) * width\n        total = total + x * p(x) * width\n    return total / (b - a)\n\nprint(0.6667)\n"
        explanation: |
          An ordinary average weights each value by how often it occurs. Here the slice around $x$ carries a share $p(x)\,\Delta x$ of the total, so the value $x$ is weighted by that share, and the weighted values are added: $\sum x\,p(x)\,\Delta x$. That is a midpoint sum of the function $x\,p(x)$. No division by the length of the interval is wanted, because the shares already add up to 1. For the curve $2x$ on $[0, 1]$, which puts more weight on larger values, the average is $\frac{2}{3}$, above the midpoint. For $2e^{-2x}$ the sum reproduces the $\frac{1}{2}$ you found by parts, and it would work equally well for a curve with no antiderivative at all.
        hints:
          - The integrand is x times p(x).
          - Take x at the midpoint of each slice, a + (i + 0.5) * width.
          - Add up x * p(x) * width. Do not divide by the length of the interval.
    - question:
        id: work-which-method
        type: choice
        system: s2
        prompt: |
          Consider $\displaystyle\int x\,e^{x^2}\,dx$ and $\displaystyle\int x\,e^{x}\,dx$. Which methods fit?
        options:
          - "Both by substitution."
          - "The first by substitution with $u = x^2$, since the factor $x$ is half the derivative of the inside. The second by parts with $u = x$, since there is no inside function, only a product."
          - "The first by parts, and the second by substitution with $u = e^x$."
          - "Both by parts."
        answer: 1
        explanation: |
          In $x\,e^{x^2}$ the exponential has an inside function, $x^2$, and the other factor is its derivative up to a constant: $du = 2x\,dx$. So the integral is $\frac{1}{2}\int e^u\,du = \frac{1}{2}e^{x^2}$. In $x\,e^x$ the exponent is just $x$, so nothing is hidden inside, and the factor $x$ is a genuine second factor: parts gives $x\,e^x - e^x$. The two integrands differ by one small exponent and need different rules, because they are footprints of different differentiation rules. The question to ask of a product is whether one factor is the derivative of something inside the other.
        hints:
          - In which integrand does the exponential have an inside function other than x?
          - Is the remaining factor the derivative of that inside, up to a constant?
          - If not, which factor becomes simpler when differentiated?
    - question:
        id: work-no-formula
        type: choice
        system: s2
        prompt: |
          You need $\displaystyle\int_0^1 e^{-x^2}\,dx$, and you cannot find an antiderivative. What is the right conclusion?
        options:
          - "The integral does not exist."
          - "A cleverer substitution will find the antiderivative."
          - "The integrand is continuous, so the integral exists and an antiderivative exists, but it cannot be written with the familiar functions. Compute the number with a sum of slices."
          - "The integral equals $\\left[-\\frac{e^{-x^2}}{2x}\\right]_0^1$."
        answer: 2
        explanation: |
          The fundamental theorem guarantees that every continuous function has an antiderivative, its own area function. It does not promise a formula for it. For $e^{-x^2}$ it has been proved that no finite combination of powers, exponentials, logarithms and trigonometric functions will do. The integral is still a definite number, about 0.7468, and the midpoint rule with a hundred slices gives it to six figures. The last option fails the check: differentiating it by the quotient rule does not return $e^{-x^2}$, and it is not even defined at 0. Formulas are a convenience for the integrals that happen to have them. The definition, a limit of sums, works always.
        hints:
          - What does the fundamental theorem say about a continuous integrand?
          - Existing and having a formula are different things.
          - Which method needs only the ability to evaluate the integrand?
    - question:
        id: work-tail
        type: choice
        system: s2
        prompt: |
          $\displaystyle\int_1^{\infty} \frac{1}{x^2}\,dx = 1$ but $\displaystyle\int_1^{\infty} \frac{1}{x}\,dx$ diverges. Both integrands tend to 0. What makes the difference?
        options:
          - "Nothing. Both should converge, since both integrands tend to 0."
          - "The antiderivatives decide: $-\\frac{1}{b}$ settles to a limit as $b \\to \\infty$, while $\\ln b$ grows without bound. Tending to 0 is necessary for the area to be finite, but the integrand must shrink fast enough."
          - "$\\frac{1}{x}$ is not continuous."
          - "$\\frac{1}{x^2}$ is smaller than $\\frac{1}{x}$ at $x = 1$."
        answer: 1
        explanation: |
          $\int_1^b x^{-2}\,dx = 1 - \frac{1}{b}$, which tends to 1. $\int_1^b x^{-1}\,dx = \ln b$, which exceeds any number you name once $b$ is large enough: it passes 10 when $b$ passes $e^{10}$, about 22000. An integrand that tends to 0 leaves open whether the total is finite. The same was true of series: the terms $\frac{1}{n}$ tend to 0 and the harmonic series still diverges, while the terms $\frac{1}{n^2}$ give a finite sum. Between the two, the power $x^{-1}$ is exactly the boundary case.
        hints:
          - Write down each integral up to b.
          - What happens to 1 over b, and to the logarithm of b, as b grows?
          - Recall the harmonic series.
  connections:
    - text: |
        The puzzle put forward two integrals that were not in the table, and asked whether the rules of differentiation could be run backwards. They can. An integrand of the form "inside function, with the derivative of the inside as a factor" is the footprint of the chain rule, and substitution undoes it: $\int_0^1 2x\cos(x^2)\,dx = \sin 1$. An integrand that is a product with one factor that simplifies when differentiated is half the footprint of the product rule, and integration by parts trades it for an easier integral: $\int_0^1 x\,e^x\,dx = 1$.

        Unlike differentiation, this is not a machine that always succeeds. It takes recognition, and for some perfectly ordinary functions, the bell curve among them, there is no formula to be found. That is why the lesson kept two things beside the techniques: the limit of sums, which computes any integral numerically, and the habit of checking every antiderivative by differentiating it or by comparing with slices.

        This is the end of the cluster. It began with a limit: what a function approaches. From the limit came the derivative, the rate at which one quantity changes with another, and the rules for computing it, which is the mathematics a network uses to learn which way to adjust each weight. The second derivative measured bending, Taylor polynomials rebuilt functions from their derivatives at a point, and setting the derivative to zero found the best value of a single adjustable number, by formula or by descending step by step. Then the integral added up what the derivative takes apart, and the fundamental theorem showed the two to be inverse to each other.

        All of it concerned functions of **one** variable. A model has thousands or billions of adjustable numbers, and its error depends on all of them at once. The ideas carry over, one variable at a time, in [[m12.functions-of-several-variables]], and integrals over regions of more than one dimension come in [[m12.multiple-integrals-and-change-of-variables]]. The integral itself is put on firm foundations in [[m11.the-riemann-integral]].

        Before any of that, many numbers have to be handled as one thing. The billion weights of a model, the pixels of a picture, the five measurements whose mean you found by descent: each is a list of numbers that belongs together, and calculus in many variables is written in the language of such lists. A list of numbers treated as a single object, with a length and a direction, is a vector. That is where the course goes next, in [[m4.vectors-as-arrows-and-as-lists]].
