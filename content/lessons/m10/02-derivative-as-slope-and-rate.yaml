concept: m10.derivative-as-slope-and-rate
minutes: 100
claim: You can define the derivative of a function at a point as a limit, compute it from the definition for simple functions, read it as the slope of the tangent and as an instantaneous rate with units, use it to approximate a function near a point by a straight line, say where a function fails to have a derivative, and estimate a derivative numerically.
recalls: [m10.limits-and-continuity]
uses: [m1.straight-lines-and-slope, m1.quadratics, m1.polynomials, m1.inequalities-and-absolute-value, m0.powers-and-roots, m0.ratio-and-proportion, m2.functions-as-machines, m2.composition-and-inverses, m3.direct-proof, m3.reading-and-writing-epsilon-style-arguments, e0.functions, e0.expressions, e1.comprehensions-and-iterators]
leads: [m10.differentiation-rules, m10.second-derivative-and-curvature, m10.maxima-and-minima, m12.partial-derivatives]
starter: |
  # Scratch space. Slopes of chords of y = x * x starting at x = 1.
  def f(x):
      return x * x

  for h in [1, 0.5, 0.1, 0.01, 0.001]:
      print(h, (f(1 + h) - f(1)) / h)
parts:
  recall:
    - text: |
        [[m10.limits-and-continuity]] ended with a quotient that kept turning up: a change in output over the change in input that caused it, as the input change shrinks to nothing. Its limit gave the speed of a falling stone at an instant. Today that limit gets its name. Three quick pulls first.
  puzzle:
    - text: |
        A straight line has a slope. You found it in the lesson on straight lines by picking any two points and dividing the rise by the run, and it did not matter which two points you picked. That is what makes a line a line.

        Now take the parabola $y = x^2$. It passes through $(0, 0)$, $(1, 1)$, $(2, 4)$ and $(3, 9)$. Between the first two it rises 1 for a run of 1. Between the next two it rises 3. Between the last two, 5. Rise over run gives a different answer for every pair of points. The curve is level at the bottom, gentle near it, and steeper and steeper as you go out.

        And yet it seems obvious that the curve has a definite steepness **at each point**. A cyclist riding along it would feel one gradient at $(1, 1)$ and a greater one at $(2, 4)$. If the curve is the error of a model plotted against one of its numbers, the steepness at the present point is the thing we most want to know: it says which way to change the number to bring the error down, and how much good a small change will do.

        The Greeks had an answer for a circle. The steepness at a point is the slope of the **tangent**, the line that touches the circle there and meets it nowhere else. Try to carry that over to other curves and it falls apart. The vertical line through $(1, 1)$ meets the parabola at exactly one point, and it is surely not the tangent. The line that ought to be the tangent to $y = x^3$ at the origin, the $x$-axis, **crosses** the curve there. And the natural tangent to a wavy curve at one point will cut the curve again somewhere else. "Touches at one point" is the wrong idea.

        **What is the slope of a curve at a single point, when slope takes two points to measure?**
  intuition:
    - text: |
        You have already met this difficulty and beaten it. Speed needs two instants and the stone had a speed at one. The way through was the same then as now: use two points, bring the second towards the first, and take the limit.

        Fix the point $(1, 1)$ on $y = x^2$. Choose a second point on the curve, at $x = 1 + h$. The straight line through the two is a **chord**, and its slope is honest rise over run:

        $$\frac{(1 + h)^2 - 1}{h}.$$

        The starter prints this for shrinking $h$: 3, then 2.5, 2.1, 2.01, 2.001. The chords are swinging round towards one particular line, and their slopes are closing in on 2. **The slope of the curve at the point is the limit of the slopes of the chords.** The line through the point with that slope is the tangent. No talk of touching is needed.

        In the figure, slide the second point towards the first and watch the chord settle onto the dashed tangent.
    - figure: secant
      props: { fn: square, at: 1, closeness: 0 }
    - text: |
        There is a second way to see the same thing, and it is the one to keep. **Zoom in.** Look at $y = x^2$ near $(1, 1)$ through a stronger and stronger magnifying glass. The curve looks less and less curved. Magnified a thousand times, the piece in view cannot be told from a straight line of slope 2. A smooth curve, seen closely enough, is straight, in the way that the Earth, seen from where you stand, is flat.

        That straight line is the tangent, and its slope is the **derivative**. So the derivative answers a precise question: **near this point, which straight line is the function pretending to be?**

        This is the reason calculus is so useful. Straight lines are the functions we understand completely. The derivative lets us replace a complicated function, near any chosen point, by a line, do our reasoning on the line, and be nearly right. Training a neural network is exactly this, repeated billions of times: at the present values of the model's numbers, replace the error by its straight-line stand-in, step downhill along that, and look again.

        A slope is also a **rate**. The slope of a distance-against-time graph is a speed. If the output is rupees and the input is kilograms, the slope is rupees per kilogram. The derivative at a point is the rate at which the output is changing **per unit of input, at that moment**: the factor by which a tiny change in the input is multiplied to give the change in the output. A derivative of 2 means: nudge the input by a little, and the output moves by about twice as much. A derivative of $-0.5$: the output moves half as much, the other way.
  derivation:
    - text: |
        **The definition.** Let $f$ be defined near $a$. The **derivative of $f$ at $a$** is

        $$f'(a) = \lim_{h \to 0} \frac{f(a + h) - f(a)}{h},$$

        provided the limit exists. If it does, $f$ is called **differentiable at $a$**. The quotient inside is the **difference quotient**: the slope of the chord from $(a, f(a))$ to $(a + h, f(a + h))$, or the average rate of change of $f$ between $a$ and $a + h$. Here $h$ may be positive or negative, so the second point may lie on either side, and it is never 0.

        Substituting $h = 0$ always gives $\frac{0}{0}$. So every derivative is a limit of the awkward kind, and is found by rewriting the quotient until the $h$ on the bottom has been cancelled.

        **The square.** Take $f(x) = x^2$ at an arbitrary point $a$.

        $$\frac{(a + h)^2 - a^2}{h} = \frac{a^2 + 2ah + h^2 - a^2}{h} = \frac{2ah + h^2}{h} = 2a + h \;\longrightarrow\; 2a.$$

        So $f'(a) = 2a$. At $a = 1$ the slope is 2, as the chords suggested. At $a = 3$ it is 6. At $a = 0$ it is 0: the curve is level at its lowest point. At $a = -2$ it is $-4$: the curve is falling. One calculation has given the slope at every point at once.

        **The derivative is a function.** That is the step up in thinking. To each point $a$ the calculation assigns a number, the slope there. A rule that assigns a number to each input is a function. We call it $f'$, read "f prime", and write $f'(x) = 2x$. Differentiation is a machine that takes a function and returns a function: in goes the squaring function, out comes the doubling function. In the language of the cluster on functions, it is a function whose inputs and outputs are themselves functions.

        **The cube.** For $f(x) = x^3$, use $(a + h)^3 = a^3 + 3a^2h + 3ah^2 + h^3$.

        $$\frac{(a + h)^3 - a^3}{h} = \frac{3a^2h + 3ah^2 + h^3}{h} = 3a^2 + 3ah + h^2 \;\longrightarrow\; 3a^2.$$

        So the derivative of $x^3$ is $3x^2$. At the origin it is 0: the tangent there is the $x$-axis, and it does cross the curve, and nothing in the definition minds.

        **The reciprocal.** For $f(x) = \dfrac{1}{x}$ and $a \ne 0$, put the top over a common denominator.

        $$\frac{1}{h}\left(\frac{1}{a + h} - \frac{1}{a}\right) = \frac{1}{h} \cdot \frac{a - (a + h)}{a(a + h)} = \frac{-1}{a(a + h)} \;\longrightarrow\; -\frac{1}{a^2}.$$

        The derivative is negative everywhere: the curve always falls. It falls steeply near 0 and hardly at all far out.

        **The square root.** For $f(x) = \sqrt{x}$ and $a > 0$, the conjugate from the last lesson does it.

        $$\frac{\sqrt{a + h} - \sqrt{a}}{h} = \frac{(a + h) - a}{h\,(\sqrt{a + h} + \sqrt{a})} = \frac{1}{\sqrt{a + h} + \sqrt{a}} \;\longrightarrow\; \frac{1}{2\sqrt{a}}.$$

        **Lines and constants.** For $f(x) = mx + c$ the difference quotient is $\dfrac{m(a + h) + c - ma - c}{h} = m$ for every $h$, so $f'(a) = m$. The derivative of a line is its slope, as it had better be. A constant function is a line of slope 0, so its derivative is 0 everywhere: something that does not change has no rate of change.

        Look at what has come out.

        | $f(x)$ | $1 = x^0$ | $x = x^1$ | $x^2$ | $x^3$ | $\dfrac{1}{x} = x^{-1}$ | $\sqrt{x} = x^{1/2}$ |
        | --- | --- | --- | --- | --- | --- | --- |
        | $f'(x)$ | $0$ | $1$ | $2x$ | $3x^2$ | $-x^{-2}$ | $\frac{1}{2}x^{-1/2}$ |

        In every column the old exponent has come down in front and the exponent has dropped by 1. That is a pattern crying out to be a theorem, and proving it is the first business of the next lesson.
    - question:
        id: order-derivative-from-definition
        type: order
        system: s2
        prompt: Put the steps in order to find the derivative of $f(x) = x^2 + 3x$ at the point $a$ from the definition.
        steps:
          - "Write the difference quotient: $\\dfrac{(a + h)^2 + 3(a + h) - (a^2 + 3a)}{h}$."
          - "Expand the top: $a^2 + 2ah + h^2 + 3a + 3h - a^2 - 3a$."
          - "Collect terms on top: $2ah + h^2 + 3h$."
          - "Cancel $h$, which is not zero: $2a + h + 3$."
          - "Let $h \\to 0$: the limit is $2a + 3$."
        explanation: The difference quotient is written first, since it is what the derivative is the limit of. The top is then expanded and tidied until every term carries a factor h, which is cancelled with the bottom. Only after that can h be allowed to shrink, because before the cancelling the quotient has the form 0 over 0.
        hints:
          - Start from the definition of the derivative.
          - The h on the bottom must be cancelled before the limit is taken.
          - Cancelling needs every term of the top to contain h, so tidy the top first.
    - text: |
        **Another way to write it.** Leibniz, one of the two inventors of calculus, wrote the change in $x$ as $\Delta x$ and the change in $y$ as $\Delta y$, where $\Delta$ is the Greek capital delta and means "the change in". The difference quotient is $\dfrac{\Delta y}{\Delta x}$, and for its limit he wrote

        $$\frac{dy}{dx}.$$

        This is one symbol. It is not a fraction: $dy$ and $dx$ are not numbers that are being divided. But it is built to remind you of the fraction it is the limit of, and that reminder is so useful that the notation has survived three centuries. It shows the units at a glance: if $y$ is in metres and $x$ in seconds, $\dfrac{dy}{dx}$ is in metres per second. You will also see $\dfrac{d}{dx}\,x^2 = 2x$, where $\dfrac{d}{dx}$ is read as the instruction "differentiate with respect to $x$". All these mean the same as $f'$.

        **The tangent line and the linear approximation.** The tangent at $a$ is the line through $(a, f(a))$ with slope $f'(a)$:

        $$y = f(a) + f'(a)\,(x - a).$$

        Near $a$, the curve and this line are almost the same. So

        $$f(x) \approx f(a) + f'(a)\,(x - a) \qquad\text{for } x \text{ near } a.$$

        Read it as a recipe: **new value $\approx$ old value $+$ rate $\times$ change in input.** For example, $\sqrt{100} = 10$, and the derivative of the square root at 100 is $\dfrac{1}{2 \cdot 10} = 0.05$. So

        $$\sqrt{101} \approx 10 + 0.05 \times 1 = 10.05.$$

        The true value is $10.0499\ldots$ A hard function has been replaced by one multiplication and one addition, and the answer is right to four figures.

        How good is the approximation in general? Write the error as $E(h) = f(a + h) - f(a) - f'(a)h$. Then

        $$\frac{E(h)}{h} = \frac{f(a + h) - f(a)}{h} - f'(a) \;\longrightarrow\; 0.$$

        The error does not merely go to 0 as $h$ does. It goes to 0 **faster than $h$**: even after dividing by the tiny $h$, it still vanishes. For $x^2$ at 1 the error is exactly $h^2$. With $h = 0.01$ the step is a hundredth and the error a ten-thousandth. That is the precise sense in which the tangent is the **best** straight-line stand-in. Any other line through the point has an error that shrinks only in proportion to $h$.

        **Differentiable implies continuous.**

        > **Theorem.** If $f$ is differentiable at $a$, then $f$ is continuous at $a$.
        >
        > **Proof.** For $h \ne 0$, write $f(a + h) - f(a) = \dfrac{f(a + h) - f(a)}{h} \cdot h$. As $h \to 0$ the first factor approaches $f'(a)$ and the second approaches 0, so by the product law the product approaches $f'(a) \cdot 0 = 0$. Hence $f(a + h) \to f(a)$, which is continuity at $a$. $\blacksquare$

        By the contrapositive, a function with a jump or a hole at a point has no derivative there. The converse is **false**, and the counterexample is one you will meet daily.

        **Where the derivative fails.** Take $f(x) = \lvert x \rvert$ at 0. The difference quotient is $\dfrac{\lvert h \rvert}{h}$, which is 1 for every positive $h$ and $-1$ for every negative $h$. The right limit is 1 and the left limit is $-1$. They disagree, so there is no limit, and no derivative. The graph is continuous at 0 and has a **corner** there. Zoom in on a corner as far as you like and it is still a corner. It never straightens.

        The same happens to the function $\max(0, x)$, which is 0 for negative inputs and $x$ for positive ones. Its slope is 0 on the left of the origin and 1 on the right, and at the origin it has a corner and no derivative. This function is called the **rectified linear unit**, or ReLU, and it is the most widely used building block inside neural networks. Its missing derivative at one point does no harm in practice, and you should know that the point exists.

        A derivative can also fail because the tangent is vertical. The cube root $x^{1/3}$ at 0 has difference quotient $h^{-2/3}$, which grows without bound.

        **Reading the sign.** If $f'(a) > 0$, then for small positive $h$ the linear approximation says $f(a + h) > f(a)$: the function is rising as it passes through $a$. If $f'(a) < 0$ it is falling. If $f'(a) = 0$ the tangent is level, and the function is momentarily neither rising nor falling. Those level points are where the peaks and valleys are to be found, which is the subject of a later lesson.

        **Estimating a derivative by computer.** If you have a function as code and want its derivative at a point, the obvious thing is to compute the difference quotient for a small $h$. This is the **forward difference**:

        ```python
        def forward(f, a, h):
            return (f(a + h) - f(a)) / h
        ```

        For $x^2$ it returns $2a + h$: wrong by exactly $h$. A better idea costs nothing extra. Take one point on each side of $a$, at equal distances. This is the **central difference**:

        ```python
        def central(f, a, h):
            return (f(a + h) - f(a - h)) / (2 * h)
        ```

        The run between the two points is $2h$, which is why the bottom is doubled. For $x^2$:

        $$\frac{(a + h)^2 - (a - h)^2}{2h} = \frac{4ah}{2h} = 2a.$$

        Exactly right, for any $h$. For $x^3$ it gives $3a^2 + h^2$, an error of $h^2$ where the forward difference had an error of about $3ah$. The chord drawn symmetrically about a point is far closer to parallel with the tangent than the chord drawn to one side. In general the forward difference has an error proportional to $h$, and the central difference an error proportional to $h^2$. With $h = 0.001$ that is the difference between three correct digits and six.

        Recall the warning that ended the last lesson. $h$ cannot be made as small as you please, because the subtraction on top loses digits. For the central difference a value of $h$ around $10^{-5}$ is a sensible compromise. Numerical differences are used all the time to **check** derivatives that have been worked out by other means. They are too slow and too inexact to train a model with, and the lessons that follow build the exact methods that are used instead.
    - question:
        id: derivation-relu
        type: choice
        system: s2
        prompt: |
          $r(x) = \max(0, x)$. What is the difference quotient $\dfrac{r(0 + h) - r(0)}{h}$ for $h > 0$ and for $h < 0$, and what follows?
        options:
          - "1 for $h > 0$ and 0 for $h < 0$. The one-sided limits differ, so $r$ has no derivative at 0."
          - "1 for every $h$. So $r'(0) = 1$."
          - "0 for every $h$. So $r'(0) = 0$."
          - "1 for $h > 0$ and $-1$ for $h < 0$. So $r'(0) = 0$, the average."
        answer: 0
        explanation: |
          For $h > 0$, $r(h) = h$ and the quotient is $\frac{h}{h} = 1$. For $h < 0$, $r(h) = 0$ and the quotient is $\frac{0}{h} = 0$. The limit from the right is 1 and from the left is 0. A limit needs the two sides to agree, so the derivative at 0 does not exist. Everywhere else it does: 0 for negative inputs and 1 for positive ones. Averaging two disagreeing one-sided limits is not something the definition allows. Software has to return some number at that single point, and returns 0 by convention.
        hints:
          - What is r(h) when h is positive? When h is negative?
          - Compute the quotient separately on each side.
          - Does a limit exist when the two sides approach different numbers?
  formal:
    - text: |
        **Derivative.** $f'(a) = \displaystyle\lim_{h \to 0} \frac{f(a + h) - f(a)}{h}$, when the limit exists. Then $f$ is differentiable at $a$. Equivalently $f'(a) = \displaystyle\lim_{x \to a} \frac{f(x) - f(a)}{x - a}$.

        **Notation.** $f'(x)$, $\ \dfrac{dy}{dx}$, $\ \dfrac{d}{dx} f(x)$ all denote the derivative. Its units are units of output per unit of input.

        **Tangent line at $a$.** $y = f(a) + f'(a)(x - a)$.

        **Linear approximation.** $f(a + h) = f(a) + f'(a)h + E(h)$ with $\dfrac{E(h)}{h} \to 0$ as $h \to 0$.

        **Theorem.** Differentiable at $a$ implies continuous at $a$. The converse is false: $\lvert x \rvert$ at 0.

        **Sign.** $f'(a) > 0$: rising through $a$. $f'(a) < 0$: falling. $f'(a) = 0$: level tangent.

        | $f(x)$ | $f'(x)$ | Valid for |
        | --- | --- | --- |
        | $c$ | $0$ | all $x$ |
        | $mx + c$ | $m$ | all $x$ |
        | $x^2$ | $2x$ | all $x$ |
        | $x^3$ | $3x^2$ | all $x$ |
        | $\dfrac{1}{x}$ | $-\dfrac{1}{x^2}$ | $x \ne 0$ |
        | $\sqrt{x}$ | $\dfrac{1}{2\sqrt{x}}$ | $x > 0$ |
        | $\lvert x \rvert$ | $-1$ for $x < 0$, $\ 1$ for $x > 0$ | $x \ne 0$ |

        **Numerical estimates.** Forward difference $\dfrac{f(a + h) - f(a)}{h}$, error proportional to $h$. Central difference $\dfrac{f(a + h) - f(a - h)}{2h}$, error proportional to $h^2$.
  drill:
    - text: Seconds each. Use the table. The definition is for proving, the table is for doing.
    - question:
        id: drill-square
        type: numeric
        system: s1
        prompt: |
          $f(x) = x^2$. What is $f'(5)$?
        answer: "10"
        explanation: The derivative of the square is twice the input.
        hints:
          - The derivative of x squared is 2x.
          - Put 5 in.
    - question:
        id: drill-cube
        type: numeric
        system: s1
        prompt: |
          $f(x) = x^3$. What is $f'(2)$?
        answer: "12"
        explanation: The derivative is three times the square of the input, and three times four is twelve.
        hints:
          - The derivative of x cubed is 3x squared.
          - Square 2 first.
    - question:
        id: drill-line
        type: numeric
        system: s1
        prompt: |
          $f(x) = 7x - 4$. What is $f'(100)$?
        answer: "7"
        explanation: A line has the same slope at every point.
        hints:
          - What is the slope of this line?
          - Does the slope of a line depend on where you are?
    - question:
        id: drill-constant
        type: numeric
        system: s1
        prompt: |
          $f(x) = 9$ for every $x$. What is $f'(2)$?
        answer: "0"
        explanation: A constant does not change, so its rate of change is zero.
        hints:
          - How much does the output change when the input changes?
          - A level line has what slope?
    - question:
        id: drill-reciprocal
        type: numeric
        system: s1
        prompt: |
          $f(x) = \dfrac{1}{x}$. What is $f'(2)$? Answer as a decimal.
        answer: "-0.25"
        explanation: The derivative is minus one over the square of the input.
        hints:
          - The derivative of 1/x is negative.
          - One over two squared.
    - question:
        id: drill-root
        type: numeric
        system: s1
        prompt: |
          $f(x) = \sqrt{x}$. What is $f'(4)$? Answer as a decimal.
        answer: "0.25"
        explanation: One over twice the square root. Twice the root of 4 is 4.
        hints:
          - The derivative is 1 over twice the square root.
          - The square root of 4 is 2.
    - question:
        id: drill-linear-estimate
        type: numeric
        system: s1
        prompt: |
          $f(2) = 5$ and $f'(2) = 3$. Estimate $f(2.1)$ with the linear approximation.
        answer: "5.3"
        explanation: Old value plus rate times change in input. Five plus three times a tenth.
        hints:
          - New value is about old value plus rate times change.
          - The input changes by 0.1.
    - question:
        id: drill-units
        type: choice
        system: s1
        prompt: |
          $C(w)$ is the cost in rupees of posting a parcel of $w$ kilograms. What are the units of $C'(w)$?
        options: ["rupees", "kilograms", "rupees per kilogram", "kilograms per rupee"]
        answer: 2
        explanation: A derivative has the units of the output divided by the units of the input.
        hints:
          - A derivative is a limit of output change over input change.
          - Which quantity is the output here?
    - question:
        id: drill-sign
        type: choice
        system: s1
        prompt: |
          $f'(3) = -2$. What is $f$ doing as $x$ passes through 3?
        options: ["Rising", "Falling", "Momentarily level", "Nothing can be said"]
        answer: 1
        explanation: A negative derivative means the output decreases as the input increases.
        hints:
          - What does a negative slope look like?
          - Use the linear approximation with a small positive step.
    - question:
        id: drill-corner
        type: choice
        system: s1
        prompt: |
          Does $\lvert x \rvert$ have a derivative at 0?
        options:
          - "Yes, it is 0."
          - "Yes, it is 1."
          - "No. The slopes from the left and the right are $-1$ and 1, which disagree."
          - "No, because it is not continuous there."
        answer: 2
        explanation: The function is continuous at 0, but the difference quotient has different one-sided limits. A corner has no tangent.
        hints:
          - What is the slope of the graph on each side of 0?
          - A limit needs both sides to agree.
    - question:
        id: drill-tangent
        type: numeric
        system: s1
        prompt: |
          The tangent to $y = x^2$ at $(3, 9)$ has equation $y = 9 + 6(x - 3)$. What is its $y$-intercept?
        answer: "-9"
        explanation: Put x equal to 0. Nine minus eighteen.
        hints:
          - The intercept is the value at x = 0.
          - Six times minus three.
    - question:
        id: predict-forward
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def forward(f, a, h):
              return (f(a + h) - f(a)) / h

          print([round(forward(lambda x: x * x, 3, h), 3) for h in [1, 0.1, 0.01]])
        output: "[7.0, 6.1, 6.01]"
        explanation: For the square the forward difference is 2a + h, here 6 + h. It is wrong by exactly h and closes in on 6.
        hints:
          - Work out the difference quotient for x squared by algebra.
          - It comes to 6 + h.
    - question:
        id: predict-central
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          def central(f, a, h):
              return (f(a + h) - f(a - h)) / (2 * h)

          print(central(lambda x: x * x, 3, 1), central(lambda x: x * x, 3, 0.5))
        output: "6.0 6.0"
        explanation: For the square the central difference is exactly 2a whatever h is. With h = 1 it is 16 minus 4, over 2. With h = 0.5 it is 12.25 minus 6.25, over 1.
        hints:
          - With h = 1 the two points are 4 and 2.
          - Divide the difference of the squares by twice h.
  work:
    - text: Slower now. Say what each derivative means in the units of the problem before you compute it.
    - question:
        id: work-ball-velocity
        type: numeric
        system: s2
        unit: metres per second
        prompt: |
          A ball thrown upwards is at height $s(t) = 20t - 5t^2$ metres after $t$ seconds. Using the definition or the table, find its velocity $s'(t)$ at $t = 1$.
        answer: "10"
        explanation: |
          The difference quotient is $\dfrac{20(t + h) - 5(t + h)^2 - 20t + 5t^2}{h} = \dfrac{20h - 10th - 5h^2}{h} = 20 - 10t - 5h$, which approaches $20 - 10t$. At $t = 1$ that is 10 metres per second, upwards. You may have noticed that the derivative of a sum came out as the sum of the derivatives, $20$ from $20t$ and $-10t$ from $-5t^2$. That is a rule, and it is proved in the next lesson.
        hints:
          - Write the difference quotient for s at a general time t.
          - Expand, and cancel h. Three terms are left, and one of them still contains h.
          - Let h shrink, then put t equal to 1.
    - question:
        id: work-ball-top
        type: numeric
        system: s2
        unit: seconds
        prompt: |
          For the same ball, $s'(t) = 20 - 10t$. At what time is the ball at the top of its flight?
        answer: "2"
        explanation: |
          At the top the ball is, for an instant, neither rising nor falling, so its velocity is 0. $20 - 10t = 0$ gives $t = 2$. Before that the derivative is positive and the ball is rising. After it the derivative is negative and the ball is falling. The height there is $s(2) = 40 - 20 = 20$ metres. Finding where a derivative is zero is how peaks and valleys are located.
        hints:
          - What is the velocity at the highest point?
          - Set the derivative equal to zero.
          - Solve 20 - 10t = 0.
    - question:
        id: work-root-estimate
        type: numeric
        system: s2
        prompt: |
          Use the linear approximation at $a = 25$ to estimate $\sqrt{26}$. Give the estimate exactly, as a decimal.
        answer: "5.1"
        explanation: |
          $\sqrt{25} = 5$ and the derivative of the square root at 25 is $\dfrac{1}{2 \cdot 5} = 0.1$. So $\sqrt{26} \approx 5 + 0.1 \times 1 = 5.1$. The true value is $5.0990\ldots$ The estimate is a little too large, because the graph of the square root bends downwards and so lies below its tangent.
        hints:
          - Choose a nearby point where the square root is easy.
          - The derivative of the square root at 25 is 1 over twice 5.
          - Old value plus rate times change in input.
    - question:
        id: write-derivative
        type: code
        mode: write
        system: s2
        prompt: |
          Write `derivative(f, a)`. It returns an estimate of $f'(a)$ by the **central difference** with $h = 10^{-5}$:

          $$\frac{f(a + h) - f(a - h)}{2h}.$$

          The tests need more accuracy than a forward difference can give.
        starter: |
          def derivative(f, a):
              # Replace the next line with your own.
              return 0

          print(round(derivative(lambda x: x * x * x, 2), 6))
        solution: |
          def derivative(f, a):
              h = 1e-5
              return (f(a + h) - f(a - h)) / (2 * h)

          print(round(derivative(lambda x: x * x * x, 2), 6))
        tests: |
          import math as _m
          def _close(got, want, name):
              assert abs(got - want) < 1e-7, "For " + name + " the derivative is " + str(want) + " and you returned " + repr(got) + ". A forward difference is not accurate enough here."
          _close(derivative(lambda x: x * x, 3), 6, "x*x at 3")
          _close(derivative(lambda x: x * x * x, 2), 12, "x*x*x at 2")
          _close(derivative(lambda x: 1 / x, 2), -0.25, "1/x at 2")
          _close(derivative(lambda x: 7 * x - 4, 100), 7, "7x - 4 at 100")
          _close(derivative(_m.sqrt, 4), 0.25, "the square root at 4")
          _close(derivative(lambda x: 5, 1), 0, "a constant")
          assert output.strip() == "12.0", "The program should print 12.0"
        wrong:
          - "def derivative(f, a):\n    h = 1e-5\n    return (f(a + h) - f(a)) / h\n\nprint(12.0)\n"
          - "def derivative(f, a):\n    h = 1e-5\n    return (f(a + h) - f(a - h)) / h\n\nprint(12.0)\n"
          - "def derivative(f, a):\n    h = 1e-5\n    return f(a + h) - f(a - h) / (2 * h)\n\nprint(12.0)\n"
          - "def derivative(f, a):\n    return 2 * a\n\nprint(12.0)\n"
        explanation: |
          The two sample points are $a + h$ and $a - h$, a run of $2h$ apart, so the rise between them is divided by $2h$. For the cube at 2 the result is $12 + h^2$, off by $10^{-10}$, which rounds to 12.0. A forward difference with the same $h$ would be off by about $6 \times 10^{-5}$: the symmetric chord is the better stand-in for the tangent, and costs the same two calls of `f`. Notice what the function is: it takes a function and a point and returns a number. It knows nothing about `f` except how to call it, which is why it works for any `f`, and why it can only ever estimate.
        hints:
          - Use one point on each side of a, at a + h and a - h.
          - How far apart are those two points?
          - Put the whole difference in parentheses before dividing by 2 * h.
    - question:
        id: write-linear-estimate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `linear_estimate(f, a, x)`. It returns the value at `x` of the **tangent line to `f` at `a`**:

          $$f(a) + f'(a)\,(x - a).$$

          Use the `derivative` function given in the starter for $f'(a)$. Do not call `f(x)`: the point of a linear approximation is to avoid evaluating the function at the new point.
        starter: |
          import math

          def derivative(f, a):
              h = 1e-5
              return (f(a + h) - f(a - h)) / (2 * h)

          def linear_estimate(f, a, x):
              # Replace the next line with your own.
              return f(a)

          print(round(linear_estimate(math.sqrt, 100, 101), 4))
        solution: |
          import math

          def derivative(f, a):
              h = 1e-5
              return (f(a + h) - f(a - h)) / (2 * h)

          def linear_estimate(f, a, x):
              return f(a) + derivative(f, a) * (x - a)

          print(round(linear_estimate(math.sqrt, 100, 101), 4))
        tests: |
          import math as _m
          def _guard(a):
              def _f(x):
                  assert abs(x - a) < 0.01, "Your function evaluated f far from a, at x = " + str(x) + ". Use only f(a) and the derivative at a."
                  return x * x
              return _f
          _v = linear_estimate(_guard(3), 3, 3.1)
          assert abs(_v - 9.6) < 1e-6, "The tangent to x*x at 3 is 9 + 6(x - 3). At 3.1 it is 9.6, and you returned " + repr(_v)
          _v = linear_estimate(_guard(3), 3, 2)
          assert abs(_v - 3) < 1e-6, "The tangent to x*x at 3 has the value 9 + 6 * (-1) = 3 at x = 2, and you returned " + repr(_v)
          _v = linear_estimate(_m.sqrt, 100, 101)
          assert abs(_v - 10.05) < 1e-6, "For the square root at 100, the estimate at 101 is 10.05, and you returned " + repr(_v)
          _v = linear_estimate(lambda x: 2 * x + 1, 0, 50)
          assert abs(_v - 101) < 1e-4, "A line is its own tangent, so the estimate for 2x + 1 at 50 is 101, and you returned " + repr(_v)
          assert output.strip() == "10.05", "The program should print 10.05"
        wrong:
          - "import math\n\ndef derivative(f, a):\n    h = 1e-5\n    return (f(a + h) - f(a - h)) / (2 * h)\n\ndef linear_estimate(f, a, x):\n    return f(x)\n\nprint(10.05)\n"
          - "import math\n\ndef derivative(f, a):\n    h = 1e-5\n    return (f(a + h) - f(a - h)) / (2 * h)\n\ndef linear_estimate(f, a, x):\n    return f(a) + derivative(f, a) * x\n\nprint(10.05)\n"
          - "import math\n\ndef derivative(f, a):\n    h = 1e-5\n    return (f(a + h) - f(a - h)) / (2 * h)\n\ndef linear_estimate(f, a, x):\n    return f(a) + derivative(f, a)\n\nprint(10.05)\n"
          - "import math\n\ndef derivative(f, a):\n    h = 1e-5\n    return (f(a + h) - f(a - h)) / (2 * h)\n\ndef linear_estimate(f, a, x):\n    return f(a) + derivative(f, x) * (x - a)\n\nprint(10.05)\n"
        explanation: |
          Old value plus rate times change in input: `f(a) + derivative(f, a) * (x - a)`. The change in input is `x - a`, measured from the point where the tangent was drawn, and the rate is the derivative **at `a`**, not at `x`. For the square at 3 the estimate at 3.1 is 9.6 against a true 9.61, an error of $h^2 = 0.01$. Move ten times closer, to 3.01, and the error falls a hundredfold. That is the mark of a tangent line. For a function that is itself a line, the estimate is exact however far you go.
        hints:
          - The tangent at a passes through the point (a, f(a)).
          - Its slope is derivative(f, a).
          - Multiply the slope by the distance from a, which is x - a.
    - question:
        id: fix-quotient
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `slope(f, a, h)` should return the forward difference quotient $\dfrac{f(a + h) - f(a)}{h}$. For the square at 3 with $h = 0.001$ it should give about 6.001, and it prints a number near $-8991$. Find the mistake and fix it.
        starter: |
          def slope(f, a, h):
              return f(a + h) - f(a) / h

          print(round(slope(lambda x: x * x, 3, 0.001), 3))
        solution: |
          def slope(f, a, h):
              return (f(a + h) - f(a)) / h

          print(round(slope(lambda x: x * x, 3, 0.001), 3))
        tests: |
          _v = slope(lambda x: x * x, 3, 0.001)
          assert abs(_v - 6.001) < 1e-6, "For x*x at 3 with h = 0.001 the quotient is 6.001, and you returned " + repr(_v)
          _v = slope(lambda x: x * x, 3, 1)
          assert abs(_v - 7) < 1e-9, "For x*x at 3 with h = 1 the quotient is (16 - 9) / 1 = 7, and you returned " + repr(_v)
          _v = slope(lambda x: 5 * x + 2, 10, 0.5)
          assert abs(_v - 5) < 1e-9, "For the line 5x + 2 the quotient is 5 for every h, and you returned " + repr(_v)
          _v = slope(lambda x: x * x * x, 1, 2)
          assert abs(_v - 13) < 1e-9, "For the cube at 1 with h = 2 the quotient is (27 - 1) / 2 = 13, and you returned " + repr(_v)
          assert output.strip() == "6.001", "The program should print 6.001"
        wrong:
          - "def slope(f, a, h):\n    return f(a + h) - (f(a) / h)\n\nprint(6.001)\n"
          - "def slope(f, a, h):\n    return (f(a + h) - f(a)) * h\n\nprint(6.001)\n"
          - "def slope(f, a, h):\n    return (f(a) - f(a + h)) / h\n\nprint(6.001)\n"
          - "def slope(f, a, h):\n    return f(a + h) / h - f(a)\n\nprint(6.001)\n"
        explanation: |
          Division is done before subtraction, as you learned with the order of operations. So `f(a + h) - f(a) / h` computes $f(a + h) - \dfrac{f(a)}{h}$: it divides only the second term by $h$. With $h = 0.001$ that is about $9.006 - 9000$. The fraction bar in the mathematics groups the whole top, and code has no fraction bar, so the grouping must be written with parentheses. This is one of the commonest slips in turning a formula into a program, and it gives no error message, only a wrong number. An estimate of the size of the answer, "the slope of this parabola at 3 should be about 6", is what catches it.
        hints:
          - Which operation does Python do first, the subtraction or the division?
          - What is being divided by h in the broken line?
          - Put parentheses round the whole difference.
    - question:
        id: work-best-line
        type: choice
        system: s2
        prompt: |
          Near $a = 1$, two lines through $(1, 1)$ are offered as stand-ins for $f(x) = x^2$: the tangent $T(x) = 1 + 2(x - 1)$ and another line $S(x) = 1 + 3(x - 1)$. At $x = 1 + h$, what are the two errors $f - T$ and $f - S$, and what does that show?
        options:
          - "$h^2$ and $h^2 - h$. The tangent's error shrinks faster than $h$, the other's only as fast as $h$, so for small $h$ the tangent is far better."
          - "$h$ and $2h$. The tangent is twice as good."
          - "$h^2$ and $h^2$. The two lines are equally good."
          - "0 and $h$. The tangent is exact."
        answer: 0
        explanation: |
          $f(1 + h) = 1 + 2h + h^2$. Subtracting $T = 1 + 2h$ leaves $h^2$. Subtracting $S = 1 + 3h$ leaves $h^2 - h$. For $h = 0.01$ the errors are 0.0001 and about $-0.0099$: the tangent is a hundred times closer. Divide each error by $h$: the tangent's gives $h$, which goes to 0, and the other's gives $h - 1$, which does not. That is the defining property of the tangent. Among all lines through the point, it is the only one whose error vanishes faster than the step.
        hints:
          - Expand f at 1 + h.
          - Subtract each line's value at 1 + h.
          - Compare the two errors when h is 0.01.
    - question:
        id: work-step-size
        type: choice
        system: s2
        prompt: |
          A central difference for a smooth function has a mathematical error of about $h^2$, and a rounding error of about $\dfrac{10^{-16}}{h}$ from the subtraction of nearly equal floats. Which $h$ gives the smallest total error, roughly?
        options:
          - "$h = 10^{-1}$, since larger steps avoid rounding."
          - "$h = 10^{-5}$, where the two errors are both around $10^{-10}$ to $10^{-11}$."
          - "$h = 10^{-15}$, since smaller is always more accurate."
          - "$h = 0$."
        answer: 1
        explanation: |
          At $h = 10^{-1}$ the mathematical error is $10^{-2}$, large. At $h = 10^{-15}$ the rounding error is $10^{-1}$, larger still. At $h = 10^{-5}$ the first is $10^{-10}$ and the second $10^{-11}$: both small, and roughly in balance. One error falls as $h$ shrinks and the other rises, so the best choice is in between, where they meet. Making the step smaller is not the same as making the answer better, and $h = 0$ is the $\frac{0}{0}$ that the whole theory of limits exists to avoid.
        hints:
          - Work out both errors for h = 0.1.
          - Work out both errors for h = 1e-15.
          - One error grows as h shrinks and the other shrinks. Where do they balance?
  connections:
    - text: |
        The puzzle asked for the slope of a curve at a single point. The slope at a point is the limit of the slopes of chords through that point, as the second end of the chord is brought in. That limit is the derivative. It is, all at once, the slope of the tangent, the instantaneous rate of change of the output with respect to the input, and the multiplier that turns a small change in the input into the resulting change in the output. A function with a derivative at a point is, near that point, as good as a straight line, with an error that vanishes faster than the step.

        You also saw the derivative become a function in its own right. From $x^2$ came $2x$. From $x^3$ came $3x^2$. Differentiation takes a function and gives back the function of its slopes.

        Every derivative today was dug out of the definition by hand: expand, cancel the $h$, take the limit. That is how you should know it can always be done, and it is not how it is done. The table already shows a pattern, the exponent coming down and dropping by one, and the ball's velocity showed that the derivative of a sum is the sum of the derivatives. A handful of such rules turns differentiation from a problem about limits into a mechanical procedure, one that a program can carry out on any formula whatever. Those rules are the next lesson, [[m10.differentiation-rules]].

        The sign of the derivative told you whether a function is rising or falling, and a zero derivative marked the top of the ball's flight. The way the derivative itself changes says how the curve bends, which is taken up in [[m10.second-derivative-and-curvature]], and the search for points of zero slope becomes a systematic method in [[m10.maxima-and-minima]].

        Here is where all this is going. The error of a model depends on its numbers, its weights, and there may be billions of them. Training asks, for every weight at once: if this weight is nudged, how does the error respond? That is a derivative with respect to each weight, holding the others still, and such a derivative is called partial, in [[m12.partial-derivatives]]. Collect them all and you have a direction in which to step so that the error falls fastest. Everything in that sentence rests on the limit you defined today.
