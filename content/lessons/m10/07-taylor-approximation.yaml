  work:
    - text: Slower now. For each estimate, say which term you stopped at and how large the next one would have been.
    - question:
        id: work-sin-half
        type: numeric
        system: s2
        tolerance: "0.0001"
        prompt: |
          Estimate $\sin 0.5$ with the Taylor polynomial of degree 3. Give four decimal places.
        answer: "0.4792"
        explanation: |
          $0.5 - \dfrac{0.125}{6} = 0.5 - 0.02083 = 0.47917$. The true value is $0.47943$. The error, $0.00026$, is almost exactly the next term, $\dfrac{0.5^5}{120} = 0.00026$: the first term left out measures the error.
        hints:
          - The polynomial is x minus x cubed over 6.
          - 0.5 cubed is 0.125.
          - Divide 0.125 by 6 and subtract from 0.5.
    - question:
        id: work-terms-needed
        type: choice
        system: s2
        prompt: |
          You sum $1 + 1 + \frac{1}{2!} + \frac{1}{3!} + \dots$ to compute $e$, and want an error below $0.001$. Using the rule that the error is about the first term left out, what is the last term you must keep? ($5! = 120$, $6! = 720$, $7! = 5040$.)
        options:
          - "$\\frac{1}{4!}$"
          - "$\\frac{1}{5!}$"
          - "$\\frac{1}{6!}$"
          - "$\\frac{1}{10!}$"
        answer: 2
        explanation: |
          Stopping after $\frac{1}{5!}$ leaves out $\frac{1}{720} \approx 0.0014$, which is too large. Stopping after $\frac{1}{6!}$ leaves out $\frac{1}{5040} \approx 0.0002$, which is small enough. The starter confirms it: after the term with $k = 6$ the total is $2.71806$, an error of $0.00023$. The terms that follow the first omitted one add a little more, but they shrink so fast that the first one dominates.
        hints:
          - Find the first factorial whose reciprocal is below 0.001.
          - 1 over 720 is about 0.0014.
          - The last term kept is the one before the first term that is small enough to drop.
    - question:
        id: work-sigmoid
        type: numeric
        system: s2
        prompt: |
          The sigmoid $\sigma(x) = \dfrac{1}{1 + e^{-x}}$ has $\sigma(0) = \frac{1}{2}$, $\sigma'(0) = \frac{1}{4}$ and $\sigma''(0) = 0$. Use the Taylor polynomial of degree 2 to estimate $\sigma(0.4)$.
        answer: "0.6"
        explanation: |
          $\frac{1}{2} + \frac{1}{4}(0.4) + 0 = 0.6$. The true value is $0.5987$. Because the second derivative is 0 at the origin, the sigmoid's point of inflection, the tangent line is already as good as a parabola, and the first correction is the cubic term $-\frac{x^3}{48}$, which is $-0.0013$ here. Near 0 a sigmoid is, to a very good approximation, the straight line $\frac{1}{2} + \frac{x}{4}$. A network whose inputs to its sigmoids all stay small behaves almost like one with no bending in it at all.
        hints:
          - Value, plus slope times step, plus half the second derivative times the step squared.
          - The last term is zero here.
          - A quarter of 0.4 is 0.1.
    - question:
        id: write-exp-series
        type: code
        mode: write
        system: s2
        prompt: |
          Write `exp_series(x, terms)`. It returns the sum of the first `terms` terms of

          $$1 + x + \frac{x^2}{2!} + \frac{x^3}{3!} + \dots$$

          so `exp_series(x, 1)` is 1 and `exp_series(x, 3)` is $1 + x + \frac{x^2}{2}$. With `terms = 0` it returns 0.

          Do not compute any factorial or power. Build each term from the one before: the term in $x^{k+1}$ is the term in $x^k$ multiplied by $x$ and divided by $k + 1$.
        starter: |
          def exp_series(x, terms):
              # Replace the next line with your own.
              return 0

          print(round(exp_series(1, 10), 6))
        solution: |
          def exp_series(x, terms):
              total = 0
              term = 1
              for k in range(terms):
                  total = total + term
                  term = term * x / (k + 1)
              return total

          print(round(exp_series(1, 10), 6))
        tests: |
          import math as _m
          assert exp_series(3, 0) == 0, "With no terms the sum is 0"
          assert exp_series(3, 1) == 1, "The first term is 1 whatever x is. You returned " + repr(exp_series(3, 1))
          assert exp_series(3, 2) == 4, "The first two terms are 1 + x, which is 4 at x = 3. You returned " + repr(exp_series(3, 2))
          assert abs(exp_series(2, 3) - 5) < 1e-12, "Three terms at x = 2 are 1 + 2 + 2 = 5. You returned " + repr(exp_series(2, 3))
          assert abs(exp_series(2, 4) - 19 / 3) < 1e-12, "Four terms at x = 2 are 1 + 2 + 2 + 8/6. You returned " + repr(exp_series(2, 4))
          assert abs(exp_series(1, 20) - _m.e) < 1e-12, "Twenty terms at x = 1 should give e. You returned " + repr(exp_series(1, 20))
          assert abs(exp_series(-1, 20) - 1 / _m.e) < 1e-12, "Twenty terms at x = -1 should give 1/e. You returned " + repr(exp_series(-1, 20))
          assert abs(exp_series(0.5, 20) - _m.exp(0.5)) < 1e-12, "Twenty terms at x = 0.5 should give the square root of e"
          assert "factorial" not in source and "**" not in source, "Build each term from the one before, with no factorial and no power"
          assert output.strip() == "2.718282", "The program should print 2.718282"
        wrong:
          - "def exp_series(x, terms):\n    total = 0\n    term = 1\n    for k in range(terms):\n        total = total + term\n        term = term * x\n    return total\n\nprint(2.718282)\n"
          - "def exp_series(x, terms):\n    total = 0\n    term = 1\n    for k in range(terms):\n        term = term * x / (k + 1)\n        total = total + term\n    return total\n\nprint(2.718282)\n"
          - "def exp_series(x, terms):\n    total = 0\n    term = 1\n    for k in range(terms):\n        total = total + term\n        term = term * x / (k + 2)\n    return total\n\nprint(2.718282)\n"
          - "def exp_series(x, terms):\n    total = 1\n    term = 1\n    for k in range(terms):\n        total = total + term\n        term = term * x / (k + 1)\n    return total\n\nprint(2.718282)\n"
          - "def exp_series(x, terms):\n    total = 0\n    term = 1\n    for k in range(terms):\n        total = total + term\n        term = term / (k + 1)\n    return total\n\nprint(2.718282)\n"
        explanation: |
          The ratio of one term to the one before is $\dfrac{x^{k+1}/(k+1)!}{x^k/k!} = \dfrac{x}{k + 1}$. So a running `term`, multiplied by that ratio after each use, walks through the whole series. This is how such sums are computed in practice: $x^{20}$ and $20!$ are both huge, and dividing one by the other loses accuracy, while the running term stays a modest size throughout. The order of the two lines in the loop matters. The term must be added **before** it is advanced, or the leading 1 is skipped.
        hints:
          - Keep two variables, a running total and the current term, which starts at 1.
          - Inside the loop, add the term to the total first.
          - Then replace the term by term * x / (k + 1).
    - question:
        id: fix-sin-series
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `sin_series(x, terms)` should add up the first `terms` terms of $x - \frac{x^3}{3!} + \frac{x^5}{5!} - \dots$ With six terms at $x = 1$ it should print 0.841471, which is $\sin 1$. It prints 1.175201. Fix it.
        starter: |
          def sin_series(x, terms):
              total = 0
              term = x
              for k in range(terms):
                  total = total + term
                  term = term * x * x / ((2 * k + 2) * (2 * k + 3))
              return total

          print(round(sin_series(1, 6), 6))
        solution: |
          def sin_series(x, terms):
              total = 0
              term = x
              for k in range(terms):
                  total = total + term
                  term = -term * x * x / ((2 * k + 2) * (2 * k + 3))
              return total

          print(round(sin_series(1, 6), 6))
        tests: |
          import math as _m
          assert sin_series(0.5, 1) == 0.5, "The first term is x itself"
          assert abs(sin_series(0.5, 2) - (0.5 - 0.125 / 6)) < 1e-12, "Two terms at 0.5 are 0.5 - 0.125/6 = 0.479167. You returned " + repr(sin_series(0.5, 2))
          assert abs(sin_series(2, 3) - (2 - 8 / 6 + 32 / 120)) < 1e-12, "Three terms at 2 are 2 - 8/6 + 32/120. You returned " + repr(sin_series(2, 3))
          for _x in [-2, -0.3, 0, 0.5, 1, 3]:
              assert abs(sin_series(_x, 15) - _m.sin(_x)) < 1e-9, "Fifteen terms at x = " + str(_x) + " should give sin x = " + str(_m.sin(_x)) + " and you returned " + repr(sin_series(_x, 15))
          assert output.strip() == "0.841471", "The program should print 0.841471"
        wrong:
          - "def sin_series(x, terms):\n    total = 0\n    term = x\n    for k in range(terms):\n        total = total + term\n        term = term * x * x / ((2 * k + 2) * (2 * k + 3))\n    return total\n\nprint(0.841471)\n"
          - "def sin_series(x, terms):\n    total = 0\n    term = x\n    for k in range(terms):\n        total = total - term\n        term = term * x * x / ((2 * k + 2) * (2 * k + 3))\n    return total\n\nprint(0.841471)\n"
          - "def sin_series(x, terms):\n    total = 0\n    term = x\n    for k in range(terms):\n        total = total + term\n        term = -term * x / ((2 * k + 2) * (2 * k + 3))\n    return total\n\nprint(0.841471)\n"
          - "def sin_series(x, terms):\n    total = 0\n    term = x\n    for k in range(terms):\n        total = total + term\n        term = -term * x * x / (2 * k + 3)\n    return total\n\nprint(0.841471)\n"
        explanation: |
          The signs of the sine's series alternate, because its derivatives at 0 run $1, 0, -1, 0, 1, \dots$ The starter never changed sign, so it added $x + \frac{x^3}{3!} + \frac{x^5}{5!} + \dots$ The fix is one minus sign in the line that advances the term. The rest was right: from the term in $x^{2k+1}$ to the next, the power rises by two, so multiply by $x^2$, and the factorial gains the two factors $(2k + 2)(2k + 3)$. The series with all signs positive is a function in its own right, the hyperbolic sine, which is $\frac{e^x - e^{-x}}{2}$, and that is what 1.175201 was.
        hints:
          - Write out the first three terms the loop adds, with their signs.
          - Compare with x minus x cubed over 6 plus x to the fifth over 120.
          - Each new term should have the opposite sign to the one before.
    - question:
        id: write-newton
        type: code
        mode: write
        system: s2
        prompt: |
          Write `newton(f, df, x, steps)`. Starting from the guess `x`, it applies Newton's step

          $$x \leftarrow x - \frac{f(x)}{f'(x)}$$

          `steps` times and returns the result. `f` is the function and `df` is its derivative. With `steps = 0` it returns `x` unchanged.
        starter: |
          def newton(f, df, x, steps):
              # Replace the next line with your own.
              return x

          print(round(newton(lambda x: x * x - 2, lambda x: 2 * x, 1, 5), 10))
        solution: |
          def newton(f, df, x, steps):
              for step in range(steps):
                  x = x - f(x) / df(x)
              return x

          print(round(newton(lambda x: x * x - 2, lambda x: 2 * x, 1, 5), 10))
        tests: |
          import math as _m
          _f = lambda x: x * x - 2
          _df = lambda x: 2 * x
          assert newton(_f, _df, 1, 0) == 1, "With no steps the guess is returned unchanged"
          assert newton(_f, _df, 1, 1) == 1.5, "One step from 1 gives 1 - (-1)/2 = 1.5. You returned " + repr(newton(_f, _df, 1, 1))
          assert abs(newton(_f, _df, 1, 2) - 17 / 12) < 1e-12, "Two steps from 1 give 17/12 = 1.41666... You returned " + repr(newton(_f, _df, 1, 2))
          assert abs(newton(_f, _df, 1, 6) - _m.sqrt(2)) < 1e-12, "Six steps from 1 should give the square root of 2. You returned " + repr(newton(_f, _df, 1, 6))
          assert abs(newton(_f, _df, -1, 6) + _m.sqrt(2)) < 1e-12, "Starting from -1 the method finds the negative root"
          assert abs(newton(lambda x: 3 * x - 12, lambda x: 3, 100, 1) - 4) < 1e-12, "For a straight line the tangent is the function, so one step lands on the root"
          assert abs(newton(lambda x: x ** 3 - 27, lambda x: 3 * x * x, 5, 8) - 3) < 1e-12, "The cube root of 27 is 3. You returned " + repr(newton(lambda x: x ** 3 - 27, lambda x: 3 * x * x, 5, 8))
          assert abs(newton(lambda x: _m.exp(x) - 5, _m.exp, 1, 8) - _m.log(5)) < 1e-12, "Solving e^x = 5 should give ln 5"
          assert output.strip() == "1.4142135624", "The program should print 1.4142135624"
        wrong:
          - "def newton(f, df, x, steps):\n    for step in range(steps):\n        x = x + f(x) / df(x)\n    return x\n\nprint(1.4142135624)\n"
          - "def newton(f, df, x, steps):\n    for step in range(steps):\n        x = x - df(x) / f(x)\n    return x\n\nprint(1.4142135624)\n"
          - "def newton(f, df, x, steps):\n    if steps == 0:\n        return x\n    return x - f(x) / df(x)\n\nprint(1.4142135624)\n"
          - "def newton(f, df, x, steps):\n    for step in range(steps):\n        x = x - f(x) * df(x)\n    return x\n\nprint(1.4142135624)\n"
          - "def newton(f, df, x, steps):\n    start = x\n    for step in range(steps):\n        x = x - f(x) / df(start)\n    return x\n\nprint(1.4142135624)\n"
        explanation: |
          Each pass replaces the function by its tangent at the current guess and moves to the place where that tangent crosses zero. The tangent at $x$ is $f(x) + f'(x)(t - x)$, which is 0 at $t = x - \frac{f(x)}{f'(x)}$. For a straight line the tangent **is** the function, so one step solves it from any start, and that makes a good test. Both the value and the derivative must be taken at the **current** $x$ on every pass. Five steps from 1 give $\sqrt{2}$ to ten places. For $x^2 - c$ the step simplifies to $\frac{1}{2}\left(x + \frac{c}{x}\right)$, the average of the guess and $c$ divided by the guess, a rule for square roots that is about four thousand years old.
        hints:
          - One step is x = x - f(x) / df(x).
          - Put it in a loop that runs steps times.
          - Return x after the loop.
    - question:
        id: work-central-error
        type: choice
        system: s2
        prompt: |
          With step $h$, the one-sided difference has error about $\frac{1}{2}f''(a)h$ and the central difference about $\frac{1}{6}f'''(a)h^2$. For $f(x) = e^x$ at $a = 0$, where every derivative is 1, you reduce $h$ from $10^{-2}$ to $10^{-3}$. What happens to the two errors?
        options:
          - "Both become 10 times smaller."
          - "The one-sided error becomes 10 times smaller and the central error 100 times smaller."
          - "Both become 100 times smaller."
          - "The one-sided error becomes 100 times smaller and the central error 10 times smaller."
        answer: 1
        explanation: |
          The one-sided error is proportional to $h$: it goes from about $0.005$ to about $0.0005$. The central error is proportional to $h^2$: from about $1.7 \times 10^{-5}$ to about $1.7 \times 10^{-7}$. The central difference starts more accurate and improves faster. The reason is the cancellation of the $h^2$ terms of the two Taylor polynomials, which have the same sign for a step forward and a step back. This is why every gradient check in this course has used the central form.
        hints:
          - Which power of h does each error contain?
          - Dividing h by 10 divides h squared by 100.
          - Put the numbers in. Half of 0.01, and a sixth of 0.0001.
    - question:
        id: work-newton-digits
        type: choice
        system: s2
        prompt: |
          Newton's method is closing in on a root. The error after one step is about $10^{-2}$ and after the next about $10^{-4}$. Roughly what will it be after one more step, and why?
        options:
          - "$10^{-5}$, since each step adds one correct figure."
          - "$10^{-6}$, since each step adds two correct figures."
          - "$10^{-8}$, since the tangent's error is proportional to the square of the distance, so each step roughly squares the error."
          - "$0$, since the method is exact after three steps."
        answer: 2
        explanation: |
          The new guess is the root of the tangent line, and the tangent departs from the curve by about $\frac{1}{2}f''h^2$ at distance $h$. So a guess that is off by $h$ produces one that is off by something proportional to $h^2$. From $10^{-2}$ to $10^{-4}$ to $10^{-8}$: the number of correct figures doubles each time. A method that only followed the slope downhill by small fixed steps would gain a fixed number of figures per step. Using the local stand-in to jump straight to its solution is what makes Newton's method so fast, and the price is the need for a derivative and a decent starting guess.
        hints:
          - How does the error of a tangent line depend on the distance from the point of tangency?
          - If the error is squared each time, what follows one part in ten thousand?
          - Compare with the table for the square root of 2.
    - question:
        id: work-small-angle
        type: choice
        system: s2
        prompt: |
          A model's output is $\ln(1 + x)$ where $x$ is a small positive number, about $10^{-3}$. A colleague replaces it by $x$ to save time. Roughly how large is the error they introduce, and in which direction?
        options:
          - "About $10^{-3}$, and $x$ is too small."
          - "About $5 \\times 10^{-7}$, and $x$ is too large."
          - "About $10^{-9}$, and $x$ is too small."
          - "There is no error. The two are equal for small $x$."
        answer: 1
        explanation: |
          $\ln(1 + x) = x - \frac{x^2}{2} + \dots$, so replacing it by $x$ leaves out $-\frac{x^2}{2} = -5 \times 10^{-7}$. The logarithm is a little **less** than $x$, so $x$ overestimates. That agrees with the inequality from the last lesson, $\ln x \le x - 1$, which says the same thing with $1 + x$ in place of $x$. The relative error is $\frac{x}{2}$, one part in two thousand. Whether that is acceptable depends on the use, and now you can say what the cost is instead of guessing.
        hints:
          - Write down the first two terms of the series for the logarithm of 1 + x.
          - The error is about the first term left out.
          - Half of ten to the minus 6.
  connections:
    - text: |
        The puzzle asked how a machine that can only do arithmetic produces a sine. It evaluates a polynomial. The derivatives of the sine at 0 are known exactly, they give the coefficients $1, -\frac{1}{6}, \frac{1}{120}, \dots$, and a few terms of $x - \frac{x^3}{6} + \frac{x^5}{120} - \dots$ agree with the sine to as many figures as are wanted. The exponential, the cosine and the logarithm are handled in the same way. The functions that were defined by limits and circles have become sums you can compute.

        The idea underneath was the one from the last two lessons, carried to the end. A tangent line matches a function's value and slope at a point. Match the second derivative as well and you have a parabola, the third and you have a cubic, and the $k$th derivative divided by $k!$ is always the coefficient. The same expansions explained why the central difference is so accurate, a fact you had been using on trust, and they gave Newton's method: replace the function by its tangent, solve that, and repeat.

        Newton's method found where a function is **zero**. The question asked far more often is where a function is **smallest**: the error of a model, the cost of a plan, the time of a program. At a smallest point the tangent is level, so the derivative is zero there, and finding such a point is a matter of solving $f'(x) = 0$. The quadratic term of the Taylor polynomial then says whether you have found a valley or a hilltop. That is the next lesson, [[m10.maxima-and-minima]], where the two halves of this one, local stand-ins and repeated steps, become a method for training.

        Further on, the rule of thumb that the error is about the first omitted term becomes a theorem with a proof in [[m11.taylors-theorem-with-remainder]], and the question of when an endless sum has a value at all is taken up in [[m11.series-and-convergence-tests]]. Newton's idea, applied to minimising a function of many variables, returns in [[m19.newton-and-quasi-newton-methods]].
