  work:
    - text: Slower now. When substituting gives 0 over 0, rewrite before you take the limit.
    - question:
        id: work-conjugate
        type: numeric
        system: s2
        prompt: |
          $\displaystyle\lim_{x \to 9} \frac{\sqrt{x} - 3}{x - 9}$. Answer as a fraction.
        answer: "1/6"
        explanation: |
          Multiply top and bottom by $\sqrt{x} + 3$. The top becomes $x - 9$, which cancels with the bottom for $x \ne 9$, leaving $\dfrac{1}{\sqrt{x} + 3}$. That is continuous at 9, where it equals $\dfrac{1}{6}$. Equivalently, factor the bottom as $(\sqrt{x} - 3)(\sqrt{x} + 3)$.
        hints:
          - Substituting gives 0 over 0, so rewrite first.
          - Multiply the top and the bottom by the square root of x plus 3.
          - After cancelling, substitute 9.
    - question:
        id: work-stone
        type: numeric
        system: s2
        unit: metres per second
        prompt: |
          The stone has fallen $5t^2$ metres after $t$ seconds. Its speed at the instant $t = 3$ is the limit of the average speeds $\dfrac{5(3 + h)^2 - 45}{h}$ as $h \to 0$. What is it?
        answer: "30"
        explanation: |
          $5(3 + h)^2 - 45 = 5(9 + 6h + h^2) - 45 = 30h + 5h^2$. Dividing by $h \ne 0$ gives $30 + 5h$, which approaches 30. At $t = 1$ the speed was 10 and at $t = 3$ it is 30: the speed at time $t$ appears to be $10t$. The next lesson shows that this is no accident.
        hints:
          - Expand the square and multiply by 5.
          - The 45s cancel. Then divide by h.
          - Let h shrink to nothing in what is left.
    - question:
        id: work-make-continuous
        type: numeric
        system: s2
        prompt: |
          $f(x) = x^2 + 1$ for $x < 2$ and $f(x) = kx - 3$ for $x \ge 2$. For which value of $k$ is $f$ continuous at 2?
        answer: "4"
        explanation: |
          The left limit is $2^2 + 1 = 5$. The right limit, which is also the value at 2, is $2k - 3$. Continuity needs them equal: $2k - 3 = 5$, so $k = 4$. With any other $k$ there is a jump at 2.
        hints:
          - Find the limit from the left by substituting into the first formula.
          - Find the limit from the right in terms of k.
          - Set the two equal and solve.
    - question:
        id: work-squeeze
        type: choice
        system: s2
        prompt: |
          What is $\displaystyle\lim_{x \to 0} x^2 \sin\!\left(\frac{1}{x}\right)$, and why?
        options:
          - "It does not exist, because $\\sin\\frac{1}{x}$ has no limit at 0."
          - "It is 0, because $-x^2 \\le x^2 \\sin\\frac{1}{x} \\le x^2$ and both outer functions approach 0."
          - "It is 1, because $\\dfrac{\\sin x}{x} \\to 1$."
          - "It is 0, by the product law, since $x^2 \\to 0$."
        answer: 1
        explanation: |
          The sine of anything lies between $-1$ and 1, so the product lies between $-x^2$ and $x^2$, and both of those approach 0. The squeeze gives 0. The product law cannot be used, because it needs **both** factors to have limits, and $\sin\frac{1}{x}$ has none. The answer in the last option is right and its reason is wrong, which in mathematics makes it wrong. The wild factor is tamed by the factor that shrinks.
        hints:
          - Between which two numbers does every sine lie?
          - Multiply that inequality through by x squared.
          - Does the product law apply when one factor has no limit?
    - question:
        id: write-slopes
        type: code
        mode: write
        system: s2
        prompt: |
          Write `average_rates(f, a)`. It returns a list of the three average rates of change of `f` between `a` and `a + h`,

          $$\frac{f(a + h) - f(a)}{h},$$

          for `h` equal to 0.1, 0.01 and 0.001, in that order, each rounded to 4 decimal places with `round`.

          For the falling stone, `average_rates(fallen, 1)` should be `[10.5, 10.05, 10.005]`.
        starter: |
          def fallen(t):
              return 5 * t * t

          def average_rates(f, a):
              # Replace the next line with your own.
              return []

          print(average_rates(fallen, 1))
        solution: |
          def fallen(t):
              return 5 * t * t

          def average_rates(f, a):
              return [round((f(a + h) - f(a)) / h, 4) for h in [0.1, 0.01, 0.001]]

          print(average_rates(fallen, 1))
        tests: |
          assert average_rates(lambda t: 5 * t * t, 1) == [10.5, 10.05, 10.005], "For the stone at t = 1 the three rates are 10.5, 10.05 and 10.005. You returned " + repr(average_rates(lambda t: 5 * t * t, 1))
          assert average_rates(lambda t: 5 * t * t, 3) == [30.5, 30.05, 30.005], "For the stone at t = 3 the three rates are 30.5, 30.05 and 30.005"
          assert average_rates(lambda x: 3 * x + 1, 7) == [3.0, 3.0, 3.0], "For a straight line of slope 3 every average rate is 3"
          assert average_rates(lambda x: x * x * x, 2) == [12.61, 12.0601, 12.006], "For the cube at 2 the rates are 12.61, 12.0601 and 12.006. Check that the stretch runs from a to a + h"
          assert len(average_rates(lambda x: x, 0)) == 3, "Return exactly three rates"
          assert "[10.5, 10.05, 10.005]" in output, "The program should print the three rates for the stone"
        wrong:
          - "def fallen(t):\n    return 5 * t * t\n\ndef average_rates(f, a):\n    return [round(f(a + h) / h, 4) for h in [0.1, 0.01, 0.001]]\n\nprint([10.5, 10.05, 10.005])\n"
          - "def fallen(t):\n    return 5 * t * t\n\ndef average_rates(f, a):\n    return [round((f(a + h) - f(a)), 4) for h in [0.1, 0.01, 0.001]]\n\nprint([10.5, 10.05, 10.005])\n"
          - "def fallen(t):\n    return 5 * t * t\n\ndef average_rates(f, a):\n    return [round((f(h) - f(a)) / h, 4) for h in [0.1, 0.01, 0.001]]\n\nprint([10.5, 10.05, 10.005])\n"
          - "def fallen(t):\n    return 5 * t * t\n\ndef average_rates(f, a):\n    return [10.5, 10.05, 10.005]\n\nprint([10.5, 10.05, 10.005])\n"
        explanation: |
          Each rate is a change in output divided by the change in input that caused it: $f(a + h) - f(a)$ over $h$. For the stone the three numbers are $10 + 5h$ for the three values of $h$, and they close in on 10. For a straight line every rate is the slope, whatever $h$ is, which is what makes a line a line. The function never divides by zero, because $h$ is never 0. It gives evidence for a limit and cannot give more: three values are three values. In the next lesson this quotient gets a name and its limit gets a definition.
        hints:
          - One rate is (f(a + h) - f(a)) / h.
          - Build the list with a comprehension over the three values of h.
          - Round each rate to 4 places inside the comprehension.
    - question:
        id: write-limit-exists
        type: code
        mode: write
        system: s2
        prompt: |
          Write `sides_agree(f, a)`. It looks at `f` just to the left and just to the right of `a`, at `a - h` and `a + h` with `h = 1e-6`, and returns `True` if the two values are within `1e-3` of each other and `False` otherwise. It must **never** call `f(a)` itself, since `f` may be undefined there.

          This is a numerical test for whether the two one-sided limits agree. It is evidence and not proof.
        starter: |
          def sides_agree(f, a):
              # Replace the next line with your own.
              return True

          def hole(x):
              return (x * x - 1) / (x - 1)

          def charge(kg):
              return 1 if kg < 2 else 3

          print(sides_agree(hole, 1), sides_agree(charge, 2))
        solution: |
          def sides_agree(f, a):
              h = 1e-6
              return abs(f(a + h) - f(a - h)) < 1e-3

          def hole(x):
              return (x * x - 1) / (x - 1)

          def charge(kg):
              return 1 if kg < 2 else 3

          print(sides_agree(hole, 1), sides_agree(charge, 2))
        tests: |
          def _hole(x):
              assert x != 1, "Your function called f at the point a itself. The limit must not look there, and here f is undefined at 1."
              return (x * x - 1) / (x - 1)
          def _step(x):
              return 1 if x < 2 else 3
          assert sides_agree(_hole, 1) is True, "The line with a hole at 1 has the same limit, 2, from both sides"
          assert sides_agree(_step, 2) is False, "The charge is 1 just below 2 and 3 just above, so the sides disagree"
          assert sides_agree(_step, 1) is True, "Away from the jump, at 1, the charge is the same on both sides"
          assert sides_agree(lambda x: x * x, 3) is True, "A polynomial has the same limit from both sides"
          assert sides_agree(lambda x: abs(x) / x, 0) is False, "abs(x) / x is -1 on the left of 0 and 1 on the right"
          assert sides_agree(lambda x: 3 if x < 2 else 1, 2) is False, "A function that drops from 3 to 1 at 2 has sides that disagree. Compare the distance between the two values, not their signed difference."
          assert sides_agree(lambda x: -1 if x < 5 else -1.0005, 5) is True, "Values within 0.001 of each other count as agreeing"
          assert output.split() == ["True", "False"], "The program should print True and then False"
        wrong:
          - "def sides_agree(f, a):\n    return f(a) == f(a)\n\nprint(True, False)\n"
          - "def sides_agree(f, a):\n    h = 1e-6\n    return abs(f(a + h) - f(a)) < 1e-3\n\nprint(True, False)\n"
          - "def sides_agree(f, a):\n    h = 1e-6\n    return f(a + h) - f(a - h) < 1e-3\n\nprint(True, False)\n"
          - "def sides_agree(f, a):\n    h = 1e-6\n    return abs(f(a + h) - f(a + 2 * h)) < 1e-3\n\nprint(True, False)\n"
        explanation: |
          The limit at $a$ exists exactly when the left and right limits exist and agree, so the function samples one point on each side and compares. The absolute value matters: without it a large drop across the point, a negative difference, would count as agreement. And the point $a$ is never touched, which is the whole spirit of a limit. Be clear about what this test cannot do. It samples one $h$. A function such as $\sin\frac{1}{x}$ can pass it by luck, and no finite number of samples can settle a statement that begins "for every $\varepsilon$". The algebra and the squeeze are what prove limits. The code tells you what to try to prove.
        hints:
          - Evaluate f at a - h and at a + h, with h equal to 1e-6.
          - Compare the two values with abs, so the order of subtraction does not matter.
          - Return whether that distance is below 1e-3.
    - question:
        id: fix-bisect
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `bisect(f, lo, hi, tol)` should trap a root of a continuous `f` that has opposite signs at `lo` and `hi`, and return the midpoint of a trap narrower than `tol`. This version keeps the **wrong half**: with $f(x) = x^2 - 2$ on the interval from 1 to 2 it returns a number very close to 2, where $f$ is 2 and not 0. Fix it so that it closes in on $\sqrt{2} = 1.41421\ldots$
        starter: |
          def bisect(f, lo, hi, tol):
              while hi - lo > tol:
                  mid = (lo + hi) / 2
                  if f(lo) * f(mid) <= 0:
                      lo = mid
                  else:
                      hi = mid
              return (lo + hi) / 2

          print(round(bisect(lambda x: x * x - 2, 1, 2, 1e-9), 5))
        solution: |
          def bisect(f, lo, hi, tol):
              while hi - lo > tol:
                  mid = (lo + hi) / 2
                  if f(lo) * f(mid) <= 0:
                      hi = mid
                  else:
                      lo = mid
              return (lo + hi) / 2

          print(round(bisect(lambda x: x * x - 2, 1, 2, 1e-9), 5))
        tests: |
          _r = bisect(lambda x: x * x - 2, 1, 2, 1e-9)
          assert abs(_r - 2 ** 0.5) < 1e-6, "For x*x - 2 between 1 and 2 the root is 1.41421..., and you returned " + repr(_r)
          _r = bisect(lambda x: 2 - x * x, 1, 2, 1e-9)
          assert abs(_r - 2 ** 0.5) < 1e-6, "The same root must be found when the function goes from positive to negative. You returned " + repr(_r)
          _r = bisect(lambda x: x * x * x - x - 1, 1, 2, 1e-9)
          assert abs(_r ** 3 - _r - 1) < 1e-6, "For x^3 - x - 1 between 1 and 2 you returned " + repr(_r) + ", which is not a root"
          _r = bisect(lambda x: x - 0.1, 0, 1, 1e-9)
          assert abs(_r - 0.1) < 1e-6, "For x - 0.1 between 0 and 1 the root is 0.1, and you returned " + repr(_r)
          assert output.strip() == "1.41421", "The program should print 1.41421"
        wrong:
          - "def bisect(f, lo, hi, tol):\n    while hi - lo > tol:\n        mid = (lo + hi) / 2\n        if f(mid) <= 0:\n            lo = mid\n        else:\n            hi = mid\n    return (lo + hi) / 2\n\nprint(1.41421)\n"
          - "def bisect(f, lo, hi, tol):\n    while hi - lo > tol:\n        mid = (lo + hi) / 2\n        if f(lo) * f(mid) <= 0:\n            lo = mid\n        else:\n            hi = mid\n    return (lo + hi) / 2\n\nprint(1.41421)\n"
          - "def bisect(f, lo, hi, tol):\n    return (lo + hi) / 2\n\nprint(1.41421)\n"
        explanation: |
          The test `f(lo) * f(mid) <= 0` says that the sign changes between `lo` and `mid`. By the intermediate value theorem a root lies in that left half, so the left half must be **kept**: `hi` moves down to `mid`. The broken version moved `lo` up instead, throwing away the half with the root and keeping a half across which the function need not change sign at all. Nothing then guarantees a root in the trap, and the trap shrinks towards a point that is no root. The invariant of the loop is the thing to hold on to: **the function has opposite signs, or a zero, at the two ends of the trap**. Each pass must preserve it. A version that tests only the sign of `f(mid)` works when the function rises through zero and fails when it falls through, which is why the product of the two values is used.
        hints:
          - When the sign changes between lo and mid, which half contains a root?
          - To keep the left half, which end of the trap must move?
          - Swap the two assignments.
    - question:
        id: work-float-limit
        type: choice
        system: s2
        prompt: |
          A program estimates $\displaystyle\lim_{h \to 0} \frac{5(1 + h)^2 - 5}{h}$ by computing the quotient for $h = 10^{-1}, 10^{-2}, \dots, 10^{-16}$. The results approach 10 down to about $h = 10^{-8}$, then get worse, and at $h = 10^{-16}$ the program prints 0.0. What is the best account of this?
        options:
          - "The limit is really 0, and the earlier values were misleading."
          - "The limit does not exist."
          - "The limit is 10. A float keeps about sixteen significant digits, so for tiny $h$ the two nearly equal numbers on top lose almost all their digits when subtracted, and at $10^{-16}$ the sum $1 + h$ is stored as exactly 1."
          - "Python cannot divide by small numbers."
        answer: 2
        explanation: |
          The algebra settles the limit: the quotient is $10 + 5h$ for every $h \ne 0$, and that approaches 10. The computer's trouble is with the subtraction. $5(1 + h)^2$ and 5 agree in more and more leading digits as $h$ shrinks, and a `float` has only about sixteen to give, so their difference is known to fewer and fewer. Dividing by $h$ then magnifies the damage. At $h = 10^{-16}$ the number $1 + h$ cannot be told apart from 1, the top is exactly 0, and the quotient is 0. A limit is defined by what happens for **every** small $h$, in exact arithmetic. A table of floating-point values is a hint, to be believed only while it agrees with the mathematics.
        hints:
          - Simplify the quotient by algebra, for h not equal to 0.
          - How many significant digits does a float keep?
          - What is 1 + 1e-16 when stored as a float?
  connections:
    - text: |
        The puzzle asked what a speed at an instant could mean, when distance over time has no value for a stretch of no length. The answer is a limit: the number that the average speeds over shorter and shorter stretches close in on. The limit of a function is defined by the same game as the limit of a sequence, with a distance $\delta$ in place of a position $N$, and with one new rule that carries all the weight: the point itself is never looked at.

        You have also seen how limits are found in practice. Continuity makes most of them a matter of substituting. The interesting ones are the forms $\frac{0}{0}$, and they give way to algebra, by factoring, expanding or a conjugate, or to a squeeze between two functions that are understood. And you have seen continuity put to work, in the intermediate value theorem and the bisection method that falls out of it.

        Every quotient you met today of the shape

        $$\frac{f(a + h) - f(a)}{h}$$

        was the same thing in disguise: a change in output over the change in input that caused it, with the input change shrinking to nothing. Its limit is the most important limit there is. It is the speed of the stone, the slope of a curve, the rate at which a model's error responds when one of its numbers is nudged. It is called the derivative, and it is the subject of the next lesson, [[m10.derivative-as-slope-and-rate]]. The limit $\dfrac{\sin x}{x} \to 1$ will return when you find the slopes of the sine and cosine, in [[m10.derivatives-of-exp-log-and-trig]].

        Two things were taken on trust today: the intermediate value theorem itself, and the continuity of the sine, the exponential and the logarithm. Both rest on a property of the real numbers that separates them from the rationals, and both are proved when the course returns to these foundations in [[m11.intermediate-and-extreme-value-theorems]] and [[m11.epsilon-delta-continuity-and-uniform-continuity]].

        In machine learning, continuity is the assumption underneath everything. A model is trained by changing its numbers a little and seeing whether the error falls a little. That only makes sense if small changes in the numbers cause small changes in the error, which is continuity, and if the rate of that change can be measured, which is tomorrow's lesson. Where a model contains a jump, a rounding or a hard yes-or-no decision, training by small steps has nothing to hold on to, and a great deal of ingenuity in the subject goes into replacing jumps with continuous stand-ins.
