concept: m10.derivatives-of-exp-log-and-trig
minutes: 105
claim: You can differentiate exponentials, logarithms, sines, cosines and tangents, explain why the base e and the unit radian make their derivatives clean, prove the power rule for every real exponent, and differentiate the sigmoid and softplus functions used inside neural networks.
recalls: [m10.chain-rule]
uses: [m10.differentiation-rules, m10.derivative-as-slope-and-rate, m10.limits-and-continuity, m2.the-exponential-and-e, m2.trigonometric-functions-on-the-unit-circle, m2.composition-and-inverses, m1.logarithms, m1.exponent-laws, m3.induction-and-strong-induction, m3.cases-and-counterexamples, e0.functions, e0.loops, e1.modules-and-imports, e1.classes-and-objects, e1.special-methods-and-operator-overloading, e1.comprehensions-and-iterators]
leads: [m10.second-derivative-and-curvature, m10.taylor-approximation, m10.integration-techniques, l5.activation-functions, m20.surprise-and-entropy]
starter: |
  # Scratch space. Slope of b ** x at x = 0, for three bases.
  import math

  h = 1e-6
  for b in [2, 2.5, math.e, 3]:
      print(b, (b ** h - 1) / h)
parts:
  recall:
    - text: |
        [[m10.chain-rule]] completed the rules for building functions. What is still missing is raw material. Every function you can differentiate so far is made from powers of $x$. The exponential, the logarithm and the trigonometric functions are not, and today they join the table. Three quick pulls first.
    - question:
        id: recall-chain
        type: numeric
        system: s1
        concepts: [m10.chain-rule]
        prompt: |
          $y = (5x + 1)^2$. What is $\dfrac{dy}{dx}$ at $x = 0$?
        answer: "10"
        explanation: |
          $2(5x + 1) \cdot 5$, which is $2 \cdot 1 \cdot 5$ at 0.
    - question:
        id: recall-inverse-rate
        type: choice
        system: s1
        concepts: [m10.chain-rule]
        prompt: |
          $g$ is the inverse of $f$. What is $g'(y)$?
        options:
          - "$f'(y)$"
          - "$\\dfrac{1}{f'(g(y))}$"
          - "$-f'(g(y))$"
          - "$\\dfrac{1}{f(y)}$"
        answer: 1
        explanation: The rate of an inverse is the reciprocal of the rate of the original, at the matching point. It came from differentiating f(g(y)) = y.
    - question:
        id: recall-sinc
        type: numeric
        system: s1
        concepts: [m10.limits-and-continuity]
        prompt: |
          $\displaystyle\lim_{h \to 0} \frac{\sin h}{h}$, in radians.
        answer: "1"
        explanation: The squeeze between cos h and 1. It is used today to find the slope of the sine.
  puzzle:
    - text: |
        What is the derivative of $2^x$?

        The power rule comes to mind: bring the exponent down and reduce it by one, giving $x \cdot 2^{x-1}$. Test it at $x = 0$. The formula gives $0 \cdot 2^{-1} = 0$, a level tangent. But $2^x$ is 0.5 at $-1$, 1 at 0 and 2 at 1. It is plainly rising through $x = 0$. **The power rule does not apply.** It is a rule for a variable raised to a constant, $x^2$, and this is a constant raised to a variable, $2^x$. They are different kinds of function, as you were warned two lessons ago.

        So go back to the definition, as one must with any new function.

        $$\frac{2^{a + h} - 2^a}{h} = \frac{2^a \cdot 2^h - 2^a}{h} = 2^a \cdot \frac{2^h - 1}{h}.$$

        The exponent law $2^{a+h} = 2^a \cdot 2^h$ has pulled $2^a$ outside. What is left inside does not involve $a$ at all. So if the limit exists,

        $$\frac{d}{dx}\,2^x = 2^x \cdot L, \qquad\text{where } L = \lim_{h \to 0} \frac{2^h - 1}{h}.$$

        Look at $L$. It is the difference quotient of $2^x$ at 0: **the slope of the curve as it crosses the vertical axis**. So here is a remarkable fact, before any limit has been computed. **The slope of $2^x$ at any point is its height there, times one fixed number.** The function's rate of change is proportional to the function itself. Where it is twice as high, it is twice as steep.

        The starter estimates the fixed number for several bases. For 2 it is about 0.693. For 3 it is about 1.099. For 2.5, about 0.916.

        **What are these numbers? And since the constant is below 1 for base 2 and above 1 for base 3, is there a base in between for which it is exactly 1, so that the function is its own derivative?**
  intuition:
    - text: |
        "Rate of change proportional to the amount present" is the commonest law of growth in nature and in finance. A colony of bacteria with twice as many members produces twice as many new ones per hour. A bank balance twice as large earns twice the interest. A hot cup cools faster the hotter it is compared with the room. A lump of radioactive material decays at a rate proportional to what is left. All of these are described by exponential functions, and the calculation above shows why: an exponential is precisely the kind of function whose slope is a fixed multiple of its height.

        The fixed multiple depends on the base, and the starter shows it increasing steadily with the base: 0.693, then 0.916, then 1.099. By the intermediate value theorem, somewhere between 2.5 and 3 it passes through exactly 1. The starter has already tried the candidate: for $b = e = 2.71828\ldots$ it prints 1.0000005.

        You met $e$ in the cluster on functions as the limit of compound interest paid more and more often, $\left(1 + \frac{1}{n}\right)^n$. It now turns out to be the answer to a different question altogether: **$e$ is the base whose exponential has slope exactly 1 as it crosses the axis.** And then, by the calculation in the puzzle, its slope everywhere equals its height.

        $$\frac{d}{dx}\,e^x = e^x.$$

        A function that is its own derivative. In the figure the curve is $e^x$. Move the point and compare the slope of the tangent with the height of the curve.
    - figure: secant
      props: { fn: exp, at: 0, closeness: 2 }
    - text: |
        That is why $e$ is the natural base. With any other base a constant has to be carried through every calculation. With $e$ the constant is 1 and disappears.

        The same thing happens with the sine, for the same sort of reason. Watch a point go round the unit circle at one radian per unit of time. Its height is $\sin t$. When it is at the far right, at angle 0, it is moving straight up, and its height is growing as fast as it ever does: at rate 1. At the top, its motion is sideways and its height is momentarily not changing: rate 0. Coming down the left side its height falls. The rate of change of the height is the **vertical part of the point's velocity**. And the velocity of a point going round a circle is at right angles to its position, a quarter-turn ahead, so its vertical part is the horizontal part of the position: the cosine.

        $$\frac{d}{dx}\,\sin x = \cos x.$$

        Slide the point along the sine curve and read the slope. At 0 it is 1. At the crest it is 0. Where the curve crosses the axis going down it is $-1$.
    - figure: secant
      props: { fn: sin, at: 0, closeness: 2 }
    - text: |
        The clean result, slope 1 at the origin, depends on measuring the angle in radians, exactly as the clean result for the exponential depends on the base $e$. The two special choices are made for the same purpose: to make a derivative come out without a stray constant.
  derivation:
    - text: |
        **The exponential with base $e$.** We need $\displaystyle\lim_{h \to 0} \frac{e^h - 1}{h} = 1$, starting from the definition of $e$ that you already have: $\left(1 + \frac{h}{n}\right)^n \to e^h$ as $n$ grows.

        The tool is **Bernoulli's inequality**: for every whole number $n \ge 1$ and every $x \ge -1$, $\ (1 + x)^n \ge 1 + nx$. It is a standard induction: multiply both sides of the claim for $n$ by $1 + x \ge 0$ and discard the term $nx^2 \ge 0$. Put $x = \frac{h}{n}$, which is at least $-1$ once $n$ is large: $\left(1 + \frac{h}{n}\right)^n \ge 1 + h$. Let $n$ grow.

        $$e^h \ge 1 + h \qquad\text{for every real } h.$$

        The exponential curve lies on or above the line $1 + h$. Now apply the same inequality to $-h$: $e^{-h} \ge 1 - h$, and for $h < 1$ take reciprocals of these positive numbers: $e^h \le \dfrac{1}{1 - h}$. So for $0 < h < 1$

        $$1 + h \;\le\; e^h \;\le\; \frac{1}{1 - h}.$$

        Subtract 1 throughout and divide by $h$:

        $$1 \;\le\; \frac{e^h - 1}{h} \;\le\; \frac{1}{1 - h}.$$

        The right side approaches 1. For negative $h$ the same steps give the same bounds the other way round. By the squeeze theorem the limit is 1. Hence, by the calculation in the puzzle with $e$ in place of 2,

        $$\frac{d}{dx}\,e^x = e^x \cdot 1 = e^x.$$

        **Every other exponential.** By the chain rule, with inner function $kx$,

        $$\frac{d}{dx}\,e^{kx} = k\,e^{kx}.$$

        And any base $b > 0$ can be written with base $e$, since $b = e^{\ln b}$ by the meaning of the natural logarithm: $b^x = e^{x \ln b}$. That is the case $k = \ln b$.

        $$\frac{d}{dx}\,b^x = \ln b \cdot b^x.$$

        The mystery constants of the puzzle are natural logarithms: $\ln 2 = 0.693\ldots$, $\ln 2.5 = 0.916\ldots$, $\ln 3 = 1.0986\ldots$, and $\ln e = 1$. The logarithm to base $e$ is called natural because it is the one that appears, uninvited, when you differentiate an exponential.

        **The logarithm.** $\ln$ is the inverse of the exponential: $e^{\ln y} = y$. The last lesson gave the derivative of an inverse as the reciprocal of the original's derivative at the matching point. With $f(x) = e^x$, so $f' = f$, and $g = \ln$:

        $$g'(y) = \frac{1}{f'(g(y))} = \frac{1}{e^{\ln y}} = \frac{1}{y}.$$

        $$\frac{d}{dx}\,\ln x = \frac{1}{x} \qquad (x > 0).$$

        The logarithm climbs for ever, and ever more slowly: at $x = 1$ its slope is 1, at $x = 100$ it is a hundredth. For another base, $\log_b x = \dfrac{\ln x}{\ln b}$, so its derivative is $\dfrac{1}{x \ln b}$.

        This fills a gap you may not have noticed. The power rule turns $x^r$ into a multiple of $x^{r-1}$, so $x^{-1}$ could only come from $x^0$, a constant, whose derivative is 0. No power of $x$ has the derivative $\dfrac{1}{x}$. The function that does is the logarithm.

        **The power rule, for every real exponent.** For $x > 0$ and any real $r$, write $x^r = e^{r \ln x}$. Chain rule, with inner function $r \ln x$:

        $$\frac{d}{dx}\,x^r = e^{r \ln x} \cdot \frac{r}{x} = x^r \cdot \frac{r}{x} = r\,x^{r-1}.$$

        The rule you proved by induction for whole numbers, and by implicit differentiation for fractions, holds for $\sqrt{2}$ and $\pi$ as well. That is the promise of two lessons ago kept.

        **The logarithmic derivative.** By the chain rule, for a positive function $f$,

        $$\frac{d}{dx}\,\ln f(x) = \frac{f'(x)}{f(x)}.$$

        This is the rate of change of $f$ **as a fraction of its present size**: the relative, or percentage, rate of growth. A balance growing at 5 per cent a year has $\dfrac{f'}{f} = 0.05$. Taking logarithms turns products into sums, as you know, and so it turns the product rule into plain addition: $\ln(uv) = \ln u + \ln v$ gives $\dfrac{(uv)'}{uv} = \dfrac{u'}{u} + \dfrac{v'}{v}$. Relative rates of factors add. This is why probabilities, which multiply, are almost always handled through their logarithms in machine learning: the logarithm of a product of a thousand factors is a sum, and a sum is differentiated term by term.
    - question:
        id: derivation-which-rule
        type: choice
        system: s2
        prompt: |
          Three functions: $x^3$, $3^x$ and $x^x$ (for $x > 0$). Which statement about their derivatives is correct?
        options:
          - "All three are $3x^2$-like: bring the exponent down."
          - "$x^3$ has derivative $3x^2$ (power rule). $3^x$ has derivative $3^x \\ln 3$ (exponential rule). $x^x$ needs neither alone: write it as $e^{x \\ln x}$ and use the chain rule, giving $x^x(\\ln x + 1)$."
          - "$3^x$ has derivative $x \\cdot 3^{x-1}$ and $x^x$ has derivative $x \\cdot x^{x-1} = x^x$."
          - "$x^x$ has derivative $x^x \\ln x$, by the exponential rule."
        answer: 1
        explanation: |
          The power rule needs a constant exponent, and the exponential rule needs a constant base. $x^x$ has neither, so neither rule applies as it stands. Rewriting through $e$ always works: $x^x = e^{x \ln x}$, and the inner function $x \ln x$ has derivative $\ln x + x \cdot \frac{1}{x} = \ln x + 1$ by the product rule. So the derivative is $x^x(\ln x + 1)$. Interestingly, that is the sum of what the two rules would each give if misapplied, $x \cdot x^{x-1}$ and $x^x \ln x$: each rule accounts for the variation of one of the two $x$'s.
    - text: |
        **The sine.** From the definition, with the angle-addition formula $\sin(a + h) = \sin a \cos h + \cos a \sin h$:

        $$\frac{\sin(a + h) - \sin a}{h} = \sin a \cdot \frac{\cos h - 1}{h} + \cos a \cdot \frac{\sin h}{h}.$$

        Two limits are needed. The second, $\dfrac{\sin h}{h} \to 1$, is the squeeze from the first lesson of this cluster. The first follows from it, by multiplying top and bottom by $\cos h + 1$:

        $$\frac{\cos h - 1}{h} = \frac{\cos^2 h - 1}{h(\cos h + 1)} = -\frac{\sin h}{h} \cdot \frac{\sin h}{\cos h + 1} \;\longrightarrow\; -1 \cdot \frac{0}{2} = 0.$$

        So the difference quotient approaches $\sin a \cdot 0 + \cos a \cdot 1$.

        $$\frac{d}{dx}\,\sin x = \cos x.$$

        Everything rested on $\dfrac{\sin h}{h} \to 1$, which is true in radians only. In degrees that limit is $\dfrac{\pi}{180}$, and every derivative of a trigonometric function would carry that factor.

        **The cosine.** No new limit is needed. $\cos x = \sin\!\left(\dfrac{\pi}{2} - x\right)$, so by the chain rule, with inner derivative $-1$,

        $$\frac{d}{dx}\,\cos x = \cos\!\left(\frac{\pi}{2} - x\right) \cdot (-1) = -\sin x.$$

        The minus sign is easy to forget and easy to check: the cosine starts at its maximum, 1, and goes down, so just after 0 its slope must be negative, like $-\sin x$.

        Differentiating four times goes round a cycle: $\sin \to \cos \to -\sin \to -\cos \to \sin$. Each differentiation is a quarter-turn.

        **The tangent.** $\tan x = \dfrac{\sin x}{\cos x}$. Quotient rule:

        $$\frac{d}{dx}\,\tan x = \frac{\cos x \cdot \cos x - \sin x \cdot (-\sin x)}{\cos^2 x} = \frac{\cos^2 x + \sin^2 x}{\cos^2 x} = \frac{1}{\cos^2 x}.$$

        **Two functions from machine learning.** The **sigmoid**, or logistic function, squashes any real number into the interval from 0 to 1, and is used whenever a model must output a probability.

        $$\sigma(x) = \frac{1}{1 + e^{-x}}.$$

        Large negative inputs give nearly 0, large positive inputs nearly 1, and $\sigma(0) = \frac{1}{2}$. Differentiate it as $(1 + e^{-x})^{-1}$, by the chain rule twice:

        $$\sigma'(x) = -(1 + e^{-x})^{-2} \cdot (-e^{-x}) = \frac{e^{-x}}{(1 + e^{-x})^2} = \frac{1}{1 + e^{-x}} \cdot \frac{e^{-x}}{1 + e^{-x}}.$$

        The first factor is $\sigma(x)$. The second is $1 - \sigma(x)$, since $1 - \dfrac{1}{1 + e^{-x}} = \dfrac{e^{-x}}{1 + e^{-x}}$. So

        $$\sigma'(x) = \sigma(x)\,\bigl(1 - \sigma(x)\bigr).$$

        The derivative is expressed through the function's own value. A program that has already computed $\sigma(x)$ in its forward pass gets the local rate for the backward pass with one subtraction and one multiplication. Its largest value is $\frac{1}{4}$, at $x = 0$, and it is nearly 0 wherever the sigmoid is nearly 0 or nearly 1. A chain of many sigmoids therefore multiplies many rates of at most a quarter, which is the vanishing product you met at the end of the last lesson.

        The **softplus** function is $\ln(1 + e^x)$. By the chain rule its derivative is

        $$\frac{e^x}{1 + e^x} = \frac{1}{1 + e^{-x}} = \sigma(x).$$

        Softplus is a smooth version of the rectified linear unit $\max(0, x)$: nearly 0 for very negative inputs, nearly $x$ for very positive ones, with the corner rounded off. Its slope, the sigmoid, is a smooth version of ReLU's slope, which jumps from 0 to 1.

        **Growth and decay.** If a quantity $y$ changes at a rate proportional to itself, $\dfrac{dy}{dt} = ky$, then $y = Ce^{kt}$ fits, as you can check by differentiating: $\dfrac{d}{dt}\,Ce^{kt} = kCe^{kt} = ky$. Here $C$ is the amount at $t = 0$. With $k > 0$ this is growth and with $k < 0$ decay. The time to double is the $t$ with $e^{kt} = 2$, that is $t = \dfrac{\ln 2}{k} \approx \dfrac{0.693}{k}$, the same whatever the starting amount.
    - question:
        id: order-sine-proof
        type: order
        system: s2
        prompt: Put the steps in order to find the derivative of $\sin x$ at $a$ from the definition.
        steps:
          - "Write the difference quotient $\\dfrac{\\sin(a + h) - \\sin a}{h}$."
          - "Expand $\\sin(a + h)$ as $\\sin a \\cos h + \\cos a \\sin h$."
          - "Group as $\\sin a \\cdot \\dfrac{\\cos h - 1}{h} + \\cos a \\cdot \\dfrac{\\sin h}{h}$."
          - "Use $\\dfrac{\\cos h - 1}{h} \\to 0$ and $\\dfrac{\\sin h}{h} \\to 1$ as $h \\to 0$."
          - "Conclude that the derivative is $\\cos a$."
        explanation: The definition comes first. The angle-addition formula separates what depends on a from what depends on h. Grouping isolates two quotients in h alone, and the two limits established earlier finish the proof. The terms in a are constants as far as the limit is concerned.
  formal:
    - text: |
        | $f(x)$ | $f'(x)$ | Valid for |
        | --- | --- | --- |
        | $e^x$ | $e^x$ | all $x$ |
        | $e^{kx}$ | $k\,e^{kx}$ | all $x$ |
        | $b^x$, $\ b > 0$ | $b^x \ln b$ | all $x$ |
        | $\ln x$ | $\dfrac{1}{x}$ | $x > 0$ |
        | $\log_b x$ | $\dfrac{1}{x \ln b}$ | $x > 0$ |
        | $x^r$, $\ r$ real | $r\,x^{r-1}$ | $x > 0$ |
        | $\sin x$ | $\cos x$ | all $x$, radians |
        | $\cos x$ | $-\sin x$ | all $x$, radians |
        | $\tan x$ | $\dfrac{1}{\cos^2 x}$ | $\cos x \ne 0$ |
        | $\sigma(x) = \dfrac{1}{1 + e^{-x}}$ | $\sigma(x)\bigl(1 - \sigma(x)\bigr)$ | all $x$ |
        | $\ln(1 + e^x)$ | $\sigma(x)$ | all $x$ |

        **With the chain rule.** $\dfrac{d}{dx}\,e^{g(x)} = e^{g(x)}\,g'(x)$, $\quad \dfrac{d}{dx}\,\ln g(x) = \dfrac{g'(x)}{g(x)}$, $\quad \dfrac{d}{dx}\,\sin g(x) = \cos g(x) \cdot g'(x)$.

        **Limits used.** $\displaystyle\lim_{h \to 0} \frac{e^h - 1}{h} = 1$, $\quad \displaystyle\lim_{h \to 0} \frac{\sin h}{h} = 1$, $\quad \displaystyle\lim_{h \to 0} \frac{\cos h - 1}{h} = 0$. Also $e^h \ge 1 + h$ for every real $h$.

        **Growth law.** $\dfrac{dy}{dt} = ky$ is satisfied by $y = Ce^{kt}$. Doubling time $\dfrac{\ln 2}{k}$.
  drill:
    - text: Seconds each. Exponentials copy themselves, the logarithm gives a reciprocal, and sine and cosine swap with one minus sign.
    - question:
        id: drill-exp
        type: numeric
        system: s1
        prompt: |
          $f(x) = e^x$. What is $f'(0)$?
        answer: "1"
        explanation: The exponential is its own derivative, and e to the power 0 is 1.
    - question:
        id: drill-exp-chain
        type: numeric
        system: s1
        prompt: |
          $f(x) = e^{3x}$. What is $f'(0)$?
        answer: "3"
        explanation: The chain rule brings out the inner derivative 3, and the exponential is 1 at 0.
    - question:
        id: drill-ln
        type: numeric
        system: s1
        prompt: |
          $f(x) = \ln x$. What is $f'(4)$? Answer as a decimal.
        answer: "0.25"
        explanation: The derivative of the natural logarithm is one over x.
    - question:
        id: drill-sin
        type: numeric
        system: s1
        prompt: |
          $f(x) = \sin x$. What is $f'(0)$?
        answer: "1"
        explanation: The derivative is the cosine, and cos 0 is 1. The sine crosses the origin at its steepest.
    - question:
        id: drill-cos
        type: choice
        system: s1
        prompt: |
          What is the derivative of $\cos x$?
        options: ["$\\sin x$", "$-\\sin x$", "$\\cos x$", "$-\\cos x$"]
        answer: 1
        explanation: The cosine starts at its maximum and falls, so its slope just after 0 is negative.
    - question:
        id: drill-base-two
        type: choice
        system: s1
        prompt: |
          What is the derivative of $2^x$?
        options: ["$x \\cdot 2^{x-1}$", "$2^x$", "$2^x \\ln 2$", "$\\dfrac{2^x}{\\ln 2}$"]
        answer: 2
        explanation: An exponential's slope is its height times a constant, and the constant is the natural logarithm of the base.
    - question:
        id: drill-ln-chain
        type: numeric
        system: s1
        prompt: |
          $f(x) = \ln(x^2 + 1)$. What is $f'(1)$?
        answer: "1"
        explanation: |
          $\dfrac{2x}{x^2 + 1}$, which is $\dfrac{2}{2}$ at 1.
    - question:
        id: drill-sin-chain
        type: numeric
        system: s1
        prompt: |
          $f(x) = \sin(2x)$. What is $f'(0)$?
        answer: "2"
        explanation: |
          $\cos(2x) \cdot 2$, which is 2 at 0. Doubling the speed round the circle doubles every rate.
    - question:
        id: drill-sigmoid-value
        type: numeric
        system: s1
        prompt: |
          $\sigma(x) = \dfrac{1}{1 + e^{-x}}$. What is $\sigma'(0)$? Answer as a decimal.
        answer: "0.25"
        explanation: |
          $\sigma(0) = \frac{1}{2}$, and $\sigma' = \sigma(1 - \sigma) = \frac{1}{2} \cdot \frac{1}{2}$. This is the sigmoid's steepest slope.
    - question:
        id: drill-tan
        type: numeric
        system: s1
        prompt: |
          $f(x) = \tan x$. What is $f'(0)$?
        answer: "1"
        explanation: One over the square of the cosine, and cos 0 is 1.
    - question:
        id: drill-own-derivative
        type: choice
        system: s1
        prompt: |
          Which function is equal to its own derivative?
        options: ["$x^2$", "$2^x$", "$e^x$", "$\\ln x$"]
        answer: 2
        explanation: Every exponential's slope is a constant times its height, and for base e the constant is 1.
    - question:
        id: predict-slopes-at-zero
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          h = 1e-6
          for b in [2, math.e, 3]:
              print(round((b ** h - 1) / h, 3))
        output: |
          0.693
          1.0
          1.099
        explanation: Each line estimates the slope of b to the x at 0, which is the natural logarithm of b. For base e it is 1, and that is what singles out e.
    - question:
        id: predict-sigmoid
        type: predict
        system: s1
        prompt: What does this show?
        code: |
          import math

          def s(x):
              return 1 / (1 + math.exp(-x))

          print(s(0), s(0) * (1 - s(0)))
        output: "0.5 0.25"
        explanation: At 0 the exponential is 1, so the sigmoid is one half. Its derivative there is the value times one minus the value, a quarter.
  work:
    - text: Slower now. Decide which of the rules for building functions is outermost before you differentiate.
    - question:
        id: work-product-exp
        type: numeric
        system: s2
        prompt: |
          $f(x) = x\,e^x$. For which $x$ is $f'(x) = 0$?
        answer: "-1"
        explanation: |
          Product rule: $f'(x) = 1 \cdot e^x + x \cdot e^x = e^x(1 + x)$. The exponential is never 0, so the derivative vanishes only when $1 + x = 0$. To the left of $-1$ the function falls and to the right it rises, so $x = -1$ is the bottom of a valley.
    - question:
        id: work-log-chain
        type: numeric
        system: s2
        prompt: |
          $f(x) = \ln(3x + 1)$. Find $f'(1)$. Answer as a decimal.
        answer: "0.75"
        explanation: |
          Derivative of the inside over the inside: $\dfrac{3}{3x + 1}$, which is $\dfrac{3}{4}$ at $x = 1$.
    - question:
        id: work-x-squared-ln
        type: numeric
        system: s2
        prompt: |
          $f(x) = x^2 \ln x$. Find $f'(1)$.
        answer: "1"
        explanation: |
          Product rule: $2x \ln x + x^2 \cdot \dfrac{1}{x} = 2x \ln x + x$. At $x = 1$ the logarithm is 0, leaving 1.
    - question:
        id: work-doubling
        type: numeric
        system: s2
        unit: years
        prompt: |
          A quantity grows according to $\dfrac{dy}{dt} = 0.07\,y$, with $t$ in years. How long does it take to double? Use $\ln 2 = 0.7$ and give a whole number.
        answer: "10"
        explanation: |
          $y = Ce^{0.07t}$, and doubling needs $e^{0.07t} = 2$, so $t = \dfrac{\ln 2}{0.07} = \dfrac{0.7}{0.07} = 10$ years. The answer does not depend on the starting amount. This is the rule of seventy that you met with compound growth: divide 70 by the percentage rate.
    - question:
        id: write-dual-exp-log
        type: code
        mode: write
        system: s2
        prompt: |
          Extend the dual-number machinery with two functions. `exp(u)` returns a `Dual` for $e^u$, and `log(u)` returns a `Dual` for $\ln u$. Each gives the value from `math.exp` or `math.log`, and a rate from the chain rule: the local derivative at `u.value` times `u.rate`.

          The program then differentiates $x^x = e^{x \ln x}$ at $x = 2$. It should print `4.0 6.7726`.
        starter: |
          import math

          class Dual:
              def __init__(self, value, rate):
                  self.value = value
                  self.rate = rate

              def __mul__(self, other):
                  return Dual(self.value * other.value, self.rate * other.value + self.value * other.rate)

          def exp(u):
              # Replace the next line with your own.
              return Dual(math.exp(u.value), 0)

          def log(u):
              # Replace the next line with your own.
              return Dual(math.log(u.value), 0)

          x = Dual(2, 1)
          y = exp(x * log(x))
          print(round(y.value, 4), round(y.rate, 4))
        solution: |
          import math

          class Dual:
              def __init__(self, value, rate):
                  self.value = value
                  self.rate = rate

              def __mul__(self, other):
                  return Dual(self.value * other.value, self.rate * other.value + self.value * other.rate)

          def exp(u):
              return Dual(math.exp(u.value), math.exp(u.value) * u.rate)

          def log(u):
              return Dual(math.log(u.value), u.rate / u.value)

          x = Dual(2, 1)
          y = exp(x * log(x))
          print(round(y.value, 4), round(y.rate, 4))
        tests: |
          import math as _m
          def _near(a, b):
              return abs(a - b) < 1e-9
          _y = exp(Dual(0, 1))
          assert _near(_y.value, 1) and _near(_y.rate, 1), "e to the x at 0 has value 1 and rate 1. You got " + repr((_y.value, _y.rate))
          _y = exp(Dual(1, 3))
          assert _near(_y.value, _m.e) and _near(_y.rate, 3 * _m.e), "If u = 1 changes at rate 3, then e to the u has rate 3e. You got " + repr((_y.value, _y.rate))
          _y = log(Dual(4, 1))
          assert _near(_y.value, _m.log(4)) and _near(_y.rate, 0.25), "ln x at 4 has rate 1/4. You got " + repr((_y.value, _y.rate))
          _y = log(Dual(5, 2))
          assert _near(_y.rate, 0.4), "If u = 5 changes at rate 2, then ln u has rate 2/5. You got " + repr(_y.rate)
          _y = log(exp(Dual(3, 1)))
          assert _near(_y.value, 3) and _near(_y.rate, 1), "ln of e to the x is x, with rate 1. You got " + repr((_y.value, _y.rate))
          _y = exp(Dual(2, 0))
          assert _near(_y.rate, 0), "A constant has rate 0, and so has e to that constant"
          assert output.split() == ["4.0", "6.7726"], "The program should print 4.0 6.7726"
        wrong:
          - "import math\n\nclass Dual:\n    def __init__(self, value, rate):\n        self.value = value\n        self.rate = rate\n    def __mul__(self, other):\n        return Dual(self.value * other.value, self.rate * other.value + self.value * other.rate)\n\ndef exp(u):\n    return Dual(math.exp(u.value), math.exp(u.value))\n\ndef log(u):\n    return Dual(math.log(u.value), 1 / u.value)\n\nprint(4.0, 6.7726)\n"
          - "import math\n\nclass Dual:\n    def __init__(self, value, rate):\n        self.value = value\n        self.rate = rate\n    def __mul__(self, other):\n        return Dual(self.value * other.value, self.rate * other.value + self.value * other.rate)\n\ndef exp(u):\n    return Dual(math.exp(u.value), math.exp(u.rate))\n\ndef log(u):\n    return Dual(math.log(u.value), u.rate / u.value)\n\nprint(4.0, 6.7726)\n"
          - "import math\n\nclass Dual:\n    def __init__(self, value, rate):\n        self.value = value\n        self.rate = rate\n    def __mul__(self, other):\n        return Dual(self.value * other.value, self.rate * other.value + self.value * other.rate)\n\ndef exp(u):\n    return Dual(math.exp(u.value), math.exp(u.value) * u.rate)\n\ndef log(u):\n    return Dual(math.log(u.value), u.value / u.rate)\n\nprint(4.0, 6.7726)\n"
          - "import math\n\nclass Dual:\n    def __init__(self, value, rate):\n        self.value = value\n        self.rate = rate\n    def __mul__(self, other):\n        return Dual(self.value * other.value, self.rate * other.value + self.value * other.rate)\n\ndef exp(u):\n    return Dual(math.exp(u.value), u.value * math.exp(u.value - 1) * u.rate)\n\ndef log(u):\n    return Dual(math.log(u.value), u.rate / u.value)\n\nprint(4.0, 6.7726)\n"
        explanation: |
          Each function supplies its own local rate and multiplies by the rate coming in. For the exponential the local rate is the value itself, so the rate is `math.exp(u.value) * u.rate`. For the logarithm it is the reciprocal of the input, so the rate is `u.rate / u.value`. The program then computes $x^x$ at 2 as $e^{x \ln x}$: the logarithm gives rate $\frac{1}{2}$, the product rule gives $\ln 2 + 1$ for $x \ln x$, and the exponential multiplies that by the value 4, giving $4(\ln 2 + 1) = 6.7726$. Nobody worked out the derivative of $x^x$. Three local rules and the chain rule did, exactly as in the choice question earlier in the lesson.
    - question:
        id: write-sigmoid-rate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `sigmoid_and_rate(x)`. It returns a tuple `(s, ds)` where `s` is $\sigma(x) = \dfrac{1}{1 + e^{-x}}$ and `ds` is the derivative $\sigma'(x)$.

          Call `math.exp` **once**. The derivative should come from the value by the identity of the lesson, as it does in real backward passes.
        starter: |
          import math

          def sigmoid_and_rate(x):
              # Replace the next line with your own.
              return (0, 0)

          print(sigmoid_and_rate(0))
        solution: |
          import math

          def sigmoid_and_rate(x):
              s = 1 / (1 + math.exp(-x))
              return (s, s * (1 - s))

          print(sigmoid_and_rate(0))
        tests: |
          import math as _m
          def _sig(x):
              return 1 / (1 + _m.exp(-x))
          assert sigmoid_and_rate(0) == (0.5, 0.25), "At 0 the sigmoid is 0.5 and its derivative is 0.25. You returned " + repr(sigmoid_and_rate(0))
          for _x in [-3, -1, 0.5, 2, 6]:
              _s, _ds = sigmoid_and_rate(_x)
              assert abs(_s - _sig(_x)) < 1e-12, "The value at " + str(_x) + " should be " + str(_sig(_x)) + " and you returned " + repr(_s)
              _est = (_sig(_x + 1e-5) - _sig(_x - 1e-5)) / 2e-5
              assert abs(_ds - _est) < 1e-7, "At x = " + str(_x) + " a central difference gives a derivative of about " + str(round(_est, 6)) + " and you returned " + repr(_ds)
          assert source.count("exp(") == 1, "Call math.exp exactly once, and get the derivative from the value"
          assert output.strip() == "(0.5, 0.25)", "The program should print (0.5, 0.25)"
        wrong:
          - "import math\n\ndef sigmoid_and_rate(x):\n    s = 1 / (1 + math.exp(-x))\n    return (s, s * s)\n\nprint((0.5, 0.25))\n"
          - "import math\n\ndef sigmoid_and_rate(x):\n    s = 1 / (1 + math.exp(-x))\n    return (s, 1 - s)\n\nprint((0.5, 0.25))\n"
          - "import math\n\ndef sigmoid_and_rate(x):\n    s = 1 / (1 + math.exp(x))\n    return (s, s * (1 - s))\n\nprint((0.5, 0.25))\n"
          - "import math\n\ndef sigmoid_and_rate(x):\n    s = 1 / (1 + math.exp(-x))\n    return (s, -s * (1 - s))\n\nprint((0.5, 0.25))\n"
        explanation: |
          Compute the value once, then use $\sigma' = \sigma(1 - \sigma)$. At 0 the two factors are both a half, and $s^2$ would give the same number there, which is why a test at one point proves little. Away from 0 the two differ: at $x = 2$ the value is about 0.88 and the derivative about 0.105, where $s^2$ would say 0.776. The derivative is small at both ends, where the sigmoid is flat, and largest in the middle. Because the derivative is a function of the output alone, a layer of sigmoids needs to remember only its outputs to run the backward pass, with no second call to the exponential.
    - question:
        id: fix-degrees
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `slope_per_degree(d)` should return the rate at which the sine of an angle changes **per degree**, at the angle of `d` degrees. At 0 degrees a one-degree change raises the sine by about 0.01745, so the answer there should be about 0.01745. The function returns 1.0. The chain rule has been forgotten somewhere. Fix it.
        starter: |
          import math

          def slope_per_degree(d):
              return math.cos(math.radians(d))

          print(round(slope_per_degree(0), 5))
        solution: |
          import math

          def slope_per_degree(d):
              return math.cos(math.radians(d)) * math.pi / 180

          print(round(slope_per_degree(0), 5))
        tests: |
          import math as _m
          def _sin_deg(d):
              return _m.sin(_m.radians(d))
          for _d in [0, 30, 60, 90, 200]:
              _est = (_sin_deg(_d + 1e-4) - _sin_deg(_d - 1e-4)) / 2e-4
              _got = slope_per_degree(_d)
              assert abs(_got - _est) < 1e-8, "At " + str(_d) + " degrees the sine changes by about " + str(round(_est, 6)) + " per degree, and you returned " + repr(_got)
          assert output.strip() == "0.01745", "The program should print 0.01745"
        wrong:
          - "import math\n\ndef slope_per_degree(d):\n    return math.cos(math.radians(d))\n\nprint(0.01745)\n"
          - "import math\n\ndef slope_per_degree(d):\n    return math.cos(d) * math.pi / 180\n\nprint(0.01745)\n"
          - "import math\n\ndef slope_per_degree(d):\n    return math.cos(math.radians(d)) * 180 / math.pi\n\nprint(0.01745)\n"
          - "import math\n\ndef slope_per_degree(d):\n    return math.sin(math.radians(d)) * math.pi / 180\n\nprint(0.01745)\n"
        explanation: |
          The sine of an angle of $d$ degrees is $\sin\!\left(\dfrac{\pi d}{180}\right)$: a composition. The inner function converts degrees to radians and has derivative $\dfrac{\pi}{180}$. The chain rule multiplies the outer derivative, the cosine, by that factor, and the starter left it out. It is the stray constant that appears in every trigonometric derivative when angles are not in radians, and it is the reason calculus is always done in radians. A check on the size of the answer catches the bug at once: a change of one degree is a small change, and the sine cannot move by a whole unit because of it.
    - question:
        id: work-softplus
        type: choice
        system: s2
        prompt: |
          Softplus is $s(x) = \ln(1 + e^x)$. What is $s'(x)$, and how does it compare with the slope of $\max(0, x)$?
        options:
          - "$s'(x) = \\dfrac{1}{1 + e^x}$, which falls from 1 to 0."
          - "$s'(x) = \\dfrac{e^x}{1 + e^x}$, the sigmoid. It rises smoothly from 0 to 1, passing $\\frac{1}{2}$ at 0, where the slope of $\\max(0, x)$ jumps from 0 to 1 with no value at 0."
          - "$s'(x) = e^x$, which grows without bound."
          - "$s'(x) = \\dfrac{1}{x}$, as for any logarithm."
        answer: 1
        explanation: |
          Chain rule: derivative of the inside, $e^x$, over the inside, $1 + e^x$. Dividing top and bottom by $e^x$ gives $\dfrac{1}{1 + e^{-x}}$, the sigmoid. So softplus has a slope everywhere, close to 0 far to the left and close to 1 far to the right, exactly like the rectified linear unit away from the origin, and with the corner replaced by a smooth bend. The first option forgets to multiply by the derivative of the inside. The last treats the input of the logarithm as if it were $x$.
    - question:
        id: work-log-probabilities
        type: choice
        system: s2
        prompt: |
          A model assigns probabilities $p_1, p_2, \dots, p_{1000}$ to a thousand independent observations, each depending on a weight $w$, and the probability of all of them together is the product $P = p_1 p_2 \cdots p_{1000}$. Why does everyone differentiate $\ln P$ with respect to $w$ and not $P$?
        options:
          - "Because $\\ln P$ has a different maximiser from $P$."
          - "Because $\\ln P = \\ln p_1 + \\dots + \\ln p_{1000}$ is a sum, differentiated term by term as $\\dfrac{p_i'}{p_i}$, while the derivative of the product has a thousand terms each with 999 factors. Also the product of a thousand numbers below 1 is too small for a float, and the sum of their logarithms is not."
          - "Because probabilities cannot be differentiated."
          - "Because the logarithm makes every derivative equal to 1."
        answer: 1
        explanation: |
          The logarithm turns the product into a sum, and the derivative of a sum is the sum of the derivatives, each one the relative rate $\dfrac{p_i'}{p_i}$. The product rule on a thousand factors would be unmanageable. There is a numerical reason too: a thousand probabilities of about 0.1 multiply to $10^{-1000}$, far below the smallest positive `float`, so the product is stored as 0. And since the logarithm is an increasing function, $\ln P$ is largest exactly where $P$ is largest, so nothing is lost. This is why losses in machine learning are written as sums of logarithms.
  connections:
    - text: |
        The puzzle asked for the derivative of $2^x$ and found, before computing anything, that an exponential's slope is its height times a fixed number. The number turned out to be the natural logarithm of the base, and the base for which it is 1 turned out to be $e$, the same $e$ that compound interest produced. From $e^x$ came the logarithm, as its inverse, with derivative $\frac{1}{x}$. From those two came the power rule for every real exponent. And the sine and cosine, in radians, turned out to be each other's derivatives up to a sign.

        With today's table and the rules of the last two lessons, **every function you can write with the usual symbols can be differentiated**, mechanically. That is a remarkable state of affairs and it will not be true of the reverse operation, as you will find.

        So far a derivative has told you one thing about a function at a point: its slope. But the derivative is itself a function, and it has a derivative of its own. The derivative of the sine is the cosine, and the derivative of that is minus the sine. The derivative of $e^x$ is $e^x$ again and again, for ever. What does the derivative of the derivative say about the original curve? It says how the curve bends, and that is the next lesson, [[m10.second-derivative-and-curvature]]. Carry the idea further, and the string of derivatives of a function at one point, all of them, is enough to rebuild the function nearby as a polynomial, which is how a computer actually evaluates `math.sin` and `math.exp`: that is [[m10.taylor-approximation]]. And the fact that no power has the derivative $\frac{1}{x}$, so that the logarithm had to step in, returns when differentiation is run backwards in [[m10.integration-techniques]].

        The sigmoid and softplus you differentiated today are two of a family of functions placed between the layers of a network, studied in [[l5.activation-functions]], and their derivatives are exactly the local rates that the backward pass multiplies. And the habit of taking logarithms of probabilities, which you saw turns products into sums, is the beginning of the theory that measures information, in [[m20.surprise-and-entropy]].
