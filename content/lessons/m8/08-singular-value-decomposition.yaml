        explanation: |
          In exact arithmetic the rank is the number of nonzero singular values. In floating point the second singular value of the rank-one matrix comes out as about $10^{-16}$, not zero. The first wrong version counts it and reports rank 2 with a condition number of $10^{16}$.

          So numerical rank is always "the number of singular values above a tolerance", and the tolerance is a decision. `np.linalg.matrix_rank` makes it this way, with a tolerance tied to machine precision.

