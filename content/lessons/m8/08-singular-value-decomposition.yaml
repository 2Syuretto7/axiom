  work:
    - text: Slower now. The first task builds the decomposition from the spectral theorem.
    - question:
        id: write-svd
        type: code
        mode: write
        system: s2
        prompt: |
          Write `svd(A)` for a matrix with independent columns, **without** calling NumPy's `svd`. Use `np.linalg.eigh` on `A.T @ A`, reverse the order so that the largest comes first, take square roots for the singular values, and form `U = A @ V / s`. Return `(U, s, V)` with the singular vectors as columns of `U` and `V`.
        starter: |
          import numpy as np


          def svd(A):
              n = A.shape[1]
              return A[:, :n] * 1.0, np.ones(n), np.eye(n)


          A = np.array([[3.0, 0.0], [4.0, 5.0]])
          U, s, V = svd(A)
          print([round(float(v), 4) for v in s])
          print(np.allclose(U @ np.diag(s) @ V.T, A), np.allclose(U.T @ U, np.eye(2)))
        solution: |
          import numpy as np


          def svd(A):
              values, V = np.linalg.eigh(A.T @ A)
              values, V = values[::-1], V[:, ::-1]
              s = np.sqrt(values)
              return A @ V / s, s, V


          A = np.array([[3.0, 0.0], [4.0, 5.0]])
          U, s, V = svd(A)
          print([round(float(v), 4) for v in s])
          print(np.allclose(U @ np.diag(s) @ V.T, A), np.allclose(U.T @ U, np.eye(2)))
        tests: |
          import numpy as _np
          _A = _np.array([[3.0, 0.0], [4.0, 5.0]])
          _out = svd(_A)
          assert isinstance(_out, tuple) and len(_out) == 3, "svd should return the triple (U, s, V)"
          _U, _s, _V = _out
          assert _np.allclose(_s, [45 ** 0.5, 5 ** 0.5]), "The singular values of [[3, 0], [4, 5]] are sqrt 45 and sqrt 5, largest first"
          assert _np.allclose(_U @ _np.diag(_s) @ _V.T, _A), "U times diag(s) times V transpose should rebuild A"
          assert _np.allclose(_U.T @ _U, _np.eye(2)) and _np.allclose(_V.T @ _V, _np.eye(2)), "The columns of U and of V should be orthonormal"
          _B = _np.array([[1.0, 2.0], [0.0, 1.0], [2.0, 0.0], [1.0, 1.0]])
          _U, _s, _V = svd(_B)
          assert _np.shape(_U) == (4, 2) and _np.shape(_s) == (2,) and _np.shape(_V) == (2, 2), "For a 4 by 2 matrix U is 4 by 2, s has 2 entries and V is 2 by 2"
          assert _np.allclose(_s, _np.linalg.svd(_B, compute_uv=False)), "The singular values should agree with NumPy's"
          assert _np.allclose(_U @ _np.diag(_s) @ _V.T, _B) and _np.allclose(_U.T @ _U, _np.eye(2)), "For the tall matrix too, the product should rebuild it and U should have orthonormal columns"
          assert _np.allclose(_B @ _V[:, 0], _s[0] * _U[:, 0]), "A v1 should equal sigma1 u1"
          _C = _np.random.default_rng(0).normal(size=(6, 3))
          _U, _s, _V = svd(_C)
          assert _np.all(_s[:-1] >= _s[1:]) and _np.allclose(_U @ _np.diag(_s) @ _V.T, _C), "For a random 6 by 3 matrix the singular values should be decreasing and the product should rebuild it"
          assert output.strip() == "[6.7082, 2.2361]\nTrue True", "The program should print [6.7082, 2.2361] and then True True"
        wrong:
          - |
            import numpy as np


            def svd(A):
                values, V = np.linalg.eigh(A.T @ A)
                s = np.sqrt(values)
                return A @ V / s, s, V


            print("[6.7082, 2.2361]\nTrue True")
          - |
            import numpy as np


            def svd(A):
                values, V = np.linalg.eigh(A.T @ A)
                values, V = values[::-1], V[:, ::-1]
                return A @ V / values, values, V


            print("[6.7082, 2.2361]\nTrue True")
          - |
            import numpy as np


            def svd(A):
                values, V = np.linalg.eigh(A.T @ A)
                values = values[::-1]
                s = np.sqrt(values)
                return A @ V / s, s, V


            print("[6.7082, 2.2361]\nTrue True")
          - |
            import numpy as np


            def svd(A):
                values, V = np.linalg.eigh(A.T @ A)
                values, V = values[::-1], V[:, ::-1]
                s = np.sqrt(values)
                return A @ V, s, V


            print("[6.7082, 2.2361]\nTrue True")
        explanation: |
          `A @ V` holds the images $A\mathbf{v}_i$ as columns, which are orthogonal with lengths $\sigma_i$. Dividing by `s` scales each column to length 1, by broadcasting along the columns. That is the whole construction.

          `eigh` returns increasing eigenvalues and the convention for singular values is decreasing, so both the values and the **columns** of `V` must be reversed together. The third wrong version reverses only the values and attaches each singular value to the wrong vector.

          This construction is how the theorem is proved, not how the decomposition is computed. Forming $A^\top A$ squares the condition number, so small singular values come out with only half the digits correct. And if a singular value is zero, the division fails. Library routines work on $A$ directly, by a sequence of orthogonal transformations.
    - question:
        id: write-rank-cond
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rank_and_condition(A)` using `np.linalg.svd(A, compute_uv=False)`. Count as nonzero the singular values greater than `1e-10` times the largest. Return the pair `(rank, condition)`: the rank as an `int`, and the largest singular value divided by the smallest. If the matrix does not have full rank, meaning rank below the smaller of its two dimensions, the condition is `np.inf`.
        starter: |
          import numpy as np


          def rank_and_condition(A):
              return 0, 1.0


          print(rank_and_condition(np.array([[2.0, 0.0], [0.0, 0.5]])))
          print(rank_and_condition(np.array([[1.0, 2.0], [2.0, 4.0], [3.0, 6.0]])))
        solution: |
          import numpy as np


          def rank_and_condition(A):
              s = np.linalg.svd(A, compute_uv=False)
              rank = int((s > 1e-10 * s[0]).sum())
              if rank < len(s):
                  return rank, np.inf
              return rank, float(s[0] / s[-1])


          print(rank_and_condition(np.array([[2.0, 0.0], [0.0, 0.5]])))
          print(rank_and_condition(np.array([[1.0, 2.0], [2.0, 4.0], [3.0, 6.0]])))
        tests: |
          import numpy as _np
