concept: m8.singular-value-decomposition
minutes: 95
claim: You can state the singular value decomposition of any real matrix, construct it from the eigenvectors of A transpose A, read it as a rotation followed by a scaling along axes followed by another rotation, write the matrix as a sum of rank-one pieces, read off rank, the four fundamental subspaces, the largest stretch, the condition number and the pseudo-inverse from it, and use NumPy's routine without confusing V with its transpose.
recalls: [m8.courant-fischer-min-max-theorem]
uses: [m8.spectral-theorem, m8.positive-definite-matrices-and-cholesky, m8.quadratic-forms-and-the-rayleigh-quotient, m8.eigenvalues-and-eigenvectors, m8.diagonalisation, m6.adjoints-orthogonal-and-unitary-maps, m6.rank-nullity-theorem, m7.orthonormal-bases, m7.orthogonal-subspaces, m7.pseudo-inverse, m7.conditioning, m5.rank, m5.column-space-and-null-space, m5.transpose, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions]
leads: [m8.eckart-young-theorem, m8.pca-as-svd, m8.operator-and-frobenius-norms]
starter: |
  # Scratch space. Send every point of the unit circle through A.
  # How long is the longest image, and the shortest?
  import numpy as np

  A = np.array([[3.0, 0.0], [4.0, 5.0]])
  t = np.linspace(0.0, 2.0 * np.pi, 3601)
  X = np.stack([np.cos(t), np.sin(t)])
  lengths = np.sqrt(((A @ X) ** 2).sum(axis=0))
  print(round(float(lengths.max()), 4), round(float(lengths.min()), 4))
  print([round(float(v), 4) for v in np.sort(np.linalg.eigvals(A).real)])
parts:
  recall:
    - text: |
        [[m8.courant-fischer-min-max-theorem]] closed the study of symmetric matrices, and pointed out that most matrices are neither symmetric nor square. Today's factorisation exists for every matrix, and it is built from the symmetric theory. Three quick pulls first.
  puzzle:
    - text: |
        The matrix $A = \begin{pmatrix} 3 & 0 \\ 4 & 5 \end{pmatrix}$ is triangular, so its eigenvalues are on the diagonal: 3 and 5. The starter sends the whole unit circle through $A$ and measures the longest and the shortest image.

        ```
        6.7082 2.2361
        [3.0, 5.0]
        ```

        Some unit vector is stretched to length $6.7$, well beyond the largest eigenvalue. Another is squeezed to $2.2$, below the smallest. The eigenvalues say how $A$ scales the two directions it does not turn. They say nothing about how much it can stretch.

        Notice that $6.7082 \times 2.2361 = 15 = 3 \times 5$, the determinant. So these two numbers are tied to the matrix in some exact way.

        **What are these two numbers, which directions achieve them, and do such numbers exist for every matrix, even one that is not square?**
  intuition:
    - text: |
        Eigenvectors ask for too much: an input direction that comes out as **the same** direction. For a matrix that is not symmetric they may be skewed or complex, and for a matrix that is not square the question makes no sense, since input and output live in different spaces.

        Ask for less. Look for a set of **perpendicular input directions** that come out as **perpendicular output directions**. The output directions may be different from the input ones. This can always be done.

        The input directions are the eigenvectors $\mathbf{v}_1, \dots, \mathbf{v}_n$ of $A^\top A$, which is symmetric, so they are orthonormal. Their images $A\mathbf{v}_i$ are perpendicular to each other, because

        $$(A\mathbf{v}_i) \cdot (A\mathbf{v}_j) = \mathbf{v}_i \cdot (A^\top A\mathbf{v}_j) = \lambda_j\,\mathbf{v}_i \cdot \mathbf{v}_j = 0 \quad (i \ne j).$$

        The length of $A\mathbf{v}_i$ is $\sigma_i = \sqrt{\lambda_i}$, the $i$th **singular value**. Writing $\mathbf{u}_i$ for the unit vector along $A\mathbf{v}_i$,

        $$A\mathbf{v}_i = \sigma_i\mathbf{u}_i.$$

        So every matrix does this: it takes a certain orthonormal frame in the input space, and sends it to an orthonormal frame in the output space, scaling the $i$th axis by $\sigma_i$. Rotate, scale, rotate. The unit circle goes to an ellipse with semi-axes $\sigma_1$ and $\sigma_2$. For the puzzle these are $6.7082$ and $2.2361$.
  derivation:
    - text: |
        Let $A$ be a real $m \times n$ matrix of rank $r$.

        **Step 1.** $A^\top A$ is symmetric positive semidefinite, $n \times n$. By the spectral theorem it has orthonormal eigenvectors $\mathbf{v}_1, \dots, \mathbf{v}_n$ with eigenvalues $\lambda_1 \ge \dots \ge \lambda_n \ge 0$. Define the **singular values** $\sigma_i = \sqrt{\lambda_i}$. Since $\|A\mathbf{v}_i\|^2 = \mathbf{v}_i^\top A^\top A\mathbf{v}_i = \lambda_i$, we have $\|A\mathbf{v}_i\| = \sigma_i$. Exactly $r$ of them are positive, because $A^\top A$ and $A$ have the same kernel and hence the same rank.

        **Step 2.** For $i \le r$ put $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$. By the computation in the intuition these are orthonormal vectors in $\mathbb{R}^m$. If $r < m$, extend them to an orthonormal basis $\mathbf{u}_1, \dots, \mathbf{u}_m$.

        **Step 3.** Then $A\mathbf{v}_i = \sigma_i\mathbf{u}_i$ for $i \le r$ and $A\mathbf{v}_i = \mathbf{0}$ for $i > r$. In matrix form $AV = U\Sigma$, where $U$ and $V$ are orthogonal with those columns and $\Sigma$ is the $m \times n$ matrix with $\sigma_1, \dots, \sigma_r$ on its diagonal and zeros elsewhere. Multiplying by $V^\top$:

        $$A = U\Sigma V^\top.$$

        This is the **singular value decomposition**, SVD. The $\mathbf{v}_i$ are the **right singular vectors** and the $\mathbf{u}_i$ the **left singular vectors**.

        **Reading it.** $A\mathbf{x} = U\Sigma V^\top\mathbf{x}$: first $V^\top$ gives the coordinates of $\mathbf{x}$ in the frame $\mathbf{v}_i$, a rotation or reflection. Then $\Sigma$ scales coordinate $i$ by $\sigma_i$, and drops or adds dimensions. Then $U$ lays the result out along the frame $\mathbf{u}_i$.

        **As a sum.** Column by column,

        $$A = \sigma_1\mathbf{u}_1\mathbf{v}_1^\top + \sigma_2\mathbf{u}_2\mathbf{v}_2^\top + \dots + \sigma_r\mathbf{u}_r\mathbf{v}_r^\top.$$

        Each term is a matrix of rank 1: "measure the component of the input along $\mathbf{v}_i$, and output that much of $\mathbf{u}_i$, scaled by $\sigma_i$". Only the $r$ nonzero terms are needed. Keeping only those columns gives the **reduced** SVD, with $U$ of size $m \times r$ and $V$ of size $n \times r$.

        *The puzzle.* $A^\top A = \begin{pmatrix} 25 & 20 \\ 20 & 25 \end{pmatrix}$ has eigenvalues 45 and 5, with eigenvectors $(1, 1)/\sqrt2$ and $(1, -1)/\sqrt2$. So $\sigma_1 = \sqrt{45} \approx 6.708$ and $\sigma_2 = \sqrt5 \approx 2.236$. The most stretched input direction is the diagonal $(1, 1)$, and its image points along $A(1, 1) = (3, 9)$.
    - question:
        id: derivation-nilpotent
        type: numeric
        system: s2
        prompt: |
          $A = \begin{pmatrix} 0 & 2 \\ 0 & 0 \end{pmatrix}$ has both eigenvalues equal to 0. What is its largest singular value?
        answer: "2"
        explanation: |
          $A^\top A = \begin{pmatrix} 0 & 0 \\ 0 & 4 \end{pmatrix}$ has eigenvalues 4 and 0, so the singular values are 2 and 0. The matrix sends $(0, 1)$ to $(2, 0)$, a stretch by 2, and kills $(1, 0)$. Its eigenvalues, both zero, would suggest a matrix that does nothing. The singular values report what it does to lengths: rank 1, with stretch 2. Here $\mathbf{v}_1 = (0, 1)$ and $\mathbf{u}_1 = (1, 0)$ are different directions, which is why no eigenvector could see it.
    - text: |
        **What can be read off.**

        - *Rank.* The number of nonzero singular values.
        - *The four subspaces.* $\mathbf{u}_1, \dots, \mathbf{u}_r$ are an orthonormal basis of the column space, and $\mathbf{u}_{r+1}, \dots, \mathbf{u}_m$ of the left null space. $\mathbf{v}_1, \dots, \mathbf{v}_r$ are an orthonormal basis of the row space, and $\mathbf{v}_{r+1}, \dots, \mathbf{v}_n$ of the null space. The SVD delivers orthonormal bases of all four at once.
        - *Largest and smallest stretch.* $\max\|A\mathbf{x}\|/\|\mathbf{x}\| = \sigma_1$, attained at $\mathbf{v}_1$. For square invertible $A$ the smallest is $\sigma_n$, and the **condition number** is $\sigma_1/\sigma_n$.
        - *Determinant.* For square $A$, $|\det A| = \sigma_1\sigma_2\cdots\sigma_n$, since the orthogonal factors have determinant $\pm1$.
        - *The other Gram matrix.* $AA^\top = U\Sigma\Sigma^\top U^\top$: the $\mathbf{u}_i$ are eigenvectors of $AA^\top$ with the same nonzero eigenvalues $\sigma_i^2$.
        - *Pseudo-inverse.* $A^+ = V\Sigma^+U^\top$, where $\Sigma^+$ inverts the nonzero $\sigma_i$ and transposes the shape. Undo each rotation and each scaling that can be undone.

        **Singular values and eigenvalues.** They are different things. For a symmetric positive semidefinite matrix they coincide, and the SVD is the spectral decomposition. For a symmetric matrix in general, $\sigma_i = |\lambda_i|$. For other square matrices the only general relations are $|\det A| = \prod\sigma_i = \prod|\lambda_i|$ and $\sigma_n \le |\lambda| \le \sigma_1$ for every eigenvalue.

        **Uniqueness.** The singular values are uniquely determined. The vectors are not: a pair $\mathbf{u}_i, \mathbf{v}_i$ can be replaced by $-\mathbf{u}_i, -\mathbf{v}_i$, and for repeated singular values there is more freedom.

        **In NumPy.** `U, s, Vt = np.linalg.svd(A)` returns the singular values as a 1-D array `s` in decreasing order, and returns $V^\top$, not $V$. The right singular vectors are the **rows** of `Vt`. With `full_matrices=False` it returns the reduced shapes. The routine works on $A$ directly and never forms $A^\top A$, which would square the condition number.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the construction of the singular value decomposition of a matrix A.
        steps:
          - 'Form the symmetric positive semidefinite matrix $A^\top A$.'
          - 'Take its orthonormal eigenvectors $\mathbf{v}_i$, with eigenvalues $\lambda_i \ge 0$ in decreasing order.'
          - 'Define $\sigma_i = \sqrt{\lambda_i}$.'
          - 'For each $\sigma_i > 0$ define $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$, and check that these are orthonormal.'
          - 'Complete the $\mathbf{u}_i$ to an orthonormal basis and assemble $A = U\Sigma V^\top$.'
        explanation: The right singular vectors come from the spectral theorem, the singular values are square roots, and the left singular vectors are the normalised images.
  formal:
    - text: |
        **Theorem (SVD).** Every $A \in \mathbb{R}^{m \times n}$ can be written $A = U\Sigma V^\top$ with $U \in \mathbb{R}^{m \times m}$ and $V \in \mathbb{R}^{n \times n}$ orthogonal, and $\Sigma \in \mathbb{R}^{m \times n}$ zero except for diagonal entries $\sigma_1 \ge \sigma_2 \ge \dots \ge \sigma_{\min(m,n)} \ge 0$. For complex $A$: $A = U\Sigma V^{\mathsf H}$ with $U, V$ unitary.

        **Singular values.** $\sigma_i(A) = \sqrt{\lambda_i(A^\top A)}$. They are unique. $\operatorname{rank}A$ is the number of positive ones.

        **Singular vectors.** $A\mathbf{v}_i = \sigma_i\mathbf{u}_i$ and $A^\top\mathbf{u}_i = \sigma_i\mathbf{v}_i$. $A^\top A\mathbf{v}_i = \sigma_i^2\mathbf{v}_i$ and $AA^\top\mathbf{u}_i = \sigma_i^2\mathbf{u}_i$.

        **Dyadic form.** $A = \sum_{i=1}^r \sigma_i\mathbf{u}_i\mathbf{v}_i^\top$, $r = \operatorname{rank}A$.

        **Subspaces.** $\operatorname{im}A = \operatorname{span}(\mathbf{u}_1..\mathbf{u}_r)$, $\ker A^\top = \operatorname{span}(\mathbf{u}_{r+1}..\mathbf{u}_m)$, $\operatorname{im}A^\top = \operatorname{span}(\mathbf{v}_1..\mathbf{v}_r)$, $\ker A = \operatorname{span}(\mathbf{v}_{r+1}..\mathbf{v}_n)$.

        **Variational description.** $\sigma_k(A) = \max\limits_{\dim S = k}\ \min\limits_{\mathbf{x} \in S, \|\mathbf{x}\| = 1}\|A\mathbf{x}\|$, by Courant-Fischer for $A^\top A$. Hence $|\sigma_k(A + E) - \sigma_k(A)| \le \sigma_1(E)$: singular values are perfectly conditioned.

        **Pseudo-inverse.** $A^+ = \sum_{i=1}^r \sigma_i^{-1}\mathbf{v}_i\mathbf{u}_i^\top$.

        **Polar decomposition.** For square $A$: $A = (UV^\top)(V\Sigma V^\top)$, an orthogonal matrix times a symmetric positive semidefinite one.

        **Invariance.** $\sigma_i(QAP) = \sigma_i(A)$ for orthogonal $Q, P$, and $\sigma_i(A^\top) = \sigma_i(A)$.
