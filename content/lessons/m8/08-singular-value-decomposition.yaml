            def rank_and_condition(A):
                s = np.abs(np.linalg.eigvals(A.T @ A).real)
                rank = int((s > 1e-10 * s.max()).sum())
                if rank < len(s):
                    return rank, np.inf
                return rank, float(s.max() / s.min())


