        solution: |
          import numpy as np


          def first_share(X):
              s = np.linalg.svd(X - X.mean(axis=0), compute_uv=False)
              return float(s[0] ** 2 / (s ** 2).sum())


          X = np.array([[2.0, 0.0, 1.0], [4.0, 1.0, 3.0], [6.0, 1.0, 2.0], [8.0, 2.0, 6.0], [10.0, 1.0, 3.0]])
          print(round(first_share(X), 4))
        tests: |
          import numpy as _np
          _X = _np.array([[2.0, 0.0, 1.0], [4.0, 1.0, 3.0], [6.0, 1.0, 2.0], [8.0, 2.0, 6.0], [10.0, 1.0, 3.0]])
          assert abs(first_share(_X) - 0.84550304) < 1e-6, "For this table the first component explains about 84.55% of the variance. Subtract the average of each column before the decomposition"
          assert abs(first_share(_X + 100.0) - 0.84550304) < 1e-6, "Adding 100 to every entry moves the cloud and does not change how it varies, so the share should stay at 0.8455"
          _P = _np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          assert abs(first_share(_P) - 0.98842818) < 1e-6, "For the six pupils the first component explains about 98.84%"
          _L = _np.array([[0.0, 10.0], [1.0, 10.0], [2.0, 10.0], [3.0, 10.0]])
          assert abs(first_share(_L) - 1.0) < 1e-9, "When the second column is constant, all the variance is along the first, and the share is 1"
          assert output.strip() == "0.8455", "The program should print 0.8455"
        wrong:
          - |
            import numpy as np


            def first_share(X):
                s = np.linalg.svd(X, compute_uv=False)
                return float(s[0] ** 2 / (s ** 2).sum())


            print("0.8455")
