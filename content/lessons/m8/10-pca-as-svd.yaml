        explanation: |
          `Xc @ W.T` are the scores, one row of `k` numbers per observation. Multiplying by `W` turns each row of scores back into a point of the original space, on the subspace spanned by the components. Adding `mean` moves the origin back.

          The first pupil, with marks $(1, 2)$, is rebuilt as $(1.39, 1.67)$: the nearest point on the line through $(5, 6)$ in the direction $(0.64, 0.77)$. The total error over all six pupils is $1.0864$, the discarded singular value, exactly as Eckart-Young says.

          The third wrong version does a truncated SVD of the raw table. That is the best rank-one approximation of $X$ by a line **through the origin**. PCA allows the line to pass through the centre of the cloud, which is a different and better fit. For data far from the origin the difference is large.
    - question:
