        explanation: |
          Three lines: centre, decompose, slice. `X.mean(axis=0)` is the row of column averages, and subtracting it broadcasts over the rows. The components are the first `k` rows of `Vt`, and the variances are the squared singular values over $n - 1$.

          The program prints the first component with absolute values, because its sign is arbitrary and any test of PCA code has to allow for that. The tests here compare `W @ W.T` with the identity and compare variances, both of which do not depend on signs.

          The first wrong version skips the centring. For the pupils it reports a first "variance" of about 93, when the total variance of the data is only 20.4. Most of what it measures is the distance of the cloud from the origin.
    - question:
        id: write-reconstruct
        type: code
        mode: write
        system: s2
        prompt: |
          Write `reconstruct(X, k)` returning the best approximation of the data that uses `k` numbers per row: project the centred rows onto the first `k` principal components, and add the column averages back. The result has the same shape as `X`.
        starter: |
          import numpy as np


          def reconstruct(X, k):
              return X * 0.0


          X = np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          R = reconstruct(X, 1)
          print([round(float(v), 2) for v in R[0]])
          print(round(float(np.linalg.norm(X - R)), 4))
        solution: |
          import numpy as np


          def reconstruct(X, k):
              mean = X.mean(axis=0)
              Xc = X - mean
              U, s, Vt = np.linalg.svd(Xc, full_matrices=False)
              W = Vt[:k]
              return mean + (Xc @ W.T) @ W


          X = np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          R = reconstruct(X, 1)
          print([round(float(v), 2) for v in R[0]])
          print(round(float(np.linalg.norm(X - R)), 4))
        tests: |
          import numpy as _np
          _X = _np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          _R = reconstruct(_X, 1)
          assert _np.shape(_R) == (6, 2), "The reconstruction has the same shape as the data"
          assert _np.allclose(_R.mean(axis=0), [5.0, 6.0]), "The reconstruction should have the same column averages as the data, 5 and 6. Add the averages back"
          assert abs(float(_np.linalg.norm(_X - _R)) - 1.0864277112) < 1e-8, "With one component the error for the pupils should be the second singular value of the centred table, about 1.0864"
          assert _np.linalg.matrix_rank(_R - _R.mean(axis=0)) == 1, "With one component the centred reconstruction should have rank 1: the points lie on a line"
