        code: |
          import numpy as np

          X = np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          Xc = X - X.mean(axis=0)
          U, s, Vt = np.linalg.svd(Xc, full_matrices=False)
          Z = Xc @ Vt.T
          print(np.allclose(Z, U * s))
          print([[round(float(v), 4) + 0.0 for v in row] for row in Z.T @ Z / 5])
        output: |
          True
          [[20.1639, 0.0], [0.0, 0.2361]]
        explanation: The scores are the left singular vectors scaled by the singular values. Their covariance matrix is diagonal, so the two scores are uncorrelated, with the variances on the diagonal.
  work:
    - text: Slower now. The first task is the whole method.
    - question:
        id: write-pca
        type: code
        mode: write
        system: s2
        prompt: |
          Write `pca(X, k)` for a data matrix with one observation per row. Return the pair `(components, variances)`: the first `k` principal components as the **rows** of a `k` by `d` array, and the variances along them as an array of length `k`, with divisor `n - 1`.
        starter: |
          import numpy as np


          def pca(X, k):
              d = X.shape[1]
              return np.eye(d)[:k], np.ones(k)


          X = np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          W, variances = pca(X, 2)
          print([round(float(v), 4) for v in variances])
          print([round(abs(float(v)), 4) for v in W[0]])
        solution: |
          import numpy as np


          def pca(X, k):
              Xc = X - X.mean(axis=0)
              U, s, Vt = np.linalg.svd(Xc, full_matrices=False)
              return Vt[:k], s[:k] ** 2 / (len(X) - 1)


          X = np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          W, variances = pca(X, 2)
          print([round(float(v), 4) for v in variances])
          print([round(abs(float(v)), 4) for v in W[0]])
        tests: |
          import numpy as _np
          _X = _np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
          _out = pca(_X, 2)
          assert isinstance(_out, tuple) and len(_out) == 2, "pca should return the pair (components, variances)"
          _W, _v = _out
          assert _np.shape(_W) == (2, 2) and _np.shape(_v) == (2,), "For the pupils and k = 2 there are two components of length 2 and two variances"
          assert _np.allclose(_v, [20.16393497, 0.23606503]), "The variances for the pupils are about 20.1639 and 0.2361. Centre the columns, square the singular values and divide by n - 1"
          assert _np.allclose(_np.abs(_W[0]), [0.640058, 0.7683266], atol=1e-6), "The first component for the pupils is (0.6401, 0.7683), up to sign"
          _Y = _np.array([[2.0, 0.0, 1.0], [4.0, 1.0, 3.0], [6.0, 1.0, 2.0], [8.0, 2.0, 6.0], [10.0, 1.0, 3.0]])
          _W, _v = pca(_Y, 2)
          assert _np.shape(_W) == (2, 3) and _np.shape(_v) == (2,), "For a table with 3 columns and k = 2 the components form a 2 by 3 array, one component per row"
          assert _np.allclose(_W @ _W.T, _np.eye(2)), "The components should be orthonormal"
          assert _np.allclose(_v, [11.83704254, 2.12316759]), "For the 5 by 3 table the first two variances are about 11.8370 and 2.1232"
          _z = (_Y - _Y.mean(axis=0)) @ _W[0]
          assert abs(float((_z ** 2).sum() / 4) - 11.83704254) < 1e-6, "The scores on the first component should have variance equal to the first returned variance"
          _R = _np.random.default_rng(0).normal(size=(30, 4)) + 5.0
          _W, _v = pca(_R, 4)
          assert abs(float(_v.sum()) - float(_R.var(axis=0, ddof=1).sum())) < 1e-9, "With all components kept, the variances should add up to the total variance of the columns"
          assert output.strip() == "[20.1639, 0.2361]\n[0.6401, 0.7683]", "The program should print [20.1639, 0.2361] and then [0.6401, 0.7683]"
        wrong:
          - |
