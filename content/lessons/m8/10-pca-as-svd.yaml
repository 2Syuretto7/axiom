concept: m8.pca-as-svd
minutes: 90
claim: You can carry out principal component analysis with the singular value decomposition of the centred data matrix, explain why the first right singular vector is the direction of greatest variance and why the same directions give the smallest reconstruction error, compute the variance along each component and the share it explains, project data to scores and reconstruct it, and name the three standard mistakes, which are forgetting to centre, mixing units, and reading meaning into signs.
recalls: [m8.eckart-young-theorem]
uses: [m8.singular-value-decomposition, m8.quadratic-forms-and-the-rayleigh-quotient, m8.spectral-theorem, m8.positive-definite-matrices-and-cholesky, m7.projection-onto-a-subspace, m7.orthonormal-bases, m7.conditioning, m4.projection-onto-a-vector, m4.norms-and-distance, e5.linear-algebra-routines, e5.axis-operations-and-reductions, e5.broadcasting, e5.arrays-dtype-and-shape, e0.functions]
leads: [m8.operator-and-frobenius-norms]
starter: |
  # Scratch space. Six pupils, two tests. One row per pupil.
  # How much do the marks vary in each test, and along the best single direction?
  import numpy as np

  X = np.array([[1.0, 2.0], [3.0, 3.0], [4.0, 5.0], [6.0, 6.0], [7.0, 9.0], [9.0, 11.0]])
  Xc = X - X.mean(axis=0)
  print([round(float(v), 4) for v in (Xc ** 2).sum(axis=0) / 5])

  s = np.linalg.svd(Xc, compute_uv=False)
  print([round(float(v), 4) for v in s ** 2 / 5])
parts:
  recall:
    - text: |
        [[m8.eckart-young-theorem]] showed that cutting the singular value decomposition short gives the closest matrix of low rank. Today the matrix is a table of data, and the theorem becomes a method. Three quick pulls first.
  puzzle:
    - text: |
        Six pupils sat two tests. Each row is a pupil.

        $$X = \begin{pmatrix} 1 & 2 \\ 3 & 3 \\ 4 & 5 \\ 6 & 6 \\ 7 & 9 \\ 9 & 11 \end{pmatrix}$$

        Suppose only **one** number per pupil can be kept. Keeping the first test throws the second away, and the other way round. The two columns clearly move together, so it feels as if one well-chosen number should carry almost everything.

        A fair way to measure what a number carries is its **variance**: how much it differs from pupil to pupil. A number that is the same for everyone tells nothing. The starter computes the variance of each test, and then something from the singular values of the table with its column averages removed.

        ```
        [8.4, 12.0]
        [20.1639, 0.2361]
        ```

        The two tests have variances 8.4 and 12, adding to 20.4. The second line also adds to 20.4, but splits it very differently: 20.16 and 0.24.

        **What single number per pupil has variance 20.16, nearly the whole of it? And what is the leftover 0.24?**
  intuition:
    - text: |
        Plot the six pupils as points in the plane. They form a thin cloud along a slanted line. Move the origin to the centre of the cloud, the point of averages $(5, 6)$.

        Any unit vector $\mathbf{w}$ gives one number per pupil: the coordinate of the pupil's point along $\mathbf{w}$, a dot product. Taking $\mathbf{w} = (1, 0)$ gives the first test. Taking $\mathbf{w} = (0, 1)$ gives the second. Other directions give weighted mixtures.

        The cloud is long in one direction and thin across it. Along the long direction, about $(0.64, 0.77)$, the coordinates are spread widely: variance 20.16. Across it they hardly vary: variance 0.24. A rotation of the axes has moved nearly all the variation into one coordinate.

        Finding the direction is a problem already solved. If the centred points are the rows of $X_c$, the coordinates along $\mathbf{w}$ are the entries of $X_c\mathbf{w}$, and their spread is $\|X_c\mathbf{w}\|^2$. The unit vector that a matrix stretches most is its **first right singular vector**. The next direction, perpendicular to the first, is the second, and so on.

        This is **principal component analysis**, PCA: the singular value decomposition of a centred table. The directions are the **principal components**. Keeping the first $k$ coordinates is the truncated SVD, so by Eckart-Young it is also the closest that any $k$ numbers per row can come to the full table.
  derivation:
    - text: |
        **Setting.** $X$ is $n \times d$: $n$ observations as rows, $d$ measured quantities as columns.

        **Step 1. Centre.** Subtract from each column its average: $X_c = X - \mathbf{1}\bar{\mathbf{x}}^\top$. Every column of $X_c$ has average zero.

        **Step 2. Variance along a direction.** The **variance** of numbers $z_1, \dots, z_n$ with average zero is $\frac{1}{n-1}\sum z_i^2$. For a unit vector $\mathbf{w}$ the coordinates along it are $\mathbf{z} = X_c\mathbf{w}$, with variance

        $$\frac{1}{n-1}\|X_c\mathbf{w}\|^2 = \mathbf{w}^\top C\mathbf{w}, \qquad C = \frac{1}{n-1}X_c^\top X_c.$$

        $C$ is the **covariance matrix**, $d \times d$, symmetric and positive semidefinite. Its diagonal holds the variances of the columns, and its trace is the **total variance**.

        **Step 3. Maximise.** $\mathbf{w}^\top C\mathbf{w}$ over unit vectors is a Rayleigh quotient. Its maximum is the largest eigenvalue of $C$, at the top eigenvector. With the SVD $X_c = U\Sigma V^\top$,

        $$C = \frac{1}{n-1}V\Sigma^2V^\top.$$

        So the eigenvectors of $C$ are the right singular vectors $\mathbf{v}_i$ of $X_c$, and the eigenvalues are $\sigma_i^2/(n-1)$.

        - The **principal components** are $\mathbf{v}_1, \mathbf{v}_2, \dots$, orthonormal directions in $\mathbb{R}^d$.
        - The **variance along** $\mathbf{v}_i$ is $\sigma_i^2/(n-1)$, and these add up to the total variance.
        - The **share explained** by component $i$ is $\sigma_i^2/\sum_j\sigma_j^2$.

        By Courant-Fischer, $\mathbf{v}_2$ has the greatest variance among directions perpendicular to $\mathbf{v}_1$, and so on down.

        **Step 4. Scores.** The coordinates of the centred data along the first $k$ components are the **scores**

        $$Z = X_cV_k = U_k\Sigma_k, \qquad n \times k.$$

        Their covariance matrix is $\frac{1}{n-1}\Sigma_k^2$, diagonal: different scores are uncorrelated.

        *The puzzle.* The centred table has singular values $10.0409$ and $1.0864$. Dividing their squares by $5$ gives $20.1639$ and $0.2361$. The first component is $(0.6401, 0.7683)$: the single number is $0.64$ times the first mark plus $0.77$ times the second, measured from the averages. It carries $20.1639/20.4 = 98.8\%$ of the variance.
    - question:
        id: derivation-variance
        type: numeric
        system: s2
        prompt: |
          A centred data matrix with 10 rows has singular values 6 and 3. What is the variance of the data along its first principal component?
        answer: "4"
        explanation: |
          $\sigma_1^2/(n - 1) = 36/9 = 4$. Along the second component it is $9/9 = 1$, so the total variance is 5 and the first component explains $4/5 = 80\%$. The share can be found without $n$, as $36/(36 + 9)$, since the divisor cancels.
    - text: |
        **Reconstruction.** From the scores, the data are rebuilt as

        $$\hat X = \mathbf{1}\bar{\mathbf{x}}^\top + ZV_k^\top = \mathbf{1}\bar{\mathbf{x}}^\top + X_cV_kV_k^\top.$$

        Each centred row is projected onto the span of the first $k$ components, and the averages are added back. The centred part of $\hat X$ is the truncated SVD of $X_c$. By Eckart-Young no other choice of $k$ directions gives a smaller total squared error, and that error is $\sigma_{k+1}^2 + \dots + \sigma_d^2$.

        **Two aims, one answer.** For each centred row $\mathbf{x}$, Pythagoras gives $\|\mathbf{x}\|^2 = \|\text{projection}\|^2 + \|\text{residual}\|^2$. The left side is fixed by the data. So making the projections as spread out as possible and making the residuals as small as possible are the same problem. PCA is at once the directions of **greatest variance** and the subspace of **least reconstruction error**. In the puzzle the leftover variance $0.2361$ is the squared error per pupil of describing each one by a single number, with the same divisor $n - 1$.

        **Three standard mistakes.**

        - *Not centring.* Without Step 1 the first singular vector mostly points from the origin towards the average of the data, and describes where the cloud is, not how it varies.
        - *Mixed units.* Variance depends on units. A column in millimetres has a million times the variance of the same column in metres, and will dominate. When the columns are different kinds of quantity, divide each centred column by its standard deviation first. PCA is then done on the correlation matrix.
        - *Reading signs.* $\mathbf{v}_i$ and $-\mathbf{v}_i$ are equally valid, and different libraries return different ones. Only the line matters.

        **In NumPy.**

        ```python
        mean = X.mean(axis=0)
        U, s, Vt = np.linalg.svd(X - mean, full_matrices=False)
        components = Vt[:k]                    # one per row
        variances = s[:k] ** 2 / (len(X) - 1)
        scores = (X - mean) @ components.T
        ```

        The SVD of $X_c$ is preferred to the eigendecomposition of $C$: forming $X_c^\top X_c$ squares the condition number.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps of principal component analysis on a data matrix X with observations as rows.
        steps:
          - 'Subtract from each column its average.'
          - 'Compute the singular value decomposition of the centred matrix.'
          - 'Take the first $k$ right singular vectors as the principal components.'
          - 'Project the centred rows onto them to get the scores.'
          - 'To reconstruct, multiply the scores by the components and add the averages back.'
        explanation: Centre, decompose, keep the leading directions, project, and undo.
  formal:
    - text: |
        **Data.** $X \in \mathbb{R}^{n \times d}$, mean $\bar{\mathbf{x}} = \frac1nX^\top\mathbf{1}$, centred $X_c = X - \mathbf{1}\bar{\mathbf{x}}^\top$.

        **Covariance.** $C = \frac{1}{n-1}X_c^\top X_c \succeq 0$. $\operatorname{Var}(X_c\mathbf{w}) = \mathbf{w}^\top C\mathbf{w}$.

        **PCA.** With $X_c = U\Sigma V^\top$: $C = V\frac{\Sigma^2}{n-1}V^\top$. The $i$th principal component is $\mathbf{v}_i$, with variance $\lambda_i = \sigma_i^2/(n-1)$.

        **Variational property.** $\mathbf{v}_k = \arg\max\{\mathbf{w}^\top C\mathbf{w} : \|\mathbf{w}\| = 1,\ \mathbf{w} \perp \mathbf{v}_1, \dots, \mathbf{v}_{k-1}\}$.

        **Best subspace.** Among all $d \times k$ matrices $W$ with orthonormal columns, $W = V_k$ maximises $\operatorname{tr}(W^\top CW)$ and minimises $\|X_c - X_cWW^\top\|_F^2$. The minimum is $\sum_{i > k}\sigma_i^2$. Among all affine subspaces of dimension $k$, the one closest to the data passes through $\bar{\mathbf{x}}$.

        **Scores.** $Z = X_cV_k = U_k\Sigma_k$. $\frac{1}{n-1}Z^\top Z = \operatorname{diag}(\lambda_1, \dots, \lambda_k)$.

        **Explained variance.** $\sum_{i \le k}\lambda_i/\operatorname{tr}C = \sum_{i \le k}\sigma_i^2/\|X_c\|_F^2$.

        **Rank.** $\operatorname{rank}X_c \le \min(n - 1, d)$: centring removes one dimension, so at most $n - 1$ components have nonzero variance.

        **Whitening.** $Z\,\operatorname{diag}(\lambda_i^{-1/2})$ has identity covariance.

        **Dual form.** The nonzero eigenvalues of $X_cX_c^\top$ ($n \times n$) and $X_c^\top X_c$ ($d \times d$) agree, with $\mathbf{u}_i = X_c\mathbf{v}_i/\sigma_i$. When $d \gg n$ the smaller matrix can be used.
