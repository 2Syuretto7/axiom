          assert abs(float(_np.linalg.norm(_Y - reconstruct(_Y, 2))) - _s[2]) < 1e-9, "For the 5 by 3 table and k = 2 the error should be the third singular value of the centred table"
          assert abs(float(_np.linalg.norm(_Y - reconstruct(_Y, 1))) - float(_np.sqrt(_s[1] ** 2 + _s[2] ** 2))) < 1e-9, "For the 5 by 3 table and k = 1 the error should be the root of the sum of squares of the last two singular values"
          assert output.strip() == "[1.39, 1.67]\n1.0864", "The program should print [1.39, 1.67] and then 1.0864"
        wrong:
