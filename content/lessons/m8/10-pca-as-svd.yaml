                Xc = X - X.mean(axis=0)
                U, s, Vt = np.linalg.svd(Xc, full_matrices=False)
                return Vt[:k], s[:k] / (len(X) - 1)


            print("[20.1639, 0.2361]\n[0.6401, 0.7683]")
          - |
            import numpy as np


