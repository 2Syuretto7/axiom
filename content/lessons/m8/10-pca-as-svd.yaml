            import numpy as np


            def first_share(X):
                s = np.linalg.svd((X.T - X.mean(axis=1)).T, compute_uv=False)
                return float(s[0] ** 2 / (s ** 2).sum())


            print("0.8455")
          - |
            import numpy as np


            def first_share(X):
                s = np.linalg.svd(X - X.mean(axis=0), compute_uv=False)
                return float(s[0] / s.sum())


            print("0.8455")
        explanation: |
          The decomposition was applied to the raw table. Its first singular vector then points roughly from the origin to the average row $(6, 1, 3)$, and the first singular value measures how far the data are from the origin. That has nothing to do with how the rows differ from each other, and it gives a flattering share.

          The second test makes the point sharply. Adding 100 to every entry changes nothing about the variation in the data. The uncentred version then reports a share of 99.99%.

          Centring must be by **column**, `X.mean(axis=0)`. Subtracting the overall average `X.mean()` or the row averages are both different operations, and both run without error. A quick check after centring is that `Xc.mean(axis=0)` is zero.
    - question:
        id: work-units
        type: choice
        system: s2
        prompt: |
          A table has one row per person and two columns: height in millimetres, with variance about $10\,000$, and weight in kilograms, with variance about 100. PCA is applied after centring. What is the first component, and what should be done?
        options:
          - 'It is an even mix of height and weight, and nothing needs doing.'
          - 'It is almost exactly the height axis, only because millimetres make that column numerically large. Divide each centred column by its standard deviation before the decomposition, so that each quantity has variance 1 and the result does not depend on units.'
          - 'It is the weight axis, since weight matters more.'
          - 'PCA cannot be applied to columns in different units.'
        answer: 1
        explanation: |
          PCA maximises variance, and variance depends on units. Measured in metres the same heights would have variance $0.01$ and the first component would be the weight axis. Neither answer says anything about people. Standardising the columns removes the choice of units, and the components then describe how the quantities vary **together**. When all columns are already in the same unit, such as pixel intensities or marks out of 10, standardising is not needed and can even hurt, since it inflates columns that are nearly constant.
    - question:
        id: work-lost
        type: numeric
        system: s2
        prompt: |
          A centred data matrix has singular values $10, 5, 2, 1$. What share of the total variance is lost if only the first two components are kept? Answer as a decimal to 4 places.
        answer: "0.0385"
        explanation: |
          The squares are $100, 25, 4, 1$, total 130. The discarded share is $5/130 = 0.0385$, and the kept share $125/130 = 96.15\%$. The same number is the relative squared reconstruction error $\|X_c - \hat X_c\|_F^2/\|X_c\|_F^2$. Variance lost and squared error made are one quantity seen two ways.
    - question:
        id: work-equivalence
        type: choice
        system: s2
        prompt: |
          PCA is described in one book as "the directions of greatest variance" and in another as "the subspace with the smallest reconstruction error". Why do these agree?
        options:
          - 'They agree only for data in two dimensions.'
          - 'For each centred row, the squared length equals the squared length of its projection plus the squared length of the residual. The total is fixed by the data, so making the projections as large as possible makes the residuals as small as possible.'
          - 'They do not agree, and the two books describe different methods.'
          - 'Because variance and error are both always positive.'
        answer: 1
        explanation: |
          It is Pythagoras, applied row by row and summed. $\|X_c\|_F^2 = \|X_cW\|_F^2 + \|X_c - X_cWW^\top\|_F^2$ for any $W$ with orthonormal columns. The first term on the right is $(n - 1)$ times the variance captured, and the second is the squared reconstruction error. The first description comes from the Rayleigh quotient and the second from Eckart-Young, and the singular value decomposition serves both. The same identity is why an autoencoder with linear layers and squared error, trained to its optimum, finds the same subspace as PCA.
  connections:
    - text: |
        The single number with variance 20.16 is the coordinate of each pupil along the first **principal component**, the direction $(0.64, 0.77)$ through the centre of the cloud. The leftover 0.24 is the variance across it, and also the squared error of describing each pupil by that one number.

        **PCA** is the singular value decomposition of the centred data matrix. The right singular vectors are the components, $\sigma_i^2/(n - 1)$ are the variances along them, and the scores $X_cV_k$ are the data in the new coordinates. The directions of greatest variance and the subspace of least reconstruction error are the same thing, by Pythagoras. Centre first, mind the units, and ignore the signs.

        Throughout the last three lessons two different ways of measuring the size of a matrix have been in use: the largest stretch, and the root of the sum of squares. They gave different numbers for the same error. It is time to treat them properly, with their rules, their uses, and their relation to each other: [[m8.operator-and-frobenius-norms]].
