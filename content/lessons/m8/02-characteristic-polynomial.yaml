            import numpy as np


            def geometric_multiplicity(A, lam):
                n = len(A)
                return n - int(np.linalg.matrix_rank(A + lam * np.eye(n)))


            print("2 1 0")
          - |
            import numpy as np


            def geometric_multiplicity(A, lam):
                n = len(A)
                return n - int(np.linalg.matrix_rank(A * lam - np.eye(n)))


            print("2 1 0")
        explanation: |
          `A - lam` subtracts the number from **every** entry of the array, by broadcasting. The mathematics asks for $A - \lambda I$, which subtracts it from the diagonal only. NumPy raises no error, because subtracting a number from an array is a perfectly good operation. It is just a different one.

          With the fix, the matrix shows both kinds of multiplicity at once. Its characteristic polynomial is $(\lambda - 2)^2(\lambda - 5)$. The eigenvalue 2 has algebraic multiplicity 2 and here also geometric multiplicity 2. Change the entry in row 1, column 2 from 0 to 1 and the polynomial stays the same while the eigenspace of 2 collapses to a line.
    - question:
        id: work-identify
        type: choice
        system: s2
        prompt: |
          A real $2 \times 2$ matrix has trace 2 and determinant 5. What can be said about its eigenvalues, and about what it does to the plane?
        options:
          - 'They are 1 and 5.'
          - 'The discriminant is $4 - 20 < 0$, so they are the complex pair $1 \pm 2i$. No real direction is preserved: the map turns every vector, while scaling areas by 5.'
          - 'They are $2$ and $5$.'
          - 'The matrix is singular.'
        answer: 1
        explanation: |
          $\lambda^2 - 2\lambda + 5 = 0$ gives $\lambda = 1 \pm 2i$. Their sum is 2 and their product is $1 + 4 = 5$, as it must be. The absolute value of each is $\sqrt5$, so repeated application spirals outward, multiplying lengths by about $\sqrt5$ each step on average while rotating. Complex eigenvalues of a real matrix always mean rotation of this kind, and their absolute value says whether the spiral grows or decays. That is how the stability of a recurrent system is read from its matrix.
    - question:
        id: work-ab-ba
        type: numeric
        system: s2
        prompt: |
          $A$ is $2 \times 3$ and $B$ is $3 \times 2$, and the $2 \times 2$ matrix $AB$ has eigenvalues 3 and 5. The $3 \times 3$ matrix $BA$ has three eigenvalues. Two of them are 3 and 5. What is the third?
        answer: "0"
        explanation: |
          $BA$ maps $\mathbb{R}^3$ through $\mathbb{R}^2$ and back, so its rank is at most 2 and it is singular: 0 is an eigenvalue. For the others, if $AB\mathbf{v} = \lambda\mathbf{v}$ with $\lambda \ne 0$, then $B\mathbf{v} \ne \mathbf{0}$ and $BA(B\mathbf{v}) = B(AB\mathbf{v}) = \lambda(B\mathbf{v})$. So $AB$ and $BA$ share their nonzero eigenvalues, and the larger one makes up the count with zeros. Check with traces: $\operatorname{tr}(AB) = \operatorname{tr}(BA) = 8$. This fact is what lets $A^\top A$ and $AA^\top$ be used interchangeably later in the cluster.
    - question:
        id: work-why-not
        type: choice
        system: s2
        prompt: |
          Why does `np.linalg.eig` not compute eigenvalues by forming the characteristic polynomial and finding its roots?
        options:
          - 'Because the characteristic polynomial does not determine the eigenvalues.'
          - 'For degree 5 and above no formula for the roots exists, and, worse, the roots of a polynomial are extremely sensitive to small errors in its coefficients. Rounding in the coefficients alone can move the computed eigenvalues by far more than the eigenvalues of the matrix are sensitive to its entries.'
          - 'Because determinants cannot be computed for large matrices.'
          - 'It does compute them that way.'
        answer: 1
        explanation: |
          Passing through the coefficients turns a well-conditioned problem into a badly conditioned one, in the same way that forming $A^\top A$ squared the condition number of least squares. The standard example is the polynomial with roots $1, 2, \dots, 20$: changing one coefficient in the tenth significant digit makes several roots complex. Practical algorithms apply orthogonal similarity transformations to the matrix until it is triangular, and read the eigenvalues off the diagonal. In fact the usual way to find the roots of a polynomial numerically is to build a matrix that has it as characteristic polynomial and call an eigenvalue routine.
  connections:
    - text: |
        The golden ratio came out of a matrix of zeros and ones because eigenvalues are the roots of the **characteristic polynomial** $\det(\lambda I - A)$, here $\lambda^2 - \lambda - 1$. For a $2 \times 2$ matrix the polynomial is $\lambda^2 - (\operatorname{tr}A)\lambda + \det A$. In every size the eigenvalues add up to the trace and multiply to the determinant, and the whole polynomial is shared by similar matrices.

        A root has an **algebraic multiplicity**, and its eigenspace has a dimension, the **geometric multiplicity**, which can be smaller. Real matrices can have complex eigenvalues, in conjugate pairs. Numerical software avoids the polynomial altogether.

        The polynomial says how many eigenvalues there are. It does not say whether there are enough eigenvectors to form a basis. When there are, the map is a diagonal matrix in that basis, and every computation with it, powers, inverses, long-run behaviour, reduces to arithmetic on the eigenvalues. When that happens, and what the factorisation looks like, is next: [[m8.diagonalisation]].
