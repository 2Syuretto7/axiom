    - question:
        id: predict-trace-det
        type: predict
        system: s1
        prompt: A matrix, its eigenvalues, and two familiar numbers. What does this show?
        code: |
          import numpy as np

          A = np.array([[4.0, 1.0], [2.0, 3.0]])
          values = np.sort(np.linalg.eigvals(A).real)
          print([round(float(v), 4) for v in values])
          print(round(float(values.sum()), 4), round(float(np.trace(A)), 4))
          print(round(float(values.prod()), 4), round(float(np.linalg.det(A)), 4))
        output: |
          [2.0, 5.0]
          7.0 7.0
          10.0 10.0
        explanation: The eigenvalues 2 and 5 are the roots of lambda^2 - 7 lambda + 10. Their sum is the trace and their product is the determinant.
    - question:
        id: predict-multiplicity
        type: predict
        system: s1
        prompt: Two matrices with the same characteristic polynomial. What does this show?
        code: |
          import numpy as np

          for M in (np.array([[3.0, 0.0], [0.0, 3.0]]), np.array([[3.0, 1.0], [0.0, 3.0]])):
              eigenspace = 2 - int(np.linalg.matrix_rank(M - 3.0 * np.eye(2)))
              print(round(float(np.trace(M)), 4), round(float(np.linalg.det(M)), 4), eigenspace)
        output: |
          6.0 9.0 2
          6.0 9.0 1
        explanation: Both have trace 6 and determinant 9, so both have the polynomial (lambda - 3)^2. The first has a two-dimensional eigenspace and the second only a line. Algebraic multiplicity 2 in both cases, geometric multiplicity 2 and 1.
  work:
    - text: Slower now. The polynomial is a tool for small matrices and for reasoning.
    - question:
        id: write-two-by-two
        type: code
        mode: write
        system: s2
        prompt: |
          Write `eigenvalues(A)` for a real $2 \times 2$ array, using only its trace and determinant and the quadratic formula. Return a list of the real eigenvalues as floats in increasing order: two entries when the discriminant is not negative (the same number twice for a repeated root), and the empty list when the eigenvalues are not real.
        starter: |
          import numpy as np


          def eigenvalues(A):
              return []


          print([round(v, 4) for v in eigenvalues(np.array([[1.0, 1.0], [1.0, 0.0]]))])
          print(eigenvalues(np.array([[0.0, -1.0], [1.0, 0.0]])))
        solution: |
          import numpy as np


          def eigenvalues(A):
              t = float(A[0, 0] + A[1, 1])
              d = float(A[0, 0] * A[1, 1] - A[0, 1] * A[1, 0])
              disc = t * t - 4 * d
              if disc < 0:
                  return []
              root = disc ** 0.5
              return [(t - root) / 2, (t + root) / 2]


          print([round(v, 4) for v in eigenvalues(np.array([[1.0, 1.0], [1.0, 0.0]]))])
          print(eigenvalues(np.array([[0.0, -1.0], [1.0, 0.0]])))
        tests: |
          import numpy as _np
          _e = eigenvalues(_np.array([[4.0, 1.0], [2.0, 3.0]]))
          assert isinstance(_e, list) and len(_e) == 2, "A matrix with two real eigenvalues should give a list of two numbers"
          assert _np.allclose(_e, [2.0, 5.0]), "[[4, 1], [2, 3]] has trace 7 and determinant 10, so the eigenvalues are 2 and 5, smaller first"
          assert _np.allclose(eigenvalues(_np.array([[1.0, 1.0], [1.0, 0.0]])), [(1 - 5 ** 0.5) / 2, (1 + 5 ** 0.5) / 2]), "The Fibonacci matrix has eigenvalues (1 - sqrt 5)/2 and (1 + sqrt 5)/2"
          assert eigenvalues(_np.array([[0.0, -1.0], [1.0, 0.0]])) == [], "A quarter turn has no real eigenvalues, so the list is empty"
          assert _np.allclose(eigenvalues(_np.array([[3.0, 1.0], [0.0, 3.0]])), [3.0, 3.0]), "A repeated eigenvalue appears twice: [3.0, 3.0]"
          assert _np.allclose(eigenvalues(_np.array([[0.0, 2.0], [3.0, 0.0]])), [-(6 ** 0.5), 6 ** 0.5]), "[[0, 2], [3, 0]] has trace 0 and determinant -6, so the eigenvalues are plus and minus sqrt 6"
          assert _np.allclose(eigenvalues(_np.array([[-1.0, 0.0], [0.0, -4.0]])), [-4.0, -1.0]), "For diag(-1, -4) the list in increasing order is [-4.0, -1.0]"
          assert output.strip() == "[-0.618, 1.618]\n[]", "The program should print [-0.618, 1.618] and then []"
        wrong:
          - |
            import numpy as np


            def eigenvalues(A):
                t = float(A[0, 0] + A[1, 1])
                d = float(A[0, 0] * A[1, 1] - A[0, 1] * A[1, 0])
                disc = t * t - 4 * d
                if disc < 0:
                    return []
                root = disc ** 0.5
                return [(t + root) / 2, (t - root) / 2]


            print("[-0.618, 1.618]\n[]")
          - |
