          The middle coefficient is the sum of the products of the eigenvalues in pairs, $1 \cdot 2 + 1 \cdot 4 + 2 \cdot 4 = 14$. In terms of the matrix, $\operatorname{tr}(A^2) = \sum\lambda_i^2$, and $(\sum\lambda_i)^2 - \sum\lambda_i^2$ is twice the sum of the pairwise products. Every coefficient of the characteristic polynomial can be written with traces of powers in this way, which shows again that they are invariants.

          `A * A` squares the entries one by one and is not the matrix square. `evaluate` uses Horner's rule, one multiplication for each coefficient.
    - question:
        id: fix-shift
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `geometric_multiplicity(A, lam)` should return the dimension of the eigenspace of `lam`, which is $n - \operatorname{rank}(A - \lambda I)$. For the matrix in the program and $\lambda = 2$ the eigenspace is a plane, so the answer is 2. It prints 0. Fix it.
        starter: |
          import numpy as np


          def geometric_multiplicity(A, lam):
              n = len(A)
              return n - int(np.linalg.matrix_rank(A - lam))


          A = np.array([[2.0, 0.0, 0.0], [0.0, 2.0, 1.0], [0.0, 0.0, 5.0]])
          print(geometric_multiplicity(A, 2.0), geometric_multiplicity(A, 5.0), geometric_multiplicity(A, 3.0))
        solution: |
          import numpy as np


          def geometric_multiplicity(A, lam):
              n = len(A)
              return n - int(np.linalg.matrix_rank(A - lam * np.eye(n)))


          A = np.array([[2.0, 0.0, 0.0], [0.0, 2.0, 1.0], [0.0, 0.0, 5.0]])
          print(geometric_multiplicity(A, 2.0), geometric_multiplicity(A, 5.0), geometric_multiplicity(A, 3.0))
        tests: |
          import numpy as _np
          _A = _np.array([[2.0, 0.0, 0.0], [0.0, 2.0, 1.0], [0.0, 0.0, 5.0]])
          assert geometric_multiplicity(_A, 2.0) == 2, "The eigenspace of 2 is a plane: subtract lam times the identity, which changes the diagonal only"
          assert geometric_multiplicity(_A, 5.0) == 1, "The eigenspace of 5 is a line"
          assert geometric_multiplicity(_A, 3.0) == 0, "3 is not an eigenvalue, so A - 3I is invertible and the kernel has dimension 0"
          _J = _np.array([[3.0, 1.0], [0.0, 3.0]])
          assert geometric_multiplicity(_J, 3.0) == 1, "For [[3, 1], [0, 3]] the eigenvalue 3 has a one-dimensional eigenspace"
          assert geometric_multiplicity(3.0 * _np.eye(2), 3.0) == 2, "For 3I every vector is an eigenvector"
          assert geometric_multiplicity(_np.ones((3, 3)), 0.0) == 2, "The all-ones matrix has rank 1, so its kernel, the eigenspace of 0, has dimension 2"
          assert geometric_multiplicity(_np.ones((3, 3)), 3.0) == 1, "The all-ones 3 by 3 matrix has the eigenvalue 3 with eigenvector (1, 1, 1)"
          assert output.strip() == "2 1 0", "The program should print 2 1 0"
        wrong:
          - |
