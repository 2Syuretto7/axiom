        explanation: |
          For a $2 \times 2$ matrix the eigenvalues depend on the entries only through the trace and the determinant. The discriminant $t^2 - 4d$ decides the kind: positive for two real eigenvalues, zero for a repeated one, negative for a complex pair.

          Reading the eigenvalues off the diagonal, the third wrong version, is right for triangular matrices only. The Fibonacci matrix has diagonal $1, 0$ and eigenvalues $1.618$ and $-0.618$.

          The Fibonacci numbers themselves follow. With $\varphi = 1.618\ldots$ and $\psi = -0.618\ldots$, the $n$th number is $(\varphi^n - \psi^n)/\sqrt5$, by splitting the starting vector into the two eigenvectors. Since $|\psi| < 1$ its power dies away, and the ratio of consecutive numbers tends to $\varphi$.
    - question:
        id: write-coefficients
        type: code
        mode: write
        system: s2
        prompt: |
          For a $3 \times 3$ matrix the characteristic polynomial is

          $$\lambda^3 - t\,\lambda^2 + m\,\lambda - d, \qquad t = \operatorname{tr}A,\quad m = \tfrac12\left(t^2 - \operatorname{tr}(A^2)\right),\quad d = \det A.$$

          Write `coefficients(A)` returning the list `[1.0, -t, m, -d]`, and `evaluate(coeffs, x)` returning the value of the polynomial with those coefficients, highest power first, at the number `x`.
        starter: |
          import numpy as np


          def coefficients(A):
              return [1.0, 0.0, 0.0, 0.0]


          def evaluate(coeffs, x):
              return 0.0


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          c = coefficients(A)
          print([round(v, 4) + 0.0 for v in c])
          print([round(evaluate(c, x), 4) + 0.0 for x in (1.0, 2.0, 4.0, 3.0)])
        solution: |
          import numpy as np


          def coefficients(A):
              t = float(np.trace(A))
              m = 0.5 * (t * t - float(np.trace(A @ A)))
              d = float(np.linalg.det(A))
              return [1.0, -t, m, -d]


          def evaluate(coeffs, x):
              value = 0.0
              for c in coeffs:
                  value = value * x + c
              return value


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          c = coefficients(A)
          print([round(v, 4) + 0.0 for v in c])
          print([round(evaluate(c, x), 4) + 0.0 for x in (1.0, 2.0, 4.0, 3.0)])
        tests: |
          import numpy as _np
          _A = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          _c = coefficients(_A)
          assert isinstance(_c, list) and len(_c) == 4, "There are four coefficients for a cubic"
          assert _np.allclose(_c, [1.0, -7.0, 14.0, -8.0]), "For this matrix the polynomial is lambda^3 - 7 lambda^2 + 14 lambda - 8: trace 7, m = (49 - 21)/2 = 14, determinant 8"
          assert _np.allclose(coefficients(_np.diag([1.0, 2.0, 3.0])), [1.0, -6.0, 11.0, -6.0]), "For diag(1, 2, 3) the polynomial is (x - 1)(x - 2)(x - 3) = x^3 - 6x^2 + 11x - 6"
          assert abs(evaluate([1.0, -7.0, 14.0, -8.0], 3.0) + 2.0) < 1e-9, "x^3 - 7x^2 + 14x - 8 at x = 3 is 27 - 63 + 42 - 8 = -2"
          assert abs(evaluate([2.0, 0.0, 1.0], 3.0) - 19.0) < 1e-9, "The coefficients are highest power first: [2, 0, 1] is 2x^2 + 1, which is 19 at x = 3"
          assert all(abs(evaluate(_c, x)) < 1e-8 for x in (1.0, 2.0, 4.0)), "The eigenvalues 1, 2, 4 of the matrix should be roots of its characteristic polynomial"
          _M = _np.random.default_rng(0).normal(size=(3, 3))
          assert all(abs(evaluate(coefficients(_M), complex(z))) < 1e-8 for z in _np.linalg.eigvals(_M)), "For a random 3 by 3 matrix every eigenvalue, real or complex, should be a root"
          assert output.strip() == "[1.0, -7.0, 14.0, -8.0]\n[0.0, 0.0, 0.0, -2.0]", "The program should print [1.0, -7.0, 14.0, -8.0] and then [0.0, 0.0, 0.0, -2.0]"
        wrong:
          - |
            import numpy as np


            def coefficients(A):
                t = float(np.trace(A))
                m = 0.5 * (t * t - float(np.trace(A @ A)))
                d = float(np.linalg.det(A))
                return [1.0, t, m, d]


            def evaluate(coeffs, x):
                value = 0.0
                for c in coeffs:
                    value = value * x + c
                return value


            print("[1.0, -7.0, 14.0, -8.0]\n[0.0, 0.0, 0.0, -2.0]")
          - |
            import numpy as np


            def coefficients(A):
                t = float(np.trace(A))
                m = 0.5 * (t * t - float(np.trace(A * A)))
                d = float(np.linalg.det(A))
