concept: m8.characteristic-polynomial
minutes: 85
claim: You can form the characteristic polynomial of a square matrix, find the eigenvalues of a 2 by 2 matrix from its trace and determinant, explain why the eigenvalues add up to the trace and multiply to the determinant, tell the algebraic multiplicity of an eigenvalue from its geometric multiplicity, say why similar matrices share a characteristic polynomial, and say what the polynomial reveals about complex eigenvalues of real matrices.
recalls: [m8.eigenvalues-and-eigenvectors]
uses: [m5.determinant, m6.matrix-of-a-linear-map-and-similarity, m6.rank-nullity-theorem, m5.rank, m1.polynomials, m1.quadratics, m1.complex-numbers, e5.linear-algebra-routines, e5.einsum, e0.functions, e0.booleans-and-conditionals]
leads: [m8.diagonalisation, m8.spectral-theorem, m8.jordan-form-and-the-matrix-exponential]
starter: |
  # Scratch space. Each step turns (a, b) into (a + b, a): the Fibonacci rule.
  # After many steps, what is the ratio of the two entries?
  import numpy as np

  A = np.array([[1.0, 1.0], [1.0, 0.0]])
  x = np.array([1.0, 1.0])
  for _ in range(30):
      x = A @ x
  print(round(float(x[0] / x[1]), 6))
parts:
  recall:
    - text: |
        [[m8.eigenvalues-and-eigenvectors]] found eigenvectors once an eigenvalue was known, and said that $\lambda$ is an eigenvalue exactly when $A - \lambda I$ is not invertible. Today turns that sentence into an equation that can be solved. Three quick pulls first.
  puzzle:
    - text: |
        The Fibonacci numbers $1, 1, 2, 3, 5, 8, 13, \dots$ are made by adding the last two. In matrix form, the pair (latest, previous) is multiplied each step by

        $$A = \begin{pmatrix} 1 & 1 \\ 1 & 0 \end{pmatrix}.$$

        The starter takes thirty steps and prints the ratio of the latest number to the one before.

        ```
        1.618034
        ```

        By the last lesson, after many steps the vector lines up with the eigenvector of the largest eigenvalue, and each further step multiplies it by that eigenvalue. So $1.618034$ should be an eigenvalue of $A$.

        But $A$ contains only zeros and ones, and the number that came out is not even a fraction.

        **How are the eigenvalues of a matrix determined by its entries, and where does $1.618034$ come from?**
  intuition:
    - text: |
        $\lambda$ is an eigenvalue of $A$ when $A - \lambda I$ squashes some nonzero vector to zero. A matrix does that exactly when its determinant is zero. So the eigenvalues are the numbers $\lambda$ with

        $$\det(A - \lambda I) = 0.$$

        Write the determinant out, with $\lambda$ as an unknown. For the Fibonacci matrix,

        $$\det\begin{pmatrix} 1 - \lambda & 1 \\ 1 & -\lambda \end{pmatrix} = (1 - \lambda)(-\lambda) - 1 = \lambda^2 - \lambda - 1.$$

        It is a polynomial in $\lambda$, called the **characteristic polynomial**, and the eigenvalues are its roots. Here they are $\dfrac{1 \pm \sqrt5}{2}$, that is $1.618034\ldots$ and $-0.618034\ldots$. The first is the golden ratio. It is irrational because solving a quadratic takes a square root, even when every coefficient is a whole number.

        For an $n \times n$ matrix the polynomial has degree $n$. That one fact explains a good deal: a matrix has at most $n$ eigenvalues, a real matrix may have none that are real, since real polynomials can lack real roots, and over the complex numbers it has exactly $n$, counted with multiplicity.

        Two coefficients of the polynomial are already familiar. For a $2 \times 2$ matrix it is always $\lambda^2 - (\text{trace})\lambda + (\text{determinant})$.
  derivation:
    - text: |
        **Definition.** The **characteristic polynomial** of an $n \times n$ matrix $A$ is

        $$p_A(\lambda) = \det(\lambda I - A).$$

        It has degree $n$ and leading coefficient 1. (Many books use $\det(A - \lambda I)$, which differs by the sign $(-1)^n$ and has the same roots.) Its roots are exactly the eigenvalues of $A$.

        **The $2 \times 2$ case.** For $A = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$,

        $$p_A(\lambda) = (\lambda - a)(\lambda - d) - bc = \lambda^2 - (a + d)\lambda + (ad - bc) = \lambda^2 - \operatorname{tr}(A)\,\lambda + \det(A).$$

        By the quadratic formula,

        $$\lambda = \frac{\operatorname{tr}A \pm \sqrt{(\operatorname{tr}A)^2 - 4\det A}}{2}.$$

        *Example.* $A = \begin{pmatrix} 4 & 1 \\ 2 & 3 \end{pmatrix}$ has trace 7 and determinant 10. $\lambda^2 - 7\lambda + 10 = (\lambda - 2)(\lambda - 5)$, so the eigenvalues are 2 and 5.

        The sign of the discriminant sorts $2 \times 2$ real matrices into three kinds: two different real eigenvalues, one repeated real eigenvalue, or a pair of complex ones. The quarter turn has trace 0 and determinant 1: $\lambda^2 + 1$, with roots $\pm i$.

        **Trace and determinant, in general.** Over $\mathbb{C}$ the polynomial factors completely:

        $$p_A(\lambda) = (\lambda - \lambda_1)(\lambda - \lambda_2)\cdots(\lambda - \lambda_n).$$

        Compare coefficients with $\det(\lambda I - A)$. Setting $\lambda = 0$ gives $\det(-A) = (-1)^n\det A$ on one side and $(-1)^n\lambda_1\cdots\lambda_n$ on the other. The coefficient of $\lambda^{n-1}$ is $-\operatorname{tr}A$ on one side (only the product of the diagonal entries $(\lambda - a_{ii})$ can contribute) and $-(\lambda_1 + \dots + \lambda_n)$ on the other. So

        $$\lambda_1 + \dots + \lambda_n = \operatorname{tr}A, \qquad \lambda_1\lambda_2\cdots\lambda_n = \det A,$$

        with each eigenvalue repeated according to its multiplicity as a root. In particular a matrix is singular exactly when 0 is an eigenvalue, which was known, and the determinant is the product of the stretch factors along the eigen-directions, which is why it measures volume.

        **Similar matrices.** If $B = P^{-1}AP$ then $\lambda I - B = P^{-1}(\lambda I - A)P$, so the determinants agree: $p_B = p_A$. The whole polynomial is an invariant of the map. Trace and determinant, the two invariants found in the last cluster, are two of its coefficients.

        **Triangular matrices.** $\lambda I - A$ is triangular with diagonal entries $\lambda - a_{ii}$, so $p_A(\lambda) = \prod(\lambda - a_{ii})$. The eigenvalues are on the diagonal.
    - question:
        id: derivation-larger
        type: numeric
        system: s2
        prompt: |
          $A = \begin{pmatrix} 2 & 2 \\ 1 & 3 \end{pmatrix}$. What is its larger eigenvalue?
        answer: "4"
        explanation: |
          Trace 5, determinant $6 - 2 = 4$. The characteristic polynomial is $\lambda^2 - 5\lambda + 4 = (\lambda - 1)(\lambda - 4)$, so the eigenvalues are 1 and 4. Check: they add up to the trace and multiply to the determinant. An eigenvector for 4 solves $(A - 4I)\mathbf{v} = \mathbf{0}$, that is $-2x + 2y = 0$, giving $(1, 1)$. Both rows of $A$ add up to 4, which was another way to see it.
    - text: |
        **Two kinds of multiplicity.** A root can be repeated. The **algebraic multiplicity** of an eigenvalue is its multiplicity as a root of $p_A$. Its **geometric multiplicity** is the dimension of its eigenspace, $n - \operatorname{rank}(A - \lambda I)$.

        Compare

        $$3I = \begin{pmatrix} 3 & 0 \\ 0 & 3 \end{pmatrix} \qquad\text{and}\qquad J = \begin{pmatrix} 3 & 1 \\ 0 & 3 \end{pmatrix}.$$

        Both have $p(\lambda) = (\lambda - 3)^2$: the eigenvalue 3 with algebraic multiplicity 2. For $3I$ the eigenspace is the whole plane, geometric multiplicity 2. For $J$, the matrix $J - 3I = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ has rank 1, so the eigenspace is a line, geometric multiplicity 1.

        The characteristic polynomial cannot tell these two apart. In general

        $$1 \le \text{geometric multiplicity} \le \text{algebraic multiplicity}.$$

        When the two are equal for every eigenvalue there are enough eigenvectors for a basis. When one falls short, as for $J$, there are not. The next lesson is about exactly that.

        **Real matrices, complex roots.** A polynomial with real coefficients has its non-real roots in conjugate pairs. So the non-real eigenvalues of a real matrix come in pairs $\lambda, \overline{\lambda}$, and their eigenvectors are conjugates too. A real matrix of **odd** size has a polynomial of odd degree, which must cross zero: it always has at least one real eigenvalue.

        **A warning about computing.** For $n \ge 5$ there is no formula for the roots, and finding the roots of a polynomial from its coefficients is badly conditioned: a tiny change in a coefficient can move the roots a great deal. Numerical libraries never form the characteristic polynomial. `np.linalg.eig` works on the matrix directly, with orthogonal similarity transformations. The polynomial is a tool for reasoning and for small matrices done by hand.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps for finding the eigenvalues and eigenvectors of a small matrix by hand.
        steps:
          - 'Form the matrix $\lambda I - A$ with $\lambda$ as an unknown.'
          - 'Take its determinant to get the characteristic polynomial.'
          - 'Find the roots of the polynomial: these are the eigenvalues.'
          - 'For each eigenvalue, solve $(A - \lambda I)\mathbf{v} = \mathbf{0}$.'
          - 'The nonzero solutions are the eigenvectors for that eigenvalue.'
        explanation: Eigenvalues first, from one polynomial equation, and then eigenvectors, from one linear system for each eigenvalue.
  formal:
    - text: |
        Let $A$ be an $n \times n$ matrix over $F$.

        **Characteristic polynomial.** $p_A(\lambda) = \det(\lambda I - A)$, monic of degree $n$:

        $$p_A(\lambda) = \lambda^n - \operatorname{tr}(A)\lambda^{n-1} + \dots + (-1)^n\det(A).$$

        $\lambda_0 \in F$ is an eigenvalue of $A$ if and only if $p_A(\lambda_0) = 0$.

        **Invariance.** Similar matrices have the same characteristic polynomial, so $p_T$ is defined for a linear map $T$ on a finite-dimensional space. The converse fails: $3I$ and $\begin{pmatrix} 3 & 1 \\ 0 & 3 \end{pmatrix}$.

        **Multiplicities.** The algebraic multiplicity $a(\lambda_0)$ is the multiplicity of $\lambda_0$ as a root of $p_A$. The geometric multiplicity is $g(\lambda_0) = \dim\ker(A - \lambda_0 I)$. Always $1 \le g(\lambda_0) \le a(\lambda_0)$.

        **Over $\mathbb{C}$.** $p_A$ splits into linear factors, $\sum_\lambda a(\lambda) = n$, $\operatorname{tr}A = \sum_i \lambda_i$ and $\det A = \prod_i \lambda_i$, counting with algebraic multiplicity.

        **Real matrices.** Non-real eigenvalues occur in conjugate pairs with equal multiplicities. If $n$ is odd there is a real eigenvalue.

        **Further identities.** $p_{A^\top} = p_A$, so $A$ and $A^\top$ have the same eigenvalues. For square $A, B$ of the same size, $AB$ and $BA$ have the same characteristic polynomial.

        **Cayley-Hamilton.** $p_A(A) = 0$: every matrix satisfies its own characteristic polynomial. For the Fibonacci matrix, $A^2 = A + I$.
