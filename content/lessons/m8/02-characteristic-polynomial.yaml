            def eigenvalues(A):
                t = float(A[0, 0] + A[1, 1])
                d = float(A[0, 0] * A[1, 1] + A[0, 1] * A[1, 0])
                disc = t * t - 4 * d
                if disc < 0:
                    return []
                root = disc ** 0.5
                return [(t - root) / 2, (t + root) / 2]


            print("[-0.618, 1.618]\n[]")
          - |
            import numpy as np


            def eigenvalues(A):
                return sorted([float(A[0, 0]), float(A[1, 1])])


            print("[-0.618, 1.618]\n[]")
          - |
            import numpy as np


            def eigenvalues(A):
                t = float(A[0, 0] + A[1, 1])
                d = float(A[0, 0] * A[1, 1] - A[0, 1] * A[1, 0])
                disc = t * t - 4 * d
                if disc <= 0:
                    return []
