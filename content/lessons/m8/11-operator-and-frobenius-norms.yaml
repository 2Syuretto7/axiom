concept: m8.operator-and-frobenius-norms
minutes: 85
claim: You can define a matrix norm and the operator norm induced by a vector norm, compute the induced 1-norm, infinity-norm and spectral norm and the Frobenius norm of a matrix, use the inequalities that make norms useful, which are the bound on a product and the bound on the image of a vector, relate the spectral and Frobenius norms through the singular values, distinguish all of them from the spectral radius, and choose the right norm for bounding the stretch of a layer or penalising the size of its weights.
recalls: [m8.pca-as-svd]
uses: [m8.eckart-young-theorem, m8.singular-value-decomposition, m8.eigenvalues-and-eigenvectors, m8.quadratic-forms-and-the-rayleigh-quotient, m6.cauchy-schwarz-and-the-triangle-inequality, m6.inner-product-spaces, m7.conditioning, m4.norms-and-distance, m5.matrix-multiplication-as-composition, m5.identity-and-inverse, e5.linear-algebra-routines, e5.axis-operations-and-reductions, e5.einsum, e0.functions, e0.loops]
leads: [m8.jordan-form-and-the-matrix-exponential]
starter: |
  # Scratch space. Four ways to say how big one matrix is.
  import numpy as np

  A = np.array([[3.0, 0.0], [4.0, 5.0]])
  print(float(np.abs(A).sum(axis=0).max()))
  print(float(np.abs(A).sum(axis=1).max()))
  print(round(float(np.linalg.svd(A, compute_uv=False)[0]), 4))
  print(round(float(np.sqrt((A ** 2).sum())), 4))
parts:
  recall:
    - text: |
        [[m8.pca-as-svd]] measured reconstruction error by the root of a sum of squares, and the lessons before it measured the largest stretch. Both are ways of giving a matrix a size. Today they get names, rules, and company. Three quick pulls first.
  puzzle:
    - text: |
        A sensor reading $\mathbf{x}$ passes through the matrix $A = \begin{pmatrix} 3 & 0 \\ 4 & 5 \end{pmatrix}$. The reading is uncertain by a small error $\mathbf{e}$. The output is then uncertain by $A\mathbf{e}$. How much bigger than $\mathbf{e}$ can $A\mathbf{e}$ be?

        Three engineers answer.

        - The first measures a vector by its ordinary length, and says: at most $6.71$ times.
        - The second measures a vector by its largest entry, since each entry must stay within a tolerance. She says: at most $9$ times.
        - The third measures a vector by the sum of the sizes of its entries, a total error budget. He says: at most $7$ times.

        A fourth adds up the squares of all entries of $A$, takes the root, and says $7.07$.

        The starter prints all four numbers.

        ```
        7.0
        9.0
        6.7082
        7.0711
        ```

        **Who is right? Where do 9 and 7 come from, which are suspiciously easy to read off the matrix? And is the fourth number a largest stretch of anything?**
  intuition:
    - text: |
        The first three engineers are all right, because they are answering different questions. "How much can $A$ enlarge a vector" depends on how vectors are measured. Each way of measuring vectors gives its own largest stretch, and that largest stretch is a way of measuring the matrix.

        Measure by ordinary length and the largest stretch is $\sigma_1 = 6.7082$, as the singular value decomposition showed.

        Measure by the **largest entry**. The worst input has every entry at full size, $\pm 1$, with signs chosen to make one output entry as big as possible. That output entry is then the sum of the absolute values along a row. The best row here is $4 + 5 = 9$.

        Measure by the **sum of entries**. The worst input puts its whole budget on a single coordinate, and the output is then one column of $A$. The largest column, measured the same way, is $3 + 4 = 7$.

        So: largest row sum, largest column sum, largest singular value. Each is an **operator norm**: the greatest factor by which the matrix can enlarge a vector, in some way of measuring.

        The fourth number is different in kind. It treats the matrix as a list of four numbers and takes its ordinary length: $\sqrt{9 + 0 + 16 + 25} = \sqrt{50}$. It is not the largest stretch in any measure. It is easy to compute and easy to differentiate, and it never underestimates the true stretch $\sigma_1$. This is the **Frobenius norm**.
  derivation:
    - text: |
        **Matrix norms.** A norm on matrices is a function $\|\cdot\|$ with the same three properties as a vector norm: $\|A\| \ge 0$ with equality only for $A = 0$; $\|cA\| = |c|\|A\|$; and $\|A + B\| \le \|A\| + \|B\|$.

        **Induced norms.** Fix a vector norm. The **operator norm** it induces is

        $$\|A\| = \max_{\mathbf{x} \ne \mathbf{0}} \frac{\|A\mathbf{x}\|}{\|\mathbf{x}\|}.$$

        Two inequalities follow at once and are the reason norms are used.

        $$\|A\mathbf{x}\| \le \|A\|\,\|\mathbf{x}\|, \qquad \|AB\| \le \|A\|\,\|B\|.$$

        The first is the definition rearranged. For the second: $\|AB\mathbf{x}\| \le \|A\|\|B\mathbf{x}\| \le \|A\|\|B\|\|\mathbf{x}\|$ for every $\mathbf{x}$. A norm with the second property is called **submultiplicative**. Also $\|I\| = 1$ for every induced norm.

        **The three standard ones.**

        - From $\|\mathbf{x}\|_1 = \sum|x_i|$: $\ \|A\|_1 = \max_j \sum_i |a_{ij}|$, the largest **column** sum.
        - From $\|\mathbf{x}\|_\infty = \max|x_i|$: $\ \|A\|_\infty = \max_i \sum_j |a_{ij}|$, the largest **row** sum.
        - From $\|\mathbf{x}\|_2$: $\ \|A\|_2 = \sigma_1(A)$, the **spectral norm**.

        *Why the column sum.* Write $A\mathbf{x} = \sum_j x_j\mathbf{a}_j$ with $\mathbf{a}_j$ the columns. By the triangle inequality $\|A\mathbf{x}\|_1 \le \sum_j |x_j|\|\mathbf{a}_j\|_1 \le \big(\max_j\|\mathbf{a}_j\|_1\big)\|\mathbf{x}\|_1$. Taking $\mathbf{x} = \mathbf{e}_j$ for the largest column gives equality.

        **The Frobenius norm.**

        $$\|A\|_F = \sqrt{\sum_{i,j} a_{ij}^2} = \sqrt{\operatorname{tr}(A^\top A)} = \sqrt{\sigma_1^2 + \dots + \sigma_r^2}.$$

        It comes from an inner product on matrices, $\langle A, B\rangle = \operatorname{tr}(A^\top B) = \sum a_{ij}b_{ij}$, so Cauchy-Schwarz and Pythagoras hold for it. It is submultiplicative, and $\|A\mathbf{x}\|_2 \le \|A\|_F\|\mathbf{x}\|_2$. It is **not** induced by any vector norm, since $\|I\|_F = \sqrt n$, not 1.

        *The puzzle.* $\|A\|_1 = 7$, $\|A\|_\infty = 9$, $\|A\|_2 = 6.7082$, $\|A\|_F = 7.0711$. Each engineer quoted the operator norm that matches the way they measure vectors, and the fourth quoted the Frobenius norm, an upper bound for the first engineer's answer.
    - question:
        id: derivation-one-norm
        type: numeric
        system: s2
        prompt: |
          What is $\|A\|_1$ for $A = \begin{pmatrix} 1 & -2 \\ 3 & 4 \end{pmatrix}$?
        answer: "6"
        explanation: |
          The column sums of absolute values are $1 + 3 = 4$ and $2 + 4 = 6$, so $\|A\|_1 = 6$, attained at $\mathbf{x} = (0, 1)$. The row sums are 3 and 7, so $\|A\|_\infty = 7$, attained at $\mathbf{x} = (1, 1)$. The signs of the entries do not matter for either, because the worst input can choose its own signs. A way to keep the two apart: the 1-norm is tall, a column, like the digit 1.
    - text: |
        **Spectral against Frobenius.** Both are functions of the singular values. With $r = \operatorname{rank}A$,

        $$\|A\|_2 \le \|A\|_F \le \sqrt r\,\|A\|_2.$$

        They are equal exactly when the rank is 1. They are furthest apart when all singular values are equal, as for an orthogonal matrix, with $\|Q\|_2 = 1$ and $\|Q\|_F = \sqrt n$. The ratio $\|A\|_F^2/\|A\|_2^2$ is called the **stable rank**: a number between 1 and $r$ that says how many directions the matrix effectively uses.

        Both are unchanged by orthogonal factors: $\|QAP\| = \|A\|$.

        **A cheap bound.** $\|A\|_2 \le \sqrt{\|A\|_1\|A\|_\infty}$. For the puzzle, $\sqrt{63} = 7.94 \ge 6.71$. No decomposition is needed.

        **Spectral radius.** $\rho(A) = \max|\lambda_i|$ is **not** a norm. The matrix $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ is not zero and has $\rho = 0$. What holds is

        $$\rho(A) \le \|A\| \quad\text{for every induced norm},$$

        since $\|A\|\|\mathbf{v}\| \ge \|A\mathbf{v}\| = |\lambda|\|\mathbf{v}\|$ for an eigenvector. The norm bounds one application: $\|A\mathbf{x}\| \le \|A\|\|\mathbf{x}\|$. The spectral radius decides the long run: $A^k \to 0$ exactly when $\rho(A) < 1$. For symmetric matrices $\rho(A) = \|A\|_2$ and there is no gap.

        **Condition number.** For any submultiplicative norm $\kappa(A) = \|A\|\|A^{-1}\|$, and $1 = \|I\| \le \|A\|\|A^{-1}\|$ shows $\kappa \ge 1$. In the spectral norm it is $\sigma_1/\sigma_n$.

        **In machine learning.** The spectral norm of a weight matrix is the Lipschitz constant of the linear layer: outputs differ by at most $\|W\|_2$ times the difference of the inputs. For a stack of layers the constants multiply, by submultiplicativity. The squared Frobenius norm is the **weight decay** penalty $\sum w_{ij}^2$, chosen because its gradient is simply $2W$.

        **In NumPy.** `np.linalg.norm(A)` with no second argument is the **Frobenius** norm. The others are `norm(A, 2)`, `norm(A, 1)` and `norm(A, np.inf)`.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the proof that an induced norm satisfies the product inequality.
        steps:
          - 'Take any vector $\mathbf{x}$ and write $AB\mathbf{x} = A(B\mathbf{x})$.'
          - 'Apply the bound for $A$ to the vector $B\mathbf{x}$: $\|AB\mathbf{x}\| \le \|A\|\,\|B\mathbf{x}\|$.'
          - 'Apply the bound for $B$: $\|B\mathbf{x}\| \le \|B\|\,\|\mathbf{x}\|$.'
          - 'Combine: $\|AB\mathbf{x}\|/\|\mathbf{x}\| \le \|A\|\,\|B\|$ for every nonzero $\mathbf{x}$.'
          - 'Take the maximum over $\mathbf{x}$: $\|AB\| \le \|A\|\,\|B\|$.'
        explanation: The bound on the image of a vector is used twice, and then the maximum is taken.
  formal:
    - text: |
        **Matrix norm.** $\|\cdot\| : \mathbb{R}^{m \times n} \to [0, \infty)$, definite, absolutely homogeneous, satisfying the triangle inequality. **Submultiplicative** if $\|AB\| \le \|A\|\|B\|$ whenever the product is defined.

        **Induced norm.** $\|A\|_{p} = \max_{\|\mathbf{x}\|_p = 1}\|A\mathbf{x}\|_p$. Every induced norm is submultiplicative and has $\|I\| = 1$.

        **Formulas.** $\|A\|_1 = \max_j\sum_i|a_{ij}|$. $\|A\|_\infty = \max_i\sum_j|a_{ij}| = \|A^\top\|_1$. $\|A\|_2 = \sigma_1(A) = \sqrt{\lambda_{\max}(A^\top A)}$.

        **Frobenius.** $\|A\|_F = \sqrt{\operatorname{tr}(A^\top A)}$, from $\langle A, B\rangle_F = \operatorname{tr}(A^\top B)$. $\|AB\|_F \le \|A\|_2\|B\|_F \le \|A\|_F\|B\|_F$.

        **Schatten norms.** $\|A\|_{S_p} = \big(\sum_i\sigma_i^p\big)^{1/p}$: nuclear norm ($p = 1$), Frobenius ($p = 2$), spectral ($p = \infty$). All are orthogonally invariant.

        **Comparisons** for $A \in \mathbb{R}^{m \times n}$ of rank $r$:

        $$\|A\|_2 \le \|A\|_F \le \sqrt r\|A\|_2, \qquad \tfrac{1}{\sqrt n}\|A\|_\infty \le \|A\|_2 \le \sqrt m\|A\|_\infty, \qquad \|A\|_2^2 \le \|A\|_1\|A\|_\infty.$$

        All norms on $\mathbb{R}^{m \times n}$ are equivalent: each is bounded by a constant multiple of any other.

        **Spectral radius.** $\rho(A) \le \|A\|$ for every submultiplicative norm. Gelfand: $\rho(A) = \lim_{k \to \infty}\|A^k\|^{1/k}$.

        **Neumann series.** If $\|E\| < 1$ in a submultiplicative norm then $I - E$ is invertible, $(I - E)^{-1} = \sum_{k \ge 0}E^k$, and $\|(I - E)^{-1}\| \le 1/(1 - \|E\|)$.

        **Duality.** $\|A\|_2 = \max_{\|\mathbf{x}\| = \|\mathbf{y}\| = 1}\mathbf{y}^\top A\mathbf{x}$.
  drill:
