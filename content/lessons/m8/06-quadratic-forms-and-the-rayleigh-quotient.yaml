concept: m8.quadratic-forms-and-the-rayleigh-quotient
minutes: 85
claim: You can write a quadratic form as x transpose A x with a symmetric matrix and read the matrix off the formula, rotate to principal axes in which the form has no cross terms, describe its level curves from the eigenvalues, define the Rayleigh quotient, prove that it lies between the smallest and largest eigenvalue with equality at the eigenvectors, and use that to find the direction of greatest variance or greatest stretch.
recalls: [m8.positive-definite-matrices-and-cholesky]
uses: [m8.spectral-theorem, m8.eigenvalues-and-eigenvectors, m8.characteristic-polynomial, m6.inner-product-spaces, m6.cauchy-schwarz-and-the-triangle-inequality, m7.orthonormal-bases, m7.conditioning, m4.norms-and-distance, m5.transpose, e5.linear-algebra-routines, e5.axis-operations-and-reductions, e5.random-number-generation, e0.functions]
leads: [m8.courant-fischer-min-max-theorem, m8.singular-value-decomposition, m8.pca-as-svd, m8.operator-and-frobenius-norms]
starter: |
  # Scratch space. A hundred thousand random directions x. For each one,
  # the number (x . A x) / (x . x). What are the smallest and the largest seen?
  import numpy as np

  A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
  X = np.random.default_rng(0).normal(size=(100000, 3))
  r = ((X @ A) * X).sum(axis=1) / (X * X).sum(axis=1)
  print(round(float(r.min()), 2), round(float(r.max()), 2))
  print([round(float(v), 2) for v in np.linalg.eigvalsh(A)])
parts:
  recall:
    - text: |
        [[m8.positive-definite-matrices-and-cholesky]] was about the **sign** of $\mathbf{x}^\top A\mathbf{x}$. Today is about its size, and about the directions in which it is largest and smallest. Three quick pulls first.
  puzzle:
    - text: |
        Take a symmetric matrix $A$ and a vector $\mathbf{x}$, and form the number

        $$\frac{\mathbf{x} \cdot A\mathbf{x}}{\mathbf{x} \cdot \mathbf{x}}.$$

        The starter computes it for a hundred thousand random vectors and prints the smallest and the largest value found. Below that it prints the eigenvalues of $A$.

        ```
        1.0 4.0
        [1.0, 2.0, 4.0]
        ```

        The values never drop below the smallest eigenvalue, never rise above the largest, and come as close to both as the sampling allows.

        A random vector is almost never an eigenvector. Yet the eigenvalues fence this number in.

        **Why is this quotient trapped between the smallest and the largest eigenvalue? And which vectors reach the ends?**
  intuition:
    - text: |
        The spectral theorem says a symmetric matrix stretches along perpendicular axes. Describe $\mathbf{x}$ by its coordinates $y_1, \dots, y_n$ along the orthonormal eigenvectors. Then $A\mathbf{x}$ has coordinates $\lambda_1y_1, \dots, \lambda_ny_n$, and

        $$\mathbf{x} \cdot A\mathbf{x} = \lambda_1y_1^2 + \dots + \lambda_ny_n^2, \qquad \mathbf{x} \cdot \mathbf{x} = y_1^2 + \dots + y_n^2.$$

        So the quotient is

        $$\frac{\lambda_1y_1^2 + \dots + \lambda_ny_n^2}{y_1^2 + \dots + y_n^2},$$

        a **weighted average of the eigenvalues**. The weight of $\lambda_i$ is the share of $\mathbf{x}$'s squared length that lies along the $i$th eigenvector.

        An average cannot fall outside the range of the things averaged. It equals the largest only when all the weight is on the largest, which is when $\mathbf{x}$ **is** an eigenvector for the largest eigenvalue.

        The quotient is called the **Rayleigh quotient**. It answers the question "by what factor does $A$ scale $\mathbf{x}$, on average over its components?" For an eigenvector the answer is the eigenvalue exactly. For any other vector it is a blend. This changes what an eigenvalue is: the largest eigenvalue of a symmetric matrix is the **maximum** of a function, and the eigenvector is where the maximum is attained. Eigenvalues become answers to optimisation problems.
  derivation:
    - text: |
        **Quadratic forms.** A **quadratic form** in $n$ variables is a polynomial in which every term has degree 2, such as

        $$q(x, y) = 3x^2 + 4xy + 6y^2.$$

        Every quadratic form is $q(\mathbf{x}) = \mathbf{x}^\top A\mathbf{x}$ for exactly one **symmetric** matrix $A$: the coefficient of $x_i^2$ goes on the diagonal, and the coefficient of $x_ix_j$ is split equally between the entries $(i, j)$ and $(j, i)$.

        $$3x^2 + 4xy + 6y^2 = \begin{pmatrix} x & y \end{pmatrix}\begin{pmatrix} 3 & 2 \\ 2 & 6 \end{pmatrix}\begin{pmatrix} x \\ y \end{pmatrix}.$$

        A non-symmetric $B$ also defines a form $\mathbf{x}^\top B\mathbf{x}$, but it is the same form as that of its symmetric part $\tfrac12(B + B^\top)$. Nothing is lost by assuming symmetry.

        **Principal axes.** Let $A = Q\Lambda Q^\top$ and put $\mathbf{y} = Q^\top\mathbf{x}$, the coordinates of $\mathbf{x}$ along the eigenvectors. Then

        $$\mathbf{x}^\top A\mathbf{x} = \mathbf{y}^\top\Lambda\mathbf{y} = \lambda_1y_1^2 + \dots + \lambda_ny_n^2.$$

        In the rotated coordinates the cross terms are gone. The eigenvectors are the **principal axes** of the form.

        *Example.* $\begin{pmatrix} 3 & 2 \\ 2 & 6 \end{pmatrix}$ has trace 9 and determinant 14, so eigenvalues 2 and 7, with eigenvectors $(2, -1)$ and $(1, 2)$. In coordinates along those, $q = 2y_1^2 + 7y_2^2$.

        **Level curves.** The set $\mathbf{x}^\top A\mathbf{x} = 1$ is $\lambda_1y_1^2 + \lambda_2y_2^2 = 1$.

        - Both eigenvalues positive: an ellipse, with semi-axes $1/\sqrt{\lambda_1}$ and $1/\sqrt{\lambda_2}$ along the eigenvectors. The **long** axis belongs to the **small** eigenvalue: where the form grows slowly, one must go far to reach 1.
        - Opposite signs: a hyperbola.

        The graph of $q$ is a bowl in the first case and a saddle in the second, as the last lesson said.
    - question:
        id: derivation-max
        type: numeric
        system: s2
        prompt: |
          What is the largest value of $3x^2 + 4xy + 6y^2$ over all points with $x^2 + y^2 = 1$?
        answer: "7"
        explanation: |
          The form is $\mathbf{x}^\top A\mathbf{x}$ with $A = \begin{pmatrix} 3 & 2 \\ 2 & 6 \end{pmatrix}$, whose eigenvalues are 2 and 7. On the unit circle the form equals $2y_1^2 + 7y_2^2$ with $y_1^2 + y_2^2 = 1$, which is largest, 7, when all the weight is on the second axis: at $\mathbf{x} = \pm(1, 2)/\sqrt5$. The smallest value is 2, at $\pm(2, -1)/\sqrt5$. A problem that calculus would handle with a constraint and a multiplier is settled by two eigenvalues.
    - text: |
        **The Rayleigh quotient.** For symmetric $A$ and $\mathbf{x} \ne \mathbf{0}$,

        $$R_A(\mathbf{x}) = \frac{\mathbf{x}^\top A\mathbf{x}}{\mathbf{x}^\top\mathbf{x}}.$$

        It does not change when $\mathbf{x}$ is rescaled, so it depends only on the direction of $\mathbf{x}$, and it equals $\mathbf{x}^\top A\mathbf{x}$ on unit vectors.

        **Theorem.** Let the eigenvalues of $A$ be $\lambda_{\min} \le \dots \le \lambda_{\max}$. Then for every $\mathbf{x} \ne \mathbf{0}$,

        $$\lambda_{\min} \le R_A(\mathbf{x}) \le \lambda_{\max},$$

        with equality on the right exactly for eigenvectors of $\lambda_{\max}$, and on the left exactly for eigenvectors of $\lambda_{\min}$. So

        $$\lambda_{\max} = \max_{\mathbf{x} \ne \mathbf{0}} R_A(\mathbf{x}) = \max_{\|\mathbf{x}\| = 1}\mathbf{x}^\top A\mathbf{x}, \qquad \lambda_{\min} = \min_{\mathbf{x} \ne \mathbf{0}} R_A(\mathbf{x}).$$

        *Proof.* In eigenvector coordinates, with weights $w_i = y_i^2/\sum_j y_j^2$, which are non-negative and add up to 1,

        $$R_A(\mathbf{x}) = \sum_i w_i\lambda_i \le \sum_i w_i\lambda_{\max} = \lambda_{\max}.$$

        Equality needs $w_i = 0$ whenever $\lambda_i < \lambda_{\max}$: $\mathbf{x}$ lies in the eigenspace of $\lambda_{\max}$. The lower bound is the same argument. $\blacksquare$

        If $\mathbf{x}$ is any eigenvector, $R_A(\mathbf{x})$ is its eigenvalue. The eigenvectors are exactly the points where the gradient of $R_A$ vanishes.

        **Three uses.**

        *Greatest variance.* For centred data with covariance matrix $C$, the variance of the data along a unit direction $\mathbf{u}$ is $\mathbf{u}^\top C\mathbf{u}$. So the direction of greatest variance is the top eigenvector of $C$, and the variance there is $\lambda_{\max}$.

        *Greatest stretch.* For any matrix $M$, $\dfrac{\|M\mathbf{x}\|^2}{\|\mathbf{x}\|^2} = \dfrac{\mathbf{x}^\top M^\top M\mathbf{x}}{\mathbf{x}^\top\mathbf{x}}$ is the Rayleigh quotient of the symmetric matrix $M^\top M$. So the largest factor by which $M$ can stretch a vector is $\sqrt{\lambda_{\max}(M^\top M)}$, and the smallest is $\sqrt{\lambda_{\min}(M^\top M)}$. Those are the two numbers whose ratio is the condition number.

        *Estimating an eigenvalue.* Given an approximate eigenvector $\mathbf{x}$, $R_A(\mathbf{x})$ is the best guess for its eigenvalue, and the guess is much better than the vector: an error of size $\varepsilon$ in the direction gives an error of size about $\varepsilon^2$ in the quotient.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the proof that the Rayleigh quotient of a symmetric matrix never exceeds its largest eigenvalue.
        steps:
          - 'Write $\mathbf{x}$ in coordinates $y_i$ along orthonormal eigenvectors.'
          - 'The numerator becomes $\sum_i \lambda_iy_i^2$ and the denominator $\sum_i y_i^2$.'
          - 'So the quotient is a weighted average of the eigenvalues, with weights that are not negative and add up to 1.'
          - 'Replace every eigenvalue by the largest one, which can only increase the average.'
          - 'The average of a constant is that constant, so the quotient is at most $\lambda_{\max}$.'
        explanation: The spectral theorem turns the quotient into an average, and an average is at most its largest term.
  formal:
    - text: |
        **Quadratic form.** A function $q: \mathbb{R}^n \to \mathbb{R}$ of the form $q(\mathbf{x}) = \mathbf{x}^\top A\mathbf{x}$. The symmetric matrix representing $q$ is unique: $a_{ij} = \tfrac12\left(q(\mathbf{e}_i + \mathbf{e}_j) - q(\mathbf{e}_i) - q(\mathbf{e}_j)\right)$. For any $B$, $\mathbf{x}^\top B\mathbf{x} = \mathbf{x}^\top\tfrac12(B + B^\top)\mathbf{x}$.

        **Change of variables.** With $\mathbf{x} = P\mathbf{y}$, $q$ is represented by $P^\top AP$. This is **congruence**, not similarity. The two coincide when $P$ is orthogonal.

        **Principal axes theorem.** There is an orthogonal change of variables $\mathbf{x} = Q\mathbf{y}$ with $q = \sum_i \lambda_iy_i^2$, where the $\lambda_i$ are the eigenvalues of $A$.

        **Inertia.** Under any invertible change of variables that brings $q$ to a sum of squares with coefficients, the numbers of positive, negative and zero coefficients are always the same (Sylvester's law of inertia).

        **Rayleigh quotient.** $R_A(\mathbf{x}) = \dfrac{\mathbf{x}^\top A\mathbf{x}}{\mathbf{x}^\top\mathbf{x}}$ for symmetric $A$, $\mathbf{x} \ne \mathbf{0}$. $R_A(c\mathbf{x}) = R_A(\mathbf{x})$.

        **Rayleigh-Ritz.** $\lambda_{\min}(A) = \min_{\mathbf{x} \ne \mathbf{0}} R_A(\mathbf{x})$ and $\lambda_{\max}(A) = \max_{\mathbf{x} \ne \mathbf{0}} R_A(\mathbf{x})$, attained exactly on the corresponding eigenspaces. Hence $\lambda_{\min}\|\mathbf{x}\|^2 \le \mathbf{x}^\top A\mathbf{x} \le \lambda_{\max}\|\mathbf{x}\|^2$.

        **Stationary points.** $\nabla R_A(\mathbf{x}) = \dfrac{2}{\mathbf{x}^\top\mathbf{x}}\left(A\mathbf{x} - R_A(\mathbf{x})\mathbf{x}\right)$, which vanishes if and only if $\mathbf{x}$ is an eigenvector.

        **Diagonal entries.** $a_{ii} = R_A(\mathbf{e}_i)$, so every diagonal entry of a symmetric matrix lies between $\lambda_{\min}$ and $\lambda_{\max}$.
