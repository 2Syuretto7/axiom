    - question:
        id: predict-ranks
        type: predict
        system: s1
        prompt: A symmetric matrix with singular values 4, 2, 1, truncated at rank 1 and at rank 2. Each line shows the rank, the spectral error and the Frobenius error. What does this show?
        code: |
          import numpy as np

          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          U, s, Vt = np.linalg.svd(A)
          for k in [1, 2]:
              Ak = (U[:, :k] * s[:k]) @ Vt[:k]
              E = A - Ak
              print(int(np.linalg.matrix_rank(Ak)), round(float(np.linalg.norm(E, 2)), 4), round(float(np.linalg.norm(E)), 4))
        output: |
          1 2.0 2.2361
          2 1.0 1.0
        explanation: At rank 1 the discarded values are 2 and 1, giving spectral error 2 and Frobenius error root 5. At rank 2 only the value 1 is discarded, and the two norms agree.
  work:
    - text: Slower now. The first task is the approximation itself.
    - question:
        id: write-truncate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `truncate(A, k)` returning the best approximation of `A` of rank `k`, as a matrix of the same shape as `A`. Use `np.linalg.svd(A, full_matrices=False)`.
        starter: |
          import numpy as np


          def truncate(A, k):
              return A * 0.0


          A = np.array([[3.0, 0.0], [4.0, 5.0]])
          A1 = truncate(A, 1)
          print([[round(float(v), 4) for v in row] for row in A1])
          print(round(float(np.linalg.norm(A - A1)), 4))
        solution: |
          import numpy as np


          def truncate(A, k):
              U, s, Vt = np.linalg.svd(A, full_matrices=False)
              return (U[:, :k] * s[:k]) @ Vt[:k]


          A = np.array([[3.0, 0.0], [4.0, 5.0]])
          A1 = truncate(A, 1)
          print([[round(float(v), 4) for v in row] for row in A1])
          print(round(float(np.linalg.norm(A - A1)), 4))
        tests: |
          import numpy as _np
          _A = _np.array([[3.0, 0.0], [4.0, 5.0]])
          _A1 = truncate(_A, 1)
          assert _np.shape(_A1) == (2, 2), "The approximation has the same shape as A"
          assert _np.allclose(_A1, [[1.5, 1.5], [4.5, 4.5]]), "The best rank-one approximation of [[3, 0], [4, 5]] is [[1.5, 1.5], [4.5, 4.5]]"
          assert _np.allclose(truncate(_A, 2), _A), "Keeping every singular value should give back A"
          _M = _np.array([[8.0, 6.0, 4.0], [6.0, 5.0, 3.0], [4.0, 3.0, 1.0], [9.0, 7.0, 6.0]])
          _s = _np.linalg.svd(_M, compute_uv=False)
          _M1 = truncate(_M, 1)
          assert _np.shape(_M1) == (4, 3) and _np.linalg.matrix_rank(_M1) == 1, "For the 4 by 3 marks table the result should be 4 by 3 and of rank 1"
          assert abs(float(_np.linalg.norm(_M - _M1, 2)) - _s[1]) < 1e-9, "The spectral error of the rank-one approximation should be the second singular value"
          assert abs(float(_np.linalg.norm(_M - truncate(_M, 2))) - _s[2]) < 1e-9, "The error of the rank-two approximation of the marks table should be its third singular value"
          _W = _np.random.default_rng(0).normal(size=(3, 6))
          _sw = _np.linalg.svd(_W, compute_uv=False)
          _W2 = truncate(_W, 2)
          assert _np.shape(_W2) == (3, 6) and _np.linalg.matrix_rank(_W2) == 2, "For a wide 3 by 6 matrix and k = 2 the result should be 3 by 6 and of rank 2"
          assert abs(float(_np.linalg.norm(_W - _W2)) - _sw[2]) < 1e-9, "For the wide matrix the error at rank 2 should be the third singular value"
          assert output.strip() == "[[1.5, 1.5], [4.5, 4.5]]\n2.2361", "The program should print [[1.5, 1.5], [4.5, 4.5]] and then 2.2361"
        wrong:
          - |
            import numpy as np


            def truncate(A, k):
                U, s, Vt = np.linalg.svd(A, full_matrices=False)
                return (U[:, -k:] * s[-k:]) @ Vt[-k:]


            print("[[1.5, 1.5], [4.5, 4.5]]\n2.2361")
          - |
            import numpy as np


            def truncate(A, k):
                U, s, Vt = np.linalg.svd(A, full_matrices=False)
                return U[:, :k] @ Vt[:k]


            print("[[1.5, 1.5], [4.5, 4.5]]\n2.2361")
          - |
            import numpy as np


            def truncate(A, k):
                U, s, Vt = np.linalg.svd(A, full_matrices=False)
                return (U[:, :k] * s[:k]) @ Vt[:, :k].T


            print("[[1.5, 1.5], [4.5, 4.5]]\n2.2361")
          - |
            import numpy as np


            def truncate(A, k):
                B = A * 0.0
                B[:, :k] = A[:, :k]
                return B


            print("[[1.5, 1.5], [4.5, 4.5]]\n2.2361")
        explanation: |
          `U[:, :k] * s[:k]` scales the $j$th kept column by $\sigma_j$, by broadcasting, and the product with the first `k` rows of `Vt` adds up the $k$ rank-one pieces.

          The answer for the matrix of the last lesson is worth looking at. $\begin{pmatrix} 1.5 & 1.5 \\ 4.5 & 4.5 \end{pmatrix}$ has two equal columns and its second row is three times its first: rank 1, as required. Its distance from $A$ is $\sqrt5 = 2.2361$, the second singular value.

          The last wrong version keeps the first `k` columns of $A$ and zeroes the rest. That is also a matrix of rank at most `k`, and for the same matrix its error is 5, more than twice as large. Dropping columns, or rows, is the obvious way to shrink a table. The theorem says that the right things to drop are singular directions, which mix all the rows and columns.
    - question:
        id: write-rank-for-share
        type: code
        mode: write
        system: s2
        prompt: |
          Write `rank_for_share(A, share)` returning the smallest `k` such that the best rank-`k` approximation keeps at least the fraction `share` of the squared Frobenius norm of `A`. Work from the singular values alone. Allow a tolerance of `1e-12` in the comparison, so that `share = 1.0` returns the full rank and not one more.
        starter: |
          import numpy as np


          def rank_for_share(A, share):
              return 0


          M = np.array([[8.0, 6.0, 4.0], [6.0, 5.0, 3.0], [4.0, 3.0, 1.0], [9.0, 7.0, 6.0]])
          print(rank_for_share(M, 0.99), rank_for_share(M, 0.999))
        solution: |
          import numpy as np


          def rank_for_share(A, share):
              s = np.linalg.svd(A, compute_uv=False)
              kept = np.cumsum(s ** 2) / np.sum(s ** 2)
              return int((kept < share - 1e-12).sum()) + 1


          M = np.array([[8.0, 6.0, 4.0], [6.0, 5.0, 3.0], [4.0, 3.0, 1.0], [9.0, 7.0, 6.0]])
          print(rank_for_share(M, 0.99), rank_for_share(M, 0.999))
        tests: |
          import numpy as _np
          _M = _np.array([[8.0, 6.0, 4.0], [6.0, 5.0, 3.0], [4.0, 3.0, 1.0], [9.0, 7.0, 6.0]])
          assert rank_for_share(_M, 0.99) == 1, "The first singular value of the marks table carries 99.4% of the squared norm, so rank 1 keeps 99%"
          assert rank_for_share(_M, 0.999) == 2, "Rank 1 keeps 99.4%, short of 99.9%. Rank 2 keeps 99.97%"
          assert rank_for_share(_M, 1.0) == 3, "Keeping everything needs the full rank, 3"
          _D = _np.array([[3.0, 0.0], [0.0, 4.0]])
