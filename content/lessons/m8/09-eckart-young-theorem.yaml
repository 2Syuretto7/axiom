        solution: |
          import numpy as np


          def low_rank_error(A, k):
              U, s, Vt = np.linalg.svd(A)
              Ak = U[:, :k] @ np.diag(s[:k]) @ Vt[:k]
              return float(np.linalg.norm(A - Ak))


          A = np.array([[1.0, 2.0, 3.0], [0.0, 1.0, 4.0], [5.0, 6.0, 0.0]])
          print(round(low_rank_error(A, 1), 4))
        tests: |
          import numpy as _np
          _A = _np.array([[1.0, 2.0, 3.0], [0.0, 1.0, 4.0], [5.0, 6.0, 0.0]])
          _s = _np.linalg.svd(_A, compute_uv=False)
          assert abs(low_rank_error(_A, 1) - float(_np.sqrt(_s[1] ** 2 + _s[2] ** 2))) < 1e-9, "At rank 1 the error should be the root of the sum of squares of the second and third singular values, about 4.8436. The right singular vectors are the rows of Vt"
          assert abs(low_rank_error(_A, 2) - _s[2]) < 1e-9, "At rank 2 the error should be the third singular value, about 0.0249"
          assert abs(low_rank_error(_A, 3)) < 1e-9, "At full rank the error should be zero"
          _B = _np.random.default_rng(0).normal(size=(5, 5))
          _sb = _np.linalg.svd(_B, compute_uv=False)
          assert abs(low_rank_error(_B, 2) - float(_np.sqrt((_sb[2:] ** 2).sum()))) < 1e-9, "For a random 5 by 5 matrix and k = 2 the error should be the root of the sum of squares of the last three singular values"
          assert output.strip() == "4.8436", "The program should print 4.8436"
        wrong:
          - |
            import numpy as np


            def low_rank_error(A, k):
                U, s, Vt = np.linalg.svd(A)
                Ak = U[:, :k] @ np.diag(s[:k]) @ Vt[:, :k].T
                return float(np.linalg.norm(A - Ak))


            print("4.8436")
          - |
            import numpy as np


            def low_rank_error(A, k):
                U, s, Vt = np.linalg.svd(A)
                Ak = U[:, :k] @ np.diag(s[:k]) @ Vt[:k]
                return float(np.linalg.norm(A - Ak, 2))


            print("4.8436")
          - |
            import numpy as np


            def low_rank_error(A, k):
                U, s, Vt = np.linalg.svd(A)
                Ak = U[:, :k] @ Vt[:k]
                return float(np.linalg.norm(A - Ak))


            print("4.8436")
          - |
            import numpy as np


            def low_rank_error(A, k):
                U, s, Vt = np.linalg.svd(A)
                return float(np.sqrt((s[:k] ** 2).sum()))


            print("4.8436")
        explanation: |
          The right singular vectors are the rows of `Vt`. `Vt[:k]` is $V_k^\top$, of shape $k \times n$, which is what the product needs. `Vt[:, :k].T` has the same shape, so nothing fails, but it holds the first `k` entries of every right singular vector, not the first `k` vectors. The result is still a matrix of rank `k`. It is just not near $A$.

          The theorem gives a test that costs nothing: the error must come out as $\sqrt{\sigma_{k+1}^2 + \dots}$. Anything larger means the approximation was assembled wrongly. And nothing smaller is possible, so a smaller number would mean the error was measured wrongly.

          In fact the whole function can be replaced by `float(np.sqrt((s[k:] ** 2).sum()))`. The last wrong version tries that and sums the kept values, where the discarded ones were wanted.
    - question:
        id: work-storage
        type: numeric
        system: s2
        prompt: |
          A greyscale image is a $1000 \times 800$ matrix. Its rank-50 truncated SVD is stored as 50 left vectors, 50 right vectors and 50 singular values. How many numbers is that?
        answer: "90050"
        explanation: |
          $50 \times (1000 + 800 + 1) = 90\,050$, against $800\,000$ for the image: about a ninth. Whether rank 50 is enough depends on how quickly the singular values of the image fall, and for photographs they fall quickly, because neighbouring rows resemble each other. The same count explains low-rank layers in neural networks: a $1000 \times 800$ weight matrix replaced by a product of a $1000 \times 50$ and a $50 \times 800$ matrix has 90 000 parameters and costs a ninth of the multiplications.
    - question:
        id: work-nearly-singular
        type: choice
        system: s2
        prompt: |
          A $3 \times 3$ matrix has singular values $5, 2, 10^{-9}$ and determinant about $10^{-8}$. Its entries were measured to 6 decimal places. What should be concluded?
        options:
          - 'The determinant is not zero, so the matrix is invertible and can be used as it is.'
          - 'Within the accuracy of the measurements the matrix cannot be told apart from a singular one, since a change of size $10^{-9}$ makes it singular. Its numerical rank is 2, and it should be treated as a rank-2 matrix.'
          - 'The matrix has rank 1.'
          - 'Nothing can be said without the eigenvalues.'
        answer: 1
        explanation: |
          By Eckart-Young the nearest matrix of rank 2 is at distance $\sigma_3 = 10^{-9}$, a thousand times smaller than the uncertainty of the entries. So the data are consistent with an exactly singular matrix, and inverting would amplify the measurement errors by $1/\sigma_3 = 10^9$. The honest description is "rank 2 to within the accuracy of the data". The distance to rank 1 is $\sigma_2 = 2$, which is large, so it is not close to rank 1. This is why rank, for measured data, is always decided from singular values against a tolerance.
    - question:
        id: work-columns
        type: choice
        system: s2
        prompt: |
          To approximate a $100 \times 100$ matrix by one of rank 10, someone keeps its 10 columns of largest length and sets the other columns to zero. How does the error compare with that of the truncated SVD of rank 10?
        options:
          - 'It is the same, since both have rank 10.'
          - 'It is at least as large, in both norms, and usually much larger. The column choice is one particular matrix of rank at most 10, and the theorem says none of those beats the truncated SVD.'
          - 'It is smaller, because real columns of the data are kept exactly.'
          - 'It depends on the norm: better in the Frobenius norm, worse in the spectral norm.'
        answer: 1
        explanation: |
          Eckart-Young is a statement about **every** matrix of rank at most $k$, however it was produced. Choosing columns, choosing rows, clustering, or training a factorisation by gradient descent all produce matrices of rank at most $k$, so the truncated SVD is a floor for all of them. It is the standard baseline: a low-rank method is judged by how close it gets to $\sqrt{\sigma_{k+1}^2 + \dots}$. Keeping actual columns does have a merit, since they can be interpreted, and that is paid for in error.
  connections:
    - text: |
        No rank-one table gets closer to the marks than the first term of the singular value decomposition. The **Eckart-Young theorem**: the truncated SVD $A_k$ is the closest matrix of rank $k$ to $A$, with error $\sigma_{k+1}$ in the spectral norm and $\sqrt{\sigma_{k+1}^2 + \dots + \sigma_r^2}$ in the Frobenius norm. The reason is a count of dimensions. A matrix of rank $k$ ignores a subspace of dimension $n - k$, which must meet the $k + 1$ directions that $A$ stretches most.

        So the singular values say in advance how well a matrix can be compressed to each rank, and the smallest one says how close the matrix is to being singular.

        In the marks table the single kept direction had a meaning: overall strength of a student. When the rows of a matrix are observations and the columns are measured quantities, the best low-rank approximation finds the few directions along which the observations really differ. With one preparatory step, subtracting the average, that is the most used method of data analysis there is: [[m8.pca-as-svd]].
