concept: m8.eckart-young-theorem
minutes: 85
claim: You can form the truncated singular value decomposition of a matrix, state the Eckart-Young theorem that it is the closest matrix of its rank in both the spectral and the Frobenius norm, compute both errors from the discarded singular values without forming the approximation, explain why no matrix of that rank can do better, choose a rank from the share of squared singular values kept, and read the smallest singular value as the distance to the nearest singular matrix.
recalls: [m8.singular-value-decomposition]
uses: [m8.courant-fischer-min-max-theorem, m8.spectral-theorem, m6.rank-nullity-theorem, m6.cauchy-schwarz-and-the-triangle-inequality, m7.orthonormal-bases, m7.conditioning, m5.rank, m5.column-space-and-null-space, e5.linear-algebra-routines, e5.axis-operations-and-reductions, e5.vectorisation, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m8.pca-as-svd, m8.operator-and-frobenius-norms]
starter: |
  # Scratch space. A table of marks: 4 students, 3 tests.
  # A rank-one table needs only one column and one row to store.
  import numpy as np

  M = np.array([[8.0, 6.0, 4.0], [6.0, 5.0, 3.0], [4.0, 3.0, 1.0], [9.0, 7.0, 6.0]])
  guess = np.outer(M.mean(axis=1), M.mean(axis=0)) / M.mean()
  print(round(float(np.linalg.norm(M - guess)), 4))

  U, s, Vt = np.linalg.svd(M, full_matrices=False)
  first = s[0] * np.outer(U[:, 0], Vt[0])
  print(round(float(np.linalg.norm(M - first)), 4))
parts:
  recall:
    - text: |
        [[m8.singular-value-decomposition]] wrote every matrix as a sum of rank-one pieces, ordered by size, and ended by suggesting that the sum be cut short. Today's theorem says exactly how good the shortened sum is. Three quick pulls first.
  puzzle:
    - text: |
        Four students sat three tests.

        $$M = \begin{pmatrix} 8 & 6 & 4 \\ 6 & 5 & 3 \\ 4 & 3 & 1 \\ 9 & 7 & 6 \end{pmatrix}$$

        The rows look like multiples of each other: a strong student is strong everywhere, and the third test was hard for everyone. If that were exactly true, the table would be "strength of student times easiness of test", a matrix of rank 1, and 7 numbers would store all 12.

        It is not exactly true, so some rank-one table must be chosen. The sensible guess is row averages times column averages, divided by the overall average. The starter measures how far that is from $M$, adding up the squared errors of all 12 entries and taking the root. Then it does the same for the first term of the singular value decomposition.

        ```
        1.6581
        1.5529
        ```

        The first term of the SVD is closer than the sensible guess. There are infinitely many rank-one tables to try.

        **Is there one that gets closer than 1.5529? And how could anyone know without trying them all?**
  intuition:
    - text: |
        Write the decomposition as a sum, largest piece first:

        $$A = \sigma_1\mathbf{u}_1\mathbf{v}_1^\top + \sigma_2\mathbf{u}_2\mathbf{v}_2^\top + \dots + \sigma_r\mathbf{u}_r\mathbf{v}_r^\top.$$

        Keep the first $k$ terms and call the result $A_k$. It has rank $k$. What is thrown away is the rest of the sum, and the rest of the sum is itself a singular value decomposition, whose largest singular value is $\sigma_{k+1}$. So the error $A - A_k$ stretches no vector by more than $\sigma_{k+1}$.

        Why can no other matrix $B$ of rank $k$ do better? Because $B$ is blind in too many directions. Its null space has dimension $n - k$. The vectors $\mathbf{v}_1, \dots, \mathbf{v}_{k+1}$ span a space of dimension $k + 1$. The two dimensions add up to $n + 1$, more than the space has room for, so they share a nonzero vector $\mathbf{x}$.

        On that $\mathbf{x}$, the matrix $B$ outputs zero, so the error $(A - B)\mathbf{x}$ is all of $A\mathbf{x}$. And $\mathbf{x}$ lies in the span of the $k + 1$ directions that $A$ stretches most, where $A$ stretches everything by at least $\sigma_{k+1}$.

        So every rank-$k$ matrix makes an error of at least $\sigma_{k+1}$ somewhere, and $A_k$ makes an error of exactly $\sigma_{k+1}$. Nothing beats it. For the puzzle, nothing gets closer than the first term of the SVD.
  derivation:
    - text: |
        Let $A$ be $m \times n$ with singular value decomposition $A = \sum_i \sigma_i\mathbf{u}_i\mathbf{v}_i^\top$, $\sigma_1 \ge \sigma_2 \ge \dots$. The **truncated SVD** of rank $k$ is

        $$A_k = \sum_{i=1}^{k} \sigma_i\mathbf{u}_i\mathbf{v}_i^\top = U_k\Sigma_kV_k^\top,$$

        with $U_k$ and $V_k$ the first $k$ columns of $U$ and $V$.

        **Two ways to measure a matrix.** The **spectral norm** $\|E\|_2$ is the largest stretch, $\max\|E\mathbf{x}\|/\|\mathbf{x}\| = \sigma_1(E)$. The **Frobenius norm** $\|E\|_F$ is the root of the sum of the squares of all entries, and it equals $\sqrt{\sigma_1(E)^2 + \sigma_2(E)^2 + \dots}$, because orthogonal factors do not change a sum of squares. The puzzle measured its errors in the Frobenius norm.

        **The error of truncation.** $A - A_k = \sum_{i > k} \sigma_i\mathbf{u}_i\mathbf{v}_i^\top$ has singular values $\sigma_{k+1}, \sigma_{k+2}, \dots$. So

        $$\|A - A_k\|_2 = \sigma_{k+1}, \qquad \|A - A_k\|_F = \sqrt{\sigma_{k+1}^2 + \sigma_{k+2}^2 + \dots + \sigma_r^2}.$$

        Both errors are known from the singular values alone, before any approximation is formed.

        **Theorem (Eckart-Young).** For every matrix $B$ of rank at most $k$,

        $$\|A - B\|_2 \ge \|A - A_k\|_2 \qquad\text{and}\qquad \|A - B\|_F \ge \|A - A_k\|_F.$$

        **Proof for the spectral norm.** Let $B$ have rank at most $k$. By rank-nullity $\dim\ker B \ge n - k$. Let $S = \operatorname{span}(\mathbf{v}_1, \dots, \mathbf{v}_{k+1})$. Since $(n - k) + (k + 1) > n$, there is a unit vector $\mathbf{x}$ in both. Write $\mathbf{x} = c_1\mathbf{v}_1 + \dots + c_{k+1}\mathbf{v}_{k+1}$ with $\sum c_i^2 = 1$. Then $B\mathbf{x} = \mathbf{0}$ and

        $$\|(A - B)\mathbf{x}\|^2 = \|A\mathbf{x}\|^2 = \sum_{i=1}^{k+1} \sigma_i^2c_i^2 \ge \sigma_{k+1}^2.$$

        So $\|A - B\|_2 \ge \sigma_{k+1}$. $\blacksquare$

        The Frobenius case uses the same idea once for every singular value of the error, through the min-max theorem: $\sigma_i(A - B) \ge \sigma_{k+i}(A)$ for each $i$. Squaring and adding gives the claim.

        *The puzzle.* The singular values of $M$ are $19.3801$, $1.5183$ and $0.3260$. The best rank-one table has Frobenius error $\sqrt{1.5183^2 + 0.3260^2} = 1.5529$. That is the number the starter printed, and no rank-one table can get below it.
    - question:
        id: derivation-error
        type: numeric
        system: s2
        prompt: |
          A matrix has singular values $13, 4, 3$. What is the Frobenius norm of the error of its best rank-one approximation?
        answer: "5"
        explanation: |
          The discarded singular values are 4 and 3, and the Frobenius error is $\sqrt{4^2 + 3^2} = 5$. In the spectral norm the same approximation has error 4, the largest discarded value. The two norms give different numbers for the same error matrix, but the same approximation is the best in both.
    - text: |
        **How much is kept.** Since $\|A\|_F^2 = \sum\sigma_i^2$, the truncation keeps the share

        $$\frac{\sigma_1^2 + \dots + \sigma_k^2}{\sigma_1^2 + \dots + \sigma_r^2}$$

        of the total squared size, and loses the rest. For the marks table the first term keeps $19.3801^2/378 = 99.4\%$. A common way to choose $k$ is to take the smallest one that keeps a required share, such as 95% or 99%.

        **Storage.** $A_k$ is stored as $k$ left vectors, $k$ right vectors and $k$ numbers: $k(m + n + 1)$ values in place of $mn$. Multiplying a vector by $A_k$ costs about $k(m + n)$ operations in place of $mn$.

        **Uniqueness.** If $\sigma_k > \sigma_{k+1}$ the best approximation of rank $k$ is unique. If $\sigma_k = \sigma_{k+1}$ there are several equally good ones, since any direction in the shared singular space could be the one kept.

        **Distance to lower rank.** Read the theorem the other way: $\sigma_{k+1}$ is the distance from $A$ to the nearest matrix of rank $k$. In particular, for a square invertible matrix, $\sigma_n$ is the distance to the nearest singular matrix. A matrix with a tiny smallest singular value is nearly singular in this exact sense, which is the geometric meaning of a large condition number $\sigma_1/\sigma_n$. And the **numerical rank**, the number of singular values above a tolerance, is the smallest rank within that tolerance of $A$.

        **Noise.** Data that is truly of rank $k$ plus small noise has $k$ large singular values followed by a floor of small ones. Truncating at the gap removes most of the noise and keeps most of the signal.

        **In NumPy.**

        ```python
        U, s, Vt = np.linalg.svd(A, full_matrices=False)
        Ak = (U[:, :k] * s[:k]) @ Vt[:k]
        ```

        Columns of `U`, rows of `Vt`. Multiplying by `s[:k]` scales each kept column.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the proof that no matrix B of rank k is closer to A than sigma k+1 in the spectral norm.
        steps:
          - 'By rank-nullity, the null space of $B$ has dimension at least $n - k$.'
          - 'The span of $\mathbf{v}_1, \dots, \mathbf{v}_{k+1}$ has dimension $k + 1$, so the two subspaces share a unit vector $\mathbf{x}$.'
          - 'Since $B\mathbf{x} = \mathbf{0}$, the error satisfies $(A - B)\mathbf{x} = A\mathbf{x}$.'
          - 'Since $\mathbf{x}$ is a combination of the first $k + 1$ right singular vectors, $\|A\mathbf{x}\| \ge \sigma_{k+1}$.'
          - 'Hence $\|A - B\|_2 \ge \sigma_{k+1}$, which is the error of the truncated SVD.'
        explanation: A matrix of rank k ignores a subspace too large to avoid the k + 1 directions A stretches most.
  formal:
    - text: |
        **Truncated SVD.** $A_k = \sum_{i=1}^{k} \sigma_i\mathbf{u}_i\mathbf{v}_i^\top$, for $0 \le k \le r = \operatorname{rank}A$.

        **Norms.** $\|E\|_2 = \sigma_1(E)$. $\|E\|_F = \sqrt{\sum_{ij} e_{ij}^2} = \sqrt{\operatorname{tr}(E^\top E)} = \sqrt{\sum_i \sigma_i(E)^2}$.

        **Theorem (Eckart-Young; Schmidt, Mirsky).**

        $$\min_{\operatorname{rank}B \le k}\|A - B\|_2 = \sigma_{k+1}, \qquad \min_{\operatorname{rank}B \le k}\|A - B\|_F = \sqrt{\textstyle\sum_{i > k}\sigma_i^2},$$

        and both minima are attained at $B = A_k$. The same holds for every norm that is unchanged by orthogonal factors on either side (Mirsky).

        **Uniqueness.** In the Frobenius norm the minimiser is unique if and only if $\sigma_k > \sigma_{k+1}$.

        **Weyl for singular values.** $\sigma_{i+j-1}(A + E) \le \sigma_i(A) + \sigma_j(E)$. With $\operatorname{rank}B \le k$: $\sigma_{k+i}(A) \le \sigma_i(A - B)$.

        **Distance to singularity.** For $A \in \mathbb{R}^{n \times n}$: $\min\{\|E\|_2 : A + E \text{ singular}\} = \sigma_n(A)$, and relative to $\|A\|_2$ this is $1/\kappa_2(A)$.

        **Projections.** $A_k = U_kU_k^\top A = AV_kV_k^\top$: the truncation projects the columns of $A$ onto the span of the first $k$ left singular vectors, or equivalently the rows onto the first $k$ right singular vectors.

        **Retained share.** $\|A_k\|_F^2/\|A\|_F^2 = \sum_{i \le k}\sigma_i^2/\sum_i\sigma_i^2$.
