              Ak = U[:, :k] @ np.diag(s[:k]) @ Vt[:, :k].T
              return float(np.linalg.norm(A - Ak))


          A = np.array([[1.0, 2.0, 3.0], [0.0, 1.0, 4.0], [5.0, 6.0, 0.0]])
