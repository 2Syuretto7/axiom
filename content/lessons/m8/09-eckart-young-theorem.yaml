          assert rank_for_share(_D, 0.65) == 2, "Rank 1 keeps 64%, short of 65%"
          assert rank_for_share(_np.eye(5), 0.5) == 3, "The identity of size 5 has five equal singular values, so each keeps 20%, and 50% needs three"
