concept: m8.jordan-form-and-the-matrix-exponential
minutes: 95
claim: You can recognise a matrix that cannot be diagonalised, describe its Jordan form as an eigenvalue plus a nilpotent shift, find a generalised eigenvector for a two by two example, compute powers of a Jordan block and explain the polynomial factor that makes them grow before they decay, define the matrix exponential by its series, compute it for diagonalisable matrices and for Jordan blocks, use it to solve a linear system of differential equations, and say why the Jordan form is a tool for proofs and never for floating-point computation.
recalls: [m8.operator-and-frobenius-norms]
uses: [m8.diagonalisation, m8.characteristic-polynomial, m8.eigenvalues-and-eigenvectors, m8.spectral-theorem, m8.singular-value-decomposition, m6.matrix-of-a-linear-map-and-similarity, m10.taylor-approximation, m10.derivatives-of-exp-log-and-trig, m2.the-exponential-and-e, m5.identity-and-inverse, m5.matrix-multiplication-as-composition, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m8.perron-frobenius-and-power-iteration]
starter: |
  # Scratch space. Two matrices, both with the eigenvalue 0.9 twice.
  # How big are their powers?
  import numpy as np

  S = np.array([[0.9, 0.0], [0.0, 0.9]])
  J = np.array([[0.9, 1.0], [0.0, 0.9]])
  for k in [1, 5, 10, 20, 50, 100]:
      Sk, Jk = np.eye(2), np.eye(2)
      for step in range(k):
          Sk, Jk = Sk @ S, Jk @ J
      print(k, round(float(np.linalg.norm(Sk, 2)), 4), round(float(np.linalg.norm(Jk, 2)), 4))
parts:
  recall:
    - text: |
        [[m8.operator-and-frobenius-norms]] ended with a matrix whose eigenvalues promised decay and whose norm said otherwise, and which could not be diagonalised. Today that case is taken apart. Three quick pulls first.
  puzzle:
    - text: |
        Two matrices, each with the eigenvalue $0.9$ twice and nothing else.

        $$S = \begin{pmatrix} 0.9 & 0 \\ 0 & 0.9 \end{pmatrix}, \qquad J = \begin{pmatrix} 0.9 & 1 \\ 0 & 0.9 \end{pmatrix}$$

        Since $0.9 < 1$, the powers of both must die away. The starter prints the spectral norm of the $k$th power of each.

        ```
        1 0.9 1.5296
        5 0.5905 3.3836
        10 0.3487 3.9053
        20 0.1216 2.7072
        50 0.0052 0.2864
        100 0.0 0.003
        ```

        The powers of $S$ shrink by $0.9$ each step, as expected. The powers of $J$ **grow** for the first ten steps, to almost four times the starting size, and only then begin to fall. At step 50 they are still fifty times larger than those of $S$.

        The eigenvalues are identical. Diagonalisation, $A^k = PD^kP^{-1}$, would predict pure decay like $0.9^k$.

        **What is $J^k$ exactly? Where does the hump come from, and why does diagonalisation not see it?**
  intuition:
    - text: |
        Diagonalisation does not see it because $J$ cannot be diagonalised. $J - 0.9I = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$ has a null space of dimension 1, so there is only one direction of eigenvectors, along $(1, 0)$. Two are needed for a basis.

        Split $J$ into the part that is understood and the part that is new:

        $$J = 0.9I + N, \qquad N = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}.$$

        $N$ is a **shift**: it moves the second coordinate into the first place and discards the first. Doing that twice discards everything, so $N^2 = 0$.

        Now expand $(0.9I + N)^k$ like an ordinary binomial, which is allowed because $I$ commutes with everything. Every term with $N^2$ or higher vanishes, and two terms survive:

        $$J^k = 0.9^kI + k\,0.9^{k-1}N = \begin{pmatrix} 0.9^k & k\,0.9^{k-1} \\ 0 & 0.9^k \end{pmatrix}.$$

        There is the hump. The corner entry is $k \times 0.9^{k-1}$: a factor that decays, multiplied by a factor $k$ that grows. Early on the $k$ wins, and the entry climbs to about $3.87$ at $k = 9$ and $10$. In the long run the exponential wins, as it always does against a polynomial.

        Each step, $J$ shrinks both coordinates by $0.9$ and also feeds the second coordinate into the first. The first coordinate keeps receiving top-ups from the second while the second is still large.

        That is the general picture for every square matrix. When there are too few eigenvectors, the matrix can still be brought to a form that is diagonal **plus shifts**, and the shifts contribute powers of $k$.
  derivation:
    - text: |
        **Defective matrices.** An eigenvalue has an **algebraic multiplicity**, its multiplicity as a root of the characteristic polynomial, and a **geometric multiplicity**, the dimension of its eigenspace. The second is at most the first. If it is smaller for some eigenvalue, the matrix is **defective** and cannot be diagonalised.

        **Jordan blocks.** The Jordan block of size $m$ for $\lambda$ is

        $$J_m(\lambda) = \lambda I + N = \begin{pmatrix} \lambda & 1 & & \\ & \lambda & \ddots & \\ & & \ddots & 1 \\ & & & \lambda \end{pmatrix},$$

        with $\lambda$ on the diagonal and 1 just above it. $N$ is the shift, and $N^m = 0$. A block of size 1 is just the number $\lambda$.

        **Theorem (Jordan form).** Every square complex matrix is similar to a block diagonal matrix of Jordan blocks: $A = PJP^{-1}$. The blocks are unique up to their order. For each eigenvalue, the number of blocks is its geometric multiplicity, and the sizes of its blocks add up to its algebraic multiplicity. $A$ is diagonalisable exactly when every block has size 1.

        **Generalised eigenvectors.** The columns of $P$ for one block form a **chain**. The first is an eigenvector, $(A - \lambda I)\mathbf{v}_1 = \mathbf{0}$. The next satisfies $(A - \lambda I)\mathbf{v}_2 = \mathbf{v}_1$, and so on. So $A\mathbf{v}_2 = \lambda\mathbf{v}_2 + \mathbf{v}_1$: scaled, plus a push along the previous vector.

        *Example.* $A = \begin{pmatrix} 3 & 1 \\ -1 & 1 \end{pmatrix}$ has trace 4 and determinant 4, so $\lambda = 2$ twice. $A - 2I = \begin{pmatrix} 1 & 1 \\ -1 & -1 \end{pmatrix}$ has rank 1, so there is one eigenvector direction, $\mathbf{v}_1 = (1, -1)$. Solving $(A - 2I)\mathbf{v}_2 = \mathbf{v}_1$ gives $\mathbf{v}_2 = (1, 0)$. With $P = \begin{pmatrix} 1 & 1 \\ -1 & 0 \end{pmatrix}$,

        $$A = P\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}P^{-1}.$$

        **Powers.** $A^k = PJ^kP^{-1}$, and each block is raised separately. By the binomial theorem,

        $$J_m(\lambda)^k = \sum_{j=0}^{m-1}\binom{k}{j}\lambda^{k-j}N^j.$$

        The entries are $\lambda^k$ times polynomials in $k$ of degree up to $m - 1$. Three consequences:

        - If $|\lambda| < 1$ for every eigenvalue, $A^k \to 0$, possibly after a hump.
        - If some $|\lambda| > 1$, the powers blow up.
        - If $|\lambda| = 1$, a block of size 1 stays bounded, and a larger block grows like $k^{m-1}$. $\begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}^k = \begin{pmatrix} 1 & k \\ 0 & 1 \end{pmatrix}$.
    - question:
        id: derivation-power
        type: numeric
        system: s2
        prompt: |
          What is the top-right entry of $\begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}^5$?
        answer: "80"
        explanation: |
          $J^k = \lambda^kI + k\lambda^{k-1}N$, so the corner is $5 \times 2^4 = 80$, and the diagonal entries are $2^5 = 32$. A diagonalisable matrix with eigenvalue 2 would have entries growing like $2^k$ only. The extra factor $k$ is the signature of a Jordan block. It is also the derivative of $\lambda^k$ with respect to $\lambda$, which is no accident: a Jordan block is what two eigenvalues become when they merge, and the difference quotient between them becomes a derivative.
    - text: |
        **The matrix exponential.** For a number, $e^a = 1 + a + a^2/2! + \dots$ For a square matrix the same series defines

        $$e^A = I + A + \frac{A^2}{2!} + \frac{A^3}{3!} + \dots$$

        It converges for every $A$, since $\|A^k\|/k! \le \|A\|^k/k!$ by the product inequality, and the series for $e^{\|A\|}$ converges.

        **Why it matters.** Differentiating $e^{tA}$ term by term gives $\frac{d}{dt}e^{tA} = Ae^{tA}$. So the system of differential equations

        $$\mathbf{x}'(t) = A\mathbf{x}(t), \qquad \mathbf{x}(0) = \mathbf{x}_0$$

        has the solution $\mathbf{x}(t) = e^{tA}\mathbf{x}_0$. Powers $A^k$ describe a process in steps. The exponential $e^{tA}$ describes the same kind of process in continuous time.

        **Computing it.**

        - *Diagonal.* $e^{\operatorname{diag}(d_i)} = \operatorname{diag}(e^{d_i})$.
        - *Diagonalisable.* $A = PDP^{-1}$ gives $A^k = PD^kP^{-1}$, so $e^{tA} = Pe^{tD}P^{-1}$. For symmetric $A$: $e^{tA} = Qe^{t\Lambda}Q^\top$.
        - *Jordan block.* $tJ = t\lambda I + tN$ and the two parts commute, so $e^{tJ} = e^{t\lambda}e^{tN}$, and the series for $e^{tN}$ stops: $e^{tN} = I + tN + \dots + \frac{t^{m-1}}{(m-1)!}N^{m-1}$. For size 2, $e^{tJ} = e^{\lambda t}\begin{pmatrix} 1 & t \\ 0 & 1 \end{pmatrix}$. This is where solutions like $te^{\lambda t}$ come from.

        **Rules.** $e^{0} = I$. $(e^A)^{-1} = e^{-A}$, so $e^A$ is always invertible. $\det e^A = e^{\operatorname{tr}A}$. The eigenvalues of $e^A$ are $e^{\lambda_i}$. And one rule that fails: $e^{A + B} = e^Ae^B$ holds when $AB = BA$, and in general **not** otherwise. The exponential is **not** taken entry by entry.

        **Stability.** $e^{tA} \to 0$ as $t \to \infty$ exactly when every eigenvalue has negative real part, since $|e^{\lambda t}| = e^{\operatorname{Re}(\lambda)t}$. Jordan blocks add polynomial factors in $t$, and so a hump, but do not change the verdict.

        **A warning about computing.** The Jordan form is not continuous in the entries of the matrix. Changing the zero in the corner of $J$ to $10^{-20}$ gives two distinct eigenvalues, a diagonalisable matrix, and a completely different $P$, which is very ill-conditioned. In floating point the question "is this matrix defective" has no reliable answer. So the Jordan form is used to prove things and to understand behaviour, and never as a numerical method. Libraries compute $e^A$ by scaling the matrix down, using a rational approximation, and squaring back up.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps that bring a two by two matrix with a repeated eigenvalue and only one eigenvector direction to Jordan form.
        steps:
          - 'Find the repeated eigenvalue $\lambda$ from the characteristic polynomial.'
          - 'Find an eigenvector $\mathbf{v}_1$ by solving $(A - \lambda I)\mathbf{v}_1 = \mathbf{0}$.'
          - 'Find a generalised eigenvector $\mathbf{v}_2$ by solving $(A - \lambda I)\mathbf{v}_2 = \mathbf{v}_1$.'
          - 'Put $\mathbf{v}_1$ and $\mathbf{v}_2$ as the columns of $P$.'
          - 'Then $P^{-1}AP$ is the Jordan block with $\lambda$ on the diagonal and 1 above it.'
        explanation: The chain starts at an eigenvector, and each later vector is sent by A minus lambda I to the one before.
  formal:
    - text: |
        **Multiplicities.** For an eigenvalue $\lambda$ of $A \in \mathbb{C}^{n \times n}$: algebraic multiplicity $a_\lambda$, geometric multiplicity $g_\lambda = \dim\ker(A - \lambda I)$, $1 \le g_\lambda \le a_\lambda$. $A$ is diagonalisable iff $g_\lambda = a_\lambda$ for all $\lambda$.

        **Jordan form.** $A = PJP^{-1}$, $J = \operatorname{diag}(J_{m_1}(\lambda_1), \dots, J_{m_s}(\lambda_s))$, unique up to the order of the blocks. Number of blocks for $\lambda$: $g_\lambda$. Number of blocks for $\lambda$ of size at least $j$: $\dim\ker(A - \lambda I)^j - \dim\ker(A - \lambda I)^{j-1}$.

        **Generalised eigenspace.** $\ker(A - \lambda I)^{a_\lambda}$, of dimension $a_\lambda$. $\mathbb{C}^n$ is the direct sum of these.

        **Functions of a block.** For $f$ analytic near $\lambda$:

        $$f(J_m(\lambda)) = \sum_{j=0}^{m-1}\frac{f^{(j)}(\lambda)}{j!}N^j.$$

        With $f(x) = x^k$ this is the power formula, with $f(x) = e^{tx}$ the exponential.

        **Matrix exponential.** $e^A = \sum_{k \ge 0}A^k/k!$, absolutely convergent, $\|e^A\| \le e^{\|A\|}$.

        - $\frac{d}{dt}e^{tA} = Ae^{tA} = e^{tA}A$.
        - $e^{(s + t)A} = e^{sA}e^{tA}$. $(e^A)^{-1} = e^{-A}$.
        - $AB = BA \Rightarrow e^{A + B} = e^Ae^B$.
        - $e^{PAP^{-1}} = Pe^AP^{-1}$. $\det e^A = e^{\operatorname{tr}A}$.
        - $A^\top = -A \Rightarrow e^A$ orthogonal. $A^\top = A \Rightarrow e^A$ symmetric positive definite.

        **Asymptotics.** $A^k \to 0 \iff \rho(A) < 1$. $e^{tA} \to 0 \iff \max_i\operatorname{Re}\lambda_i < 0$. $\sup_k\|A^k\| < \infty \iff \rho(A) \le 1$ and every eigenvalue with $|\lambda| = 1$ has only blocks of size 1.

        **Density.** Diagonalisable matrices are dense in $\mathbb{C}^{n \times n}$: every matrix is a limit of matrices with distinct eigenvalues.

        **Limit of steps.** $e^{A} = \lim_{n \to \infty}\big(I + A/n\big)^n$.
