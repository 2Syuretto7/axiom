          5 3.2805 3.2805
          9 3.8742 3.8742
          10 3.8742 3.8742
        explanation: The corner of the kth power is k times 0.9 to the power k - 1. It rises until k is 9 or 10, where the growth of k and the decay of the power balance, and falls after that.
    - question:
        id: predict-rotation
        type: predict
        system: s1
        prompt: The exponential series, summed to 30 terms, for a matrix with zero diagonal. What does this show?
        code: |
          import numpy as np

          t = np.pi / 2
          A = np.array([[0.0, -t], [t, 0.0]])
          total, term = np.eye(2), np.eye(2)
          for k in range(1, 30):
              term = term @ A / k
              total = total + term
          print([[round(float(v), 4) + 0.0 for v in row] for row in total])
          print([[round(float(v), 4) for v in row] for row in np.exp(A)])
        output: |
          [[0.0, -1.0], [1.0, 0.0]]
          [[1.0, 0.2079], [4.8105, 1.0]]
        explanation: The exponential of this matrix is the rotation by a quarter turn. In general the exponential of a skew-symmetric matrix is a rotation. The second line is np.exp, which exponentiates each entry separately and is a different thing altogether.
  work:
    - text: Slower now. The first task is the definition, as code.
    - question:
        id: write-expm
        type: code
        mode: write
        system: s2
        prompt: |
          Write `expm(A, terms)` returning the sum of the first `terms` terms of the exponential series, $I + A + A^2/2! + \dots$, so `terms = 1` gives the identity. Build each term from the one before it, without computing any factorial.
        starter: |
          import numpy as np


          def expm(A, terms):
              return np.eye(len(A))


          print([[round(float(v), 4) for v in row] for row in expm(np.array([[0.0, 1.0], [0.0, 0.0]]), 30)])
          print(round(float(expm(np.array([[1.0, 0.0], [0.0, 2.0]]), 30)[1, 1]), 4))
        solution: |
          import numpy as np


          def expm(A, terms):
              total = np.eye(len(A))
              term = np.eye(len(A))
              for k in range(1, terms):
                  term = term @ A / k
                  total = total + term
              return total


          print([[round(float(v), 4) for v in row] for row in expm(np.array([[0.0, 1.0], [0.0, 0.0]]), 30)])
          print(round(float(expm(np.array([[1.0, 0.0], [0.0, 2.0]]), 30)[1, 1]), 4))
        tests: |
          import numpy as _np
          assert _np.allclose(expm(_np.zeros((3, 3)), 10), _np.eye(3)), "The exponential of the zero matrix is the identity"
          assert _np.allclose(expm(_np.array([[5.0, 1.0], [2.0, 3.0]]), 1), _np.eye(2)), "With terms = 1 only the identity is summed"
          assert _np.allclose(expm(_np.array([[5.0, 1.0], [2.0, 3.0]]), 2), [[6.0, 1.0], [2.0, 4.0]]), "With terms = 2 the sum is I + A"
          assert _np.allclose(expm(_np.array([[0.0, 1.0], [0.0, 0.0]]), 30), [[1.0, 1.0], [0.0, 1.0]]), "For N = [[0, 1], [0, 0]] the series stops after two terms, and e^N = I + N"
          assert _np.allclose(expm(_np.array([[1.0, 0.0], [0.0, 2.0]]), 40), [[_np.e, 0.0], [0.0, _np.e ** 2]]), "For diag(1, 2) the exponential is diag(e, e squared). Each term is the previous one times A divided by k"
          _t = 0.7
          assert _np.allclose(expm(_np.array([[0.0, -_t], [_t, 0.0]]), 40), [[_np.cos(_t), -_np.sin(_t)], [_np.sin(_t), _np.cos(_t)]]), "For [[0, -t], [t, 0]] the exponential is the rotation by t"
          _H = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          _w, _Q = _np.linalg.eigh(_H)
          assert _np.allclose(expm(_H, 60), _Q @ _np.diag(_np.exp(_w)) @ _Q.T), "For a symmetric matrix the series should agree with Q exp(Lambda) Q transpose"
          assert output.strip() == "[[1.0, 1.0], [0.0, 1.0]]\n7.3891", "The program should print [[1.0, 1.0], [0.0, 1.0]] and then 7.3891"
        wrong:
          - |
            import numpy as np


            def expm(A, terms):
                total = np.eye(len(A))
                term = np.eye(len(A))
                for k in range(1, terms):
                    term = term @ A
                    total = total + term
                return total


            print("[[1.0, 1.0], [0.0, 1.0]]\n7.3891")
          - |
            import numpy as np


            def expm(A, terms):
                return np.exp(A)


            print("[[1.0, 1.0], [0.0, 1.0]]\n7.3891")
          - |
            import numpy as np


            def expm(A, terms):
                total = np.eye(len(A))
                term = np.eye(len(A))
                for k in range(1, terms):
                    term = term * A / k
                    total = total + term
                return total


            print("[[1.0, 1.0], [0.0, 1.0]]\n7.3891")
          - |
            import numpy as np


            def expm(A, terms):
                total = np.eye(len(A))
                term = np.eye(len(A))
                for k in range(1, terms + 1):
                    term = term @ A / k
                    total = total + term
                return total


            print("[[1.0, 1.0], [0.0, 1.0]]\n7.3891")
        explanation: |
          The term $A^k/k!$ is the previous term times $A$, divided by $k$. Keeping a running term avoids both large powers and large factorials, which would overflow separately long before their quotient becomes small.

          `np.exp(A)` is the classic mistake. It gives $e^{a_{ij}}$ in each entry, so the zero matrix would be sent to a matrix full of ones and not to the identity.

          The series is the definition, and for matrices of small norm it is a perfectly good method. For a matrix of large norm the terms first grow enormous, with alternating signs if the eigenvalues are negative, and cancellation destroys the answer. Library routines first divide the matrix by a power of 2, exponentiate the small matrix, and square the result repeatedly, using $e^A = (e^{A/2^s})^{2^s}$.
    - question:
        id: write-flow
        type: code
        mode: write
        system: s2
        prompt: |
          Gradient descent with a vanishingly small step on $f(\mathbf{x}) = \frac12\mathbf{x}^\top H\mathbf{x}$, with $H$ symmetric, follows $\mathbf{x}'(t) = -H\mathbf{x}(t)$. Write `gradient_flow(H, x0, t)` returning $\mathbf{x}(t) = e^{-tH}\mathbf{x}_0$, computed from `np.linalg.eigh(H)` and not from a series.
        starter: |
          import numpy as np


          def gradient_flow(H, x0, t):
              return x0 * 1.0


          H = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print([round(float(v), 4) for v in gradient_flow(H, np.array([1.0, 0.0, 0.0]), 1.0)])
          print([round(float(v), 4) for v in gradient_flow(H, np.array([1.0, -1.0, 1.0]), 1.0)])
        solution: |
          import numpy as np


          def gradient_flow(H, x0, t):
              values, Q = np.linalg.eigh(H)
              return Q @ (np.exp(-t * values) * (Q.T @ x0))


          H = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print([round(float(v), 4) for v in gradient_flow(H, np.array([1.0, 0.0, 0.0]), 1.0)])
          print([round(float(v), 4) for v in gradient_flow(H, np.array([1.0, -1.0, 1.0]), 1.0)])
        tests: |
          import numpy as _np
          _H = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          _x = _np.array([1.0, 0.0, 0.0])
          assert _np.shape(gradient_flow(_H, _x, 1.0)) == (3,), "The result is a vector of the same length as x0"
          assert _np.allclose(gradient_flow(_H, _x, 0.0), _x), "At time 0 the solution is the starting point"
          assert _np.allclose(gradient_flow(_H, _x, 1.0), [0.19334673, -0.11652127, 0.05801145]), "From (1, 0, 0) the point at time 1 is about (0.1933, -0.1165, 0.0580)"
          _v = _np.array([1.0, -1.0, 1.0])
          assert _np.allclose(gradient_flow(_H, _v, 2.0), _np.exp(-2.0) * _v), "(1, -1, 1) is an eigenvector of H with eigenvalue 1, so it simply decays by the factor e^(-t)"
          _D = _np.diag([1.0, 3.0])
          assert _np.allclose(gradient_flow(_D, _np.array([2.0, 2.0]), 0.5), [2.0 * _np.exp(-0.5), 2.0 * _np.exp(-1.5)]), "For H = diag(1, 3) each coordinate decays at its own rate"
          _a = gradient_flow(_H, gradient_flow(_H, _x, 0.3), 0.4)
          assert _np.allclose(_a, gradient_flow(_H, _x, 0.7)), "Flowing for 0.3 and then for 0.4 should be the same as flowing for 0.7"
          assert output.strip() == "[0.1933, -0.1165, 0.058]\n[0.3679, -0.3679, 0.3679]", "The program should print [0.1933, -0.1165, 0.058] and then [0.3679, -0.3679, 0.3679]"
        wrong:
          - |
            import numpy as np


            def gradient_flow(H, x0, t):
                return np.exp(-t * H) @ x0


            print("[0.1933, -0.1165, 0.058]\n[0.3679, -0.3679, 0.3679]")
          - |
            import numpy as np


            def gradient_flow(H, x0, t):
                values, Q = np.linalg.eigh(H)
                return Q @ (np.exp(t * values) * (Q.T @ x0))


            print("[0.1933, -0.1165, 0.058]\n[0.3679, -0.3679, 0.3679]")
          - |
            import numpy as np


            def gradient_flow(H, x0, t):
                values, Q = np.linalg.eigh(H)
                return Q.T @ (np.exp(-t * values) * (Q @ x0))


            print("[0.1933, -0.1165, 0.058]\n[0.3679, -0.3679, 0.3679]")
          - |
            import numpy as np


            def gradient_flow(H, x0, t):
                values, Q = np.linalg.eigh(H)
                return Q @ ((1.0 - t * values) * (Q.T @ x0))


            print("[0.1933, -0.1165, 0.058]\n[0.3679, -0.3679, 0.3679]")
        explanation: |
          Three steps, read from the right. `Q.T @ x0` gives the coordinates of the starting point in the eigenbasis of $H$. Each coordinate then decays independently, by the factor $e^{-t\lambda_i}$. `Q @` returns to the original coordinates. This is $Qe^{-t\Lambda}Q^\top\mathbf{x}_0$, without ever forming the matrix.

          The picture is the content. Along an eigenvector of $H$ with eigenvalue $\lambda$, gradient flow decays like $e^{-\lambda t}$. Directions of high curvature are settled quickly and directions of low curvature slowly. The second printed line starts on the eigenvector for $\lambda = 1$, the slowest direction, and after one unit of time has decayed only to $e^{-1} = 0.3679$.

          The last wrong version uses $1 - t\lambda$ in place of $e^{-t\lambda}$. That is one step of ordinary gradient descent with step size $t$. With $t = 1$ and $\lambda = 4$ the factor is $-3$, and the iteration diverges, while the continuous flow never can. Gradient descent is the Euler approximation of this flow, and its step size limit $2/\lambda_{\max}$ is the price of the approximation.
    - question:
        id: fix-inverse
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `expm_eig(A)` should compute $e^A$ for a diagonalisable matrix from its eigenvalues and eigenvectors. For this triangular matrix the top-right entry should be $e^3 - e \approx 17.3673$ and the bottom-left entry `0.0`. The program prints something else. Fix it.
        starter: |
          import numpy as np


          def expm_eig(A):
              values, P = np.linalg.eig(A)
              return (P @ np.diag(np.exp(values)) @ P.T).real


          E = expm_eig(np.array([[1.0, 2.0], [0.0, 3.0]]))
          print(round(float(E[0, 1]), 4), round(float(E[1, 0]), 4) + 0.0)
        solution: |
          import numpy as np


          def expm_eig(A):
              values, P = np.linalg.eig(A)
              return (P @ np.diag(np.exp(values)) @ np.linalg.inv(P)).real


          E = expm_eig(np.array([[1.0, 2.0], [0.0, 3.0]]))
          print(round(float(E[0, 1]), 4), round(float(E[1, 0]), 4) + 0.0)
        tests: |
          import numpy as _np
          _E = expm_eig(_np.array([[1.0, 2.0], [0.0, 3.0]]))
          assert _np.allclose(_E, [[_np.e, _np.e ** 3 - _np.e], [0.0, _np.e ** 3]]), "For [[1, 2], [0, 3]] the exponential is [[e, e^3 - e], [0, e^3]]. The eigenvector matrix of a matrix that is not symmetric is not orthogonal, so its inverse is not its transpose"
          _B = _np.array([[4.0, -2.0], [1.0, 1.0]])
          _T, _term = _np.eye(2), _np.eye(2)
          for _k in range(1, 60):
              _term = _term @ _B / _k
              _T = _T + _term
          assert _np.allclose(expm_eig(_B), _T), "For [[4, -2], [1, 1]], with eigenvalues 2 and 3, the result should agree with the series"
          assert _np.allclose(expm_eig(_np.array([[0.0, -1.0], [1.0, 0.0]])), [[_np.cos(1.0), -_np.sin(1.0)], [_np.sin(1.0), _np.cos(1.0)]]), "For [[0, -1], [1, 0]], whose eigenvalues are complex, the result should be the rotation by 1 radian"
          assert _np.allclose(expm_eig(_np.diag([0.0, 1.0])), _np.diag([1.0, _np.e])), "For diag(0, 1) the exponential is diag(1, e)"
          assert output.strip() == "17.3673 0.0", "The program should print 17.3673 0.0"
        wrong:
          - |
            import numpy as np


            def expm_eig(A):
                values, P = np.linalg.eig(A)
                return (P @ np.diag(np.exp(values)) @ P.T).real


            print("17.3673 0.0")
          - |
            import numpy as np


            def expm_eig(A):
                values, P = np.linalg.eig(A)
                return (np.linalg.inv(P) @ np.diag(np.exp(values)) @ P).real


            print("17.3673 0.0")
          - |
            import numpy as np


            def expm_eig(A):
                values, P = np.linalg.eig(A)
                return (P @ np.exp(np.diag(values)) @ np.linalg.inv(P)).real


            print("17.3673 0.0")
          - |
            import numpy as np


            def expm_eig(A):
                values, P = np.linalg.eig(A)
                return (P @ np.diag(values) @ np.linalg.inv(P)).real


            print("17.3673 0.0")
        explanation: |
          $A = PDP^{-1}$, and $P^{-1} = P^\top$ only when $P$ is orthogonal, which the spectral theorem guarantees for symmetric matrices and nothing guarantees otherwise. This matrix is triangular, its eigenvectors $(1, 0)$ and $(1, 1)/\sqrt2$ are not perpendicular, and the transpose gives a symmetric matrix that has nothing to do with $e^A$.

          The third wrong version exponentiates the diagonal **matrix** entry by entry. The off-diagonal zeros become $e^0 = 1$, so the middle factor is no longer diagonal. `np.diag(np.exp(values))` exponentiates the eigenvalues first and then places them on a diagonal.

          The final `.real` is needed because a real matrix can have complex eigenvalues, as the rotation in the tests does. The product is then real up to rounding, with a zero imaginary part. And the method fails for a defective matrix, where `P` is singular or nearly so. Near a defective matrix `P` is very ill-conditioned and the result loses accuracy, which is why libraries do not compute $e^A$ this way.
    - question:
        id: work-transient
        type: choice
        system: s2
        prompt: |
          A recurrent network repeatedly applies a weight matrix $W$ to its state. All eigenvalues of $W$ have absolute value $0.95$, and $W$ is far from symmetric. Over 100 steps, what can happen to the size of the state?
        options:
          - 'It shrinks by exactly $0.95$ every step.'
          - 'It can grow substantially for many steps before the eventual decay, because $W^k$ can have entries like $k\,0.95^{k-1}$ or worse. The eigenvalues decide only the eventual rate.'
          - 'It stays constant.'
          - 'It grows for ever.'
        answer: 1
        explanation: |
          This is the puzzle's hump. For an exactly defective matrix the powers carry polynomial factors in $k$. For a matrix that is merely close to defective, with nearly parallel eigenvectors, $\|W^k\| \le \kappa(P)\rho^k$ and $\kappa(P)$ can be huge, so the effect is the same over any practical number of steps. Only for normal matrices, such as symmetric or orthogonal ones, is $\|W^k\| = \rho^k$ exactly. This transient growth is one of the reasons the gradients of recurrent networks are hard to control, and why orthogonal initialisation is popular: an orthogonal matrix has no hump at all.
    - question:
        id: work-det
        type: numeric
        system: s2
        prompt: |
          $A = \begin{pmatrix} 2 & 7 \\ 0 & -2 \end{pmatrix}$. What is the determinant of $e^{tA}$ at $t = 5$?
        answer: "1"
        explanation: |
          $\det e^{tA} = e^{t\operatorname{tr}A} = e^{5 \times 0} = 1$. The eigenvalues of $e^{tA}$ are $e^{2t}$ and $e^{-2t}$, whose product is 1. The determinant is the factor by which the flow of $\mathbf{x}' = A\mathbf{x}$ scales volumes, so a matrix of zero trace gives a flow that preserves volume, however much it stretches in one direction and squeezes in another. Flows built to have a known determinant in this way are used in models that must keep track of how a probability density changes.
    - question:
        id: work-numerics
        type: choice
        system: s2
        prompt: |
          Why do numerical libraries offer the eigendecomposition and the SVD, but no routine for the Jordan form?
        options:
          - 'Because the Jordan form does not exist for most matrices.'
          - 'Because the Jordan form changes discontinuously: an arbitrarily small change of the entries can turn a block of size 2 into two blocks of size 1. Rounding errors are such changes, so the computed structure would be meaningless.'
          - 'Because it would be too slow.'
          - 'Because it applies only to symmetric matrices.'
        answer: 1
        explanation: |
          Every matrix has a Jordan form, so existence is not the problem. The problem is that the sizes of the blocks depend on whether eigenvalues are **exactly** equal and on exact ranks, and neither question survives rounding. A stored matrix is already a perturbation of the intended one. Diagonalisable matrices are dense, so a computed matrix is, for practical purposes, always diagonalisable, only with a very ill-conditioned $P$ when it is near a defective one. Stable alternatives exist: the Schur form $A = QTQ^{\mathsf H}$, with $Q$ unitary and $T$ triangular, exists for every matrix and is computed by orthogonal operations. The Jordan form remains the right way to **think** about powers and exponentials.
  connections:
    - text: |
        $J^k$ has the corner entry $k\,0.9^{k-1}$, which rises before it falls. $J$ is **defective**: it has too few eigenvectors to be diagonalised. Every square matrix can still be brought to **Jordan form**, eigenvalues on the diagonal with shifts above them, and the shifts put polynomial factors in $k$ in front of $\lambda^k$. The eigenvalues decide the long run, and the Jordan structure and the norm decide what happens on the way.

        The **matrix exponential** $e^{tA} = \sum(tA)^k/k!$ does for continuous time what powers do for steps: it solves $\mathbf{x}' = A\mathbf{x}$. For a symmetric matrix it is $Qe^{t\Lambda}Q^\top$, each eigen-direction decaying or growing at its own rate, and gradient flow on a quadratic is the leading example.

        In both settings, after a long time, one term dominates: the one with the largest eigenvalue. Everything else has decayed relative to it. That observation is itself an algorithm for finding the largest eigenvalue and its eigenvector, by doing nothing but multiplying. And for one important class of matrices, those with positive entries, there is a theorem saying exactly what that dominant eigenvector looks like: [[m8.perron-frobenius-and-power-iteration]].
