concept: m8.courant-fischer-min-max-theorem
minutes: 85
claim: You can state the Courant-Fischer theorem that describes every eigenvalue of a symmetric matrix as a maximum over subspaces of a minimum of the Rayleigh quotient, explain the dimension count behind it, and use it to derive that eigenvalues of symmetric matrices move by no more than the size of a symmetric perturbation, that they grow when a positive semidefinite matrix is added, and that the eigenvalues of a principal submatrix interlace those of the whole matrix.
recalls: [m8.quadratic-forms-and-the-rayleigh-quotient]
uses: [m8.spectral-theorem, m8.positive-definite-matrices-and-cholesky, m8.eigenvalues-and-eigenvectors, m8.diagonalisation, m6.subspaces-sums-and-direct-sums, m6.rank-nullity-theorem, m7.orthonormal-bases, m7.conditioning, m7.gram-schmidt-and-qr, e5.linear-algebra-routines, e5.indexing-and-slicing, e0.functions]
leads: [m8.singular-value-decomposition, m8.eckart-young-theorem, m8.pca-as-svd, m8.operator-and-frobenius-norms]
starter: |
  # Scratch space. Change one entry of a matrix by 0.0001.
  # How far do its eigenvalues move? Once for a matrix that is not
  # symmetric, and once for a symmetric one (changing two mirrored entries).
  import numpy as np

  pairs = [
      (np.array([[0.0, 1.0], [0.0, 0.0]]), np.array([[0.0, 1.0], [0.0001, 0.0]])),
      (np.array([[0.0, 1.0], [1.0, 0.0]]), np.array([[0.0, 1.0001], [1.0001, 0.0]])),
  ]
  for before, after in pairs:
      a = np.sort(np.linalg.eigvals(before).real)
      b = np.sort(np.linalg.eigvals(after).real)
      print(round(float(np.abs(b - a).max()), 6))
parts:
  recall:
    - text: |
        [[m8.quadratic-forms-and-the-rayleigh-quotient]] showed that the largest eigenvalue of a symmetric matrix is the maximum of the Rayleigh quotient, and the smallest its minimum. Today finds the same kind of description for the eigenvalues in between, and puts it to work. Three quick pulls first.
  puzzle:
    - text: |
        The starter changes a matrix by one ten-thousandth and reports how far the eigenvalues move.

        ```
        0.01
        0.0001
        ```

        For $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, a change of $0.0001$ in one entry moves the eigenvalues by $0.01$: a hundred times the cause. Make the change $10^{-10}$ and they move by $10^{-5}$, a hundred thousand times the cause.

        For the symmetric matrix $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, a change of $0.0001$ moves the eigenvalues by $0.0001$. No amplification.

        Every measured matrix carries errors, and every computed one carries rounding. If eigenvalues could jump about as in the first case, they would be useless for data.

        **Why can the eigenvalues of a symmetric matrix never move further than the perturbation itself? And what can be said about each eigenvalue separately, not just the largest?**
  intuition:
    - text: |
        The largest eigenvalue is a maximum: $\lambda_1 = \max R(\mathbf{x})$. A maximum is a steady thing. If the function being maximised changes by at most $\varepsilon$ everywhere, its maximum changes by at most $\varepsilon$. So $\lambda_1$ cannot jump. To get the same steadiness for $\lambda_2, \lambda_3, \dots$, each of them must be written as an optimum too.

        Order the eigenvalues $\lambda_1 \ge \lambda_2 \ge \dots \ge \lambda_n$, with orthonormal eigenvectors $\mathbf{q}_1, \dots, \mathbf{q}_n$. One description of $\lambda_2$ is immediate: it is the maximum of the Rayleigh quotient over vectors **orthogonal to $\mathbf{q}_1$**. But this description mentions $\mathbf{q}_1$, and if the matrix is perturbed, $\mathbf{q}_1$ moves. A description that survives perturbation must not mention eigenvectors at all.

        Here is one. Take any **plane** through the origin, and look for the **worst** direction in it, where the Rayleigh quotient is smallest. Different planes have different worst values. The claim is that the best of these worst values is exactly $\lambda_2$:

        $$\lambda_2 = \max_{\text{planes } S}\ \min_{\mathbf{x} \in S} R(\mathbf{x}).$$

        Why can no plane do better than $\lambda_2$? Every plane, however cleverly chosen, must cross the subspace spanned by $\mathbf{q}_2, \dots, \mathbf{q}_n$, simply because a 2-dimensional and an $(n - 1)$-dimensional subspace of an $n$-dimensional space cannot avoid each other. And on that subspace the quotient is at most $\lambda_2$. So every plane contains a direction with $R \le \lambda_2$. The plane spanned by $\mathbf{q}_1, \mathbf{q}_2$ has nothing worse than that. A dimension count from the last cluster is the whole proof.
  derivation:
    - text: |
        Let $A$ be real symmetric with eigenvalues $\lambda_1 \ge \lambda_2 \ge \dots \ge \lambda_n$ and orthonormal eigenvectors $\mathbf{q}_1, \dots, \mathbf{q}_n$, and $R(\mathbf{x}) = \dfrac{\mathbf{x}^\top A\mathbf{x}}{\mathbf{x}^\top\mathbf{x}}$. (NumPy's `eigh` lists them the other way round, smallest first.)

        **Theorem (Courant-Fischer).** For each $k$,

        $$\lambda_k = \max_{\dim S = k}\ \min_{\mathbf{x} \in S,\ \mathbf{x} \ne \mathbf{0}} R(\mathbf{x}) = \min_{\dim S = n - k + 1}\ \max_{\mathbf{x} \in S,\ \mathbf{x} \ne \mathbf{0}} R(\mathbf{x}).$$

        *Proof of the first equality.* Let $S$ be any subspace of dimension $k$, and $T = \operatorname{span}(\mathbf{q}_k, \dots, \mathbf{q}_n)$, of dimension $n - k + 1$. By the dimension formula,

        $$\dim(S \cap T) = \dim S + \dim T - \dim(S + T) \ge k + (n - k + 1) - n = 1.$$

        So there is a nonzero $\mathbf{x} \in S \cap T$. Being in $T$, it is a combination of $\mathbf{q}_k, \dots, \mathbf{q}_n$, and its Rayleigh quotient is a weighted average of $\lambda_k, \dots, \lambda_n$, hence at most $\lambda_k$. So $\min_{S} R \le \lambda_k$ for **every** $S$ of dimension $k$.

        For $S_0 = \operatorname{span}(\mathbf{q}_1, \dots, \mathbf{q}_k)$ every quotient is an average of $\lambda_1, \dots, \lambda_k$, hence at least $\lambda_k$, with equality at $\mathbf{q}_k$. So the maximum over $S$ is attained, and equals $\lambda_k$. $\blacksquare$

        The second equality is the first one applied to $-A$.

        For $k = 1$ this is $\lambda_1 = \max R$, and for $k = n$ the second form is $\lambda_n = \min R$: the Rayleigh-Ritz theorem of the last lesson.

        **Restricting to a subspace.** Let the columns of $U$ be an orthonormal basis of a subspace $S$. For $\mathbf{x} = U\mathbf{c}$, $R_A(\mathbf{x}) = \dfrac{\mathbf{c}^\top(U^\top AU)\mathbf{c}}{\mathbf{c}^\top\mathbf{c}}$. So the largest and smallest values of the quotient **on $S$** are the largest and smallest eigenvalues of the small symmetric matrix $U^\top AU$.
    - question:
        id: derivation-second
        type: numeric
        system: s2
        prompt: |
          A symmetric matrix has eigenvalues $9, 5, 2$ with orthonormal eigenvectors $\mathbf{q}_1, \mathbf{q}_2, \mathbf{q}_3$. On the plane spanned by $\mathbf{q}_1$ and $\mathbf{q}_3$, what is the smallest value of the Rayleigh quotient?
        answer: "2"
        explanation: |
          On that plane the quotient is a weighted average of 9 and 2, so it ranges from 2 to 9, and its minimum is 2. The theorem says no plane has a minimum above $\lambda_2 = 5$, and this plane, with minimum 2, is far from the best. The best plane is the one spanned by $\mathbf{q}_1$ and $\mathbf{q}_2$, with minimum exactly 5. A plane that contains $\mathbf{q}_1$ is not automatically good. What counts is its worst direction.
    - text: |
        **Consequence 1: adding a matrix (Weyl).** Let $A$ and $E$ be symmetric. For every $\mathbf{x}$, $R_{A+E}(\mathbf{x}) = R_A(\mathbf{x}) + R_E(\mathbf{x})$, and $\lambda_{\min}(E) \le R_E(\mathbf{x}) \le \lambda_{\max}(E)$. Put this inside the max-min: for each $k$,

        $$\lambda_k(A) + \lambda_{\min}(E) \le \lambda_k(A + E) \le \lambda_k(A) + \lambda_{\max}(E).$$

        In particular

        $$|\lambda_k(A + E) - \lambda_k(A)| \le \max_i|\lambda_i(E)| = \|E\|_2.$$

        **Each eigenvalue of a symmetric matrix moves by at most the size of the perturbation.** That is the puzzle: the eigenvalue problem for symmetric matrices is perfectly conditioned. The non-symmetric matrix of the starter is defective, and near a defective matrix eigenvalues can move like the square root of the perturbation.

        **Consequence 2: monotonicity.** If $E$ is positive semidefinite then $\lambda_{\min}(E) \ge 0$, so $\lambda_k(A + E) \ge \lambda_k(A)$ for every $k$. Adding a positive semidefinite matrix can only raise eigenvalues. Adding $\mu I$ raises each by exactly $\mu$.

        **Consequence 3: interlacing (Cauchy).** Delete the last row and column of $A$ to get the $(n-1) \times (n-1)$ matrix $B$, with eigenvalues $\mu_1 \ge \dots \ge \mu_{n-1}$. The quadratic form of $B$ is the form of $A$ restricted to the vectors whose last coordinate is zero, a subspace of dimension $n - 1$. Feeding that restriction into the max-min and the min-max gives

        $$\lambda_1 \ge \mu_1 \ge \lambda_2 \ge \mu_2 \ge \dots \ge \mu_{n-1} \ge \lambda_n.$$

        The eigenvalues of the smaller matrix sit in the gaps between those of the larger one. The same holds for $U^\top AU$ with any $n - 1$ orthonormal columns.

        *Example.* $A = \begin{pmatrix} 2 & 1 & 0 \\ 1 & 3 & 1 \\ 0 & 1 & 2 \end{pmatrix}$ has eigenvalues $4, 2, 1$. Its top-left $2 \times 2$ corner has eigenvalues $3.618$ and $1.382$, and $4 \ge 3.618 \ge 2 \ge 1.382 \ge 1$.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that every subspace S of dimension k contains a nonzero vector whose Rayleigh quotient is at most the k-th largest eigenvalue.
        steps:
          - 'Let $T$ be the span of the eigenvectors $\mathbf{q}_k, \dots, \mathbf{q}_n$, of dimension $n - k + 1$.'
          - 'The dimensions of $S$ and $T$ add up to $n + 1$, more than the dimension of the whole space.'
          - 'By the dimension formula, $S \cap T$ contains a nonzero vector $\mathbf{x}$.'
          - 'As a vector of $T$, $\mathbf{x}$ has a Rayleigh quotient that is a weighted average of $\lambda_k, \dots, \lambda_n$.'
          - 'Such an average is at most $\lambda_k$.'
        explanation: Two subspaces whose dimensions add up to more than n must share a line, and on that line the quotient is under control.
  formal:
    - text: |
        Let $A, B$ be real symmetric (or Hermitian) $n \times n$, eigenvalues in decreasing order $\lambda_1(\cdot) \ge \dots \ge \lambda_n(\cdot)$.

        **Courant-Fischer.** $\lambda_k(A) = \max\limits_{\dim S = k}\ \min\limits_{\mathbf{0} \ne \mathbf{x} \in S} R_A(\mathbf{x}) = \min\limits_{\dim S = n-k+1}\ \max\limits_{\mathbf{0} \ne \mathbf{x} \in S} R_A(\mathbf{x})$.

        **Equivalent form.** $\lambda_k(A) = \min\limits_{\mathbf{w}_1, \dots, \mathbf{w}_{k-1}}\ \max\limits_{\mathbf{x} \perp \mathbf{w}_1, \dots, \mathbf{w}_{k-1}} R_A(\mathbf{x})$, the minimum being attained at $\mathbf{w}_i = \mathbf{q}_i$.

        **Weyl's inequalities.** $\lambda_{i+j-1}(A + B) \le \lambda_i(A) + \lambda_j(B)$. In particular $\lambda_k(A) + \lambda_n(B) \le \lambda_k(A + B) \le \lambda_k(A) + \lambda_1(B)$, and $|\lambda_k(A + B) - \lambda_k(A)| \le \|B\|_2$.

        **Monotonicity.** If $B \succeq 0$ then $\lambda_k(A + B) \ge \lambda_k(A)$ for all $k$. If $A \preceq B$ then $\lambda_k(A) \le \lambda_k(B)$ for all $k$.

        **Cauchy interlacing.** If $U$ is $n \times m$ with orthonormal columns and $M = U^\top AU$, then $\lambda_k(A) \ge \lambda_k(M) \ge \lambda_{k+n-m}(A)$ for $k = 1, \dots, m$. For a principal submatrix of size $n - 1$: $\lambda_k(A) \ge \mu_k \ge \lambda_{k+1}(A)$.

        **Rank-one update.** For $\mathbf{v} \in \mathbb{R}^n$: $\lambda_k(A) \le \lambda_k(A + \mathbf{v}\mathbf{v}^\top) \le \lambda_{k-1}(A)$.

        **Sums of eigenvalues (Ky Fan).** $\lambda_1 + \dots + \lambda_k = \max \operatorname{tr}(U^\top AU)$ over $n \times k$ matrices $U$ with orthonormal columns.

        **Eigenvectors.** No such bound holds for eigenvectors: when two eigenvalues are close, their eigenvectors can turn by a large angle under a small perturbation.
