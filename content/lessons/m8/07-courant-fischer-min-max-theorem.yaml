    - question:
        id: fix-submatrix
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `interlaces(A)` should check Cauchy's theorem for a symmetric matrix: with $\lambda$ the eigenvalues of `A` in increasing order and $\mu$ those of `A` with its last row and column removed, it should hold that $\lambda_i \le \mu_i \le \lambda_{i+1}$ for every $i$. The theorem is true, and the function prints `False`. Fix it.
        starter: |
          import numpy as np


          def interlaces(A):
              lam = np.linalg.eigvalsh(A)
              mu = np.linalg.eigvalsh(A[1:, :-1])
              return all(lam[i] - 1e-9 <= mu[i] <= lam[i + 1] + 1e-9 for i in range(len(mu)))


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print(interlaces(A))
        solution: |
          import numpy as np


          def interlaces(A):
              lam = np.linalg.eigvalsh(A)
              mu = np.linalg.eigvalsh(A[:-1, :-1])
              return all(lam[i] - 1e-9 <= mu[i] <= lam[i + 1] + 1e-9 for i in range(len(mu)))


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print(interlaces(A))
        tests: |
          import numpy as _np
          _A = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          assert interlaces(_A) == True, "The corner of this matrix has eigenvalues 1.382 and 3.618, which interlace 1, 2, 4: remove the last row and the last column, A[:-1, :-1]"
          _r = _np.random.default_rng(0)
          for _ in range(50):
              _M = _r.normal(size=(5, 5))
              assert interlaces(_M + _M.T) == True, "Interlacing holds for every symmetric matrix, so the function should return True for random ones"
          assert interlaces(_np.diag([5.0, 1.0, 3.0])) == True, "For diag(5, 1, 3) the corner has eigenvalues 1 and 5, and 1 <= 1 <= 3 <= 5 <= 5"
          assert interlaces(_np.array([[0.0, 2.0], [2.0, 0.0]])) == True, "For [[0, 2], [2, 0]] the corner is the 1 by 1 matrix 0, between -2 and 2"
          assert output.strip() == "True", "The program should print True"
        wrong:
          - |
            import numpy as np


            def interlaces(A):
                lam = np.linalg.eigvalsh(A)
                mu = np.linalg.eigvalsh(A[1:, :-1])
                return all(lam[i] - 1e-9 <= mu[i] <= lam[i + 1] + 1e-9 for i in range(len(mu)))


            print("True")
          - |
            import numpy as np


            def interlaces(A):
                lam = np.linalg.eigvalsh(A)
                mu = np.linalg.eigvalsh(A[:-1, :-1])
                return all(lam[i + 1] - 1e-9 <= mu[i] for i in range(len(mu)))


            print("True")
          - |
            import numpy as np


            def interlaces(A):
                lam = np.linalg.eigvalsh(A)
                mu = np.linalg.eigvalsh(A[:-1, :-1])
                return all(lam[i] + 1e-9 < mu[i] < lam[i + 1] - 1e-9 for i in range(len(mu)))


            print("True")
        explanation: |
          `A[1:, :-1]` drops the **first** row and the **last** column. What remains is not a principal submatrix: it is not symmetric, and it is not the matrix of the quadratic form on any coordinate subspace. `eigvalsh` did not complain, because it reads only the lower triangle and assumes the rest.

          A principal submatrix deletes rows and columns with the **same** indices. `A[:-1, :-1]` deletes the last of each. `A[1:, 1:]` would also do, and interlacing holds for it too.

          The inequalities are not strict, as the diagonal example shows, so the last wrong version is too demanding. In data terms: remove one feature from a data set, and the variances along the principal directions of what remains interlace the original ones. The largest cannot increase, and it cannot drop below the original second largest.
    - question:
        id: work-count
        type: choice
        system: s2
        prompt: |
          In $\mathbb{R}^6$, why must every 3-dimensional subspace $S$ contain a nonzero vector whose Rayleigh quotient is at most $\lambda_3$?
        options:
          - 'Because $S$ contains the eigenvector $\mathbf{q}_3$.'
          - 'The span of $\mathbf{q}_3, \mathbf{q}_4, \mathbf{q}_5, \mathbf{q}_6$ has dimension 4, and $3 + 4 > 6$, so it meets $S$ in at least a line. On that span the quotient is an average of $\lambda_3, \dots, \lambda_6$, so at most $\lambda_3$.'
          - 'Because the quotient is at most $\lambda_3$ everywhere.'
          - 'It need not. Some 3-dimensional subspaces avoid it.'
        answer: 1
        explanation: |
          $S$ need not contain any eigenvector at all. The argument never looks for one. It only counts: a 3-dimensional and a 4-dimensional subspace of a 6-dimensional space overlap in dimension at least $3 + 4 - 6 = 1$. That is the dimension formula for sums from the lesson on subspaces, and it is the entire engine of the Courant-Fischer theorem.
    - question:
        id: work-rank-one
        type: choice
        system: s2
        prompt: |
          A covariance matrix $C$ has eigenvalues $10, 4, 1$. One more data point is added, which changes $C$ to $C + \mathbf{v}\mathbf{v}^\top$ for some vector $\mathbf{v}$. What can be said about the new second eigenvalue?
        options:
          - 'Nothing. It can be anything.'
          - 'It lies between 4 and 10. Adding the positive semidefinite $\mathbf{v}\mathbf{v}^\top$ lowers no eigenvalue, and since that matrix has rank 1, the new eigenvalues interlace the old: $\lambda_2(C) \le \lambda_2(C + \mathbf{v}\mathbf{v}^\top) \le \lambda_1(C)$.'
          - 'It is exactly 4.'
          - 'It is at least 10.'
        answer: 1
        explanation: |
          Monotonicity gives the lower bound. The upper bound comes from the max-min with a clever choice: the vectors orthogonal to $\mathbf{v}$ form a subspace of dimension $n - 1$ on which the two quadratic forms agree, and interlacing for that restriction does the rest. So a rank-one update pushes each eigenvalue up, but not past the old position of the next one above. Only the top eigenvalue is free to move far, by up to $\|\mathbf{v}\|^2$. Online algorithms that update a decomposition one data point at a time rely on this.
    - question:
        id: work-eigenvectors
        type: choice
        system: s2
        prompt: |
          $A = \begin{pmatrix} 1 & 0 \\ 0 & 1.0001 \end{pmatrix}$ is perturbed to $\begin{pmatrix} 1.00005 & 0.0001 \\ 0.0001 & 1.00005 \end{pmatrix}$. The eigenvalues barely move. What happens to the eigenvectors?
        options:
          - 'They barely move either, by Weyl.'
          - 'They turn by $45°$, from the coordinate axes to $(1, 1)$ and $(1, -1)$. Weyl bounds eigenvalues, not eigenvectors. When two eigenvalues are closer together than the size of the perturbation, their eigenvectors are almost arbitrary within the plane they span.'
          - 'They disappear.'
          - 'They become complex.'
        answer: 1
        explanation: |
          The perturbed matrix is $1.00005\,I$ plus $0.0001$ times $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$, whose eigenvectors are the diagonals. The eigenvalues become $1.00015$ and $0.99995$, within $0.0001$ of the old ones as promised. For eigenvectors the relevant quantity is the perturbation divided by the **gap** between eigenvalues, and here the gap was as small as the perturbation. A principal direction is trustworthy only when its eigenvalue is well separated from its neighbours. The plane spanned by the two, in contrast, has hardly moved.
  connections:
    - text: |
        A change of $0.0001$ moved the eigenvalues of a symmetric matrix by $0.0001$, and those of a defective matrix a hundred times as far. The difference is that each eigenvalue of a symmetric matrix is an optimum. The **Courant-Fischer theorem** says $\lambda_k$ is the best, over subspaces of dimension $k$, of the worst Rayleigh quotient in the subspace, and the proof is a count of dimensions.

        From it: eigenvalues of $A + E$ differ from those of $A$ by at most the largest $|\lambda(E)|$ (**Weyl**), adding a positive semidefinite matrix lowers none of them, and the eigenvalues of a principal submatrix **interlace** those of the whole. Eigenvectors enjoy no such stability when eigenvalues are close.

        Everything since the spectral theorem has been about symmetric matrices. Most matrices that arise are not symmetric, and most are not even square: a data matrix with a row for each example and a column for each feature has no eigenvalues at all. Yet $A^\top A$ is always symmetric and positive semidefinite, and the largest stretch of $A$ was the square root of its largest eigenvalue. Carrying that idea through for every direction at once gives a factorisation of **any** matrix into a rotation, a scaling along axes and another rotation. It is the most useful factorisation in applied mathematics: [[m8.singular-value-decomposition]].
