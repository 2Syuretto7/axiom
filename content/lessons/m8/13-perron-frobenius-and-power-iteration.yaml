          assert _np.shape(_p) == (3,), "The result has one entry per page"
          assert abs(float(_p.sum()) - 1.0) < 1e-9, "The ranks should add up to 1. The random jump adds (1 - alpha) / n to every page"
          assert _np.allclose(_p, [0.38778971, 0.21481063, 0.39739966]), "For the three pages with alpha = 0.85 the ranks are about (0.3878, 0.2148, 0.3974)"
          assert _np.allclose(pagerank(_M, 1.0, 200), [0.4, 0.2, 0.4]), "With alpha = 1 there are no random jumps and the result is the stationary distribution (0.4, 0.2, 0.4)"
          assert _np.allclose(pagerank(_M, 0.0, 5), [1 / 3, 1 / 3, 1 / 3]), "With alpha = 0 every step is a random jump and all pages are equal"
          assert _np.allclose(pagerank(_M, 0.85, 1), 0.85 * (_M @ _np.ones(3) / 3) + 0.05), "After one step from the uniform start the result is 0.85 M x + 0.05"
          _L = _np.array([[0.0, 0.0, 1.0, 0.5], [1 / 3, 0.0, 0.0, 0.0], [1 / 3, 0.5, 0.0, 0.5], [1 / 3, 0.5, 0.0, 0.0]])
          _q = pagerank(_L, 0.85, 200)
          _G = 0.85 * _L + 0.15 / 4
          assert _np.allclose(_G @ _q, _q) and abs(float(_q.sum()) - 1.0) < 1e-9, "For a web of four pages the result should be a distribution left unchanged by the Google matrix"
          assert output.strip() == "[0.3878, 0.2148, 0.3974]\n[0.4, 0.2, 0.4]", "The program should print [0.3878, 0.2148, 0.3974] and then [0.4, 0.2, 0.4]"
