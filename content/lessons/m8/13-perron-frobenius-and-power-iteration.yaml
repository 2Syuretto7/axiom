    - question:
        id: predict-estimates
        type: predict
        system: s1
        prompt: Power iteration on a symmetric matrix with eigenvalues 4, 2 and 1, from the start (1, 0, 0). The eigenvalue estimate after each of the first steps. What does this show?
        code: |
          import numpy as np

          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          x = np.array([1.0, 0.0, 0.0])
          for k in range(1, 7):
              y = A @ x
              x = y / np.linalg.norm(y)
              print(k, round(float(x @ A @ x), 4))
        output: |
          1 3.0
          2 3.6667
          3 3.9091
          4 3.9767
          5 3.9942
          6 3.9985
        explanation: The estimates climb to 4, the largest eigenvalue. The gap to 4 shrinks by about a factor of 4 per step, the square of the ratio 2/4, because the Rayleigh quotient of a symmetric matrix is accurate to the square of the error of the vector.
  work:
    - text: Slower now. The first task is the algorithm.
    - question:
        id: write-power
        type: code
        mode: write
        system: s2
        prompt: |
          Write `power_iteration(A, steps)`. Start from the vector of all ones. At each step multiply by `A` and rescale to unit length. Return the pair `(value, x)`: the Rayleigh quotient `x @ A @ x` of the final unit vector, as a float, and that vector.
        starter: |
          import numpy as np


          def power_iteration(A, steps):
              x = np.ones(len(A))
              return 0.0, x


          A = np.array([[1.0, 2.0], [3.0, 2.0]])
          value, x = power_iteration(A, 60)
          print(round(value, 4), [round(float(v), 4) for v in x])
        solution: |
          import numpy as np


          def power_iteration(A, steps):
              x = np.ones(len(A))
              x = x / np.linalg.norm(x)
              for step in range(steps):
                  y = A @ x
                  x = y / np.linalg.norm(y)
              return float(x @ A @ x), x


          A = np.array([[1.0, 2.0], [3.0, 2.0]])
          value, x = power_iteration(A, 60)
          print(round(value, 4), [round(float(v), 4) for v in x])
        tests: |
          import numpy as _np
          _A = _np.array([[1.0, 2.0], [3.0, 2.0]])
          _out = power_iteration(_A, 60)
          assert isinstance(_out, tuple) and len(_out) == 2, "power_iteration should return the pair (value, x)"
          _val, _x = _out
          assert abs(float(_np.linalg.norm(_x)) - 1.0) < 1e-9, "The returned vector should have unit length. Rescale after every multiplication"
          assert abs(_val - 4.0) < 1e-8, "[[1, 2], [3, 2]] has eigenvalues 4 and -1, so the dominant eigenvalue is 4"
          assert _np.allclose(_x, _np.array([2.0, 3.0]) / 13 ** 0.5), "The dominant eigenvector of [[1, 2], [3, 2]] is (2, 3), scaled to unit length. Multiply by A itself, not by its transpose"
          _S = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          _val, _x = power_iteration(_S, 40)
          assert abs(_val - 4.0) < 1e-9 and _np.allclose(_x, _np.array([1.0, 2.0, 1.0]) / 6 ** 0.5), "For the symmetric matrix with eigenvalues 4, 2, 1 the result should be 4 and (1, 2, 1) scaled to unit length"
          _val, _x = power_iteration(-_S, 41)
          assert abs(_val + 4.0) < 1e-9, "For the negative of that matrix the dominant eigenvalue is -4. The Rayleigh quotient has the right sign, where the length of A x would not"
          _val, _x = power_iteration(_np.diag([3.0, 1.0]), 0)
          assert abs(_val - 2.0) < 1e-9 and abs(float(_np.linalg.norm(_x)) - 1.0) < 1e-9, "With 0 steps the vector is the start (1, 1) scaled to unit length, whose Rayleigh quotient for diag(3, 1) is 2"
          assert output.strip() == "4.0 [0.5547, 0.8321]", "The program should print 4.0 [0.5547, 0.8321]"
        wrong:
          - |
            import numpy as np


            def power_iteration(A, steps):
                x = np.ones(len(A))
                for step in range(steps):
                    x = A @ x
                return float(x @ A @ x / (x @ x)), x


            print("4.0 [0.5547, 0.8321]")
          - |
            import numpy as np


            def power_iteration(A, steps):
                x = np.ones(len(A))
                x = x / np.linalg.norm(x)
                for step in range(steps):
                    y = A.T @ x
                    x = y / np.linalg.norm(y)
                return float(x @ A @ x), x


            print("4.0 [0.5547, 0.8321]")
          - |
            import numpy as np


            def power_iteration(A, steps):
                x = np.ones(len(A))
                x = x / np.linalg.norm(x)
                for step in range(steps):
                    y = A @ x
                    x = y / np.linalg.norm(y)
                return float(np.linalg.norm(A @ x)), x


            print("4.0 [0.5547, 0.8321]")
          - |
            import numpy as np


            def power_iteration(A, steps):
                x = np.ones(len(A))
                x = x / np.linalg.norm(x)
                for step in range(steps):
                    y = A @ x
                    x = y / np.linalg.norm(y)
                return float(x @ x), x


            print("4.0 [0.5547, 0.8321]")
        explanation: |
          Multiply, rescale, repeat, and read off the Rayleigh quotient at the end. The eigenvalues of this matrix are $4$ and $-1$, so the error shrinks by a factor of 4 per step, and 60 steps are far more than enough.

          The first wrong version never rescales. It returns a correct direction with an enormous length, here about $4^{60} \approx 10^{36}$. With more steps or a larger eigenvalue the entries overflow to infinity and the result is lost.

          The third wrong version uses $\|A\mathbf{x}\|$ as the estimate. That is $|\lambda_1|$, and loses the sign. For a matrix whose dominant eigenvalue is negative the vector flips sign at every step, which is harmless, and the Rayleigh quotient still reports the eigenvalue correctly.
    - question:
        id: write-pagerank
        type: code
        mode: write
        system: s2
        prompt: |
          Write `pagerank(M, alpha, steps)` for a column-stochastic link matrix `M`. Start from the uniform distribution. At each step replace `x` by `alpha * (M @ x) + (1 - alpha) / n`, where `n` is the number of pages. Return the final `x`. Do not form the dense Google matrix.
        starter: |
          import numpy as np


          def pagerank(M, alpha, steps):
              n = len(M)
              return np.ones(n) / n


          M = np.array([[0.0, 0.0, 1.0], [0.5, 0.0, 0.0], [0.5, 1.0, 0.0]])
          print([round(float(v), 4) for v in pagerank(M, 0.85, 100)])
          print([round(float(v), 4) for v in pagerank(M, 1.0, 200)])
        solution: |
          import numpy as np


          def pagerank(M, alpha, steps):
              n = len(M)
              x = np.ones(n) / n
              for step in range(steps):
                  x = alpha * (M @ x) + (1 - alpha) / n
              return x


          M = np.array([[0.0, 0.0, 1.0], [0.5, 0.0, 0.0], [0.5, 1.0, 0.0]])
          print([round(float(v), 4) for v in pagerank(M, 0.85, 100)])
          print([round(float(v), 4) for v in pagerank(M, 1.0, 200)])
