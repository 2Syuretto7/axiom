            import numpy as np


            def pagerank(M, alpha, steps):
                n = len(M)
                x = np.ones(n) / n
                for step in range(steps):
                    x = M @ x
                return x


            print("[0.3878, 0.2148, 0.3974]\n[0.4, 0.2, 0.4]")
        explanation: |
          This is power iteration on $G = \alpha M + \frac{1 - \alpha}{n}\mathbf{1}\mathbf{1}^\top$. Because the entries of $\mathbf{x}$ sum to 1, the second part of $G\mathbf{x}$ is the same number $(1 - \alpha)/n$ in every entry. So the dense matrix $G$ is never needed, only a product with the sparse $M$ and one addition. No rescaling is needed either: $G$ is column-stochastic, so the sum stays 1.

          With $\alpha = 0.85$ the ranks are $(0.388, 0.215, 0.397)$, a little flatter than the $(0.4, 0.2, 0.4)$ of the pure links. Page 3 now edges ahead of page 1, since two pages link to it.

          The third wrong version multiplies by $M^\top$. The transpose of a column-stochastic matrix sends the uniform distribution to itself, since its rows sum to 1, so that version returns equal ranks for everything and looks plausibly converged. Whether the columns or the rows of a transition matrix sum to 1 is a convention that differs between books, and it has to be checked each time.
    - question:
        id: fix-overflow
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `dominant(A, steps)` should return the dominant eigenvalue by power iteration. For this matrix it should print `4.0`. With 1000 steps it prints `nan`. Fix it, keeping 1000 steps.
        starter: |
          import numpy as np


          def dominant(A, steps):
              x = np.ones(len(A))
              for step in range(steps):
                  x = A @ x
              return float(x @ A @ x / (x @ x))


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print(round(dominant(A, 1000), 4))
        solution: |
          import numpy as np


          def dominant(A, steps):
              x = np.ones(len(A))
              for step in range(steps):
                  x = A @ x
                  x = x / np.linalg.norm(x)
              return float(x @ A @ x / (x @ x))


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print(round(dominant(A, 1000), 4))
        tests: |
          import numpy as _np
          _A = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          assert abs(dominant(_A, 1000) - 4.0) < 1e-9, "With 1000 steps the result should be 4. Without rescaling the entries grow like 4 to the power 1000, which overflows"
          assert abs(dominant(_A, 30) - 4.0) < 1e-9, "With 30 steps the result should already be 4"
          assert abs(dominant(0.001 * _A, 1000) - 0.004) < 1e-12, "For 0.001 times the matrix the dominant eigenvalue is 0.004. Without rescaling the entries shrink to zero"
          assert abs(dominant(_np.array([[1.0, 2.0], [3.0, 2.0]]), 2000) - 4.0) < 1e-9, "For [[1, 2], [3, 2]] with 2000 steps the result should be 4"
          assert abs(dominant(_np.diag([3.0, 1.0]), 0) - 2.0) < 1e-12, "With 0 steps the estimate is the Rayleigh quotient of the start (1, 1), which for diag(3, 1) is 2"
          assert output.strip() == "4.0", "The program should print 4.0"
        wrong:
          - |
            import numpy as np


            def dominant(A, steps):
                x = np.ones(len(A))
                for step in range(steps):
                    x = A @ x
                return float(x @ A @ x / (x @ x))


            print("4.0")
          - |
            import numpy as np


            def dominant(A, steps):
                x = np.ones(len(A))
                for step in range(steps):
                    x = A @ x
                x = x / np.linalg.norm(x)
                return float(x @ A @ x / (x @ x))


            print("4.0")
          - |
            import numpy as np


            def dominant(A, steps):
                x = np.ones(len(A))
                for step in range(min(steps, 100)):
                    x = A @ x
                return float(x @ A @ x / (x @ x))


            print("4.0")
          - |
            import numpy as np


            def dominant(A, steps):
                x = np.ones(len(A))
                for step in range(steps):
                    x = A @ x
                    x = x / np.linalg.norm(x)
                return float(x @ x)


            print("4.0")
        explanation: |
          Without rescaling, the vector after $k$ steps has length about $4^k$. Floating-point numbers end near $1.8 \times 10^{308}$, which $4^k$ passes at $k = 512$. From then on the entries are infinite, and infinity divided by infinity is `nan`.

          Rescaling inside the loop keeps the vector at length 1 and changes nothing else, since only the direction matters. Rescaling once after the loop is too late: the damage is done.

          The opposite failure is as real. For a matrix with dominant eigenvalue $0.004$, the unscaled vector underflows to exactly zero after about 135 steps, and the quotient becomes zero divided by zero. The third wrong version, which quietly caps the number of steps, survives the first matrix and is caught by this one.
    - question:
        id: work-steps
        type: numeric
        system: s2
        prompt: |
          A stochastic matrix has second eigenvalue of size $0.5$. How many steps of power iteration are needed to shrink the error by a factor of at least 1000?
        answer: "10"
        explanation: |
          The error shrinks by $0.5$ per step, and $0.5^{10} = 1/1024$, the first power below $1/1000$. In general the number of steps for a factor $\varepsilon$ is $\ln\varepsilon/\ln|\lambda_2/\lambda_1|$. With a second eigenvalue of $0.99$ the same accuracy needs 688 steps, and with $0.999$ about 6900. The quantity $1 - |\lambda_2|$ is called the **spectral gap**, and the number of steps is roughly proportional to its reciprocal. A chain with a small gap mixes slowly.
    - question:
        id: work-two-webs
        type: choice
        system: s2
        prompt: |
          A web consists of two groups of pages with no links between the groups. What does this do to the link matrix and to the ranking, without the random jump?
        options:
          - 'Nothing: there is still one stationary distribution.'
          - 'The eigenvalue 1 now has at least two independent eigenvectors, one stationary distribution for each group. The limit depends on how the starting readers were split between the groups, so there is no single ranking. The matrix is not primitive, and Perron-Frobenius does not promise uniqueness.'
          - 'The largest eigenvalue becomes 2.'
          - 'Power iteration overflows.'
        answer: 1
        explanation: |
          Readers can never move between the groups, so whatever share starts in a group stays there. Each group settles to its own stationary distribution, and any mixture of the two is stationary for the whole. The matrix is block diagonal, with an eigenvalue 1 from each block. This is the failure that the random jump repairs: with $\alpha < 1$ every entry of the Google matrix is positive, the top eigenvalue is simple, and the ranking is unique. The price is that the ranks now depend a little on $\alpha$.
    - question:
        id: work-spectral-norm
        type: choice
        system: s2
        prompt: |
          A layer of a network is a linear map available only as code that computes $W\mathbf{x}$ and $W^\top\mathbf{y}$, with no access to the entries of $W$. How can its spectral norm be estimated?
        options:
          - 'It cannot, without the entries.'
          - 'By power iteration on $W^\top W$: repeat $\mathbf{x} \leftarrow W^\top(W\mathbf{x})$ and rescale. The vector converges to the first right singular vector, and $\|W\mathbf{x}\|$ to $\sigma_1$.'
          - 'By adding up the outputs for random inputs.'
          - 'By taking the largest output entry for the input of all ones.'
        answer: 1
        explanation: |
          $W^\top W$ is symmetric positive semidefinite with eigenvalues $\sigma_i^2$, so its dominant eigenvector is $\mathbf{v}_1$, and power iteration converges at rate $(\sigma_2/\sigma_1)^2$. Each step costs one product with $W$ and one with $W^\top$. This is how spectral normalisation keeps the norm of every layer of a network near 1 during training, with a single such step per update. The same trick finds the largest eigenvalue of a Hessian, which sets the largest stable learning rate, from products of the Hessian with vectors alone.
  connections:
    - text: |
        The crowd settles because a click multiplies each eigen-piece of the distribution by its eigenvalue, and every eigenvalue but the top one is smaller than 1 in size. **Power iteration** is that observation as an algorithm: multiply, rescale, repeat. It converges to the dominant eigenvector at the rate $|\lambda_2/\lambda_1|$, using only matrix-vector products.

        The **Perron-Frobenius theorem** says when the answer is unique and meaningful: a positive matrix, or a primitive nonnegative one, has a real positive dominant eigenvalue, alone at the top, with a positive eigenvector. For a column-stochastic matrix that eigenvalue is 1 and the eigenvector is the stationary distribution. PageRank adds a random jump to make the matrix positive, and then iterates.

        That closes spectral theory. Eigenvalues and singular values now describe what a matrix does, how big it is, how it can be compressed, and what its powers do in the long run.

        The last task pointed at what comes next. The largest eigenvalue of a Hessian limits the learning rate, and it can be found from products of the Hessian with vectors. But the Hessian of a network's loss has more entries than could ever be stored, and even its gradient is a derivative with respect to millions of numbers at once. To get at either, derivatives have to be taken with respect to whole vectors and matrices, with rules that never write out the entries. That begins here: [[m13.derivatives-with-respect-to-vectors]].
