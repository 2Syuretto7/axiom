concept: m8.perron-frobenius-and-power-iteration
minutes: 90
claim: You can find the dominant eigenvalue and eigenvector of a matrix by power iteration, explain its convergence from the expansion in eigenvectors, give its rate as the ratio of the two largest eigenvalue sizes, say when it fails, state the Perron-Frobenius theorem for positive matrices, and apply both to a column-stochastic matrix to explain why a Markov chain forgets its starting point and how PageRank is computed.
recalls: [m8.jordan-form-and-the-matrix-exponential]
uses: [m8.operator-and-frobenius-norms, m8.eigenvalues-and-eigenvectors, m8.diagonalisation, m8.spectral-theorem, m8.quadratic-forms-and-the-rayleigh-quotient, m8.singular-value-decomposition, m8.pca-as-svd, m4.norms-and-distance, m5.matrix-vector-product, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e5.axis-operations-and-reductions, e0.functions, e0.loops]
leads: [m13.derivatives-with-respect-to-vectors]
starter: |
  # Scratch space. Three web pages. Column j says where a reader of page j goes next.
  # Start everyone on one page and follow the crowd.
  import numpy as np

  M = np.array([[0.0, 0.0, 1.0], [0.5, 0.0, 0.0], [0.5, 1.0, 0.0]])
  for start in [np.array([1.0, 0.0, 0.0]), np.array([0.0, 1.0, 0.0])]:
      x = start
      for step in range(50):
          x = M @ x
      print([round(float(v), 4) for v in x])
parts:
  recall:
    - text: |
        [[m8.jordan-form-and-the-matrix-exponential]] ended on the remark that after many applications of a matrix only the largest eigenvalue is left standing. Today that remark becomes an algorithm, and a theorem says what it finds. Three quick pulls first.
  puzzle:
    - text: |
        Three web pages. Page 1 links to pages 2 and 3. Page 2 links to page 3. Page 3 links to page 1. A reader on a page clicks one of its links at random.

        Put the habits in a matrix, with column $j$ saying where the readers of page $j$ go:

        $$M = \begin{pmatrix} 0 & 0 & 1 \\ 0.5 & 0 & 0 \\ 0.5 & 1 & 0 \end{pmatrix}.$$

        If $\mathbf{x}$ holds the share of readers on each page, $M\mathbf{x}$ holds the shares one click later. The starter puts everyone on page 1 and follows them for 50 clicks. Then it starts again with everyone on page 2.

        ```
        [0.4, 0.2, 0.4]
        [0.4, 0.2, 0.4]
        ```

        The same shares, wherever the crowd began: 40%, 20%, 40%. These are a fair measure of how important each page is, and this is in essence how web pages were first ranked.

        **Why does the crowd settle at all? Why does the starting point not matter? And could some other web of links have two different resting states, or none?**
  intuition:
    - text: |
        A resting state is a vector that one more click leaves unchanged: $M\mathbf{x} = \mathbf{x}$. That is an **eigenvector with eigenvalue 1**. The shares $(0.4, 0.2, 0.4)$ are one: check that $M$ sends them to themselves.

        Why does every start lead there? Write the starting vector as a combination of eigenvectors of $M$. Each click multiplies each piece by its eigenvalue. After $k$ clicks the pieces are multiplied by $\lambda_i^k$. For this $M$ the eigenvalues have sizes $1$, $0.71$ and $0.71$. The first piece is untouched, and the other two shrink by $0.71$ per click. After 50 clicks they are gone, and only the eigenvector for 1 is left. The starting point decided only the pieces that died.

        Nothing in that argument is special to web pages. Take **any** matrix whose largest eigenvalue, in absolute value, stands alone. Multiply any vector by it again and again. The piece along the top eigenvector outgrows all the others, and the vector turns towards it. Rescale after each step to keep the numbers in range. This is **power iteration**, and it needs nothing but matrix-vector products.

        Two things could spoil the web example. The eigenvalue 1 might have two independent eigenvectors, giving many resting states. Or another eigenvalue might also have size 1, such as $-1$, and the crowd would slosh back and forth for ever. The **Perron-Frobenius theorem** says when neither happens: for a matrix with positive entries, the largest eigenvalue is real, positive, alone at the top, and its eigenvector has all entries positive. Positivity means mixing, and mixing forgets.
  derivation:
    - text: |
        **Power iteration.** Start from a vector $\mathbf{x}_0$. Repeat

        $$\mathbf{y} = A\mathbf{x}_k, \qquad \mathbf{x}_{k+1} = \mathbf{y}/\|\mathbf{y}\|.$$

        **Why it converges.** Suppose $A$ is diagonalisable with eigenvalues ordered $|\lambda_1| > |\lambda_2| \ge \dots \ge |\lambda_n|$ and eigenvectors $\mathbf{v}_i$. Write $\mathbf{x}_0 = c_1\mathbf{v}_1 + \dots + c_n\mathbf{v}_n$. Then

        $$A^k\mathbf{x}_0 = \lambda_1^k\Big(c_1\mathbf{v}_1 + c_2\big(\tfrac{\lambda_2}{\lambda_1}\big)^k\mathbf{v}_2 + \dots + c_n\big(\tfrac{\lambda_n}{\lambda_1}\big)^k\mathbf{v}_n\Big).$$

        Every ratio $\lambda_i/\lambda_1$ has size below 1, so all terms but the first die away. The normalisation removes the factor $\lambda_1^k$. So $\mathbf{x}_k$ approaches the direction of $\mathbf{v}_1$, provided $c_1 \ne 0$.

        **The rate.** The error shrinks by the factor $|\lambda_2/\lambda_1|$ per step. A wide gap means fast convergence, and a ratio near 1 means slow.

        **The eigenvalue.** Estimate it by the Rayleigh quotient $\mathbf{x}_k^\top A\mathbf{x}_k$ of the unit vector $\mathbf{x}_k$. For symmetric $A$ its error is the **square** of the error of the vector, so it converges like $|\lambda_2/\lambda_1|^{2k}$.

        **When it fails.**

        - *A tie at the top.* If $|\lambda_1| = |\lambda_2|$ with $\lambda_1 \ne \lambda_2$, such as $1$ and $-1$ or a complex pair, the vector never settles. $\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$ just swaps the two coordinates for ever.
        - *$c_1 = 0$.* A start with no component along $\mathbf{v}_1$ converges, in exact arithmetic, to the next eigenvector. In floating point, rounding usually supplies a small component, and a random start avoids the problem.
        - *A defective top eigenvalue* converges, but only like $1/k$.

        **Cost.** One product with $A$ per step. $A$ is never changed, so it may be sparse, or available only as a function that multiplies a vector. That is why this old method is used on the largest problems.

        *The puzzle.* The eigenvalues of $M$ are $1$ and $-\tfrac12 \pm \tfrac12 i$, of size $1/\sqrt2 = 0.7071$. So the error halves every two clicks, and after 50 it is about $0.7071^{50} \approx 3 \times 10^{-8}$.
    - question:
        id: derivation-rate
        type: numeric
        system: s2
        prompt: |
          A matrix has eigenvalues $5, 2, 1$. By what factor does the error of power iteration shrink at each step?
        answer: "0.4"
        explanation: |
          The ratio $|\lambda_2/\lambda_1| = 2/5$. The component along the second eigenvector is the slowest to die, and it loses the factor $0.4$ per step relative to the first. After 10 steps the error has shrunk by $0.4^{10} \approx 10^{-4}$. Had the eigenvalues been $5$ and $4.9$, the factor would be $0.98$, and the same accuracy would need about 460 steps.
    - text: |
        **Theorem (Perron-Frobenius, for positive matrices).** Let $A$ be a square matrix with every entry positive. Then:

        1. $A$ has a positive real eigenvalue $r$ equal to its spectral radius, the **Perron root**.
        2. $r$ has an eigenvector with all entries positive, the **Perron vector**.
        3. $r$ is a simple eigenvalue: its eigenvector is unique up to scaling.
        4. Every other eigenvalue satisfies $|\lambda| < r$ strictly.
        5. No other eigenvector has all entries nonnegative.

        Points 3 and 4 are exactly what power iteration needs. So for a positive matrix it converges from every nonnegative nonzero start, to the Perron vector.

        **Nonnegative matrices.** The same five conclusions hold if $A$ has nonnegative entries and some power $A^m$ is positive. Such a matrix is called **primitive**. In terms of links: every page can be reached from every other, and the possible numbers of clicks for a round trip have no common divisor. The matrix $M$ of the puzzle has zeros, but $M^5$ is positive.

        Without that, things can fail in two ways. If the web splits into parts with no links between them, the top eigenvalue is repeated and there are many resting states. If the web is a pure cycle, other eigenvalues share the top size and the crowd rotates for ever.

        **Bounds.** For a nonnegative matrix the Perron root lies between the smallest and the largest row sum, and likewise for column sums.

        **Stochastic matrices.** A matrix is **column-stochastic** if its entries are nonnegative and every column sums to 1. Then:

        - $\mathbf{1}^\top M = \mathbf{1}^\top$, so 1 is an eigenvalue, and totals are preserved: the shares still add up to 1 after a click.
        - $\|M\|_1 = 1$, so no eigenvalue is larger than 1 in size. The Perron root is 1.
        - If $M$ is primitive, there is exactly one vector $\boldsymbol\pi$ with positive entries summing to 1 and $M\boldsymbol\pi = \boldsymbol\pi$, the **stationary distribution**, and $M^k\mathbf{x} \to \boldsymbol\pi$ for every starting distribution $\mathbf{x}$. The rate is the size of the second eigenvalue.

        A process that moves between states with fixed probabilities like this is a **Markov chain**.

        **PageRank.** A real web is neither connected nor free of cycles. The repair is to let the reader, with probability $1 - \alpha$, jump to a page chosen uniformly at random:

        $$G = \alpha M + \frac{1 - \alpha}{n}\mathbf{1}\mathbf{1}^\top.$$

        Every entry of $G$ is positive, so Perron-Frobenius applies in full. Moreover the second eigenvalue of $G$ has size at most $\alpha$, so with the usual $\alpha = 0.85$ power iteration gains a guaranteed factor $0.85$ per step whatever the web looks like. For a distribution $\mathbf{x}$ the product is $G\mathbf{x} = \alpha M\mathbf{x} + (1 - \alpha)/n$, which costs one sparse product.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that power iteration converges to the dominant eigenvector.
        steps:
          - 'Write the starting vector as a combination of the eigenvectors, $\mathbf{x}_0 = \sum_i c_i\mathbf{v}_i$.'
          - 'Apply $A$ $k$ times: each term is multiplied by $\lambda_i^k$.'
          - 'Factor out $\lambda_1^k$, leaving the ratios $(\lambda_i/\lambda_1)^k$ on the other terms.'
          - 'Since $|\lambda_i/\lambda_1| < 1$ for $i \ge 2$, those terms tend to zero.'
          - 'After normalising, what remains is the direction of $\mathbf{v}_1$, provided $c_1 \ne 0$.'
        explanation: Repeated multiplication is a race between eigen-directions, and the largest eigenvalue wins it.
  formal:
    - text: |
        **Power iteration.** $\mathbf{x}_{k+1} = A\mathbf{x}_k/\|A\mathbf{x}_k\|$. If $|\lambda_1| > |\lambda_2|$ and $\mathbf{x}_0$ has a component along $\mathbf{v}_1$, the angle to $\mathbf{v}_1$ satisfies $\tan\theta_k = O(|\lambda_2/\lambda_1|^k)$. For symmetric $A$, $|\mathbf{x}_k^\top A\mathbf{x}_k - \lambda_1| = O(|\lambda_2/\lambda_1|^{2k})$.

        **Variants.** *Inverse iteration* applies $(A - \mu I)^{-1}$ and converges to the eigenvector whose eigenvalue is nearest to $\mu$, at rate $|\lambda_{\text{nearest}} - \mu|/|\lambda_{\text{next}} - \mu|$. *Rayleigh quotient iteration* updates $\mu$ to the current Rayleigh quotient and converges cubically for symmetric $A$. *Subspace iteration* applies $A$ to $k$ vectors and re-orthonormalises them by QR.

        **Singular values.** Power iteration on $A^\top A$, as $\mathbf{x} \mapsto A^\top(A\mathbf{x})$, gives $\mathbf{v}_1$ and $\sigma_1^2$, at rate $(\sigma_2/\sigma_1)^2$.

        **Perron-Frobenius.** For $A > 0$ entrywise: $\rho(A)$ is a simple eigenvalue with a positive eigenvector, $|\lambda| < \rho(A)$ for all other eigenvalues, and

        $$\lim_{k \to \infty}\frac{A^k}{\rho(A)^k} = \mathbf{v}\mathbf{w}^\top, \qquad A\mathbf{v} = \rho\mathbf{v},\ \ \mathbf{w}^\top A = \rho\mathbf{w}^\top,\ \ \mathbf{w}^\top\mathbf{v} = 1,$$

        with $\mathbf{v}, \mathbf{w} > 0$. The same holds for $A \ge 0$ primitive. For $A \ge 0$ irreducible: $\rho(A)$ is a simple eigenvalue with a positive eigenvector, but there may be $h > 1$ eigenvalues of modulus $\rho$, the $h$th roots of unity times $\rho$, where $h$ is the period.

        **Collatz-Wielandt.** For $A \ge 0$ and any $\mathbf{x} > 0$: $\min_i\frac{(A\mathbf{x})_i}{x_i} \le \rho(A) \le \max_i\frac{(A\mathbf{x})_i}{x_i}$. With $\mathbf{x} = \mathbf{1}$ these are the row-sum bounds.

        **Stochastic matrices.** $M \ge 0$, $\mathbf{1}^\top M = \mathbf{1}^\top$ $\Rightarrow$ $\rho(M) = 1$. $M$ primitive $\Rightarrow$ unique stationary $\boldsymbol\pi > 0$ and $\|M^k\mathbf{x} - \boldsymbol\pi\|_1 \le C|\lambda_2|^k$.

        **Google matrix.** $G = \alpha M + (1 - \alpha)\mathbf{u}\mathbf{1}^\top$ with $\mathbf{u}$ a distribution: eigenvalues $1, \alpha\lambda_2(M), \dots, \alpha\lambda_n(M)$.
