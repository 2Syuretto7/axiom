          This is the function `power_in_basis` from the lesson on similarity, with the missing ingredient supplied: the basis in which the map is diagonal is the basis of eigenvectors.
    - question:
        id: fix-columns
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `steady_state(A)` should return the eigenvector of the largest eigenvalue, scaled so that its entries add up to 1. For the migration matrix that is $(\tfrac23, \tfrac13)$. It prints something else. Fix it.
        starter: |
          import numpy as np


          def steady_state(A):
              values, vectors = np.linalg.eig(A)
              i = int(np.argmax(values.real))
              v = vectors[i].real
              return v / v.sum()


          A = np.array([[0.9, 0.2], [0.1, 0.8]])
          print([round(float(c), 4) for c in steady_state(A)])
        solution: |
          import numpy as np


          def steady_state(A):
              values, vectors = np.linalg.eig(A)
              i = int(np.argmax(values.real))
              v = vectors[:, i].real
              return v / v.sum()


          A = np.array([[0.9, 0.2], [0.1, 0.8]])
          print([round(float(c), 4) for c in steady_state(A)])
        tests: |
          import numpy as _np
          _A = _np.array([[0.9, 0.2], [0.1, 0.8]])
          _s = steady_state(_A)
          assert _np.shape(_s) == (2,), "The steady state has one share for each place"
          assert _np.allclose(_s, [2 / 3, 1 / 3]), "The eigenvector for eigenvalue 1 is a multiple of (2, 1), which scaled to sum 1 is (2/3, 1/3). The eigenvectors are the columns of the matrix that eig returns"
          assert _np.allclose(_A @ _s, _s), "The steady state should not move when the matrix is applied"
          _B = _np.array([[0.5, 0.25, 0.0], [0.5, 0.5, 0.5], [0.0, 0.25, 0.5]])
          _t = steady_state(_B)
          assert _np.allclose(_t, [0.25, 0.5, 0.25]), "For the three-state chain the steady state is (0.25, 0.5, 0.25)"
          _C = _np.array([[0.2, 0.7], [0.8, 0.3]])
          assert _np.allclose(steady_state(_C), [7 / 15, 8 / 15]), "For [[0.2, 0.7], [0.8, 0.3]] the steady state is (7/15, 8/15)"
          assert output.strip() == "[0.6667, 0.3333]", "The program should print [0.6667, 0.3333]"
        wrong:
          - |
            import numpy as np


            def steady_state(A):
                values, vectors = np.linalg.eig(A)
                i = int(np.argmax(values.real))
                v = vectors[i].real
                return v / v.sum()


            print("[0.6667, 0.3333]")
          - |
            import numpy as np


            def steady_state(A):
                values, vectors = np.linalg.eig(A)
                i = int(np.argmin(values.real))
                v = vectors[:, i].real
                return v / v.sum()


            print("[0.6667, 0.3333]")
          - |
            import numpy as np


            def steady_state(A):
                values, vectors = np.linalg.eig(A)
                i = int(np.argmax(values.real))
                v = vectors[:, i].real
                return v


            print("[0.6667, 0.3333]")
          - |
            import numpy as np


            def steady_state(A):
                values, vectors = np.linalg.eig(A.T)
                i = int(np.argmax(values.real))
                v = vectors[:, i].real
                return v / v.sum()


            print("[0.6667, 0.3333]")
        explanation: |
          `np.linalg.eig` returns the eigenvectors as the **columns** of its second result, so that `A @ vectors` equals `vectors * values`. `vectors[i]` is row `i`, which mixes one entry from each eigenvector and is an eigenvector of nothing.

          Two further habits are in the function. NumPy promises no order for the eigenvalues, so the wanted one is located with `argmax` and never assumed to be first. And an eigenvector is only determined up to scale, and NumPy returns one of length 1, possibly with negative entries. Dividing by the sum fixes the scale that this problem cares about.

          The steady state of a process that reshuffles a population each step is an eigenvector for eigenvalue 1. The last lesson of the cluster shows why such a process always has one, and why iterating finds it.
    - question:
        id: work-rotation
        type: choice
        system: s2
        prompt: |
          Why does a rotation of the plane by $40°$ have no real eigenvector, while every rotation of three-dimensional space about an axis has one?
        options:
          - 'Rotations never have eigenvectors in any dimension.'
          - 'In the plane every nonzero vector is turned by $40°$, so none is sent to a multiple of itself. In space the vectors along the axis are not moved at all: they are eigenvectors with eigenvalue 1.'
          - 'Because $3 \times 3$ matrices are always symmetric.'
          - 'The plane rotation has the eigenvalue $\cos 40°$.'
        answer: 1
        explanation: |
          The axis of a rotation in space is its eigenspace for the eigenvalue 1, and finding the axis of a given rotation matrix means solving $(R - I)\mathbf{v} = \mathbf{0}$. In the plane the eigenvalues of a rotation by $\theta$ are the complex numbers $\cos\theta \pm i\sin\theta$, of absolute value 1, which records that lengths are preserved while no real direction is. Real eigenvectors appear only for $\theta = 0$ and a half turn.
    - question:
        id: work-gradient-descent
        type: numeric
        system: s2
        prompt: |
          Gradient descent on a quadratic loss moves the error $\mathbf{e}$ by $\mathbf{e} \mapsto (I - \eta H)\mathbf{e}$ each step. $H$ has an eigenvector with eigenvalue 4, and the step size is $\eta = 0.1$. By what factor is the component of the error along that eigenvector multiplied at each step?
        answer: "0.6"
        explanation: |
          If $H\mathbf{v} = 4\mathbf{v}$ then $(I - 0.1H)\mathbf{v} = (1 - 0.4)\mathbf{v}$. Along an eigenvector with eigenvalue $0.1$ the factor would be $0.99$: that component barely shrinks. And with eigenvalue 25 the factor is $-1.5$, so that component grows and the method diverges. Each eigen-direction of $H$ converges at its own rate, set by its eigenvalue. That one calculation is behind the choice of step sizes, the trouble with ill-conditioned losses, and most of what optimisers do about it.
    - question:
        id: work-independent
        type: choice
        system: s2
        prompt: |
          A $3 \times 3$ matrix is claimed to have the four different eigenvalues $1, 2, 3, 4$. Why is that impossible?
        options:
          - 'Eigenvalues of a $3 \times 3$ matrix must add up to 3.'
          - 'Eigenvectors for different eigenvalues are linearly independent, so four different eigenvalues would give four independent vectors in a space of dimension 3.'
          - 'Because the eigenvalues must be at most 3.'
          - 'It is possible.'
        answer: 1
        explanation: |
          Independence caps the number of distinct eigenvalues at the dimension. When the cap is reached, the $n$ eigenvectors are $n$ independent vectors in dimension $n$ and so a basis, and the map is diagonal in it. When there are fewer distinct eigenvalues, a basis of eigenvectors may or may not exist, as the scaling by 3 and the shear show: each has a single eigenvalue, and the first has plenty of eigenvectors while the second has too few.
  connections:
    - text: |
        Fifty years of migration forgot the starting point because the starting vector was a combination of two **eigenvectors**, directions the map only scales. The part along $(2, 1)$, with **eigenvalue** 1, stayed. The part along $(1, -1)$, with eigenvalue $0.7$, was multiplied by $0.7$ fifty times and vanished.

        The eigenvectors for $\lambda$ are the nonzero vectors of $\ker(A - \lambda I)$. On an eigenvector, powers, shifts and inverses of the matrix act as the same operations on the eigenvalue. Eigenvectors for different eigenvalues are independent, so there are at most $n$ eigenvalues. Some real matrices have none over the reals, and every matrix has one over the complex numbers.

        Throughout this lesson the eigenvalues were handed over or were visible in the geometry. For a matrix met without warning, they have to be found. The condition is that $A - \lambda I$ fails to be invertible, and the determinant turns that condition into a polynomial equation in $\lambda$, whose roots are the eigenvalues and whose coefficients include two old friends, the trace and the determinant: [[m8.characteristic-polynomial]].
