concept: m8.diagonalisation
minutes: 85
claim: You can say when a matrix is diagonalisable, write the factorisation A = P D P inverse from its eigenvalues and eigenvectors and read it as a change of basis, use it to compute powers and other functions of a matrix, decide diagonalisability by comparing geometric and algebraic multiplicities, and give examples of matrices that are not diagonalisable, or only over the complex numbers.
recalls: [m8.characteristic-polynomial]
uses: [m8.eigenvalues-and-eigenvectors, m6.matrix-of-a-linear-map-and-similarity, m6.subspaces-sums-and-direct-sums, m5.change-of-basis, m5.identity-and-inverse, m5.rank, m1.complex-numbers, e5.linear-algebra-routines, e5.einsum, e0.functions, e0.loops]
leads: [m8.spectral-theorem, m8.jordan-form-and-the-matrix-exponential, m8.perron-frobenius-and-power-iteration, m8.singular-value-decomposition]
starter: |
  # Scratch space. The migration matrix, raised to the hundredth power
  # without a hundred multiplications.
  import numpy as np

  A = np.array([[0.9, 0.2], [0.1, 0.8]])
  values, P = np.linalg.eig(A)
  D100 = np.diag(values ** 100)
  A100 = (P @ D100 @ np.linalg.inv(P)).real
  print([[round(float(c), 4) for c in row] for row in A100])
parts:
  recall:
    - text: |
        [[m8.characteristic-polynomial]] counted eigenvalues, and warned that a repeated eigenvalue may have too few eigenvectors. Today is about the good case, in which the eigenvectors fill out a basis. Three quick pulls first.
  puzzle:
    - text: |
        The starter computes the hundredth power of the migration matrix $A = \begin{pmatrix} 0.9 & 0.2 \\ 0.1 & 0.8 \end{pmatrix}$ with three matrix products and no loop.

        ```
        [[0.6667, 0.6667], [0.3333, 0.3333]]
        ```

        Both columns are the steady state $(\tfrac23, \tfrac13)$. That makes sense: column $j$ of $A^{100}$ is where the $j$th starting point ends up after a hundred years, and every start ends up there.

        But look at how it was computed. The code took the eigenvalues, raised **those** to the hundredth power, and wrapped the result between a matrix `P` and its inverse.

        **Why is the hundredth power of a matrix the hundredth power of its eigenvalues, wrapped in the same two matrices? And does this work for every matrix?**
  intuition:
    - text: |
        In the lesson on similarity, a reflection became $\operatorname{diag}(1, -1)$ in a well-chosen basis, and a map described in a basis whose columns are in $P$ has the matrix $P^{-1}AP$.

        Choose the basis to consist of eigenvectors. The map sends the first basis vector to $\lambda_1$ times itself, so the first column of the new matrix is $(\lambda_1, 0, \dots, 0)$. Likewise for the others. The new matrix is diagonal, with the eigenvalues on the diagonal:

        $$P^{-1}AP = D, \qquad\text{that is}\qquad A = PDP^{-1}.$$

        Read $A = PDP^{-1}$ from right to left. $P^{-1}$ translates a vector into eigenvector coordinates. $D$ scales each coordinate by its eigenvalue. $P$ translates back. Every diagonalisable map is a scaling along some axes, which need not be perpendicular. All the complication of the matrix $A$ lives in the choice of axes.

        Apply $A$ twice: $PDP^{-1}PDP^{-1} = PD^2P^{-1}$. The inner $P^{-1}P$ cancels. A hundred times: $PD^{100}P^{-1}$, and a power of a diagonal matrix is the powers of its entries.

        It works exactly when there **is** a basis of eigenvectors. A shear does not have one. So not every matrix can be diagonalised, and the question of the lesson is which ones can.
  derivation:
    - text: |
        **Definition.** A square matrix $A$ is **diagonalisable** if it is similar to a diagonal matrix: $A = PDP^{-1}$ with $P$ invertible and $D$ diagonal.

        **Theorem.** $A$ is diagonalisable if and only if there is a basis consisting of eigenvectors of $A$. In that case the columns of $P$ are those eigenvectors and the diagonal entries of $D$ are their eigenvalues, in the same order.

        *Proof.* $A = PDP^{-1}$ is the same as $AP = PD$ with $P$ invertible. Column $j$ of $AP$ is $A\mathbf{p}_j$. Column $j$ of $PD$ is $d_j\mathbf{p}_j$. So $AP = PD$ says precisely that each column of $P$ is an eigenvector with eigenvalue $d_j$, and $P$ is invertible exactly when its columns form a basis. $\blacksquare$

        *Example.* $A = \begin{pmatrix} 4 & 1 \\ 2 & 3 \end{pmatrix}$ has eigenvalues 2 and 5, with eigenvectors $(1, -2)$ and $(1, 1)$.

        $$P = \begin{pmatrix} 1 & 1 \\ -2 & 1 \end{pmatrix}, \qquad D = \begin{pmatrix} 2 & 0 \\ 0 & 5 \end{pmatrix}, \qquad P^{-1} = \tfrac13\begin{pmatrix} 1 & -1 \\ 2 & 1 \end{pmatrix}.$$

        The factorisation is not unique. The eigenvectors can be rescaled, and they can be listed in another order, provided $D$ is reordered to match.

        **When is there a basis of eigenvectors?**

        1. *If the $n$ eigenvalues are all different.* Eigenvectors for different eigenvalues are independent, so $n$ of them form a basis. This is sufficient and not necessary: the identity has one eigenvalue and is already diagonal.
        2. *In general:* exactly when the geometric multiplicities add up to $n$. Since each is at most the algebraic multiplicity, and those add up to $n$ over $\mathbb{C}$, this means **every eigenvalue has geometric multiplicity equal to its algebraic multiplicity**.

        *Not diagonalisable:* $J = \begin{pmatrix} 3 & 1 \\ 0 & 3 \end{pmatrix}$. The eigenvalue 3 has algebraic multiplicity 2 and a one-dimensional eigenspace. Such matrices are called **defective**.

        *Diagonalisable over $\mathbb{C}$ only:* the quarter turn $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$ has the distinct eigenvalues $\pm i$, so it is diagonalisable with complex $P$ and $D$, and has no real eigenvector at all.
    - question:
        id: derivation-trace-power
        type: numeric
        system: s2
        prompt: |
          A $2 \times 2$ matrix $A$ is diagonalisable with eigenvalues 2 and $-1$. What is the trace of $A^5$?
        answer: "31"
        explanation: |
          $A^5 = PD^5P^{-1}$ is similar to $D^5 = \operatorname{diag}(32, -1)$, and similar matrices have the same trace: $32 - 1 = 31$. No entry of $A$ was needed. In the same way $\det(A^5) = 32 \cdot (-1) = -32$. Whatever is invariant under similarity can be computed on the diagonal matrix.
    - text: |
        **Powers and functions.** For diagonalisable $A = PDP^{-1}$,

        $$A^k = PD^kP^{-1}, \qquad A^{-1} = PD^{-1}P^{-1} \text{ (if no eigenvalue is 0)},$$

        and for any polynomial $q$, $q(A) = P\,q(D)\,P^{-1}$, where $q(D)$ applies $q$ to each diagonal entry. This suggests a definition for other functions $f$:

        $$f(A) = P\begin{pmatrix} f(\lambda_1) & & \\ & \ddots & \\ & & f(\lambda_n) \end{pmatrix}P^{-1}.$$

        With $f(x) = \sqrt{x}$ this gives a matrix whose square is $A$. With $f(x) = e^x$ it gives the matrix exponential, which solves systems of linear differential equations.

        **Long-run behaviour.** $A^k = PD^kP^{-1}$ shows at a glance what powers do.

        - If every $|\lambda_i| < 1$, then $D^k \to 0$ and so $A^k \to 0$.
        - If some $|\lambda_i| > 1$, the powers grow without bound in that eigen-direction.
        - If one eigenvalue is 1 and the rest are smaller in absolute value, $D^k \to \operatorname{diag}(1, 0, \dots, 0)$ and $A^k$ tends to a matrix of rank 1. That is the puzzle.

        The largest $|\lambda_i|$ is called the **spectral radius** of $A$. It decides whether iterating $\mathbf{x} \mapsto A\mathbf{x}$ is stable.

        **Decoupling.** Put $\mathbf{y} = P^{-1}\mathbf{x}$. The system $\mathbf{x}_{k+1} = A\mathbf{x}_k$ becomes $\mathbf{y}_{k+1} = D\mathbf{y}_k$: $n$ separate one-dimensional recurrences, each solved by $y_i(k) = \lambda_i^k y_i(0)$. Coordinates that were tangled in the original basis do not interact in the eigenvector basis.

        **How common is the bad case?** A matrix with $n$ distinct eigenvalues is diagonalisable over $\mathbb{C}$, and a repeated root of the characteristic polynomial is a coincidence that the slightest change of an entry destroys. So almost every matrix is diagonalisable over $\mathbb{C}$. But matrices that are close to defective behave badly in computation: their $P$ is close to singular, with a large condition number, and $PD^kP^{-1}$ then loses accuracy.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the proof that A = P D P inverse, with P invertible and D diagonal, means the columns of P are a basis of eigenvectors.
        steps:
          - 'Multiply $A = PDP^{-1}$ on the right by $P$ to get $AP = PD$.'
          - 'Column $j$ of $AP$ is $A$ applied to column $j$ of $P$.'
          - 'Column $j$ of $PD$ is column $j$ of $P$ multiplied by the $j$th diagonal entry of $D$.'
          - 'So each column of $P$ is an eigenvector, with that diagonal entry as its eigenvalue.'
          - '$P$ is invertible, so its $n$ columns are independent and form a basis.'
        explanation: The equation AP = PD, read one column at a time, is n copies of the eigenvector equation.
  formal:
    - text: |
        Let $A$ be an $n \times n$ matrix over $F$ ($\mathbb{R}$ or $\mathbb{C}$).

        **Diagonalisable.** $A = PDP^{-1}$ for some invertible $P$ and diagonal $D$ over $F$. Equivalently: $F^n$ has a basis of eigenvectors of $A$; equivalently: $F^n = E_{\lambda_1} \oplus \dots \oplus E_{\lambda_r}$ for the distinct eigenvalues $\lambda_i$.

        **Criterion.** $A$ is diagonalisable over $F$ if and only if $p_A$ splits into linear factors over $F$ and $g(\lambda) = a(\lambda)$ for every eigenvalue.

        **Sufficient condition.** $n$ distinct eigenvalues in $F$.

        **Functional calculus.** For diagonalisable $A = PDP^{-1}$ and a function $f$ defined on the eigenvalues, $f(A) = P f(D) P^{-1}$ does not depend on the choice of $P$. It satisfies $(fg)(A) = f(A)g(A)$, and agrees with the usual meaning when $f$ is a polynomial or $f(x) = 1/x$.

        **Spectral radius.** $\rho(A) = \max_i |\lambda_i|$. $A^k \to 0$ if and only if $\rho(A) < 1$. (True for all square matrices, not only diagonalisable ones.)

        **Left eigenvectors.** The rows of $P^{-1}$ satisfy $\mathbf{r}_i A = \lambda_i\mathbf{r}_i$. They are the dual basis of the eigenvector basis, and $A = \sum_i \lambda_i\,\mathbf{p}_i\mathbf{r}_i$.

        **Commuting matrices.** Two diagonalisable matrices can be diagonalised by the same $P$ if and only if they commute.

        **Density.** Over $\mathbb{C}$, every matrix is a limit of diagonalisable matrices.
