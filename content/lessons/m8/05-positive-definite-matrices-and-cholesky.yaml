    - question:
        id: predict-cholesky
        type: predict
        system: s1
        prompt: A Cholesky factor, and two things done with it. What does this show?
        code: |
          import numpy as np

          A = np.array([[4.0, 2.0, 2.0], [2.0, 5.0, 3.0], [2.0, 3.0, 6.0]])
          L = np.linalg.cholesky(A)
          print([[round(float(c), 4) for c in row] for row in L])
          print(np.allclose(L @ L.T, A), round(float(L[0, 0] * L[1, 1] * L[2, 2]) ** 2, 4), round(float(np.linalg.det(A)), 4))
        output: |
          [[2.0, 0.0, 0.0], [1.0, 2.0, 0.0], [1.0, 1.0, 2.0]]
          True 64.0 64.0
        explanation: L is lower triangular with positive diagonal, L times its transpose rebuilds A, and the determinant of A is the square of the product of the diagonal of L.
    - question:
        id: predict-not-definite
        type: predict
        system: s1
        prompt: A symmetric matrix with positive entries. What does this show?
        code: |
          import numpy as np

          A = np.array([[1.0, 2.0], [2.0, 1.0]])
          x = np.array([1.0, -1.0])
          print(float(x @ A @ x))
          print([round(float(v), 4) for v in np.linalg.eigvalsh(A)])
        output: |
          -2.0
          [-1.0, 3.0]
        explanation: The quadratic form is negative at (1, -1), which is the eigenvector of the eigenvalue -1. Positive entries do not make a matrix positive definite.
  work:
    - text: Slower now. The first task is the algorithm itself.
    - question:
        id: write-cholesky
        type: code
        mode: write
        system: s2
        prompt: |
          Write `cholesky(A)` without calling NumPy's. For each column $j$ from left to right:

          $$l_{jj} = \sqrt{a_{jj} - \sum_{k<j} l_{jk}^2}, \qquad l_{ij} = \frac{a_{ij} - \sum_{k<j} l_{ik}l_{jk}}{l_{jj}} \quad (i > j).$$

          Return the lower triangular array `L`. If the number under a square root is not positive, return `None`.
        starter: |
          import numpy as np


          def cholesky(A):
              return np.zeros((len(A), len(A)))


          L = cholesky(np.array([[4.0, 2.0, 2.0], [2.0, 5.0, 3.0], [2.0, 3.0, 6.0]]))
          print(L.tolist())
          print(cholesky(np.array([[1.0, 2.0], [2.0, 1.0]])))
        solution: |
          import numpy as np


          def cholesky(A):
              n = len(A)
              L = np.zeros((n, n))
              for j in range(n):
                  d = A[j, j] - (L[j, :j] ** 2).sum()
                  if d <= 0:
                      return None
                  L[j, j] = d ** 0.5
                  for i in range(j + 1, n):
                      L[i, j] = (A[i, j] - (L[i, :j] * L[j, :j]).sum()) / L[j, j]
              return L


          L = cholesky(np.array([[4.0, 2.0, 2.0], [2.0, 5.0, 3.0], [2.0, 3.0, 6.0]]))
          print(L.tolist())
          print(cholesky(np.array([[1.0, 2.0], [2.0, 1.0]])))
        tests: |
          import numpy as _np
          _A = _np.array([[4.0, 2.0, 2.0], [2.0, 5.0, 3.0], [2.0, 3.0, 6.0]])
          _L = cholesky(_A)
          assert _L is not None and _np.shape(_L) == (3, 3), "For a positive definite 3 by 3 matrix the result is a 3 by 3 array"
          assert _np.allclose(_L, [[2.0, 0.0, 0.0], [1.0, 2.0, 0.0], [1.0, 1.0, 2.0]]), "The factor has rows (2, 0, 0), (1, 2, 0), (1, 1, 2)"
          assert _np.allclose(cholesky(_np.array([[4.0, 2.0], [2.0, 3.0]])), [[2.0, 0.0], [1.0, 2 ** 0.5]]), "For [[4, 2], [2, 3]] the factor is [[2, 0], [1, sqrt 2]]"
          assert cholesky(_np.array([[1.0, 2.0], [2.0, 1.0]])) is None, "[[1, 2], [2, 1]] is not positive definite: the second step asks for the square root of 1 - 4"
          assert cholesky(_np.array([[1.0, 1.0], [1.0, 1.0]])) is None, "[[1, 1], [1, 1]] is only semidefinite: the second step asks for the square root of 0, which is not positive"
          assert cholesky(_np.array([[-1.0, 0.0], [0.0, 2.0]])) is None, "A negative first diagonal entry fails at once"
          _M = _np.random.default_rng(0).normal(size=(5, 5)); _S = _M.T @ _M + _np.eye(5)
          _F = cholesky(_S)
          assert _F is not None and _np.allclose(_F @ _F.T, _S) and _np.allclose(_F, _np.linalg.cholesky(_S)), "For a random positive definite matrix L times its transpose should rebuild it, and L should agree with NumPy's factor"
          assert output.strip() == "[[2.0, 0.0, 0.0], [1.0, 2.0, 0.0], [1.0, 1.0, 2.0]]\nNone", "The program should print the factor and then None"
        wrong:
          - |
