concept: m8.positive-definite-matrices-and-cholesky
minutes: 90
claim: You can define positive definite and positive semidefinite matrices, test for them through eigenvalues, through a factorisation B transpose B and through leading determinants, explain why Gram and covariance matrices are positive semidefinite, compute the Cholesky factorisation of a small matrix by hand, and use it to solve systems, to test definiteness and to generate samples with a given covariance.
recalls: [m8.spectral-theorem]
uses: [m8.eigenvalues-and-eigenvectors, m8.diagonalisation, m6.inner-product-spaces, m6.adjoints-orthogonal-and-unitary-maps, m7.least-squares-and-the-normal-equations, m7.conditioning, m5.determinant, m5.elimination-and-linear-systems, m5.transpose, m5.rank, e5.linear-algebra-routines, e5.random-number-generation, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m8.quadratic-forms-and-the-rayleigh-quotient, m8.singular-value-decomposition, m8.pca-as-svd, m8.courant-fischer-min-max-theorem]
starter: |
  # Scratch space. z holds 200000 pairs of independent standard normal numbers.
  # Multiply each pair by L, a "square root" of C. What is the covariance of the result?
  import numpy as np

  C = np.array([[4.0, 2.0], [2.0, 3.0]])
  L = np.linalg.cholesky(C)
  z = np.random.default_rng(0).normal(size=(2, 200000))
  x = L @ z
  print([[round(float(c), 4) for c in row] for row in L])
  print([[round(float(c), 1) for c in row] for row in x @ x.T / 200000])
parts:
  recall:
    - text: |
        [[m8.spectral-theorem]] showed that a symmetric matrix stretches space along perpendicular axes by real factors. Today is about the symmetric matrices whose factors are all positive. Three quick pulls first.
  puzzle:
    - text: |
        A simulation needs random pairs of numbers that are **correlated** in a prescribed way: variance 4 for the first, variance 3 for the second, covariance 2 between them. In a table,

        $$C = \begin{pmatrix} 4 & 2 \\ 2 & 3 \end{pmatrix}.$$

        A random number generator supplies only independent numbers, each of variance 1. The starter multiplies independent pairs by a triangular matrix $L$ and measures the covariance of what comes out.

        ```
        [[2.0, 0.0], [1.0, 1.4142]]
        [[4.0, 2.0], [2.0, 3.0]]
        ```

        It worked. The matrix $L$ satisfies $LL^\top = C$, so it is a kind of square root of $C$.

        Now try to do the same for $C' = \begin{pmatrix} 1 & 2 \\ 2 & 1 \end{pmatrix}$, and NumPy refuses with an error. This table is symmetric, with positive entries, and no pair of random quantities has it as covariance.

        **Which symmetric matrices have a square root of this kind? And how is $L$ found?**
  intuition:
    - text: |
        A variance cannot be negative. If $\mathbf{x}$ is a random pair with covariance matrix $C$, then the combination $a_1x_1 + a_2x_2$ is a random number, and its variance works out to be $\mathbf{a}^\top C\mathbf{a}$. So a covariance matrix must satisfy

        $$\mathbf{a}^\top C\mathbf{a} \ge 0 \quad\text{for every } \mathbf{a}.$$

        For $C'$ and $\mathbf{a} = (1, -1)$: $\mathbf{a}^\top C'\mathbf{a} = 1 - 2 - 2 + 1 = -2$. A variance of $-2$. That is why $C'$ is impossible.

        A symmetric matrix with $\mathbf{x}^\top A\mathbf{x} > 0$ for every nonzero $\mathbf{x}$ is called **positive definite**. By the spectral theorem, in the coordinates $y_i$ along the eigenvectors, $\mathbf{x}^\top A\mathbf{x} = \lambda_1y_1^2 + \dots + \lambda_ny_n^2$. That is positive for all nonzero $\mathbf{y}$ exactly when every $\lambda_i$ is positive. So positive definite means: symmetric, with all eigenvalues positive. These are the symmetric matrices that behave like positive numbers.

        A positive number has a square root. A positive definite matrix has a factorisation $A = LL^\top$ with $L$ lower triangular, the **Cholesky factorisation**, and it is found by a short elimination with no eigenvalues involved. The picture to keep is a bowl: the surface $z = \mathbf{x}^\top A\mathbf{x}$ over the plane curves upward in every direction, with a single lowest point at the origin.
  derivation:
    - text: |
        **Definitions.** A real symmetric matrix $A$ is

        - **positive definite** if $\mathbf{x}^\top A\mathbf{x} > 0$ for all $\mathbf{x} \ne \mathbf{0}$,
        - **positive semidefinite** if $\mathbf{x}^\top A\mathbf{x} \ge 0$ for all $\mathbf{x}$,
        - **indefinite** if $\mathbf{x}^\top A\mathbf{x}$ takes both signs.

        Negative definite and semidefinite are defined with the inequalities reversed.

        **Three equivalent tests.** For symmetric $A$ the following are equivalent.

        1. $A$ is positive definite.
        2. All eigenvalues of $A$ are positive.
        3. $A = B^\top B$ for some matrix $B$ with independent columns.

        *(1) ⇔ (2)* was shown in the intuition. *(3) ⇒ (1):* $\mathbf{x}^\top B^\top B\mathbf{x} = \|B\mathbf{x}\|^2 \ge 0$, and it is zero only if $B\mathbf{x} = \mathbf{0}$, which for independent columns means $\mathbf{x} = \mathbf{0}$. *(2) ⇒ (3):* take $B = \sqrt{\Lambda}\,Q^\top$ from $A = Q\Lambda Q^\top$.

        For **semidefinite**: eigenvalues $\ge 0$, and $A = B^\top B$ for any $B$ at all.

        So every Gram matrix $A^\top A$ is positive semidefinite, and it is positive definite exactly when the columns of $A$ are independent. That is the condition under which the normal equations have a unique solution. And a covariance matrix is an average of matrices $\mathbf{x}\mathbf{x}^\top$, each positive semidefinite, so it is positive semidefinite.

        **Quick consequences.** If $A$ is positive definite then: its diagonal entries are positive (take $\mathbf{x} = \mathbf{e}_i$); its determinant is positive (product of the eigenvalues); it is invertible and $A^{-1}$ is positive definite (eigenvalues $1/\lambda_i$); and $A + B$ is positive definite for positive semidefinite $B$. None of these is sufficient on its own: $C'$ has positive entries, and $\begin{pmatrix} -1 & 0 \\ 0 & -1 \end{pmatrix}$ has positive determinant.

        **Sylvester's criterion.** A symmetric matrix is positive definite if and only if its $n$ **leading principal minors**, the determinants of the top-left $1 \times 1$, $2 \times 2$, ..., $n \times n$ corners, are all positive. For $C$: $4 > 0$ and $12 - 4 = 8 > 0$. For $C'$: $1 > 0$ but $1 - 4 = -3 < 0$.
    - question:
        id: derivation-quadratic
        type: numeric
        system: s2
        prompt: |
          For $A = \begin{pmatrix} 2 & -1 \\ -1 & 2 \end{pmatrix}$ and $\mathbf{x} = (1, 1)$, what is $\mathbf{x}^\top A\mathbf{x}$?
        answer: "2"
        explanation: |
          $A\mathbf{x} = (1, 1)$ and $\mathbf{x} \cdot (1, 1) = 2$. Expanded, $\mathbf{x}^\top A\mathbf{x} = 2x_1^2 - 2x_1x_2 + 2x_2^2 = x_1^2 + x_2^2 + (x_1 - x_2)^2$, a sum of squares that vanishes only at the origin, so $A$ is positive definite. Its eigenvalues are 1 and 3, both positive, and its leading minors are 2 and 3. All three tests agree, as they must.
    - text: |
        **The Cholesky factorisation.** Every positive definite $A$ can be written in exactly one way as

        $$A = LL^\top$$

        with $L$ lower triangular and positive diagonal entries.

        *By hand, $2 \times 2$.* Write $L = \begin{pmatrix} a & 0 \\ b & c \end{pmatrix}$. Then

        $$LL^\top = \begin{pmatrix} a^2 & ab \\ ab & b^2 + c^2 \end{pmatrix}.$$

        Match with $C = \begin{pmatrix} 4 & 2 \\ 2 & 3 \end{pmatrix}$: $a = \sqrt4 = 2$, then $b = 2/a = 1$, then $c = \sqrt{3 - b^2} = \sqrt2$. That is the $L$ the starter printed.

        *In general,* column by column, for $j = 1, \dots, n$:

        $$l_{jj} = \sqrt{a_{jj} - \sum_{k<j} l_{jk}^2}, \qquad l_{ij} = \frac{1}{l_{jj}}\left(a_{ij} - \sum_{k<j} l_{ik}l_{jk}\right) \text{ for } i > j.$$

        Each entry is found from entries already computed. The number under the square root is positive at every step exactly when $A$ is positive definite. So **running Cholesky is itself the test**: if a square root of a number that is not positive is called for, the matrix is not positive definite. That is the error NumPy raised for $C'$: $c = \sqrt{1 - 4}$.

        **Why it is used.**

        - *Solving $A\mathbf{x} = \mathbf{b}$.* Solve $L\mathbf{y} = \mathbf{b}$ by forward substitution and $L^\top\mathbf{x} = \mathbf{y}$ by back substitution. Cholesky costs about half of ordinary elimination, needs no row exchanges, and is numerically stable.
        - *Sampling.* If $\mathbf{z}$ has independent entries of variance 1, then $\mathbf{x} = L\mathbf{z}$ has covariance $L\,I\,L^\top = A$. That is the puzzle.
        - *Determinants.* $\det A = (l_{11}l_{22}\cdots l_{nn})^2$, so $\log\det A = 2\sum_i \log l_{ii}$, computed without overflow. Gaussian log-likelihoods are evaluated this way.

        **Two square roots.** The spectral theorem gave the symmetric square root $Q\sqrt{\Lambda}Q^\top$. Cholesky gives a triangular one. They are different matrices and both satisfy "factor times its transpose equals $A$". The triangular one is far cheaper to compute and to solve with.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the steps for solving A x = b when A is positive definite, using its Cholesky factor.
        steps:
          - 'Factor $A = LL^\top$ with $L$ lower triangular.'
          - 'Rewrite the system as $L(L^\top\mathbf{x}) = \mathbf{b}$ and name $\mathbf{y} = L^\top\mathbf{x}$.'
          - 'Solve $L\mathbf{y} = \mathbf{b}$ from the first equation downward.'
          - 'Solve $L^\top\mathbf{x} = \mathbf{y}$ from the last equation upward.'
          - 'The result $\mathbf{x}$ solves the original system.'
        explanation: One factorisation and two triangular solves. The lower triangular system is solved forward, and the upper triangular one backward.
  formal:
    - text: |
        Let $A$ be a real symmetric $n \times n$ matrix.

        **Positive definite** ($A \succ 0$): $\mathbf{x}^\top A\mathbf{x} > 0$ for all $\mathbf{x} \ne \mathbf{0}$. **Positive semidefinite** ($A \succeq 0$): $\mathbf{x}^\top A\mathbf{x} \ge 0$ for all $\mathbf{x}$.

        **Equivalent conditions for $A \succ 0$.**

        1. All eigenvalues of $A$ are positive.
        2. $A = B^\top B$ with $B$ of full column rank.
        3. All leading principal minors are positive (Sylvester).
        4. $A = LL^\top$ with $L$ lower triangular with positive diagonal (Cholesky). $L$ is unique.
        5. $\langle \mathbf{x}, \mathbf{y} \rangle = \mathbf{x}^\top A\mathbf{y}$ is an inner product on $\mathbb{R}^n$.

        **Equivalent conditions for $A \succeq 0$.** All eigenvalues $\ge 0$; $A = B^\top B$ for some $B$; **all** principal minors (not only leading ones) are $\ge 0$.

        **Closure.** If $A, B \succeq 0$ and $c \ge 0$ then $A + B \succeq 0$ and $cA \succeq 0$. If $A \succ 0$ then $A^{-1} \succ 0$, and $M^\top AM \succeq 0$ for every $M$, with $\succ 0$ when $M$ has full column rank. Every principal submatrix of a positive definite matrix is positive definite.

        **Gram matrices.** $A^\top A \succeq 0$ always, and $A^\top A \succ 0$ if and only if $A$ has independent columns. $A^\top A + \mu I \succ 0$ for every $\mu > 0$.

        **Order.** $A \succeq B$ means $A - B \succeq 0$. This is a partial order on symmetric matrices.

        **Complex case.** Hermitian $A$ with $\mathbf{x}^{\mathsf H}A\mathbf{x} > 0$, and $A = LL^{\mathsf H}$.
  drill:
