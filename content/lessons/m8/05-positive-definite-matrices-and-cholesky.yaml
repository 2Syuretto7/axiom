                n = len(A)
                L = np.zeros((n, n))
                for j in range(n):
                    d = A[j, j]
                    if d <= 0:
                        return None
                    L[j, j] = d ** 0.5
                    for i in range(j + 1, n):
                        L[i, j] = A[i, j] / L[j, j]
                return L


            print("[[2.0, 0.0, 0.0], [1.0, 2.0, 0.0], [1.0, 1.0, 2.0]]\nNone")
          - |
