        system: s1
        prompt: |
          A symmetric matrix $A$ is positive definite when
        options: ['all its entries are positive', '$\mathbf{x}^\top A\mathbf{x} > 0$ for every nonzero $\mathbf{x}$', 'its determinant is positive', 'its trace is positive']
        answer: 1
        explanation: The definition. The others are consequences or unrelated.
    - question:
        id: drill-eigen
        type: choice
        system: s1
        prompt: |
          A symmetric matrix is positive definite exactly when its eigenvalues are
        options: ['all real', 'all positive', 'all different', 'all at least 1']
        answer: 1
        explanation: $\mathbf{x}^\top A\mathbf{x} = \sum\lambda_iy_i^2$ in eigenvector coordinates.
    - question:
