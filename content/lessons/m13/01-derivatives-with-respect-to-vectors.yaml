            print("0.0")
        explanation: |
          $f(\mathbf{x}) = g(A\mathbf{x})$ with $g(\mathbf{z}) = \sum\tanh^2z_i$. The gradient of $g$ is $2\tanh z_i(1 - \tanh^2z_i)$ in each entry, by the scalar chain rule. It is a gradient with respect to $\mathbf{z}$, and it comes back to $\mathbf{x}$ through $A^\top$, not through $A$.

          With a matrix that is not square, `A @ ...` would have failed with a shape error, and the mistake would have been found in a second. The matrix here is square, so both products run, and only the comparison with measured slopes shows that one of them is wrong. This is why gradient code is tested on shapes where every dimension is different.

          The second wrong version forgets the derivative of $\tanh$, and the third forgets the 2 from the square. Each layer of a composition contributes one factor, and each is easy to drop.
    - question:
        id: work-why-transpose
        type: choice
        system: s2
        prompt: |
          Why is it the transpose $A^\top$, and not $A$, that appears in the gradient of $g(A\mathbf{x})$?
        options:
          - 'It is a convention, and $A$ would do as well.'
          - 'A displacement $\mathbf{h}$ of $\mathbf{x}$ becomes the displacement $A\mathbf{h}$ of $\mathbf{z} = A\mathbf{x}$, which changes $g$ by $\nabla g^\top A\mathbf{h} = (A^\top\nabla g)^\top\mathbf{h}$. The gradient is the vector paired with $\mathbf{h}$, and moving $A$ across the dot product transposes it.'
          - 'Because $A$ is usually symmetric.'
          - 'Because gradients are always rows.'
        answer: 1
        explanation: |
          Displacements live in the input space and are pushed **forward** by $A$. A gradient is a rule for turning displacements into numbers, a linear functional, and such rules are pulled **back** by the transpose. That is the dual map of the lesson on dual spaces, turning up in calculus. It also settles the shapes: if $A$ is $m \times n$, $\nabla g$ has $m$ entries and the gradient with respect to $\mathbf{x}$ needs $n$, and $A^\top$ is the only one of the two that can be applied. Backpropagation is this one fact, used once for every layer.
    - question:
        id: work-hessian
        type: numeric
        system: s2
        prompt: |
          $f(\mathbf{x}) = \|A\mathbf{x}\|^2$ with $A = \begin{pmatrix} 1 & 2 \\ 0 & 1 \end{pmatrix}$. What is the top-right entry of the Hessian of $f$?
        answer: "4"
        explanation: |
          $f = \mathbf{x}^\top(A^\top A)\mathbf{x}$, a quadratic form with the symmetric matrix $A^\top A = \begin{pmatrix} 1 & 2 \\ 2 & 5 \end{pmatrix}$. Its gradient is $2A^\top A\mathbf{x}$ and its Hessian is $2A^\top A = \begin{pmatrix} 2 & 4 \\ 4 & 10 \end{pmatrix}$. The Hessian of a least-squares loss is always of this form, a Gram matrix, and so it is positive semidefinite with eigenvalues $2\sigma_i(A)^2$. The condition number of the problem is the square of that of $A$.
    - question:
        id: work-layout
        type: choice
        system: s2
        prompt: |
          A reference book gives "the derivative of $\mathbf{a}^\top\mathbf{x}$ with respect to $\mathbf{x}$" as $\mathbf{a}^\top$, a row, where this lesson gave the column $\mathbf{a}$. What is going on, and what is the safe practice?
        options:
          - 'One of the two is a mistake.'
          - 'The book writes the derivative of a scalar as the $1 \times n$ Jacobian, and this lesson writes the gradient, its transpose. Both describe the same linear approximation. The safe practice is to fix one convention, make every gradient the shape of its variable, and confirm with a numerical check.'
          - 'Rows and columns are the same thing.'
          - 'The book is using complex numbers.'
        answer: 1
        explanation: |
          The two conventions are called numerator layout and denominator layout, and formulas copied from mixed sources differ by transposes in unpredictable places. For code the question has only one useful answer: an optimiser computes `w - rate * grad`, so the gradient must have exactly the shape of `w`. The Jacobian convention, $m \times n$ for a map from $\mathbb{R}^n$ to $\mathbb{R}^m$, is the one in which the chain rule is a plain product of matrices in the order of composition. Keeping Jacobians for maps and gradients for scalar functions, with one transpose between them, avoids the muddle.
  connections:
    - text: |
        The gradient of $\mathbf{x}^\top A\mathbf{x}$ is $(A + A^\top)\mathbf{x}$, one term from each appearance of $\mathbf{x}$. It was found with no partial derivative: put in $\mathbf{x} + \mathbf{h}$, keep what is linear in $\mathbf{h}$, and bring it to the form $(\text{vector})^\top\mathbf{h}$.

        The same method gave the Jacobians of $A\mathbf{x}$ and of elementwise functions, and the chain rule in the form that matters: the gradient of $g(F(\mathbf{x}))$ is $J_F^\top\nabla g$. Displacements go forward through the Jacobian, and gradients come back through its transpose. Most losses are of the form $g(A\mathbf{x})$, with gradient $A^\top\nabla g$.

        In all of this the variable was a vector and the matrix was a constant. In a neural network it is the other way round. The data are fixed, and the things being trained are the weight **matrices**. The loss is a function of a matrix, and its gradient must say how to change every entry. Flattening the matrix into a long vector would work, and would throw away exactly the structure that made today's formulas short: [[m13.derivatives-with-respect-to-matrices]].
