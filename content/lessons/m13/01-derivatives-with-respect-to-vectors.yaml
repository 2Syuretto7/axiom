    - question:
        id: predict-check
        type: predict
        system: s1
        prompt: The puzzle again, with the measured slopes, the correct formula and the guess. What does this show?
        code: |
          import numpy as np

          A = np.array([[1.0, 4.0], [0.0, 3.0]])
          x = np.array([1.0, 2.0])
          h = 1e-6
          measured = [(float((x + h * e) @ A @ (x + h * e)) - float((x - h * e) @ A @ (x - h * e))) / (2 * h) for e in np.eye(2)]
          print([round(float(v), 4) for v in measured])
          print([round(float(v), 4) for v in (A + A.T) @ x])
          print([round(float(v), 4) for v in 2 * A @ x])
        output: |
          [10.0, 16.0]
          [10.0, 16.0]
          [18.0, 12.0]
        explanation: The measured slopes agree with (A + A transpose) x. The guess 2 A x is right only for a symmetric matrix.
    - question:
        id: predict-jacobian
        type: predict
        system: s1
        prompt: The Jacobian of tanh applied to each entry, measured one column at a time, against the formula. What does this show?
        code: |
          import numpy as np

          x = np.array([0.0, 1.0, -2.0])
          h = 1e-6
          columns = [(np.tanh(x + h * e) - np.tanh(x - h * e)) / (2 * h) for e in np.eye(3)]
          J = np.stack(columns).T
          print([[round(float(v), 4) + 0.0 for v in row] for row in J])
          print([round(float(v), 4) for v in 1 - np.tanh(x) ** 2])
        output: |
          [[1.0, 0.0, 0.0], [0.0, 0.42, 0.0], [0.0, 0.0, 0.0707]]
          [1.0, 0.42, 0.0707]
        explanation: The Jacobian of an elementwise function is diagonal, with the scalar derivative at each entry on the diagonal. Multiplying a vector by it is an elementwise product, so the matrix never needs to be formed.
  work:
    - text: Slower now. The first task is the rule the puzzle was about.
    - question:
        id: write-quadratic
        type: code
        mode: write
        system: s2
        prompt: |
          Write `grad_quadratic(A, b, x)` returning the gradient with respect to `x` of $f(\mathbf{x}) = \mathbf{x}^\top A\mathbf{x} + \mathbf{b}^\top\mathbf{x}$, for any square matrix `A`.
        starter: |
          import numpy as np


          def grad_quadratic(A, b, x):
              return x * 0.0


          A = np.array([[1.0, 4.0], [0.0, 3.0]])
          print([round(float(v), 4) for v in grad_quadratic(A, np.array([1.0, -1.0]), np.array([1.0, 2.0]))])
        solution: |
          import numpy as np


          def grad_quadratic(A, b, x):
              return (A + A.T) @ x + b


          A = np.array([[1.0, 4.0], [0.0, 3.0]])
          print([round(float(v), 4) for v in grad_quadratic(A, np.array([1.0, -1.0]), np.array([1.0, 2.0]))])
        tests: |
          import numpy as _np
          _A = _np.array([[1.0, 4.0], [0.0, 3.0]])
          _g = grad_quadratic(_A, _np.array([1.0, -1.0]), _np.array([1.0, 2.0]))
          assert _np.shape(_g) == (2,), "The gradient has the shape of x"
          assert _np.allclose(_g, [11.0, 15.0]), "For A = [[1, 4], [0, 3]], b = (1, -1) and x = (1, 2) the gradient is (A + A^T) x + b = (11, 15)"
          assert _np.allclose(grad_quadratic(_np.eye(3), _np.zeros(3), _np.array([1.0, 2.0, 3.0])), [2.0, 4.0, 6.0]), "For A = I and b = 0 the function is the squared length and the gradient is 2x"
          assert _np.allclose(grad_quadratic(_np.zeros((2, 2)), _np.array([5.0, 7.0]), _np.array([1.0, 1.0])), [5.0, 7.0]), "For A = 0 the function is b^T x and the gradient is b"
          _rng = _np.random.default_rng(0)
          _B, _b, _x = _rng.normal(size=(4, 4)), _rng.normal(size=4), _rng.normal(size=4)
          _f = lambda v: float(v @ _B @ v + _b @ v)
          _num = _np.array([(_f(_x + 1e-6 * _e) - _f(_x - 1e-6 * _e)) / 2e-6 for _e in _np.eye(4)])
          assert _np.allclose(grad_quadratic(_B, _b, _x), _num, atol=1e-6), "For a random 4 by 4 matrix the gradient should agree with central differences. The matrix need not be symmetric"
          assert output.strip() == "[11.0, 15.0]", "The program should print [11.0, 15.0]"
        wrong:
          - |
            import numpy as np


            def grad_quadratic(A, b, x):
                return 2 * A @ x + b


            print("[11.0, 15.0]")
          - |
            import numpy as np


            def grad_quadratic(A, b, x):
                return (A + A.T) @ x


            print("[11.0, 15.0]")
          - |
            import numpy as np


            def grad_quadratic(A, b, x):
                return A @ x + b


            print("[11.0, 15.0]")
          - |
            import numpy as np


            def grad_quadratic(A, b, x):
                return (A + A.T) @ x + b @ x


            print("[11.0, 15.0]")
        explanation: |
          The two terms are differentiated separately. The quadratic part gives $(A + A^\top)\mathbf{x}$ and the linear part gives $\mathbf{b}$.

          The last test is the one to remember. It builds a random matrix, measures the slopes of the function by central differences, and compares. A test of that kind needs no knowledge of the right formula, and catches the tempting $2A\mathbf{x}$ at once. A test on a symmetric matrix would not: half of all bugs in gradient code hide behind test cases that are too tidy.
    - question:
        id: write-logistic
        type: code
        mode: write
        system: s2
        prompt: |
          The logistic regression loss for a data matrix `X` with one example per row, labels `y` of zeros and ones, and weights `w` is $f(\mathbf{w}) = \sum_i\big(\log(1 + e^{z_i}) - y_iz_i\big)$ with $\mathbf{z} = X\mathbf{w}$. Write `grad_logistic(X, y, w)` returning its gradient with respect to `w`. The derivative of $\log(1 + e^z)$ is $1/(1 + e^{-z})$.
        starter: |
          import numpy as np


          def grad_logistic(X, y, w):
