concept: m13.derivatives-with-respect-to-vectors
minutes: 85
claim: You can find the gradient of a function of a vector without writing out a single partial derivative, by expanding the function at a displaced point and reading off the part that is linear in the displacement, give the gradients of linear forms, quadratic forms and squared norms, give the Jacobians of a matrix product and of an elementwise function, differentiate a composition by multiplying by the transpose of a Jacobian, and use the shape of the answer as a check.
recalls: [m12.multiple-integrals-and-change-of-variables, m8.perron-frobenius-and-power-iteration]
uses: [m12.gradient, m12.jacobian, m12.multivariable-chain-rule, m12.total-derivative-as-best-linear-approximation, m12.hessian-and-symmetry-of-mixed-partials, m12.partial-derivatives, m8.quadratic-forms-and-the-rayleigh-quotient, m6.dual-spaces-and-the-transpose, m5.transpose, m5.matrix-vector-product, m4.dot-product, m2.the-exponential-and-e, m1.logarithms, e6.gradient-checking, e5.vectorisation, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions]
leads: [m13.derivatives-with-respect-to-matrices, m13.the-method-of-differentials, m13.jacobian-vector-and-vector-jacobian-products]
starter: |
  # Scratch space. f(x) = x^T A x. Is its gradient 2 A x?
  import numpy as np

  A = np.array([[1.0, 4.0], [0.0, 3.0]])
  x = np.array([1.0, 2.0])


  def f(x):
      return float(x @ A @ x)


  h = 1e-6
  measured = [(f(x + h * e) - f(x - h * e)) / (2 * h) for e in np.eye(2)]
  print([round(float(v), 4) for v in measured])
  print([round(float(v), 4) for v in 2 * A @ x])
parts:
  recall:
    - text: |
        [[m12.multiple-integrals-and-change-of-variables]] completed the calculus of several variables, and [[m8.perron-frobenius-and-power-iteration]] ended by asking for derivatives with respect to millions of numbers at once. Both threads meet here. The calculus is known. What is new is doing it on whole vectors, without ever descending to entries. Three quick pulls first.
  puzzle:
    - text: |
        In one variable, the derivative of $ax^2$ is $2ax$. The natural generalisation of $ax^2$ to a vector $\mathbf{x}$ is the quadratic form $f(\mathbf{x}) = \mathbf{x}^\top A\mathbf{x}$, so the natural guess for its gradient is $2A\mathbf{x}$.

        The starter tests the guess on $A = \begin{pmatrix} 1 & 4 \\ 0 & 3 \end{pmatrix}$ at $\mathbf{x} = (1, 2)$. The first line holds slopes measured by central differences, and the second holds $2A\mathbf{x}$.

        ```
        [10.0, 16.0]
        [18.0, 12.0]
        ```

        The guess is wrong in both entries. It is not even close.

        One way to find the right answer is to write $f$ out as $x_1^2 + 4x_1x_2 + 3x_2^2$ and take partial derivatives. That works for two variables. For a loss with a million variables, defined by matrices, it is hopeless.

        **What is the gradient of $\mathbf{x}^\top A\mathbf{x}$, and how can it be found by a calculation with $A$ and $\mathbf{x}$ themselves, in which no entry is ever written down?**
  intuition:
    - text: |
        Go back to what a gradient **is**. For a small displacement $\mathbf{h}$,

        $$f(\mathbf{x} + \mathbf{h}) = f(\mathbf{x}) + \nabla f(\mathbf{x}) \cdot \mathbf{h} + \text{(something much smaller than } \mathbf{h}).$$

        The gradient is the vector whose dot product with $\mathbf{h}$ gives the first-order change. That is a definition which never mentions coordinates. So it gives a method which never mentions them either:

        1. Put $\mathbf{x} + \mathbf{h}$ into the formula and multiply out.
        2. Throw away everything with two or more factors of $\mathbf{h}$.
        3. Arrange what is left with one $\mathbf{h}$ as $(\text{some vector})^\top\mathbf{h}$.

        That vector is the gradient.

        Try it on the puzzle.

        $$(\mathbf{x} + \mathbf{h})^\top A(\mathbf{x} + \mathbf{h}) = \mathbf{x}^\top A\mathbf{x} + \mathbf{x}^\top A\mathbf{h} + \mathbf{h}^\top A\mathbf{x} + \mathbf{h}^\top A\mathbf{h}.$$

        The last term has two $\mathbf{h}$s and goes. The two middle terms each have one, but $\mathbf{h}$ sits in different places. Each is a number, and a number equals its own transpose: $\mathbf{h}^\top A\mathbf{x} = (A\mathbf{x})^\top\mathbf{h}$, and $\mathbf{x}^\top A\mathbf{h} = (A^\top\mathbf{x})^\top\mathbf{h}$. Together,

        $$\nabla(\mathbf{x}^\top A\mathbf{x}) = A\mathbf{x} + A^\top\mathbf{x} = (A + A^\top)\mathbf{x}.$$

        There were **two** $\mathbf{x}$s in the formula, and each contributes a term, as in the product rule. In one variable the two terms are equal and add to $2ax$. For matrices they are equal only if $A = A^\top$. The guess $2A\mathbf{x}$ quietly assumed a symmetric matrix.

        Check: $A + A^\top = \begin{pmatrix} 2 & 4 \\ 4 & 6 \end{pmatrix}$, and times $(1, 2)$ gives $(10, 16)$.
  derivation:
    - text: |
        **Conventions.** Vectors are columns. For $f: \mathbb{R}^n \to \mathbb{R}$ the **gradient** $\nabla f(\mathbf{x})$ is a column of the same shape as $\mathbf{x}$, defined by

        $$f(\mathbf{x} + \mathbf{h}) = f(\mathbf{x}) + \nabla f(\mathbf{x})^\top\mathbf{h} + o(\|\mathbf{h}\|).$$

        For $F: \mathbb{R}^n \to \mathbb{R}^m$ the **Jacobian** $J_F(\mathbf{x})$ is the $m \times n$ matrix with

        $$F(\mathbf{x} + \mathbf{h}) = F(\mathbf{x}) + J_F(\mathbf{x})\mathbf{h} + o(\|\mathbf{h}\|).$$

        Its rows are the gradients of the outputs, transposed. For $m = 1$ the Jacobian is the row $\nabla f^\top$. The gradient is a column, and the Jacobian of a scalar function is a row: that single transpose is the source of most confusion in this subject, and of every transpose in what follows.

        **First gradients,** each by expanding and reading off.

        - $f = \mathbf{a}^\top\mathbf{x}$: $\ \mathbf{a}^\top(\mathbf{x} + \mathbf{h}) = \mathbf{a}^\top\mathbf{x} + \mathbf{a}^\top\mathbf{h}$, so $\nabla f = \mathbf{a}$.
        - $f = \mathbf{x}^\top A\mathbf{x}$: $\ \nabla f = (A + A^\top)\mathbf{x}$, and $2A\mathbf{x}$ if $A$ is symmetric.
        - $f = \|\mathbf{x}\|^2 = \mathbf{x}^\top I\mathbf{x}$: $\ \nabla f = 2\mathbf{x}$.
        - $f = \mathbf{b}^\top A\mathbf{x} = (A^\top\mathbf{b})^\top\mathbf{x}$: $\ \nabla f = A^\top\mathbf{b}$.

        **First Jacobians.**

        - $F = A\mathbf{x} + \mathbf{b}$: $\ A(\mathbf{x} + \mathbf{h}) + \mathbf{b} = F(\mathbf{x}) + A\mathbf{h}$, so $J_F = A$.
        - $F = \phi(\mathbf{x})$, a function $\phi$ applied to each entry: output $i$ depends only on input $i$, so $J_F = \operatorname{diag}(\phi'(\mathbf{x}))$.

        **The chain rule.** Let $f(\mathbf{x}) = g(F(\mathbf{x}))$ with $g$ scalar. Displace $\mathbf{x}$ by $\mathbf{h}$. Then $F$ moves by $J_F\mathbf{h}$, and $g$ changes by $\nabla g^\top(J_F\mathbf{h}) = (J_F^\top\nabla g)^\top\mathbf{h}$. So

        $$\nabla f(\mathbf{x}) = J_F(\mathbf{x})^\top\,\nabla g(F(\mathbf{x})).$$

        The gradient with respect to the output is turned into the gradient with respect to the input by the **transpose** of the Jacobian. Displacements go forward through $J_F$. Gradients come back through $J_F^\top$.

        The most used case is $F = A\mathbf{x} + \mathbf{b}$:

        $$\nabla_{\mathbf{x}}\,g(A\mathbf{x} + \mathbf{b}) = A^\top\,\nabla g(A\mathbf{x} + \mathbf{b}).$$

        *Example.* $f = \tfrac12\|A\mathbf{x} - \mathbf{b}\|^2$ is $g(\mathbf{r}) = \tfrac12\|\mathbf{r}\|^2$ at $\mathbf{r} = A\mathbf{x} - \mathbf{b}$, and $\nabla g = \mathbf{r}$. So $\nabla f = A^\top(A\mathbf{x} - \mathbf{b})$, the residual pulled back by $A^\top$. Setting it to zero gives the normal equations.
    - question:
        id: derivation-gradient
        type: numeric
        system: s2
        prompt: |
          $f(\mathbf{x}) = \mathbf{x}^\top A\mathbf{x}$ with $A = \begin{pmatrix} 2 & 1 \\ 5 & 0 \end{pmatrix}$. What is the first entry of $\nabla f$ at $\mathbf{x} = (1, 1)$?
        answer: "10"
        explanation: |
          $A + A^\top = \begin{pmatrix} 4 & 6 \\ 6 & 0 \end{pmatrix}$, and times $(1, 1)$ gives $(10, 6)$. The tempting $2A\mathbf{x} = (6, 10)$ has the same entries in the wrong places. Only the symmetric part $\tfrac12(A + A^\top)$ of a matrix affects the quadratic form, so it is the only part that can appear in the gradient.
    - text: |
        **More rules.**

        - *Sum.* $\nabla(f + g) = \nabla f + \nabla g$.
        - *Product of vector functions.* $\nabla\big(\mathbf{u}(\mathbf{x})^\top\mathbf{v}(\mathbf{x})\big) = J_{\mathbf{u}}^\top\mathbf{v} + J_{\mathbf{v}}^\top\mathbf{u}$. Each factor is differentiated in turn, with the other held fixed. The quadratic form is the case $\mathbf{u} = \mathbf{x}$, $\mathbf{v} = A\mathbf{x}$.
        - *Sum of a function of each entry.* $f = \sum_i\phi(x_i)$ has $\nabla f = \phi'(\mathbf{x})$, entry by entry.
        - *Norm.* $\|\mathbf{x}\| = \sqrt{\mathbf{x}^\top\mathbf{x}}$, so $\nabla\|\mathbf{x}\| = \mathbf{x}/\|\mathbf{x}\|$, the unit vector pointing away from the origin.

        **A pattern that covers most losses.** $f(\mathbf{x}) = \sum_i\phi(\mathbf{a}_i^\top\mathbf{x})$, where $\mathbf{a}_i^\top$ are the rows of $A$. This is $g(A\mathbf{x})$ with $g(\mathbf{z}) = \sum_i\phi(z_i)$, so

        $$\nabla f = A^\top\phi'(A\mathbf{x}).$$

        Least squares is $\phi(z) = \tfrac12(z - b)^2$. Logistic regression is $\phi(z) = \log(1 + e^z) - yz$, whose derivative is $\sigma(z) - y$ with $\sigma(z) = 1/(1 + e^{-z})$. In every case: compute $A\mathbf{x}$, apply a scalar derivative to each entry, multiply by $A^\top$.

        **Second derivatives.** The Hessian is the Jacobian of the gradient. For $\mathbf{x}^\top A\mathbf{x}$ it is $A + A^\top$. For $g(A\mathbf{x})$ it is $A^\top H_g(A\mathbf{x})A$.

        **Shapes as a check.** A gradient has the shape of the variable. In $\nabla_{\mathbf{x}}\,g(A\mathbf{x})$ with $A$ of shape $m \times n$, the vector $\nabla g$ has length $m$ and the answer must have length $n$. Only $A^\top\nabla g$ fits. When $A$ is square the shapes no longer help, and that is when mistakes are made.

        **And measurement as the judge.** Every formula in this cluster can be tested in three lines against central differences, as the starter did. A gradient that has not been checked should not be trusted.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the derivation of the gradient of the quadratic form x transpose A x.
        steps:
          - 'Replace $\mathbf{x}$ by $\mathbf{x} + \mathbf{h}$ and multiply out into four terms.'
          - 'Discard $\mathbf{h}^\top A\mathbf{h}$, which has two factors of $\mathbf{h}$.'
          - 'Rewrite $\mathbf{h}^\top A\mathbf{x}$ as $(A\mathbf{x})^\top\mathbf{h}$, since a number equals its transpose.'
          - 'Rewrite $\mathbf{x}^\top A\mathbf{h}$ as $(A^\top\mathbf{x})^\top\mathbf{h}$.'
          - 'Read off the vector multiplying $\mathbf{h}$: the gradient is $(A + A^\top)\mathbf{x}$.'
        explanation: Expand, keep the part linear in h, bring every term to the form of a vector dotted with h.
  formal:
    - text: |
        **Differentiability.** $F: \mathbb{R}^n \to \mathbb{R}^m$ is differentiable at $\mathbf{x}$ if there is a matrix $J \in \mathbb{R}^{m \times n}$ with $\|F(\mathbf{x} + \mathbf{h}) - F(\mathbf{x}) - J\mathbf{h}\| = o(\|\mathbf{h}\|)$. Then $J = J_F(\mathbf{x})$, $(J_F)_{ij} = \partial F_i/\partial x_j$.

        **Gradient.** For $m = 1$: $\nabla f = J_f^\top \in \mathbb{R}^n$. It is the vector representing the linear functional $\mathbf{h} \mapsto J_f\mathbf{h}$ in the standard inner product.

        **Chain rule.** $J_{G \circ F}(\mathbf{x}) = J_G(F(\mathbf{x}))\,J_F(\mathbf{x})$. For scalar $g$: $\nabla(g \circ F) = J_F^\top(\nabla g \circ F)$.

        **Table.** With $\mathbf{a}, \mathbf{b}$ constant vectors and $A$ a constant matrix:

        | $f(\mathbf{x})$ | $\nabla f$ | Hessian |
        |---|---|---|
        | $\mathbf{a}^\top\mathbf{x}$ | $\mathbf{a}$ | $0$ |
        | $\mathbf{x}^\top A\mathbf{x}$ | $(A + A^\top)\mathbf{x}$ | $A + A^\top$ |
        | $\tfrac12\lVert A\mathbf{x} - \mathbf{b}\rVert^2$ | $A^\top(A\mathbf{x} - \mathbf{b})$ | $A^\top A$ |
        | $\lVert\mathbf{x}\rVert$ | $\mathbf{x}/\lVert\mathbf{x}\rVert$ | $(I - \hat{\mathbf{x}}\hat{\mathbf{x}}^\top)/\lVert\mathbf{x}\rVert$ |
        | $g(A\mathbf{x} + \mathbf{b})$ | $A^\top\nabla g$ | $A^\top H_gA$ |
        | $\log\sum_i e^{x_i}$ | $\operatorname{softmax}(\mathbf{x})$ | $\operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^\top$ |

        | $F(\mathbf{x})$ | $J_F$ |
        |---|---|
        | $A\mathbf{x} + \mathbf{b}$ | $A$ |
        | $\phi(\mathbf{x})$ elementwise | $\operatorname{diag}(\phi'(\mathbf{x}))$ |
        | $\mathbf{x}/\lVert\mathbf{x}\rVert$ | $(I - \hat{\mathbf{x}}\hat{\mathbf{x}}^\top)/\lVert\mathbf{x}\rVert$ |
        | $\operatorname{softmax}(\mathbf{x}) = \mathbf{p}$ | $\operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^\top$ |

        **Layout.** Some texts define the derivative of a scalar by a vector as the row $J_f$ ("numerator layout") and others as the column $\nabla f$ ("denominator layout"). Formulas from the two differ by transposes. Here: Jacobians are $m \times n$, and gradients have the shape of the variable.
  drill:
    - text: |
        Seconds each.
    - question:
        id: drill-linear
        type: choice
        system: s1
        prompt: |
          The gradient of $\mathbf{a}^\top\mathbf{x}$ with respect to $\mathbf{x}$ is
        options: ['$\mathbf{x}$', '$\mathbf{a}$', '$\mathbf{a}^\top\mathbf{x}$', '$0$']
        answer: 1
        explanation: The coefficient of the displacement.
    - question:
        id: drill-square
        type: numeric
        system: s1
        prompt: |
          $f(\mathbf{x}) = \|\mathbf{x}\|^2$. What is the first entry of $\nabla f$ at $\mathbf{x} = (3, 4)$?
        answer: "6"
        explanation: $\nabla f = 2\mathbf{x} = (6, 8)$.
    - question:
        id: drill-quadratic
        type: choice
        system: s1
        prompt: |
          The gradient of $\mathbf{x}^\top A\mathbf{x}$, for any square $A$, is
        options: ['$2A\mathbf{x}$', '$(A + A^\top)\mathbf{x}$', '$A\mathbf{x}$', '$A^\top\mathbf{x}$']
        answer: 1
        explanation: One term from each of the two factors of the variable.
    - question:
        id: drill-symmetric
        type: choice
        system: s1
        prompt: |
          If $A$ is symmetric, the gradient of $\mathbf{x}^\top A\mathbf{x}$ simplifies to
        options: ['$2A\mathbf{x}$', '$A\mathbf{x}$', '$\mathbf{x}$', '$A^2\mathbf{x}$']
        answer: 0
        explanation: Then $A + A^\top = 2A$.
    - question:
        id: drill-shape-gradient
        type: numeric
