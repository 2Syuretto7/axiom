        explanation: |
          The loss is $g(X\mathbf{w})$ with $g(\mathbf{z}) = \sum_i\phi_i(z_i)$, so its gradient is $X^\top$ times the vector of scalar derivatives $\phi_i'(z_i) = \sigma(z_i) - y_i$. Three steps: the scores `z`, the errors $\sigma(\mathbf{z}) - \mathbf{y}$, and the pull back through `X.T`.

          The form is worth staring at. $\sigma(z_i)$ is the predicted probability and $y_i$ the label, so the middle factor is "prediction minus target". The gradient of least squares, $X^\top(X\mathbf{w} - \mathbf{y})$, has the very same shape, which is the first wrong version. Each example pushes the weights along its own feature vector, in proportion to how wrong the model is on it.

