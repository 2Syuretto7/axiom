        explanation: |
          Write $M = X^\top X + \lambda I$. The weights satisfy $M\mathbf{w} = X^\top\mathbf{y}$. Differentiate in $\lambda$: the right side does not depend on it, and $dM/d\lambda = I$, so $\mathbf{w} + M\,\dfrac{d\mathbf{w}}{d\lambda} = \mathbf{0}$ and

          $$\frac{d\mathbf{w}}{d\lambda} = -M^{-1}\mathbf{w}.$$

          The code had $-\mathbf{w}$: it differentiated the equation and then forgot to solve it. The derivative of the loss is $\bar{\mathbf{w}} \cdot d\mathbf{w}/d\lambda = -\bar{\mathbf{w}}^\top M^{-1}\mathbf{w}$.

          This number is the gradient of a validation loss with respect to a **hyperparameter**, through a complete training run, which here is one linear solve. With it $\lambda$ can be tuned by gradient descent, where a grid search would refit the model once for each candidate. For a network, $M$ becomes the Hessian of the training loss, and the solve is done with Hessian-vector products.
    - question:
        id: work-quadratic
        type: numeric
        system: s2
        prompt: |
          $x(\theta)$ is the positive solution of $x^2 + \theta x - 6 = 0$. At $\theta = 1$ it is $x = 2$. What is $dx/d\theta$ there?
        answer: "-0.4"
        explanation: |
          Differentiate the equation with both $x$ and $\theta$ moving: $2x\,x' + x + \theta x' = 0$, so $x' = -\dfrac{x}{2x + \theta} = -\dfrac{2}{5}$. In the notation of the lesson, $F_x = 2x + \theta = 5$ and $F_\theta = x = 2$. The term $x$ comes from the product $\theta x$, and is the one most easily forgotten: the parameter appears in the equation multiplied by the unknown. As a check, the quadratic formula gives $x = \tfrac12(-\theta + \sqrt{\theta^2 + 24})$, whose derivative at $\theta = 1$ is $\tfrac12(-1 + \tfrac15) = -0.4$.
    - question:
        id: work-unroll
        type: choice
        system: s2
        prompt: |
          A layer's output is the fixed point of an iteration that takes about 500 steps to converge. Its gradient can be found by reverse mode through all 500 steps, or implicitly. Which comparison is right?
        options:
          - 'They cost the same, since both compute the same gradient.'
          - 'Unrolling stores the state of all 500 steps and returns the derivative of the approximate answer. The implicit method stores only the fixed point, costs one linear solve, and returns the derivative of the exact fixed point, provided the forward solve was accurate.'
          - 'The implicit method stores 500 states and unrolling stores one.'
          - 'Unrolling is exact and the implicit method is an approximation that ignores the iterations.'
        answer: 1
        explanation: |
          The memory of reverse mode grows with the length of the calculation, and a solver is a long calculation whose intermediate states are of no interest. The implicit method replaces its backward sweep by the adjoint equation at the solution. The proviso matters: the formula is the derivative at an exact solution, so a carelessly converged forward solve gives a gradient that is off by an amount proportional to the residual. In return, the forward solver can be anything, including one that is not differentiable step by step.
    - question:
        id: work-singular
        type: choice
        system: s2
        prompt: |
          For $x^2 = \theta$ the implicit derivative is $1/(2x)$. What happens as $\theta$ decreases to 0, and why?
        options:
          - 'The derivative tends to 0, since the solution tends to 0.'
          - 'The derivative grows without bound. At $\theta = 0$ the two solutions $\pm\sqrt\theta$ merge and $F_x = 2x$ is zero, so the condition of the implicit function theorem fails. Below 0 there is no real solution to differentiate.'
          - 'Nothing special: the formula holds for all $\theta$.'
          - 'The derivative becomes negative.'
        answer: 1
        explanation: |
          $F_x$ measures how firmly the equation pins down $x$. When it is invertible, a small change in the parameters is answered by a small, definite change in the solution. When it is singular the solution is no longer isolated, and it may split, merge or disappear. Near such a point the adjoint system is ill-conditioned and the gradients are enormous. A solver that is differentiated implicitly should therefore watch the condition number of $F_{\mathbf{x}}$, and for a fixed-point layer that means keeping the norm of its Jacobian safely below 1.
  connections:
    - text: |
        $1/(3x^2 + 1)$ came from differentiating the equation $x^3 + x = \theta$ itself. A solution is defined by its equation, so its derivative is too: $d\mathbf{x}^\star/d\boldsymbol\theta = -F_{\mathbf{x}}^{-1}F_{\boldsymbol\theta}$, a **linear** system however nonlinear $F$ is, and with no reference to the solver. The gradient of a loss through the solver costs one **adjoint solve** with $F_{\mathbf{x}}^\top$.

        The same three lines cover a linear system, where $F_{\mathbf{x}} = A$, a fixed point, where it is $I - J$, and a minimiser, where it is the Hessian. Memory does not grow with the iterations, and the derivative exists as long as $F_{\mathbf{x}}$ is invertible.

        You now have every tool of this cluster: gradients with respect to vectors and matrices, differentials, traces, the two kinds of product, graphs, both modes, second order, and solvers. What remains is to apply them where they are used every day. Each layer of a neural network is a small function with its own backward rule, and those rules, derived once and stored in a library, are all that training ever calls: [[m13.gradients-of-common-neural-network-layers]].
