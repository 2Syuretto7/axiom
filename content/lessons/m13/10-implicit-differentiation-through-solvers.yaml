          $A\mathbf{x} = \mathbf{b}$, and $\mathbf{b}$ changes by $d\mathbf{b}$ with $A$ fixed. Then $d\mathbf{x} =$
        options: ['$A\,d\mathbf{b}$', '$A^{-1}d\mathbf{b}$', '$-A^{-1}d\mathbf{b}$', '$d\mathbf{b}$']
        answer: 1
        explanation: The solution is linear in the right side.
    - question:
        id: drill-da
