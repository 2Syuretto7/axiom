          import numpy as np


          def fit(X, y, lam):
              return np.linalg.solve(X.T @ X + lam * np.eye(X.shape[1]), X.T @ y)


          def val_loss(X, y, Xv, yv, lam):
              r = Xv @ fit(X, y, lam) - yv
              return 0.5 * float(r @ r)


          def dval_dlam(X, y, Xv, yv, lam):
              w = fit(X, y, lam)
              wbar = Xv.T @ (Xv @ w - yv)
              M = X.T @ X + lam * np.eye(X.shape[1])
              return -float(wbar @ np.linalg.solve(M, w))


