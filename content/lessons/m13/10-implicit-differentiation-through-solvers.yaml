        type: choice
        system: s1
        prompt: |
          The implicit derivative exists when $F_{\mathbf{x}}$ at the solution is
        options: ['zero', 'invertible', 'symmetric', 'diagonal']
        answer: 1
        explanation: The condition of the implicit function theorem.
    - question:
        id: drill-memory
        type: choice
        system: s1
        prompt: |
          A solver takes 1000 iterations. The memory needed to differentiate its result implicitly
        options: ['grows with the 1000 iterations', 'does not depend on the number of iterations', 'is 1000 times that of one iteration', 'is zero']
        answer: 1
        explanation: Only the solution is used.
    - question:
        id: predict-series
        type: predict
        system: s1
        prompt: The derivative of the fixed point of x = 0.5 x + theta, through 1, 2 and 10 unrolled iterations, and implicitly. What does this show?
        code: |
          d = 0.0
          for k in range(1, 11):
              d = 0.5 * d + 1.0
              if k in [1, 2, 10]:
                  print(k, round(d, 4))
          print(1 / (1 - 0.5))
        output: |
          1 1.0
          2 1.5
          10 1.998
          2.0
        explanation: Differentiating through k iterations gives the sum 1 + 0.5 + 0.25 and so on, up to k terms. It creeps towards 2 and never reaches it. The implicit formula gives the whole sum at once, from the slope 0.5 at the fixed point.
    - question:
        id: predict-eigenvalue
        type: predict
        system: s1
        prompt: The largest eigenvalue of a symmetric matrix, differentiated with respect to its middle entry by a finite difference and by a formula. What does this show?
        code: |
          import numpy as np

          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          E = np.zeros((3, 3))
          E[1, 1] = 1.0
          h = 1e-6
          up = float(np.linalg.eigvalsh(A + h * E)[-1])
          down = float(np.linalg.eigvalsh(A - h * E)[-1])
          print(round((up - down) / (2 * h), 4))
          v = np.array([1.0, 2.0, 1.0]) / np.sqrt(6)
          print(round(float(v @ E @ v), 4))
        output: |
          0.6667
          0.6667
        explanation: The largest eigenvalue is 4, with unit eigenvector (1, 2, 1) over root 6. An eigenvalue is defined by an equation, and differentiating that equation gives its change as v transposed, times the change in the matrix, times v. For the middle entry that is the square of the middle component of v, which is 4 over 6. No eigenvalue routine was differentiated.
  work:
    - text: Slower now. First the backward step of a linear solve.
    - question:
        id: write-solve
        type: code
        mode: write
        system: s2
        prompt: |
          A loss depends on $\mathbf{x} = A^{-1}\mathbf{b}$, and `xbar` is the gradient of the loss with respect to $\mathbf{x}$. Write `grad_solve(A, b, xbar)` returning the pair `(Abar, bbar)`, the gradients of the loss with respect to $A$ and $\mathbf{b}$. Use one solve for $\mathbf{x}$ and one solve with the transposed matrix.
        starter: |
          import numpy as np


          def grad_solve(A, b, xbar):
              return A * 0.0, b * 0.0


          A = np.array([[2.0, 1.0], [0.0, 4.0]])
          Abar, bbar = grad_solve(A, np.array([4.0, 4.0]), np.array([1.0, 0.0]))
          print([round(float(c), 4) for c in bbar])
          print([[round(float(c), 4) for c in row] for row in Abar])
        solution: |
          import numpy as np


          def grad_solve(A, b, xbar):
              x = np.linalg.solve(A, b)
              lam = np.linalg.solve(A.T, xbar)
              return -np.outer(lam, x), lam


          A = np.array([[2.0, 1.0], [0.0, 4.0]])
          Abar, bbar = grad_solve(A, np.array([4.0, 4.0]), np.array([1.0, 0.0]))
          print([round(float(c), 4) for c in bbar])
          print([[round(float(c), 4) for c in row] for row in Abar])
        tests: |
          import numpy as _np
          _rng = _np.random.default_rng(3)
          _A = _rng.normal(size=(3, 3)) + 3 * _np.eye(3)
          _b = _rng.normal(size=3)
          _c = _rng.normal(size=3)
          def _loss(A, b):
              return float(_c @ _np.linalg.solve(A, b))
          _Ab, _bb = grad_solve(_A, _b, _c)
          assert _np.shape(_Ab) == (3, 3) and _np.shape(_bb) == (3,), "Return a matrix of the shape of A and a vector of the shape of b"
          _nb = _np.array([(_loss(_A, _b + 1e-6 * e) - _loss(_A, _b - 1e-6 * e)) / 2e-6 for e in _np.eye(3)])
          assert _np.allclose(_bb, _nb, atol=1e-6), "bbar should agree with central differences. It is the solution of the system with A transposed and right side xbar"
          _nA = _np.zeros((3, 3))
          for _i in range(3):
              for _j in range(3):
                  _E = _np.zeros((3, 3))
                  _E[_i, _j] = 1e-6
                  _nA[_i, _j] = (_loss(_A + _E, _b) - _loss(_A - _E, _b)) / 2e-6
          assert _np.allclose(_Ab, _nA, atol=1e-6), "Abar should agree with central differences. It is minus the outer product of bbar with the solution x"
          assert output.strip() == "[0.5, -0.125]\n[[-0.75, -0.5], [0.1875, 0.125]]", "The program should print [0.5, -0.125] and then [[-0.75, -0.5], [0.1875, 0.125]]"
        wrong:
          - |
            import numpy as np


            def grad_solve(A, b, xbar):
                x = np.linalg.solve(A, b)
                lam = np.linalg.solve(A, xbar)
                return -np.outer(lam, x), lam


            print("[0.5, -0.125]\n[[-0.75, -0.5], [0.1875, 0.125]]")
          - |
            import numpy as np


            def grad_solve(A, b, xbar):
                x = np.linalg.solve(A, b)
                lam = np.linalg.solve(A.T, xbar)
                return np.outer(lam, x), lam


            print("[0.5, -0.125]\n[[-0.75, -0.5], [0.1875, 0.125]]")
          - |
            import numpy as np


            def grad_solve(A, b, xbar):
                x = np.linalg.solve(A, b)
                lam = np.linalg.solve(A.T, xbar)
                return -np.outer(x, lam), lam


            print("[0.5, -0.125]\n[[-0.75, -0.5], [0.1875, 0.125]]")
        explanation: |
          Differentiate $A\mathbf{x} = \mathbf{b}$: $\ d\mathbf{x} = A^{-1}(d\mathbf{b} - dA\,\mathbf{x})$. The change in the loss is $\bar{\mathbf{x}}^\top d\mathbf{x} = (A^{-\top}\bar{\mathbf{x}})^\top(d\mathbf{b} - dA\,\mathbf{x})$. Name the vector $\boldsymbol\lambda = A^{-\top}\bar{\mathbf{x}}$, found by one solve with $A^\top$. Then the change is $\boldsymbol\lambda^\top d\mathbf{b} - \boldsymbol\lambda^\top dA\,\mathbf{x}$, and reading off the gradients as in the method of differentials: $\bar{\mathbf{b}} = \boldsymbol\lambda$ and $\bar A = -\boldsymbol\lambda\mathbf{x}^\top$.

          The gradient with respect to all $n^2$ entries of $A$ came from one extra solve and one outer product. Nothing about how `np.linalg.solve` works inside was used.

          The first wrong version solves with $A$ where $A^\top$ belongs. For a symmetric matrix that would pass unnoticed, which is why the test matrix is not symmetric.
    - question:
        id: write-fixed-point
        type: code
        mode: write
        system: s2
        prompt: |
