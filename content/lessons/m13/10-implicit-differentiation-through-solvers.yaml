concept: m13.implicit-differentiation-through-solvers
minutes: 90
claim: You can differentiate a quantity that is defined only as the solution of an equation, by differentiating the equation itself and solving one linear system, apply this to the solution of a linear system, to a fixed point and to the minimiser of a loss, obtain the gradient of a scalar loss through a solver with a single extra solve with the transposed matrix, explain why this needs no record of the solver's iterations, and say when the derivative fails to exist.
recalls: [m13.hessian-vector-products]
uses: [m13.trace-identities-determinant-and-inverse-derivatives, m13.the-method-of-differentials, m13.jacobian-vector-and-vector-jacobian-products, m13.reverse-mode-differentiation-and-its-cost, m13.derivatives-with-respect-to-matrices, m12.inverse-and-implicit-function-theorems, m12.jacobian, m12.multivariable-chain-rule, m7.least-squares-and-the-normal-equations, m7.conditioning, m8.eigenvalues-and-eigenvectors, m8.spectral-theorem, m8.operator-and-frobenius-norms, e6.gradient-checking, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m13.gradients-of-common-neural-network-layers]
starter: |
  # Scratch space. x(theta) is the solution of x**3 + x = theta, found by iteration.
  def solve(theta):
      x = 1.0
      for step in range(50):
          x = x - (x ** 3 + x - theta) / (3 * x ** 2 + 1)
      return x


  x = solve(10.0)
  print(x)

  h = 1e-6                          # nudge theta and solve again, twice
  print(round((solve(10.0 + h) - solve(10.0 - h)) / (2 * h), 6))

  print(round(1 / (3 * x ** 2 + 1), 6))   # one line, using only the solution
parts:
  recall:
    - text: |
        [[m13.hessian-vector-products]] ended on the Newton step, a vector defined not by a formula but as the solution of an equation. Everything differentiated so far was a list of explicit operations. Today the thing to differentiate is whatever comes out of a solver. Three quick pulls first.
  puzzle:
    - text: |
        The equation $x^3 + x = \theta$ has exactly one real solution for each $\theta$, because the left side always increases. Call it $x(\theta)$. There is no convenient formula for it. The starter finds it by an iteration of 50 steps, and for $\theta = 10$ gets $x = 2$.

        How fast does the solution move when $\theta$ changes? The starter answers twice. First by nudging $\theta$ and running the whole solver again. Then by one line that uses nothing except the solution itself.

        ```
        2.0
        0.076923
        0.076923
        ```

        The second answer never looked inside the solver. It would be the same whether the solution had been found by 50 steps of this iteration, by bisection, or by a lucky guess.

        **Where does $1/(3x^2 + 1)$ come from? And how can the derivative of a solver's output not depend on the solver?**
  intuition:
    - text: |
        The solver is a means. What **defines** $x(\theta)$ is the equation: for every $\theta$,

        $$x(\theta)^3 + x(\theta) = \theta.$$

        That is an identity between two functions of $\theta$. So their derivatives agree as well. Differentiate both sides, with the chain rule on the left: $3x^2\,x' + x' = 1$, so $x' = \dfrac{1}{3x^2 + 1}$. At $x = 2$ that is $1/13 = 0.076923$.

        The unknown derivative $x'$ appears **linearly** in the differentiated equation, however nonlinear the equation itself was. This is the general pattern. Differentiating an equation that defines $x$ gives a linear equation for the derivative of $x$. You have done this already: differentiating $XX^{-1} = I$ gave $d(X^{-1})$, and differentiating $A\mathbf{x} = \mathbf{b}$ gave $d\mathbf{x}$, in [[m13.trace-identities-determinant-and-inverse-derivatives]].

        Compare the alternative. A solver is a program, so reverse mode can differentiate it step by step: record all 50 iterations and sweep back through them. That costs memory in proportion to the number of iterations, and it differentiates the **approximation** the solver stopped at, by a route that depends on its starting guess and its step rule. Differentiating the equation needs only the answer, costs one linear solve, and gives the derivative of the true solution.

        The solver is a black box. Its output satisfies an equation, and the equation is all you differentiate.
  derivation:
    - text: |
        **Setting.** Let $\mathbf{x}^\star(\boldsymbol\theta) \in \mathbb{R}^n$ be defined by $n$ equations

        $$F(\mathbf{x}^\star(\boldsymbol\theta), \boldsymbol\theta) = \mathbf{0}, \qquad F: \mathbb{R}^n \times \mathbb{R}^p \to \mathbb{R}^n.$$

        Write $F_{\mathbf{x}}$ for the $n \times n$ Jacobian of $F$ with respect to $\mathbf{x}$, and $F_{\boldsymbol\theta}$ for the $n \times p$ Jacobian with respect to $\boldsymbol\theta$, both at the solution.

        **Differentiate the identity.** By the chain rule, $F_{\mathbf{x}}\,d\mathbf{x}^\star + F_{\boldsymbol\theta}\,d\boldsymbol\theta = \mathbf{0}$. If $F_{\mathbf{x}}$ is invertible,

        $$\frac{d\mathbf{x}^\star}{d\boldsymbol\theta} = -F_{\mathbf{x}}^{-1}F_{\boldsymbol\theta}.$$

        This is the implicit function theorem of [[m12.inverse-and-implicit-function-theorems]], used as a tool for computing.

        **Through a scalar loss.** Usually $\mathbf{x}^\star$ feeds a loss $L$, and the backward sweep arrives with $\bar{\mathbf{x}} = \partial L/\partial\mathbf{x}^\star$. The VJP of the solver is

        $$\bar{\boldsymbol\theta} = -F_{\boldsymbol\theta}^\top F_{\mathbf{x}}^{-\top}\bar{\mathbf{x}}.$$

        Compute it in two steps:

        1. Solve $F_{\mathbf{x}}^\top\boldsymbol\lambda = \bar{\mathbf{x}}$ for $\boldsymbol\lambda$. This is the **adjoint equation**.
        2. $\bar{\boldsymbol\theta} = -F_{\boldsymbol\theta}^\top\boldsymbol\lambda$.

        One linear solve, with the **transposed** matrix, gives the gradient with respect to all $p$ parameters. The forward direction would need one solve per parameter. It is the same asymmetry as before.

        **Linear systems.** $\mathbf{x} = A^{-1}\mathbf{b}$, that is $F = A\mathbf{x} - \mathbf{b}$, so $F_{\mathbf{x}} = A$. The differential is $A\,d\mathbf{x} + dA\,\mathbf{x} - d\mathbf{b} = \mathbf{0}$. The adjoint equation is $A^\top\boldsymbol\lambda = \bar{\mathbf{x}}$, and

        $$\bar{\mathbf{b}} = \boldsymbol\lambda, \qquad \bar A = -\boldsymbol\lambda\,\mathbf{x}^\top.$$

        To differentiate through one solve, do one more solve.
    - question:
        id: derivation-cubic
        type: numeric
        system: s2
        prompt: |
          $x(\theta)$ solves $x^3 + x = \theta$. At $\theta = 2$ the solution is $x = 1$. What is $dx/d\theta$ there?
        answer: "0.25"
        explanation: |
          Differentiating the equation gives $(3x^2 + 1)\,x' = 1$, and at $x = 1$ that is $4x' = 1$. Here $F(x, \theta) = x^3 + x - \theta$, so $F_x = 3x^2 + 1 = 4$ and $F_\theta = -1$, and the formula $-F_x^{-1}F_\theta$ gives $1/4$. Only the solution $x = 1$ was needed, and no way of finding it was mentioned.
    - text: |
        **Fixed points.** Let $\mathbf{x}^\star = g(\mathbf{x}^\star, \boldsymbol\theta)$, with $J = \partial g/\partial\mathbf{x}$ at the fixed point. Then $F = \mathbf{x} - g$, $F_{\mathbf{x}} = I - J$, and

        $$\frac{d\mathbf{x}^\star}{d\boldsymbol\theta} = (I - J)^{-1}\frac{\partial g}{\partial\boldsymbol\theta}.$$

        If $\|J\|_2 < 1$, then $(I - J)^{-1} = I + J + J^2 + \cdots$. The term $J^k\,\partial g/\partial\boldsymbol\theta$ is the influence of $\boldsymbol\theta$ that entered $k$ iterations ago. So differentiating through more and more iterations of $\mathbf{x} \leftarrow g(\mathbf{x}, \boldsymbol\theta)$ adds up this series term by term, and the implicit formula is its exact sum: backpropagation through infinitely many steps, at the cost of one solve.

        **Minimisers.** Let $\mathbf{x}^\star(\boldsymbol\theta)$ minimise $f(\mathbf{x}, \boldsymbol\theta)$ over $\mathbf{x}$. The equation it satisfies is $\nabla_{\mathbf{x}}f = \mathbf{0}$. So $F = \nabla_{\mathbf{x}}f$, and $F_{\mathbf{x}}$ is the **Hessian** $H$ of $f$ in $\mathbf{x}$:

        $$\frac{d\mathbf{x}^\star}{d\boldsymbol\theta} = -H^{-1}\frac{\partial}{\partial\boldsymbol\theta}\nabla_{\mathbf{x}}f.$$

        The adjoint equation is $H\boldsymbol\lambda = \bar{\mathbf{x}}$, which for a large model is solved by conjugate gradients using only Hessian-vector products.

        *Example.* Ridge regression: $\mathbf{w}^\star$ minimises $\tfrac12\|X\mathbf{w} - \mathbf{y}\|^2 + \tfrac12\lambda\|\mathbf{w}\|^2$, so $(X^\top X + \lambda I)\mathbf{w}^\star = X^\top\mathbf{y}$. Differentiating in $\lambda$: $\ \mathbf{w}^\star + (X^\top X + \lambda I)\,\dfrac{d\mathbf{w}^\star}{d\lambda} = \mathbf{0}$, so

        $$\frac{d\mathbf{w}^\star}{d\lambda} = -(X^\top X + \lambda I)^{-1}\mathbf{w}^\star.$$

        This is the derivative of trained weights with respect to a hyperparameter, and with it a validation loss can be differentiated with respect to $\lambda$.

        **When it fails.** If $F_{\mathbf{x}}$ is singular at the solution, the formula has no meaning, and generally neither has the derivative. For $x^2 = \theta$: $x' = 1/(2x)$, which blows up as $\theta \to 0$, where two solutions merge and then vanish. Close to such a point $F_{\mathbf{x}}$ is ill-conditioned and the derivative is huge.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the calculation of the gradient of a loss with respect to the parameters of an equation whose solution the loss depends on.
        steps:
          - 'Run any solver to find $\mathbf{x}^\star$ with $F(\mathbf{x}^\star, \boldsymbol\theta) = \mathbf{0}$.'
          - 'Evaluate the loss, and obtain $\bar{\mathbf{x}}$, its gradient with respect to $\mathbf{x}^\star$.'
          - 'Solve the adjoint equation $F_{\mathbf{x}}^\top\boldsymbol\lambda = \bar{\mathbf{x}}$, a single linear system.'
          - 'Form $\bar{\boldsymbol\theta} = -F_{\boldsymbol\theta}^\top\boldsymbol\lambda$.'
          - 'Pass $\bar{\boldsymbol\theta}$ on to whatever produced the parameters.'
        explanation: The solver runs forward as a black box, and one linear solve stands in for its whole backward sweep.
  formal:
    - text: |
        **Implicit function theorem.** Let $F: \mathbb{R}^n \times \mathbb{R}^p \to \mathbb{R}^n$ be $C^1$ near $(\mathbf{x}_0, \boldsymbol\theta_0)$ with $F(\mathbf{x}_0, \boldsymbol\theta_0) = \mathbf{0}$ and $F_{\mathbf{x}}(\mathbf{x}_0, \boldsymbol\theta_0)$ invertible. Then there are neighbourhoods of $\boldsymbol\theta_0$ and $\mathbf{x}_0$ and a unique $C^1$ function $\mathbf{x}^\star$ between them with $F(\mathbf{x}^\star(\boldsymbol\theta), \boldsymbol\theta) = \mathbf{0}$, and

        $$D\mathbf{x}^\star(\boldsymbol\theta) = -F_{\mathbf{x}}^{-1}F_{\boldsymbol\theta}.$$

        **JVP and VJP of a solver.** $\ \dot{\mathbf{x}} = -F_{\mathbf{x}}^{-1}\big(F_{\boldsymbol\theta}\dot{\boldsymbol\theta}\big)$: one solve with $F_{\mathbf{x}}$. $\ \bar{\boldsymbol\theta} = -F_{\boldsymbol\theta}^\top\boldsymbol\lambda$ with $F_{\mathbf{x}}^\top\boldsymbol\lambda = \bar{\mathbf{x}}$: one solve with $F_{\mathbf{x}}^\top$. Neither depends on how $\mathbf{x}^\star$ was computed. Memory is independent of the number of solver iterations.

        **Linear solve.** For $\mathbf{x} = A^{-1}\mathbf{b}$: $\ \bar{\mathbf{b}} = A^{-\top}\bar{\mathbf{x}}$, $\ \bar A = -\bar{\mathbf{b}}\,\mathbf{x}^\top$. A factorisation of $A$ computed for the forward solve also solves the transposed system.

        **Fixed point.** For $\mathbf{x}^\star = g(\mathbf{x}^\star, \boldsymbol\theta)$ with $\rho(J) < 1$: $\ \boldsymbol\lambda = (I - J^\top)^{-1}\bar{\mathbf{x}}$ is itself the fixed point of $\boldsymbol\lambda \leftarrow J^\top\boldsymbol\lambda + \bar{\mathbf{x}}$, an iteration of VJPs. Models whose layer is defined as such a fixed point are called deep equilibrium models.

        **Minimiser.** For $\mathbf{x}^\star = \arg\min_{\mathbf{x}}f(\mathbf{x}, \boldsymbol\theta)$ with $H = \nabla^2_{\mathbf{x}\mathbf{x}}f$ positive definite: $D\mathbf{x}^\star = -H^{-1}\nabla^2_{\mathbf{x}\boldsymbol\theta}f$. For an outer loss $L(\mathbf{x}^\star(\boldsymbol\theta), \boldsymbol\theta)$ (bilevel optimisation):

        $$\frac{dL}{d\boldsymbol\theta} = \frac{\partial L}{\partial\boldsymbol\theta} - \big(\nabla^2_{\mathbf{x}\boldsymbol\theta}f\big)^{\!\top}H^{-1}\frac{\partial L}{\partial\mathbf{x}}.$$

        **Simple eigenvalue.** For symmetric $A$ with a simple eigenvalue $\lambda$ and unit eigenvector $\mathbf{v}$, differentiating $A\mathbf{v} = \lambda\mathbf{v}$ and $\mathbf{v}^\top\mathbf{v} = 1$ gives $d\lambda = \mathbf{v}^\top dA\,\mathbf{v}$, so $\partial\lambda/\partial A = \mathbf{v}\mathbf{v}^\top$.

        **Differential equations.** For $\dot{\mathbf{x}} = f(\mathbf{x}, \boldsymbol\theta)$ the same idea gives the adjoint equation $\dot{\boldsymbol\lambda} = -f_{\mathbf{x}}^\top\boldsymbol\lambda$, integrated backwards in time.

        **Sensitivity.** $\|D\mathbf{x}^\star\| \le \|F_{\mathbf{x}}^{-1}\|\,\|F_{\boldsymbol\theta}\|$. The derivative is large where $F_{\mathbf{x}}$ is nearly singular. An inexact $\mathbf{x}^\star$ gives an inexact gradient, with error proportional to the residual of the solve.
  drill:
    - text: |
        Seconds each.
    - question:
        id: drill-what
        type: choice
        system: s1
        prompt: |
          Implicit differentiation differentiates
        options: ['every step the solver took', 'the equation that the solution satisfies', 'the starting guess of the solver', 'the number of iterations']
        answer: 1
        explanation: The solver is only a means of finding the solution.
    - question:
        id: drill-formula
        type: choice
        system: s1
        prompt: |
          If $F(\mathbf{x}^\star(\boldsymbol\theta), \boldsymbol\theta) = \mathbf{0}$, then $d\mathbf{x}^\star/d\boldsymbol\theta =$
        options: ['$-F_{\mathbf{x}}^{-1}F_{\boldsymbol\theta}$', '$F_{\mathbf{x}}^{-1}F_{\boldsymbol\theta}$', '$-F_{\boldsymbol\theta}^{-1}F_{\mathbf{x}}$', '$F_{\mathbf{x}}F_{\boldsymbol\theta}$']
        answer: 0
        explanation: From $F_{\mathbf{x}}\,d\mathbf{x} + F_{\boldsymbol\theta}\,d\boldsymbol\theta = \mathbf{0}$.
    - question:
        id: drill-square
        type: numeric
        system: s1
        prompt: |
          $x(\theta)$ is the positive solution of $x^2 = \theta$. What is $dx/d\theta$ at $x = 0.5$?
        answer: "1"
        explanation: $2x\,x' = 1$, so $x' = 1/(2x)$.
    - question:
        id: drill-db
        type: choice
        system: s1
