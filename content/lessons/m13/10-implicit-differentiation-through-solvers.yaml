          For a fixed point $\mathbf{x}^\star = g(\mathbf{x}^\star, \boldsymbol\theta)$ with $J = \partial g/\partial\mathbf{x}$, $\ d\mathbf{x}^\star/d\boldsymbol\theta =$
        options: ['$J\,\partial g/\partial\boldsymbol\theta$', '$(I - J)^{-1}\,\partial g/\partial\boldsymbol\theta$', '$(I + J)^{-1}\,\partial g/\partial\boldsymbol\theta$', '$\partial g/\partial\boldsymbol\theta$']
        answer: 1
