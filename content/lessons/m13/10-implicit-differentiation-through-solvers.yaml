          The backward step through $\mathbf{x} = A^{-1}\mathbf{b}$ needs one linear solve with
        options: ['$A$', '$A^\top$', '$A^2$', '$A^{-1}$']
        answer: 1
        explanation: The adjoint equation $A^\top\boldsymbol\lambda = \bar{\mathbf{x}}$.
    - question:
        id: drill-solves
        type: numeric
        system: s1
        prompt: |
          A scalar loss depends on the solution of an equation with $10^6$ parameters. How many adjoint solves give its gradient with respect to all of them?
        answer: "1"
