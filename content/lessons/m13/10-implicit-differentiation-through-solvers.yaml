          import numpy as np


          def fixed_point(W, b):
              x = np.zeros(len(b))
              for step in range(200):
                  x = np.tanh(W @ x + b)
              return x


          def jacobian_b(W, b):
              x = fixed_point(W, b)
              D = np.diag(1 - x ** 2)
              return np.linalg.solve(np.eye(len(b)) - D @ W, D)


          W = np.array([[0.5, -0.3], [0.2, 0.4]])
          print([[round(float(c), 4) for c in row] for row in jacobian_b(W, np.array([0.3, -0.1]))])
