concept: m13.trace-identities-determinant-and-inverse-derivatives
minutes: 85
claim: You can derive the differential of a matrix inverse from the identity that defines it, derive the differential of the determinant and of its logarithm, read off the gradients of the determinant, the log-determinant, and scalar functions of an inverse, use the standard trace identities to bring any such differential to a form from which the gradient is read, and compute these gradients with linear solves in place of explicit inverses.
recalls: [m13.the-method-of-differentials]
uses: [m13.derivatives-with-respect-to-matrices, m13.derivatives-with-respect-to-vectors, m8.characteristic-polynomial, m8.eigenvalues-and-eigenvectors, m8.positive-definite-matrices-and-cholesky, m8.operator-and-frobenius-norms, m5.determinant, m5.identity-and-inverse, m5.transpose, m1.logarithms, m10.derivatives-of-exp-log-and-trig, e6.gradient-checking, e5.linear-algebra-routines, e5.einsum, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m13.jacobian-vector-and-vector-jacobian-products, m13.implicit-differentiation-through-solvers]
starter: |
  # Scratch space. Nudge each entry of X and measure the slope of the determinant.
  import numpy as np

  X = np.array([[2.0, 1.0], [3.0, 2.0]])
  h = 1e-6
  G = np.zeros((2, 2))
  for i in range(2):
      for j in range(2):
          E = np.zeros((2, 2))
          E[i, j] = h
          G[i, j] = (np.linalg.det(X + E) - np.linalg.det(X - E)) / (2 * h)
  print([[round(float(v), 4) for v in row] for row in G])
  print([[round(float(v), 4) for v in row] for row in np.linalg.inv(X)])
parts:
  recall:
    - text: |
        [[m13.the-method-of-differentials]] gave rules for sums, products and entry-by-entry functions, and left out two functions of a matrix that are neither: the inverse and the determinant. Today they get their rules. Three quick pulls first.
  puzzle:
    - text: |
        The determinant of $X = \begin{pmatrix} 2 & 1 \\ 3 & 2 \end{pmatrix}$ is 1. The starter nudges each of its four entries in turn, measures how fast the determinant changes, and lays the four slopes out in the shape of $X$. Below that it prints the inverse of $X$.

        ```
        [[2.0, -3.0], [-1.0, 2.0]]
        [[2.0, -1.0], [-3.0, 2.0]]
        ```

        The table of slopes of the determinant is the **inverse**, with rows and columns exchanged.

        Nothing about a determinant suggests an inverse. One measures volume, and the other undoes a map.

        **Why does the gradient of the determinant contain the inverse? And what is the derivative of the inverse itself, the matrix version of the rule that $1/x$ has derivative $-1/x^2$?**
  intuition:
    - text: |
        **The inverse first.** There is no formula for $X^{-1}$ to differentiate. But there is an equation it satisfies:

        $$X\,X^{-1} = I.$$

        Take the differential of both sides. The right side is constant. The left is a product:

        $$dX\,X^{-1} + X\,d(X^{-1}) = 0.$$

        Solve for the unknown differential by moving the first term over and multiplying by $X^{-1}$ on the left:

        $$d(X^{-1}) = -X^{-1}\,dX\,X^{-1}.$$

        For numbers this is $-dx/x^2$, the familiar rule. For matrices the two inverse factors sit on **either side** of $dX$ and cannot be gathered into $X^{-2}$.

        **The determinant.** Start near the identity. The determinant of $I + E$, for small $E$, is a sum of products of entries, one from each row and column. The product of the diagonal entries is $(1 + e_{11})(1 + e_{22})\cdots = 1 + (e_{11} + e_{22} + \dots) + \text{smaller}$. Every other product contains at least two off-diagonal entries of $E$, so it is second order. Hence

        $$\det(I + E) \approx 1 + \operatorname{tr}(E).$$

        Near the identity, the determinant changes by the trace. A small stretch along each axis changes the volume by the sum of the stretches.

        Now move to any invertible $X$ by factoring: $X + dX = X(I + X^{-1}dX)$. The determinant of a product is the product of the determinants, so

        $$\det(X + dX) \approx \det(X)\big(1 + \operatorname{tr}(X^{-1}dX)\big).$$

        There is the inverse: it is what converts a displacement of $X$ into a displacement **relative to** $X$. And in the standard form $\operatorname{tr}(G^\top dX)$ the gradient is $G = \det(X)\,X^{-\top}$, the inverse transposed, as the starter found.
  derivation:
    - text: |
        **Inverse.** For invertible $X$,

        $$d(X^{-1}) = -X^{-1}\,dX\,X^{-1}.$$

        *Proof.* Differentiate $XX^{-1} = I$ by the product rule, as above. $\blacksquare$

        **Determinant (Jacobi's formula).**

        $$d\det(X) = \det(X)\operatorname{tr}(X^{-1}dX), \qquad \nabla_X\det(X) = \det(X)\,X^{-\top}.$$

        *Proof.* $\det(X + dX) = \det(X)\det(I + X^{-1}dX)$ and $\det(I + E) = 1 + \operatorname{tr}(E) + O(\|E\|^2)$. For the last: if $E$ has eigenvalues $\mu_i$ then $I + E$ has eigenvalues $1 + \mu_i$, and $\prod(1 + \mu_i) = 1 + \sum\mu_i + \dots$ $\blacksquare$

        The matrix $\det(X)X^{-\top}$ is the matrix of cofactors. So this formula is the expansion of a determinant along a row, differentiated: the slope with respect to $X_{ij}$ is its cofactor.

        **Log-determinant.** By the scalar chain rule, for $\det X > 0$,

        $$d\log\det(X) = \frac{d\det X}{\det X} = \operatorname{tr}(X^{-1}dX), \qquad \nabla_X\log\det(X) = X^{-\top}.$$

        The factor $\det X$ has cancelled. This is the cleanest of the three, and the one used in practice. For symmetric $X$ the gradient is simply $X^{-1}$.

        **Scalar functions of an inverse.** Combine the inverse rule with the trace.

        - $f = \mathbf{a}^\top X^{-1}\mathbf{b}$: $\ df = -\mathbf{a}^\top X^{-1}dX\,X^{-1}\mathbf{b} = -\mathbf{u}^\top dX\,\mathbf{v}$ with $\mathbf{u} = X^{-\top}\mathbf{a}$ and $\mathbf{v} = X^{-1}\mathbf{b}$. A bilinear form, so $\nabla_Xf = -\mathbf{u}\mathbf{v}^\top = -X^{-\top}\mathbf{a}\mathbf{b}^\top X^{-\top}$.
        - $f = \operatorname{tr}(X^{-1}C)$: $\ df = -\operatorname{tr}(X^{-1}dX\,X^{-1}C) = -\operatorname{tr}(X^{-1}CX^{-1}dX)$, so $\nabla_Xf = -(X^{-1}CX^{-1})^\top$.

        *The puzzle.* $\det X = 1$ and $X^{-1} = \begin{pmatrix} 2 & -1 \\ -3 & 2 \end{pmatrix}$, so the gradient is $X^{-\top} = \begin{pmatrix} 2 & -3 \\ -1 & 2 \end{pmatrix}$. Directly, $\det X = x_{11}x_{22} - x_{12}x_{21}$, with partial derivatives $x_{22}, -x_{21}, -x_{12}, x_{11}$, which are $2, -3, -1, 2$.
    - question:
        id: derivation-det-slope
        type: numeric
        system: s2
        prompt: |
          $X = \begin{pmatrix} 2 & 0 \\ 0 & 5 \end{pmatrix}$. What is the slope of $\log\det X$ with respect to the entry $X_{11}$?
        answer: "0.5"
        explanation: |
          $\nabla\log\det X = X^{-\top} = \operatorname{diag}(\tfrac12, \tfrac15)$, so the slope is $0.5$. Directly: $\log\det X = \log x_{11} + \log x_{22}$ for a diagonal matrix, with derivative $1/x_{11}$. The slope of the determinant itself would be $\det(X)/x_{11} = 5$, the other diagonal entry. The off-diagonal slopes are zero here: to first order, turning on $x_{12}$ alone does not change the determinant of a diagonal matrix.
    - text: |
        **The trace identities,** collected. Each is the rearrangement that brings a differential to the form $\operatorname{tr}(G^\top dX)$.

        | $f(X)$ | $\nabla_Xf$ |
        |---|---|
        | $\operatorname{tr}(AX)$ | $A^\top$ |
        | $\operatorname{tr}(AXB)$ | $A^\top B^\top$ |
        | $\operatorname{tr}(X^\top AX)$ | $(A + A^\top)X$ |
        | $\operatorname{tr}(X^k)$ | $k(X^{k-1})^\top$ |
        | $\operatorname{tr}(AX^{-1})$ | $-X^{-\top}A^\top X^{-\top}$ |
        | $\det X$ | $\det(X)\,X^{-\top}$ |
        | $\log\det X$ | $X^{-\top}$ |

        **An application.** Given a symmetric positive definite matrix $C$, consider

        $$f(S) = \log\det S + \operatorname{tr}(S^{-1}C)$$

        over symmetric positive definite $S$. Then $df = \operatorname{tr}(S^{-1}dS) - \operatorname{tr}(S^{-1}CS^{-1}dS)$, so

        $$\nabla f = S^{-1} - S^{-1}CS^{-1}.$$

        Setting this to zero and multiplying by $S$ on both sides gives $S = C$. This function, up to constants, is the negative log-likelihood of a Gaussian model with covariance $S$ for data with sample covariance $C$. The calculation is the proof that the best-fitting covariance is the sample covariance.

        **The solution of a linear system.** If $\mathbf{x} = A^{-1}\mathbf{b}$, then $d\mathbf{x} = -A^{-1}dA\,A^{-1}\mathbf{b} + A^{-1}d\mathbf{b} = A^{-1}(d\mathbf{b} - dA\,\mathbf{x})$. The change of the solution is itself the solution of a system with the same matrix.

        **Computing.** None of these formulas should be coded with an explicit inverse. $X^{-1}\mathbf{b}$ is `np.linalg.solve(X, b)`, and $X^{-\top}\mathbf{a}$ is `np.linalg.solve(X.T, a)`. And $\log\det$ should not be computed as the logarithm of a determinant, which overflows or underflows for matrices of even moderate size. For positive definite $X = LL^\top$, $\log\det X = 2\sum_i\log L_{ii}$.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the derivation of the differential of the inverse of a matrix.
        steps:
          - 'Start from the identity $X\,X^{-1} = I$.'
          - 'Take differentials: the right side gives $0$.'
          - 'Apply the product rule to the left side: $dX\,X^{-1} + X\,d(X^{-1}) = 0$.'
          - 'Move the first term to the other side: $X\,d(X^{-1}) = -dX\,X^{-1}$.'
          - 'Multiply on the left by $X^{-1}$: $d(X^{-1}) = -X^{-1}\,dX\,X^{-1}$.'
        explanation: The inverse is differentiated through the equation that defines it, not through a formula for it.
  formal:
    - text: |
        **Inverse.** On the open set of invertible matrices, $X \mapsto X^{-1}$ is differentiable with $D(X^{-1})[H] = -X^{-1}HX^{-1}$. Second order: $(X + H)^{-1} = X^{-1} - X^{-1}HX^{-1} + X^{-1}HX^{-1}HX^{-1} - \dots$ (Neumann series, for $\|X^{-1}H\| < 1$).

        **Jacobi's formula.** $d\det X = \operatorname{tr}(\operatorname{adj}(X)\,dX)$ for every square $X$, where $\operatorname{adj}(X)$ is the adjugate, the transpose of the cofactor matrix. For invertible $X$, $\operatorname{adj}(X) = \det(X)X^{-1}$.

        **Expansion.** $\det(I + tA) = 1 + t\operatorname{tr}A + \tfrac{t^2}{2}\big((\operatorname{tr}A)^2 - \operatorname{tr}(A^2)\big) + O(t^3)$. $\ \det(e^{A}) = e^{\operatorname{tr}A}$.

        **Log-determinant.** $d\log|\det X| = \operatorname{tr}(X^{-1}dX)$. On symmetric positive definite matrices $\log\det$ is concave, with $\nabla\log\det X = X^{-1}$ and second differential $d^2\log\det X = -\operatorname{tr}(X^{-1}dX\,X^{-1}dX)$.

        **Inverse forms.**

        - $\nabla_X(\mathbf{a}^\top X^{-1}\mathbf{b}) = -X^{-\top}\mathbf{a}\mathbf{b}^\top X^{-\top}$.
        - $\nabla_X\operatorname{tr}(AX^{-1}B) = -(X^{-1}BAX^{-1})^\top$.
        - $\nabla_X\|X^{-1}\|_F^2 = -2X^{-\top}X^{-1}X^{-\top}$.

        **Eigenvalues.** For symmetric $X$ with a simple eigenvalue $\lambda$ and unit eigenvector $\mathbf{q}$: $d\lambda = \mathbf{q}^\top dX\,\mathbf{q}$, so $\nabla_X\lambda = \mathbf{q}\mathbf{q}^\top$.

        **Symmetric variables.** The formulas above treat all entries of $X$ as independent. If $X$ is constrained to be symmetric, only symmetric displacements are allowed, and the gradient within that space is the symmetric part $\tfrac12(G + G^\top)$ of the unconstrained gradient $G$.

        **Matrix determinant lemma.** $\det(X + \mathbf{u}\mathbf{v}^\top) = \det(X)(1 + \mathbf{v}^\top X^{-1}\mathbf{u})$, exactly. Its first-order part is Jacobi's formula for a rank-one displacement.
