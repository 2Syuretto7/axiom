        explanation: |
          A plain number is a constant: it does not move when the input is nudged, so it is lifted to a dual number with tangent 0. After that, the two formulas are all there is. `derivative` seeds the input with tangent 1, runs the function as it stands, and reads the tangent of the result.

          The function `f` was written for ordinary numbers. It works on dual numbers without change, because Python asks the objects themselves what `+` and `*` mean. This is **operator overloading**, the same mechanism your autograd engine used, but here each operation finishes its derivative work on the spot and leaves nothing behind.

          The first wrong version multiplies the tangents, which would say that the derivative of a product is the product of the derivatives. The second seeds the input with tangent 0, so it differentiates with respect to nothing and gets 0. The last gives constants a tangent of 1, as if they moved with the input.
    - question:
        id: write-jvp
        type: code
        mode: write
        system: s2
        prompt: |
          The class and a dual version of `tanh` are given. A function `f` takes a list of numbers and returns one number. Write `jvp(f, x, v)` returning the directional derivative of `f` at the list `x` along the list `v`, in **one** call of `f`. Then write `gradient(f, x)` returning the list of partial derivatives, using `jvp` once for each input.
        starter: |
          import numpy as np


          class Dual:
              def __init__(self, a, b=0.0):
                  self.a = a
                  self.b = b

              def __add__(self, other):
                  if not isinstance(other, Dual):
                      other = Dual(other)
                  return Dual(self.a + other.a, self.b + other.b)

              def __mul__(self, other):
                  if not isinstance(other, Dual):
                      other = Dual(other)
                  return Dual(self.a * other.a, self.a * other.b + self.b * other.a)

              def __radd__(self, other):
                  return self + other

              def __rmul__(self, other):
                  return self * other


          def tanh(x):
              t = float(np.tanh(x.a))
              return Dual(t, (1 - t * t) * x.b)


          def jvp(f, x, v):
              return 0.0


          def gradient(f, x):
              return [0.0 for value in x]


          def f(x):
              return tanh(x[0] * x[1]) + x[1] * x[2] * x[2]


          print(round(jvp(f, [0.5, 1.0, 2.0], [1.0, 0.0, -1.0]), 4))
