        explanation: |
          `jvp` turns each input into a dual number whose tangent is the matching entry of `v`, calls `f` once, and reads the tangent of the result. That tangent is $\nabla f \cdot \mathbf{v}$: the sum, over the inputs, of each partial derivative times the rate at which that input was told to move.

          `gradient` cannot do better than one pass per input, because one pass answers for one direction. Seeding $\mathbf{e}_i$ picks out the $i$-th partial derivative. For the three inputs here that is three calls. For a network with a million weights it would be a million, against one backward sweep.

          The third wrong version returns the right number, and calls `f` three times to get what one call provides. Seeding the whole direction at once is the point of a Jacobian-vector product.
