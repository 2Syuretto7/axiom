concept: m13.forward-mode-and-dual-numbers
minutes: 85
claim: You can compute with dual numbers, in which a new symbol has square zero, show that evaluating a function at such a number returns its value and its derivative together, implement them by operator overloading, recognise the second component as the tangent of the forward recursion, obtain a Jacobian-vector product in one pass with no stored values, count the passes a gradient or a Jacobian needs, and choose between forward and reverse mode from the numbers of inputs and outputs.
recalls: [m13.reverse-mode-differentiation-and-its-cost]
uses: [m13.computational-graphs, m13.jacobian-vector-and-vector-jacobian-products, m10.differentiation-rules, m10.chain-rule, m10.taylor-approximation, m10.derivatives-of-exp-log-and-trig, m12.directional-derivative, m12.jacobian, e1.classes-and-objects, e1.special-methods-and-operator-overloading, e6.scalar-computational-graph, e6.gradient-checking, e0.functions, e0.loops]
leads: [m13.hessian-vector-products]
starter: |
  # Scratch space. A number a + b*eps, where eps * eps counts as 0.
  class Dual:
      def __init__(self, a, b):
          self.a = a
          self.b = b

      def __add__(self, other):
          return Dual(self.a + other.a, self.b + other.b)

      def __mul__(self, other):
          return Dual(self.a * other.a, self.a * other.b + self.b * other.a)


  x = Dual(2.0, 1.0)
  y = x * x * x + x + x
  print(y.a, y.b)
parts:
  recall:
    - text: |
        [[m13.reverse-mode-differentiation-and-its-cost]] priced the backward sweep: a few evaluations for a whole gradient, paid for in memory. It left the mirror case, few inputs and many outputs, to the forward recursion. Today that recursion gets an implementation of a dozen lines. Three quick pulls first.
  puzzle:
    - text: |
        Invent a new number $\varepsilon$ with one rule: $\varepsilon^2 = 0$, although $\varepsilon$ itself is not 0. Compute with it as with any symbol.

        Take $f(x) = x^3 + 2x$ and evaluate it at $2 + \varepsilon$:

        $$(2 + \varepsilon)^3 + 2(2 + \varepsilon) = 8 + 12\varepsilon + 6\varepsilon^2 + \varepsilon^3 + 4 + 2\varepsilon = 12 + 14\varepsilon.$$

        Now $f(2) = 12$, and $f'(x) = 3x^2 + 2$ gives $f'(2) = 14$. Both numbers are sitting in the answer.

        The starter does the same with a class of twelve lines that knows only how to add and to multiply.

        ```
        12.0 14.0
        ```

        Nobody told the class the rule for differentiating a cube, or any rule of calculus at all.

        **Why does the coefficient of $\varepsilon$ come out as the derivative? And will it for every function, not only this polynomial?**
  intuition:
    - text: |
        A derivative answers the question: if the input moves by a tiny amount, how much does the output move, **to first order**? "To first order" means that the square of the tiny amount, and every higher power, is thrown away.

        The rule $\varepsilon^2 = 0$ does that throwing away automatically. Think of $\varepsilon$ as a nudge so small that its square is not worth recording. Then $a + b\varepsilon$ is a value $a$ together with a note saying "and I am moving at rate $b$". Arithmetic on such pairs keeps exact account of the first-order movement and discards the rest, at every step.

        Look at the product. $(a + b\varepsilon)(c + d\varepsilon) = ac + (ad + bc)\varepsilon + bd\,\varepsilon^2$, and the last term is zero. The coefficient $ad + bc$ **is the product rule**. Nobody put it there. It fell out of ordinary multiplication and the one new rule. The sum rule falls out of addition in the same way.

        Since every calculation is built from sums, products and a few simple functions, a program run on these pairs carries the derivative along beside the value, step by step, in the same order as the calculation.

        You have met the quantity in the second slot. It is the **tangent** $\dot v$ of [[m13.computational-graphs]]: the rate of each intermediate value with respect to the input that was nudged. Dual numbers are the forward recursion, implemented by changing what a number is.

        Compare with reverse mode. Nothing is stored for later, because each tangent is computed at the moment its value is. There is no tape and no backward sweep. The price is that one run follows **one** nudge: one direction in the space of inputs.
  derivation:
    - text: |
        **Dual numbers.** A dual number is $a + b\varepsilon$ with real $a$, $b$, and $\varepsilon^2 = 0$. Call $a$ the **value** and $b$ the **tangent**.

        $$(a + b\varepsilon) + (c + d\varepsilon) = (a + c) + (b + d)\varepsilon, \qquad (a + b\varepsilon)(c + d\varepsilon) = ac + (ad + bc)\varepsilon.$$

        **Division.** Multiply top and bottom by $c - d\varepsilon$, since $(c + d\varepsilon)(c - d\varepsilon) = c^2$:

        $$\frac{a + b\varepsilon}{c + d\varepsilon} = \frac ac + \frac{bc - ad}{c^2}\,\varepsilon \qquad (c \ne 0).$$

        That is the quotient rule.

        **Theorem.** For every polynomial $p$: $\;p(a + b\varepsilon) = p(a) + p'(a)\,b\,\varepsilon$.

        *Proof.* It holds for constants and for $p(x) = x$. If it holds for $p$ and $q$, it holds for $p + q$ by the sum formula, and for $pq$:

        $$\big(p(a) + p'(a)b\varepsilon\big)\big(q(a) + q'(a)b\varepsilon\big) = p(a)q(a) + \big(p(a)q'(a) + p'(a)q(a)\big)b\,\varepsilon = (pq)(a) + (pq)'(a)\,b\,\varepsilon.$$

        Every polynomial is built from constants and $x$ by sums and products. $\blacksquare$

        **Other functions.** For a differentiable $f$, the Taylor expansion $f(a + h) = f(a) + f'(a)h + \tfrac12f''(a)h^2 + \dots$ with $h = b\varepsilon$ loses every term from $h^2$ on. So we **define**

        $$f(a + b\varepsilon) = f(a) + f'(a)\,b\,\varepsilon,$$

        for example $e^{a + b\varepsilon} = e^a + e^ab\,\varepsilon$, $\ \sin(a + b\varepsilon) = \sin a + b\cos a\ \varepsilon$, $\ \tanh(a + b\varepsilon) = \tanh a + (1 - \tanh^2a)\,b\,\varepsilon$.

        **The chain rule comes free.** $g(f(a + b\varepsilon)) = g\big(f(a) + f'(a)b\varepsilon\big) = g(f(a)) + g'(f(a))\,f'(a)\,b\,\varepsilon$. So the rule $F(a + b\varepsilon) = F(a) + F'(a)b\varepsilon$ survives composition, and therefore holds for any program built from the elementary operations.

        **Reading off a derivative.** Seed the tangent with 1: $f(a + \varepsilon) = f(a) + f'(a)\varepsilon$.
    - question:
        id: derivation-product
        type: numeric
        system: s2
        prompt: |
          Multiply out $(3 + \varepsilon)(2 + 5\varepsilon)$. What is the coefficient of $\varepsilon$?
        answer: "17"
        explanation: |
          $3 \cdot 2 + (3 \cdot 5 + 1 \cdot 2)\varepsilon + 5\varepsilon^2 = 6 + 17\varepsilon$. The value is the product of the values, and the tangent is "first value times second tangent, plus first tangent times second value", which is the product rule for two quantities moving at rates 1 and 5.
    - text: |
        **Several inputs.** For $F: \mathbb{R}^n \to \mathbb{R}^m$, give input $i$ the dual number $x_i + v_i\varepsilon$. Then

        $$F(\mathbf{x} + \mathbf{v}\varepsilon) = F(\mathbf{x}) + J_F(\mathbf{x})\mathbf{v}\ \varepsilon.$$

        The tangents of the outputs are the **Jacobian-vector product** $J\mathbf{v}$, for whatever direction $\mathbf{v}$ was seeded. With $\mathbf{v} = \mathbf{e}_i$ this is column $i$ of the Jacobian. With $m = 1$ it is the directional derivative $\nabla f \cdot \mathbf{v}$.

        **Cost.** Each elementary operation on dual numbers does a bounded amount of extra arithmetic, so one pass costs at most about 3 evaluations of $F$, and in practice nearer 2. Memory is twice that of $F$: one tangent beside each live value. **Nothing is kept for later.**

        **How many passes.**

        | Wanted | Forward mode | Reverse mode |
        |---|---|---|
        | $J\mathbf{v}$ | 1 pass | $m$ sweeps |
        | $\mathbf{u}^\top J$ | $n$ passes | 1 sweep |
        | Full Jacobian | $n$ passes | $m$ sweeps |
        | Gradient ($m = 1$) | $n$ passes | 1 sweep |

        So forward mode is the choice when inputs are few, and reverse mode when outputs are few. For one input and a thousand outputs, such as the sensitivity of a whole simulation to one design parameter, forward mode needs one pass and no tape.

        **Compared with finite differences.** Both follow one direction per evaluation. But the dual number involves no step size and no subtraction of nearly equal values, so the result is exact to rounding. $\varepsilon$ is not a small number such as $10^{-8}$. It is a symbol, and $\varepsilon^2$ is exactly zero.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that a program run on dual numbers returns the derivative of the function it computes.
        steps:
          - 'Adding two dual numbers adds their tangents: the sum rule.'
          - 'Multiplying two dual numbers gives the tangent $ad + bc$, because $\varepsilon^2 = 0$: the product rule.'
          - 'Each elementary function is defined on dual numbers by $f(a + b\varepsilon) = f(a) + f''(a)b\varepsilon$.'
          - 'Composing two operations that obey this rule gives one that obeys it: the chain rule.'
          - 'A program is a composition of such operations, so seeded with tangent 1 it returns $F(a) + F''(a)\varepsilon$.'
        explanation: Each step of the program obeys the rule, and the rule survives composition.
  formal:
    - text: |
        **The algebra.** The dual numbers are $\mathbb{R}[\varepsilon]/(\varepsilon^2)$: a commutative ring, two-dimensional as a real vector space, with basis $1, \varepsilon$. It is **not a field**: $b\varepsilon$ has no inverse, and $\varepsilon \cdot \varepsilon = 0$ with $\varepsilon \ne 0$. $a + b\varepsilon$ is invertible exactly when $a \ne 0$.

        **Matrix model.** $a + b\varepsilon \mapsto \begin{pmatrix} a & b \\ 0 & a \end{pmatrix}$ respects sums and products, with $\varepsilon \mapsto N = \begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix}$, $N^2 = 0$. The matrix is a Jordan block, and $p\begin{pmatrix} a & 1 \\ 0 & a \end{pmatrix} = \begin{pmatrix} p(a) & p'(a) \\ 0 & p(a) \end{pmatrix}$.

        **Extension.** For $f$ differentiable at $a$: $f(a + b\varepsilon) := f(a) + f'(a)b\,\varepsilon$. For $F: \mathbb{R}^n \to \mathbb{R}^m$ differentiable at $\mathbf{x}$: $F(\mathbf{x} + \mathbf{v}\varepsilon) := F(\mathbf{x}) + DF(\mathbf{x})[\mathbf{v}]\,\varepsilon$. The chain rule is the statement that this extension respects composition.

        **Forward mode.** Running a trace on dual numbers is the tangent recursion $\dot v_i = \sum_{j \in \operatorname{pa}(i)}\frac{\partial\phi_i}{\partial v_j}\dot v_j$. $\operatorname{ops}(F, J_F\mathbf{v}) \le 3\operatorname{ops}(F)$, and memory at most twice that of $F$.

        **Vector tangents.** Carrying $k$ tangents at once, $a + \sum_{i=1}^kb_i\varepsilon_i$ with $\varepsilon_i\varepsilon_j = 0$, gives $k$ directions in one pass for about $1 + k$ times the cost. With $k = n$ and seeds $\mathbf{e}_i$ the whole Jacobian comes in one pass.

        **Higher order.** With $\varepsilon^{k+1} = 0$ in place of $\varepsilon^2 = 0$, $f(a + \varepsilon) = \sum_{j \le k}\frac{f^{(j)}(a)}{j!}\varepsilon^j$: truncated Taylor arithmetic. With two independent symbols, $\varepsilon_1^2 = \varepsilon_2^2 = 0$ and $\varepsilon_1\varepsilon_2 \ne 0$, the coefficient of $\varepsilon_1\varepsilon_2$ in $f(a + \varepsilon_1 + \varepsilon_2)$ is $f''(a)$.

        **Complex step.** For real-analytic $f$: $\ f'(a) = \operatorname{Im} f(a + ih)/h + O(h^2)$ with no subtraction, so $h = 10^{-20}$ is usable. It is dual arithmetic in which $i^2 = -1$ approximates $\varepsilon^2 = 0$.

        **Branches.** A program with tests on values is differentiated along the branch taken. The result is the derivative of that branch, which is the derivative of the function wherever the function agrees with the branch near the point.
