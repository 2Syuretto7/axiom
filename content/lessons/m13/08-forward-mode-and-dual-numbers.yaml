  work:
    - text: Slower now. First the class itself.
    - question:
        id: write-dual
        type: code
        mode: write
        system: s2
        prompt: |
          Complete the class `Dual` so that sums and products work between two dual numbers and between a dual number and a plain number on either side. Then write `derivative(f, x)` returning $f'(x)$ for a function `f` built from sums and products.
        starter: |
          class Dual:
              def __init__(self, a, b=0.0):
                  self.a = a
                  self.b = b

              def __add__(self, other):
                  return self

              def __mul__(self, other):
                  return self

              def __radd__(self, other):
                  return self + other

              def __rmul__(self, other):
                  return self * other


          def derivative(f, x):
              return 0.0


          print(derivative(lambda x: x * x * x + 2 * x, 2.0))
          print(derivative(lambda x: (x + 1) * (x + 1) * 0.5, 3.0))
        solution: |
          class Dual:
              def __init__(self, a, b=0.0):
                  self.a = a
                  self.b = b

              def __add__(self, other):
                  if not isinstance(other, Dual):
                      other = Dual(other)
                  return Dual(self.a + other.a, self.b + other.b)

              def __mul__(self, other):
                  if not isinstance(other, Dual):
                      other = Dual(other)
                  return Dual(self.a * other.a, self.a * other.b + self.b * other.a)

              def __radd__(self, other):
                  return self + other

              def __rmul__(self, other):
                  return self * other


          def derivative(f, x):
              return f(Dual(x, 1.0)).b


          print(derivative(lambda x: x * x * x + 2 * x, 2.0))
          print(derivative(lambda x: (x + 1) * (x + 1) * 0.5, 3.0))
        tests: |
          _y = Dual(2.0, 3.0) * Dual(5.0, 7.0)
          assert (_y.a, _y.b) == (10.0, 29.0), "(2 + 3 eps)(5 + 7 eps) is 10 + 29 eps: the tangent is 2 * 7 + 3 * 5"
          _s = Dual(2.0, 3.0) + 1.5
          assert (_s.a, _s.b) == (3.5, 3.0), "Adding the plain number 1.5 to 2 + 3 eps gives 3.5 + 3 eps. A plain number has tangent 0"
          _t = 4 * Dual(2.0, 3.0)
          assert (_t.a, _t.b) == (8.0, 12.0), "4 times 2 + 3 eps is 8 + 12 eps"
          assert derivative(lambda x: x * x, 3.0) == 6.0, "The derivative of x squared at 3 is 6"
          assert derivative(lambda x: 3 * x + 1, 7.0) == 3.0, "The derivative of 3x + 1 is 3 everywhere"
          assert derivative(lambda x: x * x * x + 2 * x, 2.0) == 14.0, "The derivative of x cubed plus 2x at 2 is 14. Seed the tangent with 1 and read the tangent of the result"
          assert derivative(lambda x: (x * x + 1) * (x * x * x + x), 1.0) == 12.0, "The derivative of (x^2 + 1)(x^3 + x) at 1 is 12"
          assert output.strip() == "14.0\n4.0", "The program should print 14.0 and then 4.0"
        wrong:
