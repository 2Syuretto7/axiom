        explanation: |
          The tangent of a quotient is $(bc - ad)/c^2$, the quotient rule, and the class had a plus sign where the minus belongs. It had copied the shape of the product rule.

          The minus sign can be checked without calculus: a dual number divided by itself must be exactly 1, with tangent 0, and $(bc - ad)/c^2$ with $a = c$, $b = d$ is 0. With the plus sign it is $2b/c$.

          Each elementary operation needs its rule written once, in one place. After that every function built from the operations is differentiated correctly, and a wrong rule makes every such function wrong, which is why a library tests each rule against finite differences.
    - question:
        id: work-which-mode
        type: choice
        system: s2
        prompt: |
          A simulation takes 3 design parameters and returns the temperature at 10 000 points. Its full Jacobian is wanted. Which mode, and how many passes?
        options:
          - 'Reverse mode, 1 sweep, since reverse mode is always cheaper.'
          - 'Forward mode, 3 passes: one per input, each giving a whole column of 10 000 derivatives, and no tape.'
          - 'Reverse mode, 3 sweeps.'
          - 'Forward mode, 10 000 passes.'
        answer: 1
        explanation: |
          Forward mode costs one pass per **input** and reverse mode one sweep per **output**. Here that is 3 against 10 000. Reverse mode's reputation comes from training, where the output is a single loss. With few inputs the count goes the other way, and forward mode has the further advantage of storing nothing, which matters for a long simulation. Rule of thumb: compare $n$ with $m$ and differentiate from the smaller side.
    - question:
        id: work-reciprocal
        type: numeric
        system: s2
        prompt: |
          Compute $\dfrac{1}{2 + \varepsilon}$ as a dual number $a + b\varepsilon$. What is $b$?
        answer: "-0.25"
        explanation: |
          Multiply top and bottom by $2 - \varepsilon$: the bottom becomes $4 - \varepsilon^2 = 4$, and the top is $2 - \varepsilon$, so the quotient is $0.5 - 0.25\varepsilon$. The value is $1/2$ and the tangent is the derivative of $1/x$ at 2, which is $-1/4$. Notice that the trick worked only because the value 2 is not zero: $1/\varepsilon$ does not exist, so the dual numbers are not a field.
    - question:
        id: work-branch
        type: choice
        system: s2
        prompt: |
          A program computes `x if x != 1.0 else 1.0`. As a function it is simply $f(x) = x$, with derivative 1 everywhere. What derivative does a run on dual numbers return at $x = 1$?
        options:
          - '1, since the function is $x$.'
          - '0, because at $x = 1$ the program takes the branch that returns a constant, and a constant has tangent 0.'
          - 'An error, since the function has a test in it.'
          - '0.5, the average of the two branches.'
        answer: 1
        explanation: |
          Automatic differentiation differentiates the **steps the program took**, not the function the program represents. At $x = 1$ those steps were "return the constant 1.0", whose tangent is 0. The same happens in reverse mode. The answer is right whenever the branch taken agrees with the function on a whole neighbourhood of the point, and can be wrong at the isolated points where a special case is handled separately. It is the reason a rectifier is given the slope 0 or 1 at exactly zero by convention, and a reason to be wary of hand-written special cases inside code that will be differentiated.
  connections:
    - text: |
        The coefficient of $\varepsilon$ is the derivative because $\varepsilon^2 = 0$ discards exactly what a derivative discards: everything beyond first order. Ordinary addition and multiplication of **dual numbers** $a + b\varepsilon$ are the sum and product rules, composition is the chain rule, and so any program run on them carries its derivative along. The second component is the tangent of the forward recursion.

        One pass gives a **Jacobian-vector product**, exactly, at about twice the cost of the function and with nothing stored. A gradient needs one pass per input, so forward mode suits few inputs and reverse mode few outputs.

        The two modes can also be combined. A gradient computed by reverse mode is itself a function of the inputs, and nudging those inputs with dual numbers differentiates it once more, in one direction. That gives the second derivative of a function of a million variables along any direction, without ever writing down its million-by-million Hessian: [[m13.hessian-vector-products]].
