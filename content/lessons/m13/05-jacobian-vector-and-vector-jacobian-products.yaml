    - question:
        id: work-which-mode
        type: choice
        system: s2
        prompt: |
          A model has $10^7$ parameters and a scalar loss. One evaluation of the loss takes one second. Roughly how long does the gradient take by JVPs, and by a VJP?
        options:
          - 'About the same either way.'
          - 'By JVPs, one per parameter: about $10^7$ seconds, some four months. By a VJP: one backward pass, a few seconds.'
          - 'By JVPs a few seconds, and by a VJP four months.'
          - 'Neither is feasible. Finite differences must be used.'
        answer: 1
        explanation: |
          Each JVP gives the derivative along one direction, so the full gradient needs one per parameter. A VJP with $u = 1$ at the scalar output gives all $10^7$ partial derivatives in one pass, at a small constant multiple of the cost of the loss. Finite differences cost the same as JVPs, one or two evaluations per parameter, and are inexact besides. This asymmetry, many inputs and one output, is the reason training neural networks is feasible at all, and the reason reverse mode is the default in every library.
    - question:
        id: work-few-inputs
        type: numeric
        system: s2
        prompt: |
          A simulation takes 3 design parameters and returns 500 measurements. Its full Jacobian is wanted. What is the smallest number of JVPs or VJPs that gives it?
        answer: "3"
        explanation: |
          Three JVPs, one for each input direction $\mathbf{e}_1, \mathbf{e}_2, \mathbf{e}_3$, give the three columns. By VJPs it would take 500. So forward mode is the right tool when a function has few inputs and many outputs. It also needs no stored intermediate values, which matters for a long simulation. A function from one input, such as time, to many outputs is the extreme case, where one JVP is the entire derivative.
    - question:
        id: work-dot-test
        type: choice
        system: s2
        prompt: |
          A new operation has been given a hand-written VJP. Its JVP has been verified against finite differences. Why is checking $\mathbf{u}^\top(J\mathbf{v}) = (J^\top\mathbf{u})^\top\mathbf{v}$ for a few random $\mathbf{u}$ and $\mathbf{v}$ a strong test of the VJP?
        options:
          - 'It is not: it tests only one entry of the Jacobian.'
          - 'The left side is known to be right. A random $\mathbf{u}$ and $\mathbf{v}$ excite every entry of the Jacobian at once, so any wrong entry of the implied $J^\top$ changes the right side, except by an accident of probability zero. A few random pairs test the whole linear map.'
          - 'Because the two sides are always equal, whatever the code does.'
          - 'Because random vectors are orthogonal.'
        answer: 1
        explanation: |
          If the routine implements some linear map $M$ in place of $J^\top$, the test compares $\mathbf{u}^\top J\mathbf{v}$ with $\mathbf{u}^\top M^\top\mathbf{v}$, and these agree for all $\mathbf{u}, \mathbf{v}$ only if $M^\top = J$. For random vectors a disagreement in any entry shows up. The test compares two numbers computed exactly, so it works to nearly machine precision, where a comparison with finite differences is limited to about six digits and needs a step size to be chosen. It is the standard way to validate a backward routine.
  connections:
    - text: |
        The million-by-million Jacobian is never built, because only its action on a vector is needed. From the right, $J\mathbf{v}$ pushes a displacement of the input forward to the output: a **JVP**. From the left, $J^\top\mathbf{u}$ pulls a sensitivity at the output back to the input: a **VJP**. For a linear map these are $A\mathbf{v}$ and $A^\top\mathbf{u}$, and for an elementwise function both are an entry-by-entry product.

        Through a composition the JVP runs in the order of the computation and the VJP in reverse, each at about the cost of the function. One VJP gives the gradient of a scalar. $n$ JVPs or $m$ VJPs give a full Jacobian. And $\mathbf{u}^\top(J\mathbf{v}) = (J^\top\mathbf{u})^\top\mathbf{v}$ tests one against the other.

        Today's compositions were chains: each step fed the next and nothing else. Real computations are not chains. A value is used in several places, and a step takes several values. Then "the order of the computation" and "the reverse order" need a precise meaning, and so does the rule for a value that is used twice. The structure that carries all this is one already built in code earlier in the course, and it is time to look at it as a mathematical object: [[m13.computational-graphs]].
