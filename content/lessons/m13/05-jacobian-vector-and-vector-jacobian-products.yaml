          assert _np.allclose(_J, _A), "For the linear map x -> A x the Jacobian is A. Each VJP with a basis vector is one row"
          assert len(_calls) == 2, "Use exactly m calls of vjp_fn, one per output"
          _B = _np.array([[1.0, 2.0], [0.0, 3.0]])
          assert _np.allclose(jacobian_from_vjps(lambda u: _B.T @ u, 2), _B), "For a square matrix that is not symmetric the Jacobian should be the matrix, not its transpose"
          _W = _np.random.default_rng(0).normal(size=(4, 6))
          _x = _np.random.default_rng(1).normal(size=6)
          _s = 1 - _np.tanh(_W @ _x) ** 2
          assert _np.allclose(jacobian_from_vjps(lambda u: _W.T @ (_s * u), 4), _np.diag(_s) @ _W), "For tanh(W x) with W of shape 4 by 6 the result should be diag(slope) W"
