        explanation: |
          $J^\top\mathbf{e}_i$ is the $i$th column of $J^\top$, which is the $i$th row of $J$. So the results are stacked as **rows**. Had the function been given as a JVP routine, the results $J\mathbf{e}_j$ would have been columns, and there would have been one per input.

          This is how a full Jacobian is obtained from an automatic differentiation library when it is really needed, and why the cost is counted in passes: here $m$ backward passes. For a network with a million parameters and a scalar loss, $m = 1$.

          It is also a way to **see** a Jacobian while debugging, at small sizes, and compare it with one built from finite differences.
