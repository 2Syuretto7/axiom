concept: m13.reverse-mode-differentiation-and-its-cost
minutes: 90
claim: You can describe reverse-mode differentiation as a forward sweep that records values followed by a backward sweep that accumulates adjoints, state and justify that the whole gradient of a scalar function costs a small constant multiple of one evaluation whatever the number of inputs, compare this with finite differences and with forward mode, explain why the price is memory proportional to the length of the calculation, name the remedies, and predict from the norms of the layer Jacobians whether a backward signal will vanish or explode.
recalls: [m13.computational-graphs]
uses: [m13.jacobian-vector-and-vector-jacobian-products, m13.derivatives-with-respect-to-matrices, m13.the-method-of-differentials, m8.operator-and-frobenius-norms, m8.singular-value-decomposition, m12.gradient, e6.reverse-mode-on-scalars, e6.topological-ordering-of-the-graph, e6.tensor-valued-autograd, e6.memory-planning-and-in-place-operations, e6.gradient-checking, e1.complexity-and-big-o, e3.dynamic-programming, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m13.forward-mode-and-dual-numbers, m13.hessian-vector-products, m13.gradients-of-common-neural-network-layers]
starter: |
  # Scratch space. f(x) = x1 * x2 * ... * xn. Count the multiplications needed for
  # all n partial derivatives, done one at a time and done by one backward sweep.
  def one_at_a_time(n):
      count = 0
      for i in range(n):
          count += n - 2          # the product of the other n - 1 numbers
      return count


  def one_sweep(n):
      count = n - 1               # forward: the running products
      for i in range(n):
          count += 2              # backward: two multiplications per input
      return count


  for n in [10, 100, 1000]:
      print(n, one_at_a_time(n), one_sweep(n))
parts:
  recall:
    - text: |
        [[m13.computational-graphs]] turned the sum over all paths into a recursion that uses each arrow once, and left open what the backward recursion really costs. Today that cost is counted, in time and in memory. Three quick pulls first.
  puzzle:
    - text: |
        Let $f(x_1, \dots, x_n) = x_1x_2\cdots x_n$, the product of $n$ numbers. One evaluation costs $n - 1$ multiplications.

        The partial derivative with respect to $x_i$ is the product of all the **other** numbers. Computing each of these separately costs $n - 2$ multiplications, and there are $n$ of them: about $n^2$ in all. Dividing the full product by $x_i$ would be quicker, but fails as soon as one of the numbers is zero.

        The starter counts multiplications for that method, and for a single backward sweep over the graph of the calculation.

        ```
        10 80 29
        100 9800 299
        1000 998000 2999
        ```

        The backward sweep gets all $n$ partial derivatives with about $3n$ multiplications: three times the cost of evaluating the function once. For a thousand inputs that is 300 times less work than computing them one at a time, with no division.

        **Is it a peculiarity of this function that the whole gradient costs only about three evaluations? If it is general, what is the catch?**
  intuition:
    - text: |
        It is general, and it is one of the most consequential facts in computing.

        Think of the calculation as a list of elementary steps, each an addition, a multiplication, or a simple function, with one or two arguments. The backward sweep visits each step once. For a step with two arguments it does two things: multiply the step's adjoint by each local slope, and add each result to an argument's adjoint. That is a fixed, small amount of work per step, comparable to the step itself.

        So the backward sweep costs a few times as much as the forward calculation. The number of inputs appears nowhere in that count. The inputs are just the nodes where the sweep stops, and their adjoints are complete when it gets there. A gradient with respect to a million inputs is a by-product of one pass.

        Compare the alternatives. Finite differences need one extra evaluation of the function for each input. So does the forward recursion: one pass per input. For a loss with a million parameters, that is the difference between a few evaluations and a million.

        For the product, the sweep works like this. Going forward, the running products $x_1,\ x_1x_2,\ x_1x_2x_3, \dots$ are computed and kept. Going backward, the adjoint arriving at step $i$ is the product of everything **after** $x_i$, and the stored running product is everything **before** it. One multiplication joins them into the partial derivative. Nobody had to think of that scheme. It is what the adjoint recursion does to this graph.

        **The catch** is in the words "and kept". The backward sweep needs the values from the forward calculation, in reverse order. They must all be stored until it gets back to them. The function could be evaluated with a single running number in memory. Its gradient needs $n$ of them. Reverse mode trades memory for time.
  derivation:
    - text: |
        **The algorithm.** For a scalar function given as a trace $v_i = \phi_i(v_{\operatorname{pa}(i)})$:

        1. *Forward sweep.* Evaluate the steps in order. Record, for each step, what its local slopes will need.
        2. *Seed.* Set $\bar v_N = 1$ and every other adjoint to 0.
        3. *Backward sweep.* For $i = N, N - 1, \dots$: for each parent $j$ of $i$, add $\bar v_i\,\partial\phi_i/\partial v_j$ to $\bar v_j$.
        4. The adjoints of the inputs are the gradient.

        **Theorem (cheap gradient principle).** If $f: \mathbb{R}^n \to \mathbb{R}$ is evaluated by a trace of elementary operations, then its gradient can be computed with at most a small constant multiple of the operations of $f$, typically between 3 and 5. The constant does not depend on $n$.

        *Why.* Take an operation with at most two arguments. In the backward sweep it costs at most two multiplications and two additions, plus the evaluation of its local slopes, which for the usual operations is at most as costly as the operation itself: for a product they are the two operands, already at hand. Summing over the operations bounds the backward sweep by a constant times the forward one. $\blacksquare$

        **In comparison,** for $f: \mathbb{R}^n \to \mathbb{R}^m$, in units of one evaluation of $f$:

        | Method | Gradient ($m = 1$) | Full Jacobian |
        |---|---|---|
        | Finite differences | $n + 1$, inexact | $n + 1$, inexact |
        | Forward mode | about $n$ | about $n$ |
        | Reverse mode | about 3 to 5 | about $m$ times that |

        Reverse mode wins whenever there are many inputs and few outputs, which is the situation of every training loss.

        **Memory.** The backward sweep reads the forward values in reverse order, so they must be kept. The memory needed is proportional to the **number of operations** of $f$, whereas $f$ alone may need very little. For a loop of $T$ steps acting on a state of size $s$: the forward calculation needs memory $s$, and reverse mode needs about $Ts$.

        What exactly must be kept depends on the operation. A sum needs nothing. A product needs both operands. $\tanh$ needs only its own output, and a rectifier only the signs of its input.
    - question:
        id: derivation-memory
        type: numeric
        system: s2
        prompt: |
          A simulation advances a state of 1 megabyte through 10 000 time steps, overwriting the state each time. Reverse mode must keep every state. About how many gigabytes is that? Take 1000 megabytes to the gigabyte.
        answer: "10"
        explanation: |
          $10\,000 \times 1$ MB $= 10\,000$ MB $= 10$ GB, for a calculation that by itself needs 1 MB. The time cost is still only a few evaluations. This is the usual shape of the trade: a network of 100 layers must hold the activations of all 100 layers for the batch until the backward pass has used them, and it is these stored activations, not the weights, that usually fill the memory during training.
    - text: |
        **Reducing the memory.**

        - *Checkpointing.* Keep only some of the states, say every $\sqrt T$-th. In the backward sweep, recompute each stretch from its checkpoint when it is needed. Memory falls from $T$ states to about $2\sqrt T$, for roughly one extra forward calculation. Choosing checkpoints recursively brings the memory down to about $\log T$ states for a factor $\log T$ in time.
        - *Reversible steps.* If each step can be undone exactly, the previous state can be recomputed from the next, and nothing need be kept.
        - *Truncation.* Sweep back only through the last $k$ steps. This is cheaper and no longer exact.

        **Several outputs.** One backward sweep handles one seed. For $m$ outputs, $m$ sweeps give the Jacobian, each reusing the same stored forward values.

        **The size of the signal.** For a chain of layers the backward sweep computes $\bar{\mathbf{u}}_0 = J_1^\top J_2^\top\cdots J_k^\top\bar{\mathbf{u}}_k$. By the product inequality for the spectral norm,

        $$\|\bar{\mathbf{u}}_0\| \le \|J_1\|_2\,\|J_2\|_2\cdots\|J_k\|_2\ \|\bar{\mathbf{u}}_k\|.$$

        If every layer Jacobian has norm at most $0.8$, then after 50 layers the gradient has shrunk by at least $0.8^{50} \approx 10^{-5}$: a **vanishing gradient**. If the layers stretch the signal by $1.25$ each, it grows by $1.25^{50} \approx 70\,000$: an **exploding gradient**. Reverse mode computes the gradient exactly in both cases. It is the gradient itself that is tiny or huge. Keeping the singular values of the layer Jacobians near 1, by initialisation, normalisation and skip connections, is what makes deep networks trainable.

        **Rounding.** Unlike finite differences, reverse mode involves no small step and no subtraction of nearly equal numbers. Its result is accurate to about the same relative precision as the function value.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that the gradient costs a constant multiple of the function, whatever the number of inputs.
        steps:
          - 'Write the calculation as a list of elementary operations, each with at most two arguments.'
          - 'The backward sweep visits each operation exactly once.'
          - 'At each visit it does at most two multiplications and two additions, plus the local slopes, which cost no more than the operation.'
          - 'So the backward sweep costs at most a fixed multiple of the forward calculation.'
          - 'The inputs are merely where the sweep ends, so their number does not enter the count.'
        explanation: A bounded amount of work for each elementary operation, and nothing for each input.
  formal:
    - text: |
        **Complexity (Baur-Strassen; Griewank).** Let $\operatorname{ops}(f)$ be the number of elementary operations in a trace of $f: \mathbb{R}^n \to \mathbb{R}$. Then $\operatorname{ops}(f, \nabla f) \le \omega\operatorname{ops}(f)$ with a constant $\omega \le 5$ depending only on the set of elementary operations and on how memory access is counted. For $F: \mathbb{R}^n \to \mathbb{R}^m$: $\operatorname{ops}(F, \mathbf{u}^\top J_F) \le \omega\operatorname{ops}(F)$ for any $\mathbf{u}$.

        **Forward mode.** $\operatorname{ops}(F, J_F\mathbf{v}) \le \omega'\operatorname{ops}(F)$ with $\omega' \le 3$, and memory at most twice that of $F$.

        **Memory.** $\operatorname{mem}(f, \nabla f) = O(\operatorname{ops}(f))$ without checkpointing.

        **Checkpointing.** For a chain of $T$ steps with $c$ checkpoints and at most $r$ recomputations of any step, the longest reversible chain has length $\binom{c + r}{c}$ (binomial, or revolve, schedule). With $c = r = \log_2T$: memory and time overhead both $O(\log T)$.

        **Adjoint of a recurrence.** For $\mathbf{h}_t = F(\mathbf{h}_{t-1}, \boldsymbol\theta)$, $t = 1..T$, and loss $L(\mathbf{h}_T)$:

        $$\bar{\mathbf{h}}_T = \nabla L, \qquad \bar{\mathbf{h}}_{t-1} = \Big(\frac{\partial F}{\partial\mathbf{h}}\Big)^{\!\top}\bar{\mathbf{h}}_t, \qquad \bar{\boldsymbol\theta} = \sum_{t=1}^T\Big(\frac{\partial F}{\partial\boldsymbol\theta}\Big)^{\!\top}\bar{\mathbf{h}}_t,$$

        with every Jacobian evaluated at $(\mathbf{h}_{t-1}, \boldsymbol\theta)$.

        **Norm of the backward signal.** $\prod_t\sigma_{\min}(J_t)\,\|\bar{\mathbf{h}}_T\| \le \|\bar{\mathbf{h}}_0\| \le \prod_t\sigma_{\max}(J_t)\,\|\bar{\mathbf{h}}_T\|$. For orthogonal $J_t$ the norm is preserved exactly.

        **Optimal accumulation.** Forward and reverse are the two extreme orders of multiplying out $J_k\cdots J_1$. Finding the cheapest order for a general graph (optimal Jacobian accumulation) is NP-hard.

        **What must be stored.**

        | Operation | Needed by its backward step |
        |---|---|
        | $a + b$ | nothing |
        | $a \cdot b$, $AB$ | both operands |
        | $\tanh(a)$, $e^a$, $\sigma(a)$ | the output |
        | $\max(0, a)$ | the sign of $a$ |
        | $a^2$, $\log a$, $1/a$ | the input, or the output for $1/a$ |
