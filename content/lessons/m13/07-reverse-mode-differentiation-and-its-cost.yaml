    - question:
        id: predict-product
        type: predict
        system: s1
        prompt: The gradient of a product of four numbers by one forward and one backward sweep. What does this show?
        code: |
          x = [2.0, 3.0, 0.5, 4.0]
          before = [1.0]
          for i in range(3):
              before.append(before[-1] * x[i])
          after = 1.0
          grad = [0.0, 0.0, 0.0, 0.0]
          for i in [3, 2, 1, 0]:
              grad[i] = before[i] * after
              after = after * x[i]
          print(before)
          print(grad)
        output: |
          [1.0, 2.0, 6.0, 3.0]
          [6.0, 4.0, 24.0, 3.0]
        explanation: The forward sweep keeps the product of everything before each number. The backward sweep carries the product of everything after it, and joins the two with one multiplication. Each partial derivative is the product of the other three numbers, and no division was used.
    - question:
        id: predict-signal
        type: predict
        system: s1
        prompt: A backward signal passed through 50 layers whose Jacobians are 0.8 times, and then 1.25 times, an orthogonal matrix. What does this show?
        code: |
          import numpy as np

          Q = np.linalg.qr(np.random.default_rng(0).normal(size=(4, 4)))[0]
          for scale in [0.8, 1.25]:
              u = np.ones(4) / 2
              for layer in range(50):
                  u = (scale * Q).T @ u
              print(scale, round(float(np.log10(np.linalg.norm(u))), 2))
        output: |
          0.8 -4.85
          1.25 4.85
        explanation: The signal starts with length 1. With every singular value 0.8 it shrinks by 0.8 at each layer, to about ten to the power minus 4.85. With 1.25 it grows by the same factor. The gradient is computed exactly in both cases, and is simply that small or that large.
  work:
    - text: Slower now. The first task is the puzzle's sweep.
    - question:
        id: write-product
        type: code
        mode: write
        system: s2
        prompt: |
          Write `grad_product(x)` returning the list of partial derivatives of $x_1x_2\cdots x_n$ for a list `x` of at least two floats. Use one forward sweep and one backward sweep, with a number of multiplications proportional to `n`, and no division.
        starter: |
          def grad_product(x):
              return [0.0 for value in x]


          print(grad_product([2.0, 3.0, 0.5, 4.0]))
          print(grad_product([2.0, 0.0, 5.0]))
        solution: |
          def grad_product(x):
              n = len(x)
              before = [1.0]
              for i in range(n - 1):
                  before.append(before[-1] * x[i])
              after = 1.0
              grad = [0.0 for value in x]
              for i in range(n - 1, -1, -1):
                  grad[i] = before[i] * after
                  after = after * x[i]
              return grad


          print(grad_product([2.0, 3.0, 0.5, 4.0]))
          print(grad_product([2.0, 0.0, 5.0]))
        tests: |
          assert "/" not in source, "Do not divide: the method must work when an entry is zero"
          assert grad_product([2.0, 3.0, 0.5, 4.0]) == [6.0, 4.0, 24.0, 3.0], "For (2, 3, 0.5, 4) each partial derivative is the product of the other three: 6, 4, 24, 3"
          assert grad_product([2.0, 0.0, 5.0]) == [0.0, 10.0, 0.0], "For (2, 0, 5) the partial derivatives are 0, 10, 0. Only the derivative with respect to the zero entry is nonzero"
          assert grad_product([3.0, 7.0]) == [7.0, 3.0], "For two numbers each partial derivative is the other number"
          assert grad_product([0.0, 0.0, 4.0]) == [0.0, 0.0, 0.0], "With two zero entries every partial derivative is zero"
          _calls = []
          class _Num:
              def __init__(self, v):
                  self.v = v
              def __mul__(self, other):
                  _calls.append(1)
                  return _Num(self.v * (other.v if isinstance(other, _Num) else other))
              def __rmul__(self, other):
                  _calls.append(1)
                  return _Num(self.v * other)
          _out = grad_product([_Num(float(i + 1)) for i in range(200)])
          assert len(_calls) <= 4 * 200, "For 200 numbers use at most a few hundred multiplications, not tens of thousands. Keep the running products from the forward sweep"
          assert output.strip() == "[6.0, 4.0, 24.0, 3.0]\n[0.0, 10.0, 0.0]", "The program should print [6.0, 4.0, 24.0, 3.0] and then [0.0, 10.0, 0.0]"
        wrong:
          - |
            def grad_product(x):
                n = len(x)
                grad = []
                for i in range(n):
                    p = 1.0
                    for j in range(n):
                        if j != i:
                            p = p * x[j]
                    grad.append(p)
                return grad

            print("[6.0, 4.0, 24.0, 3.0]\n[0.0, 10.0, 0.0]")
          - |
            def grad_product(x):
                n = len(x)
                before = [1.0]
                for i in range(n - 1):
                    before.append(before[-1] * x[i])
                after = 1.0
                grad = [0.0 for value in x]
                for i in range(n - 1, -1, -1):
                    after = after * x[i]
                    grad[i] = before[i] * after
                return grad

            print("[6.0, 4.0, 24.0, 3.0]\n[0.0, 10.0, 0.0]")
          - |
            def grad_product(x):
                n = len(x)
                before = [1.0]
                for i in range(n - 1):
                    before.append(before[-1] * x[i])
                return before

            print("[6.0, 4.0, 24.0, 3.0]\n[0.0, 10.0, 0.0]")
        explanation: |
          `before[i]` is the product of the entries before position `i`, kept from the forward sweep. `after` is the product of the entries behind it, built up during the backward sweep. Their product is the partial derivative. The order of the two lines in the backward loop matters: the derivative is formed **before** `after` absorbs `x[i]`.

          This is exactly what the adjoint recursion does on the chain $p_i = p_{i-1}x_i$. The adjoint of $p_i$ is the product of the later entries, and the local slope of $p_i$ with respect to $x_i$ is $p_{i-1}$, a stored forward value.

          The first wrong version is correct and takes about $n^2$ multiplications. The test counts them, using numbers that record each multiplication. For 200 entries it uses 39 600 where 600 suffice.
    - question:
        id: write-chain
        type: code
        mode: write
        system: s2
        prompt: |
          A network applies $\mathbf{h}_i = \tanh(W_i\mathbf{h}_{i-1})$ for each matrix in the list `Ws`, starting from $\mathbf{h}_0 = \mathbf{x}$, and its loss is $\tfrac12\|\mathbf{h}_k\|^2$. Write `grad_input(Ws, x)` returning the gradient of the loss with respect to `x`. Keep the outputs of the layers on the way forward and use them on the way back.
        starter: |
          import numpy as np


          def grad_input(Ws, x):
              return x * 0.0


          W1 = np.array([[1.0, -1.0], [0.5, 1.0], [2.0, 0.0]])
          W2 = np.array([[1.0, 0.0, -1.0], [0.5, 0.5, 0.5]])
          print([round(float(v), 4) for v in grad_input([W1, W2], np.array([0.3, -0.2]))])
        solution: |
          import numpy as np


          def grad_input(Ws, x):
              outputs = []
              h = x
              for W in Ws:
                  h = np.tanh(W @ h)
                  outputs.append(h)
              u = h
              for i in range(len(Ws) - 1, -1, -1):
                  u = Ws[i].T @ ((1 - outputs[i] ** 2) * u)
              return u


          W1 = np.array([[1.0, -1.0], [0.5, 1.0], [2.0, 0.0]])
          W2 = np.array([[1.0, 0.0, -1.0], [0.5, 0.5, 0.5]])
          print([round(float(v), 4) for v in grad_input([W1, W2], np.array([0.3, -0.2]))])
        tests: |
          import numpy as _np
          def _loss(Ws, x):
              h = x
              for W in Ws:
                  h = _np.tanh(W @ h)
              return 0.5 * float(h @ h)
          def _num(Ws, x):
              return _np.array([(_loss(Ws, x + 1e-6 * e) - _loss(Ws, x - 1e-6 * e)) / 2e-6 for e in _np.eye(len(x))])
          _W1 = _np.array([[1.0, -1.0], [0.5, 1.0], [2.0, 0.0]])
          _W2 = _np.array([[1.0, 0.0, -1.0], [0.5, 0.5, 0.5]])
          _x = _np.array([0.3, -0.2])
          _g = grad_input([_W1, _W2], _x)
          assert _np.shape(_g) == (2,), "The gradient has the shape of x"
          assert _np.allclose(_g, _num([_W1, _W2], _x), atol=1e-6), "For the two layers of the program the gradient should agree with central differences, about (0.5289, 0.0960)"
          assert _np.allclose(grad_input([_W1], _x), _num([_W1], _x), atol=1e-6), "For a single layer the gradient should agree with central differences"
          _rng = _np.random.default_rng(0)
          _Ws = [_rng.normal(size=(3, 3)) * 0.7 for _k in range(4)]
          _y = _rng.normal(size=3)
          assert _np.allclose(grad_input(_Ws, _y), _num(_Ws, _y), atol=1e-6), "For four square layers the gradient should agree with central differences. Each layer's slope is taken at that layer's own output, and the layers are visited last to first"
          assert output.strip() == "[0.5289, 0.096]", "The program should print [0.5289, 0.096]"
        wrong:
          - |
            import numpy as np


            def grad_input(Ws, x):
