        explanation: |
          The tape had one more entry than there are layers, because it began with the input. So the output of layer `i` is `tape[i + 1]`, and the code read `tape[i]`, the layer's input. It took the slope of each $\tanh$ at the wrong value: one position too early.

          With square layers every vector on the tape has the same length, so nothing complained. With layers of different widths the entry-by-entry product would have had mismatched lengths and failed at once.

          An index that is off by one position on the tape is the characteristic bug of hand-written backward passes. The forward sweep and the backward sweep must agree, for every step, on which stored value belongs to it. Libraries avoid the problem by having each operation store what it needs on its own node of the graph, at the moment it runs.
    - question:
        id: work-independent-of-n
        type: choice
        system: s2
        prompt: |
          Doubling the number of parameters of a model roughly doubles the cost of evaluating its loss. What happens to the cost of the gradient **relative to** the cost of the loss, for reverse mode and for finite differences?
        options:
          - 'Both ratios stay the same.'
          - 'For reverse mode the ratio stays the same, a small constant. For finite differences it doubles, since one more evaluation is needed for every added parameter.'
          - 'Both ratios double.'
          - 'For reverse mode the ratio doubles, and for finite differences it stays the same.'
        answer: 1
        explanation: |
          Reverse mode costs a constant multiple of the calculation, whatever the calculation is. Finite differences cost $n + 1$ evaluations, so their ratio is $n + 1$ and grows with the model. Put together: with reverse mode the gradient of a model twice as large costs twice as much, and with finite differences four times as much. At $10^9$ parameters the ratio between the two methods is $10^9$. No other single algorithmic fact matters more to machine learning.
    - question:
        id: work-checkpoint
        type: numeric
        system: s2
        prompt: |
          A recurrence of 10 000 steps is differentiated in reverse with a checkpoint kept every 100 steps, and each stretch of 100 steps recomputed and stored only while the backward sweep is inside it. About how many states are held in memory at the worst moment?
        answer: "200"
        explanation: |
          There are 100 checkpoints, and while one stretch is being reversed its 100 states are held as well: about 200 in all, against 10 000 without checkpointing. The price is that every stretch is run forward twice, once in the original pass and once when it is recomputed, so the forward work roughly doubles. With $T$ steps and a checkpoint every $\sqrt T$, memory is about $2\sqrt T$ states. This is the general pattern of the remedies: reverse mode's memory can be reduced a great deal for a modest factor in time.
    - question:
        id: work-explode
        type: choice
        system: s2
        prompt: |
          A recurrent network applies the same matrix $W$ at each of 200 steps, with no nonlinearity. The largest singular value of $W$ is $1.05$ and its other singular values are below 1. What happens to a gradient passed back through all 200 steps?
        options:
          - 'It keeps its size, since $1.05$ is close to 1.'
          - 'Its component along the top singular direction can grow by up to $1.05^{200} \approx 17\,000$ while the other components shrink, so the gradient is dominated by one direction and is very large. Clipping the norm of the gradient, or keeping $W$ close to orthogonal, controls it.'
          - 'It vanishes, since most singular values are below 1.'
          - 'It becomes exactly zero after 200 steps.'
        answer: 1
        explanation: |
          The backward signal is $(W^\top)^{200}\bar{\mathbf{u}}$, and its size is bounded by $\sigma_1^{200}$. What the powers really do is governed by the eigenvalues, but for a matrix that is close to normal the two agree, and a factor only 5% above 1 compounds to four orders of magnitude over 200 steps. A factor 5% below 1 would compound to $0.95^{200} \approx 0.00004$. The window in which a long product of Jacobians neither explodes nor vanishes is narrow, which is why long recurrences are hard to train and why architectures add paths along which the Jacobian is close to the identity.
  connections:
    - text: |
        The product of $n$ numbers has a gradient that costs three evaluations, and that is the rule, not an exception. **Reverse mode** runs the calculation forward, keeping its values, and then sweeps backward once, doing a bounded amount of work per elementary operation. The whole gradient of a scalar function costs a small constant multiple of the function, **whatever the number of inputs**. Finite differences and forward mode both cost one pass per input.

        The price is memory: every value the backward sweep will need must be kept, so memory grows with the length of the calculation. Checkpointing recovers most of it for a modest factor in time. And the gradient that comes back is a product of transposed Jacobians, whose size is governed by their singular values, so it can vanish or explode with depth.

        Reverse mode is the right tool for many inputs and one output. The mirror case, few inputs and many outputs, calls for the forward recursion, which needs no stored values at all. There is a remarkably neat way to implement it, by extending the number system itself so that every number carries its own derivative along: [[m13.forward-mode-and-dual-numbers]].
