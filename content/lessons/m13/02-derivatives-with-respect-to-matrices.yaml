          $\mathbf{x}\mathbf{r}^\top$ is the transpose of the right answer $\mathbf{r}\mathbf{x}^\top$. Row $i$ of the gradient belongs to output $i$, so the error must index the rows and the input the columns.

          For a layer with different numbers of inputs and outputs the wrong order has the wrong shape, and the update `W - rate * grad` fails at once. This layer is square, so the wrong order has the right shape, and training would proceed with a transposed gradient. A descent step along a transposed gradient is, in general, not a descent direction at all.

          The check in the program is what found it: six lines that nudge every weight, written once and reused for every layer.
    - question:
        id: work-rank
        type: choice
        system: s2
        prompt: |
          A linear layer with a $512 \times 512$ weight matrix is trained on a batch of 8 examples. What can be said about the gradient of the loss with respect to its weights?
        options:
          - 'It is a full-rank $512 \times 512$ matrix.'
          - 'It is a sum of 8 outer products, one per example, so it has rank at most 8. The update changes the weights only in an 8-dimensional family of directions.'
          - 'It has rank exactly 512.'
          - 'It is the zero matrix.'
        answer: 1
        explanation: |
          $\nabla_W = \sum_i\boldsymbol\delta_i\mathbf{x}_i^\top$, and a sum of 8 matrices of rank 1 has rank at most 8. So of the 262 144 numbers in the gradient, only $8 \times (512 + 512)$ are independent. This is not an approximation: it holds for any loss, by the formula $\boldsymbol\delta\mathbf{x}^\top$. It is why the gradient of one example can be stored as two vectors, and one of the reasons low-rank updates to large weight matrices work as well as they do.
    - question:
        id: work-trace-gradient
        type: numeric
        system: s2
        prompt: |
          $f(W) = \operatorname{tr}(W^\top W)$ and $W = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$. What is the entry in row 2, column 1 of $\nabla_Wf$?
        answer: "6"
        explanation: |
          $\operatorname{tr}(W^\top W) = \|W\|_F^2 = \sum w_{ij}^2$, and its gradient is $2W = \begin{pmatrix} 2 & 4 \\ 6 & 8 \end{pmatrix}$. The entry is $2 \times 3 = 6$. By the method: the linear part of $\operatorname{tr}((W + H)^\top(W + H))$ is $\operatorname{tr}(W^\top H) + \operatorname{tr}(H^\top W) = 2\operatorname{tr}(W^\top H)$, using that a matrix and its transpose have the same trace.
    - question:
        id: work-steepest
        type: choice
        system: s2
        prompt: |
          Among all displacements $H$ of the weights with $\|H\|_F = 1$, which one decreases the loss fastest, to first order?
        options:
          - 'Any $H$ of rank 1.'
          - '$H = -\nabla_Wf/\|\nabla_Wf\|_F$. The first-order change is $\langle\nabla_Wf, H\rangle$, and by Cauchy-Schwarz for the Frobenius inner product it is at least $-\|\nabla_Wf\|_F$, with equality for that $H$.'
          - '$H = -W/\|W\|_F$.'
          - 'It cannot be determined without the Hessian.'
        answer: 1
        explanation: |
          This is the steepest-descent argument of the gradient lesson, word for word, with the dot product replaced by $\langle G, H\rangle = \operatorname{tr}(G^\top H)$. Matrices of a given shape form an inner product space, and everything proved for inner product spaces applies. The answer does depend on the choice of norm: measuring $H$ by its spectral norm in place of the Frobenius norm gives a different steepest direction, built from the singular vectors of the gradient. Ordinary gradient descent is the Frobenius choice.
  connections:
    - text: |
        Each weight $W_{ij}$ carries input $j$ to output $i$, so its slope is (error at output $i$) $\times$ (input $j$), and the gradient is the outer product $\boldsymbol\delta\mathbf{x}^\top$. That is why the table of six slopes was a multiplication table.

        The gradient of a function of a matrix is the matrix $G$ of the same shape with $f(W + H) \approx f(W) + \operatorname{tr}(G^\top H)$. It is found by expanding at $W + H$ and cycling factors inside a trace until $H$ stands last. The general rule $\nabla_W\,g(AWB) = A^\top(\nabla g)B^\top$ covers a layer, a batch, and the gradient passed back to the input.

        Each derivation today began by writing out $f(W + H)$ in full and discarding the terms of higher order by hand. For a product of several factors, or an inverse, or a determinant, that expansion becomes long. The work can be organised: give the small displacement a name, $dW$, and learn a handful of rules for how it passes through sums, products and functions. Then a derivative is computed in a few lines of algebra and the gradient is read off at the end: [[m13.the-method-of-differentials]].
