concept: m13.derivatives-with-respect-to-matrices
minutes: 85
claim: You can define the gradient of a scalar function of a matrix as the matrix of the same shape that pairs with a displacement through the sum of products of entries, find such gradients by expanding at a displaced matrix and rearranging the linear part with the trace, give the gradients of a bilinear form, of the loss of a linear layer for one example and for a batch, and of the squared Frobenius norm, and explain why the gradient of a layer's weights for one example is an outer product.
recalls: [m13.derivatives-with-respect-to-vectors]
uses: [m12.gradient, m12.partial-derivatives, m12.total-derivative-as-best-linear-approximation, m8.operator-and-frobenius-norms, m8.singular-value-decomposition, m6.inner-product-spaces, m5.transpose, m5.matrix-multiplication-as-composition, m5.rank, e6.tensor-valued-autograd, e6.gradient-checking, e5.einsum, e5.linear-algebra-routines, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m13.the-method-of-differentials, m13.gradients-of-common-neural-network-layers]
starter: |
  # Scratch space. One linear layer, one example. Six weights, six slopes.
  import numpy as np

  W = np.array([[1.0, 0.0, 2.0], [-1.0, 1.0, 0.0]])
  x = np.array([1.0, 2.0, 3.0])
  t = np.array([5.0, 2.0])


  def loss(W):
      return 0.5 * float(((W @ x - t) ** 2).sum())


  h = 1e-6
  G = np.zeros((2, 3))
  for i in range(2):
      for j in range(3):
          E = np.zeros((2, 3))
          E[i, j] = h
          G[i, j] = (loss(W + E) - loss(W - E)) / (2 * h)
  print([[round(float(v), 4) for v in row] for row in G])
parts:
  recall:
    - text: |
        [[m13.derivatives-with-respect-to-vectors]] found gradients by expanding at $\mathbf{x} + \mathbf{h}$ and reading off the vector paired with $\mathbf{h}$. Today the variable is a matrix, and the same idea carries over once "paired with" has been given a meaning. Three quick pulls first.
  puzzle:
    - text: |
        A linear layer turns an input $\mathbf{x}$ of length 3 into an output $W\mathbf{x}$ of length 2. The target is $\mathbf{t}$, and the loss is $\tfrac12\|W\mathbf{x} - \mathbf{t}\|^2$.

        $$W = \begin{pmatrix} 1 & 0 & 2 \\ -1 & 1 & 0 \end{pmatrix}, \qquad \mathbf{x} = (1, 2, 3), \qquad \mathbf{t} = (5, 2).$$

        The layer has six weights. The starter nudges each in turn and measures the slope of the loss, and lays the six slopes out in the shape of $W$.

        ```
        [[2.0, 4.0, 6.0], [-1.0, -2.0, -3.0]]
        ```

        Look at the table. The first row is $2 \times (1, 2, 3)$. The second row is $-1 \times (1, 2, 3)$. Every row is a multiple of the input $\mathbf{x}$. And the multipliers, $2$ and $-1$, are the errors of the layer: $W\mathbf{x} - \mathbf{t} = (7, 1) - (5, 2) = (2, -1)$.

        Six independent weights, and their six slopes are made of only five numbers, arranged as a multiplication table.

        **Why does the gradient with respect to a weight matrix have this form? And is there a way to derive it as directly as the gradients of the last lesson, without six separate partial derivatives?**
  intuition:
    - text: |
        First the pattern itself, which can be understood entry by entry. The weight $W_{ij}$ does one thing only: it multiplies input $x_j$ and adds the result to output $i$. Nudging it by $\varepsilon$ moves output $i$ by $\varepsilon x_j$ and nothing else. The loss then changes by (sensitivity of the loss to output $i$) $\times\ \varepsilon x_j$. So

        $$\frac{\partial L}{\partial W_{ij}} = (\text{error at output } i) \times (\text{input } j).$$

        A table whose $(i, j)$ entry is $r_ix_j$ is the **outer product** $\mathbf{r}\mathbf{x}^\top$. That is the gradient: error times input.

        Now the method. The gradient of a function of a vector was the vector $\mathbf{g}$ with $f(\mathbf{x} + \mathbf{h}) \approx f(\mathbf{x}) + \mathbf{g}^\top\mathbf{h}$, where $\mathbf{g}^\top\mathbf{h} = \sum g_ih_i$. For a matrix variable, displace by a matrix $H$ and ask for the matrix $G$ with

        $$f(W + H) \approx f(W) + \sum_{i,j}G_{ij}H_{ij}.$$

        $G_{ij}$ is then the slope with respect to $W_{ij}$, so $G$ is the table of slopes, in the shape of $W$. The sum of products of matching entries is the dot product of two matrices read as long lists. It has a compact form that makes it usable in calculations:

        $$\sum_{i,j}G_{ij}H_{ij} = \operatorname{tr}(G^\top H).$$

        So the recipe is the old one with one change: expand at $W + H$, keep the part linear in $H$, and rearrange it into $\operatorname{tr}(G^\top H)$. The rearranging is done with one property of the trace, that factors may be cycled: $\operatorname{tr}(ABC) = \operatorname{tr}(CAB)$.
  derivation:
    - text: |
        **The inner product of matrices.** For $G, H \in \mathbb{R}^{m \times n}$,

        $$\langle G, H\rangle = \sum_{i,j}G_{ij}H_{ij} = \operatorname{tr}(G^\top H).$$

        This is the Frobenius inner product, and $\langle H, H\rangle = \|H\|_F^2$.

        **The gradient.** For $f: \mathbb{R}^{m \times n} \to \mathbb{R}$, the gradient $\nabla_Wf$ is the $m \times n$ matrix with

        $$f(W + H) = f(W) + \langle\nabla_Wf, H\rangle + o(\|H\|).$$

        Its entries are $\partial f/\partial W_{ij}$. It has the shape of $W$, so that $W - \eta\nabla_Wf$ makes sense.

        **Two facts about the trace.**

        - A number is its own trace: $s = \operatorname{tr}(s)$.
        - Cycling: $\operatorname{tr}(ABC) = \operatorname{tr}(BCA) = \operatorname{tr}(CAB)$, whenever the products are defined. Also $\operatorname{tr}(A) = \operatorname{tr}(A^\top)$.

        **A bilinear form.** $f(W) = \mathbf{a}^\top W\mathbf{b}$. Then $f(W + H) = f(W) + \mathbf{a}^\top H\mathbf{b}$, which is already linear in $H$. Bring it to the standard form:

        $$\mathbf{a}^\top H\mathbf{b} = \operatorname{tr}(\mathbf{a}^\top H\mathbf{b}) = \operatorname{tr}(\mathbf{b}\mathbf{a}^\top H) = \operatorname{tr}\big((\mathbf{a}\mathbf{b}^\top)^\top H\big).$$

        So $\nabla_W(\mathbf{a}^\top W\mathbf{b}) = \mathbf{a}\mathbf{b}^\top$.

        **The layer of the puzzle.** $f(W) = \tfrac12\|W\mathbf{x} - \mathbf{t}\|^2$. Write $\mathbf{r} = W\mathbf{x} - \mathbf{t}$. Displacing $W$ by $H$ displaces the residual by $H\mathbf{x}$:

        $$\tfrac12\|\mathbf{r} + H\mathbf{x}\|^2 = \tfrac12\|\mathbf{r}\|^2 + \mathbf{r}^\top H\mathbf{x} + \tfrac12\|H\mathbf{x}\|^2.$$

        The linear part is the bilinear form $\mathbf{r}^\top H\mathbf{x}$, so

        $$\nabla_W\,\tfrac12\|W\mathbf{x} - \mathbf{t}\|^2 = \mathbf{r}\mathbf{x}^\top = (W\mathbf{x} - \mathbf{t})\,\mathbf{x}^\top.$$

        **Any loss on a linear layer.** Let $f(W) = g(W\mathbf{x})$, and write $\boldsymbol\delta = \nabla g$ at $\mathbf{z} = W\mathbf{x}$. Displacing $W$ by $H$ displaces $\mathbf{z}$ by $H\mathbf{x}$ and changes $g$ by $\boldsymbol\delta^\top H\mathbf{x}$. Hence

        $$\nabla_W\,g(W\mathbf{x}) = \boldsymbol\delta\,\mathbf{x}^\top, \qquad \nabla_{\mathbf{x}}\,g(W\mathbf{x}) = W^\top\boldsymbol\delta.$$

        The same $\boldsymbol\delta$ gives both: an outer product with the input for the weights, and a product with $W^\top$ to pass the gradient further back. For one example the weight gradient always has rank 1.
    - question:
        id: derivation-bilinear
        type: numeric
        system: s2
        prompt: |
          $f(W) = \mathbf{a}^\top W\mathbf{b}$ with $\mathbf{a} = (1, 2)$ and $\mathbf{b} = (3, 0, 1)$. What is the entry in row 2, column 1 of $\nabla_Wf$?
        answer: "6"
        explanation: |
          $\nabla_Wf = \mathbf{a}\mathbf{b}^\top = \begin{pmatrix} 3 & 0 & 1 \\ 6 & 0 & 2 \end{pmatrix}$, and the entry is $a_2b_1 = 6$. Directly: $f = \sum_{i,j}a_iW_{ij}b_j$, and the coefficient of $W_{21}$ is $a_2b_1$. The gradient does not depend on $W$ at all, because $f$ is linear in $W$. The order matters: $\mathbf{b}\mathbf{a}^\top$ would be $3 \times 2$, the wrong shape.
    - text: |
        **A batch.** Put $n$ examples as the rows of $X$, of shape $n \times d$, and let the weights be $W$, of shape $d \times k$, so that the outputs are the rows of $Z = XW$. For a loss $f(W) = g(XW)$ with $\Delta = \nabla_Zg$:

        $$g(XW + XH) \approx g + \langle\Delta, XH\rangle = \operatorname{tr}(\Delta^\top XH) = \operatorname{tr}\big((X^\top\Delta)^\top H\big),$$

        so

        $$\nabla_W\,g(XW) = X^\top\Delta, \qquad \nabla_X\,g(XW) = \Delta W^\top.$$

        The first is the sum over examples of (input)(error)$^\top$. For least squares, $g = \tfrac12\|XW - T\|_F^2$ and $\Delta = XW - T$.

        **The general product rule.** For $f(W) = g(AWB)$ with $\Delta = \nabla g$:

        $$\nabla_W\,g(AWB) = A^\top\Delta B^\top.$$

        Whatever stands to the left of $W$ comes out transposed on the left, and whatever stands to the right comes out transposed on the right. Every formula above is a case of this one.

        **More gradients.**

        - $\|W\|_F^2 = \operatorname{tr}(W^\top W)$: the linear part of $\operatorname{tr}((W + H)^\top(W + H))$ is $2\operatorname{tr}(W^\top H)$, so the gradient is $2W$. Weight decay $\tfrac\mu2\|W\|_F^2$ adds $\mu W$ to the gradient.
        - $\operatorname{tr}(A^\top W) = \langle A, W\rangle$: gradient $A$.
        - $\operatorname{tr}(W^\top AW)$: gradient $(A + A^\top)W$.

        **Shapes.** With $X$ of shape $n \times d$ and $\Delta$ of shape $n \times k$, the gradient for $W$ must be $d \times k$, and $X^\top\Delta$ is the only product of the two that has that shape. As before, the check fails silently when dimensions coincide.

        **Why not flatten?** One could string the entries of $W$ into a vector and use the last lesson. For scalar functions that gives the same numbers, reshaped. But the derivative of a matrix-valued function of a matrix, such as $W \mapsto AWB$, would become an $mn \times mn$ Jacobian with a structure that is hard to see. Working with displacements $H$ and the pairing $\operatorname{tr}(G^\top H)$ never forms that object.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the derivation of the gradient, with respect to W, of half the squared length of W x minus t.
        steps:
          - 'Write the residual $\mathbf{r} = W\mathbf{x} - \mathbf{t}$, and displace $W$ by $H$, so that the residual becomes $\mathbf{r} + H\mathbf{x}$.'
          - 'Expand $\tfrac12\|\mathbf{r} + H\mathbf{x}\|^2$ and keep the part linear in $H$, which is $\mathbf{r}^\top H\mathbf{x}$.'
          - 'Write this number as its own trace, $\operatorname{tr}(\mathbf{r}^\top H\mathbf{x})$.'
          - 'Cycle the factors to $\operatorname{tr}(\mathbf{x}\mathbf{r}^\top H) = \operatorname{tr}\big((\mathbf{r}\mathbf{x}^\top)^\top H\big)$.'
          - 'Read off the gradient $\mathbf{r}\mathbf{x}^\top$.'
        explanation: Expand, keep the linear part, and use the trace to move H to the end.
  formal:
    - text: |
        **Frobenius inner product.** $\langle A, B\rangle = \operatorname{tr}(A^\top B) = \sum_{ij}A_{ij}B_{ij}$ on $\mathbb{R}^{m \times n}$.

        **Gradient.** $\nabla_Wf \in \mathbb{R}^{m \times n}$ is the unique matrix with $f(W + H) = f(W) + \langle\nabla_Wf, H\rangle + o(\|H\|_F)$. $(\nabla_Wf)_{ij} = \partial f/\partial W_{ij}$.

        **Trace.** $\operatorname{tr}(AB) = \operatorname{tr}(BA)$ for $A \in \mathbb{R}^{m \times n}$, $B \in \mathbb{R}^{n \times m}$. $\operatorname{tr}(A^\top) = \operatorname{tr}(A)$. $\langle A, BC\rangle = \langle B^\top A, C\rangle = \langle AC^\top, B\rangle$.

        **Adjoints.** The map $H \mapsto AHB$ has adjoint $G \mapsto A^\top GB^\top$ for the Frobenius inner product: $\langle G, AHB\rangle = \langle A^\top GB^\top, H\rangle$. The chain rule for $f = g \circ \mathcal{L}$ with $\mathcal{L}$ linear is $\nabla f = \mathcal{L}^*\nabla g$.

        **Table.**

        | $f(W)$ | $\nabla_Wf$ |
        |---|---|
        | $\mathbf{a}^\top W\mathbf{b}$ | $\mathbf{a}\mathbf{b}^\top$ |
        | $\operatorname{tr}(A^\top W)$ | $A$ |
        | $\operatorname{tr}(AW)$ | $A^\top$ |
        | $\lVert W\rVert_F^2$ | $2W$ |
        | $\operatorname{tr}(W^\top AW)$ | $(A + A^\top)W$ |
        | $\tfrac12\lVert W\mathbf{x} - \mathbf{t}\rVert^2$ | $(W\mathbf{x} - \mathbf{t})\mathbf{x}^\top$ |
        | $\tfrac12\lVert XW - T\rVert_F^2$ | $X^\top(XW - T)$ |
        | $g(AWB)$ | $A^\top(\nabla g)B^\top$ |
        | $\mathbf{a}^\top W^\top W\mathbf{b}$ | $W(\mathbf{a}\mathbf{b}^\top + \mathbf{b}\mathbf{a}^\top)$ |

        **Vectorisation.** With $\operatorname{vec}$ stacking columns: $\operatorname{vec}(AWB) = (B^\top \otimes A)\operatorname{vec}(W)$ and $\langle G, H\rangle = \operatorname{vec}(G)^\top\operatorname{vec}(H)$. The adjoint formula above is the transpose of the Kronecker product, $(B^\top \otimes A)^\top = B \otimes A^\top$, written without forming it.

        **Rank.** For $f(W) = \sum_{i=1}^ng_i(W\mathbf{x}_i)$: $\nabla_Wf = \sum_i\boldsymbol\delta_i\mathbf{x}_i^\top$, of rank at most $n$.
