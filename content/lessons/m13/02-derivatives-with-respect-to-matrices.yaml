        explanation: The trace of G transpose H is the sum of products of matching entries. Cycling the factors gives a product of a different size with the same trace.
  work:
    - text: Slower now. The first task is one layer and one example.
    - question:
        id: write-layer
        type: code
        mode: write
        system: s2
        prompt: |
          Write `grad_layer(W, x, t)` for the loss $\tfrac12\|W\mathbf{x} - \mathbf{t}\|^2$. Return the pair `(grad_W, grad_x)`: the gradient with respect to the weights, in the shape of `W`, and the gradient with respect to the input, in the shape of `x`.
        starter: |
          import numpy as np


          def grad_layer(W, x, t):
              return W * 0.0, x * 0.0


          W = np.array([[1.0, 0.0, 2.0], [-1.0, 1.0, 0.0]])
          gW, gx = grad_layer(W, np.array([1.0, 2.0, 3.0]), np.array([5.0, 2.0]))
          print([[float(v) for v in row] for row in gW])
          print([float(v) for v in gx])
        solution: |
          import numpy as np


          def grad_layer(W, x, t):
              r = W @ x - t
              return np.outer(r, x), W.T @ r


          W = np.array([[1.0, 0.0, 2.0], [-1.0, 1.0, 0.0]])
          gW, gx = grad_layer(W, np.array([1.0, 2.0, 3.0]), np.array([5.0, 2.0]))
          print([[float(v) for v in row] for row in gW])
          print([float(v) for v in gx])
        tests: |
          import numpy as _np
          _W = _np.array([[1.0, 0.0, 2.0], [-1.0, 1.0, 0.0]])
          _x = _np.array([1.0, 2.0, 3.0])
          _t = _np.array([5.0, 2.0])
          _out = grad_layer(_W, _x, _t)
          assert isinstance(_out, tuple) and len(_out) == 2, "grad_layer should return the pair (grad_W, grad_x)"
          _gW, _gx = _out
          assert _np.shape(_gW) == (2, 3), "The gradient for the weights has the shape of W, 2 by 3"
          assert _np.shape(_gx) == (3,), "The gradient for the input has the shape of x"
          assert _np.allclose(_gW, [[2.0, 4.0, 6.0], [-1.0, -2.0, -3.0]]), "The gradient for the weights is the outer product of the error (2, -1) and the input (1, 2, 3)"
          assert _np.allclose(_gx, [3.0, -1.0, 4.0]), "The gradient for the input is W^T times the error, (3, -1, 4)"
          _rng = _np.random.default_rng(0)
          _W2, _x2, _t2 = _rng.normal(size=(3, 3)), _rng.normal(size=3), _rng.normal(size=3)
          _L = lambda W, x: 0.5 * float(((W @ x - _t2) ** 2).sum())
          _num = _np.zeros((3, 3))
          for _i in range(3):
              for _j in range(3):
                  _E = _np.zeros((3, 3))
                  _E[_i, _j] = 1e-6
                  _num[_i, _j] = (_L(_W2 + _E, _x2) - _L(_W2 - _E, _x2)) / 2e-6
          _gW, _gx = grad_layer(_W2, _x2, _t2)
          assert _np.allclose(_gW, _num, atol=1e-6), "For a random square layer the gradient for the weights should agree with central differences, entry by entry. Check the order of the outer product"
          _numx = _np.array([(_L(_W2, _x2 + 1e-6 * _e) - _L(_W2, _x2 - 1e-6 * _e)) / 2e-6 for _e in _np.eye(3)])
          assert _np.allclose(_gx, _numx, atol=1e-6), "For a random square layer the gradient for the input should agree with central differences"
          assert output.strip() == "[[2.0, 4.0, 6.0], [-1.0, -2.0, -3.0]]\n[3.0, -1.0, 4.0]", "The program should print [[2.0, 4.0, 6.0], [-1.0, -2.0, -3.0]] and then [3.0, -1.0, 4.0]"
        wrong:
          - |
            import numpy as np


            def grad_layer(W, x, t):
                r = W @ x - t
                return np.outer(x, r).reshape(W.shape), W.T @ r


            print("[[2.0, 4.0, 6.0], [-1.0, -2.0, -3.0]]\n[3.0, -1.0, 4.0]")
          - |
            import numpy as np


            def grad_layer(W, x, t):
                r = W @ x - t
                return np.outer(r, x), W.T @ (W @ x)


            print("[[2.0, 4.0, 6.0], [-1.0, -2.0, -3.0]]\n[3.0, -1.0, 4.0]")
          - |
            import numpy as np


