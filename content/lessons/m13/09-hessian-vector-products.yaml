        solution: |
          import numpy as np

          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])


          def grad(x):
              return A @ x + x ** 3


          def hvp(x, v):
              return A @ v + 3 * x ** 2 * v


          x = np.array([1.0, 0.5, -1.0])
          v = np.array([1.0, 2.0, 1.0])
          h = 1e-5
          measured = (grad(x + h * v) - grad(x - h * v)) / (2 * h)
          print(round(float(np.abs(hvp(x, v) - measured).max()), 4))
        tests: |
          import numpy as _np
          _A = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          _x = _np.array([1.0, 0.5, -1.0])
          _v = _np.array([1.0, 2.0, 1.0])
          assert _np.allclose(hvp(_x, _v), (_A + _np.diag(3 * _x ** 2)) @ _v), "At (1, 0.5, -1) along (1, 2, 1) the product is (7, 9.5, 7). The Hessian is A plus the diagonal matrix of 3 x**2"
          assert _np.allclose(hvp(_x, 2 * _v), 2 * hvp(_x, _v)), "The product must be linear in v: doubling v should double it"
          _y = _np.array([0.2, -0.3, 2.0])
          _w = _np.array([-1.0, 0.5, 3.0])
          assert _np.allclose(hvp(_y, _w), (_A + _np.diag(3 * _y ** 2)) @ _w), "At (0.2, -0.3, 2) along (-1, 0.5, 3) the product should equal the explicit Hessian times the direction"
          assert output.strip() == "0.0", "The program should print 0.0"
        wrong:
          - |
            import numpy as np
            A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])


            def grad(x):
                return A @ x + x ** 3


            def hvp(x, v):
                return A @ v + 3 * v ** 2 * x


            print("0.0")
          - |
            import numpy as np
