          assert abs(top_curvature(lambda v: _np.array([-6.0, 1.0, 2.0]) * v, 3, 80) + 6.0) < 1e-6, "For the diagonal Hessian with entries -6, 1, 2 the eigenvalue of largest size is -6. Return the Rayleigh quotient, which keeps the sign"
          assert abs(top_curvature(_h, 3, 0) - 11 / 3) < 1e-9, "With 0 steps the result is the Rayleigh quotient of the starting vector, 11/3 for this matrix"
          assert output.strip() == "5.7321 0.3489", "The program should print 5.7321 0.3489"
