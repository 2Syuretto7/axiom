concept: m13.hessian-vector-products
minutes: 85
claim: You can define the Hessian-vector product as the derivative of the gradient along a direction, compute it without forming the Hessian in three ways (a difference of two gradients, the gradient of the gradient's dot product with the direction, and the gradient code run on dual numbers), state that it costs a small constant multiple of the function, derive it by hand for a small layer, and use it to measure curvature along a direction, to find the largest curvature by power iteration, and to explain how Newton steps are solved for large models.
recalls: [m13.forward-mode-and-dual-numbers]
uses: [m13.reverse-mode-differentiation-and-its-cost, m13.jacobian-vector-and-vector-jacobian-products, m13.the-method-of-differentials, m13.derivatives-with-respect-to-vectors, m12.hessian-and-symmetry-of-mixed-partials, m12.directional-derivative, m12.gradient, m12.multivariable-taylor-expansion, m8.perron-frobenius-and-power-iteration, m8.quadratic-forms-and-the-rayleigh-quotient, m8.spectral-theorem, m8.positive-definite-matrices-and-cholesky, e6.higher-order-gradients, e6.gradient-checking, e5.linear-algebra-routines, e1.complexity-and-big-o, e0.functions, e0.loops]
leads: [m13.implicit-differentiation-through-solvers]
starter: |
  # Scratch space. f(x) = x.A x / 2 + sum(x**4) / 4, whose gradient is A x + x**3.
  import numpy as np

  A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])


  def grad(x):
      return A @ x + x ** 3


  x = np.array([1.0, 0.0, -1.0])
  v = np.array([1.0, 2.0, 1.0])

  H = A + np.diag(3 * x ** 2)       # the whole Hessian: n * n numbers
  print([float(c) for c in H @ v])

  h = 1e-5                          # two gradients, and no Hessian
  print([round(float(c), 4) for c in (grad(x + h * v) - grad(x - h * v)) / (2 * h)])
parts:
  recall:
    - text: |
        [[m13.forward-mode-and-dual-numbers]] ended with a promise: nudging the inputs of a gradient differentiates it once more, in one direction. That is today's object, and it is what makes second-order information affordable for large models. Three quick pulls first.
  puzzle:
    - text: |
        The Hessian $H$ of a function of $n$ variables holds all its second partial derivatives: $n^2$ numbers. It says how the gradient changes as you move, which is what you need to know how far a step can safely go.

        For a model with a million parameters, $n^2 = 10^{12}$. At 8 bytes each the Hessian would fill 8 terabytes. It cannot be stored, let alone computed entry by entry.

        The starter takes a function of three variables. It builds the whole Hessian and multiplies it by a vector $\mathbf{v}$. Then it gets the same three numbers from **two gradients**, with no Hessian anywhere.

        ```
        [7.0, 8.0, 7.0]
        [7.0, 8.0, 7.0]
        ```

        **What is $H\mathbf{v}$, that two gradients are enough to find it? Can it be had exactly, without the small step $h$? And what use is the Hessian if it can only ever be multiplied by vectors?**
  intuition:
    - text: |
        The Hessian is the derivative of the gradient. Feed it a direction $\mathbf{v}$ and it returns **how the gradient changes when you move along $\mathbf{v}$**:

        $$\nabla f(\mathbf{x} + t\mathbf{v}) \approx \nabla f(\mathbf{x}) + t\,H\mathbf{v}.$$

        So $H\mathbf{v}$ is a directional derivative, not of $f$ but of $\nabla f$. The starter measured it in the plainest way: the gradient a little ahead minus the gradient a little behind, divided by the distance.

        This is the same situation as with Jacobians. The matrix is too large to hold, but its **action on a vector** is cheap, and the action is what algorithms use. $H$ is the Jacobian of the function $\mathbf{x} \mapsto \nabla f(\mathbf{x})$, so $H\mathbf{v}$ is a Jacobian-vector product of the gradient.

        That observation gives an exact method at once. A Jacobian-vector product is what dual numbers compute. Take the code that computes the gradient, by reverse mode or by hand, and run it on the inputs $\mathbf{x} + \mathbf{v}\varepsilon$. The values that come out are the gradient, and the tangents are $H\mathbf{v}$. One gradient costs a few evaluations of $f$. Running it on dual numbers costs about twice that. The Hessian of a million variables, applied to a vector, for the price of a handful of evaluations.

        And products are enough. The curvature of $f$ along $\mathbf{v}$ is the number $\mathbf{v}^\top H\mathbf{v}$. The sharpest curvature is the top eigenvalue, which power iteration finds with nothing but products. Even the Newton step, which solves $H\mathbf{p} = -\nabla f$, can be found by iterative methods that only ever ask for $H$ times a vector.
  derivation:
    - text: |
        **Definition.** For twice-differentiable $f: \mathbb{R}^n \to \mathbb{R}$ with Hessian $H(\mathbf{x})$, the **Hessian-vector product** is

        $$H\mathbf{v} = \frac{d}{dt}\nabla f(\mathbf{x} + t\mathbf{v})\Big|_{t=0},$$

        the directional derivative of the gradient. Entry $i$ is $\sum_j\frac{\partial^2f}{\partial x_i\partial x_j}v_j$.

        **Three ways to compute it, none of which forms $H$.**

        *1. Difference of gradients.* $H\mathbf{v} \approx \dfrac{\nabla f(\mathbf{x} + h\mathbf{v}) - \nabla f(\mathbf{x} - h\mathbf{v})}{2h}$. Two gradients, with the usual trouble of choosing $h$.

        *2. Gradient of a dot product (reverse over reverse).* Hold $\mathbf{v}$ fixed and define the scalar function $g(\mathbf{x}) = \nabla f(\mathbf{x}) \cdot \mathbf{v}$. Then

        $$\frac{\partial g}{\partial x_j} = \sum_i\frac{\partial^2f}{\partial x_j\partial x_i}v_i = (H\mathbf{v})_j, \qquad\text{so}\qquad \nabla g = H\mathbf{v}.$$

        One backward sweep gives $\nabla f$, as a calculation that is itself recorded. A second backward sweep through that record gives $\nabla g$. This is what your engine did in [[e6.higher-order-gradients]].

        *3. Dual numbers through the gradient (forward over reverse).* Run the gradient calculation on $\mathbf{x} + \mathbf{v}\varepsilon$:

        $$\nabla f(\mathbf{x} + \mathbf{v}\varepsilon) = \nabla f(\mathbf{x}) + H\mathbf{v}\ \varepsilon.$$

        Exact, with no second tape. This is usually the cheapest and the most accurate.

        **Cost.** A gradient costs at most about 5 evaluations of $f$, and either a second sweep or dual arithmetic multiplies that by a small constant again. So $H\mathbf{v}$ costs a constant multiple of $f$, independent of $n$. The whole Hessian, if it is really wanted, takes $n$ products, one for each $\mathbf{e}_i$.

        **By hand, for one layer.** Let $f(\mathbf{x}) = \tfrac12\|\tanh(W\mathbf{x})\|^2$. With $\mathbf{h} = \tanh(W\mathbf{x})$, the gradient is $\nabla f = W^\top\big((1 - \mathbf{h}^2) \circ \mathbf{h}\big) = W^\top(\mathbf{h} - \mathbf{h}^3)$, with powers taken entry by entry.

        Nudge $\mathbf{x}$ along $\mathbf{v}$ and follow the tangents through the same steps. $\dot{\mathbf{h}} = (1 - \mathbf{h}^2) \circ W\mathbf{v}$, and the tangent of $\mathbf{h} - \mathbf{h}^3$ is $(1 - 3\mathbf{h}^2) \circ \dot{\mathbf{h}}$. So

        $$H\mathbf{v} = W^\top\big((1 - 3\mathbf{h}^2) \circ (1 - \mathbf{h}^2) \circ W\mathbf{v}\big).$$

        Read right to left: a JVP through the layer, a diagonal scaling, and a VJP back. $H$ itself, which is $W^\top DW$ with $D$ diagonal, was never formed.
    - question:
        id: derivation-small
        type: numeric
        system: s2
        prompt: |
          $f(x, y) = x^2y$. At the point $(1, 3)$ and for $\mathbf{v} = (1, 1)$, what is the first entry of $H\mathbf{v}$? Find it as the derivative of the first entry of the gradient along $\mathbf{v}$.
        answer: "8"
        explanation: |
          The gradient is $(2xy,\ x^2)$. Its first entry $2xy$ has partial derivatives $2y = 6$ and $2x = 2$ at $(1, 3)$, so its rate of change along $(1, 1)$ is $6 + 2 = 8$. The second entry $x^2$ changes at rate $2x = 2$. So $H\mathbf{v} = (8, 2)$, which agrees with the Hessian $\begin{pmatrix} 6 & 2 \\ 2 & 0 \end{pmatrix}$ applied to $(1, 1)$. Only the two entries of the gradient were differentiated, each along one direction.
    - text: |
        **What the products are for.**

        *Curvature along a direction.* By Taylor's theorem along the line $\mathbf{x} + t\mathbf{v}$:

        $$f(\mathbf{x} + t\mathbf{v}) \approx f(\mathbf{x}) + t\,\nabla f \cdot \mathbf{v} + \tfrac12t^2\,\mathbf{v}^\top H\mathbf{v}.$$

        The number $\mathbf{v}^\top H\mathbf{v}$ is the second derivative of $f$ along $\mathbf{v}$. If it is positive, the quadratic model is smallest at $t = -\dfrac{\nabla f \cdot \mathbf{v}}{\mathbf{v}^\top H\mathbf{v}}$: a step size, from one product.

        *The largest curvature.* $H$ is symmetric, so power iteration with $\mathbf{v} \leftarrow H\mathbf{v}/\|H\mathbf{v}\|$ converges to an eigenvector of the eigenvalue of largest absolute value, and the Rayleigh quotient $\mathbf{v}^\top H\mathbf{v}$ to that eigenvalue. This $\lambda_{\max}$ is the **sharpness** of the loss at $\mathbf{x}$.

        *The step-size limit.* For a quadratic $f = \tfrac12\mathbf{x}^\top H\mathbf{x}$, gradient descent $\mathbf{x} \leftarrow \mathbf{x} - \eta H\mathbf{x}$ multiplies the component along an eigenvector of eigenvalue $\lambda$ by $1 - \eta\lambda$. For positive $\lambda$ that shrinks exactly when $\eta < 2/\lambda$. So the method is stable only for

        $$\eta < \frac{2}{\lambda_{\max}}.$$

        *Newton's step.* Minimising the quadratic model in all directions at once gives $H\mathbf{p} = -\nabla f$. For large $n$ this is solved approximately by an iterative method, usually conjugate gradients, which touches $H$ only through products $H\mathbf{v}$: a few dozen products in place of a matrix with $n^2$ entries.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that the gradient of $g(\mathbf{x}) = \nabla f(\mathbf{x}) \cdot \mathbf{v}$ is $H\mathbf{v}$.
        steps:
          - 'Write $g(\mathbf{x}) = \sum_i\frac{\partial f}{\partial x_i}v_i$, with $\mathbf{v}$ held constant.'
          - 'Differentiate with respect to $x_j$: $\frac{\partial g}{\partial x_j} = \sum_i\frac{\partial^2f}{\partial x_j\partial x_i}v_i$.'
          - 'The mixed partial derivatives are the entries of the Hessian: the sum is $\sum_iH_{ji}v_i$.'
          - 'That is entry $j$ of $H\mathbf{v}$.'
          - 'So one more backward sweep, through the calculation of the gradient, returns $H\mathbf{v}$.'
        explanation: A scalar function was built whose gradient is the product wanted, and gradients of scalar functions are cheap.
  formal:
    - text: |
        **Definition.** For $f \in C^2$: $H(\mathbf{x})\mathbf{v} = D(\nabla f)(\mathbf{x})[\mathbf{v}]$. Since $H$ is symmetric, $H\mathbf{v} = J_{\nabla f}\mathbf{v} = J_{\nabla f}^\top\mathbf{v}$: the JVP and the VJP of the gradient map coincide.

        **Identities.** $H\mathbf{v} = \nabla_{\mathbf{x}}\big(\nabla f(\mathbf{x}) \cdot \mathbf{v}\big)$ for constant $\mathbf{v}$. $\ \nabla f(\mathbf{x} + \mathbf{v}\varepsilon) = \nabla f(\mathbf{x}) + H\mathbf{v}\,\varepsilon$. $\ \mathbf{v}^\top H\mathbf{v} = \frac{d^2}{dt^2}f(\mathbf{x} + t\mathbf{v})\big|_{t=0}$.

        **Complexity.** $\operatorname{ops}(f, \nabla f, H\mathbf{v}) \le c\operatorname{ops}(f)$ with a constant $c$ independent of $n$ (about 10 to 15 in the operation-counting model, and 2 to 4 gradients in practice). Memory is that of one reverse sweep. The full Hessian costs $n$ products. Its diagonal is not, in general, obtainable more cheaply than that.

        **The four combinations.** Forward over reverse and reverse over reverse both give $H\mathbf{v}$. Reverse over forward does too: the gradient of the scalar JVP $\nabla f \cdot \mathbf{v}$. Forward over forward gives only the scalar $\mathbf{u}^\top H\mathbf{v}$ per pass.

        **Gauss-Newton product.** For $f = \ell \circ F$ with $J = J_F$ and $H_\ell$ the Hessian of $\ell$:

        $$H = J^\top H_\ell J + \sum_k\frac{\partial\ell}{\partial F_k}\nabla^2F_k.$$

        The first term, $G = J^\top H_\ell J$, is positive semidefinite when $\ell$ is convex. $G\mathbf{v}$ is a JVP, a small multiplication, and a VJP, with no second derivatives of $F$.

        **Trace estimation (Hutchinson).** If $\mathbf{z}$ has independent entries of mean 0 and variance 1, then $\mathbb{E}[\mathbf{z}^\top H\mathbf{z}] = \operatorname{tr}H$.

        **Newton by conjugate gradients.** For positive definite $H$, conjugate gradients solves $H\mathbf{p} = -\mathbf{g}$ exactly in at most $n$ products, and to relative accuracy $\epsilon$ in $O(\sqrt{\kappa(H)}\log(1/\epsilon))$ products.

        **Gradient descent on a quadratic.** With $0 < \lambda_{\min} \le \lambda_{\max}$ the eigenvalues of $H$: convergence if and only if $0 < \eta < 2/\lambda_{\max}$, and the best rate is at $\eta = 2/(\lambda_{\min} + \lambda_{\max})$.
