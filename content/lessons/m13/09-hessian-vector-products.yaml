            def grad(x):
                return A @ x + x ** 3


            def hvp(x, v):
                return A @ v + 3 * x ** 2


            print("0.0")
          - |
            import numpy as np
            A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])


            def grad(x):
                return A @ x + x ** 3


            def hvp(x, v):
                return A @ x + 3 * x ** 2 * v


            print("0.0")
        explanation: |
          The tangent of $\mathbf{x}^3$ when $\mathbf{x}$ moves along $\mathbf{v}$ is $3\mathbf{x}^2 \circ \mathbf{v}$: the slope at the **point**, times the **direction**. The code had the two exchanged, squaring the direction.

          There is a test that catches this kind of slip without knowing the right answer. $H\mathbf{v}$ is a matrix times $\mathbf{v}$, so it must be **linear in $\mathbf{v}$**: doubling the direction doubles the product. The broken version quadruples its second term. Any expression claimed to be a Hessian-vector product, a JVP or a VJP in which the direction appears squared, or not at all, is wrong on sight.

          In the tangent of any step, each term contains exactly one dotted quantity.
    - question:
        id: work-terabytes
        type: numeric
        system: s2
        prompt: |
          A model has 100 000 parameters. Storing its Hessian at 8 bytes an entry takes how many gigabytes? Take $10^9$ bytes to the gigabyte.
        answer: "80"
        explanation: |
          $(10^5)^2 = 10^{10}$ entries, times 8 bytes, is $8 \times 10^{10}$ bytes: 80 gigabytes, for what is by present standards a tiny model. The parameters themselves take under a megabyte. Multiply the parameters by 10 and the Hessian grows by 100. A Hessian-vector product for the same model needs a few vectors of $10^5$ numbers and the working memory of one gradient.
    - question:
        id: work-step-limit
        type: numeric
        system: s2
        prompt: |
          Power iteration on Hessian-vector products reports that the largest eigenvalue of the Hessian of a loss is 40, and all its eigenvalues are positive. Treating the loss as quadratic near this point, below what step size $\eta$ is gradient descent stable?
        answer: "0.05"
        explanation: |
          Along the eigenvector of eigenvalue $\lambda$, each step multiplies the error by $1 - \eta\lambda$, which has size below 1 exactly when $0 < \eta < 2/\lambda$. The tightest of these conditions comes from the largest eigenvalue: $\eta < 2/40 = 0.05$. Above it, the error along the sharpest direction grows at every step while the others still shrink, and the loss blows up. This is the quantitative content of "the learning rate is too high", and it is set by one number that a few dozen products can measure.
    - question:
        id: work-why-enough
        type: choice
        system: s2
        prompt: |
          A Newton step solves $H\mathbf{p} = -\nabla f$ for a model with $10^6$ parameters. Which statement is right?
        options:
          - 'It is impossible, since the Hessian cannot be stored.'
          - 'An iterative solver such as conjugate gradients finds an approximate $\mathbf{p}$ from a modest number of products $H\mathbf{v}$, each costing a few gradients, and the Hessian is never formed.'
          - 'The Hessian must be computed by $10^6$ products and then inverted.'
          - 'The Newton step equals the gradient step when the model is large.'
        answer: 1
        explanation: |
          A linear system can be solved without holding its matrix, provided the matrix can be applied to vectors. Conjugate gradients builds the solution out of the vectors $\mathbf{g}, H\mathbf{g}, H^2\mathbf{g}, \dots$, one product per iteration, and a few dozen iterations usually give a useful step. This is called Newton-CG or Hessian-free optimisation. The third option would need $10^6$ products and 8 terabytes. The idea that an operator is fully usable through its action alone has now appeared for Jacobians, for their transposes and for Hessians, and it is the working principle of large-scale numerical computing.
  connections:
    - text: |
        $H\mathbf{v}$ is how the gradient changes along $\mathbf{v}$: a Jacobian-vector product of the gradient. Two gradients and a subtraction approximate it. Exactly, it is the gradient of $\nabla f \cdot \mathbf{v}$, or the tangent that comes out when the gradient calculation is run on dual numbers. Either way it costs a few gradients and the Hessian is never formed.

        Products are enough for what the Hessian is wanted for: the curvature $\mathbf{v}^\top H\mathbf{v}$ along a direction, the largest eigenvalue and with it the step-size limit $2/\lambda_{\max}$, and the Newton step by an iterative solver.

        That last use contains a new kind of object. The Newton step is not given by a formula that can be traced operation by operation. It is defined as the **solution of an equation**, found by an iteration. Many quantities in machine learning are like that: the weights that minimise a loss, the fixed point of a layer, the solution of a linear system. How do you differentiate through something that is only defined by the equation it satisfies? Not by differentiating the solver: [[m13.implicit-differentiation-through-solvers]].
