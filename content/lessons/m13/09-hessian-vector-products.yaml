  work:
    - text: Slower now. First the one-layer product derived above.
    - question:
        id: write-hvp
        type: code
        mode: write
        system: s2
        prompt: |
          For $f(\mathbf{x}) = \tfrac12\|\tanh(W\mathbf{x})\|^2$ the gradient is given. Write `hvp(W, x, v)` returning $H\mathbf{v}$ exactly, by following the tangent of each step of the gradient calculation. Do not form the Hessian and do not use a finite difference.
        starter: |
          import numpy as np


          def grad(W, x):
              h = np.tanh(W @ x)
              return W.T @ ((1 - h ** 2) * h)


          def hvp(W, x, v):
              return v * 0.0


          W = np.array([[1.0, -1.0], [0.5, 1.0], [2.0, 0.0]])
          print([round(float(c), 4) for c in hvp(W, np.array([0.3, -0.2]), np.array([1.0, 2.0]))])
        solution: |
          import numpy as np


          def grad(W, x):
              h = np.tanh(W @ x)
              return W.T @ ((1 - h ** 2) * h)


          def hvp(W, x, v):
              h = np.tanh(W @ x)
              hdot = (1 - h ** 2) * (W @ v)
              return W.T @ ((1 - 3 * h ** 2) * hdot)


          W = np.array([[1.0, -1.0], [0.5, 1.0], [2.0, 0.0]])
          print([round(float(c), 4) for c in hvp(W, np.array([0.3, -0.2]), np.array([1.0, 2.0]))])
        tests: |
          import numpy as _np
          def _grad(W, x):
              h = _np.tanh(W @ x)
              return W.T @ ((1 - h ** 2) * h)
          def _num(W, x, v):
              return (_grad(W, x + 1e-5 * v) - _grad(W, x - 1e-5 * v)) / 2e-5
          _W = _np.array([[1.0, -1.0], [0.5, 1.0], [2.0, 0.0]])
          _x = _np.array([0.3, -0.2])
          _v = _np.array([1.0, 2.0])
          _r = hvp(_W, _x, _v)
          assert _np.shape(_r) == (2,), "The product has the shape of x"
          assert _np.allclose(_r, _num(_W, _x, _v), atol=1e-7), "The product should agree with a central difference of the gradient to 7 decimals. The tangent of h - h**3 is (1 - 3 h**2) times the tangent of h"
          _rng = _np.random.default_rng(1)
          _W2 = _rng.normal(size=(4, 3))
          _x2 = _rng.normal(size=3)
          _v2 = _rng.normal(size=3)
          assert _np.allclose(hvp(_W2, _x2, _v2), _num(_W2, _x2, _v2), atol=1e-7), "For a random 4 by 3 layer the product should agree with a central difference of the gradient"
          assert _np.allclose(hvp(_W2, _x2, 2 * _v2), 2 * hvp(_W2, _x2, _v2)), "The product is linear in v"
          assert "eye" not in source and "diag" not in source, "Do not build a matrix: scale entry by entry"
          assert output.strip() == "[1.3384, 2.7577]", "The program should print [1.3384, 2.7577]"
        wrong:
          - |
            import numpy as np


            def grad(W, x):
                h = np.tanh(W @ x)
                return W.T @ ((1 - h ** 2) * h)


            def hvp(W, x, v):
                h = np.tanh(W @ x)
                hdot = (1 - h ** 2) * (W @ v)
                return W.T @ ((1 - h ** 2) * hdot)


            print("[1.3384, 2.7577]")
          - |
            import numpy as np


            def grad(W, x):
                h = np.tanh(W @ x)
                return W.T @ ((1 - h ** 2) * h)


            def hvp(W, x, v):
                h = np.tanh(W @ x)
                return W.T @ ((1 - 3 * h ** 2) * (W @ v))


            print("[1.3384, 2.7577]")
          - |
            import numpy as np


            def grad(W, x):
                h = np.tanh(W @ x)
                return W.T @ ((1 - h ** 2) * h)


            def hvp(W, x, v):
                return (grad(W, x + 0.1 * v) - grad(W, x)) / 0.1


            print("[1.3384, 2.7577]")
        explanation: |
          The function is the gradient calculation run a second time with a tangent beside each value. $\mathbf{h}$ has tangent $(1 - \mathbf{h}^2) \circ W\mathbf{v}$. The gradient applies $W^\top$ to $\mathbf{h} - \mathbf{h}^3$, whose tangent is $(1 - 3\mathbf{h}^2)$ times that of $\mathbf{h}$. $W$ is constant, so the last step is unchanged.

          Three matrix-vector products and some entrywise arithmetic: about the cost of two gradients, whatever the size of the layer.

          The first wrong version differentiates $\mathbf{h}$ but treats the slope $1 - \mathbf{h}^2$ as a constant. What it returns is $J^\top J\mathbf{v}$, with $J$ the Jacobian of the layer. That is not the Hessian, but it is a famous approximation to it, the **Gauss-Newton** matrix: it drops the term containing the second derivative of $\tanh$, is always positive semidefinite, and is what many second-order methods deliberately use.
    - question:
        id: write-sharpness
        type: code
        mode: write
        system: s2
        prompt: |
          Write `top_curvature(hvp, n, steps)`. `hvp` is a function taking a vector and returning the Hessian times that vector, for a symmetric Hessian of size `n`. Start from the vector of ones scaled to length 1, apply `steps` rounds of power iteration, and return the Rayleigh quotient of the final unit vector as a float. Use `hvp` and nothing else to reach the Hessian.
        starter: |
          import numpy as np


          def top_curvature(hvp, n, steps):
              return 1.0


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          x = np.array([1.0, 0.0, -1.0])
          top = top_curvature(lambda v: A @ v + 3 * x ** 2 * v, 3, 60)
          print(round(top, 4), round(2 / top, 4))
        solution: |
          import numpy as np


          def top_curvature(hvp, n, steps):
              v = np.ones(n) / np.sqrt(n)
              for step in range(steps):
                  w = hvp(v)
                  v = w / np.linalg.norm(w)
              return float(v @ hvp(v))


