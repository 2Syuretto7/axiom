          import numpy as np

          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])


          def f(x):
              return 0.5 * float(x @ A @ x) + 0.25 * float((x ** 4).sum())


