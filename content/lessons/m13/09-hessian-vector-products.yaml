        explanation: |
          This is the power iteration of the spectral theory lessons, with one change: the matrix has been replaced by a function. The loop never asks for an entry of the Hessian, so it runs unchanged on a model with a million parameters, where `hvp` would be a gradient run on dual numbers.

          At the point $(1, 0, -1)$ the Hessian of the starter's function is $A$ with 3 added to two of its diagonal entries. Its largest eigenvalue is $4 + \sqrt3 \approx 5.7321$. That is the sharpest curvature of the function at this point, and $2/5.7321 \approx 0.3489$ is the largest step size for which gradient descent is stable there.

          Measuring $\lambda_{\max}$ of the Hessian in this way during training is how the sharpness of a loss is tracked, and a few dozen products are enough.

          The first wrong version returns the length of $H\mathbf{v}$, which is the size of the eigenvalue without its sign. A negative top eigenvalue means the function curves downwards most strongly, which is a different situation altogether.
    - question:
        id: fix-linear
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `hvp(x, v)` should return the Hessian-vector product of $f(\mathbf{x}) = \tfrac12\mathbf{x}^\top A\mathbf{x} + \tfrac14\sum_ix_i^4$, whose gradient is $A\mathbf{x} + \mathbf{x}^3$. The program prints its largest difference from a central difference of the gradient, which should be `0.0`. Fix `hvp`.
