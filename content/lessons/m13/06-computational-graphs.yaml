          The two recursions use the same arrows with the same slopes. The forward one visits nodes in order and writes into the node that **reads**. The backward one visits them in reverse and writes into the nodes that **are read**. Mixing the order of one with the direction of the other gives numbers that are wrong but not obviously absurd.

