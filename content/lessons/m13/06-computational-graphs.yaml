concept: m13.computational-graphs
minutes: 85
claim: You can write any calculation as a list of elementary steps and as a directed acyclic graph, state the chain rule on such a graph as a sum over all paths of the products of the local derivatives, show that the number of paths can grow exponentially, replace the sum over paths by a recursion over the nodes that runs either from the inputs or from the output, and say why a value that is used twice has its contributions added.
recalls: [m13.jacobian-vector-and-vector-jacobian-products]
uses: [m13.the-method-of-differentials, m13.derivatives-with-respect-to-vectors, m12.multivariable-chain-rule, m12.partial-derivatives, m10.chain-rule, e6.scalar-computational-graph, e6.reverse-mode-on-scalars, e6.topological-ordering-of-the-graph, e3.graphs-and-traversal, e3.topological-sort, e3.dynamic-programming, e1.comprehensions-and-iterators, e1.complexity-and-big-o, e5.arrays-dtype-and-shape, e0.functions, e0.loops, e0.lists-and-tuples]
leads: [m13.reverse-mode-differentiation-and-its-cost, m13.forward-mode-and-dual-numbers]
starter: |
  # Scratch space. f = (x1 x2 + x1) * (x1 x2), written as a list of steps.
  # parents[i] are the steps that step i reads. partials[i] are its local slopes.
  x1, x2 = 2.0, 3.0
  v = [x1, x2]
  v.append(v[0] * v[1])   # v2
  v.append(v[2] + v[0])   # v3
  v.append(v[3] * v[2])   # v4, the output
  parents = [[], [], [0, 1], [2, 0], [3, 2]]
  partials = [[], [], [v[1], v[0]], [1.0, 1.0], [v[2], v[3]]]
  print(v)

  # Three paths lead from v0 to v4. Multiply along each and add.
  print(3.0 * 8.0 + 3.0 * 1.0 * 6.0 + 1.0 * 6.0)
parts:
  recall:
    - text: |
        [[m13.jacobian-vector-and-vector-jacobian-products]] passed vectors through chains of functions, forward and backward, and ended by noting that real computations are not chains. Today's object is what they are. Three quick pulls first.
  puzzle:
    - text: |
        Take $f(x_1, x_2) = (x_1x_2 + x_1)\cdot(x_1x_2)$ at $x_1 = 2$, $x_2 = 3$. As a list of single operations:

        $$v_0 = x_1, \quad v_1 = x_2, \quad v_2 = v_0v_1, \quad v_3 = v_2 + v_0, \quad v_4 = v_3v_2.$$

        The product $v_2$ is computed once and used twice, and so is $v_0$. Draw an arrow from each value to every value computed from it, and write on each arrow the local slope. The derivative of the output with respect to $x_1$ is then found by multiplying the slopes along every route from $v_0$ to $v_4$, and adding the routes. There are three routes, and the starter adds them.

        ```
        [2.0, 3.0, 6.0, 8.0, 48.0]
        48.0
        ```

        So $\partial f/\partial x_1 = 48$. Three routes are no trouble.

        Now take a function made of 30 steps, each of which multiplies the previous value by itself: $v_i = v_{i-1} \cdot v_{i-1}$. Each step reads the previous value **twice**, so there are two arrows from each value to the next, and the number of routes from the input to the output is $2^{30}$, about a thousand million.

        The engine written earlier in this course differentiates that function with 30 steps of work, not a thousand million.

        **How can a sum over a thousand million routes be computed in 30 steps? And what exactly is the object, with its values, arrows and routes, on which this is done?**
  intuition:
    - text: |
        The object is a **computational graph**. Its nodes are the values $v_0, v_1, \dots$ of a calculation. There is an arrow from $v_j$ to $v_i$ whenever $v_i$ is computed directly from $v_j$, and the arrow carries the local slope $\partial v_i/\partial v_j$. Because each value is computed only from earlier ones, the arrows never form a cycle.

        The chain rule of several variables, applied again and again, says: the derivative of one node with respect to another is the **sum over all paths** between them of the **product of the slopes along the path**. That is correct, and it can be hopeless, because paths multiply. Whenever two routes part and meet again, the count doubles.

        The way out is the oldest trick in algorithms. Many of those paths share long stretches. All the paths from $v_0$ to the output that pass through $v_2$ end with the same collection of routes from $v_2$ onwards. So compute once, for each node, the total over all routes **from that node to the output**. Call it the node's **adjoint**, $\bar v_i = \partial(\text{output})/\partial v_i$.

        The adjoint of a node follows from the adjoints of the nodes it feeds:

        $$\bar v_j = \sum_{i \text{ reads } j}\bar v_i\,\frac{\partial v_i}{\partial v_j}.$$

        Every route from $v_j$ to the output begins with one arrow, to some $v_i$, and continues with a route from $v_i$. Summing over the first arrow, with the rest already totalled, gives the formula. Start with the output, whose adjoint is 1, and work backwards. Each **arrow** is used exactly once.

        For the 30 squarings there are 60 arrows, so 60 multiplications. The $2^{30}$ paths are all still accounted for. They are summed in bulk, a factor at a time: $\bar v_{i-1} = \bar v_i\,v_{i-1} + \bar v_i\,v_{i-1}$.

        And the sum in the formula is why a value used twice **adds** its two contributions: it lies on two families of routes.
  derivation:
    - text: |
        **Evaluation trace.** A calculation with inputs $x_1, \dots, x_n$ is a list

        $$v_i = \phi_i\big(v_j : j \in \operatorname{pa}(i)\big), \qquad i = n, n + 1, \dots, N,$$

        where $v_0, \dots, v_{n-1}$ are the inputs, each $\phi_i$ is an elementary operation with known partial derivatives, and $\operatorname{pa}(i)$, the **parents** of $i$, are indices smaller than $i$. The last value is the output. Such a list is also called a Wengert list, or a tape.

        **The graph.** Nodes $0, \dots, N$, with an arrow $j \to i$ for each $j \in \operatorname{pa}(i)$, labelled $d_{ij} = \partial\phi_i/\partial v_j$ evaluated at the current values. It is a directed acyclic graph, and the order of the list is a topological order: every node comes after its parents. If $\phi_i$ reads the same value twice, as in $v \cdot v$, there are two arrows.

        **Chain rule on the graph.**

        $$\frac{\partial v_N}{\partial v_j} = \sum_{\text{paths } j \to \dots \to N}\ \prod_{\text{arrows on the path}} d.$$

        *Why.* Induction on the list: $v_N$ depends on $v_j$ through each of its parents, and the chain rule for several intermediate variables adds one term for each.

        **Paths can explode.** With $k$ squarings $v_i = v_{i-1}v_{i-1}$ there are $2^k$ paths. More generally a graph with $N$ nodes can have a number of paths exponential in $N$.

        **Two recursions.** Both replace the sum over paths by a pass over the nodes.

        *Backward, adjoints.* Define $\bar v_i = \partial v_N/\partial v_i$. Then $\bar v_N = 1$ and

        $$\bar v_j = \sum_{i:\,j \in \operatorname{pa}(i)}\bar v_i\,d_{ij},$$

        computed for $j = N - 1, N - 2, \dots, 0$. At the end $\bar v_0, \dots, \bar v_{n-1}$ are **all** the partial derivatives of the output.

        *Forward, tangents.* Choose one input $x_k$ and define $\dot v_i = \partial v_i/\partial x_k$. Then $\dot v_k = 1$, the other inputs have $\dot v = 0$, and

        $$\dot v_i = \sum_{j \in \operatorname{pa}(i)}d_{ij}\,\dot v_j,$$

        computed for $i = n, \dots, N$. At the end $\dot v_N$ is **one** partial derivative.

        Each recursion uses every arrow once. Their cost is proportional to the number of arrows, which is the cost of the calculation itself.

        *The puzzle.* Adjoints, backwards: $\bar v_4 = 1$. $\bar v_3 = 1 \cdot 6 = 6$. $\bar v_2 = 1 \cdot 8 + 6 \cdot 1 = 14$, two contributions, since $v_2$ is read by $v_4$ and by $v_3$. $\bar v_1 = 14 \cdot 2 = 28$. $\bar v_0 = 14 \cdot 3 + 6 \cdot 1 = 48$. Both partial derivatives, $48$ and $28$, from one pass.
    - question:
        id: derivation-adjoint
        type: numeric
        system: s2
        prompt: |
          $v_0 = a = 2$, $v_1 = b = 3$, $v_2 = v_0 + v_1$, $v_3 = v_2 \cdot v_0$. What is the adjoint $\bar v_0$, the derivative of the output with respect to $a$?
        answer: "7"
        explanation: |
          $\bar v_3 = 1$. The product $v_3 = v_2v_0$ has local slopes $v_0 = 2$ towards $v_2$ and $v_2 = 5$ towards $v_0$. So $\bar v_2 = 2$. The node $v_0$ is read twice, by $v_2$ with slope 1 and by $v_3$ with slope 5, so $\bar v_0 = 2 \cdot 1 + 1 \cdot 5 = 7$. Check: the function is $(a + b)a = a^2 + ab$, with derivative $2a + b = 7$. And $\bar v_1 = 2 \cdot 1 = 2 = a$.
    - text: |
        **Vector nodes.** Nothing changes if a node holds a vector or a matrix. The label on an arrow becomes a Jacobian, the forward recursion applies JVPs, $\dot{\mathbf{v}}_i = \sum_jJ_{ij}\dot{\mathbf{v}}_j$, and the backward recursion applies VJPs, $\bar{\mathbf{v}}_j = \sum_iJ_{ij}^\top\bar{\mathbf{v}}_i$. The Jacobians are never formed. A chain is the special case in which every node has one parent and one child.

        **Fan-out and fan-in.**

        - A node with several children, *fan-out*: backward, its adjoint is the **sum** of what the children send. Forward, its tangent is simply read by each child.
        - A node with several parents, *fan-in*: forward, its tangent is the **sum** of the contributions of the parents. Backward, its adjoint is sent to each parent, multiplied by that parent's slope.

        The two recursions are mirror images, with the roles of adding and copying exchanged.

        **What the graph depends on.** The graph records the operations that were actually carried out, for the given inputs. A program with a loop gives a graph as long as the loop ran. A program with a branch gives the graph of the branch taken. The derivative obtained is that of the straight-line calculation that happened. It is the derivative of the program wherever the same operations would be carried out for all nearby inputs.

        **Three ways to differentiate a program.**

        - *Numerical:* finite differences. Approximate, and one or two evaluations per input.
        - *Symbolic:* manipulate the formula. Exact, but a formula written as a tree repeats every shared subexpression, and its derivative can swell enormously.
        - *Automatic:* apply the chain rule to the **values** on the graph, by one of the two recursions. Exact to rounding, and its cost is tied to that of the calculation. It is neither of the other two.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the argument that turns the sum over paths into the backward recursion.
        steps:
          - 'The derivative of the output with respect to a node is the sum, over all paths from the node to the output, of the products of the slopes.'
          - 'Every such path begins with one arrow, from the node to one of the nodes that read it.'
          - 'Group the paths by that first arrow.'
          - 'Within a group, the remaining stretches are all the paths from the reading node to the output, whose total is that node''s adjoint.'
          - 'So the adjoint of the node is the sum, over the nodes that read it, of the slope of the arrow times the adjoint of the reader.'
        explanation: Paths are grouped by their first step, and what follows the first step has already been totalled.
  formal:
    - text: |
        **Trace.** $v_i = \phi_i(v_{\operatorname{pa}(i)})$ for $i = n, \dots, N$, with $v_0, \dots, v_{n-1}$ inputs and $v_{N-m+1}, \dots, v_N$ outputs. $\operatorname{ch}(j) = \{i : j \in \operatorname{pa}(i)\}$ are the children of $j$.

        **As one equation.** Stack all values in $\mathbf{v} \in \mathbb{R}^{N+1}$ and let $L$ be the strictly lower triangular matrix with $L_{ij} = \partial\phi_i/\partial v_j$. Differentiating the trace, $d\mathbf{v} = L\,d\mathbf{v} + d\mathbf{x}$ (with $d\mathbf{x}$ supported on the inputs), so

        $$d\mathbf{v} = (I - L)^{-1}d\mathbf{x}, \qquad (I - L)^{-1} = I + L + L^2 + \dots + L^N.$$

        The entry $(i, j)$ of $L^k$ is the sum over paths of length $k$ from $j$ to $i$ of the products of the slopes: the path formula. The forward recursion is the solution of the triangular system $(I - L)\dot{\mathbf{v}} = \mathbf{e}_k$ by forward substitution. The backward recursion is the solution of $(I - L)^\top\bar{\mathbf{v}} = \mathbf{e}_N$ by back substitution.

        **Forward.** $\dot v_i = \sum_{j \in \operatorname{pa}(i)}\frac{\partial\phi_i}{\partial v_j}\dot v_j$, in increasing $i$.

        **Backward.** $\bar v_j = \sum_{i \in \operatorname{ch}(j)}\bar v_i\frac{\partial\phi_i}{\partial v_j}$, in decreasing $j$.

        **Cost.** Each recursion performs one multiplication and one addition per arrow: $O(E)$ for $E$ arrows, and $E \le cN$ when every elementary operation has at most $c$ arguments.

        **Number of paths.** If $P_i$ is the number of paths from a source to node $i$, then $P_i = \sum_{j \in \operatorname{pa}(i)}P_j$, counted with multiplicity. For the squaring chain $P_k = 2^k$.

        **Validity.** If every $\phi_i$ is differentiable at its arguments, the composite is differentiable and both recursions return its exact partial derivatives. Where a branch condition is an equality, or an operation such as $|x|$ or $\max$ is evaluated at a kink, the result is the derivative of one of the smooth pieces.
