        output: |
          32 614.219 614.219
        explanation: There are 32 paths, and the backward recursion sums them all with ten multiplications, two per step. The result is the derivative of x to the power 32.
  work:
    - text: Slower now. The first task counts what the recursions avoid.
    - question:
        id: write-count
        type: code
        mode: write
        system: s2
        prompt: |
          A graph is given as `parents`, where `parents[i]` lists the nodes that node `i` reads, all with smaller index, with a node listed twice if it is read twice. Write `count_paths(parents, source)` returning a list whose entry `i` is the number of paths from `source` to node `i`. The number of paths from a node to itself is 1.
        starter: |
          def count_paths(parents, source):
              return [0 for node in parents]


          print(count_paths([[], [], [0, 1], [2, 0], [3, 2]], 0))
          print(count_paths([[]] + [[i, i] for i in range(30)], 0)[-1])
        solution: |
          def count_paths(parents, source):
              count = [0 for node in parents]
              count[source] = 1
              for i in range(source + 1, len(parents)):
                  count[i] = sum(count[j] for j in parents[i])
              return count


          print(count_paths([[], [], [0, 1], [2, 0], [3, 2]], 0))
          print(count_paths([[]] + [[i, i] for i in range(30)], 0)[-1])
        tests: |
          _g = [[], [], [0, 1], [2, 0], [3, 2]]
          assert count_paths(_g, 0) == [1, 0, 1, 2, 3], "From v0 in the graph of the puzzle there is 1 path to v2, 2 to v3 and 3 to v4, and none to the other input"
          assert count_paths(_g, 1) == [0, 1, 1, 1, 2], "From v1 there is 1 path to v2, 1 to v3 and 2 to v4"
          assert count_paths(_g, 2) == [0, 0, 1, 1, 2], "From v2 there are 2 paths to the output, and none to the nodes before it"
          assert count_paths([[], [0], [1], [2]], 0) == [1, 1, 1, 1], "In a chain there is exactly one path to each node"
          assert count_paths([[]] + [[i, i] for i in range(10)], 0)[-1] == 1024, "Ten squarings give 2 to the power 10 paths. A node read twice counts twice"
          assert count_paths([[], [0], [0], [1, 2], [3], [3], [4, 5]], 0)[-1] == 4, "Two diamonds in a row give 2 times 2 paths"
          assert output.strip() == "[1, 0, 1, 2, 3]\n1073741824", "The program should print [1, 0, 1, 2, 3] and then 1073741824"
        wrong:
          - |
            def count_paths(parents, source):
                count = [0 for node in parents]
                count[source] = 1
                for i in range(source + 1, len(parents)):
                    count[i] = sum(count[j] for j in set(parents[i]))
                return count

            print("[1, 0, 1, 2, 3]\n1073741824")
          - |
            def count_paths(parents, source):
                count = [0 for node in parents]
                count[source] = 1
                for i in range(source + 1, len(parents)):
                    count[i] = len(parents[i])
                return count

            print("[1, 0, 1, 2, 3]\n1073741824")
          - |
            def count_paths(parents, source):
                count = [1 for node in parents]
                for i in range(source + 1, len(parents)):
                    count[i] = sum(count[j] for j in parents[i])
                return count

            print("[1, 0, 1, 2, 3]\n1073741824")
        explanation: |
          A path to node $i$ arrives through one of its parents, so the number of paths to $i$ is the sum of the numbers of paths to its parents. One pass in the order of the list fills the table. This is the forward recursion with every slope replaced by 1.

          The second printed number is $2^{30}$: more than a thousand million paths through a graph of 31 nodes and 60 arrows. The function counted them in 30 additions, by the same sharing of work that lets a derivative be computed without visiting them one by one.

          The first wrong version uses a set, which drops the repeated parent. Then a squaring looks like a single arrow, and the derivative of $v \cdot v$ would come out as $v$ in place of $2v$.
    - question:
        id: write-backward
        type: code
        mode: write
        system: s2
        prompt: |
          Write `adjoints(parents, partials)`. `parents[i]` lists the nodes that node `i` reads, and `partials[i]` the local slopes of node `i` with respect to each of them, in the same order. The last node is the output. Return the list of adjoints of all nodes: the derivative of the output with respect to each.
        starter: |
          def adjoints(parents, partials):
              return [0.0 for node in parents]


          v = [2.0, 3.0]
          v.append(v[0] * v[1])
          v.append(v[2] + v[0])
          v.append(v[3] * v[2])
          print(adjoints([[], [], [0, 1], [2, 0], [3, 2]], [[], [], [v[1], v[0]], [1.0, 1.0], [v[2], v[3]]]))
        solution: |
          def adjoints(parents, partials):
              bar = [0.0 for node in parents]
              bar[-1] = 1.0
              for i in range(len(parents) - 1, -1, -1):
                  for j, d in zip(parents[i], partials[i]):
                      bar[j] += bar[i] * d
              return bar


          v = [2.0, 3.0]
          v.append(v[0] * v[1])
          v.append(v[2] + v[0])
          v.append(v[3] * v[2])
          print(adjoints([[], [], [0, 1], [2, 0], [3, 2]], [[], [], [v[1], v[0]], [1.0, 1.0], [v[2], v[3]]]))
        tests: |
          _p = [[], [], [0, 1], [2, 0], [3, 2]]
          _d = [[], [], [3.0, 2.0], [1.0, 1.0], [6.0, 8.0]]
          assert adjoints(_p, _d) == [48.0, 28.0, 14.0, 6.0, 1.0], "For the graph of the puzzle the adjoints are 48, 28, 14, 6, 1. Start with 1 at the output and work backwards, adding one contribution per arrow"
          assert adjoints([[], [0], [1], [2]], [[], [2.0], [3.0], [5.0]]) == [30.0, 15.0, 5.0, 1.0], "In a chain the adjoints are the running products of the slopes from the output back"
          _x = 1.1
          _v = [_x]
          for _k in range(5):
