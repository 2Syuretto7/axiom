    - question:
        id: work-shared
        type: choice
        system: s2
        prompt: |
          In a network the same weight matrix $W$ is applied at three different places, as in a recurrent network unrolled for three steps. How is the gradient of the loss with respect to $W$ obtained?
        options:
          - 'From the last place where $W$ is used, since later uses override earlier ones.'
          - 'As the sum of three terms, one for each use. $W$ is a node with three children, and its adjoint is the sum of what each child sends back.'
          - 'As the product of the three contributions.'
          - 'It is undefined, since a variable may be used only once.'
        answer: 1
        explanation: |
          Fan-out adds. Each use of $W$ lies on its own family of paths to the loss, and the derivative is the sum over all paths. In practice each use computes its "error times input" outer product and they are accumulated into one gradient. The same rule covers a bias added to every position, a filter applied at every location of an image, and an embedding looked up several times. Sharing a parameter in the forward calculation means adding its gradients in the backward one.
    - question:
        id: work-count-arrows
        type: numeric
        system: s2
        prompt: |
          A calculation has 5 inputs and performs 1000 elementary operations, each with two arguments. How many multiplications does the backward recursion perform, at one per arrow?
        answer: "2000"
        explanation: |
          Each operation has two parents, so there are $2 \times 1000 = 2000$ arrows, and the backward pass does one multiply-and-add for each. The number of inputs does not enter: all 5 partial derivatives, or 5 million, come out of the same pass. The forward recursion also does 2000 multiplications, but delivers the derivative with respect to one input only, so all 5 would cost 10 000.
    - question:
        id: work-branch
        type: choice
        system: s2
        prompt: |
          A program computes `y = x * x if x > 0 else -x`. It is differentiated automatically at `x = 3`, and then at `x = -2`. What comes out, and what is the caveat?
        options:
          - 'An error, since programs with branches cannot be differentiated.'
          - 'At 3 the graph is that of `x * x`, giving 6. At -2 the graph is that of `-x`, giving -1. Each is the derivative of the piece that was executed, which is the derivative of the program wherever nearby inputs take the same branch. At `x = 0`, where the branch switches and the function jumps in slope, the answer is that of whichever piece ran.'
          - 'The average of the two derivatives in both cases.'
          - 'Zero in both cases, since a condition has no derivative.'
        answer: 1
        explanation: |
          The graph records what happened, and a comparison is not an arithmetic operation, so it leaves no arrow. Away from the switching point the program agrees with one smooth piece on a whole neighbourhood, and the derivative of the piece is the derivative of the program. At the switching point the program may not be differentiable at all, and the tool reports a one-sided answer without warning. The rectifier $\max(0, x)$ at exactly 0 is the everyday example. In practice such points are hit with probability zero and the convention chosen there does not matter.
  connections:
    - text: |
        A calculation is a list of elementary steps, and a **computational graph**: values as nodes, an arrow wherever one value is read to compute another, the local slope on each arrow, and no cycles. The derivative of the output with respect to any node is the sum over all paths of the products of the slopes, and the paths can number $2^{30}$ for 30 steps.

        The sum is never taken path by path. A recursion over the nodes shares the work. Backward, the **adjoint** of a node is the sum, over the nodes that read it, of slope times adjoint. Forward, the **tangent** of a node is the sum, over the nodes it reads, of slope times tangent. Each uses every arrow once. A value used twice adds its contributions, because it lies on two families of paths.

        Both recursions cost the same per pass. They differ in what a pass delivers: the backward one gives the derivative of one output with respect to everything, and the forward one gives the derivative of everything with respect to one input. Exactly how much the backward pass costs compared with the calculation itself, in time and above all in memory, decides what can be trained and what cannot: [[m13.reverse-mode-differentiation-and-its-cost]].
