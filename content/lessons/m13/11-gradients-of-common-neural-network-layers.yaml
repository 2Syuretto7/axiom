    - question:
        id: work-shape
        type: choice
        system: s2
        prompt: |
          A layer computes $Y = XW$ with $X$ of shape $32 \times 100$ and $W$ of shape $100 \times 10$. The backward sweep delivers $\bar Y$ of shape $32 \times 10$. Which expression can be $\bar W$?
        options:
          - '$\bar YX^\top$'
          - '$X^\top\bar Y$, of shape $100 \times 10$'
          - '$X\bar Y^\top$'
          - '$\bar Y^\top X$, of shape $10 \times 100$'
        answer: 1
        explanation: |
          $\bar W$ must have the shape of $W$, $100 \times 10$. The first and third products are not even defined: their inner sizes, 10 against 100 and 100 against 10 with the wrong partners, do not match. The fourth is defined and is the transpose of the right answer, which is what you get by using the convention with examples as columns. Only $X^\top\bar Y$ has shape $100 \times 10$. Its entry $(i, j)$ is $\sum_kX_{ki}\bar Y_{kj}$: input $i$ times the gradient at output $j$, added over the batch, as the weight joining them requires.
    - question:
        id: work-mask
        type: numeric
        system: s2
        prompt: |
          A rectifier layer received the inputs $(-1, 2, 0.5, -3)$ on the forward pass. On the backward pass the gradient $(5, 6, 7, 8)$ arrives at its output. What is the sum of the entries of the gradient it passes down?
        answer: "13"
        explanation: |
          The units with positive input, the second and third, pass their gradients through unchanged: 6 and 7. The first and fourth had negative input, output 0, and slope 0, so they pass nothing. The gradient passed down is $(0, 6, 7, 0)$, with sum 13. A unit that is inactive for every example in the data receives no gradient at all and cannot change: it is called dead. This is the mask at work, and it is why the forward pass must keep the sign of each input, or equivalently the output.
    - question:
        id: work-residual
        type: choice
        system: s2
        prompt: |
          A network of 100 blocks computes $\mathbf{x}_{k+1} = \mathbf{x}_k + f_k(\mathbf{x}_k)$, where each $f_k$ has a small Jacobian. A plain network computes $\mathbf{x}_{k+1} = f_k(\mathbf{x}_k)$ with the same $f_k$. What does the backward rule say about the gradient reaching the first block?
        options:
          - 'It is the same in both, since the functions $f_k$ are the same.'
          - 'In the plain network it is multiplied by 100 small Jacobians and vanishes. With the connections each block passes $\bar{\mathbf{x}}_{k+1} + J_k^\top\bar{\mathbf{x}}_{k+1}$, so the gradient from the top arrives nearly unchanged, plus small corrections.'
          - 'In the residual network it explodes, since 100 gradients are added.'
          - 'In both it is exactly zero.'
        answer: 1
        explanation: |
          The Jacobian of a residual block is $I + J_k$. A product of 100 factors each close to the identity stays of moderate size, while a product of 100 small factors is astronomically small. In terms of paths: the gradient can travel from the loss to any block along the chain of identity connections without passing through a single $f_k$. This one line of the backward rule, $\bar{\mathbf{x}} = \bar{\mathbf{y}} + J_f^\top\bar{\mathbf{y}}$, is what made networks of hundreds of layers trainable, and every transformer is built from such blocks.
  connections:
    - text: |
        The gradient of softmax with cross-entropy is $\mathbf{p} - \mathbf{y}$ because the logarithm and the exponential undo each other, leaving predicted minus true. Most layers are as brief. An **affine layer** returns $\bar YW^\top$, $X^\top\bar Y$ and the column sums of $\bar Y$. An **activation** multiplies by its slope, and the rectifier masks. A **sum** copies its gradient, a **broadcast** sums it, and a **residual connection** adds the incoming gradient to what its branch returns. Each rule is fixed by a differential, confirmed by its shapes, and tested by a finite difference along one random direction.

        That closes the cluster. A derivative with respect to a vector or a matrix is a gradient of the same shape, found by the method of differentials. A calculation is a graph, and its gradient is one backward sweep costing a few evaluations, at a price in memory. Forward mode, Hessian-vector products and implicit differentiation cover the cases the plain sweep does not. And a network's backward pass is a few short rules applied in reverse.

        You have now written all of this by hand, and built an engine that automates it. The library used throughout the field is that engine at scale: arrays that record their own graph, a stored backward rule for every operation, and the same sweep, run on hardware that does the matrix products in parallel. It begins with its array type: [[e7.tensors-and-devices]].
