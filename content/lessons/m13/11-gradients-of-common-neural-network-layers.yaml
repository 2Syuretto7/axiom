          The gradient is $(P - Y)/B$. The code builds it without ever forming the one-hot matrix $Y$: start from $P/B$, and subtract $1/B$ at the position of each correct class.

          Subtracting the row's largest score changes no probability, since it multiplies top and bottom of the softmax by the same number. It makes the largest exponent 0, so nothing overflows. The log of a probability is taken as the shifted score minus the log of the sum, which stays finite even when the probability itself rounds to zero. The last wrong version leaves this out and is correct for small scores. For a score of 1000 it computes $e^{1000}$, which is infinite, and returns `nan`.

          The loss for $(1000, 0)$ with class 0 is essentially 0: confident and right. For $(0, 1000)$ with class 0 it is 1000: confident and wrong. The gradient there is $(-0.5, 0.5)$, the full error divided by the batch size of 2. However wrong the prediction, the gradient with respect to the scores never exceeds 1 in size, which is one reason this pairing of output and loss trains so reliably.
