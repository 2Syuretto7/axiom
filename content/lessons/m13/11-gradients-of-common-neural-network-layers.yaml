concept: m13.gradients-of-common-neural-network-layers
minutes: 95
claim: You can derive and implement the backward rule of each standard layer (the affine layer on a batch, elementwise activations, softmax with cross-entropy, sums, means and broadcasts, and the residual connection), check every rule by its shapes and by a finite difference, and chain the rules into the complete backward pass of a small network.
recalls: [m13.implicit-differentiation-through-solvers]
uses: [m13.derivatives-with-respect-to-matrices, m13.the-method-of-differentials, m13.jacobian-vector-and-vector-jacobian-products, m13.computational-graphs, m13.reverse-mode-differentiation-and-its-cost, m13.derivatives-with-respect-to-vectors, m12.jacobian, m12.multivariable-chain-rule, m10.derivatives-of-exp-log-and-trig, e6.tensor-valued-autograd, e6.broadcasting-in-the-backward-pass, e6.gradient-checking, e6.training-an-mlp-on-your-own-engine, e5.broadcasting, e5.axis-operations-and-reductions, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [e7.tensors-and-devices]
starter: |
  # Scratch space. Softmax, then the loss -log(probability of the right class).
  import numpy as np


  def loss(z, label):
      p = np.exp(z) / np.exp(z).sum()
      return -float(np.log(p[label]))


  z = np.array([2.0, 1.0, 0.0])
  p = np.exp(z) / np.exp(z).sum()
  print([round(float(c), 4) for c in p])

  h = 1e-6                          # the gradient with respect to z, measured
  print([round((loss(z + h * e, 0) - loss(z - h * e, 0)) / (2 * h), 4) for e in np.eye(3)])
parts:
  recall:
    - text: |
        [[m13.implicit-differentiation-through-solvers]] completed the toolkit: even a solver has a backward rule. The cluster closes by putting the tools to their everyday use, the handful of layers from which networks are assembled. Three quick pulls first.
  puzzle:
    - text: |
        A classifier ends with two steps. **Softmax** turns a vector of scores $\mathbf{z}$ into probabilities, $p_i = e^{z_i}/\sum_je^{z_j}$. The **cross-entropy** loss is then $-\log p_y$, where $y$ is the correct class.

        Each step is awkward to differentiate. Every probability depends on every score, so the Jacobian of softmax is a full matrix, and the logarithm puts a $1/p_y$ in front.

        The starter takes the scores $(2, 1, 0)$ with correct class 0. It prints the probabilities, and then the gradient of the loss with respect to the scores, measured by finite differences.

        ```
        [0.6652, 0.2447, 0.09]
        [-0.3348, 0.2447, 0.09]
        ```

        The second and third entries of the gradient **are** the probabilities. The first is the probability minus 1.

        **Why does the gradient of this two-step calculation come out as simply "probabilities minus the right answer"? And is every layer's backward rule as short?**
  intuition:
    - text: |
        Nearly, yes. A network is built from a small set of layer types, and each has a backward rule of one or two lines. Training never needs anything else. The backward pass of the largest model is these few rules, called in reverse order.

        Every rule answers the same question. The backward sweep arrives at a layer with $\bar Y$, the gradient of the loss with respect to the layer's **output**. The layer must return the gradient with respect to its **input**, to pass further back, and with respect to its own **parameters**, to hand to the optimiser. That is a VJP, and you know how to find one: write the differential of the layer and rearrange.

        Two habits make the rules easy to get right.

        **Shapes.** A gradient has the shape of the thing it is the gradient of. For an affine layer with input $X$ of shape $B \times n$ and weights of shape $n \times m$, the incoming $\bar Y$ is $B \times m$. The gradient for $W$ must be $n \times m$, and the only product of $X$ and $\bar Y$ with that shape is $X^\top\bar Y$. Shapes will not prove a formula, but they catch most wrong ones.

        **Copies add, sums copy.** If a value is used in several places, the gradients coming back from them add up. If several values are summed into one, the gradient of the sum is copied back to each. A bias added to every row of a batch was used $B$ times, so its gradient is a sum over the $B$ rows.

        As for the puzzle: the loss is $-z_y + \log\sum_je^{z_j}$. The first term has slope $-1$ at the right class. The second has slope $e^{z_i}/\sum_je^{z_j}$, which is $p_i$. The logarithm and the exponentials were made for each other, and the awkward parts cancel.
  derivation:
    - text: |
        Throughout, a batch is a matrix with **one example per row**, and $\bar{\ }$ marks the gradient of the scalar loss.

        **Affine layer.** $Y = XW + \mathbf{1}\mathbf{b}^\top$, with $X$ of shape $B \times n$, $W$ of shape $n \times m$, and the bias $\mathbf{b}$ added to every row. The differential is $dY = dX\,W + X\,dW + \mathbf{1}\,d\mathbf{b}^\top$. Pair it with $\bar Y$ and move factors round the trace:

        $$dL = \operatorname{tr}(\bar Y^\top dY) = \operatorname{tr}\big((\bar YW^\top)^\top dX\big) + \operatorname{tr}\big((X^\top\bar Y)^\top dW\big) + (\bar Y^\top\mathbf{1})^\top d\mathbf{b}.$$

        $$\bar X = \bar YW^\top, \qquad \bar W = X^\top\bar Y, \qquad \bar{\mathbf{b}} = \bar Y^\top\mathbf{1}\ \ \text{(the column sums of }\bar Y).$$

        $\bar W = X^\top\bar Y$ is a sum of outer products, one per example: $\sum_i\mathbf{x}_i\bar{\mathbf{y}}_i^\top$.

        **Elementwise activation.** $Y = \phi(Z)$ applied entry by entry. Each entry depends on one entry, so the Jacobian is diagonal and

        $$\bar Z = \bar Y \circ \phi'(Z).$$

        | $\phi$ | $\phi'$, in terms of what was stored |
        |---|---|
        | rectifier $\max(0, z)$ | 1 where $z > 0$, else 0 |
        | $\tanh$ | $1 - y^2$ |
        | sigmoid $1/(1 + e^{-z})$ | $y(1 - y)$ |

        The rectifier's backward rule is a **mask**: the gradient passes where the unit was active and is blocked where it was not.

        **Softmax with cross-entropy.** For one example with scores $\mathbf{z}$ and correct class $y$:

        $$L = -\log\frac{e^{z_y}}{\sum_je^{z_j}} = -z_y + \log\sum_je^{z_j}, \qquad \frac{\partial L}{\partial z_i} = -[i = y] + \frac{e^{z_i}}{\sum_je^{z_j}} = p_i - [i = y].$$

        With $\mathbf{y}$ the one-hot vector of the correct class: $\ \bar{\mathbf{z}} = \mathbf{p} - \mathbf{y}$. For the mean loss over a batch, $\bar Z = (P - Y)/B$.

        The gradient is the **error**: what was predicted, minus what was true. It is zero only when the prediction is perfect, and its entries sum to zero.
    - question:
        id: derivation-uniform
        type: numeric
        system: s2
        prompt: |
          A classifier with 4 classes gives the scores $(0, 0, 0, 0)$, and the correct class is the third. What is the third entry of the gradient of the cross-entropy loss with respect to the scores?
        answer: "-0.75"
        explanation: |
          Equal scores give equal probabilities, $0.25$ each. The gradient is $\mathbf{p} - \mathbf{y} = (0.25, 0.25, -0.75, 0.25)$. A step of gradient descent moves against it: the score of the correct class goes up, and the others go down by a third as much each. The four entries sum to zero, as they always do, because adding the same number to every score changes no probability.
    - text: |
        **Sum, mean and broadcast.** For $s = \sum_ix_i$: $\ \bar x_i = \bar s$ for every $i$. For a mean over $B$ items: $\bar x_i = \bar s/B$. In the other direction, a value that is **broadcast**, copied into many positions, receives the **sum** of the gradients of all its copies. Summing and broadcasting are transposes of each other, as you found in [[e6.broadcasting-in-the-backward-pass]]. The bias rule above is this fact.

        **Fan-out.** If $\mathbf{x}$ feeds two layers, $\bar{\mathbf{x}}$ is the sum of what each sends back.

        **Residual connection.** $\mathbf{y} = \mathbf{x} + f(\mathbf{x})$. The input is used twice, so

        $$\bar{\mathbf{x}} = \bar{\mathbf{y}} + J_f^\top\bar{\mathbf{y}}.$$

        The first term is the incoming gradient, **unchanged**. However small $J_f^\top\bar{\mathbf{y}}$ becomes, the gradient cannot vanish along this path. The layer's Jacobian is $I + J_f$, with singular values near 1 when $f$ is small: exactly the condition that [[m13.reverse-mode-differentiation-and-its-cost]] asked of deep networks.

        **Softmax alone.** When softmax is not followed by cross-entropy, as inside attention, its Jacobian is needed: $\partial p_i/\partial z_j = p_i([i = j] - p_j)$, that is $J = \operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^\top$. It is symmetric, and its VJP needs no matrix: $\ \bar{\mathbf{z}} = \mathbf{p} \circ (\bar{\mathbf{p}} - \mathbf{p} \cdot \bar{\mathbf{p}})$.

        **A whole network.** For $X \to A = XW_1 + \mathbf{b}_1 \to H = \max(0, A) \to Z = HW_2 + \mathbf{b}_2 \to$ mean cross-entropy, the backward pass is the rules in reverse:

        $$\bar Z = \frac{P - Y}{B}, \quad \bar W_2 = H^\top\bar Z, \quad \bar{\mathbf{b}}_2 = \bar Z^\top\mathbf{1}, \quad \bar H = \bar ZW_2^\top, \quad \bar A = \bar H \circ [A > 0], \quad \bar W_1 = X^\top\bar A, \quad \bar{\mathbf{b}}_1 = \bar A^\top\mathbf{1}.$$

        Seven lines, each the cost of the matching forward line, using values the forward pass kept: $X$, $A$, $H$ and $P$.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the derivation of the gradient of softmax with cross-entropy.
        steps:
          - 'Write the loss as $-\log\big(e^{z_y}/\sum_je^{z_j}\big)$.'
          - 'Split the logarithm: $L = -z_y + \log\sum_je^{z_j}$.'
          - 'The first term has derivative $-1$ with respect to $z_y$ and 0 with respect to the other scores.'
          - 'The second term has derivative $e^{z_i}/\sum_je^{z_j} = p_i$ with respect to $z_i$.'
          - 'Together: $\partial L/\partial z_i = p_i - [i = y]$, the probabilities minus the one-hot vector.'
        explanation: The logarithm undoes the exponential in the numerator, and what remains of the denominator differentiates back into softmax.
  formal:
    - text: |
        Rows are examples. $\bar Y$ is the gradient with respect to the layer's output, and $\circ$ is the entrywise product.

        | Layer | Forward | Backward |
        |---|---|---|
        | Affine | $Y = XW + \mathbf{1}\mathbf{b}^\top$ | $\bar X = \bar YW^\top$, $\ \bar W = X^\top\bar Y$, $\ \bar{\mathbf{b}} = \bar Y^\top\mathbf{1}$ |
        | Activation | $Y = \phi(Z)$ | $\bar Z = \bar Y \circ \phi'(Z)$ |
        | Softmax | $\mathbf{p} = \operatorname{softmax}(\mathbf{z})$ | $\bar{\mathbf{z}} = \mathbf{p} \circ (\bar{\mathbf{p}} - \mathbf{p} \cdot \bar{\mathbf{p}})$ |
        | Softmax with cross-entropy, mean over batch | $L = -\frac1B\sum_i\log P_{i,y_i}$ | $\bar Z = (P - Y)/B$ |
        | Squared error, mean over batch | $L = \frac1{2B}\|\hat Y - Y\|_F^2$ | $\bar{\hat Y} = (\hat Y - Y)/B$ |
        | Sum over an axis | $\mathbf{s} = X^\top\mathbf{1}$ | $\bar X = \mathbf{1}\bar{\mathbf{s}}^\top$ |
        | Broadcast | $X = \mathbf{1}\mathbf{b}^\top$ | $\bar{\mathbf{b}} = \bar X^\top\mathbf{1}$ |
        | Residual | $\mathbf{y} = \mathbf{x} + f(\mathbf{x})$ | $\bar{\mathbf{x}} = \bar{\mathbf{y}} + J_f^\top\bar{\mathbf{y}}$ |
        | Product of matrices | $Y = AB$ | $\bar A = \bar YB^\top$, $\ \bar B = A^\top\bar Y$ |
        | Dropout with mask $M$ | $Y = X \circ M$ | $\bar X = \bar Y \circ M$ |
        | Lookup of rows $i_1, \dots, i_B$ of $E$ | $Y_k = E_{i_k}$ | $\bar E_i = \sum_{k: i_k = i}\bar Y_k$ |

        **Convolution.** A convolution is a linear map of its input, $\mathbf{y} = C_{\mathbf{w}}\mathbf{x}$, with a matrix built from shifted copies of the kernel $\mathbf{w}$. So $\bar{\mathbf{x}} = C_{\mathbf{w}}^\top\bar{\mathbf{y}}$, which is a convolution of $\bar{\mathbf{y}}$ with the reversed kernel (the transposed convolution), and $\bar{\mathbf{w}}$ is the correlation of $\mathbf{x}$ with $\bar{\mathbf{y}}$.

        **Normalisation.** For $\mathbf{y} = (\mathbf{x} - \mu\mathbf{1})/\sigma$ with $\mu$, $\sigma$ the mean and standard deviation of the $n$ entries of $\mathbf{x}$:

        $$\bar{\mathbf{x}} = \frac1\sigma\Big(\bar{\mathbf{y}} - \frac{\mathbf{1} \cdot \bar{\mathbf{y}}}{n}\mathbf{1} - \frac{\mathbf{y} \cdot \bar{\mathbf{y}}}{n}\mathbf{y}\Big).$$

        The backward rule removes from $\bar{\mathbf{y}}$ its components along $\mathbf{1}$ and along $\mathbf{y}$, the two directions in which the layer's output cannot move.

        **Softmax Jacobian.** $J = \operatorname{diag}(\mathbf{p}) - \mathbf{p}\mathbf{p}^\top$ is symmetric positive semidefinite with $J\mathbf{1} = \mathbf{0}$. It is the Hessian of $\log\sum_je^{z_j}$, which is therefore convex, and so is the cross-entropy loss as a function of the scores.

        **Numerical form.** Softmax is computed after subtracting the largest score, and the loss as $\log\sum_je^{z_j - z_{\max}} + z_{\max} - z_y$, to avoid overflow and $\log 0$.

        **Check.** Every rule satisfies $\langle\bar Y, dY\rangle = \langle\bar X, dX\rangle + \langle\bar W, dW\rangle + \cdots$ for all perturbations: the dot-product test of the lesson on Jacobian-vector and vector-Jacobian products.
  drill:
