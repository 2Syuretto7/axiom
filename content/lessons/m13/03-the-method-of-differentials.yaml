        explanation: |
          $d(XAX) = dX\,AX + XA\,dX$. The two terms have $dX$ in different places, and they cannot be merged into "$2XA\,dX$", because that would move $dX$ past $AX$. Under the trace, cycling brings $dX$ to the end of each: $\operatorname{tr}(dX\,AX) = \operatorname{tr}(AX\,dX)$. So $df = \operatorname{tr}\big((AX + XA)\,dX\big)$, and the gradient is the transpose of $AX + XA$.

          The second wrong version has the right matrix and forgets that $\operatorname{tr}(M\,dX)$ gives the gradient $M^\top$, not $M$. Both slips come from treating matrices as numbers.

          With $A = I$ every version but one passes: $\operatorname{tr}(X^2)$ has gradient $2X^\top$, and when the matrices commute the shortcut is correct. That is what makes it tempting.
    - question:
        id: work-order
        type: choice
        system: s2
        prompt: |
          For numbers, $d(x^3) = 3x^2\,dx$. What is $d(X^3)$ for a square matrix $X$, and when does it reduce to $3X^2\,dX$?
        options:
          - 'It is always $3X^2\,dX$.'
          - 'It is $dX\,X^2 + X\,dX\,X + X^2\,dX$: three terms, with $dX$ taking each of the three places in turn. They can be merged only when $dX$ commutes with $X$, or under a trace, where $\operatorname{tr}(d(X^3)) = 3\operatorname{tr}(X^2\,dX)$.'
          - 'It is $3\,dX\,X^2$.'
          - 'It is $(dX)^3$.'
        answer: 1
        explanation: |
          The product rule applied to three factors gives one term for each. In general $X\,dX\,X \ne X^2\,dX$. Inside a trace the factors can be cycled, so all three terms become $\operatorname{tr}(X^2\,dX)$, and $\nabla\operatorname{tr}(X^3) = 3(X^2)^\top$, looking just like the scalar formula. This is the usual situation: the differential of a matrix function is a sum with $dX$ in the middle of things, and it is only the trace, at the stage of reading off a gradient of a scalar, that lets the terms be tidied.
    - question:
        id: work-relu-layer
        type: choice
        system: s2
        prompt: |
          $f(W) = \mathbf{c}^\top\phi(W\mathbf{x})$, with $\phi$ applied entry by entry and $\mathbf{z} = W\mathbf{x}$. Which is the gradient with respect to $W$?
        options:
          - '$\mathbf{c}\,\mathbf{x}^\top$'
          - '$(\mathbf{c} \odot \phi''(\mathbf{z}))\,\mathbf{x}^\top$'
          - '$\phi''(\mathbf{z})\,\mathbf{c}^\top\mathbf{x}$'
          - '$\mathbf{x}\,(\mathbf{c} \odot \phi''(\mathbf{z}))^\top$'
        answer: 1
        explanation: |
          $df = \mathbf{c}^\top\big(\phi'(\mathbf{z}) \odot d\mathbf{z}\big) = (\mathbf{c} \odot \phi'(\mathbf{z}))^\top d\mathbf{z}$, moving the entry-by-entry factor across the dot product. Then $d\mathbf{z} = dW\,\mathbf{x}$, so $df = \boldsymbol\delta^\top dW\,\mathbf{x}$ with $\boldsymbol\delta = \mathbf{c} \odot \phi'(\mathbf{z})$, a bilinear form with gradient $\boldsymbol\delta\mathbf{x}^\top$. The nonlinearity only rescales each entry of the error before the outer product is taken. For a rectifier, $\phi'$ is 0 or 1, and the rows of the gradient belonging to inactive units are zero.
    - question:
        id: work-hessian
        type: numeric
        system: s2
        prompt: |
          $f(\mathbf{x}) = \tfrac13\sum_ix_i^3 + \mathbf{x}^\top\mathbf{x}$. Its gradient is $\mathbf{x} \odot \mathbf{x} + 2\mathbf{x}$. Taking the differential of the gradient gives the Hessian. What is the entry in row 2, column 2 of the Hessian at $\mathbf{x} = (1, 4)$?
        answer: "10"
        explanation: |
          $d(\mathbf{x} \odot \mathbf{x} + 2\mathbf{x}) = 2\mathbf{x} \odot d\mathbf{x} + 2\,d\mathbf{x} = \big(2\operatorname{diag}(\mathbf{x}) + 2I\big)d\mathbf{x}$. So the Hessian is $2\operatorname{diag}(\mathbf{x}) + 2I$, which at $(1, 4)$ is $\operatorname{diag}(4, 10)$. The off-diagonal entries are zero because each term of $f$ involves one coordinate only. The step $\mathbf{a} \odot d\mathbf{x} = \operatorname{diag}(\mathbf{a})\,d\mathbf{x}$ is how an entry-by-entry product is turned into a matrix when a Jacobian or Hessian has to be read off.
  connections:
    - text: |
        The gradient of the Rayleigh quotient is $\frac{2}{\mathbf{x}^\top\mathbf{x}}(A\mathbf{x} - \rho\mathbf{x})$, and it vanishes exactly at the eigenvectors. It came from the quotient rule in three lines.

        The **method of differentials**: write $dF$ for the first-order change of $F$, push $d$ through the expression with the sum, product, transpose, trace and chain rules, never reordering a matrix product, then bring the result to $\mathbf{g}^\top d\mathbf{x}$ or $\operatorname{tr}(G^\top dX)$ and read off the gradient. A function of several variables gives a sum with one term per variable, and so all its gradients at once, as for the two layers.

        The rules so far cover sums, products, and functions applied entry by entry. Two functions of a matrix that matter a great deal are not of that kind: the **inverse** and the **determinant**. Both appear in the density of a Gaussian, and so in every model built on one. Their differentials are short, and neither is what a guess from scalar calculus would suggest: [[m13.trace-identities-determinant-and-inverse-derivatives]].
