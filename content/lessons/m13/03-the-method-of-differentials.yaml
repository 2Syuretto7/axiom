        prompt: |
          `grad(A, X)` should return the gradient with respect to the square matrix `X` of $f(X) = \operatorname{tr}(XAX)$. The author reasoned that $d(XAX)$ is "$2XA\,dX$". The program prints the largest difference from central differences, which should be `0.0`. Fix `grad`.
        starter: |
          import numpy as np


          def f(A, X):
              return float(np.trace(X @ A @ X))


          def grad(A, X):
              return 2 * (X @ A).T


          A = np.array([[1.0, 2.0], [0.0, 1.0]])
          X = np.array([[1.0, 0.0], [3.0, 2.0]])
          h = 1e-6
          measured = np.zeros((2, 2))
          for i in range(2):
              for j in range(2):
                  E = np.zeros((2, 2))
                  E[i, j] = h
