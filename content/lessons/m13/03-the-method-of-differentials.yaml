          print(round(float(np.abs(grad(A, X) - measured).max()), 4))
        solution: |
          import numpy as np


          def f(A, X):
              return float(np.trace(X @ A @ X))


          def grad(A, X):
              return (A @ X + X @ A).T


          A = np.array([[1.0, 2.0], [0.0, 1.0]])
          X = np.array([[1.0, 0.0], [3.0, 2.0]])
          h = 1e-6
          measured = np.zeros((2, 2))
          for i in range(2):
              for j in range(2):
                  E = np.zeros((2, 2))
                  E[i, j] = h
                  measured[i, j] = (f(A, X + E) - f(A, X - E)) / (2 * h)
          print(round(float(np.abs(grad(A, X) - measured).max()), 4))
        tests: |
          import numpy as _np
          _A = _np.array([[1.0, 2.0], [0.0, 1.0]])
          _X = _np.array([[1.0, 0.0], [3.0, 2.0]])
          assert _np.allclose(grad(_A, _X), (_A @ _X + _X @ _A).T), "d tr(X A X) = tr(dX A X) + tr(X A dX) = tr((A X + X A) dX), so the gradient is (A X + X A)^T. X and A do not commute, so the two terms differ"
          _rng = _np.random.default_rng(0)
          _B, _Y = _rng.normal(size=(3, 3)), _rng.normal(size=(3, 3))
          _num = _np.zeros((3, 3))
          for _i in range(3):
              for _j in range(3):
                  _E = _np.zeros((3, 3))
                  _E[_i, _j] = 1e-6
                  _num[_i, _j] = (float(_np.trace((_Y + _E) @ _B @ (_Y + _E))) - float(_np.trace((_Y - _E) @ _B @ (_Y - _E)))) / 2e-6
          assert _np.allclose(grad(_B, _Y), _num, atol=1e-6), "For random 3 by 3 matrices the gradient should agree with central differences"
          assert _np.allclose(grad(_np.eye(2), _X), 2 * _X.T), "For A = I the function is tr(X^2), whose gradient is 2 X^T"
          assert output.strip() == "0.0", "The program should print 0.0"
        wrong:
