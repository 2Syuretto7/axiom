concept: m13.the-method-of-differentials
minutes: 85
claim: You can compute derivatives of functions of vectors and matrices by taking differentials, using the rules for sums, products in which the order of the factors is kept, transposes, traces, elementwise functions and quotients, then bring the result to the form of a vector dotted with dx or a trace of a matrix times dX and read off the gradient, and apply this to the Rayleigh quotient and to a network of two linear layers.
recalls: [m13.derivatives-with-respect-to-matrices]
uses: [m13.derivatives-with-respect-to-vectors, m12.total-derivative-as-best-linear-approximation, m12.multivariable-chain-rule, m12.gradient, m10.differentiation-rules, m10.chain-rule, m8.quadratic-forms-and-the-rayleigh-quotient, m8.eigenvalues-and-eigenvectors, m8.spectral-theorem, m5.matrix-multiplication-as-composition, m5.transpose, e6.gradient-checking, e5.linear-algebra-routines, e5.einsum, e5.arrays-dtype-and-shape, e0.functions, e0.loops]
leads: [m13.trace-identities-determinant-and-inverse-derivatives, m13.jacobian-vector-and-vector-jacobian-products]
starter: |
  # Scratch space. The Rayleigh quotient of a symmetric matrix, and its measured slopes.
  import numpy as np

  A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])


  def rho(x):
      return float(x @ A @ x) / float(x @ x)


  h = 1e-6
  for x in [np.array([1.0, 0.0, 0.0]), np.array([1.0, 2.0, 1.0]), np.array([1.0, 0.0, -1.0])]:
      slopes = [(rho(x + h * e) - rho(x - h * e)) / (2 * h) for e in np.eye(3)]
      print(round(rho(x), 4), [round(float(v), 4) + 0.0 for v in slopes])
parts:
  recall:
    - text: |
        [[m13.derivatives-with-respect-to-matrices]] found each gradient by expanding the function at a displaced point and discarding the higher-order terms by hand. Today that labour is replaced by a small set of rules. Three quick pulls first.
  puzzle:
    - text: |
        The Rayleigh quotient of a symmetric matrix $A$ is

        $$\rho(\mathbf{x}) = \frac{\mathbf{x}^\top A\mathbf{x}}{\mathbf{x}^\top\mathbf{x}}.$$

        The starter measures its gradient by central differences at three points, for the matrix with eigenvalues 4, 2 and 1 that ran through the last cluster. Each line shows the value of $\rho$ and then the three slopes.

        ```
        2.0 [0.0, 2.0, 0.0]
        4.0 [0.0, 0.0, 0.0]
        2.0 [0.0, 0.0, 0.0]
        ```

        At $(1, 0, 0)$ the quotient is 2 and its gradient is $(0, 2, 0)$. At $(1, 2, 1)$ and at $(1, 0, -1)$ the gradient vanishes. Those two points are eigenvectors of $A$, and the values 4 and 2 are their eigenvalues.

        It looks as though the Rayleigh quotient is stationary exactly at the eigenvectors. To prove it, a formula for the gradient is needed. Expanding $\rho(\mathbf{x} + \mathbf{h})$ means dividing one expansion by another and sorting out the first-order terms of the quotient, which is unpleasant.

        **What is the gradient of the Rayleigh quotient? And is there a way to differentiate expressions like this by rule, as one does in ordinary calculus, without expanding anything?**
  intuition:
    - text: |
        In one variable nobody expands $f(x + h)$. One applies the sum rule, the product rule, the quotient rule and the chain rule, and the answer falls out. The same can be done for vectors and matrices. Only one thing needs care: matrices do not commute, so the rules must never reorder a product.

        The device is the **differential**. Write $d\mathbf{x}$ for a small displacement of the variable. For any quantity $F$ that depends on $\mathbf{x}$, write $dF$ for the resulting change in $F$, **to first order**: the part of $F(\mathbf{x} + d\mathbf{x}) - F(\mathbf{x})$ that is linear in $d\mathbf{x}$. That is exactly the piece the last two lessons kept after expanding.

        Differentials obey the familiar rules. For a product,

        $$(X + dX)(Y + dY) = XY + dX\,Y + X\,dY + dX\,dY,$$

        and the last term is second order, so

        $$d(XY) = dX\,Y + X\,dY.$$

        This is the product rule, with each factor differentiated in turn **while staying in its place**.

        A calculation then has three stages.

        1. Take $d$ of the expression, pushing it through with the rules until it lands on the variable.
        2. Rearrange the result into a standard form: $df = \mathbf{g}^\top d\mathbf{x}$ for a vector variable, $df = \operatorname{tr}(G^\top dX)$ for a matrix variable.
        3. Read off the gradient: $\mathbf{g}$, or $G$.

        For the puzzle, with $u = \mathbf{x}^\top A\mathbf{x}$ and $v = \mathbf{x}^\top\mathbf{x}$, both of them numbers, the ordinary quotient rule applies: $d(u/v) = (v\,du - u\,dv)/v^2$. With $du = 2(A\mathbf{x})^\top d\mathbf{x}$ and $dv = 2\mathbf{x}^\top d\mathbf{x}$ this is

        $$d\rho = \frac{2}{\mathbf{x}^\top\mathbf{x}}\big(A\mathbf{x} - \rho\,\mathbf{x}\big)^\top d\mathbf{x}.$$

        The gradient is $\frac{2}{\mathbf{x}^\top\mathbf{x}}(A\mathbf{x} - \rho\mathbf{x})$. It vanishes exactly when $A\mathbf{x} = \rho\mathbf{x}$: at the eigenvectors, where $\rho$ is the eigenvalue.
  derivation:
    - text: |
        **Definition.** If $F$ is differentiable at $X$, its differential $dF$ is the linear function of $dX$ with $F(X + dX) = F(X) + dF + o(\|dX\|)$. It is the total derivative, applied to the displacement $dX$. $F$ may be a number, a vector or a matrix, and $dF$ has the same shape as $F$.

        **Rules.** $A, B$ constant, $X, Y$ depending on the variable.

        | | |
        |---|---|
        | Constant | $dA = 0$ |
        | Linearity | $d(X + Y) = dX + dY$, $\quad d(AXB) = A\,dX\,B$ |
        | Product | $d(XY) = dX\,Y + X\,dY$ |
        | Transpose | $d(X^\top) = (dX)^\top$ |
        | Trace | $d\operatorname{tr}(X) = \operatorname{tr}(dX)$ |
        | Elementwise function | $d\phi(\mathbf{x}) = \phi'(\mathbf{x}) \odot d\mathbf{x}$ |
        | Scalar chain rule | $d\,g(u) = g'(u)\,du$ for a number $u$ |
        | Scalar quotient | $d(u/v) = (v\,du - u\,dv)/v^2$ |

        $\odot$ is the entry-by-entry product. The product rule holds for every kind of product that is linear in each factor: matrix times matrix, matrix times vector, dot product, entry-by-entry product.

        **Reading off.**

        $$df = \mathbf{g}^\top d\mathbf{x} \ \Rightarrow\ \nabla f = \mathbf{g}, \qquad df = \operatorname{tr}(G^\top dX) \ \Rightarrow\ \nabla_Xf = G, \qquad d\mathbf{F} = J\,d\mathbf{x} \ \Rightarrow\ J_{\mathbf{F}} = J.$$

        **Tools for rearranging.** A number equals its transpose and its trace. Factors cycle inside a trace. And for the entry-by-entry product, $\mathbf{a}^\top(\mathbf{b} \odot \mathbf{c}) = (\mathbf{a} \odot \mathbf{b})^\top\mathbf{c}$, since both are $\sum_ia_ib_ic_i$.

        **Example 1, the quadratic form.** $d(\mathbf{x}^\top A\mathbf{x}) = d\mathbf{x}^\top A\mathbf{x} + \mathbf{x}^\top A\,d\mathbf{x} = (A\mathbf{x})^\top d\mathbf{x} + (A^\top\mathbf{x})^\top d\mathbf{x}$. Gradient $(A + A^\top)\mathbf{x}$. Two lines, with nothing expanded.

        **Example 2, the Rayleigh quotient.** As in the intuition, for symmetric $A$:

        $$\nabla\rho(\mathbf{x}) = \frac{2}{\mathbf{x}^\top\mathbf{x}}\big(A\mathbf{x} - \rho(\mathbf{x})\,\mathbf{x}\big).$$

        At $\mathbf{x} = (1, 0, 0)$ of the puzzle: $A\mathbf{x} = (2, 1, 0)$, $\rho = 2$, so the gradient is $2\big((2, 1, 0) - (2, 0, 0)\big) = (0, 2, 0)$, as measured. Note also $\mathbf{x}^\top\nabla\rho = 0$ always: $\rho$ does not change when $\mathbf{x}$ is rescaled, so its gradient has no component along $\mathbf{x}$.
    - question:
        id: derivation-product
        type: numeric
        system: s2
        prompt: |
          $f(\mathbf{x}) = (\mathbf{a}^\top\mathbf{x})(\mathbf{b}^\top\mathbf{x})$ with $\mathbf{a} = (1, 0)$ and $\mathbf{b} = (0, 1)$. What is the first entry of $\nabla f$ at $\mathbf{x} = (2, 3)$?
        answer: "3"
        explanation: |
          By the product rule $df = (\mathbf{a}^\top d\mathbf{x})(\mathbf{b}^\top\mathbf{x}) + (\mathbf{a}^\top\mathbf{x})(\mathbf{b}^\top d\mathbf{x})$, so $\nabla f = (\mathbf{b}^\top\mathbf{x})\mathbf{a} + (\mathbf{a}^\top\mathbf{x})\mathbf{b} = 3(1, 0) + 2(0, 1) = (3, 2)$. Here $f = x_1x_2$, and its partial derivatives are indeed $x_2 = 3$ and $x_1 = 2$. The factors $\mathbf{b}^\top\mathbf{x}$ and $\mathbf{a}^\top\mathbf{x}$ are numbers, so they may be moved freely. Only matrices and vectors must keep their places.
    - text: |
        **Example 3, two linear layers.** $f(W_1, W_2) = \tfrac12\|W_2W_1\mathbf{x} - \mathbf{t}\|^2$. Let $\mathbf{r} = W_2W_1\mathbf{x} - \mathbf{t}$. Then $df = \mathbf{r}^\top d\mathbf{r}$, and by the product rule

        $$d\mathbf{r} = dW_2\,W_1\mathbf{x} + W_2\,dW_1\,\mathbf{x}.$$

        So $df = \mathbf{r}^\top dW_2\,(W_1\mathbf{x}) + (W_2^\top\mathbf{r})^\top dW_1\,\mathbf{x}$. Each term is a bilinear form $\mathbf{a}^\top dW\,\mathbf{b}$, whose gradient is $\mathbf{a}\mathbf{b}^\top$:

        $$\nabla_{W_2}f = \mathbf{r}\,(W_1\mathbf{x})^\top, \qquad \nabla_{W_1}f = (W_2^\top\mathbf{r})\,\mathbf{x}^\top.$$

        Both are "error at the layer's output times the layer's input". For the second layer the input is $W_1\mathbf{x}$. For the first layer the error is $\mathbf{r}$ brought back through $W_2^\top$. One differential gave both gradients at once: when a function has several variables, $df$ is a sum with one term per variable, and each term is read off separately.

        **Example 4, a nonlinearity.** $f(\mathbf{w}) = \mathbf{c}^\top\phi(X\mathbf{w})$ with $\phi$ applied entry by entry. With $\mathbf{z} = X\mathbf{w}$: $df = \mathbf{c}^\top(\phi'(\mathbf{z}) \odot d\mathbf{z}) = (\mathbf{c} \odot \phi'(\mathbf{z}))^\top X\,d\mathbf{w}$. Gradient $X^\top(\mathbf{c} \odot \phi'(\mathbf{z}))$.

        **Why it is legitimate.** Nothing is being approximated. $dF$ is by definition the linear part, and the rules are the sum, product and chain rules for total derivatives, stated for displacements. The terms dropped, such as $dX\,dY$, are exactly those that the definition of a derivative excludes.

        **Second derivatives** are obtained by taking the differential of the gradient: $d(\nabla f) = H\,d\mathbf{x}$ gives the Hessian $H$.
    - question:
        id: derivation-order
        type: order
        system: s2
        prompt: Put in order the calculation of the gradients of a network of two linear layers by differentials.
        steps:
          - 'Name the residual $\mathbf{r} = W_2W_1\mathbf{x} - \mathbf{t}$, so that $f = \tfrac12\mathbf{r}^\top\mathbf{r}$ and $df = \mathbf{r}^\top d\mathbf{r}$.'
          - 'Apply the product rule: $d\mathbf{r} = dW_2\,W_1\mathbf{x} + W_2\,dW_1\,\mathbf{x}$.'
          - 'Substitute: $df = \mathbf{r}^\top dW_2\,(W_1\mathbf{x}) + \mathbf{r}^\top W_2\,dW_1\,\mathbf{x}$.'
          - 'Recognise each term as a bilinear form $\mathbf{a}^\top dW\,\mathbf{b}$, with gradient $\mathbf{a}\mathbf{b}^\top$.'
          - 'Read off $\nabla_{W_2}f = \mathbf{r}(W_1\mathbf{x})^\top$ and $\nabla_{W_1}f = (W_2^\top\mathbf{r})\mathbf{x}^\top$.'
        explanation: Differentiate, substitute, bring each term to a standard form, and read off one gradient per variable.
  formal:
    - text: |
        **Differential.** For $F: U \subseteq \mathbb{R}^{m \times n} \to \mathbb{R}^{p \times q}$ differentiable at $X$, $dF = DF(X)[dX]$, where $DF(X)$ is the linear map with $F(X + H) = F(X) + DF(X)[H] + o(\|H\|)$.

        **Chain rule.** $d(G \circ F) = DG(F(X))\big[DF(X)[dX]\big]$: substitute $dF$ for the displacement of the inner variable.

        **Product rule.** For any bilinear map $\beta$: $d\,\beta(X, Y) = \beta(dX, Y) + \beta(X, dY)$.

        **Identification theorems.**

        - $f: \mathbb{R}^n \to \mathbb{R}$: $\ df = \mathbf{g}^\top d\mathbf{x} \iff \nabla f = \mathbf{g}$.
        - $f: \mathbb{R}^{m \times n} \to \mathbb{R}$: $\ df = \operatorname{tr}(G^\top dX) \iff \nabla_Xf = G$.
        - $\mathbf{F}: \mathbb{R}^n \to \mathbb{R}^m$: $\ d\mathbf{F} = J\,d\mathbf{x} \iff J_{\mathbf{F}} = J$.
        - $f: \mathbb{R}^n \to \mathbb{R}$ twice differentiable: $\ d(\nabla f) = H\,d\mathbf{x} \iff H_f = H$, and $d^2f = d\mathbf{x}^\top H\,d\mathbf{x}$.

        **Useful differentials.**

        | $F$ | $dF$ |
        |---|---|
        | $\mathbf{x}^\top\mathbf{x}$ | $2\mathbf{x}^\top d\mathbf{x}$ |
        | $\lVert\mathbf{x}\rVert$ | $\mathbf{x}^\top d\mathbf{x}/\lVert\mathbf{x}\rVert$ |
        | $X^\top X$ | $dX^\top X + X^\top dX$ |
        | $X^2$ | $dX\,X + X\,dX$ |
        | $\operatorname{tr}(X^\top X)$ | $2\operatorname{tr}(X^\top dX)$ |
        | $\mathbf{a} \odot \mathbf{x}$ | $\mathbf{a} \odot d\mathbf{x}$ |
        | $\log\sum_ie^{x_i}$ | $\operatorname{softmax}(\mathbf{x})^\top d\mathbf{x}$ |

        **Hadamard identities.** $\mathbf{a}^\top(\mathbf{b} \odot \mathbf{c}) = (\mathbf{a} \odot \mathbf{b})^\top\mathbf{c}$. $\ \operatorname{tr}\big(A^\top(B \odot C)\big) = \operatorname{tr}\big((A \odot B)^\top C\big)$. $\ \mathbf{b} \odot \mathbf{c} = \operatorname{diag}(\mathbf{b})\mathbf{c}$.

        **Rayleigh quotient.** For symmetric $A$: $\nabla\rho = \frac{2}{\mathbf{x}^\top\mathbf{x}}(A\mathbf{x} - \rho\mathbf{x})$. Its stationary points are the eigenvectors, and its stationary values the eigenvalues.
