    - question:
        id: predict-rayleigh
        type: predict
        system: s1
        prompt: The formula for the gradient of the Rayleigh quotient at the three points of the puzzle. What does this show?
        code: |
          import numpy as np

          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          for x in [np.array([1.0, 0.0, 0.0]), np.array([1.0, 2.0, 1.0]), np.array([1.0, 0.0, -1.0])]:
              rho = float(x @ A @ x) / float(x @ x)
              g = 2 * (A @ x - rho * x) / float(x @ x)
              print(rho, [round(float(v), 4) + 0.0 for v in g], round(float(g @ x), 4) + 0.0)
        output: |
          2.0 [0.0, 2.0, 0.0] 0.0
          4.0 [0.0, 0.0, 0.0] 0.0
          2.0 [0.0, 0.0, 0.0] 0.0
        explanation: The formula reproduces the measured slopes. The gradient is zero at the two eigenvectors, and it is always perpendicular to x, because rescaling x does not change the quotient.
    - question:
        id: predict-second-order
        type: predict
        system: s1
        prompt: The true change of a matrix product, minus the product-rule differential, for a displacement of size about 0.001. What does this show?
        code: |
          import numpy as np

          X = np.array([[1.0, 2.0], [3.0, 4.0]])
          Y = np.array([[0.0, 1.0], [1.0, 1.0]])
          dX = 0.001 * np.array([[1.0, -1.0], [2.0, 0.0]])
          dY = 0.001 * np.array([[0.0, 3.0], [1.0, 1.0]])
          true_change = (X + dX) @ (Y + dY) - X @ Y
          differential = dX @ Y + X @ dY
          print(np.allclose(true_change - differential, dX @ dY))
          print(round(float(np.abs(differential).max()), 6), round(float(np.abs(true_change - differential).max()), 6))
        output: |
          True
          0.015 6e-06
        explanation: What the product rule leaves out is exactly dX times dY. For displacements of size one thousandth it is of size one millionth, negligible against the differential, and it vanishes in the limit.
  work:
    - text: Slower now. The first task is the formula the puzzle asked for.
    - question:
        id: write-rayleigh
        type: code
        mode: write
        system: s2
        prompt: |
          Write `grad_rayleigh(A, x)` returning the gradient with respect to `x` of the Rayleigh quotient $\mathbf{x}^\top A\mathbf{x}/\mathbf{x}^\top\mathbf{x}$, for a symmetric matrix `A`.
        starter: |
          import numpy as np


          def grad_rayleigh(A, x):
              return x * 0.0 + 1.0


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print([round(float(v), 4) + 0.0 for v in grad_rayleigh(A, np.array([1.0, 0.0, 0.0]))])
          print([round(float(v), 4) + 0.0 for v in grad_rayleigh(A, np.array([1.0, 1.0, 0.0]))])
        solution: |
          import numpy as np


          def grad_rayleigh(A, x):
              length = float(x @ x)
              rho = float(x @ A @ x) / length
              return 2 * (A @ x - rho * x) / length


          A = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          print([round(float(v), 4) + 0.0 for v in grad_rayleigh(A, np.array([1.0, 0.0, 0.0]))])
          print([round(float(v), 4) + 0.0 for v in grad_rayleigh(A, np.array([1.0, 1.0, 0.0]))])
        tests: |
          import numpy as _np
          _A = _np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])
          assert _np.allclose(grad_rayleigh(_A, _np.array([1.0, 0.0, 0.0])), [0.0, 2.0, 0.0]), "At (1, 0, 0) the quotient is 2 and the gradient is 2 (A x - 2 x) = (0, 2, 0)"
          assert _np.allclose(grad_rayleigh(_A, _np.array([1.0, 2.0, 1.0])), 0.0), "At the eigenvector (1, 2, 1) the gradient is zero"
          assert _np.allclose(grad_rayleigh(_A, _np.array([1.0, -1.0, 1.0])), 0.0), "At the eigenvector (1, -1, 1) the gradient is zero"
          _rho = lambda x: float(x @ _A @ x) / float(x @ x)
          _x = _np.array([1.0, 1.0, 0.0])
          _num = _np.array([(_rho(_x + 1e-6 * _e) - _rho(_x - 1e-6 * _e)) / 2e-6 for _e in _np.eye(3)])
          assert _np.allclose(grad_rayleigh(_A, _x), _num, atol=1e-6), "At (1, 1, 0), which is not of unit length, the gradient should agree with central differences. Divide by x^T x"
          _y = _np.array([0.3, -2.0, 1.5])
          _num = _np.array([(_rho(_y + 1e-6 * _e) - _rho(_y - 1e-6 * _e)) / 2e-6 for _e in _np.eye(3)])
          assert _np.allclose(grad_rayleigh(_A, _y), _num, atol=1e-6), "At (0.3, -2, 1.5) the gradient should agree with central differences"
          assert abs(float(grad_rayleigh(_A, _y) @ _y)) < 1e-9, "The gradient should be perpendicular to x, since rescaling x does not change the quotient"
          assert output.strip() == "[0.0, 2.0, 0.0]\n[-0.5, 0.5, 1.0]", "The program should print [0.0, 2.0, 0.0] and then [-0.5, 0.5, 1.0]"
        wrong:
          - |
            import numpy as np


            def grad_rayleigh(A, x):
                length = float(x @ x)
                rho = float(x @ A @ x) / length
                return 2 * (A @ x - rho * x)


