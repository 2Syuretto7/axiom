concept: e5.numerical-error-analysis-in-practice
minutes: 100
claim: You can say how far apart neighbouring floats are near any number, explain why subtracting nearly equal numbers destroys accuracy and rewrite a formula to avoid it, explain why the order of a long sum matters, tell apart error caused by a sensitive problem from error caused by a poor method and estimate the digits lost from a condition number, and choose the step of a numerical derivative by balancing the error of the approximation against the error of rounding.
recalls: [e5.log-sum-exp-and-stable-formulations]
uses: [e5.linear-algebra-routines, e5.random-number-generation, e5.strides-and-memory-layout, e5.arrays-dtype-and-shape, e5.axis-operations-and-reductions, e5.vectorisation, m10.taylor-approximation, m10.derivative-as-slope-and-rate, m10.maxima-and-minima, m10.second-derivative-and-curvature, m1.quadratics, m0.estimation-and-orders-of-magnitude, m0.powers-and-roots, e0.values-types-and-variables, e0.functions]
leads: [m12.functions-of-several-variables]
starter: |
  # Scratch space. Ten million copies of 0.1, added up twice.
  import numpy as np

  x = np.full(10 ** 7, 0.1, dtype=np.float32)

  print("x.sum()          ", x.sum())
  print("np.cumsum(x)[-1] ", np.cumsum(x)[-1])
parts:
  recall:
    - text: |
        [[e5.log-sum-exp-and-stable-formulations]] dealt with floats that were too large or too small, and ended on a failure of another kind: `np.log(1 + 1e-17)` gave `0.0`, with every number of an ordinary size. Three quick pulls first.
    - question:
        id: recall-shift
        type: choice
        system: s1
        concepts: [e5.log-sum-exp-and-stable-formulations]
        prompt: |
          Before taking the exponentials of a row of scores, the stable softmax subtracts one number from all of them. Which?
        options: ["The smallest score of the row", "The largest score of the row", "The mean of the row", "1000"]
        answer: 1
        explanation: With the largest score moved to 0, every exponential is at most 1 and the total is at least 1.
    - question:
        id: recall-taylor
        type: choice
        system: s1
        concepts: [m10.taylor-approximation]
        prompt: |
          For a small step $h$, $f(x + h) \approx f(x) + h\,f'(x) + \dots$ What is the next term?
        options: ['$\tfrac{h^2}{2} f''''(x)$', '$h^2 f''(x)$', '$\tfrac{h}{2} f''''(x)$', '$h\, f''''(x)$']
        answer: 0
        explanation: The second-order term of the Taylor approximation is the second derivative times the square of the step, divided by 2.
    - question:
        id: recall-residual
        type: choice
        system: s1
        concepts: [e5.linear-algebra-routines]
        prompt: |
          `x = np.linalg.solve(A, b)`. What is the residual of this answer?
        options: ["`A @ x - b`", "`x - b`", "`np.linalg.det(A)`", "`A - x`"]
        answer: 0
        explanation: It is what is left over when the answer is put back into the equations.
  puzzle:
    - text: |
        The starter makes an array of ten million copies of 0.1, stored as `float32`, and adds them up in two ways.

        The first way is `x.sum()`.

        The second is `np.cumsum(x)`, the running total you met in the vectorisation lesson: the first entry, then the first two added, then the first three, and so on. Its last entry is the total of everything.

        Both are adding the same ten million numbers. Ten million tenths make one million.

        Run it.

        `x.sum()` prints 1 000 000.1, which is as right as a `float32` can show. **The running total prints 1 087 937.** It is wrong by nearly 88 thousand, almost nine per cent.

        Nothing overflowed. Nothing underflowed. No `nan` and no `inf` appeared. Each number is a tenth, the true total is a million, and every one of the ten million additions was carried out as accurately as a `float32` can carry out an addition. And the answer is wrong in its second digit.

        **How can ten million accurate additions give an answer that is nine per cent off? Why does `sum`, adding the same numbers, get it right? And if an error of this size can appear with no warning, how do you ever know how far to trust a number that a program prints?**
  intuition:
    - text: |
        The last lesson ended by saying what floats are. Now look at it closely, since everything follows from it.

        A `float64` stores a number in scientific notation, in binary, with 53 binary digits of precision: about **16 significant decimal digits**. A `float32` has 24 binary digits: about **7 decimal digits**. That is the whole budget, and it is the same whether the number is tiny or huge.

        Think of writing every number with exactly 7 significant digits. Near 1 you can write 1.000000 and then 1.000001. The step between neighbours is a millionth. Near a million you can write 1 000 000 and then 1 000 001: the step is 1. Near a million million, the step is a million. **The numbers you can write are not evenly spaced. They are dense near zero and sparse far out, and the gap between neighbours is always about the same fraction of the number itself.**

        Floats are exactly like that, with the gaps set by powers of 2. The figure shows the gap between neighbouring floats near different numbers. Step through the sizes.
    - figure: float-gaps
      props: { power: 0 }
    - text: |
        Near 1 the gap between neighbouring `float64` values is about $2.2 \times 10^{-16}$. That number has a name, **machine epsilon**, written $\varepsilon$, and it is the yardstick for everything in this lesson. Near any other number $x$ the gap is about $\varepsilon$ times the size of $x$. Near $10^{16}$ the gap is 2, so there is no float for $10^{16} + 1$, and adding 1 does nothing at all.

        The result of every operation must be a float. If the true result falls in a gap, it is **rounded** to the nearer end. So every operation commits an error of at most half a gap: a relative error of at most $\varepsilon/2$, about one part in $10^{16}$. That is superb accuracy. If that were the whole story there would be no lesson.

        Now switch the figure to `float32` and go to a million.
    - figure: float-gaps
      props: { power: 6, single: true }
    - text: |
        Near a million, neighbouring `float32` values are 0.0625 apart. That is the puzzle.

        Follow the running total. For the first few thousand additions all is well: the total is small, the gaps are tiny, and 0.1 lands almost where it should. But the total grows, and the gaps grow with it. By the time the total has passed half a million, the only values it can take are multiples of 0.0625. Add 0.1 to it. The true result falls between two floats, 0.0625 above and 0.125 above. It is nearer the second. **So the total moves up by 0.125.** A quarter too much. The next addition does the same, and the next, for millions of additions in a row. Every one of them is rounded correctly. Every one is in error by a quarter of what was added, and all the errors point the same way.

        A grocer weighing out sweets on bathroom scales has this trouble. The scales read to the nearest half kilo, which is very fine accuracy for weighing a person. Drop one sweet on while someone is standing there and the reading either does not move or jumps by half a kilo. Add sweets one at a time and read the scales each time, and the total you write down is nonsense. The scales are not at fault. **A large number cannot register a small addition**, and a running total is a large number being asked to register ten million small ones.

        How does `x.sum()` avoid it? It does not keep one running total. It adds the numbers in pairs, then adds those results in pairs, then those. A tenth to a tenth, then two tenths to two tenths, four tenths to four tenths. **At every addition the two numbers being added are about the same size**, so neither is lost in the other's gaps. The sweets are weighed in bags of equal weight, and bags against bags. This is called pairwise summation.

        So the order of a sum matters. In the real numbers, addition can be done in any order. In floats it cannot: $(a + b) + c$ and $a + (b + c)$ are both rounded, at different places, and can differ.

        There is a second way in which good arithmetic gives bad answers, and it is the more important one. Take $1 + 10^{-15}$. In floats this is rounded, to a number that is right to 16 digits. Now subtract 1. The exact answer would be $10^{-15}$. The float answer is $1.11 \times 10^{-15}$: **eleven per cent wrong**, from two operations each accurate to 16 digits.

        Look at what happened to the digits.

        ```
          1.000000000000001110   (the float nearest to 1 + 1e-15)
        − 1.000000000000000000
        = 0.000000000000001110
        ```

        The first fifteen digits of the two numbers were the same, and they cancelled. They were the **good** digits. What is left is the tail end, where the rounding was. The subtraction itself was exact. It committed no error. It **exposed** an error that was already there, sixteen places down, by removing everything in front of it. This is called **cancellation**, and it is the cause of most of the numerical disasters you will meet. The failure of `np.log(1 + 1e-17)` was an extreme case: there the small part fell wholly inside a gap, and not one digit of it survived.
  derivation:
    - text: |
        **Gaps.** `np.finfo(np.float64).eps` is $\varepsilon \approx 2.2 \times 10^{-16}$, and for `float32` it is about $1.2 \times 10^{-7}$. `np.spacing(x)` is the gap from `x` to the next float above it, and is about $\varepsilon\,|x|$.

        | near | gap in `float64` | gap in `float32` |
        |---|---|---|
        | 1 | $2.2 \times 10^{-16}$ | $1.2 \times 10^{-7}$ |
        | $10^{6}$ | $1.2 \times 10^{-10}$ | 0.0625 |
        | $10^{16}$ | 2 | about $10^{9}$ |

        **Comparing.** Since nearly every result is rounded, two computations of the same quantity rarely agree to the last digit: `0.1 + 0.2 == 0.3` is `False`. Compare with `np.isclose(a, b)`, or `np.allclose` for whole arrays, which accept a small relative difference.

        **Cancellation, measured.** Suppose $a$ and $b$ each carry a relative error of about $\varepsilon$, so absolute errors of about $\varepsilon |a|$ and $\varepsilon |b|$. Their difference $a - b$ inherits an absolute error of about $\varepsilon\,(|a| + |b|)$. As a fraction of the answer, that is

        $$\text{relative error of } a - b \;\approx\; \varepsilon\, \frac{|a| + |b|}{|a - b|}.$$

        If $a$ and $b$ are of different sizes or opposite signs, the fraction is about 1 and nothing is lost. If they agree in their first $k$ digits, the fraction is about $10^k$, and **$k$ digits of accuracy are gone.** In the example, 1 and $1 + 10^{-15}$ agree to 15 digits, so 15 of the 16 are lost, and one survives.

        **The cure is algebra.** You cannot make the subtraction more accurate, since it is already exact. You rewrite the formula so that the nearly equal quantities are never formed.

        *A difference of roots.* For large $a$, $\sqrt{a + 1} - \sqrt{a}$ subtracts two nearly equal numbers. Multiply above and below by the sum of the roots, and the difference of squares on top is exactly 1:

        $$\sqrt{a + 1} - \sqrt{a} = \frac{(a + 1) - a}{\sqrt{a + 1} + \sqrt{a}} = \frac{1}{\sqrt{a + 1} + \sqrt{a}}.$$

        The right-hand side has only an addition of positive numbers. At $a = 10^{12}$ the left gives $5.00004 \times 10^{-7}$, right to four digits. The right gives $4.999999999999 \times 10^{-7}$, right to sixteen.

        *A variance.* You computed a variance, two lessons ago, as the mean of the squares less the square of the mean. On paper that equals the mean of the squared distances from the mean. In floats, take the four numbers 1, 2, 3, 4 with a thousand million added to each. Their variance is plainly 1.25, the same as that of 1, 2, 3, 4. The mean of the squares and the square of the mean are both about $10^{18}$, they agree in all 16 of their digits, and their difference comes out as `0.0`. The other form, `((x - x.mean()) ** 2).mean()`, subtracts first, **while the numbers are still exact**, and gives 1.25. Data with a large mean and a small spread is ordinary: times in seconds since 1970, positions on a map, the weights of a network late in training.

        The pattern in both: do the cancelling subtraction on exact quantities, or on paper, and never on rounded ones.

        **Sums.** Adding $n$ numbers one after another makes $n$ rounding errors, each about $\varepsilon$ times the running total at that moment. If they all lean the same way, as in the puzzle, the error grows in proportion to $n$. Pairwise summation keeps the partial totals small for as long as possible and balances them, and its error grows only as $\log n$. `x.sum()`, `x.mean()` and the other reductions of NumPy add pairwise along the block. A running total in a Python loop does not, and neither does `cumsum`, which is asked for every partial total and so has no choice.

        Two practical consequences. Accumulate in `float64` even when the data is `float32`: its gaps are five hundred million times finer. And when adding numbers of very different sizes by hand, add the small ones first, so that they can amount to something before they meet the large ones.
    - question:
        id: derivation-cancel
        type: choice
        system: s2
        prompt: |
          `(1.0 + 1e-15) - 1.0` gives about `1.11e-15`, eleven per cent away from the true answer, though the addition and the subtraction are each correct to within one part in $10^{16}$. Where did the error come from?
        options:
          - "The subtraction was rounded badly."
          - "The addition rounded $1 + 10^{-15}$ to the nearest float, an error of about $10^{-16}$, negligible beside 1. The subtraction, which is exact, then removed the leading 1 and left a result of size $10^{-15}$, beside which that same $10^{-16}$ is a tenth. The absolute error did not grow. The quantity it is compared with shrank fifteen digits."
          - "The number $10^{-15}$ is too small to be a float."
          - "Python subtracts in `float32`."
        answer: 1
        explanation: |
          An error is large or small only in relation to the thing it is an error in. After the addition, an absolute error of $10^{-16}$ sat inside a number of size 1: one part in $10^{16}$. After the subtraction the same absolute error sits inside a number of size $10^{-15}$: one part in ten. No operation was inaccurate. The subtraction of two nearly equal numbers stripped away the digits that were right and promoted the digit that was wrong to the front. The number $10^{-15}$ is itself a perfectly good float. It is the sum $1 + 10^{-15}$ that is not, since near 1 the floats are $2.2 \times 10^{-16}$ apart.
    - text: |
        **The problem or the method?** There are two quite different reasons for a bad answer, and telling them apart is the heart of the subject.

        The first is a **poor method**: a formula that loses digits where a rearrangement of it would not. The difference of roots, the variance, the running total and the unshifted softmax are all of this kind. The answer was well determined by the data, and the method spoilt it. A method that does not do this is called **stable**.

        The second is a **sensitive problem**: one where a small change in the data makes a large change in the true answer. Then no method can help, since the data itself is known only to within rounding. The measure of this is the **condition number**: the factor by which the problem can magnify a small relative change in its input.

        $$\text{relative error in the answer} \;\lesssim\; \text{condition number} \times \text{relative error in the data}.$$

        With data good to $\varepsilon \approx 10^{-16}$, a condition number of $10^k$ can leave an error of $10^{k - 16}$. **A condition number of $10^k$ costs $k$ of your 16 digits.**

        Go back to the ten equations of the lesson on linear algebra routines. The answer from `solve` was right to only four digits, and its residual was at rounding level. Both facts are now explained. The residual measures the **method**: the computed $\mathbf{x}$ solves, exactly, a system whose data differs from yours only in the sixteenth digit, and that is all a method can promise. The condition number of that matrix, from `np.linalg.cond`, was $1.6 \times 10^{13}$, and it measures the **problem**: thirteen digits lost, three or four left. The method was stable and the problem was ill-conditioned. Cancellation is the same thing in miniature: subtraction of nearly equal numbers is an ill-conditioned problem, with condition number $(|a| + |b|) / |a - b|$, and the cure was never a better subtraction but a different formula that does not pose that problem.

        So when an answer is poor, ask which it is. If the method, rewrite it. If the problem, then either ask a different question, or get better data, or accept the digits you have, and in every case know how many those are.

        **A numerical derivative.** Here both kinds of error appear in one formula, pulling in opposite directions. To estimate $f'(x)$ without knowing a formula for it, take the slope over a small step:

        $$f'(x) \approx \frac{f(x + h) - f(x)}{h}.$$

        *The error of the approximation.* By the Taylor approximation, $f(x + h) = f(x) + h f'(x) + \tfrac{h^2}{2} f''(x) + \dots$, so

        $$\frac{f(x + h) - f(x)}{h} = f'(x) + \frac{h}{2} f''(x) + \dots$$

        The slope over a step differs from the true slope by about $\tfrac{h}{2}|f''(x)|$. This has nothing to do with floats. It is the price of using a finite step, called the **truncation error**, and it shrinks as $h$ shrinks.

        *The error of rounding.* The top line subtracts two nearly equal numbers, and the smaller $h$ is, the more nearly equal they are. Each value of $f$ carries a rounding error of about $\varepsilon |f(x)|$. The difference carries about twice that, and it is then divided by $h$: an error of about $2\varepsilon |f(x)| / h$, which **grows** as $h$ shrinks.

        *The total.*

        $$E(h) \approx \frac{h}{2}\,|f''(x)| + \frac{2\,\varepsilon\,|f(x)|}{h}.$$

        One term rises with $h$ and the other falls. You know how to find the least value of such a thing: set the derivative with respect to $h$ to zero. $\tfrac12 |f''| - 2\varepsilon |f| / h^2 = 0$ gives

        $$h = 2\sqrt{\varepsilon\,|f| / |f''|} \;\sim\; \sqrt{\varepsilon} \approx 10^{-8},$$

        when $f$ and $f''$ are of ordinary size, and the error at that best step is itself about $\sqrt{\varepsilon}$: $10^{-8}$. **The forward difference can deliver at most half of the sixteen digits.** For $f = \exp$ at $x = 1$, measured:

        | $h$ | error of the estimate |
        |---|---|
        | $10^{-1}$ | $1.4 \times 10^{-1}$ |
        | $10^{-4}$ | $1.4 \times 10^{-4}$ |
        | $10^{-8}$ | $7 \times 10^{-9}$ |
        | $10^{-12}$ | $4 \times 10^{-4}$ |
        | $10^{-16}$ | 2.7, the whole derivative |

        At $h = 10^{-16}$ the step falls inside a gap: $x + h$ **is** $x$, the top line is 0, and the estimate is 0.

        **A better formula.** Step both ways:

        $$f'(x) \approx \frac{f(x + h) - f(x - h)}{2h}.$$

        In the Taylor approximations of $f(x + h)$ and $f(x - h)$ the terms in $h^2$ are the same and cancel in the difference, so the truncation error is about $\tfrac{h^2}{6}|f'''(x)|$, far smaller. The rounding error is as before. Balancing them gives a best step near $\varepsilon^{1/3} \approx 10^{-5}$ and an error near $10^{-11}$. This **central difference** is the one to use, with a step of about $10^{-5}$ times the size of $x$, or times 1 if $x$ is small. Its chief use in machine learning is as a check: when you have derived a formula for a derivative, or a program has computed one for you, compare it with the central difference. If they agree to seven or more digits, the formula is right.
    - question:
        id: order-step
        type: order
        system: s2
        prompt: Put in order what happens to the forward-difference estimate of a derivative as the step $h$ is made smaller and smaller, starting from $h = 0.1$.
        steps:
          - 'At $h = 0.1$ the estimate is poor: the slope over so wide a step differs from the slope at the point by about $\tfrac{h}{2}|f''''|$.'
          - 'As $h$ shrinks, the error shrinks in proportion to it: ten times smaller for each factor of ten.'
          - 'Near $h = 10^{-8}$ the falling truncation error meets the rising rounding error, and the total is at its least, about $10^{-8}$.'
          - 'Below that, the two values of $f$ agree in more and more digits, cancellation takes over, and the error grows as $h$ shrinks.'
          - 'At $h = 10^{-16}$ the step is smaller than the gap between floats near $x$, so $x + h$ is $x$, and the estimate is exactly 0.'
        explanation: Two errors with opposite appetites. Truncation wants a small step, and dominates while the step is large. Rounding wants a large step, and dominates once the step is small. The total has its least value where they are equal, which for the forward difference is near the square root of machine epsilon. Pushing the step lower in pursuit of accuracy makes things worse, and in the end there is no step at all.
  formal:
    - text: |
        **Floats.** A `float64` has 53 binary digits of precision and a `float32` has 24. The gap between neighbouring floats near $x$ is about $\varepsilon |x|$, with $\varepsilon = 2^{-52} \approx 2.2 \times 10^{-16}$ for `float64` and $2^{-23} \approx 1.2 \times 10^{-7}$ for `float32`.

        **Rounding.** The computed result of one arithmetic operation is the float nearest the exact result: a relative error of at most $\varepsilon / 2$.

        **Cancellation.** If $a$ and $b$ have relative errors of about $\varepsilon$, then $a - b$ has relative error of about $\varepsilon\,(|a| + |b|) / |a - b|$.

        **Summation.** Adding $n$ terms in sequence has an error bound proportional to $n\varepsilon$. Adding them pairwise has one proportional to $\varepsilon \log n$.

        **Conditioning.** The condition number $\kappa$ of a problem is the largest ratio of the relative change in its answer to a small relative change in its data. A stable method returns the exact answer for data within about $\varepsilon$ of that given, so its answer has relative error up to about $\kappa\,\varepsilon$.

        **Differences.** The forward difference $\tfrac{f(x + h) - f(x)}{h}$ has error about $\tfrac{h}{2}|f''| + \tfrac{2\varepsilon |f|}{h}$, least near $h \approx \sqrt{\varepsilon}$. The central difference $\tfrac{f(x + h) - f(x - h)}{2h}$ has error about $\tfrac{h^2}{6}|f'''| + \tfrac{\varepsilon |f|}{h}$, least near $h \approx \varepsilon^{1/3}$.
  drill:
    - text: |
        Seconds each. Floats are `float64` unless a question says otherwise.
    - question:
        id: drill-eps
        type: choice
        system: s1
        prompt: |
          About how far apart are neighbouring `float64` values near 1?
        options: ['$2.2 \times 10^{-16}$', '$1.2 \times 10^{-7}$', '$10^{-308}$', '0.1']
        answer: 0
        explanation: This gap is machine epsilon for `float64`.
    - question:
        id: drill-digits64
        type: numeric
        system: s1
        prompt: |
          About how many significant decimal digits does a `float64` carry?
        answer: "16"
        explanation: Fifty-three binary digits are worth about sixteen decimal ones.
    - question:
        id: drill-digits32
        type: numeric
        system: s1
        prompt: |
          About how many significant decimal digits does a `float32` carry?
        answer: "7"
        explanation: Twenty-four binary digits are worth about seven decimal ones.
    - question:
        id: drill-big
        type: choice
        system: s1
        prompt: |
          What is `1e16 + 1.0 == 1e16`?
        options: ["`True`", "`False`", "An error", "`nan`"]
        answer: 0
        explanation: Near $10^{16}$ neighbouring floats are 2 apart, so adding 1 lands back on the same float.
    - question:
        id: drill-tenths
        type: choice
        system: s1
        prompt: |
          What is `0.1 + 0.2 == 0.3`?
        options: ["`True`", "`False`", "An error", "`nan`"]
        answer: 1
        explanation: None of the three is exactly a float, and the rounded sum is not the float nearest to 0.3.
    - question:
        id: drill-compare
        type: choice
        system: s1
        prompt: |
          Which is the sound way to test whether two computed floats `a` and `b` are the same quantity?
        options: ["`a == b`", "`np.isclose(a, b)`", "`a is b`", "`str(a) == str(b)`"]
        answer: 1
        explanation: It allows the small relative difference that rounding makes inevitable.
    - question:
        id: drill-absorbed
        type: choice
        system: s1
        prompt: |
          What is `(1.0 + 1e-16) - 1.0`?
        options: ["`1e-16`", "`0.0`", "`1.1e-16`", "`nan`"]
        answer: 1
        explanation: The amount added is less than half the gap between floats near 1, so the sum rounds back to exactly 1.
    - question:
        id: drill-dangerous
        type: choice
        system: s1
        prompt: |
          Which operation on two rounded numbers can destroy most of their accuracy?
        options: ["Multiplying them", "Adding two positive numbers", "Subtracting two nearly equal numbers", "Dividing one by the other"]
        answer: 2
        explanation: The digits they share cancel, and what remains is mostly their rounding errors.
    - question:
        id: drill-order
        type: choice
        system: s1
        prompt: |
          What are `(1e16 + 1.0) - 1e16` and `(1e16 - 1e16) + 1.0`?
        options: ["`1.0` and `1.0`", "`0.0` and `1.0`", "`0.0` and `0.0`", "`1.0` and `0.0`"]
        answer: 1
        explanation: In the first the 1 is added to a huge number and lost in its gap. In the second the huge numbers cancel exactly first, and then the 1 is added to 0.
    - question:
        id: drill-gap-scale
        type: choice
        system: s1
        prompt: |
          The gap between neighbouring floats near a number $x$ is roughly proportional to what?
        options: ["Nothing. It is the same everywhere", "The size of $x$", "The square of $x$", "One over $x$"]
        answer: 1
        explanation: A float keeps a fixed number of significant digits, so the last of them is worth a fixed fraction of the number.
    - question:
        id: drill-cond
        type: numeric
        system: s1
        prompt: |
          A problem has condition number $10^{5}$ and is solved by a stable method in `float64`. About how many of the 16 digits are lost?
        answer: "5"
        explanation: A condition number of 10 to the power k costs about k digits.
    - question:
        id: drill-truncation
        type: choice
        system: s1
        prompt: |
          The truncation error of the forward difference $\tfrac{f(x+h) - f(x)}{h}$ is roughly proportional to what?
        options: ["$h$", "$h^2$", "$1/h$", "It does not depend on $h$"]
        answer: 0
        explanation: The first term left over from the Taylor approximation is half the step times the second derivative.
    - question:
        id: drill-best-step
        type: choice
        system: s1
        prompt: |
          For a function of ordinary size in `float64`, about which step gives the forward difference its smallest error?
        options: ["$10^{-1}$", "$10^{-8}$", "$10^{-16}$", "$10^{-300}$"]
        answer: 1
        explanation: The best step is near the square root of machine epsilon, where truncation and rounding errors are equal.
    - question:
        id: drill-sum
        type: choice
        system: s1
        prompt: |
          `x` is a `float32` array of ten million small positive numbers. Which gives the more accurate total?
        options: ["`x.sum()`, which adds pairwise", "`np.cumsum(x)[-1]`, a running total", "They are always identical", "A Python loop with `total += v`"]
        answer: 0
        explanation: Pairwise adding keeps the numbers being added of similar size, so small ones are not lost in the gaps of a large running total.
    - question:
        id: predict-gaps
        type: predict
        system: s1
        prompt: Equality, order and gaps. What does this show?
        code: |
          import numpy as np

          print(0.1 + 0.2 == 0.3, np.isclose(0.1 + 0.2, 0.3))
          print((1e16 + 1.0) - 1e16, (1e16 - 1e16) + 1.0)
          print(np.spacing(1.0) == np.finfo(np.float64).eps, np.spacing(1e16))
        output: |
          False True
          0.0 1.0
          True 2.0
        explanation: The rounded sum of a tenth and two tenths is not the float nearest three tenths, though it is close. Added to ten thousand million million, a 1 is lost in the gap, and added after the large numbers have cancelled it survives. The gap near 1 is machine epsilon, and near ten thousand million million it is 2.
    - question:
        id: predict-variance
        type: predict
        system: s1
        prompt: One variance, two formulas, and a `float32`. What does this show?
        code: |
          import numpy as np

          y = np.array([1.0, 2.0, 3.0, 4.0]) + 1e9
          print((y ** 2).mean() - y.mean() ** 2)
