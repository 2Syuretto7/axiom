  work:
    - text: Slower now. For each computation, find the subtraction of nearly equal numbers, or the small number being added to a large one, before you trust a digit of it.
    - question:
        id: write-root-gap
        type: code
        mode: write
        system: s2
        prompt: |
          Write `root_gap(a)` to return $\sqrt{a + 1} - \sqrt{a}$ for a float `a` that is 0 or more, accurately to nearly full precision however large `a` is.

          Rewrite the expression so that no two nearly equal numbers are subtracted.
        starter: |
          import numpy as np

          def root_gap(a):
              # Replace the next line with your own.
              return np.sqrt(a + 1.0) - np.sqrt(a)

          print(root_gap(1e12))
        solution: |
          import numpy as np

          def root_gap(a):
              return 1.0 / (np.sqrt(a + 1.0) + np.sqrt(a))

          print(root_gap(1e12))
        tests: |
          def _rel(got, want):
              return abs(float(got) - want) / want
          assert _rel(root_gap(1e12), 4.99999999999875e-07) < 1e-12, "At a million million the result is 4.99999999999875e-07, to twelve digits and more"
          assert _rel(root_gap(1e16), 5e-09) < 1e-12, "At ten thousand million million the result is 5e-09, not 0"
          assert _rel(root_gap(1e6), 0.0004999998750000625) < 1e-12, "At a million the result is about 0.000499999875"
          assert _rel(root_gap(0.0), 1.0) < 1e-12, "At 0 the result is 1"
          assert _rel(root_gap(3.0), 0.2679491924311227) < 1e-12, "At 3 the result is 2 less the square root of 3"
          assert _rel(root_gap(8.0), 0.1715728752538099) < 1e-12, "At 8 the result is 3 less the square root of 8"
          assert _rel(float(output.strip()), 4.99999999999875e-07) < 1e-12, "The program should print 4.99999999999875e-07, to twelve digits and more"
        wrong:
          - |
            import numpy as np

            def root_gap(a):
                return np.sqrt(a + 1.0) - np.sqrt(a)

            print(4.99999999999875e-07)
          - |
            import numpy as np

            def root_gap(a):
                return 0.5 / np.sqrt(a + 0.5)

            print(root_gap(1e12))
          - |
            import numpy as np

            def root_gap(a):
                return 1.0 / (np.sqrt(a + 1.0) - np.sqrt(a))

            print(4.99999999999875e-07)
          - |
            import numpy as np

            def root_gap(a):
                return 1.0 / (2.0 * np.sqrt(a + 1.0))

            print(4.99999999999875e-07)
          - |
            import numpy as np

            def root_gap(a):
                return 1.0 / np.sqrt(a + 1.0) + np.sqrt(a)

            print(4.99999999999875e-07)
        explanation: |
          At a million million the two roots are 1 000 000.000 000 5 and 1 000 000, which agree in their first twelve or thirteen digits, so the direct subtraction keeps three or four. Multiply above and below by the sum of the roots. The top becomes a difference of squares, $(a + 1) - a$, which is exactly 1 on paper, so it is written as 1 and never computed. What remains is one over a **sum** of positive numbers, and adding positive numbers loses nothing. An approximation such as one over twice the root is good for large $a$ and wrong for small, where the exact rewriting is right everywhere. The cancellation was done by you, in algebra, on exact quantities, and the floats were given only the harmless part.
    - question:
        id: write-derivative
        type: code
        mode: write
        system: s2
        prompt: |
          Write `derivative(f, x)` to estimate $f'(x)$ for a function `f` of one float, by the **central difference** with the step $h = 10^{-5} \times \max(1, |x|)$.
        starter: |
          import numpy as np

          def derivative(f, x):
              # Replace the next line with your own.
              return 0.0

          print(round(derivative(np.exp, 1.0), 6))
        solution: |
          import numpy as np

          def derivative(f, x):
              h = 1e-5 * max(1.0, abs(x))
              return (f(x + h) - f(x - h)) / (2 * h)

          print(round(derivative(np.exp, 1.0), 6))
        tests: |
          import numpy as _np
          def _off(got, want):
              return abs(float(got) - want) / max(1.0, abs(want))
          assert _off(derivative(_np.exp, 1.0), float(_np.e)) < 1e-9, "The derivative of exp at 1 is e, to nine digits"
          assert _off(derivative(_np.sin, 0.5), float(_np.cos(0.5))) < 1e-9, "The derivative of sin at 0.5 is cos 0.5, to nine digits"
          assert _off(derivative(lambda t: t ** 3, 2.0), 12.0) < 1e-9, "The derivative of the cube at 2 is 12, to nine digits"
          assert _off(derivative(lambda t: t * t, 1e4), 2e4) < 1e-9, "The derivative of the square at 10 000 is 20 000, which needs the step to grow with x"
          assert _off(derivative(lambda t: 3.0 * t + 1.0, -7.0), 3.0) < 1e-9, "The derivative of 3t + 1 is 3 everywhere"
          assert _off(derivative(_np.log, 2.0), 0.5) < 1e-9, "The derivative of log at 2 is a half, to nine digits"
          assert _off(derivative(lambda t: 5.0, 3.0), 0.0) < 1e-9, "The derivative of a constant is 0"
          assert output.strip() == "2.718282", "The program should print 2.718282"
        wrong:
          - |
            import numpy as np

            def derivative(f, x):
                h = 1e-5 * max(1.0, abs(x))
                return (f(x + h) - f(x)) / h

            print("2.718282")
          - |
            import numpy as np

            def derivative(f, x):
                h = 1e-13
                return (f(x + h) - f(x - h)) / (2 * h)

            print("2.718282")
          - |
            import numpy as np

            def derivative(f, x):
                h = 1e-5 * max(1.0, abs(x))
                return (f(x + h) - f(x - h)) / h

            print("2.718282")
          - |
            import numpy as np

            def derivative(f, x):
                h = 1e-5
                return (f(x + h) - f(x - h)) / (2 * h)

            print(round(derivative(np.exp, 1.0), 6))
          - |
            import numpy as np

            def derivative(f, x):
                h = 1e-2 * max(1.0, abs(x))
                return (f(x + h) - f(x - h)) / (2 * h)

            print("2.718282")
          - |
            import numpy as np

            def derivative(f, x):
                h = 1e-5 * max(1.0, abs(x))
                return (f(x + h) - f(x)) / (2 * h)

            print("2.718282")
        explanation: |
          Step both ways and divide by the whole distance between the two points, which is $2h$. The terms in $h^2$ of the two Taylor approximations cancel, leaving a truncation error of about $h^2/6$ times the third derivative: with $h = 10^{-5}$, about $10^{-11}$. The rounding error is about $\varepsilon / h$, also $10^{-11}$. The two are balanced, which is why this step was chosen. The forward difference with the same step has a truncation error of $h/2$, about $10^{-6}$, five digits worse. A step of $10^{-13}$ makes the truncation error vanish and the rounding error enormous. A step of $10^{-2}$ does the reverse. And the step must scale with $x$: near 10 000 the floats are $2 \times 10^{-12}$ apart, so a step of $10^{-5}$ is resolved to only seven digits, and the estimate inherits that. You will use this function, in effect, every time you check a derivative you have worked out by hand.
