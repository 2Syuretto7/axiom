        id: fix-spread
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `spread(x)` should return the variance of the entries of a plain `float64` array. It uses the formula "the mean of the squares less the square of the mean". For the four numbers 1, 2, 3, 4 with a thousand million added to each, the variance is 1.25, and the program prints `0.0`. Fix the function so that it is accurate however large the mean of the data is, without calling `var` or `std`.
        starter: |
          import numpy as np

          def spread(x):
              return (x ** 2).mean() - x.mean() ** 2

          print(spread(np.array([1.0, 2.0, 3.0, 4.0]) + 1e9))
        solution: |
          import numpy as np

          def spread(x):
              return ((x - x.mean()) ** 2).mean()

          print(spread(np.array([1.0, 2.0, 3.0, 4.0]) + 1e9))
        tests: |
          import numpy as _np
          _d = _np.array([1.0, 2.0, 3.0, 4.0])
          for _shift in [0.0, 1e4, 1e8, 1e9, -1e9, 1e12]:
              assert abs(float(spread(_d + _shift)) - 1.25) < 1e-9, "The variance of 1, 2, 3, 4 is 1.25 whatever number is added to all four"
          assert abs(float(spread(_np.array([5.0, 5.0, 5.0])))) < 1e-12, "Equal entries have variance 0"
          assert abs(float(spread(_np.array([0.0, 10.0]))) - 25.0) < 1e-9, "The variance of 0 and 10 is 25"
          assert abs(float(spread(_np.array([2.0, 4.0, 4.0, 4.0, 5.0, 5.0, 7.0, 9.0]))) - 4.0) < 1e-9, "The variance of 2, 4, 4, 4, 5, 5, 7, 9 is 4"
          _x = _d + 1e9
          spread(_x)
          assert _x.tolist() == [1000000001.0, 1000000002.0, 1000000003.0, 1000000004.0], "The array passed in must not be changed"
          assert "var(" not in source and "std(" not in source, "Do not call var or std"
          assert output.strip() == "1.25", "The program should print 1.25"
        wrong:
          - |
            import numpy as np

            def spread(x):
                return (x ** 2).mean() - x.mean() ** 2

            print(1.25)
          - |
            import numpy as np

            def spread(x):
                return abs((x ** 2).mean() - x.mean() ** 2)

            print(1.25)
          - |
            import numpy as np

            def spread(x):
                return ((x - x.mean()) ** 2).sum()

            print(1.25)
          - |
            import numpy as np

            def spread(x):
                return (x - x.mean()).mean() ** 2

            print(1.25)
          - |
            import numpy as np

            def spread(x):
                y = x.astype(np.float32)
                return ((y - y.mean()) ** 2).mean()

            print(1.25)
          - |
            import numpy as np

            def spread(x):
                return ((x - x[0]) ** 2).mean()

            print(1.25)
        explanation: |
          With a mean of a thousand million, the mean of the squares and the square of the mean are both about $10^{18}$, and the gap between floats there is over a hundred. Their true difference, 1.25, is far smaller than one gap, so the two round to the same float or to neighbours, and the result is 0, or 128, or a negative number, and never 1.25. The condition number of that subtraction is about $10^{18}$, more than all sixteen digits. Subtract the mean **first**. The entries and their mean are exact, or nearly, and their differences, $-1.5$ to $1.5$, are small numbers computed without loss. Squaring and averaging small numbers is harmless. The two formulas are equal for real numbers and one of them is unusable for floats. Taking the absolute value hides a negative result without repairing it, and converting to `float32` throws away nine more digits before starting.
    - question:
        id: work-puzzle
        type: choice
        system: s2
        prompt: |
          In the puzzle, the running total of ten million copies of 0.1 in `float32` came to 1 087 937, and `x.sum()` gave 1 000 000.1. What accounts for the difference?
        options:
          - "`cumsum` makes arithmetic mistakes that `sum` does not."
          - "Once the running total has passed about half a million, neighbouring `float32` values are 0.0625 or more apart, so the total can move only in such steps. Adding 0.1 lands between two floats and is rounded to the nearer, which is 0.125 further on. Each addition is rounded correctly, each overshoots by a quarter, and the errors all point one way for millions of steps. `sum` adds pairwise, so the two numbers added are always of similar size and nothing is lost in the gaps."
          - "0.1 cannot be stored in a `float32`."
          - "`sum` converts to `float64` and `cumsum` does not."
        answer: 1
        explanation: |
          Every addition in both methods is done to the full accuracy of a `float32`. The difference is in what is being added to what. A running total is a large number, with wide gaps, taking in a small one, and the small one is rounded to a whole number of gaps: here 2 gaps of 0.0625 where 1.6 was wanted. A consistent rounding repeated millions of times is a drift and not a scatter. Pairwise summation arranges the same additions as a tree, so that at every level the two partners have been built from the same number of terms. The stored value of 0.1 is itself slightly off, by about one part in a hundred million, which accounts for the final 0.1 in the good answer and for none of the 87 937.
    - question:
        id: work-condition
        type: numeric
        system: s2
        prompt: |
          A system of equations has a matrix with condition number about $10^{10}$. It is solved in `float64` by `np.linalg.solve`, and the residual is at rounding level. About how many significant digits of the solution can be trusted?
        answer: "6"
        explanation: |
          The method is stable, as the residual shows: the answer is exact for data that differs from yours in about the sixteenth digit. The problem then magnifies that by its condition number. Ten of the sixteen digits are lost, and about 16 less 10 remain. No rearrangement of the elimination would recover them, since the loss belongs to the problem and not to the method. If six digits are not enough, the remedies are to pose the problem differently so that the matrix is better conditioned, or to compute in higher precision, or to obtain data that is itself more accurate than rounding.
    - question:
        id: work-step
        type: choice
        system: s2
        prompt: |
          A student estimates a derivative with the forward difference and, wanting the best possible accuracy, uses $h = 10^{-15}$. The result is right to barely one digit. Why, and what step would have served?
        options:
          - "The step is too large. A smaller one, such as $10^{-30}$, is needed."
          - "The truncation error, about $h/2$ times the second derivative, is indeed tiny for so small a step. But $f(x + h)$ and $f(x)$ then agree in about fifteen of their sixteen digits, and their difference, divided by $h$, carries a rounding error of about $2\\varepsilon |f| / h$, which is about 0.4. The total error is least where the two are equal, near $h = 10^{-8}$, or with the central difference near $10^{-5}$."
          - "The forward difference is wrong for every step."
          - "Python cannot represent $10^{-15}$."
        answer: 1
        explanation: |
          Two errors, one falling with the step and one rising. The instinct that a smaller step is more accurate is true of the mathematics and false of the arithmetic. With $\varepsilon \approx 2 \times 10^{-16}$ and $h = 10^{-15}$, the rounding term $2\varepsilon/h$ is of order 1 in relative terms: the estimate is mostly noise. Going smaller still, to a step below the gap between floats, gives exactly 0. The best step for the forward difference is about the square root of machine epsilon, where each error is about $10^{-8}$, and the central difference, whose truncation error falls as the square of the step, does a thousand times better with a larger step. This trade is the model for a great many choices in numerical work: the parameter that reduces one error increases another, and the craft is in the balance.
    - question:
        id: work-which
        type: choice
        system: s2
        prompt: |
          Three results in this cluster were poorer than expected: (a) the solution of the ten equations was right to four digits, with a perfect residual. (b) The variance of data with a large mean came out as 0. (c) The mean of a hundred uniform draws was 0.03 away from one half. Which kind of error is each?
        options:
          - "All three are rounding errors, cured by more digits."
          - "(a) is a sensitive problem: the matrix has condition number $10^{13}$, and no method in sixteen digits can do better. (b) is a poor method: the answer is well determined, and a rearranged formula gives it in full. (c) is neither. It is sampling error, the price of using a hundred draws, which shrinks as $1/\\sqrt{n}$ and not at all with more digits."
          - "(a) is a poor method, (b) is a sensitive problem, and (c) is rounding."
          - "All three are mistakes in NumPy."
        answer: 1
        explanation: |
          The first question to ask of any disappointing number is where its error comes from, since the remedies have nothing in common. An ill-conditioned problem needs a different question or better data. An unstable method needs different algebra. A sampling error needs more samples, a hundred times more for each digit. And a truncation error, as in the numerical derivative, needs a better approximation or a better-chosen step. Computing in higher precision helps the first two a little and the last two not at all. A practitioner who cannot tell these apart will spend a week improving the wrong thing.
  connections:
    - text: |
        Ten million tenths, added as a running total in `float32`, came to 1 087 937. Floats keep a fixed number of significant digits, about 16 for `float64` and 7 for `float32`, so the gap between neighbours grows with the size of the number. Past half a million the total could move only in steps of 0.0625, and every 0.1 was rounded up to 0.125. `sum` adds in pairs of similar size and has no such trouble. In floats the order of a sum matters.

        Each operation is accurate to one part in $10^{16}$, and that is not the same as the answer being so. **Subtracting nearly equal numbers** removes the digits they share and leaves their rounding errors in front. The cure is algebra done beforehand: a difference of roots rewritten as one over a sum, a variance computed from distances to the mean, and, in [[e5.log-sum-exp-and-stable-formulations]], a logarithm of a sum with its largest term taken out.

        A poor answer has one of four sources, with four different remedies. A **sensitive problem**, measured by its condition number, which costs a digit for each factor of ten: that was the matrix of ten equations. An **unstable method**, cured by rearranging. **Truncation**, the price of replacing a limit by something finite. And **sampling**, which shrinks only as $1/\sqrt{n}$. The numerical derivative set two of them against each other, and the best step was the one that balanced them: about $10^{-8}$ for the forward difference, about $10^{-5}$ for the central one.

        That closes the cluster. You began with a list of lists and you now have the array as working scientists use it: its block, shape, dtype and strides, selection and broadcasting, reductions along axes, the linear algebra you once wrote by hand, sums over named indices, randomness that can be replayed, and formulas arranged so that floats cannot spoil them. Every later cluster computes with these.

        And the last tool you built points straight at what comes next. `derivative(f, x)` finds the slope of a function of **one** number. But look at what you have been computing with: a loss that depends on a whole table of weights, a softmax of a row of scores, a quadratic form of a vector. These are functions of many numbers at once, thousands or millions. Nudge one input and hold the rest still, and you get one slope. Nudge another, and you get another. There is a slope for every input, and training a model means finding all of them and stepping downhill. What does "slope" even mean when there are a million directions to move in? What does such a function look like, and how can it be pictured? That is the next lesson, [[m12.functions-of-several-variables]].
