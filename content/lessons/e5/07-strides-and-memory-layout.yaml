                strides = []
                step = itemsize
                for length in shape:
                    strides.append(step)
                    step = step * length
                return tuple(strides)

            print("(96, 32, 8)")
          - |
            def strides_of(shape, itemsize):
                return tuple([length * itemsize for length in shape])

            print("(96, 32, 8)")
          - |
            def strides_of(shape, itemsize):
                strides = []
                step = itemsize
                for length in shape[::-1]:
                    step = step * length
                    strides.append(step)
                return tuple(strides[::-1])

            print("(96, 32, 8)")
          - |
            def strides_of(shape, itemsize):
                strides = []
                step = 1
                for length in shape[::-1]:
                    strides.append(step)
                    step = step * length
                return tuple(strides[::-1])

            print("(96, 32, 8)")
          - |
            def strides_of(shape, itemsize):
                strides = []
                step = itemsize
                for length in shape[::-1]:
                    strides.append(step)
                    step = step * length
                return strides

            print("(96, 32, 8)")
        explanation: |
          Work from the last axis back. One step along the last axis moves one entry, so its stride is the size of an entry. One step along the axis before it moves past a whole run of the last axis, so its stride is the last stride times the last length. And so on outwards: each stride is the number of bytes in one whole item of everything inside it. The loop keeps that running product, records it **before** multiplying by the current length, and the list is reversed at the end because it was built from the back. For the table of the puzzle this gives 12 000 bytes for a step down a column against 4 for a step along a row, and that single pair of numbers is the explanation of the timings. This is the address arithmetic of an array, from your lessons on data structures, carried to any number of axes.
    - question:
        id: write-moving
