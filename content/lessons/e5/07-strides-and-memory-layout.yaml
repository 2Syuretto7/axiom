  puzzle:
    - text: |
        The starter makes a square table of nine million numbers, 3000 rows by 3000 columns, and adds it up twice.

        The first loop takes each **row** in turn, `M[i]`, and asks NumPy for its total. The second takes each **column** in turn, `M[:, j]`, and does the same.

        Compare the two jobs. Each makes 3000 calls. Each call adds 3000 numbers. The rows and the columns have the same length, since the table is square. `M[i]` and `M[:, j]` are both views, as you know, so nothing is copied in either loop. The same nine million additions are done, on the same block of memory, by the same compiled code.

        Run it, more than once. The timings move about, and one fact stays: **column by column takes several times as long as row by row.**

        Nothing in what you have learned so far explains this. The count of operations is identical, and counting operations is how you have reasoned about running time since you first met orders of growth.

        **What is different about a column? What, precisely, is a view, that a row and a column of the same table can be so unlike? And what does the difference say about how data ought to be laid out?**
  intuition:
    - text: |
        Begin with what the block looks like. The table is stored row by row: the 3000 numbers of row 0, then the 3000 of row 1, and so on, nine million in a line. Each is a `float32` of 4 bytes.

        Where is row $i$? It is 3000 numbers lying side by side, starting at number $3000\,i$. To read it you start there and move **one number** at a time.

        Where is column $j$? Its first entry is number $j$. Its next is one whole row later, number $3000 + j$. The next is at $6000 + j$. To read a column you start at $j$ and move **3000 numbers** at a time, twelve thousand bytes for each step.

        So a row and a column are the same kind of thing with one number changed. Each is: **start here, and to get to the next entry, move by this much.** That "this much" is called the **stride**. The stride of a row is one number. The stride of a column is a whole row of numbers.

        That is the rule for stepping evenly through a block. A view of any kind is a start place and a stride for each of its axes. The figure shows several views of one block of twelve numbers, each with its start and its strides. Step through them, and for each, step through its items and watch where they fall in the block.
    - figure: strides
      props: { view: 0, item: 6 }
    - text: |
        Now the speed. It comes from how the memory of a computer is built, and one picture is enough.

        Think of a carpenter. On the bench within reach are a few tools. In the van outside are all the others. Picking up a tool from the bench takes a second. Fetching one from the van takes a few minutes. A sensible carpenter who walks to the van does not come back with one screw. They bring the whole box that the screw was in, since the next thing needed is probably in the same box.

        A processor has a bench, a small and very fast memory called the **cache**, and a van, the main memory, which is around a hundred times slower to reach. When the processor needs a number that is not in the cache, it fetches from main memory not that one number but the whole run of 64 bytes around it, and keeps the run in the cache. It also notices when a program is reading straight along through memory, and starts fetching ahead.

        Read a row: the first number costs a trip, and it brings its fifteen neighbours with it. The next fifteen reads are from the bench. And the reading runs straight ahead, so the fetching ahead keeps pace. Almost every read is fast.

        Read a column: each entry is twelve thousand bytes past the last. Every one is in a different run of 64 bytes. **Every read is a trip to the van**, and each trip brings back fifteen numbers that will not be wanted until much later, by which time they have been pushed off the bench.

        The additions are the same. The waiting is not.
  derivation:
    - text: |
        **The rule, exactly.** An array is described by four things beside its dtype:

        - the **block** of memory it reads,
        - a **start**, the byte of the block where its first entry lies,
        - its **shape**,
        - its **strides**, one for each axis: the number of bytes to move in the block to go one step along that axis.

        The entry at index $[i, j]$ lies at byte

        $$\text{start} + i \times s_0 + j \times s_1,$$

        and in general at the start plus the sum of each index times the stride of its axis. `a.strides` shows the strides, as a tuple in bytes.

        **A freshly made array.** For a table of shape $(m, n)$ stored row by row, with entries of $b$ bytes, one step along a row moves one entry, so $s_1 = b$. One step down a column moves a whole row of $n$ entries, so $s_0 = n\,b$. The formula gives byte $(i\,n + j)\,b$, which is the place $i \times n + j$ of the first lesson of this cluster, counted in bytes. For a `float32` table of shape `(3000, 3000)` the strides are `(12000, 4)`.

        With more axes the pattern continues: the stride of the last axis is the size of an entry, and each earlier stride is the next one multiplied by the length of that next axis. For an `int64` array of shape `(2, 3, 4)` the strides are `(96, 32, 8)`.

        **Every view is a change to these four things.** Take `a = np.arange(12, dtype=np.int64).reshape(3, 4)`, with start 0 and strides `(32, 8)`. The block is never touched.

        | view | start | shape | strides | what changed |
        |---|---|---|---|---|
        | `a` | 0 | `(3, 4)` | `(32, 8)` | |
        | `a[1]` | 32 | `(4,)` | `(8,)` | a whole number fixes the start and drops the axis |
        | `a[:, 1]` | 8 | `(3,)` | `(32,)` | the same, for the other axis |
        | `a[:, ::2]` | 0 | `(3, 2)` | `(32, 16)` | a step of 2 doubles the stride |
        | `a[::-1]` | 64 | `(3, 4)` | `(-32, 8)` | reversing starts at the far end with a negative stride |
        | `a.T` | 0 | `(4, 3)` | `(8, 32)` | the transpose exchanges the strides |

        Look at the last line. The transpose of a table, however large, is made by **exchanging two numbers**. Entry $[i, j]$ of `a.T` is at byte $8i + 32j$, which is where entry $[j, i]$ of `a` is. That is the whole of it, and it is why a transpose costs nothing.

        Look at the second and third lines together. A row has stride 8, one entry. A column has stride 32, one row. For the table of the puzzle those were 4 and 12 000. A row and a column are the same kind of object with different strides, as the intuition said.

        **Stretching, explained.** The broadcasting lesson claimed that a row stretched down a table is not copied. Here is how: `np.broadcast_to(row, (4, 3))` is a view of the three numbers of `row` with shape `(4, 3)` and strides `(0, 8)`. A stride of **zero** along axis 0 means that a step down moves nowhere. Every row of the view reads the same three numbers. Four rows are presented and three numbers exist.

        **Reshape, explained.** The last lesson's puzzle can now be stated in a line. `reshape` gives a view exactly when some start and strides, over the block it is given, produce the entries in the order wanted. For `b.T.reshape(12)` a single stride would have to move through the block by 32, 32, and then $-56$ bytes. There is no such stride, so the entries are copied.
    - question:
        id: derivation-transpose
        type: choice
        system: s2
        prompt: |
          `a` is an `int64` table of shape `(3, 4)` with strides `(32, 8)`. Why does `a.T`, of shape `(4, 3)`, need no copying, however large `a` is?
        options:
          - "Because NumPy copies in the background and hides it."
          - "The entry of `a.T` at $[i, j]$ must be the entry of `a` at $[j, i]$, which lies at byte $32j + 8i$. That is exactly what the strides `(8, 32)` give for index $[i, j]$. So exchanging the two strides, and the two lengths, describes the transpose over the same block."
          - "Because a transpose only renames the array."
          - "Because the transpose of a table has the same reading order as the table."
        answer: 1
        explanation: |
          The place of an entry is the start plus each index times its stride. Exchange which index goes with which stride and you have exchanged rows with columns. Nothing depends on the number of entries: the work is the same for a table of twelve numbers as for one of twelve thousand million. The reading order of the transpose is **not** the order of the block, which is why it could not be reshaped without a copy, and why, as the puzzle of this lesson suggests, working through it row by row will be slow.
    - text: |
        **Stored in reading order.** An array is called **contiguous**, in the row-by-row sense, when its entries in reading order lie one after another in the block with no gaps and no jumps: the last stride is the size of an entry, and each earlier stride is the next times the length of that axis. A freshly made array is contiguous. `a.flags.c_contiguous` reports it.

        Views often are not. `a.T` is not: reading it row by row goes down the columns of the block. `a[:, ::2]` is not: it skips every second entry. `a[1:3]`, two whole rows, still is.

        `np.ascontiguousarray(x)` returns `x` itself if it is contiguous, and otherwise a copy of its entries laid out in their own reading order.

        **Why order in memory is speed.** The cache holds recently used memory in runs of 64 bytes, and reaching main memory takes on the order of a hundred times as long as reaching the cache. From those two facts:

        - Reading entries that lie one after another costs one slow fetch for each run of 64 bytes: one in sixteen reads for `float32`, one in eight for `float64`. And since the processor fetches ahead of a steady march, even those are mostly ready in time.
        - Reading entries far apart costs a slow fetch for **every** entry.

        A table of nine million `float32` values takes 36 megabytes, far more than a cache holds, so the difference is paid in full. For a small table that fits in the cache whole, the order of reading hardly matters, which is why you could not have noticed this effect on the small examples of earlier lessons.

        This is a second way, beside the bookkeeping of the vectorisation lesson, in which counting operations does not give the running time. The operations are the same. What differs is the cost of bringing each number to the processor. Reading memory in order is called having good **locality**.

        **What follows for your code.** Three habits.

        1. **Lay data out so that what is used together lies together.** A table with one example in each row keeps each example in one piece of memory. Taking a batch of examples, `X[k:k + 64]`, reads one solid stretch of the block. That is the reason, beside broadcasting, for the convention of examples in rows.

        2. **When a loop must go through a table piece by piece, go along the last axis in the inner step.** Row by row for a table stored row by row.

        3. **If a view that jumps about will be used heavily, pay once for a copy in its own order**: `np.ascontiguousarray(M.T)`. The copy itself is slow, for the same reason the columns were, and after it every pass is fast.

        NumPy looks after this where it can. `M.sum(axis=0)`, the totals of all the columns in **one** call, is fast: inside, NumPy walks the block in memory order and keeps a running total for each column. The slow version in the puzzle was slow because the Python loop forced the order of travel, one column at a time. That is another reason to hand NumPy the whole job.

        **A small view keeps a large block alive.** A view owns no numbers, and it does keep its block from being thrown away. If a program reads a table of a thousand megabytes, takes `first = table[0]`, and lets go of `table`, the thousand megabytes stay in memory for as long as `first` exists, though `first` shows only a few thousand numbers. When a small piece is to outlive a large array, take it with `.copy()`.

        **Overlapping windows.** Strides can do one more thing that slicing cannot. Suppose an array `x` of length 6 with stride 8 is read with shape `(4, 3)` and strides `(8, 8)`: a step along either axis moves one entry. Row 0 is entries 0, 1, 2. Row 1 is entries 1, 2, 3. Each row is a **window** of three neighbours, and the windows overlap. Four windows of three are presented, twelve entries in all, and only six numbers exist.

        ```python
        from numpy.lib.stride_tricks import sliding_window_view

        windows = sliding_window_view(x, 3)
        ```

        Each row of `windows` is one window, and `windows.mean(axis=1)` is the moving average of `x`. A layer that slides a small pattern along a signal or across a picture, the central operation of networks that see and hear, is this: a view of overlapping windows, then one product over the last axis. For an array of length $n$ and windows of length $k$ there are $n - k + 1$ windows.
    - question:
        id: order-locate
        type: order
        system: s2
        prompt: Put in order how NumPy reads the entry at index `[i, j]` of a view.
        steps:
          - 'Take the start of the view, the byte of the block where its first entry lies.'
          - 'Add `i` times the stride of axis 0.'
          - 'Add `j` times the stride of axis 1.'
          - 'Read from that byte of the block as many bytes as the dtype says one entry takes.'
          - 'Interpret those bytes as the dtype says: a whole number, or a decimal.'
        explanation: The first three steps are arithmetic on a handful of numbers and involve no memory at all. Only the fourth touches the block, and whether that read is fast or slow depends on whether the byte is already in the cache, which depends on what was read just before. The dtype is needed twice, for how many bytes to read and for what they mean.
  formal:
    - text: |
        **Strided view.** An array is a block of memory together with a start $o$, a shape $(n_0, \dots, n_{d-1})$ and strides $(s_0, \dots, s_{d-1})$ in bytes. Its entry at index $[i_0, \dots, i_{d-1}]$ is read from byte $o + \sum_k i_k s_k$ of the block.

        **Row-by-row layout.** A freshly made array with entries of $b$ bytes has $s_{d-1} = b$ and $s_k = s_{k+1}\,n_{k+1}$.

        **Views.** A slice with step $t$ on axis $k$ multiplies $s_k$ by $t$ and moves the start. A whole-number index moves the start and removes the axis. A transpose reverses the order of the shape and of the strides. Broadcasting an axis of length 1 gives it stride 0.

        **Contiguous.** An array is contiguous in the row-by-row sense if its strides are those of the row-by-row layout for its shape. `np.ascontiguousarray(x)` returns such an array with the entries of `x`, copying only if needed.

        **Locality.** Memory is fetched into the cache in runs of 64 bytes. Reading a block in order costs about one slow fetch for each run. Reading with a stride of 64 bytes or more, in a block larger than the cache, costs one for each entry.

        **Windows.** For `x` of length $n$, `sliding_window_view(x, k)` is a view of shape $(n - k + 1, k)$ whose row $r$ is `x[r:r + k]`.
