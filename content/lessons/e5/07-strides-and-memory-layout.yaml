        explanation: Each row is three neighbouring entries, starting one place later than the row above. Five entries hold three such windows. The nine entries shown are views of five numbers, and the mean of each row is the moving average.
  work:
    - text: Slower now. For each view, say its start and its strides before saying anything about its speed.
    - question:
        id: write-strides
        type: code
        mode: write
        system: s2
        prompt: |
          Write `strides_of(shape, itemsize)` to return, as a tuple, the strides in bytes of a freshly made array with the given shape, a tuple, whose entries take `itemsize` bytes each and are stored row by row.

          Do not build an array. An empty shape `()` has no strides and gives `()`.
        starter: |
          def strides_of(shape, itemsize):
              # Replace the next line with your own.
              return shape

          print(strides_of((2, 3, 4), 8))
        solution: |
          def strides_of(shape, itemsize):
              strides = []
              step = itemsize
              for length in shape[::-1]:
                  strides.append(step)
                  step = step * length
              return tuple(strides[::-1])

          print(strides_of((2, 3, 4), 8))
        tests: |
          import numpy as _np
          assert strides_of((2, 3, 4), 8) == (96, 32, 8), "Shape (2, 3, 4) with 8-byte entries has strides (96, 32, 8)"
          assert strides_of((3, 4), 8) == (32, 8), "Shape (3, 4) with 8-byte entries has strides (32, 8)"
          assert strides_of((3000, 3000), 4) == (12000, 4), "The table of the puzzle has strides (12000, 4)"
          assert strides_of((5,), 4) == (4,), "A plain array has one stride, the size of an entry"
          assert strides_of((), 8) == (), "An empty shape has no strides"
          assert strides_of((4, 3), 8) == (24, 8), "Shape (4, 3) with 8-byte entries has strides (24, 8)"
          assert strides_of((2, 2, 2, 2), 1) == (8, 4, 2, 1), "Four axes of length 2 with 1-byte entries have strides (8, 4, 2, 1)"
          for _shape in [(7, 5), (2, 6, 3), (1, 9), (4, 1, 2)]:
              assert strides_of(_shape, 8) == _np.zeros(_shape, dtype=_np.float64).strides, "The result must agree with the strides NumPy reports for a fresh array of that shape"
          assert isinstance(strides_of((3, 4), 8), tuple), "Return a tuple"
          assert output.strip() == "(96, 32, 8)", "The program should print (96, 32, 8)"
        wrong:
