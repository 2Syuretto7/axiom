        solution: |
          import numpy as np
          from numpy.lib.stride_tricks import sliding_window_view

          def moving_average(x, k):
              return sliding_window_view(x, k).mean(axis=1)

          print(moving_average(np.array([1.0, 2.0, 6.0, 4.0, 5.0]), 3))
        tests: |
          import numpy as _np
          _x = _np.array([1.0, 2.0, 6.0, 4.0, 5.0])
          _m = moving_average(_x, 3)
          assert _m.shape == (3,), "Five entries hold three windows of length 3"
          assert _np.allclose(_m, [3.0, 4.0, 5.0]), "The means of 1, 2, 6 and of 2, 6, 4 and of 6, 4, 5 are 3, 4 and 5"
          assert _np.allclose(moving_average(_x, 1), _x), "Windows of length 1 give the array itself"
          assert _np.allclose(moving_average(_x, 5), [3.6]), "One window of the whole array gives its mean, 3.6"
          assert _np.allclose(moving_average(_x, 2), [1.5, 4.0, 5.0, 4.5]), "Windows of length 2 give the means of neighbouring pairs"
          assert _np.allclose(moving_average(_np.arange(10.0), 4), [1.5, 2.5, 3.5, 4.5, 5.5, 6.5, 7.5]), "For 0 to 9 the moving averages of 4 are 1.5 to 7.5"
          assert _x.tolist() == [1.0, 2.0, 6.0, 4.0, 5.0], "The array passed in must not be changed"
          assert "for " not in source and "while " not in source, "Use no loop and no comprehension"
          assert output.strip() == "[3. 4. 5.]", "The program should print [3. 4. 5.]"
        wrong:
          - |
            import numpy as np
            from numpy.lib.stride_tricks import sliding_window_view

            def moving_average(x, k):
                return sliding_window_view(x, k).mean(axis=0)

            print("[3. 4. 5.]")
          - |
            import numpy as np
            from numpy.lib.stride_tricks import sliding_window_view

            def moving_average(x, k):
                return sliding_window_view(x, k).sum(axis=1)

            print("[3. 4. 5.]")
          - |
            import numpy as np
            from numpy.lib.stride_tricks import sliding_window_view

            def moving_average(x, k):
                return sliding_window_view(x, k).mean()

            print("[3. 4. 5.]")
          - |
            import numpy as np
            from numpy.lib.stride_tricks import sliding_window_view

            def moving_average(x, k):
                return sliding_window_view(x, k + 1).mean(axis=1)

            print("[3. 4. 5.]")
          - |
            import numpy as np
            from numpy.lib.stride_tricks import sliding_window_view

            def moving_average(x, k):
                return x[:len(x) // k * k].reshape(-1, k).mean(axis=1)

            print("[3. 4. 5.]")
        explanation: |
          `sliding_window_view(x, k)` is a table with one window in each row: shape $(n - k + 1, k)$, with strides that move one entry along either axis, so no number is copied. The mean of each window is a reduction along the axis that runs **within** a window, axis 1, which disappears and leaves one number for each window. Along axis 0 the means would be taken across windows, giving $k$ numbers that mean nothing useful. A reshape into rows of $k$ gives windows that do not overlap, which is a different thing: it summarises the array in blocks, where a moving average follows it step by step. Smoothing a noisy training curve so that its trend can be seen is done with exactly this function.
    - question:
        id: fix-keep
        type: code
        mode: find-bug
        system: s2
        prompt: |
          A program loads a very large table, keeps only its first row as a sample, and lets the table go. `sample(table)` should return the first row as an array that **owns its own block**, so that the large table can be thrown away. As written, the result is a view, and the whole table stays in memory for as long as the sample is kept. The program prints `False` and should print `True`. Fix it.
        starter: |
          import numpy as np

          def sample(table):
              return table[0]

          table = np.arange(12.0).reshape(3, 4)
          print(sample(table).base is None)
        solution: |
          import numpy as np

          def sample(table):
              return table[0].copy()

          table = np.arange(12.0).reshape(3, 4)
          print(sample(table).base is None)
        tests: |
          import numpy as _np
          _t = _np.arange(12.0).reshape(3, 4)
          _s = sample(_t)
          assert _s.tolist() == [0.0, 1.0, 2.0, 3.0], "The sample holds the first row"
          assert _s.shape == (4,), "The sample is a plain array with one entry for each column"
          assert not _np.shares_memory(_s, _t), "The sample must not share the block of the table"
          assert _s.base is None, "The sample must own its block"
          _s[0] = 99.0
          assert _t[0, 0] == 0.0, "Writing to the sample must not change the table"
          _u = _np.array([[5.0, 6.0], [7.0, 8.0]])
          assert sample(_u).tolist() == [5.0, 6.0], "For a square table the sample is the first row, not the first column"
          assert sample(_np.ones((1000, 3))).nbytes == 24, "The sample of a table with three columns holds 24 bytes"
          assert output.strip() == "True", "The program should print True"
        wrong:
          - |
            import numpy as np

            def sample(table):
                return table[0]

            print(True)
          - |
            import numpy as np

            def sample(table):
                return table[0][:]

            print(True)
          - |
            import numpy as np

            def sample(table):
                return table[0:1].copy()

            table = np.arange(12.0).reshape(3, 4)
            print(sample(table).base is None)
          - |
            import numpy as np

            def sample(table):
                return table[:, 0].copy()

            table = np.arange(12.0).reshape(3, 4)
            print(sample(table).base is None)
          - |
            import numpy as np

            def sample(table):
                return table.copy()[0]

            print(True)
        explanation: |
          `table[0]` is a view: a start and a stride over the block of the table. It shows four numbers and holds on to all of them, since Python keeps a block for as long as anything refers to it, and a view refers to it. `.copy()` gives the row a block of its own, 32 bytes here, and breaks the link. Slicing the view again makes another view of the same block. Copying the **whole** table and then taking a row of the copy is worse than the bug: the row is a view of a second full-sized block. The attribute `base` tells the two cases apart, being `None` exactly when an array owns its block. This is the commonest cause of a program that uses far more memory than its data seems to account for, since `nbytes` on a view reports only the entries it shows.
    - question:
        id: work-columns
        type: choice
        system: s2
        prompt: |
          In the puzzle, adding the table column by column took several times as long as row by row, though both did nine million additions on views. What accounts for the difference?
        options:
          - "A column has more entries than a row."
          - "`M[:, j]` is copied before it is added up."
          - "The entries of a row lie side by side, so each fetch from main memory brings the next fifteen with it and the rest are read from the cache. The entries of a column are 12 000 bytes apart, each in a different run of 64 bytes, so every one needs its own fetch from main memory."
          - "Python's bookkeeping is larger for columns."
        answer: 2
        explanation: |
          The Python work is the same in both loops, 3000 calls each, and no copy is made in either. The difference is inside NumPy's compiled loop, in how long the processor waits for each number to arrive. With a stride of 4 bytes, sixteen entries share each run of 64 bytes and the steady march lets the processor fetch ahead. With a stride of 12 000 bytes nothing is shared, and the table, at 36 megabytes, is far too large to sit in the cache. So the cost is not in the arithmetic at all. A count of operations assumes every operation costs the same, and reading memory does not: it depends on what was read just before.
    - question:
        id: work-stride
        type: numeric
        system: s2
        prompt: |
          `a` is a freshly made `float64` table of shape `(100, 50)`. What is the stride, in bytes, along axis 0 of the view `a[::2, ::5]`?
        answer: "800"
        explanation: |
          In `a` one step down a column passes a whole row of 50 entries of 8 bytes, so the stride of axis 0 is 400. The slice takes every second row, which doubles it. The stride of axis 1 goes from 8 to 40 in the same way, and the view has shape `(50, 10)`. No entry has moved. The view is not stored in its reading order, since its neighbouring entries are 40 bytes apart and its neighbouring rows 800, so a heavy computation on it would be faster after `np.ascontiguousarray`.
    - question:
        id: work-zero
        type: choice
        system: s2
        prompt: |
          `row` holds three `float64` numbers. `v = np.broadcast_to(row, (1000000, 3))` has shape `(1000000, 3)` and strides `(0, 8)`. How much memory do its entries occupy, and what would happen if a program could write to `v[5, 0]`?
        options:
          - "24 megabytes, and only row 5 would change."
          - "24 bytes. A stride of 0 along axis 0 means every row reads the same three numbers, so a write to `v[5, 0]` would change the first entry of **every** row at once. For that reason NumPy marks such a view as read-only."
          - "24 bytes, and only row 5 would change."
          - "Nothing, since the view is empty."
        answer: 1
        explanation: |
          The place of `v[i, j]` is $0 \times i + 8 \times j$, which does not depend on $i$. A million rows are shown and three numbers exist. That is how broadcasting stretches without copying, as was claimed three lessons ago. It also means the rows are not independent: they are one row seen a million times. Writing through such a view would be so surprising that NumPy forbids it, and when a program truly needs a million separate rows it must ask for a copy, which takes the full 24 megabytes.
    - question:
        id: work-layout
        type: choice
        system: s2
        prompt: |
          A set of training data has a million examples, each of 100 features, and a model is trained by reading 64 examples at a time. The data could be stored as a table of shape `(1000000, 100)`, examples in rows, or as `(100, 1000000)`, features in rows. Which layout suits the training loop, and why?
        options:
          - "Features in rows, since there are fewer rows."
          - "Examples in rows. A batch `X[k:k + 64]` is then one solid stretch of 6400 numbers, read in order. With features in rows, a batch `X[:, k:k + 64]` is a hundred short pieces 8 megabytes apart, and assembling it means a hundred far jumps through memory."
          - "It makes no difference, since both hold the same numbers."
          - "Features in rows, since a transpose is free."
        answer: 1
        explanation: |
          Lay data out so that what is used together lies together. The training loop uses one example's features together, and neighbouring examples together, so each example should be a solid run and each batch a solid run of those. A transpose is free to **make**, and that is exactly the trap: the transposed table is a view whose reading order jumps through the block, and every pass over it pays for the jumps. If the analysis at hand worked a feature at a time, over all examples, the other layout would be the right one. There is no best layout in general. There is the layout that matches the order in which the numbers will be read.
  connections:
    - text: |
        A square table was added up by rows and by columns, with the same nine million additions, and the columns took several times as long. A row is read one entry at a time. A column is read a whole row at a time, 12 000 bytes for each step. A processor fetches memory in runs of 64 bytes and fetches ahead of a steady march, so the row arrives nearly for nothing, and every entry of the column has to be sent for.

        That step is the **stride**, and with it the phrase left open by [[e5.reshaping-views-and-copies]] is closed. A view is a block, a start, a shape and one stride for each axis, and the entry at an index lies at the start plus each index times its stride. A slice with a step multiplies a stride. A reversal makes it negative. A transpose exchanges two strides, which is why it is free. A broadcast axis has stride zero, which is how one row is shown a million times. And a reshape is a view exactly when some start and strides give the order wanted.

        From this come habits for real work. Keep together in memory what is used together: examples in rows, batches as slices of rows. Let NumPy do a whole job in one call, since it walks the block in memory order when it can. Copy a small piece that must outlive a large array. And when a view that jumps about is to be used heavily, pay once for a copy in its own order.

        Strides also gave overlapping windows, a table of every run of $k$ neighbours with nothing copied, which is the mechanism under moving averages and under the layers of a network that slide a pattern across a signal. The effect of the order of operations on the **accuracy** of a result, as distinct from its speed, is taken up in [[e5.numerical-error-analysis-in-practice]].

        You now know the array from the outside and from the inside: its shape and dtype, how to select from it, how shapes combine, how to reduce along an axis, how views share a block, and how the block is walked. Everything so far has treated an array as a container of numbers. It is time to treat a table as what the last cluster said it is, a **matrix**: a linear map, with a product, an inverse, a rank and a determinant. You wrote `matmul`, `solve`, `rank` and `det` by hand, on lists of rows, and proved what each one does. NumPy has all of them, written by specialists and resting on fifty years of careful work, hundreds of times faster than yours and far more careful about rounding. Which to call, what each really computes, and why you should almost never ask for an inverse, is the next lesson, [[e5.linear-algebra-routines]].
