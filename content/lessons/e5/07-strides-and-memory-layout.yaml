concept: e5.strides-and-memory-layout
minutes: 90
claim: You can describe any view of an array as a start place and one stride for each axis, compute where an entry lies in the block from them, say what slicing, reversing, transposing and broadcasting each do to the strides, tell when an array is stored in its own reading order, explain why reading memory in order is much faster than jumping about in it, and arrange data and loops accordingly.
recalls: [e5.reshaping-views-and-copies]
uses: [e5.indexing-and-slicing, e5.arrays-dtype-and-shape, e5.broadcasting, e5.vectorisation, e5.axis-operations-and-reductions, e3.arrays-and-linked-lists, e1.complexity-and-big-o, m5.transpose, m0.estimation-and-orders-of-magnitude, e0.lists-and-tuples, e0.loops, e0.functions]
leads: [e5.linear-algebra-routines, e5.einsum, e5.numerical-error-analysis-in-practice]
starter: |
  # Scratch space. Nine million numbers, added up row by row and then column by column.
  import time
  import numpy as np

  n = 3000
  M = np.ones((n, n), dtype=np.float32)

  start = time.perf_counter()
  for i in range(n):
      M[i].sum()
  by_rows = time.perf_counter() - start

  start = time.perf_counter()
  for j in range(n):
      M[:, j].sum()
  by_columns = time.perf_counter() - start

  print("row by row      ", round(by_rows * 1000, 1), "ms")
  print("column by column", round(by_columns * 1000, 1), "ms")
