concept: e5.axis-operations-and-reductions
minutes: 90
claim: You can take a total, a mean, a largest or smallest value, the position of the largest, or a standard deviation along a chosen axis of an array, predict the shape of the result from the rule that the named axis is the one that disappears, keep that axis with length 1 so that the result broadcasts back against the array it came from, and use these to standardise the columns of a table, turn rows of scores into probabilities and measure the accuracy of a classifier.
recalls: [e5.vectorisation]
uses: [e5.broadcasting, e5.indexing-and-slicing, e5.arrays-dtype-and-shape, m4.norms-and-distance, m2.summation-and-product-notation, m2.the-exponential-and-e, m10.maxima-and-minima, e1.modules-and-imports, e0.booleans-and-conditionals, e0.functions]
leads: [e5.reshaping-views-and-copies, e5.linear-algebra-routines, e5.einsum, e5.log-sum-exp-and-stable-formulations]
starter: |
  # Scratch space. Four flats, with rooms and bathrooms.
  import numpy as np

  X = np.array([[3.0, 1.0], [2.0, 1.0], [4.0, 2.0], [1.0, 1.0]])

  print(X.sum(axis=0))
  print(X.sum(axis=1))

  print(X - X.mean(axis=0))
  print(X / X.sum(axis=1))
parts:
  recall:
    - text: |
        [[e5.vectorisation]] turned loops into operations on whole arrays, and one kind of loop was left for today: the total. It was needed two lessons ago as well, when the means of the columns of a table and the totals of its rows were typed in by hand. Three quick pulls first.
  puzzle:
    - text: |
        The table of flats is back: four rows, one for each flat, with rooms in the first column and bathrooms in the second. Its shape is `(4, 2)`. Axis 0 has length 4 and counts the flats. Axis 1 has length 2 and counts the kinds of space.

        Run the starter. `X.sum(axis=0)` prints `[10.  5.]`, and `X.sum(axis=1)` prints `[4. 3. 6. 2.]`.

        Look at which is which. 10 is the total number of rooms and 5 the total number of bathrooms: one total for each **column**. Yet it was asked for with `axis=0`, and axis 0 is the axis of **rows**. The four totals of the rows came from `axis=1`, the axis of columns. Nearly everyone guesses these the other way round the first time.

        Then the two lines that started all this. `X - X.mean(axis=0)` works: each column has its mean taken away. `X / X.sum(axis=1)` stops with the error you have seen before:

        ```
        ValueError: operands could not be broadcast together with shapes (4,2) (4,)
        ```

        The totals are now computed, not typed, and they still come out in a shape that will not divide the rows.

        **Is the naming of the axes backwards? What exactly does `axis=0` say? And how can a total be asked for in a shape that fits back against the table it came from?**
  intuition:
    - text: |
        The naming is not backwards. It answers a different question from the one people expect.

        The expected question is "one total **for each** what?". The question `axis` actually answers is "add up **along** what?".

        To add along axis 0 is to move down the rows, with the column held fixed, adding as you go. When you reach the bottom you have one number, and you have it for that column. Do this for each column and there is one total for each column. **The axis you add along is used up. The other axis is what remains.**

        So `sum(axis=0)` walks along axis 0 and collapses it. A table of shape `(4, 2)` loses its 4 and becomes an array of shape `(2,)`. And `sum(axis=1)` walks along axis 1, across each row, collapses that, and leaves shape `(4,)`.

        In the figure the table has 3 rows and 4 columns. Switch between the axes and watch which way the adding runs, and what is left.
    - figure: axis-reduce
      props: { axis: 0 }
    - text: |
        You have met this rule already, in other clothes. When a whole number was used as an index on some axis, that axis disappeared from the shape and the rest stayed. A total along an axis does the same to the shape. In both cases an axis is named and that axis goes. **The `axis` argument names the axis that disappears.**

        This also explains the second half of the puzzle. The totals of the rows have shape `(4,)`: axis 1 has gone, and what is left is a plain array of four numbers. A plain array lines up with the **last** axis of the table, which has length 2. It does not fit. The totals need to be a column of shape `(4, 1)`.

        The column means were luckier. Removing axis 0 from `(4, 2)` leaves `(2,)`, which happens to line up with the last axis of the table exactly as it should.

        What is needed is a way to collapse an axis without removing it: to leave it in the shape, with length 1. Then the result has as many axes as the table, with a 1 exactly where the adding happened, and broadcasting stretches it straight back. Switch on `keepdims` in the figure and read the shapes.
  derivation:
    - text: |
        **Reductions.** An operation that turns many numbers into one is called a **reduction**. The common ones are methods of every array.

        | method | gives |
        |---|---|
        | `a.sum()` | the total |
        | `a.mean()` | the mean, the total divided by the count |
        | `a.max()`, `a.min()` | the largest and smallest values |
        | `a.argmax()`, `a.argmin()` | the **position** of the largest and of the smallest |
        | `a.std()`, `a.var()` | the standard deviation and its square, the variance |
        | `a.prod()` | the product |
        | `a.any()`, `a.all()` | whether any entry, or every entry, is True |

        Called with no argument, each takes the **whole** array, whatever its shape, and gives one number. For the flats, `X.sum()` is 15 and `X.mean()` is 1.875.

        **Along an axis.** With `axis=k`, the reduction is done separately along axis $k$ for every setting of the other indices. The shape of the result is the shape of the array with entry $k$ **deleted**.

        ```
        X.shape              (4, 2)
        X.sum(axis=0).shape     (2,)     axis 0 deleted
        X.sum(axis=1).shape  (4,)        axis 1 deleted
        ```

        For a table, then: `axis=0` gives one result for each column, and `axis=1` gives one result for each row. If the words slip, the shape rule will not. **Write down the shape, cross out the axis you named, and read what is left.**

        The rule is the same for any number of axes. A batch of 32 pictures of 28 by 28 has shape `(32, 28, 28)`.

        - `batch.mean(axis=0)` has shape `(28, 28)`: the mean picture, each pixel averaged over the batch.
        - `batch.mean(axis=(1, 2))` has shape `(32,)`: a tuple of axes removes them all, giving the mean brightness of each picture.
        - `axis=-1` means the last axis, whatever the number of axes.

        **Keeping the axis.** With `keepdims=True` the axis is not deleted. It stays in the shape with length 1.

        ```
        X.sum(axis=1).shape                  (4,)
        X.sum(axis=1, keepdims=True).shape   (4, 1)
        ```

        The four totals are the same numbers, now arranged as a column. And a result with a 1 where the reduction happened is exactly what broadcasting stretches. So

        ```python
        fractions = X / X.sum(axis=1, keepdims=True)
        ```

        divides each row by its own total. The rows of the result each add up to 1. The line that failed in the puzzle works with one more argument, and it works for a table of any shape, including the square table that fooled the plain version two lessons ago.

        **A result kept with `keepdims=True` always broadcasts back against the array it came from**, whichever axis was reduced. Make it a habit whenever a reduction is about to be combined with its own array.

        **The mean of a mask.** A mask is True and False, counted as 1 and 0. Its sum is the number of Trues. Its mean is the number of Trues divided by the count, which is the **fraction** that are True. So `(x > 0).mean()` is the fraction of positive entries, and with an axis it is a fraction for each column or each row.

        **Standard deviation.** The mean says where a column of numbers is centred. The standard deviation says how widely it is spread. Take the deviations of the entries from their mean, square them, take the mean of the squares, and take the square root:

        $$\sigma = \sqrt{\frac{1}{n}\sum_{i=1}^{n}(x_i - \bar{x})^2}.$$

        It is the length of the vector of deviations, divided by $\sqrt{n}$: a typical distance of an entry from the mean, in the units of the entries themselves. The square of it, before the root is taken, is the variance. For the numbers 2, 4, 4, 4, 5, 5, 7, 9 the mean is 5, the squared deviations are 9, 1, 1, 1, 0, 0, 4, 16, their mean is 4, and the standard deviation is 2.

        In array form the formula is `np.sqrt(((x - x.mean()) ** 2).mean())`, and it is built in as `x.std()`.
    - question:
        id: derivation-axis
        type: choice
        system: s2
        prompt: |
          `X` has shape `(4, 2)`, with a flat in each row. Why does `X.sum(axis=0)` give one total for each **column**, when axis 0 is the axis of rows?
        options:
          - "Because NumPy numbers its axes in reverse."
          - "Because `axis=0` says which axis to add **along**. Adding along axis 0 runs down the rows with the column held fixed, so the rows are used up and one number is left for each column. The result has the shape of `X` with axis 0 deleted, `(2,)`."
          - "Because the table is stored column by column."
          - "Because `sum` always returns the shorter of the two possibilities."
        answer: 1
        explanation: |
          The argument names the axis that disappears, not the axis that survives. Both descriptions are of the same operation: "add down the rows" and "one total for each column". The second is how people usually think of what they want, and the first is what the argument says. When in doubt, use the shapes. The total for each column must have one entry for each column, shape `(2,)`. Which axis must be deleted from `(4, 2)` to leave `(2,)`? Axis 0. This check costs a few seconds and works for arrays with any number of axes, where words like "row" and "column" run out.
    - text: |
        **Standardising a table.** The columns of a table of data are usually in different units and of different sizes: rooms run from 1 to 4, and a column of prices would run into the lakhs. A model that works by descent takes a step in every direction at once, and when one column is thousands of times larger than another, no single step length suits both. The standard remedy is to give every column mean 0 and standard deviation 1:

        ```python
        Z = (X - X.mean(axis=0)) / X.std(axis=0)
        ```

        Both reductions remove axis 0 and leave shape `(2,)`, one number for each column, and both broadcast against the rows. Each entry of `Z` says how many standard deviations its original was above or below the mean of its column. This single line is the first step of a very large share of all machine-learning code.

        **Rows of scores into probabilities.** A classifier produces, for each example, one score for each class, in a table `S` with examples in rows. To turn a row of scores into probabilities, positive numbers that add up to 1, apply the exponential to each score, which makes it positive, and divide by the total of the row:

        ```python
        E = np.exp(S)
        P = E / E.sum(axis=1, keepdims=True)
        ```

        This is called **softmax**. The exponential keeps the order of the scores, so the largest score gets the largest probability, and it turns a difference of scores into a ratio of probabilities. The row total is taken along axis 1, and kept, so that it divides its own row.

        **The position of the largest.** `P.argmax(axis=1)` gives, for each row, the **position** of its largest entry: the class the model thinks most likely. If `y` holds the correct classes,

        ```python
        accuracy = (P.argmax(axis=1) == y).mean()
        ```

        is the fraction of examples the model got right. Three things from this cluster in one short line: a reduction along an axis, a comparison giving a mask, and the mean of the mask.

        Without an axis, `argmax` treats the array as one long list and gives a position in that, which for a table is rarely what is wanted.

        **Lengths of rows.** The length of each row of a table, as a vector, is `np.sqrt((X ** 2).sum(axis=1))`. With `keepdims=True` it divides the table to give rows of length 1, after which the dot product of two rows is the cosine of the angle between them.

        **Two cautions about dtype.** The mean of whole numbers is a decimal, and NumPy returns `float64` for it. But the **sum** of an array of a small whole-number dtype may be kept in a small whole-number dtype, depending on the machine, and can overflow as any other arithmetic can. When adding many whole numbers, state a wide dtype: `a.sum(dtype=np.int64)`.

        **What a reduction costs.** A reduction is a loop over the entries, run inside NumPy. It is the third pattern of the last lesson, and the reason this lesson needed no loops.
    - question:
        id: order-normalise
        type: order
        system: s2
        prompt: Put in order what happens when NumPy evaluates `X / X.sum(axis=1, keepdims=True)` for `X` of shape `(4, 2)`.
        steps:
          - 'The entries of each row are added, along axis 1.'
          - 'The four totals are returned with axis 1 kept at length 1, as an array of shape `(4, 1)`.'
          - 'The shapes `(4, 2)` and `(4, 1)` are lined up at the right: 2 meets 1, and 4 meets 4.'
          - 'The column of totals is stretched across the two columns, so each row meets its own total.'
          - 'The division is done entry by entry, giving a table of shape `(4, 2)` whose rows each add up to 1.'
        explanation: The reduction is finished, and its shape settled, before the division begins. The shape `(4, 1)` is what lets the broadcasting rule put each total beside its own row. Without `keepdims` the totals would have shape `(4,)`, the rule would line them up with the columns, and the division would fail, or for a square table go wrong in silence.
  formal:
    - text: |
        **Reduction along an axis.** For an array `a` of shape $(n_0, \dots, n_{d-1})$ and a reduction $r$, `a.r(axis=k)` has shape $(n_0, \dots, n_{k-1}, n_{k+1}, \dots, n_{d-1})$. Its entry at an index is $r$ applied to the $n_k$ entries of `a` obtained by letting the index along axis $k$ run and holding the others fixed.

        **Whole array.** With no axis, the reduction is over all entries and the result is a single number.

        **Several axes.** A tuple of axes removes each of them. `axis=-1` is the last axis.

        **Keeping the axis.** With `keepdims=True` the reduced axis remains with length 1, and the result broadcasts against `a`.

        **Mean and standard deviation.** $\bar{x} = \frac{1}{n}\sum x_i$ and $\sigma = \sqrt{\frac{1}{n}\sum (x_i - \bar{x})^2}$.

        **Position of the largest.** `a.argmax(axis=k)` holds, in place of each largest value along axis $k$, its index along that axis.

        **Mask.** For a mask `m`, `m.sum()` is the number of True entries and `m.mean()` the fraction.
  drill:
