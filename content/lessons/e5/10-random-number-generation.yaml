          import numpy as np

          def batches(n, size, steps, seed):
              out = []
              rng = np.random.default_rng(seed)
              for step in range(steps):
                  out.append(rng.integers(0, n, size=size))
              return out

          got = batches(1000, 8, 3, 0)
          print(got[0].tolist() == got[1].tolist())
        tests: |
          import numpy as _np
          _got = batches(1000, 8, 3, 0)
          assert len(_got) == 3, "Three steps give three batches"
          assert all(_g.shape == (8,) for _g in _got), "Each batch holds 8 example numbers"
          assert _got[0].tolist() != _got[1].tolist() and _got[1].tolist() != _got[2].tolist(), "The batches must differ from one another"
          assert all(0 <= int(_v) < 1000 for _g in _got for _v in _g), "Every example number must be from 0 up to 999"
          _again = batches(1000, 8, 3, 0)
