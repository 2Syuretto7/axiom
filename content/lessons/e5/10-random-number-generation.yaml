        explanation: |
          The generator was made inside the loop. On every step a new one was opened at the same page, and it read out the same eight numbers. Moving the line above the loop makes one generator, whose state each draw moves on, so the batches differ, and since everything follows from the one seed, the whole list is the same on every call. Dropping the seed makes the batches differ and throws away the repeatability that was asked for. Adding the step number to the seed looks clever and does produce different batches, but it is a habit to avoid: generators started from neighbouring seeds are not promised to be independent of one another, the scheme collides with any other part of the program that uses seed 1 or seed 2, and it remains a generator made inside a loop. A model trained with the original bug sees eight examples out of a thousand, over and over, and learns those eight by heart.
    - question:
        id: work-random
        type: choice
        system: s2
        prompt: |
          In the puzzle, the line with seed 2024 printed the same three numbers on every run. In what sense, then, are they random?
        options:
          - "In no sense. They are a fixed list, and using them is a mistake."
          - "No single number is unpredictable: given the seed and the rule, each is certain. What the generator promises is that the numbers as a collection are spread as chance would spread them, with each equal stretch of the range getting an equal share and no usable pattern from one to the next. That is all that shuffling, starting weights and sampling require, and the fixed seed adds the ability to replay the run."
          - "They are random because the computer picks the seed itself."
          - "They become random once enough of them are drawn."
        answer: 1
        explanation: |
          There are two quite different things one could want from random numbers. One is that nobody can foresee them, which matters for passwords and for gambling, and which a seeded generator plainly does not give. The other is that they behave statistically like draws of chance, which is what computation needs: an order with no relation to the data, starting values with no symmetry, sample points spread evenly. For the second purpose, a sequence fixed by a seed is not a compromise. It is better than true chance, since an experiment made with it can be repeated exactly. With the seed left out, NumPy took one from the operating system, which is why the first line of the puzzle changed.
    - question:
        id: work-toy
        type: numeric
        system: s2
        prompt: |
          The toy generator has the rule state ← (5 × state + 3) mod 16. It is seeded with the state 12. What is the third state it produces?
        answer: "9"
        explanation: |
          From 12: 5 × 12 + 3 is 63, and 63 less 48 is 15. From 15: 78, and 78 less 64 is 14. From 14: 73, and 73 less 64 is 9. The same sequence 15, 14, 9 appears in the run that began at 7, further along. A seed does not choose a different sequence. It chooses a different place to begin in the one sequence the rule defines, as a page chooses a place in a book.
    - question:
        id: work-seeds
        type: choice
        system: s2
        prompt: |
          With seed 0, model A reaches 91.2 per cent accuracy and model B reaches 91.9 per cent. A colleague concludes that B is the better model. What is the sound next step?
        options:
          - "Accept the conclusion, since the seed was fixed and the comparison was fair."
          - "Train both models with several other seeds as well. Fixing the seed made each run repeatable, and it did not make it typical. If the accuracy of either model moves by a whole point from seed to seed, a difference of 0.7 between two single runs says nothing, and only the spread over seeds can show whether B is reliably ahead."
          - "Remove the seed, so that the result is more random."
          - "Try seeds until one is found for which the gap is as large as possible, and report that."
        answer: 1
        explanation: |
          A seed selects one particular run from the many that chance could have given: one set of starting weights, one order of examples. The result of that run is a single draw, and a single draw tells you little about a typical one. Repeating over seeds measures the run-to-run spread, and the square-root law says how the average over runs sharpens: four seeds halve the uncertainty of one. Removing the seed keeps the ignorance and loses the repeatability. Hunting for the seed with the largest gap is choosing the evidence to fit the conclusion, and it is common enough in practice that careful readers ask how many seeds a reported result was run with.
    - question:
        id: work-root
        type: numeric
        system: s2
        prompt: |
          The mean of 100 uniform draws is typically about 0.03 away from 0.5. About how many draws are needed for the mean to be typically about 0.003 away?
        answer: "10000"
        explanation: |
          The typical error falls as $1/\sqrt{n}$. To make it ten times smaller, $\sqrt{n}$ must be ten times larger, so $n$ must be a hundred times larger. A hundred times 100 draws. Each further decimal place costs another factor of a hundred, which is why measuring anything by sampling to high precision is expensive, and why a test set of a few hundred examples cannot distinguish two models whose accuracies differ by half a per cent.
  connections:
    - text: |
        Two generators printed three numbers each, and one of them printed the same three on every run. A generator is a state and a fixed rule for stirring it. Each draw applies the rule, moves the state on, and makes a number from it. The numbers are certain, given the starting state, and as a crowd they are spread the way chance would spread them. The **seed** is the starting state. With no seed, NumPy takes one from the unpredictable timing of events in the machine.

        From uniform draws between 0 and 1 everything else is made by stretching, shifting and transforming: any range, whole numbers, permutations, and the bell-shaped normal draws that the weights of a network start from. The mean of $n$ draws differs from the true mean by about the spread of one draw divided by $\sqrt{n}$, so a hundred times the data buys one more decimal place.

        Because the state moves, how a program handles its generator matters. One seed, written down. One generator, made once and passed to whatever draws. Never one made inside a loop. Shuffle examples and labels by a single permutation, with the position arrays of the indexing lesson. And treat the outcome of one seed as one draw: repeat over several before believing a difference.

        The integral you met as an accumulated area came back twice, once to find the mean and spread of a uniform draw and once turned inside out, as an area estimated by scattering points. Sampling of that kind is how the many-dimensional integrals of probability are computed in practice, and the question of how much to trust such an estimate is taken further in [[e5.numerical-error-analysis-in-practice]].

        Random numbers give you one more thing: a way to test your own code on inputs you did not choose. Try it on a function you wrote four lessons ago. Draw a hundred rows of scores with `rng.normal(0.0, 1000.0, size=(100, 5))`, large ones, such as a badly started network can easily produce, and hand the table to your `softmax`. Most of the rows come back as `nan`. Yet the answer for every row is perfectly well defined: nearly all the probability belongs to the largest score. The formula is right, every step of the code follows the formula, and the result is rubbish. How a correct formula can be an incorrect program, and how to rewrite it so that it cannot fail, is the next lesson, [[e5.log-sum-exp-and-stable-formulations]].
