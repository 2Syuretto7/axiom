    - question:
        id: write-pi
        type: code
        mode: write
        system: s2
        prompt: |
          Write `estimate_pi(n, rng)`. Scatter `n` points uniformly over the unit square, with both coordinates between 0 and 1, using the generator `rng`. The fraction that lie inside the quarter circle, where $x^2 + y^2 < 1$, estimates $\pi/4$. Return the estimate of $\pi$.

          Use no loop and no comprehension.
        starter: |
          import numpy as np

          def estimate_pi(n, rng):
              # Replace the next line with your own.
              return 0.0

          print(abs(estimate_pi(1000000, np.random.default_rng(0)) - 3.14159) < 0.01)
        solution: |
          import numpy as np

          def estimate_pi(n, rng):
              points = rng.random((n, 2))
              inside = (points ** 2).sum(axis=1) < 1
              return 4 * inside.mean()

          print(abs(estimate_pi(1000000, np.random.default_rng(0)) - 3.14159) < 0.01)
        tests: |
          import numpy as _np
          for _seed in [0, 1, 2, 3]:
              _e = float(estimate_pi(200000, _np.random.default_rng(_seed)))
              assert abs(_e - 3.14159) < 0.03, "With 200 000 points the estimate should be within 0.03 of pi"
          _p = float(estimate_pi(1000, _np.random.default_rng(4)))
          _q = float(estimate_pi(1000, _np.random.default_rng(4)))
          _r = float(estimate_pi(1000, _np.random.default_rng(5)))
          assert _p == _q, "The same seed must give the same estimate"
          assert _p != _r, "A different seed should give a different estimate, so the generator passed in must be the one used"
          assert abs(_p * 250 - round(_p * 250)) < 1e-6, "With 1000 points the estimate must be 4 times a count of points divided by 1000"
          assert 2.9 < _p < 3.4, "With 1000 points the estimate should lie between 2.9 and 3.4"
          assert "for " not in source and "while " not in source, "Use no loop and no comprehension"
          assert output.strip() == "True", "The program should print True"
