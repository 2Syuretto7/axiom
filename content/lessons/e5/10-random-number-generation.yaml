          _want = [_ref.integers(0, 50, size=4).tolist() for _ in range(5)]
          assert [_g.tolist() for _g in batches(50, 4, 5, 7)] == _want, "The batches must be successive draws from one generator made from the seed"
          assert output.strip() == "False", "The program should print False"
