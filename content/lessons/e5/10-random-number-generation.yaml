          `rng.random((n, 2))` is a table of `n` points, one in each row, with its two coordinates. Squaring and adding along axis 1 gives $x^2 + y^2$ for every point, and comparing with 1 gives a mask that is `True` inside the quarter circle. The mean of a mask is the fraction of `True`s, as you used for accuracy. That fraction estimates the area of the quarter circle as a share of the square, $\pi/4$, so four times it estimates $\pi$. Using the same draw for both coordinates puts every point on the diagonal of the square, which measures a length and not an area. The condition $x + y < 1$ marks out a triangle of area one half. This is integration by sampling. Each point is a yes or a no with a standard deviation of about 0.4, so by the square-root law the estimate from a million points is typically off by $4 \times 0.4 / 1000$, around 0.002: slow to converge, and indifferent to how many dimensions the region has, which is its whole value.
