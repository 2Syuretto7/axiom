  work:
    - text: Slower now. For each expression, say its shape, and say whether it shares the block of the array it came from.
    - question:
        id: write-batches
        type: code
        mode: write
        system: s2
        prompt: |
          A model is trained on a few rows of the data at a time. Write `batches(X, size)` to return a list of the consecutive blocks of `size` rows of the table `X`: rows 0 to `size - 1`, then the next `size` rows, and so on. If the rows do not divide evenly, the last block is shorter. Every row must appear in exactly one block.

          The blocks must be **views** of `X`. No number is to be copied. `len(X)` is the number of rows.
        starter: |
          import numpy as np

          def batches(X, size):
              # Replace the next line with your own.
              return [X]

          X = np.array([[i, 10 * i] for i in range(10)])
          print([block.shape for block in batches(X, 4)])
        solution: |
          import numpy as np

          def batches(X, size):
              return [X[start:start + size] for start in range(0, len(X), size)]

          X = np.array([[i, 10 * i] for i in range(10)])
          print([block.shape for block in batches(X, 4)])
        tests: |
          import numpy as _np
          _X = _np.array([[i, 10 * i] for i in range(10)])
          _b = batches(_X, 4)
          assert [block.shape for block in _b] == [(4, 2), (4, 2), (2, 2)], "Ten rows in blocks of 4 give blocks of 4, 4 and 2 rows"
          assert _b[1].tolist() == [[4, 40], [5, 50], [6, 60], [7, 70]], "The second block of 4 holds rows 4 to 7"
          assert _b[2].tolist() == [[8, 80], [9, 90]], "The last block holds the rows left over"
          assert all([_np.shares_memory(block, _X) for block in _b]), "The blocks must be views of X, not copies"
          assert [block.shape for block in batches(_X, 5)] == [(5, 2), (5, 2)], "Ten rows in blocks of 5 give two blocks and no empty one"
          assert [block.shape for block in batches(_X, 10)] == [(10, 2)], "A block size equal to the number of rows gives one block"
          assert [block.shape for block in batches(_X, 25)] == [(10, 2)], "A block size larger than the table gives one block with every row"
          assert [block.shape for block in batches(_X, 1)] == [(1, 2)] * 10, "Blocks of 1 row are tables with one row, not plain lists"
          assert sum([len(block) for block in batches(_X, 3)]) == 10, "Every row must appear exactly once"
          assert output.strip() == "[(4, 2), (4, 2), (2, 2)]", "The program should print [(4, 2), (4, 2), (2, 2)]"
        wrong:
          - |
            import numpy as np

            def batches(X, size):
                return [X[start:start + size] for start in range(0, len(X) - size + 1, size)]

            print("[(4, 2), (4, 2), (2, 2)]")
          - |
            import numpy as np

            def batches(X, size):
                return [X[start:start + size].copy() for start in range(0, len(X), size)]

            X = np.array([[i, 10 * i] for i in range(10)])
            print([block.shape for block in batches(X, 4)])
          - |
            import numpy as np

            def batches(X, size):
                return [X[start:start + size] for start in range(len(X))]

            print("[(4, 2), (4, 2), (2, 2)]")
          - |
            import numpy as np

            def batches(X, size):
                return [X[start:start + size - 1] for start in range(0, len(X), size)]

            print("[(4, 2), (4, 2), (2, 2)]")
          - |
            import numpy as np

            def batches(X, size):
                return [X[start] for start in range(0, len(X), size)]

            print("[(4, 2), (4, 2), (2, 2)]")
          - |
            import numpy as np

            def batches(X, size):
                return [X[:, start:start + size] for start in range(0, len(X), size)]

            print("[(4, 2), (4, 2), (2, 2)]")
        explanation: |
          `range(0, len(X), size)` gives the row at which each block starts, and `X[start:start + size]` is the block. A slice that runs past the end is cut short without complaint, exactly as for a list, and that gives the shorter last block with no special case. Each block is a slice, so each is a view: a few dozen bytes describing where in `X` to look. A thousand passes over a large set of training data, each cutting it into thousands of blocks, copies nothing. Only a slice will do here. `X[start]`, with a whole number, would give one row and drop an axis, and a block of one row must still be a table of shape `(1, 2)`, since the code that receives it expects two axes.
        hints:
          - The starts of the blocks are 0, size, 2 × size and so on, which is a range with a step.
          - The block starting at start is X[start:start + size].
          - A slice may run past the end. It is cut short, with no error.
    - question:
        id: write-relu
        type: code
        mode: write
        system: s2
        prompt: |
          Write `relu(x)` to return a **new** array equal to `x` with every negative entry replaced by 0. The array `x` that was passed in must be left exactly as it was. `x` may have any shape.
        starter: |
          import numpy as np

          def relu(x):
              # Replace the next line with your own.
              return x

          x = np.array([3.0, -1.0, 2.0, -5.0])
          print(relu(x), x)
        solution: |
          import numpy as np

          def relu(x):
              out = x.copy()
              out[out < 0] = 0
              return out

          x = np.array([3.0, -1.0, 2.0, -5.0])
          print(relu(x), x)
        tests: |
          import numpy as _np
          _x = _np.array([3.0, -1.0, 2.0, -5.0])
          _r = relu(_x)
          assert isinstance(_r, _np.ndarray), "relu must return a NumPy array"
          assert _r.tolist() == [3.0, 0.0, 2.0, 0.0], "The negative entries of [3, -1, 2, -5] become 0"
          assert _x.tolist() == [3.0, -1.0, 2.0, -5.0], "The array passed in must not be changed"
          assert not _np.shares_memory(_r, _x), "The result must have a block of its own"
          _t = _np.array([[-1.0, 2.0], [0.5, -0.5]])
          assert relu(_t).tolist() == [[0.0, 2.0], [0.5, 0.0]], "A table keeps its shape, with its negative entries set to 0"
          assert _t.tolist() == [[-1.0, 2.0], [0.5, -0.5]], "A table passed in must not be changed"
          assert relu(_np.array([1.0, 2.0])).tolist() == [1.0, 2.0], "An array with no negative entries comes back equal"
          assert relu(_np.array([-4.0])).tolist() == [0.0], "A single negative entry becomes 0"
          assert relu(_np.array([-2, 5, -7])).tolist() == [0, 5, 0], "Whole numbers work too"
          assert output.strip() == "[3. 0. 2. 0.] [ 3. -1.  2. -5.]", "The program should print [3. 0. 2. 0.] [ 3. -1.  2. -5.]"
        wrong:
          - |
            import numpy as np

            def relu(x):
                x[x < 0] = 0
                return x

            print("[3. 0. 2. 0.] [ 3. -1.  2. -5.]")
          - |
            import numpy as np

            def relu(x):
                out = x
                out[out < 0] = 0
                return out

            print("[3. 0. 2. 0.] [ 3. -1.  2. -5.]")
          - |
            import numpy as np

            def relu(x):
                out = x[:]
                out[out < 0] = 0
                return out

            print("[3. 0. 2. 0.] [ 3. -1.  2. -5.]")
          - |
            import numpy as np

            def relu(x):
                return x[x > 0]

            print("[3. 0. 2. 0.] [ 3. -1.  2. -5.]")
          - |
            import numpy as np

            def relu(x):
                out = x.copy()
                out[out > 0] = 0
                return out

            print("[3. 0. 2. 0.] [ 3. -1.  2. -5.]")
          - |
            import numpy as np

            def relu(x):
                out = x.copy()
                out[out < 0] = -out[out < 0]
                return out

            print("[3. 0. 2. 0.] [ 3. -1.  2. -5.]")
        explanation: |
          Copy first, then write into the copy through a mask. The order matters, and so does the word `copy`. Writing `out = x` gives the same array a second name, and `out = x[:]`, which for a list would make a copy, makes a **view** for an array. In both cases the assignment through the mask lands in the caller's block, and a function that was asked for a result has silently changed its input. For a list the slice was a safe idiom. For an array it is the trap of the puzzle. Selecting `x[x > 0]` avoids the trap and gives the wrong thing: a shorter array with the negative entries missing, where the rectifier must keep every position and put a zero there. The function works for any shape because a mask has the shape of the array it came from.
        hints:
          - Make an independent array with x.copy().
          - A mask on the left of an assignment writes at the True places.
          - Is x[:] a copy, for an array?
    - question:
        id: fix-pick
        type: code
        mode: find-bug
        system: s2
        prompt: |
          Each row of the table `P` holds the probabilities a model gave to the classes for one example, and `y[k]` is the correct class of example `k`. `pick(P, y)` should return, for each example, the probability its row gave to **its own** correct class: one number for each row. For the two rows below and `y = [0, 1]` it should print `[0.7 0.8]`. It prints a 2 by 2 table. Fix it.
        starter: |
          import numpy as np

          def pick(P, y):
              return P[:, y]

          P = np.array([[0.7, 0.2, 0.1], [0.1, 0.8, 0.1]])
          print(pick(P, np.array([0, 1])))
        solution: |
          import numpy as np

          def pick(P, y):
              return P[np.arange(len(y)), y]

          P = np.array([[0.7, 0.2, 0.1], [0.1, 0.8, 0.1]])
          print(pick(P, np.array([0, 1])))
        tests: |
          import numpy as _np
          _P = _np.array([[0.7, 0.2, 0.1], [0.1, 0.8, 0.1]])
          assert pick(_P, _np.array([0, 1])).tolist() == [0.7, 0.8], "Row 0 gave 0.7 to class 0 and row 1 gave 0.8 to class 1"
          assert pick(_P, _np.array([2, 0])).tolist() == [0.1, 0.1], "Row 0 gave 0.1 to class 2 and row 1 gave 0.1 to class 0"
          assert pick(_P, _np.array([1, 1])).tolist() == [0.2, 0.8], "Row 0 gave 0.2 to class 1 and row 1 gave 0.8 to class 1"
          _Q = _np.array([[0.1, 0.9], [0.6, 0.4], [0.5, 0.5], [0.2, 0.8]])
          assert pick(_Q, _np.array([1, 0, 1, 0])).tolist() == [0.9, 0.6, 0.5, 0.2], "Four examples and two classes give four numbers"
          assert pick(_Q, _np.array([0, 0, 0, 0])).tolist() == [0.1, 0.6, 0.5, 0.2], "With every correct class 0 the result is the first column"
          assert pick(_Q, _np.array([1, 0, 1, 0])).shape == (4,), "The result has one number for each example"
          assert output.strip() == "[0.7 0.8]", "The program should print [0.7 0.8]"
        wrong:
          - |
            import numpy as np

            def pick(P, y):
                return P[:, y]

            print("[0.7 0.8]")
          - |
            import numpy as np

            def pick(P, y):
                return P[y, np.arange(len(y))]

            print("[0.7 0.8]")
          - |
            import numpy as np

            def pick(P, y):
                return P[:, y][0]

            print("[0.7 0.8]")
          - |
            import numpy as np

            def pick(P, y):
                return P.max(axis=1)

            P = np.array([[0.7, 0.2, 0.1], [0.1, 0.8, 0.1]])
            print(pick(P, np.array([0, 1])))
          - |
            import numpy as np

            def pick(P, y):
                return P[np.arange(len(y)), y[0]]

            print("[0.7 0.8]")
        explanation: |
          `P[:, y]` says: all rows, and the columns listed in `y`. For two examples that is a table of 2 rows and 2 columns, every row with every listed column, which is not what was asked. The task pairs each row with one column: row 0 with `y[0]`, row 1 with `y[1]`. Pairing is what two arrays of positions do, so the rows must be named by an array as well: `np.arange(len(y))` is 0, 1, 2 and so on, and `P[np.arange(len(y)), y]` takes the entries at (0, `y[0]`), (1, `y[1]`) and so on. This expression is at the centre of training a classifier. The loss of a model on an example is found from the probability it gave to the correct class, and this is how those probabilities are gathered for a whole block of examples at once. Taking the largest entry of each row would give the right numbers whenever the model happened to be right, and would hide every mistake it made.
        hints:
          - What shape does the result have, and what shape should it have?
          - A colon takes every row with every listed column. The task needs one column for each row.
          - Two arrays of positions are paired up. Which array names the rows 0, 1, 2 and so on?
    - question:
        id: work-keep
        type: choice
        system: s2
        prompt: |
          For the table `a` of 4 rows and 6 columns, `a[:, 0]` and `a[:, 0:1]` hold the same four numbers. In what do they differ, and when does it matter?
        options:
          - "They do not differ."
          - "`a[:, 0]` has shape `(4,)`, because the whole number removed axis 1. `a[:, 0:1]` has shape `(4, 1)`, because the slice kept it. The second is still a table with one column, which is what code expecting two axes needs."
          - "`a[:, 0]` is a copy and `a[:, 0:1]` is a view."
          - "`a[:, 0:1]` has shape `(1, 4)`."
        answer: 1
        explanation: |
          Both are views of the same four places in the block. The whole-number index asks for one position along axis 1, leaving nothing to count on that axis, so the axis goes. The slice asks for a range of positions, which happens to contain one, and the axis stays with length 1. Code written for tables, such as a function that reads `X.shape[1]` to find the number of features, or the `to_array` check of the last lesson, fails on the first and works on the second. And the next lesson will show that the two behave differently when combined with another array. When a selection of one row or one column must stay a table, use a slice of length 1.
        hints:
          - What does a whole-number index do to its axis?
          - What does a slice do to its axis, even when it selects one position?
          - Which of the two results still has two axes?
    - question:
        id: work-cost
        type: choice
        system: s2
        prompt: |
          `X` is a `float64` table of 1 000 000 rows and 100 columns, 800 megabytes. A program computes `train = X[:800000]` and `test = X[800000:]`. About how much more memory is used?
        options:
          - "800 megabytes, since both parts are new arrays"
          - "640 megabytes for the first part and 160 for the second"
          - "Almost none. Both are views, each a small description pointing into the block of `X`"
          - "It depends on the values in the table"
        answer: 2
        explanation: |
          Each slice is a start, a shape and a step over the block that already exists, a few dozen bytes whatever the size of the table. That is the point of the design. The other side of it is that `train` and `test` are windows onto `X`. If a later step rescales `train` in place, by assigning to a slice of it, the rows of `X` change too, and anything else that views them. When a part of the data must be changed without touching the original, that is the moment to pay for a copy.
        hints:
          - Is a slice a view or a copy?
          - What does a view store?
          - Does the size of the selected part matter?
    - question:
        id: work-lookup
        type: choice
        system: s2
        prompt: |
          A model holds a table `E` of shape `(50000, 768)`, one row for each word piece. A sentence has been turned into `ids`, an array of 12 whole numbers. What is the shape of `E[ids]`, and does it share memory with `E`?
        options:
          - "`(12,)`, a view"
          - "`(12, 768)`, a copy: one row of `E` for each of the 12 positions, gathered into a new block"
          - "`(50000, 12)`, a view"
          - "`(768,)`, a copy"
        answer: 1
        explanation: |
          An array of positions used as the first index takes those rows, in order, with repeats if a word piece occurs twice. Axis 0 of the result has the length of `ids`, 12, and axis 1 is untouched at 768. The rows asked for are scattered through the table and may repeat, so no start and step can describe them, and they are copied. That copy is the input to the rest of the model: a table with one vector for each position of the sentence. Changing it does not change `E`. To change the rows of `E` themselves, as training does, the index goes on the left of an assignment.
        hints:
          - One row is taken for each position in ids.
          - How long is one row of E?
          - Are the chosen rows evenly spaced in the block?
    - question:
        id: work-chain
        type: choice
        system: s2
        prompt: |
          `a` is a table whose entry in row 0, column 0 is 0. What does `a[0, 0]` hold after each of these two lines, run separately on a fresh `a`?

          ```python
          a[0:2][0, 0] = 99
          a[[0, 1]][0, 0] = 99
          ```
        options:
          - "99 after either line"
          - "0 after either line"
          - "99 after the first, since `a[0:2]` is a view and the write lands in the block of `a`. 0 after the second, since `a[[0, 1]]` is a copy, the write lands in the copy, and the copy is then thrown away."
          - "0 after the first and 99 after the second"
        answer: 2
        explanation: |
          Each line does two things in turn: it first evaluates the part before the second pair of brackets, and then assigns into the result. In the first line that result is a slice, a view, so the assignment goes through to `a`. In the second it is a selection by a list of positions, a fresh copy of rows 0 and 1, so the assignment changes the copy, which nothing refers to afterwards. The two lines hold the same rows and look nearly identical, and one of them does nothing. The safe form is a single index expression on the left: `a[0, 0] = 99`, or `a[[0, 1], 0] = 99` to set the first entry of both rows.
        hints:
          - Each line first builds the part before the second pair of brackets.
          - Is a[0:2] a view or a copy? Is a[[0, 1]] a view or a copy?
          - Where does a write to a copy go?
  connections:
    - text: |
        A slice of a list was a new list, and a slice of an array turned out to be a window onto the old array. The reason was in the last lesson: an array is a block with a rule for reading it, as [[e5.arrays-dtype-and-shape]] set out, and any slice can be described by a new rule over the same block. So a slice copies nothing, costs the same at any size, and passes every write through to the array it came from.

        One rule gives the shape of any index expression: a whole number removes its axis, and a slice keeps it. That is the difference between `a[:, 0]`, a plain list of four numbers, and `a[:, 0:1]`, a table with one column. A column, which the last cluster had to build with a comprehension, is `a[:, j]`.

        Selections that follow no regular pattern exist too. A mask, an array of True and False from a comparison, selects the entries that pass a test. An array of positions gathers entries or rows in any order, with repeats, and two such arrays pair up. Both copy what they select. Both write into the original when they stand on the left of an assignment. With them you wrote a rectifier in two lines and gathered each example's own probability from a table, two operations that every neural network performs.

        How a view really works, as a start place and a step for each axis, is the subject of [[e5.strides-and-memory-layout]], after [[e5.reshaping-views-and-copies]] has shown another way to read a block without moving it. And every loop you removed today by one index expression is an instance of [[e5.vectorisation]].

        There is one thing in this lesson that should have seemed odd, and you may have passed over it. `x < 0` compared an array of four numbers with a single number. `a[:, 1] = 7` wrote one number into four places. `u / 2` in the last lesson divided three entries by one. In each case two things of **different shapes** were combined, and NumPy quietly made the smaller one fit. It does this by a precise rule, which lets a column be added to every column of a table, a row be subtracted from every row, and a column and a row be combined into a whole table. That rule is the next lesson, [[e5.broadcasting]].
