    - question:
        id: work-count
        type: numeric
        system: s2
        prompt: |
          `A` has shape `(100, 200)` and `B` has shape `(200, 300)`. How many times does the line inside the loops of `np.einsum("ij,jk->ik", A, B)` run?
        answer: "6000000"
        explanation: |
          There is one loop for each distinct letter: `i` of length 100, `j` of length 200 and `k` of length 300. The line runs once for every combination, which is the product of the three lengths. The result holds only 100 × 300 entries, and each of those is a sum of 200 products. This is the same count you made for multiplying matrices by hand, read straight off the letters.
