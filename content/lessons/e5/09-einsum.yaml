concept: e5.einsum
minutes: 90
claim: You can read any `np.einsum` expression as a set of loops, one for each letter, say which letters are summed and what shape comes out, write the expression for a formula given with indices, recognise the dot product, the matrix products, the transpose, the trace, the outer product and the reductions as cases of it, and count the work an expression costs.
recalls: [e5.linear-algebra-routines]
uses: [m2.summation-and-product-notation, m5.matrix-multiplication-as-composition, m5.matrix-vector-product, m5.transpose, m4.dot-product, e5.axis-operations-and-reductions, e5.broadcasting, e5.vectorisation, e5.reshaping-views-and-copies, e5.arrays-dtype-and-shape, e1.complexity-and-big-o, e0.loops, e0.strings]
leads: [e5.random-number-generation]
starter: |
  # Scratch space. The dot product of each row of X with the matching row of Y, three ways.
  import time
  import numpy as np

  n, d = 1500, 200
  X = np.linspace(0.0, 1.0, n * d).reshape(n, d)
  Y = 1.0 - X

  start = time.perf_counter()
  one = np.diag(X @ Y.T)
  print("every row against every row, keep the diagonal", round((time.perf_counter() - start) * 1000, 1), "ms")

  start = time.perf_counter()
  two = (X * Y).sum(axis=1)
  print("multiply entry by entry, add along each row   ", round((time.perf_counter() - start) * 1000, 1), "ms")

  start = time.perf_counter()
  three = np.einsum("ij,ij->i", X, Y)
  print("einsum                                        ", round((time.perf_counter() - start) * 1000, 1), "ms")

  print(np.allclose(one, two), np.allclose(two, three))
parts:
  recall:
    - text: |
        [[e5.linear-algebra-routines]] ended on the product: `@` multiplies two things and sums over one shared index, and many sums in machine learning are not quite of that form. Three quick pulls first.
    - question:
        id: recall-shape
        type: choice
        system: s1
        concepts: [e5.linear-algebra-routines]
        prompt: |
          `A` has shape `(5, 3)` and `B` has shape `(3, 7)`. What is the shape of `A @ B`?
        options: ["`(5, 7)`", "`(3, 3)`", "`(7, 5)`", "It is an error"]
        answer: 0
        explanation: The inner lengths agree and disappear, and the outer lengths remain.
        hints:
          - The inner lengths must agree.
          - The outer lengths give the shape.
    - question:
        id: recall-sigma
        type: numeric
        system: s1
        concepts: [m2.summation-and-product-notation]
        prompt: |
          What is $\sum_{k=1}^{3} k^2$?
        answer: "14"
        explanation: 1 + 4 + 9.
        hints:
          - Let k take each value from 1 to 3 in turn.
          - Square each and add.
    - question:
        id: recall-entry
        type: choice
        system: s1
        concepts: [m5.matrix-multiplication-as-composition]
        prompt: |
          $C = AB$. Which formula gives the entry of $C$ in row $i$ and column $k$?
        options: ['$\sum_j A_{ij} B_{jk}$', '$\sum_j A_{ji} B_{kj}$', '$A_{ik} B_{ik}$', '$\sum_i A_{ij} B_{jk}$']
        answer: 0
        explanation: Row $i$ of $A$ against column $k$ of $B$. The shared index $j$ runs along both and is summed.
        hints:
          - It is a row of A against a column of B.
          - Which index runs along both and does not appear in the result?
  puzzle:
    - text: |
        Here is a job that turns up constantly. You have two tables of the same shape, `X` and `Y`, with one vector in each row, and you want the dot product of each row of `X` with the **matching** row of `Y`: row 0 with row 0, row 1 with row 1. For 1500 rows, that is 1500 numbers. The agreement of a prediction with its target, the similarity of a question to its own answer, the squared length of every row of a table: all are this job.

        The starter does it three ways.

        **The first** reaches for the tool of the last lesson. `X @ Y.T` is the table of the dot product of every row of `X` with every row of `Y`. The ones wanted are those where the two rows match, which lie on the diagonal, and `np.diag` picks the diagonal out.

        **The second** uses older tools: multiply the tables entry by entry, then add along each row.

        **The third** is one call with a small string of letters in it: `np.einsum("ij,ij->i", X, Y)`.

        Run it. The last line confirms that the three agree. Now look at the times. **The first way takes over a second. The second takes a few thousandths of a second. The third takes about one thousandth.** The first is a thousand times slower than the third.

        **What is the first way computing that the others are not? Why could `@`, on its own, not say what was wanted? And what is the language of that little string, in which the right thing could be said in eight characters?**
  intuition:
    - text: |
        The first question has a short answer. `X @ Y.T` has shape `(1500, 1500)`. It holds two and a quarter million dot products, each over 200 entries. Of those, 1500 are kept. **Fourteen hundred and ninety-nine out of every fifteen hundred dot products were computed and thrown away.**

        And `@` could not help it. `@` knows one pattern: rows of the left against columns of the right, every one against every other. "Only the matching ones" is not something it has a way to express.

        So think about what you would do with no library at all. You would write the loops.

        ```python
        out = np.zeros(n)
        for i in range(n):
            for j in range(d):
                out[i] += X[i, j] * Y[i, j]
        ```

        There is nothing here to misread. The entry of `X` at $[i, j]$ meets the entry of `Y` at the same $[i, j]$. The products are added into place $i$ of the result. In the notation of sums,

        $$\text{out}_i = \sum_j X_{ij}\, Y_{ij}.$$

        Now look at that formula and at the string in the starter, side by side.

        $$\text{out}_i = \sum_j X_{ij}\, Y_{ij} \qquad\qquad \texttt{"ij,ij->i"}$$

        The string **is** the formula, with everything but the indices rubbed out. Before the arrow, separated by a comma, are the indices of the two inputs: `ij` for `X`, `ij` for `Y`. After the arrow are the indices of the result: `i`. The index `j` appears before the arrow and not after it, and that is exactly the index the formula sums over.

        `np.einsum` takes such a string and the arrays, and runs the loops the string describes, in compiled code. You say **what** is to be multiplied and added, by naming the axes. It works out **how**.

        The name comes from Albert Einstein. Writing out the equations of general relativity, which are thick with sums over indices, he noticed that every summed index appeared exactly twice and every index that appeared twice was summed. So he stopped writing the $\Sigma$ signs. An index that is repeated and does not appear in the result is summed, and that is all there is to it. "Einsum" is short for Einstein summation.

        The figure shows a few expressions with their inputs and their results. Step through them. For each, find the letters after the arrow, which are the axes of the result, and the letters that have vanished, which have been summed.
    - figure: einsum
      props: { code: "ij,jk->ik" }
    - text: |
        The one in front of you first is `"ij,jk->ik"`. Read it as loops. There are three letters, so three loops, over `i`, `j` and `k`. Inside, the entry of the first input at $[i, j]$ is multiplied by the entry of the second at $[j, k]$, and added into the result at $[i, k]$. The letter `j` has vanished, so it is summed:

        $$C_{ik} = \sum_j A_{ij} B_{jk}.$$

        You answered that formula in the recall. It is the matrix product. So `@` is one einsum expression among many, the one where the last axis of the left and the first axis of the right share a letter.

        Change the letters and you change the computation, with no new function to learn.

        - `"ij,ij->i"`: both inputs share **both** letters. Matching entries meet. That is the puzzle.
        - `"ij,j->i"`: a table and a plain array sharing `j`. A matrix times a vector.
        - `"ij->ji"`: one input, nothing summed, the letters exchanged. The transpose.
        - `"ij->i"`: one input, `j` vanished. The sum along axis 1.

        Each of those you have met as a separate tool with its own name and its own rules about shape. Here they are one tool. That is the worth of the notation: it does not add a capability so much as show that a dozen things you knew are the same thing.
    - figure: einsum
      props: { code: "i,j->ij" }
    - text: |
        This one is new. `"i,j->ij"`: two plain arrays that share **no** letter, and both letters kept. Nothing is summed. Two loops, and the result at $[i, j]$ is $u_i v_j$: every entry of the first times every entry of the second, laid out as a table. It is called the **outer product**, and you have in fact made it before, by broadcasting a column against a row. When a network learns, the change it makes to a table of weights is very often an outer product, of what came in with how wrong the result was.

        So sharing a letter means "walk these axes together", and not sharing one means "take every combination". Keeping a letter means "this is an axis of the result", and dropping one means "add up along it". Four choices, and every expression is made of them.
  derivation:
    - text: |
        **The rule, exactly.** An einsum expression is a string of the form `"letters,letters->letters"`, with one group of letters for each input, separated by commas, and one group for the result.

        1. **Each group has one letter for each axis** of its array, in order. `"ij"` describes a table and calls its axes `i` and `j`. The letters themselves are free: `"ab,bc->ac"` is the same expression as `"ij,jk->ik"`.

        2. **A letter always stands for one length.** If a letter appears in two places, those two axes must have the same length, and they are walked **together**: the same value of the letter indexes both.

        3. **The loops.** There is one loop for each **distinct** letter. Inside, one entry of each input, the one at its letters' current values, are multiplied together.

        4. **The result.** The product is added into the result at the place given by the letters after the arrow. A letter that does not appear after the arrow is therefore **summed over**. The order of the letters after the arrow is the order of the axes of the result.

        As code, for `"ij,jk->ik"`:

        ```python
        C = np.zeros((I, K))
        for i in range(I):
            for j in range(J):
                for k in range(K):
                    C[i, k] += A[i, j] * B[j, k]
        ```

        Every einsum expression is a block of loops like that one, with a single line inside. To read an expression, write that line.

        **The cases you know.** Here are the tools of this cluster, and of the matrix cluster, as expressions.

        | expression | the line inside the loops | also known as |
        |---|---|---|
        | `"i,i->"` | `out += u[i] * v[i]` | `u @ v`, the dot product |
        | `"ij,j->i"` | `out[i] += A[i, j] * x[j]` | `A @ x` |
        | `"ij,jk->ik"` | `out[i, k] += A[i, j] * B[j, k]` | `A @ B` |
        | `"ij->ji"` | `out[j, i] += A[i, j]` | `A.T` |
        | `"ij->j"` | `out[j] += A[i, j]` | `A.sum(axis=0)` |
        | `"ij->"` | `out += A[i, j]` | `A.sum()` |
        | `"i,j->ij"` | `out[i, j] += u[i] * v[j]` | the outer product |
        | `"ij,ij->i"` | `out[i] += A[i, j] * B[i, j]` | `(A * B).sum(axis=1)` |
        | `"ii->"` | `out += A[i, i]` | the trace, the sum of the diagonal |
        | `"ij,kj->ik"` | `out[i, k] += A[i, j] * B[k, j]` | `A @ B.T` |

        Two of these deserve a second look.

        `"ii->"` uses one letter **twice within one input**. By rule 2 both axes are walked together, so only the entries $[0, 0], [1, 1], \dots$ are visited: the diagonal. With the letter dropped they are added, which gives the **trace** of a square matrix, the sum of its diagonal entries, also available as `np.trace(A)`. With the letter kept, `"ii->i"` is the diagonal itself.

        `"ij,kj->ik"` shares the **last** axis of both inputs. That is every row of `A` dotted with every row of `B`, which with `@` needs a transpose to say. In einsum you say it by where you put the `j`.

        **Counting the work.** The loops tell you the cost at once: the number of times the inner line runs is the product of the lengths of all the distinct letters.

        - `"ij,jk->ik"` runs $I \times J \times K$ times.
        - `"ij,ij->i"` runs $I \times J$ times.

        Apply that to the puzzle. The first way, `X @ Y.T`, is `"ij,kj->ik"` with $I = K = 1500$ and $J = 200$: 450 million multiplications. The third way, `"ij,ij->i"`, is $1500 \times 200$: 300 thousand. The ratio is 1500, and the clock said about a thousand. The second way, `(X * Y).sum(axis=1)`, does the same 300 thousand multiplications as the third, and is a few times slower for a reason you met in the vectorisation lesson: it first builds the whole table `X * Y` in memory, 300 thousand numbers, and then reads it again to add. The einsum adds as it goes and builds nothing.
    - question:
        id: derivation-trace
        type: choice
        system: s2
        prompt: |
          `M` and `N` are square tables of shape `(300, 300)`. `np.trace(M @ N)` and `np.einsum("ij,ji->", M, N)` return the same number, and the einsum is about fifty times faster. Why are they equal, and why the difference in speed?
        options:
          - "They are equal by coincidence for square tables, and einsum is faster because it is newer."
          - "The entry $[i, i]$ of the product is $\\sum_j M_{ij} N_{ji}$, and the trace adds those over $i$, which is the sum of $M_{ij} N_{ji}$ over both letters: the einsum, with $300 \\times 300$ steps. `M @ N` computes all $300 \\times 300$ entries of the product, each a sum of 300 terms, and all but the 300 on the diagonal are thrown away."
          - "The einsum skips the off-diagonal entries of `M`."
          - "`np.trace` copies the product before adding its diagonal."
        answer: 1
        explanation: |
          Write the line inside the loops. For `"ij,ji->"` it is `out += M[i, j] * N[j, i]`, over two letters: 90 thousand steps. The product `M @ N` has three letters, 27 million steps, to fill a table of which only the diagonal is wanted. Every entry of `M` and of `N` is used by both, so nothing is skipped in the inputs. What is skipped is the computing of results nobody asked for. The pattern is the same as in the puzzle: with `@` you had to make the whole table and then select from it, and in einsum you describe only the entries you want.
        hints:
          - What is the formula for the entry of the product at [i, i]?
          - What does the trace do with those entries?
          - How many letters does each computation loop over?
    - text: |
        **Stacks.** Add a letter to stand for the stack and keep it after the arrow. For `S` of shape `(b, m, n)` and `T` of shape `(b, n, p)`,

        ```python
        np.einsum("bij,bjk->bik", S, T)
        ```

        is the product of each matrix of `S` with the matching matrix of `T`. The letter `b` is shared, so the two stacks are walked together, and it is kept, so the result is a stack. `j` is shared and dropped, so it is summed.

        This is where einsum pays best. In real models the arrays have three and four axes, a batch of examples, a sequence of positions, a set of features, and the question is always which axes are matched, which are combined, and which are summed. With `@`, transposes and reshapes, the answer is spread across several lines and hidden in axis numbers. In einsum it is in one string, and the names can be chosen to mean something: `"bqd,bkd->bqk"` scores every **q**uery against every **k**ey over their **d** features, within each example of the **b**atch.

        **More than two inputs.** The rule is unchanged. `np.einsum("i,ij,j->", x, A, y)` has the line `out += x[i] * A[i, j] * y[j]`, which is the single number $\mathbf{x}^{\mathsf T} A\, \mathbf{y}$.

        One caution. With three or more inputs, running the loops as written can be wasteful. `"ij,jk,kl->il"`, a product of three matrices, has four letters, so $n^4$ steps as written, where two matrix products one after the other take $2n^3$. Passing `optimize=True` tells einsum to look for such an order and use it.

        **When to use it, and when not.** For a plain matrix product, write `@`. It says what it is, and it is handed to a routine tuned over decades for exactly that. For a plain sum along an axis, write `.sum(axis=...)`. Reach for einsum when the thing you mean is **not** one of the named tools: matching rows, an awkward order of axes, a diagonal of something you would rather not build, three things multiplied at once. Its strength is that the expression is the documentation.

        **Writing an expression from a formula.** Always the same steps. Write the formula with indices. Give each input its letters in the order of its axes. Use the same letter wherever the formula uses the same index. After the arrow, put the indices of the left-hand side of the formula, in order. Then check: every letter after the arrow appears before it, and the lengths that share a letter agree.

        Always write the arrow. If you leave it out, einsum guesses the result: the letters that appear exactly once, in alphabetical order. That is a rule to forget and a bug in waiting.
    - question:
        id: order-write
        type: order
        system: s2
        prompt: Put in order the steps for turning a formula such as $s_b = \sum_i \sum_j x_{bi} A_{ij} x_{bj}$ into an einsum call.
        steps:
          - 'Write the formula with every index shown.'
          - 'For each input, list its letters in the order of its own axes: `bi`, `ij`, `bj`.'
          - 'Join the groups with commas.'
          - 'After the arrow, put the indices of the left-hand side, in order: `b`.'
          - 'Check that every letter dropped is one the formula sums over, and that axes sharing a letter have the same length.'
          - 'Call `np.einsum` with the string and the arrays in the same order as the groups.'
        explanation: The string is copied off the formula, input by input, so the formula comes first. The groups must exist before they can be joined, and the result letters are read off the left-hand side. The check comes before the call, since an expression with a wrong letter often still runs and returns something of a plausible shape. Here the result is `"bi,ij,bj->b"`, in which `i` and `j` are summed and `b` is kept.
        hints:
          - The string is read off the formula, so the formula comes first.
          - The inputs are described before the result.
          - Check before you call.
  formal:
    - text: |
        **Expression.** `np.einsum("g1,g2,...->r", A1, A2, ...)`, where each group $g_m$ has one letter for each axis of $A_m$, and $r$ lists letters that occur among the groups, each at most once.

        **Lengths.** Every letter has one length. All axes labelled with a letter must have that length.

        **Meaning.** For each assignment of a value to every distinct letter, take the entry of each input at the values of its letters, and multiply them. The entry of the result at the values of the letters of $r$ is the sum of those products over all values of the letters not in $r$.

        **Shape.** The result has one axis for each letter of $r$, in order, with that letter's length.

        **Cost.** Carried out directly, the number of products is the product of the lengths of all distinct letters.

        **Diagonal.** A letter repeated within one group restricts that input to the entries where those axes have equal index.
  drill:
    - text: |
        Seconds each. For every expression, say the line that sits inside the loops.
    - question:
        id: drill-matvec
        type: choice
        system: s1
        prompt: |
          What is `np.einsum("ij,j->i", A, x)`?
        options: ["The matrix `A` times the vector `x`", "The transpose of `A`", "The dot product of two vectors", "The outer product"]
        answer: 0
        explanation: The line is `out[i] += A[i, j] * x[j]`, each row of the table against the vector.
        hints:
          - Which letter is shared and dropped?
          - The result has one entry for each row of A.
    - question:
        id: drill-transpose
        type: choice
        system: s1
        prompt: |
          What is `np.einsum("ij->ji", A)`?
        options: ["The sum of all entries", "The transpose of `A`", "The diagonal of `A`", "`A` itself"]
        answer: 1
        explanation: Nothing is dropped, so nothing is summed. The entry at $[i, j]$ goes to $[j, i]$.
        hints:
          - Is any letter missing after the arrow?
          - The two letters have changed places.
    - question:
        id: drill-dot
        type: choice
        system: s1
        prompt: |
          What is `np.einsum("i,i->", u, v)`?
        options: ["The outer product", "The entry-by-entry product", "The dot product, a single number", "An error, since nothing follows the arrow"]
        answer: 2
        explanation: The shared letter walks both arrays together, and it is dropped, so the products are all added.
        hints:
          - No letter follows the arrow, so the result has no axes.
          - Matching entries are multiplied and all are added.
    - question:
        id: drill-sum-shape
        type: choice
        system: s1
        prompt: |
          `A` has shape `(2, 3)`. What is the shape of `np.einsum("ij->j", A)`?
        options: ["`(2,)`", "`(3,)`", "`(2, 3)`", "`()`"]
        answer: 1
        explanation: The result has the one axis `j`, of length 3. The letter `i` was dropped, so the rows are added together.
        hints:
          - Which letter follows the arrow?
          - What is the length of that axis of A?
    - question:
        id: drill-outer-shape
        type: choice
        system: s1
        prompt: |
          `u` has 3 entries and `v` has 4. What is the shape of `np.einsum("i,j->ij", u, v)`?
        options: ["`(3, 4)`", "`(4, 3)`", "`(7,)`", "`()`"]
        answer: 0
        explanation: Both letters are kept, in the order `i` then `j`, with lengths 3 and 4.
        hints:
          - Which letters follow the arrow, and in which order?
          - Each letter brings its own length.
    - question:
        id: drill-summed
        type: choice
        system: s1
        prompt: |
          In `"ij,jk->ik"`, which letter is summed over?
        options: ["`i`", "`j`", "`k`", "None of them"]
        answer: 1
        explanation: It appears before the arrow and not after it.
        hints:
          - Which letter is missing after the arrow?
          - A dropped letter is summed.
    - question:
        id: drill-trace
        type: choice
        system: s1
        prompt: |
          `A` is a square table. What is `np.einsum("ii->", A)`?
        options: ["The sum of all entries", "The sum of the diagonal entries, the trace", "The diagonal as an array", "The determinant"]
        answer: 1
        explanation: One letter for both axes visits only the entries where the two indices are equal, and dropping it adds them.
        hints:
          - Both axes carry the same letter, so they are walked together.
          - Which entries have the same row and column number?
    - question:
        id: drill-product-shape
        type: choice
        system: s1
        prompt: |
          `A` has shape `(2, 3)` and `B` has shape `(3, 4)`. What is the shape of `np.einsum("ij,jk->ik", A, B)`?
        options: ["`(2, 4)`", "`(2, 3, 4)`", "`(3,)`", "`(4, 2)`"]
        answer: 0
        explanation: The result has axes `i` and `k`, of lengths 2 and 4.
        hints:
          - Which letters follow the arrow?
          - Read their lengths off the inputs.
    - question:
        id: drill-dot-value
        type: numeric
        system: s1
        prompt: |
          `u = np.array([1.0, 2.0, 3.0])` and `v = np.array([4.0, 5.0, 6.0])`. What is `np.einsum("i,i->", u, v)`?
        answer: "32"
        explanation: 1 × 4 + 2 × 5 + 3 × 6.
        hints:
          - Matching entries are multiplied.
          - The three products are added.
    - question:
        id: drill-total
        type: numeric
        system: s1
        prompt: |
          What is `np.einsum("ij->", np.ones((3, 4)))`?
        answer: "12"
        explanation: Both letters are dropped, so all twelve entries, each 1, are added.
        hints:
          - No letter follows the arrow.
          - How many entries does the table have?
    - question:
        id: drill-rows
        type: choice
        system: s1
        prompt: |
          `A` and `B` have the same shape. What is `np.einsum("ij,ij->i", A, B)`?
        options: ["The matrix product of `A` and `B`", "The dot product of each row of `A` with the matching row of `B`", "The dot product of each column of `A` with the matching column of `B`", "The entry-by-entry product"]
        answer: 1
        explanation: Matching entries are multiplied, and `j`, which runs along a row, is summed. One number is left for each row.
        hints:
          - Both inputs share both letters, so matching entries meet.
          - Which letter is dropped, and along what does it run?
    - question:
        id: drill-stack
        type: choice
        system: s1
        prompt: |
          `S` has shape `(10, 2, 3)` and `T` has shape `(10, 3, 4)`. What is the shape of `np.einsum("bij,bjk->bik", S, T)`?
        options: ["`(10, 2, 4)`", "`(2, 4)`", "`(10, 10, 2, 4)`", "`(10, 2, 3, 4)`"]
        answer: 0
        explanation: The letters `b`, `i` and `k` are kept, with lengths 10, 2 and 4. It is ten matrix products.
        hints:
          - Which letters follow the arrow?
          - The letter b is shared, so the two stacks are walked together.
    - question:
        id: drill-rows-against-rows
        type: choice
        system: s1
        prompt: |
          Which expression with `@` equals `np.einsum("ij,kj->ik", A, B)`?
        options: ["`A @ B`", "`A @ B.T`", "`A.T @ B`", "`A * B`"]
        answer: 1
        explanation: The shared letter is the last axis of both, so rows of `A` meet rows of `B`. With `@` the second must be transposed for its rows to stand as columns.
        hints:
          - Which axis of B carries the shared letter?
          - The matrix product needs the shared letter first in its second input.
    - question:
        id: drill-steps
        type: numeric
        system: s1
        prompt: |
          `A` and `B` have shape `(5, 6)`. How many times does the line inside the loops of `"ij,ij->i"` run?
        answer: "30"
        explanation: There are two distinct letters, of lengths 5 and 6, and one loop for each.
        hints:
