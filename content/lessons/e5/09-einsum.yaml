    - question:
        id: work-read
        type: choice
        system: s2
        prompt: |
          `P` has shape `(n, c)`, one row of predicted probabilities for each example, and `T` has the same shape, with a single 1 in each row marking the correct class and 0 elsewhere. What does `np.einsum("nc,nc->n", P, T)` return?
        options:
          - "The matrix product of `P` and `T`."
          - "For each example, the probability the model gave to the correct class: the row of `P` dotted with the matching row of `T`, in which the single 1 picks out one entry."
          - "The total of all the probabilities."
          - "For each class, the number of examples that belong to it."
        answer: 1
        explanation: |
          The line inside the loops is `out[n] += P[n, c] * T[n, c]`. Both inputs share both letters, so matching entries meet, and `c` is dropped, so the products are added along each row. In each row of `T` every entry but one is 0, so the sum has a single surviving term, the entry of `P` in the correct column. You have computed this before as `P[np.arange(n), y]`, with the correct classes held as an array of positions. Here they are held as rows of 0s and a 1, and the dot product does the picking. The two are the same selection written in two ways, and you will see both in real code.
        hints:
          - Write the line that sits inside the loops.
          - Which letter is dropped, and along what does it run?
          - What does multiplying by a row with a single 1 do to a row of numbers?
    - question:
        id: work-three
        type: choice
        system: s2
        prompt: |
          `A`, `B` and `C` are square tables with 500 rows. Run as written, `np.einsum("ij,jk,kl->il", A, B, C)` is far slower than `A @ B @ C`. Why, and what is the remedy within einsum?
        options:
          - "einsum cannot multiply three tables."
          - "As written the expression has four distinct letters, so the line inside the loops runs $500^4$ times. Two matrix products one after the other have three letters each, $2 \\times 500^3$ steps, which is 250 times fewer. Passing `optimize=True` lets einsum find and use such an order."
          - "The letters `k` and `l` look alike and confuse it."
          - "The result is of a different shape."
        answer: 1
        explanation: |
          The count of work is the product of the lengths of the distinct letters, and here there are four. But the sum can be done in stages: first sum over `j` to make a table with letters `i` and `k`, then sum over `k`. Each stage has three letters. The mathematics is the same, since a product of sums can be regrouped, and the cost falls from $n^4$ to $2n^3$. einsum does not regroup unless asked, so with three or more inputs, ask. This is your first sight of a fact that runs deep in numerical computing: the same expression can be evaluated in orders that differ enormously in cost, and choosing the order is a problem in its own right.
        hints:
          - How many distinct letters does the expression have?
          - How many letters does a single matrix product have?
          - Compare 500 to the fourth power with twice 500 cubed.
  connections:
    - text: |
        Three ways of taking the dot product of matching rows agreed, and one took a thousand times as long as another. `X @ Y.T` formed every row against every row and kept one in fifteen hundred. `@` has one pattern, and "only the matching ones" is not it.

        `np.einsum` takes the formula itself. Give every axis of every input a letter. A letter shared between inputs means those axes are walked together. A letter left out after the arrow is summed. The letters after the arrow are the axes of the result, in order. Behind any expression is a block of loops, one for each distinct letter, with a single line inside, and to read an expression is to write that line. The count of work is the product of the lengths of the distinct letters.

        Seen this way, much of what you have learned in this cluster and the one before is a single operation. The dot product is `"i,i->"`. A matrix times a vector is `"ij,j->i"`, and the product you met in [[e5.linear-algebra-routines]] is `"ij,jk->ik"`. The transpose is `"ij->ji"`, the reductions drop a letter, the outer product shares none, and the trace repeats one. For those, keep using their own names. Use einsum for what has no name: matching rows, stacks with axes in an awkward order, a diagonal of a product you would prefer not to build.

        There is one thing every array in this cluster has had in common, and you may not have noticed. They were all made with `arange`, `ones`, `linspace` or typed in by hand. They were tidy. Real data is not tidy, and neither is the starting point of a model: the weights of a network begin as **random** numbers, the examples are shown to it in a **random** order, and the experiments you ran in the lessons on timing would have meant more on data with no pattern in it. But a computer is a machine that does exactly what it is told, the same way every time. How does such a machine produce numbers that look like chance? And if they are chance, how can an experiment ever be repeated? That is the next lesson, [[e5.random-number-generation]].
