    - question:
        id: work-wrap
        type: choice
        system: s2
        prompt: |
          In an `int32` array, $100\,000 \times 100\,000$ comes out as $1\,410\,065\,408$. Where does that number come from?
        options:
          - "It is a random value left in memory."
          - "The true product $10^{10}$ needs more than 32 bits. Only the lowest 32 bits are kept, which amounts to subtracting $2^{32} = 4\\,294\\,967\\,296$ until the result fits: $10^{10} - 2 \\times 2^{32} = 1\\,410\\,065\\,408$."
          - "NumPy rounds large products to the nearest value it can store."
          - "The product was computed in float32 and lost precision."
        answer: 1
        explanation: |
          A 32-bit slot has $2^{32}$ patterns. Arithmetic that runs past the end wraps round, exactly as arithmetic on a clock does: the stored result is the true result reduced modulo $2^{32}$, read as a number between $-2^{31}$ and $2^{31} - 1$. Here two subtractions of $2^{32}$ bring $10^{10}$ into range. If the stored value had been "the nearest value that fits", it would have been $2\,147\,483\,647$, the largest `int32`, and the error would at least have been conspicuous. Wrapping gives values that look like ordinary data. A sum of squared errors computed in a small whole-number dtype can go negative this way, and a count of pixels in an 8-bit image can come out smaller than a count of half of them.
        hints:
          - How many different values can 32 bits show?
          - What happens to a counter that runs past its last value?
          - Subtract 2 to the power 32 from the true product until it is in range.
    - question:
        id: work-column
        type: choice
        system: s2
        prompt: |
          Three arrays hold the numbers 1, 2, 3: `p` has shape `(3,)`, `q` has shape `(1, 3)` and `r` has shape `(3, 1)`. Which statement is true?
        options:
          - "They are the same array, since they hold the same numbers."
          - "`p` has one axis and is neither a row nor a column. `q` is a table with one row. `r` is a table with one column. All three have size 3, and they differ in the number of axes or in which axis has length 3."
          - "`q` and `r` are the same, since both have two axes."
          - "`p` is a column, because vectors are columns."
        answer: 1
        explanation: |
          The blocks are identical: three numbers side by side. The shapes are not, and the shape decides how the array behaves in every operation that involves a second array. `p` has `ndim` 1. `q` and `r` have `ndim` 2, with the three entries laid along axis 1 in `q` and along axis 0 in `r`. In the mathematics of the last cluster a vector was written as a column without anyone asking, because nothing depended on it. In NumPy the question "one axis, a row, or a column?" always has an answer, and printing the shape is the way to find it. Most errors in array code are a shape that was not what its author believed.
        hints:
          - What is the number of axes of each?
          - For the two with two axes, which axis has length 3?
          - Does holding the same numbers make two arrays behave the same?
    - question:
        id: work-truncate
        type: choice
        system: s2
        prompt: |
          `b = np.array([1, 2, 3])` and then `b[0] = 7.9` leaves `b` as `[7 2 3]`. A colleague wants the array to hold 7.9. What should they do?
        options:
          - "Assign it twice."
          - "Nothing can be done, because arrays hold only whole numbers."
          - "Make the array a decimal type to begin with, for example `np.array([1, 2, 3], dtype=np.float64)`, or convert it with `b.astype(np.float64)`, and then assign."
          - "Use `b[0] = round(7.9)`."
        answer: 2
        explanation: |
          The dtype was fixed when the block was laid out. A list of whole numbers gave a whole-number array, and an assignment into an existing array converts the value to the array's type, never the array to the value's. So the type must be right before the assignment: stated when the array is made, or changed with `astype`, which builds a new block. Rounding would store 8, which is still not 7.9. This is the commonest way for the trap to be sprung: an array of zeros or of counts is made from whole numbers, and later a loop stores averages or probabilities into it, every one of which is silently cut down to 0 or 1.
        hints:
          - What is the dtype of b, and when was it decided?
          - Does assigning into an array change its dtype?
          - Which dtype can hold 7.9?
  connections:
    - text: |
        The same six numbers behaved in two ways. As a list of rows, `+` joined them. As an array, `+` added them, and the array refused to keep the 0.9 of a 7.9. Both came from one decision: every entry has the same type, and the raw values lie side by side in one block.

        That decision is the array. The **dtype** says what each entry is and how many bytes it takes. The **shape** says how the block is read, as a list, a table, or a stack of tables. With one type, the place of an entry is found by arithmetic, as in the arrays you studied before, the memory is the number of entries times the bytes for each, and an operation on the whole block is one loop in compiled code. So arithmetic operators act on whole arrays, entry by entry, and `@` is the matrix product you built by hand and proved things about, ending with [[m5.determinant]].

        The fixed type has a cost, and you saw both forms of it. A decimal stored into a whole-number array is cut off. A whole number too large for its slot wraps round without a word. Neither raises an error, so the defence is a habit: state the dtype, and ask how large the values can get.

        Everything in this cluster builds on the three parts. Stretching arrays of different shapes against each other is [[e5.broadcasting]]. Replacing Python loops by whole-array operations is [[e5.vectorisation]]. Reading one block with a different shape, and knowing when two arrays share a block, are [[e5.reshaping-views-and-copies]] and [[e5.strides-and-memory-layout]].

        But first, an array is not much use until you can get at its parts. The functions of the last cluster reached a row with `A[i]` and had to build a column with a comprehension, which is where the last bug of that cluster came from. An array reaches a row, a column, a block of rows and columns, or every second entry, each in one short expression, and it does so without copying a single number. That is the next lesson, [[e5.indexing-and-slicing]].
