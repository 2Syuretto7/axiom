    - question:
        id: write-table-bytes
        type: code
        mode: write
        system: s2
        prompt: |
          Before building a large array it is wise to know how much memory it will take. Write `table_bytes(shape, dtype)` to return the number of bytes in the block of an array with the given shape, a tuple, and the given dtype, **without building the array**.

          `np.dtype(dtype).itemsize` gives the number of bytes for one entry of a dtype. An empty shape `()` is a single number.
        starter: |
          import numpy as np

          def table_bytes(shape, dtype):
              # Replace the next line with your own.
              return 0

          print(table_bytes((50000, 768), np.float32))
        solution: |
          import numpy as np

          def table_bytes(shape, dtype):
              count = 1
              for length in shape:
                  count = count * length
              return count * np.dtype(dtype).itemsize

          print(table_bytes((50000, 768), np.float32))
        tests: |
          import numpy as _np
          assert table_bytes((50000, 768), _np.float32) == 153600000, "A table of 50000 by 768 float32 values takes 153600000 bytes"
          assert table_bytes((50000, 768), _np.float64) == 307200000, "The same table as float64 takes twice as much"
          assert table_bytes((10,), _np.float64) == 80, "Ten float64 values take 80 bytes"
          assert table_bytes((), _np.int64) == 8, "A single int64 takes 8 bytes"
          assert table_bytes((3, 4, 5), _np.int8) == 60, "Sixty int8 values take 60 bytes"
          assert table_bytes((2, 3), _np.bool_) == 6, "Six True or False values take 6 bytes"
          assert table_bytes((1000000, 1000000), _np.float64) == 8000000000000, "A million by a million float64 values would take 8 million million bytes, and must be counted without being built"
          assert table_bytes((7, 0), _np.float64) == 0, "A table with no columns has no entries"
          assert output.strip() == "153600000", "The program should print 153600000"
        wrong:
          - |
            import numpy as np

            def table_bytes(shape, dtype):
                count = 1
                for length in shape:
                    count = count * length
                return count

            print(153600000)
          - |
            import numpy as np

            def table_bytes(shape, dtype):
                count = 0
                for length in shape:
                    count = count + length
                return count * np.dtype(dtype).itemsize

            print(153600000)
          - |
            import numpy as np

            def table_bytes(shape, dtype):
                count = 1
                for length in shape:
                    count = count * length
                return count * 8

            print(153600000)
          - |
            import numpy as np

            def table_bytes(shape, dtype):
                if len(shape) == 0:
                    return 0
                count = 1
                for length in shape:
                    count = count * length
                return count * np.dtype(dtype).itemsize

            print(153600000)
          - |
            import numpy as np

            def table_bytes(shape, dtype):
                return shape[0] * shape[1] * np.dtype(dtype).itemsize

            print(153600000)
        explanation: |
          The number of entries is the product of the lengths of the axes, and the block takes that many times the bytes for one entry. Starting the product at 1 makes the empty shape come out right: no axes, one entry. The count is done in plain Python whole numbers, which cannot overflow, and that is deliberate. An array of a million by a million would need eight million million bytes, far more than any ordinary machine has, and the point of the function is to learn that from arithmetic, before asking for the memory. The table of the example, the word vectors of a mid-sized language model, takes about 154 megabytes as `float32`. Counts like this are made every day in machine learning, to decide whether a model fits on the machine that must run it.
        hints:
          - The number of entries is the product of the numbers in the shape.
          - Start the product at 1, so that an empty shape gives 1.
          - Multiply the number of entries by np.dtype(dtype).itemsize.
    - question:
        id: fix-squares
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `squares(values)` should return an array of the squares of a list of whole numbers, exactly, for values up to three thousand million. For `[3, 100000]` the second square should be 10000000000. The program prints `[         9 1410065408]`. Fix it, keeping the result an array of whole numbers.
        starter: |
          import numpy as np

          def squares(values):
              a = np.array(values, dtype=np.int32)
              return a * a

          print(squares([3, 100000]))
        solution: |
          import numpy as np

          def squares(values):
              a = np.array(values, dtype=np.int64)
              return a * a

          print(squares([3, 100000]))
        tests: |
          import numpy as _np
          _s = squares([3, 100000])
          assert isinstance(_s, _np.ndarray), "squares must return a NumPy array"
          assert _s.tolist() == [9, 10000000000], "The square of 100000 is 10000000000"
          assert squares([3000000001]).tolist() == [9000000006000000001], "The square of 3000000001 must be exact, digit for digit"
          assert squares([-100000]).tolist() == [10000000000], "The square of a negative number is positive"
          assert squares([0, 1, 2]).tolist() == [0, 1, 4], "Small numbers must still be squared"
          assert squares([46341]).tolist() == [2147488281], "The square of 46341 is 2147488281, just past the largest int32"
          assert _s.dtype == _np.int64, "The result should be an array of int64"
          assert output.strip() == "[          9 10000000000]", "The program should print [          9 10000000000]"
        wrong:
          - |
            import numpy as np

            def squares(values):
                a = np.array(values, dtype=np.int32)
                return a * a

            print("[          9 10000000000]")
          - |
            import numpy as np

            def squares(values):
                a = np.array(values, dtype=np.float64)
                return (a * a).astype(np.int64)

            print("[          9 10000000000]")
          - |
            import numpy as np

            def squares(values):
                a = np.array(values, dtype=np.int32)
                return (a * a).astype(np.int64)

            print("[          9 10000000000]")
          - |
            import numpy as np

            def squares(values):
                return [v * v for v in values]

            print("[          9 10000000000]")
          - |
            import numpy as np

            def squares(values):
                a = np.array(values, dtype=np.int64)
                return a * 2

            print("[          9 10000000000]")
        explanation: |
          The numbers going in were small enough for an `int32`. The numbers coming out were not. $100\,000^2 = 10^{10}$, and the largest `int32` is about $2.1 \times 10^9$, so the product wrapped round: $10^{10} - 2 \times 2^{32} = 1\,410\,065\,408$. No error was raised, and the wrong value is of a believable size. The repair is to give the array a dtype with room for the results, `int64`, which holds whole numbers up to about $9.2 \times 10^{18}$. Converting after the multiplication is too late, since the damage is done inside the `int32` product. Going through `float64` fails in a different way: a float keeps about 16 significant digits, and the square of 3000000001 has 19, so its last digits come back wrong. The habit to form is to ask, of every whole-number array, how large its values can become after the arithmetic, not before.
        hints:
          - What is the largest value an int32 can hold?
          - Is the square of 100000 larger than that?
          - Choose a whole-number dtype with more bits when the array is made.
    - question:
        id: work-embedding
        type: numeric
        system: s2
        prompt: |
          A model keeps a table of 50 000 rows and 768 columns of `float32` values. How many megabytes does the block take? Count a megabyte as $10^6$ bytes.
        answer: "153.6"
        explanation: |
          The table has $50\,000 \times 768 = 38\,400\,000$ entries, and a `float32` takes 4 bytes, so the block is $153\,600\,000$ bytes. As `float64` it would be twice that, and as a 16-bit type half. For a model with thousands of millions of weights, the choice of dtype is the difference between fitting on a machine and not fitting, which is why so much effort goes into running models with fewer bits for each weight.
