concept: e5.arrays-dtype-and-shape
minutes: 90
claim: You can explain what a NumPy array is, one block of numbers of one type with a shape laid over it, say why that design makes arithmetic on whole arrays possible and fast, create arrays and read their shape, number of axes, size, dtype and memory, predict what a dtype does to the values stored in it, including truncation and silent overflow, and choose a dtype on purpose.
recalls: [m5.determinant]
uses: [m5.matrix-vector-product, m5.matrices-as-linear-maps, e3.arrays-and-linked-lists, e1.special-methods-and-operator-overloading, e1.modules-and-imports, e1.exceptions, e1.complexity-and-big-o, e0.lists-and-tuples, e0.values-types-and-variables, e0.functions, m0.powers-and-roots, m0.estimation-and-orders-of-magnitude]
leads: [e5.indexing-and-slicing, e5.broadcasting, e5.vectorisation, e5.reshaping-views-and-copies, e5.strides-and-memory-layout]
starter: |
  # Scratch space. The same numbers, held two ways.
  import numpy as np

  rows = [[1, 2, 3], [4, 5, 6]]
  a = np.array(rows)

  print(rows + rows)
  print(a + a)

  print(rows * 2)
  print(a * 2)

  b = np.array([1, 2, 3])
  b[0] = 7.9
  print(b)
parts:
  recall:
    - text: |
        [[m5.determinant]] closed a cluster in which you wrote every matrix routine by hand, on lists of rows, and it ended with a complaint: a list of lists is a slow and awkward home for a matrix. Three quick pulls before meeting the better one.
  puzzle:
    - text: |
        Run the starter. The first line that matters is `import numpy as np`, which brings in a library called NumPy under the short name `np`. Then the same six numbers are held in two ways: as `rows`, the list of rows you have used throughout, and as `a`, which `np.array` builds from that list.

        The same operations are applied to both, and they do different things.

        - `rows + rows` is a list of **four** rows. The two lists were joined end to end.
        - `a + a` is a table of the same shape with every number **doubled**. The two tables were added entry by entry.
        - `rows * 2` is again four rows, the list repeated.
        - `a * 2` is again every number doubled.

        That is already worth a pause. For a matrix, `a + a` is what $A + A$ ought to mean. With lists you had to write a comprehension inside a comprehension to get it.

        Then comes a smaller and stranger thing. `b` is built from `[1, 2, 3]`, and its first entry is set to `7.9`. A list would simply hold 7.9. The array prints `[7 2 3]`. The 0.9 has gone, without an error and without a warning.

        **What is an array, that `+` adds its entries, and that it cannot hold 7.9? Both behaviours come from one design decision. What is it?**
  intuition:
    - text: |
        Think about what a Python list of numbers really is. You saw it when you studied arrays and linked lists: a list is a row of **references**. Each slot holds the address of an object stored somewhere else. The object might be a whole number, or a decimal, or a string, or another list. The list does not know and does not care. That freedom is why a list can hold `[1, "two", 3.0]`.

        The freedom has a price, paid on every operation. To add two lists of numbers entry by entry, Python must, for each position, follow a reference, ask the object what type it is, look up what `+` means for that type, do the addition, build a new object for the result, and store a reference to it. Five or six steps of bookkeeping surround one addition. And the numbers themselves are scattered over memory, each wrapped in its own object.

        Now make the opposite decision. **Every entry has the same type, fixed in advance, and the raw values are stored side by side in one block of memory, with no wrapping.** Nothing else is stored for each entry. Beside the block, keep two small notes: what the type of every entry is, and how the block is to be read as a table.

        That is a NumPy array. The type is its **dtype**. The reading as a table is its **shape**.

        Both surprises of the puzzle follow.

        Because every entry has the same known type, adding two arrays needs no questions asked along the way. It is one tight loop over two blocks of raw numbers, run by compiled code and not by the Python interpreter. So it is natural, and cheap, for `+` to mean "add entry by entry". The library made that choice for every arithmetic operator, by defining the special methods you met when you overloaded operators for your own classes.

        And because every entry has the same type, an array of whole numbers has no room for 7.9. Each slot is exactly big enough for one whole number of a fixed size. So the 7.9 is converted to the type of the array on its way in, and a whole number cannot keep the 0.9.

        The figure shows the other note, the shape. Twelve numbers sit in one block. The shape says how to read them: as one row of twelve, as three rows of four, as two slabs of three rows of two. Step through the shapes and watch the block. It does not change.
    - figure: array-shape
      props: { shape: 3x4, item: 6 }
    - text: |
        The place of an entry in the block is found by arithmetic. In a table of 3 rows and 4 columns, the entry in row 1 and column 2 is at place $1 \times 4 + 2 = 6$, counting from 0, because one whole row of 4 comes before it and then 2 more entries. This is the address arithmetic of an array, with one more multiplication, and it is why an array can reach any entry of a table in one step. It works only because every entry has the same size, which is one more reason for the single dtype.

        So an array is three things: **a block of raw values, a dtype that says what each value is, and a shape that says how the block is read.** The rest of this lesson is about the last two, and the rest of this cluster is about what the three together make possible.
  derivation:
    - text: |
        **Making arrays.** The plainest way is from a list, or a list of lists for a table.

        ```python
        import numpy as np

        v = np.array([1.5, 2.0, 3.5])
        A = np.array([[2, 1], [1, 2]])
        ```

        The rows must all have the same length. A table with rows of different lengths has no shape, and `np.array([[1, 2], [3]])` raises a `ValueError`.

        Often you want an array of a given shape before you have the numbers. NumPy has makers for the common cases.

        | call | result |
        |---|---|
        | `np.zeros((2, 3))` | 2 rows and 3 columns of 0.0 |
        | `np.ones(4)` | four 1.0s |
        | `np.full((2, 2), 7)` | a 2 by 2 table of 7s |
        | `np.eye(3)` | the 3 by 3 identity matrix |
        | `np.arange(5)` | 0, 1, 2, 3, 4, like `range` |
        | `np.linspace(0, 1, 5)` | 5 evenly spaced values from 0 to 1, both ends included |

        A shape with more than one axis is given as a tuple, which is why `np.zeros((2, 3))` has two pairs of brackets.

        **Reading an array.** Every array carries its description with it, as attributes.

        - `a.shape` is a tuple with the length of each axis. For the table of the puzzle it is `(2, 3)`: 2 rows, 3 columns.
        - `a.ndim` is the number of axes, the length of the shape. Here 2.
        - `a.size` is the number of entries, the product of the shape. Here 6.
        - `a.dtype` is the type of every entry.
        - `a.itemsize` is the number of bytes one entry takes, and `a.nbytes` is the number of bytes in the whole block, which is `size` times `itemsize`.

        **Shape, with care.** The shape is a tuple, and its length matters as much as its numbers. Three arrays can each hold the numbers 1, 2, 3 and all be different.

        - `np.array([1, 2, 3])` has shape `(3,)`. One axis. It is a plain list of three numbers, neither a row nor a column.
        - `np.array([[1, 2, 3]])` has shape `(1, 3)`. Two axes. It is a table with one row.
        - `np.array([[1], [2], [3]])` has shape `(3, 1)`. Two axes. It is a table with one column.

        The comma in `(3,)` is Python's way of writing a tuple with one item. Mistaking one of these three for another is the most common source of confusion in array code, and the lesson on stretching arrays against each other will depend on telling them apart.

        Arrays may have any number of axes. A batch of 32 pictures, each 28 by 28, is one array of shape `(32, 28, 28)`. A single number can be an array too, with shape `()`: no axes at all.

        **The dtype.** The dtypes you will meet are few.

        | dtype | each entry is | bytes |
        |---|---|---|
        | `float64` | a decimal number, the same as a Python `float` | 8 |
        | `float32` | a decimal number kept to about 7 digits | 4 |
        | `int64` | a whole number between about $\pm 9.2 \times 10^{18}$ | 8 |
        | `int32` | a whole number between about $\pm 2.1 \times 10^{9}$ | 4 |
        | `int8` | a whole number from $-128$ to 127 | 1 |
        | `bool` | True or False | 1 |

        When you build an array from a list, NumPy chooses the dtype by looking at the values. If any is a decimal, the array is `float64`, and whole numbers among them are converted: `np.array([1, 2.5, 3])` holds 1.0, 2.5 and 3.0. If all are whole, the array is the default whole-number type of the machine.

        That default deserves a warning. On most laptops and servers it is `int64`. The Python on this page runs inside your browser, which is a 32-bit environment, and here it is `int32`. The same line of code gives arrays of different types on different machines. **Code that matters states its dtype**:

        ```python
        counts = np.array([3, 1, 4], dtype=np.int64)
        weights = np.zeros((2, 3), dtype=np.float32)
        ```

        An existing array is converted with `a.astype(np.float64)`, which builds a new array of the new type and leaves the old one alone.

        **What a fixed type does to a value.** A slot of a given dtype holds only values of that dtype, so anything put into it is converted.

        A decimal put into a whole-number array loses its fractional part. It is cut off towards zero, not rounded: 7.9 becomes 7, and $-1.5$ becomes $-1$. That was the second surprise of the puzzle. The assignment `b[0] = 7.9` could not change the dtype of `b`, since the block was already laid out with whole-number slots, so the value gave way.

        A whole number too large for its slot is worse. An `int8` has 8 bits, which can show $2^8 = 256$ different patterns, used for $-128$ to 127. Add 1 to 127 in an `int8` array and the pattern rolls over, as a car's distance counter rolls over from 999999 to 000000, and the result is $-128$. No error is raised. This is **overflow**.

        A Python `int` never overflows, because Python gives it more memory as it grows. You have computed $2^{100}$ without a thought. An array cannot do that, because every slot is of fixed size. In an `int32` array the largest value is $2^{31} - 1 = 2\,147\,483\,647$, a little over two thousand million. Square 100 000 in such an array and the true answer, $10^{10}$, does not fit. What you get is $1\,410\,065\,408$, a number that looks entirely reasonable and is wrong.

        The fixed size is the price of the speed, and you should know you are paying it.
    - question:
        id: derivation-why-one-type
        type: choice
        system: s2
        prompt: |
          Why must every entry of an array have the same dtype?
        options:
          - "It is a rule with no reason behind it."
          - "With one type and one size for every entry, the block can hold raw values with nothing stored beside each, the place of any entry is found by arithmetic, and one compiled loop can process the whole block without asking each entry what it is."
          - "Because Python lists also hold only one type."
          - "Because mixed types would make the array take less memory."
        answer: 1
        explanation: |
          All three gains come from the one restriction. Raw values with no wrapping make the block compact: a million `float64` values take 8 million bytes and no more. Equal sizes make the address of entry $i$ a matter of arithmetic, so any entry is reached in one step, as in the arrays you studied. And a known type means the loop that adds two blocks does not have to look up, a million times over, what addition means. A Python list makes the opposite choice. It holds references to objects of any type, which is flexible and, for arithmetic on many numbers, slow.
        hints:
          - What must be known to find entry i without looking at the entries before it?
          - What does Python have to ask each object before adding it?
          - Think about what is stored beside each value in a list, and in an array.
    - text: |
        **Memory, counted.** The memory of an array is easy to work out, and worth working out before building anything large: the number of entries times the bytes for each.

        A table of word vectors for a language model might have 50 000 rows, one for each word piece, and 768 columns. That is $50\,000 \times 768 = 38\,400\,000$ entries. As `float64` it takes $38\,400\,000 \times 8 = 307\,200\,000$ bytes, about 307 megabytes. As `float32` it takes half that. This is why models are stored in `float32`, or in types smaller still: the weights are the memory, and halving the bytes of each halves the memory of all. The cost is precision, about 7 significant digits in place of 16, which for the weights of a model is nearly always enough.

        A Python list of the same numbers would need 8 bytes for each reference and about 24 more for each number object, four times the memory of a `float64` array, scattered.

        **Arithmetic on whole arrays.** With two arrays of the same shape, every arithmetic operator works entry by entry and gives a new array of that shape.

        ```python
        u = np.array([1.0, 2.0, 3.0])
        v = np.array([10.0, 20.0, 30.0])
        print(u + v)
        print(u * v)
        print(u / 2)
        ```

        The results are 11, 22, 33, then 10, 40, 90, then 0.5, 1, 1.5. An operator between an array and a single number applies the number to every entry. These are exactly the vector operations of your vectors lessons, addition and scaling, and they no longer need a comprehension.

        One point needs stating plainly, because it catches everyone once. **`*` between two arrays multiplies entry by entry. It is not the matrix product.** For the product you derived as composition of maps, Python has the operator `@`:

        ```python
        A = np.array([[2, 1], [1, 2]])
        x = np.array([1, 1])
        print(A @ x)
        print(A * A)
        print(A @ A)
        ```

        `A @ x` is the matrix-vector product, 3 and 3. `A * A` squares each entry, giving rows 4, 1 and 1, 4. `A @ A` is the matrix product, with rows 5, 4 and 4, 5. The three-line function `matmul` that you wrote and tested is the single character `@`. You may now use it, because you know what it does.

        **How an array prints.** `print` shows an array without commas, with the rows of a table one under another, and a decimal array shows a point after each whole value, as in `[1.  2.5 3. ]`. The missing commas tell you at a glance that you are looking at an array and not a list. `a.tolist()` turns an array back into nested lists when you need them.

        **What an array is not.** It is not a list that grows. A list has `append`, with spare room kept ready, as you saw when you counted the cost of doubling. An array has a fixed size. Making a longer one means building a new block and copying. So arrays are built at their full size, often with `np.zeros`, and filled.
    - question:
        id: order-add
        type: order
        system: s2
        prompt: Put in order what happens when Python evaluates `a + b` for two arrays of the same shape.
        steps:
          - 'Python sees that `a` is an array and hands the `+` to the method the array type defines for it.'
          - 'NumPy checks that the two shapes fit, and chooses the dtype of the result from the dtypes of `a` and `b`.'
          - 'A new block of memory is set aside for the result.'
          - 'One compiled loop runs over the two blocks, adding raw values and writing each sum into the new block.'
          - 'The new block is returned as an array, with its shape and its dtype.'
        explanation: Python is involved only at the start, to find out what `+` means for this type, and at the end, to receive the result. Between the two, the work on the entries is done by compiled code on raw values, with no Python object for each number. That is the whole reason an array operation on a million numbers takes a few thousandths of a second.
        hints:
          - The operator must first be handed to the type that defines it.
          - The result needs somewhere to go before the loop can write to it.
          - The shape and dtype of the result are known before any entry is added.
  formal:
    - text: |
        **Array.** A NumPy array is a block of memory holding values of one type, together with a **dtype**, the type and size in bytes of each value, and a **shape**, a tuple giving the length of each axis.

        **Attributes.** For an array `a`: `a.shape`; `a.ndim`, the length of the shape; `a.size`, the product of the shape; `a.dtype`; `a.itemsize`, the bytes for each entry; and `a.nbytes`, equal to `a.size * a.itemsize`.

        **Place in the block.** In an array of shape $(m, n)$ stored row by row, the entry at index $[i, j]$ is at place $i \times n + j$.

        **Conversion.** A value stored into an array is converted to the dtype of the array. A decimal stored as a whole number is cut off towards zero. A whole number outside the range of a whole-number dtype of $b$ bits wraps round modulo $2^b$, with no error.

        **Arithmetic.** For arrays of the same shape, `+`, `-`, `*`, `/` and `**` act entry by entry. With a single number, they act on every entry. The matrix product is `@`.
  drill:
    - text: Seconds each. Block, dtype, shape.
    - question:
        id: drill-shape
        type: choice
        system: s1
        prompt: |
          What is the shape of `np.array([[1, 2, 3], [4, 5, 6]])`?
        options: ["`(3, 2)`", "`(2, 3)`", "`(6,)`", "`(2,)`"]
        answer: 1
        explanation: Two rows, each of three entries. The number of rows comes first.
        hints:
          - Count the rows first.
          - Then count the entries in one row.
    - question:
        id: drill-ndim
        type: numeric
        system: s1
        prompt: |
          What is `a.ndim` for an array of shape `(32, 28, 28)`?
        answer: "3"
        explanation: The number of axes is the length of the shape.
        hints:
          - Count the numbers in the shape.
          - Their values do not matter here.
    - question:
        id: drill-size
        type: numeric
        system: s1
        prompt: |
          What is `a.size` for an array of shape `(4, 5)`?
        answer: "20"
        explanation: The number of entries is the product of the lengths of the axes.
        hints:
          - Multiply the lengths of the axes.
          - Four rows, each of five entries.
    - question:
        id: drill-dtype
        type: choice
        system: s1
        prompt: |
          What is the dtype of `np.array([1, 2.5, 3])`?
        options: ["A whole-number type", "`float64`", "A mixture, one type for each entry", "`bool`"]
        answer: 1
        explanation: One decimal among the values makes the whole array float64, and the whole numbers are converted.
        hints:
          - An array has one dtype for all its entries.
          - Which type can hold all three values?
    - question:
        id: drill-add
        type: choice
        system: s1
        prompt: |
          What is `np.array([1, 2]) + np.array([10, 20])`?
        options: ["`[1 2 10 20]`", "`[11 22]`", "`33`", "An error"]
        answer: 1
        explanation: Arrays add entry by entry.
        hints:
          - Arrays are not joined by +.
          - Add the entries in matching places.
    - question:
        id: drill-list-add
        type: choice
        system: s1
        prompt: |
          What is `[1, 2] + [10, 20]`, for plain lists?
        options: ["`[1, 2, 10, 20]`", "`[11, 22]`", "`33`", "An error"]
        answer: 0
        explanation: For lists, + joins them end to end.
        hints:
          - These are lists, not arrays.
          - What did rows + rows give in the puzzle?
    - question:
        id: drill-nbytes
        type: numeric
        system: s1
        prompt: |
          How many bytes does the block of `np.zeros(10)` take? Its dtype is `float64`.
        answer: "80"
        explanation: Ten entries of 8 bytes each.
        hints:
          - How many bytes is one float64?
          - Multiply by the number of entries.
    - question:
        id: drill-itemsize
        type: numeric
        system: s1
        prompt: |
          What is the `itemsize`, in bytes, of an array with dtype `float32`?
        answer: "4"
        explanation: The 32 in the name is the number of bits, and 8 bits make a byte.
        hints:
          - The number in the name counts bits.
          - Divide by the number of bits in a byte.
    - question:
        id: drill-arange
        type: numeric
        system: s1
        prompt: |
          What is the last entry of `np.arange(5)`?
        answer: "4"
        explanation: Like range, it starts at 0 and stops before 5.
        hints:
          - It behaves like range.
          - The stop value itself is left out.
    - question:
        id: drill-linspace
        type: numeric
        system: s1
        prompt: |
          What is the second entry of `np.linspace(0, 1, 5)`?
        answer: "0.25"
        explanation: Five evenly spaced values from 0 to 1 have four equal gaps between them.
        hints:
          - Five values have four gaps between them.
          - Both ends are included.
    - question:
        id: drill-truncate
        type: numeric
        system: s1
        prompt: |
          `b = np.array([1, 2, 3])` and then `b[1] = 2.9`. What is `b[1]` now?
        answer: "2"
        explanation: The array holds whole numbers, so the value is cut off towards zero on its way in.
        hints:
          - What is the dtype of b?
          - The fractional part is cut off, not rounded.
    - question:
        id: drill-overflow
        type: choice
        system: s1
        prompt: |
          `x = np.array([127], dtype=np.int8)`. What is `x + 1`?
        options: ["`[128]`", "`[-128]`", "`[127]`", "An error"]
        answer: 1
        explanation: An int8 holds −128 to 127. One past the top wraps round to the bottom, silently.
        hints:
          - What is the largest value an int8 can hold?
          - Think of a counter rolling over.
    - question:
        id: drill-star
        type: choice
        system: s1
        prompt: |
          `A = np.array([[2, 1], [1, 2]])`. What is `A * A`?
        options: ["Rows 5, 4 and 4, 5", "Rows 4, 1 and 1, 4", "Rows 4, 2 and 2, 4", "The number 3"]
        answer: 1
        explanation: The star multiplies entry by entry, so each entry is squared. The matrix product is written with @.
        hints:
          - The star is not the matrix product.
          - Square each entry.
    - question:
        id: predict-attributes
        type: predict
        system: s1
        prompt: An array describes itself. What does this show?
        code: |
          import numpy as np

          a = np.zeros((2, 3), dtype=np.float32)
          print(a.shape, a.ndim, a.size)
          print(a.dtype, a.itemsize, a.nbytes)
          print(np.array([[1], [2], [3]]).shape)
          print(np.array([1, 2, 3]).shape)
        output: |
          (2, 3) 2 6
          float32 4 24
          (3, 1)
          (3,)
        explanation: Two rows of three make 6 entries on 2 axes. Each float32 takes 4 bytes, so the block is 24 bytes. Three rows of one entry each is the shape (3, 1), a column. A plain list of three numbers has one axis, written (3,).
        hints:
          - The size is the product of the shape.
          - The bytes are the size times the bytes for each entry.
          - A list of lists has two axes even when the inner lists have one entry.
    - question:
        id: predict-star
        type: predict
        system: s1
        prompt: The star and the at sign. What does this show?
        code: |
          import numpy as np

          A = np.array([[2, 1], [1, 2]])
          x = np.array([1, 1])
          print(A @ x)
          print(A * 10)
          print((A @ A).tolist())
        output: |
          [3 3]
          [[20 10]
           [10 20]]
          [[5, 4], [4, 5]]
        explanation: A @ x is one dot product for each row. A times a number multiplies every entry. A @ A is the matrix product, and tolist turns it into nested lists, which print with commas.
        hints:
          - The at sign is the matrix product.
          - An array prints without commas, and a table prints one row under another.
          - A list prints with commas.
  work:
    - text: Slower now. For each array, say its dtype and its shape before saying anything else.
    - question:
        id: write-to-array
        type: code
        mode: write
        system: s2
        prompt: |
          The functions of the last cluster took a matrix as a list of rows. Write `to_array(rows)` to turn such a list into a NumPy array with dtype `float64`, whatever kinds of numbers the list holds.

          The result must be a table, an array with exactly two axes. If it is not, raise a `ValueError`. Rows of unequal length already make `np.array` raise a `ValueError`, and that may be left to happen.
        starter: |
          import numpy as np

          def to_array(rows):
              # Replace the next line with your own.
              return rows

          A = to_array([[2, 1], [1, 2]])
          print(A.dtype, A.shape)
        solution: |
          import numpy as np

          def to_array(rows):
              a = np.array(rows, dtype=np.float64)
              if a.ndim != 2:
                  raise ValueError("the rows do not form a table")
              return a

          A = to_array([[2, 1], [1, 2]])
          print(A.dtype, A.shape)
        tests: |
          import numpy as _np
          def _raises(value):
              try:
                  to_array(value)
              except ValueError:
                  return True
              return False
          _a = to_array([[2, 1], [1, 2]])
          assert isinstance(_a, _np.ndarray), "to_array must return a NumPy array"
          assert _a.dtype == _np.float64, "The array must have dtype float64 even when the list holds whole numbers"
          assert _a.shape == (2, 2), "Two rows of two give the shape (2, 2)"
          assert _a.tolist() == [[2.0, 1.0], [1.0, 2.0]], "The entries must be the entries of the list"
          assert to_array([[1, 2, 3]]).shape == (1, 3), "One row of three gives the shape (1, 3)"
          assert to_array([[1.5], [2], [3]]).shape == (3, 1), "Three rows of one give the shape (3, 1)"
          assert to_array([[True, False]]).dtype == _np.float64, "Even a list of True and False must come back as float64"
          assert _raises([1, 2, 3]), "A plain list of numbers has one axis and must raise ValueError"
          assert _raises([[[1, 2], [3, 4]]]), "A list of lists of lists has three axes and must raise ValueError"
          assert _raises([[1, 2], [3]]), "Rows of unequal length must raise ValueError"
          assert _raises(5), "A single number has no axes and must raise ValueError"
          assert output.strip() == "float64 (2, 2)", "The program should print float64 (2, 2)"
        wrong:
          - |
            import numpy as np

            def to_array(rows):
                a = np.array(rows)
                if a.ndim != 2:
