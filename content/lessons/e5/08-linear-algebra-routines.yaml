concept: e5.linear-algebra-routines
minutes: 90
claim: You can replace each matrix routine you wrote by hand with the NumPy call that does the same job, predict the shape of any product written with `@`, solve one system or many with `np.linalg.solve` and check the answer, explain by counting work and by following the rounding why solving beats multiplying by an inverse, and say why a determinant is the wrong test for whether a matrix of floats can be inverted and what to use in its place.
recalls: [e5.strides-and-memory-layout]
uses: [m5.elimination-and-linear-systems, m5.identity-and-inverse, m5.determinant, m5.rank, m5.matrix-multiplication-as-composition, m5.matrix-vector-product, m5.transpose, m4.norms-and-distance, m4.angle-and-cosine-similarity, m4.dot-product, e5.broadcasting, e5.axis-operations-and-reductions, e5.vectorisation, e5.arrays-dtype-and-shape, e5.indexing-and-slicing, e1.complexity-and-big-o, m0.powers-and-roots, e0.functions]
leads: [e5.einsum, e5.numerical-error-analysis-in-practice]
starter: |
  # Scratch space. One system of ten equations, solved in two ways.
  import numpy as np

  n = 10
  i = np.arange(n)
  A = 1.0 / (i[:, np.newaxis] + i + 1)   # the entry in row r, column c is 1 / (r + c + 1)

  x_true = np.ones(n)                    # choose the answer first: every unknown is 1
  b = A @ x_true                         # and build the right-hand side that goes with it

  x_inverse = np.linalg.inv(A) @ b       # way one: multiply by the inverse
  x_solve = np.linalg.solve(A, b)        # way two: ask for the solution

  print("with the inverse, worst error", np.abs(x_inverse - x_true).max())
  print("with solve,       worst error", np.abs(x_solve - x_true).max())
parts:
  recall:
    - text: |
        [[e5.strides-and-memory-layout]] finished the account of the array as a container, and said that it was time to treat a table as a matrix. Three quick pulls first, one from the container and two from the matrices.
  puzzle:
    - text: |
        The starter builds a system of ten equations in ten unknowns in the way an examiner would: it chooses the answer first. Every unknown is to be 1. It multiplies the matrix by that answer to get the right-hand side `b`, and then pretends not to know the answer and solves for it.

        The matrix is built with the broadcasting you know. A column of the numbers 0 to 9 plus a row of the numbers 0 to 9 gives the table of all sums $r + c$, and the entry in row $r$ and column $c$ is $1 / (r + c + 1)$: a top row of $1, \tfrac12, \tfrac13, \dots$, a second row of $\tfrac12, \tfrac13, \tfrac14, \dots$, and so on.

        Then it solves the system twice.

        **Way one** is the formula from your lesson on the inverse: $\mathbf{x} = A^{-1}\mathbf{b}$. Ask NumPy for the inverse, and multiply.

        **Way two** asks NumPy for the solution directly, with a function called `solve`.

        In mathematics these are the same thing. You proved that when $A$ has an inverse the system has exactly one solution, and that it is $A^{-1}\mathbf{b}$. There is one right answer, a row of ten 1s, and both ways are computing it.

        Run it. Neither way gets ten 1s exactly, which should bother you a little and is a matter for the end of this lesson. Look at the two errors, though. **The inverse is wrong in the third decimal place. `solve` is wrong in the fourth, about twenty-five times closer.**

        **Two ways of writing one formula, two different answers. Why is the one you were taught the worse of the two? What is `solve` doing, if it is not multiplying by the inverse? And is the inverse at least quicker?**
  intuition:
    - text: |
        Start with what you already own. In the cluster on matrices you wrote, by hand, on lists of rows: a product of a matrix and a vector, a product of two matrices, `solve`, `inverse2`, `rank` and `det`. Before that, for vectors, a dot product and a length. Each of those has a NumPy counterpart that takes arrays.

        | you wrote | NumPy | what it returns |
        |---|---|---|
        | `dot(u, v)` | `u @ v` | a single number |
        | `matvec(A, x)` | `A @ x` | a plain array |
        | `matmul(A, B)` | `A @ B` | a table |
        | `transpose(A)` | `A.T` | a view |
        | `length(v)` | `np.linalg.norm(v)` | a single number |
        | `solve(A, b)` | `np.linalg.solve(A, b)` | the solution |
        | `inverse2(A)` | `np.linalg.inv(A)` | the inverse, for any size |
        | `rank(A)` | `np.linalg.matrix_rank(A)` | a whole number |
        | `det(A)` | `np.linalg.det(A)` | a float |

        `linalg` is short for linear algebra. It is a part of NumPy, reached through the dot: `np.linalg.solve`.

        None of these does anything you have not done. `np.linalg.solve` runs the very method you programmed: elimination with partial pivoting, then back-substitution. Step through it once more, and this time read each step as something a library is doing on your behalf.
    - figure: elimination
      props: { step: 0 }
    - text: |
        What the library adds is **speed** and **care**.

        The speed is of the kind the vectorisation lesson explained, and then some. Your `solve` on lists does every multiplication in Python, with a type check and a boxed number each time. The library does them in compiled code, on a block of floats, walking the block in the order that suits the cache. On a system of 120 unknowns, in the Python built into these pages, the hand-written version takes about 55 milliseconds and the library under one: a factor of sixty or so, and it grows with the size.

        The care is the work of specialists. The routines underneath come from a collection called LAPACK, begun in the 1970s and refined ever since, in which every loop has been arranged to lose as little accuracy as rounding allows. You could not casually write a better one, and neither could anyone else.

        Now the puzzle. Think about what `np.linalg.inv(A)` has to do. The inverse is the matrix $X$ with $AX = I$. Read that one column at a time: column $j$ of $X$ is the solution of $A\mathbf{x} = \mathbf{e}_j$, where $\mathbf{e}_j$ is column $j$ of the identity. **Finding an inverse is solving $n$ systems.** It is not a shortcut to solving one system. It is solving $n$ of them, in order to then answer one.

        A comparison. You want to know what 37 pounds is in rupees. One way is to multiply 37 by today's rate. The other is first to print a complete conversion table for every amount from 1 to 10 000, and then look up 37. The table gives the right answer, and if you had ten thousand lookups to do, it might be worth printing. For one, it is a great deal of work spent on entries you never read. And every entry in a printed table has been **rounded** to fit the page, so what you look up is a rounded number, which you then go on to use.

        That is the shape of the answer to the puzzle. The inverse costs more, since it solves $n$ systems. And it is less accurate, since each of its $n^2$ entries carries its own rounding error, and multiplying by `b` then combines a whole row of slightly wrong numbers for each unknown. `solve` goes from the question to the answer by the shortest road.

        One more picture before the detail. Whether a system can be solved at all was, in the last cluster, a question with a sharp answer: the determinant is zero, or it is not. Tilt the second column in the figure until the parallelogram is flat, and the area, which is the determinant, passes smoothly through small values on the way to zero.
    - figure: determinant
      props: { angle: 30 }
    - text: |
        On paper, "flat" means an area of exactly 0, and anything else is not flat. With floats there is no such sharpness. A matrix that is exactly singular on paper can have a computed determinant of $0.000\,000\,000\,000\,000\,7$, since rounding nudged it. A perfectly good matrix can have a computed determinant of exactly `0.0`, since the true value was too small for a float to hold. So the test you learned, "is the determinant zero", has to be replaced by a different question: **is this matrix so nearly flat that rounding could not tell the difference?** NumPy has a routine that asks exactly that, and it is not `det`.
  derivation:
    - text: |
        **Products, and their shapes.** The operator `@` is the matrix product. Its rule is the one you derived for composing maps: the inner lengths must agree, and they disappear.

        $$(m, n) \mathbin{@} (n, p) \;\to\; (m, p).$$

        A plain array, with one axis, is treated as whatever makes the product meaningful, and its axis disappears:

        | expression | shapes | result |
        |---|---|---|
        | `A @ B` | `(m, n)` and `(n, p)` | `(m, p)` |
        | `A @ x` | `(m, n)` and `(n,)` | `(m,)`, with `x` taken as a column |
        | `x @ A` | `(m,)` and `(m, n)` | `(n,)`, with `x` taken as a row |
        | `x @ y` | `(n,)` and `(n,)` | a single number, the dot product |

        Keep `@` and `*` apart. `A * B` multiplies entry by entry, and broadcasts. `A @ B` takes rows against columns. For two square tables of the same shape both run without complaint and give different answers, so a wrong one is not announced.

        **Solving.** `np.linalg.solve(A, b)` returns the solution of $A\mathbf{x} = \mathbf{b}$ for a square `A`. It copies `A`, eliminates with partial pivoting, back-substitutes, and returns `x`. Your arrays are not changed.

        Count the work, as you did for sorting. Clearing the first column means, for each of about $n$ rows below the pivot, a multiply-and-subtract in each of about $n$ columns: about $n^2$ of them. The second column costs $(n-1)^2$, the next $(n-2)^2$, and so on down. The total is

        $$n^2 + (n-1)^2 + \dots + 1^2 \approx \frac{n^3}{3}.$$

        Back-substitution costs about $\tfrac{n^2}{2}$, which beside $n^3/3$ hardly counts. So solving a system is of order $n^3$: **twice the unknowns, eight times the work.**

        **The elimination does not look at `b`.** Which rows are exchanged, and which multiples are subtracted, is decided by `A` alone. The right-hand side is carried along. So if you have several right-hand sides for the same `A`, the expensive part need be done only once. `np.linalg.solve(A, B)` accepts a **table** `B` whose columns are right-hand sides, and returns a table whose columns are the solutions:

        $$AX = B, \qquad (n, n) \text{ and } (n, k) \;\to\; (n, k).$$

        The cost is one elimination, $n^3/3$, plus about $n^2$ for each column.

        **The inverse.** `np.linalg.inv(A)` is, in effect, `np.linalg.solve(A, np.eye(n))`: $n$ right-hand sides, the columns of the identity. Its cost is the elimination plus $n$ columns at about $n^2$ each, which the special form of the identity brings down a little, to about $n^3$ in all. **Three times the work of one solve**, before the product `inv(A) @ b` is even begun. Measured in these pages on systems of a few hundred unknowns, way one of the puzzle takes between two and three times as long as way two.

        So the inverse is not quicker. It is slower, and it never catches up: with $k$ right-hand sides, hand them all to `solve` as the columns of `B`.

        **The accuracy.** Here is the property that makes `solve` trustworthy. Put its answer back into the equations and look at what is left over, $A\mathbf{x} - \mathbf{b}$, called the **residual**. For elimination with partial pivoting the residual is, in practice, about as small as rounding permits. In the puzzle its largest entry is $4 \times 10^{-16}$: the computed `x` satisfies the ten equations to the last binary digit.

        Way one gives no such assurance. The computed inverse is $n^2$ numbers, each rounded. For the matrix of the puzzle its entries are enormous, up to about $10^{12}$, so their rounding errors are of size $10^{-4}$ and more. `inv(A) @ b` then adds up ten such products for each unknown. Its residual in the puzzle is $5 \times 10^{-5}$: **a hundred thousand million times larger than the residual of `solve`.** The answer it returns does not even satisfy the equations it was asked to solve.

        **The rule.** A formula containing $A^{-1}\mathbf{b}$ is an instruction to **solve**. Write `np.linalg.solve(A, b)`. A formula containing $A^{-1}B$ is the same: `np.linalg.solve(A, B)`. You will meet such formulas all through machine learning, and nearly every one is computed without forming an inverse. Ask for `np.linalg.inv` only when the entries of the inverse are themselves what you want to look at.
    - question:
        id: derivation-inverse
        type: choice
        system: s2
        prompt: |
          `x1 = np.linalg.inv(A) @ b` and `x2 = np.linalg.solve(A, b)` compute the same mathematical object. Why is `x2` both cheaper and more accurate?
        options:
          - "Because `solve` uses a cleverer formula for the inverse."
          - "Finding the inverse means solving $n$ systems, one for each column of the identity, so it costs about three times one solve. And each of its $n^2$ entries is rounded, after which the product with `b` combines a row of rounded numbers for each unknown. `solve` eliminates once, carries `b` along, and returns an answer that satisfies the equations to rounding level."
          - "Because `inv` is written in Python and `solve` in compiled code."
          - "Because `solve` returns a view and `inv` returns a copy."
        answer: 1
        explanation: |
          Both are compiled, both return new arrays, and `solve` never forms an inverse at all. The difference is in the amount of arithmetic and in where rounding enters. The inverse answers every possible right-hand side at once, which is $n$ times more than was asked, and the answer for the one right-hand side you care about is then assembled from $n^2$ separately rounded entries. Elimination with the right-hand side carried along does only the arithmetic the question needs, and the leftover $A\mathbf{x} - \mathbf{b}$ of its answer is as small as floats allow. Less arithmetic, fewer places for error to enter.
        hints:
          - What is column j of the inverse the solution of?
          - How many systems is that in all?
          - How many rounded numbers go into each unknown when you multiply the inverse by b?
    - text: |
        **Checking an answer.** Never trust, verify, and never with `==`. Put the answer back:

        ```python
        x = np.linalg.solve(A, b)
        print(np.allclose(A @ x, b))
        ```

        `np.allclose` compares within a small tolerance, as it must with floats.

        **When there is no solution to find.** If `A` is singular, the elimination meets a column with no usable pivot. On an ordinary installation NumPy stops with `LinAlgError: Singular matrix`. The Python built into these pages runs inside the browser, where that particular alarm cannot be raised, and you get an answer filled with `nan`, "not a number", in its place. Either way you are told.

        The dangerous case is the one where you are **not** told. Take

        $$A = \begin{pmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9 \end{pmatrix}.$$

        On paper it is singular: the middle row is the average of the other two, so the rank is 2 and the determinant is exactly 0. In floats, the elimination produces a last pivot that should be 0 and, after rounding, is about $10^{-16}$. That is not zero. So NumPy carries on. `np.linalg.det(A)` returns `6.66e-16`. `np.linalg.inv(A)` returns, with no warning of any kind, a matrix whose entries are around $10^{16}$, every one of them meaningless.

        **The determinant is the wrong test.** It fails in both directions.

        - It can be non-zero for a singular matrix, as just seen.
        - It can be zero for a perfectly good one. The determinant of $cA$ is $c^n \det A$, as you proved, so it is extremely sensitive to mere scale. Take the identity of size 400, about as well-behaved as a matrix can be, and multiply it by 0.1. The determinant is $0.1^{400} = 10^{-400}$, far below the smallest number a float can hold, and `np.linalg.det` returns exactly `0.0`. Multiply by 10 instead and it returns `inf`.

        A determinant mixes up two things: how nearly flat the matrix is, and how large its entries happen to be. Only the first matters for solving.

        **The right test: rank, with a tolerance.** `np.linalg.matrix_rank(A)` counts the independent directions of `A`, and it does so with a tolerance scaled to the size of the entries: a direction that is squashed to within rounding error of nothing is counted as nothing. It reports 2 for the matrix above and 400 for the scaled identity, which are the true answers. So:

        ```python
        can_be_inverted = np.linalg.matrix_rank(A) == A.shape[0]
        ```

        How `matrix_rank` measures the squashing is a topic of its own, the singular values, which have a cluster to themselves later. For now it is enough to know that it does not use the determinant, and why.

        **Nearly flat.** Between "fine" and "singular" there is a wide borderland, and the matrix of the puzzle lives in it. Its rank is 10 and it has an inverse. But it squashes some directions about $10^{13}$ times more than others, and a float carries only about 16 significant digits. Thirteen of them are spent on that squashing before the solving begins, leaving three or four for the answer. That is why even `solve`, whose residual is perfect, returns ten numbers that are right only to three or four digits. `np.linalg.cond(A)` reports that ratio, the **condition number**, and for the puzzle it prints about $1.6 \times 10^{13}$. A small residual shows that the equations are satisfied. It does not show that the unknowns are right. Why not, and what to do about it, belongs to [[e5.numerical-error-analysis-in-practice]].

        **Lengths.** `np.linalg.norm(v)` is the length of a plain array: the square root of the sum of the squares. Like every reduction it takes `axis` and `keepdims`. For a table `X` with one vector in each row, `np.linalg.norm(X, axis=1)` gives the length of every row. Take care with a table and no `axis`: `np.linalg.norm(X)` gives one number, the square root of the sum of the squares of **all** the entries.

        Dividing each row by its own length is broadcasting with `keepdims`, as when you standardised a table:

        ```python
        U = X / np.linalg.norm(X, axis=1, keepdims=True)
        ```

        Every row of `U` has length 1. Then `U @ U.T` holds the dot product of every row with every other, and the dot product of two vectors of length 1 is the cosine of the angle between them. One line gives all the cosine similarities of a set of vectors at once.

        **Stacks of matrices.** Every routine in `np.linalg` treats the **last two** axes as the matrix and any earlier axes as a stack. For `S` of shape `(1000, 3, 3)`, `np.linalg.det(S)` has shape `(1000,)`, one determinant for each matrix, and `np.linalg.inv(S)` has shape `(1000, 3, 3)`. `@` does the same. The loop over the thousand matrices is done inside the library.
    - question:
        id: order-solve
        type: order
        system: s2
        prompt: Put in order what happens when you call `np.linalg.solve(A, b)` and then check the answer.
        steps:
          - 'The shapes are checked: `A` must be square, and `b` must have one entry for each row.'
          - '`A` and `b` are copied, so that your arrays are left unchanged.'
          - 'For each column in turn, the row with the largest entry is exchanged into the pivot position.'
          - 'Multiples of the pivot row are subtracted from the rows below, with the right-hand side carried along.'
          - 'With the copy now upper triangular, the unknowns are found from the last upwards.'
          - 'You put the answer back: `np.allclose(A @ x, b)`.'
        explanation: This is your own `solve`, step for step, with the looping done in compiled code. The exchange comes before the subtraction within each column, since the multipliers depend on the pivot. Back-substitution needs the triangular form, so it follows all of the elimination. And the check is yours to make, since the library returns an answer without saying how good it is.
        hints:
          - Nothing is computed before the shapes are known to fit.
          - Within a column, the pivot is chosen before anything is subtracted.
          - Back-substitution needs the triangular form.
  formal:
    - text: |
        **Product.** For `A` of shape $(m, n)$ and `B` of shape $(n, p)$, `A @ B` has shape $(m, p)$ and entry $[i, j]$ equal to $\sum_k A_{ik} B_{kj}$. A plain array is taken as a column on the right of `@` and as a row on the left, and its axis is removed from the result.

        **Solve.** For a square `A` of rank $n$, `np.linalg.solve(A, b)` returns the $\mathbf{x}$ with $A\mathbf{x} = \mathbf{b}$, by elimination with partial pivoting, in about $n^3/3$ multiply-and-subtract steps. With a table `B` of shape $(n, k)$ it returns the $X$ of shape $(n, k)$ with $AX = B$.

        **Inverse.** `np.linalg.inv(A)` returns the solution of $AX = I$, in about $n^3$ steps. Compute $A^{-1}B$ as `np.linalg.solve(A, B)`.

        **Determinant and rank.** `np.linalg.det(A)` is the product of the pivots with the sign of the row exchanges, in floats. It is not a test for invertibility. `np.linalg.matrix_rank(A)` is the rank up to a tolerance scaled to the entries, and `A` can be inverted in floats when that rank equals $n$.

        **Norm.** `np.linalg.norm(x)` is $\sqrt{\sum_i x_i^2}$. With `axis`, it is taken along that axis.

        **Stacks.** The routines of `np.linalg`, and `@`, act on the last two axes and treat earlier axes as a stack.
  drill:
    - text: |
        Seconds each. Say the shape before the answer.
    - question:
        id: drill-which
        type: choice
        system: s1
        prompt: |
          Which call returns the solution of $A\mathbf{x} = \mathbf{b}$?
        options: ["`np.linalg.solve(A, b)`", "`np.linalg.det(A, b)`", "`A * b`", "`np.linalg.norm(A, b)`"]
        answer: 0
        explanation: "`solve` runs elimination with partial pivoting and back-substitution."
        hints:
          - The name says what it does.
          - It is in the linalg part of NumPy.
    - question:
        id: drill-shape-product
        type: choice
        system: s1
        prompt: |
          `A` has shape `(3, 4)` and `B` has shape `(4, 2)`. What is the shape of `A @ B`?
        options: ["`(3, 2)`", "`(4, 4)`", "`(3, 4, 2)`", "It is an error"]
        answer: 0
        explanation: The inner lengths, 4 and 4, agree and disappear. The outer lengths remain.
        hints:
          - The inner lengths must agree.
          - The outer lengths give the shape of the product.
    - question:
        id: drill-shape-vector
        type: choice
        system: s1
        prompt: |
          `A` has shape `(3, 4)` and `x` has shape `(4,)`. What is the shape of `A @ x`?
        options: ["`(3,)`", "`(3, 1)`", "`(4,)`", "`(3, 4)`"]
        answer: 0
        explanation: The plain array is taken as a column, and its axis disappears from the result.
        hints:
          - A matrix with 3 rows sends a vector to a vector with 3 components.
          - The result of a matrix times a plain array is a plain array.
    - question:
        id: drill-dot
        type: numeric
        system: s1
        prompt: |
          `x = np.array([1.0, 2.0])` and `y = np.array([3.0, 4.0])`. What is `x @ y`?
        answer: "11"
        explanation: For two plain arrays `@` is the dot product, 1 × 3 + 2 × 4.
        hints:
          - Two plain arrays give a single number.
          - Multiply matching entries and add.
    - question:
        id: drill-star
        type: choice
        system: s1
        prompt: |
          `A` and `B` are square tables of the same shape. Which expression multiplies them entry by entry?
        options: ["`A @ B`", "`A * B`", "`np.linalg.solve(A, B)`", "`A.T @ B`"]
        answer: 1
        explanation: The star works entry by entry, with broadcasting. The matrix product is `@`.
        hints:
          - One of the two operators is ordinary arithmetic on matching entries.
          - The matrix product takes rows against columns.
    - question:
        id: drill-norm
        type: numeric
        system: s1
        prompt: |
          What is `np.linalg.norm(np.array([3.0, 4.0]))`?
        answer: "5"
        explanation: The square root of 9 + 16.
        hints:
          - Square the entries and add.
          - Then take the square root.
    - question:
        id: drill-norm-axis
        type: choice
        system: s1
        prompt: |
          `X` has shape `(100, 8)`. What is the shape of `np.linalg.norm(X, axis=1)`?
        options: ["`(100,)`", "`(8,)`", "`(100, 1)`", "`()`"]
        answer: 0
        explanation: Axis 1 disappears, leaving one length for each row.
        hints:
          - The axis you name is the one that disappears.
          - There is one result for each row.
    - question:
        id: drill-det
        type: numeric
        system: s1
        prompt: |
          What is `np.linalg.det(np.array([[2.0, 0.0], [0.0, 3.0]]))`?
        answer: "6"
        explanation: A diagonal matrix scales areas by the product of its diagonal entries.
        hints:
          - The matrix stretches one direction by 2 and the other by 3.
          - By what factor does the area of the unit square grow?
    - question:
        id: drill-rank
        type: numeric
        system: s1
        prompt: |
          What is `np.linalg.matrix_rank(np.ones((3, 5)))`?
        answer: "1"
        explanation: Every row is the same, so there is one independent direction.
        hints:
          - How many different rows does the table have?
          - The rank counts independent rows.
    - question:
        id: drill-many
        type: choice
        system: s1
        prompt: |
          `A` has shape `(4, 4)` and `B` has shape `(4, 3)`. What is the shape of `np.linalg.solve(A, B)`?
        options: ["`(4, 3)`", "`(4, 4)`", "`(3, 4)`", "`(4,)`"]
        answer: 0
        explanation: Each column of `B` is a right-hand side, and the matching column of the result is its solution.
        hints:
          - Each column of B is one right-hand side.
          - There is one solution, with 4 unknowns, for each column.
    - question:
        id: drill-rule
        type: choice
        system: s1
        prompt: |
          A formula reads $\mathbf{w} = A^{-1}\mathbf{c}$. Which line should compute it?
        options: ["`w = np.linalg.inv(A) @ c`", "`w = np.linalg.solve(A, c)`", "`w = c / A`", "`w = np.linalg.inv(A) * c`"]
        answer: 1
        explanation: An inverse applied to a vector is an instruction to solve, which is cheaper and more accurate.
        hints:
          - Is the inverse itself wanted, or what it does to c?
          - Which routine goes straight from the system to its solution?
    - question:
        id: drill-check
        type: choice
        system: s1
        prompt: |
          Which line is the right check on a computed solution `x` of $A\mathbf{x} = \mathbf{b}$?
        options: ["`A @ x == b`", "`np.allclose(A @ x, b)`", "`np.linalg.det(A) == 0`", "`x == b`"]
        answer: 1
        explanation: Put the answer back, and compare within a tolerance, since floats are rounded.
        hints:
          - Floats are never compared with a double equals sign.
          - Put the answer back into the equations.
    - question:
        id: drill-stack
        type: choice
        system: s1
        prompt: |
