    - question:
        id: write-differences
        type: code
        mode: write
        system: s2
        prompt: |
          Write `differences(u, v)` for two plain arrays `u` of length $n$ and `v` of length $m$. Return the table of shape $(n, m)$ whose entry in row $i$, column $j$ is $u_i - v_j$.

          Use no loop and no comprehension.
        starter: |
          import numpy as np

          def differences(u, v):
              # Replace the next line with your own.
              return u

          print(differences(np.array([10, 20, 30]), np.array([1, 2])))
        solution: |
          import numpy as np

          def differences(u, v):
              return u[:, np.newaxis] - v

          print(differences(np.array([10, 20, 30]), np.array([1, 2])))
        tests: |
          import numpy as _np
          _d = differences(_np.array([10, 20, 30]), _np.array([1, 2]))
          assert _d.shape == (3, 2), "Three entries against two give a table of shape (3, 2)"
          assert _d.tolist() == [[9, 8], [19, 18], [29, 28]], "Entry [i, j] is u[i] - v[j]"
          _e = differences(_np.array([1.0, 2.0, 3.0]), _np.array([1.0, 2.0, 3.0]))
          assert _e.tolist() == [[0.0, -1.0, -2.0], [1.0, 0.0, -1.0], [2.0, 1.0, 0.0]], "For equal lengths the result is still a table, with zeros on the diagonal and negative entries above it"
          assert differences(_np.array([5]), _np.array([1, 2, 3, 4])).tolist() == [[4, 3, 2, 1]], "One entry against four gives a table with one row"
          assert differences(_np.array([1, 2, 3, 4]), _np.array([5])).tolist() == [[-4], [-3], [-2], [-1]], "Four entries against one give a table with one column"
          assert "for " not in source, "Use no loop and no comprehension"
          assert output.strip() == "[[ 9  8]\n [19 18]\n [29 28]]", "The program should print the table with rows 9 8, 19 18 and 29 28"
        wrong:
          - |
            import numpy as np

            def differences(u, v):
                return u - v

            print("[[ 9  8]\n [19 18]\n [29 28]]")
          - |
            import numpy as np

            def differences(u, v):
                return v[:, np.newaxis] - u

            print("[[ 9  8]\n [19 18]\n [29 28]]")
          - |
            import numpy as np

            def differences(u, v):
                return v - u[:, np.newaxis]

            print("[[ 9  8]\n [19 18]\n [29 28]]")
          - |
            import numpy as np

            def differences(u, v):
                return u[np.newaxis, :] - v[:, np.newaxis]

            print("[[ 9  8]\n [19 18]\n [29 28]]")
          - |
            import numpy as np

            def differences(u, v):
                return np.array([[a - b for b in v] for a in u])

            print(differences(np.array([10, 20, 30]), np.array([1, 2])))
          - |
            import numpy as np

            def differences(u, v):
                return u[:, np.newaxis] + v

            print("[[ 9  8]\n [19 18]\n [29 28]]")
        explanation: |
          The row index of the result runs over `u` and the column index over `v`. So `u` must lie along axis 0, as a column of shape $(n, 1)$, and `v` along axis 1, where a plain array of shape $(m,)$ is lined up already. The rule stretches the column across and the row down, and the subtraction meets every pair. Getting the two the other way round gives a table of shape $(m, n)$, the transpose with the signs changed. For equal lengths the plain `u - v` raises no error and returns $n$ numbers in place of $n^2$, which is the silent form of the mistake. This table is the first step of many algorithms: the distance from every point to every other, the comparison of every query with every stored item, the difference between every prediction and every target when that is truly what is wanted.
        hints:
          - Which of the two arrays should run down the rows of the result?
          - Give that one a new axis at the end, making it a column.
          - A column of shape (n, 1) minus a plain array of shape (m,) has shape (n, m).
    - question:
        id: fix-loss
        type: code
        mode: find-bug
        system: s2
        prompt: |
          `mse(pred, y)` should return the mean of the squared differences between each prediction and its own true value. The model returns its predictions as a column, an array of shape `(n, 1)`, and the true values `y` are a plain array of shape `(n,)`. For predictions that are exactly right, the program should print `0.0`. It prints `4.0`. Fix it.
        starter: |
          import numpy as np

          def mse(pred, y):
              return ((pred - y) ** 2).sum() / len(y)

          pred = np.array([[1.0], [2.0], [3.0]])
          print(mse(pred, np.array([1.0, 2.0, 3.0])))
        solution: |
          import numpy as np

          def mse(pred, y):
              return ((pred[:, 0] - y) ** 2).sum() / len(y)

          pred = np.array([[1.0], [2.0], [3.0]])
          print(mse(pred, np.array([1.0, 2.0, 3.0])))
        tests: |
          import numpy as _np
          def _near(got, want):
              return abs(got - want) < 1e-9
          _p = _np.array([[1.0], [2.0], [3.0]])
          assert _near(mse(_p, _np.array([1.0, 2.0, 3.0])), 0), "Predictions that are exactly right have a mean squared error of 0"
          assert _near(mse(_p, _np.array([2.0, 2.0, 2.0])), 2 / 3), "Errors of -1, 0 and 1 have squares 1, 0 and 1, with mean two thirds"
          assert _near(mse(_p, _np.array([0.0, 0.0, 0.0])), 14 / 3), "Against true values of 0 the squares are 1, 4 and 9, with mean 14 thirds"
          assert _near(mse(_np.array([[5.0]]), _np.array([2.0])), 9), "One prediction of 5 for a true value of 2 has squared error 9"
          assert _near(mse(_np.array([[1.0], [1.0]]), _np.array([3.0, 5.0])), 10), "Errors of -2 and -4 have squares 4 and 16, with mean 10"
          assert _p.shape == (3, 1), "The predictions passed in must not be changed"
          assert output.strip() == "0.0", "The program should print 0.0"
        wrong:
          - |
            import numpy as np

            def mse(pred, y):
                return ((pred - y) ** 2).sum() / len(y)

            print(0.0)
          - |
            import numpy as np

            def mse(pred, y):
                return ((pred - y) ** 2).sum() / (len(y) * len(y))

            pred = np.array([[1.0], [2.0], [3.0]])
            print(0.0)
          - |
            import numpy as np

            def mse(pred, y):
                return ((pred[0] - y) ** 2).sum() / len(y)

            print(0.0)
          - |
            import numpy as np

            def mse(pred, y):
                return (pred[:, 0] - y).sum() ** 2 / len(y)

            pred = np.array([[1.0], [2.0], [3.0]])
            print(mse(pred, np.array([1.0, 2.0, 3.0])))
          - |
            import numpy as np

            def mse(pred, y):
                return ((pred[:, 0] - y) ** 2).sum()

            pred = np.array([[1.0], [2.0], [3.0]])
            print(mse(pred, np.array([1.0, 2.0, 3.0])))
        explanation: |
          Write the shapes one under the other. `pred` is `(3, 1)` and `y` is `(3,)`, which is filled out to `(1, 3)`. Each position has a 1, so both are stretched, and `pred - y` is a 3 by 3 table: every prediction minus every true value. Only its diagonal holds the differences that were wanted. The other six entries are differences between a prediction and the true value of a **different** example, and they gave the 4.0. No error was raised, because nothing was wrong as far as the rule could tell. The repair is to make the two arrays the same shape before subtracting. `pred[:, 0]` takes the one column with a whole-number index, which removes the axis and leaves shape `(3,)`. Giving `y` a new axis, `y[:, np.newaxis]`, would do as well. This exact bug has been found in published training code. Its mark is a loss that falls to a certain level and no further, since the model can do nothing about the six entries that compare unrelated examples except push every prediction towards the mean.
        hints:
          - Write the shapes of pred and y one under the other, lined up at the right.
          - What is the shape of pred - y? How many numbers should it hold?
          - Make pred a plain array of shape (n,) before subtracting, by taking its one column with a whole-number index.
    - question:
        id: work-shape
        type: choice
        system: s2
        prompt: |
          A batch of 8 sentences, each of 16 word pieces, each a vector of 64 numbers, is an array of shape `(8, 16, 64)`. To each word piece is added a vector that depends only on its **position** in the sentence, from a table `pos` of shape `(16, 64)`. Does `batch + pos` do that?
        options:
          - "No. The shapes do not fit, since the numbers of axes differ."
          - "Yes. Lined up at the right, 64 meets 64 and 16 meets 16, and the missing axis counts as 1 against 8. So the same table of positions is added to each of the 8 sentences."
          - "It runs, but it adds the positions to the first sentence only."
          - "Yes, but only after `pos` is copied 8 times by hand."
        answer: 1
        explanation: |
          The table `pos` is one sentence's worth, an item, and the rule uses it again for each of the many. Row 5 of `pos` is added to the vector at position 5 of every sentence, which is what a position signal should be. This is the line by which a language model is told the order of its words. Had the batch been stored as `(16, 8, 64)`, positions first, `pos` would have needed a new axis in the middle, `pos[:, np.newaxis, :]`, to line 16 up with 16. The rule cannot know which axis you meant. It can only line up from the right.
        hints:
          - Line the two shapes up at the right.
          - Which lengths meet, and are they equal?
          - What does a missing axis count as?
    - question:
        id: work-memory
        type: numeric
        system: s2
        prompt: |
          To find the distance from each of 10 000 points to each of 10 000 others, in 100 dimensions, a program forms `P[:, np.newaxis, :] - Q[np.newaxis, :, :]`, with `P` and `Q` both `float64` arrays of shape `(10000, 100)`. How many gigabytes does the result take? Count a gigabyte as $10^9$ bytes.
        answer: "80"
        explanation: |
          The shapes are `(10000, 1, 100)` and `(1, 10000, 100)`, so the result has shape `(10000, 10000, 100)`: $10^4 \times 10^4 \times 10^2 = 10^{10}$ entries, at 8 bytes each. That is $8 \times 10^{10}$ bytes. The inputs took 8 megabytes each. Broadcasting copies nothing in order to stretch, but the **result** is as large as its shape says, and a line that reads as innocently as a subtraction has asked for more memory than the machine has. The remedy is to find a formula that never forms the differences, or to work through the points a block at a time, and both will come up when distances are needed in earnest.
        hints:
          - What is the shape of the result?
          - How many entries is that, and how many bytes is each?
          - Divide the number of bytes by the number of bytes in a gigabyte.
    - question:
        id: work-square
        type: choice
        system: s2
        prompt: |
          `X` is a table of 4 rows and 4 columns and `totals` has shape `(4,)`, holding the total of each **row**. A program computes `X / totals`. What happens?
        options:
          - "A ValueError, as in the puzzle."
          - "It runs. The totals are lined up with the last axis, so entry $[i, j]$ is divided by `totals[j]`, the total of row $j$. Each **column** is divided by one number. The result has the right shape and the wrong values."
          - "It runs and divides each row by its total, as intended."
          - "NumPy asks which axis was meant."
        answer: 1
        explanation: |
          The rule compares lengths and nothing else. 4 meets 4, so the shapes fit, and `totals` is treated as a row and used for every row of the table. In the puzzle the same mistake was caught only because the table happened not to be square. Mistakes of this kind tend to survive testing, because test data is small and tidy, and to show up later on a table with as many rows as columns, or with one row. The cure is not to hope for an error but to write the axis: `totals[:, np.newaxis]`. Then the code says what it means for a table of any shape.
        hints:
          - Which axis of the table does a plain array of 4 line up with?
          - Do the lengths fit?
          - Along which direction is one number used again and again?
    - question:
        id: work-batch
        type: choice
        system: s2
        prompt: |
          A layer with 3 units and 2 inputs has `W` of shape `(3, 2)` and `b` of shape `(3,)`. A batch `X` has shape `(4, 2)`. Someone writes `Z = X @ W.T + b`, and later changes the batch to 3 examples. A colleague worries that with `X` of shape `(3, 2)` the bias might be added down the columns by mistake. Is the worry justified?
        options:
          - "Yes. With 3 examples, `b` lines up with the examples."
          - "No. `X @ W.T` has shape (examples, 3) whatever the number of examples, and `b` always lines up with the last axis, the 3 units. With 3 examples the product is `(3, 3)`, and `b` is still added to every row."
          - "Yes. A square result always raises an error."
          - "No, because broadcasting is switched off for square tables."
        answer: 1
        explanation: |
          The rule lines up from the right, and the last axis of `X @ W.T` is the units of the layer for any batch. So the line is correct for every batch size, including the one that makes the result square. This is the good side of the convention: an array with one entry for each item along the **last** axis needs no special care. The danger is the opposite case, a plain array with one entry for each **row**, as in the puzzle. Arranging data so that examples run along the first axis and features along the last is what makes most broadcasting in machine-learning code come out right without a single `np.newaxis`.
        hints:
          - What is the shape of X @ W.T for 3 examples?
          - Which axis does b line up with?
          - Does the number of examples change which axis is last?
  connections:
    - text: |
        A table minus a list of column means worked, and the same table divided by a list of row totals was refused. The rule behind both: write the shapes lined up at the right, fill the shorter out with 1s on the left, and in each position the lengths must be equal or one of them must be 1. An axis of length 1 is stretched by using its one entry again. Nothing else is ever stretched, because nothing else has only one possible meaning.

        The list of totals was lined up with the rows, where it did not fit. Given a new axis, `totals[:, np.newaxis]`, it became a column of shape `(4, 1)` and the division went through. The slice that keeps an axis of length 1, which [[e5.indexing-and-slicing]] taught you to tell from the whole number that drops it, is the same device.

        A column against a row gives a table of every pairing. A table of positions is added to every sentence of a batch. The bias of a layer is added to every example. And you met the three ways the rule can hurt: a square table that hides a wrong axis, a column minus a plain array that silently becomes a table, and a result too large for the machine.

        The rule comes back wherever arrays meet. Totals and means taken along one axis, and kept in a shape ready to be broadcast back, are [[e5.axis-operations-and-reductions]]. A notation that names every axis and makes the pairing explicit is [[e5.einsum]].

        Now look back over three lessons. You have added tables, compared every entry with a number, replaced every negative entry, divided every row by its total and formed every pairwise difference, and in none of it did you write a loop. The loops were still run, inside NumPy, in compiled code. In the last cluster you wrote those loops yourself, in Python. How much does the difference matter? For a million numbers, as it turns out, a factor of fifty or more, and learning to see a Python loop as an operation on whole arrays is the main skill of numerical programming. That is the next lesson, [[e5.vectorisation]].
