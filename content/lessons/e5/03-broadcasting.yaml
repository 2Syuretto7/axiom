        explanation: |
          `totals` has shape `(n,)`, which the rule lines up with the rows of the table. To make it act down the rows it needs shape `(n, 1)`, and `totals[:, np.newaxis]` gives it that. Then 1 meets the number of columns and is stretched across, and $n$ meets $n$. Dividing by `totals` as it stands fails with an error for most tables, which is the fortunate case. For a square table it does not fail: the shapes fit, each **column** is divided by a total, and the answer is wrong with nothing to show it. A function that is correct only when an error happens to save it is not correct, and the square test is there for that reason. Turning each row of a table of scores into fractions that add up to 1 is the last step of every classifier.
