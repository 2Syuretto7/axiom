concept: e5.broadcasting
minutes: 90
claim: You can state the rule by which NumPy combines two arrays of different shapes, apply it to any pair of shapes to say whether they fit and what shape results, explain why only an axis of length 1 is ever stretched, add an axis where one is needed so that a list acts as a column, build a table from a column and a row, and spot the cases where the rule gives a wrong answer without an error.
recalls: [e5.indexing-and-slicing]
uses: [e5.arrays-dtype-and-shape, m5.matrix-vector-product, m5.matrix-multiplication-as-composition, m5.transpose, m4.vector-addition-and-scaling, m0.estimation-and-orders-of-magnitude, e1.exceptions, e0.lists-and-tuples, e0.functions]
leads: [e5.vectorisation, e5.axis-operations-and-reductions, e5.reshaping-views-and-copies, e5.einsum]
starter: |
  # Scratch space. Four flats, with rooms and bathrooms.
  import numpy as np

  X = np.array([[3.0, 1.0], [2.0, 1.0], [4.0, 2.0], [1.0, 1.0]])
  means = np.array([2.5, 1.25])            # one number for each column
  totals = np.array([4.0, 3.0, 6.0, 2.0])  # one number for each row

  print(X - means)
  print(X / totals)
parts:
  recall:
    - text: |
        [[e5.indexing-and-slicing]] ended on something that had been happening unremarked: `x < 0` compared four numbers with one, and `a[:, 1] = 7` wrote one number into four places. Arrays of different shapes were being combined, and it worked. Three quick pulls before finding the rule.
  puzzle:
    - text: |
        The starter has a small table of data: four flats, one in each row, with the number of rooms in the first column and the number of bathrooms in the second.

        Two things are to be done to it. Both are everyday steps in preparing data.

        The first is to subtract from each column its mean, so that each column is centred on zero. The means, 2.5 and 1.25, are in `means`, one number for each **column**.

        The second is to divide each row by its total, so that each row shows what fraction of the spaces of that flat are rooms and what fraction are bathrooms. The totals, 4, 3, 6 and 2, are in `totals`, one number for each **row**.

        Run it. `X - means` works. Every row has had 2.5 taken from its first entry and 1.25 from its second, which is exactly what was wanted.

        `X / totals` stops with an error:

        ```
        ValueError: operands could not be broadcast together with shapes (4,2) (4,)
        ```

        The two requests look alike. A table is combined with a list, one number for each line of the table. One has four numbers for four rows, the other two numbers for two columns. NumPy accepts the second and refuses the first.

        **Why is one allowed and not the other? What rule is NumPy following? And how do you say "this list goes down the rows" so that the division works?**
  intuition:
    - text: |
        Start from the cases that nobody would question.

        Two arrays of the same shape combine entry by entry. That was the first lesson of this cluster.

        An array and a single number combine by using the number for every entry: `u / 2` halves each entry of `u`. You can think of the single number as **stretched** into an array of the right shape, all of whose entries are that number, and then combined entry by entry. Nothing else could reasonably be meant.

        Now a table of shape `(4, 2)` and a list of 2 numbers. The table is four rows, each of 2 numbers. The list matches a row. So the natural meaning is: use the list for every row. Again a stretch. The list is repeated down the table, four times, and then the two tables combine entry by entry. This is what `X - means` did.

        In both cases, something with **one** of a thing was repeated to match something with many. One number, repeated for every entry. One row, repeated for every row. That is the whole idea, and the figure shows it. The faint boxes are the repeats.
    - figure: broadcast
      props: { pair: 0 }
    - text: |
        Press the button once and the figure shows a table with a **column**: shape `(3, 4)` with shape `(3, 1)`. The column has one entry in each row, so it is repeated across, once for each column of the table.

        That is the case the puzzle wanted for `totals`, and it is not the case it wrote. `totals` has shape `(4,)`. It is not a column. It is a plain list with one axis, and when NumPy meets a plain list beside a table it lines the list up with the **rows**, the last axis. A row of this table has 2 entries and the list has 4. They do not match, and neither is 1, so there is nothing to stretch. NumPy stops.

        It stops, and does not guess, on purpose. A list of 4 against rows of 2 could be a mistake in a dozen ways. The one thing it is certain not to be is a row.

        So the rule will be about lining shapes up from the **last** axis, and it will stretch only where a length is **1**. To make `totals` act down the rows it must be given the shape `(4, 1)`: four rows of one entry. The derivation states the rule exactly and shows how to add that axis.
  derivation:
    - text: |
        **The rule.** Combining arrays of different shapes is called **broadcasting**. Given two shapes:

        1. Write them one under the other, **lined up at the right**.
        2. If one is shorter, fill it out on the **left** with 1s.
        3. Compare the lengths in each position. They fit if they are **equal**, or if **one of them is 1**.
        4. If every position fits, the result has, in each position, the larger of the two lengths. An axis of length 1 is stretched to that length by repeating its one entry.
        5. If any position does not fit, a `ValueError` is raised.

        Apply it to the puzzle.

        ```
        X        4  2
        means       2      ->  1  2
        result   4  2
        ```

        Position by position: 2 with 2, equal. 4 with 1, one of them is 1. The shapes fit, and `means` is stretched along axis 0, down the rows.

        ```
        X        4  2
        totals      4      ->  1  4
        ```

        2 with 4. Not equal, and neither is 1. Error.

        **Adding an axis.** What `totals` needs is the shape `(4, 1)`. An axis of length 1 is added by writing `np.newaxis` in an index, at the position where the new axis should go:

        ```python
        column = totals[:, np.newaxis]
        print(column.shape)
        print(X / column)
        ```

        `totals[:, np.newaxis]` means: all of the existing axis, and then a new axis of length 1. Its shape is `(4, 1)`. It is a view, like any slice. Now the rule gives

        ```
        X        4  2
        column   4  1
        result   4  2
        ```

        and each row of `X` is divided by its own total. The rows come out as 0.75, 0.25, then two thirds and one third, twice, then 0.5, 0.5.

        In the same way `totals[np.newaxis, :]` has shape `(1, 4)`, a table with one row. `np.newaxis` is another name for `None`, and you will often see `totals[:, None]`.

        **Why from the right, and why only 1.** Both parts of the rule are choices, and each has a reason.

        A length other than 1 is never stretched because there would be no single natural meaning. To stretch 2 entries to 4, should each be doubled, or the pair repeated? And what of 2 against 5? With 1 there is no choice to make: the one entry is repeated. Every other mismatch is far more likely to be a mistake than an intention, so it is reported as one.

        The shapes are lined up at the right because of how arrays are nested. A table of shape `(4, 2)` is four things, each of shape `(2,)`. A stack of shape `(32, 28, 28)` is 32 things, each of shape `(28, 28)`. The last axes of a shape describe one item, and the first axes count the items. Lining up at the right says: **the smaller array is an item, to be used again for each of the many**. A plain list of 2 numbers beside a table of 4 rows of 2 is one row's worth, for every row. That is the commonest thing to want. The less common thing, one number for each item, is available by saying so with an axis of length 1.

        **Nothing is copied to stretch.** The repeated rows in the figure are drawn, but they are never built. The loop that combines the two arrays simply reads the same entry of the smaller array again each time. Stretching a row of 100 numbers against a table of a million rows uses no extra memory for the row. The result, of course, is a full-sized new array.
    - question:
        id: derivation-why-one
        type: choice
        system: s2
        prompt: |
          A colleague suggests that NumPy should be more helpful: when a list of 2 meets an axis of length 4, it could repeat the list twice. Why does the rule stretch only an axis of length 1?
        options:
          - "Because repeating twice would be slow."
          - "Because one entry can be repeated in only one way, so the meaning is never in doubt. A list of 2 against 4 could be meant in more than one way, and against 5 in none. Such a mismatch is nearly always a mistake, and an error is more useful than a guess."
          - "Because arrays cannot have an axis of length 2."
          - "Because the result would have the wrong dtype."
        answer: 1
        explanation: |
          A rule that silently repairs mismatched shapes would turn every shape mistake into a wrong answer. The rule as it stands accepts the cases with one obvious meaning, a single item used again for each of many, and refuses the rest. That refusal is one of the most useful errors in numerical code: `operands could not be broadcast together` tells you both shapes, and one of them is not what you believed. The cases to fear are the ones the rule accepts although you meant something else, and this lesson ends with those.
        hints:
          - In how many ways can a single entry be repeated to fill an axis?
          - In how many ways could 2 entries fill an axis of length 4? Of length 5?
          - Which is more useful when shapes do not match, a guess or an error?
    - text: |
        **A column against a row.** Both arrays can be stretched at once. Take a column of shape `(3, 1)` and a plain list of shape `(4,)`.

        ```
        column   3  1
        row         4      ->  1  4
        result   3  4
        ```

        Each position has a 1 on one side. The column is stretched across and the row is stretched down, and every entry of one meets every entry of the other.

        ```python
        column = np.array([[10], [20], [30]])
        row = np.array([1, 2, 3, 4])
        print(column + row)
        ```

        The result is the table with rows 11 to 14, 21 to 24 and 31 to 34. Two lists of 3 and 4 numbers have produced a table of 12, holding every pairing. This is the pattern for anything of the form "for each of these, and each of those". With `*` in place of `+` it is a multiplication table, and in the language of the last cluster it is the outer product of two vectors. With `-` it is a table of differences:

        ```python
        v = np.array([1.0, 2.0, 3.0])
        print(v[:, np.newaxis] - v)
        ```

        Entry $[i, j]$ is $v_i - v_j$: every entry compared with every other, with zeros on the diagonal.

        **More axes.** The rule is the same for any number of axes. A stack of 32 pictures of 28 by 28, shape `(32, 28, 28)`, minus one picture of shape `(28, 28)`: the picture is filled out to `(1, 28, 28)` and subtracted from every picture of the stack. Shapes `(5, 1, 4)` and `(3, 1)` give `(5, 3, 4)`: line up at the right, 4 with 1, then 1 with 3, then 5 with a filled-in 1.

        **A whole batch through a layer.** A layer of a network computed $W\mathbf{x} + \mathbf{b}$ for one input $\mathbf{x}$. Data comes as a table `X` with one example in each **row**. If `W` has one row for each unit of the layer, as it did when you met it, then the outputs for all the examples at once are

        ```python
        Z = X @ W.T + b
        ```

        `W.T` is the transpose of `W`. With 4 examples of 2 features and a layer of 3 units, `X` has shape `(4, 2)`, `W.T` has shape `(2, 3)`, and `X @ W.T` has shape `(4, 3)`: one row of 3 outputs for each example. The bias `b` has shape `(3,)`, one number for each unit. The rule lines it up with the rows and uses it for every example. The `+ b` in that line is broadcasting, in every neural network ever written.

        **Assignment broadcasts too.** `a[:, 1] = 7` and `a[:] = row` follow the same rule: the right side is stretched to the shape of the selection on the left. The left side is never stretched, since it is an existing block of fixed size.

        **Where the rule bites.** The rule accepts some combinations that you did not mean.

        The first is a square table. If `X` in the puzzle had been 4 by 4, then `X / totals` would have run without any error, lining the four totals up with the **columns**. Every entry would be divided by the total of the wrong line.

        The second is the most common silent bug in machine-learning code. A model's predictions often come as a column, shape `(n, 1)`, and the true values as a plain list, shape `(n,)`. Subtract one from the other:

        ```
        pred   n  1
        y         n      ->  1  n
        result n  n
        ```

        The shapes fit. The result is not $n$ differences but an $n$ by $n$ table of every prediction minus every true value. Summing its squares gives a number, the code runs, the loss even goes down a little during training, and it is the wrong loss.

        The third is size. Broadcasting two arrays of shapes `(n, 1, d)` and `(1, m, d)` gives a result of shape `(n, m, d)`. Nothing was copied to stretch, but the result is real, and for ten thousand points on each side it can be larger than the memory of the machine.

        The defence against all three is the habit this cluster keeps returning to. **Know the shape of each array, and write the shapes one under the other, lined up at the right, before trusting a line that combines them.**
    - question:
        id: order-rule
        type: order
        system: s2
        prompt: Put in order the steps that decide whether shapes `(3, 1)` and `(4,)` fit, and what results.
        steps:
          - 'Write the two shapes one under the other, lined up at the right: the 4 stands under the 1.'
          - 'The shape `(4,)` is shorter, so fill it out on the left with a 1, giving `(1, 4)`.'
          - 'Compare the last position: 1 with 4. One of them is 1, so it fits.'
          - 'Compare the first position: 3 with 1. One of them is 1, so it fits.'
          - 'Take the larger length in each position. The result has shape `(3, 4)`.'
        explanation: Lining up comes first, since it decides which lengths are compared. Filling out with 1s comes before comparing, since a missing axis has nothing to compare. The result is read off only when every position has been found to fit.
        hints:
          - Nothing can be compared until the shapes are lined up.
          - A missing axis must be filled in before it can be compared.
          - The shape of the result is the last thing found.
  formal:
    - text: |
        **Broadcasting rule.** Let two arrays have shapes $(a_1, \dots, a_p)$ and $(b_1, \dots, b_q)$. Fill out the shorter shape on the left with 1s until both have the same number of axes $n$. The arrays can be combined if, for each axis $k$, $a_k = b_k$ or $a_k = 1$ or $b_k = 1$. The result has shape $(\max(a_1, b_1), \dots, \max(a_n, b_n))$, and its entry at an index uses, from each array, the entry at that index with the index taken as 0 along every axis of length 1.

        **Adding an axis.** `np.newaxis` in an index adds an axis of length 1 at that position. For `v` of shape `(n,)`, `v[:, np.newaxis]` has shape `(n, 1)` and `v[np.newaxis, :]` has shape `(1, n)`. Both are views.

        **No copies.** The smaller array is not repeated in memory. The result is a new array of the full broadcast shape.

        **Assignment.** In `a[index] = value`, the value is broadcast to the shape of `a[index]`.
