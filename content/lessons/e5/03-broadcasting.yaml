  work:
    - text: Slower now. For every line that combines two arrays, write the two shapes one under the other first.
    - question:
        id: write-fractions
        type: code
        mode: write
        system: s2
        prompt: |
          Write `row_fractions(X, totals)`. `X` is a table and `totals` is a plain list-like array with one number for each **row** of `X`. Return the table in which each row of `X` has been divided by its own total.

          It must work for a table of any shape, including a square one.
        starter: |
          import numpy as np

          def row_fractions(X, totals):
              # Replace the next line with your own.
              return X

          X = np.array([[3.0, 1.0], [2.0, 2.0], [4.0, 4.0], [1.0, 1.0]])
          print(row_fractions(X, np.array([4.0, 4.0, 8.0, 2.0])))
        solution: |
          import numpy as np

          def row_fractions(X, totals):
              return X / totals[:, np.newaxis]

          X = np.array([[3.0, 1.0], [2.0, 2.0], [4.0, 4.0], [1.0, 1.0]])
          print(row_fractions(X, np.array([4.0, 4.0, 8.0, 2.0])))
        tests: |
          import numpy as _np
          _X = _np.array([[3.0, 1.0], [2.0, 2.0], [4.0, 4.0], [1.0, 1.0]])
          _r = row_fractions(_X, _np.array([4.0, 4.0, 8.0, 2.0]))
          assert _r.shape == (4, 2), "The result has the shape of the table"
          assert _r.tolist() == [[0.75, 0.25], [0.5, 0.5], [0.5, 0.5], [0.5, 0.5]], "Each row is divided by its own total"
          _S = _np.array([[1.0, 1.0], [2.0, 6.0]])
          assert row_fractions(_S, _np.array([2.0, 8.0])).tolist() == [[0.5, 0.5], [0.25, 0.75]], "For a square table each row, not each column, is divided by its total"
          _T = _np.array([[2.0, 4.0, 6.0]])
          assert row_fractions(_T, _np.array([2.0])).tolist() == [[1.0, 2.0, 3.0]], "A table with one row is divided by its one total"
          _U = _np.array([[1.0, 2.0, 1.0], [0.0, 5.0, 5.0], [3.0, 3.0, 3.0]])
          assert row_fractions(_U, _np.array([4.0, 10.0, 9.0])).tolist()[1] == [0.0, 0.5, 0.5], "In a 3 by 3 table, row 1 is divided by the second total"
