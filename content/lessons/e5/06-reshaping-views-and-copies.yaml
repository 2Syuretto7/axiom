        prompt: |
          `g = a.reshape(3, 4)` and then `g = g * 2`. What is `a[1]`?
        options: ["1", "2", "0", "An error is raised"]
        answer: 0
        explanation: g * 2 builds a new array and the name g is moved to it. The block of a is not written to.
        hints:
