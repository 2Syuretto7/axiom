    - question:
        id: predict-two
        type: predict
        system: s1
        prompt: A reshape and a transpose to the same shape. What does this show?
        code: |
          import numpy as np

          e = np.array([[0, 1, 2], [3, 4, 5]])
          print(e.reshape(3, 2))
