          What is the shape of `np.concatenate([b, b], axis=1)`?
        options: ["`(6, 4)`", "`(3, 8)`", "`(2, 3, 4)`", "`(24,)`"]
        answer: 1
        explanation: Along axis 1 the tables are set side by side, so the columns add and the rows stay.
        hints:
          - Axis 1 counts columns.
          - The length along the joining axis is added.
    - question:
        id: drill-stack
        type: choice
        system: s1
        prompt: |
          What is the shape of `np.stack([b, b])`?
        options: ["`(6, 4)`", "`(3, 8)`", "`(2, 3, 4)`", "`(24,)`"]
        answer: 2
        explanation: stack joins along a new first axis, whose length is the number of arrays.
        hints:
          - stack makes a new axis.
          - Two arrays were stacked.
    - question:
        id: predict-puzzle
        type: predict
        system: s1
        prompt: The puzzle, on six numbers. What does this show?
        code: |
          import numpy as np

          a = np.arange(6)
          b = a.reshape(2, 3)
          b[0, 0] = 99
          r = b.T.reshape(6)
          r[1] = -5
          print(a)
          print(r)
          print(np.shares_memory(a, b), np.shares_memory(a, r))
        output: |
          [99  1  2  3  4  5]
          [99 -5  1  4  2  5]
          True False
        explanation: b is a view, so the 99 appears in a. The transpose reads down the columns, 99, 3, 1, 4, 2, 5, and laying that out as one row needs a copy, so the −5 written into r does not reach a.
        hints:
