        prompt: |
          What is the shape of `a.reshape(2, -1)`?
        options: ["`(2, 6)`", "`(2, 12)`", "`(2, 1)`", "`(6, 2)`"]
        answer: 0
        explanation: Twelve entries in 2 rows need 6 columns.
        hints:
          - The −1 is whatever makes the count come out right.
          - Divide the number of entries by 2.
    - question:
        id: drill-flat
        type: choice
        system: s1
        prompt: |
          What is the shape of `b.reshape(-1)`?
        options: ["`(12,)`", "`(3, 4)`", "`(1, 12)`", "`(12, 1)`"]
        answer: 0
        explanation: A single −1 means one axis holding everything.
        hints:
          - Only one length is given.
          - It must account for all twelve entries.
    - question:
        id: drill-bad
        type: choice
        system: s1
        prompt: |
          What does `a.reshape(5, 3)` do?
        options: ["Gives a table with 3 entries missing", "Gives a table padded with zeros", "Raises a ValueError, since 15 is not 12", "Gives shape (4, 3)"]
        answer: 2
        explanation: A reshape must keep the number of entries.
        hints:
          - How many entries does a 5 by 3 table have?
          - How many has a?
    - question:
        id: drill-where
        type: numeric
        system: s1
        prompt: |
          `c = a.reshape(2, 6)`. What is `c[1, 2]`?
        answer: "8"
        explanation: One whole row of 6 comes first, then 2 more entries, so it is number 8 in the reading order, and a holds its own positions.
        hints:
          - How many entries are in row 0?
          - Count 2 further along.
    - question:
        id: drill-reshape-vs-t
        type: choice
        system: s1
        prompt: |
          `e = np.array([[0, 1, 2], [3, 4, 5]])`. What is the first row of `e.reshape(3, 2)`?
        options: ["`[0 1]`", "`[0 3]`", "`[0 1 2]`", "`[3 4]`"]
        answer: 0
        explanation: The reading order 0, 1, 2, 3, 4, 5 is kept, and broken after every second entry.
        hints:
          - Reshape keeps the reading order.
          - The new rows have two entries each.
    - question:
        id: drill-t
        type: choice
        system: s1
        prompt: |
          `e = np.array([[0, 1, 2], [3, 4, 5]])`. What is the first row of `e.T`?
        options: ["`[0 1]`", "`[0 3]`", "`[0 1 2]`", "`[2 5]`"]
        answer: 1
        explanation: The first row of the transpose is the first column of e.
        hints:
          - The transpose turns columns into rows.
          - What is the first column of e?
    - question:
        id: drill-view-reshape
        type: choice
        system: s1
        prompt: |
          `b[0, 0] = 99`. What is `a[0]`?
        options: ["0", "99", "It depends on the machine", "An error is raised"]
        answer: 1
        explanation: Reshaping a freshly made array gives a view of its block.
        hints:
          - Is the reading order of b the order of the block of a?
          - What did the puzzle show?
    - question:
        id: drill-t-view
