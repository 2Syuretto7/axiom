concept: e5.vectorisation
minutes: 90
claim: You can explain where the time goes in a Python loop over numbers and why one array operation avoids it, estimate the gain and say when there is none, rewrite the common kinds of loop as operations on whole arrays, using element-wise functions, masks and where, shifted slices and running totals, recognise the loops that cannot be removed, and check a rewritten version against the loop it replaces.
recalls: [e5.broadcasting]
uses: [e5.indexing-and-slicing, e5.arrays-dtype-and-shape, e1.complexity-and-big-o, e1.comprehensions-and-iterators, e1.testing-with-pytest, e1.modules-and-imports, m10.derivative-as-slope-and-rate, m10.integral-as-accumulation, m10.fundamental-theorem-of-calculus, m10.maxima-and-minima, m5.matrix-vector-product, m4.dot-product, m2.the-exponential-and-e, m0.estimation-and-orders-of-magnitude, e0.loops, e0.booleans-and-conditionals, e0.functions]
leads: [e5.axis-operations-and-reductions, e5.linear-algebra-routines, e5.einsum, e5.strides-and-memory-layout]
starter: |
  # Scratch space. One sum of squares, computed three ways and timed.
  import time
  import numpy as np

  n = 200000
  xs = [0.001 * i for i in range(n)]
  a = np.array(xs)

  start = time.perf_counter()
  total = 0.0
  for x in xs:
      total += x * x
  list_loop = time.perf_counter() - start

  start = time.perf_counter()
  total = 0.0
  for x in a:
      total += x * x
  array_loop = time.perf_counter() - start

  start = time.perf_counter()
  total = a @ a
  whole_array = time.perf_counter() - start

  print("loop over the list   ", round(list_loop * 1000, 2), "ms")
  print("loop over the array  ", round(array_loop * 1000, 2), "ms")
  print("one array operation  ", round(whole_array * 1000, 2), "ms")
parts:
  recall:
