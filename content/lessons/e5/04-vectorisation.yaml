        prompt: |
          A loop does a fixed amount of work for each of $n$ numbers. How does its running time grow?
        options: ["It stays the same", "In proportion to $n$", "In proportion to $n^2$", "In proportion to $\\log n$"]
        answer: 1
        explanation: Twice as many numbers means twice as many passes through the loop.
    - question:
        id: recall-dot
