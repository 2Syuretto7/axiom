        explanation: |
          $e^{1000}$ is beyond the largest float, so the exponentials are all `inf`, and `inf / inf` is `nan`. Softmax depends only on the differences between the scores of a row, so the largest score of each row can be subtracted first, at no cost to the answer. Then the largest exponent is 0, every exponential is between 0 and 1, and the row total is at least 1. Subtracting the smallest score of each row cures this one example and fails on a row such as 0 and 2000. Subtracting the largest score of the whole table fails when another row lies far below it, since that whole row underflows to zero and gives `0 / 0`. Dividing the scores by 1000 changes the answer: softmax is unchanged by adding, and it is very much changed by scaling. And replacing each `nan` with a made-up probability after the event hides the failure without computing the answer. The fix that works is the one that follows from a proof.
    - question:
        id: work-why
        type: choice
        system: s2
        prompt: |
          In the puzzle, the row of scores 1000, 1001, 1002 gave `nan`, though every line of the function follows the formula. What exactly happened?
        options:
          - "The formula for softmax is wrong for large scores."
          - "Each exponential, about $10^{434}$, is beyond the largest float, about $1.8 \\times 10^{308}$, and became `inf`. The row total was `inf`, and `inf / inf` has no determinable value, so it is `nan`. The answer itself is moderate. It was the intermediate values on the way to it that could not be held."
          - "NumPy cannot divide arrays with three entries."
          - "The scores were whole numbers stored as floats."
        answer: 1
        explanation: |
          The formula is right for all real scores, and the proof of shift invariance shows the answer here must equal that of the first row. The failure is in the route. Softmax is a ratio, and a ratio of two huge numbers can be perfectly ordinary, but the floats must first hold the huge numbers, and they cannot. Once a value has become `inf` it keeps no record of how large it was, so the ratio is lost. This is the general shape of an overflow bug: a modest answer, reached by way of intermediate values far more extreme than itself. The cure is always to reorganise the algebra so that the extremes cancel before they are computed.
    - question:
        id: work-equal
        type: numeric
        system: s2
        prompt: |
          An array holds 100 entries, every one equal to 500. Its log-sum-exp is 500 plus a correction. To one decimal place, what is the correction? Use $\log 10 \approx 2.3$.
        answer: "4.6"
        explanation: |
          Take out the largest entry, 500. Every shifted entry is 0, every exponential is 1, and the sum is 100. The correction is $\log 100 = 2 \log 10$, twice 2.3. This is the upper end of the bounds: log-sum-exp is at most the maximum plus $\log n$, reached exactly when all $n$ entries are level. Computed directly, $e^{500}$ is about $10^{217}$, which a float can still hold, but a hundred entries of 720 would not have survived.
    - question:
        id: work-logs
        type: choice
        system: s2
        prompt: |
          A language model assigns a probability to each of the 5000 words of a document, and the probability of the document is their product. Computed with `np.prod`, it is `0.0` for every document, so no two documents can be compared. What should be computed instead?
        options:
          - "The product in `float32`, which is faster."
          - "The sum of the logarithms of the 5000 probabilities. The logarithm of a product is the sum of the logarithms, each of which is an ordinary negative number, so the sum is an ordinary number of a few thousand in size that no float has trouble with, and a larger sum means a more probable document."
          - "The mean of the probabilities."
          - "The product of only the first hundred probabilities."
        answer: 1
        explanation: |
          With typical word probabilities of a tenth or less, the product is below $10^{-5000}$, and the smallest positive float is about $10^{-324}$. It underflows after the first few hundred words. Logarithms turn the product into a sum, and sums of moderate numbers do not underflow. Since the logarithm is an increasing function, comparing sums of logarithms is the same as comparing the products. `float32` has a much narrower range and underflows sooner. This is why every quantity in the training of such models, the loss above all, is expressed as a logarithm of a probability, and it is where the name "log-likelihood" that you will meet comes from.
    - question:
        id: work-bounds
        type: choice
        system: s2
        prompt: |
          Which statement is true of the log-sum-exp of **any** $n$ numbers with largest value $m$?
        options:
          - "It is always less than $m$."
          - "It lies between $m$ and $m + \\log n$. The sum of the shifted exponentials contains the term $e^0 = 1$, so it is at least 1, and it has $n$ terms each at most 1, so it is at most $n$."
          - "It equals the mean of the numbers."
          - "It is always exactly $m + \\log n$."
        answer: 1
        explanation: |
          After the shift, the sum inside the logarithm is squeezed between 1 and $n$, so its logarithm is squeezed between 0 and $\log n$, and adding $m$ gives the bounds. The lower end is approached when one number stands far above the others, and the upper end is reached when all are equal. So log-sum-exp never differs from the maximum by more than $\log n$, which for a thousand classes is about 6.9. That is why it is called a smooth maximum, and the smoothness is what matters: the plain maximum has a corner wherever two values tie, and a function with corners cannot be differentiated there. Training needs derivatives, as your calculus lessons will shortly make use of.
  connections:
    - text: |
        The softmax you wrote gave `nan` for the scores 1000, 1001 and 1002, though its formula is correct and the answer is plain. $e^{1000}$ is beyond the largest float and became `inf`, and `inf / inf` is `nan`. A modest answer was being reached by way of numbers too large to hold.

        The cure came from a proof. Softmax is unchanged when the same number is added to every score, since the common factor cancels. So subtract the largest score of each row first. Then every exponential lies between 0 and 1, one of them is exactly 1, and neither overflow nor division by zero is possible. The same step gives the **log-sum-exp**, $m + \log \sum_i e^{x_i - m}$, a smooth version of the maximum that lies between $m$ and $m + \log n$.

        Around that sits a way of working. Long products of probabilities underflow, so probabilities are kept as logarithms and multiplied by adding. Adding them needs log-sum-exp. And the logarithm of a softmax is computed as the score less the log-sum-exp, with the exponential and the logarithm cancelled on paper and never performed. The reductions along an axis with `keepdims`, from the lesson on reductions, carry all of it to whole tables.

        This lesson dealt with the crude failures of floats, the ones at the ends of their range: too large, too small. It closed on a subtler one. `np.log(1 + 1e-17)` gave `0.0`, with nothing overflowing and nothing underflowing. The sum $1 + 10^{-17}$ is a perfectly ordinary size. It simply is not a float: there is no float between 1 and the next float above it, and the gap is much wider than $10^{-17}$. Floats are not the real numbers with the ends cut off. They are a finite set of points with gaps between them, and the gaps grow with the size of the numbers.

        The matrix of ten equations, three lessons ago, whose answer was right to only four digits though its residual was perfect. The remark that the order of operations affects the accuracy of a sum. The square-root law for sampled estimates. All of these were left open, and all are about one question: **given that every number is slightly wrong, how wrong is the answer?** How to ask that of any computation, and what to do about it, is the last lesson of this cluster, [[e5.numerical-error-analysis-in-practice]].
