concept: e5.log-sum-exp-and-stable-formulations
minutes: 90
claim: You can say when an exponential overflows or underflows in floats and what `inf` and `nan` then do to a computation, prove that softmax is unchanged by shifting every score, compute the logarithm of a sum of exponentials without overflow by taking out the largest term, write softmax and its logarithm so that they cannot fail, and explain why long products of probabilities are handled as sums of logarithms.
recalls: [e5.random-number-generation]
uses: [e5.axis-operations-and-reductions, e5.broadcasting, e5.vectorisation, e5.indexing-and-slicing, e5.arrays-dtype-and-shape, m2.the-exponential-and-e, m1.logarithms, m1.exponent-laws, m1.inequalities-and-absolute-value, m0.estimation-and-orders-of-magnitude, e0.functions]
leads: [e5.numerical-error-analysis-in-practice]
starter: |
  # Scratch space. The softmax you wrote, on two rows of scores.
  import numpy as np

  def softmax(S):
      E = np.exp(S)
      return E / E.sum(axis=1, keepdims=True)

  S = np.array([[0.0, 1.0, 2.0],
                [1000.0, 1001.0, 1002.0]])
  print(softmax(S))
parts:
  recall:
    - text: |
        [[e5.random-number-generation]] ended with a test: feed large random scores to your `softmax`, and most rows come back as `nan`. Three quick pulls first.
    - question:
        id: recall-state
        type: choice
        system: s1
        concepts: [e5.random-number-generation]
        prompt: |
          A function creates `np.random.default_rng(0)` inside itself and draws three numbers. It is called twice. How do the two results compare?
        options: ["They are identical", "They are different", "The second is all zeros", "The second call is an error"]
        answer: 0
        explanation: Each call makes a new generator in the same starting state, so each draws the same numbers.
    - question:
        id: recall-keepdims
        type: choice
        system: s1
        concepts: [e5.axis-operations-and-reductions]
        prompt: |
          `S` has shape `(100, 5)`. What is the shape of `S.max(axis=1, keepdims=True)`?
        options: ["`(100,)`", "`(100, 1)`", "`(1, 5)`", "`(5,)`"]
        answer: 1
        explanation: Axis 1 is reduced, and kept with length 1, so that the result broadcasts against the rows of `S`.
    - question:
        id: recall-exponent
        type: choice
        system: s1
        concepts: [m2.the-exponential-and-e]
        prompt: |
          Which of these equals $e^{a + c}$?
        options: ['$e^a + e^c$', '$e^a \, e^c$', '$e^{ac}$', '$c\,e^a$']
        answer: 1
        explanation: Adding exponents multiplies the powers.
  puzzle:
    - text: |
        The starter holds the `softmax` you wrote in the lesson on reductions, unchanged: take the exponential of every score, and divide each row by its own total. It is run on a table with two rows of scores.

        The first row is 0, 1, 2. The second is 1000, 1001, 1002.

        Before you run it, think about what the second row **should** give. Softmax turns differences of scores into ratios of probabilities. In both rows the scores step up by 1, so in both rows each class should be $e$ times as likely as the one before. The second row is the first with 1000 added to everything, and adding the same amount to every score ought to change nothing. You will prove that in a moment.

        Run it.

        The first row comes out as about 0.09, 0.24 and 0.67. **The second row comes out as `nan`, `nan`, `nan`.**

        Go through the function line by line and you will find no mistake. The formula is the right formula, and each line does what the formula says. Yet a row whose answer is known, and is perfectly ordinary, has produced nothing at all.

        **How can a correct formula, correctly programmed, give no answer? What is `nan`, and where did it come from? And how do you write softmax so that this cannot happen, for any scores whatever?**
  intuition:
    - text: |
        Follow the second row through by hand.

        The first step is $e^{1000}$. How large is that? Since $e^{2.3} \approx 10$, it is about $10^{434}$: a 1 followed by 434 zeros. The number of atoms in the visible universe is about $10^{80}$.

        A `float64` has 64 binary digits, and with them it can hold numbers up to about $1.8 \times 10^{308}$. That is immense, and $e^{1000}$ is immensely larger. When a result is too large to hold, the float does not wrap round or stop the program. It becomes a special value, **`inf`**, infinity, which means "larger than I can say". This is called **overflow**. The exponential overflows for any input above about 709.8.

        So after the first line, the second row of `E` is `inf`, `inf`, `inf`. Its total is `inf`. And the last line divides `inf` by `inf`.

        What is infinity divided by infinity? It could be anything. The three infinities here stand for $e^{1000}$, $e^{1001}$ and $e^{1002}$, and their ratios to the total are exactly the 0.09, 0.24 and 0.67 you wanted. But the floats no longer know that. Each has forgotten everything about itself except that it was too big. A question with no determinable answer gets the other special value: **`nan`**, "not a number".

        So nothing went wrong with the formula. What went wrong is that it reaches a perfectly modest answer **by way of** numbers too large to write down. The answer is a ratio of two enormous things, and the enormous things did not survive the journey.

        An everyday version. Two people want to know what share of a bill each should pay, and they are told the amounts in units so small that the figures run off the end of the calculator's display. Both displays show "error". The shares were never in doubt: a half each, say. The fault lay in the units. Measure the same amounts in pounds and the calculator is content.

        That is the cure, and you already hold the fact that makes it legitimate: softmax does not care if you add the same number to every score. So **before** exponentiating, subtract from every score the largest score of its row. The row 1000, 1001, 1002 becomes $-2, -1, 0$. The largest exponent is now $e^0 = 1$, the others are smaller, and nothing can overflow.

        The figure does this for three scores at a time. Step the scores upwards and watch the direct route fail while the shifted one carries on.
    - figure: log-sum-exp
      props: { shift: 0 }
    - text: |
        The figure shows a quantity slightly different from softmax, and more basic: the **logarithm of the sum of the exponentials** of the scores. It is the logarithm of the total by which softmax divides, and it is the thing that actually appears when a model is trained, as you will see. It suffers the same overflow, and the same subtraction cures it.

        Move the scores to 1000 and beyond, and the direct route gives `inf`. The shifted route gives 1002.41, which is right.

        Now go the other way.
    - figure: log-sum-exp
      props: { shift: -1000 }
    - text: |
        With scores near $-1000$ the direct route fails in the opposite manner. $e^{-1000}$ is a 1 preceded by 434 zeros after the decimal point. The smallest positive `float64` is about $5 \times 10^{-324}$, and anything smaller becomes exactly `0.0`. This is **underflow**. The three exponentials are all zero, their sum is zero, and the logarithm of zero is `-inf`. With softmax, the same scores would give zero divided by zero, which is `nan` again.

        The same subtraction cures this too. Take out the largest score, $-998$, and the row becomes $-2, -1, 0$ once more.

        So the trouble has nothing to do with whether the scores are large or small. It comes from exponentiating numbers far from zero, in either direction, and it is cured by moving the numbers so that the largest sits **at** zero.

        One more thing about `nan` before the detail, since it is why this matters so much in practice. `nan` is contagious. Any arithmetic with a `nan` gives `nan`. In training, one `nan` in one row of one batch flows into the loss, from the loss into every correction, and from the corrections into **every weight of the model**. A run that has been going for days is destroyed in one step, and what you see afterwards is a model made entirely of `nan` with no sign of where it began. Writing the formula so that the first `nan` can never appear is not fastidiousness. It is what makes training possible.
  derivation:
    - text: |
        **The limits.** For `float64`:

        | | value |
        |---|---|
        | largest float | about $1.8 \times 10^{308}$ |
        | `np.exp(x)` is `inf` | for $x$ above about 709.8 |
        | smallest positive float | about $5 \times 10^{-324}$ |
        | `np.exp(x)` is `0.0` | for $x$ below about $-745$ |

        **The special values.** `inf` behaves like a number larger than every float: `inf + 1` is `inf`, and `1 / inf` is `0.0`. Where no answer can be determined, the result is `nan`: `inf - inf`, `inf / inf`, `0 * inf` and `0.0 / 0.0` on arrays. `nan` spreads through every operation, and it is not equal to anything, itself included, so it is detected with `np.isnan`, never with `==`. `np.isfinite(x)` is `True` where an entry is neither `inf` nor `nan`.

        Ordinary NumPy prints a warning when an overflow first happens. The Python built into these pages does not, so here the first sign of trouble is the wrong answer itself.

        **Softmax is unchanged by a shift.** Take scores $s_1, \dots, s_n$, and add the same number $c$ to each. The probability of class $k$ becomes

        $$\frac{e^{s_k + c}}{\sum_j e^{s_j + c}} = \frac{e^{c}\, e^{s_k}}{e^{c} \sum_j e^{s_j}} = \frac{e^{s_k}}{\sum_j e^{s_j}}.$$

        The factor $e^c$ comes out of every term of the sum, by the law of exponents you pulled a moment ago, and cancels. Softmax depends only on the **differences** between scores.

        **Choosing the shift.** We are free to pick $c$. Pick $c = -m$, where $m$ is the largest score. Then:

        - The largest shifted score is 0, and every other is negative. So every exponential lies between 0 and 1, and **none can overflow.**
        - The largest contributes $e^0 = 1$ to the total. So the total is at least 1, and **the division can never be by zero.**
        - Some of the others may underflow to 0. A term that underflows was smaller than $10^{-323}$ beside a total of at least 1, and a `float64` holds only about 16 significant digits. Its true contribution was far below what the float could have recorded anyway. **Underflow of the small terms does no harm.**

        For a table with one example in each row:

        ```python
        def softmax(S):
            Z = S - S.max(axis=1, keepdims=True)
            E = np.exp(Z)
            return E / E.sum(axis=1, keepdims=True)
        ```

        One line added. Each row has its own largest score taken out, which is why the maximum is taken along axis 1 and kept.
    - question:
        id: derivation-safe
        type: choice
        system: s2
        prompt: |
          After the largest score of a row has been subtracted from every score of that row, why can the exponentials neither overflow nor add up to zero?
        options:
          - "Because subtracting makes all the scores positive."
          - "Every shifted score is at most 0, so every exponential is at most $e^0 = 1$, far below the largest float. And the largest score itself has become exactly 0, so one of the terms is exactly 1, and the total is at least 1."
          - "Because NumPy checks for overflow after a subtraction."
          - "Because the scores are now all equal."
        answer: 1
        explanation: |
          The shift puts the largest score at zero and leaves every other below it. An exponential of a number that is zero or negative lies between 0 and 1. That disposes of overflow. For the total, it is enough that one term is known to be 1: the rest are not negative, so the sum cannot be less. The other terms may be tiny, or may underflow to zero, and it does not matter, since a total of at least 1 swamps them. Notice that the argument would fail if you subtracted the smallest score, or the mean: the largest shifted score would then be positive and could still overflow.
    - text: |
        **The logarithm of a sum of exponentials.** Define, for numbers $x_1, \dots, x_n$,

        $$\operatorname{LSE}(x) = \log \sum_i e^{x_i}.$$

        Computed as written, it overflows as softmax did. Apply the same idea: factor $e^m$ out of the sum, with $m$ the largest of the $x_i$.

        $$\log \sum_i e^{x_i} = \log\!\Big( e^{m} \sum_i e^{x_i - m} \Big) = m + \log \sum_i e^{x_i - m}.$$

        The logarithm of a product is the sum of the logarithms, and $\log e^m = m$. The sum that remains is of exponentials between 0 and 1 and is at least 1, so its logarithm is safe, and is 0 or more. This is the **log-sum-exp trick**:

        ```python
        def logsumexp(x):
            m = x.max()
            return m + np.log(np.exp(x - m).sum())
        ```

        **What it measures.** The sum inside is at least 1, from the largest term, and at most $n$, if all the terms are equal. So

        $$m \;\le\; \operatorname{LSE}(x) \;\le\; m + \log n.$$

        Log-sum-exp is the largest value plus a small correction, between 0 and $\log n$. If one value stands well above the rest, the correction is almost nothing and LSE is almost the maximum. If several are level, it is a little more. It is a **smooth version of the maximum**, and that is where softmax gets its name: it is the "soft" counterpart of picking the largest.

        **Why logarithms at all.** Probabilities multiply. If a model gives each of 2000 words in a passage a probability of about a half, the probability of the passage is $0.5^{2000} \approx 10^{-602}$, which underflows to `0.0`. Every long passage would have probability zero, and nothing could be compared.

        Take the logarithm, and the product becomes a sum: $2000 \times \log 0.5 \approx -1386$. An ordinary number. So in practice probabilities are **stored as their logarithms**, and multiplied by adding. When two probabilities held as logarithms must be **added**, the recipe is: exponentiate, add, take the logarithm. That is log-sum-exp, and it is why the function turns up everywhere.

        **The logarithm of softmax.** Training a classifier means making the probability of the correct class large, and what is actually computed is the logarithm of that probability. From the definition,

        $$\log \frac{e^{s_k}}{\sum_j e^{s_j}} = s_k - \operatorname{LSE}(s).$$

        Compute it **that way**, by subtraction. The other way, softmax first and then `np.log`, fails even with the safe softmax: a class whose score is 800 below the largest gets probability $e^{-800}$, which underflows to 0, and the logarithm of 0 is `-inf`. The true answer is simply $-800$. The exponential and the logarithm should have cancelled on paper before either was computed.

        For a table of scores, with the reductions along axis 1:

        ```python
        def log_softmax(S):
            Z = S - S.max(axis=1, keepdims=True)
            return Z - np.log(np.exp(Z).sum(axis=1, keepdims=True))
        ```

        **The general lesson.** Two expressions that are equal in algebra can behave quite differently in floats. The algebra is about real numbers, which have no largest and no smallest. Floats have both. So the craft is this: **find the form of the formula whose intermediate values are no more extreme than its answer.** Three habits serve.

        1. If an exponential is followed by a logarithm, or a large factor above by the same factor below, cancel them on paper first.
        2. Work with logarithms of probabilities, never with long products.
        3. Before exponentiating, move the largest value to zero.

        A relative of this problem arises at the other end. `np.log(1 + x)` for a tiny `x` gives `0.0`, since `1 + x` rounds to exactly 1, though the true answer is very nearly `x`. NumPy has `np.log1p(x)`, which computes $\log(1 + x)$ without ever forming $1 + x$. That failure is not overflow. It is a loss of digits, and it is the subject of [[e5.numerical-error-analysis-in-practice]].
    - question:
        id: order-lse
        type: order
        system: s2
        prompt: Put in order the steps of computing the logarithm of the sum of the exponentials of an array `x` without overflow.
        steps:
          - 'Find the largest entry, `m`.'
          - 'Subtract `m` from every entry, so that the largest becomes 0 and the rest are negative.'
          - 'Take the exponential of each shifted entry, giving numbers between 0 and 1.'
          - 'Add them up. The total is at least 1.'
          - 'Take the logarithm of the total, which is 0 or more.'
          - 'Add `m` back.'
        explanation: The shift must come before the exponential, since the exponential is the step that overflows. The logarithm applies to the whole sum, so the adding comes before it. And `m` is added back last, outside the logarithm, where it stands for the factor of $e^m$ that was taken out of the sum. Adding it back before the logarithm would be adding it to the sum and not to its logarithm.
  formal:
    - text: |
        **Overflow and underflow.** A `float64` result larger in size than about $1.8 \times 10^{308}$ becomes `inf` or `-inf`. A non-zero result smaller in size than about $5 \times 10^{-324}$ becomes 0. An operation with no determinable value, such as `inf - inf` or `inf / inf`, gives `nan`, and any operation on `nan` gives `nan`.

        **Shift invariance.** For any $c$, the softmax of $(s_1 + c, \dots, s_n + c)$ equals the softmax of $(s_1, \dots, s_n)$.

        **Log-sum-exp.** $\operatorname{LSE}(x) = \log \sum_i e^{x_i}$. With $m = \max_i x_i$,

        $$\operatorname{LSE}(x) = m + \log \sum_i e^{x_i - m}, \qquad m \le \operatorname{LSE}(x) \le m + \log n.$$

        In the second form every exponential lies in $(0, 1]$ and the sum lies in $[1, n]$.

        **Stable softmax.** $\operatorname{softmax}(s)_k = e^{s_k - m} \big/ \sum_j e^{s_j - m}$.

        **Log-softmax.** $\log \operatorname{softmax}(s)_k = s_k - \operatorname{LSE}(s)$.

        **Products as sums.** $\log \prod_i p_i = \sum_i \log p_i$.
  drill:
    - text: |
        Seconds each. Everything is `float64`.
    - question:
        id: drill-overflow
        type: choice
        system: s1
        prompt: |
          What is `np.exp(1000.0)`?
        options: ["`inf`", "`nan`", "`0.0`", "A float of about 10 to the power 434"]
        answer: 0
        explanation: The true value is far above the largest float, so the result overflows to infinity.
    - question:
        id: drill-underflow
        type: choice
        system: s1
        prompt: |
          What is `np.exp(-1000.0)`?
        options: ["`-inf`", "`nan`", "`0.0`", "A small negative number"]
        answer: 2
        explanation: The true value is positive and far smaller than the smallest positive float, so it underflows to zero.
    - question:
        id: drill-inf-inf
        type: choice
        system: s1
        prompt: |
          `a = np.array([np.inf])`. What is `a / a`?
        options: ["`[1.]`", "`[inf]`", "`[nan]`", "`[0.]`"]
        answer: 2
        explanation: Infinity divided by infinity has no determinable value.
    - question:
        id: drill-nan-spreads
        type: choice
        system: s1
        prompt: |
          What is `np.nan + 1.0`?
        options: ["`1.0`", "`nan`", "`inf`", "`0.0`"]
        answer: 1
        explanation: Any arithmetic with a `nan` gives `nan`.
    - question:
        id: drill-log-zero
        type: choice
        system: s1
        prompt: |
          `z = np.array([0.0])`. What is `np.log(z)`?
        options: ["`[0.]`", "`[-inf]`", "`[nan]`", "`[1.]`"]
        answer: 1
        explanation: The logarithm falls without limit as its input approaches zero.
    - question:
        id: drill-shift
        type: choice
        system: s1
        prompt: |
          The softmax of the scores 5 and 5 is one half each. What is the softmax of 1005 and 1005, in mathematics?
        options: ["One half each", "Both 0", "Both 1", "It is not defined"]
        answer: 0
        explanation: Adding the same number to every score changes nothing, since softmax depends only on differences.
    - question:
        id: drill-subtract
        type: numeric
        system: s1
        prompt: |
          A row of scores is 2, 5, 3. What number does the stable softmax subtract from each of them?
        answer: "5"
        explanation: The largest score of the row, so that it becomes 0.
    - question:
        id: drill-largest-term
        type: numeric
        system: s1
        prompt: |
          After the largest score has been subtracted, what is the exponential of the largest shifted score?
        answer: "1"
        explanation: The largest shifted score is 0, and anything to the power 0 is 1.
    - question:
        id: drill-lse-equal
        type: choice
        system: s1
        prompt: |
          What is the log-sum-exp of the two numbers 0 and 0?
        options: ["0", "$\\log 2$, about 0.69", "1", "2"]
        answer: 1
        explanation: Each exponential is 1, their sum is 2, and its logarithm is about 0.69.
    - question:
        id: drill-lse-max
        type: choice
        system: s1
        prompt: |
          About what is the log-sum-exp of the two numbers 1000 and 0?
        options: ["0", "500", "1000", "`inf`"]
        answer: 2
        explanation: When one value stands far above the rest, log-sum-exp is almost exactly that value.
    - question:
        id: drill-log-product
        type: choice
        system: s1
        prompt: |
          Which of these equals $\log(p\,q\,r)$?
        options: ['$\log p \times \log q \times \log r$', '$\log p + \log q + \log r$', '$\log(p + q + r)$', '$3 \log p$']
        answer: 1
        explanation: The logarithm of a product is the sum of the logarithms.
    - question:
        id: drill-log-softmax
        type: choice
        system: s1
        prompt: |
          Which is the safe way to compute the logarithm of the softmax probability of class $k$?
        options: ["`np.log(softmax(s))[k]`", "`s[k] - logsumexp(s)`", "`np.log(s[k])`", "`np.exp(s[k])`"]
        answer: 1
        explanation: The logarithm and the exponential in the top line cancel on paper, leaving the score itself, less the log-sum-exp.
    - question:
        id: drill-isnan
        type: choice
        system: s1
        prompt: |
          Which expression is `True` exactly when the array `x` holds a `nan` somewhere?
        options: ["`(x == np.nan).any()`", "`np.isnan(x).any()`", "`x.sum() == 0`", "`x.any()`"]
        answer: 1
        explanation: A `nan` is not equal to anything, itself included, so it must be detected with `np.isnan`.
    - question:
        id: drill-log1p
        type: choice
        system: s1
        prompt: |
          `x` is a tiny positive number, about $10^{-17}$. Which gives an accurate value of $\log(1 + x)$?
        options: ["`np.log(1 + x)`", "`np.log1p(x)`", "`np.log(x)`", "`np.exp(x)`"]
        answer: 1
        explanation: "`1 + x` rounds to exactly 1, and its logarithm is then 0. `np.log1p` never forms the sum."
    - question:
        id: predict-shift
        type: predict
        system: s1
        prompt: The direct route and the shifted one. What does this show?
        code: |
          import numpy as np

          x = np.array([1000.0, 1000.0])
          print(np.exp(x))
          m = x.max()
          print(np.exp(x - m))
          print(m + np.log(np.exp(x - m).sum()))
        output: |
          [inf inf]
          [1. 1.]
          1000.6931471805599
        explanation: The exponential of 1000 overflows. With the largest value taken out, both entries are 0 and their exponentials are 1. The sum is 2, its logarithm is about 0.693, and adding back the 1000 gives the answer. Two equal values give the maximum plus log 2.
    - question:
        id: predict-product
        type: predict
        system: s1
        prompt: A long product, a sum of logarithms, and a tiny addition. What does this show?
        code: |
          import numpy as np

          p = np.full(2000, 0.5)
          print(np.prod(p))
          print(round(float(np.log(p).sum()), 2))
          print(np.log(1.0 + 1e-17), np.log1p(1e-17))
        output: |
          0.0
          -1386.29
          0.0 1e-17
        explanation: A half multiplied by itself 2000 times is far below the smallest positive float and underflows to zero. The sum of the 2000 logarithms, each about −0.693, is an ordinary number. In the last line, 1 plus so tiny a number rounds to exactly 1, whose logarithm is 0, while `log1p` returns the right value.
  work:
    - text: Slower now. For each formula, ask what its largest and smallest intermediate values are before asking what its answer is.
    - question:
        id: write-logsumexp
        type: code
        mode: write
        system: s2
        prompt: |
          Write `logsumexp(x)` for a plain array `x` with at least one entry. Return $\log \sum_i e^{x_i}$, computed so that it is right however large or small the entries are.

          Use no loop and no comprehension.
        starter: |
          import numpy as np

          def logsumexp(x):
              # Replace the next line with your own.
              return np.log(np.exp(x).sum())

          print(logsumexp(np.array([1000.0, 1000.0])))
        solution: |
          import numpy as np

          def logsumexp(x):
              m = x.max()
              return m + np.log(np.exp(x - m).sum())

          print(logsumexp(np.array([1000.0, 1000.0])))
        tests: |
          import numpy as _np
          def _close(a, b):
              return bool(_np.isfinite(a)) and abs(float(a) - b) < 1e-9
          assert _close(logsumexp(_np.array([1.0, 2.0, 3.0])), 3.4076059644443806), "For 1, 2 and 3 the result is about 3.4076"
          assert _close(logsumexp(_np.array([1000.0, 1001.0, 1002.0])), 1002.4076059644444), "For 1000, 1001 and 1002 the result is about 1002.4076, not inf"
          assert _close(logsumexp(_np.array([-1000.0, -1001.0])), -999.6867383124818), "For -1000 and -1001 the result is about -999.6867, not -inf"
          assert _close(logsumexp(_np.array([0.0, 2000.0])), 2000.0), "For 0 and 2000 the result is 2000"
          assert _close(logsumexp(_np.array([0.0, -2000.0])), 0.0), "For 0 and -2000 the result is 0"
          assert _close(logsumexp(_np.array([7.0])), 7.0), "For a single entry the result is that entry"
          assert _close(logsumexp(_np.array([0.0, 0.0, 0.0, 0.0])), 1.3862943611198906), "For four zeros the result is the logarithm of 4"
          _x = _np.array([5.0, -3.0, 2.0])
          logsumexp(_x)
          assert _x.tolist() == [5.0, -3.0, 2.0], "The array passed in must not be changed"
          assert "for " not in source and "while " not in source, "Use no loop and no comprehension"
          assert abs(float(output.strip()) - 1000.6931471805599) < 1e-9, "The program should print about 1000.6931"
        wrong:
          - |
            import numpy as np

            def logsumexp(x):
                return np.log(np.exp(x).sum())

            print(1000.6931471805599)
          - |
            import numpy as np

            def logsumexp(x):
                m = x.max()
