          import numpy as _np
          _w = [0.09003057317038046, 0.24472847105479764, 0.6652409557748219]
          _P = softmax(_np.array([[1000.0, 1001.0, 1002.0]]))
          assert _P.shape == (1, 3), "The result has the shape of the table of scores"
          assert _np.isfinite(_P).all(), "No entry may be nan or inf"
          assert _np.allclose(_P, [_w]), "For 1000, 1001 and 1002 the probabilities are about 0.09, 0.24 and 0.67"
          assert _np.allclose(softmax(_np.array([[0.0, 1.0, 2.0], [-1000.0, -999.0, -998.0]])), [_w, _w]), "Rows that differ by a shift must give the same probabilities"
          assert _np.allclose(softmax(_np.array([[0.0, 0.0], [-2000.0, -2000.0]])), [[0.5, 0.5], [0.5, 0.5]]), "Each row must be shifted by its own largest score"
          assert _np.allclose(softmax(_np.array([[0.0, 2000.0], [3.0, 3.0]])), [[0.0, 1.0], [0.5, 0.5]]), "For the row 0, 2000 all the probability goes to the second class"
          assert _np.allclose(softmax(_np.array([[0.0, _np.log(3.0)]])), [[0.25, 0.75]]), "For the scores 0 and log 3 the probabilities are a quarter and three quarters"
          _R = softmax(_np.array([[1.0, 2.0, 3.0, 4.0], [10.0, -10.0, 0.0, 5.0], [700.0, 800.0, 900.0, 1000.0]]))
