        solution: |
          import numpy as np

          def softmax(S):
              E = np.exp(S - S.max(axis=1, keepdims=True))
              return E / E.sum(axis=1, keepdims=True)

          print(softmax(np.array([[1000.0, 1001.0, 1002.0]])))
