concept: e1.complexity-and-big-o
minutes: 105
claim: You can count the steps a piece of code takes as a function of the size of its input, describe the growth of that count in big-O notation, recognise constant, logarithmic, linear, quadratic and exponential growth in code, name the hidden cost of common operations on lists, sets and dictionaries, and use all this to predict whether a program will finish and to replace a slow method by a fast one.
recalls: [e1.recursion]
uses: [e1.comprehensions-and-iterators, e1.modules-and-imports, e1.special-methods-and-operator-overloading, e0.loops, e0.functions, e0.lists-and-tuples, e0.dictionaries-and-sets, m0.estimation-and-orders-of-magnitude, m1.inequalities-and-absolute-value, m1.exponent-laws, m1.logarithms, m2.functions-as-machines, m2.the-exponential-and-e, m2.summation-and-product-notation, m2.sequences-and-series]
leads: [e1.testing-with-pytest, e1.generators-and-context-managers]
starter: |
  # Scratch space. Count the comparisons, then double n and count again.
  def count_pairs(n):
      steps = 0
      for i in range(n):
          for j in range(i + 1, n):
              steps += 1
      return steps

  for n in [10, 20, 40, 80]:
      print(n, count_pairs(n))
parts:
  recall:
    - text: |
        In [[e1.recursion]] you began to count. Fast powering made about twenty calls where the plain method made a million, and remembering answers cut the Fibonacci function from millions of calls to dozens. Those were differences in how the work grows, and this lesson gives that idea a notation. Three quick pulls first.
    - question:
        id: recall-halving
        type: numeric
        system: s1
        concepts: [e1.recursion]
        prompt: |
          A recursive function calls itself on half of its input each time. Starting from an input of size 64, how many halvings bring the size down to 1?
        answer: "6"
        explanation: 64 is two to the sixth power, so six halvings reach 1. It is the logarithm to base 2 of 64.
        hints:
          - 64, 32, 16 and so on.
          - To what power must 2 be raised to give 64?
    - question:
        id: recall-base-case
        type: choice
        system: s1
        concepts: [e1.recursion]
        prompt: |
          What are the two parts that every correct recursive function must have?
        options:
          - A loop and a counter.
          - A base case answered directly, and a recursive case that calls the function on something smaller.
          - A try block and an except block.
          - A class and an instance.
        answer: 1
        explanation: The base case stops the descent, and the recursive case must move towards it.
        hints:
          - What stops the calls from going down for ever?
          - What must be true of the input in each recursive call?
    - question:
        id: recall-fib-growth
        type: choice
        system: s1
        concepts: [e1.recursion]
        prompt: |
          Why is the plain recursive Fibonacci function so slow?
        options:
          - Addition is a slow operation.
          - Each call makes two further calls, so the same small questions are answered again and again, and the number of calls grows exponentially.
          - Python limits the depth of recursion to a thousand.
          - It uses too much memory for its dictionary.
        answer: 1
        explanation: The tree of calls roughly doubles in width at each level. Remembering answers removes the repetition.
        hints:
          - How many calls does each call make?
          - How many different questions are there, compared with the number of calls?
  puzzle:
    - text: |
        You have a list of items and need to know whether any item appears twice. It is a real job: before training a model, duplicated examples are removed from the data. Here are two ways to do it.

        ```python
        def has_duplicate_a(xs):
            for i in range(len(xs)):
                for j in range(i + 1, len(xs)):
                    if xs[i] == xs[j]:
                        return True
            return False

        def has_duplicate_b(xs):
            return len(set(xs)) < len(xs)
        ```

        Method A compares every item with every later item. Method B builds a set, which keeps one copy of each value, and checks whether anything was lost. Both are correct. You try them on a list of a thousand items with no duplicates, and both answer before you can blink. So you choose A, since it is the one you understand best, and you start it on the real data: ten million items.

        Method B, on those ten million items, takes about a second. How long does method A take? Not ten seconds, and not ten minutes. On the same computer it takes about **two months**.

        Nothing in the thousand-item trial warned you. And a computer a hundred times faster would not rescue you: A would still take half a day, against a hundredth of a second for B. So here is the puzzle. What is the difference between A and B, such that it is invisible at a thousand items and ruinous at ten million? And how could you have known it in advance, **from the code alone**, without running anything?
  intuition:
    - text: |
        Two things happen when people gather in a room. A register is taken: each name is called once. And everybody shakes hands with everybody else.

        With 10 people, the register takes 10 calls and there are 45 handshakes. Not very different. Now let the room hold 1000 people. The register takes 1000 calls. The handshakes number 499,500. Add one more person: the register grows by one call, and the handshakes grow by a thousand, since the newcomer must greet everyone already present.

        The register and the handshakes are not different in *size* so much as in **kind**. One grows in step with the number of people. The other grows with its square. And for a large enough room, that difference of kind overwhelms everything else. It would not matter if each call of the register took a full minute and each handshake a second: for a big enough crowd the handshakes still take longer.

        Method B is the register. It handles each item once. Method A is the handshakes. It pairs each item with every other.

        So the right question about a program is not "how many seconds does it take?" That depends on the machine, on the language, on what else is running. The right question is: **when the input becomes twice as large, what happens to the work?** For the register it doubles. For the handshakes it becomes four times as large. Asked that way, the answer belongs to the method itself and to nothing else, and you can read it off the code.

        Move the slider and watch five kinds of growth pull apart. At small sizes they are bunched together. That is why a small trial tells you nothing.
    - figure: growth-rates
      props:
        n: 8
  derivation:
    - text: |
        **Counting steps.** To study a program without running it, count the **basic steps** it performs, where a basic step is something that takes a fixed, small amount of time: one addition, one comparison, one assignment, one look-up of `xs[i]`. The count will depend on the input, so write it as a function of the input's **size**, which is called $n$. For a list, $n$ is its length.

        ```python
        def total(xs):
            result = 0
            for x in xs:
                result = result + x
            return result
        ```

        The loop body runs once for each item, $n$ times. Count an addition and an assignment each time, with one assignment before the loop and one return after, and the total is $T(n) = 2n + 2$ steps. A different way of counting might give $3n + 1$. As you will see in a moment, the disagreement does not matter.

        Now method A, in the worst case, where there is no duplicate and nothing stops it early. When `i` is 0 the inner loop runs $n - 1$ times. When `i` is 1 it runs $n - 2$ times, and so on down to 0. The total number of comparisons is

        $$(n - 1) + (n - 2) + \dots + 1 + 0 = \sum_{k=1}^{n-1} k = \frac{(n - 1)\,n}{2} = \tfrac{1}{2}n^2 - \tfrac{1}{2}n,$$

        by the formula for the sum of the first whole numbers from [[m2.summation-and-product-notation]]. It is the handshake count. For $n = 10$ it gives 45, and for $n = 1000$ it gives 499,500.
    - question:
        id: predict-count-pairs
        type: predict
        system: s1
        concepts: [m2.summation-and-product-notation]
        prompt: What does this print?
        code: |
          def count_pairs(n):
              steps = 0
              for i in range(n):
                  for j in range(i + 1, n):
                      steps += 1
              return steps

          print(count_pairs(4), count_pairs(8), count_pairs(16))
        output: "6 28 120"
        explanation: The inner loop runs n - 1 times, then n - 2, down to 0, which adds up to n(n - 1)/2. For 4 that is 6, for 8 it is 28 and for 16 it is 120. Each doubling of n multiplies the count by a little over four.
        hints:
          - For n = 4 the inner loop runs 3 times, then 2, then 1, then 0.
          - The total is half of n times n - 1.
    - text: |
        **What matters when $n$ is large.** Look at the two terms of $\tfrac12 n^2 - \tfrac12 n$ as $n$ grows.

        | $n$ | $\tfrac12 n^2$ | $\tfrac12 n$ | share of the total due to the $n^2$ term |
        | --- | --- | --- | --- |
        | 10 | 50 | 5 | about 110% of it, before the 5 is taken off |
        | 1000 | 500,000 | 500 | 100.1% |
        | 1,000,000 | 500,000,000,000 | 500,000 | 100.0001% |

        The second term is still there, but it has stopped mattering. For large $n$ the count is, to any accuracy you could want, $\tfrac12 n^2$. **The term that grows fastest swallows the others.**

        Now the factor $\tfrac12$. Ask the doubling question. Replace $n$ by $2n$ in $\tfrac12 n^2$ and you get $\tfrac12 (2n)^2 = 4 \times \tfrac12 n^2$. The work is multiplied by four, and the $\tfrac12$ played no part in that: it appears on both sides and cancels. The same would be true of any constant in front. A constant factor says how long one step takes, which is a fact about the computer. The power of $n$ says how the work grows, which is a fact about the method.

        So two simplifications lose nothing that matters at scale:

        1. keep only the fastest-growing term;
        2. drop its constant factor.

        Apply them to $\tfrac12 n^2 - \tfrac12 n$ and what is left is $n^2$. Apply them to $2n + 2$ and what is left is $n$. That residue is called the **order of growth**, and it is written with a capital O: method A takes $O(n^2)$ steps, read "order $n$ squared", and `total` takes $O(n)$. This is **big-O notation**.

        This also settles the earlier worry. Whether you counted $2n + 2$ steps or $3n + 1$, the order is $O(n)$ either way. Big-O is designed to be blind to exactly the things that two careful people might count differently.
    - text: |
        **The precise meaning.** "Is $O(n^2)$" has an exact definition, and it is worth seeing once. To say that $f(n)$ is $O(g(n))$ means:

        > there are a positive constant $c$ and a starting size $n_0$ such that $f(n) \le c \cdot g(n)$ for every $n \ge n_0$.

        In words: from some point onwards, $f$ stays below a fixed multiple of $g$. The constant $c$ is what licenses dropping constant factors, and the starting size $n_0$ is what licenses ignoring small inputs.

        Check it for $f(n) = 2n + 2$ and $g(n) = n$. Try $c = 3$. Is $2n + 2 \le 3n$? Subtracting $2n$ from both sides, as in [[m1.inequalities-and-absolute-value]], that says $2 \le n$. So the inequality holds for every $n \ge 2$. With $c = 3$ and $n_0 = 2$ the definition is satisfied, and $2n + 2$ is $O(n)$.

        Is $n^2$ also $O(n)$? That would need $n^2 \le c \cdot n$, which is $n \le c$, for all large $n$. No constant $c$ is at least as large as every $n$. So $n^2$ is **not** $O(n)$: however generous the multiple, the square eventually escapes it.

        One caution. Big-O gives an upper bound, so strictly $2n + 2$ is also $O(n^2)$, in the way that a person who is under two metres tall is also under three. That is true and useless. By custom you always state the smallest order you can justify.
    - question:
        id: choice-simplify
        type: choice
        system: s1
        prompt: |
          A function performs $5n^2 + 300n + 7000$ steps on an input of size $n$. What is its order of growth?
        options:
          - "$O(7000)$"
          - "$O(n)$"
          - "$O(n^2)$"
          - "$O(5n^2 + 300n)$"
        answer: 2
        explanation: Keep the fastest-growing term and drop its constant. For small n the 7000 is the largest of the three, but once n passes about 60 the square term has overtaken the others, and it never looks back.
        hints:
          - Which of the three terms grows fastest as n increases?
          - Constant factors are dropped.
    - text: |
        **The ladder of orders.** A handful of orders account for nearly every program you will meet. Here they are from slowest-growing to fastest, with the time each would take on an input of a million items, on a machine doing ten million basic steps a second, which is about what Python manages.

        | Order | Name | Doubling $n$ | Steps for $n = 10^6$ | Time |
        | --- | --- | --- | --- | --- |
        | $O(1)$ | constant | no change | 1 | instant |
        | $O(\log n)$ | logarithmic | adds one step | 20 | instant |
        | $O(n)$ | linear | doubles | $10^6$ | a tenth of a second |
        | $O(n \log n)$ | linearithmic | a little more than doubles | $2 \times 10^7$ | two seconds |
        | $O(n^2)$ | quadratic | four times | $10^{12}$ | 28 hours |
        | $O(n^3)$ | cubic | eight times | $10^{18}$ | 3000 years |
        | $O(2^n)$ | exponential | squares | $2^{1\,000\,000}$ | never |

        Read down the last column. Between one row and the next, a program goes from something you wait for to something you cannot have. And you can now do the sum of the puzzle. For $n = 10^7$, method A makes about $\tfrac12 \times 10^{14}$ comparisons. At $10^7$ a second that is $5 \times 10^6$ seconds, which is 58 days. Method B takes $10^7$ steps, one second.

        The logarithm in the second row is the one you earned in the last lesson. Any method that halves its problem at each step takes $\log_2 n$ steps, and $\log_2$ of a million is only 20. The base of the logarithm is not written in big-O, because changing the base multiplies by a constant, by the change-of-base rule of [[m1.logarithms]], and constants are dropped.

        The exponential in the last row is the tree of calls of the plain Fibonacci function. At $n = 60$, $2^n$ steps would already take 3600 years.
    - question:
        id: numeric-scale-up
        type: numeric
        system: s2
        prompt: |
          A quadratic method takes 3 seconds on an input of 10,000 items. About how many seconds will it take on 40,000 items?
        answer: "48"
        unit: seconds
        explanation: The input is 4 times as large, and quadratic work grows with the square, so it is 16 times as much. 3 × 16 = 48.
        hints:
          - By what factor has the size of the input grown?
          - For a quadratic method, the work is multiplied by the square of that factor.
    - text: |
        **Reading the order off the code.** You rarely need to count exactly. A few patterns give the order at sight.

        **A loop over the input** is $O(n)$, if its body takes constant time.

        **A loop inside a loop**, each over the input, is $O(n^2)$: the costs **multiply**. Three deep is $O(n^3)$.

        **One block after another**: the costs **add**, and the larger wins. A linear pass followed by a quadratic one is $O(n + n^2)$, which is $O(n^2)$.

        **A loop that halves** what remains is $O(\log n)$:

        ```python
        steps = 0
        while n > 1:
            n = n // 2
            steps += 1
        ```

        **A halving inside a loop**, or a loop inside a halving recursion, is $O(n \log n)$. This is the order of every good method of sorting, including Python's own `sorted`.

        **A recursion that makes two calls on inputs only slightly smaller** is exponential.

        And one warning before the patterns are trusted. All of this assumes that the lines inside the loops are basic steps. Many innocent-looking lines are not.
    - question:
        id: predict-halving-loop
        type: predict
        system: s1
        concepts: [m1.logarithms]
        prompt: What does this print?
        code: |
          def halvings(n):
              steps = 0
              while n > 1:
                  n = n // 2
                  steps += 1
              return steps

          print(halvings(8), halvings(1024), halvings(1000000))
        output: "3 10 19"
        explanation: The count is the number of times n can be halved before it reaches 1, which is the logarithm to base 2, rounded down. Two to the tenth is 1024, and a million lies between two to the nineteenth and two to the twentieth.
        hints:
          - For 8, follow n by hand. 8, 4, 2, 1.
          - Two to the tenth is 1024. Two to the twentieth is a little over a million.
    - text: |
        **Hidden loops.** A single line of Python may hide a whole loop. Consider `x in xs`. If `xs` is a list, Python has no way to find `x` except to look at the items one after another until it finds it or runs out. That is $O(n)$. Put it inside a loop over $n$ items and you have written a quadratic program with only one visible `for`:

        ```python
        def has_duplicate_c(xs):
            seen = []
            for x in xs:
                if x in seen:          # a hidden loop over seen
                    return True
                seen.append(x)
            return False
        ```

        Now make one change. Let `seen` be a **set**.

        ```python
        def has_duplicate_d(xs):
            seen = set()
            for x in xs:
                if x in seen:          # one step
                    return True
                seen.add(x)
            return False
        ```

        For a set or a dictionary, `x in seen` takes $O(1)$ time: a fixed number of steps, however many items the set holds. How can that be? A list is like a street where the houses are in no particular order, so to find a family you must knock on each door. A set is like a street where each family's house number is **computed from its name**. To find a family you compute the number from the name and go straight to that door. The computed number is called a **hash**, and it is why you were told, in the lesson on special methods, that membership of a set depends on a number computed from each object.

        So the second function is $O(n)$, the first is $O(n^2)$, and they differ by one pair of brackets. The difference between methods A and B of the puzzle is the same one. You must know the cost of the operations you use.

        | Operation | List | Set or dictionary |
        | --- | --- | --- |
        | `len(c)` | $O(1)$ | $O(1)$ |
        | look up by position `xs[i]`, or by key `d[k]` | $O(1)$ | $O(1)$ |
        | `x in c` | $O(n)$ | $O(1)$ |
        | add at the end: `xs.append(x)`, `s.add(x)`, `d[k] = v` | $O(1)$ | $O(1)$ |
        | insert or remove at the front: `xs.insert(0, x)`, `xs.pop(0)` | $O(n)$ | |
        | a slice `xs[a:b]`, a copy, `xs + ys` | $O(n)$ | |
        | `min`, `max`, `sum`, `xs.count(x)`, `xs.index(x)` | $O(n)$ | $O(n)$ for the first three |
        | `sorted(c)` | $O(n \log n)$ | $O(n \log n)$ |

        Two rows deserve a second look. Inserting at the front of a list is $O(n)$ because every other item must be moved along by one place. And a slice makes a **copy**, which is $O(n)$. That is why the recursive `total(xs[1:])` of the last lesson, pretty as it was, is quadratic: it copies nearly the whole list at every level.
    - question:
        id: choice-hidden-loop
        type: choice
        system: s2
        prompt: |
          `a` and `b` are lists of $n$ items each. What is the order of growth of this function?

          ```python
          def common(a, b):
              return [x for x in a if x in b]
          ```
        options:
          - "$O(1)$"
          - "$O(n)$, because there is one for."
          - "$O(n^2)$, because `x in b` scans the list b for each of the n items of a."
          - "$O(2^n)$"
        answer: 2
        explanation: The comprehension loops over a, n times. Each test of membership in the list b is itself a scan of up to n items. The costs multiply. Turning b into a set first, once, would make each test a single step and the whole function linear.
        hints:
          - How much work is one test of membership in a list?
          - How many times is that test carried out?
    - text: |
        **Time is not the only cost.** A program also uses memory, and the same notation describes it. In [[e1.comprehensions-and-iterators]] you summed a series two ways. A list comprehension inside `sum` builds all $n$ terms first: $O(n)$ memory. A generator expression produces one term at a time: $O(1)$ memory. Both take $O(n)$ time. Often time and memory can be traded for each other. Memoisation spends $O(n)$ memory on a dictionary to bring the Fibonacci function down from exponential time to linear.

        **Best case and worst case.** The count can depend on which input of size $n$ is given. Searching a list for a value takes one step if it is the first item and $n$ if it is absent. Unless something else is said, big-O describes the **worst case**, because that is the promise you can rely on.

        **Checking by experiment.** You can confirm an order by timing. The module `time` has a clock for the purpose:

        ```python
        import time

        start = time.perf_counter()
        has_duplicate_a(list(range(2000)))
        print(time.perf_counter() - start)
        ```

        One timing tells you little. Two tell you a great deal: time the function at $n$ and at $2n$ and take the ratio. A ratio near 2 says linear, near 4 says quadratic, near 8 says cubic. This is the doubling question, put to the machine.

        **When to care.** If $n$ is ten, none of this matters and the clearest code is the best code. Do not contort a program to save steps that nobody will ever wait for. But machine learning lives at large $n$: millions of examples, thousands of millions of words. There the order is everything. One example will follow you through this whole course. The central operation of the models you will build compares every word of its input with every other word, the handshakes again, so its cost is quadratic in the length of the input. That one fact is why such models have a limit on how much text they can read at once, and a good share of current research is an attempt to get round it.
    - question:
        id: order-ladder
        type: order
        system: s1
        prompt: Put these orders of growth in order, from the one that grows most slowly to the one that grows fastest.
        steps:
          - "$O(1)$"
          - "$O(\\log n)$"
          - "$O(n)$"
          - "$O(n \\log n)$"
          - "$O(n^2)$"
          - "$O(2^n)$"
        explanation: Constant, logarithmic, linear, linearithmic, quadratic, exponential. Each eventually outgrows every one before it, whatever the constant factors.
        hints:
          - Think about what doubling n does to each.
          - A logarithm grows more slowly than n itself, and an exponential faster than any power.
  formal:
    - text: |
        Let $f$ and $g$ be functions from the positive whole numbers to the non-negative real numbers.

        **Definition.** $f(n)$ is $O(g(n))$ if there exist a constant $c > 0$ and a whole number $n_0$ such that

        $$f(n) \le c \cdot g(n) \quad \text{for all } n \ge n_0.$$

        **Rules that follow from the definition.**

        - Constant factors do not matter: if $f$ is $O(g)$ then $k \cdot f$ is $O(g)$ for any constant $k > 0$.
        - In a sum, the fastest-growing term decides: $n^2 + n$ is $O(n^2)$.
        - Costs of consecutive parts add; costs of nested parts multiply.
        - $\log_a n$ and $\log_b n$ differ by a constant factor, so the base of a logarithm is omitted.

        **The hierarchy.** For large $n$,

        $$1 \;<\; \log n \;<\; n \;<\; n \log n \;<\; n^2 \;<\; n^3 \;<\; 2^n,$$

        and each function in the chain is $O$ of every function to its right, and of none to its left.

        **Time complexity** of a program is the order of growth of the number of basic steps it performs, as a function of the size $n$ of its input, in the worst case unless stated otherwise. **Space complexity** is the same for the memory it uses.

        **Costs of built-in operations.** Indexing a list, `len`, `append`, and membership, insertion and look-up in a set or dictionary are $O(1)$. Membership in a list, `min`, `max`, `sum`, `count`, `index`, slicing, copying, and insertion or removal at the front of a list are $O(n)$. Sorting is $O(n \log n)$.

        | Shape of the code | Order |
        | --- | --- |
        | a fixed number of basic steps | $O(1)$ |
        | a loop that halves the remaining input | $O(\log n)$ |
        | one loop over the input | $O(n)$ |
        | a sort, or a halving recursion that does linear work at each level | $O(n \log n)$ |
        | two nested loops over the input | $O(n^2)$ |
        | a recursion making two calls on inputs of size $n - 1$ | $O(2^n)$ |
