        id: write-most-common
        type: code
        mode: write
        system: s2
        prompt: |
          Write `most_common(xs)` that returns the value that occurs most often in a non-empty list. If several values tie, return the one among them that appears **first** in the list. It must run in $O(n)$ time.

          `most_common(["b", "a", "b", "a", "c"])` is `"b"`.

          Note that `xs.count(x)` reads the whole list, so calling it for each item is quadratic.
        starter: |
          def most_common(xs):
              # Replace the next line with your own.
              return xs[0]

          print(most_common(["b", "a", "b", "a", "c"]), most_common([3, 1, 1, 3, 1]))
        solution: |
          def most_common(xs):
              counts = {}
              for x in xs:
                  counts[x] = counts.get(x, 0) + 1
              best = None
              for x in xs:
                  if best is None or counts[x] > counts[best]:
                      best = x
              return best

          print(most_common(["b", "a", "b", "a", "c"]), most_common([3, 1, 1, 3, 1]))
        tests: |
          class _Spy(list):
              cost = 0
              def __iter__(self):
                  for _item in list.__iter__(self):
                      _Spy.cost += 1
                      yield _item
              def __getitem__(self, _k):
                  _got = list.__getitem__(self, _k)
                  _Spy.cost += len(_got) if isinstance(_k, slice) else 1
                  return _got
              def __contains__(self, _x):
                  _Spy.cost += len(self)
                  return list.__contains__(self, _x)
              def count(self, _x):
                  _Spy.cost += len(self)
                  return list.count(self, _x)
              def index(self, _x):
                  _Spy.cost += len(self)
                  return list.index(self, _x)
          assert most_common(["b", "a", "b", "a", "c"]) == "b", "a and b both occur twice, and b appears first"
          assert most_common([3, 1, 1, 3, 1]) == 1, "1 occurs three times"
          assert most_common([7]) == 7, "With one item, that item is the most common"
          assert most_common([4, 5, 6]) == 4, "When every value occurs once, the first is returned"
          assert most_common([2, 9, 9, 2, 9, 2, 2]) == 2, "2 occurs four times and 9 three"
          assert most_common(["x", "y", "y"]) == "y", "The most common value need not come first"
          _big = _Spy([_k % 37 for _k in range(500)] + [5])
          _Spy.cost = 0
          assert most_common(_big) == 5, "In the large list, 5 occurs once more than anything else"
          assert _Spy.cost <= 2600, f"On 501 items your function read {_Spy.cost} items, counting each one scanned. A linear method reads about 1000. Calling count for every item scans the whole list every time."
        wrong:
          - "def most_common(xs):\n    best = xs[0]\n    for x in xs:\n        if xs.count(x) > xs.count(best):\n            best = x\n    return best\n"
          - "def most_common(xs):\n    counts = {}\n    for x in xs:\n        counts[x] = counts.get(x, 0) + 1\n    best = None\n    for x in xs:\n        if best is None or counts[x] >= counts[best]:\n            best = x\n    return best\n"
          - "def most_common(xs):\n    counts = {}\n    for x in xs:\n        counts[x] = 1\n    best = None\n    for x in xs:\n        if best is None or counts[x] > counts[best]:\n            best = x\n    return best\n"
        explanation: |
          Two passes, one after the other, so the costs add: $O(n) + O(n)$ is $O(n)$. The first pass counts every value in a dictionary, where each update is a single step. The second walks the list in order and keeps the first value whose count beats the best so far. Because it uses a strict `>`, a later value with an equal count does not displace an earlier one, which is how the tie is settled in favour of the first. The first wrong answer in the tests is the natural one-liner with `count`, and it hides a full scan of the list inside the loop.
        hints:
          - First build a dictionary from each value to how often it occurs.
          - Then walk the list again, keeping the best value found so far.
          - Which comparison keeps the earlier value when two counts are equal?
    - question:
        id: write-merge
        type: code
        mode: write
        system: s2
        prompt: |
          `a` and `b` are lists that are each already sorted, smallest first. Write `merge(a, b)` that returns one sorted list holding all the items of both, in $O(n)$ time, where $n$ is the total number of items.

          The idea: keep a finger on the first unused item of each list. Repeatedly take the smaller of the two items under your fingers, and move that finger along. When one list is used up, the rest of the other follows as it is.

          Do not call `sorted` or `sort`. Sorting takes $O(n \log n)$ and makes no use of the fact that the lists are already in order.
        starter: |
          def merge(a, b):
              # Replace the next line with your own.
              return a + b

          print(merge([1, 4, 9], [2, 3, 10, 11]))
        solution: |
          def merge(a, b):
              merged = []
              i = 0
              j = 0
              while i < len(a) and j < len(b):
                  if a[i] <= b[j]:
                      merged.append(a[i])
                      i += 1
                  else:
                      merged.append(b[j])
                      j += 1
              return merged + a[i:] + b[j:]

          print(merge([1, 4, 9], [2, 3, 10, 11]))
        tests: |
          assert "sort" not in source, "Do not call sorted or sort. Use the two fingers."
          assert merge([1, 4, 9], [2, 3, 10, 11]) == [1, 2, 3, 4, 9, 10, 11], "All seven items, in order"
          assert merge([], []) == [], "Two empty lists give an empty list"
          assert merge([], [1, 2]) == [1, 2], "When a is empty the result is b"
          assert merge([1, 2], []) == [1, 2], "When b is empty the result is a"
          assert merge([1, 1, 2], [1, 3]) == [1, 1, 1, 2, 3], "Repeats must all be kept"
          assert merge([5, 6], [1, 2]) == [1, 2, 5, 6], "All of b may come before all of a"
          assert merge([1, 2], [5, 6]) == [1, 2, 5, 6], "All of a may come before all of b"
          import random as _r
          _r.seed(4)
          for _trial in range(20):
              _a = sorted(_r.randint(0, 50) for _k in range(_r.randint(0, 12)))
              _b = sorted(_r.randint(0, 50) for _k in range(_r.randint(0, 12)))
              _a0, _b0 = list(_a), list(_b)
              assert merge(_a, _b) == sorted(_a + _b), f"merge({_a0}, {_b0}) is not in order, or has lost or gained items"
              assert _a == _a0 and _b == _b0, "The two lists must not be changed"
        wrong:
          - "def merge(a, b):\n    merged = []\n    i = 0\n    j = 0\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            merged.append(a[i])\n            i += 1\n        else:\n            merged.append(b[j])\n            j += 1\n    return merged\n"
          - "def merge(a, b):\n    merged = []\n    i = 0\n    j = 0\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            merged.append(a[i])\n            i += 1\n        else:\n            merged.append(b[j])\n            j += 1\n    return merged + b[j:] + a[i:] if i < len(a) and j < len(b) else merged + a[:i] + b[:j]\n"
          - "def merge(a, b):\n    merged = []\n    for x, y in zip(a, b):\n        merged.append(min(x, y))\n        merged.append(max(x, y))\n    return merged\n"
        explanation: |
          Each pass of the loop takes one item and moves one finger, and a finger never moves back, so the loop runs at most $n$ times: $O(n)$. When the loop ends, one list is used up and whatever is left of the other is already sorted and is larger than everything taken so far, so it is joined on as it stands. At that point one of the two slices is empty. Forgetting the leftovers, as the first wrong answer does, loses items. This function is the heart of **merge sort**: split a list in half, sort each half by the same method, and merge. The halving gives $\log_2 n$ levels, the merging does $O(n)$ work at each, and that is where the $O(n \log n)$ of sorting comes from.
        hints:
          - Keep two positions, one in each list, both starting at 0.
          - While both lists have items left, take the smaller of the two current items and advance that position.
          - When the loop stops, one list still has items. They are already in order.
