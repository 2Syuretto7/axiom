        prompt: |
          `binary_search(xs, target)` looks for `target` in a **sorted** list and returns its position, or `-1` if it is absent. It works by keeping two positions, `low` and `high`, with the target somewhere between them if it is there at all, and halving the gap. It fails to find some values that are present: `binary_search([2, 5, 8], 8)` returns `-1`. Fix it. It must remain logarithmic.
        starter: |
          def binary_search(xs, target):
              low = 0
              high = len(xs) - 1
              while low < high:
                  mid = (low + high) // 2
                  if xs[mid] == target:
                      return mid
                  if xs[mid] < target:
                      low = mid + 1
                  else:
                      high = mid - 1
              return -1

          print(binary_search([2, 5, 8], 8), binary_search([2, 5, 8], 5), binary_search([2, 5, 8], 6))
        solution: |
          def binary_search(xs, target):
              low = 0
              high = len(xs) - 1
              while low <= high:
                  mid = (low + high) // 2
                  if xs[mid] == target:
                      return mid
                  if xs[mid] < target:
                      low = mid + 1
                  else:
                      high = mid - 1
              return -1

          print(binary_search([2, 5, 8], 8), binary_search([2, 5, 8], 5), binary_search([2, 5, 8], 6))
        tests: |
          class _Spy(list):
              cost = 0
              def __iter__(self):
                  for _item in list.__iter__(self):
                      _Spy.cost += 1
                      yield _item
              def __getitem__(self, _k):
                  _got = list.__getitem__(self, _k)
                  _Spy.cost += len(_got) if isinstance(_k, slice) else 1
                  return _got
              def __contains__(self, _x):
                  _Spy.cost += len(self)
                  return list.__contains__(self, _x)
              def index(self, _x):
                  _Spy.cost += len(self)
                  return list.index(self, _x)
          assert binary_search([2, 5, 8], 8) == 2, "8 is at position 2"
          assert binary_search([2, 5, 8], 2) == 0, "2 is at position 0"
          assert binary_search([2, 5, 8], 5) == 1, "5 is at position 1"
          assert binary_search([2, 5, 8], 6) == -1, "6 is absent"
          assert binary_search([], 1) == -1, "Nothing is in an empty list"
          assert binary_search([7], 7) == 0, "A list of one item, which is the target"
          assert binary_search([7], 3) == -1, "A list of one item, which is not the target"
          _xs = list(range(0, 200, 2))
          assert all(binary_search(_xs, _v) == _v // 2 for _v in _xs), "Every value present in a list of 100 items should be found at its position"
          assert all(binary_search(_xs, _v) == -1 for _v in range(-1, 201, 2)), "Every value absent from the list should give -1"
          _big = _Spy(range(1024))
          _Spy.cost = 0
          assert binary_search(_big, 1023) == 1023, "The last of 1024 items should be found"
          assert _Spy.cost <= 40, f"On 1024 items your function read {_Spy.cost} items. Binary search needs about 11 looks."
        wrong:
          - "def binary_search(xs, target):\n    for i in range(len(xs)):\n        if xs[i] == target:\n            return i\n    return -1\n"
          - "def binary_search(xs, target):\n    low = 0\n    high = len(xs) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if xs[mid] == target:\n            return mid\n        if xs[mid] > target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n"
          - "def binary_search(xs, target):\n    if target in xs:\n        return xs.index(target)\n    return -1\n"
        explanation: |
          `low` and `high` are both positions that might still hold the target. When they are equal there is exactly one candidate left, and it has not been looked at. The condition `low < high` stopped the loop at that moment and gave up. With `low <= high` the last candidate is examined, and the loop ends only when `low` has passed `high`, which means that no candidates remain. Each pass removes at least half of the candidates, so there are about $\log_2 n$ passes. A plain scan would also give the right answers, which is why the last test counts the looks.
