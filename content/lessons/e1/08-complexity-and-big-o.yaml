              wanted = set(b)
              return [x for x in a if x in wanted]

          print(common([5, 3, 8, 3, 1], [3, 5, 9]))
        tests: |
          class _Spy(list):
              cost = 0
              def __iter__(self):
                  for _item in list.__iter__(self):
                      _Spy.cost += 1
                      yield _item
              def __getitem__(self, _k):
