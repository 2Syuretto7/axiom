          assert common([1, 2, 3], [3, 2, 1]) == [1, 2, 3], "The order of the result is the order of a"
          _a = _Spy(range(0, 600, 2))
          _b = _Spy(range(0, 600, 3))
          _Spy.cost = 0
          _got = common(_a, _b)
          assert _got == list(range(0, 600, 6)), "The multiples of 2 that are also multiples of 3 are the multiples of 6"
          assert _Spy.cost <= 2000, f"On lists of 300 and 200 items your function read {_Spy.cost} items, counting each one scanned. A linear method reads about 500. Each test of membership in a list scans the list."
        wrong:
          - "def common(a, b):\n    wanted = set(b)\n    return [x for x in wanted if x in a]\n"
          - "def common(a, b):\n    return [x for x in a if x in set(a)]\n"
          - "def common(a, b):\n    return sorted(set(a) & set(b))\n"
        explanation: |
          `x in b` on a list scans the list, so the comprehension did $n$ scans of $n$ items. Building a set from `b` costs one pass, $O(n)$, and after that each membership test is a single step, so the whole function is $O(n + n)$, which is $O(n)$. The set must be built **once, before** the comprehension. Writing `x in set(b)` inside it would rebuild the set for every item of `a` and be quadratic again. The intersection of two sets, `set(a) & set(b)`, is also linear, but it loses the order and the repeats, which the function is required to keep.
