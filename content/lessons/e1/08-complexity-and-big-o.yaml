    - question:
        id: write-has-duplicate
        type: code
        mode: write
        system: s2
        prompt: |
          Write `has_duplicate(xs)` that returns `True` if some value appears more than once in the list `xs`, and `False` otherwise. It must run in $O(n)$ time, and it must stop as soon as the first repeat is found.

          The tests give your function a list that counts how much of it is read. Comparing every pair, or testing membership in a list, will exceed the allowance.
        starter: |
          def has_duplicate(xs):
              # Replace the next line with your own.
              return False

          print(has_duplicate([3, 1, 4, 1, 5]), has_duplicate([2, 7, 1, 8]))
        solution: |
          def has_duplicate(xs):
              seen = set()
              for x in xs:
                  if x in seen:
                      return True
                  seen.add(x)
              return False

          print(has_duplicate([3, 1, 4, 1, 5]), has_duplicate([2, 7, 1, 8]))
        tests: |
          class _Spy(list):
              cost = 0
              def __iter__(self):
                  for _item in list.__iter__(self):
                      _Spy.cost += 1
                      yield _item
              def __getitem__(self, _k):
                  _got = list.__getitem__(self, _k)
                  _Spy.cost += len(_got) if isinstance(_k, slice) else 1
                  return _got
              def __contains__(self, _x):
                  _Spy.cost += len(self)
                  return list.__contains__(self, _x)
              def count(self, _x):
                  _Spy.cost += len(self)
                  return list.count(self, _x)
              def index(self, _x):
                  _Spy.cost += len(self)
                  return list.index(self, _x)
          assert has_duplicate([3, 1, 4, 1, 5]) is True, "1 appears twice"
          assert has_duplicate([2, 7, 1, 8]) is False, "No value is repeated"
          assert has_duplicate([]) is False, "An empty list has no repeats"
          assert has_duplicate([5]) is False, "One item cannot be a repeat"
          assert has_duplicate([5, 5]) is True, "Two equal items"
          assert has_duplicate(["a", "b", "a"]) is True, "It should work for strings"
          _big = _Spy(range(400))
          _Spy.cost = 0
          assert has_duplicate(_big) is False, "400 different numbers have no repeat"
          assert _Spy.cost <= 2000, f"On 400 items your function read the list {_Spy.cost} times, counting each item scanned. A linear method needs about 400. Look for a loop inside a loop, or a membership test on a list."
          _early = _Spy([9, 9] + list(range(1000)))
          _Spy.cost = 0
          assert has_duplicate(_early) is True, "The first two items are equal"
          assert _Spy.cost <= 10, "The repeat is in the first two items, so the function should stop almost at once"
        wrong:
          - "def has_duplicate(xs):\n    for i in range(len(xs)):\n        for j in range(i + 1, len(xs)):\n            if xs[i] == xs[j]:\n                return True\n    return False\n"
          - "def has_duplicate(xs):\n    seen = []\n    for x in xs:\n        if xs.count(x) > 1:\n            return True\n    return False\n"
          - "def has_duplicate(xs):\n    return len(set(xs)) < len(xs)\n"
          - "def has_duplicate(xs):\n    seen = set()\n    for x in xs:\n        seen.add(x)\n        if x in seen:\n            return True\n    return False\n"
        explanation: |
          One loop, and inside it two operations on a set, each of which takes constant time: a test of membership and an addition. That is $O(n)$ in time, and also $O(n)$ in memory, for the set. The loop returns at the first repeat, so on data where a repeat comes early it does almost no work. `len(set(xs)) < len(xs)` is also linear and is the neatest answer when you do not need to stop early, but it always reads the whole list, which is why the last test rejects it. Note the order of the two lines inside the loop. Test first, then add. The other way round, every item finds itself.
        hints:
          - Keep a collection of the values met so far. Which type makes the membership test a single step?
          - For each item, first ask whether it has been seen, then record it.
          - Return True from inside the loop as soon as a repeat is found.
