  connections:
    - text: |
        The puzzle was two correct methods that could not be told apart on a thousand items and differed by two months on ten million. The difference was the kind of growth. One method touched each item once and the other paired each item with every other. To see this from the code, you count basic steps as a function of the input size $n$, keep the fastest-growing term, drop its constant, and call what is left the order: $O(n)$ for one, $O(n^2)$ for the other. And you ask the doubling question: twice the input, how much more work?

        You have a ladder to place any program on, from $O(1)$ up to $O(2^n)$, and you know that some single lines hide loops. A membership test in a list is linear. In a set it is constant.

        Two threads continue.

        Several times in this lesson you replaced a slow method by a fast one: a set for a list, a merge for a sort, a halving search for a scan. Each time there was a risk. The fast version is cleverer, and cleverness is where mistakes live. The binary search was wrong by a single character. How do you make sure that an improved function still gives the right answers? The hidden tests did it by comparing it with the slow, obviously correct method on many inputs. That habit, written down as code that can be run again after every change, is [[e1.testing-with-pytest]], next.

        You also saw that memory has an order of growth, and that producing values one at a time can bring it from $O(n)$ down to $O(1)$. A function that produces its results lazily is the last tool of this cluster, in [[e1.generators-and-context-managers]].
