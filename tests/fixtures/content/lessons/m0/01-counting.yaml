  formal:
    - text: The count of a collection is the last number said when its members are matched with $1, 2, 3, \dots$ in order.
  drill:
    - question:
        id: larger
        type: choice
        system: s1
        prompt: Which count is largest?
        options: ["7", "11", "9"]
        answer: 1
        explanation: Eleven comes after both seven and nine.
        hints:
          - Say the numbers in order.
          - The one you reach last is the largest.
  work:
    - question:
        id: order-count
        type: order
        system: s2
        prompt: Put the steps of counting a pile of stones in order.
        steps:
          - Touch a stone that has not been touched and say the next number.
          - Repeat until no stone is untouched.
          - The last number said is the count.
        explanation: Counting is one-to-one matching carried out in order.
        hints:
          - What must happen before anything can be repeated?
          - The count is only known at the end.
  connections:
    - text: Counting is the ground everything else stands on, beginning with [[m0.adding]].
