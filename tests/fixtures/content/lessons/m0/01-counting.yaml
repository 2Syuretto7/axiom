concept: m0.counting
minutes: 10
claim: You can count a small collection and say which of two counts is larger.
recalls: []
uses: []
leads: [m0.adding]
parts:
  recall:
    - text: This is the first lesson, so there is nothing to recall yet.
  puzzle:
    - text: A shepherd has no words for numbers. How can she tell whether every sheep came home?
  intuition:
    - text: She drops one pebble in a bag for each sheep. Matching **one to one** is counting. Next comes [[m0.adding]].
  derivation:
    - text: "If the pebbles and the sheep pair off exactly, the two collections have the same count: $n = n$."
    - question:
        id: pebbles
        type: numeric
        system: s2
        prompt: Twelve sheep leave and one pebble is dropped for each. Three pebbles are left over at night. How many sheep came home?
        answer: "9"
        unit: sheep
        explanation: Each sheep that returns removes one pebble. $12 - 3 = 9$.
        hints:
          - Each returning sheep removes exactly one pebble.
          - The pebbles left over stand for the sheep still missing.
  formal:
    - text: The count of a collection is the last number said when its members are matched with $1, 2, 3, \dots$ in order.
  drill:
    - question:
        id: larger
        type: choice
        system: s1
        prompt: Which count is largest?
        options: ["7", "11", "9"]
        answer: 1
        explanation: Eleven comes after both seven and nine.
        hints:
          - Say the numbers in order.
          - The one you reach last is the largest.
  work:
    - question:
        id: order-count
        type: order
        system: s2
        prompt: Put the steps of counting a pile of stones in order.
        steps:
          - Touch a stone that has not been touched and say the next number.
          - Repeat until no stone is untouched.
          - The last number said is the count.
        explanation: Counting is one-to-one matching carried out in order.
        hints:
          - What must happen before anything can be repeated?
          - The count is only known at the end.
  connections:
    - text: Counting is the ground everything else stands on.
